<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>ข้อสอบซ้อม Developer Competency 600 ข้อ</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6fb; --paper: #fff; --ink: #172033; --muted: #5b6579; --line: #d8deea; --soft: #eef1f8;
  --accent: #4338ca; --accent-ink: #fff; --accent-soft: #e8e7fb;
  --ok: #15803d; --ok-soft: #e3f4e8; --bad: #b42318; --bad-soft: #fbe7e5; --warn: #9a5b00;
  --radius: 14px;
  font-family: "IBM Plex Sans Thai", "Thonburi", "Tahoma", system-ui, sans-serif;
  line-height: 1.65; color: var(--ink); background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420; --paper: #171e2d; --ink: #e6e9f2; --muted: #9aa4b8; --line: #2b3448; --soft: #1e2638;
    --accent: #8f8cf5; --accent-ink: #111326; --accent-soft: #262a4d;
    --ok: #4ade80; --ok-soft: #133022; --bad: #f87171; --bad-soft: #3a1a1a; --warn: #fbbf24;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0 0 .75rem; }
h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); line-height: 1.35; letter-spacing: -.02em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
.muted { color: var(--muted); }
small { font-size: .85rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.hero p { max-width: 70ch; }
.credit { font-size: .9rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat strong { display: block; font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .88rem; }
fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--soft); cursor: pointer; }
.mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.mode:has(input:disabled) { opacity: .55; cursor: not-allowed; }
.mode input { margin-top: .35rem; accent-color: var(--accent); }
.mode b { display: block; }
.mode small { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--paper); cursor: pointer; font-size: .92rem; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chip input { accent-color: var(--accent); margin: 0; }
.group-title { font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
.topic-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
.topic { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--paper); cursor: pointer; }
.topic:has(input:checked) { border-color: var(--accent); }
.topic input { accent-color: var(--accent); margin: 0; }
.topic .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / 4; height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.inline-actions { display: flex; gap: 12px; margin-bottom: 6px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--paper); }
.btn { border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; background: var(--paper); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.big { padding: 12px 22px; font-size: 1.05rem; }
.note { font-size: .9rem; color: var(--warn); }
.session-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.progress { flex: 1 1 200px; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--soft); }
.timer.low { color: var(--bad); background: var(--bad-soft); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.pill { font-size: .78rem; border-radius: 999px; padding: 2px 10px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.prompt { font-size: 1.12rem; font-weight: 600; margin-bottom: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); overflow-wrap: anywhere; }
.choice .key { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 8px; background: var(--soft); font-weight: 700; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { opacity: 1; cursor: default; }
.feedback { margin-top: 16px; border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--soft); }
.feedback.ok { border-color: var(--ok); }
.feedback.bad { border-color: var(--bad); }
.feedback b { display: block; margin-bottom: 4px; }
.nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.palette button { width: 2.4rem; height: 2.2rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-variant-numeric: tabular-nums; font-size: .85rem; }
.palette button.done { background: var(--accent-soft); border-color: var(--accent); }
.palette button.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.score { font-size: clamp(2.4rem, 8vw, 3.4rem); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: .93rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
.review-item { border-top: 1px solid var(--line); padding: 14px 0; }
.review-item:first-child { border-top: 0; }
.review-item .ans { font-size: .93rem; }
.ok-text { color: var(--ok); font-weight: 700; }
.bad-text { color: var(--bad); font-weight: 700; }
.history li { margin-bottom: 4px; }
@media (max-width: 560px) {
  .card { padding: 16px; }
  .nav .btn { flex: 1 1 auto; }
}
</style>
</head>

rlap"},{"id":"DEV-592","set":2,"level":2,"kind":"Scenario","difficulty":"Medium","prompt":"ระบบจัดคิวงานตามความสำคัญแต่ห้าม low priority starvation ควรใช้แนวใด","choices":["batch fetching หรือ DataLoader ที่รวม key เพื่อลด round trips","กำหนดพฤติกรรม division-by-zero ชัดเจนก่อนคำนวณ","ตรวจว่าคำขอเดิมสำเร็จแล้วหรือชนกับข้อมูลอื่นจาก business key","priority aging หรือ weighted fair scheduling"],"answer":3,"explanation":"ให้งาน priority ต่ำมีโอกาสถูกเลือกในระยะยาว"},{"id":"DEV-593","set":2,"level":3,"kind":"Scenario","difficulty":"Hard","prompt":"การใช้ regular expression ที่มี nested quantifiers บน input ไม่เชื่อถือเสี่ยงอะไร","choices":["error ใน callback ภายหลังไม่ถูกจับโดย try/catch sync ภายนอก","AbortController และส่ง signal ไปยัง fetch","caller เปลี่ยน cached state โดยไม่ผ่าน validation","catastrophic backtracking ทำให้ CPU สูงผิดปกติ"],"answer":3,"explanation":"ควรใช้ regex ที่มีเวลาเหมาะสมหรือจำกัด input"},{"id":"DEV-594","set":2,"level":1,"kind":"Scenario","difficulty":"Easy","prompt":"ต้อง serialize BigInt เป็น JSON ใน JavaScript จะเกิดอะไร","choices":["ใช้ cancellation signal ควบคู่ timeout/Promise.race","forEach ไม่รอ Promise ที่ callback คืนมา","นิยาม interval แบบ [start,end) หรือ inclusive ให้ชัดก่อนเขียน","JSON.stringify(BigInt) throw โดยปริยาย ต้องแปลงเป็น string หรือ replacer"],"answer":3,"explanation":"JSON ไม่มีชนิด BigInt มาตรฐาน"},{"id":"DEV-595","set":2,"level":2,"kind":"Scenario","difficulty":"Medium","prompt":"เมื่อ cache เก็บ object แล้วคืน reference ให้ caller ไปแก้ได้ เสี่ยงอะไร","choices":["ใช้ atomic INCR หรือ Lua สำหรับ operation ที่ซับซ้อน","batch fetching หรือ DataLoader ที่รวม key เพื่อลด round trips","caller เปลี่ยน cached state โดยไม่ผ่าน validation","Result/Discriminated union ที่แยก success กับ failure"],"answer":2,"explanation":"คืน immutable value หรือสำเนาตาม use case"},{"id":"DEV-596","set":2,"level":2,"kind":"Scenario","difficulty":"Medium","prompt":"การ merge configuration หลายชั้นที่มี secret ควรระวังอะไร","choices":["precedence และการไม่ log ค่า sensitive ระหว่าง debug","นิยาม interval แบบ [start,end) หรือ inclusive ให้ชัดก่อนเขียน","cache key strategy และ mutation ของ input ที่ทำให้ stale result","Promise.allSettled"],"answer":0,"explanation":"config override ผิดอาจทำให้รั่วหรือเชื่อมผิด environment"}]}]}</script>
<script>
(() => {
  'use strict';
  const BANK = JSON.parse(document.getElementById('question-bank').textContent);
  const STORE = 'anchanat-dev600-v1';
  const LEVELS = { 1: 'L1 · Foundation', 2: 'L2 · Practitioner', 3: 'L3 · Advanced' };
  const KEYS = ['A', 'B', 'C', 'D'];
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ALL = [];
  const COMP = {};
  for (const c of BANK.competencies) { COMP[c.id] = c; for (const q of c.questions) ALL.push({ ...q, comp: c.id }); }
  const BY_ID = Object.fromEntries(ALL.map(q => [q.id, q]));
  const GROUPS = [...new Set(BANK.competencies.map(c => c.group))];

  // ---------- storage (blocked inside sandboxed frames; the page still works without it)
  let storageOk = true;
  function load() {
    try { const s = JSON.parse(window.localStorage.getItem(STORE)); if (s && s.v === 1) return s; } catch (e) { storageOk = false; }
    return { v: 1, q: {}, history: [], setup: null };
  }
  let progress = load();
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(progress)); storageOk = true; } catch (e) { storageOk = false; }
  }
  function record(q, correct) {
    const r = progress.q[q.id] || { seen: 0, wrong: 0 };
    r.seen += 1; r.last = correct; if (!correct) r.wrong += 1;
    progress.q[q.id] = r;
  }
  const wrongIds = () => ALL.filter(q => progress.q[q.id] && progress.q[q.id].last === false).map(q => q.id);

  // ---------- helpers
  function shuffle(a) {
    const r = a.slice();
    const rnd = n => { const b = new Uint32Array(1); window.crypto.getRandomValues(b); return b[0] % n; };
    for (let i = r.length - 1; i > 0; i--) { const j = rnd(i + 1); [r[i], r[j]] = [r[j], r[i]]; }
    return r;
  }
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const fmtTime = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; };
  function compStats(id) {
    const qs = COMP[id].questions; let seen = 0, ok = 0;
    for (const q of qs) { const r = progress.q[q.id]; if (r) { seen++; if (r.last) ok++; } }
    return { total: qs.length, seen, ok };
  }

  // ---------- setup
  const defaults = { mode: 'practice', comps: BANK.competencies.map(c => c.id), levels: [1, 2, 3], sets: [1, 2], count: '20', seconds: '60', shuffleQ: true, shuffleC: true };
  let setup = { ...defaults, ...(progress.setup || {}) };
  setup.comps = setup.comps.filter(id => COMP[id]);

  function pool() {
    if (setup.mode === 'review') return wrongIds().map(id => BY_ID[id]);
    return ALL.filter(q => setup.comps.includes(q.comp) && setup.levels.includes(q.level) && setup.sets.includes(q.set));
  }

  function renderHome() {
    stopTimer();
    const seen = ALL.filter(q => progress.q[q.id]).length;
    const ok = ALL.filter(q => progress.q[q.id] && progress.q[q.id].last).length;
    const wrong = wrongIds().length;
    if (setup.mode === 'review' && !wrong) setup.mode = 'practice';
    const n = pool().length;
    const topicHtml = GROUPS.map(g => `<div class="group-title">${esc(g)}</div><div class="topic-list">${
      BANK.competencies.filter(c => c.group === g).map(c => { const s = compStats(c.id); return `
        <label class="topic"><input type="checkbox" name="comp" value="${c.id}" ${setup.comps.includes(c.id) ? 'checked' : ''}>
          <span>${esc(c.title)}</span><span class="count">${s.ok}/${s.total}</span>
          <span class="bar" title="ตอบถูกล่าสุด ${s.ok} จาก ${s.total} ข้อ"><i style="width:${pct(s.ok, s.total)}%"></i></span></label>`; }).join('')
    }</div>`).join('');
    const hist = progress.history.slice(-5).reverse();
    app.innerHTML = `
      <section class="hero">
        <h1>ข้อสอบซ้อม Developer Competency 600 ข้อ</h1>
        <p class="muted">ปรนัย 4 ตัวเลือก ครบ 17 หัวข้อของ competency (รวม SQL, Prompt และ Program Coding) แบ่งเป็น 3 ระดับ: L1 Foundation, L2 Practitioner, L3 Advanced จาก Set 1 และ Set 2 ชุดละ 300 ข้อ</p>
        <p class="credit">เนื้อหาข้อสอบโดย ${esc(BANK.credit)} · จาก ExcelQuiz Pro</p>
      </section>
      <div class="stats">
        <div class="stat"><strong>${seen}<small class="muted"> / ${ALL.length}</small></strong><span>ข้อที่เคยทำ</span></div>
        <div class="stat"><strong>${pct(ok, seen)}%</strong><span>ตอบถูกในครั้งล่าสุด (${ok} ข้อ)</span></div>
        <div class="stat"><strong>${wrong}</strong><span>ข้อที่ต้องทบทวน</span></div>
      </div>
      ${storageOk ? '' : '<p class="note">หน้านี้บันทึกความคืบหน้าไม่ได้ในกรอบนี้ ทำข้อสอบได้ตามปกติ ถ้าต้องการบันทึกให้กด “เปิดเต็มหน้า”</p>'}
      <form class="card" id="setup">
        <fieldset><legend>โหมด</legend><div class="modes">
          <label class="mode"><input type="radio" name="mode" value="practice" ${setup.mode === 'practice' ? 'checked' : ''}><span><b>ฝึกซ้อม</b><small>ตรวจทีละข้อ เห็นเฉลยและเหตุผลทันที</small></span></label>
          <label class="mode"><input type="radio" name="mode" value="exam" ${setup.mode === 'exam' ? 'checked' : ''}><span><b>สอบจับเวลา</b><small>ตอบให้ครบแล้วส่ง ดูคะแนนและเฉลยตอนจบ</small></span></label>
          <label class="mode"><input type="radio" name="mode" value="review" ${setup.mode === 'review' ? 'checked' : ''} ${wrong ? '' : 'disabled'}><span><b>ทบทวนข้อที่ผิด</b><small>${wrong ? `ฝึกซ้ำ ${wrong} ข้อที่ตอบผิดล่าสุด` : 'ยังไม่มีข้อที่ตอบผิด'}</small></span></label>
        </div></fieldset>
        <div id="filters" ${setup.mode === 'review' ? 'hidden' : ''}>
          <fieldset><legend>หัวข้อ</legend>
            <div class="inline-actions"><button type="button" class="link" data-all="1">เลือกทั้งหมด</button><button type="button" class="link" data-all="0">ล้าง</button></div>
            ${topicHtml}
          </fieldset>
          <fieldset><legend>ระดับ</legend><div class="chips">${[1, 2, 3].map(l => `<label class="chip"><input type="checkbox" name="level" value="${l}" ${setup.levels.includes(l) ? 'checked' : ''}>${LEVELS[l]}</label>`).join('')}</div></fieldset>
          <fieldset><legend>ชุดข้อสอบ</legend><div class="chips">${[1, 2].map(s => `<label class="chip"><input type="checkbox" name="set" value="${s}" ${setup.sets.includes(s) ? 'checked' : ''}>Set ${s}</label>`).join('')}</div></fieldset>
        </div>
        <fieldset><legend>ตัวเลือกเพิ่มเติม</legend><div class="row">
          <label>จำนวนข้อ <select name="count">${['10', '20', '40', '60', 'all'].map(v => `<option value="${v}" ${setup.count === v ? 'selected' : ''}>${v === 'all' ? 'ทั้งหมด' : v + ' ข้อ'}</option>`).join('')}</select></label>
          <label ${setup.mode === 'exam' ? '' : 'hidden'} id="seconds-field">เวลา <select name="seconds">${['45', '60', '90'].map(v => `<option value="${v}" ${setup.seconds === v ? 'selected' : ''}>${v} วินาที/ข้อ</option>`).join('')}</select></label>
          <label class="chip"><input type="checkbox" name="shuffleQ" ${setup.shuffleQ ? 'checked' : ''}>สุ่มลำดับข้อ</label>
          <label class="chip"><input type="checkbox" name="shuffleC" ${setup.shuffleC ? 'checked' : ''}>สลับตัวเลือก</label>
        </div></fieldset>
        <div class="row spread">
          <span class="muted" id="pool-note">${n} ข้อตรงเงื่อนไข</span>
          <button class="btn primary big" id="start" ${n ? '' : 'disabled'}>เริ่ม ${esc(startLabel(n))}</button>
        </div>
      </form>
      ${hist.length ? `<section class="card"><h2>ประวัติล่าสุด</h2><ul class="history">${hist.map(h => `<li>${esc(new Date(h.at).toLocaleString('th-TH'))} · ${h.mode === 'exam' ? 'สอบจับเวลา' : h.mode === 'review' ? 'ทบทวน' : 'ฝึกซ้อม'} · <b>${h.correct}/${h.total}</b> (${pct(h.correct, h.total)}%)</li>`).join('')}</ul></section>` : ''}
      <div class="row spread"><span class="muted"><small>ข้อมูลทั้งหมดอยู่ในไฟล์นี้ ทำงาน offline ไม่ส่งข้อมูลออก</small></span><button class="btn danger" id="reset" type="button">ล้างความคืบหน้า</button></div>`;

    const form = document.getElementById('setup');
    form.addEventListener('change', e => {
      const { name, value } = e.target;
      readSetup(form); renderHome();
      // The form is rebuilt on every change; put focus back on the control the user just used.
      const again = [...app.querySelectorAll(`[name="${name}"]`)].find(el => el.value === value) || app.querySelector(`[name="${name}"]`);
      if (again) again.focus();
    });
    form.addEventListener('submit', ev => { ev.preventDefault(); readSetup(form); start(); });
    form.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => { setup.comps = b.dataset.all === '1' ? BANK.competencies.map(c => c.id) : []; persistSetup(); renderHome(); }));
    const reset = document.getElementById('reset');
    reset.addEventListener('click', () => {
      if (reset.dataset.confirm) { progress = { v: 1, q: {}, history: [], setup: progress.setup }; save(); renderHome(); return; }
      reset.dataset.confirm = '1'; reset.textContent = 'กดอีกครั้งเพื่อยืนยันการล้าง';
    });
  }
  function startLabel(n) {
    const c = setup.count === 'all' ? n : Math.min(n, Number(setup.count));
    return `${c} ข้อ${setup.mode === 'exam' ? ` · ${fmtTime(c * Number(setup.seconds))} นาที` : ''}`;
  }
  function readSetup(form) {
    const f = new FormData(form);
    setup.mode = f.get('mode') || 'practice';
    if (!document.getElementById('filters').hidden) {
      setup.comps = f.getAll('comp');
      setup.levels = f.getAll('level').map(Number);
      setup.sets = f.getAll('set').map(Number);
    }
    setup.count = f.get('count') || '20';
    if (f.get('seconds')) setup.seconds = f.get('seconds');
    setup.shuffleQ = f.get('shuffleQ') === 'on';
    setup.shuffleC = f.get('shuffleC') === 'on';
    persistSetup();
  }
  function persistSetup() { progress.setup = setup; save(); }

  // ---------- session
  let S = null;
  let timerId = null;
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

  function start(list) {
    let qs = list || pool();
    if (setup.shuffleQ) qs = shuffle(qs);
    if (!list && setup.count !== 'all') qs = qs.slice(0, Number(setup.count));
    const mode = list ? 'practice' : setup.mode;
    S = {
      mode, index: 0, picks: {}, checked: {}, startedAt: Date.now(),
      items: qs.map(q => ({ q, order: setup.shuffleC ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3] })),
      deadline: mode === 'exam' ? Date.now() + qs.length * Number(setup.seconds) * 1000 : null,
      confirmSubmit: false,
    };
    if (S.deadline) { timerId = setInterval(tick, 1000); }
    renderSession(true);
  }
  function tick() {
    const el = document.getElementById('timer');
    const left = (S.deadline - Date.now()) / 1000;
    if (left <= 0) { finish(true); return; }
    if (el) { el.textContent = fmtTime(left); el.classList.toggle('low', left < 60); }
  }

  function renderSession(focusTitle) {
    const it = S.items[S.index];
    const q = it.q;
    const pick = S.picks[q.id];
    const checked = S.mode !== 'exam' && S.checked[q.id];
    const answered = Object.keys(S.picks).length;
    const last = S.index === S.items.length - 1;
    const correctPos = it.order.indexOf(q.answer);
    const choices = it.order.map((orig, pos) => {
      let cls = 'choice';
      if (checked) { if (orig === q.answer) cls += ' correct'; else if (orig === pick) cls += ' wrong'; }
      return `<button type="button" class="${cls}" role="radio" aria-checked="${pick === orig}" data-orig="${orig}" ${checked ? 'disabled' : ''}><span class="key">${KEYS[pos]}</span><span>${esc(q.choices[orig])}</span></button>`;
    }).join('');
    const ok = pick === q.answer;
    app.innerHTML = `
      <div class="session-bar">
        <button class="btn" id="quit" type="button">← ออก</button>
        <span><b>${S.mode === 'exam' ? 'สอบจับเวลา' : S.mode === 'review' ? 'ทบทวนข้อที่ผิด' : 'ฝึกซ้อม'}</b> · ข้อ ${S.index + 1}/${S.items.length}</span>
        <span class="progress" aria-hidden="true"><i style="width:${pct(S.mode === 'exam' ? answered : Object.keys(S.checked).length, S.items.length)}%"></i></span>
        ${S.deadline ? `<span class="timer" id="timer" aria-label="เวลาที่เหลือ">${fmtTime((S.deadline - Date.now()) / 1000)}</span>` : ''}
      </div>
      <article class="card">
        <div class="meta"><span class="pill">${esc(COMP[q.comp].title)}</span><span class="pill">${LEVELS[q.level]}</span><span class="pill">${esc(q.kind)}</span><span class="pill">Set ${q.set} · ${esc(q.id)}</span></div>
        <h2 class="prompt" id="question-title" tabindex="-1">${esc(q.prompt)}</h2>
        <div class="choices" role="radiogroup" aria-labelledby="question-title">${choices}</div>
        ${checked ? `<div class="feedback ${ok ? 'ok' : 'bad'}"><b class="${ok ? 'ok-text' : 'bad-text'}">${ok ? 'ถูกต้อง' : `ยังไม่ถูก · คำตอบที่ถูกคือ ${KEYS[correctPos]}`}</b>${esc(q.explanation)}</div>` : ''}
        <div class="nav">${navButtons(pick, checked, last)}</div>
        ${S.mode === 'exam' ? `<div><small class="muted">ตอบแล้ว ${answered}/${S.items.length} ข้อ · กดตัวเลขเพื่อข้ามไปข้อนั้น</small><div class="palette">${S.items.map((x, i) => `<button type="button" data-go="${i}" class="${S.picks[x.q.id] !== undefined ? 'done' : ''} ${i === S.index ? 'current' : ''}" aria-label="ข้อ ${i + 1}${S.picks[x.q.id] !== undefined ? ' ตอบแล้ว' : ''}">${i + 1}</button>`).join('')}</div></div>` : ''}
      </article>
      <p class="muted"><small>คีย์ลัด: A–D หรือ 1–4 เลือกคำตอบ · Enter ${S.mode === 'exam' ? 'ไปข้อถัดไป' : 'ตรวจ/ไปข้อถัดไป'}</small></p>`;
    app.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.orig))));
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { S.index = Number(b.dataset.go); S.confirmSubmit = false; renderSession(true); }));
    document.getElementById('quit').addEventListener('click', () => { if (S.mode === 'practice' || S.mode === 'review') saveRun(); S = null; renderHome(); });
    bind('prev', () => { S.index--; S.confirmSubmit = false; renderSession(true); });
    bind('next', next);
    bind('check', check);
    bind('submit', () => { if (S.confirmSubmit) finish(false); else { S.confirmSubmit = true; renderSession(); document.getElementById('submit').focus(); } });
    bind('finish', () => finish(false));
    if (focusTitle) document.getElementById('question-title').focus({ preventScroll: true });
  }
  function navButtons(pick, checked, last) {
    const prev = S.index > 0 ? '<button class="btn" id="prev" type="button">← ข้อก่อนหน้า</button>' : '<span></span>';
    if (S.mode === 'exam') {
      const left = S.items.length - Object.keys(S.picks).length;
      const submit = `<button class="btn ${last || S.confirmSubmit ? 'primary' : ''}" id="submit" type="button">${S.confirmSubmit ? `ยืนยันส่ง${left ? ` (ยังไม่ตอบ ${left} ข้อ)` : ''}` : 'ส่งคำตอบ'}</button>`;
      return `${prev}<span class="row">${submit}${last ? '' : '<button class="btn primary" id="next" type="button">ข้อถัดไป →</button>'}</span>`;
    }
    if (!checked) return `${prev}<button class="btn primary" id="check" type="button" ${pick === undefined ? 'disabled' : ''}>ตรวจคำตอบ</button>`;
    return `${prev}${last ? '<button class="btn primary" id="finish" type="button">ดูสรุปผล</button>' : '<button class="btn primary" id="next" type="button">ข้อถัดไป →</button>'}`;
  }
  function bind(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function choose(orig) {
    const q = S.items[S.index].q;
    if (S.mode !== 'exam' && S.checked[q.id]) return;
    S.picks[q.id] = orig; S.confirmSubmit = false;
    renderSession();
    const btn = app.querySelector(`.choice[data-orig="${orig}"]`); if (btn) btn.focus();
  }
  function check() {
    const q = S.items[S.index].q;
    if (S.picks[q.id] === undefined || S.checked[q.id]) return;
    S.checked[q.id] = true; record(q, S.picks[q.id] === q.answer); save();
    renderSession();
    const n = document.getElementById('next') || document.getElementById('finish'); if (n) n.focus();
  }
  function next() { if (S.index < S.items.length - 1) { S.index++; S.confirmSubmit = false; renderSession(true); } }
  function saveRun() {
    const done = S.items.filter(x => S.mode === 'exam' || S.checked[x.q.id]);
    if (!done.length) return;
    progress.history.push({ at: Date.now(), mode: S.mode, total: done.length, correct: done.filter(x => S.picks[x.q.id] === x.q.answer).length });
    progress.history = progress.history.slice(-30); save();
  }
  function finish(timeUp) {
    stopTimer();
    if (S.mode === 'exam') S.items.forEach(x => record(x.q, S.picks[x.q.id] === x.q.answer));
    saveRun();
    renderResult(timeUp);
  }

  // ---------- result
  function renderResult(timeUp, onlyWrong) {
    const items = S.mode === 'exam' ? S.items : S.items.filter(x => S.checked[x.q.id]);
    const correct = items.filter(x => S.picks[x.q.id] === x.q.answer);
    const wrong = items.filter(x => S.picks[x.q.id] !== x.q.answer);
    const used = (Date.now() - S.startedAt) / 1000;
    const per = BANK.competencies.map(c => {
      const xs = items.filter(x => x.q.comp === c.id);
      return { c, n: xs.length, ok: xs.filter(x => S.picks[x.q.id] === x.q.answer).length };
    }).filter(r => r.n);
    const shown = onlyWrong ? wrong : items;
    app.innerHTML = `
      <section class="card">
        <p class="muted">${timeUp ? 'หมดเวลา ระบบส่งคำตอบให้อัตโนมัติ' : 'สรุปผล'} · ใช้เวลา ${fmtTime(used)} นาที</p>
        <div class="score">${pct(correct.length, items.length)}%</div>
        <p>ตอบถูก <b>${correct.length}</b> จาก <b>${items.length}</b> ข้อ${S.mode === 'exam' ? ` · ไม่ได้ตอบ ${items.filter(x => S.picks[x.q.id] === undefined).length} ข้อ` : ''}</p>
        <div class="row">
          <button class="btn primary" id="again" type="button">กลับไปเลือกชุดใหม่</button>
          ${wrong.length ? `<button class="btn" id="retry" type="button">ฝึกซ้ำ ${wrong.length} ข้อที่ผิด</button>` : ''}
        </div>
      </section>
      <section class="card"><h2>ผลรายหัวข้อ</h2><div class="table-scroll"><table>
        <thead><tr><th>หัวข้อ</th><th class="num">ถูก</th><th class="num">%</th></tr></thead>
        <tbody>${per.map(r => `<tr><td>${esc(r.c.title)}</td><td class="num">${r.ok}/${r.n}</td><td class="num">${pct(r.ok, r.n)}%</td></tr>`).join('')}</tbody>
      </table></div></section>
      <section class="card">
        <div class="row spread"><h2>เฉลยทีละข้อ</h2><label class="chip"><input type="checkbox" id="only-wrong" ${onlyWrong ? 'checked' : ''}>เฉพาะข้อที่ผิด</label></div>
        ${shown.length ? shown.map(x => reviewItem(x)).join('') : '<p class="muted">ไม่มีข้อที่ตอบผิด</p>'}
      </section>`;
    bind('again', () => { S = null; renderHome(); });
    bind('retry', () => start(wrong.map(x => x.q)));
    document.getElementById('only-wrong').addEventListener('change', e => renderResult(timeUp, e.target.checked));
  }
  function reviewItem(x) {
    const q = x.q; const pick = S.picks[q.id]; const ok = pick === q.answer;
    const label = orig => `${KEYS[x.order.indexOf(orig)]}. ${esc(q.choices[orig])}`;
    return `<div class="review-item">
      <div class="meta"><span class="pill">${esc(COMP[q.comp].title)}</span><span class="pill">${LEVELS[q.level]}</span><span class="${ok ? 'ok-text' : 'bad-text'}">${ok ? '✓ ถูก' : '✗ ผิด'}</span></div>
      <h3>${esc(q.prompt)}</h3>
      <p class="ans">คำตอบของคุณ: ${pick === undefined ? '<span class="muted">ไม่ได้ตอบ</span>' : label(pick)}<br>คำตอบที่ถูก: <b>${label(q.answer)}</b></p>
      <p class="muted">${esc(q.explanation)}</p></div>`;
  }

  // ---------- keyboard
  document.addEventListener('keydown', e => {
    if (!S || e.altKey || e.ctrlKey || e.metaKey || !document.getElementById('question-title')) return;
    const k = e.key.toUpperCase();
    const pos = KEYS.indexOf(k) >= 0 ? KEYS.indexOf(k) : ['1', '2', '3', '4'].indexOf(k);
    if (pos >= 0 && !(e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)) { e.preventDefault(); choose(S.items[S.index].order[pos]); return; }
    if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement)) {
      e.preventDefault();
      const q = S.items[S.index].q;
      if (S.mode === 'exam') next();
      else if (!S.checked[q.id]) check();
      else if (S.index < S.items.length - 1) next(); else finish(false);
    }
  });

  renderHome();
})();
</script>
</body>
</html>
