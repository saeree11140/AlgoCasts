้านแถว และเลือก nested loop join ต่อกับตาราง orders ควรทำสิ่งใดบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มขนาด connection pool ของแอปและให้รายงานลองใหม่อัตโนมัติ เพื่อให้ได้ connection มากขึ้น","correct":false,"why":"รายงานช้าเพราะแผนการ join ไม่เหมาะกับจำนวนแถวจริง ไม่ใช่เพราะรอ connection จำนวน connection ไม่เปลี่ยนแผนที่ optimizer เลือก"},{"id":"B","text":"อัปเดตสถิติของตาราง (เช่น ANALYZE หรือคำสั่งเทียบเท่าของฐานข้อมูล) หลังการนำเข้าข้อมูลขนาดใหญ่ แล้วตรวจแผนใหม่","correct":true,"why":"optimizer ตัดสินใจจากสถิติ หากสถิติยังเป็นของข้อมูลก่อนนำเข้า จะประมาณจำนวนแถวต่ำเกินจริงและเลือกแผนที่เหมาะกับข้อมูลน้อย"},{"id":"C","text":"หาจุดแรกในแผนที่ค่าประมาณกับค่าจริงต่างกันมาก (มักเป็นตัวกรองหรือ join ชั้นล่างสุด) เพราะความคลาดเคลื่อนสะสมขึ้นไปยังขั้นบน","correct":true,"why":"การประมาณผิดที่ชั้นล่างทำให้ทุกขั้นที่อยู่เหนือขึ้นไปเลือกวิธี join และลำดับผิดตามกัน จึงต้องแก้จากจุดต้นทางของความคลาดเคลื่อน"},{"id":"D","text":"ถ้าคอลัมน์ที่กรองกระจายเบ้หรือสัมพันธ์กัน ให้ใช้ histogram หรือสถิติหลายคอลัมน์เท่าที่ฐานข้อมูลรองรับ","correct":true,"why":"สถิติพื้นฐานมักสมมติว่าคอลัมน์กระจายสม่ำเสมอและเป็นอิสระต่อกัน เมื่อไม่จริง ค่าประมาณจะผิดมาก ข้อมูลการกระจายที่ละเอียดกว่าช่วยให้ประมาณใกล้ความจริง"}],"explanation":"เมื่อแผนช้าผิดปกติ ให้เทียบจำนวนแถวที่ประมาณกับที่เกิดจริงก่อน ความต่างมหาศาลชี้ว่าสถิติล้าสมัยหรือไม่พอ ซึ่งแก้ได้ด้วยการอัปเดตสถิติและเพิ่มรายละเอียดของสถิติ ไม่ใช่เพิ่มทรัพยากรที่ไม่เกี่ยวข้อง"},{"id":"ARC-S-P-029","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S4","concept":"migration-runner-concurrency","mobile":false,"type":"multiple","stem":"บริการ Order รันบน Kubernetes 6 pod โดย container ทุกตัวเริ่มต้นด้วยคำสั่งด้านล่าง ซึ่งรัน migration ก่อนเปิดรับ traffic ใน release นี้มี migration ที่เพิ่มแถวค่าตั้งต้นลงตาราง shipping_methods (ตารางนี้ไม่มี unique constraint บนชื่อวิธีจัดส่ง) หลัง deploy ที่ pod ใหม่หลายตัวสตาร์ตพร้อมกัน พบว่า shipping_methods มีแถวค่าตั้งต้นซ้ำ และ pod ใหม่บางตัว restart ซ้ำเพราะ migration ล้ม ทีมต้องการให้ release ต่อไปที่มี migration ปลอดภัยแม้มีหลาย pod สตาร์ตพร้อมกัน ข้อใดเป็นแนวทางที่ถูกต้อง (เลือกทุกข้อที่ถูก)","code":"# Dockerfile ของบริการ Order\nCMD [\"sh\", \"-c\", \"npm run migrate && node dist/server.js\"]","codeLang":"text","options":[{"id":"A","text":"แยก migration เป็นขั้นตอนที่รันครั้งเดียวต่อการ deploy เช่น job ก่อน rollout แล้วให้ pod ของแอปเริ่มหลัง job สำเร็จ","correct":true,"why":"มีผู้รันเพียงรายเดียวต่อ release จึงไม่มีการชนกัน และถ้า migration ล้ม การ deploy หยุดก่อนที่โค้ดใหม่จะรับ traffic ทำให้เห็นความล้มเหลวที่จุดเดียว (schema ที่เพิ่มต้องยังเข้ากันได้กับ pod เก่าที่รันอยู่ระหว่างนั้น)"},{"id":"B","text":"คงให้ทุก pod รัน migration ตอนสตาร์ต แต่เพิ่มการหน่วงเวลาแบบสุ่มก่อนรันในแต่ละ pod เพื่อให้หลาย pod รันพร้อมกันน้อยลง","correct":false,"why":"ลดโอกาสชนแต่ไม่ได้ป้องกัน pod ที่หน่วงเสร็จในช่วงใกล้กันหรือ migration ที่ใช้เวลานานกว่าช่วงหน่วงก็ยังซ้อนกันได้ และการชนที่เหลือให้ผลเสียเท่าเดิมคือแถวซ้ำหรือ migration ล้ม"},{"id":"C","text":"ให้ผู้รัน migration ขอ lock ระดับฐานข้อมูล เช่น advisory lock ก่อนเริ่ม แล้วอ่านเวอร์ชันที่ใช้แล้วอีกครั้งหลังได้ lock","correct":true,"why":"ผู้รันรายหลังจะรอจนรายแรกเสร็จ แล้วเห็นว่าเวอร์ชันถูกใช้แล้วจึงข้าม การอ่านเวอร์ชันหลังได้ lock ปิดช่องที่สองรายต่างเห็นว่ายังไม่ได้รัน เครื่องมือ migration จำนวนมากมีกลไกนี้ในตัว แต่ถ้าเป็นสคริปต์ที่ทีมเขียนเองต้องทำเอง"},{"id":"D","text":"ให้ผู้รันตรวจตารางเวอร์ชันก่อน ถ้ายังไม่มี migration นี้จึงรัน แล้วบันทึกเวอร์ชันลงตารางเมื่อรันเสร็จ","correct":false,"why":"เป็นการตรวจแล้วค่อยลงมือ (check-then-act) โดยไม่มี lock ผู้รันสองรายอ่านพร้อมกันแล้วต่างเห็นว่ายังไม่ได้รัน จึงรันทั้งคู่ เพราะเวอร์ชันถูกบันทึกหลัง migration เสร็จ ช่วงที่ทำงานอยู่จึงเปิดช่องให้ชนกัน"}],"explanation":"migration เปลี่ยนสถานะที่ใช้ร่วมกันของฐานข้อมูล จึงต้องมีผู้รันเพียงรายเดียวในเวลาเดียวกัน การรันในทุก pod ตอนสตาร์ตทำให้เกิดการชนได้ทุกครั้งที่ deploy หรือ scale ทางที่ถูกคือแยกให้มีผู้รันเดียว (job แยก) หรือบังคับลำดับด้วย lock แล้วอ่านเวอร์ชันซ้ำหลังได้ lock ส่วนการหน่วงเวลาและการตรวจแบบไม่ล็อกเพียงลดโอกาส ไม่ได้ปิดช่องแข่งกัน"},{"id":"ARC-S-P-030","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S4","concept":"mobile-local-db-migration","mobile":true,"type":"single","stem":"แอปมือถือเก็บข้อมูลออฟไลน์ในฐานข้อมูล SQLite ในเครื่อง ปัจจุบัน schema เวอร์ชัน 3 ทีมจะออกแอปรุ่นถัดไปที่ต้องเพิ่มคอลัมน์และแยกตาราง ผู้ใช้บางส่วนอัปเดตแอปข้ามหลายรุ่น (เช่น จาก schema 3 ไปยัง schema 6 โดยตรง) และฐานข้อมูลในเครื่องมีข้อมูลที่ยังไม่ได้ซิงก์ขึ้นเซิร์ฟเวอร์ ควรจัดการ migration อย่างไร","options":[{"id":"A","text":"ลบฐานข้อมูลในเครื่องแล้วดาวน์โหลดข้อมูลทั้งหมดจากเซิร์ฟเวอร์ใหม่ เมื่อพบว่าเลข schema ไม่ตรงกับรุ่นแอป","correct":false,"why":"ข้อมูลที่ผู้ใช้สร้างขณะออฟไลน์และยังไม่ได้ซิงก์จะหายถาวร เพราะเซิร์ฟเวอร์ยังไม่มีสำเนาของข้อมูลนั้น"},{"id":"B","text":"เก็บเลข schema version ในเครื่อง และมี migration แยกทีละขั้น (3 ไป 4, 4 ไป 5, 5 ไป 6) รันตามลำดับใน transaction ตอนเปิดแอป พร้อมทดสอบจากทุกรุ่นเก่า","correct":true,"why":"ผู้ใช้จากรุ่นใดก็ไล่ผ่านขั้นที่ขาดได้ครบ transaction ทำให้ถ้าล้มกลางทางไม่ทิ้งฐานข้อมูลครึ่งๆ กลางๆ และข้อมูลที่ยังไม่ซิงก์ถูกรักษาไว้"},{"id":"C","text":"แก้สคริปต์ migration เดิมของ schema 4 (ที่ปล่อยไปแล้ว) ให้รวมการเปลี่ยนแปลงใหม่ทั้งหมด เพื่อให้ผู้ใช้ที่ยังอยู่ schema 3 รันสคริปต์เดียวจบ โดยไม่เพิ่มสคริปต์ขั้นใหม่","correct":false,"why":"ผู้ใช้ที่อัปเดตไป schema 4 แล้วจะไม่รันสคริปต์นั้นอีก จึงไม่ได้รับการเปลี่ยนแปลงที่เพิ่มเข้าไปภายหลัง ฐานข้อมูลของผู้ใช้สองกลุ่มจะต่างกันทั้งที่เลข schema เท่ากัน"},{"id":"D","text":"เขียนสคริปต์ migration เฉพาะจาก schema 5 ไป 6 แล้วให้ผู้ใช้รุ่นเก่ากว่าอัปเดตผ่านรุ่น 5 ก่อนเสมอ","correct":false,"why":"ผู้ใช้อัปเดตจาก store เมื่อใดก็ได้ ทีมบังคับลำดับการอัปเดตรุ่นไม่ได้ ผู้ใช้ที่ข้ามรุ่นจะเปิดแอปแล้วเจอ schema ที่แอปไม่รู้จัก"}],"explanation":"ฐานข้อมูลบนเครื่องผู้ใช้ย้ายตามจังหวะของ store ไม่ใช่ตามจังหวะของทีม จึงต้องมี migration แบบ versioned ที่ต่อกันเป็นลูกโซ่ ไม่แก้สคริปต์ที่ปล่อยไปแล้ว ทำใน transaction และทดสอบจากทุกรุ่นเก่า โดยไม่ทิ้งข้อมูลที่ยังไม่ซิงก์"}],"exam":[{"id":"ARC-S-E-001","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S2","concept":"partition-key-ordering","mobile":false,"type":"single","stem":"ระบบ Order publish event OrderCreated, OrderPaid และ OrderCancelled ของคำสั่งซื้อเดียวกันเข้า topic ของ broker แบบ log ที่แบ่งเป็นหลาย partition ซึ่งรับประกันลำดับเฉพาะภายในแต่ละ partition มี consumer ในกลุ่มเดียวกัน 12 instance ประมวลผลขนานกัน พบว่าบางครั้ง OrderCancelled ถูกประมวลผลก่อน OrderPaid ของคำสั่งซื้อเดียวกัน และต้องรักษา throughput สูงไว้ ควรแก้อย่างไร","options":[{"id":"A","text":"ลด topic ให้เหลือ partition เดียว เพื่อให้ลำดับของ event ถูกต้องทั้ง topic และตัดความซับซ้อนเรื่องการเลือก key ออกไป","correct":false,"why":"ลำดับถูกต้อง แต่ในกลุ่มเดียวกันมี consumer ได้เพียงตัวเดียวต่อ partition อีก 11 instance ไม่มีงานทำ throughput จึงตกเหลือเท่ากำลังของตัวเดียว"},{"id":"B","text":"ให้ consumer ทุกตัวหน่วงรับ event ไว้ 5 วินาที แล้วเรียงตาม timestamp ที่ producer แนบมาก่อนประมวลผล","correct":false,"why":"นาฬิกาของ producer ต่างเครื่องเหลื่อมกันได้ และ event ที่มาช้ากว่าหน้าต่าง 5 วินาทียังหลุดลำดับอยู่ดี ทั้งยังเพิ่มความหน่วงให้ทุก event"},{"id":"C","text":"ใช้ order_id เป็น message key ให้ event ของคำสั่งซื้อเดียวกันลง partition เดียวกัน และให้ consumer ตัวเดียวในกลุ่มอ่านแต่ละ partition","correct":true,"why":"ลำดับถูกรักษาเฉพาะในขอบเขตที่ต้องการ (ต่อคำสั่งซื้อ) ขณะที่คำสั่งซื้อต่างกันกระจายไปหลาย partition ให้ consumer 12 ตัวทำงานขนานกันได้"},{"id":"D","text":"กระจาย event ไปทุก partition แบบ round-robin เพื่อใช้ทุก consumer เต็มที่ แล้วให้ consumer ขอ distributed lock ของ order_id ก่อนประมวลผลทุกครั้ง","correct":false,"why":"lock ทำให้ไม่ประมวลผลพร้อมกัน แต่ไม่กำหนดลำดับ ใครได้ lock ก่อนก็ประมวลผลก่อน OrderCancelled จึงยังแซงได้ และ lock เพิ่มภาระกับความซับซ้อน"}],"explanation":"ลำดับในระบบ log ที่แบ่ง partition รับประกันเฉพาะภายใน partition เดียว วิธีมาตรฐานคือเลือก key ที่ตรงกับขอบเขตที่ต้องเรียงลำดับ (order_id) ให้ event ที่ต้องเรียงลงที่เดียวกัน แล้วปล่อยให้ key อื่นกระจายขนาน แทนการบังคับลำดับทั้ง topic ที่ทำลาย throughput"},{"id":"ARC-S-E-002","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S2","concept":"poison-message-dead-letter","mobile":false,"type":"multiple","stem":"Consumer ประมวลผลข้อความจากคิว มีข้อความบางตัวที่ทำให้ consumer โยน exception ทุกครั้ง (เช่น JSON ผิดรูป หรืออ้างอิงลูกค้าที่ไม่มีอยู่) ข้อความถูกส่งกลับเข้าคิวแล้วถูกดึงซ้ำจนคิวติดและข้อความอื่นค้าง แนวทางใดช่วยจัดการข้อความลักษณะนี้ได้อย่างเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"จำกัดจำนวนครั้งที่ลองใหม่ โดยเว้นระยะเพิ่มขึ้นเรื่อยๆ (exponential backoff) แล้วย้ายข้อความไปคิว dead-letter เมื่อครบจำนวน","correct":true,"why":"การจำกัดรอบและเว้นระยะกันข้อความเสียกินทรัพยากรไม่สิ้นสุด และ dead-letter ย้ายตัวปัญหาออกจากทางของข้อความอื่นโดยไม่ทิ้งข้อมูล"},{"id":"B","text":"ยืนยันรับ (ack) ข้อความที่ล้มเหลวทิ้งไปเพื่อให้คิวเดินต่อ แล้วบันทึกลง log ธรรมดาไว้ให้นักพัฒนาไปไล่ดูภายหลังเมื่อมีผู้ใช้ร้องเรียน","correct":false,"why":"คิวเดินต่อได้ แต่ข้อมูลธุรกิจที่ประมวลผลไม่สำเร็จหายเงียบๆ log ธรรมดาไม่มีกลไกให้นำกลับมาประมวลผลซ้ำหลังแก้ปัญหา"},{"id":"C","text":"แยกชนิดข้อผิดพลาด: ความผิดพลาดชั่วคราว (เช่น ฐานข้อมูล timeout) ให้ retry ส่วนความผิดพลาดถาวร (เช่น ข้อมูลผิดรูป) ส่งเข้า dead-letter ทันที","correct":true,"why":"retry ได้ผลเฉพาะปัญหาที่หายเองได้ ข้อมูลผิดรูปลองกี่ครั้งก็ผิดเหมือนเดิม การแยกชนิดจึงลดเวลาและภาระที่เปลืองเปล่า"},{"id":"D","text":"ตั้ง alert เมื่อมีข้อความใน dead-letter และเก็บข้อความต้นฉบับพร้อมเหตุผลที่ล้มเหลวไว้ เพื่อ replay เมื่อแก้ปัญหาแล้ว","correct":true,"why":"dead-letter ที่ไม่มีใครดูคือที่ฝังข้อมูล alert ทำให้ทีมรู้ ส่วนต้นฉบับกับเหตุผลทำให้วินิจฉัยและนำกลับมาประมวลผลใหม่ได้"}],"explanation":"ข้อความที่ประมวลผลไม่ได้ต้องไม่บล็อกคิวและไม่หายเงียบ: จำกัดรอบ retry ด้วย backoff, แยกความผิดพลาดชั่วคราวกับถาวร, ส่งเข้า dead-letter queue พร้อม alert และข้อมูลพอให้ replay การ ack ทิ้งเป็นการแลกความถูกต้องของข้อมูลกับความสะดวกของคิว"},{"id":"ARC-S-E-003","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S3","concept":"snapshot-vs-reference-data","mobile":false,"type":"single","stem":"Order service เก็บ customer_id ของผู้ซื้อ และต้องออกใบกำกับภาษีที่แสดงชื่อและที่อยู่ของผู้ซื้อ ณ วันที่ซื้อ ซึ่งต้องคงเดิมแม้ลูกค้าจะแก้ที่อยู่ในโปรไฟล์ภายหลัง ข้อมูลโปรไฟล์เป็นของ Customer service ซึ่งมีฐานข้อมูลแยกต่างหาก ควรออกแบบอย่างไร","options":[{"id":"A","text":"ตอนสร้างคำสั่งซื้อ ให้คัดลอกชื่อและที่อยู่ไว้เป็นสำเนา (snapshot) ในข้อมูลคำสั่งซื้อ และใช้สำเนานั้นออกใบกำกับ","correct":true,"why":"ใบกำกับเป็นข้อเท็จจริง ณ เวลาซื้อ การเก็บสำเนาไว้กับคำสั่งซื้อทำให้ไม่เปลี่ยนตามโปรไฟล์ และออกใบกำกับได้แม้ Customer service ไม่พร้อม"},{"id":"B","text":"เก็บเฉพาะ customer_id แล้วเรียก API ของ Customer service ตอนออกใบกำกับ พร้อมแคชผลไว้ 24 ชั่วโมงเพื่อลดจำนวนการเรียกข้ามบริการ","correct":false,"why":"ได้ที่อยู่ปัจจุบัน ไม่ใช่ที่อยู่ ณ วันที่ซื้อ ถ้าลูกค้าแก้โปรไฟล์ใบกำกับจะเปลี่ยนตาม และแคชแค่ทำให้เก่าไม่แน่นอน ไม่ได้ทำให้เป็นข้อมูล ณ เวลาซื้อ"},{"id":"C","text":"ให้ Order service อ่านตาราง customer_address ของ Customer service ผ่าน database view แบบอ่านอย่างเดียว","correct":false,"why":"ยังเป็นที่อยู่ปัจจุบัน ไม่ตรงข้อกำหนด และผูก Order กับ schema ภายในของ Customer service ทำให้ทั้งสองทีมเปลี่ยนโครงสร้างได้ยาก"},{"id":"D","text":"ให้ Order service รับ event ที่อยู่เปลี่ยน แล้วอัปเดตที่อยู่ในคำสั่งซื้อเก่าทุกรายการของลูกค้าให้ตรงกับล่าสุดเสมอ","correct":false,"why":"ทำให้ใบกำกับเก่าถูกแก้ย้อนหลัง ขัดกับข้อกำหนดว่าต้องคงเดิม และเอกสารภาษีที่ออกไปแล้วไม่ควรเปลี่ยนเนื้อหา"}],"explanation":"ข้อมูลอ้างอิงข้ามบริการมีสองแบบ: ข้อมูลปัจจุบัน (อ้างด้วย id แล้วดึงเมื่อใช้) และข้อเท็จจริง ณ เวลาหนึ่ง (คัดลอกเก็บเป็น snapshot) เมื่อธุรกิจต้องการค่า ณ วันซื้อ การคัดลอกไม่ใช่ความซ้ำซ้อนที่ต้องกำจัด แต่เป็นข้อมูลของคำสั่งซื้อเอง"},{"id":"ARC-S-E-004","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S3","concept":"read-your-writes-eventual-consistency","mobile":true,"type":"multiple","stem":"แอปมือถือสั่งซื้อผ่าน Order service (ฝั่งเขียน) และหน้า \"คำสั่งซื้อของฉัน\" อ่านจาก read model ที่อัปเดตผ่าน event ซึ่งปกติตามหลังไม่ถึง 2 วินาที ผู้ใช้เจอปัญหาสั่งซื้อเสร็จแล้วกลับมาหน้ารายการแต่ไม่เห็นคำสั่งซื้อที่เพิ่งสร้าง แนวทางใดช่วยลดปัญหานี้โดยยังคงโครงสร้างที่แยกฝั่งอ่านกับฝั่งเขียน (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้ฝั่งเขียนหน่วงเวลา 5 วินาทีก่อนตอบกลับผู้ใช้ทุกครั้งที่สั่งซื้อ และแสดงตัวหมุนรอ เพื่อให้ read model ตามทันแน่นอน","correct":false,"why":"ความล่าช้าของ read model ไม่คงที่ ช่วงโหลดสูงอาจเกิน 5 วินาที และผู้ใช้ทุกคนต้องรอเพิ่มทุกครั้งทั้งที่ส่วนใหญ่ไม่จำเป็น"},{"id":"B","text":"ให้ response ของการสั่งซื้อคืนคำสั่งซื้อที่สร้าง แล้วให้แอปแสดงรายการนั้นในหน้ารายการทันทีจากข้อมูลในเครื่อง ระหว่างรอ read model","correct":true,"why":"ผู้ใช้เห็นผลงานของตัวเองทันทีโดยไม่ต้องรอ read model (optimistic display) ข้อมูลจริงจาก read model มาเติมทีหลัง"},{"id":"C","text":"ให้ฝั่งเขียนอัปเดต read model ในธุรกรรมเดียวกับฐานข้อมูลเขียนทุกครั้งด้วย distributed transaction ข้ามบริการที่เป็นเจ้าของ read model","correct":false,"why":"ทำลายการแยกฝั่งอ่านกับเขียน ผูกความพร้อมใช้งานของสองระบบเข้าด้วยกัน และเสียประโยชน์ที่ได้จากการแยกซึ่งเป็นเงื่อนไขของโจทย์"},{"id":"D","text":"แสดงสถานะกำลังประมวลผล และให้ read API รับ version ของ event ที่ผู้ใช้เพิ่งเขียน เพื่อรอหรือคืนข้อมูลจากฝั่งเขียนจนกว่า read model ทัน","correct":true,"why":"ผูกการอ่านกับ version ที่ผู้ใช้เพิ่งเขียน (read-your-writes) จึงไม่เห็นข้อมูลเก่ากว่าสิ่งที่ตัวเองทำ โดยผู้ใช้คนอื่นยังอ่านจาก read model ตามปกติ"},{"id":"E","text":"ให้แอปเรียก API รายการซ้ำทุก 100 มิลลิวินาทีไม่จำกัดจำนวนครั้ง จนกว่าจะเห็นคำสั่งซื้อใหม่ แล้วจึงแสดงหน้ารายการให้ผู้ใช้","correct":false,"why":"ผู้ใช้จำนวนมากยิงคำขอถี่ๆ พร้อมกันเป็นภาระเพิ่มกับ read model ในช่วงที่ล่าช้าอยู่แล้ว และกินแบตเตอรี่กับข้อมูลมือถือโดยไม่รับประกันว่าจะเห็นเมื่อไร"}],"explanation":"Eventual consistency ในฝั่งอ่านทำให้ผู้ใช้ไม่เห็นสิ่งที่ตัวเองเพิ่งเขียน ซึ่งแก้ได้โดยไม่ยุบโครงสร้าง: ใช้ข้อมูลจาก response ของการเขียนแสดงทันที และผูกการอ่านกับ version ของการเขียนล่าสุด (read-your-writes) แทนการหน่วงเวลา การ poll ถี่ หรือบังคับให้สองฝั่งเขียนพร้อมกัน"},{"id":"ARC-S-E-005","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S1","concept":"retry-amplification-budget","mobile":true,"type":"single","stem":"ห่วงโซ่การเรียกคือ แอปมือถือ → API gateway → Order service → Inventory service ทุกชั้นที่เรียกต่อไปตั้ง retry ไว้ 3 ครั้งเมื่อ timeout เมื่อ Inventory ช้าลงเพราะฐานข้อมูลของมันมีปัญหา พบว่าจำนวนคำขอที่ Inventory ได้รับพุ่งขึ้นหลายสิบเท่า และระบบกู้คืนไม่ได้แม้ต้นเหตุเริ่มดีขึ้น ควรปรับอย่างไรจึงตรงปัญหาที่สุด","options":[{"id":"A","text":"เพิ่ม retry เป็น 5 ครั้ง และลด timeout ลงครึ่งหนึ่ง เพื่อให้ลองได้หลายรอบมากขึ้นในเวลาเท่าเดิม","correct":false,"why":"ยิ่งเพิ่มรอบและลด timeout ยิ่งทำให้คำขอที่ปลายทางได้รับทวีคูณมากขึ้น และ timeout ที่สั้นลงทำให้คำขอที่ใกล้สำเร็จถูกตัดแล้วส่งซ้ำ"},{"id":"B","text":"เพิ่มจำนวน instance ของ Inventory เป็นสองเท่าเพื่อรองรับคำขอที่เพิ่มขึ้น","correct":false,"why":"คอขวดอยู่ที่ฐานข้อมูลของ Inventory ซึ่งใช้ร่วมกัน instance ที่มากขึ้นส่งคำขอเข้าไปแย่งฐานข้อมูลเดียวกันมากขึ้น อาจทำให้ช้าลงอีก"},{"id":"C","text":"เปลี่ยนเป็น retry ทันทีโดยไม่เว้นระยะ เพื่อให้คำขอที่ล้มเหลวสำเร็จเร็วที่สุดก่อนผู้ใช้ยกเลิก","correct":false,"why":"การ retry ทันทีส่งคำขอกลับเข้าไปในจังหวะที่ปลายทางกำลังแย่ที่สุด และทุกชั้นทำพร้อมกันจึงเกิดคลื่นคำขอซ้ำที่ซ้อนกัน"},{"id":"D","text":"retry เฉพาะชั้นที่ใกล้ dependency ที่สุด พร้อม backoff, jitter, retry budget และ circuit breaker","correct":true,"why":"ชั้นอื่นไม่คูณจำนวนครั้ง จึงตัดการขยายแบบทวีคูณ (แอป ×4, gateway ×4, Order ×4 ได้ถึง 64 คำขอต่อการกระทำหนึ่งครั้ง) ส่วน jitter, budget และ circuit breaker ให้เวลาปลายทางฟื้นตัว"}],"explanation":"Retry ที่ซ้อนกันหลายชั้นคูณจำนวนคำขอแบบทวีคูณเมื่อปลายทางช้า จึงซ้ำเติมปัญหาที่ต้นเหตุ แนวปฏิบัติคือ retry ที่ชั้นเดียว ใส่ backoff พร้อม jitter จำกัดงบ retry และใช้ circuit breaker ให้ระบบที่เสียหายมีโอกาสฟื้นตัว"},{"id":"ARC-S-E-006","level":"senior","pool":"exam","competency":"Microservices","descriptor":"MS-S4","concept":"mtls-scope-and-limits","mobile":false,"type":"multiple","stem":"ทีมเปิด mutual TLS (mTLS) ระหว่าง service ทั้งหมดใน cluster โดยใช้ใบรับรองที่ออกจาก CA ภายในองค์กร ข้อใดเป็นข้อสรุปที่ถูกต้องเกี่ยวกับสิ่งที่ mTLS ให้และไม่ให้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เมื่อใบรับรองถูกต้อง service ใดใน cluster ก็เรียก endpoint ใดก็ได้อย่างปลอดภัย จึงตัดการตรวจสิทธิ์ระดับ endpoint ออกได้","correct":false,"why":"ใบรับรองพิสูจน์ว่าเป็น service ใด ไม่ได้บอกว่ามีสิทธิ์ทำอะไร service ที่ถูกเจาะก็ยังถือใบรับรองที่ใช้ได้ จึงต้องมีนโยบายว่า service ใดเรียก endpoint ใดได้"},{"id":"B","text":"ฝั่งปลายทางยืนยันตัวตนของ service ผู้เรียกจากใบรับรองได้ และผู้เรียกก็ยืนยันปลายทางได้ ข้อมูลระหว่างทางถูกเข้ารหัส","correct":true,"why":"นี่คือสิ่งที่ mTLS ให้: การพิสูจน์ตัวตนสองทางในระดับ service และช่องทางเข้ารหัส จึงกันการปลอมเป็น service อื่นและการดักข้อมูลในเครือข่าย"},{"id":"C","text":"ควรออกใบรับรองอายุ 5 ปี เพื่อลดความเสี่ยงที่ระบบหมุนเวียนใบรับรองอัตโนมัติจะขัดข้องกลางทาง และลดภาระของทีมที่ต้องตามดูการต่ออายุ","correct":false,"why":"ใบรับรองอายุยาวทำให้ใบที่รั่วไหลใช้ได้นานมาก และการเพิกถอนทำได้ยาก แนวปฏิบัติคืออายุสั้นพร้อมการหมุนเวียนอัตโนมัติที่เชื่อถือได้"},{"id":"D","text":"mTLS ไม่ได้บอกว่าผู้ใช้ปลายทางคนใดเป็นต้นทางของคำขอ ถ้าต้องตัดสินสิทธิ์ตามผู้ใช้ยังต้องมี token หรือ identity ของผู้ใช้อีกชั้น","correct":true,"why":"ใบรับรองระบุ service ไม่ใช่ผู้ใช้ การตัดสินใจเช่น ผู้ใช้คนนี้ดูออเดอร์นี้ได้ไหม ต้องอาศัย identity ของผู้ใช้ เช่น token ที่ส่งต่อมาอย่างปลอดภัย"}],"explanation":"mTLS ให้การพิสูจน์ตัวตนระหว่าง service และการเข้ารหัสของช่องทาง ไม่ใช่ authorization และไม่ใช่ identity ของผู้ใช้ ภายใต้ zero-trust ต้องมีทั้งตัวตนของ service, นโยบายว่าใครเรียกอะไรได้ และ token ของผู้ใช้เมื่อต้องตัดสินสิทธิ์ตามผู้ใช้ พร้อมใบรับรองอายุสั้นที่หมุนเวียนอัตโนมัติ"},{"id":"ARC-S-E-007","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S1","concept":"rpo-rto-dr-choice","mobile":false,"type":"single","stem":"ระบบจองตั๋วต้องมี RPO ไม่เกิน 5 นาที และ RTO ไม่เกิน 1 ชั่วโมง กรณีศูนย์ข้อมูลหลักล่มทั้งแห่ง งบประมาณจำกัดและไม่ต้องการจ่ายค่าโครงสร้างพื้นฐานสองชุดเต็มรูปแบบตลอดเวลา กลยุทธ์ disaster recovery ใดเหมาะสมที่สุด","options":[{"id":"A","text":"สำรองฐานข้อมูลเต็มทุกคืนไปเก็บไว้อีกศูนย์ข้อมูลหนึ่ง และกู้คืนจากชุดสำรองล่าสุดเมื่อเกิดเหตุ","correct":false,"why":"ข้อมูลที่เขียนหลังการสำรองครั้งล่าสุดอาจหายได้ถึงเกือบ 24 ชั่วโมง เกิน RPO 5 นาทีมาก และการกู้ฐานข้อมูลเต็มก็ใช้เวลานาน"},{"id":"B","text":"warm standby ในศูนย์ข้อมูลอื่น: replicate ฐานข้อมูลแบบ asynchronous ต่อเนื่อง พร้อมสภาพแวดล้อมแอปขนาดเล็กที่สเกลขึ้นตอน failover","correct":true,"why":"การ replicate ต่อเนื่องทำให้ข้อมูลที่อาจหายมีเพียงช่วงที่ตามไม่ทัน (วินาทีถึงนาที) และสภาพแวดล้อมที่พร้อมอยู่แล้วทำให้ failover ได้ภายในชั่วโมงด้วยต้นทุนต่ำกว่า active-active"},{"id":"C","text":"active-active หลายศูนย์ข้อมูลที่เขียนได้ทุกที่พร้อมกัน ด้วย consensus แบบ synchronous เพื่อให้ failover ได้ทันทีในทุกกรณี","correct":false,"why":"ให้ RPO ใกล้ศูนย์และ RTO ต่ำมาก แต่เกินกว่าที่โจทย์ต้องการ มีต้นทุนสองชุดเต็มและความซับซ้อนสูง ซึ่งขัดกับเงื่อนไขเรื่องงบ"},{"id":"D","text":"snapshot ดิสก์ทุก 15 นาที และเตรียมสร้างเซิร์ฟเวอร์ใหม่จาก snapshot เมื่อเกิดเหตุ","correct":false,"why":"ช่วง 15 นาทีเกิน RPO 5 นาที และเวลาสร้างเซิร์ฟเวอร์ ติดตั้ง และกู้ข้อมูลทั้งหมดตอนเกิดเหตุคาดการณ์ยากว่าอยู่ใน 1 ชั่วโมง"}],"explanation":"เลือกกลยุทธ์ DR จากตัวเลข RPO/RTO และงบ: backup รายคืนและ snapshot ห่างๆ ไม่ถึง RPO ส่วน active-active เกินความจำเป็นและแพง warm standby ที่ replicate ต่อเนื่องจึงเป็นจุดสมดุลที่โจทย์ต้องการ"},{"id":"ARC-S-E-008","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S1","concept":"cache-stampede-mitigation","mobile":false,"type":"multiple","stem":"เว็บข่าวแคชผลคิวรีหนักของหน้าแรกและหน้าหมวดข่าวกว่า 300 หน้าไว้ใน Redis ด้วย TTL 60 วินาที ทุกครั้งที่ key หมดอายุ จะมีคำขอจำนวนมากพร้อมกันวิ่งไปคำนวณใหม่จากฐานข้อมูล ทำให้ฐานข้อมูลช้าเป็นรอบทุกนาทีตามจังหวะที่ key หมดอายุ แนวทางใดลดปัญหานี้ได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ลด TTL ของทุกหน้าเหลือ 5 วินาที เพื่อให้ข้อมูลสดขึ้น และให้แต่ละ key มีโอกาสหมดอายุในเวลาต่างกันมากขึ้น","correct":false,"why":"key หมดอายุถี่ขึ้น 12 เท่า การคำนวณซ้ำพร้อมกันจึงเกิดบ่อยขึ้น ภาระของฐานข้อมูลโดยรวมเพิ่มขึ้นแทนที่จะลด"},{"id":"B","text":"ให้มีเพียงคำขอเดียวต่อ key ที่ได้สิทธิ์คำนวณใหม่ (lock หรือ single-flight) คำขออื่นรอผลหรือใช้ค่าเดิมไปก่อน","correct":true,"why":"คำนวณซ้ำพร้อมกันกลายเป็นคำนวณครั้งเดียวต่อ key ภาระของฐานข้อมูลไม่ขึ้นกับจำนวนผู้ใช้ที่ขอพร้อมกัน"},{"id":"C","text":"เพิ่ม read replica ของฐานข้อมูลหลายตัวเพื่อกระจายและรับการคำนวณซ้ำที่เกิดขึ้นพร้อมกันได้มากขึ้นในช่วงที่ key หมดอายุ","correct":false,"why":"ซ่อนอาการโดยจ่ายค่ากำลังที่ใช้เพียงชั่วครู่ทุกนาที ปริมาณคำนวณซ้ำซ้อนยังเท่าเดิมและทุกครั้งที่ key หมดอายุยังเกิดซ้ำ"},{"id":"D","text":"ใช้ stale-while-revalidate: ให้ค่าที่เพิ่งหมดอายุกับผู้ใช้ไปก่อน ขณะที่ background งานเดียวรีเฟรชค่าใหม่","correct":true,"why":"ผู้ใช้ไม่ต้องรอการคำนวณ และการรีเฟรชเกิดครั้งเดียวต่อ key จึงไม่มีคลื่นคำขอไปที่ฐานข้อมูล ยอมให้ข้อมูลเก่าได้ช่วงสั้นๆ"},{"id":"E","text":"สุ่มส่วนต่างเล็กน้อย (jitter) ใน TTL ของแต่ละ key เพื่อไม่ให้ key จำนวนมากหมดอายุพร้อมกัน","correct":true,"why":"กระจายการคำนวณใหม่ของ 300 หน้าออกไปตามเวลา ไม่กระจุกในวินาทีเดียว ลดยอดสูงสุดของโหลดบนฐานข้อมูล"}],"explanation":"Cache stampede เกิดเมื่อ key หมดอายุแล้วคำขอจำนวนมากพร้อมกันไปคำนวณใหม่ แก้ที่สองจุด: ลดจำนวนคนที่คำนวณต่อ key (single-flight, stale-while-revalidate) และกระจายเวลาหมดอายุ (jitter) ส่วนการลด TTL หรือเพิ่ม replica ไม่ลดงานที่ซ้ำซ้อนโดยตรง"},{"id":"ARC-S-E-009","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S2","concept":"thai-product-search-architecture","mobile":false,"type":"single","stem":"ระบบค้นหาสินค้า 2 ล้านรายการ ชื่อสินค้าเป็นภาษาไทยปนอังกฤษและไม่มีช่องว่างคั่นคำ (เช่น \"หม้อทอดไร้น้ำมัน\") ผู้ใช้ต้องการค้นด้วยบางส่วนของคำและพิมพ์ผิดเล็กน้อยได้ ปัจจุบันใช้ LIKE ที่มีเครื่องหมาย % นำหน้าในฐานข้อมูลหลัก ช้าเกิน 3 วินาทีช่วงเร่งด่วน และแย่งทรัพยากรกับ transaction ฐานข้อมูลหลักที่ใช้ไม่มีส่วนเสริม full-text ภาษาไทยหรือ n-gram index ในตัว ทีมใช้บริการแบบ managed ได้ ควรเลือกแนวทางใด","options":[{"id":"A","text":"สร้าง B-tree index บนคอลัมน์ชื่อสินค้า เพื่อให้ LIKE ที่มี % นำหน้าใช้ index ได้","correct":false,"why":"B-tree เรียงข้อมูลจากต้นข้อความ เมื่อ % อยู่หน้าคำค้นจึงไม่มีจุดเริ่มให้กระโดดไป ฐานข้อมูลยังต้องไล่อ่านทุกแถวเหมือนเดิม"},{"id":"B","text":"ตัดคำภาษาไทยในแอปก่อนบันทึก เก็บคำที่ตัดแล้วคั่นด้วยช่องว่างในคอลัมน์ใหม่ แล้วค้นด้วย LIKE ต่อไป","correct":false,"why":"การค้นด้วย LIKE ที่มี % ยังไล่อ่านทั้งตารางอยู่ดี และไม่รองรับการพิมพ์ผิดเล็กน้อย การตัดคำด้วยพจนานุกรมก็พลาดคำใหม่หรือชื่อแบรนด์ได้"},{"id":"C","text":"ใช้ search engine แยกที่ตั้งค่า tokenizer ภาษาไทยหรือ n-gram และ fuzzy matching ป้อนข้อมูลจากฐานข้อมูลหลักแบบ asynchronous","correct":true,"why":"ออกแบบมาเพื่อค้นข้อความโดยมี inverted index รองรับบางส่วนของคำและพิมพ์ผิด และย้ายภาระการค้นออกจากฐานข้อมูลธุรกรรม"},{"id":"D","text":"ย้ายข้อมูลสินค้าทั้งหมดไปเก็บใน document database แทนฐานข้อมูล relational เพื่อให้ค้นหาเร็วขึ้นและใช้ระบบเดียวทั้งงานค้นหาและงานสั่งซื้อ","correct":false,"why":"ย้ายทุกอย่างเพื่อแก้ปัญหาการค้นหาอย่างเดียว เสี่ยงและแพง ทั้งยังสูญเสีย transaction และ constraint ที่ระบบสั่งซื้อพึ่งพา และ document database ไม่ได้ค้นภาษาไทยได้ดีในตัวเองเสมอไป"}],"explanation":"เมื่อการค้นหาต้องการความสามารถด้านภาษา (การตัดคำ บางส่วนของคำ พิมพ์ผิด) ที่ฐานข้อมูลธุรกรรมไม่มี ควรแยกเป็นระบบค้นหาที่ออกแบบมาเพื่อสิ่งนั้น แล้วป้อนข้อมูลจากแหล่งหลัก โดยยังคงฐานข้อมูลหลักเป็นความจริงเพียงแห่งเดียว แทนการฝืนทำสิ่งที่เครื่องมือไม่ได้ออกแบบมา"},{"id":"ARC-S-E-010","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S2","concept":"strangler-fig-migration","mobile":false,"type":"multiple","stem":"บริษัทมี monolith ขนาดใหญ่อายุ 8 ปี ที่ต้องแยกบางส่วนออกเป็น service โดยธุรกิจไม่ยอมให้ระบบหยุดให้บริการ และไม่ยอมหยุดพัฒนาฟีเจอร์ใหม่เป็นเวลานาน ทีมกำลังเทียบแนวทางการย้าย ข้อใดเป็นแนวทางที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"หยุดฟีเจอร์ใหม่ทั้งหมดและเขียนระบบใหม่ขนานกับของเก่า แล้วสลับใช้ระบบใหม่ในวันเดียว (big-bang) โดยให้ทีมทั้งหมดย้ายไปทำระบบใหม่จนเสร็จ","correct":false,"why":"ขัดกับเงื่อนไขที่ธุรกิจไม่ยอมหยุดพัฒนาฟีเจอร์ใหม่เป็นเวลานาน และผลงานทั้งหมดไปเห็นผลวันเดียวหลังหลายเดือนหรือหลายปี ความเสี่ยงจึงสะสมทั้งก้อนที่วันตัดสลับ"},{"id":"B","text":"วาง facade หรือ proxy หน้า monolith แล้วค่อยย้ายเส้นทางของความสามารถทีละส่วนไปยัง service ใหม่เมื่อพร้อม (strangler fig)","correct":true,"why":"ผู้ใช้เห็นระบบเดียวตลอด ย้ายเป็นชิ้นเล็กที่ถอยกลับได้ และระบบเก่าค่อยๆ เล็กลงโดยไม่มีวันตัดสลับครั้งใหญ่"},{"id":"C","text":"เลือกแยกความสามารถที่ขอบเขตชัดและเปลี่ยนบ่อยก่อน ให้ service ใหม่เป็นเจ้าของข้อมูลของตัวเอง แล้วทยอยเลิกให้ monolith เขียนข้อมูลส่วนนั้น","correct":true,"why":"ส่วนที่เปลี่ยนบ่อยได้ประโยชน์จากการแยกเร็ว และการย้ายความเป็นเจ้าของข้อมูลทำให้การแยกเป็นจริง ไม่ใช่แค่ย้ายโค้ดแต่ยังใช้ตารางร่วมกัน"},{"id":"D","text":"แยก service ตามชั้นเทคนิค เช่น UI service, business logic service และ data access service เพื่อให้แต่ละทีมดูแลชั้นของตน","correct":false,"why":"การเปลี่ยนฟีเจอร์เดียวต้องแก้ทุกชั้นและเรียกข้ามเครือข่ายหลายต่อ ทำให้ได้ความซับซ้อนของระบบกระจายโดยไม่ได้ความเป็นอิสระของแต่ละ service"}],"explanation":"การย้ายจาก monolith ที่ธุรกิจหยุดไม่ได้ทำแบบค่อยเป็นค่อยไปตามขอบเขตธุรกิจ (strangler fig) ผ่าน facade ที่ทยอยเปลี่ยนเส้นทาง และย้ายความเป็นเจ้าของข้อมูลไปพร้อมกัน ส่วน big-bang และการแบ่งตามชั้นเทคนิคสร้างความเสี่ยงหรือความผูกพันโดยไม่ได้ประโยชน์ของ microservices"},{"id":"ARC-S-E-011","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S3","concept":"state-machine-webhook-ordering","mobile":false,"type":"single","stem":"ระบบชำระเงินรับ webhook จากผู้ให้บริการ (authorized, captured, refunded, failed) ซึ่งอาจมาซ้ำหรือมาสลับลำดับ เช่น refunded มาก่อน captured ทีมต้องตกลงกับ QA และฝ่ายธุรกิจว่าเมื่อคำสั่งชำระเงินอยู่ในขั้นใดแล้วรับ webhook ชนิดใด ระบบต้องตอบสนองอย่างไร มุมมองการออกแบบใดเหมาะกับการสื่อสารเรื่องนี้ที่สุด","options":[{"id":"A","text":"state machine diagram พร้อมตารางทรานซิชันที่อนุญาต และวิธีจัดการ event ที่เกิดนอกลำดับ","correct":true,"why":"แสดงทุกสถานะและทรานซิชันที่ยอมรับได้ในที่เดียว QA เขียนกรณีทดสอบจากทรานซิชันที่อนุญาตและไม่อนุญาตได้ตรงๆ ธุรกิจเห็นกฎและตัดสินใจกรณีนอกลำดับได้"},{"id":"B","text":"ER diagram ของตาราง payments และ payment_events","correct":false,"why":"แสดงโครงสร้างข้อมูลและความสัมพันธ์ของตาราง ไม่ได้บอกว่าสถานะใดเปลี่ยนไปสถานะใดได้ หรือ event ใดถูกยอมรับเมื่อไร"},{"id":"C","text":"component diagram ของ Payment service และผู้ให้บริการภายนอก","correct":false,"why":"แสดงส่วนประกอบและเส้นทางเชื่อมต่อ ไม่ใช่กฎการเปลี่ยนสถานะ และไม่ตอบคำถามเรื่อง event ที่มาสลับลำดับ"},{"id":"D","text":"sequence diagram ของกรณีสำเร็จ (happy path) ตั้งแต่สร้างคำสั่งซื้อจนถึง captured ระหว่างผู้ใช้ Payment service และผู้ให้บริการ","correct":false,"why":"แสดงลำดับที่ควรเกิดในกรณีปกติ แต่ไม่ครอบคลุมกรณีสลับลำดับ ซ้ำ หรือล้มเหลว ซึ่งเป็นประเด็นที่ถามถึง"}],"explanation":"เมื่อคำถามคือกฎว่าสถานะใดเปลี่ยนไปสถานะใดได้และต้องทำอย่างไรกับเหตุการณ์ผิดลำดับ มุมมองเชิงพฤติกรรมที่ตรงที่สุดคือ state machine ซึ่งนิยามขอบเขตของระบบให้ทั้ง QA และฝ่ายธุรกิจใช้ร่วมกัน ส่วน sequence ของ happy path ไม่ครอบคลุมกรณีผิดปกติ"},{"id":"ARC-S-E-012","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S4","concept":"capacity-littles-law","mobile":false,"type":"single","stem":"ทีมจำลองกำลังรองรับของ service ใหม่: คาดว่าช่วงพีคมีคำขอเข้ามา 400 คำขอต่อวินาที เวลาประมวลผลต่อคำขอเฉลี่ย 250 มิลลิวินาที (รวมเวลารอ I/O) แต่ละ worker ประมวลผลได้ครั้งละ 1 คำขอ ต้องการให้ worker ถูกใช้งานเฉลี่ยไม่เกิน 70% เพื่อรับความผันผวนของโหลด ควรกำหนดจำนวน worker อย่างน้อยกี่ตัว","options":[{"id":"A","text":"70 ตัว","correct":false,"why":"ได้จากการคูณ 100 ด้วย 0.7 ซึ่งทิศทางผิด จำนวนคำขอที่อยู่ในระบบพร้อมกันเฉลี่ยคือ 100 ถ้ามีเพียง 70 worker จะรับไม่ทันและคิวยาวขึ้นเรื่อยๆ"},{"id":"B","text":"100 ตัว","correct":false,"why":"เท่ากับจำนวนคำขอที่อยู่ในระบบพร้อมกันเฉลี่ย (400 × 0.25) หมายถึง worker ถูกใช้เต็ม 100% ไม่เหลือที่ว่างรับความผันผวน จึงไม่ผ่านเงื่อนไข 70%"},{"id":"C","text":"143 ตัว","correct":true,"why":"ตาม Little's Law จำนวนคำขอเฉลี่ยในระบบ = อัตราเข้า × เวลาที่อยู่ในระบบ = 400 × 0.25 = 100 เมื่อต้องการใช้งานไม่เกิน 70% จึงต้องมี 100 ÷ 0.7 ≈ 143 ตัว"},{"id":"D","text":"400 ตัว","correct":false,"why":"เท่ากับสมมติให้ worker หนึ่งตัวรับได้ 1 คำขอต่อวินาทีโดยไม่คิดเวลาประมวลผลจริง มากกว่าที่ต้องใช้ราว 2.8 เท่า สิ้นเปลืองทรัพยากร"}],"explanation":"Little's Law (L = λ × W) ใช้ประมาณจำนวนงานที่อยู่ในระบบพร้อมกัน แล้วหารด้วยระดับการใช้งานเป้าหมายเพื่อหาจำนวน worker ที่ต้องมี นี่เป็นการจำลองเบื้องต้นที่ช่วยตัดสินใจก่อนทดสอบโหลดจริง และเตือนว่าที่ 100% utilization คิวจะยาวขึ้นไม่สิ้นสุด"},{"id":"ARC-S-E-013","level":"senior","pool":"exam","competency":"System Design","descriptor":"SD-S5","concept":"refund-spec-refinement","mobile":false,"type":"multiple","stem":"ข้อกำหนดการคืนเงินของร้านค้าเขียนไว้ว่า \"ลูกค้าขอคืนเงินได้ภายใน 7 วันหลังชำระ\" ก่อนส่งให้ทีมพัฒนา ต้องปรับสเปกให้ไม่กำกวม ข้อใดเป็นการปรับที่ทำให้สเปกทดสอบได้ชัดขึ้น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ระบุว่านับ 7 วันจากเวลาที่ชำระสำเร็จ ตัดรอบตามเวลา Asia/Bangkok และระบุว่าวินาทีสุดท้ายของวันที่ 7 อยู่ในสิทธิ์หรือไม่","correct":true,"why":"จุดเริ่มนับ เขตเวลา และค่าขอบเป็นสามเรื่องที่ผู้พัฒนาตีความต่างกันบ่อยที่สุด การระบุพร้อมตัวอย่างทำให้เขียนการทดสอบที่ตัดสินผ่านหรือไม่ผ่านได้ตรงกัน"},{"id":"B","text":"เพิ่มหมายเหตุให้ผู้พัฒนาใช้วิจารณญาณกับกรณีขอบ เพราะนโยบายธุรกิจเปลี่ยนได้เสมอ และให้ทีมทดสอบเขียนกรณีทดสอบจากความเข้าใจของตนภายหลัง","correct":false,"why":"ปล่อยให้แต่ละคนตัดสินใจเองจึงได้พฤติกรรมไม่ตรงกัน และ QA ไม่มีเกณฑ์ที่จะบอกว่าถูกหรือผิด"},{"id":"C","text":"ขยายประโยคเดิมเป็นย่อหน้ายาวที่อธิบายเจตนาของนโยบายคืนเงินและความพึงพอใจของลูกค้าให้ครบถ้วน พร้อมตัวอย่างเรื่องเล่าจากลูกค้าจริง","correct":false,"why":"เจตนาช่วยให้เข้าใจเหตุผล แต่ไม่ได้ระบุวิธีนับหรือกรณีขอบ จึงยังตีความได้หลายทางและเขียนการทดสอบไม่ได้"},{"id":"D","text":"เพิ่มเกณฑ์ยอมรับแบบ Given-When-Then สำหรับกรณี เช่น คืนบางส่วน คำขอคืนซ้ำ และช่องทางที่คืนเงินอัตโนมัติไม่ได้","correct":true,"why":"กรณีเหล่านี้คือจุดที่ระบบจริงพังบ่อย การเขียนเป็นสถานการณ์ที่มีเงื่อนไขและผลลัพธ์ชัดเจนแปลงเป็นกรณีทดสอบได้ทันที"},{"id":"E","text":"ระบุว่า \"ภายใน 7 วัน\" นับตามวันที่ปฏิทินของเซิร์ฟเวอร์ที่ประมวลผลคำขอ โดยใช้เขตเวลาตามค่าตั้งต้นของระบบ","correct":false,"why":"ผลขึ้นกับเขตเวลาของเซิร์ฟเวอร์ ซึ่งอาจเป็น UTC ลูกค้าที่ขอตอนเช้าตรู่เวลาไทยจึงอาจได้ผลต่างจากที่ธุรกิจตั้งใจ และเปลี่ยนไปเมื่อย้ายเซิร์ฟเวอร์"}],"explanation":"สเปกที่ทดสอบได้ต้องตอบ: เริ่มนับเมื่อไร ใช้เขตเวลาไหน ค่าขอบรวมหรือไม่ และกรณีไม่ปกติเป็นอย่างไร การเพิ่มเกณฑ์ยอมรับเชิงสถานการณ์ (Given-When-Then) และตัวอย่างค่าขอบเปลี่ยนข้อความที่กำกวมให้เป็นสัญญาที่ทั้งนักพัฒนาและ QA ใช้ร่วมกัน"},{"id":"ARC-S-E-014","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S1","concept":"category-hierarchy-modeling","mobile":false,"type":"single","stem":"ระบบแค็ตตาล็อกมีหมวดสินค้าแบบต้นไม้ลึกไม่เกิน 6 ระดับ รวม 5,000 หมวด การย้ายหมวดย่อยไปอยู่ใต้หมวดอื่นเกิดเดือนละไม่กี่ครั้ง แต่การดึงสินค้าทุกชิ้นที่อยู่ใต้หมวดหนึ่งรวมหมวดลูกหลานทั้งหมดเกิดหลายพันครั้งต่อนาที ควรเลือกการออกแบบตารางหมวดแบบใด","options":[{"id":"A","text":"เก็บ parent_id อย่างเดียว แล้วให้แอปวนดึงหมวดลูกทีละระดับด้วยหลาย query ทุกครั้งที่ต้องหาสินค้าในหมวด จากนั้นรวมผลในโค้ดของแอป","correct":false,"why":"หนึ่งคำขอต้องยิง query ต่อเนื่องหลายรอบ (สูงสุด 6 ระดับ) ซึ่งเกิดหลายพันครั้งต่อนาที จึงเพิ่มภาระและความหน่วงโดยไม่จำเป็น"},{"id":"B","text":"เก็บรายการ id ของหมวดลูกหลานทั้งหมดคั่นด้วยจุลภาคไว้ในคอลัมน์เดียวของแต่ละหมวด","correct":false,"why":"ฝ่าฝืน first normal form ใช้ JOIN หรือ index กับค่าในนั้นไม่ได้ และการย้ายหมวดต้องแก้ข้อความของหมวดบรรพบุรุษทุกระดับ"},{"id":"C","text":"แยกตารางต่อระดับของต้นไม้ (level1, level2, ... level6) แล้วเชื่อมกันด้วย foreign key","correct":false,"why":"ผูกความลึกของต้นไม้เข้ากับโครงสร้างตาราง การย้ายหมวดข้ามระดับต้องย้ายแถวข้ามตาราง และคำสั่งค้นหาต้อง UNION หลายตาราง"},{"id":"D","text":"closure table: เก็บคู่ (ancestor_id, descendant_id, depth) ของทุกความสัมพันธ์ แล้ว JOIN หาสินค้าทั้งต้นไม้ย่อยด้วยคำสั่งเดียว","correct":true,"why":"การอ่านต้นไม้ย่อยเป็น JOIN ตาม index ที่เร็ว ไม่ต้อง recursive ส่วนต้นทุนอยู่ที่ตอนย้ายหมวดซึ่งต้องแก้แถวความสัมพันธ์ แต่เกิดเดือนละไม่กี่ครั้งตามโจทย์"}],"explanation":"เลือกโครงสร้างต้นไม้จากรูปแบบการใช้งาน: เมื่ออ่านต้นไม้ย่อยถี่มากและย้ายหมวดน้อย การลงทุนเก็บความสัมพันธ์บรรพบุรุษ-ลูกหลานล่วงหน้า (closure table) คุ้มกว่าการไล่ทีละระดับ ส่วนการเก็บรายการในคอลัมน์เดียวหรือแยกตารางต่อระดับสร้างปัญหาด้านความถูกต้องและความยืดหยุ่น"},{"id":"ARC-S-E-015","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S1","concept":"database-enforced-integrity","mobile":false,"type":"multiple","stem":"ระบบสมัครสมาชิกตรวจใน application ว่าอีเมลซ้ำหรือไม่ก่อน INSERT ทุกครั้ง และตรวจสถานะคำสั่งซื้อในโค้ด แต่ในโปรดักชันยังพบอีเมลซ้ำและสถานะที่ไม่ถูกต้องเป็นครั้งคราว ข้อมูลถูกเขียนผ่านทั้ง API งาน import ของอีกทีม และสคริปต์แก้ข้อมูล ข้อใดเป็นการแก้ที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มการตรวจอีเมลซ้ำใน application อีกชั้นหนึ่ง โดยใช้ lock ในโปรเซสระหว่างตรวจกับ INSERT และ retry เมื่อ INSERT ซ้ำ","correct":false,"why":"lock ในโปรเซสไม่มีผลข้าม instance และไม่คุมงาน import กับสคริปต์ที่เขียนข้อมูลโดยไม่ผ่านโค้ดนี้ ช่องว่างระหว่างตรวจกับเขียนจึงยังอยู่"},{"id":"B","text":"เพิ่ม unique constraint บนคอลัมน์อีเมล (ปรับเป็นตัวพิมพ์เล็กก่อนเก็บ) เพราะคำขอสองรายการพร้อมกันอาจผ่านการตรวจใน application ทั้งคู่","correct":true,"why":"ฐานข้อมูลเป็นจุดเดียวที่เห็นทุกการเขียน unique constraint ตัดสินแบบ atomic จึงกัน race ระหว่างตรวจกับเขียน และคุมผู้เขียนทุกทาง"},{"id":"C","text":"เพิ่ม CHECK constraint หรือ foreign key ไปยังตารางสถานะ เพื่อจำกัดค่าสถานะที่เป็นไปได้ในระดับฐานข้อมูล","correct":true,"why":"ค่าสถานะที่ผิดถูกปฏิเสธไม่ว่าจะมาจากผู้เขียนทางใด ไม่พึ่งว่าทุกผู้เขียนจะนำกฎไปใช้ครบ"},{"id":"D","text":"ให้ application จับ constraint violation แล้วแปลงเป็นข้อความที่ผู้ใช้เข้าใจ แทนการพึ่งการตรวจล่วงหน้าอย่างเดียว","correct":true,"why":"การตรวจล่วงหน้ายังมีประโยชน์ต่อประสบการณ์ผู้ใช้ แต่ผลชี้ขาดคือฐานข้อมูล การจัดการ violation ให้เป็นข้อความที่เหมาะสมทำให้ผู้ใช้ไม่เห็นข้อผิดพลาดดิบ"}],"explanation":"การตรวจใน application เป็นเพียงด่านเสริมเพื่อประสบการณ์ผู้ใช้ ความถูกต้องที่ต้องรับประกันต้องอยู่ในฐานข้อมูล (unique, CHECK, foreign key) เพราะเป็นจุดเดียวที่เห็นทุกการเขียน และจัดการ race ได้แบบ atomic โดย application ควรแปลง violation เป็นข้อความที่เหมาะสม"},{"id":"ARC-S-E-016","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S2","concept":"json-column-vs-separate-store","mobile":false,"type":"single","stem":"ตารางคำสั่งซื้อในฐานข้อมูล relational รุ่นปัจจุบันที่ใช้อยู่ต้องเก็บ \"ข้อมูลเพิ่มเติม\" ที่ผู้ให้บริการขนส่งแต่ละรายส่งกลับมา โครงสร้างต่างกันตามผู้ให้บริการและเปลี่ยนบ่อย ข้อมูลรวมประมาณ 20 GB ต้องบันทึกพร้อมกับสถานะคำสั่งซื้อให้สำเร็จหรือล้มเหลวพร้อมกัน ทีมมี 3 คนดูแลฐานข้อมูลเดียว ควรเลือกอย่างไร","options":[{"id":"A","text":"เก็บใน document database แยกต่างหาก แล้วเขียนทั้งสองที่ต่อกันในโค้ดเดียวกัน โดยให้ฐานข้อมูลเดิมเก็บเพียงรหัสอ้างอิงไปยังเอกสารนั้น","correct":false,"why":"ข้อมูลสองฝั่งไม่อยู่ใน transaction เดียวกัน ถ้าเขียนอย่างหนึ่งสำเร็จอีกอย่างล้มเหลว สถานะคำสั่งซื้อกับข้อมูลขนส่งไม่ตรงกัน และทีมเล็กต้องดูแลระบบเพิ่มอีกชุด"},{"id":"B","text":"เพิ่มคอลัมน์ JSON ในฐานข้อมูลเดิมเพื่อเก็บข้อมูลของผู้ให้บริการ และสร้าง index เฉพาะฟิลด์ที่ค้นหาบ่อย","correct":true,"why":"อยู่ใน transaction เดียวกับคำสั่งซื้อ รองรับโครงสร้างที่เปลี่ยนบ่อยโดยไม่ต้องแก้ schema และขนาด 20 GB ไม่เกินความสามารถของฐานข้อมูลเดิม"},{"id":"C","text":"สร้างคอลัมน์แยกต่อฟิลด์ของทุกผู้ให้บริการทุกราย แล้ว ALTER TABLE ทุกครั้งที่มีฟิลด์ใหม่","correct":false,"why":"ตารางกว้างและเต็มไปด้วยค่า NULL เพราะแต่ละผู้ให้บริการใช้เฉพาะบางฟิลด์ และการเปลี่ยนโครงสร้างบ่อยบนตารางใหญ่เสี่ยงต่อ lock และต้องออก migration ทุกครั้ง"},{"id":"D","text":"เก็บเป็นข้อความ (text) ที่ serialize เป็น JSON ไว้ในคอลัมน์เดียว แล้วค้นหาด้วย LIKE","correct":false,"why":"ไม่ได้ประโยชน์จากชนิดข้อมูล JSON ที่ตรวจรูปแบบและ index รายฟิลด์ได้ การค้นด้วย LIKE ช้าและพลาดได้ง่ายเมื่อรูปแบบข้อความเปลี่ยน"}],"explanation":"ข้อมูลกึ่งโครงสร้างที่ต้องสอดคล้องกับธุรกรรมหลักและมีปริมาณระดับปานกลาง ไม่จำเป็นต้องแยกไปเป็นฐานข้อมูลอีกชนิด คอลัมน์ JSON ในฐานข้อมูลเดิมให้ทั้ง transaction เดียวและความยืดหยุ่นของโครงสร้าง ควรแยกเมื่อปริมาณ รูปแบบการเข้าถึง หรือความต้องการด้านการสเกลต่างออกไปจริง"},{"id":"ARC-S-E-017","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S3","concept":"n-plus-one-orm-list","mobile":true,"type":"single","stem":"endpoint รายการคำสั่งซื้อสำหรับหน้าแรกของแอปมือถือด้านล่างตอบช้าประมาณ 1.8 วินาทีบนเซิร์ฟเวอร์ ทั้งที่ทั้งสองตารางมี index ที่เหมาะสมอยู่แล้ว และแต่ละ query ใช้เวลาราว 35 มิลลิวินาที (ส่วนใหญ่เป็นเวลาเดินทางข้ามเครือข่ายไปยังฐานข้อมูล) ควรปรับอย่างไรจึงตรงต้นเหตุที่สุด","code":"const orders = await orderRepo.find({\n  where: { customerId },\n  take: 50,\n});\n\nfor (const order of orders) {\n  order.items = await itemRepo.find({\n    where: { orderId: order.id },\n  });\n}\n\nreturn orders;","codeLang":"typescript","options":[{"id":"A","text":"ดึงรายการสินค้าของทั้ง 50 คำสั่งซื้อด้วย query เดียว (WHERE order_id IN ...) หรือ JOIN แล้วจัดกลุ่มตามคำสั่งซื้อในโค้ด","correct":true,"why":"จำนวน query ลดจาก 51 เหลือ 2 จึงลดจำนวนรอบเดินทางข้ามเครือข่ายซึ่งเป็นต้นทุนหลักของแต่ละ query (51 × 35 มิลลิวินาที ≈ 1.8 วินาที)"},{"id":"B","text":"เพิ่ม index แบบ composite บน order_items โดยรวมคอลัมน์อื่นอีกหลายตัวเพื่อให้ query รายการสินค้าเร็วขึ้น ทั้งที่ตอนนี้มี index บน order_id อยู่แล้ว","correct":false,"why":"เวลาต่อ query ถูกใช้ไปกับการเดินทางข้ามเครือข่ายเป็นหลัก ไม่ใช่การค้นหาในตาราง index เพิ่มจึงแทบไม่ลดเวลา และทำให้การเขียนช้าลง"},{"id":"C","text":"เปลี่ยน loop เป็น Promise.all ยิงทั้ง 50 query พร้อมกัน","correct":false,"why":"ลดเวลารอของคำขอเดียวได้ แต่จำนวน query ยังเท่าเดิมและขอ connection พร้อมกัน 50 ตัวต่อคำขอ เมื่อมีผู้ใช้จำนวนมากอาจทำให้ pool หมดและช้าลงทั้งระบบ"},{"id":"D","text":"เพิ่ม connection pool เป็นสองเท่า เพื่อให้ query รันได้เร็วขึ้น","correct":false,"why":"loop นี้รัน query ทีละตัวตามลำดับ จึงใช้ connection เพียงตัวเดียวต่อคำขอ pool ที่ใหญ่ขึ้นไม่ทำให้แต่ละรอบเร็วขึ้น"}],"explanation":"รูปแบบ N+1 (query รายการหลักหนึ่งครั้ง แล้ว query ลูกทีละรายการ) ทำให้ต้นทุนโตตามจำนวนแถว แม้แต่ละ query จะเร็ว วิธีแก้ที่ตรงต้นเหตุคือลดจำนวนรอบ ด้วยการดึงข้อมูลลูกแบบเป็นชุด (IN หรือ JOIN) ไม่ใช่เพิ่ม index หรือปรับความขนาน"},{"id":"ARC-S-E-018","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S3","concept":"keyset-pagination-feed","mobile":true,"type":"multiple","stem":"ฟีดโพสต์ของแอปมือถือแบบเลื่อนลงเรื่อยๆ ใช้ API แบบ OFFSET/LIMIT เรียงตาม created_at จากใหม่ไปเก่า ตารางมี 50 ล้านแถว พบว่าหน้าที่เลื่อนลึกๆ ช้ามาก และเมื่อมีโพสต์ใหม่แทรกเข้ามาระหว่างที่ผู้ใช้กำลังเลื่อน ผู้ใช้เห็นโพสต์ซ้ำ แนวทางใดช่วยแก้ได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ใช้ keyset (cursor) pagination: ส่ง (created_at, id) ของแถวสุดท้ายกลับไปเป็น cursor แล้วขอหน้าถัดไปด้วยเงื่อนไขที่เทียบกับค่านั้น","correct":true,"why":"ฐานข้อมูลกระโดดไปที่จุดต่อโดยตรงแทนการนับข้ามแถวทั้งหมดที่ผ่านมา และโพสต์ใหม่ที่แทรกด้านบนไม่ทำให้ตำแหน่งของหน้าถัดไปเลื่อน"},{"id":"B","text":"เพิ่ม LIMIT ต่อหน้าจาก 20 เป็น 1,000 เพื่อให้ผู้ใช้เลื่อนถึงหน้าลึกๆ ได้ด้วยจำนวนคำขอน้อยลง","correct":false,"why":"ข้อมูลต่อคำขอใหญ่ขึ้นมากบนเครือข่ายมือถือ และยังต้องข้ามแถวจำนวนมากเมื่อ OFFSET ลึก ปัญหาโพสต์ซ้ำก็ยังอยู่"},{"id":"C","text":"สร้าง index ตามคอลัมน์ที่ใช้เรียงและเทียบใน cursor คือ (created_at, id) เพื่อให้หาจุดเริ่มของหน้าถัดไปได้โดยตรง","correct":true,"why":"ถ้าไม่มี index ที่ตรงกับลำดับการเรียง การหาจุดต่อยังต้องสแกนและเรียงใหม่ ประโยชน์ของ keyset จึงเกิดเมื่อมี index รองรับ"},{"id":"D","text":"คำนวณ COUNT(*) ของทั้งตารางทุกคำขอ เพื่อให้แอปคำนวณ OFFSET ของหน้าที่เหลือได้ถูกต้อง แล้วส่งจำนวนแถวทั้งหมดกลับไปกับทุกหน้า","correct":false,"why":"การนับ 50 ล้านแถวทุกคำขอทำให้ช้าลงอีก และไม่แก้การข้ามแถวหรือโพสต์ซ้ำเมื่อมีโพสต์ใหม่แทรก"},{"id":"E","text":"ใส่ id เป็นตัวตัดสินลำดับ (tie-breaker) เมื่อ created_at ซ้ำกัน เพื่อไม่ให้แถวตกหล่นหรือซ้ำข้ามหน้า","correct":true,"why":"ถ้ามีหลายโพสต์เวลาเดียวกัน ลำดับที่ไม่แน่นอนทำให้ขอบเขตหน้าเลื่อนไปมาระหว่างคำขอ การเรียงด้วยคีย์ที่ไม่ซ้ำทำให้ cursor ชี้ตำแหน่งได้ชัดเจน"}],"explanation":"OFFSET ต้องข้ามแถวทั้งหมดก่อนถึงหน้า ยิ่งลึกยิ่งช้า และไม่ทนต่อข้อมูลที่เปลี่ยนระหว่างเลื่อน Keyset pagination ใช้ค่าของแถวสุดท้ายเป็นจุดต่อ ต้องคู่กับ index ที่ตรงกับลำดับเรียง และคีย์ที่ไม่ซ้ำเป็นตัวตัดสินลำดับ เหมาะกับฟีดแบบเลื่อนไม่สิ้นสุดบนมือถือ"},{"id":"ARC-S-E-019","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S4","concept":"large-table-migration-lock","mobile":false,"type":"single","stem":"ทีมเพิ่มคอลัมน์ NOT NULL พร้อมค่า default ในตาราง transactions ที่มี 120 ล้านแถว ใน staging (ข้อมูล 50,000 แถว) migration ใช้เวลา 1 วินาที แต่เมื่อรัน migration เดียวกันบนโปรดักชัน คำสั่งเขียนทั้งหมดค้างนานหลายนาที ควรปรับกระบวนการอย่างไร","options":[{"id":"A","text":"รัน migration ตอนตี 3 ที่ traffic ต่ำที่สุดของวัน โดยคงคำสั่ง ALTER เดิมที่ใช้ทดสอบบน staging ไว้ทุกประการ","correct":false,"why":"ผู้ใช้น้อยลงแต่คำสั่งเขียนที่เข้ามายังค้างตลอดช่วงที่ตารางถูกล็อก และงานกลางคืนอย่างรายงานหรือ batch ก็ยังกระทบ ต้นเหตุคือวิธีที่ล็อกตารางนานไม่ได้หายไป"},{"id":"B","text":"ตั้ง timeout ของ migration ให้ยาวขึ้นเป็น 30 นาที เพื่อไม่ให้คำสั่งถูกยกเลิกกลางคันระหว่างที่ทำงานกับตารางขนาดใหญ่","correct":false,"why":"timeout ที่ยาวขึ้นเพียงยอมให้ล็อกอยู่นานขึ้น ไม่ได้ลดเวลาที่คำสั่งเขียนต้องรอ ผู้ใช้ยังเจอระบบค้างเหมือนเดิม"},{"id":"C","text":"เพิ่ม RAM และ IOPS ของ instance ฐานข้อมูลก่อนรัน เพื่อให้ ALTER เสร็จเร็วขึ้น","correct":false,"why":"อาจลดเวลาได้บ้าง แต่งานยังแปรผันตามจำนวนแถวและยังต้องล็อกตารางในช่วงนั้น ทั้งยังเสียค่าใช้จ่ายและเวลาปรับขนาด"},{"id":"D","text":"ทดสอบกับข้อมูลขนาดใกล้โปรดักชัน แล้วแยกขั้น: เพิ่มคอลัมน์ nullable, backfill เป็นชุด, ค่อยบังคับ NOT NULL หรือใช้ online schema change","correct":true,"why":"การทดสอบด้วยข้อมูลจริงขนาดเดียวกันเผยเวลาล็อกที่ staging ไม่เห็น และการแบ่งเป็นขั้นเล็กๆ ทำให้แต่ละขั้นล็อกสั้นหรือไม่ล็อกการเขียนเลย"}],"explanation":"เวลาของ migration ใน staging ที่ข้อมูลน้อยไม่ใช่ตัวแทนของโปรดักชัน ตารางใหญ่เปลี่ยนโครงสร้างต้องทดสอบด้วยขนาดจริง และแตกเป็นขั้นที่ล็อกสั้น (เพิ่มแบบ nullable, backfill เป็นชุด, ค่อยบังคับ constraint) หรือใช้ online schema change การเลือกเวลารันหรือเพิ่มทรัพยากรไม่แก้ที่ต้นเหตุ"},{"id":"ARC-S-E-020","level":"senior","pool":"exam","competency":"Database Design","descriptor":"DB-S4","concept":"migration-rollback-strategy","mobile":false,"type":"multiple","stem":"ทีมใช้ migration แบบ versioned (ไฟล์ตามลำดับ) ร่วมกับ deploy แบบ rolling ปัญหาคือ release ล่าสุดมี migration ที่ลบคอลัมน์ซึ่งโค้ดเวอร์ชันก่อนหน้ายังใช้อยู่ เมื่อต้อง rollback โค้ด ระบบพัง ข้อใดเป็นแนวปฏิบัติที่ควรใช้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แยกการลบคอลัมน์ไปไว้ใน release หลังจากโค้ดที่เลิกใช้คอลัมน์นั้นเสถียรแล้ว เพื่อให้เวอร์ชันก่อนหน้ายังทำงานกับ schema ปัจจุบันได้","correct":true,"why":"schema ที่เปลี่ยนต้องเข้ากันได้กับทั้งโค้ดใหม่และโค้ดเวอร์ชันก่อนหน้าที่อาจต้องย้อนกลับไป การลบทีหลังเป็นขั้นสุดท้ายหลังมั่นใจว่าไม่ต้องย้อนแล้ว"},{"id":"B","text":"เขียน down migration ของทุกไฟล์ให้ย้อนกลับด้วยสคริปต์ และ rollback ได้ทุกกรณีรวมถึง DROP COLUMN เพราะ down จะสร้างคอลัมน์กลับมา","correct":false,"why":"down สร้างโครงสร้างคอลัมน์กลับมาได้ แต่ข้อมูลในคอลัมน์ที่ถูกลบหายไปแล้วถาวร จึงไม่ใช่การย้อนกลับที่แท้จริง"},{"id":"C","text":"ห้ามแก้ไฟล์ migration ที่รันไปแล้วในสภาพแวดล้อมใดๆ (ตรวจด้วย checksum) หากต้องแก้ให้เพิ่ม migration ใหม่ต่อท้าย","correct":true,"why":"ประวัติที่เปลี่ยนไม่ได้ทำให้ทุกสภาพแวดล้อมไล่ถึง schema เดียวกันจากลำดับเดียวกัน เครื่องมือตรวจ checksum ช่วยจับการแก้ไฟล์ย้อนหลังที่ทำให้ schema ต่างกัน"},{"id":"D","text":"แก้ไฟล์ migration เดิมที่มีปัญหา แล้ว deploy ใหม่ให้ทุกสภาพแวดล้อมรันไฟล์ที่แก้แล้ว เพื่อให้ประวัติของทุกที่เหมือนกัน","correct":false,"why":"สภาพแวดล้อมที่รันไฟล์เดิมไปแล้วจะไม่รันซ้ำ จึงได้ schema ต่างจากที่รันไฟล์ใหม่ และเครื่องมือที่ตรวจ checksum จะปฏิเสธด้วย"}],"explanation":"ในการ deploy แบบ rolling และต้องย้อนโค้ดได้ ให้เปลี่ยน schema แบบเข้ากันได้ย้อนหลัง (ลบของเก่าใน release หลัง) และถือประวัติ migration เป็นสิ่งที่เปลี่ยนไม่ได้: แก้ด้วยการเพิ่มไฟล์ใหม่ ไม่แก้ไฟล์เก่า และอย่าเชื่อว่า down migration กู้ข้อมูลที่ถูกลบกลับมาได้"}]}},"competencies":["Microservices","System Design","Database Design"],"descriptorCompetency":{"MS-J1":"Microservices","MS-J2":"Microservices","MS-J3":"Microservices","SD-J1":"System Design","SD-J2":"System Design","SD-J3":"System Design","SD-J4":"System Design","DB-J1":"Database Design","DB-J2":"Database Design","DB-J3":"Database Design","DB-J4":"Database Design","MS-S1":"Microservices","MS-S2":"Microservices","MS-S3":"Microservices","MS-S4":"Microservices","SD-S1":"System Design","SD-S2":"System Design","SD-S3":"System Design","SD-S4":"System Design","SD-S5":"System Design","DB-S1":"Database Design","DB-S2":"Database Design","DB-S3":"Database Design","DB-S4":"Database Design"}}</script>
<script type="application/json" id="review-data">{"version":1,"levels":{"junior":[{"descriptor":"MS-J1","competency":"Microservices","title":"แนวคิด Microservices เทียบกับ Monolith","summary":"Microservices คือการแบ่งระบบเป็นบริการเล็ก ๆ ที่ deploy และปรับขนาดแยกกันได้ ส่วน monolith คือระบบก้อนเดียว ต้องเข้าใจทั้งข้อดีและต้นทุนเพื่อเลือกสถาปัตยกรรมให้เหมาะกับบริบทของทีม","keyPoints":["Monolith คือแอปที่ build และ deploy เป็นหน่วยเดียว โค้ดทุกส่วนรันใน process เดียวกัน ข้อดีคือพัฒนา ทดสอบ และ debug ง่าย การเรียกระหว่างโมดูลเป็น function call ในหน่วยความจำ","Microservices คือบริการขนาดเล็กหลายตัว แต่ละตัวรับผิดชอบความสามารถทางธุรกิจหนึ่งอย่าง deploy แยกกัน สื่อสารกันผ่านเครือข่าย (HTTP/REST, gRPC หรือ messaging)","ข้อดีของ microservices: deploy อิสระ ปรับขนาดเฉพาะส่วนที่โหลดสูง เลือกเทคโนโลยีต่างกันได้ตามงาน ความล้มเหลวของบริการหนึ่งถูกจำกัดขอบเขตได้ถ้าออกแบบดี และแบ่งทีมเป็นเจ้าของบริการได้","ต้นทุนของ microservices: ระบบกระจาย (distributed system) ซับซ้อนขึ้น ต้องจัดการ network latency, partial failure, data consistency ข้ามบริการ, การ debug และ monitoring ข้ามบริการ รวมถึงภาระด้าน deploy/operations ที่เพิ่มขึ้น","การเรียกที่เคยเป็น in-process function call จะกลายเป็น network call ที่ช้ากว่าและล้มเหลวได้ ต้องลดจำนวนการเรียกข้ามบริการต่อหนึ่งคำขอและเตรียมจัดการ error ทุกครั้ง","Monolith-first: ทีมเล็กหรือ product ใหม่ที่ requirement ยังเปลี่ยนบ่อยมักเริ่มด้วย modular monolith (แบ่งโมดูลชัดเจนในโค้ดเดียว) แล้วค่อยแยกเป็นบริการเมื่อมีเหตุผลที่วัดได้","เหตุผลที่ดีในการแยกบริการ: ส่วนนั้นต้องปรับขนาดต่างจากส่วนอื่น, ทีมต้อง deploy ด้วยจังหวะของตัวเอง, มีขอบเขตธุรกิจ (bounded context) ที่ชัดเจน, ต้องการ isolation ของความล้มเหลวหรือเทคโนโลยีเฉพาะ","เหตุผลที่ไม่ดี: แยกเพราะแค่ตามกระแส, เพราะโค้ดใหญ่อย่างเดียว, หรือแยกส่วนที่ต้องเปลี่ยนข้อมูลร่วมกันแบบ transaction เดียวกันตลอดเวลา (จะกลายเป็น distributed monolith ที่มีข้อเสียของทั้งสองแบบ)","Distributed monolith คืออาการที่บริการแยกกันทางกายภาพแต่ผูกกันแน่น (deploy ต้องพร้อมกัน, ใช้ฐานข้อมูลเดียวกัน) จึงไม่ได้ประโยชน์ของ microservices","หลักการเด่นของ microservices: high cohesion, loose coupling, แต่ละบริการเป็นเจ้าของข้อมูลตัวเอง (database per service) และสื่อสารผ่าน API ที่กำหนดไว้ชัดเจนเท่านั้น"],"examFocus":["ถ้าเจอทีมเล็ก/ผลิตภัณฑ์ใหม่/requirement เปลี่ยนบ่อย/ยังไม่มีทีม DevOps ให้เลือก monolith (หรือ modular monolith) ก่อน","ถ้าเจอโจทย์ว่าหลังแยกบริการแล้วระบบช้าลงหรือมี connection error ให้นึกถึง network call แทน in-process call และลดจำนวน call ข้ามบริการ","ถ้าโจทย์ถามเหตุผลที่สมควรแยกบริการ ให้เลือกข้อที่เกี่ยวกับ scale ต่างกัน ทีม/รอบ deploy อิสระ และขอบเขตที่ชัด ไม่ใช่ขนาดโค้ดหรือกระแส","ถ้าโจทย์ให้เลือกข้อเท็จจริงเกี่ยวกับการเปรียบเทียบ ให้เลือกทั้งข้อดี (deploy แยก, scale เฉพาะส่วน) และข้อแลกเปลี่ยน (ความซับซ้อน, debug ยาก) อย่างสมดุล","ถ้าเจอข้อความที่บอกว่า microservices ดีกว่า monolith เสมอ ให้ถือว่าผิด เพราะขึ้นกับบริบท"],"pitfalls":["คิดว่า microservices เร็วกว่าเสมอ ความจริงการเรียกผ่านเครือข่ายช้ากว่า function call และเพิ่มจุดล้มเหลว","คิดว่าแยกบริการแล้วจะใช้ฐานข้อมูลเดียวกันก็ได้ วิธีนี้ทำให้ผูกกันผ่านข้อมูล เสีย independence","คิดว่า monolith คือสถาปัตยกรรมที่ล้าสมัย ความจริงเป็นตัวเลือกที่เหมาะกับหลายบริบท โดยเฉพาะทีมเล็ก","แยกตามชั้นเทคนิค (UI service, DB service) แทนที่จะแยกตามความสามารถทางธุรกิจ ทำให้ทุก feature ต้องแก้หลายบริการ"]},{"descriptor":"MS-J2","competency":"Microservices","title":"สร้าง Microservice ง่าย ๆ ตามความต้องการธุรกิจ","summary":"การลงมือทำบริการเล็ก ๆ ให้ถูกหลัก: กำหนดขอบเขตตามธุรกิจ เปิด API ที่ชัดเจน เป็นเจ้าของข้อมูลของตัวเอง และมี health check ให้ระบบ deploy ตรวจสอบได้","keyPoints":["กำหนดขอบเขตบริการตาม business capability หรือ bounded context (เช่น Order, Payment, Inventory) ไม่ใช่ตามชั้นเทคนิค","แต่ละบริการเป็นเจ้าของข้อมูลของตัวเอง (database per service) บริการอื่นต้องขอข้อมูลผ่าน API ของเจ้าของ ห้ามอ่านตารางของบริการอื่นตรง ๆ","API Gateway เป็นจุดเข้าเดียว (single entry point) ให้ client ทำหน้าที่ routing, authentication, rate limiting, TLS termination และอาจ aggregate หลายบริการ ช่วยให้ client ไม่ต้องรู้ที่อยู่ของแต่ละบริการ","Gateway ต้องไม่ใส่ business logic หนัก ๆ และต้องระวังเป็น single point of failure จึงควรรันหลาย instance","Health check endpoint เช่น `/health`: liveness บอกว่า process ยังทำงานอยู่ (ถ้าไม่ผ่านให้ restart) ส่วน readiness บอกว่าพร้อมรับ traffic แล้วหรือยัง (เช่น เชื่อมต่อ DB ได้ ถ้าไม่ผ่านให้เอาออกจาก load balancer โดยไม่ restart)","ใน Kubernetes มี livenessProbe, readinessProbe และ startupProbe ตามลำดับหน้าที่ดังกล่าว","API เป็นสัญญา (contract) ระหว่างบริการ การเปลี่ยนแปลงต้อง backward compatible: เพิ่ม field ใหม่แบบ optional หรือเพิ่ม endpoint ใหม่ได้ ส่วนการลบ/เปลี่ยนชื่อ field หรือเปลี่ยนชนิดข้อมูลเป็น breaking change","ถ้าต้องทำ breaking change ให้ออกเวอร์ชันใหม่ (เช่น `/v2/orders`) แล้วคงเวอร์ชันเก่าไว้ช่วงหนึ่งก่อนเลิกใช้ (deprecation)","ใช้ REST conventions: ชื่อ resource เป็นคำนามพหูพจน์ (`/orders/42`), HTTP method ตามความหมาย (GET อ่าน, POST สร้าง, PUT/PATCH แก้, DELETE ลบ) และ status code ที่ถูกต้อง (201 Created, 404 Not Found, 400 Bad Request)","Config ที่เปลี่ยนตาม environment (URL ของ DB, secret) ต้องแยกออกจากโค้ด ใช้ environment variable หรือ config service (หลักการ twelve-factor app) และห้าม hardcode secret"],"examFocus":["ถ้าเจอโจทย์ให้แบ่งบริการจากกระบวนการธุรกิจ ให้แบ่งตามความสามารถทางธุรกิจ ไม่ใช่ตามเทคนิค","ถ้าบริการ A ต้องการข้อมูลของบริการ B ให้เรียกผ่าน API ของ B (หรือรับ event) ไม่ใช่ query ฐานข้อมูลของ B","ถ้าโจทย์ถามว่า client หลายชนิดต้องเรียกหลายบริการจะลดความซับซ้อนอย่างไร ให้ตอบ API Gateway","ถ้าเจอ container ที่ start แล้วแต่ยังต่อ DB ไม่ได้ ให้ใช้ readiness check เพื่อไม่ส่ง traffic เข้าไปก่อน","ถ้าต้องเพิ่ม field ใน response โดยไม่ให้ client เดิมพัง ให้เพิ่มเป็น optional field แบบ additive ไม่ลบหรือเปลี่ยนชื่อของเดิม"],"pitfalls":["ให้หลายบริการแชร์ตารางเดียวกันเพื่อความง่าย ทำให้เปลี่ยน schema ครั้งหนึ่งกระทบหลายทีม","ใช้ liveness check ตรวจ dependency ภายนอก ทำให้ DB ล่มแล้วบริการถูก restart วนโดยไม่จำเป็น","คิดว่าเปลี่ยนชื่อ field ใน JSON ที่ตอบกลับเป็นแค่การปรับปรุงภายใน แต่ความจริงเป็น breaking change ของ client","ใส่ business logic ทั้งหมดไว้ใน API Gateway ทำให้ gateway กลายเป็น monolith ตัวใหม่"],"example":{"lang":"typescript","code":"import express from 'express';\nconst app = express();\n\n// liveness: process ยังทำงานอยู่\napp.get('/health/live', (_req, res) => res.status(200).json({ status: 'up' }));\n\n// readiness: พร้อมรับ traffic เมื่อ DB ต่อได้\napp.get('/health/ready', async (_req, res) => {\n  try {\n    await db.ping();\n    res.status(200).json({ status: 'ready' });\n  } catch {\n    res.status(503).json({ status: 'not-ready' });\n  }\n});\n\napp.listen(3000);"}},{"descriptor":"MS-J3","competency":"Microservices","title":"เรียกบริการผ่าน HTTP และจัดการ Error พื้นฐาน","summary":"การเรียกบริการอื่นผ่านเครือข่ายล้มเหลวได้เสมอ ต้องตั้ง timeout, เลือก retry เฉพาะกรณีที่ปลอดภัย, ทำ fallback และตอบ error ให้ผู้เรียกนำไปจัดการต่อได้","keyPoints":["ต้องตั้ง timeout ทุกครั้งที่เรียก HTTP (ทั้ง connect timeout และ read/response timeout) ถ้าไม่ตั้ง thread หรือ connection อาจค้างรอไม่สิ้นสุดจนทรัพยากรหมดและล้มต่อกันเป็นลูกโซ่","ความหมายของ status code: 2xx สำเร็จ, 4xx ความผิดพลาดฝั่ง client, 5xx ความผิดพลาดฝั่ง server","Retry ได้เฉพาะความล้มเหลวชั่วคราว (transient) เช่น timeout, connection reset, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout, 429 Too Many Requests (ควรเคารพ header `Retry-After`) และ 408 Request Timeout","ไม่ควร retry 4xx ที่เกิดจากคำขอผิด เช่น 400, 401, 403, 404, 422 เพราะลองซ้ำก็ได้ผลเดิม","Retry ต้องมี exponential backoff (รอนานขึ้นเรื่อย ๆ เช่น 1s, 2s, 4s) ร่วมกับ jitter (สุ่มเวลาเพิ่มเล็กน้อย) และจำกัดจำนวนครั้งสูงสุด เพื่อไม่ให้ทุก client ยิงซ้ำพร้อมกันจนเซิร์ฟเวอร์ที่กำลังแย่ล้มหนักขึ้น","Retry อย่างปลอดภัยได้กับ method ที่ idempotent (GET, PUT, DELETE) ส่วน POST ที่สร้างข้อมูลหรือตัดเงินควร retry เมื่อมี idempotency key เท่านั้น มิฉะนั้นอาจสร้างซ้ำ","Graceful degradation / fallback: เมื่อบริการที่พึ่งพาล่ม ให้ตอบแบบลดความสามารถแทนที่จะล้มทั้งหน้า เช่น ใช้ข้อมูลจาก cache, ค่า default หรือซ่อนส่วนที่ไม่สำคัญ (เช่น ระบบแนะนำสินค้า)","Circuit breaker คือกลไกที่หยุดเรียกบริการที่ล้มเหลวต่อเนื่องชั่วคราว มี 3 สถานะ: closed (ปกติ), open (ตัดการเรียกและ fail fast), half-open (ลองส่งบางคำขอเพื่อตรวจว่าฟื้นหรือยัง)","Error response ที่ดีควรมี status code ที่ถูกต้อง, รหัส error ที่เครื่องอ่านได้ (error code), ข้อความอธิบายที่คนอ่านเข้าใจ และ correlation/request ID เพื่อใช้ตามรอย ห้ามเปิดเผย stack trace หรือข้อมูลภายใน","ควร log ความล้มเหลวพร้อมบริบท (URL ปลายทาง, เวลาที่ใช้, จำนวนครั้งที่ retry) เพื่อให้ตามหาสาเหตุได้"],"examFocus":["ถ้าบริการปลายทางช้ามากแล้วบริการเราค้างตาม ให้ตั้ง timeout (และอาจเพิ่ม circuit breaker)","ถ้าโจทย์ให้เลือก status code ที่ควร retry ให้เลือก 502/503/504/429 ไม่ใช่ 400/404/422","ถ้า retry แล้วทำให้เซิร์ฟเวอร์ที่ล่มอยู่ล้มหนักขึ้น ให้ใช้ exponential backoff + jitter + จำกัดจำนวนครั้ง","ถ้าส่วนประกอบรองล่ม (เช่น รีวิวสินค้า) แต่ฟังก์ชันหลักควรใช้ได้ ให้ทำ fallback แล้วแสดงหน้าที่เหลือต่อ","ถ้าโจทย์ถามเนื้อหาของ error response ให้เลือกคำตอบที่มี code, message ที่ชัด และ request ID โดยไม่เปิดเผยรายละเอียดภายใน"],"pitfalls":["retry ทันทีและไม่จำกัดจำนวน เป็นการทำ DDoS ตัวเองให้บริการปลายทาง","retry POST ตัดเงินโดยไม่มี idempotency key เสี่ยงตัดเงินซ้ำ","ตอบ 200 พร้อม error ใน body ทำให้ client และ monitoring แยกความล้มเหลวไม่ออก","ส่ง stack trace กลับไปให้ client เป็นการรั่วไหลข้อมูลภายในระบบ"],"example":{"lang":"typescript","code":"async function getWithRetry(url: string, max = 3): Promise<Response> {\n  for (let attempt = 0; attempt <= max; attempt++) {\n    try {\n      const res = await fetch(url, { signal: AbortSignal.timeout(2000) });\n      if (![502, 503, 504, 429].includes(res.status)) return res;\n    } catch {\n      // timeout หรือ network error: ลองใหม่ได้\n    }\n    if (attempt === max) break;\n    const delay = 2 ** attempt * 500 + Math.random() * 200; // backoff + jitter\n    await new Promise((r) => setTimeout(r, delay));\n  }\n  throw new Error('upstream unavailable');\n}"}},{"descriptor":"SD-J1","competency":"System Design","title":"ออกแบบส่วนประกอบด้วย Design Pattern และ Class Diagram","summary":"ใช้ design pattern มาตรฐานและแผนภาพ UML พื้นฐานเพื่อออกแบบส่วนประกอบที่แยกหน้าที่ชัดเจน แก้ไขและทดสอบง่าย","keyPoints":["Class diagram ใช้แสดง class, attribute, method และความสัมพันธ์ ความสัมพันธ์หลัก: association (เชื่อมกัน), aggregation (has-a แบบหลวม ส่วนประกอบอยู่ได้เองถ้าเจ้าของหายไป สัญลักษณ์ข้าวหลามตัดกลวง), composition (has-a แบบเป็นเจ้าของ ส่วนประกอบหายไปพร้อมเจ้าของ สัญลักษณ์ข้าวหลามตัดทึบ)","Inheritance (generalization) ใช้ลูกศรหัวสามเหลี่ยมกลวงเส้นทึบ, realization/implements interface ใช้เส้นประหัวสามเหลี่ยมกลวง, dependency ใช้ลูกศรเส้นประ","Layered architecture: presentation (UI/controller), business/service (กฎธุรกิจ), data access (repository) โดยชั้นบนเรียกชั้นล่างเท่านั้น กฎธุรกิจต้องไม่อยู่ใน UI","แยก UI ออกจาก logic (เช่น MVC, MVVM) ทำให้ใช้ logic ร่วมกันได้ระหว่างเว็บและมือถือ และทดสอบ logic โดยไม่ต้องมี UI","Strategy pattern: นิยามกลุ่มอัลกอริทึมที่สลับกันได้ผ่าน interface เดียว (เช่น วิธีคิดค่าจัดส่งหลายแบบ) ช่วยเลี่ยง if/else ยาว ๆ และเพิ่มแบบใหม่โดยไม่แก้โค้ดเดิม (Open/Closed)","Observer pattern: subject แจ้งผู้สนใจ (observer) หลายตัวเมื่อสถานะเปลี่ยน โดย subject ไม่ต้องรู้รายละเอียดของ observer เช่น เมื่อออเดอร์ถูกสร้างให้ส่งอีเมล แจ้งเตือน และตัดสต็อก","Adapter pattern: ห่อ (wrap) API ที่ interface ไม่ตรงกับที่ระบบต้องการ เช่น SDK ของบุคคลที่สามเพื่อให้ระบบพึ่ง interface ของเราเอง เปลี่ยนผู้ให้บริการได้โดยแก้จุดเดียว","Factory ซ่อนการสร้าง object, Singleton จำกัดให้มี instance เดียว (ใช้อย่างระมัดระวัง ทดสอบยาก), Facade ให้ interface ง่ายหน้าระบบย่อยที่ซับซ้อน, Decorator เพิ่มพฤติกรรมให้ object โดยไม่แก้ class","หลักการ SOLID: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion (พึ่งพา abstraction ไม่ใช่ concrete class)","Component ที่ดีควร self-contained: high cohesion, low coupling, interface ชัดเจน, ซ่อนรายละเอียดภายใน (encapsulation) และใช้ dependency injection แทนการสร้าง dependency เองภายใน"],"examFocus":["ถ้าเจอโจทย์ที่ส่วนประกอบมีชีวิตอยู่ไม่ได้ถ้าไม่มีเจ้าของ (เช่น ออเดอร์กับรายการสินค้าในออเดอร์) ให้นึกถึง composition","ถ้ามีเงื่อนไขหลายแบบที่เลือกวิธีคำนวณตามประเภท และมักเพิ่มแบบใหม่ ให้ใช้ Strategy","ถ้าเมื่อเหตุการณ์หนึ่งเกิดต้องแจ้งหลายส่วนโดยไม่ผูกกันแน่น ให้ใช้ Observer","ถ้าต้องใช้ SDK/ไลบรารีภายนอกแต่ไม่อยากให้โค้ดทั้งระบบผูกกับมัน ให้ใช้ Adapter","ถ้าต้องใช้ logic เดียวกันทั้งเว็บและแอปมือถือ ให้แยก business logic ออกจาก UI"],"pitfalls":["สับสน aggregation กับ composition: ถ้าส่วนประกอบหายไปพร้อมเจ้าของคือ composition","ใส่กฎธุรกิจไว้ใน controller หรือหน้าจอ ทำให้ทดสอบและนำกลับมาใช้ยาก","ใช้ inheritance ทั้งที่ความสัมพันธ์จริงเป็น has-a ควรเลือก composition over inheritance","ใช้ Singleton กับทุกอย่างเพื่อความสะดวก ทำให้เกิด global state และทดสอบยาก"],"example":{"lang":"typescript","code":"interface ShippingStrategy {\n  fee(weightKg: number): number;\n}\n\nclass StandardShipping implements ShippingStrategy {\n  fee(w: number) { return 40 + w * 10; }\n}\nclass ExpressShipping implements ShippingStrategy {\n  fee(w: number) { return 90 + w * 20; }\n}\n\nclass Order {\n  constructor(private shipping: ShippingStrategy) {}\n  total(subtotal: number, weightKg: number) {\n    return subtotal + this.shipping.fee(weightKg);\n  }\n}\n\nnew Order(new ExpressShipping()).total(500, 2);"}},{"descriptor":"SD-J2","competency":"System Design","title":"แก้ปัญหา Reliability และ Usability ด้วยเครื่องมือจำลองแบบ","summary":"ใช้ flowchart, state diagram และ deployment diagram เพื่อหาช่องโหว่ด้านความน่าเชื่อถือและการใช้งาน เช่น เส้นทางล้มเหลวที่ไม่ได้ออกแบบ หรือการกดซ้ำ","keyPoints":["สัญลักษณ์ flowchart มาตรฐาน: วงรี (terminator) เริ่ม/จบ, สี่เหลี่ยมผืนผ้า (process) ขั้นตอน, สี่เหลี่ยมข้าวหลามตัด (decision) เงื่อนไข, สี่เหลี่ยมด้านขนาน (input/output)","Flowchart ที่ดีต้องครอบคลุมทั้ง happy path และ failure path ทุก decision ต้องมีทางออกครบทุกกรณี (ใช่/ไม่ใช่) เช่น จะทำอย่างไรเมื่อชำระเงินไม่สำเร็จหรือ timeout","หน้าจอที่ดึงข้อมูลควรออกแบบครบ 4 สถานะ: loading (กำลังโหลด), success/data, empty (ไม่มีข้อมูล พร้อมคำแนะนำ), error (ล้มเหลว พร้อมปุ่มลองใหม่)","Double-submit protection: ป้องกันผู้ใช้กดปุ่มซ้ำ ด้วยการ disable ปุ่มระหว่างส่ง (ฝั่ง client) และ idempotency key หรือ unique constraint (ฝั่ง server) เพราะฝั่ง client อย่างเดียวไม่พอ","State diagram (state machine) ใช้ระบุสถานะและการเปลี่ยนที่อนุญาต เช่น ออเดอร์ PENDING -> PAID -> SHIPPED -> DELIVERED และ cancel ได้เฉพาะบางสถานะ ช่วยป้องกันการเปลี่ยนสถานะที่เป็นไปไม่ได้","ทุก transition ควรระบุเงื่อนไขหรือ event ที่ทำให้เกิด และต้องตรวจสถานะปัจจุบันก่อนเปลี่ยนเสมอในโค้ด","Deployment diagram แสดงว่าส่วนประกอบรันบน node ไหน ใช้ตรวจหา single point of failure (SPOF) เช่น server/DB ตัวเดียวที่ล่มแล้วระบบทั้งหมดล่ม","วิธีลด SPOF: redundancy (หลาย instance), load balancer, database replication/failover, หลาย availability zone","Sequence diagram แสดงลำดับข้อความระหว่าง object/บริการตามเวลา ใช้อธิบายพฤติกรรม เช่น การ retry หรือ timeout ระหว่างบริการ","ปัญหา usability พื้นฐาน: ข้อความ error ที่ช่วยให้ผู้ใช้แก้ได้, feedback ทันทีเมื่อกดปุ่ม, validate ข้อมูลก่อนส่ง, ไม่ทำให้ผู้ใช้เสียข้อมูลที่กรอกเมื่อเกิด error"],"examFocus":["ถ้า flowchart มีแต่เส้นทางสำเร็จ ให้เพิ่มเส้นทางล้มเหลว (เช่น ชำระเงินไม่ผ่าน, timeout) พร้อมการจัดการ","ถ้าผู้ใช้กดปุ่มสั่งซื้อซ้ำแล้วเกิดออเดอร์ซ้ำ ให้ disable ปุ่มและใช้ idempotency key ที่ server","ถ้าโจทย์ถามสถานะของหน้าจอรายการ ให้ครอบคลุม loading, error และ empty ไม่ใช่แค่กรณีมีข้อมูล","ถ้าโจทย์ให้ดู deployment diagram ที่มีเซิร์ฟเวอร์/DB ตัวเดียว ให้ชี้ว่าเป็น SPOF และเสนอ redundancy","ถ้าต้องควบคุมการเปลี่ยนสถานะของออเดอร์ ให้ใช้ state diagram/state machine ที่ระบุ transition ที่อนุญาต"],"pitfalls":["เชื่อว่า disable ปุ่มฝั่ง client พอแล้ว แต่ request ซ้ำจาก network retry หรือหลาย tab ยังเข้าถึง server ได้","วาด flowchart เฉพาะ happy path แล้วคิดว่าครบ","ปล่อยให้ state เปลี่ยนไปมาได้อิสระ (เช่น จาก DELIVERED กลับเป็น PENDING) โดยไม่มีกฎ","ใช้ load balancer หน้าเซิร์ฟเวอร์ตัวเดียว โดยไม่ซ้ำซ้อนตัว load balancer เอง ก็ยังมี SPOF"]},{"descriptor":"SD-J3","competency":"System Design","title":"ปฏิบัติตามแนวทางออกแบบและขอคำแนะนำเมื่อต้องเบี่ยงเบน","summary":"นักพัฒนาระดับต้นต้องทำงานตาม design guideline ขององค์กร และเมื่อมีเหตุต้องเบี่ยงเบนต้องแจ้งและขอคำแนะนำ ไม่ตัดสินใจเงียบ ๆ ด้วยตนเอง","keyPoints":["Design guideline / coding standard ของทีมมีเหตุผลรองรับ เช่น ความสม่ำเสมอ ความปลอดภัย การดูแลรักษา ต้องอ่านและทำตามก่อนลงมือ","แหล่งอ้างอิงที่ถูกต้องคือเอกสารแนวทางที่ทีมกำหนด (เช่น architecture guideline, ADR, coding standard) ไม่ใช่โค้ดเก่าที่มีอยู่ เพราะโค้ดเก่าอาจละเมิดแนวทางหรือเขียนก่อนมีแนวทางนั้น","ถ้าพบว่าแนวทางใช้ไม่ได้กับกรณีนี้ หรือโค้ดเก่าขัดกับแนวทาง ให้ปรึกษา tech lead / architect ก่อนตัดสินใจ","เมื่อต้องเบี่ยงเบนจริง ให้บันทึกเหตุผล ทางเลือกที่พิจารณา และผลกระทบ (เช่น ในรูป Architecture Decision Record - ADR) และได้รับการอนุมัติ","Code review และ automated checks (linter, static analysis, architecture tests) ช่วยบังคับใช้แนวทางอย่างสม่ำเสมอ","ห้ามเบี่ยงเบนเพียงเพราะเร็วกว่าหรือสะดวกกว่า โดยเฉพาะเรื่องความปลอดภัย การจัดการข้อมูลส่วนบุคคล หรือมาตรฐานที่เป็นข้อกำหนดขององค์กร","ถ้าแนวทางไม่ชัดเจนหรือขัดแย้งกันเอง ให้ถามเพื่อขอความชัดเจนและเสนอให้ปรับปรุงเอกสาร","การเบี่ยงเบนที่ไม่ได้รับอนุมัติสร้าง technical debt และทำให้ผู้อื่นดูแลโค้ดยากขึ้น"],"examFocus":["ถ้าเจอสถานการณ์ที่แนวทางทีมขัดกับโค้ดเดิมที่ทีมเก่าเขียน ให้ทำตามแนวทางที่เป็นเอกสาร และแจ้งเรื่องโค้ดเก่า ไม่เลียนแบบโค้ดเก่า","ถ้าคิดว่าต้องเบี่ยงเบนจากแนวทางด้วยเหตุผลทางเทคนิค ให้ขอคำปรึกษา/อนุมัติจาก tech lead หรือ architect และบันทึกเหตุผล","ถ้าโจทย์ให้เลือกระหว่างทำเงียบ ๆ ไปก่อนแล้วค่อยแจ้ง กับถามก่อนทำ ให้เลือกถามก่อนเมื่อกระทบแนวทางหลัก","ถ้าเจอข้อความที่บอกให้ข้ามแนวทางเพื่อส่งงานทันกำหนด ให้ถือว่าไม่ถูกต้อง ควรหารือเรื่องขอบเขตหรือเวลาแทน"],"pitfalls":["ใช้โค้ดเก่าเป็นมาตรฐานโดยอัตโนมัติ ทั้งที่อาจเป็น technical debt","ตัดสินใจเบี่ยงเบนเองโดยไม่บันทึกและไม่แจ้งใคร ทำให้ทีมไม่รู้และดูแลต่อไม่ได้","ละเลยแนวทางเพราะคิดว่าตัวเองรู้ดีกว่า โดยไม่ผ่านการพิจารณาร่วมกับทีม"]},{"descriptor":"SD-J4","competency":"System Design","title":"เอกสารเทคนิคและแผนภาพอธิบายโครงสร้าง","summary":"การสร้างเอกสารและภาพที่สื่อสารโครงสร้างและพฤติกรรมของ component ให้ผู้อ่านเข้าใจตรงกัน เลือกชนิดแผนภาพให้ตรงกับสิ่งที่ต้องอธิบาย","keyPoints":["เอกสาร component ที่ดีควรมี: วัตถุประสงค์/หน้าที่, ขอบเขต (ทำและไม่ทำอะไร), interface/API, dependency, วิธีรัน/ตั้งค่า, การจัดการ error, ข้อจำกัด และ owner","README คือเอกสารด่านแรก ควรบอกวิธีติดตั้ง รัน ทดสอบ และลิงก์ไปเอกสารละเอียด","เลือกแผนภาพให้ตรงจุดประสงค์: class diagram แสดงโครงสร้างคลาส, sequence diagram แสดงลำดับการโต้ตอบตามเวลา, state diagram แสดงสถานะและการเปลี่ยน, ER diagram แสดงโครงสร้างข้อมูล, deployment diagram แสดงการติดตั้งบน infrastructure, flowchart แสดงขั้นตอนตัดสินใจ","C4 model อธิบายสถาปัตยกรรมเป็น 4 ระดับ: Context (ระบบกับผู้ใช้/ระบบอื่น), Container (แอป/DB/บริการที่รันแยก), Component (ส่วนประกอบภายใน container), Code (ระดับคลาส) เลือกระดับให้เหมาะกับผู้อ่าน","แผนภาพสถาปัตยกรรมที่ดีต้องมีชื่อเรื่อง, สัญลักษณ์/ลูกศรที่สม่ำเสมอพร้อม legend, label บนเส้นเชื่อมที่บอกว่าสื่อสารอย่างไร (เช่น HTTPS, queue), ระดับรายละเอียดเดียวกัน ไม่ยัดทุกอย่างในภาพเดียว","เอกสาร API ควรสร้างจากสเปกที่เป็นเครื่องอ่านได้ เช่น OpenAPI (Swagger) เพื่อให้เอกสารตรงกับโค้ดเสมอ และสร้าง client/ทดสอบอัตโนมัติได้","เอกสารต้องเก็บใกล้โค้ด (docs-as-code) ใน version control และอัปเดตพร้อมการเปลี่ยนโค้ด เอกสารที่ล้าสมัยอันตรายกว่าไม่มีเอกสาร","เครื่องมือวาดแผนภาพเป็นโค้ด เช่น Mermaid และ PlantUML ช่วยให้ diff และ review ได้","เขียนโดยคำนึงถึงผู้อ่าน: นักพัฒนาใหม่ ต้องการภาพรวมและวิธีเริ่มต้น ส่วนผู้ดูแลระบบต้องการข้อมูลการ deploy และ troubleshooting"],"examFocus":["ถ้าโจทย์ให้อธิบายลำดับการเรียกระหว่างบริการตามเวลา ให้เลือก sequence diagram","ถ้าต้องแสดงสถานะของออเดอร์และการเปลี่ยนสถานะ ให้เลือก state diagram","ถ้าต้องสื่อสารกับผู้บริหารหรือคนนอกทีม ให้ใช้ภาพระดับ Context ที่ไม่ลงรายละเอียดเทคนิค","ถ้าต้องทำเอกสาร API ที่ไม่เพี้ยนจากโค้ด ให้สร้างจาก OpenAPI spec","ถ้าเจอแผนภาพที่ลูกศรไม่มีคำอธิบายและไม่มี legend ให้ปรับปรุงด้วยการเพิ่ม label และ legend"],"pitfalls":["ใช้ชนิดแผนภาพผิดวัตถุประสงค์ เช่น ใช้ class diagram อธิบายลำดับการทำงาน","วาดภาพเดียวที่ละเอียดทุกระดับจนอ่านไม่ออก","เขียนเอกสารครั้งเดียวแล้วไม่ดูแล จนไม่ตรงกับระบบจริง","เอกสาร API ที่เขียนมือแยกจากโค้ด มักไม่ตรงกับพฤติกรรมจริง"]},{"descriptor":"DB-J1","competency":"Database Design","title":"ใช้ NoSQL แบบ Key-Value และ Document","summary":"NoSQL ฐานข้อมูลแบบ key-value และ document เหมาะกับข้อมูลบางลักษณะ ต้องรู้ว่าเมื่อใดเหมาะ ข้อจำกัดด้านการ query และการออกแบบ document","keyPoints":["Key-value store (เช่น Redis, DynamoDB ในโหมดพื้นฐาน) เก็บข้อมูลเป็นคู่ key กับ value เข้าถึงด้วย key เร็วมาก เหมาะกับ cache, session, rate limit counter, OTP ที่มีอายุสั้น","Redis รองรับ TTL: `SET otp:0812345678 123456 EX 300` ตั้งหมดอายุ 300 วินาที, `GET key` อ่านค่า, `TTL key` ดูเวลาที่เหลือ, `EXPIRE key seconds` ตั้ง TTL, `INCR key` เพิ่มค่าแบบ atomic, `DEL key` ลบ","ข้อจำกัดของ key-value: ค้นหาด้วย value หรือเงื่อนไขซับซ้อนไม่ได้ตรง ๆ ต้องรู้ key หรือสร้าง secondary index/โครงสร้างเสริม ไม่เหมาะกับ ad-hoc query หรือ join","Document store (เช่น MongoDB, Firestore) เก็บข้อมูลเป็น document รูปแบบ JSON/BSON ที่มีโครงสร้างยืดหยุ่น แต่ละ document มี field ต่างกันได้ เหมาะกับข้อมูลที่ attribute หลากหลายหรือเปลี่ยนบ่อย เช่น แคตตาล็อกสินค้าหลายประเภท","MongoDB เบื้องต้น: `db.products.insertOne({...})` เพิ่ม, `db.products.find({ category: 'phone' })` ค้นหา, `updateOne`, `deleteOne`, `createIndex` สร้างดัชนี และ document หนึ่งตัวมีขนาดสูงสุด 16 MB","การออกแบบ document: embed (ฝังข้อมูลที่เกี่ยวข้องไว้ใน document เดียว เหมาะกับข้อมูลที่อ่านพร้อมกันเสมอและเป็นของ parent เดียว เช่น ที่อยู่จัดส่งของออเดอร์) เทียบกับ reference (เก็บ id อ้างอิง เหมาะเมื่อข้อมูลใหญ่ ถูกใช้ร่วมกันหลาย document หรือเปลี่ยนบ่อย)","ใช้ document store เมื่อ schema ยืดหยุ่นและ access pattern เป็นการอ่านทั้ง document ส่วนใช้ relational เมื่อข้อมูลมีความสัมพันธ์ซับซ้อน ต้อง join บ่อย หรือต้องการ transaction/constraint เข้มงวด","การออกแบบ NoSQL เริ่มจาก access pattern (จะ query อะไรบ้าง) ไม่ใช่เริ่มจาก entity อย่างเดียวแบบ relational และมักยอมให้ข้อมูลซ้ำ (denormalize) เพื่ออ่านเร็ว","บนมือถือ: key-value เล็ก ๆ (SharedPreferences/UserDefaults) เหมาะกับค่าตั้งค่า, ฐานข้อมูลในเครื่อง (SQLite) เหมาะกับข้อมูลเชิงโครงสร้างที่ต้อง query, ส่วน token/secret ต้องเก็บใน secure storage (Keychain/Keystore)"],"examFocus":["ถ้าต้องเก็บ OTP หรือ session ที่หมดอายุเองได้ ให้ใช้ key-value ที่มี TTL เช่น Redis","ถ้าสินค้าแต่ละประเภทมี attribute ไม่เหมือนกันและเปลี่ยนบ่อย ให้พิจารณา document store","ถ้าโจทย์ให้ค้นหาจากค่าภายใน value ใน key-value store ให้ตระหนักว่าทำไม่ได้ตรง ๆ ต้องมี index เสริมหรือเลือกที่เก็บแบบอื่น","ถ้าข้อมูลที่ฝังใน document เติบโตไม่จำกัด (เช่น คอมเมนต์ทั้งหมด) ให้ใช้ reference แทน embed","ถ้าโจทย์ถามเลือกที่เก็บข้อมูลบนมือถือ ให้แยก: ค่าตั้งค่า, ข้อมูลเชิงโครงสร้าง, ความลับ"],"pitfalls":["คิดว่า NoSQL ใช้แทน relational ได้ทุกกรณี ความจริงขึ้นกับ access pattern และความต้องการ consistency","ฝังข้อมูลที่โตไม่จำกัดไว้ใน document เดียวจนชนขีดจำกัดขนาดและช้าลง","เก็บ token หรือรหัสผ่านใน key-value ธรรมดาของมือถือ ซึ่งไม่ปลอดภัย","คิดว่าไม่มี schema แปลว่าไม่ต้องออกแบบข้อมูล แอปยังคงคาดหวังโครงสร้างอยู่"],"example":{"lang":"javascript","code":"// Redis: เก็บ OTP อายุ 5 นาที\nawait redis.set(`otp:${phone}`, code, { EX: 300 });\nconst saved = await redis.get(`otp:${phone}`);\n\n// MongoDB: สินค้าแต่ละประเภทมี field ต่างกัน\nawait db.collection('products').insertOne({\n  name: 'Phone X',\n  category: 'phone',\n  specs: { ram: 8, storage: 128 }\n});\nawait db.collection('products').find({ category: 'phone' }).toArray();"}},{"descriptor":"DB-J2","competency":"Database Design","title":"Data Modeling ด้วย ER Diagram และการนิยาม Schema","summary":"แปลงความต้องการเป็นแบบจำลองข้อมูล (entity, relationship) แล้วนิยาม schema ที่มี key และ constraint ถูกต้อง รวมถึงรองรับข้อความภาษาไทย","keyPoints":["ER diagram ประกอบด้วย entity (สิ่งที่เก็บข้อมูล), attribute (คุณสมบัติ), relationship (ความสัมพันธ์) และ cardinality: 1:1, 1:N, M:N","One-to-many (1:N): วาง foreign key ไว้ที่ฝั่ง many เช่น `orders.customer_id` อ้างอิง `customers.id` (ลูกค้า 1 คนมีหลายออเดอร์)","Many-to-many (M:N): แยกด้วยตารางกลาง (junction/associative table) เช่น `student_courses(student_id, course_id)` ซึ่ง foreign key ทั้งสองรวมเป็น composite primary key หรือมี unique constraint และตารางกลางเก็บ attribute ของความสัมพันธ์ได้ เช่น วันที่ลงทะเบียน","Primary key (PK) ต้องไม่ซ้ำและไม่เป็น NULL, Foreign key (FK) ต้องอ้างถึงค่าที่มีอยู่จริงในตารางอ้างอิง ทำให้เกิด referential integrity","Surrogate key (เช่น auto-increment id หรือ UUID) ไม่มีความหมายทางธุรกิจ คงที่ไม่เปลี่ยน ส่วน natural key (เช่น เลขบัตรประชาชน อีเมล) มีความหมายทางธุรกิจแต่ค่าอาจเปลี่ยนหรือมีปัญหาด้านความเป็นส่วนตัว นิยมใช้ surrogate เป็น PK และกำหนด natural key เป็น UNIQUE","Constraint พื้นฐาน: `NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY ... REFERENCES`, `CHECK (price >= 0)`, `DEFAULT` ควรบังคับที่ระดับฐานข้อมูล ไม่พึ่งแค่ validation ของแอป","เลือก data type ให้เหมาะ: เงินใช้ `DECIMAL/NUMERIC` ไม่ใช้ `FLOAT` เพราะมีความคลาดเคลื่อนของทศนิยม, วันเวลาใช้ชนิดวันที่/timestamp ไม่ใช้ string","ภาษาไทยต้องใช้ encoding แบบ Unicode: ใน MySQL ใช้ `utf8mb4` (charset `utf8` เดิมเป็นแบบ 3 ไบต์ที่ไม่ครบ Unicode), ใน PostgreSQL ใช้ database encoding `UTF8` และต้องใช้ชนิด column ที่รองรับ (เช่น VARCHAR/TEXT) ไม่ใช่ชนิดที่จำกัดแบบ ASCII","ตั้งชื่อ table/column อย่างสม่ำเสมอ (เช่น snake_case) และสื่อความหมาย","ตัวอย่างคำสั่ง: `CREATE TABLE customers (id BIGINT PRIMARY KEY, email VARCHAR(255) NOT NULL UNIQUE)` ตามด้วยตารางลูกที่มี `FOREIGN KEY`"],"examFocus":["ถ้าความสัมพันธ์เป็นหลายต่อหลายให้สร้างตารางกลาง ห้ามเก็บเป็นรายการคั่นด้วยจุลภาคใน column เดียว","ถ้าความสัมพันธ์เป็นหนึ่งต่อหลายให้วาง FK ที่ฝั่งหลาย","ถ้าโจทย์ถามเลือก PK ระหว่างเลขบัตรประชาชน กับ id ที่ระบบสร้าง ให้พิจารณา surrogate key และกำหนดเลขบัตรเป็น UNIQUE","ถ้าข้อมูลภาษาไทยแสดงเป็น ??? หรือบันทึกไม่ได้ ให้ตรวจ charset/encoding เป็น UTF-8 (utf8mb4)","ถ้าต้องกันข้อมูลผิดตั้งแต่ระดับฐานข้อมูล เช่น ราคาติดลบ ให้ใช้ CHECK/NOT NULL/FK ไม่ใช่พึ่งแค่ฝั่งแอป"],"pitfalls":["วาง FK ผิดฝั่ง (ที่ฝั่ง one) ทำให้เก็บความสัมพันธ์หลายรายการไม่ได้","ใช้ FLOAT เก็บเงินแล้วเกิดเศษทศนิยมคลาดเคลื่อน","ใช้ natural key ที่เปลี่ยนค่าได้เป็น PK แล้วต้องตามแก้ FK ทุกตาราง","คิดว่า VARCHAR ธรรมดาเก็บภาษาไทยได้เสมอโดยไม่สนใจ charset ของฐานข้อมูล"],"example":{"lang":"sql","code":"CREATE TABLE students (\n  id BIGINT PRIMARY KEY,\n  name VARCHAR(100) NOT NULL\n);\nCREATE TABLE courses (\n  id BIGINT PRIMARY KEY,\n  title VARCHAR(200) NOT NULL\n);\nCREATE TABLE enrollments (\n  student_id BIGINT NOT NULL REFERENCES students(id),\n  course_id  BIGINT NOT NULL REFERENCES courses(id),\n  enrolled_at TIMESTAMP NOT NULL,\n  PRIMARY KEY (student_id, course_id)\n);"}},{"descriptor":"DB-J3","competency":"Database Design","title":"สำรองข้อมูลฐานข้อมูลด้วยเครื่องมือที่มีในตัว","summary":"การสำรองข้อมูลเป็นแนวป้องกันสุดท้ายเมื่อข้อมูลเสียหาย ต้องรู้เครื่องมือพื้นฐาน ความถี่ที่เหมาะกับความเสี่ยงที่ยอมรับได้ และต้องทดสอบ restore ได้จริง","keyPoints":["เครื่องมือ logical backup ที่มีมากับฐานข้อมูล: PostgreSQL ใช้ `pg_dump` (หนึ่งฐานข้อมูล) และ `pg_dumpall` (ทั้ง cluster), restore ด้วย `psql` หรือ `pg_restore` (สำหรับรูปแบบ custom `-Fc`)","MySQL/MariaDB ใช้ `mysqldump` เช่น `mysqldump --single-transaction mydb > mydb.sql` (สำหรับ InnoDB จะได้ snapshot ที่สอดคล้องโดยไม่ล็อกตารางนาน) และ restore ด้วย `mysql mydb < mydb.sql`","MongoDB ใช้ `mongodump` และ `mongorestore`","ประเภทการสำรอง: full (ทั้งหมด), incremental (เฉพาะส่วนที่เปลี่ยนตั้งแต่การสำรองครั้งล่าสุดไม่ว่าชนิดใด), differential (เปลี่ยนตั้งแต่ full ล่าสุด) และ physical (คัดลอกไฟล์ข้อมูล) เทียบกับ logical (export เป็น SQL)","ความถี่ในการสำรองต้องสัมพันธ์กับ RPO (Recovery Point Objective) คือปริมาณข้อมูลที่ยอมเสียได้ เช่น ถ้ายอมเสียไม่เกิน 1 ชั่วโมง ต้องสำรองอย่างน้อยทุกชั่วโมง หรือใช้ continuous archiving/transaction log","RTO (Recovery Time Objective) คือเวลาที่ยอมให้ระบบหยุดจนกว่าจะกู้คืนเสร็จ ซึ่งมีผลต่อการเลือกวิธีสำรอง","ต้องทดสอบ restore เป็นระยะ backup ที่ไม่เคยทดสอบกู้คืนถือว่าไม่น่าเชื่อถือ","เก็บสำเนาไว้ต่างสถานที่/ต่างระบบกับเซิร์ฟเวอร์ฐานข้อมูล (กฎ 3-2-1: อย่างน้อย 3 สำเนา, 2 สื่อ, 1 สำเนานอกสถานที่) เข้ารหัสไฟล์ backup และจำกัดสิทธิ์การเข้าถึงเพราะมีข้อมูลสำคัญ","ตั้งงานสำรองอัตโนมัติ (cron/scheduler) และ monitor ผลสำเร็จ/ล้มเหลว พร้อมนโยบายเก็บรักษา (retention) และลบชุดเก่า","Replication ไม่ใช่ backup: ถ้าข้อมูลถูกลบหรือเสียหาย ความผิดพลาดจะถูก replicate ไปด้วย"],"examFocus":["ถ้าโจทย์ระบุว่ายอมเสียข้อมูลได้ไม่เกิน X ให้เลือกความถี่ backup ให้ไม่เกิน X (เชื่อมกับ RPO)","ถ้าองค์กรสำรองข้อมูลทุกคืนแต่ไม่เคยลอง restore ให้เสนอให้ทดสอบ restore ตามกำหนด","ถ้าไฟล์ backup เก็บไว้ดิสก์เดียวกับฐานข้อมูล ให้ย้ายไปเก็บต่างที่และเข้ารหัส","ถ้าโจทย์ถามเครื่องมือสำรองมาตรฐาน ให้เลือก pg_dump / mysqldump / mongodump ตามชนิดฐานข้อมูล","ถ้ามีคนอ้างว่ามี replica แล้วไม่ต้อง backup ให้ตอบว่า replica ไม่ป้องกันการลบหรือเสียหายของข้อมูลที่ถูกส่งต่อ"],"pitfalls":["เชื่อว่ามี backup แล้วปลอดภัย โดยไม่เคยตรวจว่ากู้คืนได้","เก็บ backup ไว้บนเซิร์ฟเวอร์เดียวกัน ถ้าเครื่องเสียหรือถูกโจมตีก็สูญเสียทั้งสอง","ปล่อยไฟล์ backup ไม่เข้ารหัสในที่เก็บที่คนเข้าถึงได้กว้าง","คิดว่า replication ใช้แทน backup ได้"],"example":{"lang":"bash","code":"# PostgreSQL: สำรองรูปแบบ custom แล้วกู้คืน\npg_dump -Fc -h localhost -U app mydb > mydb.dump\npg_restore -d mydb_restored mydb.dump\n\n# MySQL (InnoDB)\nmysqldump --single-transaction -u app -p mydb > mydb.sql\nmysql -u app -p mydb_restored < mydb.sql\n\n# MongoDB\nmongodump --db mydb --out ./backup\nmongorestore ./backup"}},{"descriptor":"DB-J4","competency":"Database Design","title":"คุณสมบัติ ACID ของ Transaction","summary":"ACID คือหลักประกันของ transaction ในฐานข้อมูลเชิงสัมพันธ์ที่ทำให้ข้อมูลถูกต้องแม้มีความล้มเหลวหรือการทำงานพร้อมกัน","keyPoints":["Transaction คือกลุ่มคำสั่งที่ถือเป็นหน่วยงานเดียว: `BEGIN; ...; COMMIT;` เพื่อยืนยัน หรือ `ROLLBACK;` เพื่อยกเลิกทั้งหมด","Atomicity: ทำสำเร็จทั้งหมดหรือไม่ทำเลย เช่น โอนเงิน หัก A และเพิ่ม B ต้องสำเร็จทั้งคู่ ถ้าขั้นตอนใดล้มเหลวต้อง rollback ทั้งหมด","Consistency: transaction พาฐานข้อมูลจากสถานะที่ถูกต้องไปอีกสถานะที่ถูกต้อง ตาม constraint (PK, FK, CHECK, UNIQUE) และกฎที่กำหนดไว้ ถ้าละเมิด constraint transaction จะถูกปฏิเสธและ rollback","Isolation: transaction ที่ทำงานพร้อมกันไม่ควรรบกวนกัน ผลลัพธ์ควรเสมือนทำทีละตัวในระดับที่เลือก","Durability: เมื่อ commit แล้วข้อมูลต้องคงอยู่แม้ระบบล่มหรือไฟดับ โดยใช้กลไกเช่น write-ahead log (WAL) เขียนลงดิสก์ก่อนยืนยัน","ระดับ isolation ตามมาตรฐาน SQL: Read Uncommitted, Read Committed, Repeatable Read, Serializable ยิ่งสูงยิ่งกันความผิดปกติได้มากแต่ throughput ลดลง","ความผิดปกติจากการทำงานพร้อมกัน: dirty read (อ่านข้อมูลที่ยังไม่ commit), non-repeatable read (อ่านแถวเดิมสองครั้งได้ค่าต่างกัน), phantom read (ได้ชุดแถวต่างกันเมื่อ query ซ้ำ), lost update (สองฝ่ายเขียนทับกัน)","ค่าเริ่มต้น: PostgreSQL ใช้ Read Committed, MySQL InnoDB ใช้ Repeatable Read","ป้องกันการขายสต็อกเกินจากการทำงานพร้อมกัน: ใช้ `SELECT ... FOR UPDATE` ล็อกแถวก่อนอัปเดต หรือ `UPDATE stock SET qty = qty - 1 WHERE id = ? AND qty > 0` แบบ atomic หรือ optimistic locking ด้วย version column","Consistency ใน ACID หมายถึงความถูกต้องตามกฎของข้อมูล ซึ่งไม่เหมือน consistency ในทฤษฎี CAP ที่หมายถึงทุก node เห็นข้อมูลตรงกัน"],"examFocus":["ถ้าโอนเงินแล้วหักต้นทางสำเร็จแต่ล้มเหลวตอนเพิ่มปลายทาง ปัญหาเกี่ยวกับ Atomicity ต้องห่อใน transaction เดียว","ถ้าผู้ใช้สองคนซื้อสินค้าชิ้นสุดท้ายพร้อมกันแล้วขายเกิน เป็นปัญหา Isolation ให้ใช้ locking หรือ atomic update","ถ้า commit แล้วข้อมูลหายหลังไฟดับ เป็นปัญหา Durability","ถ้าข้อมูลที่ละเมิด constraint (เช่น ยอดคงเหลือติดลบเมื่อมี CHECK) ถูกปฏิเสธ นั่นคือบทบาทของ Consistency","ถ้าโจทย์จับคู่คำอธิบายกับตัวอักษร A C I D ให้ท่องความหมายสั้น ๆ ของแต่ละตัวข้างต้น"],"pitfalls":["สับสนระหว่าง Atomicity กับ Isolation: atomicity คือทั้งหมดหรือไม่เลย isolation คือการไม่รบกวนกัน","คิดว่า Consistency คือทุกผู้ใช้เห็นข้อมูลเหมือนกันตลอดเวลา","ใช้ read-then-write ในแอป (อ่านสต็อกแล้วค่อยลดค่า) โดยไม่ล็อก ทำให้เกิด lost update","คิดว่าฐานข้อมูล NoSQL ทุกตัวไม่มี transaction (บางตัวรองรับ แต่ขอบเขตและต้นทุนต่างกัน)"],"example":{"lang":"sql","code":"BEGIN;\nUPDATE accounts SET balance = balance - 500 WHERE id = 1 AND balance >= 500;\n-- ตรวจจำนวนแถวที่ถูกอัปเดต ถ้าเป็น 0 ให้ ROLLBACK\nUPDATE accounts SET balance = balance + 500 WHERE id = 2;\nCOMMIT;"}}],"senior":[{"descriptor":"MS-S2","competency":"Microservices","title":"สื่อสารระหว่างบริการด้วย Messaging และ Event-driven","summary":"การสื่อสารแบบ asynchronous ผ่าน message broker ลด coupling แต่ต้องรับมือกับ at-least-once delivery, ลำดับข้อความ และข้อความที่ประมวลผลไม่ได้","keyPoints":["Command (สั่งให้ทำ, ผู้รับมีหนึ่งเดียว) ต่างจาก event (บอกว่าเกิดอะไรขึ้นแล้ว, ผู้สนใจกี่รายก็ได้) event-driven ลด coupling เพราะผู้ส่งไม่ต้องรู้จักผู้รับ","Broker ที่พบบ่อย: Kafka (log แบบ partitioned เก็บข้อความตามระยะเวลา อ่านซ้ำได้), RabbitMQ (queue/exchange แบบ routing ยืดหยุ่น ข้อความถูกลบเมื่อ ack), และบริการ managed ของ cloud","ส่วนใหญ่ broker ให้ at-least-once delivery ข้อความอาจถูกส่งซ้ำ จึงต้องออกแบบ consumer ให้ idempotent เพราะ exactly-once ครบวงจรทำได้ยากและมีเงื่อนไข","Idempotent consumer: เก็บ message/event ID ที่ประมวลผลแล้ว (ตาราง processed_messages ที่มี unique constraint) หรือทำให้การดำเนินการ idempotent โดยธรรมชาติ (เช่น upsert) และบันทึกการประมวลผลกับผลข้างเคียงใน transaction เดียวกัน","Dual-write problem: การเขียน DB แล้วค่อย publish message เป็นสองขั้นที่ไม่ atomic อาจเขียน DB สำเร็จแต่ publish ไม่สำเร็จ แก้ด้วย Transactional Outbox: เขียน event ลงตาราง outbox ใน transaction เดียวกับข้อมูลธุรกิจ แล้วมี relay process (polling หรือ CDC เช่น Debezium) ส่งไปยัง broker (ได้ at-least-once ผู้รับยังต้อง idempotent)","ลำดับข้อความ: Kafka รับประกันลำดับเฉพาะภายใน partition เดียว ใช้ partition key (เช่น orderId) เพื่อให้ event ของ entity เดียวกันไปอยู่ partition เดียวกันและเรียงลำดับ ไม่มีการรับประกันลำดับข้ามพาร์ติชัน","Consumer group: consumer ในกลุ่มเดียวกันแบ่ง partition กัน จำนวน consumer ที่ทำงานขนานได้สูงสุดเท่ากับจำนวน partition","Commit offset/ack หลังประมวลผลสำเร็จเท่านั้น (ถ้า ack ก่อนแล้วล้ม ข้อความหาย)","Poison message คือข้อความที่ประมวลผลไม่ผ่านซ้ำ ๆ ถ้าไม่จัดการจะบล็อกคิว ต้องจำกัดจำนวน retry (พร้อม backoff) แล้วส่งไป Dead Letter Queue/Topic (DLQ) เพื่อตรวจและ replay ภา
