<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>ข้อสอบซ้อม Software Design and Architecture</title>
<style>
/* Soft "warm paper" theme — easier on the eyes for long reading sessions */
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --surface-2: #f1ebdf;
  --fg: #3a352d;
  --muted: #6b6357;
  --border: #e3dccd;
  --border-strong: #cfc6b4;
  --accent: #2f6f6a;
  --accent-soft: #e3efec;
  --accent-fg: #ffffff;
  --ok: #2e7048;
  --ok-bg: #e7f2e9;
  --bad: #a8433c;
  --bad-bg: #f9ebe8;
  --warn: #855d12;
  --warn-bg: #faf0da;
  --focus: #c27a1a;
  --code-bg: #f4efe4;
  --shadow: 0 1px 2px rgba(80, 60, 30, 0.05), 0 2px 8px rgba(80, 60, 30, 0.04);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: 20px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", "Thonburi", "Leelawadee UI", Tahoma, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1d1a;
    --surface: #282521;
    --surface-2: #322e29;
    --fg: #e6dfd2;
    --muted: #b3aa9b;
    --border: #3d3832;
    --border-strong: #554e45;
    --accent: #7fc3bb;
    --accent-soft: #243532;
    --accent-fg: #13201f;
    --ok: #8fd1a4;
    --ok-bg: #1e3026;
    --bad: #f0a097;
    --bad-bg: #3a2420;
    --warn: #e8c47a;
    --warn-bg: #362c18;
    --focus: #f0b45e;
    --code-bg: #24211d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.8;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--gutter);
  padding-bottom: 64px;
}

h1, h2, h3 { line-height: 1.4; margin: 0 0 10px; font-weight: 650; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 14px; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
[tabindex="-1"]:focus { outline: none; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.muted { color: var(--muted); }
.small { font-size: 0.92rem; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* buttons */
.btn {
  font: inherit;
  min-height: 46px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
  font-weight: 600;
}

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* start screen */
fieldset {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px var(--gutter) var(--gutter);
  margin: 0 0 16px;
  min-width: 0;
  background: var(--surface);
  box-shadow: var(--shadow);
}
legend { font-weight: 650; padding: 0 8px; }

.choice {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.choice:hover { background: var(--surface-2); }
.choice input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice input:focus-visible { outline: none; }
.choice .text { min-width: 0; }

.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input[type="number"] {
  font: inherit;
  width: 8rem;
  min-height: 46px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--fg);
}
.error {
  color: var(--bad);
  background: var(--bad-bg);
  border: 1px solid var(--bad);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
}

/* quiz header */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.9rem;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.15rem;
  padding: 4px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.timer.low { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

/* exam only: the header (timer + warning banner) stays on screen while scrolling */
.sticky-head {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.sticky-head .topbar { margin-bottom: 0; }
.time-banner {
  margin-top: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--warn);
  background: var(--warn-bg);
  color: var(--warn);
  font-weight: 650;
}
.time-banner.urgent { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
/* focusing a question title or feedback must not leave it under the sticky header */
.sticky-head ~ .card .qtitle,
.sticky-head ~ .card .feedback { scroll-margin-top: 10rem; }
.score-line { font-weight: 600; }

/* question */
.qtitle { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.01em; }
.multi-note {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 12px;
  border-radius: 8px;
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid var(--warn);
  font-weight: 600;
  font-size: 0.95rem;
}
.stem { font-size: 1.14rem; line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }

pre.code {
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  max-width: 100%;
  font-family: var(--mono);
  font-size: 0.88rem;
  line-height: 1.6;
  tab-size: 2;
}
pre.code code {
  font: inherit;
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
}

.options { border: 0; padding: 0; margin: 0 0 16px; background: transparent; box-shadow: none; }
.opt {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
label.opt { cursor: pointer; }
label.opt:hover { background: var(--surface-2); border-color: var(--border-strong); }
label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
label.opt input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
label.opt input:focus-visible { outline: none; }
.letter {
  flex: 0 0 auto;
  min-width: 1.75em;
  height: 1.75em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 700;
  font-size: 0.85rem;
  margin-top: 3px;
}
label.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt-body { flex: 1 1 auto; min-width: 0; }
.opt-text { white-space: pre-wrap; }

.opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag {
  font-size: 0.85rem;
  font-weight: 650;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.sel { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.why { margin: 6px 0 0; font-size: 0.97rem; line-height: 1.75; color: var(--muted); }
.opt.is-correct .why, .opt.is-wrong .why { color: var(--fg); }

.feedback {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px var(--gutter);
  margin: 0 0 16px;
  background: var(--surface-2);
}
.feedback h3 { margin-bottom: 6px; }
.feedback .points { font-weight: 700; }
.feedback .points.pos { color: var(--ok); }
.feedback .points.neg { color: var(--bad); }
.explain { white-space: pre-wrap; margin: 10px 0 0; line-height: 1.85; }

/* navigation + palette */
.qnav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.qnav .spacer { flex: 1 1 0; }

.palette-wrap { margin-top: 14px; }
.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.pal {
  position: relative;
  font: inherit;
  font-size: 0.95rem;
  min-height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  padding: 0;
  transition: background-color 0.15s ease;
}
.pal:hover { background: var(--surface-2); }
.pal.answered { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.pal.current { outline: 3px solid var(--focus); outline-offset: 1px; }
.pal.flagged::after {
  content: "\2691";
  position: absolute;
  top: -2px;
  right: 3px;
  font-size: 0.8rem;
  color: var(--warn);
  text-shadow: 0 0 2px var(--surface);
}
.pal.answered.flagged::after { color: var(--accent-fg); text-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9rem; color: var(--muted); }

/* results */
.big-score { font-size: 2.2rem; font-weight: 750; line-height: 1.2; margin: 6px 0; color: var(--accent); }
.desc-row { padding: 12px 0; border-top: 1px solid var(--border); }
.desc-row:first-child { border-top: 0; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.review-item { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gutter); margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow); }
.review-item.unanswered { border-color: var(--warn); }

/* review screen */
#app.wide { max-width: 1120px; }
.rv-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.rv-filter { display: block; width: 100%; max-width: 100%; font: inherit; min-height: 46px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); }
code.ic { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); border: 1px solid var(--border); overflow-wrap: anywhere; }
mark { background: var(--warn-bg); color: var(--fg); border-bottom: 2px solid var(--warn); border-radius: 3px; padding: 0 1px; }

.rv-toolbar { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin: 6px 0 4px; }
.rv-prog { flex: 1 1 240px; min-width: 0; }
.rv-prog-text { font-size: 0.95rem; color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
.rv-prog .bar { margin-top: 0; }
.rv-tools { display: flex; flex-wrap: wrap; gap: 10px; }

.rv-layout { margin-top: 0; }
.rv-below { margin-top: 16px; }
.rv-side { display: none; }
.rv-main { min-width: 0; font-size: 1.05rem; line-height: 1.75; max-width: calc(72ch + 2 * var(--gutter) + 2px); margin: 0 auto; }
.rv-side[hidden], .rv-toc-m[hidden] { display: none !important; }

/* table of contents */
.rv-toc-title { font-size: 1.05rem; margin: 0 0 4px; }
.rv-toc-h { font-size: 0.82rem; font-weight: 650; color: var(--muted); margin: 14px 0 4px; line-height: 1.4; }
.rv-toc-list { list-style: none; margin: 0; padding: 0; }
.rv-toc-list a { display: flex; gap: 6px; align-items: baseline; min-height: 44px; padding: 8px 8px; border-radius: 8px; color: var(--fg); text-decoration: none; line-height: 1.45; font-size: 0.97rem; }
.rv-toc-list a:hover { background: var(--accent-soft); }
.rv-tick { flex: 0 0 1.1em; visibility: hidden; color: var(--ok); font-weight: 700; }
.rv-toc-list a.read .rv-tick { visibility: visible; }
.rv-tl { min-width: 0; }
.rv-toc-m { margin: 0 0 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.rv-toc-m > summary { cursor: pointer; min-height: 48px; padding: 10px var(--gutter); font-weight: 650; display: flex; align-items: center; }
.rv-toc-m .rv-toc-body { padding: 0 calc(var(--gutter) - 8px) var(--gutter); }

@media (min-width: 1000px) {
  .rv-layout { display: grid; grid-template-columns: 280px minmax(0, calc(72ch + 2 * var(--gutter) + 2px)); justify-content: center; gap: 36px; align-items: start; }
  .rv-main { margin: 0; width: 100%; }
  .rv-side { display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px 6px 12px 0; }
  .rv-toc-m { display: none; }
  .rv-toc-list a { min-height: 34px; padding: 5px 8px; }
}

/* topic card (accordion) */
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
.rv-card[open] { border-color: var(--accent); }
.rv-sum { display: flex; align-items: center; gap: 12px; padding: 14px var(--gutter); min-height: 60px; cursor: pointer; list-style: none; border-radius: var(--radius); }
.rv-sum::-webkit-details-marker { display: none; }
.rv-sum::marker { content: ''; }
.rv-sum:hover { background: var(--surface-2); }
.rv-sum::after { content: ''; flex: 0 0 auto; width: 0.55em; height: 0.55em; margin: 0 4px 0 2px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.15s ease; }
.rv-card[open] > .rv-sum::after { transform: rotate(-135deg); }
.rv-badge { flex: 0 0 auto; min-width: 2.8em; text-align: center; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-weight: 650; font-size: 0.9rem; line-height: 1.6; }
.rv-sum-main { flex: 1 1 auto; min-width: 0; display: block; }
.rv-sum-main h3 { margin: 0; font-size: 1.1rem; line-height: 1.5; }
.rv-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; }
.rv-meta { font-size: 0.88rem; color: var(--muted); }
.rv-readtag { font-size: 0.8rem; line-height: 1.5; padding: 0 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.rv-readtag[hidden] { display: none; }

.rv-body { padding: 6px var(--gutter) var(--gutter); }
.rv-body > * + * { margin-top: 28px; }
.rv-body > .rv-name { margin-top: 10px; margin-bottom: 0; }
.rv-lead { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px 16px; font-size: 1.12rem; line-height: 1.7; }
.rv-lead p { margin: 0; }
.rv-lab-top { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; line-height: 1.5; }
.rv-sec-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 12px; font-size: 1.05rem; line-height: 1.5; }
.rv-count { font-size: 0.85rem; font-weight: 400; color: var(--muted); }

.rv-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rv-point { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.rv-num { flex: 0 0 auto; width: 2rem; height: 2rem; margin-top: 0.1rem; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 650; line-height: 1; }
.rv-pt { min-width: 0; }
.rv-term { display: block; font-weight: 650; margin-bottom: 2px; }
.rv-rest { display: block; }

.rv-qa { display: grid; gap: 10px; }
.rv-qa-head { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0 14px; font-size: 0.82rem; font-weight: 650; color: var(--muted); }
.rv-qa-row { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.rv-qa-row.full { grid-template-columns: 1fr; }
.rv-q { padding: 12px 14px; background: var(--surface-2); min-width: 0; }
.rv-a { padding: 12px 14px; background: var(--ok-bg); border-left: 4px solid var(--ok); min-width: 0; }
.rv-lab { display: block; font-size: 0.78rem; font-weight: 650; line-height: 1.5; margin-bottom: 2px; color: var(--muted); }
.rv-a .rv-lab { color: var(--ok); }
@media (min-width: 561px) {
  .rv-qa .rv-lab { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}
@media (max-width: 560px) {
  .rv-qa-head { display: none; }
  .rv-qa-row { grid-template-columns: 1fr; }
  .rv-a { border-left: 0; border-top: 4px solid var(--ok); }
}

.rv-pits { display: grid; gap: 10px; }
.rv-pit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: var(--radius-sm); }
.rv-x { flex: 0 0 auto; color: var(--bad); font-weight: 700; }

.rv-ex > summary { cursor: pointer; display: flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--accent); }
.rv-ex pre.code { margin-top: 6px; }

.rv-foot { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
.rv-read-btn[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.rv-read-btn[aria-pressed="true"]::before { content: '\2713\00a0'; }

/* focus mode */
.fc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.fc-keys { font-size: 0.85rem; color: var(--muted); }
.fc-head { max-width: 640px; margin: 20px auto 0; }
.fc-topic { display: flex; align-items: center; gap: 10px; }
.fc-title { margin: 0; font-size: 1.1rem; line-height: 1.45; min-width: 0; }
.fc-pos { margin: 6px 0 10px; }
.fc-head .bar { margin-top: 0; }
.fc-prog-text { margin: 6px 0 0; }
.fc-stage { max-width: 640px; margin: 20px auto 0; }
.fc-card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 30px 34px; min-height: 300px; font-size: 1.3rem; line-height: 1.7; }
.fc-card.t-key { border-top-color: var(--muted); }
.fc-card.t-ex { border-top-color: var(--ok); }
.fc-card.t-pit { border-top-color: var(--bad); }
.fc-card.t-end { border-top-color: var(--accent); }
.fc-card.enter { animation: fc-in 0.18s ease-out; }
@keyframes fc-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fc-chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 20px; font-size: 1rem; }
.fc-chip { display: inline-block; padding: 1px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--fg); font-size: 0.85rem; font-weight: 650; line-height: 1.7; }
.fc-chip.sum { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.fc-chip.ex { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.fc-chip.pit { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.fc-prevmark { font-size: 0.85rem; color: var(--muted); }
.fc-text { margin: 0; }
.fc-term { display: block; font-weight: 650; margin-bottom: 8px; }
.fc-sub { margin: 18px 0 0; font-size: 0.95rem; line-height: 1.6; }
.fc-x { color: var(--bad); font-weight: 700; margin-right: 8px; }
.fc-answer { margin-top: 24px; padding: 16px 20px; background: var(--ok-bg); border-left: 5px solid var(--ok); border-radius: var(--radius-sm); }
.fc-answer p { margin: 0; }
.fc-answer .rv-lab { color: var(--ok); }
.fc-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn.fc-big { min-height: 52px; padding: 10px 22px; font-size: 1.05rem; }
.btn.good { border-color: var(--ok); color: var(--ok); }
.fc-nav { max-width: 640px; margin: 18px auto 0; display: flex; gap: 12px; }
.fc-nav .btn { flex: 1 1 0; }
.fc-note { margin: 0 0 14px; }
@media (max-width: 480px) {
  .fc-card { padding: 22px 18px 26px; font-size: 1.2rem; min-height: 260px; }
  .fc-keys { display: none; }
}

/* dialog */
dialog.dlg {
  max-width: min(480px, calc(100vw - 32px));
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  padding: var(--gutter);
  box-shadow: 0 10px 40px rgba(40, 30, 15, 0.2);
}
dialog.dlg::backdrop { background: rgba(40, 32, 20, 0.45); }
dialog.dlg .row { justify-content: flex-end; margin-top: 14px; }

@media (max-width: 480px) {
  :root { --gutter: 16px; }
  body { font-size: 1rem; }
  h1 { font-size: 1.35rem; }
  .stem { font-size: 1.07rem; }
  .big-score { font-size: 1.8rem; }
  .qnav .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

่ได้แปลว่าต้องปล่อยให้โค้ดปนกันทุกส่วน"}],"explanation":"สำหรับทีมเล็กที่ความต้องการยังเปลี่ยนบ่อย monolith ที่แบ่งโมดูลดีมักคุ้มกว่า microservices เพราะลดภาระด้านปฏิบัติการ ควรแยกเป็นบริการเมื่อมีเหตุผลที่วัดได้ เช่น ต้องปรับขนาดต่างกันหรือทีมต้อง deploy แยกกัน ไม่ใช่เพราะเป็นแนวโน้มที่นิยม"},{"id":"ARC-J-P-002","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J1","concept":"microservices-benefits-tradeoffs","mobile":false,"type":"multiple","stem":"เมื่อเปรียบเทียบสถาปัตยกรรม microservices กับ monolith ข้อใดเป็นข้อเท็จจริงที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"การ debug ทั้งเส้นทางธุรกิจง่ายขึ้น เพราะ log และ stack trace ถูกแยกเป็นบริการเล็ก ๆ","correct":false,"why":"คำขอเดียวมักผ่านหลายบริการ ต้องเก็บ log ข้ามบริการมารวมกันจึงจะเห็นภาพทั้งหมด การตามหาปัญหาจึงยากกว่าใน monolith"},{"id":"B","text":"การเรียกระหว่างโมดูลเร็วขึ้นกว่า monolith เพราะแต่ละบริการอยู่ใกล้ข้อมูลของตัวเอง","correct":false,"why":"การเรียกข้ามบริการต้องผ่านเครือข่าย จึงช้ากว่าและล้มเหลวได้มากกว่าการเรียกฟังก์ชันภายในโปรเซสเดียวของ monolith"},{"id":"C","text":"แต่ละบริการเลือกภาษาหรือฐานข้อมูลที่เหมาะกับงานของตัวเองได้ แต่ทีมต้องรับภาระดูแลความหลากหลายนั้น","correct":true,"why":"บริการสื่อสารกันผ่าน API จึงเลือกเทคโนโลยีต่างกันได้ ข้อแลกเปลี่ยนคือทีมต้องมีความรู้ เครื่องมือ และกระบวนการดูแลหลายแบบ"},{"id":"D","text":"แต่ละบริการ deploy แยกกันได้ จึงปล่อยเฉพาะส่วนที่แก้ได้ โดยไม่ build และปล่อยระบบทั้งก้อนใหม่","correct":true,"why":"บริการแต่ละตัวเป็นหน่วย deploy อิสระ การแก้บริการหนึ่งจึงไม่บังคับให้ปล่อยบริการอื่น ซึ่งต่างจาก monolith ที่ปล่อยทั้งก้อนพร้อมกัน"},{"id":"E","text":"ปรับขนาดเฉพาะบริการที่โหลดสูง เช่น บริการค้นหาสินค้าช่วง flash sale โดยไม่ขยายบริการอื่นตามไปด้วย","correct":true,"why":"เพิ่มจำนวนเครื่องให้เฉพาะบริการที่รับโหลดหนัก ประหยัดทรัพยากรกว่า monolith ที่ต้องทำสำเนาทั้งแอปเพื่อขยายส่วนเดียว"}],"explanation":"ข้อดีของ microservices คือ deploy แยก ปรับขนาดเฉพาะส่วน และเลือกเทคโนโลยีได้ตามงาน แต่ต้องแลกกับความซับซ้อนของเครือข่าย การ debug ข้ามบริการ และภาระปฏิบัติการที่เพิ่มขึ้น ควรชั่งทั้งสองด้านก่อนตัดสินใจ"},{"id":"ARC-J-P-003","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J2","concept":"service-boundary-business-capability","mobile":false,"type":"single","stem":"ระบบสั่งอาหารออนไลน์มีฟังก์ชันจัดการเมนูของร้าน รับออเดอร์ ชำระเงิน และส่งการแจ้งเตือน ทีมต้องการแยกเป็นหลายบริการ ควรกำหนดขอบเขตของแต่ละบริการอย่างไร","options":[{"id":"A","text":"แบ่งตามความสามารถทางธุรกิจ เช่น บริการเมนู ออเดอร์ ชำระเงิน แจ้งเตือน โดยแต่ละบริการดูแลกฎและข้อมูลของงานนั้นเอง","correct":true,"why":"ขอบเขตตามความสามารถทางธุรกิจทำให้การเปลี่ยนแปลงหนึ่งเรื่องส่วนใหญ่จบในบริการเดียว และแต่ละบริการเป็นเจ้าของกฎกับข้อมูลของตัวเองได้ชัดเจน"},{"id":"B","text":"แบ่งตามชั้นทางเทคนิค คือบริการ controller กลาง บริการ business logic กลาง และบริการเข้าถึงข้อมูลกลาง","correct":false,"why":"ทุกฟีเจอร์ต้องผ่านทั้งสามบริการ การเพิ่มเมนูใหม่หรือเปลี่ยนวิธีชำระเงินจึงต้องแก้และ deploy หลายบริการพร้อมกัน ได้ความซับซ้อนของเครือข่ายโดยไม่ได้ความอิสระ"},{"id":"C","text":"แบ่งตามจำนวนบรรทัดโค้ด ให้แต่ละบริการมีขนาดใกล้เคียงกันเพื่อให้ภาระของทีมสมดุล","correct":false,"why":"ขนาดโค้ดไม่ใช่เส้นแบ่งของความรับผิดชอบ การตัดตามขนาดอาจผ่ากลางกฎธุรกิจเดียวกันออกเป็นสองบริการ"},{"id":"D","text":"แบ่งตามกลุ่มผู้ใช้ เป็นบริการสำหรับลูกค้าและบริการสำหรับร้านค้า โดยแต่ละบริการมีทั้งเมนู ออเดอร์ และการชำระเงินของตัวเอง","correct":false,"why":"ตรรกะเมนู ออเดอร์ และการชำระเงินจะถูกเขียนซ้ำในสองบริการ แก้กฎเดียวต้องแก้สองที่ และข้อมูลชุดเดียวกันถูกแตกเป็นสองชุด"}],"explanation":"การกำหนดขอบเขตบริการควรยึดความสามารถทางธุรกิจ (business capability) ไม่ใช่ชั้นเทคนิค ขนาดโค้ด หรือกลุ่มผู้ใช้ เพื่อให้การเปลี่ยนแปลงเรื่องหนึ่งกระทบน้อยบริการที่สุด และแต่ละบริการเป็นเจ้าของข้อมูลของงานตัวเอง"},{"id":"ARC-J-P-004","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J2","concept":"api-gateway-single-entry","mobile":true,"type":"single","stem":"แอปมือถือของร้านค้าต้องเรียกบริการแยก 4 ตัว (สินค้า ราคา สต็อก รีวิว) เพื่อแสดงหน้ารายละเอียดสินค้าหน้าเดียว ทีมพบว่าบนเครือข่ายมือถือที่ช้าหน้าโหลดนาน และทุกครั้งที่ย้ายที่อยู่ของบริการหลังบ้าน ต้องออกแอปเวอร์ชันใหม่ ควรปรับสถาปัตยกรรมอย่างไร","options":[{"id":"A","text":"ฝังที่อยู่ของทั้งสี่บริการไว้ในแอป แล้วเรียกพร้อมกันแบบขนานเพื่อลดเวลารอ","correct":false,"why":"เรียกขนานช่วยลดเวลารอได้บางส่วน แต่แอปยังผูกกับที่อยู่ของแต่ละบริการ การย้ายบริการจึงยังต้องออกแอปเวอร์ชันใหม่"},{"id":"B","text":"ให้แอปเก็บผลจากทั้งสี่บริการไว้ในเครื่อง แล้วเรียกใหม่เฉพาะเมื่อผู้ใช้ดึงรีเฟรชหน้าจอเท่านั้น","correct":false,"why":"ข้อมูลสต็อกและราคาอาจล้าสมัย และไม่ได้แก้การที่แอปผูกกับที่อยู่ของแต่ละบริการ ผู้ใช้ครั้งแรกหรือหลังล้างข้อมูลก็ยังต้องเรียกครบทั้งสี่"},{"id":"C","text":"เพิ่มจำนวนเครื่องให้ทั้งสี่บริการ เพราะสาเหตุหลักคือบริการหลังบ้านรับโหลดไม่ไหวเมื่อมีผู้ใช้เข้าพร้อมกันจำนวนมาก","correct":false,"why":"อาการที่เล่ามาคือจำนวนรอบการเรียกบนเครือข่ายช้าและการผูกกับที่อยู่บริการ ไม่ใช่ตัวบริการรับโหลดไม่ไหว การเพิ่มเครื่องไม่แก้ทั้งสองเรื่อง"},{"id":"D","text":"วาง API Gateway เป็นจุดเข้าเดียวให้แอปเรียก แล้วให้ gateway รวมผลจากบริการหลังบ้านส่งกลับเป็นคำตอบเดียว","correct":true,"why":"แอปรู้จักที่อยู่เดียว จำนวนรอบการเรียกข้ามเครือข่ายมือถือลดเหลือหนึ่งรอบ และการย้ายบริการหลังบ้านปรับที่ gateway ได้โดยไม่แตะแอป"}],"explanation":"API Gateway ทำหน้าที่เป็นประตูเดียวของระบบ ช่วยซ่อนโครงสร้างหลังบ้านจากไคลเอนต์ และรวมหลายการเรียกเป็นคำตอบเดียว ซึ่งมีประโยชน์มากกับแอปมือถือที่เครือข่ายไม่แน่นอนและอัปเดตแอปได้ช้า"},{"id":"ARC-J-P-005","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J3","concept":"http-call-timeout","mobile":false,"type":"single","stem":"บริการ Order เรียก HTTP ไปยังบริการ Inventory เพื่อเช็กสต็อกก่อนสร้างออเดอร์ ตามโค้ดด้านล่าง วันหนึ่ง Inventory ตอบช้ามาก (หลายนาที) ผลคือบริการ Order มีคำขอค้างสะสมจนตอบผู้ใช้ไม่ได้ ทั้งที่ตัวมันเองทำงานปกติ ควรแก้จุดใดเป็นอันดับแรก","code":"async function checkStock(sku: string) {\n  const res = await fetch(INVENTORY_URL + \"/stock/\" + sku);\n  return res.json();\n}","codeLang":"typescript","options":[{"id":"A","text":"เพิ่มจำนวน worker หรือเธรดของบริการ Order ให้รับคำขอที่ค้างได้มากขึ้น","correct":false,"why":"เป็นการซื้อเวลา ถ้า Inventory ยังตอบช้าอยู่ คำขอที่ค้างจะเพิ่มต่อไปจนทรัพยากรชุดใหม่เต็มอีกครั้ง"},{"id":"B","text":"ให้ Order ส่งคำขอเช็กสต็อกซ้ำทันทีทุกครั้งที่ยังไม่ได้คำตอบ จนกว่า Inventory จะตอบ เพื่อให้ได้ข้อมูลล่าสุดเสมอ","correct":false,"why":"การส่งซ้ำเพิ่มภาระให้ Inventory ที่ช้าอยู่แล้ว และคำขอของ Order ยิ่งค้างนานขึ้น"},{"id":"C","text":"กำหนดเวลารอสูงสุด (timeout) ให้การเรียก Inventory และตอบผู้ใช้ด้วยข้อผิดพลาดที่ชัดเจนเมื่อหมดเวลา","correct":true,"why":"timeout ตัดคำขอที่ค้างทิ้งตามเวลาที่กำหนด ทรัพยากรของ Order จึงไม่ถูกจองไว้ไม่จำกัด และผู้ใช้ได้รับคำตอบแทนที่จะรอเงียบ ๆ"},{"id":"D","text":"ย้ายโค้ดเช็กสต็อกมารวมในบริการ Order เพื่อเลิกเรียก HTTP ไปยัง Inventory","correct":false,"why":"ทำลายขอบเขตของบริการ ทำให้ Order แบกข้อมูลและกฎของสต็อกไปด้วย และเป็นการแก้ที่ใหญ่เกินสาเหตุ เพราะต้นเหตุคือการรอโดยไม่มีขีดจำกัด"}],"explanation":"ทุกการเรียกข้ามบริการควรมี timeout ที่เหมาะสม เพราะบริการปลายทางอาจช้าหรือไม่ตอบได้เสมอ หากรอแบบไม่มีกำหนด ปัญหาของบริการหนึ่งจะลามไปทำให้บริการที่เรียกมันล่มตามไปด้วย"},{"id":"ARC-J-P-006","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J3","concept":"retryable-status-codes","mobile":false,"type":"multiple","stem":"บริการ Cart ดึงโปรโมชันจากบริการ Promotion ด้วยคำขอ GET ที่อ่านข้อมูลอย่างเดียว และต้องการ retry อัตโนมัติเฉพาะกรณีที่การลองใหม่มีโอกาสสำเร็จ ข้อใดต่อไปนี้ retry ได้อย่างสมเหตุสมผล (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ได้รับ 429 Too Many Requests พร้อม header Retry-After ที่ระบุเวลารอ","correct":true,"why":"429 หมายถึงถูกจำกัดอัตราการเรียก เมื่อรอตามเวลาที่ผู้ให้บริการระบุแล้วลองใหม่ จึงมีโอกาสผ่าน"},{"id":"B","text":"การเชื่อมต่อหมดเวลา (timeout) ระหว่างรอคำตอบ","correct":true,"why":"ปัญหาเครือข่ายหรือบริการติดขัดชั่วคราวมักหายเอง และ GET ที่อ่านอย่างเดียวส่งซ้ำได้ปลอดภัย แต่ควรจำกัดจำนวนครั้งที่ลอง"},{"id":"C","text":"ได้รับ 503 Service Unavailable ขณะ Promotion กำลัง restart","correct":true,"why":"503 บอกว่าบริการยังไม่พร้อมชั่วคราว เมื่อรอสักครู่แล้วลองใหม่ มีโอกาสสำเร็จสูง"},{"id":"D","text":"ได้รับ 400 Bad Request เพราะรหัสโปรโมชันที่ส่งไปมีรูปแบบผิด","correct":false,"why":"ข้อผิดพลาดที่เกิดจากคำขอเอง ส่งซ้ำด้วยข้อมูลเดิมก็ได้ผลเดิม ต้องแก้ข้อมูลที่ส่งไม่ใช่ลองใหม่"}],"explanation":"ข้อผิดพลาดชั่วคราว (503, 429 หลังรอ, timeout) เหมาะกับการ retry แบบจำกัดจำนวน ส่วนข้อผิดพลาดฝั่งผู้เรียกอย่าง 400 หรือ 404 มักให้ผลเดิมเมื่อส่งข้อมูลเดิม การ retry จึงมีแต่เพิ่มภาระ ควรแยกประเภทข้อผิดพลาดก่อนตัดสินใจลองใหม่"},{"id":"ARC-J-P-007","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J3","concept":"retry-backoff-limit","mobile":true,"type":"single","stem":"แอปมือถือเรียกบริการ Profile เมื่อบริการนี้ล่มชั่วคราว แอปจะส่งคำขอซ้ำทันทีทุกครั้งที่ล้มเหลวและวนไม่จำกัดจำนวนครั้ง ผู้ใช้ 50,000 เครื่องทำแบบเดียวกัน ทำให้พอบริการฟื้นกลับมา ก็ล่มอีกภายในไม่กี่วินาที ควรปรับพฤติกรรมของแอปอย่างไร","options":[{"id":"A","text":"ลดช่วงเว้นระหว่างการลองใหม่ให้สั้นลง เพื่อให้แอปได้ข้อมูลทันทีที่บริการกลับมา และลดจำนวนครั้งที่ผู้ใช้ต้องกดลองใหม่เอง","correct":false,"why":"ยิ่งส่งถี่ ยิ่งเพิ่มภาระให้บริการที่เพิ่งฟื้น และทำให้ล่มซ้ำได้ง่ายขึ้น"},{"id":"B","text":"เลิกลองใหม่อัตโนมัติทุกกรณี ให้ผู้ใช้กดลองใหม่เองเท่านั้น","correct":false,"why":"ทิ้งโอกาสที่ข้อผิดพลาดชั่วคราวจะหายเองโดยผู้ใช้ไม่รู้ตัว และเมื่อบริการฟื้น ผู้ใช้จำนวนมากก็กดพร้อมกัน ภาระยังพุ่งเป็นระลอกเหมือนเดิม"},{"id":"C","text":"ส่งคำขอเดียวกันหลายรายการพร้อมกันในแต่ละรอบ เพื่อให้อย่างน้อยหนึ่งรายการผ่านก่อนถึงรอบถัดไป","correct":false,"why":"คำขอเพิ่มเป็นทวีคูณต่อเครื่อง ภาระของบริการที่ล่มอยู่ยิ่งหนักขึ้น"},{"id":"D","text":"ลองใหม่โดยเว้นระยะห่างที่เพิ่มขึ้นเรื่อย ๆ (exponential backoff) บวกค่าสุ่ม จำกัดจำนวนครั้ง แล้วแจ้งผู้ใช้เมื่อครบ","correct":true,"why":"ระยะห่างที่เพิ่มขึ้นและค่าสุ่มกระจายคำขอของเครื่องจำนวนมากไม่ให้พุ่งพร้อมกัน การจำกัดจำนวนครั้งหยุดการวนไม่สิ้นสุด และการแจ้งผู้ใช้ทำให้ไม่ติดค้างเงียบ ๆ"}],"explanation":"การ retry ที่ดีต้องมีเพดานจำนวนครั้ง ระยะห่างที่เพิ่มขึ้น (backoff) และค่าสุ่ม (jitter) เพื่อไม่ให้ไคลเอนต์จำนวนมากซ้ำเติมบริการที่กำลังฟื้น โดยเฉพาะแอปมือถือที่มีเครื่องจำนวนมากทำงานเหมือนกัน"},{"id":"ARC-J-P-008","level":"junior","pool":"practice","competency":"Microservices","descriptor":"MS-J2","concept":"service-owns-its-data-via-api","mobile":false,"type":"multiple","stem":"ทีมกำลังแยกบริการ Order และบริการ Customer ออกจากกันตามหลัก microservices ข้อใดเป็นแนวทางที่สอดคล้องกับหลักการนั้น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้ทั้งสองบริการใช้ฐานข้อมูลก้อนเดียวกันและ join ตารางข้ามกัน เพื่อลดการเรียก HTTP","correct":false,"why":"การร่วมฐานข้อมูลผูกบริการเข้ากับ schema เดียวกัน แก้ตารางหนึ่งอาจทำให้อีกบริการพัง และเสียความอิสระในการ deploy"},{"id":"B","text":"บริการ Order เก็บเฉพาะรหัสลูกค้าอ้างอิง และเรียก API ของบริการ Customer เมื่อต้องใช้รายละเอียด","correct":true,"why":"Order ไม่ถือสำเนาข้อมูลลูกค้า ข้อมูลลูกค้ามีเจ้าของเดียวคือ Customer ผู้อื่นขอดูผ่านสัญญา API"},{"id":"C","text":"Deploy ทั้งสองบริการพร้อมกันทุกครั้ง เพื่อให้โครงสร้างข้อมูลตรงกัน","correct":false,"why":"การต้อง deploy พร้อมกันคือสัญญาณว่าสองบริการผูกกันแน่น ซึ่งขัดกับเป้าหมายให้แต่ละบริการ deploy แยกกันได้"},{"id":"D","text":"ทีมเจ้าของบริการ Customer เปลี่ยนโครงสร้างตารางภายในได้ โดยผู้เรียกไม่ได้รับผลกระทบ ตราบใดที่ API ยังเหมือนเดิม","correct":true,"why":"API เป็นสัญญาระหว่างบริการ ส่วนฐานข้อมูลเป็นรายละเอียดภายใน แยกออกจากกันจึงเปลี่ยนภายในได้อิสระ"},{"id":"E","text":"ให้บริการ Order แก้ไขตารางลูกค้าได้เองเมื่อพบว่าที่อยู่จัดส่งล้าสมัย เพื่อความรวดเร็ว","correct":false,"why":"ข้ามเจ้าของข้อมูล ทำให้กฎการตรวจสอบของ Customer ถูกเลี่ยง และข้อมูลลูกค้ามีผู้แก้ได้หลายทาง"}],"explanation":"บริการหนึ่งควรเป็นเจ้าของข้อมูลของตัวเองและเปิดให้ผู้อื่นใช้ผ่าน API เท่านั้น เมื่อไม่มีการเข้าถึงตารางข้ามบริการ แต่ละทีมจึงเปลี่ยนโครงสร้างภายในและ deploy ได้อย่างอิสระ"},{"id":"ARC-J-P-009","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J1","concept":"class-diagram-composition","mobile":false,"type":"single","stem":"ในการวาด class diagram ของระบบสั่งซื้อ รายการสินค้าในใบสั่งซื้อ (OrderItem) ไม่มีความหมายหากไม่มีใบสั่งซื้อ (Order) และจะถูกลบไปพร้อมกับ Order เสมอ ความสัมพันธ์ระหว่าง Order กับ OrderItem ควรวาดเป็นแบบใด","options":[{"id":"A","text":"Inheritance (ลูกศรหัวสามเหลี่ยมกลวง) โดยให้ OrderItem สืบทอดจาก Order","correct":false,"why":"Inheritance คือ is-a แต่ OrderItem ไม่ใช่ Order ชนิดหนึ่ง ความสัมพันธ์ที่ต้องการสื่อคือ has-a"},{"id":"B","text":"Composition (เส้นที่มีหัวข้าวหลามตัดทึบฝั่ง Order) เพราะ OrderItem มีอายุตามเจ้าของ","correct":true,"why":"Composition ใช้เมื่อส่วนประกอบเป็นของเจ้าของเพียงรายเดียวและหมดอายุพร้อมกัน ตรงกับ OrderItem ที่ลบพร้อม Order"},{"id":"C","text":"Aggregation (เส้นที่มีหัวข้าวหลามตัดกลวง) เพราะ Order ประกอบด้วย OrderItem","correct":false,"why":"Aggregation ใช้กับส่วนประกอบที่ยังมีอยู่ได้ด้วยตัวเองแม้เจ้าของถูกลบ จึงสื่อความหมายอ่อนกว่าที่โจทย์ต้องการ"},{"id":"D","text":"Dependency (ลูกศรเส้นประ) เพราะ Order แค่ใช้ OrderItem ชั่วคราวระหว่างทำงานของเมธอดหนึ่ง","correct":false,"why":"Dependency สื่อการใช้งานชั่วคราว เช่น เป็นพารามิเตอร์ของเมธอด ไม่ใช่การถือครองที่มีอายุผูกกัน"}],"explanation":"เลือกชนิดของเส้นใน class diagram ตามความหมาย: is-a ใช้ inheritance, ส่วนประกอบที่ตายตามเจ้าของใช้ composition, ส่วนประกอบที่อยู่ได้เองใช้ aggregation และการใช้งานชั่วคราวใช้ dependency การเลือกถูกชนิดทำให้ผู้อ่านเข้าใจกฎการลบข้อมูลได้จากภาพ"},{"id":"ARC-J-P-010","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J1","concept":"strategy-pattern-shipping-fee","mobile":false,"type":"single","stem":"ร้านค้าออนไลน์คำนวณค่าจัดส่งด้วยฟังก์ชันด้านล่าง ฝ่ายธุรกิจจะเพิ่มวิธีจัดส่งใหม่ปีละหลายแบบ (เช่น ขนส่งแช่เย็น ส่งด่วนพิเศษ) ทุกครั้งต้องแก้ฟังก์ชันนี้และทดสอบทุกวิธีใหม่ทั้งหมด ควรใช้รูปแบบการออกแบบ (design pattern) ใดเพื่อให้เพิ่มวิธีใหม่ได้โดยไม่แก้โค้ดเดิม","code":"function shippingFee(method: string, weightKg: number): number {\n  if (method === \"standard\") return 40 + weightKg * 5;\n  if (method === \"express\") return 90 + weightKg * 12;\n  if (method === \"pickup\") return 0;\n  throw new Error(\"unknown method\");\n}","codeLang":"typescript","options":[{"id":"A","text":"Strategy: แยกการคำนวณแต่ละวิธีเป็นคลาสที่ทำตาม interface เดียวกัน แล้วเลือกใช้ตามวิธีที่เลือก","correct":true,"why":"Strategy ทำให้อัลกอริทึมหลายแบบสลับกันได้ผ่าน interface เดียว เพิ่มวิธีใหม่ด้วยการเพิ่มคลาสใหม่โดยไม่แตะโค้ดวิธีเดิม"},{"id":"B","text":"Singleton: ทำให้ฟังก์ชันคำนวณค่าส่งมีอินสแตนซ์เดียวทั้งระบบ เพื่อให้ทุกวิธีจัดส่งใช้ตัวคำนวณเดียวกัน","correct":false,"why":"Singleton ควบคุมจำนวนอินสแตนซ์ ไม่ได้ช่วยให้สลับหรือเพิ่มอัลกอริทึมโดยไม่แก้โค้ดเดิม"},{"id":"C","text":"Facade: สร้างคลาสหน้าด่านที่เรียกฟังก์ชันนี้แทนผู้ใช้ภายนอก","correct":false,"why":"Facade ซ่อนความซับซ้อนไว้หลังหน้าด่านเดียว แต่ if-else ข้างในยังอยู่ที่เดิมและยังต้องแก้ทุกครั้งที่เพิ่มวิธี"},{"id":"D","text":"Decorator: ห่อฟังก์ชันเดิมซ้อนกันหลายชั้นตามวิธีจัดส่งที่เพิ่มเข้ามา โดยแต่ละชั้นปรับค่าส่งของชั้นใน","correct":false,"why":"Decorator ใช้เพิ่มพฤติกรรมเสริมซ้อนกัน เช่น ค่าธรรมเนียมเพิ่ม ไม่ใช่การเลือกอัลกอริทึมหนึ่งจากหลายทางเลือก"}],"explanation":"เมื่อมีเงื่อนไข if-else ที่เลือกวิธีคำนวณต่างกันและจะเพิ่มวิธีใหม่เรื่อย ๆ รูปแบบ Strategy ช่วยให้เพิ่มวิธีโดยไม่แก้โค้ดเดิม สอดคล้องหลักเปิดรับส่วนขยายแต่ปิดการแก้ไข และทดสอบแต่ละวิธีแยกกันได้"},{"id":"ARC-J-P-011","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J1","concept":"layered-responsibilities","mobile":false,"type":"multiple","stem":"ระบบ REST API แบ่งโค้ดเป็นชั้น Controller, Service และ Repository ข้อใดจัดความรับผิดชอบเข้ากับชั้นได้เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Controller เปิด transaction ฐานข้อมูลและเขียน SQL เองเมื่อเป็น query ง่าย ๆ","correct":false,"why":"ทำให้ Controller ผูกกับฐานข้อมูล ทดสอบยาก และเมื่อ query ซับซ้อนขึ้นต้องย้ายโค้ดออกอยู่ดี"},{"id":"B","text":"Service เป็นที่รวมกฎธุรกิจ เช่น ตรวจว่ายอดสั่งซื้อถึงขั้นต่ำก่อนใช้คูปอง","correct":true,"why":"กฎธุรกิจอยู่ใน Service จึงใช้ซ้ำได้จากหลายทางเข้า และทดสอบได้โดยไม่ผ่าน HTTP หรือฐานข้อมูลจริง"},{"id":"C","text":"Repository คำนวณส่วนลดตามกฎโปรโมชันขณะดึงข้อมูล เพื่อให้ได้ข้อมูลที่พร้อมใช้","correct":false,"why":"Repository ควรทำหน้าที่เข้าถึงข้อมูล การใส่กฎธุรกิจลงใน query ทำให้กฎกระจายไปหลายที่และทดสอบยาก"},{"id":"D","text":"Controller แปลง HTTP request เป็นข้อมูลที่ Service ใช้ และแปลงผลลัพธ์กลับเป็น HTTP response พร้อม status code","correct":true,"why":"Controller เป็นขอบเขตระหว่างโลกของ HTTP กับตรรกะภายใน จึงดูแลการอ่านคำขอและรูปแบบคำตอบ"}],"explanation":"การแบ่งชั้นช่วยให้แต่ละส่วนเปลี่ยนแปลงและทดสอบแยกกัน: Controller ดูแลการสื่อสาร, Service ดูแลกฎธุรกิจ, Repository ดูแลการเข้าถึงข้อมูล เมื่อกฎธุรกิจหลุดไปอยู่ผิดชั้น การแก้ไขหนึ่งเรื่องจะกระจายไปหลายไฟล์"},{"id":"ARC-J-P-012","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J1","concept":"separate-ui-from-logic-mobile","mobile":true,"type":"single","stem":"ในแอปมือถือ หน้าตะกร้าสินค้าถูกเขียนรวมไว้ในโค้ดของหน้าจอเดียวทั้งหมด ทั้งการวาด UI เรียก API คำนวณยอดรวมและส่วนลด และบันทึกลงฐานข้อมูลในเครื่อง ตอนนี้ต้องทดสอบการคำนวณส่วนลด แต่ต้องเปิดทั้งหน้าจอขึ้นมาถึงทดสอบได้ ควรปรับโครงสร้างอย่างไร","options":[{"id":"A","text":"แยกโค้ดหน้าจอเป็นไฟล์ย่อยตามส่วนของ UI เช่น header, list, footer เพื่อให้แต่ละไฟล์สั้นลงและแก้ไขได้ง่ายขึ้น","correct":false,"why":"ได้ไฟล์ที่สั้นลง แต่ตรรกะการคำนวณยังปนอยู่กับโค้ดวาด UI ยังต้องเปิดหน้าจอจึงทดสอบได้"},{"id":"B","text":"ย้ายการคำนวณทั้งหมดไปที่เซิร์ฟเวอร์ แล้วให้แอปเรียก API ทุกครั้งที่ตะกร้าเปลี่ยน","correct":false,"why":"เปลี่ยนที่รันโค้ดแต่ไม่ได้แก้โครงสร้างของแอป และทำให้ทุกการเพิ่มลดจำนวนต้องรอเครือข่าย ซึ่งช้าและใช้งานไม่ได้เมื่อออฟไลน์"},{"id":"C","text":"แยกกฎธุรกิจและการคำนวณออกจากโค้ดวาดหน้าจอ (เช่น MVVM หรือแบ่งชั้น) ให้หน้าจอแสดงผลและรับ input","correct":true,"why":"เมื่อการคำนวณอยู่ในคลาสแยก ทดสอบได้โดยป้อนข้อมูลและตรวจผลลัพธ์โดยตรง และเปลี่ยนหน้าตา UI ได้โดยไม่กระทบกฎ"},{"id":"D","text":"เขียน UI test อัตโนมัติที่เปิดหน้าตะกร้าและกดปุ่มจริงเพื่อตรวจยอดแทน","correct":false,"why":"ทดสอบได้ แต่ช้าและเปราะเมื่อ UI เปลี่ยน และยังไม่แก้ปัญหาที่ตรรกะผูกติดกับหน้าจอ"}],"explanation":"การแยกตรรกะออกจากการแสดงผล (separation of concerns) ทำให้ทดสอบกฎธุรกิจได้เร็วและเปลี่ยน UI ได้โดยไม่กระทบกฎ เป็นหลักที่ใช้ได้กับแอปมือถือทุกแพลตฟอร์มไม่ว่าจะเลือกรูปแบบ MVVM, MVP หรืออื่น ๆ"},{"id":"ARC-J-P-013","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J2","concept":"flowchart-missing-failure-path","mobile":false,"type":"single","stem":"ทีมวาด flowchart ของขั้นตอนชำระเงิน: เริ่ม → ตรวจสต็อก → (พอ) ตัดบัตรเครดิต → ออกใบเสร็จ → จบ ส่วนกรณีสต็อกไม่พอวาดเส้นไปที่ แจ้งลูกค้า → จบ ต่อมาพบว่ามีลูกค้าถูกตัดเงินแล้วแต่ไม่ได้รับใบเสร็จหลายราย ส่วนใดของ flowchart ที่ขาดไป","options":[{"id":"A","text":"เส้นทางกรณีที่ตัดบัตรไปแล้วแต่ขั้นตอนถัดไป เช่น ออกใบเสร็จ ล้มเหลว ซึ่งต้องกำหนดการตรวจสถานะหรือคืนเงิน","correct":true,"why":"flowchart มีแต่เส้นทางปกติหลังตัดบัตร จึงไม่ได้กำหนดว่าถ้าตัดเงินไปแล้วแต่ขั้นตอนถัดไปล้มเหลวจะทำอย่างไร ซึ่งตรงกับอาการที่พบ"},{"id":"B","text":"ขั้นตอนบันทึก log ทุกจุดของการชำระเงิน เพื่อให้ตรวจย้อนหลังได้ว่าลูกค้ารายใดถูกตัดเงินโดยไม่ได้ใบเสร็จและใช้ตรวจกับธนาคารได้","correct":false,"why":"log ช่วยสืบสวนภายหลัง แต่ไม่ได้กำหนดว่าระบบต้องทำอะไรเมื่อเกิดความล้มเหลว ลูกค้าก็ยังถูกตัดเงินโดยไม่ได้ใบเสร็จ"},{"id":"C","text":"เส้นให้ลูกค้ารอในคิวเมื่อสต็อกไม่พอ แล้วกลับไปตรวจสต็อกอีกครั้งเมื่อสินค้าเข้าคลัง","correct":false,"why":"สต็อกไม่พอเกิดก่อนการตัดเงิน จึงไม่ใช่สาเหตุของลูกค้าที่ถูกตัดเงินแล้วไม่ได้ใบเสร็จ"},{"id":"D","text":"ขั้นตอนยืนยันตัวตนผู้ใช้ก่อนเริ่มตรวจสต็อก เพื่อให้แน่ใจว่าเป็นเจ้าของบัตรที่ใช้ชำระ","correct":false,"why":"เป็นเรื่องความปลอดภัยที่แยกกัน การยืนยันตัวตนไม่ได้ป้องกันความล้มเหลวหลังตัดบัตร"}],"explanation":"flowchart ที่มีแต่ happy path มักซ่อนกรณีล้มเหลวที่เกิดจริง เมื่อรีวิวแผนภาพควรไล่ถามทุกขั้นตอนที่มีผลข้างเคียง (เช่นตัดเงิน) ว่าถ้าขั้นนี้ล้มเหลวหรือไม่ตอบกลับ จะต้องเดินต่อทางใด"},{"id":"ARC-J-P-014","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J2","concept":"screen-states-loading-error-empty","mobile":true,"type":"single","stem":"หน้าประวัติคำสั่งซื้อในแอปมือถือที่ทีมทำ ออกแบบไว้เฉพาะกรณีโหลดสำเร็จและมีข้อมูล ตอนทดสอบพบว่าเมื่อเครือข่ายหลุดหน้าจอขาวค้าง และผู้ใช้ใหม่ที่ยังไม่เคยสั่งซื้อเห็นหน้าว่างเปล่าโดยไม่มีคำอธิบาย ควรใช้เครื่องมือออกแบบมาตรฐานใดเพื่อทบทวนและเติมสิ่งที่ขาด","options":[{"id":"A","text":"ER diagram ของตารางคำสั่งซื้อ เพื่อดูว่าฟิลด์ใดอาจว่างและกำหนดค่าเริ่มต้นให้ครบ","correct":false,"why":"ER diagram อธิบายโครงสร้างข้อมูล ไม่ได้อธิบายสถานะการแสดงผลของหน้าจอ"},{"id":"B","text":"Class diagram ของ ViewModel เพื่อตรวจว่ามีคลาสครบทุกส่วนและแต่ละคลาสมีความรับผิดชอบชัดเจน","correct":false,"why":"Class diagram แสดงคลาสและความสัมพันธ์ ไม่ได้ไล่ว่าหน้าจออยู่ในสถานะใดบ้างตามเหตุการณ์"},{"id":"C","text":"Deployment diagram ที่แสดงว่าแอปเชื่อมกับเซิร์ฟเวอร์ใดบ้างและผ่านเครือข่ายแบบใด","correct":false,"why":"Deployment diagram แสดงการติดตั้งและการเชื่อมต่อของระบบ ไม่ใช่พฤติกรรมของหน้าจอ"},{"id":"D","text":"State diagram ที่ระบุสถานะของหน้าจอ เช่น กำลังโหลด สำเร็จ ว่าง ผิดพลาด พร้อมการเปลี่ยนสถานะระหว่างกัน","correct":true,"why":"State diagram บังคับให้ไล่ทุกสถานะที่หน้าจออาจอยู่และทางเปลี่ยนระหว่างสถานะ จึงเห็นช่องว่างอย่างกรณีผิดพลาดและไม่มีข้อมูลที่ยังไม่มีการออกแบบ"}],"explanation":"หน้าจอที่ดึงข้อมูลจากเครือข่ายอย่างน้อยควรออกแบบสถานะ กำลังโหลด สำเร็จ ว่าง และผิดพลาด (พร้อมทางลองใหม่) การวาด state diagram หรือตารางสถานะช่วยตรวจว่าครบก่อนเขียนโค้ด"},{"id":"ARC-J-P-015","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J2","concept":"double-submit-protection","mobile":true,"type":"single","stem":"แอปมือถือมีปุ่มชำระเงิน เมื่อเครือข่ายช้า ผู้ใช้กดปุ่มซ้ำ 2-3 ครั้ง แล้วพบว่ามีคำสั่งซื้อซ้ำหลายรายการในระบบ ข้อใดแก้ปัญหานี้ได้ตรงจุดที่สุด","options":[{"id":"A","text":"ให้เซิร์ฟเวอร์หน่วงการตอบทุกคำขอ 3 วินาที เพื่อให้ผู้ใช้รอจนเสร็จโดยไม่รีบกดซ้ำ","correct":false,"why":"การหน่วงทำให้ช้าลงและยิ่งกระตุ้นให้ผู้ใช้กดซ้ำ ไม่ได้แยกคำขอซ้ำออกจากคำขอจริง"},{"id":"B","text":"ปิดปุ่มและแสดงสถานะกำลังดำเนินการระหว่างรอ พร้อมให้เซิร์ฟเวอร์ปฏิเสธคำขอซ้ำที่มีรหัสอ้างอิงเดียวกัน","correct":true,"why":"ฝั่งแอปลดการกดซ้ำและบอกสถานะให้ผู้ใช้ ส่วนฝั่งเซิร์ฟเวอร์เป็นด่านสุดท้ายที่กันคำขอซ้ำ เช่น จากการ retry ของเครือข่าย"},{"id":"C","text":"แสดงข้อความเตือนใต้ปุ่มว่า กรุณากดเพียงครั้งเดียว และรอจนกว่าหน้าจะเปลี่ยนไปหน้าถัดไป","correct":false,"why":"ผู้ใช้จำนวนมากไม่อ่านหรือยังกดซ้ำ และคำขอซ้ำจากการ retry ของเครือข่ายก็ยังเกิดได้ จึงกันซ้ำไม่ได้จริง"},{"id":"D","text":"ใช้งานชุดงานตอนกลางคืนที่ตรวจและลบคำสั่งซื้อซ้ำออก แล้วส่งอีเมลขออภัยลูกค้าที่ได้รับผลกระทบ","correct":false,"why":"เป็นการแก้ปลายเหตุ ลูกค้าอาจถูกตัดเงินซ้ำไปแล้วก่อนงานนี้ทำงาน"}],"explanation":"ปัญหากดซ้ำควรป้องกันทั้งสองฝั่ง ฝั่ง UI ลดโอกาสกดซ้ำและแสดงสถานะ ส่วนฝั่งเซิร์ฟเวอร์ต้องรับมือคำขอซ้ำได้เสมอ เพราะคำขอซ้ำเกิดจากเครือข่ายได้แม้ผู้ใช้กดครั้งเดียว"},{"id":"ARC-J-P-016","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J3","concept":"deviation-seek-guidance","mobile":false,"type":"single","stem":"ทีมมีแนวทางออกแบบ (design guideline) ว่าบริการทุกตัวต้องตอบข้อผิดพลาดเป็น JSON ในรูปแบบมาตรฐานของทีม น้องใหม่กำลังทำ endpoint ที่ต้องเชื่อมกับระบบของพันธมิตร ซึ่งกำหนดให้ตอบข้อผิดพลาดเป็น XML ตามรูปแบบของเขา น้องใหม่ควรทำอย่างไร","options":[{"id":"A","text":"ใช้ XML ตามที่พันธมิตรต้องการเลย แล้วแจ้งทีมตอนส่ง pull request เพื่อให้ส่งงานได้ทันกำหนด","correct":false,"why":"การแจ้งหลังทำเสร็จทำให้ทีมไม่มีโอกาสเสนอทางเลือกที่ดีกว่า และถ้าไม่ได้รับการยอมรับก็ต้องแก้งานที่ทำไปแล้ว"},{"id":"B","text":"ตอบ JSON มาตรฐานทุกกรณี แล้วขอให้พันธมิตรแก้ฝั่งเขาให้รับ JSON ได้ เพราะแนวทางของทีมสำคัญกว่าข้อตกลงรายกรณี ซึ่งทำให้ระบบหลักสอดคล้องกันทั้งหมด","correct":false,"why":"ระบบของพันธมิตรอาจแก้ไม่ได้หรือใช้เวลานาน การยึดแนวทางแบบไม่พิจารณาข้อจำกัดภายนอกทำให้เชื่อมระบบไม่สำเร็จ"},{"id":"C","text":"แจ้ง tech lead หรือผู้ดูแลแนวทาง พร้อมเหตุผลและทางเลือก เช่น ใช้ XML เฉพาะ endpoint ของพันธมิตร แล้วบันทึกข้อตกลง","correct":true,"why":"กรณีเบี่ยงจากแนวทางต้องมีเหตุผลที่ชัดและผู้ดูแลรับรู้ การบันทึกข้อตกลงทำให้คนอื่นเข้าใจว่าทำไมจึงต่างจากปกติ"},{"id":"D","text":"แก้เอกสารแนวทางของทีมให้อนุญาต XML แล้วทำตามเอกสารที่แก้ เพื่อให้งานนี้ไม่ผิดแนวทางอีกต่อไป","correct":false,"why":"แนวทางเป็นข้อตกลงของทั้งทีม การแก้เองโดยไม่ผ่านผู้ดูแลทำให้ทีมไม่มีฉันทามติ"}],"explanation":"แนวทางการออกแบบมีไว้ให้ทีมสอดคล้องกัน เมื่อมีเหตุผลต้องเบี่ยงเบน ให้ปรึกษาเจ้าของแนวทางก่อนลงมือ เสนอทางเลือก และบันทึกการตัดสินใจไว้ ไม่ใช่เลือกเองหรือละเลยข้อจำกัดจริง"},{"id":"ARC-J-P-017","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J1","concept":"self-contained-component-traits","mobile":false,"type":"multiple","stem":"ทีมกำลังออกแบบคอมโพเนนต์คำนวณภาษีที่จะนำไปใช้ซ้ำในหลายระบบ คุณสมบัติใดทำให้คอมโพเนนต์นี้เป็นหน่วยที่ self-contained (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ทดสอบแยกเดี่ยว ๆ ได้โดยป้อนข้อมูลตัวอย่างและตรวจผลลัพธ์","correct":true,"why":"ความสามารถในการทดสอบโดยลำพังเป็นสัญญาณว่าคอมโพเนนต์พึ่งพาสิ่งภายนอกน้อย"},{"id":"B","text":"เรียกโค้ดภายในของโมดูลอื่นโดยตรงเมื่อต้องการข้อมูลเพิ่ม เพราะเร็วกว่าผ่าน interface","correct":false,"why":"การพึ่งโค้ดภายในของผู้อื่นทำให้เมื่อโมดูลนั้นเปลี่ยนโครงสร้าง คอมโพเนนต์นี้พังตามและแยกออกมาใช้ซ้ำไม่ได้"},{"id":"C","text":"เปิดเผยฟังก์ชันหรือ interface ที่ชัดเจนเพียงไม่กี่จุด โดยผู้เรียกไม่จำเป็นต้องรู้โครงสร้างภายใน","correct":true,"why":"interface ที่เล็กและชัดเจนทำให้เปลี่ยนภายในได้โดยผู้ใช้ไม่ได้รับผลกระทบ"},{"id":"D","text":"อ่านอัตราภาษีจากตารางในฐานข้อมูลของระบบสั่งซื้อโดยตรง เพื่อให้ตรงกับข้อมูลจริงเสมอ","correct":false,"why":"ผูกคอมโพเนนต์กับ schema ของระบบหนึ่ง ระบบอื่นที่ไม่มีตารางนั้นนำไปใช้ไม่ได้ ควรรับอัตราภาษีเป็น input หรือผ่าน interface"},{"id":"E","text":"รับข้อมูลที่ใช้คำนวณผ่านพารามิเตอร์ แทนการอ่านจากตัวแปร global หรือ session ของระบบใดระบบหนึ่ง","correct":true,"why":"การรับ input ชัดเจนทำให้ผลลัพธ์ขึ้นกับข้อมูลที่ส่งเข้ามา ไม่ผูกกับสภาพแวดล้อมของระบบใดระบบหนึ่ง จึงนำไปใช้ซ้ำได้"}],"explanation":"คอมโพเนนต์ที่ self-contained มีขอบเขตชัด สื่อสารผ่าน interface ที่ประกาศไว้ รับข้อมูลผ่านพารามิเตอร์ และไม่พึ่งโค้ดภายในหรือสถานะซ่อนของผู้อื่น ทำให้ใช้ซ้ำ ทดสอบ และเปลี่ยนภายในได้ง่าย"},{"id":"ARC-J-P-018","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J4","concept":"component-doc-contents","mobile":false,"type":"single","stem":"ทีมต้องเขียนเอกสารของบริการแจ้งเตือน เพื่อให้นักพัฒนาที่เพิ่งเข้าทีมเริ่มใช้และดูแลได้ภายในวันแรก เนื้อหาชุดใดมีประโยชน์ที่สุด","options":[{"id":"A","text":"อธิบายทุกคลาสและทุกเมธอดอย่างละเอียดทีละไฟล์ เพื่อให้ผู้อ่านเห็นรายละเอียดครบทุกจุด","correct":false,"why":"ซ้ำกับสิ่งที่อ่านได้จากโค้ดอยู่แล้ว และล้าสมัยทันทีที่โค้ดเปลี่ยน ผู้อ่านเห็นรายละเอียดมากแต่ไม่เห็นภาพรวม"},{"id":"B","text":"ประวัติการแก้ไขของแต่ละไฟล์เรียงตามวันที่ พร้อมชื่อผู้แก้และข้อความ commit ของทุกครั้ง","correct":false,"why":"ข้อมูลนี้มีอยู่ในประวัติของ version control อยู่แล้ว และไม่ช่วยให้ผู้เริ่มต้นเข้าใจว่าบริการทำอะไรหรือใช้อย่างไร"},{"id":"C","text":"รายชื่อสมาชิกทีมที่เคยร่วมพัฒนา และบันทึกการประชุมทุกครั้งตั้งแต่เริ่มโครงการ","correct":false,"why":"ข้อมูลเชิงกระบวนการที่ผู้เริ่มต้นไม่ได้ใช้ในวันแรก และยาวเกินกว่าจะเปิดหาสิ่งที่ต้องการได้เร็ว"},{"id":"D","text":"วัตถุประสงค์ของบริการ แผนภาพภาพรวมว่าเชื่อมกับใคร ตัวอย่าง request/response วิธีรันบนเครื่อง และค่าที่ต้องตั้ง","correct":true,"why":"ครอบคลุมสิ่งที่ผู้เริ่มต้นต้องรู้: ทำอะไร ต่อกับอะไร เรียกอย่างไร รันอย่างไร และตั้งค่าอะไร"}],"explanation":"เอกสารที่ดีตอบคำถามของผู้อ่านตามเป้าหมาย: ผู้เริ่มต้นต้องการภาพรวม วิธีใช้ และวิธีรัน มากกว่ารายละเอียดทุกบรรทัด เอกสารที่ซ้ำกับโค้ดมักล้าสมัยและสร้างภาระดูแลโดยไม่มีประโยชน์"},{"id":"ARC-J-P-019","level":"junior","pool":"practice","competency":"System Design","descriptor":"SD-J4","concept":"architecture-diagram-quality","mobile":false,"type":"multiple","stem":"ทีมต้องวาดแผนภาพสถาปัตยกรรมภาพรวมของระบบจองห้องพัก เพื่อใช้อธิบายให้ทั้งทีมพัฒนาและฝ่ายธุรกิจ ข้อใดทำให้แผนภาพสื่อสารได้ดี (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ติดป้ายกำกับบนลูกศรให้บอกชนิดการเชื่อมต่อหรือข้อมูลที่ส่ง เช่น HTTPS: ข้อมูลการจอง","correct":true,"why":"ป้ายกำกับทำให้ผู้อ่านรู้ว่าส่วนต่าง ๆ คุยกันด้วยอะไรและส่งอะไร แทนที่จะเห็นเพียงเส้นเชื่อมที่ตีความได้หลายแบบ"},{"id":"B","text":"ใส่ทุกคลาสและทุกตารางลงในแผนภาพเดียว เพื่อให้ข้อมูลครบถ้วนที่สุด","correct":false,"why":"แผนภาพภาพรวมที่แน่นเกินไปอ่านไม่ออก ควรเก็บรายละเอียดไว้ในแผนภาพระดับล่างที่แยกออกไป"},{"id":"C","text":"ให้แต่ละคนที่แก้แผนภาพเลือกสีและรูปทรงเองตามส่วนที่ตนดูแล เพื่อให้เห็นว่าใครรับผิดชอบส่วนใด","correct":false,"why":"ความไม่สม่ำเสมอทำให้ผู้อ่านเข้าใจผิด เพราะรูปทรงหรือสีเดียวกันอาจหมายถึงต่างชนิดกันในแต่ละส่วนของภาพ"},{"id":"D","text":"มีคำอธิบายสัญลักษณ์ (legend) สำหรับรูปทรงและสีที่ใช้ และตั้งชื่อกล่องตามชื่อที่ใช้จริงในทีม","correct":true,"why":"legend ทำให้ผู้อ่านตีความรูปทรงและสีได้ตรงกัน และชื่อที่ตรงกับของจริงทำให้ตามไปหาในโค้ดหรือระบบได้"},{"id":"E","text":"วาดเฉพาะบริการภายในของทีม และตัดระบบภายนอก เช่น payment gateway และ LINE ออกเพื่อความเรียบง่าย","correct":false,"why":"ระบบภายนอกเป็นจุดเชื่อมต่อและจุดเสี่ยงสำคัญ การตัดออกทำให้ภาพรวมไม่ตรงกับการทำงานจริง"}],"explanation":"แผนภาพสถาปัตยกรรมที่ดีมีระดับรายละเอียดเหมาะกับผู้อ่าน ป้ายกำกับบนเส้น legend และชื่อที่ตรงกับของจริง รวมถึงแสดงระบบภายนอกที่เชื่อมต่อ เพื่อให้คนต่างบทบาทอ่านแล้วเข้าใจตรงกัน"},{"id":"ARC-J-P-020","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J1","concept":"key-value-otp-ttl","mobile":false,"type":"single","stem":"ระบบ login ด้วย OTP ทางเอสเอ็มเอสต้องเก็บรหัส OTP ของเบอร์โทรแต่ละเบอร์ไว้ 5 นาที แล้วหมดอายุเอง การอ่านเขียนต้องเร็ว และมีผู้ใช้ขอ OTP พร้อมกันจำนวนมาก ที่เก็บข้อมูลแบบใดเหมาะที่สุด","options":[{"id":"A","text":"ตารางในฐานข้อมูลหลักที่มีคอลัมน์ expires_at และงานตามเวลาที่ลบแถวหมดอายุทุกชั่วโมง","correct":false,"why":"ใช้งานได้ แต่เพิ่มภาระเขียนให้ฐานข้อมูลหลักในช่วงที่ผู้ใช้ขอ OTP พร้อมกันมาก และแถวที่หมดอายุยังค้างอยู่จนกว่างานลบจะทำงาน"},{"id":"B","text":"key-value store ที่ใช้เบอร์โทรเป็น key และกำหนด TTL 5 นาทีให้รายการหายเอง","correct":true,"why":"งานนี้เป็นการอ่านเขียนด้วย key ตรง ๆ และต้องหมดอายุอัตโนมัติ ซึ่ง key-value store ที่รองรับ TTL ตอบโจทย์ได้เร็วและเรียบง่าย"},{"id":"C","text":"เก็บ OTP เป็นฟิลด์ใน document โปรไฟล์ผู้ใช้ในฐานข้อมูลแบบ document","correct":false,"why":"ข้อมูลชั่วคราวปนกับข้อมูลถาวรในเอกสารเดียวกัน และการเขียนทับเอกสารโปรไฟล์ทุกครั้งที่ขอ OTP เป็นภาระที่ไม่จำเป็น"},{"id":"D","text":"เขียนไฟล์ข้อความบนเซิร์ฟเวอร์ โดยใช้เบอร์โทรเป็นชื่อไฟล์","correct":false,"why":"เมื่อมีเซิร์ฟเวอร์หลายตัว คำขอตรวจ OTP อาจไปตกที่เครื่องที่ไม่มีไฟล์ และไม่มีกลไกหมดอายุในตัว"}],"explanation":"ข้อมูลชั่วคราวที่เข้าถึงด้วย key และต้องหมดอายุเอง เช่น OTP, session หรือ cache เหมาะกับ key-value store ที่มี TTL เพราะเรียบง่าย เร็ว และไม่เพิ่มภาระให้ฐานข้อมูลหลัก"},{"id":"ARC-J-P-021","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J1","concept":"document-store-varied-attributes","mobile":false,"type":"single","stem":"ร้านค้าออนไลน์ขายทั้งโน้ตบุ๊ก (CPU, RAM, ขนาดจอ) เสื้อผ้า (ไซซ์, สี, วัสดุ) และอาหารเสริม (วันหมดอายุ, ส่วนผสม) ทีมเพิ่มประเภทสินค้าใหม่ทุกเดือนพร้อมคุณสมบัติที่ต่างกัน และส่วนใหญ่อ่านสินค้าทีละชิ้นพร้อมคุณสมบัติทั้งหมด แนวทางเก็บข้อมูลสินค้าใดเหมาะ","options":[{"id":"A","text":"ตารางเดียวที่มีคอลัมน์ครบทุกคุณสมบัติของทุกประเภท โดยปล่อยค่า NULL ในคอลัมน์ที่ไม่เกี่ยวข้อง","correct":false,"why":"ทำงานได้ แต่ตารางกว้างขึ้นและเต็มไปด้วย NULL ทุกครั้งที่มีประเภทใหม่ต้องเพิ่มคอลัมน์ผ่านการปรับ schema"},{"id":"B","text":"key-value store ที่ key เป็นรหัสสินค้า และ value เป็นข้อความเดียวที่คั่นคุณสมบัติด้วยเครื่องหมาย |","correct":false,"why":"โครงสร้างข้อมูลถูกซ่อนในข้อความที่แอปต้องแยกเอง ฟิลด์ใดเปลี่ยนรูปแบบก็ทำให้อ่านผิด และไม่มีชนิดข้อมูลของแต่ละคุณสมบัติ"},{"id":"C","text":"document database เก็บสินค้าแต่ละชิ้นเป็นเอกสาร JSON ที่มีฟิลด์คุณสมบัติตามประเภทของตัวเอง","correct":true,"why":"เอกสารแต่ละชิ้นมีฟิลด์ต่างกันได้ เพิ่มประเภทใหม่โดยไม่ต้องแก้ schema และการอ่านสินค้าชิ้นเดียวได้ครบในครั้งเดียว"},{"id":"D","text":"ตารางแยกต่อประเภทสินค้า สร้างตารางใหม่ทุกครั้งที่มีประเภทใหม่","correct":false,"why":"ต้องเปลี่ยน schema ทุกเดือน และการแสดงรายการสินค้ารวมหลายประเภทต้องรวมผลจากหลายตาราง"}],"explanation":"ข้อมูลที่แต่ละรายการมีโครงสร้างต่างกันและมักอ่านทีละรายการทั้งก้อน เหมาะกับ document database เพราะเก็บเป็นเอกสารยืดหยุ่นได้ ในขณะที่ข้อมูลที่โครงสร้างเหมือนกันและเชื่อมโยงกันมากยังเหมาะกับฐานข้อมูลเชิงสัมพันธ์"},{"id":"ARC-J-P-022","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J1","concept":"document-vs-relational-fit","mobile":false,"type":"multiple","stem":"ทีมกำลังเลือกระหว่างฐานข้อมูลแบบ document (NoSQL) กับฐานข้อมูลเชิงสัมพันธ์ให้เหมาะกับลักษณะงาน ข้อใดเลือกได้เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เก็บการตั้งค่าส่วนตัวของผู้ใช้ที่โครงสร้างของแต่ละคนไม่เท่ากัน ด้วย document database","correct":true,"why":"โครงสร้างต่างกันต่อรายการเป็นจุดเด่นของ document เก็บเป็นเอกสารเดียวต่อผู้ใช้และอ่านครั้งเดียวได้ครบ"},{"id":"B","text":"เก็บรายงานที่ต้อง join ข้อมูล 6 ตารางและ group ตามหลายมิติเป็นประจำ ด้วย document database เพราะอ่านเร็วกว่าเสมอ","correct":false,"why":"document database ไม่ได้เร็วกว่าในทุกกรณี งานที่ต้องรวมและจัดกลุ่มข้ามชุดข้อมูลหลายชุดถนัดกับ SQL มากกว่า"},{"id":"C","text":"เก็บบัญชีแยกประเภทและการโอนเงินที่ต้องเชื่อมหลายตารางและความถูกต้องสำคัญมาก ด้วยฐานข้อมูลเชิงสัมพันธ์","correct":true,"why":"schema ที่บังคับ constraint, foreign key และ transaction ที่เชื่อถือได้เหมาะกับข้อมูลการเงินที่ต้องเชื่อมโยงและตรวจสอบได้"},{"id":"D","text":"เก็บข้อมูลที่ทุกแถวมีโครงสร้างเหมือนกันและมีความสัมพันธ์ชัดเจน ด้วย document database เพราะ NoSQL ทันสมัยกว่า","correct":false,"why":"ความทันสมัยไม่ใช่เกณฑ์เลือก ข้อมูลที่โครงสร้างคงที่และเชื่อมโยงกันมากใช้ประโยชน์จาก constraint ของฐานข้อมูลเชิงสัมพันธ์ได้เต็มที่"}],"explanation":"เลือกฐานข้อมูลจากลักษณะข้อมูลและรูปแบบการใช้งาน ไม่ใช่จากความนิยม document เหมาะกับข้อมูลที่รูปร่างต่างกันและอ่านเป็นก้อน ส่วนข้อมูลที่เชื่อมโยงกันมากและต้องการความถูกต้องเข้มงวดเหมาะกับฐานข้อมูลเชิงสัมพันธ์"},{"id":"ARC-J-P-023","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J1","concept":"mobile-local-storage-split","mobile":true,"type":"single","stem":"แอปมือถือส่งอาหารต้องเก็บข้อมูลบนเครื่อง 2 ชนิด คือค่าตั้งค่าเล็ก ๆ (ภาษา ธีม) และประวัติคำสั่งซื้อย้อนหลังหลายพันรายการที่ผู้ใช้เปิดดูได้แม้ออฟไลน์ และต้องกรองตามสถานะ เรียงตามวันที่ได้ ที่เก็บข้อมูลบนเครื่องแบบใดจับคู่กับข้อมูลได้เหมาะสม","options":[{"id":"A","text":"ค่าตั้งค่าเก็บเป็นคู่ key-value ส่วนประวัติคำสั่งซื้อเก็บในฐานข้อมูลบนเครื่องที่ค้นหาและกรองได้","correct":true,"why":"ค่าตั้งค่าเป็นข้อมูลเล็กที่อ่านด้วย key ตรง ๆ ส่วนประวัติเป็นรายการจำนวนมากที่ต้องกรองและเรียง ฐานข้อมูลบนเครื่องรองรับได้โดยไม่ต้องโหลดทั้งหมด"},{"id":"B","text":"เก็บทั้งสองอย่างเป็น key-value โดยต่อประวัติคำสั่งซื้อทั้งหมดเป็นข้อความ JSON ก้อนเดียวใต้ key เดียว","correct":false,"why":"การกรองหรือเรียงต้องโหลดและแปลงข้อความทั้งก้อนเข้าหน่วยความจำก่อน ยิ่งประวัติยาวยิ่งช้าและกินหน่วยความจำ"},{"id":"C","text":"เก็บค่าตั้งค่าเป็นแถวในตารางของฐานข้อมูลบนเครื่อง ส่วนประวัติคำสั่งซื้อเก็บเป็นไฟล์ JSON แยกไฟล์ละหนึ่งรายการ","correct":false,"why":"การกรองตามสถานะและเรียงตามวันที่ต้องเปิดอ่านไฟล์ทีละไฟล์ ซึ่งช้าเมื่อมีหลายพันรายการ ส่วนฐานข้อมูลที่เหมาะกับการกรองกลับถูกใช้กับค่าตั้งค่าที่ไม่ต้องกรอง"},{"id":"D","text":"ไม่เก็บบนเครื่อง ดึงจากเซิร์ฟเวอร์ทุกครั้งที่เปิดแอป","correct":false,"why":"ขัดกับความต้องการให้เปิดดูได้ขณะออฟไลน์ และทุกครั้งที่เปิดแอปต้องรอเครือข่าย"}],"explanation":"บนอุปกรณ์ก็ใช้หลักเดียวกับฝั่งเซิร์ฟเวอร์ คือเลือกที่เก็บให้ตรงกับรูปแบบการเข้าถึง ข้อมูลเล็กที่อ่านด้วย key เหมาะกับ key-value ส่วนข้อมูลเป็นรายการที่ต้องกรองเรียงเหมาะกับฐานข้อมูลบนเครื่อง"},{"id":"ARC-J-P-024","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J2","concept":"many-to-many-junction-table","mobile":false,"type":"single","stem":"โรงเรียนกวดวิชามีนักเรียนที่ลงเรียนได้หลายวิชา และแต่ละวิชามีนักเรียนหลายคน ในการออกแบบ ER diagram และสร้างตารางจริง ควรจัดการความสัมพันธ์นี้อย่างไร","options":[{"id":"A","text":"ใส่คอลัมน์ course_id ในตาราง students และเพิ่ม course_id_2, course_id_3 เมื่อนักเรียนลงหลายวิชาตามจำนวนสูงสุดที่พบ","correct":false,"why":"จำกัดจำนวนวิชาด้วยจำนวนคอลัมน์ที่เพิ่มไว้ และการค้นหานักเรียนของวิชาหนึ่งต้องไล่ดูทุกคอลัมน์"},{"id":"B","text":"สร้างตารางกลาง (เช่น enrollments) ที่มี student_id และ course_id เป็น foreign key ไปยังทั้งสองตาราง","correct":true,"why":"ความสัมพันธ์หลายต่อหลายแตกเป็นสองความสัมพันธ์แบบหนึ่งต่อหลาย โดยมีตารางกลางเก็บแต่ละการลงทะเบียนเป็นหนึ่งแถว"},{"id":"C","text":"ใส่คอลัมน์ student_id ในตาราง courses เป็น foreign key ไปยังตาราง students","correct":false,"why":"วิชาหนึ่งเก็บนักเรียนได้เพียงคนเดียว ไม่รองรับกรณีหลายคนต่อวิชา"},{"id":"D","text":"เก็บรหัสวิชาหลายตัวคั่นด้วยเครื่องหมายจุลภาคในคอลัมน์เดียวของตาราง students","correct":false,"why":"ฐานข้อมูลบังคับ foreign key กับรายการในข้อความคั่นไม่ได้ และการค้นหาหรือ join ตามวิชาทำได้ยาก"}],"explanation":"ความสัมพันธ์แบบหลายต่อหลายใน ER diagram ต้องแปลงเป็นตารางกลาง (junction table) ที่เก็บ foreign key ของทั้งสองฝั่ง ตารางนี้ยังเพิ่มข้อมูลของการลงทะเบียนเอง เช่น วันที่ลงทะเบียนหรือเกรดได้"},{"id":"ARC-J-P-025","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J2","concept":"primary-key-surrogate-vs-natural","mobile":false,"type":"single","stem":"ตารางลูกค้าของคลินิกต้องเลือก primary key ทีมเสนอให้ใช้เลขบัตรประชาชน 13 หลักเพราะไม่ซ้ำกันแน่นอน และค่านี้จะถูกใช้เป็น foreign key ในตารางนัดหมาย ใบเสร็จ และผลตรวจ ข้อเสนอแนะใดสมเหตุสมผลที่สุด","options":[{"id":"A","text":"ใช้เลขบัตรประชาชนได้ เพราะไม่ซ้ำและไม่เปลี่ยน จึงเป็น natural key ที่ดีที่สุดสำหรับข้อมูลลูกค้า","correct":false,"why":"เลขบัตรอาจกรอกผิดแล้วต้องแก้ ลูกค้าต่างชาติไม่มีเลขบัตรไทย และการเป็น key ทำให้ข้อมูลอ่อนไหวไปปรากฏในทุกตารางที่อ้างอิง"},{"id":"B","text":"ใช้ชื่อกับนามสกุลเป็น composite key เพราะอ่านง่ายกว่าและตรงกับที่เจ้าหน้าที่ใช้ค้นหาอยู่แล้ว","correct":false,"why":"ชื่อและนามสกุลซ้ำกันได้ในคนละคน และอาจเปลี่ยนภายหลัง ไม่เหมาะเป็นตัวระบุแถว"},{"id":"C","text":"ไม่กำหนด primary key แต่สร้าง unique index บนเลขบัตรแทน เพราะให้ผลเรื่องความไม่ซ้ำเหมือนกัน","correct":false,"why":"ตารางที่ไม่มี primary key ทำให้ระบุแถวและอ้างอิงด้วย foreign key ได้ไม่เป็นมาตรฐาน และเครื่องมืออย่าง ORM หลายตัวอาจคาดหวังว่ามี primary key"},{"id":"D","text":"ใช้ค่าที่ระบบสร้างเอง (เลขรันหรือ UUID) เป็น primary key เพราะเลขบัตรเป็นข้อมูลส่วนบุคคลที่จะกระจายไปทุกตาราง","correct":true,"why":"ตัวระบุที่ไม่มีความหมายทางธุรกิจไม่เปิดเผยข้อมูลส่วนบุคคลไปตามตารางอื่นและ log ลดความเสี่ยงตาม PDPA และไม่ต้องแก้ทุกตารางหากเลขบัตรถูกกรอกผิดแล้วต้องแก้"}],"explanation":"primary key ควรไม่ซ้ำ ไม่เป็นค่าว่าง และไม่ควรเปลี่ยน ตัวระบุที่ระบบสร้างเอง (surrogate key) ตอบโจทย์นี้โดยไม่ผูกกับข้อมูลส่วนบุคคล ส่วนเลขบัตรประชาชนควรเก็บเป็นคอลัมน์ธรรมดาที่ป้องกันตามนโยบายความเป็นส่วนตัว"},{"id":"ARC-J-P-026","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J2","concept":"schema-constraints-definition","mobile":false,"type":"multiple","stem":"ทีมกำลังนิยามสคีมาของตาราง users สำหรับระบบสมัครสมาชิก ข้อใดเป็นการกำหนดข้อจำกัดของคอลัมน์ที่ช่วยรักษาความถูกต้องของข้อมูลได้เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"กำหนด NOT NULL ให้คอลัมน์ที่ต้องมีค่าเสมอ เช่น created_at","correct":true,"why":"ป้องกันไม่ให้แถวที่ขาดข้อมูลจำเป็นถูกบันทึกลงตาราง"},{"id":"B","text":"กำหนด NOT NULL ให้ทุกคอลัมน์ รวมถึงข้อมูลที่ไม่บังคับ เช่น ชื่อกลาง เพื่อให้ข้อมูลครบเสมอ","correct":false,"why":"ข้อมูลที่ไม่บังคับถูกบังคับให้กรอก ผู้ใช้จึงมักใส่ค่าหลอกอย่าง - หรือ x เพื่อให้ผ่าน ทำให้ข้อมูลคุณภาพต่ำลง"},{"id":"C","text":"กำหนด UNIQUE ให้คอลัมน์ email เพื่อป้องกันสมาชิกสองคนสมัครด้วยอีเมลเดียวกัน","correct":true,"why":"ฐานข้อมูลปฏิเสธแถวที่ซ้ำเอง แม้คำขอสมัครสองรายการมาถึงพร้อมกัน"},{"id":"D","text":"กำหนด foreign key จาก orders.user_id ไปยัง users.id เพื่อไม่ให้มีคำสั่งซื้อของผู้ใช้ที่ไม่มีอยู่จริง","correct":true,"why":"ฐานข้อมูลตรวจความมีอยู่ของแถวที่อ้างอิง ป้องกันข้อมูลลอย (orphan row)"},{"id":"E","text":"กำหนดทุกคอลัมน์เป็น VARCHAR(255) เพื่อให้เก็บข้อมูลได้ทุกชนิดโดยไม่เกิด error","correct":false,"why":"เสียการตรวจชนิดข้อมูลของฐานข้อมูล เช่น วันที่เก็บเป็นข้อความจะเรียงและเปรียบเทียบผิดแบบ และค่าที่เพี้ยนก็ถูกบันทึกได้โดยไม่แจ้งเตือน"}],"explanation":"constraint ใน schema (UNIQUE, NOT NULL, foreign key, ชนิดข้อมูลที่เหมาะสม) เป็นด่านป้องกันข้อมูลผิดที่ไม่ขึ้นกับโค้ดของแอป การตรวจในแอปยังจำเป็นเพื่อให้ผู้ใช้เห็นข้อความที่ดี แต่ไม่ควรเป็นด่านเดียว"},{"id":"ARC-J-P-027","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J3","concept":"backup-restore-test","mobile":false,"type":"single","stem":"ฝ่ายไอทีตั้งงานสำรองฐานข้อมูลด้วยเครื่องมือ dump ที่มากับฐานข้อมูล รันทุกคืนมา 1 ปี ไฟล์สำรองเสร็จทุกครั้งโดยไม่มี error วันหนึ่งฐานข้อมูลเสียหาย ผู้ดูแลพบว่า restore แล้วข้อมูลบางตารางหายและไฟล์สำรองบางวันเสียหาย ควรเพิ่มขั้นตอนใดในแผนสำรองข้อมูล","options":[{"id":"A","text":"ทดสอบ restore ไฟล์สำรองไปยังเครื่องทดสอบเป็นรอบ ๆ และตรวจจำนวนข้อมูลเทียบกับต้นฉบับ","correct":true,"why":"มีเพียงการ restore จริงเท่านั้นที่พิสูจน์ได้ว่าไฟล์สำรองใช้การได้และข้อมูลครบ ทำให้พบปัญหาก่อนวันที่ต้องใช้จริง"},{"id":"B","text":"เปลี่ยนจากสำรองทุกคืนเป็นสำรองทุกชั่วโมง เพื่อให้มีไฟล์ให้เลือกมากขึ้นในกรณีที่ไฟล์ของบางวันมีปัญหา","correct":false,"why":"ถี่ขึ้นลดข้อมูลที่เสียได้ แต่ไม่ได้พิสูจน์ว่าแต่ละไฟล์ใช้การได้ และสาเหตุที่ทำให้ไฟล์เสียก็ยังอยู่"},{"id":"C","text":"ตรวจขนาดไฟล์สำรองทุกเช้าว่ามากกว่า 0 ไบต์","correct":false,"why":"ไฟล์ที่ไม่ว่างยังอาจเสียหายหรือข้อมูลไม่ครบ ขนาดไฟล์ไม่ได้บอกว่า restore ได้"},{"id":"D","text":"เพิ่มบรรทัด log ว่าสำเร็จทุกครั้งที่งาน dump จบ","correct":false,"why":"ข้อความสำเร็จของ dump หมายถึงคำสั่งทำงานจบ ไม่ได้รับประกันว่าไฟล์ที่ได้จะ restore ได้ครบ"}],"explanation":"ไฟล์สำรองที่ไม่เคยลอง restore ถือว่ายังไม่ได้พิสูจน์ว่าใช้การได้ ควรซ้อม restore เป็นประจำบนเครื่องแยก และตรวจความครบถ้วนของข้อมูล ไม่ใช่ดูเพียงว่างานสำรองจบโดยไม่มี error"},{"id":"ARC-J-P-028","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J3","concept":"backup-storage-location-encryption","mobile":false,"type":"multiple","stem":"ฐานข้อมูลของแอปคลินิกมีข้อมูลส่วนบุคคลของผู้ป่วย ข้อใดเป็นแนวปฏิบัติที่เหมาะสมในการสำรองข้อมูลและเก็บไฟล์สำรอง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เข้ารหัสไฟล์สำรองและจำกัดสิทธิ์การเข้าถึง เช่นเดียวกับข้อมูลจริง","correct":true,"why":"ไฟล์สำรองมีข้อมูลส่วนบุคคลเหมือนต้นฉบับ หากรั่วไหลก็เสี่ยงต่อ PDPA เท่ากัน"},{"id":"B","text":"สำรองด้วยการคัดลอกไฟล์ข้อมูลของฐานข้อมูลที่กำลังทำงานอยู่โดยตรง แทนการใช้เครื่องมือสำรองที่มากับฐานข้อมูล","correct":false,"why":"ไฟล์ข้อมูลที่กำลังถูกเขียนอาจถูกคัดลอกมาในสภาพที่ไม่สอดคล้องกันจนกู้คืนไม่ได้ เครื่องมือสำรองของฐานข้อมูลจัดการให้ข้อมูลสอดคล้องกันขณะสำรอง"},{"id":"C","text":"เก็บสำเนาไว้นอกเครื่องและนอกพื้นที่เดียวกับฐานข้อมูลหลัก เช่น บนที่เก็บข้อมูลคลาวด์ต่างภูมิภาค","correct":true,"why":"ถ้าเครื่องหรือศูนย์ข้อมูลเสียหายพร้อมกัน สำเนาที่อยู่ที่เดียวกันก็หายไปด้วย สำเนาต่างสถานที่ช่วยให้กู้คืนได้"},{"id":"D","text":"ตั้งเวลาสำรองอัตโนมัติ กำหนดระยะเวลาเก็บ และลบไฟล์ที่เกินกำหนด","correct":true,"why":"งานอัตโนมัติลดโอกาสลืม และการกำหนดอายุเก็บช่วยไม่ให้ข้อมูลส่วนบุคคลสะสมเกินความจำเป็น"}],"explanation":"แผนสำรองข้อมูลที่ดีเก็บสำเนาต่างสถานที่ ป้องกันไฟล์สำรองเหมือนข้อมูลจริง และตั้งเวลาพร้อมนโยบายอายุเก็บ ข้อมูลสุขภาพเป็นข้อมูลอ่อนไหวตาม PDPA จึงต้องควบคุมสิทธิ์และการเข้ารหัสด้วย"},{"id":"ARC-J-P-029","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J4","concept":"atomicity-transfer","mobile":false,"type":"single","stem":"ระบบกระเป๋าเงินโอนเงินระหว่างผู้ใช้ด้วยสองคำสั่งด้านล่าง ซึ่งรันแยกกันแบบ auto-commit วันหนึ่งแอปเซิร์ฟเวอร์ crash ระหว่างสองคำสั่ง ผลคือเงิน 500 บาทหายไป ควรแก้โดยใช้คุณสมบัติใดของฐานข้อมูล","code":"UPDATE wallets SET balance = balance - 500 WHERE user_id = 1;\nUPDATE wallets SET balance = balance + 500 WHERE user_id = 2;","codeLang":"sql","options":[{"id":"A","text":"สร้าง index บน user_id ของตาราง wallets เพื่อให้สองคำสั่งเสร็จเร็วขึ้นจน crash คั่นกลางได้ยากขึ้นมาก โดยไม่แก้โครงสร้างโค้ดเดิม","correct":false,"why":"index ทำให้ค้นหาแถวเร็วขึ้น แต่ไม่ได้รับประกันว่าสองคำสั่งจะสำเร็จหรือล้มเหลวพร้อมกัน ช่องว่างระหว่างสองคำสั่งยังมีอยู่"},{"id":"B","text":"สลับลำดับเป็นเพิ่มเงินผู้รับก่อน แล้วจึงหักเงินผู้โอน","correct":false,"why":"ถ้า crash คั่นกลาง ผู้รับจะได้เงินเพิ่มโดยที่ผู้โอนยังไม่ถูกหัก ปัญหากลับด้านแต่ไม่ได้หายไป"},{"id":"C","text":"ครอบทั้งสองคำสั่งใน transaction เดียว (BEGIN ... COMMIT) ให้สำเร็จทั้งคู่หรือยกเลิกทั้งคู่ (atomicity)","correct":true,"why":"ถ้า crash ก่อน COMMIT ฐานข้อมูลจะยกเลิกการเปลี่ยนแปลงที่ยังไม่ commit ทั้งหมด ยอดผู้โอนจึงไม่ถูกหักลอย ๆ"},{"id":"D","text":"ให้แอป retry คำสั่งที่สองจนกว่าจะสำเร็จ","correct":false,"why":"ถ้าแอปเซิร์ฟเวอร์ crash ทั้งตัว โค้ด retry ก็ไม่ได้ทำงานต่อ และถ้าคำสั่งแรกเคยรันไปแล้วก็ไม่มีกลไกยกเลิก"}],"explanation":"งานที่ต้องเปลี่ยนหลายแถวพร้อมกันให้ถือเป็นหน่วยเดียว ควรครอบด้วย transaction เพื่อให้ได้ atomicity คือสำเร็จทั้งชุดหรือไม่เปลี่ยนอะไรเลย หากการเชื่อมต่อขาดหรือแอป crash ก่อน COMMIT ฐานข้อมูลจะยกเลิกการเปลี่ยนแปลงที่ยังไม่ commit ให้เอง"},{"id":"ARC-J-P-030","level":"junior","pool":"practice","competency":"Database Design","descriptor":"DB-J4","concept":"isolation-concurrent-stock","mobile":false,"type":"single","stem":"สินค้ารุ่นหนึ่งเหลือ 1 ชิ้น ในช่วง flash sale ลูกค้า 2 คนกดซื้อพร้อมกันภายในเสี้ยววินาที โค้ดทำงานตามด้านล่าง ผลคือเกิดสองออเดอร์ทั้งที่มีของชิ้นเดียว คุณสมบัติ ACID ข้อใดเกี่ยวข้องกับปัญหานี้โดยตรงที่สุด และแก้อย่างไร","code":"const stock = await db.getStock(sku);\nif (stock > 0) {\n  await db.setStock(sku, stock - 1);\n  await db.createOrder(sku, userId);\n}","codeLang":"typescript","options":[{"id":"A","text":"Durability: บังคับเขียนข้อมูลลงดิสก์ทันทีหลังตัดสต็อก เพื่อให้ค่าสต็อกไม่หายหากเครื่องดับกลางคัน เพราะข้อมูลที่ตัดแล้วอาจสูญหายหลังเกิดเหตุขัดข้อง","correct":false,"why":"ค่าสต็อกไม่ได้หาย ปัญหาเกิดจากสองคำขอที่อ่านค่าเดิมซ้อนกันก่อนที่ใครจะเขียน durability ไม่เกี่ยวกับกรณีนี้"},{"id":"B","text":"Consistency: เพิ่ม CHECK ให้สต็อกห้ามติดลบ","correct":false,"why":"สองคำขอต่างอ่านค่า 1 แล้วเขียน 0 เหมือนกัน ค่า 0 ไม่ละเมิด CHECK จึงไม่ถูกปฏิเสธและยังเกิดสองออเดอร์"},{"id":"C","text":"Atomicity: ครอบสามขั้นตอนด้วย transaction แล้วคงวิธีอ่านและเขียนเดิมไว้ ไม่เปลี่ยนวิธีล็อกหรือเงื่อนไขของคำสั่งตัดสต็อก","correct":false,"why":"atomicity รับประกันว่าแต่ละธุรกรรมสำเร็จหรือยกเลิกทั้งชุด แต่ที่ระดับ isolation เริ่มต้นของฐานข้อมูลส่วนใหญ่ สองธุรกรรมยังอ่านค่า 1 พร้อมกันได้"},{"id":"D","text":"Isolation: ครอบด้วย transaction ที่ล็อกแถวสต็อก หรือใช้ UPDATE แบบมีเงื่อนไขในประโยคเดียว ไม่ให้สองคำขอเห็นค่า 1 พร้อมกัน","correct":true,"why":"ปัญหาคือสองธุรกรรมที่ทำงานซ้อนกันเห็นค่าเดียวกันแล้วตัดสินใจจากค่านั้น การล็อกแถวหรือ UPDATE แบบมีเงื่อนไขทำให้คำขอที่สองต้องรอหรือเห็นผลของคำขอแรก"}],"explanation":"การอ่านแล้วตัดสินใจแล้วเขียนแยกกันเป็นสามขั้น (read-then-write) เสี่ยง race condition เมื่อมีคำขอพร้อมกัน แก้ด้วยการให้ฐานข้อมูลควบคุมการซ้อนกัน เช่น ล็อกแถว หรือใช้ UPDATE ... WHERE stock > 0 แล้วตรวจจำนวนแถวที่ถูกแก้"}],"exam":[{"id":"ARC-J-E-001","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J1","concept":"network-call-vs-in-process","mobile":false,"type":"single","stem":"บริษัทขายประกันย้ายระบบจาก monolith เป็น microservices เมื่อใช้งานจริงทีมพบว่าหน้าสรุปกรมธรรม์ที่เดิมโหลดใน 200 ms ตอนนี้ใช้ 1.5 วินาที และบางครั้งแสดงข้อผิดพลาดเกี่ยวกับการเชื่อมต่อ ทั้งที่โค้ดคำนวณในแต่ละส่วนเหมือนเดิม สาเหตุเชิงสถาปัตยกรรมที่น่าเป็นไปได้มากที่สุดคืออะไร","options":[{"id":"A","text":"microservices ใช้ CPU มากกว่า monolith โดยธรรมชาติ เพราะแต่ละบริการมี runtime และ overhead ของตัวเอง จึงคำนวณแต่ละส่วนช้าลง","correct":false,"why":"โค้ดคำนวณเหมือนเดิมจึงใช้ CPU ต่อการคำนวณใกล้เคียงเดิม ค่าที่เพิ่มคือเวลารอเครือข่าย ไม่ใช่เวลาคำนวณ"},{"id":"B","text":"แต่ละบริการอยู่ในเซิร์ฟเวอร์ที่มีหน่วยความจำน้อยลง จึงทำงานช้ากว่าเมื่อเทียบกับ monolith ตัวเดียว","correct":false,"why":"ขนาดเครื่องกำหนดได้ต่อบริการ และไม่ได้อธิบายข้อผิดพลาดเกี่ยวกับการเชื่อมต่อที่พบ"},{"id":"C","text":"การแยกฐานข้อมูลทำให้ทุกการอ่านต้องซิงก์ข้อมูลระหว่างบริการก่อนเสมอ","correct":false,"why":"การแยกฐานข้อมูลตามบริการไม่ได้บังคับให้ซิงก์ทุกครั้งที่อ่าน ความช้ามาจากการที่หน้าเดียวต้องเรียกหลายบริการ"},{"id":"D","text":"ส่วนที่เคยเรียกฟังก์ชันในโปรเซสเดียวกลายเป็นการเรียกผ่านเครือข่ายหลายครั้ง ซึ่งมี latency และล้มเหลวได้","correct":true,"why":"การเรียกข้ามบริการต้องผ่านเครือข่ายพร้อมการแปลงข้อมูลเป็นรูปแบบส่ง จึงช้ากว่าและมีโอกาสล้มเหลวมากกว่าการเรียกฟังก์ชันภายในโปรเซส สอดคล้องกับทั้งความช้าและข้อผิดพลาดการเชื่อมต่อ"}],"explanation":"เมื่อแยก monolith เป็นหลายบริการ การเรียกที่เคยเป็นฟังก์ชันในหน่วยความจำจะกลายเป็นการเรียกผ่านเครือข่าย ที่ช้ากว่าและมีโอกาสล้มเหลว จึงต้องลดจำนวนการเรียกข้ามบริการต่อหนึ่งหน้าและเตรียมจัดการข้อผิดพลาดเสมอ"},{"id":"ARC-J-E-002","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J1","concept":"when-to-split-service","mobile":false,"type":"multiple","stem":"ระบบ e-commerce แบบ monolith ของบริษัทหนึ่งกำลังพิจารณาแยกบางส่วนออกเป็นบริการอิสระ ข้อใดเป็นเหตุผลที่สนับสนุนการแยกส่วนนั้นออกเป็นบริการ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ทีมค้นหาสินค้าเป็นทีมเฉพาะและต้องการปล่อยเวอร์ชันใหม่ได้เองทุกวัน โดยไม่รอรอบปล่อยของทั้งระบบ","correct":true,"why":"ความเป็นอิสระของทีมและรอบ deploy เป็นประโยชน์หลักของการแยกบริการ ขอบเขตตรงกับทีมเจ้าของ"},{"id":"B","text":"ส่วนแจ้งเตือนเปลี่ยนแปลงบ่อยและมีขอบเขตชัดเจน เรียกใช้ผ่านข้อมูลเข้าออกไม่กี่แบบ","correct":true,"why":"ส่วนที่เปลี่ยนบ่อยและมี interface ไม่กี่จุดแยกง่าย และได้ประโยชน์จากการปล่อยแยกโดยไม่แตะส่วนอื่น"},{"id":"C","text":"โมดูลโปรโมชันมีโค้ดยาวกว่า 50,000 บรรทัด จึงควรแยกให้เล็กลง","correct":false,"why":"ขนาดโค้ดอย่างเดียวไม่ใช่เหตุผล ปัญหาความใหญ่แก้ได้ด้วยการจัดโมดูลภายในโค้ดเดิมโดยไม่ต้องรับภาระของระบบกระจาย"},{"id":"D","text":"โมดูลออกรายงานประจำเดือนกิน CPU สูงมากตอนสิ้นเดือนและทำให้หน้าเว็บส่วนอื่นช้าลง","correct":true,"why":"โหลดที่ต่างจากส่วนอื่นอย่างชัดเจนเป็นเหตุผลที่ดีในการแยก เพื่อปรับขนาดหรือจำกัดทรัพยากรของส่วนนั้นโดยไม่กระทบหน้าเว็บ"},{"id":"E","text":"โมดูลชำระเงินต้องอัปเดตตารางคำสั่งซื้อ สต็อก และบัญชีลูกค้าให้สำเร็จพร้อมกันในทุกคำสั่งซื้อ","correct":false,"why":"งานที่ต้องเปลี่ยนข้อมูลหลายส่วนให้สำเร็จพร้อมกันผูกกันแน่น การแยกจะทำให้ต้องจัดการความถูกต้องของข้อมูลข้ามบริการซึ่งยากกว่ามาก"}],"explanation":"เหตุผลที่ดีในการแยกบริการคือโหลดหรือการปรับขนาดที่ต่างกัน ทีมและรอบ deploy ที่อิสระ และขอบเขตที่ชัดเจน ส่วนที่ต้องเปลี่ยนข้อมูลร่วมกันแบบสำเร็จพร้อมกันหรือเหตุผลเรื่องขนาดโค้ดล้วน ๆ ยังไม่คุ้มกับต้นทุนของการเป็นระบบกระจาย"},{"id":"ARC-J-E-003","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J2","concept":"health-check-readiness","mobile":false,"type":"single","stem":"ทีมนำบริการ Catalog ขึ้นเป็นคอนเทนเนอร์หลายตัวหลัง load balancer เมื่อ deploy เวอร์ชันใหม่ ช่วง 20-30 วินาทีแรกผู้ใช้บางส่วนได้รับ error 500 เพราะ load balancer ส่งคำขอเข้าคอนเทนเนอร์ตัวใหม่ที่เพิ่งเริ่ม ขณะที่ยังเชื่อมต่อฐานข้อมูลไม่เสร็จ ควรเพิ่มอะไรให้บริการ","options":[{"id":"A","text":"ให้ endpoint ตรวจสุขภาพตอบ 200 ทันทีที่โปรเซสเริ่ม เพื่อให้ load balancer เห็นว่าคอนเทนเนอร์ขึ้นแล้วและเริ่มส่งทราฟฟิกเข้ามาได้เร็วที่สุด","correct":false,"why":"โปรเซสที่เริ่มแล้วไม่ได้แปลว่าพร้อมใช้งาน การตอบผ่านทันทีทำให้ load balancer ส่งทราฟฟิกเข้ามาก่อนเชื่อมต่อฐานข้อมูลเสร็จ ซึ่งเป็นสาเหตุของ error นี้"},{"id":"B","text":"readiness check ที่ตอบสำเร็จเมื่อเชื่อมต่อฐานข้อมูลได้แล้ว และตั้งให้ load balancer ส่งทราฟฟิกเข้าเฉพาะตัวที่ผ่านการตรวจ","correct":true,"why":"load balancer จะไม่ส่งคำขอเข้าตัวที่ยังไม่พร้อม คอนเทนเนอร์ใหม่รับทราฟฟิกหลังพร้อมจริงเท่านั้น"},{"id":"C","text":"เพิ่มจำนวนคอนเทนเนอร์เป็นสองเท่าในช่วง deploy เพื่อให้ตัวเก่าช่วยรับโหลดแทนตัวใหม่ที่ยังไม่พร้อม","correct":false,"why":"ตัวใหม่ที่ยังไม่พร้อมยังได้รับคำขอส่วนหนึ่ง จำนวนตัวที่มากขึ้นกระจาย error ไปมากขึ้น ไม่ได้แก้ตัวที่ยังไม่พร้อม"},{"id":"D","text":"ให้ผู้เรียกลองใหม่ทุกครั้งที่ได้ 500","correct":false,"why":"ลดอาการบางส่วนได้ แต่ผู้ใช้ยังต้องรอและคำขอยังถูกส่งเข้าตัวที่ไม่พร้อม ไม่ได้แก้ต้นเหตุที่ load balancer ไม่รู้ว่าตัวไหนพร้อม"}],"explanation":"บริการที่ทำงานหลังตัวกระจายโหลดควรมี health/readiness check ที่สะท้อนความพร้อมจริง เช่น เชื่อมต่อฐานข้อมูลได้ เพื่อให้ตัวกระจายโหลดส่งทราฟฟิกเฉพาะเครื่องที่พร้อม โดยเฉพาะตอน deploy และ restart"},{"id":"ARC-J-E-004","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J2","concept":"backward-compatible-api-change","mobile":true,"type":"single","stem":"บริการ Profile ใช้ฟิลด์ phone ใน response ทีมหลังบ้านเปลี่ยนชื่อเป็น mobileNumber แล้ว deploy ทันทีเพราะเว็บแก้ตามแล้ว หลังจากนั้นผู้ใช้แอปมือถือรุ่นเก่า (ซึ่งอัปเดตช้า) พบว่าเบอร์โทรหายไปจากหน้าโปรไฟล์ ทีมควรทำอย่างไรกับการเปลี่ยนแปลง API ครั้งต่อไป","options":[{"id":"A","text":"เพิ่มฟิลด์ใหม่ควบคู่กับฟิลด์เก่าไประยะหนึ่ง แล้วค่อยเลิกฟิลด์เก่าเมื่อผู้ใช้แอปรุ่นเก่าเหลือน้อยมาก","correct":true,"why":"แอปรุ่นเก่ายังอ่านฟิลด์เดิมได้ ส่วนรุ่นใหม่อ่านฟิลด์ใหม่ ทำให้ผู้ใช้อัปเดตตามจังหวะของตัวเองโดยไม่พัง"},{"id":"B","text":"บังคับให้ผู้ใช้อัปเดตแอปทุกครั้งที่ API เปลี่ยน โดยปิดการใช้งานแอปรุ่นเก่าทันทีเพื่อให้ทุกคนใช้ฟิลด์ใหม่เหมือนกัน","correct":false,"why":"ผู้ใช้เสียการใช้งานทันทีโดยไม่ทันเตรียมตัว และเป็นภาระกับทุกการเปลี่ยนแปลงเล็กน้อย"},{"id":"C","text":"เปลี่ยนชื่อฟิลด์ในช่วงเที่ยงคืนที่มีผู้ใช้น้อย เพื่อลดจำนวนคนที่ได้รับผลกระทบ","correct":false,"why":"ผู้ใช้แอปรุ่นเก่ายังพังเมื่อเปิดแอปภายหลัง การเลือกเวลาลดจำนวนคนที่เจอทันทีแต่ไม่ได้แก้ปัญหาความเข้ากันได้"},{"id":"D","text":"ออกแอปรุ่นใหม่ที่อ่านฟิลด์ใหม่ก่อน แล้วเปลี่ยน API ในวันที่แอปผ่านการตรวจของสโตร์","correct":false,"why":"ผู้ใช้ไม่ได้อัปเดตแอปในวันเดียวกับที่แอปผ่านการตรวจ แอปรุ่นเก่ายังคงอยู่ในเครื่องผู้ใช้อีกระยะ"}],"explanation":"ไคลเอนต์แอปมือถือควบคุมจังหวะอัปเดตไม่ได้ ผู้ใช้หลายรุ่นอยู่พร้อมกันเสมอ การเปลี่ยน API ต้องเข้ากันได้ย้อนหลัง เช่น เพิ่มของใหม่ก่อนแล้วค่อยเลิกของเก่าเมื่อไม่มีผู้ใช้เหลือ ไม่ใช่เปลี่ยนแบบที่ทำให้ไคลเอนต์เก่าพัง"},{"id":"ARC-J-E-005","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J3","concept":"graceful-degradation-fallback","mobile":true,"type":"single","stem":"หน้ารายละเอียดสินค้าในแอปเรียกบริการ Review เพื่อแสดงคะแนนรีวิวควบคู่ข้อมูลสินค้า เมื่อบริการ Review ล่ม หน้าสินค้าทั้งหน้าแสดงข้อความเกิดข้อผิดพลาด ทั้งที่ข้อมูลสินค้าหลักยังพร้อม ฝ่ายธุรกิจอยากให้ลูกค้ายังซื้อสินค้าได้ ควรจัดการข้อผิดพลาดอย่างไร","options":[{"id":"A","text":"ให้ทุกครั้งที่ Review ล่มแสดงคะแนนรีวิวเป็น 5 ดาวตามค่าเริ่มต้น เพื่อให้หน้าสินค้าดูสมบูรณ์และลูกค้าไม่สังเกตเห็นปัญหา","correct":false,"why":"เป็นข้อมูลเท็จที่อาจทำให้ลูกค้าตัดสินใจผิด ควรบอกตรง ๆ ว่ารีวิวไม่พร้อม"},{"id":"B","text":"ให้หน้าสินค้ารอจนกว่า Review จะกลับมาแล้วจึงแสดงผล เพื่อให้ข้อมูลครบก่อน","correct":false,"why":"ผู้ใช้รอโดยไม่รู้ว่าจะนานเท่าไร และถ้า Review ไม่กลับมาก็ซื้อสินค้าไม่ได้เลย"},{"id":"C","text":"จับข้อผิดพลาดจากการเรียก Review แล้วแสดงหน้าสินค้าต่อ โดยซ่อนส่วนรีวิวหรือแจ้งว่ารีวิวโหลดไม่ได้ชั่วคราว","correct":true,"why":"ส่วนที่ไม่จำเป็นต่อการซื้อล้มเหลวได้โดยไม่ลากทั้งหน้าล้ม ลูกค้ายังเห็นข้อมูลสินค้าและซื้อได้"},{"id":"D","text":"คัดลอกรีวิวทั้งหมดไปเก็บในฐานข้อมูลของบริการสินค้า เพื่อเลิกเรียก Review","correct":false,"why":"ย้ายความเป็นเจ้าของข้อมูลและสร้างปัญหาการซิงก์ใหม่ เป็นการแก้ที่ใหญ่เกินเหตุสำหรับการล่มชั่วคราว"}],"explanation":"เมื่อบริการที่ไม่จำเป็นหลักล่ม ควรลดระดับการทำงานอย่างนุ่มนวล (graceful degradation) คือแสดงส่วนที่ทำได้ต่อและบอกผู้ใช้ตามจริง แทนที่จะให้ทั้งหน้าล้มเพราะส่วนเสริมเพียงส่วนเดียว"},{"id":"ARC-J-E-006","level":"junior","pool":"exam","competency":"Microservices","descriptor":"MS-J3","concept":"error-response-contents","mobile":false,"type":"multiple","stem":"ทีมกำหนดรูปแบบ error response ของบริการภายในที่ผู้เรียกจะนำไปจัดการต่อหรือแสดงต่อผู้ใช้ ข้อใดควรมีในคำตอบเมื่อเกิดข้อผิดพลาด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"stack trace และข้อความ SQL ที่ล้มเหลว เพื่อให้ผู้เรียกวิเคราะห์ปัญหาได้เอง","correct":false,"why":"เปิดเผยโครงสร้างภายใน เช่น ชื่อตารางและเส้นทางโค้ด ซึ่งเป็นข้อมูลที่ผู้โจมตีใช้ประโยชน์ได้ รายละเอียดเหล่านี้ควรอยู่ใน log ฝั่งเซิร์ฟเวอร์"},{"id":"B","text":"รหัสข้อผิดพลาดที่โปรแกรมอ่านแยกแยะได้ เช่น OUT_OF_STOCK เพื่อให้ผู้เรียกเลือกวิธีจัดการต่อได้ตามชนิดของปั
