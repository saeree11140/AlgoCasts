ญหา","correct":true,"why":"ผู้เรียกใช้รหัสตัดสินใจเองได้ เช่น แจ้งผู้ใช้ว่าสินค้าหมดหรือลองใหม่ภายหลัง โดยไม่ต้องแกะความหมายจากข้อความภาษาคน"},{"id":"C","text":"รหัสอ้างอิงคำขอ (request/correlation id) เพื่อให้ตามหา log ที่เกี่ยวข้องข้ามบริการได้","correct":true,"why":"เมื่อผู้ใช้แจ้งปัญหา ทีมใช้รหัสนี้ค้น log ของทุกบริการที่คำขอเดียวกันผ่านไปได้"},{"id":"D","text":"ตอบ HTTP 200 พร้อมฟิลด์ success เป็น false ทุกกรณี เพื่อให้ผู้เรียกจัดการรูปแบบเดียว","correct":false,"why":"status 200 สื่อว่าสำเร็จ ทำให้ proxy, cache และเครื่องมือ monitoring ตีความผิด และผู้เรียกที่ไม่ตรวจฟิลด์จะนับว่าสำเร็จ"}],"explanation":"error response ที่ดีให้ผู้เรียกจัดการต่อได้ (รหัสที่อ่านด้วยโปรแกรม พร้อม HTTP status ที่ถูกชนิด) และช่วยตามรอยข้ามบริการ (correlation id) โดยไม่เปิดเผยรายละเอียดภายในอย่าง stack trace หรือ SQL"},{"id":"ARC-J-E-007","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J1","concept":"observer-order-notification","mobile":false,"type":"single","stem":"ระบบสั่งซื้อต้องแจ้งเตือนหลังสร้างคำสั่งซื้อสำเร็จ ตอนแรกส่งเฉพาะอีเมล โดยเรียก EmailSender ตรงใน OrderService ตามโค้ดด้านล่าง ตอนนี้ฝ่ายธุรกิจขอเพิ่ม LINE และ SMS และจะเพิ่มช่องทางอื่นอีกในอนาคต ทุกครั้งต้องแก้ OrderService และทดสอบใหม่ ข้อใดทำให้เพิ่มช่องทางได้โดยไม่แก้ OrderService","code":"class OrderService {\n  constructor(private email: EmailSender) {}\n\n  async placeOrder(order: Order) {\n    await this.save(order);\n    await this.email.send(order.customerEmail, \"สั่งซื้อสำเร็จ\");\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"เพิ่มเมธอด sendLine และ sendSms ใน OrderService แล้วเรียกต่อกันตามลำดับ","correct":false,"why":"ยังต้องแก้ OrderService ทุกครั้งที่เพิ่มช่องทาง และเมื่อช่องทางหนึ่งล้มเหลวอาจทำให้ช่องทางถัดไปไม่ถูกเรียก"},{"id":"B","text":"ทำ EmailSender เป็น Singleton เพื่อให้ทุกที่ใช้อินสแตนซ์เดียวกัน","correct":false,"why":"Singleton ควบคุมจำนวนอินสแตนซ์ ไม่ได้แยก OrderService ออกจากช่องทางการแจ้งเตือน"},{"id":"C","text":"สร้างคลาสลูกของ OrderService ต่อช่องทาง เช่น OrderServiceWithEmail, OrderServiceWithLine แล้วเลือกใช้คลาสตามช่องทางที่ลูกค้าตั้งไว้","correct":false,"why":"ถ้าลูกค้าอยากได้หลายช่องทางพร้อมกัน จำนวนคลาสจะเพิ่มตามชุดค่าผสมของช่องทาง และยังต้องเลือกคลาสให้ถูกในทุกที่"},{"id":"D","text":"ใช้ Observer (publish-subscribe ในแอป): OrderService ประกาศเหตุการณ์สร้างคำสั่งซื้อแล้ว และแต่ละช่องทางลงทะเบียนรับเหตุการณ์เอง","correct":true,"why":"OrderService รู้เพียงว่าต้องประกาศเหตุการณ์ ไม่รู้ว่ามีผู้รับกี่ราย เพิ่มช่องทางใหม่ด้วยการเพิ่มผู้รับโดยไม่แตะ OrderService"}],"explanation":"เมื่อเหตุการณ์หนึ่งมีผู้สนใจได้หลายราย และจำนวนผู้สนใจเพิ่มได้ รูปแบบ Observer ช่วยให้ผู้ประกาศไม่ผูกกับผู้รับ ทำให้เพิ่มช่องทางใหม่ได้โดยไม่แก้โค้ดเดิม"},{"id":"ARC-J-E-008","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J1","concept":"adapter-wrap-third-party-sdk","mobile":true,"type":"single","stem":"แอปมือถือใช้ SDK ของผู้ให้บริการล็อกอินภายนอก (คล้ายการล็อกอินด้วย LINE) โดยเรียก SDK ตรง ๆ ในหน้าจอหลายสิบหน้า ผู้ให้บริการประกาศเปลี่ยนรูปแบบ API ของ SDK ในเวอร์ชันถัดไป ทีมกังวลว่าต้องไล่แก้ทุกหน้าจอ และทดสอบหน้าจอไม่ได้ถ้าไม่เรียก SDK จริง ควรใช้แนวทางออกแบบใด","options":[{"id":"A","text":"คัดลอกซอร์สของ SDK มาไว้ในโปรเจกต์แล้วแก้เองให้ตรงกับที่ต้องการ เพื่อควบคุมเวอร์ชันได้เองโดยไม่ขึ้นกับผู้ให้บริการ","correct":false,"why":"ทีมต้องรับภาระดูแลและตามแพตช์ความปลอดภัยของโค้ดที่ไม่ใช่ของตัวเอง และยังต้องแก้ทุกหน้าจอเมื่อ API ของตัวเองเปลี่ยน"},{"id":"B","text":"กำหนด interface ของทีมเอง (เช่น AuthProvider) แล้วเขียนคลาสห่อ SDK ตาม interface นั้น (Adapter) ให้หน้าจอเรียกผ่าน interface","correct":true,"why":"หน้าจอพึ่งแค่ interface ของทีม เมื่อ SDK เปลี่ยนแก้เฉพาะคลาสห่อ และทดสอบหน้าจอได้ด้วยตัวปลอมที่ทำตาม interface เดียวกัน"},{"id":"C","text":"เก็บอินสแตนซ์ SDK ในตัวแปร global ให้ทุกหน้าจอใช้ร่วมกันและเรียกใช้ได้จากทุกที่ในโค้ด","correct":false,"why":"ทุกหน้าจอยังผูกกับรูปแบบของ SDK โดยตรง และการทดสอบยากขึ้นเพราะมีสถานะร่วมที่เปลี่ยนแปลงได้"},{"id":"D","text":"เลิกใช้ SDK แล้วเขียนโค้ดเรียก HTTP ไปยังผู้ให้บริการเองในทุกหน้าจอ เพื่อตัดความผูกพันกับ SDK ของเขา","correct":false,"why":"โค้ดการเรียกกระจายซ้ำในหลายหน้าจอ ยังผูกกับรูปแบบของผู้ให้บริการ และต้องดูแลรายละเอียดการยืนยันตัวตนเองทั้งหมด"}],"explanation":"การห่อไลบรารีหรือ SDK ภายนอกไว้หลัง interface ของเรา (Adapter) ทำให้ผลกระทบจากการเปลี่ยนแปลงของผู้ให้บริการจำกัดอยู่ที่จุดเดียว และช่วยให้ทดสอบส่วนอื่นได้โดยไม่ต้องเรียกบริการจริง"},{"id":"ARC-J-E-009","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J2","concept":"order-status-state-transitions","mobile":false,"type":"single","stem":"ระบบสั่งซื้อมีสถานะ รอชำระ, ชำระแล้ว, กำลังจัดส่ง, ส่งสำเร็จ และยกเลิก ในการใช้งานจริงพบบางออเดอร์ที่ส่งสำเร็จแล้วถูกเปลี่ยนกลับเป็นรอชำระ เพราะข้อความจากระบบชำระเงินมาถึงช้ากว่าลำดับที่คาด ทีมจะใช้ state diagram ช่วยแก้ปัญหานี้อย่างไร","options":[{"id":"A","text":"วาด state diagram ที่ระบุเฉพาะการเปลี่ยนสถานะที่อนุญาต แล้วให้โค้ดปฏิเสธและบันทึกการเปลี่ยนที่อยู่นอกแผนภาพ","correct":true,"why":"แผนภาพกำหนดว่าจากสถานะไหนไปไหนได้บ้าง โค้ดจึงตรวจได้ว่า ส่งสำเร็จ → รอชำระ ไม่อยู่ในรายการ แล้วปฏิเสธพร้อมบันทึกเพื่อสืบสวน"},{"id":"B","text":"ให้ทุกสถานะเปลี่ยนไปสถานะใดก็ได้ แล้วใช้ข้อความที่มาถึงล่าสุดเป็นตัวตัดสินสถานะที่ถูกต้องของออเดอร์ โดยไม่จำกัดลำดับการเปลี่ยน","correct":false,"why":"ข้อความที่มาช้าจะมาถึงทีหลังจึงถูกมองว่าใหม่สุด และยังทับสถานะที่ถูกต้องได้เหมือนปัญหาเดิม เพราะไม่มีกฎตรวจความสมเหตุสมผลของลำดับ"},{"id":"C","text":"เพิ่มสถานะชื่อ ไม่แน่ใจ ให้ระบบตั้งสถานะนี้เมื่อพบความขัดแย้งทุกกรณี แล้วให้ฝ่ายปฏิบัติการตรวจสอบภายหลัง","correct":false,"why":"เพียงย้ายปัญหาไปไว้ในสถานะใหม่ ไม่ได้กำหนดว่าการเปลี่ยนแบบใดผิด และมีออเดอร์ค้างในสถานะนี้เพิ่ม"},{"id":"D","text":"วาดเฉพาะเส้นทางปกติ แล้วให้ฝ่ายซัพพอร์ตแก้สถานะด้วยมือเมื่อพบ","correct":false,"why":"ปัญหาเดิมยังเกิดต่อไป และสร้างงานแก้ไขด้วยมือที่เพิ่มตามปริมาณออเดอร์"}],"explanation":"state diagram ที่ระบุการเปลี่ยนสถานะที่อนุญาตช่วยให้เห็นลำดับที่เป็นไปไม่ได้และเขียนโค้ดตรวจได้ ซึ่งสำคัญเมื่อข้อความจากระบบอื่นอาจมาถึงช้าหรือสลับลำดับ"},{"id":"ARC-J-E-010","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J2","concept":"deployment-diagram-single-points-of-failure","mobile":false,"type":"multiple","stem":"ทีมรีวิว deployment diagram ของระบบรับสลิปโอนเงินจากแอปมือถือ (ถอดเป็นข้อความด้านล่าง) เพื่อหาจุดที่ทำให้ระบบหยุดหรือข้อมูลหายเมื่อเครื่องใดเครื่องหนึ่งเสีย ข้อใดเป็นการปรับที่ตรงกับจุดอ่อนด้านความน่าเชื่อถือในแผนภาพ (เลือกทุกข้อที่ถูก)","code":"[Mobile App] --HTTPS--> [API Server x1]\n[API Server x1] --SQL--> [Database Server x1]\n[API Server x1] --เขียนไฟล์--> [ดิสก์ของ API Server: /uploads/slips]\n[Backup job รายคืน] --dump--> [ดิสก์ของ Database Server: /backup]","codeLang":"text","options":[{"id":"A","text":"เพิ่ม API Server เป็นหลายเครื่อง และให้ฐานข้อมูลมีเครื่องสำรองที่รับช่วงต่อได้เมื่อเครื่องหลักล่ม","correct":true,"why":"ตอนนี้ API Server หรือฐานข้อมูลเครื่องใดเครื่องหนึ่งล่มแล้วระบบหยุดทั้งหมด การมีตัวสำรองให้แต่ละส่วนในเส้นทางหลักช่วยลดจุดล่มเดี่ยว (single point of failure)"},{"id":"B","text":"แยก API Server เป็นบริการย่อยสามบริการ บริการละหนึ่งเครื่อง เพื่อให้เมื่อบริการหนึ่งล่ม อีกสองบริการยังทำงานได้","correct":false,"why":"อาจช่วยแยกผลกระทบได้บางส่วน แต่แต่ละบริการยังมีเครื่องเดียว บริการที่ล่มก็หยุดฟังก์ชันของตัวเองอยู่ดี และเพิ่มจำนวนจุดที่ล่มได้กับการเรียกข้ามเครือข่าย โดยไม่ได้เพิ่มตัวสำรองให้ฟังก์ชันใด"},{"id":"C","text":"ย้ายไฟล์สลิปไปไว้ใน storage ที่แยกจากเครื่อง API Server เพื่อให้ไฟล์ไม่หายไปพร้อมกับเครื่อง","correct":true,"why":"ไฟล์ที่ลูกค้าอัปโหลดสร้างใหม่ไม่ได้ ถ้าอยู่บนดิสก์ของเครื่องเดียวจะหายพร้อมเครื่อง และเมื่อเพิ่ม API Server เครื่องอื่น เครื่องเหล่านั้นก็จะไม่เห็นไฟล์เดียวกัน"},{"id":"D","text":"เก็บไฟล์ backup ไว้ในที่ที่แยกจากเครื่องฐานข้อมูล เช่น storage อีกแห่งหรืออีกพื้นที่หนึ่ง","correct":true,"why":"backup ที่อยู่บนดิสก์เดียวกับฐานข้อมูลจะเสียไปพร้อมกันเมื่อดิสก์หรือเครื่องเสีย จึงกู้คืนไม่ได้ในจังหวะที่ต้องใช้มากที่สุด"}],"explanation":"เมื่ออ่าน deployment diagram เพื่อหาจุดอ่อนด้านความน่าเชื่อถือ ให้ไล่ทีละกล่องว่าถ้ากล่องนี้เสียจะเกิดอะไรขึ้น: มีตัวสำรองหรือไม่ ข้อมูลที่สร้างใหม่ไม่ได้อยู่ที่ใดที่เดียวหรือไม่ และสำเนา backup อยู่แยกจากของจริงหรือไม่ การแยกเป็นบริการย่อยไม่ได้ทดแทนการมีตัวสำรอง"},{"id":"ARC-J-E-011","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J3","concept":"follow-documented-guideline-not-legacy-code","mobile":true,"type":"single","stem":"ทีมแอปมือถือมีเอกสารแนวทางสถาปัตยกรรมที่ทีมรับรองแล้วว่า หน้าจอต้องเข้าถึงข้อมูลผ่านคลาส Repository และเอกสารระบุไว้ชัดว่าหน้าจอเก่าที่ยังเรียก API ตรงจากโค้ดหน้าจอจะทยอยย้ายตามแผนของทีม น้องใหม่ได้รับงานทำหน้า \"ที่อยู่จัดส่ง\" จึงเปิดหน้า \"โปรไฟล์\" ที่มีอยู่แล้วเพื่อดูเป็นตัวอย่าง และพบว่าหน้านั้นเรียก API ตรงจากโค้ดหน้าจอ ซึ่งผ่านรีวิวและใช้งานจริงมานานแล้ว น้องควรทำอย่างไร","options":[{"id":"A","text":"ทำตามแบบของหน้าโปรไฟล์ เพราะโค้ดนั้นผ่านรีวิวและใช้งานจริงในผลิตภัณฑ์อยู่แล้ว","correct":false,"why":"การผ่านรีวิวและใช้งานจริงไม่ได้แปลว่าตรงกับแนวทางปัจจุบัน หน้าโปรไฟล์ยังรอย้ายอยู่ การลอกแบบทำให้หน้าใหม่กลายเป็นงานที่ต้องย้ายเพิ่มในภายหลัง"},{"id":"B","text":"สร้างหน้าใหม่ตามเอกสารแนวทางโดยใช้ Repository และปล่อยหน้าโปรไฟล์ไว้ให้เป็นไปตามแผนย้ายของทีม","correct":true,"why":"เอกสารคือข้อตกลงปัจจุบันของทีม และระบุแล้วว่าหน้าเก่าเป็นข้อยกเว้นชั่วคราวที่มีแผนย้าย หน้าใหม่จึงไม่ควรเพิ่มภาระให้แผนนั้น และงานนี้ไม่ใช่ที่ที่จะไปแตะหน้าอื่น"},{"id":"C","text":"สร้างหน้าใหม่ตามเอกสารแนวทาง และแก้หน้าเก่าที่เรียก API ตรงทุกหน้าใน pull request เดียวกันให้เป็นแบบเดียวกันทั้งแอป","correct":false,"why":"pull request จะใหญ่และกระทบหน้าที่ไม่เกี่ยวกับงาน รีวิวและทดสอบยาก อีกทั้งทับลำดับการย้ายที่ทีมวางแผนไว้แล้ว"},{"id":"D","text":"ถามสถาปนิกก่อนว่าควรใช้ Repository หรือเรียก API ตรง แล้วรอคำตอบก่อนเริ่มเขียนหน้าใหม่","correct":false,"why":"เอกสารตอบไว้ชัดแล้วว่าหน้าใหม่ต้องใช้อะไรและบอกสถานะของหน้าเก่าไว้ด้วย การรอคำตอบในเรื่องที่มีอยู่ในเอกสารทำให้งานหยุดเปล่า การถามเหมาะกับกรณีที่เอกสารไม่ครอบคลุมหรือขัดกับงานจริง"}],"explanation":"เอกสารแนวทางคือข้อตกลงปัจจุบันของทีม ส่วนโค้ดเก่าบอกได้เพียงว่าเคยทำกันอย่างไร ไม่ได้บอกว่าควรทำอย่างไร เมื่อเอกสารตอบชัดและระบุข้อยกเว้นไว้แล้ว ให้ทำงานใหม่ตามเอกสาร ไม่ลอกจากตัวอย่างที่ยังรอย้าย และไม่ขยายขอบเขตงานไปแก้ส่วนที่ทีมมีแผนอยู่แล้ว เก็บการสอบถามไว้สำหรับกรณีที่เอกสารไม่ครอบคลุมหรือแนวทางไม่เข้ากับงานจริง"},{"id":"ARC-J-E-012","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J4","concept":"api-doc-from-spec","mobile":false,"type":"single","stem":"ทีม backend เขียนเอกสาร API ของบริการ Booking ใน wiki ด้วยมือ ทุกครั้งที่เพิ่มหรือเปลี่ยนฟิลด์ นักพัฒนาฝั่งมือถือและเว็บพบว่าเอกสารไม่ตรงกับ API จริงอยู่บ่อย ๆ วิธีลดปัญหานี้ที่เหมาะสมคือข้อใด","options":[{"id":"A","text":"จัดประชุมสรุปการเปลี่ยนแปลง API ทุกวันศุกร์ เพื่อให้ทุกคนช่วยอัปเดต wiki ให้ตรงกับของจริง มีผู้รับผิดชอบแต่ละหน้า และสรุปผลลงใน wiki หลังประชุมทุกครั้ง","correct":false,"why":"ยังเป็นกระบวนการที่พึ่งคนจำและลงมือ ช่วงระหว่างสัปดาห์เอกสารยังคลาดเคลื่อนได้"},{"id":"B","text":"ย้ายเอกสารจาก wiki เป็นไฟล์ PDF แล้วลงนามรับรองเวอร์ชันทุกสัปดาห์ โดยมีผู้อนุมัติของแต่ละทีมตรวจก่อนเผยแพร่","correct":false,"why":"เปลี่ยนรูปแบบไฟล์แต่ไม่ได้แก้สาเหตุ และการออกเป็นรายสัปดาห์ทำให้เอกสารล้าหลังกว่าเดิม"},{"id":"C","text":"ให้ทีมมือถือและเว็บอ่านซอร์สโค้ด backend เพื่อดูฟิลด์จริงแทนการอ่านเอกสาร","correct":false,"why":"ผลักภาระให้ทุกทีม ต้องเข้าใจโค้ดของระบบอื่น และไม่มีสัญญาของ API ที่ชัดเจนให้อ้างอิง"},{"id":"D","text":"เขียนข้อกำหนด API แบบมาตรฐาน เช่น OpenAPI ไว้ใน repository เดียวกับโค้ด สร้างเอกสารจากไฟล์นั้น และตรวจความตรงกับโค้ดใน CI","correct":true,"why":"เอกสารมาจากไฟล์ข้อกำหนดที่แก้พร้อมโค้ดใน pull request เดียวกัน และการตรวจใน CI ช่วยจับกรณีที่โค้ดกับข้อกำหนดไม่ตรงกัน"}],"explanation":"เอกสารที่ถูกสร้างหรือตรวจจากข้อกำหนดซึ่งอยู่ใกล้โค้ดและผ่านการรีวิวพร้อมกัน ล้าสมัยยากกว่าเอกสารที่เขียนด้วยมือแยกต่างหาก เพราะแก้ที่เดียวและมีระบบตรวจช่วยเตือน"},{"id":"ARC-J-E-013","level":"junior","pool":"exam","competency":"System Design","descriptor":"SD-J4","concept":"diagram-type-matching","mobile":false,"type":"multiple","stem":"ข้อใดจับคู่ชนิดของแผนภาพกับสิ่งที่ใช้อธิบายได้ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Flowchart: คลาสต่าง ๆ พร้อมความสัมพันธ์แบบสืบทอดและ composition","correct":false,"why":"คลาสและความสัมพันธ์แบบสืบทอดหรือ composition คือ class diagram ส่วน flowchart แสดงลำดับขั้นตอน"},{"id":"B","text":"Sequence diagram: ลำดับข้อความที่ส่งระหว่างผู้ใช้ แอป และบริการต่าง ๆ ตามเวลาในสถานการณ์หนึ่ง","correct":true,"why":"sequence diagram เหมาะกับการแสดงว่าใครเรียกใครก่อนหลังในสถานการณ์หนึ่ง เช่น ขั้นตอนล็อกอินหรือชำระเงิน"},{"id":"C","text":"State diagram: ตำแหน่งที่แต่ละบริการติดตั้งอยู่บนเซิร์ฟเวอร์และเครือข่าย","correct":false,"why":"การแสดงการติดตั้งบนโหนดและเครือข่ายคือ deployment diagram ส่วน state diagram แสดงสถานะและการเปลี่ยนสถานะ"},{"id":"D","text":"Class diagram: ลำดับขั้นตอนการตัดสินใจของโปรแกรมพร้อมเงื่อนไขแยกทาง","correct":false,"why":"ลำดับขั้นตอนพร้อมเงื่อนไขแยกทางคือ flowchart ส่วน class diagram แสดงคลาสและความสัมพันธ์"},{"id":"E","text":"ER diagram: ตาราง ฟิลด์ และความสัมพันธ์ระหว่างข้อมูล เช่น ลูกค้าหนึ่งคนมีหลายคำสั่งซื้อ","correct":true,"why":"ER diagram ใช้อธิบายโครงสร้างและความสัมพันธ์ของข้อมูลในฐานข้อมูล"}],"explanation":"แต่ละแผนภาพตอบคำถามต่างกัน: sequence diagram ตอบว่าใครคุยกับใครตามลำดับอย่างไร, ER ตอบว่าข้อมูลสัมพันธ์กันอย่างไร, class ตอบว่าโครงสร้างโค้ดเป็นอย่างไร, flowchart ตอบว่าขั้นตอนไหลอย่างไร, state ตอบว่าสถานะเปลี่ยนอย่างไร, deployment ตอบว่าติดตั้งที่ไหน เลือกให้ตรงกับคำถามที่ผู้อ่านมี"},{"id":"ARC-J-E-014","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J1","concept":"key-value-query-limits","mobile":false,"type":"single","stem":"ทีมเก็บโปรไฟล์ผู้ใช้ 2 ล้านคนใน key-value store โดยใช้ user_id เป็น key และ value เป็น JSON ของโปรไฟล์ ต่อมาฝ่ายการตลาดขอรายชื่อผู้ใช้ทุกคนที่อยู่ในจังหวัดเชียงใหม่และสมัครหลังวันที่ 1 มกราคม ข้อใดอธิบายสถานการณ์นี้ได้ถูกต้อง","options":[{"id":"A","text":"เพิ่ม RAM ให้เซิร์ฟเวอร์ key-value store จนเก็บทุกโปรไฟล์ในหน่วยความจำได้ ก็จะค้นตามเงื่อนไขได้เร็วเท่าการอ่านด้วย key","correct":false,"why":"RAM ช่วยให้การอ่านด้วย key เร็วขึ้น แต่ไม่ได้เพิ่มความสามารถในการค้นตามฟิลด์ใน value การค้นยังต้องไล่ดูโปรไฟล์ทั้งหมด"},{"id":"B","text":"key-value store ทั่วไปถนัดอ่านเขียนด้วย key การค้นตามค่าใน value ต้องสแกนทั้งหมดหรือสร้างดัชนีเอง จึงควรพิจารณาฐานข้อมูลที่ทำดัชนีบนฟิลด์ได้","correct":true,"why":"โมเดลแบบ key-value ออกแบบมาเพื่อเข้าถึงด้วย key การกรองหลายเงื่อนไขจากข้อมูลใน value ไม่ใช่งานที่ถนัด"},{"id":"C","text":"เปลี่ยน key เป็นชื่อจังหวัดรวมกับวันที่สมัคร ก็ค้นได้ทุกเงื่อนไขของโปรไฟล์แล้ว รวมถึงเงื่อนไขอื่นที่ฝ่ายการตลาดจะขอในอนาคต","correct":false,"why":"แก้ได้เฉพาะรูปแบบการค้นแบบเดียว และเสียการเข้าถึงโปรไฟล์ด้วย user_id ซึ่งเป็นจุดประสงค์เดิม"},{"id":"D","text":"key-value store รองรับได้เพียงข้อมูลขนาดเล็ก 2 ล้านรายการจึงเกินขีดจำกัดของประเภทนี้ ต้องย้ายไปฐานข้อมูลอื่นทั้งหมด","correct":false,"why":"key-value store จำนวนมากรองรับหลายล้านรายการได้ ข้อจำกัดของเคสนี้อยู่ที่รูปแบบการค้นหา ไม่ใช่ปริมาณข้อมูล"}],"explanation":"เลือกที่เก็บข้อมูลให้ตรงกับรูปแบบการเข้าถึง key-value เหมาะกับการดึงด้วย key ส่วนงานค้นหาตามเงื่อนไขของฟิลด์ต้องการดัชนีหรือภาษา query ซึ่งเป็นจุดแข็งของ document database และฐานข้อมูลเชิงสัมพันธ์"},{"id":"ARC-J-E-015","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J1","concept":"document-embed-vs-reference","mobile":false,"type":"multiple","stem":"ทีมออกแบบ document database สำหรับระบบบล็อก มีโพสต์ ความคิดเห็น (comment) และผู้เขียน ข้อใดเป็นการตัดสินใจออกแบบเอกสารที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แยกความคิดเห็นเป็น collection ต่างหากที่อ้างอิง post_id เมื่อโพสต์ยอดนิยมอาจมีความคิดเห็นหลายหมื่นรายการ","correct":true,"why":"ข้อมูลที่โตได้ไม่จำกัดไม่ควรฝังในเอกสารเดียว เพราะเอกสารมีขีดจำกัดขนาดและการอ่านโพสต์จะหนักเกินจำเป็น"},{"id":"B","text":"ฝังข้อมูลย่อยที่อ่านพร้อมโพสต์เสมอและมีจำนวนจำกัด เช่น แท็กของโพสต์ ไว้ในเอกสารของโพสต์","correct":true,"why":"ข้อมูลที่อ่านด้วยกันเสมอและมีขนาดจำกัดเก็บรวมในเอกสารเดียวได้ อ่านครั้งเดียวครบ และอัปเดตพร้อมกันได้ในเอกสารเดียว"},{"id":"C","text":"เก็บรหัสผู้เขียนอ้างอิงในโพสต์ แทนการคัดลอกประวัติส่วนตัวของผู้เขียนทั้งก้อนลงทุกโพสต์ เมื่อข้อมูลผู้เขียนเปลี่ยนบ่อย","correct":true,"why":"ข้อมูลที่เปลี่ยนบ่อยและมีผู้ใช้หลายที่ ควรอยู่ที่เดียวแล้วอ้างอิง เพื่อไม่ต้องไล่แก้สำเนาจำนวนมาก"},{"id":"D","text":"ใช้ชนิดข้อมูลของฟิลด์เดียวกันต่างกันในแต่ละเอกสาร เช่น วันที่เป็นตัวเลขบ้างข้อความบ้าง เพราะ schema ยืดหยุ่น","correct":false,"why":"ความยืดหยุ่นของ schema ไม่ได้แปลว่าไม่ต้องมีวินัยเรื่องรูปแบบ ฟิลด์เดียวกันที่ชนิดต่างกันทำให้เรียงและกรองผิดพลาด"},{"id":"E","text":"ออกแบบให้เอกสารอ้างอิงกันด้วยรหัสทุกชั้น แล้ว join หลาย collection ทุกครั้งที่แสดงหน้าโพสต์ เหมือนที่ทำในฐานข้อมูลเชิงสัมพันธ์","correct":false,"why":"ฐานข้อมูลแบบ document หลายตัวไม่ถนัดการ join ข้ามหลาย collection ควรออกแบบเอกสารให้ตรงกับรูปแบบการอ่านของหน้านั้นแทน"}],"explanation":"การออกแบบ document ต้องตัดสินว่าอะไรฝัง อะไรอ้างอิง: ฝังข้อมูลที่อ่านด้วยกันและมีขนาดจำกัด อ้างอิงข้อมูลที่โตไม่จำกัดหรือเปลี่ยนบ่อยและใช้ร่วมกัน และยังต้องรักษารูปแบบของฟิลด์ให้สม่ำเสมอแม้ฐานข้อมูลไม่บังคับ"},{"id":"ARC-J-E-016","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J2","concept":"one-to-many-foreign-key-placement","mobile":false,"type":"single","stem":"ER diagram ระบุว่า ลูกค้า 1 คนมีคำสั่งซื้อได้หลายรายการ แต่คำสั่งซื้อ 1 รายการเป็นของลูกค้า 1 คนเท่านั้น เมื่อแปลงเป็นตารางจริง foreign key ควรอยู่ที่ใด","options":[{"id":"A","text":"คอลัมน์ customer_id ในตาราง orders ที่อ้างอิง customers.id","correct":true,"why":"ฝั่งหลายถือ foreign key ที่ชี้ไปฝั่งหนึ่ง คำสั่งซื้อแต่ละแถวจึงระบุเจ้าของได้หนึ่งคน และลูกค้าหนึ่งคนมีหลายคำสั่งซื้อได้"},{"id":"B","text":"คอลัมน์ order_id ในตาราง customers ที่อ้างอิง orders.id","correct":false,"why":"ลูกค้าหนึ่งแถวจะถือคำสั่งซื้อได้เพียงรายการเดียว ขัดกับที่ลูกค้ามีหลายคำสั่งซื้อ"},{"id":"C","text":"ตารางกลาง customer_orders ที่มี customer_id กับ order_id เป็น primary key ร่วม","correct":false,"why":"ตารางกลางแบบนี้ใช้กับความสัมพันธ์หลายต่อหลาย และ primary key ร่วมสองคอลัมน์ยังอนุญาตให้คำสั่งซื้อเดียวผูกกับหลายลูกค้าได้"},{"id":"D","text":"มี customer_id ในตาราง orders และ order_id ในตาราง customers พร้อมกัน เพื่ออ้างอิงสองทาง","correct":false,"why":"ข้อมูลซ้ำซ้อนและขัดแย้งกันง่าย เช่น เมื่อมีหลายคำสั่งซื้อ คอลัมน์ order_id ในตารางลูกค้าเก็บได้ค่าเดียว"}],"explanation":"ความสัมพันธ์แบบหนึ่งต่อหลาย ให้วาง foreign key ไว้ที่ตารางฝั่งหลาย (orders) ชี้ไปยังฝั่งหนึ่ง (customers) ตารางกลางใช้เฉพาะความสัมพันธ์หลายต่อหลาย"},{"id":"ARC-J-E-017","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J2","concept":"utf8-thai-text-column","mobile":false,"type":"single","stem":"ระบบทะเบียนลูกค้าเก็บชื่อภาษาไทยลงคอลัมน์ VARCHAR หลังบันทึกชื่อ สมชาย ผ่านหน้าเว็บ แล้วเปิดดูใน client พบเป็น ???? หรืออักขระประหลาด ขณะที่ชื่อภาษาอังกฤษแสดงปกติ ข้อใดควรตรวจและแก้เป็นอันดับแรก","options":[{"id":"A","text":"เพิ่มความยาวคอลัมน์ VARCHAR จาก 50 เป็น 500 เพราะอักษรไทยใช้พื้นที่มากกว่าอักษรอังกฤษหลายเท่าและข้อมูลถูกตัดทอนตอนบันทึก","correct":false,"why":"ความยาวไม่พอทำให้ข้อมูลถูกตัดหรือเกิด error ไม่ใช่ทำให้อักษรกลายเป็น ????"},{"id":"B","text":"เปลี่ยนชนิดคอลัมน์เป็น BLOB เพื่อให้เก็บไบต์ตามที่ส่งมาโดยตรงโดยไม่ผ่านการแปลง charset","correct":false,"why":"ได้ไบต์ดิบแต่สูญเสียการเปรียบเทียบ เรียง และค้นหาข้อความ และไม่แก้การตีความ charset ที่ผิดที่ฝั่งแสดงผล"},{"id":"C","text":"ตรวจ character set และ collation ของฐานข้อมูล ตาราง และการเชื่อมต่อ ให้เป็น UTF-8 ครบทั้งสามจุด","correct":true,"why":"ชื่อภาษาอังกฤษใช้ได้กับ charset เดิมแต่อักษรไทยไม่ได้ อาการ ???? เป็นสัญญาณของการแปลง charset ที่สูญเสียข้อมูล จึงต้องตรวจทุกชั้นให้ตรงกัน"},{"id":"D","text":"แปลงชื่อภาษาไทยเป็นตัวอักษรโรมันก่อนบันทึก","correct":false,"why":"ข้อมูลที่เก็บไม่ตรงกับชื่อจริง ทำให้ใช้ออกเอกสารหรือค้นหาด้วยชื่อไทยไม่ได้"}],"explanation":"ข้อความภาษาไทยต้องใช้ charset ที่รองรับ Unicode เช่น UTF-8 ให้ตรงกันทั้งฐานข้อมูล ตาราง และการเชื่อมต่อของแอป หากชั้นใดชั้นหนึ่งใช้ charset อื่น อักษรไทยอาจถูกแปลงผิดหรือสูญหาย"},{"id":"ARC-J-E-018","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J3","concept":"backup-frequency-vs-data-loss-tolerance","mobile":false,"type":"single","stem":"ร้านค้าออนไลน์ใช้ฐานข้อมูลที่มีคำสั่งซื้อเข้าตลอดวัน เจ้าของธุรกิจบอกว่า หากระบบล่ม ยอมเสียข้อมูลคำสั่งซื้อย้อนหลังได้ไม่เกิน 1 ชั่วโมง ปัจจุบันทีมทำ full backup วันละครั้งตอนตี 2 แผนสำรองข้อมูลควรปรับอย่างไรจึงตรงกับความต้องการ","options":[{"id":"A","text":"เก็บสำรองส่วนที่เปลี่ยนแปลง (incremental หรือ transaction log) ทุกชั่วโมง ร่วมกับ full backup รายวัน","correct":true,"why":"ตอนกู้คืนใช้ full backup แล้วเล่นส่วนที่เปลี่ยนตามต่อ ข้อมูลที่อาจหายจึงไม่เกินช่วงห่างของการสำรองส่วนที่เปลี่ยน"},{"id":"B","text":"เปลี่ยนเป็น full backup วันละสองครั้ง คือตี 2 และเที่ยงวัน เพื่อลดช่วงข้อมูลที่อาจเสียลงจากเดิมครึ่งหนึ่ง","correct":false,"why":"ข้อมูลที่อาจหายยังสูงสุดถึงประมาณ 14 ชั่วโมง (เที่ยงวันถึงตี 2 ของวันถัดไป) ยังเกินเป้า 1 ชั่วโมง"},{"id":"C","text":"ทำ full backup ทุก 6 ชั่วโมง เพราะถี่กว่าเดิมถึงสี่เท่าและเป็นรอบที่ทีมดูแลได้สะดวก","correct":false,"why":"ข้อมูลที่อาจหายยังสูงสุดถึงประมาณ 6 ชั่วโมง ยังเกินเป้า 1 ชั่วโมง"},{"id":"D","text":"ทำ incremental backup ทุกชั่วโมงอย่างเดียว เลิก full backup เพราะ incremental ครอบคลุมทุกการเปลี่ยนแปลงอยู่แล้ว","correct":false,"why":"incremental backup เก็บเฉพาะส่วนที่เปลี่ยนจากครั้งก่อน ต้องมี full backup เป็นฐานตอนกู้คืน หากไม่มีฐานจะกู้ข้อมูลไม่ได้"}],"explanation":"ความถี่ของการสำรองข้อมูลต้องมาจากข้อมูลที่ธุรกิจยอมเสียได้มากที่สุด ไม่ใช่ความสะดวกของฝ่ายไอที การสำรองส่วนที่เปลี่ยนแปลงถี่ ๆ ร่วมกับ full backup เป็นวิธีที่ใช้ทรัพยากรน้อยกว่าการ full backup ถี่"},{"id":"ARC-J-E-019","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J4","concept":"acid-properties-meaning","mobile":false,"type":"multiple","stem":"ข้อใดอธิบายคุณสมบัติ ACID ของ transaction ในฐานข้อมูลเชิงสัมพันธ์ได้ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Consistency: ข้อมูลในเครื่องสำรองทุกเครื่องต้องเหมือนกันทุกวินาทีที่มีการเขียน","correct":false,"why":"consistency ใน ACID หมายถึง transaction พาข้อมูลจากสถานะที่ถูกกฎไปยังสถานะที่ถูกกฎ ไม่ใช่การซิงก์ระหว่างเครื่องสำรอง"},{"id":"B","text":"Atomicity: คำสั่งทั้งหมดใน transaction สำเร็จทั้งชุด หรือถูกยกเลิกทั้งชุด ไม่ค้างครึ่งทาง","correct":true,"why":"นี่คือความหมายของ atomicity เช่น ตัดเงินและเพิ่มเงินต้องสำเร็จคู่กันหรือไม่เปลี่ยนเลย"},{"id":"C","text":"Isolation: transaction ทุกตัวต้องรันทีละตัวตามลำดับ ห้ามทำงานซ้อนกันเด็ดขาด","correct":false,"why":"isolation หมายถึงผลลัพธ์ต้องเสมือนไม่มีใครกวนกัน แต่ฐานข้อมูลรันหลาย transaction ซ้อนกันได้ตามระดับ isolation ที่เลือก"},{"id":"D","text":"Durability: เมื่อ commit สำเร็จแล้ว ข้อมูลยังอยู่แม้เครื่องดับหรือรีสตาร์ททันที","correct":true,"why":"durability คือผลที่ commit แล้วต้องคงอยู่ถาวร โดยฐานข้อมูลมักใช้ log บนดิสก์เพื่อกู้คืนหลังเครื่องดับ"}],"explanation":"ACID ประกอบด้วย Atomicity (ทั้งชุดหรือไม่เลย), Consistency (ผ่านกฎและ constraint เสมอ), Isolation (transaction ที่ซ้อนกันไม่รบกวนกัน) และ Durability (commit แล้วคงอยู่) ควรแยกความหมายของ consistency ใน ACID ออกจากเรื่องการซิงก์ข้อมูลระหว่างเครื่อง"},{"id":"ARC-J-E-020","level":"junior","pool":"exam","competency":"Database Design","descriptor":"DB-J4","concept":"consistency-constraint-rollback","mobile":false,"type":"single","stem":"ตาราง accounts มีเงื่อนไข CHECK (balance >= 0) บัญชีหมายเลข 1 มียอด 300 บาท แล้วมีคำสั่งโอน 500 บาทไปบัญชีหมายเลข 2 ด้วยสคริปต์ด้านล่าง คำสั่งแรกละเมิดเงื่อนไข CHECK และฐานข้อมูลตอบ error ผลลัพธ์ที่ถูกต้องและสิ่งที่แอปต้องทำคืออะไร","code":"BEGIN;\nUPDATE accounts SET balance = balance - 500 WHERE id = 1;\nUPDATE accounts SET balance = balance + 500 WHERE id = 2;\nCOMMIT;","codeLang":"sql","options":[{"id":"A","text":"ยอดบัญชีหมายเลข 1 จะถูกปรับเป็น 0 อัตโนมัติ แล้ว transaction ดำเนินต่อเป็นการโอน 300 บาทให้ผู้รับตามยอดที่มีอยู่","correct":false,"why":"ฐานข้อมูลไม่แก้จำนวนเงินให้เอง มันเพียงปฏิเสธคำสั่งที่ละเมิดเงื่อนไข"},{"id":"B","text":"ฐานข้อมูลยอมให้ยอดติดลบชั่วคราวระหว่าง transaction และตรวจเฉพาะตอน COMMIT เสมอ","correct":false,"why":"โดยทั่วไป CHECK ถูกตรวจทันทีเมื่อคำสั่งทำงาน ไม่ได้รอถึง COMMIT เสมอไป"},{"id":"C","text":"ฐานข้อมูลไม่ยอมให้ยอดติดลบ และแอปต้องจับ error แล้วสั่ง ROLLBACK ทั้ง transaction ไม่ให้การเพิ่มยอดผู้รับถูก commit โดยลำพัง","correct":true,"why":"ฐานข้อมูลรักษา constraint ได้ แต่การยกเลิกทั้งชุดเมื่อคำสั่งใดล้มเหลวเป็นหน้าที่ที่แอปต้องสั่ง เพราะคำสั่งถัดไปอาจยังถูกรันและ commit ได้"},{"id":"D","text":"คำสั่งที่สองยังรันและ COMMIT สำเร็จตามปกติ โดยฐานข้อมูลบันทึกคำสั่งแรกเป็นเพียงคำเตือน","correct":false,"why":"ข้อผิดพลาดจาก constraint คือการปฏิเสธคำสั่ง ไม่ใช่คำเตือนที่ผ่านได้ และถ้าปล่อยให้ COMMIT ต่อ ผู้รับจะได้เงินที่ไม่ได้ถูกหักจากผู้โอน"}],"explanation":"constraint ทำให้ฐานข้อมูลรักษาความถูกต้อง (consistency) โดยปฏิเสธคำสั่งที่ผิดกฎ แต่แอปต้องตรวจ error และยกเลิก transaction ทั้งชุด มิฉะนั้นส่วนที่เหลืออาจถูก commit แล้วข้อมูลไม่สอดคล้องกัน"}]},"senior":{"practice":[{"id":"ARC-S-P-001","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S2","concept":"transactional-outbox","mobile":false,"type":"single","stem":"Order service บันทึกคำสั่งซื้อลงฐานข้อมูลแล้วจึงเรียก broker เพื่อ publish event OrderCreated ให้ Inventory และ Notification นำไปใช้ต่อ ช่วงที่ broker ล่มหรือ process ถูก kill ระหว่างสองขั้นตอนนี้ พบคำสั่งซื้อที่อยู่ในฐานข้อมูลแต่ไม่มี event ออกไปเลย ฐานข้อมูลของ Order service รองรับ transaction ปกติ แต่ broker ที่ใช้ไม่รองรับการเข้าร่วม distributed transaction ควรแก้ที่การออกแบบอย่างไรจึงตรงปัญหาที่สุด","options":[{"id":"A","text":"สลับลำดับเป็น publish event เข้า broker ก่อน แล้วจึงบันทึกคำสั่งซื้อลงฐานข้อมูล โดยคาดว่าทุกคำสั่งซื้อที่ถูกบันทึกจะต้องมี event ส่งออกไปแล้วก่อนหน้านั้นเสมอ","correct":false,"why":"ปัญหาแค่ย้ายไปอีกด้าน ถ้าการบันทึกลงฐานข้อมูลล้มเหลวหลังจาก publish ไปแล้ว consumer จะได้ event ของคำสั่งซื้อที่ไม่มีอยู่จริง"},{"id":"B","text":"บันทึกคำสั่งซื้อและแถว event ลงตาราง outbox ใน transaction เดียวกัน แล้วให้ relay อ่านจาก outbox ส่งเข้า broker และทำเครื่องหมายเมื่อส่งสำเร็จ","correct":true,"why":"การเขียนข้อมูลธุรกิจกับเจตนาจะส่ง event อยู่ใน transaction เดียวของฐานข้อมูลเดียว จึงสำเร็จหรือล้มเหลวพร้อมกัน relay ส่งซ้ำได้ถ้าล้มกลางทาง ฝั่ง consumer จึงต้องรับมือกับข้อความซ้ำ"},{"id":"C","text":"ครอบการ publish ด้วย try/catch แล้ว retry ใน memory สามครั้งโดยเว้นระยะสั้นๆ ก่อนตอบกลับผู้ใช้ว่าสั่งซื้อสำเร็จ","correct":false,"why":"ถ้า process ถูก kill หรือเครื่องดับระหว่าง retry รายการที่รอ retry อยู่ใน memory จะหายไปพร้อม process ไม่มีที่เก็บให้กลับมาส่งใหม่"},{"id":"D","text":"เพิ่ม job รายคืนที่สแกนตาราง orders แล้ว publish event ของคำสั่งซื้อที่ยังไม่เคยถูกส่งออกไป โดยอาศัยการเทียบข้อมูลระหว่างฐานข้อมูลกับสถานะของบริการปลายทางแต่ละราย","correct":false,"why":"ช่วยกู้ข้อมูลที่ตกหล่นได้ในที่สุด แต่ทำให้ event ล่าช้าได้หลายชั่วโมง และยังต้องมีวิธีรู้ว่าแถวไหนส่งแล้ว ซึ่งก็คือแนวคิดของ outbox ในรูปที่หยาบกว่า"}],"explanation":"ต้นเหตุคือ dual write: เขียนสองระบบที่ไม่อยู่ใน transaction เดียวกันจึงเกิดสถานะครึ่งๆ กลางๆ ได้เสมอ Transactional outbox ย้ายเจตนาจะส่ง event มาอยู่ในฐานข้อมูลเดียวกับข้อมูลธุรกิจ แล้วค่อยส่งต่อแบบ at-least-once จึงต้องออกแบบ consumer ให้ idempotent คู่กัน"},{"id":"ARC-S-P-002","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S2","concept":"idempotent-consumer","mobile":false,"type":"multiple","stem":"Payment service รับ event PaymentConfirmed จากคิวแบบ at-least-once ซึ่งอาจส่งข้อความเดิมซ้ำหลังเกิด timeout หรือ consumer restart ผลข้างเคียงของการประมวลผลคือเพิ่มคะแนนสะสมให้ลูกค้าและตัดสต็อก ระบบมี consumer หลาย instance ทำงานพร้อมกัน แนวทางใดทำให้การรับข้อความซ้ำไม่สร้างความเสียหาย (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ยืนยันรับ (ack) ข้อความทันทีที่ดึงมาก่อนเริ่มประมวลผล เพื่อให้ broker ไม่ส่งข้อความเดิมมาอีก แล้วให้ consumer ประมวลผลต่อในเธรดแยก","correct":false,"why":"ถ้า consumer ล้มหลัง ack แต่ก่อนประมวลผลเสร็จ ข้อความจะหายถาวร กลายเป็น at-most-once ซึ่งแก้ปัญหาซ้ำด้วยการยอมให้ข้อมูลหาย"},{"id":"B","text":"บันทึก message id ที่ประมวลผลแล้วในฐานข้อมูลเดียวกับผลข้างเคียง ใน transaction เดียวกัน พร้อม unique constraint กัน id ซ้ำ","correct":true,"why":"การบันทึก id กับผลข้างเคียงสำเร็จหรือล้มเหลวพร้อมกัน และ unique constraint ใช้ได้ข้าม instance จึงกันการประมวลผลซ้ำแม้มีหลาย consumer แข่งกัน"},{"id":"C","text":"เก็บ id ที่ประมวลผลแล้วไว้ใน Set ใน memory ของแต่ละ instance เพื่อให้ตรวจเร็วและไม่เพิ่มภาระฐานข้อมูล โดยจำกัดขนาดและลบรายการเก่าออกก่อน","correct":false,"why":"ข้อมูลหายเมื่อ instance restart และแต่ละ instance ไม่เห็น id ของ instance อื่น ข้อความเดิมที่ตกไปอีกตัวจึงถูกประมวลผลซ้ำได้"},{"id":"D","text":"ออกแบบการเปลี่ยนสถานะให้เป็นการตั้งค่าตามเงื่อนไข เช่น เปลี่ยนคำสั่งซื้อเป็น PAID เมื่อยังไม่เป็น PAID แทนการบวกหรือลบจากค่าเดิม","correct":true,"why":"การตั้งค่าตามเงื่อนไขให้ผลเท่าเดิมไม่ว่าทำซ้ำกี่ครั้ง จึงเป็น idempotent โดยธรรมชาติ ส่วนผลที่เป็นการบวกเพิ่ม เช่น คะแนนสะสม ยังต้องใช้การตรวจ id ร่วมด้วย"},{"id":"E","text":"ให้ producer ใส่ event id ที่คงที่ไปกับข้อความทุกครั้งที่ส่ง รวมถึงตอนส่งซ้ำ เพื่อให้ฝั่ง consumer ใช้ตรวจข้อความซ้ำได้","correct":true,"why":"ถ้า id เปลี่ยนทุกครั้งที่ส่งซ้ำ consumer แยกไม่ออกว่าเป็นเหตุการณ์เดิม การให้ producer กำหนด id ที่คงที่ต่อเหตุการณ์เป็นรากฐานของการตรวจซ้ำ"}],"explanation":"การส่งแบบ at-least-once แลกการไม่สูญหายกับความเสี่ยงที่ข้อความซ้ำ ทางออกคือทำให้ฝั่งรับ idempotent: id ที่คงที่จากต้นทาง การบันทึกว่าประมวลผลแล้วใน transaction เดียวกับผลข้างเคียง และการออกแบบการเปลี่ยนสถานะให้ทำซ้ำได้ ส่วนการ ack ก่อนหรือตรวจซ้ำแค่ใน memory เพียงย้ายปัญหาไปที่อื่น"},{"id":"ARC-S-P-003","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S3","concept":"read-model-reporting","mobile":false,"type":"single","stem":"ระบบ e-commerce แยก Order service กับ Customer service โดยแต่ละตัวมีฐานข้อมูลของตัวเอง ฝ่ายขายต้องการหน้ารายงานที่ค้นหา กรอง และเรียงลำดับคำสั่งซื้อตามชื่อลูกค้า จังหวัด และยอดรวม ข้อมูลล่าช้าได้ไม่กี่วินาที แต่ต้องตอบภายใน 300 มิลลิวินาทีบนข้อมูลคำสั่งซื้อหลายล้านแถว ควรออกแบบอย่างไร","options":[{"id":"A","text":"ให้ Reporting service เรียก Order service ดึงทุกหน้า แล้วเรียก Customer service ทีละลูกค้า จากนั้นรวมและเรียงลำดับในหน่วยความจำก่อนแสดงผล","correct":false,"why":"จำนวนการเรียกข้ามบริการเพิ่มตามจำนวนข้อมูล ทำให้ช้าเกินเป้า 300 มิลลิวินาที และต้องโหลดข้อมูลหลายล้านแถวเข้า memory ทุกครั้งที่ค้นหา"},{"id":"B","text":"ให้ Reporting service ขอสิทธิ์อ่านตารางของทั้งสองบริการโดยตรง แล้วเขียน JOIN ข้ามฐานข้อมูลสำหรับรายงาน","correct":false,"why":"ผูก Reporting เข้ากับ schema ภายในของบริการอื่น เมื่อทีมเจ้าของเปลี่ยน schema รายงานจะพังโดยไม่มีใครรู้ล่วงหน้า และทำลายหลักที่แต่ละบริการเป็นเจ้าของข้อมูลของตน"},{"id":"C","text":"ให้ Reporting service สร้าง read model ของตัวเองที่รวมคำสั่งซื้อกับข้อมูลลูกค้าไว้ในตารางเดียว อัปเดตจาก event ของสองบริการ และทำ index ตามคอลัมน์ที่ค้นหา","correct":true,"why":"ข้อมูลที่ล่าช้าไม่กี่วินาทีเป็นสิ่งที่ยอมรับได้อยู่แล้ว read model ที่ออกแบบมาสำหรับการค้นหาโดยเฉพาะจึงตอบเร็วโดยไม่ต้องข้ามบริการตอนอ่าน และไม่ผูกกับ schema ภายในของใคร"},{"id":"D","text":"ให้ Order service เก็บชื่อและจังหวัดลูกค้าซ้ำในตาราง orders โดยให้ Customer service เรียก API ของ Order service เพื่ออัปเดตทุกแถวของลูกค้ารายนั้นทุกครั้งที่ข้อมูลลูกค้าเปลี่ยน","correct":false,"why":"ทำให้ Customer service ต้องรู้จักผู้บริโภคข้อมูลของตนทีละราย การเปลี่ยนที่อยู่ลูกค้าหนึ่งคนอาจต้องแก้คำสั่งซื้อจำนวนมาก และการอัปเดตที่ล้มเหลวทำให้ข้อมูลสองฝั่งเพี้ยนกัน"}],"explanation":"เมื่อข้อมูลที่ต้องใช้ร่วมกันอยู่คนละบริการ และการอ่านต้องกรอง/เรียงลำดับข้ามทั้งสองฝั่ง ทางที่ยั่งยืนคือสร้าง read model (แนวคิด CQRS) ที่ถูกเติมจาก event แลกกับ eventual consistency ซึ่งโจทย์ยอมรับได้ ส่วนการรวมข้อมูลตอนอ่านด้วย API composition เหมาะกับข้อมูลปริมาณน้อยเท่านั้น"},{"id":"ARC-S-P-004","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S3","concept":"saga-compensation-design","mobile":false,"type":"multiple","stem":"การสั่งซื้อต้องผ่านสามบริการ: Order สร้างคำสั่งซื้อ, Payment ตัดบัตร, Inventory ตัดสต็อก แต่ละบริการมีฐานข้อมูลแยกกัน ทีมเลือกใช้ saga ที่มี compensating transaction สำหรับกรณีที่ Inventory ล้มเหลวหลังจาก Payment สำเร็จไปแล้ว ข้อใดเป็นแนวทางออกแบบที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ออกแบบ compensation เช่น คืนเงิน ให้เรียกซ้ำได้อย่างปลอดภัย (idempotent) และ retry ได้จนสำเร็จ เพราะตัวมันเองก็อาจล้มหรือถูกส่งซ้ำ","correct":true,"why":"saga ไม่มี rollback อัตโนมัติ compensation จึงเป็นคำสั่งธรรมดาที่ต้องทนต่อการล้มและการส่งซ้ำ ถ้าไม่ idempotent การ retry อาจคืนเงินซ้ำ"},{"id":"B","text":"ให้ Order service สั่ง rollback transaction ในฐานข้อมูลของ Payment โดยตรงเมื่อพบความผิดพลาด เพราะทั้งสามบริการอยู่ใน saga เดียวกัน","correct":false,"why":"transaction ของ Payment ถูก commit ไปแล้ว และฐานข้อมูลเป็นของ Payment service ที่ Order เข้าไปสั่งไม่ได้ ต้องใช้การกระทำชดเชยที่เป็นขั้นตอนทางธุรกิจ เช่น คืนเงิน"},{"id":"C","text":"ถือ distributed lock กับทั้งสามบริการไว้ตลอด saga จนจบ เพื่อไม่ให้ใครเห็นสถานะระหว่างทาง และปล่อย lock เมื่อทุกขั้นตอนสำเร็จหรือชดเชยครบแล้ว","correct":false,"why":"การล็อกข้ามบริการเป็นเวลานานลดความพร้อมใช้งาน และถ้าตัวถือ lock ล้มก็ติดค้าง saga แก้เรื่องนี้ด้วยสถานะระหว่างทาง เช่น PENDING ที่ออกแบบให้ผู้อ่านเข้าใจ"},{"id":"D","text":"จัดขั้นตอนที่ย้อนกลับไม่ได้ เช่น ส่งอีเมลยืนยันหรือแจ้งขนส่ง ไว้หลังขั้นตอนที่อาจล้มเหลว และใช้สถานะ PENDING ก่อนยืนยันขั้นสุดท้าย","correct":true,"why":"ขั้นตอนที่ย้อนกลับไม่ได้ควรทำเมื่อไม่มีขั้นตอนหลังจากนั้นที่อาจต้องชดเชยแล้ว ส่วนสถานะ PENDING ช่วยให้ผู้ใช้และบริการอื่นไม่เข้าใจผิดว่าคำสั่งซื้อสมบูรณ์ระหว่างรอ"}],"explanation":"Saga แทน transaction เดียวด้วยลำดับของ local transaction กับ compensation ที่เป็นขั้นตอนทางธุรกิจ จึงต้องออกแบบให้ compensation ทำซ้ำได้ เรียงขั้นตอนที่ย้อนไม่ได้ไว้ท้ายสุด และสื่อสถานะระหว่างทางให้ชัด แทนที่จะพยายามสร้างการล็อกหรือ rollback ข้ามฐานข้อมูลของบริการอื่น"},{"id":"ARC-S-P-005","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S1","concept":"correlation-id-middleware","mobile":false,"type":"single","stem":"ระบบมี 9 microservice เขียนด้วย Node.js ทั้งหมดและ log เป็น JSON ทีม support ต้องตามรอยคำขอหนึ่งรายการของลูกค้าผ่านทุก service จาก log ปัจจุบันแต่ละ service สร้าง requestId ของตัวเองขึ้นมาใหม่ จึงเชื่อมคำขอข้าม service ไม่ได้ ควรปรับอย่างไร","options":[{"id":"A","text":"เพิ่ม middleware กลางที่ทุก service ใช้ร่วมกัน อ่าน correlation id จาก header ขาเข้า (สร้างใหม่ถ้าไม่มี) เก็บใน request context แล้วแนบใน outgoing call และทุกบรรทัด log","correct":true,"why":"ทำครั้งเดียวที่ชั้น middleware จึงครอบคลุมทุก endpoint และทุก log โดยนักพัฒนาไม่ต้องจำ การส่งต่อใน outgoing call ทำให้ id เดียวกันตามไปครบทุก service"},{"id":"B","text":"ให้ gateway สร้าง id แล้ว log ไว้ที่ gateway อย่างเดียว ส่วน service อื่นใช้ requestId ของตัวเองเหมือนเดิม และให้ support จับคู่เอาจากช่วงเวลา","correct":false,"why":"การจับคู่จากเวลาคลาดเคลื่อนได้ง่ายเมื่อมีคำขอพร้อมกันจำนวนมาก และ id ที่อยู่แค่ log ของ gateway ไม่ช่วยให้ค้นหาใน log ของ service อื่น"},{"id":"C","text":"ให้ทุก method ในชั้น controller และ service รับ id เป็นพารามิเตอร์เพิ่ม แล้วส่งต่อด้วยมือไปยังทุกฟังก์ชัน log และทุกการเรียก service อื่นตลอดทุกชั้นของโค้ดในแต่ละบริการ","correct":false,"why":"ต้องแก้โค้ดทุกจุดและพึ่งความจำของนักพัฒนา เพียงจุดเดียวที่ลืมส่งต่อ ห่วงโซ่ของ id ก็ขาด โดยมักไม่มีใครสังเกตจนต้องใช้ตอนเกิดเหตุจริง"},{"id":"D","text":"ให้ทุก service log userId ของผู้ใช้ทุกบรรทัด แล้วใช้ userId เป็นตัวเชื่อมคำขอข้ามระบบ","correct":false,"why":"userId บอกว่าใครแต่ไม่ได้บอกว่าคำขอไหน ผู้ใช้คนเดียวอาจมีหลายคำขอพร้อมกัน และบางคำขอ เช่น งานเบื้องหลังหรือคำขอก่อนล็อกอิน ไม่มี userId เลย"}],"explanation":"Correlation id เป็นตัวอย่างคลาสสิกของ cross-cutting concern: ควรอยู่ใน middleware หรือ interceptor ที่ทุก service ใช้เหมือนกัน แทนที่จะอาศัยวินัยของนักพัฒนาแต่ละคน หลักคือรับจากต้นทาง สร้างเมื่อยังไม่มี เก็บใน context และส่งต่อทุกขาออก รวมถึงใส่ในทุกบรรทัด log"},{"id":"ARC-S-P-006","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S1","concept":"polyglot-cross-cutting-strategy","mobile":false,"type":"multiple","stem":"องค์กรมี 14 service เขียนด้วย Node.js, Java และ Go ต้องการให้การยืนยันตัวตนของคำขอจากภายนอกและระหว่าง service, timeout/retry และ metric พื้นฐานเป็นมาตรฐานเดียวกัน โดยไม่ให้แต่ละทีมเขียนซ้ำ แนวทางใดเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ใช้ sidecar proxy หรือ service mesh จัดการ mTLS, timeout, retry และเก็บ metric ระดับเครือข่ายให้ทุกภาษาเหมือนกัน","correct":true,"why":"ทำงานนอก process ของแอป จึงบังคับพฤติกรรมเดียวกันได้โดยไม่ขึ้นกับภาษา และแก้นโยบายครั้งเดียวที่ชั้นเครือข่ายได้"},{"id":"B","text":"คัดลอก middleware ที่ทีมแรกเขียนไปวางในแต่ละ repo แล้วให้แต่ละทีมปรับตามความจำเป็นของตัวเอง","correct":false,"why":"โค้ดแตกเป็นหลายสายพันธุ์ เมื่อพบช่องโหว่หรือบั๊กต้องไล่แก้ทีละ repo และไม่มีเวอร์ชันกลางให้อ้างอิง มาตรฐานเดียวกันจึงเป็นเพียงชั่วคราว"},{"id":"C","text":"ให้ API gateway ทำงานหยาบที่ขอบระบบ เช่น ตรวจ token เบื้องต้นและ rate limit ต่อ client","correct":true,"why":"เรื่องที่เหมือนกันทุกคำขอและทำได้โดยไม่ต้องรู้ข้อมูลของโดเมน เหมาะกับจุดรวมที่ขอบระบบ ช่วยลดงานซ้ำของทุก service"},{"id":"D","text":"ให้ gateway ตรวจกฎสิทธิ์ทางธุรกิจทุกข้อ เช่น เฉพาะเจ้าของออเดอร์เท่านั้นที่ขอคืนเงินได้ แล้วให้ service ภายในเชื่อ header ที่ gateway ส่งมา","correct":false,"why":"กฎที่ต้องใช้ข้อมูลของโดเมนควรตัดสินใน service ที่เป็นเจ้าของข้อมูล และถ้า service อื่นหรือ job ภายในเรียกตรงโดยข้าม gateway ก็ผ่านการตรวจนั้นไปได้ทั้งหมด"},{"id":"E","text":"ทำไลบรารี middleware บางๆ ต่อหนึ่งภาษา (รูปแบบ log, trace header, auth guard) ออกเวอร์ชันด้วย semantic versioning และให้ทีมอัปเกรดตามรอบ","correct":true,"why":"ส่วนที่ต้องฝังในโค้ดแอป เช่น รูปแบบ log และการส่งต่อ trace header ยังต้องมีไลบรารี การทำให้บางและมีเวอร์ชันช่วยให้แก้ที่เดียวแล้วเผยแพร่ได้โดยไม่ผูกทุกทีมให้ปล่อยพร้อมกัน"}],"explanation":"ในระบบหลายภาษา ไม่มีเครื่องมือเดียวที่ครอบคลุมทุกเรื่อง ผสมสามชั้นตามลักษณะงาน: mesh/sidecar สำหรับเรื่องเครือข่ายที่ไม่ขึ้นกับภาษา ไลบรารีบางๆ ที่มีเวอร์ชันสำหรับส่วนที่ต้องอยู่ในโค้ด และ gateway สำหรับงานหยาบที่ขอบระบบ ส่วนกฎทางธุรกิจต้องคงอยู่ใน service ที่เป็นเจ้าของข้อมูล"},{"id":"ARC-S-P-007","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S4","concept":"jwt-validation-downstream","mobile":false,"type":"single","stem":"API gateway ตรวจ JWT ของผู้ใช้แล้วส่งต่อคำขอไปยัง Order service มีผู้เสนอให้ Order service อ่าน userId จาก payload ของ JWT เลยโดยไม่ตรวจซ้ำ เพราะ gateway ตรวจแล้ว แต่ในอนาคตจะมี service อื่นและ job ภายในเรียก Order service ตรงๆ โดยไม่ผ่าน gateway ด้วย ภายใต้แนวคิด zero-trust ควรทำอย่างไร","options":[{"id":"A","text":"ให้ gateway แปลง userId จาก JWT เป็น header X-User-Id แล้วให้ Order service เชื่อ header นี้เมื่อคำขอมาจากเครือข่ายภายในขององค์กรเท่านั้น","correct":false,"why":"ตำแหน่งในเครือข่ายไม่ใช่การพิสูจน์ตัวตน service หรือ job ใดที่อยู่ในเครือข่ายเดียวกันก็ตั้ง header นี้เป็นใครก็ได้ ถ้าถูกเจาะเพียงจุดเดียวจะปลอมผู้ใช้ได้ทุกคน"},{"id":"B","text":"ให้ทุก service ใช้ secret key สำหรับ HMAC ตัวเดียวกับผู้ออก token เพื่อตรวจลายเซ็นเองได้ในทุก service","correct":false,"why":"ทุก service ที่ถือ secret เดียวกันออก token ปลอมได้เช่นกัน การถูกเจาะ service เดียวจึงเท่ากับเสียสิทธิ์ทั้งระบบ การตรวจด้วย public key ของผู้ออกให้แค่ความสามารถในการตรวจ ไม่ใช่การออก"},{"id":"C","text":"decode payload แล้วตรวจเฉพาะ exp และ role เพราะลายเซ็นถูกตรวจที่ gateway มาแล้ว","correct":false,"why":"payload ของ JWT เป็นเพียง Base64 ใครก็แก้และส่งเข้ามาตรงได้ ถ้าไม่ตรวจลายเซ็นในจุดที่รับคำขอ การอ่าน claim ใดๆ ก็เชื่อถือไม่ได้"},{"id":"D","text":"ให้ Order service ตรวจลายเซ็นด้วย public key ของผู้ออก token (จาก JWKS) พร้อมตรวจ exp, iss และ aud ว่าเป็นของตนเอง ก่อนใช้ claim","correct":true,"why":"ทุกจุดที่รับคำขอพิสูจน์ token เองได้ด้วย public key โดยไม่ต้องเก็บความลับร่วม การตรวจ aud กัน token ที่ออกให้บริการอื่นถูกนำมาใช้ซ้ำ และ exp/iss กัน token หมดอายุหรือจากผู้ออกที่ไม่ใช่"}],"explanation":"Zero-trust คือการไม่เชื่อสิ่งใดเพียงเพราะมาจากภายในเครือข่าย ทุก service ที่ใช้ identity ของผู้ใช้ต้องพิสูจน์ token เอง: ตรวจลายเซ็นด้วย public key, ตรวจ issuer, audience และอายุ การพึ่ง gateway เพียงด่านเดียวหรือ header ที่ส่งต่อทำให้ทุกเส้นทางที่ไม่ผ่าน gateway กลายเป็นช่องโหว่"},{"id":"ARC-S-P-008","level":"senior","pool":"practice","competency":"Microservices","descriptor":"MS-S4","concept":"mobile-oauth-pkce","mobile":true,"type":"single","stem":"ทีมกำลังทำแอปมือถือ (iOS/Android) ที่ล็อกอินผ่าน Authorization Server ขององค์กรด้วย OAuth2 แอปจะถูกดาวน์โหลดลงเครื่องผู้ใช้จำนวนมาก และไม่มี backend ของตัวเองคั่นกลางสำหรับการล็อกอิน ควรเลือก flow ใดเป็นหลัก","options":[{"id":"A","text":"Implicit flow ให้ access token กลับมาใน redirect URI โดยตรง เพราะแอปไม่มี backend สำหรับแลก code และลดจำนวนรอบการเรียกระหว่างแอปกับ server ลง","correct":false,"why":"token ไปอยู่ใน URL ที่แอปอื่นบนเครื่องซึ่งลงทะเบียน URI scheme เดียวกันอาจดักได้ และ flow นี้ไม่แนะนำให้ใช้อีกต่อไปในแนวปฏิบัติปัจจุบัน"},{"id":"B","text":"Authorization Code flow แบบ public client ร่วมกับ PKCE เปิดหน้า login ผ่าน browser ของระบบ แล้วนำ code ที่ได้กลับมาแลกเป็น token","correct":true,"why":"PKCE ผูก code กับ code_verifier ที่มีแต่แอปที่เริ่มคำขอรู้ จึงกัน code ที่ถูกดักไปแลกเป็น token ได้ โดยไม่ต้องมี secret ฝังในแอป และการใช้ browser ของระบบทำให้แอปไม่เห็นรหัสผ่านของผู้ใช้"},{"id":"C","text":"Authorization Code flow โดยฝัง client_secret ไว้ในแอปเพื่อใช้แลก code เป็น token","correct":false,"why":"ไฟล์แอปถูกแกะออกมาอ่านได้ ทุกคนที่ดาวน์โหลดแอปจึงได้ client_secret ไปด้วย ความลับที่แจกให้ผู้ใช้ทุกคนไม่ใช่ความลับ"},{"id":"D","text":"Resource Owner Password Credentials โดยให้แอปมีหน้า login ของตัวเอง ส่ง username/password ไปแลก token โดยตรง","correct":false,"why":"แอปต้องรับรหัสผ่านเอง ทำให้รองรับ MFA หรือ SSO ขององค์กรได้ยาก และเพิ่มความเสี่ยงที่รหัสผ่านรั่วจากแอป flow นี้ไม่แนะนำสำหรับแอปทั่วไป"}],"explanation":"แอปมือถือเป็น public client: เก็บความลับไม่ได้ ทางที่ถูกคือ Authorization Code + PKCE ผ่าน browser ของระบบ เพราะ PKCE ทดแทน client secret ด้วยความลับที่สร้างใหม่ทุกครั้งในแอป และผู้ใช้ป้อนรหัสผ่านที่หน้าของผู้ให้บริการยืนยันตัวตนโดยตรง"},{"id":"ARC-S-P-009","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S1","concept":"flash-sale-stock-contention","mobile":false,"type":"single","stem":"แคมเปญ flash sale เปิดขายสินค้า 500 ชิ้นตอน 12:00 คาดว่ามีคำขอสั่งซื้อราว 20,000 ครั้งภายใน 10 วินาทีแรก เว็บเป็น stateless หลาย instance ส่วนฐานข้อมูล relational มีตัวเดียวและ connection pool รวมกันได้ 100 connection ทีมกังวลทั้งเรื่องขายเกินสต็อกและฐานข้อมูลล่มจากโหลด วิธีออกแบบใดตอบทั้งสองปัญหาได้ดีที่สุด","options":[{"id":"A","text":"ลดสต็อกด้วย UPDATE ที่มีเงื่อนไข (เฉพาะแถวที่ยังเหลือ) แบบ atomic และใส่คิวหรือห้องรอจำกัดจำนวนคำขอที่เข้าฐานข้อมูลพร้อมกัน ส่วนที่เกินให้รอหรือตอบว่าหมดเร็วๆ","correct":true,"why":"เงื่อนไขในคำสั่ง UPDATE ทำให้การตรวจกับการลดสต็อกเป็นขั้นตอนเดียว กันขายเกิน ส่วนการคุมจำนวนคำขอที่เข้าฐานข้อมูลให้ต่ำกว่าขีดความสามารถ ช่วยไม่ให้ pool หมดและระบบล่ม"},{"id":"B","text":"อ่านจำนวนสต็อกมาตรวจในแอปก่อน ถ้ายังพอจึงสั่ง UPDATE ลดสต็อก แล้วเพิ่ม instance ของเว็บเป็น 50 เครื่อง พร้อมขยายขนาด pool ของแต่ละเครื่องเพื่อรับโหลดช่วงเปิดขาย","correct":false,"why":"ช่องว่างระหว่างอ่านกับเขียนทำให้หลายคำขอเห็นว่ายังพอพร้อมกันแล้วขายเกิน และ instance ที่มากขึ้นแย่งกันใช้ pool 100 connection เดิมมากขึ้น"},{"id":"C","text":"เก็บจำนวนสต็อกเป็นตัวแปรใน memory ของแต่ละ instance โดยแบ่งโควตา 10 ชิ้นต่อเครื่อง แล้วค่อยซิงก์ลงฐานข้อมูลภายหลัง","correct":false,"why":"ผู้ซื้อที่บังเอิญเข้า instance ที่โควตาหมดแล้วจะถูกปฏิเสธทั้งที่ instance อื่นยังเหลือ และถ้า instance ล้มก่อนซิงก์ ข้อมูลการขายที่ยังไม่ซิงก์จะหายไป"},{"id":"D","text":"แคชผลการอ่านสต็อกไว้ 30 วินาทีที่ CDN เพื่อลดโหลดฐานข้อมูล ส่วนการเขียนให้ทุกคำขอส่งตรงไปที่ฐานข้อมูล","correct":false,"why":"ปัญหาหลักอยู่ที่การเขียนที่แย่งกันบนแถวเดียวและจำนวน connection การแคชฝั่งอ่านไม่ลดสองเรื่องนี้ และตัวเลขสต็อกที่ค้าง 30 วินาทีทำให้ผู้ใช้เห็นข้อมูลผิด"}],"explanation":"Flash sale มีสองปัญหาแยกกัน: ความถูกต้องของสต็อก (แก้ด้วย atomic conditional update) และการปกป้องทรัพยากรจำกัด (แก้ด้วย admission control เช่นคิวหรือห้องรอ) การขยายเว็บเพียงอย่างเดียวหรือแคชฝั่งอ่านไม่แตะปัญหาที่คอขวดจริงคือการเขียนแถวเดียวและ connection pool"},{"id":"ARC-S-P-010","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S1","concept":"load-leveling-backpressure","mobile":false,"type":"multiple","stem":"ระบบรับ webhook จากพาร์ทเนอร์ ปกติ 20 คำขอต่อวินาที แต่ช่วงสิ้นเดือนพุ่งเป็น 200 คำขอต่อวินาทีนาน 5 นาที งานต่อคำขอต้องเรียก API ภายนอกที่จำกัดไว้ 50 คำขอต่อวินาที ยอมให้งานเสร็จช้าได้ไม่เกิน 1 ชั่วโมง แนวทางใดช่วยให้ระบบไม่ล่มและไม่ทำให้ API ภายนอกปฏิเสธคำขอ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มจำนวน worker เป็น 10 เท่า เพื่อให้ประมวลผลได้เร็วเท่ากับอัตราที่คำขอเข้ามาในช่วงพีค และปล่อยให้ worker เรียก API ภายนอกเต็มความเร็ว","correct":false,"why":"ปลายทางรับได้แค่ 50 คำขอต่อวินาที worker ที่มากขึ้นเพียงยิง API ภายนอกเร็วขึ้นจนถูกปฏิเสธหรือโดน rate limit ซ้ำ"},{"id":"B","text":"รับ webhook แล้วเขียนลงคิวทันทีและตอบกลับเร็ว ส่วน worker ดึงงานจากคิวด้วยอัตราที่ตั้งไม่เกินโควตาของ API ภายนอก","correct":true,"why":"คิวดูดซับช่วงพีคไว้ได้ (queue-based load leveling) การจำกัดอัตราฝั่ง worker ทำให้ปลายทางไม่เกินโควตา และงานค้างราว 45,000 รายการจะระบายหมดในไม่ถึง 1 ชั่วโมง"},{"id":"C","text":"ให้ webhook handler เรียก API ภายนอกโดยตรงใน request เดียวกัน และตั้ง timeout ให้ยาวพอจนกว่าจะเรียกสำเร็จ","correct":false,"why":"handler ต้องค้างรอจนกว่า API ภายนอกตอบ ผู้ส่ง webhook จึง timeout แล้วส่งซ้ำเอง ทำให้คำขอที่รออยู่ทับซ้อนและ thread หรือ connection ของเราหมด"},{"id":"D","text":"จำกัดขนาดคิวและกำหนดนโยบายเมื่อเต็ม เช่น ตอบ 429 หรือ 503 พร้อม Retry-After ให้ผู้ส่ง หรือเลื่อนงานที่ไม่เร่งด่วนไปทำทีหลัง","correct":true,"why":"คิวที่ไม่มีขอบเขตแค่ซ่อนปัญหาไว้จนระบบล้ม การกำหนดขนาดสูงสุดและบอกผู้ส่งให้ชะลอ (backpressure) ทำให้ระบบเสื่อมสภาพอย่างควบคุมได้"}],"explanation":"เมื่อช่วงโหลดสูงเกินความสามารถของปลายทางที่เปลี่ยนไม่ได้ ต้องแยกอัตราการรับออกจากอัตราการประมวลผลด้วยคิว แล้วคุมอัตราขาออก ควบคู่กับขอบเขตของคิวและ backpressure ไม่ใช่เพิ่มกำลังประมวลผลเพียงอย่างเดียวหรือให้ handler เรียกปลายทางตรงๆ ใน request เดียวกัน"},{"id":"ARC-S-P-011","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S1","concept":"critical-path-availability","mobile":false,"type":"single","stem":"API checkout ของร้านค้าออนไลน์ต้องมี availability 99.9% ต่อเดือน ปัจจุบัน checkout เรียกแบบ synchronous ต่อกันสามระบบ ได้แก่ Inventory (99.98%), Payment gateway (99.95%) และบริการส่งแจ้งเตือนทาง LINE (99.5%) ผลคือ checkout ล้มบ่อยกว่าเป้า ควรปรับการออกแบบอย่างไรจึงได้ผลมากที่สุด","options":[{"id":"A","text":"ตั้ง retry สามครั้งทุกการเรียก LINE และให้ checkout รอผลส่งแจ้งเตือนสำเร็จก่อนตอบผู้ใช้","correct":false,"why":"retry ช่วยเฉพาะความล้มเหลวชั่วคราว ช่วงที่ LINE ล่มจริง checkout ก็ยังต้องรอและล้มเหมือนเดิม ซ้ำยังเพิ่มเวลารอของผู้ใช้"},{"id":"B","text":"ย้ายทั้งสามระบบไปรันกระจายหลาย availability zone ของ cloud เพื่อให้ทนต่อการล่มของ zone ใด zone หนึ่งได้โดยอัตโนมัติ","correct":false,"why":"ช่วยความพร้อมใช้งานของระบบที่เราเป็นเจ้าของ แต่ 99.5% ของบริการ LINE เป็นของผู้ให้บริการภายนอก การกระจาย zone ของเราไม่เปลี่ยนค่านี้"},{"id":"C","text":"ขยาย timeout ของการเรียก LINE จาก 2 วินาทีเป็น 10 วินาที เพื่อลดจำนวนครั้งที่การเรียกล้มเหลวจากการตอบช้าชั่วคราว","correct":false,"why":"ลดการล้มจาก timeout สั้นเกินไปได้บ้าง แต่ไม่ช่วยตอนบริการล่ม และทำให้ checkout ค้างนานขึ้นจนผู้ใช้เห็นความช้า"},{"id":"D","text":"ย้ายการแจ้งเตือน LINE ออกจากเส้นทางหลัก โดยส่งเป็นงาน asynchronous ผ่านคิวหลัง checkout สำเร็จ","correct":true,"why":"ระบบที่ต่อกันแบบอนุกรมมี availability เท่าผลคูณ: 99.98% × 99.95% × 99.5% ≈ 99.43% ต่ำกว่าเป้า การเอา LINE ออกจากเส้นทางหลักเหลือ ≈ 99.93% ซึ่งผ่านเป้า 99.9%"}],"explanation":"Availability ของ dependency ที่เรียกแบบ synchronous คูณกัน ตัวที่อ่อนที่สุดจึงฉุดทั้งระบบ วิธีที่ได้ผลสูงสุดคือเอา dependency ที่ไม่จำเป็นต่อความสำเร็จของธุรกรรมออกจาก critical path ด้วย asynchronous หลังธุรกรรมสำเร็จ ส่วน retry หรือ timeout ที่ยาวขึ้นไม่ได้เปลี่ยนความจริงที่ว่ารอตัวที่ล่ม"},{"id":"ARC-S-P-012","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S2","concept":"cache-replica-shard-choice","mobile":false,"type":"single","stem":"แค็ตตาล็อกสินค้ามี 300,000 รายการ ฐานข้อมูลเดียวมี CPU ถึง 85% ช่วงโปรโมชัน 97% ของ traffic คือการอ่านหน้ารายการและหน้ารายละเอียดสินค้า ซึ่งคำขอส่วนใหญ่ซ้ำกับสินค้ายอดนิยมชุดเดิม ราคาและสต็อกแก้ไขวันละไม่กี่รอบ ผู้ใช้ยอมเห็นข้อมูลเก่าได้ไม่เกิน 1 นาที ทีมมีงบและกำลังคนดูแลระบบจำกัด ควรเลือกทางใดก่อน","options":[{"id":"A","text":"แยกข้อมูลสินค้าเป็น shard ตามหมวดหมู่ไปไว้บนฐานข้อมูลหลายชุด แล้วให้แอปเลือกชุดที่ถูกต้องตามหมวดของสินค้าที่ร้องขอ","correct":false,"why":"เพิ่มความซับซ้อนของการ query ข้ามหมวดและงานดูแลอย่างมาก ทั้งที่ข้อมูลเพียง 300,000 รายการยังไม่ใหญ่เกินฐานข้อมูลเดียว ปัญหาคือโหลดอ่านซ้ำ ไม่ใช่ขนาดข้อมูล"},{"id":"B","text":"เพิ่ม read replica หลายตัวและทำ read/write splitting ในแอป โดยไม่เพิ่มชั้นแคช","correct":false,"why":"ลดโหลดได้จริง แต่ทุกคำขอยังคำนวณซ้ำบนฐานข้อมูล ต้องจ่ายค่า replica หลายชุด และต้องรับมือกับ replication lag ในขณะที่ข้อมูลที่ถูกขอซ้ำเป็นชุดเดิมซึ่งแคชได้ถูกกว่า"},{"id":"C","text":"ใช้ cache-aside พร้อม TTL ราว 1 นาที และใช้ HTTP cache หรือ CDN กับหน้าที่เหมือนกันทุกคน","correct":true,"why":"คำขอซ้ำจำนวนมากถูกตอบจากแคชโดยไม่แตะฐานข้อมูล ความเก่าของข้อมูลคุมได้ด้วย TTL แต่ถ้ามีแคชหลายชั้นต้องตั้ง TTL รวมกันไม่เกิน 1 นาที และมีต้นทุนกับงานดูแลต่ำกว่าการเพิ่ม replica หรือ shard"},{"id":"D","text":"ย้ายข้อมูลสินค้าทั้งหมดไปฐานข้อมูล NoSQL เพราะอ่านได้เร็วกว่า relational","correct":false,"why":"การย้ายทั้งชุดมีความเสี่ยงและต้นทุนสูง ความเร็วขึ้นอยู่กับรูปแบบการเข้าถึงและการออกแบบ ไม่ได้ดีกว่าโดยอัตโนมัติ และโหลดอ่านซ้ำก็ยังเข้าถึงที่เก็บข้อมูลทุกครั้ง"}],"explanation":"เมื่อโหลดส่วนใหญ่เป็นการอ่านข้อมูลชุดเดิมซ้ำและยอมให้ข้อมูลเก่าได้ระยะหนึ่ง แคชคือเครื่องมือที่ถูกและตรงที่สุด Replica และ shard แก้ปัญหากำลังอ่านรวมและขนาดข้อมูลตามลำดับ ซึ่งแพงและซับซ้อนกว่า ควรขยับไปเมื่อแคชไม่พอ"},{"id":"ARC-S-P-013","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S2","concept":"architecture-decision-evaluation","mobile":false,"type":"multiple","stem":"ทีมต้องเลือกสถาปัตยกรรมสำหรับระบบแจ้งเตือนใหม่จากสามทาง ได้แก่ เรียก API ตรง, คิวข้อความ และ event streaming ก่อนเริ่มพัฒนา ขั้นตอนใดทำให้การประเมินทางเลือกน่าเชื่อถือและตรวจสอบย้อนหลังได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เขียน quality attribute scenario ที่วัดได้ เช่น ข้อความ 95% ถึงผู้ใช้ภายใน 5 วินาทีที่ 1,000 ข้อความต่อวินาที ใช้เทียบทุกทางเลือก","correct":true,"why":"เกณฑ์ที่วัดได้ทำให้เทียบทางเลือกบนฐานเดียวกันและตรวจได้ว่าผ่านหรือไม่ แทนการเทียบด้วยความรู้สึกว่าทางไหน \"เร็ว\" หรือ \"ยืดหยุ่น\""},{"id":"B","text":"เลือกตามเทคโนโลยีที่สมาชิกอาวุโสที่สุดเคยใช้ได้ผลมาก่อน และบันทึกเฉพาะทางที่เลือก รวมถึงเอกสารสรุปคุณสมบัติจากผู้ขาย","correct":false,"why":"ประสบการณ์เป็นข้อมูลที่มีค่า แต่ถ้าไม่ผูกกับเกณฑ์ของระบบนี้ และไม่บันทึกทางที่ไม่เลือก คนรุ่นหลังตรวจสอบเหตุผลหรือทบทวนเมื่อเงื่อนไขเปลี่ยนไม่ได้"},{"id":"C","text":"ทำ prototype หรือ load test ขนาดเล็กเฉพาะสมมติฐานที่เสี่ยงที่สุดของแต่ละทางเลือก แทนการเชื่อตัวเลขจากเอกสารโฆษณา","correct":true,"why":"ตัวเลขทั่วไปของผลิตภัณฑ์ไม่ได้สะท้อนรูปแบบโหลดและข้อมูลของเรา การทดลองจุดที่เสี่ยงที่สุดด้วยต้นทุนต่ำให้หลักฐานจริงก่อนผูกมัดทั้งโครงการ"},{"id":"D","text":"นับจำนวนฟีเจอร์ที่แต่ละทางเลือกมี แล้วเลือกตัวที่ได้คะแนนรวมสูงสุดโดยให้ทุกฟีเจอร์น้ำหนักเท่ากัน","correct":false,"why":"ฟีเจอร์ส่วนใหญ่อาจไม่เกี่ยวกับปัจจัยขับเคลื่อนของระบบนี้ การให้น้ำหนักเท่ากันทำให้ตัวที่ฟีเจอร์เยอะแต่ไม่ตอบข้อกำหนดสำคัญชนะได้"},{"id":"E","text":"บันทึกเป็น architecture decision record ที่ระบุบริบท ทางเลือกที่ไม่ถูกเลือกพร้อมเหตุผล และข้อจำกัดที่ยอมรับ","correct":true,"why":"การบันทึกเหตุผลของทางที่ตกไปและต้นทุนที่ยอมรับ ทำให้ทีมถัดไปรู้ว่าทำไมจึงเลือกแบบนี้ และรู้ว่าควรทบทวนเมื่อสมมติฐานเปลี่ยน"}],"explanation":"การประเมินสถาปัตยกรรมที่ดีเริ่มจากเกณฑ์ที่วัดได้ ทดลองจุดเสี่ยงที่สุดด้วยหลักฐานจริง และบันทึกการตัดสินใจพร้อมทางที่ไม่เลือก ส่วนการเลือกตามความเคยชินหรือนับฟีเจอร์เป็นทางลัดที่ตรวจสอบย้อนหลังไม่ได้"},{"id":"ARC-S-P-014","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S3","concept":"dfd-trust-boundary-pdpa","mobile":false,"type":"single","stem":"ก่อนเปิดระบบสมัครสมาชิกที่เก็บเลขบัตรประชาชนและเบอร์โทรศัพท์ ฝ่ายกำกับดูแล PDPA ขอเอกสารที่แสดงว่าข้อมูลส่วนบุคคลถูกส่งผ่านส่วนประกอบใดบ้าง เข้าจากอินเทอร์เน็ตและออกไปยังผู้ให้บริการภายนอกที่จุดใด และถูกเก็บถาวรที่ใด มุมมองการออกแบบใดตอบคำถามนี้ได้ตรงที่สุด","options":[{"id":"A","text":"class diagram ของโมเดลโดเมน แสดงคลาสสมาชิก คลาสเอกสารยืนยันตัวตน และความสัมพันธ์ระหว่างคลาสทั้งหมดในระบบ","correct":false,"why":"แสดงโครงสร้างข้อมูลในโค้ด ไม่ได้บอกว่าข้อมูลเดินทางผ่านส่วนประกอบใดหรือข้ามขอบเขตความเชื่อถือตรงไหน"},{"id":"B","text":"data flow diagram ที่ระบุ trust boundary ชนิดข้อมูลที่ไหลในแต่ละเส้น และที่เก็บข้อมูลแต่ละแห่ง","correct":true,"why":"ออกแบบมาตอบคำถามว่าข้อมูลอะไรไปไหนและข้ามขอบเขตใด จึงใช้ทั้งในการตรวจสอบการคุ้มครองข้อมูลส่วนบุคคลและการวิเคราะห์ภัยคุกคาม"},{"id":"C","text":"sequence diagram ของ use case สมัครสมาชิก แสดงลำดับข้อความระหว่างผู้ใช้กับระบบ","correct":false,"why":"ดีสำหรับลำดับการเรียก แต่ไม่ได้แสดงที่เก็บข้อมูลถาวรหรือขอบเขตความเชื่อถือ และบอกชนิดข้อมูลที่ไหลได้ไม่ครบทุกเส้นทาง"},{"id":"D","text":"deployment diagram ที่แสดง node, container และ subnet ที่ระบบรันอยู่","correct":false,"why":"บอกว่าระบบรันที่ไหน และอาจแสดงโซนเครือข่าย แต่ไม่ได้ระบุว่าข้อมูลส่วนบุคคลชนิดใดเดินผ่านเส้นทางใดหรือถูกเก็บที่ไหนบ้าง"}],"explanation":"แต่ละมุมมองตอบคำถามต่างกัน: คำถามเรื่อง \"ข้อมูลไหลอย่างไรข้ามขอบเขตไหน\" คือ data flow diagram ที่ระบุ trust boundary และที่เก็บข้อมูล ซึ่งใช้กันทั่วไปในงาน threat modeling และการทำแผนผังข้อมูลส่วนบุคคลตาม PDPA ส่วน class, sequence และ deployment ตอบคำถามเรื่องโครงสร้างโค้ด ลำดับการเรียก และที่รันตามลำดับ"},{"id":"ARC-S-P-015","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S3","concept":"multi-view-consistency-single-model","mobile":false,"type":"multiple","stem":"ทีมแพลตฟอร์มชำระเงิน 6 คน ไม่มีสถาปนิกประจำ ดูแลมุมมองสถาปัตยกรรม 4 ชุด (context, component, sequence ของ flow ชำระเงินหลัก, deployment) ซึ่งแต่ละคนวาดและแก้เองในไฟล์ภาพแยกกัน โครงสร้างระบบเปลี่ยนเดือนละหลายครั้ง ตอนผู้ตรวจสอบมาดูพบว่า component diagram ระบุว่า Notification service รับงานผ่านคิว แต่ sequence diagram และโค้ดเรียก HTTP ตรง ส่วน deployment diagram ยังแสดง service ที่ถูกปลดไปแล้ว ทีมต้องการให้มุมมองทั้งสี่ไม่ขัดกันอย่างต่อเนื่อง โดยไม่เพิ่มคนและไม่เพิ่มงานก้อนใหญ่ ข้อใดแก้ต้นเหตุของปัญหานี้ได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"นิยามองค์ประกอบและความสัมพันธ์ไว้ที่เดียวเป็นไฟล์ข้อความใน repo แล้วสร้างมุมมองโครงสร้างและการวางระบบจากไฟล์นั้น","correct":true,"why":"แก้ที่ต้นทางเดียวแล้วมุมมองที่สร้างจากต้นทางนั้นเปลี่ยนตามกัน จึงไม่มีสำเนาที่จะขัดกัน และไฟล์ข้อความรีวิวผ่าน PR ได้เหมือนโค้ด ส่วน sequence ของ flow ยังต้องเขียนเอง แต่ใช้ชื่อองค์ประกอบชุดเดียวกัน"},{"id":"B","text":"รวมสี่มุมมองเป็นแผนภาพใหญ่ภาพเดียวที่แสดงทุกอย่างพร้อมกัน เพื่อให้เหลือไฟล์เดียวที่ต้องดูแลและตรวจสอบ","correct":false,"why":"ลดจำนวนไฟล์แต่ผสมคำถามของผู้ตรวจสอบ ทีม ops และนักพัฒนาไว้ด้วยกัน ทำให้อ่านยากสำหรับทุกกลุ่ม และไม่ได้ทำให้ใครแก้ภาพเมื่อโครงสร้างเปลี่ยน ความขัดกันจึงกลับมาได้"},{"id":"C","text":"เพิ่มในเทมเพลต PR ให้ระบุว่ามุมมองใดได้รับผลกระทบ และให้ผู้รีวิวตรวจว่าไฟล์มุมมองนั้นถูกแก้ใน PR เดียวกัน","correct":true,"why":"ต้นเหตุคือการแก้โครงสร้างกับการแก้ภาพเกิดคนละจังหวะ การผูกสองอย่างไว้ใน PR เดียวกันทำให้จับความขัดกันได้ตอนที่ผู้แก้ยังจำบริบทได้ และเป็นงานเพิ่มเล็กน้อยต่อ PR"},{"id":"D","text":"ให้สมาชิกหนึ่งคนรับผิดชอบวาดมุมมองทั้งสี่ใหม่ให้ตรงกับระบบจริงก่อนการตรวจสอบประจำไตรมาสทุกครั้ง","correct":false,"why":"ภาพถูกต้องเฉพาะช่วงหลังวาดใหม่ ระหว่างไตรมาสที่โครงสร้างเปลี่ยนเดือนละหลายครั้งก็ขัดกันได้อีก และความรู้ผูกกับคนคนเดียวที่ต้องตามทุกการเปลี่ยนแปลง"},{"id":"E","text":"คงไว้เฉพาะ component diagram เพราะเป็นมุมมองที่นักพัฒนาใช้บ่อยที่สุด และเลิกดูแลมุมมองอื่นทั้งหมด","correct":false,"why":"ความขัดกันหายเพราะเหลือภาพเดียว แต่ผู้ตรวจสอบ ผู้ดูแลการวางระบบ และผู้ที่ต้องรู้ลำดับการเรียกเสียมุมมองที่ตอบคำถามของตน ปัญหาจึงย้ายไปที่อื่นมากกว่าถูกแก้"}],"explanation":"มุมมองหลายชุดของระบบเดียวต้องไม่ขัดกันเอง ต้นเหตุที่พบบ่อยคือแต่ละภาพเป็นสำเนาที่แก้ด้วยมือในจังหวะที่ต่างจากการแก้ระบบ แนวทางที่ได้ผลคือลดจำนวนที่ต้องแก้ซ้ำ (นิยามองค์ประกอบที่เดียวแล้วสร้างมุมมองจากนั้น) และผูกการแก้ภาพเข้ากับการแก้ระบบในกระบวนการปกติ เช่น PR ส่วนการวาดใหม่เป็นรอบหรือการยุบเหลือภาพเดียวไม่ตอบทั้งความต่อเนื่องและความหลากหลายของผู้อ่าน"},{"id":"ARC-S-P-016","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S4","concept":"risk-driven-spike","mobile":false,"type":"single","stem":"ทีมออกแบบระบบจองห้องประชุมที่ต้องซิงก์ปฏิทินองค์กรผ่าน API ของผู้ให้บริการภายนอก ผู้ให้ทุนต้องการอนุมัติจากหลักฐานบางอย่างก่อนเริ่มสร้างจริง ความเสี่ยงสูงสุดที่ยังไม่รู้คือ API ปฏิทินตอบช้าและมี rate limit เข้มพอที่จะทำให้การจองแบบ real-time ใช้ไม่ได้หรือไม่ ควรทำต้นแบบแบบใดก่อน","options":[{"id":"A","text":"ทำ clickable mockup ของทุกหน้าจอให้ผู้อนุมัติลองกดตามขั้นตอนการจอง","correct":false,"why":"ช่วยยืนยันประสบการณ์ใช้งาน แต่ไม่ให้ข้อมูลเลยว่า API ภายนอกรับโหลดได้หรือไม่ ซึ่งเป็นความเสี่ยงที่ถามอยู่"},{"id":"B","text":"เขียนเอกสารสถาปัตยกรรมละเอียด พร้อมอ้างค่า rate limit ที่ผู้ให้บริการประกาศไว้ในคู่มือ","correct":false,"why":"ตัวเลขที่ประกาศไม่บอก latency จริงของรูปแบบการใช้งานของเรา และอาจต่างจากที่ใช้งานจริง ต้องวัดด้วยการทดลองจึงน่าเชื่อถือ"},{"id":"C","text":"สร้าง spike เล็กๆ เฉพาะเส้นทางซิงก์ปฏิทิน ยิงโหลดตามจำนวนห้องและผู้ใช้ที่คาด แล้วเก็บ latency กับอัตราที่ถูก throttle","correct":true,"why":"ต้นแบบที่ตัดเฉพาะความเสี่ยงสูงสุด ให้คำตอบเป็นตัวเลขจริงในเวลาและต้นทุนน้อย พอให้ผู้อนุมัติตัดสินใจก่อนลงทุนสร้างทั้งระบบ"},{"id":"D","text":"สร้าง MVP ครบฟังก์ชันโดยใช้ mock ที่ตอบข้อมูลคงที่แทน API ปฏิทิน แล้วค่อยต่อ API จริงตอนใกล้ปล่อย เพื่อให้ผู้อนุมัติเห็นภาพรวมของระบบทั้งหมดก่อน","correct":false,"why":"เลื่อนการเจอความเสี่ยงที่สำคัญที่สุดไปท้ายโครงการ ถ้า API ใช้ไม่ได้จริง งานส่วนใหญ่ที่สร้างไปแล้วต้องแก้หรือทิ้ง"}],"explanation":"ต้นแบบมีไว้ตอบคำถามที่เสี่ยงที่สุดก่อน ไม่ใช่สร้างของให้ดูครบ เมื่อความไม่แน่นอนอยู่ที่ dependency ภายนอก การทดลองแคบๆ ด้วยโหลดและข้อมูลที่สมจริงให้หลักฐานที่ผู้มีส่วนได้ส่วนเสียใช้ตัดสินใจได้ ดีกว่าภาพจำลองหน้าจอ เอกสาร หรือการเลื่อนการต่อของจริงไปท้ายโครงการ"},{"id":"ARC-S-P-017","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S4","concept":"offline-sync-prototype","mobile":true,"type":"multiple","stem":"แอปมือถือของพนักงานขายภาคสนามต้องใช้งานออฟไลน์ แล้วซิงก์ข้อมูลลูกค้าเมื่อมีสัญญาณ ผู้มีส่วนได้ส่วนเสียกังวลว่าถ้าพนักงานสองคนแก้ลูกค้ารายเดียวกันขณะออฟไลน์ ข้อมูลจะหายหรือทับกัน ก่อนอนุมัติการออกแบบการซิงก์ ควรจำลองและทำต้นแบบสิ่งใดบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เขียนสคริปต์จำลองอุปกรณ์สองเครื่องที่แก้ record เดียวกันขณะออฟไลน์ แล้วซิงก์ในลำดับต่างๆ เพื่อดูผลของนโยบายแก้ conflict ที่เสนอ","correct":true,"why":"ทำให้เห็นผลลัพธ์จริงของนโยบายกับสถานการณ์ที่น่ากังวลที่สุดก่อนสร้างระบบ และทำซ้ำได้ทุกลำดับการซิงก์"},{"id":"B","text":"ทดสอบเฉพาะบน Wi-Fi ในออฟฟิศกับเครื่องรุ่นล่าสุด เพราะควบคุมตัวแปรได้ง่ายและทำซ้ำได้ โดยใช้ข้อมูลทดสอบชุดเล็กที่เตรียมไว้ล่วงหน้า","correct":false,"why":"ภาคสนามจริงสัญญาณไม่เสถียรและเครื่องหลากหลาย การทดสอบในสภาพแวดล้อมที่ดีเกินจริงไม่เปิดเผยปัญหาตอนซิงก์ค้างหรือตัดกลางทาง"},{"id":"C","text":"ทดสอบด้วยโปรไฟล์เครือข่ายที่ช้า หลุดบ่อย และตัดกลางการซิงก์ เพื่อตรวจว่าการส่งซ้ำไม่ทำให้ข้อมูลซ้ำหรือเสียหาย","correct":true,"why":"การซิงก์ที่ถูกตัดกลางแล้วส่งซ้ำเป็นสถานการณ์ปกติของแอปภาคสนาม การจำลองก่อนช่วยยืนยันว่าการออกแบบ (เช่น idempotent) รับมือได้"},{"id":"D","text":"ทำต้นแบบหน้าจอแก้ conflict ให้ตัวแทนผู้ใช้ลองกับกรณีตัวอย่าง เพื่อยืนยันว่านโยบาย เช่น ฉบับล่าสุดชนะ หรือให้ผู้ใช้เลือกเอง ยอมรับได้ทางธุรกิจ","correct":true,"why":"นโยบาย conflict เป็นการตัดสินใจทางธุรกิจ ไม่ใช่แค่เทคนิค ผู้มีส่วนได้ส่วนเสียต้องเห็นผลกับข้อมูลตัวอย่างจึงอนุมัติได้อย่างมีข้อมูล"}],"explanation":"ต้นแบบเพื่อขออนุมัติควรตอบข้อกังวลโดยตรง: จำลอง conflict ด้วยสคริปต์ที่ทำซ้ำได้ ทดสอบเครือข่ายแย่แบบภาคสนาม และให้ผู้ใช้เห็นผลของนโยบายที่เลือก การทดสอบในสภาพแวดล้อมสะดวกอย่าง Wi-Fi ออฟฟิศไม่ครอบคลุมความเสี่ยงที่ถามถึง"},{"id":"ARC-S-P-018","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S5","concept":"measurable-nfr-spec","mobile":true,"type":"single","stem":"สเปกของแอปมือถือระบุว่า \"หน้าแรกต้องโหลดเร็ว\" ทีมพัฒนาและ QA ตีความไม่ตรงกัน และไม่มีใครรู้ว่าเมื่อไรถือเป็นงานเสร็จ ข้อใดเป็นการปรับสเปกที่ตรวจสอบได้ดีที่สุด","options":[{"id":"A","text":"เวลาตอบกลับเฉลี่ยของ API หน้าแรกต้องไม่เกิน 1 วินาที เมื่อทดสอบบนเครื่องของนักพัฒนาในเครือข่ายภายในบริษัทแล้วได้ผลผ่าน","correct":false,"why":"ไม่ระบุภาระที่วัด และค่าเฉลี่ยซ่อนคำขอที่ช้ามากไว้ ผู้ใช้ส่วนหนึ่งอาจรอหลายวินาทีในขณะที่ค่าเฉลี่ยยังผ่านเกณฑ์"},{"id":"B","text":"หน้าแรกต้องโหลดเร็วกว่าแอปคู่แข่งอันดับหนึ่งในหมวดเดียวกัน","correct":false,"why":"เป้าหมายขึ้นกับสิ่งที่ทีมควบคุมไม่ได้และเปลี่ยนได้ทุกเมื่อ ไม่มีวิธีวัดซ้ำได้ว่าผ่านเมื่อไร"},{"id":"C","text":"ใช้ caching ที่ทุก endpoint ของหน้าแรกและบีบอัดรูปภาพทุกรูปที่แสดง","correct":false,"why":"เป็นวิธีแก้ ไม่ใช่ข้อกำหนด ไม่บอกว่าเร็วแค่ไหนจึงพอ และอาจเพิ่มความซับซ้อนโดยไม่จำเป็นถ้าระบบเร็วพอแล้ว"},{"id":"D","text":"p95 ของ API หน้าแรกไม่เกิน 800 มิลลิวินาทีที่ 300 คำขอต่อวินาที และเนื้อหาหลักแสดงใน 3 วินาทีบน 4G จำลอง","correct":true,"why":"ระบุเกณฑ์เชิงตัวเลข เปอร์เซ็นไทล์ ภาระ จุดวัด และเงื่อนไขเครือข่าย ทำให้ QA เขียนการทดสอบได้ตรงกันและตัดสินผ่านหรือไม่ผ่านได้"}],"explanation":"ข้อกำหนดที่ไม่ใช่ฟังก์ชันต้องมีตัวเลข เงื่อนไขภาระ จุดวัด และสภาพแวดล้อม จึงเป็นสัญญาที่ทดสอบได้ ค่าเฉลี่ยที่ไม่ระบุภาระไม่พอ ให้ใช้เปอร์เซ็นไทล์ และแยกข้อกำหนดออกจากวิธีแก้เสมอ"},{"id":"ARC-S-P-019","level":"senior","pool":"practice","competency":"System Design","descriptor":"SD-S5","concept":"spec-refine-from-feedback","mobile":true,"type":"multiple","stem":"แอปมือถือดาวน์โหลดรายการสินค้าทั้งหมด 40,000 รายการเมื่อเปิดแอป ผ่านการเรียก API ครั้งเดียว ทดสอบจริงบนเครือข่ายมือถือพบว่าใช้เวลา 35 ถึง 50 วินาที และบางครั้งหมดเวลา ทีมต้องปรับสเปกของ API ตามผลทดสอบนี้ ข้อใดเป็นการปรับสเปกที่ตรงปัญหา (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่ม timeout ฝั่งแอปจาก 30 เป็น 120 วินาที และเพิ่มขนาด instance ของ API ให้ใหญ่ขึ้น เพื่อให้การดาวน์โหลดครั้งเดียวมีเวลาเพียงพอ","correct":false,"why":"คอขวดคือปริมาณข้อมูลที่ต้องส่งผ่านเครือข่ายมือถือ ไม่ใช่ CPU ของเซิร์ฟเวอร์ การรอนานขึ้นทำให้ผู้ใช้เจอหน้าจอค้างนานขึ้นโดยไม่แก้ที่ต้นเหตุ"},{"id":"B","text":"เพิ่ม delta sync: แอปส่งเวลาหรือ token ของการซิงก์ล่าสุด แล้ว server ตอบเฉพาะรายการที่เพิ่ม แก้ไข หรือถูกลบนับจากนั้น","correct":true,"why":"หลังซิงก์ครั้งแรก การเปิดแอปครั้งต่อไปส่งข้อมูลเพียงส่วนที่เปลี่ยน ลดทั้งเวลาและปริมาณข้อมูลบนเครือข่ายมือถือลงอย่างมาก"},{"id":"C","text":"ให้ response ส่งรายละเอียดทุกฟิลด์ของสินค้าเพิ่ม รวมรีวิวและรูปความละเอียดสูง เพื่อให้แอปเรียก API เพิ่มภายหลังน้อยลง","correct":false,"why":"ทำให้ข้อมูลต่อรายการใหญ่ขึ้นหลายเท่า ปัญหาที่เจอคือส่งข้อมูลมากเกินไปอยู่แล้ว การเพิ่มจึงทำให้ช้าและหมดเวลาหนักกว่าเดิม"},{"id":"D","text":"แบ่งคำตอบเป็นหน้า กำหนดขนาดหน้าสูงสุด และเปิดการบีบอัดข้อมูล เพื่อให้แต่ละคำขอเล็กพอ และ retry ต่อจากหน้าที่ค้างได้","correct":true,"why":"คำขอเล็กลงมีโอกาสสำเร็จบนเครือข่ายไม่เสถียรสูงกว่า และเมื่อล้มก็เริ่มใหม่เฉพาะหน้านั้นแทนที่จะเริ่มโหลดทั้ง 40,000 รายการใหม่"}],"explanation":"ผลทดสอบชี้ว่าปัญหาคือขนาดข้อมูลต่อคำขอบนเครือข่ายมือถือ สเปกที่ดีหลังรับ feedback จึงลดและแบ่งข้อมูล (delta sync, pagination, compression) แทนที่จะเพิ่มความทนทานต่อความช้าด้วย timeout ที่ยาวขึ้นหรือเพิ่มข้อมูลให้ใหญ่ขึ้น"},{"id":"ARC-S-P-020","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S1","concept":"decompose-to-3nf","mobile":false,"type":"single","stem":"ตาราง order_lines ด้านล่างมีคีย์หลักประกอบ (order_id, product_id) และทราบ functional dependency ว่า product_id กำหนด product_name, order_id กำหนด customer_id, และ customer_id กำหนด customer_name เมื่อต้องการ normalize ให้ถึง third normal form (3NF) โดยไม่สูญเสียข้อมูล การแยกตารางแบบใดถูกต้อง","code":"CREATE TABLE order_lines (\n  order_id      INT,\n  product_id    INT,\n  qty           INT,\n  product_name  VARCHAR(200),\n  customer_id   INT,\n  customer_name VARCHAR(200),\n  PRIMARY KEY (order_id, product_id)\n);","codeLang":"sql","options":[{"id":"A","text":"orders(order_id, customer_id), customers(customer_id, customer_name), products(product_id, product_name), order_lines(order_id, product_id, qty)","correct":true,"why":"ทุกคอลัมน์ที่ไม่ใช่คีย์ขึ้นกับคีย์ทั้งหมดของตารางตัวเอง ไม่มี partial หรือ transitive dependency และ JOIN กลับได้ครบเพราะยังเก็บการเชื่อม order กับ customer ไว้"},{"id":"B","text":"orders(order_id, customer_id, customer_name), products(product_id, product_name), order_lines(order_id, product_id, qty)","correct":false,"why":"ยังมี transitive dependency: customer_name ขึ้นกับ customer_id ซึ่งไม่ใช่คีย์ของ orders ชื่อเดียวกันถูกเก็บซ้ำทุกคำสั่งซื้อของลูกค้าคนเดิมและแก้ไม่พร้อมกันได้"},{"id":"C","text":"orders(order_id, customer_id), customers(customer_id, customer_name), order_lines(order_id, product_id, qty, product_name)","correct":false,"why":"ยังมี partial dependency: product_name ขึ้นกับ product_id ซึ่งเป็นเพียงส่วนหนึ่งของคีย์ (order_id, product_id) ชื่อสินค้าจึงซ้ำทุกบรรทัดที่ขายสินค้านั้น"},{"id":"D","text":"order_lines(order_id, product_id, qty), products(product_id, product_name), customers(customer_id, customer_name)","correct":false,"why":"ทุกตารางอยู่ใน 3NF แต่สูญเสียข้อมูลว่าคำสั่งซื้อใดเป็นของลูกค้าคนไหน เพราะไม่มีตารางใดเก็บ order_id คู่กับ customer_id (การแยกต้องรักษาการ join กลับได้)"}],"explanation":"การ normalize ต้องทำสองอย่างพร้อมกัน: ขจัด partial และ transitive dependency และรักษาความสามารถในการ join กลับโดยไม่เสียข้อมูล (lossless) วิธีตรวจคือไล่ functional dependency ทีละข้อว่าไปอยู่ในตารางที่คีย์ของมันเป็นตัวกำหนดหรือยัง"},{"id":"ARC-S-P-021","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S1","concept":"justified-denormalization","mobile":false,"type":"multiple","stem":"ทีมออกแบบฐานข้อมูลระบบขายของออนไลน์ที่ normalize ถึง 3NF แล้ว และกำลังพิจารณาเก็บข้อมูลซ้ำ (denormalize) บางจุดเพื่อประโยชน์ในการใช้งาน กรณีใดมีเหตุผลรองรับ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"คัดลอกชื่อและเบอร์โทรลูกค้าไปไว้ในตาราง orders ทุกแถว เพราะอยากเลี่ยง JOIN ตอนแสดงรายการคำสั่งซื้อที่มีข้อมูลหลายล้านแถว","correct":false,"why":"ข้อมูลสองที่ต้องตรงกันตลอด เมื่อลูกค้าแก้เบอร์ ค่าเก่าค้างในคำสั่งซื้อเดิมโดยไม่มีกลไกอัปเดต และ JOIN ตามคีย์ที่มี index มักเร็วพออยู่แล้ว"},{"id":"B","text":"เก็บราคาต่อหน่วยและชื่อสินค้า ณ เวลาที่สั่งซื้อไว้ในแถวรายการสั่งซื้อ เพราะใบเสร็จเก่าต้องไม่เปลี่ยนตามราคาปัจจุบัน","correct":true,"why":"ข้อมูลนี้ไม่ใช่การซ้ำซ้อน แต่เป็นข้อเท็จจริงทางธุรกิจ ณ เวลาหนึ่งที่ต้องคงเดิม ราคาในตารางสินค้าเป็นราคาปัจจุบันซึ่งเปลี่ยนได้"},{"id":"C","text":"เก็บตารางสรุปยอดขายรายวันที่คำนวณไว้ล่วงหน้า สำหรับแดชบอร์ดที่วัดแล้วว่า JOIN สดช้าเกินเป้า โดยมีงานรีเฟรชที่ชัดเจน","correct":true,"why":"การเก็บผลที่คำนวณไว้แลกพื้นที่และความล่าช้าของข้อมูลกับความเร็วอ่าน เหมาะเมื่อมีหลักฐานว่าคิวรีสดช้า และมีกลไกรีเฟรชที่รู้ว่าข้อมูลเก่าได้เท่าไร"},{"id":"D","text":"เก็บรหัสจังหวัดและชื่อจังหวัดซ้ำในตารางลูกค้าทุกแถว เพราะต้องการให้โครงสร้างตารางดูเรียบง่ายขึ้นและลดจำนวนตารางอ้างอิงที่ต้องดูแล","correct":false,"why":"ชื่อจังหวัดขึ้นกับรหัสจังหวัด การเก็บซ้ำเสี่ยงสะกดไม่ตรงกันหรือแก้ไม่ครบ และไม่ได้ปรับปรุงประสิทธิภาพที่วัดได้ การค้นหาจังหวัดด้วย JOIN ตารางเล็กถูกมาก"},{"id":"E","text":"เก็บ comment_count ไว้ในตาราง posts พร้อมอัปเดตใน transaction เดียวกับการเพิ่มหรือลบความเห็น เพราะหน้ารายการอ่านบ่อยกว่าเขียนมาก","correct":true,"why":"ค่านับซ้ำกับข้อมูลในตารางความเห็น แต่เมื่ออ่านบ่อยกว่าเขียนมาก การคงค่านับให้ตรงด้วย transaction เดียวกันประหยัดการนับทุกครั้งที่แสดงรายการ"}],"explanation":"Denormalization เป็นการตัดสินใจเรื่องต้นทุน ไม่ใช่ความสะดวก มีเหตุผลเมื่อ (1) ข้อมูลเป็นข้อเท็จจริง ณ เวลานั้นที่ต้องคงเดิม หรือ (2) การอ่านหนักกว่าเขียนมากหรือวัดแล้วว่าคิวรีสดช้า โดยมีกลไกที่ทำให้ค่าซ้ำตรงกับต้นทาง หากทำเพราะอยากเลี่ยง JOIN โดยไม่วัด จะได้ anomaly โดยไม่ได้ประโยชน์"},{"id":"ARC-S-P-022","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S1","concept":"category-specific-attributes","mobile":false,"type":"single","stem":"ระบบร้านค้ามีสินค้า 6 หมวด (มือถือ เสื้อผ้า อาหาร ฯลฯ) แต่ละหมวดมีคุณสมบัติเฉพาะ 5 ถึง 10 รายการ ซึ่งหลายรายการต้องบังคับ NOT NULL ช่วงค่า (CHECK) และใช้กรองด้วย index เพิ่มหมวดใหม่ราวปีละหมวด ควรออกแบบตารางอย่างไร","options":[{"id":"A","text":"ตารางเดียวที่มีคอลัมน์ของทุกหมวดรวมกว่า 50 คอลัมน์ ปล่อยเป็น NULL เมื่อไม่เกี่ยวกับหมวดนั้น","correct":false,"why":"ใช้ NOT NULL ตรงๆ ไม่ได้ เพราะทุกคอลัมน์ต้องยอมให้เป็น NULL ในหมวดที่ไม่เกี่ยวข้อง ต้องเขียน CHECK ที่ผูกกับชนิดหมวดซึ่งซับซ้อนขึ้นและต้องแก้ทุกครั้งที่เพิ่มหมวด ตารางก็กว้างขึ้นด้วย"},{"id":"B","text":"ตาราง products เก็บคอลัมน์ร่วม และตารางส่วนขยายต่อหมวด (1:1 ด้วย product_id) เก็บคุณสมบัติเฉพาะพร้อม constraint ของหมวดนั้น","correct":true,"why":"แต่ละหมวดมีชนิดข้อมูลและ constraint ที่บังคับโดยฐานข้อมูลได้ เพิ่มหมวดใหม่ด้วยตารางใหม่โดยไม่แตะหมวดเดิม และ index ตามคอลัมน์ที่กรองได้ตรงตัว"},{"id":"C","text":"ตาราง product_attributes แบบ key-value (product_id, attribute_name, attribute_value เป็นข้อความทั้งหมด) ให้ทุกหมวดใช้ร่วมกันแม้คุณสมบัติต่างกัน","correct":false,"why":"ทุกค่าเป็นข้อความ ฐานข้อมูลตรวจชนิดข้อมูล ช่วงค่า หรือบังคับว่าต้องมีคุณสมบัติใดไม่ได้ และการกรองหลายคุณสมบัติต้อง JOIN ตัวเองหลายครั้ง"},{"id":"D","text":"คอลัมน์ JSON คอลัมน์เดียวใน products เก็บคุณสมบัติของทุกหมวด แล้วตรวจกฎของแต่ละหมวดในโค้ดแอป","correct":false,"why":"ความถูกต้องของข้อมูลพึ่งโค้ดแอปทั้งหมด ผู้เขียนข้อมูลทางอื่น เช่น สคริปต์หรือ import อาจละเมิดกฎได้ และการ index/กรองรายคุณสมบัติทำได้ยากกว่าคอลัมน์ธรรมดา"}],"explanation":"เมื่อคุณสมบัติมีกฎความถูกต้องที่ต้องให้ฐานข้อมูลบังคับ และจำนวนหมวดมีน้อยและโตช้า class table inheritance (ตารางร่วม + ตารางต่อหมวด) ให้ constraint และ index เต็มรูปแบบ แลกกับการเพิ่มตารางเมื่อเพิ่มหมวด ส่วน EAV หรือ JSON ล้วนเหมาะกับกรณีที่โครงสร้างผันแปรมากและไม่ต้องการกฎเข้ม"},{"id":"ARC-S-P-023","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S2","concept":"source-of-truth-vs-derived-store","mobile":true,"type":"single","stem":"แอป wallet สะสมแต้มต้องแสดงยอดแต้มคงเหลือทันทีที่เปิดแอป ผู้ใช้ 2 ล้านคน ทีมคิดจะใช้ Redis เก็บยอดแต้ม และใช้ฐานข้อมูล relational เก็บรายการเพิ่ม/ใช้แต้ม ข้อกำหนดคือยอดต้องตรงกับรายการเสมอ และต้องกู้ได้หากข้อมูลใน Redis สูญหาย ควรกำหนดบทบาทของสองระบบอย่างไร","options":[{"id":"A","text":"ให้ฐานข้อมูล relational เป็น source of truth บันทึกรายการแต้ม (ledger) ใน transaction ส่วน Redis เป็นสำเนาที่สร้างใหม่จากรายการได้","correct":true,"why":"ยอดที่ได้จากรายการที่บันทึกใน transaction ตรวจสอบและกู้คืนได้เสมอ ถ้า Redis หายก็คำนวณยอดจากรายการเดิมกลับมา โดยไม่เสียข้อมูล"},{"id":"B","text":"ให้ Redis เป็น source of truth ของยอดแต้ม แล้วเขียนรายการลงฐานข้อมูลภายหลังแบบ asynchronous เพื่อเก็บเป็น log สำหรับตรวจสอบย้อนหลัง","correct":false,"why":"ถ้า Redis ล้มก่อนรายการถูกเขียนลงฐานข้อมูล รายการเหล่านั้นหายพร้อมยอดแต้ม และไม่มีข้อมูลเพียงพอให้กู้คืนยอดที่ถูกต้องได้"},{"id":"C","text":"เขียนทั้ง Redis และฐานข้อมูลต่อกันในโค้ดเดียว แล้วอ่านยอดจากระบบที่ตอบก่อน","correct":false,"why":"ถ้าการเขียนอย่างหนึ่งสำเร็จอีกอย่างล้มเหลว สองที่ไม่ตรงกัน และเมื่ออ่านจากระบบที่ตอบเร็วกว่า ผู้ใช้อาจเห็นยอดต่างกันในแต่ละครั้ง"},{"id":"D","text":"เก็บทั้งยอดแต้มและรายการทั้งหมดของผู้ใช้เป็น array ในเอกสารเดียวของ document database","correct":false,"why":"array ที่โตไม่จำกัดทำให้เอกสารใหญ่ขึ้นเรื่อยๆ การเพิ่มรายการพร้อมกันของผู้ใช้เดียวแย่งกันแก้เอกสารเดียว และการตรวจสอบรายการข้ามผู้ใช้ทำได้ยาก"}],"explanation":"เมื่อใช้ฐานข้อมูลหลายชนิดต้องตอบให้ได้ว่าชนิดไหนเป็น source of truth และชนิดไหนเป็น derived store สิ่งที่ต้องไม่หาย (ledger) ควรอยู่ในที่ที่ให้ transaction และ durability ส่วนแคชเพื่อความเร็วต้องสร้างใหม่จากต้นทางได้ การเขียนสองระบบเท่ากันโดยไม่มีต้นทางเดียวนำไปสู่ข้อมูลเพี้ยน"},{"id":"ARC-S-P-024","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S2","concept":"sql-search-index-sync","mobile":false,"type":"multiple","stem":"ร้านค้าเก็บข้อมูลสินค้าไว้ในฐานข้อมูล relational และมี search index แยก (search engine) สำหรับค้นหา ความล่าช้าของ index ไม่กี่วินาทีเป็นสิ่งที่ยอมรับได้ แนวทางใดทำให้สองระบบไม่เพี้ยนกันในระยะยาว (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้การเปลี่ยนแปลงในฐานข้อมูลสร้าง event ผ่าน outbox หรือ change data capture แล้วให้ indexer แบบ idempotent upsert ลง search index","correct":true,"why":"การเปลี่ยนแปลงถูกบันทึกพร้อมข้อมูลหลักจึงไม่ตกหล่น และ indexer ที่ทำซ้ำได้ปลอดภัยทำให้ retry หลังล้มเหลวไม่สร้างเอกสารซ้ำหรือข้อมูลผิด"},{"id":"B","text":"เขียนฐานข้อมูลแล้วเขียน search index ต่อกันในโค้ด request เดียวกัน และ log error ไว้ถ้าอย่างหลังล้มเหลวแล้วทำงานต่อ","correct":false,"why":"ทุกครั้งที่เขียน index ล้มเหลว ข้อมูลสองที่ต่างกันถาวรโดยไม่มีใครแก้ log ที่อ่านภายหลังไม่ทำให้ข้อมูลกลับมาตรงกัน"},{"id":"C","text":"ใช้ search index เป็นแหล่งข้อมูลหลักของสถานะสินค้า แล้วให้ฐานข้อมูลซิงก์ตาม เพื่อให้หน้าค้นหาตรงกับข้อมูลล่าสุดเสมอ","correct":false,"why":"search engine ออกแบบเพื่อค้นหา ไม่ใช่เพื่อรับประกัน transaction และ durability ของข้อมูลธุรกิจ และข้อมูลหลักที่ตามมาทีหลังทำให้การเขียนสำคัญอย่างสต็อกเสี่ยงสูญหาย"},{"id":"D","text":"ออกแบบให้ reindex จากฐานข้อมูลทั้งหมดได้ทุกเมื่อ และเทียบจำนวนเอกสารสองฝั่งเป็นระยะเพื่อตรวจความเพี้ยน","correct":true,"why":"ต่อให้ pipeline ปกติพลาดบางครั้ง ก็มีวิธีกู้ให้ตรงกับแหล่งข้อมูลหลักได้ และการเทียบเป็นระยะทำให้เห็นความเพี้ยนก่อนผู้ใช้เจอ"},{"id":"E","text":"ตั้ง cron ทุกคืนลบ index ทั้งหมดแล้วนำเข้าใหม่จากฐานข้อมูล โดยไม่มีการอัปเดตระหว่างวัน เพื่อให้ index ตรงกับฐานข้อมูลที่สุดหลังรัน","correct":false,"why":"ข้อมูลใน index เก่าได้ถึงหนึ่งวัน ซึ่งไม่ตรงกับความต้องการว่าล่าช้าได้เพียงไม่กี่วินาที และการลบแล้วนำเข้าใหม่ทำให้ผลค้นหาไม่ครบช่วงที่กำลังสร้าง"}],"explanation":"ใช้ฐานข้อมูลหลักเป็น source of truth และให้ search index เป็นผลจากการสะท้อนการเปลี่ยนแปลง ผ่านช่องทางที่ไม่ตกหล่น (outbox/CDC) พร้อม consumer ที่ idempotent และมีทางสร้างใหม่ทั้งหมดเมื่อเพี้ยน การเขียนสองที่ในโค้ดเดียวหรือการ rebuild รายคืนไม่ตอบข้อกำหนดเรื่องความสดและความถูกต้อง"},{"id":"ARC-S-P-025","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S3","concept":"sargable-date-predicate","mobile":false,"type":"single","stem":"ตาราง orders มี 60 ล้านแถวและมี B-tree index บนคอลัมน์ created_at (ชนิด timestamp เก็บเป็นเวลา UTC) ธุรกิจนับยอดตามวันปฏิทินเวลาไทย (UTC+7) query plan ของคำสั่งด้านล่างแสดงว่าอ่านทั้งตารางแม้มี index ต้องการยอดของวันที่ 5 พฤศจิกายน 2026 ตามเวลาไทย ควรเขียนเงื่อนไขใหม่อย่างไรจึงทั้งเร็วและตรงวันของธุรกิจ","code":"SELECT order_id, total\nFROM orders\nWHERE DATE(created_at) = '2026-11-05';","codeLang":"sql","options":[{"id":"A","text":"WHERE created_at BETWEEN '2026-11-05 00:00:00' AND '2026-11-05 23:59:59'","correct":false,"why":"ใช้ index ได้ แต่ขอบเขตเป็นวัน UTC ไม่ใช่วันเวลาไทย ข้อมูลช่วงเที่ยงคืนถึง 07:00 น. เวลาไทยจึงผิดวัน และ BETWEEN ปิดท้ายที่ 23:59:59 ตกหล่นแถวที่มีเศษวินาที"},{"id":"B","text":"WHERE DATE(created_at + INTERVAL '7' HOUR) = '2026-11-05'","correct":false,"why":"ได้ผลลัพธ์ตรงวันเวลาไทย แต่ยังครอบคอลัมน์ด้วยฟังก์ชัน optimizer จึงใช้ index บน created_at ค้นช่วงไม่ได้ และยังอ่านทั้งตารางเหมือนเดิม"},{"id":"C","text":"WHERE created_at >= '2026-11-04 17:00:00' AND created_at \u003c '2026-11-05 17:00:00'","correct":true,"why":"วันที่ 5 เวลาไทยคือ 04 17:00 ถึงก่อน 05 17:00 UTC เงื่อนไขช่วงแบบปิดต้นเปิดท้ายบนคอลัมน์เปล่าใช้ index ค้นช่วงได้ตรง และไม่ตกหล่นแถวที่มีเศษวินาที"},{"id":"D","text":"คงเงื่อนไข DATE(created_at) เดิม แล้วสร้าง index ใหม่บน (created_at, order_id, total) ให้เป็น covering index","correct":false,"why":"ฟังก์ชันที่ครอบคอลัมน์ยังทำให้ต้องไล่ทุกรายการใน index (เร็วขึ้นแค่เล็กน้อยเพราะไม่ต้องกลับไปอ่านตาราง) และวันที่ที่ได้ยังเป็นวัน UTC ไม่ตรงวันเวลาไทย"}],"explanation":"เงื่อนไขที่ครอบคอลัมน์ด้วยฟังก์ชัน (non-sargable) ทำให้ใช้ index ค้นช่วงไม่ได้ ให้ย้ายการคำนวณไปฝั่งค่าคงที่แล้วใช้ช่วงแบบปิดต้นเปิดท้าย และอย่าลืมแปลงขอบเขตวันตามเขตเวลาของธุรกิจ (UTC+7) เป็น UTC ก่อนเทียบกับข้อมูลที่เก็บเป็น UTC"},{"id":"ARC-S-P-026","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S3","concept":"composite-index-set","mobile":false,"type":"multiple","stem":"ตาราง payments มี 90 ล้านแถว ผู้ค้า (merchant) 5,000 ราย ข้อมูลกระจายใกล้เคียงกัน และ reference_no ไม่ซ้ำกันทุกแถว ตอนนี้ยังไม่มี index นอกจากคีย์หลัก คำสั่งที่ใช้บ่อยมีสามแบบด้านล่าง ต้องการให้ทั้งสามเร็วขึ้นด้วยจำนวน index น้อยที่สุดและไม่ซ้ำซ้อน ควรสร้าง index ใดบ้าง (เลือกทุกข้อที่ถูก)","code":"-- (1)\nSELECT * FROM payments\nWHERE merchant_id = ? AND created_at >= ?\nORDER BY created_at DESC\nLIMIT 20;\n\n-- (2)\nSELECT COUNT(*) FROM payments WHERE merchant_id = ?;\n\n-- (3)\nSELECT * FROM payments WHERE reference_no = ?;","codeLang":"sql","options":[{"id":"A","text":"index บน (created_at, merchant_id)","correct":false,"why":"เริ่มด้วยคอลัมน์ช่วงเวลา คำสั่ง (1) ต้องไล่รายการของทุกผู้ค้าในช่วงนั้นแล้วกรอง และคำสั่ง (2) ที่กรองเฉพาะ merchant_id ใช้ index นี้ค้นตรงๆ ไม่ได้"},{"id":"B","text":"index บน (merchant_id, created_at)","correct":true,"why":"คอลัมน์ที่เทียบเท่ากับค่าเดียวมาก่อน แล้วตามด้วยคอลัมน์ช่วงและการเรียง จึงรองรับ (1) โดยไม่ต้อง sort เพิ่ม และ (2) ใช้ส่วนนำหน้า merchant_id ได้ด้วย"},{"id":"C","text":"index บน created_at เพียงคอลัมน์เดียว","correct":false,"why":"คำสั่ง (1) ต้องอ่านแถวของทุกผู้ค้าในช่วงเวลานั้นแล้วกรองทิ้ง ส่วน (2) และ (3) ไม่ได้ประโยชน์เลย"},{"id":"D","text":"index บน reference_no","correct":true,"why":"คำสั่ง (3) ค้นแถวเดียวจากค่าที่ไม่ซ้ำกัน index เฉพาะคอลัมน์นี้เป็นทางเดียวที่ช่วยโดยตรง ไม่มี index อื่นในชุดนี้ที่ครอบคลุมได้"},{"id":"E","text":"index บน merchant_id เพิ่มอีกตัว เพื่อให้ (2) เร็ว","correct":false,"why":"ส่วนนำหน้า merchant_id ของ index (merchant_id, created_at) รองรับ (2) อยู่แล้ว ตัวเพิ่มซ้ำซ้อน เสียพื้นที่ และทำให้ทุกการเขียนช้าลงโดยไม่ได้ประโยชน์"}],"explanation":"ออกแบบ composite index จากรูปแบบคำสั่ง: คอลัมน์เทียบเท่ามาก่อน ตามด้วยคอลัมน์ช่วงหรือคอลัมน์ที่ใช้เรียง และใช้ประโยชน์จากส่วนนำหน้า (leftmost prefix) ให้คำสั่งอื่นด้วย index ที่ซ้ำซ้อนไม่เพียงเปลืองพื้นที่ แต่ทำให้ INSERT/UPDATE ทุกครั้งต้องดูแลหลายที่"},{"id":"ARC-S-P-027","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S3","concept":"connection-pool-sizing","mobile":false,"type":"single","stem":"บริการ API รันบน Kubernetes ปกติ 5 pod แต่ละ pod ตั้ง connection pool สูงสุด 40 ฐานข้อมูล relational ตั้งจำนวน connection สูงสุดไว้ 250 โดยสำรองไว้ 30 สำหรับงานดูแลระบบและ migration ช่วงโปรโมชัน autoscaler ขยายเป็น 15 pod แล้วเริ่มเห็น error ว่า connection เต็มและ query ช้าทั้งระบบ ควรแก้ที่ต้นเหตุอย่างไร","options":[{"id":"A","text":"เพิ่มจำนวน connection สูงสุดของฐานข้อมูลเป็น 1,000 เพื่อให้รองรับ pod ที่เพิ่มขึ้นตอน autoscaler ขยายถึงระดับสูงสุด โดยไม่แก้ค่าอื่นของแอป","correct":false,"why":"ทุก connection ใช้หน่วยความจำและแย่งทรัพยากรของฐานข้อมูล ยิ่งมี query ทำงานพร้อมกันมาก ฐานข้อมูลยิ่งช้าลงเพราะแย่ง CPU และ lock กัน การเพิ่มเพดานจึงทำให้อาการแย่ลงได้"},{"id":"B","text":"เพิ่ม pool ต่อ pod เป็น 100 เพื่อไม่ให้แต่ละ pod ต้องรอ connection","correct":false,"why":"ผลรวม connection ที่ขอเพิ่มเป็น 1,500 สำหรับ 15 pod ซึ่งเกินเพดานของฐานข้อมูลหนักกว่าเดิม และ pod ที่รอ connection ไม่ได้หมายความว่าฐานข้อมูลมีกำลังเหลือ"},{"id":"C","text":"ลด connection timeout ฝั่งแอปเหลือ 1 วินาที เพื่อให้คำขอที่รอ connection ล้มเร็วขึ้น","correct":false,"why":"ทำให้ error ปรากฏเร็วขึ้นแต่ไม่ลดจำนวน connection ที่ขอ ผู้ใช้เจอข้อผิดพลาดมากขึ้นโดยปัญหาเรื่องผลรวม pool ยังอยู่"},{"id":"D","text":"กำหนดให้ pod สูงสุด × pool ต่อ pod ไม่เกิน connection ที่ฐานข้อมูลรับได้ เช่น ลด pool เหลือ 14 ต่อ pod หรือใช้ connection pooler ตัวกลาง","correct":true,"why":"15 pod × 14 = 210 อยู่ในงบ 220 ที่เหลือ ต้นเหตุคือผลรวมของ pool ทุก pod ชนเพดานของฐานข้อมูล ไม่ใช่ pool ของ pod เดียว การคิดจากผลรวมสูงสุดที่ autoscaler ขยายได้จึงป้องกันได้ตั้งแต่ต้น"}],"explanation":"Connection pool ต้องคิดระดับระบบ: (pod สูงสุด) × (pool ต่อ pod) ต้องไม่เกินที่ฐานข้อมูลรับได้หลังหักส่วนสำรอง เมื่อ autoscaler ขยายได้มาก ให้ลด pool ต่อ pod หรือใช้ pooler ตัวกลาง การเพิ่มเพดานของฐานข้อมูลหรือเพิ่ม pool ทำให้ปัญหาลุกลาม"},{"id":"ARC-S-P-028","level":"senior","pool":"practice","competency":"Database Design","descriptor":"DB-S3","concept":"estimate-vs-actual-rows","mobile":false,"type":"multiple","stem":"คำสั่งรายงานเคยรันได้ใน 2 วินาที แต่ตอนนี้ใช้ 90 วินาที หลังจากนำเข้าข้อมูลลูกค้าใหม่หลายล้านแถว EXPLAIN ANALYZE แสดงว่า optimizer ประมาณจำนวนแถวที่ผ่านเงื่อนไขของตาราง customers ไว้ 40 แถว แต่รันจริงได้ 1.8 ล
