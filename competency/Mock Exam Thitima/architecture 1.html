ยหลัง พร้อม alert","Choreography (แต่ละบริการตอบสนอง event เอง) เทียบกับ orchestration (ตัวประสานกลางสั่งงาน) และการจัดการ schema ของ event ต้องออกแบบให้ evolve ได้ (เพิ่ม field แบบ optional, ใช้ schema registry/versioning)"],"examFocus":["ถ้าต้องบันทึกข้อมูลและแจ้ง event โดยไม่ให้ขาดหายเมื่อระบบล้มกลางทาง ให้ใช้ Transactional Outbox","ถ้า consumer ได้ข้อความซ้ำแล้วตัดเงิน/สร้างข้อมูลซ้ำ ให้ทำ idempotent consumer ด้วย message ID ที่ไม่ซ้ำ","ถ้า event ของออเดอร์เดียวกันต้องประมวลผลตามลำดับใน Kafka ให้ใช้ orderId เป็น partition key","ถ้าข้อความเสียทำให้ consumer วนค้างและคิวไม่เดิน ให้จำกัด retry แล้วส่งเข้า DLQ","ถ้าโจทย์ถามเลือก event เทียบกับ command หรือ choreography เทียบกับ orchestration ให้ชั่งเรื่อง coupling กับการมองเห็นกระบวนการ"],"pitfalls":["เชื่อว่า broker รับประกัน exactly-once โดยไม่ต้องทำอะไร ความจริงต้องออกแบบ idempotency เอง","publish message หลัง commit DB ในโค้ดโดยตรง ถ้าแอปล้มระหว่างสองขั้น event หาย","คิดว่าเพิ่ม partition แล้วลำดับยังเหมือนเดิม จริง ๆ ลำดับรับประกันเฉพาะภายใน partition และการเปลี่ยนจำนวน partition อาจเปลี่ยนการกระจาย key","retry ไม่สิ้นสุดกับ poison message จนทำให้ข้อความอื่นถูกบล็อก"],"example":{"lang":"sql","code":"BEGIN;\nINSERT INTO orders (id, status) VALUES ('o-1', 'CREATED');\n-- event เขียนใน transaction เดียวกัน\nINSERT INTO outbox (id, aggregate_id, type, payload, published)\nVALUES ('e-1', 'o-1', 'OrderCreated', '{\"orderId\":\"o-1\"}', false);\nCOMMIT;\n-- relay: อ่านแถว published=false ส่งเข้า broker แล้วทำเครื่องหมายว่าส่งแล้ว"}},{"descriptor":"MS-S3","competency":"Microservices","title":"จัดการข้อมูลข้ามบริการอย่างเหมาะสม","summary":"เมื่อแต่ละบริการเป็นเจ้าของข้อมูล การทำธุรกรรมและการรายงานข้ามบริการต้องใช้ saga, read model และยอมรับ eventual consistency พร้อมออกแบบ UX ให้รองรับ","keyPoints":["Database per service: แต่ละบริการเป็นเจ้าของข้อมูลและเข้าถึงโดย API/event เท่านั้น การแชร์ฐานข้อมูลทำให้ผูกกันและเปลี่ยน schema ยาก","Distributed transaction แบบ 2PC ไม่เหมาะกับ microservices (ล็อกนาน พึ่ง coordinator ใช้ไม่ได้กับทุก broker/NoSQL) ทางเลือกคือ Saga","Saga คือลำดับ local transaction ของแต่ละบริการ โดยแต่ละขั้นมี compensating transaction เพื่อชดเชยเมื่อขั้นถัดไปล้มเหลว (เช่น ยกเลิกการจองสต็อก คืนเงิน) ซึ่งเป็น semantic undo ไม่ใช่ rollback จริง","ออกแบบ compensation: ต้อง idempotent, ทำได้แม้ระบบล่มกลางทาง, ขั้นที่ย้อนกลับไม่ได้ (เช่น ส่งอีเมล, จัดส่งแล้ว) ควรวางไว้ท้ายสุด, และ saga ต้องเก็บสถานะเพื่อกู้คืนหลังล้ม","Saga แบบ choreography (ฟัง event ของกันและกัน) เทียบกับ orchestration (orchestrator สั่งตามลำดับ) แบบหลังมองเห็นสถานะชัดและแก้ไขง่ายกว่าเมื่อขั้นตอนเยอะ","Saga ไม่มี isolation แบบ ACID ระหว่างทางข้อมูลอาจอยู่สถานะกึ่งกลาง ต้องจัดการด้วย semantic lock (เช่น สถานะ PENDING), การตรวจเวอร์ชัน หรือการออกแบบให้ทนต่อสถานะนั้น","รายงานที่ต้องรวมข้อมูลหลายบริการ: ใช้ read model / CQRS (บริการรายงานสร้างตารางของตัวเองจาก event ของบริการอื่น) หรือ data warehouse แทนการ join ข้ามฐานข้อมูลหรือเรียก API หลายครั้งตอน query","API composition: ชั้น aggregator เรียกหลายบริการแล้วรวมผล เหมาะกับ query เล็ก ๆ แต่มีปัญหาเมื่อข้อมูลมากหรือบริการหนึ่งช้า","Snapshot เทียบกับ reference: ข้อมูลที่ต้องคงค่าตามเวลาที่เกิดธุรกรรม (เช่น ชื่อสินค้า ราคา ที่อยู่จัดส่งในออเดอร์) ให้คัดลอกเก็บเป็น snapshot ส่วนข้อมูลที่ต้องเป็นปัจจุบันเสมอให้เก็บเฉพาะ ID อ้างอิงแล้วไปดึงเมื่อใช้","Eventual consistency และ read-your-writes: ผู้ใช้เพิ่งเขียนแล้วอ่านจาก read model ที่ยังไม่อัปเดตอาจไม่เห็นข้อมูลตัวเอง แก้ได้โดยคืนข้อมูลใหม่จาก response ของการเขียน, อ่านจาก source of truth ชั่วคราวหลังเขียน, ส่ง version/token ให้ read side รอ, หรือใช้ optimistic UI พร้อมสถานะกำลังประมวลผล"],"examFocus":["ถ้าสั่งซื้อต้องเกี่ยวกับบริการ order, payment, inventory และขั้นหนึ่งล้มเหลวต้องย้อนกลับ ให้ใช้ Saga พร้อม compensating transaction","ถ้ารายงานต้องรวมข้อมูลหลายบริการแล้วช้า/ผูกกัน ให้สร้าง read model จาก event","ถ้าใบสั่งซื้อต้องแสดงราคาเดิมแม้ราคาสินค้าเปลี่ยนภายหลัง ให้เก็บ snapshot ในออเดอร์","ถ้าผู้ใช้แก้โปรไฟล์แล้วเปิดดูยังเห็นของเก่า ให้ใช้เทคนิค read-your-writes","ถ้ามีข้อเสนอให้ทุกบริการ query ตารางของกันและกันตรง ๆ ให้ปฏิเสธและให้ผ่าน API หรือ event"],"pitfalls":["คิดว่า compensating transaction คือ rollback จริง มันเป็นการดำเนินการใหม่ที่ชดเชย และบางอย่างย้อนกลับไม่ได้","ใช้ reference อย่างเดียวกับข้อมูลทางประวัติศาสตร์ ทำให้ใบเสร็จเก่าเปลี่ยนค่าเมื่อข้อมูลต้นทางเปลี่ยน","ใช้ distributed lock/2PC เป็นคำตอบเริ่มต้นสำหรับทุกธุรกรรมข้ามบริการ","ละเลย idempotency ของ compensation ทำให้ชดเชยซ้ำเมื่อ retry"]},{"descriptor":"MS-S1","competency":"Microservices","title":"Cross-cutting Concerns ด้วย Middleware (Logging/Auth)","summary":"เรื่องที่ทุกบริการต้องมีเหมือนกัน เช่น logging, tracing, metrics, authentication ควรทำเป็น middleware หรือแพลตฟอร์มกลาง ไม่เขียนซ้ำในแต่ละบริการ และต้องระวังผลข้างเคียงอย่าง retry ที่ทวีคูณ","keyPoints":["Cross-cutting concern: logging, metrics, distributed tracing, authentication/authorization, rate limiting, error handling, request validation, correlation ID ทำเป็น middleware/filter/interceptor เพื่อใช้ซ้ำและสม่ำเสมอ","Structured logging (เช่น JSON) พร้อม field มาตรฐาน: timestamp, level, service name, correlation/trace ID ช่วยค้นข้ามบริการใน log aggregation (เช่น ELK, Loki)","Correlation ID: middleware ที่ขอบระบบสร้าง ID ถ้าคำขอยังไม่มี แล้วส่งต่อใน header ทุก call ขาออก และใส่ในทุกบรรทัด log จึงตามรอยคำขอเดียวข้ามหลายบริการได้ ต้องส่งต่อผ่านงาน async/message ด้วย","Distributed tracing: ใช้ OpenTelemetry และ W3C Trace Context (header `traceparent`) เก็บ span ของแต่ละบริการ เห็น latency ต่อขั้นตอน","Metrics และ monitoring: ใช้แนว RED (Rate, Errors, Duration) สำหรับบริการ และ USE (Utilization, Saturation, Errors) สำหรับทรัพยากร พร้อม alert ตาม SLO","บริการหลายภาษา (polyglot): ไลบรารีกลางทำได้ทีละภาษาและต้องดูแลหลายชุด ทางเลือกคือย้ายความรับผิดชอบไปที่ API Gateway หรือ sidecar/service mesh (เช่น Istio, Linkerd) เพื่อจัดการ mTLS, retry, timeout, telemetry ได้สม่ำเสมอไม่ขึ้นกับภาษา แลกกับความซับซ้อนของ platform","Authentication ที่ gateway ช่วยรวมศูนย์ แต่แต่ละบริการยังควรตรวจ token/สิทธิ์ของตนเองด้วย (defense in depth)","Resilience patterns: timeout, retry, circuit breaker, bulkhead, rate limiting ควรเป็น policy กลางที่กำหนดค่าได้","Retry amplification: ถ้าแต่ละชั้นของ call chain retry เอง จำนวนคำขอที่ตกถึงบริการล่างสุดคูณกัน (เช่น 3 ชั้น ชั้นละ 3 ครั้ง ได้ถึง 27 คำขอ) ซ้ำเติมบริการที่กำลังล้ม ควร retry ที่ชั้นเดียว ใช้ retry budget (จำกัดสัดส่วน retry ต่อคำขอปกติ) และส่ง deadline/timeout ที่เหลือต่อไปให้ชั้นล่าง","อย่าใส่ข้อมูลอ่อนไหว (รหัสผ่าน token ข้อมูลส่วนบุคคล) ลง log; ใช้ log level อย่างเหมาะสมและคุมปริมาณ log"],"examFocus":["ถ้าต้องตามคำขอเดียวข้ามหลายบริการ ให้ใช้ correlation/trace ID ที่ middleware สร้างและส่งต่อ","ถ้าทีมใช้หลายภาษาและอยากให้ policy เหมือนกัน (mTLS, retry, telemetry) โดยไม่แก้ทุกบริการ ให้พิจารณา sidecar/service mesh หรือ gateway","ถ้า call chain หลายชั้นแล้วบริการล่างสุดโหลดพุ่งตอนมีปัญหา ให้ตรวจ retry amplification และลดเหลือ retry ชั้นเดียว","ถ้าต้องมี authentication เหมือนกันทุกบริการโดยไม่ copy โค้ด ให้ทำ middleware/ไลบรารีกลางหรือ gateway และยังตรวจสิทธิ์ที่บริการ","ถ้าโจทย์ถามชนิดสัญญาณ observability ให้แยก logs, metrics, traces และบอกว่าแต่ละอย่างตอบคำถามอะไร"],"pitfalls":["สร้าง correlation ID ใหม่ในทุกบริการแทนที่จะส่งต่อ ทำให้ตามรอยไม่ได้","ให้ทุกชั้น retry พร้อมกันโดยไม่ประสานกัน","ใส่ความรับผิดชอบทั้งหมดที่ gateway แล้วเชื่อ traffic ภายในโดยไม่ตรวจซ้ำ","log ข้อมูลส่วนบุคคลหรือ token ลงไฟล์ log"],"example":{"lang":"typescript","code":"import { randomUUID } from 'crypto';\nimport { AsyncLocalStorage } from 'async_hooks';\n\nexport const ctx = new AsyncLocalStorage<{ correlationId: string }>();\n\nexport function correlationMiddleware(req, res, next) {\n  const id = req.header('x-correlation-id') ?? randomUUID();\n  res.setHeader('x-correlation-id', id);\n  ctx.run({ correlationId: id }, next);\n}\n\n// ตอนเรียกบริการอื่น ส่ง header เดิมต่อ\n// headers: { 'x-correlation-id': ctx.getStore()?.correlationId }"}},{"descriptor":"MS-S4","competency":"Microservices","title":"ความปลอดภัยขั้นสูง: OAuth2, JWT, mTLS, Zero-trust","summary":"ออกแบบการยืนยันตัวตนและการอนุญาตระหว่างผู้ใช้กับบริการและระหว่างบริการด้วยกันให้ปลอดภัยโดยไม่เชื่อถือเครือข่ายภายใน","keyPoints":["OAuth 2.0 เป็นกรอบ authorization (การมอบสิทธิ์เข้าถึงทรัพยากร) ส่วน OpenID Connect (OIDC) ต่อยอดเพื่อ authentication (ยืนยันตัวตนผู้ใช้) ผ่าน ID token","Authorization Code flow + PKCE เป็น flow ที่แนะนำสำหรับ public client เช่น mobile app และ SPA: client สร้าง `code_verifier` แบบสุ่ม ส่ง `code_challenge` (แฮช S256) ตอนขอ code และส่ง verifier ตอนแลก token ทำให้ authorization code ที่ถูกดักไปใช้ไม่ได้","แอปมือถือควรเปิด system browser/in-app browser tab สำหรับ login ไม่ใช้ embedded WebView และไม่เก็บ client secret ในแอปเพราะ public client เก็บความลับไม่ได้ ส่วน Client Credentials flow ใช้กับ service-to-service ที่ไม่มีผู้ใช้ และ Implicit flow ถูกเลิกแนะนำแล้ว","JWT ประกอบด้วย header, payload (claims), signature การตรวจที่ resource server ต้องทำ: ตรวจ signature ด้วยกุญแจสาธารณะ (ดึงจาก JWKS endpoint ของ issuer), ตรวจ `iss`, `aud` ว่าเป็น token สำหรับบริการนี้, `exp` (และ `nbf`), และตรวจสิทธิ์ (scope/role)","ห้ามเชื่อ `alg` ในเฮดเดอร์แบบไม่จำกัด ให้กำหนด algorithm ที่ยอมรับไว้ล่วงหน้า และปฏิเสธ `alg: none`","JWT payload ถูกเข้ารหัสแบบ base64url ไม่ใช่การเข้ารหัสลับ ใครก็อ่านได้ จึงห้ามใส่ข้อมูลลับ; access token ควรอายุสั้น ใช้ refresh token (พร้อม rotation) ต่ออายุ","การเพิกถอน JWT ทำยากเพราะ stateless: ใช้อายุสั้น, deny list ของ token ID, หรือ opaque token + token introspection","mTLS (mutual TLS): ทั้ง client และ server แสดงใบรับรอง ใช้ยืนยันตัวตนระหว่างบริการและเข้ารหัสการสื่อสาร มักจัดการอัตโนมัติด้วย service mesh และใบรับรองอายุสั้น (เช่น SPIFFE identities)","ขอบเขตของ mTLS: ยืนยันว่าบริการปลายทางคือใคร แต่ไม่ได้บอกว่าผู้ใช้ปลายทางคือใคร และไม่ได้ตัดสินสิทธิ์ระดับ business จึงยังต้องส่งต่อ identity ผู้ใช้ (เช่น JWT) และตรวจ authorization แยกต่างหาก","Zero-trust: ไม่เชื่อ network location, ยืนยันตัวตนและสิทธิ์ทุกคำขอ (never trust, always verify), least privilege, สมมติว่าอาจถูกเจาะแล้ว (assume breach), ตรวจสอบและบันทึกอย่างต่อเนื่อง"],"examFocus":["ถ้าเป็นแอปมือถือที่ต้อง login ผ่าน identity provider ให้ใช้ Authorization Code + PKCE ไม่ฝัง client secret ในแอป","ถ้าบริการปลายน้ำได้รับ JWT จาก gateway ให้ตรวจ signature, issuer, audience, expiry เอง ไม่เชื่อเพียงเพราะมาจากเครือข่ายภายใน","ถ้าบริการสองตัวคุยกันโดยไม่มีผู้ใช้ ให้ใช้ client credentials และ/หรือ mTLS","ถ้าโจทย์ว่าใช้ mTLS แล้วพอไหมสำหรับสิทธิ์ผู้ใช้ ให้ตอบว่าไม่พอ ต้องมี authorization ระดับผู้ใช้/สิทธิ์ด้วย","ถ้าต้องเพิกถอนสิทธิ์ทันที ให้ชั่งระหว่าง token อายุสั้น+refresh กับ opaque token+introspection"],"pitfalls":["คิดว่า JWT ถูกเข้ารหัส จึงใส่ข้อมูลอ่อนไหวใน payload","ตรวจเฉพาะ signature แต่ไม่ตรวจ `aud`/`iss`/`exp` จึงรับ token ที่ออกให้บริการอื่นหรือหมดอายุ","ใช้ Implicit flow หรือฝัง client secret ในแอปมือถือ/SPA","เชื่อว่าเครือข่ายภายในปลอดภัยจึงไม่ต้องยืนยันตัวตนระหว่างบริการ ขัดกับ zero-trust"],"example":{"lang":"typescript","code":"import { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst jwks = createRemoteJWKSet(new URL('https://idp.example.com/.well-known/jwks.json'));\n\nexport async function verify(token: string) {\n  const { payload } = await jwtVerify(token, jwks, {\n    issuer: 'https://idp.example.com/',\n    audience: 'orders-api',\n    algorithms: ['RS256'],\n  });\n  return payload; // ตรวจ scope/role ต่อที่ชั้น authorization\n}"}},{"descriptor":"SD-S1","competency":"System Design","title":"ออกแบบระบบ Scalable และ Reliable","summary":"ออกแบบระบบหลายส่วนประกอบให้รับโหลดสูงและทนความล้มเหลว โดยเข้าใจคอขวด การกระจายโหลด ความพร้อมใช้งาน และเป้าหมายการกู้คืน","keyPoints":["Scale แนวตั้ง (vertical: เพิ่มทรัพยากรเครื่องเดียว มีเพดาน) เทียบกับแนวนอน (horizontal: เพิ่มจำนวนเครื่อง ต้องให้ service เป็น stateless และเก็บ state ไว้ที่ DB/cache ภายนอก) พร้อม load balancer","Hot-row contention: ผู้ใช้จำนวนมากแย่งอัปเดตแถวเดียว (เช่น สต็อกสินค้า flash sale) แก้ด้วย atomic update (`UPDATE ... SET qty = qty - 1 WHERE qty > 0`), Redis `DECR` เป็นตัวนับหน้าด่านแล้ว sync ภายหลัง, แบ่งสต็อกเป็นหลายช่อง (sharded counter), หรือเข้าคิวให้ประมวลผลทีละคำขอ ไม่ใช้การอ่านแล้วเขียนแยกขั้นโดยไม่ล็อก","Load leveling ด้วย queue: ใช้คิวรับ burst แล้วให้ consumer ประมวลผลตามอัตราที่ระบบรับได้ ผู้ใช้ได้รับการตอบรับว่ากำลังประมวลผล","Backpressure และ rate limiting: เมื่อผู้ผลิตเร็วกว่าผู้บริโภค ต้องจำกัดคิว (bounded queue), ส่ง 429/503 หรือ shed load แทนปล่อยให้หน่วยความจำ/latency บวมจนล้ม","ความพร้อมใช้งานของ component ที่ต่ออนุกรม (ต้องผ่านทุกตัว) คือผลคูณ เช่น 99.9% สองตัวต่อกัน ได้ประมาณ 99.8% ส่วนการต่อแบบขนาน (redundant) ช่วยเพิ่มความพร้อมใช้งาน; ลดจำนวน dependency บน critical path และทำให้ dependency รองเป็น optional","99.9% เทียบเท่า downtime ประมาณ 8.76 ชั่วโมงต่อปี และ 99.99% ประมาณ 52.6 นาทีต่อปี","RPO (ข้อมูลที่ยอมเสียได้) และ RTO (เวลาที่ยอมให้ล่ม) กำหนดกลยุทธ์ DR: backup & restore (ถูกสุด RTO/RPO สูง), pilot light, warm standby, active-active หลาย region (แพงสุด RTO/RPO ต่ำสุด) เลือกตามความสำคัญของธุรกิจและงบ","Cache stampede: key ที่ hot หมดอายุพร้อมกันแล้วคำขอจำนวนมากพุ่งไปที่ DB บรรเทาด้วย request coalescing/single-flight (ให้ผู้ขอเดียวสร้างค่า) หรือ lock, TTL jitter (สุ่มเวลาหมดอายุ), stale-while-revalidate, refresh ก่อนหมดอายุ","Stateless + idempotent + timeout + retry with backoff + circuit breaker เป็นองค์ประกอบของ reliability; ใช้ health check และ auto-scaling ตามเมตริก","ออกแบบตามมาตรฐานที่ตกลง: กำหนด quality attribute (performance, availability, scalability) ให้วัดได้ แล้วตรวจสอบกับ design standard ขององค์กร"],"examFocus":["ถ้าโจทย์ flash sale ที่หลายคนแย่งสต็อก ให้ใช้ atomic decrement/คิว/ตัวนับหน้าด่าน ไม่ใช่ read-modify-write ที่ไม่ล็อก","ถ้า traffic พุ่งชั่วคราวเกินกำลังประมวลผล ให้ใช้ queue เพื่อ level load และจำกัดด้วย backpressure","ถ้าโจทย์ถามความพร้อมใช้งานของระบบที่เรียก component หลายตัวต่อกัน ให้คำนวณผลคูณและลด dependency บน critical path","ถ้าองค์กรยอมเสียข้อมูลได้ไม่กี่นาทีและกู้ได้ใน 1 ชั่วโมง ให้เลือกกลยุทธ์ DR ที่สอดคล้อง RPO/RTO นั้น ไม่เกินจำเป็นด้านต้นทุน","ถ้า cache key ยอดนิยมหมดอายุแล้ว DB ล่ม ให้แก้ stampede ด้วย single-flight/lock และ TTL jitter"],"pitfalls":["เพิ่ม instance อย่างเดียวโดยไม่แก้คอขวดที่ DB หรือ lock","มองว่า cache แก้ปัญหา write contention ได้ cache ช่วยเฉพาะการอ่าน","คิดว่า availability ของระบบเท่ากับ component ที่ดีที่สุด ความจริงเป็นผลคูณของที่ต่ออนุกรม","ตั้ง TTL เท่ากันให้ key จำนวนมากแล้วหมดอายุพร้อมกัน"]},{"descriptor":"SD-S2","competency":"System Design","title":"ประเมินและจำลองทางเลือกสถาปัตยกรรม","summary":"เปรียบเทียบทางเลือกสถาปัตยกรรมอย่างเป็นระบบด้วยเกณฑ์ที่วัดได้ ชั่ง trade-off และบันทึกการตัดสินใจ แทนการเลือกตามความเคยชิน","keyPoints":["ประเมินจาก quality attributes (performance, scalability, availability, security, maintainability, cost) แปลงเป็น scenario ที่วัดได้ แล้วให้น้ำหนักตามความสำคัญทางธุรกิจ (เช่น utility tree ใน ATAM)","บันทึกการตัดสินใจด้วย Architecture Decision Record (ADR): บริบท ทางเลือกที่พิจารณา เหตุผล และผลที่ตามมา เพื่อให้ย้อนดูเหตุผลได้","เครื่องมือ/วิธีจำลอง: back-of-envelope estimation, load test เทียบทางเลือก, prototype, C4/UML modeling (เช่น Structurizr, PlantUML, draw.io) และ weighted decision matrix","Cache เทียบ read replica เทียบ sharding: cache ลดภาระอ่านของข้อมูลที่ถูกอ่านซ้ำ (ต้องจัดการ invalidation); read replica ขยายการอ่านแต่มี replication lag และไม่ช่วยเรื่องการเขียน; sharding ขยายทั้งขนาดข้อมูลและการเขียน แต่ซับซ้อน (เลือก shard key, hot shard, query ข้าม shard, resharding)","ลำดับการแก้คอขวดที่สมเหตุสมผล: ปรับ query/index ก่อน แล้ว cache, read replica และ sharding เป็นขั้นหลังเมื่อวัดแล้วจำเป็น","ค้นหาข้อความ (full-text search) ควรใช้ search engine เฉพาะทาง (เช่น Elasticsearch/OpenSearch) ที่ใช้ inverted index แทน `LIKE '%...%'` บนฐานข้อมูลหลัก ซึ่งใช้ B-tree index ไม่ได้","ภาษาไทยไม่เว้นวรรคระหว่างคำ จึงต้องมีการตัดคำ (word segmentation) ใน analyzer ที่รองรับภาษาไทย การใช้ tokenizer ที่ตัดด้วยช่องว่างอย่างเดียวจะค้นหาไม่ได้ผล","ฐานข้อมูลหลักเป็น source of truth ส่วน search index เป็น derived data ที่ sync ผ่าน event/CDC และ rebuild ได้","Strangler Fig migration: ค่อย ๆ ย้ายความสามารถจากระบบเก่าไประบบใหม่ทีละส่วน โดยวาง facade/proxy ด้านหน้าให้ route คำขอตามส่วนที่ย้ายแล้ว ระบบทำงานตลอดและ rollback ได้ด้วยการเปลี่ยน routing เทียบกับ big-bang rewrite ที่เสี่ยงสูง","ใน Strangler Fig อาจใช้ Anti-Corruption Layer เพื่อไม่ให้โมเดลเก่ารั่วเข้าระบบใหม่ และต้องวางแผนจัดการข้อมูลที่ถูกใช้ร่วมกันระหว่างช่วงเปลี่ยนผ่าน"],"examFocus":["ถ้าโจทย์ให้เลือกระหว่าง cache, replica, sharding ให้ดูว่าปัญหาคืออ่านซ้ำ อ่านหนัก หรือเขียน/ข้อมูลโตเกินเครื่องเดียว","ถ้าต้องตัดสินใจสถาปัตยกรรมที่ต้องปกป้องตัวเลือกกับผู้มีส่วนได้ส่วนเสีย ให้ใช้เกณฑ์ที่วัดได้และบันทึก ADR","ถ้าจะค้นหาสินค้าภาษาไทยที่ใหญ่ ให้ใช้ search engine พร้อมตัดคำไทย และ sync จากฐานข้อมูลหลัก","ถ้าต้องย้ายระบบ legacy ขนาดใหญ่โดยไม่หยุดบริการ ให้ใช้ Strangler Fig ทีละส่วน","ถ้าโจทย์ถามขั้นตอนประเมินทางเลือก ให้นึกถึง: เกณฑ์ที่วัดได้, scenario, prototype/ทดสอบโหลด, ชั่งน้ำหนัก, บันทึกการตัดสินใจ"],"pitfalls":["เลือก sharding ตั้งแต่ต้นทั้งที่ยังไม่ได้ลอง index/cache/replica","คิดว่า read replica แก้ปัญหา write หนัก","ใช้ LIKE '%คำ%' ค้นหาข้อความภาษาไทยบนข้อมูลจำนวนมาก","เลือกเทคโนโลยีตามกระแสโดยไม่มีเกณฑ์วัด"]},{"descriptor":"SD-S3","competency":"System Design","title":"Multiple Design Views สำหรับ Stakeholder ต่างกลุ่ม","summary":"ระบบหนึ่งอธิบายได้หลายมุมมอง (โครงสร้าง พฤติกรรม interface การติดตั้ง ความปลอดภัย) แต่ละ stakeholder สนใจต่างกัน ต้องให้ทุกมุมมองสอดคล้องกัน","keyPoints":["หลักของ architecture description (ISO/IEC/IEEE 42010): ระบุ stakeholder และ concern ของเขา แล้วเลือก viewpoint/view มาตอบ concern นั้น","มุมมองโครงสร้าง (structural): component/class/package diagram, C4 Container/Component; มุมมองพฤติกรรม (behavioral): sequence, activity, state machine; มุมมอง interface: OpenAPI สำหรับ REST, AsyncAPI สำหรับ event, สัญญา schema; มุมมอง deployment: node, network, region","4+1 view model: logical, process, development, physical และ scenarios (use cases) ที่เชื่อมทั้งสี่เข้าด้วยกัน","Data Flow Diagram (DFD) แสดงการไหลของข้อมูลระหว่าง process, data store, external entity และ trust boundary (เส้นแบ่งระดับความเชื่อถือ) ใช้ทำ threat modeling เช่น STRIDE ที่จุดข้ามขอบเขต","สำหรับ PDPA (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล) DFD ช่วยระบุว่าข้อมูลส่วนบุคคลไหลไปที่ใด เก็บที่ไหน ส่งข้ามขอบเขตหรือให้บุคคลที่สามหรือไม่ เพื่อประเมินฐานทางกฎหมาย การเข้ารหัส สิทธิ์การเข้าถึง และการลดข้อมูลให้เหลือเท่าที่จำเป็น","รักษาความสอดคล้องระหว่าง view: ใช้โมเดลเดียวเป็นแหล่งความจริง (single model / model-as-code เช่น Structurizr DSL) แล้ว generate view ต่าง ๆ แทนวาดแยกมือ ลดการเพี้ยนกัน","State machine เหมาะอธิบายวงจรชีวิตของ entity เช่น การรับ webhook จากผู้ให้บริการชำระเงิน","Webhook อาจมาซ้ำและไม่เรียงลำดับ: ออกแบบให้ idempotent ด้วย event ID, ตรวจว่า transition ที่ได้รับถูกต้องจากสถานะปัจจุบัน, เพิกเฉย event ที่เก่ากว่าสถานะปัจจุบัน (ใช้ timestamp/sequence หรือดึงสถานะล่าสุดจากผู้ให้บริการ) และตอบ 2xx เร็วแล้วประมวลผลแบบ async","ผู้ชมแต่ละกลุ่ม: ผู้บริหารต้องการภาพรวมและต้นทุน/ความเสี่ยง, นักพัฒนาต้องการ interface และ component, ทีม ops ต้องการ deployment และ monitoring, security/compliance ต้องการ trust boundary และการไหลของข้อมูล"],"examFocus":["ถ้าโจทย์ให้เลือก diagram สำหรับ stakeholder ด้านความปลอดภัยหรือ PDPA ให้เลือก DFD ที่มี trust boundary","ถ้าหลาย diagram ของทีมขัดแย้งกัน ให้แก้ด้วยการใช้โมเดลเดียวเป็นแหล่งจริงแล้ว generate view","ถ้า webhook ของสถานะการชำระเงินมาสลับลำดับหรือซ้ำ ให้ใช้ state machine + idempotency และไม่ย้อนสถานะ","ถ้าต้องอธิบาย interface ให้ทีมอื่น ใช้ OpenAPI/AsyncAPI ไม่ใช่ class diagram ภายใน","ถ้าถามว่าทำไมต้องมีหลาย view ให้ตอบว่า stakeholder แต่ละกลุ่มมี concern ต่างกัน และไม่มี diagram เดียวตอบได้ครบ"],"pitfalls":["พยายามวาด diagram เดียวให้ตอบทุกความสนใจจนอ่านไม่ออก","วาดแต่ละ view แยกมือจนไม่สอดคล้องกัน","ประมวลผล webhook ตามลำดับที่มาถึงโดยไม่ตรวจสถานะปัจจุบัน","ละเลย trust boundary ใน DFD จึงมองไม่เห็นจุดเสี่ยง"]},{"descriptor":"SD-S4","competency":"System Design","title":"จำลองและทำ Prototype พฤติกรรมระบบเพื่อขออนุมัติ","summary":"ลดความเสี่ยงของการออกแบบด้วยการทดลองสิ่งที่ไม่แน่ใจที่สุดก่อน ใช้ prototype, spike, simulation และการประมาณความจุ เพื่อให้ stakeholder ตัดสินใจจากหลักฐาน","keyPoints":["Prototype มีหลายแบบ: wireframe/clickable mockup (เช่น Figma) สำหรับ UX, proof of concept (พิสูจน์ความเป็นไปได้ทางเทคนิค), spike (การทดลองสั้นจำกัดเวลา เพื่อตอบคำถามเฉพาะ), throwaway (ทิ้งหลังเรียนรู้) เทียบกับ evolutionary (พัฒนาต่อเป็นระบบจริง)","Risk-driven: เริ่มจากสมมติฐานที่เสี่ยงและมีผลมากที่สุดต่อการออกแบบ ไม่ใช่ส่วนที่ทำง่าย กำหนดคำถามและ success criteria ที่วัดได้ก่อนเริ่ม และจำกัดเวลา (timebox)","Spike ควรจบด้วยข้อสรุป (ทำได้/ไม่ได้ ข้อมูลที่วัดได้) ไม่ใช่โค้ดที่เอาไป production ต่อโดยอัตโนมัติ","Simulation และ load testing: ใช้เครื่องมืออย่าง k6, JMeter, Locust สร้างโหลดเพื่อวัด latency และ throughput ใช้ข้อมูลและรูปแบบการใช้งานที่ใกล้ของจริง และวัดที่ percentile (p95/p99) ไม่ใช่ค่าเฉลี่ยอย่างเดียว","Little's Law: L = λ × W (จำนวนงานที่อยู่ในระบบพร้อมกัน = อัตราคำขอที่เข้ามา x เวลาเฉลี่ยที่แต่ละคำขออยู่ในระบบ) เช่น 200 req/s ที่ใช้เวลา 0.5 วินาที ต้องรองรับประมาณ 100 คำขอพร้อมกัน ใช้ประมาณขนาด thread pool, connection pool, จำนวน instance","Prototype ระบบ offline-first/sync: ต้องทดลองกรณี conflict (แก้ข้อมูลเดียวกันทั้งออฟไลน์และออนไลน์), กลยุทธ์ resolution (last-write-wins, merge ระดับ field, CRDT, ให้ผู้ใช้เลือก), คิวการเขียนที่เก็บในเครื่อง, retry เมื่อกลับมาออนไลน์ และการ sync แบบ incremental ด้วย token/version","การจำลองความล้มเหลว (chaos/fault injection) เช่น ตัดเครือข่าย ทำให้ dependency ช้า เพื่อดูว่าระบบตามที่ออกแบบทนได้จริง","การขออนุมัติ: นำเสนอผลที่วัดได้ (เทียบกับ NFR), สิ่งที่ยังไม่รู้ ความเสี่ยงที่เหลือ และทางเลือก ไม่ใช่แค่ demo ที่สวย","ระบุขอบเขตของ prototype ให้ชัด (ส่วนที่จำลอง/ปลอม) เพื่อไม่ให้ stakeholder เข้าใจผิดว่าเป็นระบบจริงพร้อมใช้"],"examFocus":["ถ้าทีมไม่แน่ใจเทคโนโลยีหรือ integration ที่เสี่ยงสูง ให้ทำ spike/PoC เฉพาะจุดนั้นก่อนตัดสินใจออกแบบทั้งระบบ","ถ้าต้องประมาณจำนวนการเชื่อมต่อพร้อมกันจากอัตรา request และ latency ให้ใช้ Little's Law","ถ้าต้องพิสูจน์ว่าการ sync ออฟไลน์ใช้ได้ ให้ prototype กรณี conflict และการเชื่อมต่อขาดหาย ไม่ใช่เฉพาะ happy path","ถ้าผู้มีส่วนได้ส่วนเสียต้องการเห็นหน้าตาก่อนลงทุน ให้ใช้ clickable prototype แล้วเก็บ feedback","ถ้าโจทย์ถามว่าผล load test ควรรายงานอย่างไร ให้ใช้ percentile และเงื่อนไขการทดสอบ ไม่ใช่ค่าเฉลี่ยเดียว"],"pitfalls":["เอา prototype ที่เขียนเร็วไปใช้เป็น production โดยไม่ปรับปรุงคุณภาพ","ทดสอบเฉพาะส่วนที่ง่ายและเลี่ยงความเสี่ยงหลัก","รายงานเฉพาะ latency เฉลี่ย ซึ่งซ่อนหางยาวของ p99","ใช้ข้อมูลทดสอบที่เล็กและสะอาดเกินไป ผลจึงไม่สะท้อนของจริง"]},{"descriptor":"SD-S5","competency":"System Design","title":"เขียน Specification ละเอียดและปรับปรุงตาม Feedback","summary":"แปลง functional spec และความคาดหวังด้านประสิทธิภาพเป็นข้อกำหนดที่ชัด วัดได้ ตรวจสอบได้ และปรับปรุงอย่างมีระเบียบเมื่อได้รับ feedback","keyPoints":["Non-functional requirement (NFR) ต้องวัดได้: ระบุตัวชี้วัด ค่าเป้าหมาย และเงื่อนไข เช่น p95 latency ของ endpoint นี้ต่ำกว่าค่าที่กำหนดที่โหลดกี่ request ต่อวินาที, availability รายเดือน, RPO/RTO คำว่า เร็ว หรือ ปลอดภัย โดด ๆ ไม่ใช่ spec","Spec ที่ละเอียดควรมี: วัตถุประสงค์และขอบเขต (รวมสิ่งที่ไม่ทำ), use case/user story, functional requirements, API contract (request/response/error), data model, state และ transition, error handling, NFR, ข้อสมมติและข้อจำกัด, acceptance criteria","Acceptance criteria ที่ทดสอบได้ เช่นรูปแบบ Given-When-Then และครอบคลุมทั้ง happy path กับ edge case","Traceability: ผูกแต่ละ requirement เข้ากับส่วนออกแบบและเทสต์ เพื่อให้ตรวจได้ว่าครบและรู้ผลกระทบเมื่อมีการเปลี่ยนแปลง","การปรับปรุงตาม feedback: รวบรวมและจัดลำดับความสำคัญ วิเคราะห์ผลกระทบต่อส่วนอื่น (ออกแบบ, เทสต์, ตารางเวลา), อัปเดต spec และ acceptance criteria, บันทึก change log/เวอร์ชัน และยืนยันกับผู้เกี่ยวข้องอีกครั้ง","ใช้ข้อมูลจาก prototype หรือ load test มาปรับ NFR และการออกแบบ ไม่ใช่ปรับเพื่อให้ผลผ่านโดยลดเกณฑ์","Edge case ของกระบวนการอย่างการคืนเงิน (refund) ที่ spec ควรระบุ: คืนบางส่วน, คืนซ้ำ (idempotency), ช่วงเวลาที่คืนได้, สถานะของออเดอร์ที่อนุญาต, ช่องทางที่คืน, ความล้มเหลวของระบบชำระเงินกลางทาง, audit trail และการแจ้งผู้ใช้","ระบุกฎธุรกิจที่ชัดและไม่กำกวม ตัดคำคลุมเครือ (เช่น ควร, ประมาณ, เร็ว ๆ นี้) ออกหรือกำหนดค่า","เก็บ spec ใน version control ผ่าน review เหมือนโค้ด และให้เป็น single source ที่ทีมอ้างอิง"],"examFocus":["ถ้า NFR เขียนว่า ระบบต้องเร็ว ให้เปลี่ยนเป็นตัวชี้วัดที่วัดได้พร้อมเงื่อนไขโหลดและ percentile","ถ้า feedback ชี้ว่า spec ขาดกรณีผิดปกติ ให้เพิ่ม edge case และ acceptance criteria แล้วบันทึกการเปลี่ยนแปลง","ถ้ามีการเปลี่ยน requirement กลางทาง ให้ทำ impact analysis และอัปเดตเอกสารทุกส่วนที่เกี่ยวข้อง ไม่แก้เฉพาะโค้ด","ถ้าต้องระบุกระบวนการเงิน (คืนเงิน/ยกเลิก) ให้ใส่ idempotency, สถานะที่อนุญาต, ข้อจำกัดเวลาและ audit","ถ้าโจทย์ถามคุณสมบัติของ spec ที่ดี ให้ตอบ: ชัดเจน วัดได้ ตรวจสอบย้อนกลับได้ ครบถ้วน และสอดคล้องกัน"],"pitfalls":["เขียน NFR แบบคลุมเครือที่ทดสอบไม่ได้","แก้ spec ตาม feedback โดยไม่บันทึกประวัติและไม่ประเมินผลกระทบ","ระบุเฉพาะ happy path ของกระบวนการเงิน","ปล่อยให้ spec กับโค้ดเพี้ยนกันเพราะแก้ที่เดียว"]},{"descriptor":"DB-S1","competency":"Database Design","title":"ออกแบบและ Normalize ฐานข้อมูลเชิงสัมพันธ์","summary":"ใช้ normalization ลดความซ้ำซ้อนและความผิดปกติในการแก้ไขข้อมูล รู้เมื่อควร denormalize อย่างมีเหตุผล และให้ฐานข้อมูลบังคับความถูกต้องเอง","keyPoints":["Anomaly ที่ normalization แก้: update anomaly (แก้ข้อมูลซ้ำไม่ครบทุกแถว), insert anomaly, delete anomaly","1NF: ค่าใน column เป็น atomic ไม่มี repeating group หรือรายการคั่นจุลภาคใน column เดียว และมี primary key","2NF: อยู่ใน 1NF และ non-key attribute ต้องไม่ขึ้นกับเพียงบางส่วนของ composite key (partial dependency)","3NF: อยู่ใน 2NF และไม่มี transitive dependency คือ non-key attribute ต้องขึ้นกับ key เท่านั้น ไม่ขึ้นกับ non-key attribute อื่น (เช่น `orders` เก็บทั้ง `zip` และ `city` ที่ city ขึ้นกับ zip ควรแยกตาราง)","BCNF เข้มกว่า 3NF เล็กน้อย: ทุก determinant ต้องเป็น candidate key","ขั้นตอน decompose: ระบุ functional dependency, แยกตารางตามกลุ่มที่ขึ้นกับ key เดียวกัน, เชื่อมกลับด้วย foreign key และตรวจว่า join กลับแล้วไม่สูญเสียข้อมูล","Denormalization ที่มีเหตุผล: ทำเมื่อวัดแล้วว่าการ join/คำนวณเป็นคอขวดอ่าน เช่น เก็บยอดรวมหรือสำเนาค่า (snapshot ราคาตอนซื้อ) โดยต้องมีกลไกรักษาความสอดคล้อง (trigger, application logic, materialized view) และยอมรับต้นทุนการเขียนที่เพิ่ม ข้อมูลประวัติอย่างราคาในออเดอร์เป็นการเก็บ snapshot ที่ถูกต้องเชิงธุรกิจ ไม่ใช่ความซ้ำซ้อนผิดหลัก","Attribute เฉพาะหมวดสินค้า: ตัวเลือกคือ EAV (ยืดหยุ่นแต่ query และ constraint ยาก), table-per-type/class table inheritance (type-safe แต่ตารางเยอะ), single table + nullable columns (ง่ายแต่ NULL เยอะ) หรือ JSON/JSONB column สำหรับส่วนที่เปลี่ยนบ่อย แล้วเก็บ attribute ร่วมเป็น column จริง","โมเดล hierarchy ของหมวดหมู่: adjacency list (`parent_id`, ง่ายและใช้ `WITH RECURSIVE` ดึงทั้งต้นไม้), materialized path, nested set (อ่าน subtree เร็วแต่แก้ยาก), closure table (ตารางเก็บคู่ ancestor-descendant ค้นหาเร็วแต่ใช้พื้นที่เพิ่ม)","ให้ฐานข้อมูลบังคับความถูกต้อง: PK, FK (พร้อมกำหนด `ON DELETE`), UNIQUE, NOT NULL, CHECK, ชนิดข้อมูลเหมาะสม เพราะ validation ในแอปอย่างเดียวถูกข้ามได้จาก service อื่น งานแบตช์ หรือบั๊ก"],"examFocus":["ถ้าตารางมี column ที่ขึ้นกับ column ที่ไม่ใช่ key (เช่น เมืองขึ้นกับรหัสไปรษณีย์) ให้แยกตารางเพื่อให้ถึง 3NF","ถ้าโจทย์ให้ denormalize เพื่อความเร็ว ให้ตรวจว่ามีการวัดคอขวดและมีกลไกรักษาความสอดคล้อง","ถ้าสินค้าแต่ละหมวดมี attribute ต่างกันมากและต้องค้นหา ให้ชั่ง EAV, table-per-type, JSONB พร้อมดัชนี","ถ้าต้องเก็บหมวดหมู่แบบซ้อนหลายระดับ ให้เลือก adjacency list + recursive CTE หรือ closure table ตามรูปแบบการ query","ถ้าแอปหลายตัวเขียนตารางเดียวกัน ให้ใส่ constraint ในฐานข้อมูล ไม่พึ่งแอปอย่างเดียว"],"pitfalls":["Denormalize ก่อนวัดปัญหาจริง แล้วต้องดูแลข้อมูลซ้ำให้ตรงกัน","ใช้ EAV กับทุกอย่าง ทำให้ query ซับซ้อนและบังคับ constraint ไม่ได้","ยึดกฎ normalization แบบเคร่งจนลืมว่าข้อมูล snapshot เชิงธุรกิจควรเก็บซ้ำ","ไม่ใส่ FK เพราะกลัวช้า ทำให้เกิดข้อมูลกำพร้า (orphan) ที่ยากแก้ภายหลัง"],"example":{"lang":"sql","code":"-- hierarchy แบบ adjacency list + recursive CTE\nCREATE TABLE categories (\n  id BIGINT PRIMARY KEY,\n  parent_id BIGINT REFERENCES categories(id),\n  name VARCHAR(100) NOT NULL\n);\n\nWITH RECURSIVE tree AS (\n  SELECT id, parent_id, name FROM categories WHERE id = 1\n  UNION ALL\n  SELECT c.id, c.parent_id, c.name\n  FROM categories c JOIN tree t ON c.parent_id = t.id\n)\nSELECT * FROM tree;"}},{"descriptor":"DB-S2","competency":"Database Design","title":"ผสานฐานข้อมูลหลายเทคโนโลยี (SQL และ NoSQL)","summary":"Polyglot persistence ใช้ฐานข้อมูลหลายชนิดให้เหมาะกับงาน แต่ต้องกำหนด source of truth ให้ชัดและจัดการการ sync ระหว่างที่เก็บข้อมูลอย่างระมัดระวัง","keyPoints":["Polyglot persistence: relational สำหรับข้อมูลธุรกรรมที่ต้อง ACID, document สำหรับข้อมูลยืดหยุ่น, key-value/cache สำหรับความเร็ว, search engine สำหรับค้นหาข้อความ, graph/time-series ตามลักษณะงาน เลือกตาม access pattern","ระบุ source of truth ของข้อมูลแต่ละชนิดให้ชัด ที่เก็บอื่น (cache, search index, read model) เป็น derived data ที่ต้องสร้างใหม่ได้จาก source of truth","Dual-write problem: แอปเขียน SQL แล้วเขียน Elasticsearch/cache ต่อเอง ทั้งสองขั้นไม่ atomic ถ้าขั้นที่สองล้มข้อมูลจะไม่ตรงกัน และเมื่อมีการเขียนพร้อมกันลำดับอาจสลับ","วิธี sync ที่ดีกว่า: Transactional Outbox, Change Data Capture (CDC เช่น Debezium อ่านจาก transaction log) แล้วส่งผ่าน queue/stream ไปปรับปรุง index ซึ่งให้ eventual consistency","ต้องมีวิธี reindex/backfill ทั้งชุดจาก source of truth และตรวจสอบความต่างเป็นระยะ (reconciliation)","ไม่มี ACID transaction ครอบหลายที่เก็บข้อมูล ต้องออกแบบรองรับ eventual consistency, idempotent update และ retry","ยอมรับความล่าช้า: ผู้ใช้เพิ่มสินค้าแล้วค้นหาอาจยังไม่เจอชั่วคราว ออกแบบ UX และ SLA ให้สอดคล้อง","JSON column (PostgreSQL JSONB, MySQL JSON) เหมาะกับส่วนที่ยืดหยุ่นภายในฐาน relational เดิม ได้ transaction เดียวกัน, สร้างดัชนีได้ (เช่น GIN บน JSONB) และ join กับตารางอื่นได้ จึงมักเป็นตัวเลือกก่อนเพิ่มฐานข้อมูลใหม่","แยกไป document store เมื่อโครงสร้างเปลี่ยนมาก โหลดอ่านเขียนต่างจากส่วนอื่นมาก หรือต้อง scale แยก แลกกับภาระด้าน operation, ความสอดคล้องข้ามระบบ และทักษะของทีม","ทุกเทคโนโลยีเพิ่มต้นทุนด้าน backup, monitoring, security, การอัปเกรด และความรู้ของทีม ควรเพิ่มเมื่อมีเหตุผลที่ชัด"],"examFocus":["ถ้าโจทย์ถามว่าข้อมูลไหนเป็น source of truth ระหว่าง SQL กับ search index ให้ตอบว่า SQL ส่วน index เป็น derived","ถ้าแอปเขียนสองที่แล้วข้อมูลไม่ตรงกัน ให้เสนอ outbox หรือ CDC แทน dual-write","ถ้าต้องค้นหาข้อความแบบ full-text/fuzzy จากข้อมูลใน SQL ให้ใช้ search engine ที่ sync จาก SQL","ถ้าต้องเก็บ attribute ยืดหยุ่นแต่ยังต้อง transaction เดียวกับตารางอื่น ให้พิจารณา JSONB ก่อนแยกระบบ","ถ้าโจทย์ถามผลกระทบของการเพิ่มฐานข้อมูลอีกชนิด ให้ตอบเรื่องต้นทุน operation และความสอดคล้องข้อมูล"],"pitfalls":["ถือว่า search index หรือ cache เป็น source of truth","คิดว่า dual-write ที่เขียนสองที่ต่อกันถือว่าปลอดภัยเพราะ catch error แล้ว","เพิ่มฐานข้อมูลชนิดใหม่เพียงเพราะกระแส ทั้งที่ JSONB หรือ index เพิ่มก็พอ","ไม่เตรียมกลไก rebuild index เมื่อข้อมูลไม่ตรง"]},{"descriptor":"DB-S3","competency":"Database Design","title":"ปรับแต่งประสิทธิภาพ: Query Plan, Index, Connection Pool","summary":"วินิจฉัยความช้าจากแผนการรัน query แล้วแก้ที่ต้นเหตุ ด้วยการเขียน predicate ที่ใช้ index ได้ ออกแบบ index ที่เหมาะสม และตั้ง connection pool ให้สมดุล","keyPoints":["อ่านแผนด้วย `EXPLAIN` (แผนโดยประมาณ) และ `EXPLAIN ANALYZE` (รันจริงแล้วแสดงเวลาและจำนวนแถวจริง ระวังว่า statement จะถูก execute จริงรวมถึง INSERT/UPDATE/DELETE ควรห่อใน transaction แล้ว rollback)","สิ่งที่ดูในแผน: ชนิดการสแกน (Seq Scan เทียบกับ Index Scan/Index Only Scan), ชนิด join (nested loop, hash, merge), ต้นทุน และเทียบ estimated rows กับ actual rows","ถ้า estimated rows ต่างจาก actual มาก แปลว่าสถิติของตารางไม่ทันสมัยหรือไม่เพียงพอ ทำให้ planner เลือกแผนผิด แก้ด้วย `ANALYZE` (PostgreSQL) หรือ `ANALYZE TABLE` (MySQL) และตรวจ correlation ระหว่าง column","Sargable predicate: อย่าใส่ฟังก์ชันหรือการคำนวณบน column ที่ใช้กรอง เช่น `WHERE DATE(created_at) = '2025-01-01'` ใช้ index ไม่ได้ ให้เขียนเป็นช่วง `created_at >= '2025-01-01' AND created_at < '2025-01-02'`; `LIKE '%abc'` (wildcard นำหน้า) ใช้ B-tree ไม่ได้","Composite index ใช้ตามหลัก leftmost prefix: ลำดับ column สำคัญ ปกติวาง column ที่กรองแบบเท่ากับ (=) ก่อน ตามด้วย range หรือ column ที่ใช้ ORDER BY; ออกแบบให้ครอบคลุม query หลักหลายแบบด้วยจำนวน index น้อยที่สุด","Covering index: index มี column ทั้งหมดที่ query ต้องการ (เช่น `INCLUDE` ใน PostgreSQL/SQL Server) จึงอ่านจาก index ได้โดยไม่ไปที่ตาราง Index ไม่ฟรี: ทำให้ INSERT/UPDATE/DELETE ช้าลง ใช้พื้นที่ ควรลบ index ที่ไม่ได้ใช้ และไม่ควรสร้างบน column ที่เลือกแยกแยะได้น้อย (low cardinality) โดยไม่มีเหตุผล","N+1 query: ดึงรายการ 1 query แล้ววนดึงข้อมูลที่เกี่ยวข้องทีละแถว (N query) ใน ORM แก้ด้วย eager loading/join fetch หรือ batch ด้วย `WHERE id IN (...)`","Pagination: `OFFSET` ช้าลงเมื่อหน้าลึกเพราะต้องข้ามแถวที่ผ่านมา ใช้ keyset (seek) pagination เช่น `WHERE (created_at, id) < (:last_created_at, :last_id) ORDER BY created_at DESC, id DESC LIMIT 20` ซึ่งต้องมีคอลัมน์ที่ไม่ซ้ำ (id) เป็น tie-breaker และมี index รองรับ","Connection pool: การสร้าง connection แพง จึง reuse ผ่าน pool ขนาดใหญ่เกินไปไม่ได้ทำให้เร็วขึ้น แต่ทำให้ DB แย่งทรัพยากร (CPU, memory, context switch) เริ่มจากขนาดเล็กแล้ววัด เช่น สูตรเริ่มต้นของ HikariCP คือ (core_count x 2) + effective_spindle_count","ผลรวมของ pool ทุก instance ของแอปต้องไม่เกิน `max_connections` ของ DB (PostgreSQL มี connection แบบ process ต่อ connection จึงมักใช้ PgBouncer ช่วย); ตั้ง connection timeout, max lifetime, idle timeout และมอนิเตอร์ pool exhaustion ตรวจ slow query จาก log/slow query log หรือ `pg_stat_statements` เพื่อหา query ที่คุ้มที่จะปรับก่อน"],"examFocus":["ถ้า query กรองด้วยฟังก์ชันบน column วันที่ แล้วทำ full scan ให้เขียนใหม่เป็น range predicate","ถ้าแผนแสดง estimated rows ต่างจาก actual rows มาก ให้อัปเดตสถิติด้วย ANALYZE","ถ้ามี query หลายแบบบนตารางเดียว ให้ออกแบบชุด composite index โดยพิจารณาลำดับ column และ leftmost prefix","ถ้าหน้ารายการ ORM ช้าและ query count เพิ่มตามจำนวนแถว ให้ตรวจ N+1 แล้วใช้ eager load","ถ้า feed เลื่อนลึกแล้วช้า ให้ใช้ keyset pagination แทน OFFSET","ถ้า DB รับ connection ไม่ไหวเมื่อ scale แอปหลาย instance ให้ลดขนาด pool ต่อ instance หรือใช้ pooler"],"pitfalls":["เพิ่ม connection pool ให้ใหญ่ขึ้นเพื่อแก้ความช้า ซึ่งมักทำให้แย่ลง","สร้าง index ทุก column แล้วทำให้การเขียนช้า","ใช้ EXPLAIN ANALYZE กับคำสั่งเขียนบน production โดยไม่ระวัง เพราะคำสั่งถูกรันจริง","keyset pagination ที่เรียงด้วย column ที่มีค่าซ้ำได้ (เช่น `created_at`) โดยไม่มี tie-breaker ที่ไม่ซ้ำ (เช่น `id`) ทำให้แถวตกหล่นหรือซ้ำ"],"example":{"lang":"sql","code":"-- ไม่ sargable: ใช้ index ของ created_at ไม่ได้\nSELECT * FROM orders WHERE DATE(created_at) = '2025-01-01';\n\n-- sargable\nSELECT * FROM orders\nWHERE created_at >= '2025-01-01' AND created_at < '2025-01-02';\n\n-- keyset pagination\nSELECT id, created_at FROM orders\nWHERE (created_at, id) < ('2025-01-01 10:00:00', 1050)\nORDER BY created_at DESC, id DESC\nLIMIT 20;"}},{"descriptor":"DB-S4","competency":"Database Design","title":"Database Migration และ Versioning","summary":"จัดการการเปลี่ยน schema อย่างมีเวอร์ชัน ทำซ้ำได้ ปลอดภัยต่อข้อมูลและบริการที่กำลังทำงาน รวมถึงกรณีตารางใหญ่และฐานข้อมูลบนอุปกรณ์ผู้ใช้","keyPoints":["Migration tool ที่พบบ่อย: Flyway, Liquibase, Prisma Migrate, Knex, Alembic (Python), Django migrations, Entity Framework Migrations ทำงานโดยบันทึกเวอร์ชันที่รันแล้วในตารางของ schema history เพื่อรันเฉพาะสคริปต์ใหม่ตามลำดับ","หลักการ: migration เป็นสคริปต์ที่มีเวอร์ชัน เก็บใน version control พร้อมโค้ด ห้ามแก้ไฟล์ที่รันไปแล้ว (tool มักตรวจ checksum) ถ้าต้องแก้ให้เพิ่ม migration ใหม่","การรัน migration พร้อมกันจากหลาย instance: ต้องมี lock (tool ส่วนใหญ่ใช้ lock ของฐานข้อมูล หรือ advisory lock) ให้รันทีละตัว ข้อแนะนำคือรัน migration เป็นขั้นตอน deploy แยก (job/init step) ก่อนเปิดแอปเวอร์ชันใหม่ ไม่ปล่อยให้ทุก instance แข่งกันรันตอน start","Zero-downtime: ใช้ expand/contract (parallel change) แบ่งเป็นหลายรอบ deploy: เพิ่ม column/ตารางใหม่ (expand) -> แอปเขียนทั้งเก่าและใหม่/backfill -> สลับไปอ่านของใหม่ -> ลบของเก่า (contract) เพื่อให้แอปเวอร์ชันเก่าและใหม่ทำงานร่วมกับ schema ได้ในช่วงเปลี่ยนผ่าน","ตารางใหญ่: คำสั่ง `ALTER TABLE` บางแบบล็อกตารางหรือ rewrite ทั้งตาราง ต้องรู้พฤติกรรมของ DB และเวอร์ชันนั้น ๆ เช่น PostgreSQL สร้างดัชนีแบบไม่บล็อกการเขียนด้วย `CREATE INDEX CONCURRENTLY`, ใน MySQL ใช้เครื่องมือ online schema change เช่น gh-ost หรือ pt-online-schema-change เมื่อ DDL ปกติล็อกนาน","การ backfill ข้อมูลจำนวนมากให้ทำเป็นชุดเล็ก ๆ (batch) นอก transaction ใหญ่ เพื่อไม่ให้ล็อกนานและไม่ทำให้ replication lag","การเพิ่ม NOT NULL column ให้ปลอดภัย: เพิ่มเป็น nullable ก่อน backfill ค่า แล้วค่อยบังคับ NOT NULL","กลยุทธ์ rollback: เขียน down migration ได้ แต่บางอย่างย้อนไม่ได้จริง (เช่น DROP COLUMN ทำให้ข้อมูลหาย) จึงนิยม roll-forward (แก้ด้วย migration ใหม่) ร่วมกับ backup/ทดสอบบน staging ก่อน, แยกการเปลี่ยนที่ทำลายข้อมูลออกเป็นรอบหลังสุด และทำให้แต่ละ migration เล็กและย้อนกลับง่าย","ฐานข้อมูลบนมือถือ (เช่น SQLite/Room/Core Data): ไม่ควบคุมได้ว่าผู้ใช้อัปเดตแอปจากเวอร์ชันไหน จึงต้องรองรับการ migrate จากทุกเวอร์ชันเก่าไปปัจจุบันเป็นลำดับขั้น เก็บเวอร์ชัน schema (เช่น `PRAGMA user_version` ใน SQLite) และทดสอบเส้นทางอัปเกรดจริง ระวังตัวเลือกแบบ destructive fallback ที่ลบข้อมูลผู้ใช้","ทดสอบ migration กับข้อมูลที่ใกล้ production ก่อนเสมอ และสำรองข้อมูลก่อนรันการเปลี่ยนที่เสี่ยง"],"examFocus":["ถ้าหลาย instance start พร้อมกันแล้ว migration ชนกัน ให้ใช้ lock ของ tool หรือแยก migration เป็น job เดียวก่อน deploy","ถ้าต้องเปลี่ยนชื่อ/ชนิด column โดยไม่ให้ระบบหยุด ให้ใช้ expand/contract หลายรอบ ไม่ rename ตรง ๆ ในรอบเดียว","ถ้าตารางหลายร้อยล้านแถวและ ALTER ล็อกนาน ให้ใช้วิธี online (เช่น CREATE INDEX CONCURRENTLY หรือ gh-ost) และ backfill เป็น batch","ถ้าแอปมือถือที่ผู้ใช้อัปเดตข้ามหลายเวอร์ชัน ให้เขียน migration ต่อเนื่องทุกเวอร์ชันและทดสอบเส้นทางอัปเกรด","ถ้าโจทย์ถามแผนย้อนกลับ ให้ตอบ backup, roll-forward, แยกการเปลี่ยนที่ทำลายข้อมูลไว้ท้ายสุด และทดสอบบน staging"],"pitfalls":["แก้ไฟล์ migration ที่รันไปแล้ว ทำให้ checksum ไม่ตรงและ environment ต่าง ๆ เพี้ยน","ให้ทุก instance รัน migration เองตอน start โดยไม่มี lock","เชื่อว่ามี down script แล้วย้อนกลับได้เสมอ ทั้งที่ข้อมูลที่ถูกลบกู้ไม่ได้","Rename column ตรง ๆ ขณะที่แอปเวอร์ชันเก่ายังทำงานอยู่ ทำให้พัง"],"example":{"lang":"sql","code":"-- expand: เพิ่ม column แบบ nullable\nALTER TABLE users ADD COLUMN full_name VARCHAR(200);\n\n-- backfill เป็นชุดเล็ก ๆ (ทำซ้ำจนครบ)\nUPDATE users SET full_name = first_name || ' ' || last_name\nWHERE id BETWEEN 1 AND 10000 AND full_name IS NULL;\n\n-- ภายหลังเมื่อแอปใช้ column ใหม่ครบแล้ว\nALTER TABLE users ALTER COLUMN full_name SET NOT NULL;\n-- contract: ค่อยลด column เก่าใน release ถัดไป"}}]}}</script>
<script>
/*
 * Scoring for one question. Pure function, no DOM, no Node-only APIs.
 * Loaded as a classic script in the browser (exposes window.ExamScoring)
 * and via require() from Node tests (module.exports).
 *
 * Rules (see the scoring table in the project context):
 *  - nothing selected                      -> 0
 *  - more options selected than correct    -> negative ? -penalty : 0
 *    (this overrides any partial credit)
 *  - otherwise                             -> right * max / k
 *                                             minus (negative only) wrong * penalty / k
 *    where k is the number of correct options.
 */
(function (root) {
  'use strict';

  function unique(list) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var key = String(list[i]);
      if (!seen[key]) {
        seen[key] = true;
        out.push(key);
      }
    }
    return out;
  }

  function clean(n) {
    // remove float noise and negative zero
    return Math.round(n * 1e6) / 1e6 + 0;
  }

  function scoreQuestion(question, selectedOptionIds, options) {
    var opts = options || {};
    var negative = Boolean(opts.negative);
    var max = opts.max === undefined ? 5 : opts.max;
    var penalty = opts.penalty === undefined ? 1 : opts.penalty;

    var correctIds = [];
    for (var i = 0; i < question.options.length; i++) {
      if (question.options[i].correct) correctIds.push(String(question.options[i].id));
    }
    var k = correctIds.length;
    if (k === 0) throw new Error('question ' + question.id + ' has no correct option');

    var selected = unique(selectedOptionIds || []);
    if (selected.length === 0) return 0;

    if (selected.length > k) return clean(negative ? -penalty : 0);

    var right = 0;
    for (var j = 0; j < selected.length; j++) {
      if (correctIds.indexOf(selected[j]) !== -1) right++;
    }
    var wrong = selected.length - right;

    var score = (right * max) / k;
    if (negative) score -= (wrong * penalty) / k;
    return clean(score);
  }

  var api = { scoreQuestion: scoreQuestion };
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.ExamScoring = api;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/*
 * Exam practice page. Classic script, inlined by build.mjs after scoring.js.
 * All text from question data is written with textContent / text nodes only.
 * No persistence, no network.
 */
(function () {
  'use strict';

  var Scoring = window.ExamScoring;
  var DATA = JSON.parse(document.getElementById('exam-data').textContent);
  var root = document.getElementById('app');

  var MAX = DATA.scorePerQuestion;
  var LEVEL_LABEL = { junior: 'Junior', senior: 'Senior' };
  var MODE_LABEL = { practice: 'โหมดซ้อม', exam: 'โหมดสอบจริง' };
  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  var state = {
    screen: 'start', // start | quiz | result
    setup: { level: 'junior', mode: 'practice', negative: false, minutes: '', minutesTouched: false },
    run: null,
  };
  var openDialog = null;

  // ------------------------------------------------------------ helpers

  function appendKids(node, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) {
      kid.forEach(function (k) { appendKids(node, k); });
    } else if (typeof kid === 'string' || typeof kid === 'number') {
      node.appendChild(document.createTextNode(String(kid)));
    } else {
      node.appendChild(kid);
    }
  }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'text') node.textContent = v;
        else if (k === 'class') node.className = v;
        else if (k === 'checked' || k === 'value') node[k] = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) appendKids(node, arguments[i]);
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function randInt(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      window.crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function fmt(n) {
    var r = Math.round(n * 100) / 100;
    return String(r === 0 ? 0 : r);
  }

  function fmtTime(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    var mm = (m < 10 ? '0' : '') + m;
    var ss = (s < 10 ? '0' : '') + s;
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function poolFor(mode) {
    return mode === 'exam' ? 'exam' : 'practice';
  }

  function poolSize(level, mode) {
    var lv = DATA.levels[level];
    return lv && lv[poolFor(mode)] ? lv[poolFor(mode)].length : 0;
  }

  function defaultMinutes(level) {
    return Math.max(1, Math.ceil((poolSize(level, 'exam') * DATA.secondsPerQuestion) / 60));
  }

  function pointsOf(run, item) {
    if (run.mode === 'practice' && !item.confirmed) return 0;
    return Scoring.scoreQuestion(item.q, item.selected, { negative: run.negative, max: MAX });
  }

  function isAnswered(run, item) {
    return run.mode === 'practice' ? item.confirmed : item.selected.length > 0;
  }

  // ------------------------------------------------------------ dialog

  function closeOpenDialog() {
    if (openDialog) openDialog.cancel();
  }

  function askConfirm(opts) {
    return new Promise(function (resolve) {
      closeOpenDialog();
      var previous = document.activeElement;
      var dlg = el('dialog', { class: 'dlg', 'aria-labelledby': 'dlg-title' });
      var settled = false;

      function done(value) {
        if (settled) return;
        settled = true;
        openDialog = null;
        try { dlg.close(); } catch (e) { /* not open */ }
        if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
        if (previous && previous.focus && document.contains(previous)) previous.focus();
        resolve(value);
      }

      var cancelBtn = el('button', { type: 'button', class: 'btn', text: opts.cancel || 'ยกเลิก', onclick: function () { done(false); } });
      var okBtn = el('button', { type: 'button', class: 'btn primary', text: opts.ok || 'ตกลง', onclick: function () { done(true); } });

    function fill() {

      status.textContent = q ? 'พบ ' + shown.length + ' จาก ' + topics.length + ' หัวข้อ' : 'ทั้งหมด ' + topics.length + ' หัวข้อ';

    function onReviewLevel(e) { s.level = e.target.value; reviewUI.openId = null; fill(); }

      return el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: goStart });

    var head = el('div', { class: 'rv-head' },
      el('div', { class: 'row' }, backBtn()),
      heading,

        el('div', { class: 'rv-levels' },
          choice('review-level', 'junior', 'Junior', reviewTopics('junior').length + ' หัวข้อ', s.level === 'junior', false, onReviewLevel),
          choice('review-level', 'senior', 'Senior', reviewTopics('senior').length + ' หัวข้อ', s.level === 'senior', false, onReviewLevel))),
      el('div', { class: 'field' },

  // ---- focus mode: one card at a time

  var FC_LABEL = { sum: 'สรุป', key: 'ประเด็น', ex: 'ถ้าโจทย์ถาม', pit: 'กับดัก' };
  var focusKeysOn = false;

  function buildDeck(level, topics) {
    var deck = [];
    topics.forEach(function (t) {
      var cs = [];
      if (t.summary) cs.push({ type: 'sum', text: t.summary, i: 0 });
      t.keyPoints.forEach(function (x, i) { cs.push({ type: 'key', text: x, i: i }); });
      t.examFocus.forEach(function (x, i) { cs.push({ type: 'ex', text: x, i: i, qa: splitQA(x) }); });
      t.pitfalls.forEach(function (x, i) { cs.push({ type: 'pit', text: x, i: i }); });
      cs.forEach(function (c) { c.t = t; c.level = level; });
      deck = deck.concat(cs);
    });
    return numberDeck(deck);
  }

  // pos / count = position of a card among the cards of the same topic that are in this deck
  function numberDeck(deck) {
    var counts = {};
    var seen = {};
    deck.forEach(function (c) { counts[c.t.domId] = (counts[c.t.domId] || 0) + 1; });
    deck.forEach(function (c) {
      seen[c.t.domId] = (seen[c.t.domId] || 0) + 1;
      c.pos = seen[c.t.domId];
      c.count = counts[c.t.domId];
    });
    return deck;
  }

  function startFocus(level, topics, startId) {
    var deck = buildDeck(level, topics);
    if (!deck.length) return;
    var idx = 0;
    for (var i = 0; i < deck.length; i++) {
      if (deck[i].t.domId === startId) { idx = i; break; }
    }
    state.focus = { level: level, base: deck, deck: deck, index: idx, revealed: false, weak: false, api: null };
    state.screen = 'focus';
    render();
  }

  function leaveFocus() {
    var f = state.focus;
    var c = f && (f.deck[f.index] || f.deck[f.deck.length - 1]);
    reviewUI.scrollTo = c ? c.t.domId : null;
    state.focus = null;
    state.screen = 'review';
    render();
  }

  function onFocusKey(e) {
    var f = state.focus;
    if (state.screen !== 'focus' || !f || !f.api) return;
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target;
    var tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); f.api.next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); f.api.prev(); }
    else if (e.key === 'Escape') { e.preventDefault(); leaveFocus(); }
    else if (e.key === ' ' || e.key === 'Spacebar') {
      if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return; // native activation wins
      if (f.api.canReveal()) { e.preventDefault(); f.api.reveal(); }
    }
  }

  function syncFocusKeys() {
    var want = state.screen === 'focus';
    if (want && !focusKeysOn) {
      document.addEventListener('keydown', onFocusKey);
      focusKeysOn = true;
    } else if (!want && focusKeysOn) {
      document.removeEventListener('keydown', onFocusKey);
      focusKeysOn = false;
    }
  }

  function renderFocus() {
    var f = state.focus;
    var live = el('div', { class: 'sr-only', 'aria-live': 'polite', 'aria-atomic': 'true' });
    var badge = el('span', { class: 'rv-badge' });
    var title = el('h1', { class: 'fc-title' });
    var pos = el('p', { class: 'fc-pos muted small' });
    var barFill = el('span');
    var bar = el('div', { class: 'bar', role: 'progressbar', 'aria-label': 'ความคืบหน้าโหมดโฟกัส', 'aria-valuemin': '0' }, barFill);
    var barText = el('p', { class: 'fc-prog-text muted small' });
    var card = el('div', { class: 'fc-card', tabindex: '-1' });
    var prevBtn = el('button', { type: 'button', class: 'btn fc-big', text: '← ก่อนหน้า', onclick: function () { prev(); } });
    var nextBtn = el('button', { type: 'button', class: 'btn primary fc-big', onclick: function () { next(); } });

    function current() { return f.deck[f.index] || null; }
    function go(i) {
      f.index = Math.max(0, Math.min(f.deck.length, i));
      f.revealed = false;
      update(true, '');
    }
    function next() { if (f.index < f.deck.length) go(f.index + 1); }
    function prev() { if (f.index > 0) go(f.index - 1); }
    function canReveal() { var c = current(); return !!(c && c.qa && !f.revealed); }
    function reveal() {
      if (!canReveal()) return;
      f.revealed = true;
      update(true, 'คำตอบ: ' + current().qa.answer);
    }
    function mark(c, v) {
      storeSet(markKey(c.level, c.t.id, c.i), v);
      next();
    }
    function markOf(c) { return storeGet(markKey(c.level, c.t.id, c.i)); }
    function weakCards() {
      return f.base.filter(function (c) { return c.type === 'ex' && c.qa && markOf(c) === 'weak'; });
    }
    function startWeak() {
      var weak = weakCards().map(function (c) { return Object.assign({}, c); });
      if (!weak.length) return;
      f.deck = numberDeck(weak);
      f.weak = true;
      f.index = 0;
      f.revealed = false;
      update(true, '');
    }
    function restart() {
      f.deck = f.base;
      f.weak = false;
      f.index = 0;
      f.revealed = false;
      update(true, '');
    }

    function chipRow(c) {
      var row = el('div', { class: 'fc-chiprow' }, el('span', { class: 'fc-chip ' + c.type, text: FC_LABEL[c.type] }));
      if (c.type === 'ex' && c.qa) {
        var m = markOf(c);
        if (m === 'ok' || m === 'weak') row.appendChild(el('span', { class: 'fc-prevmark', text: 'ครั้งก่อน: ' + (m === 'ok' ? 'จำได้' : 'ยังไม่แม่น') }));
      }
      return row;
    }

    function renderEnd() {
      var quiz = f.deck.filter(function (c) { return c.type === 'ex' && c.qa; });
      var ok = quiz.filter(function (c) { return markOf(c) === 'ok'; }).length;
      var weak = quiz.filter(function (c) { return markOf(c) === 'weak'; }).length;
      var weakAll = weakCards().length;
      card.classList.add('t-end');
      card.appendChild(el('div', { class: 'fc-chiprow' }, el('span', { class: 'fc-chip sum', text: 'จบรอบ' })));
      card.appendChild(el('p', { class: 'fc-text', text: f.weak ? 'ทวนข้อที่ยังไม่แม่นครบแล้ว' : 'ดูครบทุกการ์ดแล้ว' }));
      if (quiz.length) {
        card.appendChild(el('p', { class: 'fc-sub muted', text: 'ข้อ “ถ้าโจทย์ถาม” ในรอบนี้ ' + quiz.length + ' ข้อ · จำได้ ' + ok + ' · ยังไม่แม่น ' + weak + ' · ยังไม่ได้ทำเครื่องหมาย ' + (quiz.length - ok - weak) }));
      }
      var actions = el('div', { class: 'fc-actions' });
      if (weakAll > 0) actions.appendChild(el('button', { type: 'button', class: 'btn primary fc-big', text: 'ทวนเฉพาะข้อที่ยังไม่แม่น (' + weakAll + ')', onclick: startWeak }));
      actions.appendChild(el('button', { type: 'button', class: 'btn fc-big', text: 'เริ่มรอบใหม่ทั้งหมด', onclick: restart }));
      actions.appendChild(el('button', { type: 'button', class: 'btn fc-big', text: 'กลับไปอ่านทบทวน', onclick: leaveFocus }));
      card.appendChild(actions);
    }

    function update(moved, extra) {
      var c = current();
      var total = f.deck.length;
      clear(card);
      card.className = 'fc-card';
      void card.offsetWidth; // restart the (reduced-motion aware) entrance animation
      card.classList.add('enter');
      barFill.style.width = (total ? Math.round((Math.min(f.index + 1, total) / total) * 100) : 0) + '%';
      bar.setAttribute('aria-valuemax', String(total));
      bar.setAttribute('aria-valuenow', String(Math.min(f.index + 1, total)));
      prevBtn.disabled = f.index === 0;
      nextBtn.disabled = f.index >= total;
      nextBtn.textContent = f.index >= total - 1 ? 'จบรอบ →' : 'ถัดไป →';
      var said;

      if (!c) {
        badge.hidden = true;
        title.textContent = f.weak ? 'ทวนเฉพาะข้อที่ยังไม่แม่น' : 'โหมดโฟกัส';
        pos.textContent = '';
        barText.textContent = 'ทั้งหมด ' + total + ' / ' + total + ' การ์ด';
        renderEnd();
        said = 'จบรอบแล้ว';
      } else {
        card.classList.add('t-' + c.type);
        badge.hidden = false;
        badge.textContent = c.t.id;
        title.textContent = c.t.title;
        pos.textContent = 'การ์ด ' + c.pos + ' / ' + c.count + ' ของหัวข้อนี้';
        barText.textContent = 'ทั้งหมด ' + (f.index + 1) + ' / ' + total + ' การ์ด' + (f.weak ? ' · ทวนเฉพาะข้อที่ยังไม่แม่น' : '');
        card.appendChild(chipRow(c));
        if (c.type === 'sum') {
          card.appendChild(el('p', { class: 'fc-text' }, inlineNodes(c.text)));
          if (c.t.name) card.appendChild(el('p', { class: 'fc-sub muted', text: c.t.name }));
          said = c.text;
        } else if (c.type === 'key') {
          var sp = splitTerm(c.text, 80);
          card.appendChild(el('p', { class: 'fc-text' }, sp
            ? [el('strong', { class: 'fc-term' }, inlineNodes(sp.term)), inlineNodes(sp.rest)]
            : inlineNodes(c.text)));
          said = c.text;
        } else if (c.type === 'pit') {
          var pp = splitTerm(c.text, 120);
          card.appendChild(el('p', { class: 'fc-text' },
            el('span', { class: 'fc-x', 'aria-hidden': 'true', text: '✗' }),
            pp ? [el('strong', null, inlineNodes(pp.term), ':'), ' ', inlineNodes(pp.rest)] : inlineNodes(c.text)));
          said = c.text;

          card.appendChild(el('p', { class: 'fc-text' }, inlineNodes(c.text)));
          said = c.text;
        } else {
          card.appendChild(el('p', { class: 'fc-text' }, inlineNodes(c.qa.q)));
          said = c.qa.q;
          if (!f.revealed) {

          } else {

            card.appendChild(el('div', { class: 'fc-actions' },
              el('button', { type: 'button', class: 'btn good fc-big', text: 'จำได้', onclick: function () { mark(c, 'ok'); } }),
              el('button', { type: 'button', class: 'btn danger fc-big', text: 'ยังไม่แม่น', onclick: function () { mark(c, 'weak'); } })));

    }

    f.api = { next: next, prev: prev, reveal: reveal, canReveal: canReveal };

    root.appendChild(el('div', { class: 'fc-top' },
      el('button', { type: 'button', class: 'btn', text: '← กลับไปอ่านทบทวน (Esc)', onclick: leaveFocus }),
      el('span', { class: 'fc-keys', text: '← → เลื่อนการ์ด · Space เปิดคำตอบ · Esc ออก' })));
    root.appendChild(el('div', { class: 'fc-head' },
      el('div', { class: 'fc-topic' }, badge, title),

    root.appendChild(el('div', { class: 'fc-stage' }, card));

  // Read-only preview links for screenshots (#review, #review-open, #focus, #focus-ex, #focus-ex-open); any other hash is ignored.
  function previewHook() {
    var h = '';
    try { h = String(window.location.hash || ''); } catch (e) { return; }
    if (!REVIEW || (h.indexOf('#review') !== 0 && h.indexOf('#focus') !== 0)) return;
    var level = state.setup.level;
    var topics = reviewTopics(level);
    if (!topics.length) return;
    if (h === '#review' || h === '#review-open') {
      if (h === '#review-open') reviewUI.openId = topics[0].domId;
      openReview();
    } else if (h === '#focus' || h === '#focus-ex' || h === '#focus-ex-open') {

  }

  // ------------------------------------------------------------ run setup

  function startRun(level, mode, opts) {
    var pool = DATA.levels[level][poolFor(mode)];
    var questions = mode === 'exam' ? shuffle(pool) : pool.slice();
    state.run = {
      level: level,
      mode: mode,
      negative: !!opts.negative,
      minutes: opts.minutes,
      index: 0,
      submitted: false,
      auto: false,
      timer: null,
      endsAt: 0,
      announced: {},
      ui: {},
      items: questions.map(function (q) {
        return { q: q, options: shuffle(q.options), selected: [], confirmed: false, flagged: false };
      }),
    };
    state.screen = 'quiz';
    render();
    if (mode === 'exam') startTimer(state.run);
  }

  // ------------------------------------------------------------ timer

  function startTimer(run) {
    run.endsAt = Date.now() + run.minutes * 60000;
    [300, 60].forEach(function (mark) {
      if (run.minutes * 60 <= mark) run.announced[mark] = true; // do not announce a mark the exam never passes
    });
    tick();
    run.timer = setInterval(tick, 250);
  }

  function stopTimer() {
    if (state.run && state.run.timer) {
      clearInterval(state.run.timer);
      state.run.timer = null;
    }
  }

  function tick() {
    var run = state.run;
    if (!run || run.mode !== 'exam' || run.submitted || state.screen !== 'quiz' || !run.endsAt) return;
    var left = run.endsAt - Date.now();
    if (left <= 0) {
      finishExam(true);
      return;
    }
    if (run.ui.timerEl) {
      run.ui.timerEl.textContent = 'เหลือเวลา ' + fmtTime(left);
      run.ui.timerEl.className = left <= 60000 ? 'timer low' : 'timer';
    }
    if (run.bannerUntil && Date.now() >= run.bannerUntil) hideTimeBanner(run);
    var secs = Math.ceil(left / 1000);
    [300, 60].forEach(function (mark) {
      if (secs <= mark && !run.announced[mark] && run.ui.liveEl) {
        run.announced[mark] = true;
        var msg = 'เหลือเวลาอีก ' + (mark / 60) + ' นาที';
        run.ui.liveEl.textContent = msg; // screen readers
        showTimeBanner(run, msg, mark <= 60); // everyone else, inside the sticky header
      }
    });
  }

  // Non-blocking and hidden from assistive tech (the live region above already announces it).
  function showTimeBanner(run, msg, urgent) {
    var b = run.ui.bannerEl;
    if (!b) return;
    b.textContent = msg;
    b.className = urgent ? 'time-banner urgent' : 'time-banner';
    b.hidden = false;
    run.bannerUntil = Date.now() + 15000;
  }

  function hideTimeBanner(run) {
    run.bannerUntil = 0;
    if (run.ui.bannerEl) run.ui.bannerEl.hidden = true;
  }

  // ------------------------------------------------------------ quiz screen

  function renderQuiz() {
    var run = state.run;
    var ui = run.ui;
    var back = el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onBack });
    var badge = el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] });
    ui.liveEl = el('div', { class: 'sr-only', 'aria-live': 'polite' });
    var right;
    if (run.mode === 'exam') {
      ui.timerEl = el('div', { class: 'timer', role: 'timer' });
      right = ui.timerEl;
    } else {
      ui.scoreEl = el('div', { class: 'score-line', 'aria-live': 'polite' });
      right = ui.scoreEl;
    }
    var topbar = el('div', { class: 'topbar' }, back, badge, right);
    if (run.mode === 'exam') {

      ui.bannerEl = el('div', { class: 'time-banner', 'aria-hidden': 'true', hidden: true });
      root.appendChild(el('div', { class: 'sticky-head' }, topbar, ui.bannerEl));
    } else {
      root.appendChild(topbar);
    }

    ui.card = el('section', { class: 'card', 'aria-label': 'คำถาม' });
    ui.nav = el('div', { class: 'qnav' });
    root.appendChild(ui.card);
    root.appendChild(ui.nav);
    if (run.mode === 'exam') {
      ui.palette = el('section', { class: 'card palette-wrap', 'aria-label': 'แผงเลือกข้อ' });
      root.appendChild(ui.palette);
    }
    renderQuestion('title');
    renderNav();
    renderPalette();
    updateScore();
  }

  function onBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam' ? 'การสอบที่กำลังทำอยู่จะถูกยกเลิกและคำตอบทั้งหมดจะหายไป' : 'ความคืบหน้าของการซ้อมนี้จะหายไป'],
      ok: 'กลับหน้าแรก',
      cancel: 'ทำต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'quiz') goStart(); });
  }

  function updateScore() {
    var run = state.run;
    if (!run.ui.scoreEl) return;
    var done = run.items.filter(function (i) { return i.confirmed; });
    var sum = 0;
    done.forEach(function (i) { sum += pointsOf(run, i); });
    run.ui.scoreEl.textContent = 'คะแนนสะสม ' + fmt(sum) + ' / ' + fmt(done.length * MAX) + ' (ตอบแล้ว ' + done.length + ' จาก ' + run.items.length + ' ข้อ)';
  }

  function codeBlock(q) {
    var codeEl = el('code', { text: q.code });
    if (q.codeLang) codeEl.setAttribute('data-lang', q.codeLang);
    return el('pre', { class: 'code', tabindex: '0', role: 'group', 'aria-label': 'โค้ดตัวอย่าง' + (q.codeLang ? ' (' + q.codeLang + ')' : '') }, codeEl);
  }

  function interactiveOptions(item, number) {
    var run = state.run;
    var multi = item.q.type === 'multiple';
    var set = el('fieldset', { class: 'options' },
      el('legend', { class: 'sr-only', text: 'ตัวเลือกของข้อ ' + number + (multi ? ' (เลือกได้หลายข้อ)' : '') }));
    item.options.forEach(function (opt, i) {
      var input = el('input', {
        type: multi ? 'checkbox' : 'radio',
        name: 'opt-' + run.index,
        value: opt.id,
        checked: item.selected.indexOf(opt.id) !== -1,
        onchange: function () { onSelect(item, opt.id, input.checked); },
      });
      set.appendChild(el('label', { class: 'opt' },
        input,
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('span', { class: 'opt-body' }, el('span', { class: 'opt-text', text: opt.text }))));
    });
    return set;
  }

  function onSelect(item, id, checked) {
    if (item.q.type === 'multiple') {
      var at = item.selected.indexOf(id);
      if (checked && at === -1) item.selected.push(id);
      if (!checked && at !== -1) item.selected.splice(at, 1);
    } else {
      item.selected = checked ? [id] : [];
    }
    renderNav();
    renderPalette();
    syncLeaveGuard();
  }

  function staticOptions(item) {
    var wrap = el('div', { class: 'options' });
    item.options.forEach(function (opt, i) {
      var isSel = item.selected.indexOf(opt.id) !== -1;
      var cls = 'opt' + (opt.correct ? ' is-correct' : (isSel ? ' is-wrong' : ''));
      wrap.appendChild(el('div', { class: cls },
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('div', { class: 'opt-body' },
          el('div', { class: 'opt-text', text: opt.text }),
          el('div', { class: 'tags' },
            el('span', { class: 'tag ' + (opt.correct ? 'ok' : 'bad'), text: opt.correct ? '✓ ถูก' : '✗ ผิด' }),
            isSel ? el('span', { class: 'tag sel', text: 'คุณเลือกข้อนี้' }) : null),
          el('p', { class: 'why' }, el('strong', { text: 'เหตุผล: ' }), opt.why))));
    });
    return wrap;
  }

  function pointsLine(points, answered) {
    var cls = 'points' + (points > 0 ? ' pos' : (points < 0 ? ' neg' : ''));
    return el('p', { class: cls, text: (answered ? '' : 'ไม่ได้ตอบ · ') + 'ได้ ' + fmt(points) + ' จาก ' + MAX + ' คะแนน' });
  }

  function renderQuestion(focusTarget) {
    var run = state.run;
    var item = run.items[run.index];
    var q = item.q;
    var number = run.index + 1;
    var card = run.ui.card;
    var showFeedback = run.mode === 'practice' && item.confirmed;
    clear(card);

    var title = el('h2', { class: 'qtitle', id: 'qtitle', tabindex: '-1', text: 'ข้อ ' + number + ' จาก ' + run.items.length });
    card.appendChild(title);
    if (q.type === 'multiple') card.appendChild(el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }));
    card.appendChild(el('p', { class: 'stem', text: q.stem }));
    if (q.code) card.appendChild(codeBlock(q));
    card.appendChild(showFeedback ? staticOptions(item) : interactiveOptions(item, number));

    var feedback = null;
    if (showFeedback) {
      feedback = el('div', { class: 'feedback', id: 'feedback', tabindex: '-1' },
        el('h3', { text: 'ผลของข้อนี้' }),
        pointsLine(pointsOf(run, item), true),
        el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), q.explanation));
      card.appendChild(feedback);
    }
    if (focusTarget === 'feedback' && feedback) feedback.focus();
    else if (focusTarget === 'title') title.focus();
  }

  function button(label, opts) {
    return el('button', {
      type: 'button',
      id: opts.id || null,
      class: 'btn' + (opts.primary ? ' primary' : ''),
      text: label,
      disabled: opts.disabled,
      'aria-pressed': opts.pressed === undefined ? null : String(opts.pressed),
      onclick: opts.onclick,
    });
  }

  function goTo(index) {
    var run = state.run;
    if (index < 0 || index >= run.items.length) return;
    run.index = index;
    renderQuestion('title');
    renderNav();
    renderPalette();
  }

  function renderNav() {
    var run = state.run;
    var item = run.items[run.index];
    var nav = run.ui.nav;
    clear(nav);
    var last = run.index === run.items.length - 1;
    nav.appendChild(button('← ข้อก่อนหน้า', { disabled: run.index === 0, onclick: function () { goTo(run.index - 1); } }));
    if (run.mode === 'practice') {
      if (!item.confirmed) {
        nav.appendChild(button('ยืนยันคำตอบ', { primary: true, disabled: item.selected.length === 0, onclick: confirmAnswer }));
      }
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('จบและดูผลสรุป', { onclick: finishPractice }));
    } else {
      nav.appendChild(button('⚑ ติดธงทบทวน', {
        id: 'flag-btn',
        pressed: item.flagged,
        onclick: function () {
          item.flagged = !item.flagged;
          renderNav();
          renderPalette();
          document.getElementById('flag-btn').focus();
        },
      }));
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('ส่งข้อสอบ', { primary: true, onclick: requestSubmit }));
    }
  }

  function renderPalette() {
    var run = state.run;
    var box = run.ui.palette;
    if (!box) return;
    clear(box);
    var grid = el('div', { class: 'palette' });
    run.items.forEach(function (item, i) {
      var answered = item.selected.length > 0;
      var cls = 'pal' + (answered ? ' answered' : '') + (item.flagged ? ' flagged' : '') + (i === run.index ? ' current' : '');
      var label = 'ข้อ ' + (i + 1) + (answered ? ' ตอบแล้ว' : ' ยังไม่ตอบ') + (item.flagged ? ' ติดธงทบทวน' : '');
      grid.appendChild(el('button', {
        type: 'button', class: cls, text: String(i + 1), 'aria-label': label,
        'aria-current': i === run.index ? 'true' : null,
        onclick: function () { goTo(i); },
      }));
    });
    var answeredCount = run.items.filter(function (i) { return i.selected.length > 0; }).length;
    var flaggedCount = run.items.filter(function (i) { return i.flagged; }).length;
    box.appendChild(el('h2', { class: 'small', text: 'แผงเลือกข้อ · ตอบแล้ว ' + answeredCount + ' จาก ' + run.items.length + ' ข้อ · ติดธง ' + flaggedCount + ' ข้อ' }));
    box.appendChild(grid);
    box.appendChild(el('div', { class: 'legend' },
      el('span', { text: 'สีทึบ = ตอบแล้ว' }),
      el('span', { text: 'ขอบอย่างเดียว = ยังไม่ตอบ' }),
      el('span', { text: '⚑ = ติดธงทบทวน' })));
  }

  // ------------------------------------------------------------ practice actions

  function confirmAnswer() {
    var run = state.run;
    var item = run.items[run.index];
    if (item.confirmed || item.selected.length === 0) return;
    item.confirmed = true;
    renderQuestion('feedback');
    renderNav();
    updateScore();
  }

  function finishPractice() {
    var run = state.run;
    var open = run.items.filter(function (i) { return !i.confirmed; }).length;
    function go() {
      if (state.run !== run) return;
      run.submitted = true;
      state.screen = 'result';
      render();
    }
    if (open === 0) {
      go();
      return;
    }
    askConfirm({
      title: 'จบการซ้อมและดูผลสรุป?',
      message: ['ยังไม่ได้ยืนยันคำตอบ ' + open + ' ข้อ ข้อเหล่านี้จะนับเป็น 0 คะแนน'],
      ok: 'จบและดูผล',
      cancel: 'ซ้อมต่อ',
    }).then(function (yes) { if (yes) go(); });
  }

  // ------------------------------------------------------------ exam actions

  function requestSubmit() {
    var run = state.run;
    var unanswered = run.items.filter(function (i) { return i.selected.length === 0; }).length;
    var flagged = run.items.filter(function (i) { return i.flagged; }).length;
    var lines = [unanswered > 0 ? 'ยังไม่ได้ตอบ ' + unanswered + ' ข้อ ข้อที่ไม่ตอบจะได้ 0 คะแนน' : 'ตอบครบทุกข้อแล้ว'];
    if (flagged > 0) lines.push('มี ' + flagged + ' ข้อที่ติดธงไว้ทบทวน');
    lines.push('เมื่อส่งแล้วจะแก้คำตอบไม่ได้');
    askConfirm({ title: 'ส่งข้อสอบ?', message: lines, ok: 'ส่งข้อสอบ', cancel: 'กลับไปทำต่อ' })
      .then(function (yes) { if (yes && state.run === run) finishExam(false); });
  }

  function finishExam(auto) {
    var run = state.run;
    if (!run || run.submitted) return;
    run.submitted = true;
    run.auto = !!auto;
    stopTimer();
    closeOpenDialog();
    state.screen = 'result';
    render();
  }

  // ------------------------------------------------------------ result screen

  // Groups the score by competency when the data defines competencies, otherwise by descriptor.
  function breakdown(run) {
    var byCompetency = Array.isArray(DATA.competencies) && DATA.competencies.length > 0;
    var map = {};
    var order = [];
    run.items.forEach(function (item) {
      var d = byCompetency ? (item.q.competency || '-') : (item.q.descriptor || '-');
      if (!map[d]) {
        map[d] = { code: d, count: 0, answered: 0, points: 0, max: 0 };
        order.push(d);
      }
      map[d].count++;
      map[d].max += MAX;
      map[d].points += pointsOf(run, item);
      if (isAnswered(run, item)) map[d].answered++;
    });
    var known = byCompetency ? DATA.competencies : Object.keys(DATA.descriptorNames || {});
    order.sort(function (a, b) {
      var ia = known.indexOf(a);
      var ib = known.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    return order.map(function (d) { return map[d]; });
  }

  function renderResult() {
    var run = state.run;
    var total = 0;
    var answered = 0;
    run.items.forEach(function (item) {
      total += pointsOf(run, item);
      if (isAnswered(run, item)) answered++;
    });
    var max = run.items.length * MAX;
    var pct = max > 0 ? (total / max) * 100 : 0;

    var heading = el('h1', { id: 'result-title', tabindex: '-1', text: run.mode === 'exam' ? 'ผลสอบ' : 'สรุปผลการซ้อม' });
    root.appendChild(el('div', { class: 'topbar' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack }),
      el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] })));
    root.appendChild(heading);

    if (run.auto) {
      root.appendChild(el('div', { class: 'error', role: 'status', text: 'หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ' }));
    }
    root.appendChild(el('div', { class: 'card' },
      el('div', { class: 'big-score', text: fmt(total) + ' / ' + fmt(max) + ' คะแนน' }),
      el('p', { text: fmt(pct) + '% · ตอบแล้ว ' + answered + ' จาก ' + run.items.length + ' ข้อ' + (run.mode === 'exam' ? (run.negative ? ' · เปิดการหักคะแนน' : ' · ไม่หักคะแนน') : '') }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'btn primary', text: run.mode === 'exam' ? 'สอบใหม่ (สุ่มลำดับใหม่)' : 'ซ้อมอีกครั้ง', onclick: onResultRetake }))));

    var rows = breakdown(run).map(function (d) {
      var p = d.max > 0 ? (d.points / d.max) * 100 : 0;
      var name = Array.isArray(DATA.competencies) && DATA.competencies.length > 0
        ? d.code
        : ((DATA.descriptorNames && DATA.descriptorNames[d.code]) || '');
      var bar = el('div', { class: 'bar', 'aria-hidden': 'true' }, el('span'));
      bar.firstChild.style.width = Math.max(0, Math.min(100, p)) + '%';
      return el('div', { class: 'desc-row' },
        el('div', null, el('strong', { text: name || d.code })),
        el('div', { class: 'small', text: 'คะแนน ' + fmt(d.points) + ' / ' + fmt(d.max) + ' (' + fmt(p) + '%) · ตอบแล้ว ' + d.answered + ' จาก ' + d.count + ' ข้อ' }),
        bar);
    });
    root.appendChild(el('section', { class: 'card', 'aria-labelledby': 'breakdown-title' },
      el('h2', { id: 'breakdown-title', text: 'คะแนนแยกตามหัวข้อ' }),
      rows));

    if (run.mode === 'exam') {
      root.appendChild(el('h2', { text: 'ทบทวนทุกข้อ (ตามลำดับที่ทำ)' }));
      run.items.forEach(function (item, i) {
        var answeredItem = item.selected.length > 0;
        var pts = pointsOf(run, item);
        root.appendChild(el('article', { class: 'review-item' + (answeredItem ? '' : ' unanswered') },
          el('h3', null, 'ข้อ ' + (i + 1) + ' ',
            answeredItem ? null : el('span', { class: 'tag warn', text: 'ไม่ได้ตอบ' }), ' ',
            item.flagged ? el('span', { class: 'tag', text: '⚑ ติดธง' }) : null),
          item.q.type === 'multiple' ? el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }) : null,
          el('p', { class: 'stem', text: item.q.stem }),
          item.q.code ? codeBlock(item.q) : null,
          staticOptions(item),
          el('div', { class: 'feedback' },
            pointsLine(pts, answeredItem),
            el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), item.q.explanation))));
      });
    }

    root.appendChild(el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack })));
    heading.focus();
  }

  // Leaving the result screen throws the review away, so both exits ask first.
  function onResultBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam'
        ? 'ผลสอบและการทบทวนเฉลยทุกข้อในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'
        : 'สรุปผลการซ้อมในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'],
      ok: 'กลับหน้าแรก',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'result') goStart(); });
  }

  function onResultRetake() {
    var run = state.run;
    var exam = run.mode === 'exam';
    askConfirm({
      title: exam ? 'สอบใหม่?' : 'ซ้อมอีกครั้ง?',
      message: exam
        ? ['ผลสอบและการทบทวนเฉลยของรอบนี้จะหายไป', 'ระบบจะเริ่มจับเวลา ' + run.minutes + ' นาทีทันที และสุ่มลำดับข้อใหม่']
        : ['สรุปผลการซ้อมรอบนี้จะหายไป และเริ่มซ้อมรอบใหม่ทันที'],
      ok: exam ? 'เริ่มสอบใหม่' : 'เริ่มซ้อมใหม่',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) {
      if (yes && state.run === run && state.screen === 'result') startRun(run.level, run.mode, { negative: run.negative, minutes: run.minutes });
    });
  }

  render();
  previewHook();
})();

</script>
</body>
