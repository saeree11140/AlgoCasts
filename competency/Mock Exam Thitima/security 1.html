":true,"type":"single","stem":"ในรายงาน pentest ของแอปมือถือธนาคาร ผู้ทดสอบใช้เครื่องมือ hook ปิดการตรวจ root/jailbreak ของแอปได้ภายในไม่กี่นาที แล้วแก้ response ของ API เป็น isPremium: true เพื่อปลดล็อกฟีเจอร์ที่แอปตัดสินสิทธิ์จากค่านี้เอง ทีมพัฒนาถามว่าควรสรุปผลและรับมืออย่างไร","options":[{"id":"A","text":"มองว่ามาตรการในแอปเป็นด่านเสริมที่ถูกข้ามได้ ให้ย้ายการตัดสินสิทธิ์ไปบังคับที่ API ฝั่งเซิร์ฟเวอร์ และเก็บการตรวจในแอปเป็นชั้นเสริม","correct":true,"why":"ถูก เพราะผู้โจมตีควบคุมเครื่องและแอปได้เต็มที่ การตัดสินสิทธิ์ต้องอยู่ฝั่งที่เขาแก้ไม่ได้ ส่วนการตรวจในแอปมีประโยชน์เพียงเพิ่มความยากเท่านั้น"},{"id":"B","text":"ทำ obfuscation และ root detection ให้ซับซ้อนขึ้นหลายชั้น เพื่อให้ผู้ทดสอบข้ามไม่ได้ในเวลาจำกัด และให้แอปตัดสินสิทธิ์จากค่า isPremium เช่นเดิม","correct":false,"why":"ผิด เพราะการตรวจทุกแบบที่ทำงานบนเครื่องของผู้โจมตีถูกข้ามได้ในที่สุด ความซับซ้อนทำให้ช้าลง แต่การตัดสินสิทธิ์ยังเชื่อค่าจาก client อยู่"},{"id":"C","text":"จัดเป็นความเสี่ยงระดับ Low เพราะต้องใช้เครื่องมือเฉพาะทางและความรู้สูงจึงทำได้ จึงเก็บโค้ดเดิมไว้โดยไม่แก้ในรอบนี้","correct":false,"why":"ผิด เพราะระดับความเสี่ยงต้องดูทั้งโอกาสเกิดและผลกระทบทางธุรกิจ (ใครก็ใช้ฟีเจอร์ที่ต้องจ่ายได้) ไม่ใช่ดูความยากอย่างเดียว และเครื่องมือเหล่านี้เป็นของสาธารณะที่ใช้ได้ง่าย ความยากจึงไม่สูงอย่างที่อ้าง"},{"id":"D","text":"เข้ารหัส response ด้วย key ภายในแอปเพื่อไม่ให้ผู้ใช้แก้ค่า isPremium ระหว่างทางได้ และให้แอปถอดรหัสเองก่อนนำไปใช้","correct":false,"why":"ผิด เพราะ key อยู่ในแอป ผู้โจมตีดึงหรือ hook ที่จุดหลังถอดรหัสเพื่อเปลี่ยนค่าที่แอปใช้ตัดสินใจได้เหมือนเดิม"}],"explanation":"หลักการข้อแรกของความปลอดภัยฝั่ง client คือ ไม่ไว้ใจ client การตรวจภายในแอป (root detection, pinning, obfuscation) เพิ่มต้นทุนผู้โจมตี แต่ไม่ใช่การควบคุมที่เชื่อถือได้ การตัดสินใจที่มีผลต่อสิทธิ์หรือเงินต้องบังคับที่เซิร์ฟเวอร์เสมอ"},{"id":"SEC-S-E-013","level":"senior","pool":"exam","competency":"API Security","descriptor":"S4","concept":"ssrf-url-fetch-validation","mobile":false,"type":"single","stem":"ฟีเจอร์นำเข้ารูปโปรไฟล์จาก URL รันบน cloud VM ที่ metadata service ตอบ GET ธรรมดาได้ ผู้ทดสอบส่ง url เป็น http://169.254.169.254/latest/meta-data/iam/security-credentials/app-role แล้วเซิร์ฟเวอร์เก็บผลที่ดึงมาเป็นรูปโปรไฟล์ของผู้ทดสอบ เมื่อเปิดอ่านรูปโปรไฟล์ที่เก็บไว้ ผู้ทดสอบพบ credential ของ instance ทั้งที่โค้ดบล็อก localhost ไว้แล้ว ข้อใดเป็นการแก้ที่ครอบคลุมที่สุด","code":"router.post('/api/import-avatar', requireAuth, async (req, res) => {\n  const url = new URL(req.body.url);\n  if (url.hostname === 'localhost' || url.hostname === '127.0.0.1') {\n    return res.status(400).json({ error: 'blocked' });\n  }\n  const resp = await fetch(url.href);\n  const buf = Buffer.from(await resp.arrayBuffer());\n  await storage.save(req.user.id, buf);\n  res.sendStatus(204);\n});","codeLang":"typescript","options":[{"id":"A","text":"เพิ่ม 169.254.169.254 และ hostname อื่นที่รู้จักของ metadata service เข้าไปในรายการ hostname ที่บล็อก ให้ครอบคลุมที่อยู่ของ metadata service ทุกรูปแบบที่ทีมนึกออก","correct":false,"why":"ผิด เพราะการบล็อกตามสตริงถูกหลบได้ง่าย เช่น เขียน IP คนละรูปแบบ ใช้ชื่อโดเมนที่ชี้มาที่ IP ภายใน หรือ redirect จากเว็บของผู้โจมตีมายัง IP นั้น"},{"id":"B","text":"ตรวจด้วย regex ว่า URL ต้องลงท้ายด้วย .jpg หรือ .png และมี scheme เป็น http หรือ https ก่อนเรียกดึงข้อมูลจากเซิร์ฟเวอร์","correct":false,"why":"ผิด เพราะนามสกุลใน URL ผู้โจมตีกำหนดเองได้ เช่น ใส่ ?x=.png ต่อท้ายหรือใช้ path ที่ลงท้ายเช่นนั้น แต่ปลายทางยังเป็น metadata service"},{"id":"C","text":"ตรวจ IP ปลายทางหลัง resolve DNS ว่าไม่ใช่ private/loopback/link-local ทั้งคำขอแรกและทุก redirect และจำกัด scheme เป็น https","correct":true,"why":"ถูก เพราะตรวจที่ IP ที่จะเชื่อมต่อจริง ไม่ใช่ชื่อที่เขียนมา และตรวจซ้ำทุก redirect จึงปิดช่องทางหลบหลักที่ใช้กับ SSRF ทั้งนี้ต้องเชื่อมต่อไปยัง IP ที่ตรวจแล้วโดยไม่ resolve DNS ซ้ำ เพื่อกัน DNS rebinding"},{"id":"D","text":"ให้ผู้ใช้ยืนยัน URL บนหน้าจอก่อนกดนำเข้า เพื่อให้แน่ใจว่าเป็นรูปจริง และบันทึก URL ที่นำเข้าไว้ตรวจสอบภายหลัง","correct":false,"why":"ผิด เพราะผู้โจมตีคือผู้ใช้เอง การยืนยันบนหน้าจอไม่ได้ป้องกันอะไร request ยังถูกส่งจากเซิร์ฟเวอร์ไปยังปลายทางที่ผู้โจมตีเลือก"}],"explanation":"SSRF คือการหลอกให้เซิร์ฟเวอร์ที่อยู่ในเครือข่ายเชื่อถือไปเรียกปลายทางที่ผู้โจมตีเลือก การป้องกันที่แข็งแรงตรวจที่ปลายทางจริงหลัง resolve DNS รวมทุก redirect และจำกัดสิ่งที่ดึงได้ ควบคู่กับการลดสิทธิ์ของ instance และใช้เวอร์ชันของ metadata service ที่ป้องกันมากกว่า"},{"id":"SEC-S-E-014","level":"senior","pool":"exam","competency":"API Security","descriptor":"S4","concept":"api-input-validation-limits","mobile":false,"type":"multiple","stem":"API สร้างคำสั่งซื้อรับ JSON ที่ผู้ใช้ส่งมาโดยตรง ทีมต้องการเพิ่ม input validation ที่ API Gateway และใน service ข้อใดเป็นแนวทางที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจ schema แบบ allowlist (ชนิด ความยาว ช่วงค่า และปฏิเสธ field ที่ไม่รู้จัก) พร้อมจำกัดขนาด body และ Content-Type ที่รับ","correct":true,"why":"ถูก เพราะการระบุสิ่งที่ยอมรับแล้วปฏิเสธที่เหลือ ครอบคลุมกว่าการไล่ปิดสิ่งที่นึกออก และการจำกัดขนาดป้องกัน payload ใหญ่ที่ทำให้บริการล่ม"},{"id":"B","text":"ใช้ blacklist ของคำอันตราย เช่น DROP, \u003cscript> แล้วปฏิเสธ request ที่มีคำเหล่านั้น ตามรายการที่ทีมความปลอดภัยจัดทำและอัปเดตไว้เป็นประจำ","correct":false,"why":"ผิด เพราะผู้โจมตีหลบด้วยการเปลี่ยนรูปแบบตัวอักษร การเข้ารหัส หรือรูปแบบที่ไม่อยู่ในรายการ และยังบล็อกข้อมูลถูกต้องที่บังเอิญมีคำเหล่านั้น เช่น ชื่อสินค้า"},{"id":"C","text":"ตรวจที่ gateway เท่านั้น เพราะทราฟฟิกที่ผ่าน gateway มาแล้วเชื่อถือได้ทั้งหมด service ภายในไม่ต้องตรวจซ้ำ","correct":false,"why":"ผิด เพราะ service อาจถูกเรียกจากทางอื่นนอกเหนือจาก gateway (service อื่น งานเบื้องหลัง หรือหลังถูกเจาะ) และกฎธุรกิจบางข้อ gateway ไม่รู้"},{"id":"D","text":"service ต้องบังคับกฎธุรกิจเอง เช่น ราคาและส่วนลดต้องมาจากฐานข้อมูลฝั่งเรา ไม่เชื่อค่าที่ client ส่งมา และจำนวนต้องไม่ติดลบ","correct":true,"why":"ถูก เพราะ schema validation บอกได้แค่ว่ารูปแบบถูก แต่ไม่รู้ว่าค่านั้นสมเหตุสมผลในบริบทธุรกิจหรือไม่ ซึ่งต้องตรวจที่ service ที่เป็นเจ้าของกฎ"}],"explanation":"validation ที่ดีมีสองชั้น: ชั้นรูปแบบแบบ allowlist และการจำกัดขนาดที่ขอบระบบ กับชั้นกฎธุรกิจที่ service ที่เป็นเจ้าของข้อมูล ห้ามเชื่อค่าที่ client ส่งมาในเรื่องที่เซิร์ฟเวอร์รู้ดีกว่า เช่น ราคา"},{"id":"SEC-S-E-015","level":"senior","pool":"exam","competency":"API Security","descriptor":"S4","concept":"rate-limit-token-bucket-burst","mobile":true,"type":"single","stem":"แอปมือถือสายการบินเรียก API ค้นหาเที่ยวบิน ผู้ใช้จริงมักกดค้นหาติดกันหลายครั้งในไม่กี่วินาทีแล้วเงียบไปสักพัก แต่ scraper ยิงต่อเนื่องไม่หยุด ทีมต้องเลือกวิธี rate limit ที่ไม่ทำให้ผู้ใช้จริงถูกปฏิเสธโดยไม่จำเป็น แต่จำกัดอัตราการยิงต่อเนื่องได้ ควรเลือกแบบใด","options":[{"id":"A","text":"fixed window จำกัด 2 request ต่อวินาทีต่อผู้ใช้ เพราะตรงไปตรงมา ตรวจสอบง่าย และใช้หน่วยความจำน้อยที่สุดในทุกวิธี","correct":false,"why":"ผิด เพราะผู้ใช้จริงที่กดรัวหลายครั้งในวินาทีเดียวถูกปฏิเสธบ่อย ทำให้ประสบการณ์แย่ ไม่ตรงกับรูปแบบการใช้งานที่เป็นช่วงกระชั้น (burst)"},{"id":"B","text":"token bucket ที่ความจุรองรับ burst สั้นๆ (เช่น 10 request) เติม token ช้าๆ (เช่น 1 token ต่อ 2 วินาที) และตอบ 429 พร้อม Retry-After เมื่อหมด","correct":true,"why":"ถูก เพราะความจุของถังรองรับ burst ของผู้ใช้จริง ส่วนอัตราการเติมจำกัดการยิงต่อเนื่องของ scraper ตรงกับสองเงื่อนไขในโจทย์"},{"id":"C","text":"ไม่ใช้ rate limit แต่ให้แสดง CAPTCHA ทุกครั้งที่ค้นหา เพื่อกันบอทอย่างเข้มงวดและลดภาระการดูแลตัวเลขเพดาน","correct":false,"why":"ผิด เพราะทำลายประสบการณ์ของผู้ใช้จริงบนมือถือทุกครั้งที่ค้นหา และ CAPTCHA ถูกหลบด้วยบริการแก้ CAPTCHA ได้ จึงไม่ใช่ตัวแทนของการจำกัดอัตรา"},{"id":"D","text":"จำกัดตาม IP แบบ fixed window 1,000 request ต่อนาที เพื่อให้ผู้ใช้จริงไม่โดนบล็อกจากการกดค้นหารัว และลดภาระฝั่งเซิร์ฟเวอร์จากการระบุตัวผู้ใช้ในทุกคำขอ","correct":false,"why":"ผิด เพราะผู้ใช้มือถือหลายคนแชร์ IP เดียวกันผ่านเครือข่ายผู้ให้บริการ และเพดานสูงขนาดนี้ปล่อยให้ scraper ที่กระจายหลาย IP ดึงข้อมูลต่อเนื่องได้ในระดับสูงมาก"}],"explanation":"ขั้นตอนเลือกอัลกอริทึม rate limit คือดูรูปแบบการใช้งานจริงก่อน ถ้าผู้ใช้จริงมี burst สั้นๆ ที่ยอมรับได้ token bucket ให้ทั้ง burst และอัตราเฉลี่ยที่ควบคุมได้ ควรผูก key กับผู้ใช้หรือ token ที่ยืนยันตัวตนแล้ว ไม่ใช่ IP อย่างเดียว"},{"id":"SEC-S-E-016","level":"senior","pool":"exam","competency":"API Security","descriptor":"S4","concept":"cors-misconfiguration-credentials","mobile":false,"type":"multiple","stem":"API ของบริษัทใช้ cookie session และต้องให้เว็บแอปบนโดเมน https://app.example.co.th เรียกข้ามโดเมนได้ ทีมลองตั้ง Allow-Origin เป็น * ร่วมกับ credentials แต่เบราว์เซอร์ปฏิเสธ จึงเปลี่ยนมาเขียน CORS ตามโค้ดด้านล่างจนเว็บแอปเรียกได้ ข้อใดคือสิ่งที่ควรแก้หรือเข้าใจให้ถูกต้อง (เลือกทุกข้อที่ถูก)","code":"app.use((req, res, next) => {\n  res.setHeader('Access-Control-Allow-Origin', req.headers.origin ?? '*');\n  res.setHeader('Access-Control-Allow-Credentials', 'true');\n  next();\n});","codeLang":"typescript","options":[{"id":"A","text":"ใช้ allowlist ของ origin ที่รู้จัก แล้วสะท้อนค่า Origin กลับเฉพาะเมื่อตรงกับรายการ (และใส่ Vary: Origin)","correct":true,"why":"ถูก เพราะ credentials ควรเปิดเฉพาะ origin ที่เชื่อใจ การสะท้อนเฉพาะค่าที่อยู่ในรายการทำให้เว็บของผู้โจมตีไม่ได้สิทธิ์อ่าน response"},{"id":"B","text":"การสะท้อนค่า Origin กลับทุกค่าพร้อม Allow-Credentials เป็นเรื่องปกติ เพราะเบราว์เซอร์ตรวจ cookie ให้อยู่แล้ว","correct":false,"why":"ผิด เพราะการสะท้อนทุก origin พร้อม credentials คือยอมให้เว็บใดก็ตามอ่านข้อมูลของผู้ใช้ที่ล็อกอินอยู่ เมื่อ browser แนบ cookie ไปกับ request นั้น (เช่น cookie เป็น SameSite=None) ซึ่งเทียบเท่าการปิดการป้องกัน same-origin สำหรับ API นี้"},{"id":"C","text":"CORS เป็นกลไกของเบราว์เซอร์ ไม่ใช่การควบคุมสิทธิ์ client ที่ไม่ใช่เบราว์เซอร์ยังเรียก API ได้ จึงต้องยืนยันตัวตนและตรวจสิทธิ์ที่เซิร์ฟเวอร์ต่อไป","correct":true,"why":"ถูก เพราะ CORS จำกัดแค่ว่าเว็บใดอ่าน response ในเบราว์เซอร์ได้ ไม่ได้หยุด request จาก curl หรือสคริปต์ จึงใช้แทน authentication ไม่ได้"},{"id":"D","text":"ตั้ง Allow-Origin เป็น * ร่วมกับ Allow-Credentials: true ได้ เพราะเบราว์เซอร์รองรับและเป็นวิธีที่ง่ายที่สุด","correct":false,"why":"ผิด เพราะเบราว์เซอร์ปฏิเสธ response ที่ใช้ wildcard ร่วมกับ credentials อยู่แล้ว (ซึ่งเป็นสาเหตุที่ทีมหันไปสะท้อน Origin แทนจนเกิดช่องโหว่แบบการสะท้อนค่า Origin กลับทุกค่าพร้อม Allow-Credentials)"},{"id":"E","text":"ตั้ง cookie เป็น SameSite=None ให้ทุกตัวเพื่อให้ CORS ทำงาน ซึ่งไม่เพิ่มความเสี่ยงต่อ CSRF","correct":false,"why":"ผิด เพราะ SameSite=None ทำให้ cookie ถูกส่งไปกับ request ข้ามเว็บ ซึ่งเพิ่มความเสี่ยง CSRF ต้องมีมาตรการป้องกัน CSRF เพิ่มเมื่อจำเป็นต้องใช้"}],"explanation":"ค่า CORS ที่ปลอดภัยคือ allowlist ของ origin ที่ชัดเจน ไม่สะท้อนทุกค่า และไม่ใช้ wildcard กับ credentials ส่วนความเข้าใจที่ต้องมีคือ CORS ไม่ใช่ระบบสิทธิ์ การยืนยันตัวตนและการตรวจสิทธิ์ยังต้องทำที่เซิร์ฟเวอร์ทุก request"},{"id":"SEC-S-E-017","level":"senior","pool":"exam","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"incident-containment-vs-evidence","mobile":false,"type":"single","stem":"SOC พบว่า service account ของ batch job รายงานซึ่งปกติรันจาก server ภายในตอนตี 2 กำลังดาวน์โหลดข้อมูลลูกค้าจำนวนมากจาก IP ต่างประเทศในช่วงบ่าย batch job นี้ใช้ทำรายงานประจำวันของฝ่ายขาย คุณเป็น incident lead ควรตัดสินใจอย่างไร","options":[{"id":"A","text":"เพิกถอน credential ของ service account ทันที พร้อมเก็บ snapshot ของ log และเครื่องที่เกี่ยวข้องไว้ก่อนแก้ แล้วออก credential ใหม่หลังยืนยันต้นเหตุ","correct":true,"why":"ถูก เพราะหยุดการรั่วที่ยังเกิดอยู่ทันที โดยยอมให้รายงานประจำวันหยุดชั่วคราวซึ่งเป็นผลกระทบที่ยอมรับได้ และไม่ทำลายหลักฐานที่ต้องใช้สืบสวน"},{"id":"B","text":"เฝ้าดูต่ออีกหลายวันโดยไม่แตะต้องอะไร เพื่อรู้วิธีการและตัวตนของผู้โจมตีให้ครบก่อนตัดสินใจปิดการเข้าถึงทั้งหมดในครั้งเดียว","correct":false,"why":"ผิด เพราะข้อมูลลูกค้ายังไหลออกอยู่ทุกนาทีที่รอ การสังเกตการณ์ผู้โจมตีเป็นกลยุทธ์ที่ต้องมีผู้มีอำนาจอนุมัติและควบคุมความเสี่ยงไว้แล้ว ไม่ใช่ค่าเริ่มต้น"},{"id":"C","text":"รีสตาร์ตและ rebuild server ที่รัน batch job ทันทีจาก image สะอาด เพื่อล้างมัลแวร์ที่อาจติดอยู่และหยุดการดาวน์โหลดที่กำลังเกิดขึ้นในตอนนี้ ก่อนที่ผลสอบสวนจะออก","correct":false,"why":"ผิด เพราะทำลายหลักฐาน (หน่วยความจำ ไฟล์ log บนเครื่อง) และไม่หยุดการโจมตีถ้าผู้โจมตีมี credential อยู่แล้ว จะเชื่อมต่อจากที่อื่นต่อได้"},{"id":"D","text":"บล็อก IP ต่างประเทศที่พบที่ firewall เพียงอย่างเดียว เพราะไม่กระทบการทำงานของ batch job ปกติและทำได้ทันที","correct":false,"why":"ผิด เพราะผู้โจมตีเปลี่ยน IP ได้ง่าย และ credential ที่ถูกขโมยยังใช้ได้อยู่ เป็นการแก้อาการ ไม่ใช่ตัดการเข้าถึง"}],"explanation":"ในการตอบสนองเหตุการณ์ ต้องชั่งน้ำหนักระหว่างการควบคุมความเสียหายกับการรักษาหลักฐาน แนวทางปกติคือตัดการเข้าถึงที่เป็นสาเหตุ (credential) ทันที แล้วเก็บหลักฐานก่อนเปลี่ยนแปลงระบบ ไม่ใช่รอโดยปล่อยให้ข้อมูลรั่วหรือล้างเครื่องจนไม่เหลือร่องรอย"},{"id":"SEC-S-E-018","level":"senior","pool":"exam","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"post-incident-review-outputs","mobile":false,"type":"multiple","stem":"หลังเหตุการณ์ข้อมูลรั่ว ซึ่งทีมต้องแยกระบบบางส่วนออกเพื่อควบคุมเหตุจนบริการหยุดไป 6 ชั่วโมง ทีมจะจัด post-incident review ข้อใดคือผลลัพธ์ที่ควรได้จากการประชุมนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ลำดับเหตุการณ์ (timeline) ที่ละเอียด รวมช่วงเวลาจากเกิดเหตุถึงตรวจพบ และจากตรวจพบถึงควบคุมได้ เพื่อวัดช่องว่างของการตรวจจับและการตอบสนอง","correct":true,"why":"ถูก เพราะตัวเลขเวลาทำให้เห็นว่าช้าตรงขั้นตอนไหน (ตรวจไม่พบ หรือพบแล้วตัดสินใจช้า) ซึ่งเป็นสิ่งที่ต้องปรับปรุงจริง"},{"id":"B","text":"รายชื่อนักพัฒนาที่ commit โค้ดซึ่งมีช่องโหว่ เพื่อให้หัวหน้าตักเตือนเป็นรายบุคคล และบันทึกเป็นประวัติประเมินผลงานประจำปีของนักพัฒนาคนนั้น","correct":false,"why":"ผิด เพราะการหาคนผิดทำให้ทีมปิดบังข้อมูลในครั้งต่อไป และช่องโหว่หลุดไปถึง production ได้เพราะกระบวนการ (review, test) ไม่จับได้ ไม่ใช่เพราะคนเดียว"},{"id":"C","text":"รายการ action item ที่มีเจ้าของและกำหนดเวลา แก้ที่สาเหตุเชิงระบบหรือกระบวนการ (เช่น ไม่มีการตรวจสิทธิ์ใน code review หรือ alert ไม่ทำงาน) ไม่ใช่แค่แพตช์จุดเดียว","correct":true,"why":"ถูก เพราะการแก้ที่ระดับกระบวนการป้องกันเหตุแบบเดียวกันทั้งกลุ่ม และเจ้าของกับกำหนดเวลาทำให้ติดตามจนเสร็จได้"},{"id":"D","text":"ข้อสรุปว่าสาเหตุคือโค้ดช่องโหว่จุดเดียวที่แพตช์ไปแล้ว พร้อมขั้นตอน hotfix ที่ใช้ เพื่อบันทึกว่าปิดเหตุเรียบร้อย","correct":false,"why":"ผิด เพราะการแพตช์จุดเดียวไม่ตอบว่า code review, test และ monitoring พลาดตรงไหนจึงปล่อยช่องโหว่ถึง production และตรวจพบช้า ช่องโหว่แบบเดียวกันที่อื่นจึงยังอยู่ ต้องมี action item เชิงระบบที่มีเจ้าของและกำหนดเวลา"}],"explanation":"post-incident review ที่ได้ประโยชน์เป็นแบบไม่กล่าวโทษบุคคล เน้นความเข้าใจ timeline และสาเหตุเชิงระบบ และจบด้วยงานปรับปรุงที่มีเจ้าของและเส้นตาย ไม่ใช่การตักเตือนหรือการแพตช์จุดเดียวแล้วปิดเรื่อง"},{"id":"SEC-S-E-019","level":"senior","pool":"exam","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"telemetry-pii-scrubbing","mobile":true,"type":"single","stem":"ทีมมือถือเปิดใช้ crash reporting และ analytics SDK ของบริษัทภายนอก ต่อมาฝ่ายความปลอดภัยพบว่า breadcrumb ของ crash report มี URL ที่มีเลขบัตรประชาชนใน query string และ header Authorization ของ request ที่ล้มเหลว ถูกส่งไปเก็บที่เซิร์ฟเวอร์ของผู้ให้บริการ ข้อใดคือการแก้ที่ถูกต้องที่สุดสำหรับทั้งปัญหาปัจจุบันและอนาคต","options":[{"id":"A","text":"ขอให้ผู้ให้บริการลบข้อมูลเก่าอย่างเดียว โดยยังไม่แก้แอป เพราะสัญญากำหนดห้ามนำข้อมูลไปใช้อยู่แล้วและเขาเป็นผู้ประมวลผลของเรา","correct":false,"why":"ผิด เพราะแอปยังส่งข้อมูลละเอียดอ่อนออกไปต่อเนื่อง สัญญาไม่ได้ทำให้เราได้ชื่อว่าปฏิบัติตามหลัก data minimisation และ token ที่รั่วยังใช้ได้"},{"id":"B","text":"ปิด crash reporting ถาวร เพราะเป็นวิธีเดียวที่ทำให้ไม่มีข้อมูลส่วนบุคคลออกไปนอกบริษัท และตัดภาระการดูแล SDK ของบุคคลที่สาม","correct":false,"why":"ผิด เพราะเป็นการแก้เกินเหตุ ทำให้ทีมมองไม่เห็นข้อผิดพลาดที่เกิดกับผู้ใช้จริง ทั้งที่ควบคุมสิ่งที่ส่งออกไปได้ด้วยการกรอง"},{"id":"C","text":"เข้ารหัส payload ทั้งหมดด้วย key ของแอปก่อนส่งให้ผู้ให้บริการ เพื่อให้ผู้ให้บริการอ่านข้อมูลไม่ได้แม้ข้อมูลจะถูกเก็บไว้ที่เขา และเรายังเก็บ crash report ไว้ได้ครบ","correct":false,"why":"ผิด เพราะผู้ให้บริการถอดรหัสไม่ได้จึงใช้ crash report ไม่ได้เลย ส่วน key ที่ฝังในแอปก็ดึงออกได้ ไม่ได้ลดปัญหาข้อมูลที่ไม่ควรถูกเก็บตั้งแต่แรก"},{"id":"D","text":"ตั้ง filter ในแอปก่อนส่ง (ตัด query string, header และ field ที่เป็น PII) เลิกใส่ PII ใน URL เพิกถอน token ที่อาจรั่ว และให้ผู้ให้บริการลบข้อมูลเดิม","correct":true,"why":"ถูก เพราะแก้ทั้งต้นเหตุ (ไม่ส่งและไม่ใส่ PII ใน URL) ผลที่เกิดไปแล้ว (token และข้อมูลเดิม) และคงประโยชน์ของ crash reporting ไว้"}],"explanation":"ระบบ monitoring และ telemetry เป็นช่องทางให้ข้อมูลส่วนบุคคลรั่วที่พบบ่อย เพราะมักเก็บ context กว้าง ควรกรองที่ต้นทางก่อนส่ง ไม่ให้ PII อยู่ใน URL และตรวจสิ่งที่ SDK เก็บโดยค่าเริ่มต้น เมื่อเกิดเหตุก็ต้องจัดการข้อมูลเดิมและ credential ที่รั่วด้วย"},{"id":"SEC-S-E-020","level":"senior","pool":"exam","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"credential-stuffing-response","mobile":false,"type":"multiple","stem":"ระบบ e-commerce พบการล็อกอินล้มเหลวพุ่งจาก 200 เป็น 40,000 ครั้งต่อชั่วโมง กระจายมาจาก IP หลายพันตัว โดยแต่ละ IP ลองเพียงไม่กี่บัญชี และมีบางบัญชีล็อกอินสำเร็จ เข้าข่าย credential stuffing ข้อใดเป็นมาตรการตอบสนองที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มด่านตรวจกับพฤติกรรมน่าสงสัย (เช่น challenge หรือ MFA step-up) และจำกัดอัตราตามบัญชีและลักษณะของ client ไม่ใช่ตาม IP อย่างเดียว","correct":true,"why":"ถูก เพราะผู้โจมตีกระจาย IP ทำให้ limit ตาม IP ไม่ได้ผล ต้องดูพฤติกรรมและตัวบัญชี และเพิ่มต้นทุนให้บอทด้วยด่านเพิ่ม"},{"id":"B","text":"บล็อก IP ทั้งหมดที่ตรวจพบถาวรที่ firewall เป็นมาตรการหลัก เพราะการโจมตีมาจาก IP เหล่านั้นทั้งหมด","correct":false,"why":"ผิด เพราะผู้โจมตีใช้ IP ใหม่ได้ทันทีจากบอตเน็ต และการบล็อกถาวรอาจกระทบผู้ใช้จริงที่ใช้ IP ร่วม ทั้งยังไม่จัดการบัญชีที่ถูกยึดไปแล้ว"},{"id":"C","text":"ตรวจบัญชีที่ล็อกอินสำเร็จจากต้นทางผิดปกติ บังคับรีเซ็ตรหัสผ่านเฉพาะบัญชีเหล่านั้น และแจ้งเจ้าของบัญชี","correct":true,"why":"ถูก เพราะบัญชีที่ล็อกอินสำเร็จคือบัญชีที่ถูกยึดจริง ต้องตัดสิทธิ์และแจ้งเจ้าของ ไม่ต้องรบกวนผู้ใช้ที่ไม่เกี่ยวข้องทั้งระบบ"},{"id":"D","text":"ตรวจรหัสผ่านที่ผู้ใช้ตั้งเทียบกับรายการรหัสผ่านที่เคยรั่ว (breached password screening) และสนับสนุนให้ใช้ MFA หรือ passkey","correct":true,"why":"ถูก เพราะ credential stuffing ใช้รหัสที่รั่วจากเว็บอื่น การไม่ยอมให้ตั้งรหัสที่รั่วแล้วและเพิ่มปัจจัยที่สองตัดกลไกที่โจมตีอาศัย"},{"id":"E","text":"ล็อกบัญชีถาวรเมื่อกรอกรหัสผ่านผิด 3 ครั้ง และให้ผู้ใช้ติดต่อ call center เพื่อปลดล็อกทุกกรณี","correct":false,"why":"ผิด เพราะผู้โจมตีใช้เป็นช่องโจมตีให้บริการหยุด (ล็อกบัญชีเหยื่อ) และสร้างภาระ call center มหาศาล ทั้งที่ stuffing ลองรหัสแต่ละบัญชีน้อยครั้งอยู่แล้วจึงไม่ถูกจับด้วยกฎนี้"}],"explanation":"credential stuffing ต่างจาก brute force ตรงที่ลองรหัสที่รั่วจากที่อื่นไม่กี่ครั้งต่อบัญชีและกระจาย IP การรับมือจึงต้องมองหลายมิติ: ตรวจพฤติกรรม จัดการบัญชีที่ถูกยึดแล้ว และลดโอกาสสำเร็จด้วยการกันรหัสที่รั่วและเพิ่ม MFA"}]}}}</script>
<script type="application/json" id="review-data">{"version":1,"levels":{"junior":[{"descriptor":"J1","competency":"Application Security","title":"OWASP Top 10 และการเขียนโค้ดป้องกันช่องโหว่ทั่วไป","summary":"OWASP Top 10 คือรายการความเสี่ยงของเว็บแอปที่พบบ่อยที่สุด (ฉบับล่าสุดคือ OWASP Top 10:2025) นักพัฒนาต้องรู้ว่าช่องโหว่แต่ละแบบเกิดจากอะไรและแก้ที่จุดไหนของโค้ด เพราะการแก้ผิดจุด (เช่น แก้แค่ฝั่ง client) ทำให้ยังถูกโจมตีได้","keyPoints":["OWASP Top 10:2025 เรียงตามอันดับ: A01 Broken Access Control · A02 Security Misconfiguration · A03 Software Supply Chain Failures · A04 Cryptographic Failures · A05 Injection · A06 Insecure Design · A07 Authentication Failures · A08 Software or Data Integrity Failures · A09 Security Logging and Alerting Failures · A10 Mishandling of Exceptional Conditions","สิ่งที่เปลี่ยนจากฉบับ 2021: SSRF ไม่มีหมวดของตัวเองแล้ว ถูกรวมเข้า A01 Broken Access Control · Vulnerable and Outdated Components ขยายเป็น A03 Software Supply Chain Failures (ครอบคลุม dependency, build system และช่องทางแจกจ่ายซอฟต์แวร์) · Security Misconfiguration ขึ้นมาอันดับ 2 · Injection ลงไปอันดับ 5 · หมวดใหม่ A10 Mishandling of Exceptional Conditions","A10 Mishandling of Exceptional Conditions: การจัดการ error/สถานการณ์ผิดปกติไม่ดี เช่น fail open (เกิด exception แล้วปล่อยผ่านแทนที่จะปฏิเสธ) หรือ error message ที่เปิดเผยข้อมูลภายในอย่าง stack trace ให้ fail closed (deny by default) และส่ง error ทั่วไปกลับให้ผู้ใช้ เก็บรายละเอียดไว้ใน log","Injection (SQL, command, LDAP): เกิดเมื่อข้อมูลจากผู้ใช้ถูกต่อสตริงเป็นคำสั่ง วิธีหลักคือ parameterized query / prepared statement เพื่อแยก code ออกจาก data ส่วน escape เองหรือ blacklist เป็นแค่ตัวเสริม","ส่วนที่ bind parameter ไม่ได้ เช่น ชื่อคอลัมน์หรือทิศทางใน ORDER BY ต้องใช้ allowlist ของค่าที่อนุญาต แล้ว map เป็นค่าที่เซิร์ฟเวอร์กำหนดเอง","XSS: แก้ที่จุดแสดงผลด้วย output encoding ให้ตรงบริบท (HTML body, attribute, JavaScript, URL) ใน DOM ให้ใช้ `textContent` แทน `innerHTML` และถ้าต้องแสดง HTML จริงให้ sanitize ด้วยไลบรารีที่เชื่อถือได้ เสริมด้วย Content-Security-Policy","Broken Access Control / IDOR: ต้องตรวจสิทธิ์และ ownership ของ resource ที่ฝั่ง server ทุก request (เช่น `WHERE id = ? AND user_id = ?`) การซ่อนปุ่มหรือเช็คใน JavaScript ฝั่ง client ไม่ใช่การป้องกัน ที่เกี่ยวข้องกันคือ mass assignment: อย่า bind object จาก request เข้า model ทั้งก้อน ใช้ DTO หรือ allowlist เพื่อกันการส่งฟิลด์อย่าง `role` หรือ `isAdmin` มาเอง","CSRF: browser แนบ cookie ให้เอง ป้องกันด้วย CSRF token (synchronizer / double-submit) และ cookie แบบ `SameSite=Lax` หรือ `Strict` ใช้ร่วมกันได้ และ GET ต้องไม่เปลี่ยนสถานะข้อมูล","SSRF (ในฉบับ 2025 นับอยู่ใต้ A01 Broken Access Control): เมื่อ server ดึง URL ที่ผู้ใช้ส่งมา ต้องใช้ allowlist ของปลายทาง บล็อก IP ภายใน/loopback/link-local (เช่น cloud metadata endpoint) และจำกัด egress ที่ระดับเครือข่าย","Path traversal (`../`): อย่าให้ผู้ใช้ระบุ path เอง ใช้ id ที่ map ไปยังไฟล์ หรือ normalize/resolve path แล้วตรวจว่ายังอยู่ใน base directory ที่กำหนด","Open redirect: ตรวจ return URL ด้วย allowlist หรืออนุญาตเฉพาะ relative path ภายในเว็บ File upload: ตรวจ type จากเนื้อไฟล์ (ไม่เชื่อแค่นามสกุล/Content-Type) จำกัดขนาด เปลี่ยนชื่อไฟล์เอง และเก็บนอก web root","Command injection: เลี่ยงการเรียก shell ด้วยสตริงที่ต่อจากอินพุต ใช้ API ที่รับ argument เป็น array แทน และ validate ด้วย allowlist นอกจากนี้ token สำหรับ reset/session ต้องสร้างด้วย CSPRNG ไม่ใช่ `Math.random()`","Security Misconfiguration (A02) และ Software Supply Chain Failures (A03): ก่อน go-live ต้องเปลี่ยน default credential ปิด debug/directory listing/ฟีเจอร์ที่ไม่ใช้ และอัปเกรด dependency ตามผล scanner พร้อมมี test คุ้มกัน ล็อกเวอร์ชันด้วย lockfile และใช้ dependency จากแหล่งที่เชื่อถือได้"],"examFocus":["ถ้าเจอโค้ดที่ต่อสตริง SQL จากอินพุตผู้ใช้ ให้เลือก parameterized query เป็นคำตอบหลัก ไม่ใช่แค่ validate ฝั่ง client หรือ escape ด้วยมือ","ถ้าผู้ใช้ที่ล็อกอินแล้วเปลี่ยน id ใน URL แล้วเห็นข้อมูลคนอื่น ให้ระบุว่าเป็น IDOR และแก้ด้วยการตรวจ ownership ที่ server","ถ้าต้องแสดงข้อมูลผู้ใช้บนหน้าเว็บ ให้เลือก output encoding ตามบริบทหรือ `textContent` ไม่ใช่การลบแท็กด้วย regex","ถ้า API รับ URL แล้วไปดึงข้อมูลให้ ให้นึกถึง SSRF และเลือก allowlist + บล็อก internal IP","ถ้า response ส่งฟิลด์เกินจำเป็นกลับไปให้ client (เช่น password hash) ให้เลือกการคืนเฉพาะฟิลด์ที่จำเป็นด้วย DTO/response schema","ถ้าโจทย์เล่าว่าเกิด exception แล้วระบบปล่อยให้ผ่าน (เช่น ตรวจสิทธิ์ล้มเหลวแต่ยังให้เข้าได้) หรือแสดง stack trace ให้ผู้ใช้ ให้นึกถึง A10:2025 Mishandling of Exceptional Conditions และเลือก fail closed"],"pitfalls":["คิดว่า validate ที่ฝั่ง client พอ: ผู้โจมตียิง request ตรงเข้า API ได้ ต้อง validate และตรวจสิทธิ์ที่ server เสมอ","ใช้ blacklist (เช่น ห้ามคำว่า `DROP`) แทน parameterized query: ถูก bypass ได้ง่ายด้วย encoding หรือรูปแบบอื่น","เข้าใจว่า HTTPS ช่วยกัน XSS/SQL injection: HTTPS ป้องกันการดักข้อมูลระหว่างทาง ไม่เกี่ยวกับการจัดการอินพุตในแอป","เชื่อ Content-Type หรือนามสกุลไฟล์ตอน upload: ทั้งสองค่าถูกปลอมได้ ต้องตรวจเนื้อไฟล์และจัดเก็บอย่างปลอดภัย","จำอันดับตามฉบับ 2021 (เช่น Injection = A03, SSRF = A10): ในฉบับ 2025 Injection คือ A05, A03 คือ Software Supply Chain Failures และ A10 คือ Mishandling of Exceptional Conditions"],"example":{"lang":"typescript","code":"// node-postgres: ค่าจากผู้ใช้ส่งเป็น parameter ไม่ต่อสตริง\nconst ALLOWED_SORT = { date: 'created_at', total: 'total_amount' } as const;\n\nasync function listOrders(db, userId: string, sort: string) {\n  const col = ALLOWED_SORT[sort as keyof typeof ALLOWED_SORT] ?? 'created_at';\n  // ORDER BY bind ไม่ได้ จึงใช้ allowlist; user_id ตรวจ ownership\n  return db.query(\n    `SELECT id, total_amount FROM orders WHERE user_id = $1 ORDER BY ${col}`,\n    [userId]\n  );\n}"}},{"descriptor":"J2","competency":"Application Security","title":"Authentication พื้นฐาน: OAuth 2.0, password, session","summary":"Authentication คือการพิสูจน์ว่าผู้ใช้คือใคร ถ้า implement ผิด (เก็บรหัสผ่านแบบอ่านได้, session ไม่ปลอดภัย, OAuth flow ไม่ครบ) ผู้โจมตียึดบัญชีได้โดยตรง","keyPoints":["รหัสผ่านต้องเก็บเป็น hash ด้วยอัลกอริทึมที่ออกแบบมาสำหรับรหัสผ่านและช้าโดยตั้งใจ เช่น bcrypt, scrypt, Argon2id ไม่ใช่ MD5/SHA-256 เปล่าๆ และไม่เก็บแบบ plain text หรือ encrypt ที่ถอดกลับได้","Salt คือค่าสุ่มต่อผู้ใช้หนึ่งคนเพื่อให้รหัสผ่านเดียวกันได้ hash ต่างกันและกัน rainbow table bcrypt ใส่ salt ในผลลัพธ์ให้เองอยู่แล้ว","OAuth 2.0 สำหรับแอปที่มีผู้ใช้ (web, mobile, SPA) ใช้ Authorization Code flow ร่วมกับ PKCE (`code_verifier` / `code_challenge` แบบ S256) ซึ่งกัน authorization code ถูกขโมยไประหว่างทาง Implicit flow ไม่แนะนำให้ใช้แล้ว","พารามิเตอร์ `state` ใน OAuth ใช้ผูก request กับ session ของผู้ใช้เพื่อกัน login CSRF ต้องสุ่มและตรวจค่าเมื่อ callback กลับมา; redirect URI ต้องลงทะเบียนและเทียบแบบตรงทุกตัวอักษร","Session cookie ควรตั้ง `HttpOnly` (JavaScript อ่านไม่ได้ ลดผลของ XSS), `Secure` (ส่งผ่าน HTTPS เท่านั้น), `SameSite` (ลด CSRF) และ session id ต้องสุ่มด้วย CSPRNG ยาวพอ","บนมือถือ เก็บ token ใน Keychain (iOS) หรือ Keystore-backed storage (Android) ไม่เก็บใน SharedPreferences/UserDefaults/ไฟล์ธรรมดาที่อ่านได้","Logout ต้อง invalidate session หรือ revoke token ที่ฝั่ง server จริง ไม่ใช่แค่ลบ cookie/token ที่ฝั่ง client","ป้องกัน brute force ด้วย rate limit / account lockout แบบหน่วงเวลา และเปิด MFA เพื่อลดความเสียหายเมื่อรหัสผ่านรั่ว; ข้อความ error ของ login ควรไม่บอกว่า username หรือ password ผิดอย่างไหน","Password reset: สร้าง token แบบสุ่ม ใช้ได้ครั้งเดียว มีอายุสั้น เก็บใน DB แบบ hash และ invalidate หลังใช้ ไม่ใช้ค่าที่เดาได้ เช่น user id หรือ timestamp","Biometric (Face ID / ลายนิ้วมือ) บนมือถือเป็นแค่การปลดล็อก token หรือ key ที่เก็บในเครื่อง ไม่ได้แทน credential ของ server"],"examFocus":["ถ้าแอปมือถือต้อง login ด้วย OAuth ให้เลือก Authorization Code + PKCE ผ่าน system browser ไม่ใช่ฝัง username/password ลงในแอป หรือใช้ implicit flow","ถ้าถามวิธีเก็บรหัสผ่านให้เลือก bcrypt/Argon2id พร้อม salt ไม่ใช่ SHA-256 ตรงๆ หรือ AES encrypt","ถ้าเจอ cookie เก็บ session ให้นึกถึง flag `HttpOnly`, `Secure`, `SameSite` ครบทั้งสาม","ถ้าถามว่าต้องทำอะไรตอน logout ให้เลือก invalidate ที่ server","ถ้าถามว่าจะลดความเสี่ยงจากการเดารหัสผ่านต้องทำอะไร ให้เลือก rate limit + MFA ร่วมกัน"],"pitfalls":["คิดว่า hash ด้วย SHA-256 ก็พอ: อัลกอริทึมเร็วทำให้ brute force ด้วย GPU ได้เร็วมาก ต้องใช้ hash ที่ช้าและมี cost factor","คิดว่า PKCE ใช้กับ confidential client ของ server เท่านั้น: จริงๆ PKCE สำคัญที่สุดกับ public client เช่น mobile และ SPA ที่เก็บ client secret ไม่ได้","ลบ token ใน client แล้วถือว่า logout สมบูรณ์: ถ้า token ที่ถูกคัดลอกไปยังใช้ได้ต่อ แปลว่ายังไม่ได้ revoke ที่ server","ละเลย `state`: ทำให้เสี่ยง login CSRF ที่ผู้โจมตีให้เหยื่อล็อกอินเข้าบัญชีของผู้โจมตี"],"example":{"lang":"typescript","code":"// Express: ตั้ง session cookie ให้ปลอดภัย\nres.cookie('sid', sessionId, {\n  httpOnly: true,   // JavaScript อ่านไม่ได้\n  secure: true,     // ส่งผ่าน HTTPS เท่านั้น\n  sameSite: 'lax',  // ลด CSRF\n  maxAge: 30 * 60 * 1000,\n  path: '/',\n});\n\n// เก็บรหัสผ่านด้วย bcrypt (salt อยู่ในผลลัพธ์แล้ว)\nconst hash = await bcrypt.hash(password, 12);\nconst ok = await bcrypt.compare(input, hash);"}},{"descriptor":"J3","competency":"Application Security","title":"พื้นฐาน PDPA และการปกป้องข้อมูลส่วนบุคคล","summary":"นักพัฒนาต้องออกแบบระบบให้เก็บข้อมูลส่วนบุคคลเท่าที่จำเป็น ขอความยินยอมอย่างถูกต้อง และปกป้องข้อมูลด้วยการเข้ารหัส เพื่อให้สอดคล้องกับ PDPA และลดความเสียหายเมื่อข้อมูลรั่ว","keyPoints":["PDPA (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562) ของไทยกำหนดหน้าที่ให้ผู้ควบคุมข้อมูล (Data Controller) และผู้ประมวลผลข้อมูล (Data Processor) และให้สิทธิเจ้าของข้อมูล เช่น เข้าถึง แก้ไข ลบ คัดค้าน ถอนความยินยอม","Consent ต้องขอโดยชัดเจน แยกจากข้อตกลงอื่น แจ้งวัตถุประสงค์ และถอนได้ง่ายเท่ากับตอนให้ ระบบควรบันทึกหลักฐานว่าใครให้ความยินยอมเมื่อไรและเพื่อวัตถุประสงค์ใด รวมถึงบันทึกการถอน","Purpose limitation: ใช้ข้อมูลตามวัตถุประสงค์ที่แจ้งไว้เท่านั้น ถ้าจะนำไปใช้เพื่อวัตถุประสงค์ใหม่ต้องมีฐานทางกฎหมายหรือขอความยินยอมใหม่","Data minimisation: เก็บเฉพาะข้อมูลที่จำเป็นต่อวัตถุประสงค์ เช่น ไม่ขอเลขบัตรประชาชนในฟอร์มสมัครที่ไม่ต้องใช้ และขอ permission ของแอปเท่าที่ฟีเจอร์ต้องใช้","ข้อมูลอ่อนไหว (sensitive data) เช่น สุขภาพ ศาสนา เชื้อชาติ ข้อมูลชีวภาพ มีข้อกำหนดเข้มกว่า โดยทั่วไปต้องมี explicit consent หรือฐานตามที่กฎหมายระบุ","Anonymization ต่างจาก pseudonymization: ข้อมูลที่ anonymize แล้วต้องย้อนกลับระบุตัวบุคคลไม่ได้อย่างสมเหตุสมผล ส่วนการ hash เลขบัตรประชาชนหรือแทนด้วยรหัสยังเป็นข้อมูลส่วนบุคคลเพราะเดา/จับคู่กลับได้","Encryption in transit: ใช้ TLS (HTTPS) ทุกช่องทางที่ข้อมูลเดินทาง Encryption at rest: เข้ารหัสข้อมูลในดิสก์/DB/backup (เช่น AES-256) และแยกการจัดเก็บ key ออกจากข้อมูล","Data retention: กำหนดระยะเวลาเก็บและลบหรือทำให้เป็น anonymous เมื่อหมดความจำเป็น ไม่เก็บไว้ตลอดไป และต้องครอบคลุม backup/log ด้วย","ลดการแสดงข้อมูลส่วนบุคคลด้วย masking (เช่น แสดงเลขบัตรเพียงบางหลัก) และจำกัดสิทธิ์เข้าถึงตามหน้าที่ (need-to-know)","กรณีข้อมูลรั่วไหลที่มีความเสี่ยงต่อสิทธิเสรีภาพของบุคคล ผู้ควบคุมข้อมูลต้องแจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลภายใน 72 ชั่วโมงนับแต่ทราบเหตุเท่าที่ทำได้"],"examFocus":["ถ้าทีมจะนำข้อมูลที่เก็บไว้เพื่อวัตถุประสงค์หนึ่งไปใช้ทำการตลาด ให้ตอบว่าต้องขอความยินยอมใหม่ (purpose limitation)","ถ้ามีการ hash เลขบัตรประชาชนแล้วอ้างว่า anonymize แล้ว ให้ชี้ว่ายังเป็น personal data เพราะ pseudonymized และเดาย้อนได้","ถ้าฟอร์มสมัครขอข้อมูลเกินความจำเป็น ให้เลือกตัดฟิลด์ที่ไม่จำเป็นออก (data minimisation)","ถ้าผู้ใช้ขอถอนความยินยอมหรือขอลบข้อมูล ให้ระบบหยุดใช้ตามวัตถุประสงค์นั้นและบันทึกการถอนไว้","ถ้าถามเรื่องการเข้ารหัสให้ตอบทั้ง in transit (TLS) และ at rest (เข้ารหัส storage/DB/backup) ไม่ใช่อย่างใดอย่างหนึ่ง"],"pitfalls":["คิดว่าเข้ารหัสอย่างเดียวคือปฏิบัติตาม PDPA ครบ: ยังต้องมี consent/ฐานทางกฎหมาย วัตถุประสงค์ การลบเมื่อหมดความจำเป็น และการตอบสนองสิทธิของเจ้าของข้อมูล","คิดว่าการ hash ทำให้ข้อมูลเป็น anonymous: hash ของค่าที่มีรูปแบบจำกัด (เลขบัตร เบอร์โทร) brute force ได้ จึงยังเป็นข้อมูลส่วนบุคคล","เก็บข้อมูลไว้ก่อนเผื่อได้ใช้: ขัดกับ data minimisation และ retention","ใช้ consent ที่ติ๊กไว้ล่วงหน้าหรือรวมกับข้อตกลงอื่น: ไม่ถือว่าเป็นความยินยอมที่ชัดเจน"],"example":{"lang":"typescript","code":"// masking ก่อนแสดงผลหรือเขียน log (เลขบัตร 13 หลัก)\nfunction maskNationalId(id: string): string {\n  return id.replace(/^(\\d)\\d{8}(\\d{4})$/, '$1-xxxx-xxxxx-$2');\n}\n\n// บันทึกหลักฐาน consent และการถอน\ninterface ConsentRecord {\n  userId: string;\n  purpose: string;       // เช่น 'marketing-email'\n  grantedAt: Date;\n  withdrawnAt?: Date;\n  policyVersion: string;\n}"}},{"descriptor":"J4","competency":"Application Security","title":"เครื่องมือ Security Scanning (SAST, SCA, secret scan)","summary":"การสแกนอัตโนมัติช่วยพบช่องโหว่ตั้งแต่ช่วงพัฒนาก่อนขึ้น production นักพัฒนาต้องรู้ว่าเครื่องมือแต่ละประเภทตรวจอะไร และรู้วิธีอ่านผลอย่างมีเหตุผล","keyPoints":["SAST (Static Application Security Testing) วิเคราะห์ซอร์สโค้ดโดยไม่ต้องรันแอป หาแพตเทิร์นช่องโหว่ เช่น SQL injection, การใช้ crypto ผิด ตัวอย่างเครื่องมือ: SonarQube, Semgrep, CodeQL","DAST (Dynamic Application Security Testing) ทดสอบแอปที่กำลังรันจากภายนอกเหมือนผู้โจมตี ตัวอย่าง: OWASP ZAP จับปัญหา runtime/config ที่ SAST มองไม่เห็น","SCA (Software Composition Analysis) ตรวจ dependency ที่ใช้ว่ามีช่องโหว่ที่ทราบแล้ว (CVE) หรือไม่ ตัวอย่าง: `npm audit`, Dependabot, OWASP Dependency-Check, Snyk","Secret scanning หา credential/API key ที่หลุดเข้า repo ตัวอย่าง: gitleaks, TruffleHog, GitHub secret scanning ควรทำทั้งตอน commit (pre-commit) และใน CI","ถ้าเจอ secret หลุดใน repo ต้อง revoke/rotate key ทันทีเป็นอันดับแรก เพราะลบจาก commit ล่าสุดไม่พอ history และ clone ที่มีอยู่ยังมีค่านั้นอยู่ แล้วค่อยล้างประวัติและตรวจ log การใช้งาน","ใส่การสแกนใน CI/CD pipeline (shift-left) เช่น SAST + SCA + secret scan ทุก pull request และตั้ง quality gate ให้ build fail เมื่อพบระดับ severity ที่กำหนด (เช่น High/Critical)","ผลสแกนมี false positive: ต้อง triage ตรวจว่าโค้ดช่วงนั้นเข้าถึงได้จริงหรือไม่ ปรับ severity ตามบริบท และบันทึกเหตุผลเมื่อ suppress ไม่ใช่ปิด rule ทิ้งทั้งหมด","การแก้ SCA: อัปเกรดเป็นเวอร์ชันที่แก้แล้ว (patch/minor ก่อน) แล้วรัน test เพื่อดู regression ถ้ายังไม่มี fix ให้พิจารณา workaround หรือทางเลือกอื่น","เครื่องมือสแกนไม่ครอบคลุมทุกอย่าง เช่น business logic flaw และ authorization ที่ผิดตามบริบทมักต้องใช้ code review หรือ manual testing"],"examFocus":["ถ้าต้องการตรวจซอร์สโค้ดระหว่าง pull request โดยไม่ต้อง deploy ให้เลือก SAST","ถ้ารายงานบอกว่า library ที่ใช้มี CVE ให้เลือก SCA และอัปเกรดเวอร์ชันพร้อมรัน test","ถ้า secret scanner พบ API key ใน commit ให้ rotate/revoke key ก่อน ไม่ใช่แค่ลบบรรทัดแล้ว commit ใหม่","ถ้าถามว่าควรใส่การสแกนตรงไหน ให้ตอบใน CI pipeline อัตโนมัติทุก PR/build พร้อม gate","ถ้าผลสแกนมีจำนวนมาก ให้จัดลำดับตาม severity, ความสามารถเข้าถึงจริง และ asset ที่เกี่ยวข้อง แล้วตรวจว่าเป็น false positive หรือไม่"],"pitfalls":["เชื่อว่าสแกนผ่านแปลว่าปลอดภัย: scanner ตรวจได้เฉพาะแพตเทิร์นที่รู้จัก ช่องโหว่ business logic ต้องทดสอบด้วยวิธีอื่น","ลบ secret จากไฟล์แล้วจบ: ค่านั้นยังอยู่ใน git history และต้องถือว่าถูกเปิดเผยแล้ว","ปิด scanner หรือ suppress ทั้งหมดเพราะ false positive เยอะ: ควรจูนและ triage เป็นรายกรณีแทน","ใช้ DAST แทน SAST (หรือกลับกัน): สองแบบเสริมกัน ไม่ได้แทนกัน"],"example":{"lang":"yaml","code":"# GitHub Actions: สแกน dependency และ secret ทุก pull request\nname: security\non: [pull_request]\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with: { fetch-depth: 0 }\n      - run: npm ci\n      # ล้มเหลวเมื่อพบช่องโหว่ระดับ high ขึ้นไป\n      - run: npm audit --audit-level=high"}},{"descriptor":"J5","competency":"Application Security","title":"Secure Coding Guidelines ที่ต้องทำตามเป็นนิสัย","summary":"Secure coding guideline คือชุดแนวปฏิบัติพื้นฐานที่ลดช่องโหว่ตั้งแต่การเขียนโค้ด เช่น การจัดการ secret, error, log และสิทธิ์ โดยหลักคือ deny by default และไม่เชื่อถืออินพุต","keyPoints":["ห้าม hardcode secret (API key, password, private key) ในซอร์สหรือแอปมือถือ เพราะ decompile ได้ ให้เก็บใน secret manager/environment ที่ inject ตอน runtime และเรียก API ที่ใช้ key ผ่าน backend ของเราแทน","Error handling: ส่ง generic error message ให้ client (เช่น `Something went wrong` พร้อม correlation id) ห้ามส่ง stack trace, SQL error, path ภายใน หรือเวอร์ชันซอฟต์แวร์ ส่วนรายละเอียดให้บันทึกใน server log","Logging: ห้ามบันทึก password, token, เลขบัตร, ข้อมูลส่วนบุคคลที่ไม่จำเป็นลง log ใช้ masking และป้องกัน log injection (ล้าง newline จากอินพุต)","Least privilege: บัญชี DB ของแอปควรมีสิทธิ์เท่าที่จำเป็น (เช่น SELECT/INSERT/UPDATE บางตาราง) ไม่ใช้ root/dbo/admin และแยกบัญชีตามหน้าที่","Fail closed (fail secure): เมื่อการตรวจสิทธิ์เกิด exception หรือ timeout ให้ปฏิเสธการเข้าถึง ไม่ใช่ปล่อยผ่าน","Input validation แบบ allowlist (positive validation) ที่ฝั่ง server: กำหนดชนิด ความยาว รูปแบบ ช่วงค่าที่ยอมรับ ดีกว่า blacklist และ validate ตั้งแต่จุดเข้า ควบคู่กับ output encoding ที่จุดแสดงผล","TLS: ห้ามปิดการตรวจ certificate/hostname (เช่น trust-all, `rejectUnauthorized: false`) เพื่อให้ dev ผ่านง่าย เพราะเปิดช่อง man-in-the-middle","Defense in depth: ซ้อนหลายชั้นป้องกัน ไม่พึ่งการควบคุมชั้นเดียว และใช้ secure defaults (ปิดฟีเจอร์ที่ไม่ใช้ เปิดตัวเลือกที่ปลอดภัยเป็นค่าเริ่มต้น)","ไม่เขียน crypto เอง ใช้ไลบรารีมาตรฐานที่ผ่านการตรวจสอบ และใช้ CSPRNG (เช่น `crypto.randomBytes`) สำหรับค่าที่ต้องเดาไม่ได้"],"examFocus":["ถ้าแอปมือถือฝัง API key ของ third-party ไว้ในโค้ด ให้ย้ายไปเรียกผ่าน backend ที่ถือ key และจำกัดสิทธิ์ของ key","ถ้า API คืน stack trace ให้ผู้ใช้ ให้เปลี่ยนเป็น generic error และบันทึกรายละเอียดฝั่ง server","ถ้าเจอ log ที่มี token หรือรหัสผ่าน ให้เอาออกหรือ mask และตรวจว่าใครเข้าถึง log ได้","ถ้า service ใช้ DB account ที่เป็น admin ให้เปลี่ยนเป็นบัญชีสิทธิ์น้อยที่สุดที่ทำงานได้","ถ้า authorization check เกิด error ให้ default เป็น deny (fail closed)"],"pitfalls":["เก็บ secret ในแอปมือถือโดย obfuscate: ยังถูกดึงออกได้ ไม่ใช่การเก็บอย่างปลอดภัย","ปิดการตรวจ TLS certificate ชั่วคราวแล้วลืมเอาออก: ขึ้น production แล้วเปิดช่อง MITM","ส่ง error รายละเอียดให้ผู้ใช้เพื่อให้ debug ง่าย: เป็นการเปิดเผยข้อมูลภายในให้ผู้โจมตี","คิดว่า validate ที่ UI พอ: ต้องทำซ้ำที่ server เสมอ"],"example":{"lang":"typescript","code":"// fail closed + generic error\nasync function canAccess(user, resourceId): Promise<boolean> {\n  try {\n    return await policy.check(user, resourceId);\n  } catch (err) {\n    logger.error({ err, resourceId }, 'authz check failed'); // ไม่ log token\n    return false; // เกิดข้อผิดพลาด = ปฏิเสธ\n  }\n}\n\napp.use((err, req, res, next) => {\n  logger.error({ err, reqId: req.id });\n  res.status(500).json({ error: 'Internal error', ref: req.id });\n});"}}],"senior":[{"descriptor":"S1","competency":"Security Controls Implementation","title":"Security Controls: encryption, JWT, audit logging","summary":"งานระดับ senior คือเลือกและ implement control ให้ครบทั้งระบบ ทั้งการเข้ารหัส การจัดการ key การยืนยัน JWT และ audit log ที่เชื่อถือได้ รวมถึงเข้าใจ trade-off ของแต่ละทางเลือก","keyPoints":["ตรวจ JWT ให้ครบ: verify signature ด้วย algorithm ที่ server กำหนดเอง (ไม่เชื่อ `alg` ใน header, ปฏิเสธ `none`), ตรวจ `exp`, `nbf`, `iss`, `aud` และระวัง algorithm confusion (HS256 กับ RS256 โดยใช้ public key เป็น secret)","JWT ที่เซ็นแล้วเป็น JWS ไม่ได้เข้ารหัส payload อ่านได้ด้วย base64url จึงห้ามใส่ข้อมูลลับ ใช้ access token อายุสั้นและ revoke ยากจึงต้องออกแบบคู่กับ refresh token / deny list เมื่อจำเป็น","Asymmetric signing (RS256/ES256): service ที่ออก token เก็บ private key ส่วน resource server ใช้เฉพาะ public key ผ่าน JWKS endpoint ที่ระบุด้วย `kid` เพื่อรองรับ key rotation โดยไม่ต้องแชร์ secret ให้ทุก service","Envelope encryption: ใช้ data key (DEK) เข้ารหัสข้อมูล และใช้ key encryption key (KEK) ใน KMS/HSM ห่อ DEK ทำให้ rotate KEK ได้โดยไม่ต้อง re-encrypt ข้อมูลทั้งหมด แยก key ออกจากข้อมูลและ backup","ใช้ authenticated encryption (AES-GCM หรือ ChaCha20-Poly1305) และห้ามใช้ nonce/IV ซ้ำกับ key เดิมสำหรับ GCM; ห้ามคิด mode/อัลกอริทึมเอง","Password hash migration: เมื่อเปลี่ยนจากอัลกอริทึมเก่าเป็น Argon2id/bcrypt ที่แรงกว่า ให้ re-hash ตอนผู้ใช้ login สำเร็จ (ที่มีรหัสผ่านจริง) หรือ wrap hash เก่าด้วย hash ใหม่ แล้วทำเครื่องหมายเวอร์ชัน/อัลกอริทึมไว้ใน record","Traffic ภายในก็ต้อง TLS (ไม่ไว้ใจเครือข่ายภายใน) พิจารณา mTLS ระหว่าง service ส่วน certificate pinning บนมือถือ: ลดความเสี่ยง CA ที่ถูกโจมตี/MITM แต่แลกกับความเสี่ยง outage เมื่อ cert เปลี่ยน ควร pin public key (SPKI) ไม่ใช่ leaf cert, มี backup pin และกลไกอัปเดต; ผู้โจมตีที่คุมเครื่อง (root/jailbreak) ยัง bypass ได้","Audit log: บันทึก who / what / when / where / outcome ของเหตุการณ์สำคัญ (login, เปลี่ยนสิทธิ์, เข้าถึงข้อมูลอ่อนไหว) แต่ห้ามบันทึกข้อมูลลับหรือ PII เกินจำเป็น ใช้เวลาที่ซิงก์กันและส่งรวมศูนย์","Integrity ของ audit log: ผู้ดูแลระบบทั่วไปไม่ควรแก้/ลบได้ ใช้ append-only หรือ WORM storage, hash chain / การเซ็นต่อเนื่อง และส่งออกไปยังระบบแยกต่างหากเพื่อตรวจจับการแก้ไข","Token บนมือถือเก็บใน Keychain / Android Keystore และใช้ biometric ควบคุมการเข้าถึง key"],"examFocus":["ถ้าถามว่า API ต้องตรวจอะไรบ้างเมื่อรับ JWT ให้ตอบ signature + algorithm ที่คาดหวัง + exp + iss + aud ไม่ใช่แค่ decode แล้วเชื่อ claim","ถ้ามีหลาย microservice ที่ต้อง verify token ให้เลือก asymmetric signing + JWKS แทนการแชร์ shared secret","ถ้าต้องการ rotate key เข้ารหัสข้อมูลจำนวนมาก ให้เลือก envelope encryption กับ KMS","ถ้ามีการเปลี่ยนอัลกอริทึม hash รหัสผ่าน ให้ re-hash ตอนล็อกอิน ไม่ใช่บังคับรีเซ็ตทุกคนทันทีเป็นคำตอบแรก","ถ้าถามเรื่อง certificate pinning ให้ชั่งทั้งประโยชน์ (กัน MITM) และต้นทุน (rotation, outage, bypass ได้ในเครื่องที่ถูกควบคุม)","ถ้า audit log เก็บ token หรือข้อมูลส่วนบุคคลเต็ม ให้ mask/ตัดออก และปกป้อง integrity ของ log"],"pitfalls":["เชื่อ `alg` ใน JWT header: ผู้โจมตีเปลี่ยนเป็น `none` หรือสลับ algorithm ได้ ต้องกำหนด algorithm ฝั่ง server","คิดว่า JWT เข้ารหัสข้อมูลแล้ว: payload เพียงถูกเซ็น ไม่ได้ถูกซ่อน","เก็บ encryption key ไว้ในที่เดียวกับข้อมูลที่เข้ารหัส: เท่ากับไม่ได้ป้องกัน","เข้ารหัสแล้วปล่อยให้ audit log แก้ไขได้: log ที่ไม่มี integrity ใช้เป็นหลักฐานไม่ได้"],"example":{"lang":"typescript","code":"import { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst JWKS = createRemoteJWKSet(\n  new URL('https://auth.example.com/.well-known/jwks.json')\n);\n\nexport async function verifyAccessToken(token: string) {\n  const { payload } = await jwtVerify(token, JWKS, {\n    issuer: 'https://auth.example.com',\n    audience: 'orders-api',\n    algorithms: ['RS256'], // กำหนดเอง ไม่เชื่อ header\n  });\n  return payload; // exp / nbf ถูกตรวจให้แล้ว\n}"}},{"descriptor":"S2","competency":"Authentication and Authorization","title":"AuthN/AuthZ ขั้นสูง: RBAC, OAuth, SAML, MFA","summary":"ระบบสิทธิ์ที่ดีต้องตรวจระดับ object และ function ที่ server, ใช้ OAuth/SAML ให้ถูก flow และผูก MFA กับกระบวนการกู้คืนบัญชีอย่างรัดกุม เพราะจุดอ่อนมักอยู่ที่รายละเอียดและเส้นทางสำรอง","keyPoints":["Object-level authorization (กัน IDOR/BOLA): ทุก request ที่อ้าง resource ด้วย id ต้องตรวจว่า principal มีสิทธิ์กับ object นั้นจริงที่ server การมี role ที่ถูกต้องอย่างเดียวไม่พอ และระวัง mass assignment ที่ทำให้ยกระดับสิทธิ์ได้เมื่อรับฟิลด์ `role` จาก request body เข้า model ต้องใช้ allowlist ของฟิลด์ที่แก้ได้","RBAC ผูกสิทธิ์กับ role ส่วน ABAC ตัดสินจาก attribute (เช่น แผนก เวลา ความเป็นเจ้าของ) ควรใช้ least privilege และ separation of duties เช่น ผู้ขอกับผู้อนุมัติต้องเป็นคนละคน ห้ามให้ role เดียวทำครบวงจรที่เสี่ยง","OAuth 2.0: user-facing app ใช้ Authorization Code + PKCE, service-to-service ใช้ Client Credentials; OIDC เพิ่ม ID token สำหรับยืนยันตัวตน (authentication) ส่วน access token ใช้เข้าถึง API (authorization) แยกหน้าที่กัน","Refresh token rotation: ออก refresh token ใหม่ทุกครั้งที่ใช้ และทำ reuse detection หากเห็น refresh token เก่าถูกใช้ซ้ำ ให้ revoke ทั้ง token family เพราะแปลว่าอาจถูกขโมย","SPA: การเก็บ token ใน `localStorage` เสี่ยงต่อ XSS แนวทางที่ปลอดภัยกว่าคือ BFF (Backend for Frontend) ที่เก็บ token ฝั่ง server และให้ browser ถือแค่ session cookie แบบ HttpOnly","SAML assertion validation: ตรวจลายเซ็น XML ของ response/assertion ด้วย cert ของ IdP ที่ไว้ใจ, ตรวจ `Issuer`, `Audience`, `Recipient`, `NotBefore`/`NotOnOrAfter`, `InResponseTo` และกัน replay ด้วยการจำ assertion ID; ระวัง XML signature wrapping และใช้ไลบรารีที่ผ่านการตรวจสอบ","MFA: เรียงความแข็งแรงโดยทั่วไป FIDO2/WebAuthn (passkey, security key) ซึ่งต้านฟิชชิ่งได้ ดีกว่า TOTP และ push; SMS OTP อ่อนสุด (SIM swap, ดักข้อความ); push ต้องระวัง MFA fatigue (กดอนุมัติเพราะรำคาญ) ควรใช้ number matching","MFA recovery เป็นจุดอ่อนที่โจมตีบ่อย: backup code ต้องสุ่ม ใช้ได้ครั้งเดียว เก็บแบบ hash และการรีเซ็ต MFA ต้องยืนยันตัวตนเข้มเท่ากับ factor ที่ทดแทน","Session fixation: ต้องสร้าง session id ใหม่ (regenerate) หลัง login สำเร็จและเมื่อสิทธิ์เปลี่ยน ไม่ใช้ session id ที่ผู้โจมตีกำหนดมาก่อน","Biometric บนมือถือ: server ต้องไม่เชื่อเพียงว่า client บอกว่า biometric ผ่าน ให้ใช้ key ที่ถูกปลดล็อกด้วย biometric เซ็น challenge จาก server แล้ว server ตรวจลายเซ็นกับ public key ที่ลงทะเบียนไว้"],"examFocus":["ถ้า user ธรรมดาเปลี่ยน id ใน path แล้วเข้าถึงข้อมูลของผู้อื่นได้ แม้ role ถูกต้อง ให้แก้ด้วย object-level check ที่ server","ถ้าถามวิธีป้องกันฟิชชิ่งสำหรับ MFA ให้เลือก FIDO2/WebAuthn ไม่ใช่ SMS OTP","ถ้าพบ refresh token เดิมถูกใช้ซ้ำหลังจากหมุนไปแล้ว ให้ revoke ทั้ง family และบังคับ login ใหม่","ถ้า SPA จะเก็บ token ให้เลือก BFF/HttpOnly cookie มากกว่า localStorage","ถ้าถาม SAML ให้ระบุการตรวจลายเซ็น, Audience, เวลา, InResponseTo และ replay","ถ้า flow การกู้คืนบัญชีทำให้ข้ามข้อกำหนด MFA ได้ ให้ชี้ว่าเป็นช่องโหว่และเสนอให้ recovery ต้องยืนยันตัวตนเข้มพอกัน"],"pitfalls":["ตรวจแค่ role แต่ไม่ตรวจ ownership ของ object: ทำให้เกิด BOLA/IDOR ถึงจะผ่าน RBAC แล้วก็ตาม","คิดว่า MFA ทุกแบบเท่ากัน: SMS และ push แบบกดอนุมัติเจอฟิชชิ่งและ fatigue attack ได้","เชื่อ assertion ที่ decode ได้โดยไม่ verify ลายเซ็น: เท่ากับให้ผู้โจมตีปลอมตัวได้","ใช้ session id เดิมต่อหลัง login: เปิดช่อง session fixation","ใช้ ID token เป็น access token เรียก API: ผิดจุดประสงค์ของ token"],"example":{"lang":"typescript","code":"// ตรวจ role (function-level) และ ownership (object-level)\napp.get('/invoices/:id', requireRole('billing'), async (req, res) => {\n  const inv = await repo.findById(req.params.id);\n  if (!inv || inv.tenantId !== req.user.tenantId) {\n    return res.sendStatus(404); // ไม่เปิดเผยว่ามี resource หรือไม่\n  }\n  res.json(toInvoiceDto(inv));\n});"}},{"descriptor":"S3","competency":"Security Testing","title":"Security Testing และ Vulnerability Assessment","summary":"Senior ต้องวางแผนและเลือกวิธีทดสอบความปลอดภัยให้เหมาะกับความเสี่ยง ตั้งแต่ threat modeling, automated scanning, manual testing ไปจนถึงการจัดลำดับความสำคัญของช่องโหว่และการทำ pentest ตามขอบเขตที่ตกลง","keyPoints":["ชนิดการทดสอบ: SAST (ซอร์ส), DAST (แอปที่รัน), IAST (instrument ในระหว่างรัน), SCA (dependency), pentest (ผู้เชี่ยวชาญจำลองโจมตี) เครื่องมืออัตโนมัติจับช่องโหว่ที่รู้แพตเทิร์นได้ดี แต่ไม่ครอบคลุมทุกอย่าง","Business logic flaw (เช่น ข้ามขั้นตอนชำระเงิน ใช้คูปองซ้ำ race condition) scanner จับได้ยาก ต้องทดสอบด้วย abuse case / manual test จากความเข้าใจ workflow และกฎธุรกิจ","Threat modeling (เช่น STRIDE) ทำตั้งแต่ออกแบบ: ระบุ asset, trust boundary, ผู้โจมตี และ threat ต่อ data flow เช่น webhook ชำระเงินควรตรวจลายเซ็น (HMAC) ของผู้ส่ง ตรวจ timestamp กัน replay และทำ idempotency ไม่ไว้ใจเพียง IP","การจัดลำดับ vulnerability (triage) ใช้หลายปัจจัยร่วมกัน: CVSS severity, exploitability (มี exploit จริงหรือไม่ เช่น ดู EPSS หรือ CISA KEV), การเข้าถึงได้จากภายนอก, ความสำคัญของ asset/ข้อมูล และ compensating control ไม่ใช้ CVSS อย่างเดียว","DAST แบบ authenticated: ต้องตั้งค่าให้สแกนหลัง login (session/token handling, หลายบทบาทผู้ใช้) มิฉะนั้นจะทดสอบได้แค่หน้า public และพลาดฟังก์ชันส่วนใหญ่","Pentest ต้องมี Rules of Engagement ที่ชัดเจน: ขอบเขต (in/out of scope), การอนุญาตเป็นลายลักษณ์อักษร, ช่วงเวลา, ช่องทางติดต่อฉุกเฉิน, ข้อจำกัดของเทคนิค (เช่น ห้าม DoS) และการจัดการข้อมูลที่พบ","ทดสอบแอปมือถือ: ใช้แนวทาง OWASP MASVS/MASTG ตรวจ secret ใน binary (decompile), การเก็บข้อมูลในเครื่อง, TLS/pinning และ client-side check ที่ผู้โจมตีแก้ไข/bypass ได้ด้วยเครื่องมือเช่น Frida หรือ proxy (Burp Suite) ดังนั้นการตรวจที่สำคัญต้องอยู่ฝั่ง server","ผลลัพธ์ที่ดีต้องมี reproduction steps, impact, ระดับความเสี่ยง, และคำแนะนำแก้ไข แล้วทำ retest/regression test หลังแก้เพื่อยืนยันว่าปิดช่องจริงและไม่ทำให้ส่วนอื่นพัง","ฝังการทดสอบความปลอดภัยใน SDLC/CI อย่างต่อเนื่อง (shift-left) และเขียน security test case สำหรับช่องโหว่ที่เคยพบเพื่อกันกลับมาซ้ำ"],"examFocus":["ถ้าต้องทดสอบ business logic flaw ให้เลือก manual testing / abuse case ตาม workflow ไม่ใช่พึ่ง scanner อัตโนมัติอย่างเดียว","ถ้ามี finding จำนวนมาก ให้จัดลำดับด้วย severity + exploitability + exposure + business impact ก่อนวางแผนแก้","ถ้าพบ secret ใน binary แอปมือถือ ให้ถือว่ารั่วแล้ว rotate และย้ายการใช้ไปฝั่ง backend","ถ้าจะเริ่ม pentest ให้ตกลง scope และ rules of engagement เป็นลายลักษณ์อักษรก่อนลงมือ","ถ้า DAST ครอบคลุมน้อย ให้ตรวจว่าตั้งค่า authentication และหลาย role ครบหรือไม่","ถ้ามีการตรวจสิทธิ์เฉพาะใน client ให้ทดสอบโดยยิง request ตรงไปที่ API และสรุปว่าต้องย้ายไปตรวจที่ server"],"pitfalls":["จัดลำดับตาม CVSS เพียงอย่างเดียว: ช่องโหว่คะแนนสูงบน asset ที่เข้าถึงไม่ได้ อาจเร่งด่วนน้อยกว่าคะแนนกลางที่ถูกโจมตีจริงและเปิด public","เชื่อว่า scanner ผ่านทั้งหมดคือไม่มี logic flaw","เริ่ม pentest โดยไม่มีขอบเขตหรือการอนุญาต: เสี่ยงทั้งทางกฎหมายและกระทบระบบจริง","ถือว่า client-side check เป็น control: ผู้โจมตีแก้แอปหรือยิง API ตรงได้"]},{"descriptor":"S4","competency":"API Security","title":"API Security: validation, rate limit, token, WAF","summary":"API เป็นพื้นผิวโจมตีหลักของระบบสมัยใหม่ ต้องใช้ validation, authentication/authorization ระดับ object, rate limiting และชั้นป้องกันที่ gateway/WAF ร่วมกันแบบหลายชั้น","keyPoints":["OWASP API Security Top 10 (2023) ที่ควรรู้: BOLA (object-level authz), Broken Authentication, Broken Object Property Level Authorization, Unrestricted Resource Consumption, BFLA (function-level authz), Unrestricted Access to Sensitive Business Flows, SSRF, Security Misconfiguration, Improper Inventory Management, Unsafe Consumption of APIs","Input validation ที่ gateway/แอปด้วย schema (OpenAPI / JSON Schema): ตรวจ type, format, ความยาว, ช่วงค่า, จำนวน item, ขนาด body, Content-Type และจำกัด page size ปฏิเสธฟิลด์ที่ไม่รู้จัก; ค่า sort/filter ที่ต่อเข้า query ต้องผ่าน allowlist","Rate limiting ป้องกัน brute force และ resource exhaustion ตอบ `429 Too Many Requests` พร้อม `Retry-After`; endpoint ที่เสี่ยง (login, OTP, reset password) ควรเข้มกว่าทั่วไป และจำกัดตามหลายมิติ (ต่อบัญชี, ต่อ IP, ต่อ API key)","Algorithm: fixed window ง่ายแต่มี burst ที่ขอบ window, sliding window แม่นกว่า, token bucket อนุญาต burst ได้ตามความจุ bucket แล้วเติมด้วยอัตราคงที่ เลือกตามพฤติกรรมที่ต้องการ","Rate limit key: ห้ามเชื่อ `X-Forwarded-For` ที่ client ส่งมาตรงๆ เพราะปลอมได้ ให้เชื่อเฉพาะค่าที่ proxy/load balancer ของเราเติมและนับจากตำแหน่งที่ trusted หรือใช้ identity ที่ authenticate แล้ว","Token-based auth: ตรวจ signature, `exp`, `aud`, scope ทุก request; service/partner API ใช้ OAuth 2.0 Client Credentials พร้อม scope ที่แคบตามหลัก least privilege (หรือ mTLS) และ rotate client secret","API Gateway + WAF ทำงานหลายชั้น: gateway จัดการ authn, throttling, schema validation, routing; WAF กรองแพตเทิร์นโจมตีทั่วไป แต่ WAF ไม่ใช่ตัวแทนการ validate และ authorize ในแอป เพราะถูก bypass ได้และไม่เข้าใจ business context","CORS: อย่า reflect ค่า `Origin` ทุกค่ากลับมาพร้อม `Access-Control-Allow-Credentials: true`; `Access-Control-Allow-Origin: *` ใช้ร่วมกับ credentials ไม่ได้ ควรใช้ allowlist ของ origin ที่ไว้ใจ CORS ไม่ใช่กลไก authentication","SSRF ใน API ที่รับ URL: allowlist โดเมน/สกีม, resolve DNS แล้วตรวจ IP ปลายทาง (บล็อก private/loopback/link-local), ปิด redirect หรือตรวจซ้ำ, จำกัด egress ที่เครือข่าย","ส่งเฉพาะฟิลด์ที่จำเป็นใน response (กัน excessive data exposure) และจัดการ inventory ของ API (เวอร์ชันเก่า, endpoint ที่ลืมปิด)"],"examFocus":["ถ้า endpoint login/OTP ถูกยิงรัว ให้เลือก rate limit เข้มต่อบัญชีและ IP รวมกับ lockout/MFA/CAPTCHA ตามความเหมาะสม","ถ้า rate limit ใช้ IP จาก header `X-Forwarded-For` ที่ client ส่งเอง ให้ชี้ว่าถูก spoof ได้และแก้ด้วยการเชื่อเฉพาะ proxy ที่ trusted","ถ้าต้องการให้รองรับ burst สั้นๆ แต่จำกัดอัตราเฉลี่ย ให้เลือก token bucket","ถ้า partner เรียก API แบบ machine-to-machine ให้เลือก client credentials + scope ที่จำกัด","ถ้าบอกว่ามี WAF แล้วไม่ต้อง validate ในแอป ให้ปฏิเสธ เพราะต้องป้องกันหลายชั้น","ถ้า API เปิด CORS เป็นแบบสะท้อน origin พร้อม credentials ให้เปลี่ยนเป็น allowlist"],"pitfalls":["พึ่ง WAF อย่างเดียว: ถูก bypass ได้และไม่แก้ช่องโหว่ authorization/logic","ใช้ rate limit ต่อ IP อย่างเดียว: ผู้โจมตีกระจาย IP ได้ และผู้ใช้หลายคนหลัง NAT เดียวกันถูกจำกัดไปด้วย","ใช้ `*` หรือสะท้อน Origin กับ credentials: เปิดให้เว็บอื่นอ่านข้อมูลของผู้ใช้ที่ล็อกอินได้","ให้ client ส่งชื่อคอลัมน์สำหรับ sort แล้วต่อ query ตรง: เป็นช่องทาง SQL injection ต้อง allowlist"],"example":{"lang":"typescript","code":"// token bucket แบบย่อ: capacity = burst, refillPerSec = อัตราเฉลี่ย\nclass TokenBucket {\n  private tokens: number;\n  private last = Date.now();\n  constructor(private capacity: number, private refillPerSec: number) {\n    this.tokens = capacity;\n  }\n  allow(): boolean {\n    const now = Date.now();\n    const add = ((now - this.last) / 1000) * this.refillPerSec;\n    this.tokens = Math.min(this.capacity, this.tokens + add);\n    this.last = now;\n    if (this.tokens < 1) return false; // ตอบ 429\n    this.tokens -= 1;\n    return true;\n  }\n}"}},{"descriptor":"S5","competency":"Security Monitoring and Incident Response","title":"Security Monitoring และ Incident Response","summary":"เมื่อเกิดเหตุ ทีมต้องตรวจจับได้เร็ว ตอบสนองตามลำดับที่ถูก (จำกัดความเสียหายโดยไม่ทำลายหลักฐาน) แจ้งผู้เกี่ยวข้องตามกฎหมาย และนำบทเรียนกลับมาปรับปรุงระบบ","keyPoints":["วงจร incident response โดยทั่วไป: Preparation, Detection & Analysis, Containment, Eradication, Recovery, Post-incident activity (lessons learned) การเตรียมตัวล่วงหน้า (runbook, ช่องทางติดต่อ, บทบาท) ลดเวลาตอบสนองมาก","Credential รั่ว (เช่น API key ใน repo สาธารณะ): ขั้นแรกคือ revoke/rotate ทันที จากนั้นตรวจ log ว่ามีการใช้ค่านั้นหรือไม่ ประเมินขอบเขตความเสียหาย และตรวจหา secret อื่นที่เกี่ยวข้อง การลบจาก repo อย่างเดียวไม่พอ","Containment ต้องสมดุลกับการเก็บหลักฐาน: isolate เครื่อง/บัญชีที่เสียหาย (ตัดเครือข่าย, ปิดสิทธิ์) แต่เก็บ snapshot / log / memory ที่จำเป็นก่อนล้างหรือ rebuild เพื่อใช้สืบสวนและเป็นหลักฐาน พร้อมบันทึก chain of custody","การออกแบบ alert: เลือกสัญญาณที่ actionable และสัมพันธ์กับความเสี่ยงจริง (เช่น login ล้มเหลวจำนวนมากกระจายหลายบัญชี, สิทธิ์ถูกเปลี่ยน, เข้าถึงข้อมูลผิดปกติ) เพื่อลด alert fatigue วัดผลด้วย MTTD/MTTR และจูน false positive อย่างต่อเนื่อง","Credential stuffing: ลักษณะคือมีความพยายาม login จำนวนมากจากหลาย IP ต่อบัญชีจำนวนมาก (ใช้รหัสผ่านที่รั่วจากที่อื่น) ตอบสนองด้วย rate limit/bot detection, MFA, ตรวจรหัสผ่านที่เคยรั่ว, บังคับรีเซ็ตเฉพาะบัญชีที่ถูกยึด/เสี่ยง และแจ้งเตือนผู้ใช้","แอปมือถือเวอร์ชันมีช่องโหว่: ใช้กลไก minimum supported version ที่ server บังคับอัปเดต (forced update), ปิด endpoint/ฟีเจอร์เสี่ยงฝั่ง server ได้ทันทีระหว่างรอผู้ใช้อัปเดต เพราะแอปที่ติดตั้งแล้วแก้เองไม่ได้","Data breach ที่มีข้อมูลส่วนบุคคล: ประเมินขอบเขตและความเสี่ยงต่อเจ้าของข้อมูล แจ้ง สคส. (PDPC) ภายใน 72 ชั่วโมงนับแต่ทราบเหตุเท่าที่ทำได้ หากมีความเสี่ยง และแจ้งเจ้าของข้อมูลโดยไม่ชักช้าเมื่อมีความเสี่ยงสูง รวมถึงบันทึกเหตุการณ์และมาตรการแก้ไข","Telemetry / log / crash report ต้องไม่รวม PII และ secret: scrub หรือ mask ที่ต้นทางก่อนส่งออกไปยังเครื่องมือภายนอก เพราะระบบ monitoring เองก็เป็นแหล่งข้อมูลรั่วได้","Post-incident review แบบ blameless: ทำ timeline, หา root cause และ contributing factor, วัดว่าตรวจจับ/ตอบสนองช้าตรงไหน และออก action item ที่มีเจ้าของและกำหนดเวลา (เช่น ปรับ detection, แก้ช่องโหว่, ปรับ runbook, อบรม)","สื่อสารระหว่างเหตุ: กำหนด incident commander, ช่องทางสื่อสารที่ชัดเจน, อัปเดตผู้มีส่วนได้ส่วนเสียเป็นระยะ และแยกข้อเท็จจริงออกจากสมมติฐาน"],"examFocus":["ถ้าพบ credential หลุดสู่สาธารณะ ให้ rotate/revoke ก่อน แล้วตรวจ log การใช้งานและประเมินผลกระทบ","ถ้าต้อง contain เครื่องที่ถูกเจาะ ให้ isolate และเก็บหลักฐานก่อน rebuild ไม่ใช่ลบทิ้งทันที","ถ้าบัญชีผู้ใช้ถูกลองรหัสผ่านจำนวนมากจากหลาย IP ให้ระบุเป็น credential stuffing และเลือก rate limit + MFA + ตรวจรหัสผ่านที่รั่ว","ถ้าแอปมือถือเวอร์ชันเก่ามีช่องโหว่ ให้ใช้ forced update ร่วมกับปิดความเสี่ยงฝั่ง server","ถ้ามีข้อมูลส่วนบุคคลรั่ว ให้ระบุหน้าที่แจ้งหน่วยงานกำกับและเจ้าของข้อมูลตามเวลาที่กฎหมายกำหนด","ถ้าถามผลลัพธ์ของ post-incident review ให้ตอบ timeline, root cause, action item พร้อมเจ้าของ ไม่ใช่การหาคนผิด"],"pitfalls":["รีบ wipe/rebuild ก่อนเก็บหลักฐาน: เสียข้อมูลที่ใช้หา root cause และอาจใช้ทางกฎหมายไม่ได้","ลบ secret ออกจาก repo แล้วถือว่าจบ โดยไม่ rotate: ค่านั้นถูกเปิดเผยไปแล้ว","ตั้ง alert ทุกอย่างจน noise สูง: ทีมละเลย alert สำคัญ (alert fatigue)","ส่ง log/telemetry ที่มี PII ไปบริการภายนอกโดยไม่ scrub: สร้างการรั่วไหลใหม่"]}]}}</script>
<script>
/*
 * Scoring for one question. Pure function, no DOM, no Node-only APIs.
 * Loaded as a classic script in the browser (exposes window.ExamScoring)
 * and via require() from Node tests (module.exports).
 *
 * Rules (see the scoring table in the project context):
 *  - nothing selected                      -> 0
 *  - more options selected than correct    -> negative ? -penalty : 0
 *    (this overrides any partial credit)
 *  - otherwise                             -> right * max / k
 *                                             minus (negative only) wrong * penalty / k
 *    where k is the number of correct options.
 */
(function (root) {
  'use strict';

  function unique(list) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var key = String(list[i]);
      if (!seen[key]) {
        seen[key] = true;
        out.push(key);
      }
    }
    return out;
  }

  function clean(n) {
    // remove float noise and negative zero
    return Math.round(n * 1e6) / 1e6 + 0;
  }

  function scoreQuestion(question, selectedOptionIds, options) {
    var opts = options || {};
    var negative = Boolean(opts.negative);
    var max = opts.max === undefined ? 5 : opts.max;
    var penalty = opts.penalty === undefined ? 1 : opts.penalty;

    var correctIds = [];
    for (var i = 0; i < question.options.length; i++) {
      if (question.options[i].correct) correctIds.push(String(question.options[i].id));
    }
    var k = correctIds.length;
    if (k === 0) throw new Error('question ' + question.id + ' has no correct option');

    var selected = unique(selectedOptionIds || []);
    if (selected.length === 0) return 0;

    if (selected.length > k) return clean(negative ? -penalty : 0);

    var right = 0;
    for (var j = 0; j < selected.length; j++) {
      if (correctIds.indexOf(selected[j]) !== -1) right++;
    }
    var wrong = selected.length - right;

    var score = (right * max) / k;
    if (negative) score -= (wrong * penalty) / k;
    return clean(score);
  }

  var api = { scoreQuestion: scoreQuestion };
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.ExamScoring = api;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/*
 * Exam practice page. Classic script, inlined by build.mjs after scoring.js.
 * All text from question data is written with textContent / text nodes only.
 * No persistence, no network.
 */
(function () {
  'use strict';

  var Scoring = window.ExamScoring;
  var DATA = JSON.parse(document.getElementById('exam-data').textContent);
  var root = document.getElementById('app');

  var MAX = DATA.scorePerQuestion;
  var LEVEL_LABEL = { junior: 'Junior', senior: 'Senior' };
  var MODE_LABEL = { practice: 'โหมดซ้อม', exam: 'โหมดสอบจริง' };
  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  var state = {
    screen: 'start', // start | quiz | result
    setup: { level: 'junior', mode: 'practice', negative: false, minutes: '', minutesTouched: false },
    run: null,
  };
  var openDialog = null;

  // ------------------------------------------------------------ helpers

  function appendKids(node, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) {
      kid.forEach(function (k) { appendKids(node, k); });
    } else if (typeof kid === 'string' || typeof kid === 'number') {
      node.appendChild(document.createTextNode(String(kid)));
    } else {
      node.appendChild(kid);
    }
  }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'text') node.textContent = v;
        else if (k === 'class') node.className = v;
        else if (k === 'checked' || k === 'value') node[k] = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) appendKids(node, arguments[i]);
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function randInt(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      window.crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function fmt(n) {
    var r = Math.round(n * 100) / 100;
    return String(r === 0 ? 0 : r);
  }

  function fmtTime(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    var mm = (m < 10 ? '0' : '') + m;
    var ss = (s < 10 ? '0' : '') + s;
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function poolFor(mode) {
    return mode === 'exam' ? 'exam' : 'practice';
  }

  function poolSize(level, mode) {
    var lv = DATA.levels[level];
    return lv && lv[poolFor(mode)] ? lv[poolFor(mode)].length : 0;
  }

  function defaultMinutes(level) {
    return Math.max(1, Math.ceil((poolSize(level, 'exam') * DATA.secondsPerQuestion) / 60));
  }

  function pointsOf(run, item) {
    if (run.mode === 'practice' && !item.confirmed) return 0;
    return Scoring.scoreQuestion(item.q, item.selected, { negative: run.negative, max: MAX });
  }

  function isAnswered(run, item) {
    return run.mode === 'practice' ? item.confirmed : item.selected.length > 0;
  }

  // ------------------------------------------------------------ dialog

  function closeOpenDialog() {
    if (openDialog) openDialog.cancel();
  }

  function askConfirm(opts) {
    return new Promise(function (resolve) {
      closeOpenDialog();
      var previous = document.activeElement;
      var dlg = el('dialog', { class: 'dlg', 'aria-labelledby': 'dlg-title' });
      var settled = false;

      function done(value) {
        if (settled) return;
        settled = true;
        openDialog = null;
        try { dlg.close(); } catch (e) { /* not open */ }
        if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
        if (previous && previous.focus && document.contains(previous)) previous.focus();
        resolve(value);
      }

      var cancelBtn = el('button', { type: 'button', class: 'btn', text: opts.cancel || 'ยกเลิก', onclick: function () { done(false); } });
      var okBtn = el('button', { type: 'button', class: 'btn primary', text: opts.ok || 'ตกลง', onclick: function () { done(true); } });
      dlg.appendChild(el('h2', { id: 'dlg-title', text: opts.title }));
      (opts.message || []).forEach(function (line) { dlg.appendChild(el('p', { text: line })); });
      dlg.appendChild(el('div', { class: 'row' }, cancelBtn, okBtn));

  // ---- focus mode: one card at a time

  var FC_LABEL = { sum: 'สรุป', key: 'ประเด็น', ex: 'ถ้าโจทย์ถาม', pit: 'กับดัก' };
  var focusKeysOn = false;

  function buildDeck(level, topics) {
    var deck = [];
    topics.forEach(function (t) {
      var cs = [];
      if (t.summary) cs.push({ type: 'sum', text: t.summary, i: 0 });
      t.keyPoints.forEach(function (x, i) { cs.push({ type: 'key', text: x, i: i }); });
      t.examFocus.forEach(function (x, i) { cs.push({ type: 'ex', text: x, i: i, qa: splitQA(x) }); });
      t.pitfalls.forEach(function (x, i) { cs.push({ type: 'pit', text: x, i: i }); });
      cs.forEach(function (c) { c.t = t; c.level = level; });
      deck = deck.concat(cs);

    return numberDeck(deck);
  }

  // pos / count = position of a card among the cards of the same topic that are in this deck
  function numberDeck(deck) {
    var counts = {};
    var seen = {};
    deck.forEach(function (c) { counts[c.t.domId] = (counts[c.t.domId] || 0) + 1; });
    deck.forEach(function (c) {
      seen[c.t.domId] = (seen[c.t.domId] || 0) + 1;
      c.pos = seen[c.t.domId];
      c.count = counts[c.t.domId];
    });
    return deck;
  }

  function startFocus(level, topics, startId) {
    var deck = buildDeck(level, topics);
    if (!deck.length) return;
    var idx = 0;
    for (var i = 0; i < deck.length; i++) {
      if (deck[i].t.domId === startId) { idx = i; break; }
    }
    state.focus = { level: level, base: deck, deck: deck, index: idx, revealed: false, weak: false, api: null };
    state.screen = 'focus';
    render();
  }

  function leaveFocus() {
    var f = state.focus;
    var c = f && (f.deck[f.index] || f.deck[f.deck.length - 1]);
    reviewUI.scrollTo = c ? c.t.domId : null;
    state.focus = null;
    state.screen = 'review';
    render();
  }

  function onFocusKey(e) {

    var tag = tg && tg.tagName;

    else if (e.key === 'ArrowLeft') { e.preventDefault(); f.api.prev(); }

  function syncFocusKeys() {

      document.removeEventListener('keydown', onFocusKey);
      focusKeysOn = false;
    }

    var barText = el('p', { class: 'fc-prog-text muted small' });

    var nextBtn = el('button', { type: 'button', class: 'btn primary fc-big', onclick: function () { next(); } });

    function current() { return f.deck[f.index] || null; }
    function go(i) {
      f.index = Math.max(0, Math.min(f.deck.length, i));
      f.revealed = false;
      update(true, '');
    }
    function next() { if (f.index < f.deck.length) go(f.index + 1); }
    function prev() { if (f.index > 0) go(f.index - 1); }
    function canReveal() { var c = current(); return !!(c && c.qa && !f.revealed); }
    function reveal() {

    }
    function mark(c, v) {

    function markOf(c) { return storeGet(markKey(c.level, c.t.id, c.i)); }

    function restart() {

      f.weak = false;
      f.index = 0;

      if (quiz.length) {

      }

  // Read-only preview links for screenshots (#review, #review-open, #focus, #focus-ex, #focus-ex-open); any other hash is ignored.
  function previewHook() {

  function startRun(level, mode, opts) {

    if (mode === 'exam') startTimer(state.run);

  // ------------------------------------------------------------ timer

  function startTimer(run) {
    run.endsAt = Date.now() + run.minutes * 60000;
    [300, 60].forEach(function (mark) {
      if (run.minutes * 60 <= mark) run.announced[mark] = true; // do not announce a mark the exam never passes
    });
    tick();
    run.timer = setInterval(tick, 250);
  }

  function stopTimer() {
    if (state.run && state.run.timer) {
      clearInterval(state.run.timer);
      state.run.timer = null;
    }
  }

  function tick() {
    var run = state.run;
    if (!run || run.mode !== 'exam' || run.submitted || state.screen !== 'quiz' || !run.endsAt) return;
    var left = run.endsAt - Date.now();
    if (left <= 0) {
      finishExam(true);
      return;
    }
    if (run.ui.timerEl) {
      run.ui.timerEl.textContent = 'เหลือเวลา ' + fmtTime(left);
      run.ui.timerEl.className = left <= 60000 ? 'timer low' : 'timer';
    }
    if (run.bannerUntil && Date.now() >= run.bannerUntil) hideTimeBanner(run);
    var secs = Math.ceil(left / 1000);
    [300, 60].forEach(function (mark) {
      if (secs <= mark && !run.announced[mark] && run.ui.liveEl) {
        run.announced[mark] = true;
        var msg = 'เหลือเวลาอีก ' + (mark / 60) + ' นาที';
        run.ui.liveEl.textContent = msg; // screen readers
        showTimeBanner(run, msg, mark <= 60); // everyone else, inside the sticky header
      }
    });
  }

  // Non-blocking and hidden from assistive tech (the live region above already announces it).
  function showTimeBanner(run, msg, urgent) {
    var b = run.ui.bannerEl;
    if (!b) return;
    b.textContent = msg;
    b.className = urgent ? 'time-banner urgent' : 'time-banner';
    b.hidden = false;
    run.bannerUntil = Date.now() + 15000;
  }

  function hideTimeBanner(run) {
    run.bannerUntil = 0;
    if (run.ui.bannerEl) run.ui.bannerEl.hidden = true;
  }

  function onBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam' ? 'การสอบที่กำลังทำอยู่จะถูกยกเลิกและคำตอบทั้งหมดจะหายไป' : 'ความคืบหน้าของการซ้อมนี้จะหายไป'],

    }).then(function (yes) { if (yes && state.run === run && state.screen === 'quiz') goStart(); });
  }

  function updateScore() {

    var done = run.items.filter(function (i) { return i.confirmed; });
    var sum = 0;
    done.forEach(function (i) { sum += pointsOf(run, i); });
    run.ui.scoreEl.textContent = 'คะแนนสะสม ' + fmt(sum) + ' / ' + fmt(done.length * MAX) + ' (ตอบแล้ว ' + done.length + ' จาก ' + run.items.length + ' ข้อ)';

  function codeBlock(q) {
