  function interactiveOptions(item, number) {
    var run = state.run;
    var multi = item.q.type === 'multiple';
    var set = el('fieldset', { class: 'options' },
      el('legend', { class: 'sr-only', text: 'ตัวเลือกของข้อ ' + number + (multi ? ' (เลือกได้หลายข้อ)' : '') }));
    item.options.forEach(function (opt, i) {
      var input = el('input', {
        type: multi ? 'checkbox' : 'radio',
        name: 'opt-' + run.index,
        value: opt.id,
        checked: item.selected.indexOf(opt.id) !== -1,
        onchange: function () { onSelect(item, opt.id, input.checked); },
      });
      set.appendChild(el('label', { class: 'opt' },
        input,
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('span', { class: 'opt-body' }, el('span', { class: 'opt-text', text: opt.text }))));
    });
    return set;
  }

  function onSelect(item, id, checked) {
    if (item.q.type === 'multiple') {
      var at = item.selected.indexOf(id);
      if (checked && at === -1) item.selected.push(id);
      if (!checked && at !== -1) item.selected.splice(at, 1);
    } else {
      item.selected = checked ? [id] : [];
    }
    renderNav();
    renderPalette();
    syncLeaveGuard();
  }

  function staticOptions(item) {
    var wrap = el('div', { class: 'options' });
    item.options.forEach(function (opt, i) {
      var isSel = item.selected.indexOf(opt.id) !== -1;
      var cls = 'opt' + (opt.correct ? ' is-correct' : (isSel ? ' is-wrong' : ''));
      wrap.appendChild(el('div', { class: cls },
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('div', { class: 'opt-body' },
          el('div', { class: 'opt-text', text: opt.text }),
          el('div', { class: 'tags' },
            el('span', { class: 'tag ' + (opt.correct ? 'ok' : 'bad'), text: opt.correct ? '✓ ถูก' : '✗ ผิด' }),
            isSel ? el('span', { class: 'tag sel', text: 'คุณเลือกข้อนี้' }) : null),
          el('p', { class: 'why' }, el('strong', { text: 'เหตุผล: ' }), opt.why))));
    });
    return wrap;
  }

  function pointsLine(points, answered) {
    var cls = 'points' + (points > 0 ? ' pos' : (points < 0 ? ' neg' : ''));
    return el('p', { class: cls, text: (answered ? '' : 'ไม่ได้ตอบ · ') + 'ได้ ' + fmt(points) + ' จาก ' + MAX + ' คะแนน' });
  }

  function renderQuestion(focusTarget) {
    var run = state.run;
    var item = run.items[run.index];
    var q = item.q;
    var number = run.index + 1;
    var card = run.ui.card;
    var showFeedback = run.mode === 'practice' && item.confirmed;
    clear(card);

    var title = el('h2', { class: 'qtitle', id: 'qtitle', tabindex: '-1', text: 'ข้อ ' + number + ' จาก ' + run.items.length });
    card.appendChild(title);
    if (q.type === 'multiple') card.appendChild(el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }));
    card.appendChild(el('p', { class: 'stem', text: q.stem }));
    if (q.code) card.appendChild(codeBlock(q));
    card.appendChild(showFeedback ? staticOptions(item) : interactiveOptions(item, number));

    var feedback = null;
    if (showFeedback) {
      feedback = el('div', { class: 'feedback', id: 'feedback', tabindex: '-1' },
        el('h3', { text: 'ผลของข้อนี้' }),
        pointsLine(pointsOf(run, item), true),
        el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), q.explanation));
      card.appendChild(feedback);
    }
    if (focusTarget === 'feedback' && feedback) feedback.focus();
    else if (focusTarget === 'title') title.focus();
  }

  function button(label, opts) {
    return el('button', {
      type: 'button',
      id: opts.id || null,
      class: 'btn' + (opts.primary ? ' primary' : ''),
      text: label,
      disabled: opts.disabled,
      'aria-pressed': opts.pressed === undefined ? null : String(opts.pressed),
      onclick: opts.onclick,
    });
  }

  function goTo(index) {
    var run = state.run;
    if (index < 0 || index >= run.items.length) return;
    run.index = index;
    renderQuestion('title');
    renderNav();
    renderPalette();
  }

  function renderNav() {
    var run = state.run;
    var item = run.items[run.index];
    var nav = run.ui.nav;
    clear(nav);
    var last = run.index === run.items.length - 1;
    nav.appendChild(button('← ข้อก่อนหน้า', { disabled: run.index === 0, onclick: function () { goTo(run.index - 1); } }));
    if (run.mode === 'practice') {
      if (!item.confirmed) {
        nav.appendChild(button('ยืนยันคำตอบ', { primary: true, disabled: item.selected.length === 0, onclick: confirmAnswer }));
      }
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('จบและดูผลสรุป', { onclick: finishPractice }));
    } else {
      nav.appendChild(button('⚑ ติดธงทบทวน', {
        id: 'flag-btn',
        pressed: item.flagged,
        onclick: function () {
          item.flagged = !item.flagged;
          renderNav();
          renderPalette();
          document.getElementById('flag-btn').focus();
        },
      }));
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('ส่งข้อสอบ', { primary: true, onclick: requestSubmit }));
    }
  }

  function renderPalette() {
    var run = state.run;
    var box = run.ui.palette;
    if (!box) return;
    clear(box);
    var grid = el('div', { class: 'palette' });
    run.items.forEach(function (item, i) {
      var answered = item.selected.length > 0;
      var cls = 'pal' + (answered ? ' answered' : '') + (item.flagged ? ' flagged' : '') + (i === run.index ? ' current' : '');
      var label = 'ข้อ ' + (i + 1) + (answered ? ' ตอบแล้ว' : ' ยังไม่ตอบ') + (item.flagged ? ' ติดธงทบทวน' : '');
      grid.appendChild(el('button', {
        type: 'button', class: cls, text: String(i + 1), 'aria-label': label,
        'aria-current': i === run.index ? 'true' : null,
        onclick: function () { goTo(i); },
      }));
    });
    var answeredCount = run.items.filter(function (i) { return i.selected.length > 0; }).length;
    var flaggedCount = run.items.filter(function (i) { return i.flagged; }).length;
    box.appendChild(el('h2', { class: 'small', text: 'แผงเลือกข้อ · ตอบแล้ว ' + answeredCount + ' จาก ' + run.items.length + ' ข้อ · ติดธง ' + flaggedCount + ' ข้อ' }));
    box.appendChild(grid);
    box.appendChild(el('div', { class: 'legend' },
      el('span', { text: 'สีทึบ = ตอบแล้ว' }),
      el('span', { text: 'ขอบอย่างเดียว = ยังไม่ตอบ' }),
      el('span', { text: '⚑ = ติดธงทบทวน' })));
  }

  // ------------------------------------------------------------ practice actions

  function confirmAnswer() {
    var run = state.run;
    var item = run.items[run.index];
    if (item.confirmed || item.selected.length === 0) return;
    item.confirmed = true;
    renderQuestion('feedback');
    renderNav();
    updateScore();
  }

  function finishPractice() {
    var run = state.run;
    var open = run.items.filter(function (i) { return !i.confirmed; }).length;
    function go() {
      if (state.run !== run) return;
      run.submitted = true;
      state.screen = 'result';
      render();
    }
    if (open === 0) {
      go();
      return;
    }
    askConfirm({
      title: 'จบการซ้อมและดูผลสรุป?',
      message: ['ยังไม่ได้ยืนยันคำตอบ ' + open + ' ข้อ ข้อเหล่านี้จะนับเป็น 0 คะแนน'],
      ok: 'จบและดูผล',
      cancel: 'ซ้อมต่อ',
    }).then(function (yes) { if (yes) go(); });
  }

  // ------------------------------------------------------------ exam actions

  function requestSubmit() {
    var run = state.run;
    var unanswered = run.items.filter(function (i) { return i.selected.length === 0; }).length;
    var flagged = run.items.filter(function (i) { return i.flagged; }).length;
    var lines = [unanswered > 0 ? 'ยังไม่ได้ตอบ ' + unanswered + ' ข้อ ข้อที่ไม่ตอบจะได้ 0 คะแนน' : 'ตอบครบทุกข้อแล้ว'];
    if (flagged > 0) lines.push('มี ' + flagged + ' ข้อที่ติดธงไว้ทบทวน');
    lines.push('เมื่อส่งแล้วจะแก้คำตอบไม่ได้');
    askConfirm({ title: 'ส่งข้อสอบ?', message: lines, ok: 'ส่งข้อสอบ', cancel: 'กลับไปทำต่อ' })
      .then(function (yes) { if (yes && state.run === run) finishExam(false); });
  }

  function finishExam(auto) {
    var run = state.run;
    if (!run || run.submitted) return;
    run.submitted = true;
    run.auto = !!auto;
    stopTimer();
    closeOpenDialog();
    state.screen = 'result';
    render();
  }

  // ------------------------------------------------------------ result screen

  // Groups the score by competency when the data defines competencies, otherwise by descriptor.
  function breakdown(run) {
    var byCompetency = Array.isArray(DATA.competencies) && DATA.competencies.length > 0;
    var map = {};
    var order = [];
    run.items.forEach(function (item) {
      var d = byCompetency ? (item.q.competency || '-') : (item.q.descriptor || '-');
      if (!map[d]) {
        map[d] = { code: d, count: 0, answered: 0, points: 0, max: 0 };
        order.push(d);
      }
      map[d].count++;
      map[d].max += MAX;
      map[d].points += pointsOf(run, item);
      if (isAnswered(run, item)) map[d].answered++;
    });
    var known = byCompetency ? DATA.competencies : Object.keys(DATA.descriptorNames || {});
    order.sort(function (a, b) {
      var ia = known.indexOf(a);
      var ib = known.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    return order.map(function (d) { return map[d]; });
  }

  function renderResult() {
    var run = state.run;
    var total = 0;
    var answered = 0;
    run.items.forEach(function (item) {
      total += pointsOf(run, item);
      if (isAnswered(run, item)) answered++;
    });
    var max = run.items.length * MAX;
    var pct = max > 0 ? (total / max) * 100 : 0;

    var heading = el('h1', { id: 'result-title', tabindex: '-1', text: run.mode === 'exam' ? 'ผลสอบ' : 'สรุปผลการซ้อม' });
    root.appendChild(el('div', { class: 'topbar' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack }),
      el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] })));
    root.appendChild(heading);

    if (run.auto) {
      root.appendChild(el('div', { class: 'error', role: 'status', text: 'หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ' }));
    }
    root.appendChild(el('div', { class: 'card' },
      el('div', { class: 'big-score', text: fmt(total) + ' / ' + fmt(max) + ' คะแนน' }),
      el('p', { text: fmt(pct) + '% · ตอบแล้ว ' + answered + ' จาก ' + run.items.length + ' ข้อ' + (run.mode === 'exam' ? (run.negative ? ' · เปิดการหักคะแนน' : ' · ไม่หักคะแนน') : '') }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'btn primary', text: run.mode === 'exam' ? 'สอบใหม่ (สุ่มลำดับใหม่)' : 'ซ้อมอีกครั้ง', onclick: onResultRetake }))));

    var rows = breakdown(run).map(function (d) {
      var p = d.max > 0 ? (d.points / d.max) * 100 : 0;
      var name = Array.isArray(DATA.competencies) && DATA.competencies.length > 0
        ? d.code
        : ((DATA.descriptorNames && DATA.descriptorNames[d.code]) || '');
      var bar = el('div', { class: 'bar', 'aria-hidden': 'true' }, el('span'));
      bar.firstChild.style.width = Math.max(0, Math.min(100, p)) + '%';
      return el('div', { class: 'desc-row' },
        el('div', null, el('strong', { text: name || d.code })),
        el('div', { class: 'small', text: 'คะแนน ' + fmt(d.points) + ' / ' + fmt(d.max) + ' (' + fmt(p) + '%) · ตอบแล้ว ' + d.answered + ' จาก ' + d.count + ' ข้อ' }),
        bar);
    });
    root.appendChild(el('section', { class: 'card', 'aria-labelledby': 'breakdown-title' },
      el('h2', { id: 'breakdown-title', text: 'คะแนนแยกตามหัวข้อ' }),
      rows));

    if (run.mode === 'exam') {
      root.appendChild(el('h2', { text: 'ทบทวนทุกข้อ (ตามลำดับที่ทำ)' }));
      run.items.forEach(function (item, i) {
        var answeredItem = item.selected.length > 0;
        var pts = pointsOf(run, item);
        root.appendChild(el('article', { class: 'review-item' + (answeredItem ? '' : ' unanswered') },
          el('h3', null, 'ข้อ ' + (i + 1) + ' ',
            answeredItem ? null : el('span', { class: 'tag warn', text: 'ไม่ได้ตอบ' }), ' ',
            item.flagged ? el('span', { class: 'tag', text: '⚑ ติดธง' }) : null),
          item.q.type === 'multiple' ? el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }) : null,
          el('p', { class: 'stem', text: item.q.stem }),
          item.q.code ? codeBlock(item.q) : null,
          staticOptions(item),
          el('div', { class: 'feedback' },
            pointsLine(pts, answeredItem),
            el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), item.q.explanation))));
      });
    }

    root.appendChild(el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack })));
    heading.focus();
  }

  // Leaving the result screen throws the review away, so both exits ask first.
  function onResultBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam'
        ? 'ผลสอบและการทบทวนเฉลยทุกข้อในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'
        : 'สรุปผลการซ้อมในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'],
      ok: 'กลับหน้าแรก',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'result') goStart(); });
  }

  function onResultRetake() {
    var run = state.run;
    var exam = run.mode === 'exam';
    askConfirm({
      title: exam ? 'สอบใหม่?' : 'ซ้อมอีกครั้ง?',
      message: exam
        ? ['ผลสอบและการทบทวนเฉลยของรอบนี้จะหายไป', 'ระบบจะเริ่มจับเวลา ' + run.minutes + ' นาทีทันที และสุ่มลำดับข้อใหม่']
        : ['สรุปผลการซ้อมรอบนี้จะหายไป และเริ่มซ้อมรอบใหม่ทันที'],
      ok: exam ? 'เริ่มสอบใหม่' : 'เริ่มซ้อมใหม่',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) {
      if (yes && state.run === run && state.screen === 'result') startRun(run.level, run.mode, { negative: run.negative, minutes: run.minutes });
    });
  }

  render();
  previewHook();
})();

</script>
</body>
