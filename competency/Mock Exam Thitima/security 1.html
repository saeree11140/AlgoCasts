,"text":"ตั้งค่าสถานะ is_deleted = true ในตารางลูกค้า เพื่อซ่อนข้อมูลออกจากระบบ","correct":false,"why":"ข้อมูลยังอยู่ครบในฐานข้อมูลและ backup แค่ซ่อนจากหน้าจอ ไม่ใช่การลบจริง"}],"explanation":"ข้อมูลส่วนบุคคลควรเก็บเท่าที่จำเป็นต่อวัตถุประสงค์ เมื่อหมดความจำเป็นต้องลบหรือทำให้ไม่สามารถระบุตัวตนได้จริง รวมถึงในสำเนาและ backup ตามรอบที่กำหนด ควรมีนโยบายระยะเวลาเก็บที่ชัดเจนและตรวจสอบได้"},{"id":"SEC-J-E-015","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J3","concept":"consent-withdrawal-and-record","mobile":false,"type":"multiple","stem":"ระบบ newsletter ของเว็บขอความยินยอมให้ส่งอีเมลข่าวสารตอนสมัคร ข้อใดเป็นแนวปฏิบัติที่ดีเกี่ยวกับการให้และถอนความยินยอม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้ผู้ใช้ถอนความยินยอมได้ง่ายเท่ากับตอนให้ เช่น ลิงก์ยกเลิกในอีเมล","correct":true,"why":"ถูกต้อง ถ้าถอนยากกว่าตอนให้ ผู้ใช้ก็ไม่ได้ควบคุมข้อมูลของตนจริง"},{"id":"B","text":"ให้ผู้ใช้ถอนความยินยอมโดยโทรหา call center ในเวลาทำการเท่านั้น","correct":false,"why":"ช่องทางที่ยากกว่าตอนให้ความยินยอมมาก ขัดกับการให้ผู้ใช้ถอนได้ง่าย"},{"id":"C","text":"บันทึกว่าใครให้ความยินยอม เมื่อใด และเพื่อวัตถุประสงค์อะไร เก็บไว้เป็นหลักฐาน","correct":true,"why":"ถูกต้อง พิสูจน์ได้ว่ามีความยินยอมจริงและตรวจสอบย้อนหลังได้"},{"id":"D","text":"ติ๊กช่องยอมรับไว้ล่วงหน้า (pre-ticked) ให้ผู้ใช้กดสมัครได้เร็วขึ้น","correct":false,"why":"ผู้ใช้ไม่ได้ตัดสินใจเอง ความยินยอมควรเกิดจากการกระทำที่ชัดเจนของผู้ใช้"}],"explanation":"ความยินยอมต้องเป็นอิสระ เฉพาะเจาะจง และถอนได้ง่าย ผู้ควบคุมข้อมูลควรเก็บบันทึกการให้ความยินยอมไว้และเมื่อมีการถอน ต้องหยุดใช้ข้อมูลตามวัตถุประสงค์นั้น"},{"id":"SEC-J-E-016","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J4","concept":"secret-scanner-leaked-key-rotate","mobile":false,"type":"single","stem":"secret scanner ใน CI พบ API key ของบริการ cloud ที่ถูก commit เข้า repo เมื่อสามเดือนก่อน นักพัฒนาเสนอให้ลบบรรทัดนั้นแล้ว commit ใหม่ คุณควรทำอะไรก่อน","options":[{"id":"A","text":"ลบบรรทัดนั้นแล้ว commit ใหม่ก็พอ เพราะโค้ดเวอร์ชันล่าสุดไม่มี key อยู่แล้ว","correct":false,"why":"key ยังอยู่ในประวัติ git และใครที่ clone ไปแล้วมีสำเนาอยู่ ต้องถือว่ารั่วไปแล้ว"},{"id":"B","text":"เปลี่ยน repo เป็น private แล้วปล่อยไว้","correct":false,"why":"คนที่เคยเข้าถึง repo ตอนเป็น public หรือมีสำเนาไว้แล้วยังมี key อยู่ การปิด repo ไม่ทำให้ key หมดอายุ"},{"id":"C","text":"ปล่อยไว้ก่อน ถ้ายังไม่พบการใช้ key ผิดปกติในบันทึกของ cloud","correct":false,"why":"ไม่พบร่องรอยไม่ได้แปลว่าไม่ถูกใช้ และ key ที่รั่วเป็นความเสี่ยงต่อเนื่อง"},{"id":"D","text":"เพิกถอน (revoke) key แล้วออกใหม่ทันที จากนั้นค่อยทำความสะอาด git history","correct":true,"why":"ถูกต้อง ทำให้ key ที่รั่วใช้ไม่ได้ก่อนเป็นขั้นแรก"}],"explanation":"Secret ที่เคยอยู่ใน repo ถือว่าถูกเปิดเผยแล้ว ขั้นแรกคือ rotate/revoke ให้ key เดิมใช้ไม่ได้ จากนั้นตรวจบันทึกการใช้งานย้อนหลัง ลบจากประวัติถ้าทำได้ และย้ายไปเก็บใน secret manager พร้อมตั้ง pre-commit scan ป้องกันซ้ำ"},{"id":"SEC-J-E-017","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J4","concept":"security-scan-in-ci-pipeline","mobile":false,"type":"multiple","stem":"ทีมต้องการเพิ่มการสแกนความปลอดภัยเข้าไปใน CI pipeline ของ repo ที่มีนักพัฒนาหลายคน ข้อใดเป็นแนวทางที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"รันสแกนปีละครั้งก่อนการตรวจประเมินจากหน่วยงานภายนอก","correct":false,"why":"ช่องโหว่ที่เกิดระหว่างปีจะไม่ถูกพบจนถึงรอบสแกน ควรสแกนต่อเนื่องทุกการเปลี่ยนแปลง"},{"id":"B","text":"รัน SAST และ SCA ทุกครั้งที่เปิด pull request","correct":true,"why":"ถูกต้อง พบปัญหาตั้งแต่ก่อน merge ซึ่งแก้ได้ถูกกว่าตอนอยู่บน production"},{"id":"C","text":"ตั้งให้ pipeline แสดง warning ของผลสแกนอย่างเดียว โดยไม่ให้ build ล้มไม่ว่าจะพบช่องโหว่ระดับใด","correct":false,"why":"warning ที่ไม่มีเกณฑ์บังคับมักถูกมองข้าม ช่องโหว่ระดับ critical จึงหลุดเข้า production ได้โดยไม่มีใครต้องรับผิดชอบ"},{"id":"D","text":"ให้ build ไม่ผ่านเมื่อพบช่องโหว่ระดับ high หรือ critical เว้นแต่มีการยกเว้นที่ผ่านการ review และบันทึกเหตุผล","correct":true,"why":"ถูกต้อง มีเกณฑ์ชัดและไม่ถูกข้ามโดยไม่มีหลักฐาน"},{"id":"E","text":"มอบหมายผู้รับผิดชอบและกำหนดเวลาแก้ให้แต่ละ finding ที่พบ","correct":true,"why":"ถูกต้อง ทำให้ finding ไม่ถูกปล่อยค้างโดยไม่มีเจ้าของ"}],"explanation":"การสแกนมีประโยชน์เมื่อทำต่อเนื่องใน pipeline มีเกณฑ์ผ่าน/ไม่ผ่านที่ชัดเจน และมีเจ้าของรับผิดชอบ finding การแสดงแค่ warning หรือปิด rule เพื่อให้ผ่านเป็นการหลบปัญหา ส่วนการยกเว้นที่จำเป็นต้องมีเหตุผลและผู้อนุมัติ"},{"id":"SEC-J-E-018","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J5","concept":"fail-closed-authorization-error-handling","mobile":false,"type":"single","stem":"ฟังก์ชันตรวจสิทธิ์เปิดเอกสารด้านล่างทำงานได้ในวันปกติ แต่เมื่อบริการ ACL ล่ม ผู้ใช้ทุกคนกลับเปิดเอกสารลับได้ ปัญหาอยู่ที่ไหนและควรแก้อย่างไร","code":"async function canView(userId: string, docId: string): Promise\u003cboolean> {\n  try {\n    return await acl.check(userId, docId);\n  } catch (e) {\n    return true;\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"เพิ่มการ log error ใน catch และคงการคืนค่า true ไว้ เพื่อให้ทีมไล่ดูย้อนหลังได้ว่าใครเปิดเอกสารช่วงที่ ACL ล่ม","correct":false,"why":"การ log ช่วยตรวจย้อนหลังได้ แต่ไม่ได้ป้องกัน ระหว่างที่ ACL ล่มทุกคนยังเปิดเอกสารลับได้ และผู้โจมตีสร้างจังหวะให้ ACL ล่มหรือช้าได้"},{"id":"B","text":"catch คืนค่า true จึงอนุญาตเมื่อเกิดข้อผิดพลาด ควรปฏิเสธ (fail closed) และ log","correct":true,"why":"ถูกต้อง เมื่อตรวจสิทธิ์ไม่ได้ ต้องถือว่าไม่ได้รับอนุญาต"},{"id":"C","text":"ควรลองเรียก acl.check ซ้ำไม่จำกัดจำนวนครั้งจนกว่าจะสำเร็จก่อนจะตอบผู้ใช้","correct":false,"why":"ลองซ้ำไม่จำกัดทำให้ request ค้างและเปลือง resource โดยไม่ได้แก้ปัญหาเรื่องค่าที่คืน"},{"id":"D","text":"ควรให้ catch คืน true เฉพาะผู้ใช้ที่เป็นแอดมิน","correct":false,"why":"ยังอนุญาตโดยไม่ได้ตรวจกับ ACL จริง และบัญชีแอดมินที่ถูกยึดจะเข้าถึงทุกเอกสารได้"}],"explanation":"ระบบควบคุมสิทธิ์ต้องล้มเหลวในทิศทางที่ปลอดภัย (fail closed) เมื่อตรวจไม่ได้ให้ปฏิเสธ แล้วบันทึกและแจ้งเตือน ไม่ควรกลืน exception แล้วคืนค่าอนุญาตเป็นค่าเริ่มต้น"},{"id":"SEC-J-E-019","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J5","concept":"mobile-tls-certificate-validation","mobile":true,"type":"single","stem":"นักพัฒนาแอปมือถือเชื่อมต่อ staging ที่ใช้ใบรับรองแบบ self-signed ไม่ได้ จึงเพิ่มโค้ดให้แอป \"เชื่อใบรับรองทุกใบ\" แล้วเสนอให้คงโค้ดนี้ไว้ในแอปที่ปล่อยจริง ควรตัดสินใจอย่างไร","options":[{"id":"A","text":"คงไว้ได้ เพราะยังใช้ HTTPS อยู่ ข้อมูลยังถูกเข้ารหัสระหว่างทางตามปกติเหมือนเดิม","correct":false,"why":"ถ้าไม่ตรวจใบรับรอง ผู้โจมตีกลางทางปลอมตัวเป็น server ได้และอ่านข้อมูลทั้งหมด"},{"id":"B","text":"คงไว้ได้ แต่เขียน comment TODO ให้ลบโค้ดนี้ในภายหลังก่อนปล่อยเวอร์ชันถัดไป","correct":false,"why":"TODO ที่ไม่มีการบังคับมักถูกลืม และถ้าหลุดไปบน production ผู้ใช้ทุกคนก็เสี่ยง"},{"id":"C","text":"ไม่คงไว้ ใช้ใบรับรองจาก CA ที่เชื่อถือได้ หรือ trust ใบรับรองสำหรับ dev เฉพาะใน debug build","correct":true,"why":"ถูกต้อง ใน release ต้องตรวจใบรับรองครบเสมอ"},{"id":"D","text":"ไม่คงไว้ แต่ให้แอปตรวจแค่ว่าชื่อโดเมนในใบรับรองตรงกับ server โดยไม่ตรวจว่าใครเป็นผู้ออกใบรับรอง","correct":false,"why":"ผู้โจมตีออกใบรับรอง self-signed ที่ใส่ชื่อโดเมนเดียวกันขึ้นมาเองได้ เมื่อไม่ตรวจผู้ออก แอปก็ยังถูกดักข้อมูลแบบ man-in-the-middle"}],"explanation":"การปิดการตรวจใบรับรองทำให้ TLS ไม่ช่วยป้องกัน man-in-the-middle อีกต่อไป ใช้ใบรับรองที่ถูกต้องใน staging หรือ trust เฉพาะใน debug build และตั้ง lint/CI ตรวจไม่ให้โค้ดแบบนี้เข้า release"},{"id":"SEC-J-E-020","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J5","concept":"server-side-input-validation-allowlist","mobile":false,"type":"multiple","stem":"คุณกำลังเขียน API สมัครสมาชิกที่รับข้อมูลจากทั้งเว็บและแอปมือถือ ข้อใดสอดคล้องกับแนวปฏิบัติการตรวจสอบอินพุตที่ปลอดภัย (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจชนิด ความยาว และรูปแบบของทุกฟิลด์ที่ฝั่ง server ทุกครั้ง แม้ client จะตรวจมาแล้ว","correct":true,"why":"ถูกต้อง ผู้โจมตีเรียก API ตรงโดยไม่ผ่าน client ได้"},{"id":"B","text":"ตรวจที่แอปและเว็บก็พอ เพราะผู้ใช้ส่วนใหญ่ใช้แอปของเรา","correct":false,"why":"ผู้โจมตีไม่ใช้แอปของเรา เขาส่ง request เองได้ การตรวจฝั่ง client ไม่ใช่การป้องกัน"},{"id":"C","text":"กำหนดรูปแบบที่ยอมรับ (allowlist) เช่น เบอร์โทรต้องเป็นตัวเลข 10 หลัก แทนการไล่ห้ามอักขระที่คิดว่าอันตราย","correct":true,"why":"ถูกต้อง allowlist ปิดช่องที่นึกไม่ถึงได้ดีกว่า blacklist"},{"id":"D","text":"ข้อมูลที่มาจาก service ภายในข้ามการตรวจได้ เพราะอยู่ในเครือข่ายเดียวกัน","correct":false,"why":"service ภายในถูกเจาะหรือมีบั๊กได้ ข้อมูลที่ข้ามขอบเขตความไว้ใจควรถูกตรวจ"}],"explanation":"การ validate ที่เชื่อถือได้ต้องเกิดฝั่ง server เสมอ และควรใช้รูปแบบที่ยอมรับ (allowlist) การตรวจฝั่ง client เป็นเพียงประสบการณ์ผู้ใช้ และอย่าไว้ใจข้อมูลเพียงเพราะมาจากภายในระบบ"}]},"senior":{"practice":[{"id":"SEC-S-P-001","level":"senior","pool":"practice","competency":"Security Controls Implementation","descriptor":"S1","concept":"mobile-token-secure-storage","mobile":true,"type":"single","stem":"แอปมือถือร้านค้าออนไลน์เก็บ refresh token อายุ 30 วันไว้ในเครื่องเพื่อให้ผู้ใช้ไม่ต้องล็อกอินใหม่ทุกครั้ง ทีมพบว่าผู้ใช้บางส่วนใช้เครื่องที่ root/jailbreak และระบบสำรองข้อมูลของเครื่องอัปโหลดไฟล์ของแอปขึ้นคลาวด์อัตโนมัติ ควรเก็บ refresh token ไว้ที่ใดจึงเหมาะสมที่สุด","options":[{"id":"A","text":"เก็บใน preferences/settings ของแอปแบบ plaintext เพราะ sandbox ของระบบปฏิบัติการไม่ให้แอปอื่นอ่านไฟล์ของแอปเราอยู่แล้ว","correct":false,"why":"ผิด เพราะบนเครื่อง root/jailbreak sandbox ถูกข้ามได้ และไฟล์ plaintext ยังถูกรวมไปกับการสำรองข้อมูลขึ้นคลาวด์ด้วย"},{"id":"B","text":"เข้ารหัสด้วย AES แล้วเก็บเป็นไฟล์ในแอป โดยฝัง encryption key ไว้ในโค้ดของแอปเพื่อให้ถอดรหัสได้ตอนเปิดแอป","correct":false,"why":"ผิด เพราะ key ที่ฝังอยู่ในแอปถูกดึงออกจากไฟล์ติดตั้งได้ ผู้โจมตีจึงถอดรหัสได้เหมือนไม่ได้เข้ารหัสเลย"},{"id":"C","text":"เก็บใน Keychain บน iOS หรือเก็บแบบเข้ารหัสด้วยคีย์ที่อยู่ใน Android Keystore บน Android แบบผูกกับอุปกรณ์ และไม่รวมใน backup","correct":true,"why":"ถูก เพราะคีย์ถูกจัดการโดยระบบปฏิบัติการ ผูกกับเครื่อง และไม่หลุดไปกับ backup จึงลดความเสี่ยงได้ตรงกับเงื่อนไขในโจทย์ (Android Keystore เก็บคีย์ ไม่ได้เก็บ token โดยตรง จึงใช้คีย์นั้นเข้ารหัส token)"},{"id":"D","text":"ไม่เก็บ token ไว้ในเครื่องเลย ให้ผู้ใช้ล็อกอินใหม่ทุกครั้งที่เปิดแอป เพราะเป็นวิธีเดียวที่ไม่มีความเสี่ยงจากการเก็บ token ไว้บนเครื่องผู้ใช้เลย","correct":false,"why":"ผิด เพราะเป็นการแก้เกินเหตุที่ทำลายประสบการณ์ใช้งาน ผู้ใช้มักเปลี่ยนไปใช้รหัสผ่านง่ายๆ หรือจดไว้ ทั้งที่ secure storage ลดความเสี่ยงลงมาอยู่ในระดับยอมรับได้แล้ว"}],"explanation":"ข้อมูลที่ต้องเก็บถาวรบนเครื่องผู้ใช้ควรอยู่ในที่ที่ระบบปฏิบัติการดูแลให้ ไม่ใช่ไฟล์ธรรมดาหรือ key ที่ฝังในแอป เพราะทุกอย่างในไฟล์ติดตั้งและใน sandbox ถือว่าผู้โจมตีที่ควบคุมเครื่องเข้าถึงได้ ในการทำงานจริงควรเลือกที่เก็บที่ผูกกับอุปกรณ์ ตั้งไม่ให้ถูก backup และทำให้เพิกถอน token ได้ฝั่งเซิร์ฟเวอร์ควบคู่กัน"},{"id":"SEC-S-P-002","level":"senior","pool":"practice","competency":"Security Controls Implementation","descriptor":"S1","concept":"jwt-verification-checklist","mobile":false,"type":"multiple","stem":"API ของบริษัทรับ JWT ที่ออกโดย identity provider ภายนอกผ่าน header Authorization: Bearer ทีมกำลังเขียน middleware ตรวจ token ก่อนอนุญาตให้ request ผ่าน ข้อใดควรทำจริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เลือกอัลกอริทึมตรวจลายเซ็นตามค่า alg ที่ระบุใน header ของ token เพราะ token บอกวิธีตรวจที่ถูกต้องของตัวเองไว้แล้ว","correct":false,"why":"ผิด เพราะผู้โจมตีควบคุม header เองได้ (เช่น ตั้ง alg เป็น none หรือสลับเป็น HS256 โดยใช้ public key เป็น secret) เซิร์ฟเวอร์ต้องกำหนดอัลกอริทึมที่ยอมรับไว้ล่วงหน้า"},{"id":"B","text":"ตรวจลายเซ็นด้วย public key ของ issuer โดยกำหนดอัลกอริทึมที่ยอมรับไว้ล่วงหน้าฝั่งเซิร์ฟเวอร์","correct":true,"why":"ถูก เพราะการตรวจลายเซ็นด้วย key ที่เรากำหนดและอัลกอริทึมที่ล็อกไว้เป็นสิ่งเดียวที่พิสูจน์ว่า token ออกโดย issuer จริง"},{"id":"C","text":"decode payload แล้วอ่าน claim sub และ role ได้เลยโดยไม่ต้องตรวจลายเซ็น เพราะ request มาทาง HTTPS อยู่แล้ว","correct":false,"why":"ผิด เพราะ HTTPS ปกป้องเส้นทางส่งข้อมูลเท่านั้น ไม่ได้พิสูจน์ว่าใครเป็นผู้สร้าง token ใครก็สร้าง JWT ที่ payload ถูกต้องตามรูปแบบแล้วส่งมาทาง HTTPS ได้"},{"id":"D","text":"ตรวจ exp และตรวจว่า claim iss กับ aud ตรงกับ issuer ที่คาดไว้และ API ของเราเอง","correct":true,"why":"ถูก เพราะ token ที่หมดอายุ หรือถูกออกให้ audience อื่น ไม่ควรถูกใช้กับ API นี้ แม้ลายเซ็นจะถูกต้อง"},{"id":"E","text":"ดึง public key จาก JWKS ของ issuer ที่กำหนดไว้ล่วงหน้าในระบบ (แคชไว้และรองรับการหมุนเวียน key) ไม่ใช้ URL ที่ระบุใน header ของ token","correct":true,"why":"ถูก เพราะ header อย่าง jku หรือ x5u ชี้ไปที่ key ที่ผู้โจมตีเป็นเจ้าของได้ การเชื่อ URL ที่มากับ token ทำให้ลายเซ็นปลอมผ่านการตรวจ"}],"explanation":"การตรวจ JWT มีสามส่วนที่ขาดไม่ได้ คือยืนยันลายเซ็นด้วย key และอัลกอริทึมที่เรากำหนดเอง ตรวจ claim ที่ผูกกับบริบท (exp, iss, aud) และได้ key จากแหล่งที่เชื่อถือไว้ล่วงหน้า ทุกอย่างที่มาจาก token เองถือเป็นข้อมูลจากผู้โจมตีจนกว่าจะพิสูจน์ได้"},{"id":"SEC-S-P-003","level":"senior","pool":"practice","competency":"Security Controls Implementation","descriptor":"S1","concept":"audit-log-sensitive-data","mobile":false,"type":"single","stem":"ทีมต้องทำ audit log ให้ endpoint ค้นหาสมาชิกด้วยเลขบัตรประชาชน เพื่อให้ผู้ตรวจสอบภายในย้อนดูได้ว่าใครเข้าถึงข้อมูลสมาชิกรายใดเมื่อไร ตามนโยบาย PDPA ขององค์กร โค้ดด้านล่างมี log อยู่แล้ว แต่ผู้ตรวจสอบไม่ยอมรับ ควรปรับปรุงอย่างไร","code":"app.post('/api/members/lookup', requireAuth, async (req, res) => {\n  const member = await db.members.findByNationalId(req.body.nationalId);\n  logger.info('member lookup', { body: req.body, headers: req.headers, found: !!member });\n  res.json(member);\n});","codeLang":"typescript","options":[{"id":"A","text":"log เฉพาะผู้กระทำ (user id) การกระทำ ผลลัพธ์ เวลา IP ต้นทาง request id และตัวระบุ record ที่ปกปิดหรือเป็นรหัสภายใน ไม่ log body และ header ดิบ","correct":true,"why":"ถูก เพราะตอบคำถามว่าใคร ทำอะไร กับข้อมูลใด เมื่อไรได้ครบ โดยไม่สร้างสำเนาของเลขบัตรประชาชนและ token ไว้ในระบบ log"},{"id":"B","text":"เพิ่มการ log ทุก field ของ response ด้วย เพื่อให้สืบย้อนได้ครบว่ามีข้อมูลอะไรถูกส่งออกไปให้ผู้เรียกบ้าง ซึ่งผู้ตรวจต้องการเห็น","correct":false,"why":"ผิด เพราะ log จะกลายเป็นสำเนาข้อมูลส่วนบุคคลฉบับที่สอง ซึ่งขัดกับหลัก data minimisation และขยายพื้นที่เสี่ยงต่อการรั่ว"},{"id":"C","text":"คงรูปแบบ log เดิมไว้ทั้งหมด แต่จำกัดสิทธิ์อ่านไฟล์ log ให้เฉพาะทีม DevOps เพื่อป้องกันข้อมูลในไฟล์","correct":false,"why":"ผิด เพราะเลขบัตรและ token ใน header ยังอยู่ใน log และไม่มีข้อมูลว่าใครเป็นผู้เรียก ทีม DevOps ที่มีสิทธิ์อ่านก็จะเห็น Authorization token ได้"},{"id":"D","text":"เข้ารหัสไฟล์ log ทั้งไฟล์ด้วย key เดียวกับฐานข้อมูล แล้วเก็บไว้ในเซิร์ฟเวอร์เดียวกับแอป เพื่อป้องกันการอ่านโดยไม่ได้รับอนุญาต","correct":false,"why":"ผิด เพราะไม่ได้แก้ที่เนื้อหา log ที่มีข้อมูลละเอียดอ่อนและขาดผู้กระทำ ทั้งยังเก็บในเครื่องเดียวกับแอป ผู้ที่เจาะแอปได้ก็แก้ log และได้ key ไปด้วย"}],"explanation":"audit log ที่ดีบันทึกข้อเท็จจริงของเหตุการณ์ (ใคร ทำอะไร กับอะไร ผลเป็นอย่างไร) ไม่ใช่การคัดลอกข้อมูลทั้งหมดที่ผ่านระบบ การ log body และ header ดิบเป็นต้นเหตุยอดนิยมที่ทำให้รหัสผ่าน token และข้อมูลส่วนบุคคลไปอยู่ในระบบ log ที่คนเข้าถึงได้กว้างกว่าฐานข้อมูลจริง"},{"id":"SEC-S-P-004","level":"senior","pool":"practice","competency":"Security Controls Implementation","descriptor":"S1","concept":"encryption-at-rest-key-management","mobile":false,"type":"multiple","stem":"ฐานข้อมูลลูกค้าของบริษัทประกันเก็บเลขบัตรประชาชนและเบอร์โทร ทีมตัดสินใจเข้ารหัสระดับ column ด้วย AES-256-GCM ก่อนบันทึก ข้อใดคือแนวทางจัดการ key ที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เก็บ key ไว้ใน table config ของฐานข้อมูลเดียวกัน เพื่อให้ backup และ restore ได้ครบจบในที่เดียว และลดจำนวนระบบที่ต้องจัดการ","correct":false,"why":"ผิด เพราะใครได้ dump ของฐานข้อมูลไปก็ได้ทั้งข้อมูลที่เข้ารหัสและ key ที่ถอดรหัส การเข้ารหัสจึงไม่มีความหมาย"},{"id":"B","text":"เก็บ master key ไว้ใน KMS หรือ HSM ที่แยกจากฐานข้อมูล และให้แอปขอใช้ผ่านสิทธิ์ที่จำกัดและมีบันทึกการใช้งาน","correct":true,"why":"ถูก เพราะการแยก key ออกจากข้อมูลทำให้การรั่วของฐานข้อมูลอย่างเดียวไม่พอจะถอดรหัส และมี audit ว่าใครใช้ key เมื่อไร"},{"id":"C","text":"ใช้ key เดียวและ IV ค่าคงที่ทุก record เพื่อให้ค้นหาด้วยค่าที่เข้ารหัสแล้วได้โดยตรง","correct":false,"why":"ผิด เพราะการใช้ IV ซ้ำกับ key เดียวกันใน GCM ทำลายทั้งความลับและความถูกต้องของข้อมูล และค่าเหมือนกันจะได้ ciphertext เหมือนกันจนเดาแบบแผนได้"},{"id":"D","text":"ใช้ envelope encryption โดย data key ถูกห่อด้วย master key เพื่อหมุนเวียน master key ได้โดยไม่เข้ารหัสข้อมูลทั้งหมดใหม่","correct":true,"why":"ถูก เพราะ rotation ทำที่ชั้นของ master key ได้ด้วยการห่อ data key ใหม่ ข้อมูลจำนวนมากไม่ต้องถูกเข้ารหัสซ้ำ จึงทำได้จริงในงานจริง"}],"explanation":"การเข้ารหัสมีประโยชน์เมื่อ key แยกจากข้อมูลและบริหารได้ตลอดวงจรชีวิต ได้แก่ เก็บใน KMS/HSM หมุนเวียนได้ และจำกัดสิทธิ์พร้อมมีบันทึกการใช้ รูปแบบ envelope encryption เป็นวิธีมาตรฐานที่ทำให้การหมุนเวียน key ไม่กลายเป็นงานเข้ารหัสใหม่ทั้งฐานข้อมูล ส่วน nonce/IV ต้องไม่ซ้ำเมื่อใช้ key เดียวกัน"},{"id":"SEC-S-P-005","level":"senior","pool":"practice","competency":"Security Controls Implementation","descriptor":"S1","concept":"password-hash-migration","mobile":false,"type":"single","stem":"ระบบสมาชิกเก่าเก็บรหัสผ่านเป็น MD5 ไม่มี salt ของผู้ใช้ 2 ล้านบัญชี ทีมมีเงื่อนไขว่า (1) ไม่สามารถบังคับให้ทุกคนเปลี่ยนรหัสผ่านพร้อมกันได้ และ (2) ต้องลดความเสียหายหากฐานข้อมูลรั่วให้เร็วที่สุด ควรย้ายไปใช้ hash ที่ปลอดภัยด้วยวิธีใด","options":[{"id":"A","text":"นำค่า MD5 เดิมมา hash ซ้ำด้วย SHA-256 โดยไม่ใช้ salt ทันทีทุกบัญชี เพราะ SHA-256 ถือเป็นอัลกอริทึมที่แข็งแรงกว่า MD5","correct":false,"why":"ผิด เพราะ SHA-256 ที่ไม่มี salt เป็น hash ที่เร็วมาก ผู้โจมตีที่ได้ฐานข้อมูลยังเดารหัสผ่านได้เป็นพันล้านค่าต่อวินาที ผลต่างจาก MD5 น้อยมาก"},{"id":"B","text":"คง MD5 ไว้ก่อน แล้ว hash ใหม่ด้วย bcrypt ทีละคนเมื่อผู้ใช้ล็อกอินสำเร็จ ซึ่งไม่กระทบผู้ใช้เลยและตัดงานเขียนโค้ดย้ายข้อมูลแยกต่างหากออกไป","correct":false,"why":"ผิด เพราะบัญชีที่ไม่ได้ล็อกอินอีกเลยจะค้างเป็น MD5 ตลอดไป และช่วงที่ยังไม่ล็อกอินก็ยังเสี่ยงเต็มที่ ไม่ตอบเงื่อนไขข้อ (2)"},{"id":"C","text":"ส่งอีเมลให้ผู้ใช้ทุกคนตั้งรหัสผ่านใหม่ภายใน 7 วัน แล้วลบ hash MD5 ทิ้งทั้งหมดเมื่อครบกำหนด เพื่อให้ฐานข้อมูลสะอาดที่สุด","correct":false,"why":"ผิด เพราะขัดกับเงื่อนไขข้อ (1) โดยตรง ทำให้ผู้ใช้จำนวนมากถูกล็อกออก และอีเมลแบบนี้ยังเปิดช่องให้ฟิชชิ่งปลอมตัวได้ง่าย"},{"id":"D","text":"นำค่า MD5 เดิมไปผ่าน bcrypt หรือ argon2 พร้อม salt ทันทีทุกบัญชี แล้วเปลี่ยนเป็น hash ของรหัสผ่านจริงเมื่อผู้ใช้ล็อกอินครั้งถัดไป","correct":true,"why":"ถูก เพราะ hash ซ้อนทำให้ฐานข้อมูลปลอดภัยขึ้นทันทีโดยไม่ต้องรู้รหัสผ่านจริง และการอัปเกรดเป็น hash ของรหัสผ่านจริงตอนล็อกอินเก็บส่วนที่เหลือโดยไม่รบกวนผู้ใช้"}],"explanation":"เมื่อไม่สามารถกู้รหัสผ่านจริงได้ วิธีที่ทำให้ได้ทั้งความปลอดภัยทันทีและไม่กระทบผู้ใช้คือห่อ hash เดิมด้วย hash ช้าที่มี salt ก่อน แล้วค่อยอัปเกรดเมื่อมีโอกาสเห็นรหัสผ่านจริงตอนล็อกอิน การย้ายแบบรอผู้ใช้ล็อกอินอย่างเดียวทิ้งบัญชีที่ไม่ active ไว้เป็นช่องโหว่ถาวร"},{"id":"SEC-S-P-006","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"object-level-authorization-idor","mobile":false,"type":"single","stem":"หลังบ้านร้านค้าออนไลน์มี endpoint ดูรายละเอียดคำสั่งซื้อตามโค้ดด้านล่าง ผู้ทดสอบพบว่าลูกค้าคนหนึ่งเปลี่ยนเลข :id ในหน้าเว็บแล้วเห็นคำสั่งซื้อของลูกค้าคนอื่นได้ ผู้จัดการขอให้ปิดงานภายในสปรินต์นี้ด้วยการเปลี่ยน id เป็น UUID เพราะทำได้เร็วและไม่ต้องแก้ handler คุณในฐานะ senior เห็นว่าข้อใดคือการแก้ที่ตรงกับสาเหตุจริงมากที่สุด","code":"router.get('/api/orders/:id', requireAuth, requireRole('customer'), async (req, res) => {\n  const order = await db.orders.findById(req.params.id);\n  if (!order) return res.sendStatus(404);\n  res.json(order);\n});","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยน id ของคำสั่งซื้อจากตัวเลขเรียงลำดับเป็น UUID เพื่อให้เดาได้ยากขึ้น","correct":false,"why":"ผิด เพราะเป็นเพียงการปกปิด (obscurity) UUID ที่รั่วจาก log, อีเมล หรือ referrer ก็ยังเปิดดูคำสั่งซื้อของคนอื่นได้ เพราะ server ยังไม่ตรวจความเป็นเจ้าของ"},{"id":"B","text":"ตรวจฝั่งเซิร์ฟเวอร์ว่า order.customerId ตรงกับผู้ใช้ที่ล็อกอิน (หรือผู้ใช้มีสิทธิ์ระดับที่ดูได้ทุกคำสั่งซื้อ) ก่อนตอบกลับ","correct":true,"why":"ถูก เพราะช่องโหว่คือขาดการตรวจสิทธิ์ระดับ object (IDOR/BOLA) การตรวจความเป็นเจ้าของของ record ทุกครั้งที่เข้าถึงคือการแก้ที่ตรงจุด"},{"id":"C","text":"เพิ่ม rate limit ให้ endpoint นี้ เพื่อไม่ให้ผู้ใช้ไล่ดึงคำสั่งซื้อจำนวนมากต่อเนื่องกัน","correct":false,"why":"ผิด เพราะ rate limit ลดความเร็วของการโจมตี แต่ไม่ได้ทำให้การอ่านข้อมูลของคนอื่นเป็นสิ่งต้องห้าม ผู้โจมตียังดึงทีละรายการได้เรื่อยๆ"},{"id":"D","text":"ซ่อนลิงก์ไปยังคำสั่งซื้อของคนอื่นในหน้าเว็บ และตรวจ role เพิ่มเติมที่ฝั่ง frontend ด้วยอีกชั้นหนึ่ง","correct":false,"why":"ผิด เพราะผู้โจมตียิง request ตรงเข้า API ได้โดยไม่ผ่านหน้าเว็บ การตรวจฝั่ง client ไม่ใช่การควบคุมสิทธิ์"}],"explanation":"การมี role ที่ถูกต้อง (authentication และ role-level authorization) ไม่พอ ต้องตรวจด้วยว่าผู้ใช้คนนี้มีสิทธิ์กับ record นี้ด้วย ปัญหา IDOR/BOLA พบบ่อยที่สุดใน API จึงควรทำเป็นกลไกกลาง (เช่น query ที่กรองด้วย owner เสมอ) แทนการจำให้เขียนตรวจเองทุก endpoint"},{"id":"SEC-S-P-007","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"mobile-oauth-pkce","mobile":true,"type":"multiple","stem":"ทีมกำลังเพิ่มปุ่ม 'เข้าสู่ระบบด้วยบัญชีภายนอก' ในแอปมือถือผ่าน OAuth 2.0 / OpenID Connect กับ identity provider รายหนึ่ง แอปเป็น public client คือไม่มีที่เก็บความลับที่ผู้ใช้เปิดดูไม่ได้ ข้อใดคือแนวปฏิบัติที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ใช้ authorization code flow ร่วมกับ PKCE โดยสร้าง code verifier สุ่มใหม่ทุกครั้งที่ล็อกอิน","correct":true,"why":"ถูก เพราะ PKCE ผูก code ที่ได้กลับมากับ verifier ที่มีแต่แอปที่เริ่มคำขอ แอปอื่นที่ดัก redirect ไปได้ก็แลก token ไม่ได้"},{"id":"B","text":"ฝัง client secret ไว้ในแอปแบบ obfuscate เพื่อใช้แลก authorization code เป็น token","correct":false,"why":"ผิด เพราะ secret ในไฟล์ติดตั้งถูกดึงออกได้เสมอ public client จึงไม่ควรพึ่ง secret แต่ใช้ PKCE แทน"},{"id":"C","text":"เปิดหน้า login ผ่านเบราว์เซอร์ของระบบ (ไม่ใช่ WebView ที่แอปฝังและควบคุมเอง) เพื่อให้แอปมองไม่เห็นรหัสผ่านของผู้ใช้","correct":true,"why":"ถูก เพราะ WebView ในแอปทำให้แอปอ่านการกรอกข้อมูลได้ และผู้ใช้แยกหน้าจริงกับปลอมไม่ได้ เบราว์เซอร์ระบบแยกจากแอปและแชร์ session ของ provider ได้"},{"id":"D","text":"ใช้ implicit flow ให้ access token ส่งกลับมาใน redirect URL เพื่อลดจำนวนรอบการเรียกระหว่างแอปกับ provider","correct":false,"why":"ผิด เพราะ token ที่อยู่ใน URL ถูกแอปอื่นที่ลงทะเบียน scheme เดียวกัน หรือ log และ history อ่านได้ implicit flow เลิกแนะนำสำหรับ client แบบนี้แล้ว"},{"id":"E","text":"สร้างค่า state แบบสุ่มต่อคำขอและตรวจเมื่อ redirect กลับ พร้อมลงทะเบียน redirect URI ที่ตรงตัวกับ provider","correct":true,"why":"ถูก เพราะ state กัน login CSRF และ redirect URI ที่ตรงตัวกัน code ถูกส่งไปปลายทางที่ผู้โจมตีกำหนด"}],"explanation":"แอปมือถือเป็น public client ที่ซ่อน secret ไม่ได้ จึงต้องพึ่ง PKCE, เบราว์เซอร์ของระบบ และการตรวจ state/redirect URI อย่างเคร่งครัด ส่วน implicit flow และ secret ฝังในแอปคือแนวทางเก่าที่ถือว่าไม่ปลอดภัยพอ"},{"id":"SEC-S-P-008","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"mfa-phishing-resistant-factor","mobile":false,"type":"single","stem":"พนักงานฝ่ายการเงินของบริษัทถูกหลอกให้กรอก username รหัสผ่าน และรหัส OTP ที่ได้รับทาง SMS ลงในเว็บปลอมที่ทำเหมือนระบบ SSO แล้วผู้โจมตีนำไปล็อกอินเข้าระบบจริงทันทีแบบ real-time (adversary-in-the-middle) ทีมจะเลือก MFA แบบใดแทนจึงแก้ปัญหานี้ได้ตรงจุดที่สุด","options":[{"id":"A","text":"เปลี่ยน SMS OTP เป็น TOTP จากแอป authenticator เพราะ SIM swap เกิดขึ้นกับ TOTP ไม่ได้ จึงปลอดภัยกว่าแบบ SMS","correct":false,"why":"ผิด เพราะ TOTP ลดความเสี่ยง SIM swap แต่เว็บปลอมที่ proxy แบบ real-time ยังรับรหัส TOTP แล้วส่งต่อให้เว็บจริงทันทีในช่วง 30 วินาทีได้เหมือนเดิม"},{"id":"B","text":"เพิ่ม OTP เป็น 8 หลักและลดอายุรหัสเหลือ 30 วินาที เพื่อให้ผู้โจมตีมีเวลาน้อยลงมากในการนำไปใช้","correct":false,"why":"ผิด เพราะผู้โจมตีส่งต่อรหัสทันทีภายในไม่กี่วินาที ความยาวหรืออายุที่สั้นลงจึงไม่ช่วย ปัญหาคือผู้ใช้ส่งรหัสให้เว็บผิดโดเมน"},{"id":"C","text":"ใช้ passkey หรือ FIDO2 security key ที่ผูกกับโดเมนจริงของระบบ จึงไม่ตอบ challenge ให้เว็บปลอมคนละโดเมน","correct":true,"why":"ถูก เพราะ credential ของ WebAuthn ผูกกับโดเมนของระบบ (RP ID) เบราว์เซอร์จะไม่ลงนามให้เว็บปลอมคนละโดเมน จึงหลอกให้ผู้ใช้ส่งต่อไม่ได้แม้ผู้ใช้จะตั้งใจทำตาม"},{"id":"D","text":"ใช้ push notification ให้ผู้ใช้กดอนุมัติ (Approve) บนมือถือแทนการกรอกรหัส เพราะผู้ใช้ไม่ได้พิมพ์รหัสให้เว็บใดเห็น","correct":false,"why":"ผิด เพราะผู้โจมตีที่ proxy หน้าล็อกอินเป็นคนกระตุ้นให้ push ส่งมา ผู้ใช้ที่เชื่อว่ากำลังล็อกอินอยู่ก็กดอนุมัติเอง (หรือกดเพราะถูกรบกวนซ้ำๆ)"}],"explanation":"MFA ที่ผู้ใช้ต้องส่งรหัสหรือกดอนุมัติเองยังถูก relay ได้ ทางที่ตัดกลไกนี้คือปัจจัยที่ผูกกับโดเมนด้วยการเข้ารหัส เช่น passkey/FIDO2 ในการเลือก MFA ควรถามก่อนว่ากำลังป้องกันภัยแบบใด (SIM swap, ฟิชชิ่ง, การขโมยเครื่อง) เพราะแต่ละแบบแก้คนละปัญหา"},{"id":"SEC-S-P-009","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"saml-assertion-validation","mobile":false,"type":"multiple","stem":"บริษัทลูกค้าองค์กรขอให้ระบบ SaaS ของเรารองรับ SAML SSO ผ่าน IdP ของเขา ในฝั่ง Service Provider (SP) ข้อใดต้องตรวจก่อนสร้าง session ให้ผู้ใช้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจลายเซ็นดิจิทัลของ assertion (หรือของ response) ด้วย certificate ของ IdP ที่ตั้งค่าไว้ล่วงหน้า","correct":true,"why":"ถูก เพราะลายเซ็นคือสิ่งเดียวที่พิสูจน์ว่า assertion มาจาก IdP จริงและเนื้อหาไม่ถูกแก้ ถ้าไม่ตรวจ ใครก็ส่ง XML ที่อ้างตัวเป็นใครก็ได้"},{"id":"B","text":"ใช้ certificate ที่แนบมาใน XML ของ response เองตรวจลายเซ็น เพราะแนบมาพร้อมลายเซ็นอยู่แล้ว","correct":false,"why":"ผิด เพราะผู้โจมตีสร้าง certificate ของตัวเองแล้วเซ็นด้วยแล้วแนบมาก็ผ่านการตรวจ ต้องเทียบกับ certificate ที่เชื่อถือไว้ล่วงหน้าเท่านั้น"},{"id":"C","text":"ตรวจว่า Audience ตรงกับ entityID ของเรา และเวลาปัจจุบันยังอยู่ในช่วง NotBefore ถึง NotOnOrAfter","correct":true,"why":"ถูก เพราะ assertion ที่ออกให้ SP อื่น หรือหมดอายุแล้ว ไม่ควรถูกใช้ที่นี่ แม้ลายเซ็นจะถูกต้องก็ตาม"},{"id":"D","text":"ถ้า email ใน assertion ตรงกับบัญชีที่มีอยู่แล้ว ให้เชื่อมเข้าบัญชีนั้นทันทีโดยไม่ต้องตรวจเงื่อนไขอื่นซ้ำ","correct":false,"why":"ผิด เพราะข้ามการตรวจลายเซ็น Audience และเวลา ทำให้ผู้โจมตีที่ปลอมหรือเล่น assertion ซ้ำเข้าบัญชีผู้บริหารได้ด้วยการใช้ email เดียวกัน"},{"id":"E","text":"ป้องกัน replay โดยตรวจ InResponseTo ให้ตรงกับ request ที่เราสร้าง (กรณี SP-initiated) และไม่รับ assertion ID ที่เคยใช้แล้ว","correct":true,"why":"ถูก เพราะ response ที่ถูกดักไว้ ถ้าไม่มีการผูกกับ request และจำ ID ที่ใช้แล้ว ก็นำกลับมาใช้ล็อกอินซ้ำได้"}],"explanation":"SP ต้องไม่เชื่อสิ่งที่มากับ response เองเลย: ลายเซ็นต้องตรวจกับ certificate ที่ตั้งไว้ล่วงหน้า และเนื้อหา (Audience, ช่วงเวลา, InResponseTo, assertion ID) ต้องถูกตรวจเพื่อกันการนำ assertion ผิดผู้รับหรือหมดอายุมาใช้ ซึ่งเป็นรูปแบบช่องโหว่ที่พบบ่อยในการเชื่อม SSO"},{"id":"SEC-S-P-010","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"mass-assignment-role-escalation","mobile":false,"type":"single","stem":"แอปมีหน้าแก้ไขโปรไฟล์ที่ส่ง displayName กับ phone ไปยัง endpoint ด้านล่าง แต่ผู้ทดสอบแก้ request ให้ส่ง role เป็น admin ไปด้วย แล้วบัญชีของเขากลายเป็นแอดมิน ทีมเสนอให้แก้เร็วด้วยการลบ field role ใน handler นี้ แต่ตาราง users ยังมี field ด้านสิทธิ์อื่น และจะเพิ่ม field ใหม่ในไตรมาสหน้า ข้อใดแก้ได้ตรงปัญหาและยั่งยืนที่สุด","code":"router.patch('/api/users/me', requireAuth, async (req, res) => {\n  const user = await db.users.update(req.user.id, req.body);\n  res.json(user);\n});","codeLang":"typescript","options":[{"id":"A","text":"กำหนด allowlist ของ field ที่ผู้ใช้แก้เองได้ (DTO ที่มีเฉพาะ displayName กับ phone) และให้เปลี่ยน role ผ่าน endpoint แยกที่ตรวจสิทธิ์แอดมิน","correct":true,"why":"ถูก เพราะคุมที่ต้นเหตุคือการรับทุก field จาก client โดยตรง การระบุ field ที่ยอมรับแบบ allowlist ทำให้ field ใหม่ในอนาคตไม่เปิดช่องโดยอัตโนมัติ"},{"id":"B","text":"ตรวจใน handler ว่าถ้า body มี role เท่ากับ 'admin' ให้ลบ field role ทิ้งก่อนส่งไปอัปเดต และบันทึกความพยายามนั้นไว้ใน log","correct":false,"why":"ผิด เพราะเป็น blacklist ที่หลบง่าย ผู้โจมตีใช้ field อื่น เช่น isAdmin, permissions หรือเปลี่ยนค่า role เป็นสิทธิ์อื่นที่สูงกว่าผู้ใช้ทั่วไปได้"},{"id":"C","text":"ซ่อนช่อง role ออกจากฟอร์มใน frontend และเพิ่ม validation ในฟอร์มให้รับเฉพาะ displayName กับ phone","correct":false,"why":"ผิด เพราะผู้โจมตีส่ง request ตรงเข้า API หรือแก้ request ผ่าน proxy ได้ การตรวจเฉพาะฝั่ง client ไม่ใช่การป้องกัน"},{"id":"D","text":"เปลี่ยนจาก PATCH เป็น PUT เพื่อให้ client ต้องส่งทุก field ของผู้ใช้ ทำให้ role ถูกเขียนทับด้วยค่าเดิมเสมอทุกครั้งที่บันทึก และไม่เหลือ field ที่รับเพิ่มเติม","correct":false,"why":"ผิด เพราะ PUT ก็ยังเขียน field ที่ client ส่งมาตรงๆ ผู้โจมตีส่ง role เป็น admin ใน PUT ได้เหมือนเดิม ปัญหาไม่เกี่ยวกับ HTTP method"}],"explanation":"mass assignment เกิดเมื่อโค้ดผูก request body เข้ากับ model ทั้งก้อน ทางแก้คือรับเฉพาะ field ที่ตั้งใจเปิดแบบ allowlist และแยก action ที่ต้องมีสิทธิ์สูง (เปลี่ยน role) ออกเป็น endpoint ที่ตรวจสิทธิ์เอง ไม่พึ่งการซ่อนที่ UI หรือการลบเฉพาะค่าที่นึกออก"},{"id":"SEC-S-P-011","level":"senior","pool":"practice","competency":"Authentication and Authorization","descriptor":"S2","concept":"refresh-token-rotation-reuse-detection","mobile":true,"type":"multiple","stem":"แอปมือถือของธนาคารขนาดเล็กใช้ access token อายุ 15 นาที และ refresh token อายุ 30 วัน ทีมกังวลว่า refresh token ที่ถูกคัดลอกออกจากเครื่องของผู้ใช้ (เช่น ผ่านมัลแวร์หรือไฟล์สำรองข้อมูล) หรือจากเครื่องที่หาย จะถูกผู้อื่นใช้ได้นาน ข้อใดช่วยลดความเสี่ยงนี้ได้ตรงจุด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มอายุ access token เป็น 24 ชั่วโมง เพื่อให้แอปเรียกใช้ refresh token น้อยลงและมีโอกาสถูกดักน้อยลง","correct":false,"why":"ผิด เพราะอายุ access token ที่ยาวขึ้นทำให้ token ที่รั่วใช้ได้นานขึ้น และการเรียก refresh น้อยลงไม่ได้ทำให้ refresh token ที่ถูกคัดลอกไปใช้ไม่ได้"},{"id":"B","text":"ทำ refresh token rotation ทุกครั้งที่ใช้ และถ้าพบว่า token เก่าถูกนำมาใช้ซ้ำ ให้เพิกถอนทั้งชุด (token family) ของเซสชันนั้น","correct":true,"why":"ถูก เพราะ refresh token แต่ละตัวใช้ได้ครั้งเดียว ถ้าผู้โจมตีกับผู้ใช้จริงยังใช้ token ชุดเดียวกัน ฝ่ายหนึ่งจะใช้ token ที่ถูกหมุนไปแล้ว ระบบตรวจจับการใช้ซ้ำนั้นแล้วตัดทั้งเซสชันได้ แต่ถ้าเครื่องหายและมีแต่ผู้โจมตีใช้อยู่จะไม่เกิดการใช้ซ้ำ จึงต้องมีการเพิกถอนจากฝั่งเซิร์ฟเวอร์ตามแนวทางเก็บสถานะ refresh token ฝั่งเซิร์ฟเวอร์ให้เพิกถอนได้ และมี 'ออกจากระบบทุกอุปกรณ์' ควบคู่กัน"},{"id":"C","text":"ให้แอปลบ refresh token ออกจากเครื่องเมื่อผู้ใช้ปิดแอปครบ 5 นาที โดยทำเฉพาะฝั่งแอปและไม่แจ้งเซิร์ฟเวอร์ เพื่อลดเวลาที่ token อยู่บนเครื่อง","correct":false,"why":"ผิด เพราะผู้โจมตีที่คัดลอก token ไปแล้วไม่ได้รับผลจากการลบในเครื่องเดิม token ยังใช้ได้ที่เซิร์ฟเวอร์จนกว่าจะหมดอายุหรือถูกเพิกถอน"},{"id":"D","text":"เก็บสถานะ refresh token ฝั่งเซิร์ฟเวอร์ให้เพิกถอนได้ และมีฟังก์ชัน 'ออกจากระบบทุกอุปกรณ์' ที่ทำให้ token ทั้งหมดของบัญชีใช้ไม่ได้ทันที","correct":true,"why":"ถูก เพราะผู้ใช้ที่เครื่องหายสามารถตัดสิทธิ์เครื่องนั้นได้เองทันที ไม่ต้องรอ token หมดอายุ"}],"explanation":"ความเสี่ยงของ refresh token คืออายุยาวและขโมยแล้วเงียบ จึงต้องมีกลไกฝั่งเซิร์ฟเวอร์ 2 อย่าง คือ rotation พร้อมตรวจจับการใช้ซ้ำ และความสามารถเพิกถอนต่อเซสชัน/ต่ออุปกรณ์ การจัดการเฉพาะฝั่งแอปหรือยืดอายุ access token ไม่ได้แก้ปัญหา"},{"id":"SEC-S-P-012","level":"senior","pool":"practice","competency":"Security Testing","descriptor":"S3","concept":"business-logic-flaw-testing-approach","mobile":false,"type":"single","stem":"ทีม QA รัน SAST และ DAST กับระบบ checkout ของร้านค้าออนไลน์แล้วไม่พบ finding ระดับ high หรือ critical แต่หลังเปิดตัวมีลูกค้าแก้ราคาสินค้าในตะกร้าเป็น 1 บาทผ่าน request แล้วสั่งซื้อสำเร็จ ข้อใดอธิบายช่องว่างและแนวทางตรวจครั้งต่อไปได้ดีที่สุด","options":[{"id":"A","text":"scanner ที่ใช้ยังเป็นรุ่นเก่า ควรซื้อ scanner ยี่ห้อใหม่ที่มีฐาน signature ใหญ่กว่าเดิมเพื่อให้ครอบคลุมช่องโหว่มากขึ้น","correct":false,"why":"ผิด เพราะช่องโหว่นี้ไม่ใช่รูปแบบที่ signature จับได้ request ที่ส่งราคาแก้ไขเป็นรูปแบบถูกต้องทุกประการ scanner ไม่รู้ว่าราคาควรมาจากฝั่งเซิร์ฟเวอร์"},{"id":"B","text":"ปัญหาอยู่ที่ฝั่ง frontend ที่ส่งราคามา จึงควรเพิ่มรอบ SAST เฉพาะโค้ด frontend ให้เข้มงวดขึ้นและตรวจ validation ในฟอร์มเพิ่มเติม","correct":false,"why":"ผิด เพราะต้นเหตุคือ server เชื่อราคาจาก client การตรวจที่ frontend ผู้โจมตีข้ามได้เสมอ และ SAST ไม่เข้าใจว่าค่านี้ต้องไม่เชื่อ"},{"id":"C","text":"เพิ่มความถี่ของการ scan เป็นทุกคืน เพราะช่องโหว่นี้น่าจะเกิดจากโค้ดที่ merge เข้ามาหลังรอบ scan ล่าสุด","correct":false,"why":"ผิด เพราะการสแกนถี่ขึ้นไม่ช่วยถ้าเครื่องมือชนิดนั้นตรวจกฎธุรกิจไม่ได้ในทุกรอบอยู่แล้ว"},{"id":"D","text":"เครื่องมืออัตโนมัติไม่เข้าใจกฎธุรกิจ จึงต้องทำ threat model/abuse case (เช่น แก้ราคา จำนวนติดลบ ข้ามขั้นตอน) และ pentest แบบ manual เสริม","correct":true,"why":"ถูก เพราะ business logic flaw ต้องอาศัยคนที่เข้าใจว่าระบบควรทำอะไร แล้วออกแบบกรณีโจมตีเฉพาะระบบนั้น ซึ่ง scanner ทั่วไปทำไม่ได้"}],"explanation":"SAST/DAST เก่งกับช่องโหว่ที่มีรูปแบบชัด (injection, XSS, config) แต่ไม่รู้กฎธุรกิจ ช่องโหว่อย่างราคาเชื่อจาก client, ใช้คูปองซ้ำ, ข้ามขั้นตอนชำระเงิน ต้องค้นด้วยการทำ threat modeling และทดสอบแบบ manual ตามกรณีโจมตีที่เฉพาะกับระบบ แล้วเก็บเป็น test case ถาวรใน regression"},{"id":"SEC-S-P-013","level":"senior","pool":"practice","competency":"Security Testing","descriptor":"S3","concept":"vulnerability-triage-prioritisation","mobile":false,"type":"multiple","stem":"SCA scan รอบล่าสุดรายงานช่องโหว่ใน dependency 120 รายการ แต่ทีมมีเวลาแก้ได้ราว 10 รายการในสปรินต์นี้ ข้อใดเป็นหลักเกณฑ์จัดลำดับความสำคัญที่สมเหตุสมผล (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจว่าโค้ดของเราเรียกใช้ฟังก์ชันหรือ path ที่มีช่องโหว่จริงหรือไม่ (reachability)","correct":true,"why":"ถูก เพราะช่องโหว่ใน library ที่เราไม่ได้เรียกส่วนที่มีปัญหาแทบไม่มีผลจริง ช่วยตัดรายการที่ไม่ต้องรีบแก้ออกได้มาก"},{"id":"B","text":"เรียงตามคะแนน CVSS base score จากสูงไปต่ำเสมอ เป็นหลักเกณฑ์เดียว","correct":false,"why":"ผิด เพราะ CVSS base score ไม่รู้ว่า service นั้นเปิดสู่ภายนอกหรือไม่ และมี exploit จริงหรือไม่ ทำให้เสียเวลากับช่องโหว่คะแนนสูงแต่เข้าไม่ถึง และข้ามตัวที่คะแนนปานกลางแต่ถูกโจมตีจริง"},{"id":"C","text":"ให้น้ำหนักกับช่องโหว่ที่มี exploit ใช้งานจริงในวงกว้าง เช่น อยู่ในรายการช่องโหว่ที่ถูกโจมตีแล้ว หรือมีคะแนน EPSS สูง","correct":true,"why":"ถูก เพราะข้อมูลว่ามีการโจมตีจริงบอกโอกาสถูกใช้ได้ดีกว่าคะแนนความรุนแรงตามทฤษฎี"},{"id":"D","text":"แก้ service ที่เปิดสู่อินเทอร์เน็ตและเก็บข้อมูลส่วนบุคคลก่อน service ภายในที่ไม่แตะข้อมูลสำคัญ","correct":true,"why":"ถูก เพราะ exposure และผลกระทบทางธุรกิจเป็นตัวคูณความเสี่ยงที่ scanner ไม่เห็น ทีมต้องใส่เองเข้าไปในการตัดสิน"},{"id":"E","text":"ข้ามช่องโหว่ใน devDependencies ทั้งหมด เพราะไม่ถูก deploy ไปที่ production จึงไม่มีความเสี่ยงใดเลย","correct":false,"why":"ผิด เพราะ dependency ตอน build/test รันบน CI ที่มี secret และสิทธิ์ deploy ผู้โจมตีผ่าน package ที่ถูกแทรกก็ขโมย secret หรือแก้ artifact ได้ จึงไม่ใช่ความเสี่ยงศูนย์"}],"explanation":"การจัดลำดับช่องโหว่ที่ดีใช้ข้อมูลสามกลุ่มรวมกัน คือ เข้าถึงได้จริงไหม (reachability) ถูกโจมตีจริงไหม (exploit intelligence) และถ้าถูกโจมตีแล้วเสียหายแค่ไหน (exposure และข้อมูลที่เกี่ยวข้อง) คะแนน CVSS เป็นเพียงจุดเริ่มต้นที่ต้องปรับตามบริบท"},{"id":"SEC-S-P-014","level":"senior","pool":"practice","competency":"Security Testing","descriptor":"S3","concept":"mobile-binary-secret-finding","mobile":true,"type":"single","stem":"ผู้ทดสอบเจาะระบบ decompile แอปมือถือของบริษัทและพบ API key ของผู้ให้บริการส่ง SMS ที่มีสิทธิ์ส่งข้อความไม่จำกัด ฝังอยู่ในโค้ด ทีมพัฒนาเสนอให้ obfuscate สตริงนี้ให้อ่านยากแล้วปิดประเด็น คุณควรสรุปผลและแนะนำอย่างไร","options":[{"id":"A","text":"ยอมรับได้ เพราะ obfuscation ทำให้ผู้โจมตีส่วนใหญ่อ่านค่าไม่ออก ความเสี่ยงจึงลดลงมากพอสำหรับ key ตัวนี้","correct":false,"why":"ผิด เพราะ obfuscation ทำให้ช้าลง แต่ไม่ได้ป้องกัน ผู้โจมตีที่ตั้งใจดึง key จากแอปบนเครื่องของตัวเองหรือดักที่ runtime ทำได้ และ key นี้ถูกใช้ต่อได้ทันที"},{"id":"B","text":"ประเมินว่า key รั่วไปแล้ว ให้หมุน key ใหม่ ย้ายการเรียกบริการสิทธิ์สูงไปไว้หลัง backend ของเรา และจำกัดสิทธิ์/โควตาของ key ที่ยังต้องอยู่ในแอป","correct":true,"why":"ถูก เพราะข้อมูลในแอปที่ติดตั้งบนเครื่องผู้ใช้ถือว่าเปิดเผยได้เสมอ ทางแก้คือไม่ให้ความลับสิทธิ์สูงอยู่ที่นั่น และจำกัดความเสียหายของสิ่งที่ต้องอยู่"},{"id":"C","text":"ย้าย key ไปอยู่ในไฟล์ config ภายนอกที่แอปดาวน์โหลดจาก CDN ตอนเปิดครั้งแรก เพื่อไม่ให้อยู่ในไฟล์ติดตั้ง","correct":false,"why":"ผิด เพราะแอปต้องได้ค่าไปใช้ ผู้โจมตีก็ดึงไฟล์จาก CDN เองหรือดักการดาวน์โหลดได้ key ยังไปอยู่ที่ฝั่ง client เช่นเดิม"},{"id":"D","text":"เข้ารหัส key ด้วย AES แล้วเก็บ key ถอดรหัสไว้ใน Keychain/Keystore ของเครื่อง เพราะที่เก็บของระบบปฏิบัติการปลอดภัยกว่าไฟล์ในแอปมาก","correct":false,"why":"ผิด เพราะแอปต้องถอดรหัสแล้วส่ง key จริงออกไปเรียกบริการ ผู้โจมตีบนเครื่องของตัวเองดัก key ตอนใช้งานได้ secure storage กันการอ่านจากภายนอกแอป ไม่ได้กันผู้ใช้ที่ควบคุมเครื่อง"}],"explanation":"หลักสำคัญของงานทดสอบแอปมือถือคือ ทุกอย่างที่อยู่ในแอปและทุกการตรวจที่ทำบนเครื่องผู้ใช้ผู้โจมตีควบคุมได้ ความลับที่ให้สิทธิ์สูงต้องอยู่หลัง backend ที่ตรวจผู้ใช้และจำกัดการใช้ ส่วน key ที่จำเป็นต้องอยู่ในแอปต้องถูกออกแบบให้สิทธิ์ต่ำและเพิกถอนได้"},{"id":"SEC-S-P-015","level":"senior","pool":"practice","competency":"Security Testing","descriptor":"S3","concept":"pentest-rules-of-engagement","mobile":false,"type":"multiple","stem":"บริษัทจะจ้างทีมภายนอกมาทำ penetration test กับ API ที่ใช้งานจริง (production) ซึ่งมีข้อมูลลูกค้า ก่อนเริ่มงานควรตกลงเรื่องใดบ้างเป็นลายลักษณ์อักษร (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ขอบเขตระบบและช่วงเวลาที่ทดสอบได้ สิ่งที่ห้ามทำ (เช่น การโจมตีให้บริการล่ม) และช่องทางติดต่อฉุกเฉินเมื่อเกิดผลกระทบ","correct":true,"why":"ถูก เพราะขอบเขตและช่องทางฉุกเฉินคือสิ่งที่ทำให้การทดสอบบน production ถูกกฎหมายและควบคุมความเสียหายได้เมื่อมีสิ่งผิดพลาด"},{"id":"B","text":"ตกลงเฉพาะค่าจ้างและวันส่งรายงาน ส่วนขอบเขตและวิธีทดสอบให้ผู้ทดสอบตัดสินเองตามความเชี่ยวชาญของเขา","correct":false,"why":"ผิด เพราะขอบเขตและข้อห้ามต้องเป็นสิ่งที่ผู้ว่าจ้างกำหนดเป็นลายลักษณ์อักษร (rules of engagement) การให้ผู้ทดสอบตัดสินเองบน production อาจกระทบระบบที่ไม่อยู่ในขอบเขต ทำให้บริการล่ม หรือเกินสิทธิ์ที่ได้รับอนุญาต"},{"id":"C","text":"วิธีจัดการข้อมูลที่ผู้ทดสอบอาจเข้าถึงได้ (การเก็บ ส่งมอบ ทำลายหลักฐาน) รวมถึงข้อตกลงรักษาความลับ","correct":true,"why":"ถูก เพราะผู้ทดสอบจะเห็นข้อมูลลูกค้าจริง ต้องมีข้อตกลงที่รองรับหน้าที่ปกป้องข้อมูลส่วนบุคคลของบริษัทตามกฎหมาย"},{"id":"D","text":"ให้ผู้ทดสอบดึงข้อมูลลูกค้าจริงมาเก็บในเครื่องตัวเองเพื่อแนบเป็นหลักฐานในรายงาน โดยกำหนดให้ลบหลังส่งงาน","correct":false,"why":"ผิด เพราะการพิสูจน์ผลกระทบควรใช้หลักฐานน้อยที่สุด เช่น จำนวนเรคคอร์ดหรือตัวอย่างที่ปกปิด ไม่ใช่นำข้อมูลส่วนบุคคลจริงออกจากระบบ การสั่งให้ลบหลังส่งงานไม่ลดความเสี่ยงระหว่างที่ข้อมูลอยู่บนเครื่องผู้ทดสอบ และขัดหลัก data minimisation"}],"explanation":"pentest บน production ต้องมีกรอบ rules of engagement ที่เป็นเอกสารก่อนเริ่ม ครอบคลุมขอบเขต เวลา ข้อห้าม ผู้รับผิดชอบเมื่อมีปัญหา และการจัดการข้อมูลที่ผู้ทดสอบจะเห็น เพื่อให้ได้ผลทดสอบที่มีคุณค่าโดยไม่สร้างเหตุเองหรือรั่วข้อมูลลูกค้า"},{"id":"SEC-S-P-016","level":"senior","pool":"practice","competency":"API Security","descriptor":"S4","concept":"orderby-allowlist-injection","mobile":false,"type":"single","stem":"ทีมต้องแก้ SQL injection ใน endpoint ด้านล่างที่รับพารามิเตอร์ sort จาก query string ข้อใดเป็นวิธีแก้ที่ดีที่สุด","code":"router.get('/api/products', async (req, res) => {\n  const sort = req.query.sort ?? 'price';\n  const rows = await db.query(`SELECT id, name, price FROM products ORDER BY ${sort} LIMIT 50`);\n  res.json(rows);\n});","codeLang":"typescript","options":[{"id":"A","text":"ใช้ replace ลบเครื่องหมาย ' และ ; ออกจากค่า sort ก่อนต่อเข้า SQL เพื่อกันไม่ให้ผู้ใช้แทรกคำสั่งใหม่ต่อท้ายหรือปิดประโยค SQL เดิมได้","correct":false,"why":"ผิด เพราะ ORDER BY อยู่นอก string literal การแทรก expression เช่น subquery หรือ CASE ไม่ต้องใช้เครื่องหมาย ' และ ; ผู้โจมตียังเดาข้อมูลได้ผ่านผลลำดับ"},{"id":"B","text":"ส่งค่า sort เป็น placeholder ($1) ใน ORDER BY เพื่อให้ driver escape ค่าให้อัตโนมัติ","correct":false,"why":"ผิด เพราะ placeholder ถูกมองเป็นค่าคงที่ ORDER BY ค่าคงที่ไม่เรียงตาม column ใดเลย ได้ผลลัพธ์ผิดหรือ error และไม่ใช่การแก้ที่ใช้ได้จริง"},{"id":"C","text":"map ค่า sort ที่รับมากับรายการ column ที่อนุญาตไว้ฝั่งเซิร์ฟเวอร์ (allowlist) แล้วปฏิเสธค่าอื่นด้วย 400","correct":true,"why":"ถูก เพราะเมื่อค่าเป็นส่วนของโครงสร้างคำสั่ง ไม่ใช่ข้อมูล วิธีที่ปลอดภัยคือไม่นำค่าจาก client มาต่อเลย แต่ใช้ค่าที่เซิร์ฟเวอร์เลือกจากรายการตายตัว"},{"id":"D","text":"ตรวจด้วย regex ว่ามีเฉพาะตัวอักษร ตัวเลข ช่องว่าง และเครื่องหมายจุลภาค แล้วต่อเข้า SQL ตามเดิม เพื่อให้เรียงหลาย column ได้","correct":false,"why":"ผิด เพราะยังเปิดให้เรียงด้วย column ใดก็ได้ รวมถึง column ที่เก็บข้อมูลลับ แล้วเดาค่าจากลำดับผลลัพธ์ และการยอมให้ช่องว่างกับจุลภาคทำให้ client ประกอบส่วนของคำสั่ง SQL เองได้ ไม่ใช่การเลือกจากรายการที่เซิร์ฟเวอร์กำหนด"}],"explanation":"parameterized query แก้ได้เฉพาะตำแหน่งที่เป็น 'ค่า' ส่วนชื่อ column ชื่อ table ทิศทางการเรียง ต้องใช้ allowlist ที่เซิร์ฟเวอร์กำหนดเอง การพยายามทำความสะอาดสตริงหรือกรองด้วย regex เป็นแนวทางที่เปราะ เพราะต้องรู้ตัวอย่างโจมตีทุกแบบล่วงหน้าและยังเปิดให้เลือก column ได้เอง"},{"id":"SEC-S-P-017","level":"senior","pool":"practice","competency":"API Security","descriptor":"S4","concept":"rate-limit-credential-endpoints","mobile":true,"type":"multiple","stem":"แอปมือถือส่ง SMS OTP เพื่อยืนยันตัวตนก่อนเข้าสู่ระบบ โดย endpoint POST /auth/otp/verify รับเบอร์โทรและรหัส 6 หลัก ทีมกังวลเรื่องการเดารหัสและการสแปม SMS ซึ่งมีต้นทุนต่อข้อความ ข้อใดเป็นมาตรการที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"จำกัดจำนวนครั้งที่ลองรหัสต่อ OTP ที่ออกให้ (เช่น 5 ครั้ง แล้วรหัสนั้นใช้ไม่ได้ต้องขอใหม่)","correct":true,"why":"ถูก เพราะรหัส 6 หลักมีเพียงล้านค่า ถ้าลองได้ไม่จำกัดเดาได้ในเวลาไม่นาน การจำกัดต่อรหัสทำให้โอกาสเดาถูกต่ำมาก"},{"id":"B","text":"จำกัดด้วย IP อย่างเดียว เพราะผู้ใช้จริงแต่ละคนมี IP ต่างกันอยู่แล้ว จึงใช้ IP เป็น key เพียงอย่างเดียวโดยไม่แยกตามเบอร์โทรหรืออุปกรณ์","correct":false,"why":"ผิด เพราะผู้ใช้มือถือจำนวนมากแชร์ IP เดียวกันผ่านเครือข่ายผู้ให้บริการ (ถูกบล็อกพร้อมกัน) ขณะที่ผู้โจมตีใช้หลาย IP กระจายเดาเบอร์เดียวกันได้"},{"id":"C","text":"จำกัดการขอส่ง OTP ต่อเบอร์โทร ต่ออุปกรณ์ และต่อ IP ร่วมกัน พร้อมหน่วงเวลาระหว่างการขอซ้ำ","correct":true,"why":"ถูก เพราะการจำกัดหลายมิติป้องกันทั้งการรบกวนเบอร์ของคนอื่นและการสแปมที่ทำให้บริษัทเสียค่า SMS"},{"id":"D","text":"ตอบข้อความต่างกันระหว่าง 'ไม่พบเบอร์นี้ในระบบ' กับ 'รหัสไม่ถูกต้อง' เพื่อให้ผู้ใช้เข้าใจปัญหาได้ง่าย","correct":false,"why":"ผิด เพราะข้อความที่ต่างกันเปิดช่องให้ไล่ตรวจว่าเบอร์ใดเป็นสมาชิกของเรา (account enumeration) ควรตอบแบบทั่วไปเหมือนกัน"},{"id":"E","text":"ให้ OTP อายุสั้นและใช้ได้ครั้งเดียว และเมื่อออก OTP ใหม่ให้ยกเลิกรหัสเดิมทันที","correct":true,"why":"ถูก เพราะช่วงเวลาให้เดาแคบลง รหัสเก่าที่รั่วหรือถูกดักใช้ซ้ำไม่ได้ และไม่มีหลายรหัสที่ใช้ได้พร้อมกัน"}],"explanation":"endpoint ที่รับรหัสสั้นต้องจำกัดทั้งจำนวนการเดาต่อรหัสและจำนวนการขอ ในหลายมิติ (บัญชี/เบอร์ อุปกรณ์ IP) เพราะมิติเดียวหลบได้ ขณะเดียวกันต้องไม่ใช้ข้อความตอบที่ช่วยผู้โจมตีไล่ตรวจว่ามีบัญชีอยู่จริงหรือไม่"},{"id":"SEC-S-P-018","level":"senior","pool":"practice","competency":"API Security","descriptor":"S4","concept":"rate-limit-key-xff-spoofing","mobile":false,"type":"single","stem":"API login ด้านล่างอยู่หลัง load balancer ของ cloud ผู้โจมตีทำ brute force ได้ต่อเนื่องแม้จะมี rate limit 5 ครั้งต่อนาที เมื่อดู log พบว่าแต่ละ request ถูกนับเป็นคนละ key อะไรคือสาเหตุและวิธีแก้ที่ถูกต้อง","code":"const limiter = rateLimit({\n  windowMs: 60_000,\n  max: 5,\n  keyGenerator: (req) => req.headers['x-forwarded-for'] as string,\n});\napp.post('/api/login', limiter, loginHandler);","codeLang":"typescript","options":[{"id":"A","text":"client ส่ง header X-Forwarded-For ปลอมเองได้ จึงควรใช้ IP ที่ proxy ที่เชื่อถือต่อท้ายไว้ (trust proxy ตามจำนวน hop จริง) และจำกัดตาม username ด้วย","correct":true,"why":"ถูก เพราะ header นี้เป็นค่าจาก client จนกว่าจะมาจากโหนดที่เราเชื่อถือ การเปลี่ยนค่าทุก request ทำให้ได้ key ใหม่ตลอด ต้องยึด IP ของ client ที่ load balancer ที่เชื่อถือเห็นจากการเชื่อมต่อจริงและต่อท้ายไว้ และเสริมด้วย key ตามบัญชี"},{"id":"B","text":"เพิ่ม windowMs เป็น 1 ชั่วโมง เพื่อให้จำนวนที่นับสะสมนานขึ้นและจำกัดได้เข้มงวดกว่าเดิมกับผู้ที่ลองรหัสผ่านหลายครั้ง","correct":false,"why":"ผิด เพราะปัญหาคือ key เปลี่ยนทุก request ไม่ใช่หน้าต่างเวลาสั้นเกินไป ถ้า key ไม่ซ้ำ หน้าต่างยาวแค่ไหนก็ไม่นับรวมกัน"},{"id":"C","text":"เปลี่ยนไปใช้ cookie session id เป็น key เพราะ cookie เชื่อถือได้กว่า header ของ request และผูกกับผู้ใช้แต่ละคนที่เบราว์เซอร์เปิดไว้ ซึ่งผู้โจมตีปลอมแปลงได้ยากกว่า","correct":false,"why":"ผิด เพราะผู้โจมตีไม่ส่ง cookie หรือขอ cookie ใหม่ทุกครั้งได้ จึงได้ key ใหม่ทุก request เช่นกัน"},{"id":"D","text":"แคชผลลัพธ์ของ login ไว้สักระยะ เพื่อลดงานซ้ำของ limiter กับ request ที่ส่งมาซ้ำและลดภาระของเซิร์ฟเวอร์ตอนถูกโจมตี","correct":false,"why":"ผิด เพราะการแคชผลการยืนยันตัวตนอันตรายในตัวเอง และไม่แก้ปัญหา key ที่ปลอมได้ อีกทั้งรหัสผ่านที่เดาแต่ละค่าเป็น request ที่ต่างกัน"}],"explanation":"key ของ rate limit ต้องเป็นค่าที่ผู้โจมตีเปลี่ยนไม่ได้ง่าย header อย่าง X-Forwarded-For เชื่อได้เฉพาะส่วนที่ proxy ของเราเป็นคนต่อท้าย และสำหรับ login ควรจำกัดตามบัญชีด้วย ไม่ใช่ตาม IP อย่างเดียว เพราะผู้โจมตีกระจาย IP ได้"},{"id":"SEC-S-P-019","level":"senior","pool":"practice","competency":"API Security","descriptor":"S4","concept":"waf-api-gateway-layering","mobile":false,"type":"multiple","stem":"บริษัทวาง API Gateway พร้อม WAF ไว้หน้า microservices หลายตัว หัวหน้าทีมบอกว่า 'มี WAF แล้ว ไม่ต้อง validate input ใน service อีก' ข้อใดคือความเข้าใจที่ถูกต้องเกี่ยวกับการออกแบบนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"WAF ช่วยลดการโจมตีรูปแบบที่รู้จัก แต่แต่ละ service ยังต้อง validate input และตรวจสิทธิ์ของตัวเอง (defense in depth)","correct":true,"why":"ถูก เพราะ WAF ตรวจ pattern ที่ขอบเครือข่าย ไม่รู้กฎธุรกิจของแต่ละ service และถูกหลบด้วยการเข้ารหัสหรือรูปแบบที่ไม่อยู่ในกฎได้"},{"id":"B","text":"เปิด WAF เป็นโหมดบล็อกเต็มรูปแบบตั้งแต่วันแรกได้เลย เพราะกฎของผู้ให้บริการผ่านการทดสอบมาแล้ว และข้ามช่วงทดลองในโหมดบันทึก","correct":false,"why":"ผิด เพราะกฎสำเร็จรูปบล็อก request ที่ถูกต้องของระบบเราผิดพลาด (false positive) ได้ ควรเริ่มจากโหมดบันทึก ปรับกฎจากทราฟฟิกจริง แล้วค่อยเปิดบล็อก"},{"id":"C","text":"ควรให้ service รับทราฟฟิกจาก gateway เท่านั้น (เช่น network policy หรือ mTLS) ไม่เช่นนั้นผู้โจมตีที่รู้ที่อยู่ origin จะเรียกอ้อม WAF ได้","correct":true,"why":"ถูก เพราะ WAF ป้องกันได้เฉพาะทราฟฟิกที่ผ่านมันเท่านั้น ถ้า origin เปิดรับตรง การป้องกันทั้งชั้นถูกข้ามได้"},{"id":"D","text":"WAF จับ business logic flaw ได้ เช่น ผู้ใช้เปลี่ยน orderId เป็นของคนอื่น เพราะตรวจรูปแบบของ request ได้ละเอียด","correct":false,"why":"ผิด เพราะ request ที่เปลี่ยน orderId มีรูปแบบถูกต้องทุกประการ ต้องตรวจเจ้าของ order กับผู้เรียกที่ service เอง ซึ่ง WAF ไม่มีข้อมูลนี้"}],"explanation":"WAF และ API Gateway เป็นด่านเสริมที่ขอบระบบ ไม่ได้แทน validation และ authorization ในแต่ละ service ต้องบังคับให้ทราฟฟิกเข้าทางด่านนั้นเท่านั้น และเปิดกฎอย่างระมัดระวังเพื่อไม่บล็อกผู้ใช้จริง"},{"id":"SEC-S-P-020","level":"senior","pool":"practice","competency":"API Security","descriptor":"S4","concept":"partner-api-client-credentials-scopes","mobile":false,"type":"single","stem":"บริษัทเปิด API ให้ระบบหลังบ้านของพาร์ทเนอร์ 3 ราย เรียกอ่านสถานะคำสั่งซื้อ (เป็น server-to-server ไม่มีผู้ใช้ปลายทางเกี่ยวข้อง) ปัจจุบันใช้ API key ค่าเดียวที่แชร์ให้ทุกรายและไม่มีวันหมดอายุ เมื่อพาร์ทเนอร์รายหนึ่งเลิกสัญญา ต้องเปลี่ยน key ของทุกรายพร้อมกัน ทีมควรปรับเป็นแบบใด","options":[{"id":"A","text":"เปลี่ยนเป็น Basic auth ด้วย username/password ต่อพาร์ทเนอร์ ที่พาร์ทเนอร์เก็บไว้ในไฟล์ config ของระบบตนเองสำหรับเรียก API","correct":false,"why":"ผิด เพราะยังเป็นความลับระยะยาวที่ส่งไปกับทุก request ไม่มีอายุสั้นหรือ scope และการหมุนเวียนต้องประสานกับพาร์ทเนอร์ทุกครั้ง"},{"id":"B","text":"ให้พาร์ทเนอร์ล็อกอินด้วยบัญชีผู้ใช้ของเจ้าหน้าที่ แล้วใช้ authorization code flow ผ่านหน้าจอยินยอมของระบบเรา","correct":false,"why":"ผิด เพราะ flow นี้ออกแบบสำหรับผู้ใช้ที่กดยินยอมผ่านเบราว์เซอร์ ระบบหลังบ้านที่ทำงานเองไม่มีผู้ใช้ให้กดยินยอม และผูก token กับตัวบุคคลที่อาจลาออกได้"},{"id":"C","text":"คงใช้ API key ค่าเดียวเหมือนเดิม แต่จำกัด IP ของพาร์ทเนอร์ทั้งสามรายใน firewall เพิ่มเติมจากเดิม ซึ่งทำได้ทันที","correct":false,"why":"ผิด เพราะยังแยกไม่ออกว่าใครเรียก เพิกถอนรายเดียวไม่ได้ และจำกัด IP อย่างเดียวไม่ใช่การพิสูจน์ตัวตนที่แข็งแรง (IP เปลี่ยนหรือถูกใช้ร่วมกับระบบอื่นได้)"},{"id":"D","text":"ออก client credential แยกรายพาร์ทเนอร์ ใช้ OAuth 2.0 client credentials grant ได้ access token อายุสั้นพร้อม scope อ่านอย่างเดียว เพิกถอนรายเดียวได้","correct":true,"why":"ถูก เพราะแยกตัวตนรายพาร์ทเนอร์ ใช้ token อายุสั้นที่จำกัด scope และตัดสิทธิ์รายเดียวได้โดยไม่กระทบรายอื่น ตรงกับกรณี server-to-server"}],"explanation":"การเรียก API ระหว่างระบบที่ไม่มีผู้ใช้ปลายทางเหมาะกับ client credentials grant: แต่ละพาร์ทเนอร์มี identity ของตนเอง ได้ token อายุสั้นและ scope เท่าที่ต้องใช้ ทำให้ตรวจสอบย้อนหลังและเพิกถอนแยกรายพาร์ทเนอร์ได้ ซึ่งแก้จุดอ่อนของ key ที่แชร์และไม่หมดอายุ"},{"id":"SEC-S-P-021","level":"senior","pool":"practice","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"leaked-credential-first-response","mobile":false,"type":"single","stem":"เวลา 14:00 ระบบสแกน secret แจ้งว่านักพัฒนา push ไฟล์ .env ที่มี access key ของ cloud storage ซึ่งเก็บเอกสารลูกค้า ขึ้น public repository เมื่อ 40 นาทีก่อน คุณเป็น on-call ควรทำสิ่งใดเป็นอันดับแรก","options":[{"id":"A","text":"ทำ force-push ลบ commit นั้นและลบ repository ทิ้ง เพื่อให้ key หายจากอินเทอร์เน็ตให้เร็วที่สุด","correct":false,"why":"ผิด เพราะ key ถูกเปิดเผยแล้ว 40 นาที บอทสแกน repository สาธารณะและ fork หรือแคชอาจเก็บไว้แล้ว การลบไม่ทำให้ key ใช้ไม่ได้"},{"id":"B","text":"เพิกถอน key นั้นทันทีและออก key ใหม่ แล้วตรวจ access log ของ storage ช่วง 40 นาทีนั้นว่ามีการใช้ key หรือไม่","correct":true,"why":"ถูก เพราะการทำให้ key ใช้ไม่ได้คือสิ่งเดียวที่หยุดความเสี่ยงได้จริง และ log ที่เหลือบอกขอบเขตของผลกระทบสำหรับขั้นตอนต่อไป"},{"id":"C","text":"เฝ้าดู billing และ access log ต่ออีก 24 ชั่วโมง ถ้าไม่พบความผิดปกติจึงค่อยตัดสินใจเปลี่ยน key","correct":false,"why":"ผิด เพราะระหว่างรอ ผู้โจมตียังดาวน์โหลดเอกสารลูกค้าได้ และการไม่พบความผิดปกติใน 24 ชั่วโมงไม่ได้พิสูจน์ว่า key ไม่ถูกคัดลอกไว้"},{"id":"D","text":"ให้นักพัฒนาลบไฟล์ .env ออกใน commit ถัดไปและเพิ่ม .env ใน .gitignore เพื่อป้องกันไม่ให้เกิดซ้ำอีก พร้อมเตือนทีมในที่ประชุมสัปดาห์หน้า","correct":false,"why":"ผิด เพราะประวัติ git ยังมี commit เดิมที่มี key อยู่ ใครก็ดูย้อนหลังได้ การป้องกันซ้ำเป็นเรื่องที่ควรทำภายหลัง แต่ไม่ใช่ขั้นแรก"}],"explanation":"เมื่อ credential รั่วสู่สาธารณะ ให้ถือว่าถูกใช้แล้ว ลำดับที่ถูกคือ หยุดการใช้ได้ (เพิกถอน/หมุน) ก่อน แล้วค่อยสืบว่ามีการใช้อะไรไปบ้าง และค่อยทำความสะอาดประวัติและป้องกันซ้ำ การลบหลักฐานก่อนเพิกถอน key คือการจัดลำดับที่ผิด"},{"id":"SEC-S-P-022","level":"senior","pool":"practice","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"security-alert-signal-selection","mobile":false,"type":"multiple","stem":"SOC ขนาดเล็กมีคนเฝ้าได้ทีละคน และ alert ปัจจุบันมี false positive มากจนทีมเริ่มเมินเฉย ข้อใดเป็นสัญญาณที่ควรตั้ง alert ระดับสูง เพราะบ่งชี้เหตุผิดปกติที่ต้องตรวจจริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"บัญชีแอดมินถูกเพิ่มสิทธิ์ หรือมีการสร้างบัญชีสิทธิ์สูงใหม่ นอกช่วง change window ที่แจ้งไว้","correct":true,"why":"ถูก เพราะการยกระดับสิทธิ์นอกกระบวนการเป็นรูปแบบที่ผู้โจมตีใช้ฝังตัว และเป็นเหตุการณ์ที่ปริมาณน้อยแต่ผลกระทบสูง เหมาะกับ alert ระดับสูง"},{"id":"B","text":"ผู้ใช้ทั่วไปกรอกรหัสผ่านผิด 1 ครั้งแล้วล็อกอินสำเร็จในครั้งถัดไป จากอุปกรณ์เดิมที่เคยใช้ในวันเดียวกัน","correct":false,"why":"ผิด เพราะเป็นพฤติกรรมปกติที่เกิดทุกวัน การ alert ระดับสูงกับเหตุการณ์นี้คือสาเหตุที่ทำให้เกิด false positive และทีมเริ่มเมินเฉย"},{"id":"C","text":"service account ที่ปกติถูกเรียกจาก IP ภายในไม่กี่ตัว ถูกใช้งานจากต่างประเทศหรือ IP ที่ไม่เคยพบมาก่อน","correct":true,"why":"ถูก เพราะบัญชีที่มีรูปแบบการใช้คงที่ ถ้าเบี่ยงจากพฤติกรรมปกติชัดเจนมักหมายถึง credential ถูกขโมย และมีน้อยครั้งจึงสร้างเสียงรบกวนต่ำ"},{"id":"D","text":"มีการ export ข้อมูลลูกค้าปริมาณมากผิดปกติ จากบัญชีที่ปกติเปิดอ่านข้อมูลทีละรายการ","correct":true,"why":"ถูก เพราะการดึงข้อมูลจำนวนมากโดยบัญชีที่ไม่เคยทำเป็นสัญญาณของการดูดข้อมูล (exfiltration) ซึ่งเป็นผลกระทบที่ร้ายแรงต่อ PDPA"},{"id":"E","text":"CPU ของเซิร์ฟเวอร์พุ่งสูงถึง 70% ในช่วงแคมเปญโปรโมชันที่ทีมการตลาดแจ้งล่วงหน้าไว้แล้วเมื่อสัปดาห์ก่อน","correct":false,"why":"ผิด เพราะเป็นภาระงานตามแผนที่คาดไว้ ไม่ใช่สัญญาณความมั่นคงปลอดภัย ควรอยู่ในการเฝ้าสังเกตด้านประสิทธิภาพไม่ใช่ alert ของ SOC"}],"explanation":"alert ที่มีประโยชน์คือเหตุการณ์ที่เบี่ยงจากพฤติกรรมปกติของระบบและมีผลกระทบสูง (สิทธิ์ ตัวตน ข้อมูล) การแจ้งทุกเหตุการณ์ที่เกิดทุกวันทำให้ทีมเหนื่อยล้าจากการแจ้งเตือนและพลาดสัญญาณจริง ควรปรับกฎจากพื้นฐานปกติและให้ความสำคัญกับเหตุการณ์ที่หายาก"},{"id":"SEC-S-P-023","level":"senior","pool":"practice","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"mobile-vulnerable-version-forced-update","mobile":true,"type":"single","stem":"ทีมพบว่าแอปมือถือ Android เวอร์ชัน 3.1 เขียน access token ลง log ของเครื่อง ซึ่งดึงออกได้ผ่าน adb ไฟล์ bug report ที่ผู้ใช้ส่งให้ฝ่ายสนับสนุน หรือแอประบบที่มีสิทธิ์พิเศษ ผู้ใช้ราว 40% ยังใช้เวอร์ชันนี้อยู่ และเวอร์ชัน 3.2 ที่แก้แล้วเพิ่งผ่านการตรวจของ store ข้อใดเป็นแผนรับมือที่ครอบคลุมและสมจริงที่สุด","options":[{"id":"A","text":"รอให้ผู้ใช้ค่อยๆ อัปเดตเองตามปกติ เพราะการบังคับอัปเดตทำให้ผู้ใช้เสียประสบการณ์ อาจทำให้เกิดคำร้องเรียน และอาจกระทบรายได้ช่วงโปรโมชัน","correct":false,"why":"ผิด เพราะผู้ใช้ 40% ยังเสี่ยงต่อเนื่องไม่มีกำหนด และ token ใน log ยังใช้ได้อยู่ ความเสี่ยงต่อข้อมูลลูกค้ามากกว่าความไม่สะดวกจากการอัปเดต"},{"id":"B","text":"ถอนแอปเวอร์ชัน 3.1 ออกจาก store เพื่อไม่ให้มีผู้ติดตั้งเพิ่ม และรอให้ 3.2 กระจายตามปกติ","correct":false,"why":"ผิด เพราะแอปที่ติดตั้งไปแล้วในเครื่องผู้ใช้ไม่ได้ถูกถอนด้วย และ token ที่ถูกเขียนลง log ไปแล้วยังใช้ได้"},{"id":"C","text":"ออก 3.2 พร้อมเพิกถอน token ที่ออกให้เวอร์ชัน 3.1 และกำหนดเวอร์ชันขั้นต่ำให้ API ปฏิเสธเวอร์ชันเก่าพร้อมข้อความให้อัปเดต","correct":true,"why":"ถูก เพราะจัดการทั้งต้นเหตุ (แพตช์ในแอป) ผลที่เกิดไปแล้ว (token ที่อาจรั่ว) และผู้ที่ยังไม่อัปเดต (บังคับผ่านฝั่งเซิร์ฟเวอร์) ซึ่งควบคุมได้ แม้ผู้ใช้ไม่ยอมอัปเดต"},{"id":"D","text":"ปิดการเขียน log ผ่านค่า remote config เพียงอย่างเดียว และคง token เก่าที่ออกไปแล้วให้ใช้ต่อได้","correct":false,"why":"ผิด เพราะ token ที่ถูกเขียนลง log ไปแล้วยังตกค้างและใช้ได้ การหยุดเขียนเพิ่มไม่ได้ทำให้ token เก่าปลอดภัย และ config ใช้ได้เฉพาะเมื่อโค้ดรองรับไว้ก่อน"}],"explanation":"ช่องโหว่ในแอปที่แจกจ่ายไปแล้วแก้เฉพาะที่โค้ดไม่พอ เพราะผู้ใช้อัปเดตตามเวลาของตน ต้องมีกลไกฝั่งเซิร์ฟเวอร์ที่เพิกถอนข้อมูลยืนยันตัวตนที่อาจรั่ว และกำหนดเวอร์ชันขั้นต่ำที่ยอมรับได้ ควรออกแบบกลไกนี้ไว้ตั้งแต่ก่อนมีเหตุ"},{"id":"SEC-S-P-024","level":"senior","pool":"practice","competency":"Security Monitoring and Incident Response","descriptor":"S5","concept":"personal-data-breach-response-steps","mobile":false,"type":"multiple","stem":"ทีมพบว่า API endpoint ที่ไม่มีการตรวจสิทธิ์ทำให้ชื่อ เบอร์โทร และเลขบัตรประชาชนของลูกค้าถูกดึงออกไปโดยบุคคลภายนอก ข้อใดเป็นขั้นตอนตอบสนองที่เหมาะสมในช่วงแรกของเหตุการณ์ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ปิดช่องโหว่หรือบล็อก endpoint ชั่วคราว พร้อมเก็บ log และหลักฐานไว้ก่อนแก้ เพื่อประเมินว่าข้อมูลของใครและอะไรถูกเข้าถึง","correct":true,"why":"ถูก เพราะหยุดการรั่วเพิ่มโดยไม่ทำลายหลักฐาน ซึ่งจำเป็นต่อการระบุขอบเขตผู้ได้รับผลกระทบและการสอบสวน"},{"id":"B","text":"เก็บ access log เฉพาะ 24 ชั่วโมงล่าสุดที่เห็นการโจมตีไว้เป็นหลักฐาน ส่วน log ที่เก่ากว่านั้นให้ลบตามรอบหมุนเวียนปกติ","correct":false,"why":"ผิด เพราะยังไม่ทราบว่าการดึงข้อมูลเริ่มเมื่อไร ช่องโหว่อาจถูกใช้มานานกว่าที่เห็น log ที่เก่ากว่าอาจเป็นหลักฐานเดียวที่ระบุผู้ได้รับผลกระทบ ควรระงับการลบ log ที่เกี่ยวข้องไว้ก่อน"},{"id":"C","text":"รอให้การสอบสวนเสร็จครบถ้วนก่อน จึงค่อยแจ้งผู้บริหาร ฝ่ายกฎหมาย หรือ DPO เพื่อให้ข้อมูลที่รายงานไม่ผิดพลาด","correct":false,"why":"ผิด เพราะหน้าที่แจ้งเหตุตามกฎหมายและการตัดสินใจเรื่องผลกระทบต้องการผู้มีอำนาจเข้าร่วมตั้งแต่เนิ่นๆ การรอจนจบทำให้เสียเวลาที่มีจำกัด"},{"id":"D","text":"แจ้งผู้รับผิดชอบด้านกฎหมายหรือ DPO และผู้บริหารตั้งแต่ต้น เพื่อประเมินหน้าที่แจ้งหน่วยงานกำกับและเจ้าของข้อมูลตาม PDPA","correct":true,"why":"ถูก เพราะเหตุที่เกี่ยวกับข้อมูลส่วนบุคคลมีหน้าที่ตามกฎหมายที่ต้องประเมินโดยผู้รับผิดชอบ การเริ่มเร็วทำให้มีเวลาเตรียมข้อมูลที่ต้องแจ้ง"},{"id":"E","text":"ออกประกาศต่อสาธารณะทันทีว่าข้อมูลลูกค้าทุกคนรั่ว เพื่อแสดงความโปร่งใส ก่อนประเมินว่าข้อมูลของใครถูกดึงไปจริง","correct":false,"why":"ผิด เพราะยังไม่รู้ขอบเขต จึงอาจแจ้งผิดคน ผิดเนื้อหา หรือผิดช่องทาง การสื่อสารกับเจ้าของข้อมูลและหน่วยงานกำกับควรผ่านการประเมินของฝ่ายกฎหมายหรือ DPO จากขอบเขตที่ยืนยันแล้ว ความโปร่งใสต้องทำให้ถูกเวลาและถูกเนื้อหา"}],"explanation":"การตอบสนองเหตุข้อมูลส่วนบุคคลรั่วต้องทำ 3 สิ่งขนานกัน: หยุดการรั่ว เก็บหลักฐานเพื่อรู้ขอบเขต และดึงฝ่ายกฎหมาย/DPO เข้ามาแต่เนิ่นๆ เพื่อประเมินหน้าที่แจ้งผู้เกี่ยวข้อง การปล่อยให้ log หายก่อนรู้ขอบเขต รอจนจบก่อนบอก หรือประกาศก่อนรู้ว่าใครได้รับผลกระทบ คือแบบแผนที่ทำให้เหตุเลวร้ายลง"}],"exam":[{"id":"SEC-S-E-001","level":"senior","pool":"exam","competency":"Security Controls Implementation","descriptor":"S1","concept":"internal-traffic-tls","mobile":false,"type":"single","stem":"ระบบประกันออนไลน์รัน microservices บน Kubernetes cluster เดียวกันใน VPC ส่วนตัว service รับใบสมัครส่งข้อมูลส่วนบุคคล (ชื่อ เลขบัตรประชาชน ประวัติสุขภาพ) ไปให้ service ประเมินความเสี่ยงผ่าน HTTP ธรรมดา นักพัฒนาบอกว่าไม่ต้องเข้ารหัสเพราะอยู่ในเครือข่ายภายใน คุณในฐานะ senior ควรตัดสินใจอย่างไร","options":[{"id":"A","text":"ยอมรับได้ เพราะ VPC เป็นเครือข่ายส่วนตัวที่คนนอกเข้าไม่ถึง และ TLS จะเพิ่ม latency กับภาระจัดการ certificate โดยไม่จำเป็น","correct":false,"why":"ผิด เพราะความเสี่ยงไม่ได้มาจากคนนอก VPC อย่างเดียว pod หรือ service ที่ถูกเจาะภายใน cluster อาจดักทราฟฟิกแบบ plaintext ได้ และข้อมูลสุขภาพเป็นข้อมูลอ่อนไหว"},{"id":"B","text":"เปิด TLS ระหว่าง service (ควรเป็น mTLS ผ่าน service mesh) เพราะผู้ที่เจาะ pod เดียวอาจดักทราฟฟิกอื่นและปลอมเป็น service อื่นได้","correct":true,"why":"ถูก เพราะ mTLS ทั้งเข้ารหัสทราฟฟิกและให้แต่ละ service พิสูจน์ตัวตนต่อกัน จึงลดผลกระทบเมื่อผู้โจมตีได้ที่มั่นในเครือข่ายภายในแล้ว (ไม่ใช่เชื่อใจเพียงเพราะอยู่ใน network เดียวกัน)"},{"id":"C","text":"แปลง body ด้วย base64 ก่อนส่งระหว่าง service เพื่อให้ข้อมูลอ่านออกไม่ได้โดยตรงเมื่อมีคนดักทราฟฟิกในเครือข่าย","correct":false,"why":"ผิด เพราะ base64 เป็นการเข้ารหัสรูปแบบ (encoding) ที่ถอดกลับได้ทันทีโดยไม่ต้องมี key ไม่ใช่การเข้ารหัสลับข้อมูล"},{"id":"D","text":"เข้ารหัสเฉพาะฐานข้อมูลปลายทางตอนเก็บ (encryption at rest) ก็เพียงพอ เพราะข้อมูลที่เก็บถาวรคือจุดเสี่ยงสำคัญที่สุด และทราฟฟิกภายในอยู่ในเครือข่ายเพียงชั่วครู่","correct":false,"why":"ผิด เพราะ encryption at rest ป้องกันการเข้าถึงดิสก์หรือ backup ไม่ได้ป้องกันข้อมูลที่กำลังเดินทางระหว่าง service ซึ่งเป็นคนละจุดเสี่ยงและต้องมีทั้งสองอย่าง"}],"explanation":"หลัก zero trust คือไม่เชื่อใจทราฟฟิกเพียงเพราะมาจากเครือข่ายภายใน ข้อมูลส่วนบุคคลที่อ่อนไหวต้องเข้ารหัสระหว่างทางและยืนยันตัวตนปลายทางด้วย การใช้ mTLS ผ่าน mesh ทำให้ภาระของนักพัฒนาต่ำ และเป็นคนละเรื่องกับการเข้ารหัสตอนจัดเก็บ"},{"id":"SEC-S-E-002","level":"senior","pool":"exam","competency":"Security Controls Implementation","descriptor":"S1","concept":"mobile-certificate-pinning-tradeoffs","mobile":true,"type":"multiple","stem":"แอปมือถือบริการการเงินจะทำ certificate pinning เพื่อกัน MITM บน Wi-Fi สาธารณะ แต่เคยมีเหตุที่ certificate ของเซิร์ฟเวอร์ถูกเปลี่ยนตอนใกล้หมดอายุ ทำให้แอปเวอร์ชันเก่าเชื่อมต่อไม่ได้ทั้งหมด ทีมควรออกแบบ pinning อย่างไรเพื่อรักษาสมดุลระหว่างความปลอดภัยและความพร้อมใช้งาน (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"pin ที่ public key (SPKI) ซึ่งทีมควบคุมการหมุนเวียนได้ ไม่ใช่ตัว certificate ทั้งใบที่เปลี่ยนทุกครั้งที่ต่ออายุ","correct":true,"why":"ถูก เพราะ certificate ต่ออายุได้โดยคง key คู่เดิม การ pin ที่ key จึงไม่พังเมื่อต่ออายุตามปกติ"},{"id":"B","text":"pin เฉพาะ certificate ปัจจุบันใบเดียวให้เข้มที่สุด และปล่อยแอปใหม่เมื่อเปลี่ยน certificate ทุกครั้ง","correct":false,"why":"ผิด เพราะการเปลี่ยน certificate ที่ไม่ได้วางแผน (เช่นถูกเพิกถอนฉุกเฉิน) ทำให้ผู้ใช้เวอร์ชันเก่าเชื่อมต่อไม่ได้ทันที และผู้ใช้ไม่ทุกคนอัปเดตทัน"},{"id":"C","text":"ใส่ backup pin ของ key สำรองที่เตรียมไว้ล่วงหน้า และวางแผนการหมุนเวียน key ก่อนวันหมดอายุ","correct":true,"why":"ถูก เพราะ key สำรองที่แอปรู้จักอยู่แล้วทำให้สลับไปใช้ได้โดยไม่ต้องรอผู้ใช้อัปเดตแอป"},{"id":"D","text":"ติดตามอัตราการเชื่อมต่อที่ pin ไม่ผ่านในระบบ monitoring และมีแผนบังคับอัปเดตแอปเวอร์ชันที่ pin ล้าสมัย","correct":true,"why":"ถูก เพราะอัตราความล้มเหลวที่พุ่งขึ้นเป็นสัญญาณทั้งของการตั้งค่าผิดและของการโจมตีจริง และต้องมีทางเลิกใช้ pin เก่าเมื่อถึงเวลา"},{"id":"E","text":"เมื่อ pin ไม่ผ่านให้แอปถอยกลับไปตรวจ certificate แบบปกติแล้วเชื่อมต่อต่อ เพื่อให้ผู้ใช้ยังใช้งานได้ระหว่างที่ certificate เปลี่ยน","correct":false,"why":"ผิด เพราะ pinning มีไว้กันผู้โจมตีที่ถือ certificate ซึ่งผ่านการตรวจปกติ (เช่น CA ถูกเจาะ หรือมีการติดตั้ง CA ปลอมบนเครื่อง) การถอยกลับไปตรวจแบบปกติเมื่อ pin ไม่ผ่านทำให้ pinning ไม่มีผลเลย ควรปฏิเสธการเชื่อมต่อ (fail closed) แล้วรับมือด้วย backup pin และการอัปเดตแอป"}],"explanation":"pinning เพิ่มความปลอดภัยของช่องทางแต่เพิ่มความเสี่ยงด้านความพร้อมใช้งาน จึงต้องออกแบบวงจรชีวิตของ pin คือ pin ที่ key ไม่ใช่ใบรับรอง มี key สำรอง และมีการเฝ้าสังเกตกับแผนเลิกใช้ เมื่อ pin ไม่ผ่านต้องปฏิเสธการเชื่อมต่อ ไม่ใช่ถอยกลับไปตรวจแบบปกติ ส่วนการยืนยันตัวผู้ใช้และสิทธิ์ยังเป็นหน้าที่ของ API"},{"id":"SEC-S-E-003","level":"senior","pool":"exam","competency":"Security Controls Implementation","descriptor":"S1","concept":"jwt-asymmetric-signing-jwks","mobile":false,"type":"single","stem":"ระบบมี auth-service ที่ออก JWT และ microservice อีก 12 ตัวที่ต้องตรวจ token โดยทุกตัวถือค่า JWT_SECRET เดียวกัน (HS256) ทีมความปลอดภัยกังวลว่าถ้า service ใดถูกเจาะ ผู้โจมตีจะออก token ปลอมเป็นแอดมินได้ ข้อกำหนดคือ service ต้องตรวจ token ได้เองโดยไม่เรียก auth-service ทุก request ข้อใดแก้ได้ตรงจุดที่สุด","code":"// auth-service และทุก service ใช้ค่าเดียวกัน\nconst SECRET = process.env.JWT_SECRET;\njwt.sign(payload, SECRET, { algorithm: 'HS256', expiresIn: '15m' });\njwt.verify(token, SECRET, { algorithms: ['HS256'] });","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยน secret เป็นสตริงสุ่มยาว 64 ตัวอักษร และหมุนเวียนค่าทุกเดือนผ่านระบบจัดการ secret ของบริษัท","correct":false,"why":"ผิด เพราะทุก service ยังถือ secret ตัวเดียวกัน ใครได้ secret จาก service ใดก็ออก token ได้ ปัญหาคือการแชร์ key ที่ใช้ทั้งเซ็นและตรวจ ไม่ใช่ความยาวของ secret"},{"id":"B","text":"เพิ่ม claim ลับ (ค่าที่ทุก service รู้ร่วมกัน) เข้าไปใน payload เพื่อให้ token ปลอมสร้างได้ยากขึ้นสำหรับผู้โจมตี","correct":false,"why":"ผิด เพราะ claim ลับนั้นก็เป็นความลับร่วมที่อยู่ในทุก service เหมือนเดิม ใครเจาะ service ใดก็ได้ค่านี้ไปพร้อมกับ secret"},{"id":"C","text":"ให้ทุก service เรียก introspection endpoint ของ auth-service เพื่อตรวจ token ทุก request แทนการตรวจเอง เพื่อควบคุมจุดเดียว","correct":false,"why":"ผิด เพราะขัดกับข้อกำหนดว่าต้องตรวจเองโดยไม่เรียกทุก request อีกทั้งทำให้ auth-service เป็นจุดล้มเหลวเดี่ยวและคอขวดของทุกคำขอ"},{"id":"D","text":"ใช้ลายเซ็นแบบ asymmetric (เช่น RS256 หรือ ES256) โดยให้เฉพาะ auth-service ถือ private key และแจก public key ให้ service อื่นผ่าน JWKS","correct":true,"why":"ถูก เพราะ service อื่นมีแต่ public key ซึ่งตรวจได้แต่เซ็นไม่ได้ ผู้โจมตีที่เจาะ service หนึ่งจึงออก token ปลอมไม่ได้ และตรวจแบบ offline ได้ตามข้อกำหนด"}],"explanation":"ประเด็นออกแบบคือแยกสิทธิ์ 'ออก token' ออกจาก 'ตรวจ token' ลายเซ็นแบบสมมาตรผูกสองอย่างไว้ในความลับเดียวกัน ส่วนแบบอสมมาตรให้เฉพาะผู้ออกถือ private key และแจก public key ผ่าน JWKS ซึ่งหมุนเวียน key ได้ง่าย และทุก service ตรวจเองได้โดยดึง JWKS เป็นครั้งคราวแล้วแคชไว้ ไม่ต้องเรียก auth-service ทุก request"},{"id":"SEC-S-E-004","level":"senior","pool":"exam","competency":"Security Controls Implementation","descriptor":"S1","concept":"audit-log-integrity","mobile":false,"type":"multiple","stem":"บริษัท fintech ถูกตรวจสอบว่า audit log เชื่อถือได้หรือไม่ ปัจจุบัน audit log เขียนลง table ในฐานข้อมูลเดียวกับแอป และนักพัฒนาที่มีสิทธิ์ production DB แก้หรือลบ log ได้ ข้อใดช่วยให้ log น่าเชื่อถือขึ้นสำหรับงานตรวจสอบ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ส่ง log แบบ append-only ไปยังที่เก็บแยก (เช่น log service หรือ storage แบบ write-once) ที่ผู้ดูแลแอปไม่มีสิทธิ์แก้หรือลบ","correct":true,"why":"ถูก เพราะแยกอำนาจ ผู้ที่ทำรายการได้ไม่มีสิทธิ์ลบร่องรอยของตัวเอง ทำให้ log เป็นหลักฐานที่ผู้ตรวจเชื่อถือได้"},{"id":"B","text":"เพิ่ม index ที่ column timestamp และ user_id ของ table audit เพื่อให้ผู้ตรวจค้น log ย้อนหลังตามผู้ใช้ได้เร็วขึ้น","correct":false,"why":"ผิด เพราะ index เพิ่มความเร็วค้นหา ไม่เกี่ยวกับการป้องกันการแก้ไขหรือลบ record จึงไม่แก้ปัญหาความน่าเชื่อถือ"},{"id":"C","text":"ใส่ hash chain หรือลายเซ็นต่อ record (เช่น hash ของ record ก่อนหน้า) เพื่อให้ตรวจพบการแก้หรือลบ record กลางทาง","correct":true,"why":"ถูก เพราะการแก้หรือลบ record กลางทางทำให้ chain ขาด จึงตรวจพบการดัดแปลงได้ แต่ต้องเก็บ signing key หรือ hash ล่าสุดเป็นระยะไว้นอกฐานข้อมูล มิฉะนั้นผู้มีสิทธิ์ production DB จะคำนวณ chain ใหม่ทั้งหมดหรือตัด record ท้ายสุดได้โดยตรวจไม่พบ และมาตรการนี้เป็นการตรวจจับ ไม่ใช่การป้องกัน"},{"id":"D","text":"เปิด Transparent Data Encryption ให้ทั้งฐานข้อมูล เพื่อกันไม่ให้ใครแก้หรือลบ log ได้","correct":false,"why":"ผิด เพราะ TDE เข้ารหัสไฟล์บนดิสก์ แต่ผู้ใช้ที่มีสิทธิ์เชื่อมต่อฐานข้อมูลยังเห็นข้อมูลแบบถอดรหัสแล้วและแก้ได้ตามปกติ"}],"explanation":"ความน่าเชื่อถือของ audit log มาจากการแยกอำนาจ (ผู้ถูกตรวจแก้ log ตัวเองไม่ได้) และความสามารถตรวจจับการดัดแปลง (hash chain/ลายเซ็น) ส่วนการเข้ารหัสดิสก์และดัชนีค้นหาแก้โจทย์คนละข้อ"},{"id":"SEC-S-E-005","level":"senior","pool":"exam","competency":"Authentication and Authorization","descriptor":"S2","concept":"spa-token-storage-bff","mobile":false,"type":"single","stem":"ทีมออกแบบ SPA (React) สำหรับระบบภายในที่เรียก API หลายตัวด้วย OAuth 2.0 / OIDC กับ IdP ขององค์กร เงื่อนไขคือยอมรับไม่ได้หากผู้โจมตีที่แทรก JavaScript ผ่าน third-party widget ที่มีช่องโหว่ XSS จะคัดลอก token ออกไปใช้นอกเบราว์เซอร์ ทีมควรเลือกแนวทางใด","options":[{"id":"A","text":"ใช้ Backend-for-Frontend ทำ authorization code flow และเก็บ token ฝั่งเซิร์ฟเวอร์ ให้เบราว์เซอร์ถือแค่ session cookie แบบ HttpOnly, Secure, SameSite","correct":true,"why":"ถูก เพราะ JavaScript อ่าน HttpOnly cookie ไม่ได้ และ token ตัวจริงไม่เคยอยู่ในเบราว์เซอร์ XSS จึงทำได้แค่สั่งการในเซสชันนั้น ไม่ขโมย token ไปใช้ที่อื่น"},{"id":"B","text":"เก็บ access token และ refresh token ไว้ใน localStorage เพราะการใช้ HttpOnly cookie มีปัญหา CSRF จึงควรเลี่ยง และ SPA ต้องอ่าน token เองเพื่อแนบ header","correct":false,"why":"ผิด เพราะ JavaScript อ่าน localStorage ได้ ผู้โจมตีที่ได้ XSS ส่ง token ออกไปได้ทันที CSRF แก้ได้ด้วย SameSite และ anti-CSRF token แต่การขโมย token ที่อ่านได้แก้ไม่ได้"},{"id":"C","text":"เก็บ token ไว้ใน sessionStorage เพราะหายเมื่อปิดแท็บ จึงปลอดภัยกว่า localStorage และไม่ถูกแชร์ข้ามแท็บอื่นของผู้ใช้","correct":false,"why":"ผิด เพราะ script ที่ทำงานอยู่ในหน้าเดียวกันอ่าน sessionStorage ได้เหมือนกัน ความต่างอยู่ที่อายุการเก็บ ไม่ใช่การป้องกันจาก XSS"},{"id":"D","text":"ใช้ implicit flow และเก็บ token ในตัวแปร JavaScript ในหน่วยความจำอย่างเดียว ไม่เขียนลงที่ใดเลย","correct":false,"why":"ผิด เพราะ script ที่ถูกแทรกอ่านตัวแปร global ได้ และถึง token อยู่ใน closure ก็ดักได้ตอนแนบ header ด้วยการครอบ fetch หรือ XMLHttpRequest อีกทั้ง implicit flow ส่ง token มาใน URL fragment ซึ่งเสี่ยงต่อการรั่ว และเลิกแนะนำแล้ว"}],"explanation":"ถ้าโจทย์คือกัน token ถูกขโมยเมื่อ XSS เกิดขึ้น จะไม่ให้ token ตัวจริงอยู่ในที่ที่ JavaScript อ่านได้เลย รูปแบบ BFF ย้าย token ไปอยู่ฝั่งเซิร์ฟเวอร์ ส่วนความเสี่ยง XSS ที่ยังสั่งการในเซสชันได้ ต้องป้องกันที่ต้นเหตุด้วย CSP และการตรวจ third-party script"},{"id":"SEC-S-E-006","level":"senior","pool":"exam","competency":"Authentication and Authorization","descriptor":"S2","concept":"rbac-separation-of-duties","mobile":false,"type":"multiple","stem":"ระบบอนุมัติจ่ายเงินให้ซัพพลายเออร์มี role คือ AP-Clerk, AP-Manager และ Admin ทีมกำลังรีวิวการออกแบบสิทธิ์ ข้อใดสอดคล้องกับหลัก least privilege และ separation of duties (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ผู้สร้างรายการจ่ายเงินต้องไม่ใช่ผู้อนุมัติรายการเดียวกัน (maker-checker) และระบบบังคับกฎนี้ที่ฝั่งเซิร์ฟเวอร์","correct":true,"why":"ถูก เพราะแยกอำนาจสร้างกับอนุมัติ ทำให้การทุจริตหรือความผิดพลาดต้องอาศัยคนสองคน และต้องบังคับที่ server เพื่อไม่ให้ข้ามได้"},{"id":"B","text":"ซ่อนปุ่ม 'อนุมัติ' ใน UI สำหรับ AP-Clerk ก็เพียงพอ เพราะผู้ใช้ที่ไม่เห็นปุ่มจะเรียกการอนุมัติไม่ได้","correct":false,"why":"ผิด เพราะการซ่อนปุ่มเป็นเรื่อง UX ผู้ใช้ที่รู้ URL ของ API ยิง request อนุมัติตรงได้ ต้องตรวจสิทธิ์ที่ endpoint"},{"id":"C","text":"ตรวจ permission ตาม action (เช่น payment:approve) ในทุก endpoint แบบ deny-by-default และให้ role เป็นชุดของ permission","correct":true,"why":"ถูก เพราะการตรวจตาม action ทำให้เพิ่ม role ใหม่ได้โดยไม่แก้โค้ดตรวจ และ deny-by-default ทำให้ endpoint ใหม่ที่ลืมใส่สิทธิ์ไม่เปิดโล่ง"},{"id":"D","text":"ให้ role Admin มีสิทธิ์อนุมัติจ่ายเงินด้วย เพื่อใช้ในกรณีฉุกเฉินที่ AP-Manager ไม่อยู่","correct":false,"why":"ผิด เพราะรวมสิทธิ์จัดการระบบกับสิทธิ์อนุมัติเงินไว้ในบัญชีเดียวทำลาย separation of duties กรณีฉุกเฉินควรมีขั้นตอน break-glass ที่บันทึกและตรวจสอบได้แยกต่างหาก"},{"id":"E","text":"ทบทวนสิทธิ์ของผู้ใช้เป็นระยะ และถอนสิทธิ์ทันทีเมื่อย้ายหน้าที่หรือออกจากงาน","correct":true,"why":"ถูก เพราะสิทธิ์ที่สะสมเกินหน้าที่ปัจจุบัน (privilege creep) เป็นต้นเหตุที่พบบ่อยของการเข้าถึงโดยไม่สมควร"}],"explanation":"ระบบสิทธิ์ที่ดีบังคับที่ฝั่งเซิร์ฟเวอร์ ตรวจตาม permission ของแต่ละ action เปิดเฉพาะที่จำเป็น แยกอำนาจที่ไม่ควรอยู่ในมือคนเดียว และมีรอบทบทวนสิทธิ์เพื่อไม่ให้สะสมเกินความจำเป็นตามเวลา"},{"id":"SEC-S-E-007","level":"senior","pool":"exam","competency":"Authentication and Authorization","descriptor":"S2","concept":"mobile-biometric-server-verification","mobile":true,"type":"single","stem":"แอปมือถือกระเป๋าเงินดิจิทัลต้องการ step-up authentication ก่อนโอนเงินเกิน 20,000 บาท ทีมให้แอปเรียกหน้าจอสแกนลายนิ้วมือของระบบ และเมื่อผ่านจะส่ง request โอนเงินพร้อม flag biometricOk=true ให้ API ผู้ทดสอบ hook แอปบนเครื่องของตัวเองแล้วโอนเงินได้โดยไม่ต้องสแกน ควรออกแบบใหม่อย่างไรเพื่อให้เซิร์ฟเวอร์เชื่อผลได้","options":[{"id":"A","text":"เข้ารหัส flag biometricOk ด้วย key ที่ฝังในแอปก่อนส่ง เพื่อให้ client ปลอมค่าเองไม่ได้ และเซิร์ฟเวอร์ถอดรหัสเพื่ออ่านค่ากลับมาได้ภายหลัง","correct":false,"why":"ผิด เพราะ key อยู่ในแอปที่ผู้โจมตีควบคุมเครื่อง ดึงออกหรือ hook ที่จุดก่อนเข้ารหัสแล้วส่งค่า true ที่ถูกเข้ารหัสอย่างถูกต้องได้"},{"id":"B","text":"เพิ่มการตรวจ root/jailbreak ในแอป และปิดแอปทันทีหากพบว่าเครื่องถูกดัดแปลง พร้อมส่งสัญญาณแจ้งเซิร์ฟเวอร์เพื่อบล็อกบัญชี","correct":false,"why":"ผิด เพราะการตรวจนี้เป็นโค้ดในแอปเอง ผู้ทดสอบ hook ข้ามได้ และแม้ผ่านก็ไม่ได้ทำให้เซิร์ฟเวอร์ได้หลักฐานว่าผู้ใช้สแกนจริง"},{"id":"C","text":"ให้ผลสแกนปลดล็อก private key ในฮาร์ดแวร์ของเครื่อง เพื่อเซ็น challenge จากเซิร์ฟเวอร์ แล้วเซิร์ฟเวอร์ตรวจกับ public key ที่ลงทะเบียนไว้","correct":true,"why":"ถูก เพราะการสแกนต้องเกิดจริงจึงใช้ key เซ็นได้ และเซิร์ฟเวอร์เป็นผู้ตรวจลายเซ็นกับ public key ไม่ต้องเชื่อ flag ที่ client ส่งมา"},{"id":"D","text":"ให้ผู้ใช้ตั้ง PIN 6 หลัก แล้วแอปตรวจ PIN ว่าถูกต้องก่อนส่ง request โอนเงินไปที่ API แทนการใช้ชีวมิติของเครื่อง","correct":false,"why":"ผิด เพราะย้ายปัญหาเดิมไปที่ PIN การตรวจเกิดในแอปและผลเป็นแค่ค่า client ที่ผู้โจมตีข้ามได้เช่นกัน เซิร์ฟเวอร์ต้องเป็นผู้ตรวจหลักฐานเอง"}],"explanation":"ผลตรวจที่เกิดบนเครื่องผู้ใช้เป็นเพียงค่าที่ client รายงาน เซิร์ฟเวอร์จะเชื่อได้เมื่อมีหลักฐานทางการเข้ารหัสที่ตรวจเองได้ การผูกผลสแกนกับการใช้ key ในฮาร์ดแวร์เพื่อเซ็น challenge ทำให้หลักฐานพิสูจน์ได้ทั้งตัวอุปกรณ์และการยืนยันตัวตนของผู้ใช้"},{"id":"SEC-S-E-008","level":"senior","pool":"exam","competency":"Authentication and Authorization","descriptor":"S2","concept":"mfa-recovery-weakness","mobile":false,"type":"multiple","stem":"ระบบใช้ TOTP เป็น MFA ซึ่งตัว TOTP เองแข็งแรงดี แต่ผู้ทดสอบยึดบัญชีผู้ใช้ได้โดยไม่ต้องมี TOTP เลย ผ่านเมนู 'ลืมรหัสผ่าน/เสียมือถือ' ที่ส่งลิงก์รีเซ็ตทางอีเมลแล้วปิด MFA ให้อัตโนมัติ ข้อใดช่วยปิดหรือลดความเสี่ยงของกระบวนการกู้คืนบัญชีนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"การรีเซ็ตรหัสผ่านทางอีเมลต้องไม่ปิด MFA โดยอัตโนมัติ ให้ใช้ recovery code ที่ออกไว้ตอนลงทะเบียน หรือกระบวนการยืนยันตัวตนที่เข้มกว่าอีเมลเพียงอย่างเดียว","correct":true,"why":"ถูก เพราะการกู้คืนที่อ่อนกว่าตัวปัจจัยหลักคือประตูหลัง ผู้โจมตีที่คุมอีเมลได้จึงต้องไม่ผ่านด้วยปัจจัยเดียวนี้"},{"id":"B","text":"เพิ่มคำถามกู้คืนบัญชี เช่น ชื่อสัตว์เลี้ยง เพื่อเป็นด่านยืนยันตัวตนเพิ่มอีกชั้น ซึ่งผู้ใช้จริงจำคำตอบได้ง่ายและกู้บัญชีได้เร็ว","correct":false,"why":"ผิด เพราะคำตอบของคำถามลักษณะนี้เดาได้หรือหาได้จากโซเชียลมีเดีย ถือเป็นปัจจัยที่อ่อนมากและมักถูกใช้เป็นช่องกู้บัญชี"},{"id":"C","text":"แจ้งเตือนผู้ใช้ทุกช่องทางที่ลงทะเบียนไว้เมื่อมีการรีเซ็ตรหัสผ่านหรือเปลี่ยน MFA และจำกัดจำนวนครั้งที่ลอง recovery code","correct":true,"why":"ถูก เพราะเป็นมาตรการที่ลดความเสี่ยง เจ้าของบัญชีจะรู้ตัวและตอบโต้ทัน และการจำกัดจำนวนครั้งกัน recovery code ถูกเดาแบบ brute force (ไม่ได้ปิดช่องโหว่เอง จึงใช้ร่วมกับมาตรการที่ไม่ปิด MFA อัตโนมัติเมื่อรีเซ็ตรหัสผ่านทางอีเมล)"},{"id":"D","text":"ขยายอายุลิงก์รีเซ็ตเป็น 7 วัน เพื่อให้ผู้ใช้ขอลิงก์ใหม่น้อยลงและลดจำนวนคำร้องที่ติดต่อฝ่ายสนับสนุน","correct":false,"why":"ผิด เพราะลิงก์ที่ใช้ได้นานขึ้นเพิ่มโอกาสถูกดัก ถูกส่งต่อ หรือค้างอยู่ในกล่องอีเมลที่ผู้โจมตีเข้าถึงได้ ควรสั้นและใช้ได้ครั้งเดียว"}],"explanation":"ความปลอดภัยของบัญชีเท่ากับจุดที่อ่อนที่สุดของเส้นทางเข้าบัญชี รวมถึงเส้นทางกู้คืน ต้องปิดช่องที่ข้ามปัจจัยที่สองได้ (การกู้คืนต้องเข้มใกล้เคียงกับการล็อกอินปกติ) และลดความเสี่ยงที่เหลือด้วยการจำกัดการเดากับการแจ้งเตือนเจ้าของบัญชีทุกครั้งที่ตัวตนหรือ MFA เปลี่ยน"},{"id":"SEC-S-E-009","level":"senior","pool":"exam","competency":"Authentication and Authorization","descriptor":"S2","concept":"session-fixation-regenerate-id","mobile":false,"type":"single","stem":"ผู้ทดสอบพบว่าผู้โจมตีทำให้เหยื่อใช้ session id ที่ผู้โจมตีรู้ค่าอยู่แล้วได้ (เช่นผ่านลิงก์ที่ฝัง session id) และหลังเหยื่อล็อกอิน ผู้โจมตีใช้ session id เดิมนั้นเข้าบัญชีของเหยื่อได้ ทีมกังวลว่าถ้าเปลี่ยน session ตอนล็อกอิน ตะกร้าสินค้าที่เก็บใน session ก่อนล็อกอินจะหาย จากโค้ดล็อกอินด้านล่าง ข้อใดคือการแก้ที่ตรงสาเหตุที่สุด","code":"app.post('/login', async (req, res) => {\n  const user = await verifyCredentials(req.body.email, req.body.password);\n  if (!user) return res.status(401).end();\n  req.session.userId = user.id;\n  res.json({ ok: true });\n});","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยนให้ session id ยาวขึ้นและสร้างด้วยตัวสุ่มที่ปลอดภัยทางการเข้ารหัส","correct":false,"why":"ผิด เพราะผู้โจมตีรู้ค่า session id อยู่แล้วเพราะเป็นคนกำหนดให้เหยื่อ ความยาวหรือความสุ่มไม่เกี่ยวเมื่อค่านั้นไม่ได้ถูกเดา"},{"id":"B","text":"สร้าง session id ใหม่ (regenerate) หลังยืนยันตัวตนสำเร็จ และทำลาย session เดิมก่อนกำหนด userId","correct":true,"why":"ถูก เพราะค่าที่ผู้โจมตีรู้ไว้จะใช้ไม่ได้หลังล็อกอิน เหยื่อได้ session id ใหม่ที่ผู้โจมตีไม่รู้ ตัดช่องทางของ fixation ที่ต้นเหตุ ส่วนข้อมูลที่ต้องเก็บไว้ เช่น ตะกร้าสินค้า ให้คัดลอกไปยัง session ใหม่ก่อนทำลาย session เดิม"},{"id":"C","text":"ตั้ง cookie ของ session เป็น HttpOnly เพื่อไม่ให้ JavaScript อ่านค่า session id ได้","correct":false,"why":"ผิด เพราะ HttpOnly ป้องกันสคริปต์อ่าน cookie แต่ไม่ได้ป้องกันการที่ผู้โจมตีกำหนดค่าให้เหยื่อ เช่นผ่านลิงก์หรือ cookie ที่ตั้งจากโดเมนย่อย"},{"id":"D","text":"ลดอายุ session ให้เหลือ 5 นาทีเพื่อให้ผู้โจมตีมีเวลาใช้ session ได้น้อยลง","correct":false,"why":"ผิด เพราะเหยื่อล็อกอินแล้วเปิดใช้งานอยู่ ผู้โจมตีใช้ได้ทันทีที่เหยื่อล็อกอิน การลดอายุไม่ตัดช่องโหว่ และทำให้ผู้ใช้จริงถูกเตะออกบ่อย"}],"explanation":"session fixation อาศัยการที่เซิร์ฟเวอร์ยอมรับ session id ที่ client กำหนดและไม่เปลี่ยนมันเมื่อสิทธิ์ของ session เพิ่มขึ้น กฎคือเปลี่ยน session id ทุกครั้งที่ระดับสิทธิ์เปลี่ยน เช่น หลังล็อกอิน หลังยกระดับสิทธิ์ และตอนออกจากระบบ"},{"id":"SEC-S-E-010","level":"senior","pool":"exam","competency":"Security Testing","descriptor":"S3","concept":"dast-authenticated-coverage","mobile":false,"type":"single","stem":"ทีมใส่ DAST scan ใน pipeline เป็นด่านก่อน release ผลสแกนรายงาน 0 high/critical มาหลายสปรินต์ แต่ pentest ภายนอกพบ IDOR และ SQL injection ใน endpoint หลังล็อกอินหลายจุด เมื่อดู log ของ scanner พบว่าถูกเด้งไปหน้า login ตลอดและรวบรวม URL ได้เพียง 14 หน้าสาธารณะ ข้อใดสรุปและแก้ได้ถูกต้องที่สุด","options":[{"id":"A","text":"ผลสะอาดเพราะ DAST ที่ใช้อยู่ตรวจได้ไม่ลึกพอ ให้เปลี่ยนเป็นเครื่องมือยี่ห้อที่ crawl ได้ลึกกว่า และยังสแกนแบบไม่ล็อกอินเช่นเดิม","correct":false,"why":"ผิด เพราะต้นเหตุคือ scanner เข้าหน้าหลังล็อกอินไม่ได้ ไม่ใช่ความสามารถของยี่ห้อเดิม เครื่องมือใหม่ที่ยังสแกนแบบไม่ล็อกอินก็เห็นแค่หน้าสาธารณะเท่าเดิม และ pentest ยืนยันช่องโหว่ด้วยหลักฐานแล้ว"},{"id":"B","text":"ปิดด่าน DAST ออกจาก pipeline เพราะให้ผลที่เชื่อถือไม่ได้ แล้วพึ่ง pentest ภายนอกปีละครั้งเพื่อตรวจช่องโหว่แทน","correct":false,"why":"ผิด เพราะปัญหาอยู่ที่การตั้งค่า scan ไม่ใช่ตัวแนวคิด DAST การเหลือ pentest ปีละครั้งทำให้ช่องโหว่ที่เกิดระหว่างปีไม่ถูกตรวจ"},{"id":"C","text":"ลดระดับด่าน DAST เป็นแค่ warning ที่ไม่บล็อก release เพื่อไม่ให้การ release ติดขัดจากผลสแกนที่ไม่น่าเชื่อถือ","correct":false,"why":"ผิด เพราะด่านที่ไม่บล็อกและให้ผลที่ไม่ครอบคลุม ไม่ช่วยให้ทีมเห็นช่องโหว่ที่แท้จริง ปัญหาที่ต้องแก้คือ coverage ไม่ใช่ความเข้มงวดของด่าน"},{"id":"D","text":"ผลสะอาดเพราะ scanner ไม่ครอบคลุมส่วนที่ต้องล็อกอิน ให้ตั้งค่า authentication ให้ scanner (หลาย role) และใช้จำนวน endpoint ที่ครอบคลุมเป็นเกณฑ์ของด่าน","correct":true,"why":"ถูก เพราะแก้ที่ต้นเหตุ scanner ต้องเข้าถึงหน้าหลังล็อกอินจึงจะพบ SQL injection ใน endpoint เหล่านั้น การใช้หลาย role ช่วยทดสอบการเข้าถึงข้ามสิทธิ์ได้บางส่วน ส่วน IDOR ยังต้องมี test เฉพาะหรือ pentest เสริม และการวัด coverage ป้องกันผลสะอาดจากการไม่ได้ตรวจ"}],"explanation":"ผลสแกนที่ไม่พบอะไรมีความหมายเมื่อรู้ว่าสแกนครอบคลุมอะไรไป จึงควรวัดและตรวจ coverage ควบคู่กับจำนวน finding โดยเฉพาะ DAST ที่ต้องมีการยืนยันตัวตนจึงจะเห็น endpoint หลังล็อกอิน และหลาย role ช่วยให้เห็นช่องโหว่ด้านสิทธิ์บางส่วน แต่ IDOR ที่ต้องรู้ว่าใครเป็นเจ้าของข้อมูลยังต้องทดสอบเฉพาะเพิ่ม"},{"id":"SEC-S-E-011","level":"senior","pool":"exam","competency":"Security Testing","descriptor":"S3","concept":"threat-model-payment-webhook","mobile":false,"type":"multiple","stem":"ทีมทำ threat modeling (STRIDE) ให้ endpoint POST /webhooks/payment ที่รับแจ้งผลชำระเงินจาก payment gateway แล้วเปลี่ยนสถานะคำสั่งซื้อเป็น 'ชำระแล้ว' ข้อใดระบุภัยคุกคามตามหมวด STRIDE และมาตรการที่ตรงกับภัยนั้นได้ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Spoofing: ภัยคือใครก็ส่ง request ปลอมมาที่ URL นี้ได้ มาตรการคือตรวจลายเซ็น (เช่น HMAC) ของ gateway กับ secret หรือ public key ที่ตกลงไว้","correct":true,"why":"ถูก เพราะ URL ของ webhook ไม่ลับ การพิสูจน์ว่า request มาจาก gateway จริงต้องใช้ลายเซ็นที่คนอื่นสร้างไม่ได้"},{"id":"B","text":"Spoofing: ภัยคือ request ปลอมที่ส่งมาที่ URL นี้ มาตรการคือจำกัดด้วย IP allowlist ของ gateway เพียงอย่างเดียวแทนการตรวจลายเซ็น","correct":false,"why":"ผิด เพราะ IP ของผู้ให้บริการเปลี่ยนหรือใช้ร่วมกับลูกค้ารายอื่นได้ และการพึ่งชั้นเดียวเปราะ IP allowlist ใช้เสริมได้ แต่ไม่ใช่การยืนยันตัวตนข้อความ"},{"id":"C","text":"Tampering: ภัยคือ payload ที่ถูกแก้จำนวนเงินหรือสถานะ มาตรการคือเทียบยอดและสถานะกับคำสั่งซื้อในระบบของเราก่อนเปลี่ยนสถานะ โดยไม่เชื่อค่าใน payload เพียงอย่างเดียว","correct":true,"why":"ถูก เพราะลายเซ็นเป็นด่านหลักที่กันการแก้ payload ส่วนการเทียบยอดและสถานะกับคำสั่งซื้อในระบบเป็นด่านเสริมที่จับ payload ที่ยอดไม่ตรงได้ แม้ลายเซ็นผ่าน เช่น เมื่อ secret รั่ว หรือมีการตั้งค่าผิด"},{"id":"D","text":"Spoofing/Tampering (replay): ภัยคือ request ที่ถูกดักไว้พร้อมลายเซ็นถูกต้องถูกส่งซ้ำ มาตรการคือเก็บ event id ที่ประมวลผลแล้วและตรวจ timestamp เพื่อให้ประมวลผลแบบ idempotent","correct":true,"why":"ถูก เพราะ request ที่ถูกดักไว้พร้อมลายเซ็นที่ถูกต้องส่งซ้ำได้ และ gateway เองก็ส่ง webhook ซ้ำเมื่อ retry จึงต้องประมวลผลแบบ idempotent"},{"id":"E","text":"Repudiation: ภัยคือข้อพิพาทว่ามีการแจ้งชำระเงินหรือไม่ มาตรการที่เลือกคือพึ่งบันทึกของ gateway เป็นหลักฐานเดียว แทนการเก็บบันทึกที่รับในระบบเราเอง","correct":false,"why":"ผิด เพราะเมื่อมีข้อพิพาทว่ามีการแจ้งชำระเงินหรือไม่ ต้องมีหลักฐานของเราเอง (ข้อความที่รับ เวลา ผลการตรวจลายเซ็น) ไม่ควรพึ่งบันทึกของอีกฝ่ายอย่างเดียว"}],"explanation":"webhook คือประตูที่เปิดให้ภายนอกสั่งเปลี่ยนสถานะเงิน จึงต้องพิสูจน์ผู้ส่ง (ลายเซ็น) ตรวจเนื้อหากับข้อมูลที่เรามี กัน replay/ซ้ำด้วย idempotency และเก็บหลักฐานของตนเอง การทำ threat model ก่อนเขียนโค้ดช่วยให้ถามคำถามเหล่านี้ได้ทันเวลา"},{"id":"SEC-S-E-012","level":"senior","pool":"exam","competency":"Security Testing","descriptor":"S3","concept":"client-side-check-bypass-mobile","mobile
