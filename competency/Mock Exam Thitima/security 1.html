<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>ข้อสอบซ้อม Security</title>
<style>
/* Soft "warm paper" theme — easier on the eyes for long reading sessions */
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --surface-2: #f1ebdf;
  --fg: #3a352d;
  --muted: #6b6357;
  --border: #e3dccd;
  --border-strong: #cfc6b4;
  --accent: #2f6f6a;
  --accent-soft: #e3efec;
  --accent-fg: #ffffff;
  --ok: #2e7048;
  --ok-bg: #e7f2e9;
  --bad: #a8433c;
  --bad-bg: #f9ebe8;
  --warn: #855d12;
  --warn-bg: #faf0da;
  --focus: #c27a1a;
  --code-bg: #f4efe4;
  --shadow: 0 1px 2px rgba(80, 60, 30, 0.05), 0 2px 8px rgba(80, 60, 30, 0.04);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: 20px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", "Thonburi", "Leelawadee UI", Tahoma, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1d1a;
    --surface: #282521;
    --surface-2: #322e29;
    --fg: #e6dfd2;
    --muted: #b3aa9b;
    --border: #3d3832;
    --border-strong: #554e45;
    --accent: #7fc3bb;
    --accent-soft: #243532;
    --accent-fg: #13201f;
    --ok: #8fd1a4;
    --ok-bg: #1e3026;
    --bad: #f0a097;
    --bad-bg: #3a2420;
    --warn: #e8c47a;
    --warn-bg: #362c18;
    --focus: #f0b45e;
    --code-bg: #24211d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.8;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--gutter);
  padding-bottom: 64px;
}

h1, h2, h3 { line-height: 1.4; margin: 0 0 10px; font-weight: 650; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 14px; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
[tabindex="-1"]:focus { outline: none; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.muted { color: var(--muted); }
.small { font-size: 0.92rem; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* buttons */
.btn {
  font: inherit;
  min-height: 46px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
  font-weight: 600;
}

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* start screen */
fieldset {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px var(--gutter) var(--gutter);
  margin: 0 0 16px;
  min-width: 0;
  background: var(--surface);
  box-shadow: var(--shadow);
}
legend { font-weight: 650; padding: 0 8px; }

.choice {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.choice:hover { background: var(--surface-2); }
.choice input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice input:focus-visible { outline: none; }
.choice .text { min-width: 0; }

.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input[type="number"] {
  font: inherit;
  width: 8rem;
  min-height: 46px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--fg);
}
.error {
  color: var(--bad);
  background: var(--bad-bg);
  border: 1px solid var(--bad);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
}

/* quiz header */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.9rem;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.15rem;
  padding: 4px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.timer.low { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

/* exam only: the header (timer + warning banner) stays on screen while scrolling */
.sticky-head {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.sticky-head .topbar { margin-bottom: 0; }
.time-banner {
  margin-top: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--warn);
  background: var(--warn-bg);
  color: var(--warn);
  font-weight: 650;
}
.time-banner.urgent { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
/* focusing a question title or feedback must not leave it under the sticky header */
.sticky-head ~ .card .qtitle,
.sticky-head ~ .card .feedback { scroll-margin-top: 10rem; }
.score-line { font-weight: 600; }

/* question */
.qtitle { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.01em; }
.multi-note {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 12px;
  border-radius: 8px;
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid var(--warn);
  font-weight: 600;
  font-size: 0.95rem;
}
.stem { font-size: 1.14rem; line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }

pre.code {
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  max-width: 100%;
  font-family: var(--mono);
  font-size: 0.88rem;
  line-height: 1.6;
  tab-size: 2;
}
pre.code code {
  font: inherit;
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
}

.options { border: 0; padding: 0; margin: 0 0 16px; background: transparent; box-shadow: none; }
.opt {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
label.opt { cursor: pointer; }
label.opt:hover { background: var(--surface-2); border-color: var(--border-strong); }
label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
label.opt input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
label.opt input:focus-visible { outline: none; }
.letter {
  flex: 0 0 auto;
  min-width: 1.75em;
  height: 1.75em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 700;
  font-size: 0.85rem;
  margin-top: 3px;
}
label.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt-body { flex: 1 1 auto; min-width: 0; }
.opt-text { white-space: pre-wrap; }

.opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag {
  font-size: 0.85rem;
  font-weight: 650;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.sel { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.why { margin: 6px 0 0; font-size: 0.97rem; line-height: 1.75; color: var(--muted); }
.opt.is-correct .why, .opt.is-wrong .why { color: var(--fg); }

.feedback {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px var(--gutter);
  margin: 0 0 16px;
  background: var(--surface-2);
}
.feedback h3 { margin-bottom: 6px; }
.feedback .points { font-weight: 700; }
.feedback .points.pos { color: var(--ok); }
.feedback .points.neg { color: var(--bad); }
.explain { white-space: pre-wrap; margin: 10px 0 0; line-height: 1.85; }

/* navigation + palette */
.qnav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.qnav .spacer { flex: 1 1 0; }

.palette-wrap { margin-top: 14px; }
.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.pal {
  position: relative;
  font: inherit;
  font-size: 0.95rem;
  min-height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  padding: 0;
  transition: background-color 0.15s ease;
}
.pal:hover { background: var(--surface-2); }
.pal.answered { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.pal.current { outline: 3px solid var(--focus); outline-offset: 1px; }
.pal.flagged::after {
  content: "\2691";
  position: absolute;
  top: -2px;
  right: 3px;
  font-size: 0.8rem;
  color: var(--warn);
  text-shadow: 0 0 2px var(--surface);
}
.pal.answered.flagged::after { color: var(--accent-fg); text-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9rem; color: var(--muted); }

/* results */
.big-score { font-size: 2.2rem; font-weight: 750; line-height: 1.2; margin: 6px 0; color: var(--accent); }
.desc-row { padding: 12px 0; border-top: 1px solid var(--border); }
.desc-row:first-child { border-top: 0; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.review-item { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gutter); margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow); }
.review-item.unanswered { border-color: var(--warn); }

/* review screen */
#app.wide { max-width: 1120px; }
.rv-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.rv-filter { display: block; width: 100%; max-width: 100%; font: inherit; min-height: 46px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); }
code.ic { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); border: 1px solid var(--border); overflow-wrap: anywhere; }
mark { background: var(--warn-bg); color: var(--fg); border-bottom: 2px solid var(--warn); border-radius: 3px; padding: 0 1px; }

.rv-toolbar { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin: 6px 0 4px; }
.rv-prog { flex: 1 1 240px; min-width: 0; }
.rv-prog-text { font-size: 0.95rem; color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
.rv-prog .bar { margin-top: 0; }
.rv-tools { display: flex; flex-wrap: wrap; gap: 10px; }

.rv-layout { margin-top: 0; }
.rv-below { margin-top: 16px; }
.rv-side { display: none; }
.rv-main { min-width: 0; font-size: 1.05rem; line-height: 1.75; max-width: calc(72ch + 2 * var(--gutter) + 2px); margin: 0 auto; }
.rv-side[hidden], .rv-toc-m[hidden] { display: none !important; }

/* table of contents */
.rv-toc-title { font-size: 1.05rem; margin: 0 0 4px; }
.rv-toc-h { font-size: 0.82rem; font-weight: 650; color: var(--muted); margin: 14px 0 4px; line-height: 1.4; }
.rv-toc-list { list-style: none; margin: 0; padding: 0; }
.rv-toc-list a { display: flex; gap: 6px; align-items: baseline; min-height: 44px; padding: 8px 8px; border-radius: 8px; color: var(--fg); text-decoration: none; line-height: 1.45; font-size: 0.97rem; }
.rv-toc-list a:hover { background: var(--accent-soft); }
.rv-tick { flex: 0 0 1.1em; visibility: hidden; color: var(--ok); font-weight: 700; }
.rv-toc-list a.read .rv-tick { visibility: visible; }
.rv-tl { min-width: 0; }
.rv-toc-m { margin: 0 0 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.rv-toc-m > summary { cursor: pointer; min-height: 48px; padding: 10px var(--gutter); font-weight: 650; display: flex; align-items: center; }
.rv-toc-m .rv-toc-body { padding: 0 calc(var(--gutter) - 8px) var(--gutter); }

@media (min-width: 1000px) {
  .rv-layout { display: grid; grid-template-columns: 280px minmax(0, calc(72ch + 2 * var(--gutter) + 2px)); justify-content: center; gap: 36px; align-items: start; }
  .rv-main { margin: 0; width: 100%; }
  .rv-side { display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px 6px 12px 0; }
  .rv-toc-m { display: none; }
  .rv-toc-list a { min-height: 34px; padding: 5px 8px; }
}

/* topic card (accordion) */
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
.rv-card[open] { border-color: var(--accent); }
.rv-sum { display: flex; align-items: center; gap: 12px; padding: 14px var(--gutter); min-height: 60px; cursor: pointer; list-style: none; border-radius: var(--radius); }
.rv-sum::-webkit-details-marker { display: none; }
.rv-sum::marker { content: ''; }
.rv-sum:hover { background: var(--surface-2); }
.rv-sum::after { content: ''; flex: 0 0 auto; width: 0.55em; height: 0.55em; margin: 0 4px 0 2px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.15s ease; }
.rv-card[open] > .rv-sum::after { transform: rotate(-135deg); }
.rv-badge { flex: 0 0 auto; min-width: 2.8em; text-align: center; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-weight: 650; font-size: 0.9rem; line-height: 1.6; }
.rv-sum-main { flex: 1 1 auto; min-width: 0; display: block; }
.rv-sum-main h3 { margin: 0; font-size: 1.1rem; line-height: 1.5; }
.rv-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; }
.rv-meta { font-size: 0.88rem; color: var(--muted); }
.rv-readtag { font-size: 0.8rem; line-height: 1.5; padding: 0 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.rv-readtag[hidden] { display: none; }

.rv-body { padding: 6px var(--gutter) var(--gutter); }
.rv-body > * + * { margin-top: 28px; }
.rv-body > .rv-name { margin-top: 10px; margin-bottom: 0; }
.rv-lead { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px 16px; font-size: 1.12rem; line-height: 1.7; }
.rv-lead p { margin: 0; }
.rv-lab-top { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; line-height: 1.5; }
.rv-sec-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 12px; font-size: 1.05rem; line-height: 1.5; }
.rv-count { font-size: 0.85rem; font-weight: 400; color: var(--muted); }

.rv-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rv-point { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.rv-num { flex: 0 0 auto; width: 2rem; height: 2rem; margin-top: 0.1rem; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 650; line-height: 1; }
.rv-pt { min-width: 0; }
.rv-term { display: block; font-weight: 650; margin-bottom: 2px; }
.rv-rest { display: block; }

.rv-qa { display: grid; gap: 10px; }
.rv-qa-head { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0 14px; font-size: 0.82rem; font-weight: 650; color: var(--muted); }
.rv-qa-row { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.rv-qa-row.full { grid-template-columns: 1fr; }
.rv-q { padding: 12px 14px; background: var(--surface-2); min-width: 0; }
.rv-a { padding: 12px 14px; background: var(--ok-bg); border-left: 4px solid var(--ok); min-width: 0; }
.rv-lab { display: block; font-size: 0.78rem; font-weight: 650; line-height: 1.5; margin-bottom: 2px; color: var(--muted); }
.rv-a .rv-lab { color: var(--ok); }
@media (min-width: 561px) {
  .rv-qa .rv-lab { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}
@media (max-width: 560px) {
  .rv-qa-head { display: none; }
  .rv-qa-row { grid-template-columns: 1fr; }
  .rv-a { border-left: 0; border-top: 4px solid var(--ok); }
}

.rv-pits { display: grid; gap: 10px; }
.rv-pit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: var(--radius-sm); }
.rv-x { flex: 0 0 auto; color: var(--bad); font-weight: 700; }

.rv-ex > summary { cursor: pointer; display: flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--accent); }
.rv-ex pre.code { margin-top: 6px; }

.rv-foot { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
.rv-read-btn[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.rv-read-btn[aria-pressed="true"]::before { content: '\2713\00a0'; }

/* focus mode */
.fc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.fc-keys { font-size: 0.85rem; color: var(--muted); }
.fc-head { max-width: 640px; margin: 20px auto 0; }
.fc-topic { display: flex; align-items: center; gap: 10px; }
.fc-title { margin: 0; font-size: 1.1rem; line-height: 1.45; min-width: 0; }
.fc-pos { margin: 6px 0 10px; }
.fc-head .bar { margin-top: 0; }
.fc-prog-text { margin: 6px 0 0; }
.fc-stage { max-width: 640px; margin: 20px auto 0; }
.fc-card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 30px 34px; min-height: 300px; font-size: 1.3rem; line-height: 1.7; }
.fc-card.t-key { border-top-color: var(--muted); }
.fc-card.t-ex { border-top-color: var(--ok); }
.fc-card.t-pit { border-top-color: var(--bad); }
.fc-card.t-end { border-top-color: var(--accent); }
.fc-card.enter { animation: fc-in 0.18s ease-out; }
@keyframes fc-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fc-chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 20px; font-size: 1rem; }
.fc-chip { display: inline-block; padding: 1px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--fg); font-size: 0.85rem; font-weight: 650; line-height: 1.7; }
.fc-chip.sum { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.fc-chip.ex { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.fc-chip.pit { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.fc-prevmark { font-size: 0.85rem; color: var(--muted); }
.fc-text { margin: 0; }
.fc-term { display: block; font-weight: 650; margin-bottom: 8px; }
.fc-sub { margin: 18px 0 0; font-size: 0.95rem; line-height: 1.6; }
.fc-x { color: var(--bad); font-weight: 700; margin-right: 8px; }
.fc-answer { margin-top: 24px; padding: 16px 20px; background: var(--ok-bg); border-left: 5px solid var(--ok); border-radius: var(--radius-sm); }
.fc-answer p { margin: 0; }
.fc-answer .rv-lab { color: var(--ok); }
.fc-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn.fc-big { min-height: 52px; padding: 10px 22px; font-size: 1.05rem; }
.btn.good { border-color: var(--ok); color: var(--ok); }
.fc-nav { max-width: 640px; margin: 18px auto 0; display: flex; gap: 12px; }
.fc-nav .btn { flex: 1 1 0; }
.fc-note { margin: 0 0 14px; }
@media (max-width: 480px) {
  .fc-card { padding: 22px 18px 26px; font-size: 1.2rem; min-height: 260px; }
  .fc-keys { display: none; }
}

/* dialog */
dialog.dlg {
  max-width: min(480px, calc(100vw - 32px));
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  padding: var(--gutter);
  box-shadow: 0 10px 40px rgba(40, 30, 15, 0.2);
}
dialog.dlg::backdrop { background: rgba(40, 32, 20, 0.45); }
dialog.dlg .row { justify-content: flex-end; margin-top: 14px; }

@media (max-width: 480px) {
  :root { --gutter: 16px; }
  body { font-size: 1rem; }
  h1 { font-size: 1.35rem; }
  .stem { font-size: 1.07rem; }
  .big-score { font-size: 1.8rem; }
  .qnav .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

<script type="application/json" id="exam-data">{"title":"Security","scorePerQuestion":5,"secondsPerQuestion":90,"descriptorNames":{"J1":"Apply common vulnerabilities (OWASP Top 10) using secure coding guideline (e.g., validate input, sanitize output)","J2":"Implement basic authentication mechanisms (e.g., username-password via OAuth 2.0, session token)","J3":"Understand data privacy regulations basics (e.g., collect consent, anonymize PII, enable encryption in transit and at rest)","J4":"Use basic security scanning tools to detect code vulnerabilities","J5":"Follow secure coding guidelines","S1":"Implement comprehensive security measures across components (e.g., encryption, JWT-based auth, audit logging)","S2":"Develop advanced authentication and authorization systems such as role-based access control and multi-factor authentication (e.g., OAuth 2.0, SAML)","S3":"Conduct security testing and vulnerability assessment","S4":"Secure API with input validation, rate limiting, and token-based auth (e.g., API Gateway with WAF)","S5":"Manage security monitoring and incident response"},"levels":{"junior":{"practice":[{"id":"SEC-J-P-001","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"sql-injection-parameterized-query","mobile":false,"type":"single","stem":"ทีมของคุณมีฟังก์ชันค้นหาลูกค้าตามอีเมลดังโค้ดด้านล่าง ผู้ทดสอบกรอกอีเมลเป็น ' OR '1'='1 แล้วได้ข้อมูลลูกค้าทุกคนกลับมา วิธีแก้ที่ตรงจุดที่สุดคืออะไร","code":"async function findCustomer(email: string) {\n  const sql = \"SELECT id, name FROM customers WHERE email = '\" + email + \"'\";\n  return db.query(sql);\n}","codeLang":"typescript","options":[{"id":"A","text":"ใช้ replace ลบเครื่องหมาย ' ออกจากค่า email ก่อนต่อเข้าไปใน SQL ทุกครั้ง","correct":false,"why":"การลบ ' เป็น blacklist เฉพาะจุดที่ไม่ได้แยกข้อมูลออกจากคำสั่ง SQL ใช้กับค่าที่ไม่อยู่ในเครื่องหมาย quote ไม่ได้ (เช่น ตัวเลขหรือชื่อคอลัมน์) และทำให้ค่าที่ถูกต้องเสีย เช่น o'brien@example.com กลายเป็นคนละอีเมล"},{"id":"B","text":"ใช้ parameterized query เช่น db.query(\"... WHERE email = $1\", [email])","correct":true,"why":"ถูกต้อง เพราะค่าจากผู้ใช้ถูกส่งแยกจากคำสั่ง SQL ฐานข้อมูลจึงมองเป็นข้อมูลเสมอ ไม่ใช่ส่วนของคำสั่ง"},{"id":"C","text":"ตรวจรูปแบบอีเมลว่ามี @ แล้วเข้ารหัส Base64 ก่อนส่งเข้า query","correct":false,"why":"Base64 เป็นแค่การแปลงรูปแบบข้อมูล ไม่ได้แยกข้อมูลออกจากคำสั่ง SQL ค่าที่แปลงแล้วไม่ตรงกับอีเมลในตารางจึงค้นไม่เจอ และการตรวจว่ามี @ ก็ไม่ได้กันอักขระอันตรายที่ปนอยู่ในค่าเดิม"},{"id":"D","text":"เปลี่ยน endpoint จาก GET เป็น POST เพื่อซ่อนค่าไว้ใน body ของ request","correct":false,"why":"การซ่อนค่าใน body ไม่เปลี่ยนวิธีสร้าง SQL ผู้โจมตียังส่ง payload เดิมใน body ได้และ query ยังถูกต่อสตริงเหมือนเดิม"}],"explanation":"SQL injection เกิดเพราะนำข้อมูลจากผู้ใช้ไปต่อสตริงเป็นคำสั่ง SQL วิธีแก้หลักคือ parameterized query (prepared statement) เพื่อแยกคำสั่งออกจากข้อมูล ส่วนการ validate รูปแบบอีเมลเป็นชั้นป้องกันเสริมได้ แต่ไม่ใช่ตัวแทนของ parameterized query"},{"id":"SEC-J-P-002","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"reflected-xss-output-encoding","mobile":false,"type":"single","stem":"หน้าค้นหาของเว็บร้านค้าแสดงข้อความ \"ผลการค้นหาสำหรับ: …\" โดยนำคำค้นจาก URL มาต่อลงใน HTML ที่ server สร้าง ผู้โจมตีส่งลิงก์ที่มี \u003cscript> ซ่อนอยู่ในคำค้นให้ลูกค้ากด แล้วสคริปต์ทำงานบนหน้าเว็บของร้าน ควรแก้อย่างไร","options":[{"id":"A","text":"ตรวจคำค้นด้วย JavaScript ฝั่ง browser ก่อนส่ง request ให้ server","correct":false,"why":"ผู้โจมตีไม่ต้องผ่านหน้าเว็บของเรา เขาสร้างลิงก์ที่มี payload เองได้เลย การตรวจฝั่ง client จึงถูกข้ามได้"},{"id":"B","text":"เปลี่ยนการค้นหาจาก GET เป็น POST เพื่อให้คำค้นไม่อยู่ใน URL","correct":false,"why":"ผู้โจมตียังหลอกให้ผู้ใช้ส่งฟอร์ม POST ได้ และปัญหาจริงคือการแสดงค่าโดยไม่ encode ซึ่งไม่ถูกแก้"},{"id":"C","text":"กรองคำว่า script และ onerror ออกจากคำค้นทั้งหมดก่อนนำไปแสดงผลในหน้า","correct":false,"why":"blacklist ถูกหลบได้ง่าย เช่น ใช้แท็กหรือ event อื่น เขียนปนตัวพิมพ์ใหญ่เล็ก หรือแทรกอักขระพิเศษคั่นกลาง"},{"id":"D","text":"แปลงอักขระพิเศษเป็น HTML entity ตอนแสดงผล (output encoding)","correct":true,"why":"ถูกต้อง เพราะ browser จะแสดง \u003cscript> เป็นตัวอักษรธรรมดา ไม่ตีความเป็นโค้ด"}],"explanation":"Reflected XSS แก้ที่จุดแสดงผลด้วย output encoding ให้เหมาะกับบริบท (HTML, attribute, JavaScript, URL) การใช้ template engine ที่ escape อัตโนมัติและไม่ปิดฟีเจอร์นั้นช่วยลดโอกาสพลาดในงานจริง"},{"id":"SEC-J-P-003","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"idor-order-id-ownership-check","mobile":true,"type":"single","stem":"แอปมือถือร้านค้าออนไลน์เรียก GET /api/orders/12345 พร้อม token ของผู้ใช้ ผู้ทดสอบเปลี่ยนเลขเป็น 12346 แล้วเห็นออเดอร์ของลูกค้าคนอื่น (ชื่อ ที่อยู่ เบอร์โทร) ควรแก้ที่ใด","options":[{"id":"A","text":"ที่ API server ให้ตรวจทุก request ว่าออเดอร์เป็นของผู้ใช้ใน token","correct":true,"why":"ถูกต้อง การตรวจความเป็นเจ้าของข้อมูลต้องทำฝั่ง server ทุกครั้งที่เข้าถึง resource ตามหลัก access control"},{"id":"B","text":"เปลี่ยนเลขออเดอร์จากเลขลำดับเป็น UUID ที่เดายากแทน","correct":false,"why":"UUID เดายากขึ้นแต่ไม่ใช่การควบคุมสิทธิ์ ถ้า UUID รั่วจาก log หรือลิงก์ที่แชร์ คนอื่นก็ยังเปิดดูได้ เพราะ server ยังไม่ตรวจว่าเป็นเจ้าของออเดอร์"},{"id":"C","text":"ซ่อนรายการออเดอร์ของคนอื่นไว้ในหน้าจอของแอปไม่ให้ผู้ใช้เห็นลิงก์","correct":false,"why":"ผู้โจมตียิง API ตรงด้วยเครื่องมืออย่าง proxy ได้โดยไม่ผ่านหน้าจอของแอป"},{"id":"D","text":"ให้แอปเข้ารหัสเลขออเดอร์ด้วยคีย์ที่ฝังอยู่ในแอปก่อนส่งไปที่ server","correct":false,"why":"คีย์ที่ฝังในแอปถูกถอดออกมาได้ และ server ก็ยังไม่ได้ตรวจว่าผู้เรียกเป็นเจ้าของออเดอร์"}],"explanation":"นี่คือ IDOR (Broken Access Control อันดับต้นๆ ของ OWASP Top 10) ผู้ใช้ที่ล็อกอินแล้วไม่ได้แปลว่ามีสิทธิ์ดูทุก resource ต้องตรวจ ownership ที่ server เสมอ ส่วนการซ่อนใน UI หรือ ID ที่เดายากเป็นแค่การเพิ่มความยาก ไม่ใช่การควบคุมสิทธิ์"},{"id":"SEC-J-P-004","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"csrf-token-and-samesite-cookie","mobile":false,"type":"multiple","stem":"เว็บแอปใช้ session cookie ผู้โจมตีทำหน้าเว็บอื่นที่ส่งฟอร์ม POST ไปยัง /account/change-email อัตโนมัติ เมื่อผู้ใช้ที่ล็อกอินอยู่เปิดหน้านั้น อีเมลก็ถูกเปลี่ยน ข้อใดช่วยป้องกัน CSRF ได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจที่ server ว่า request มี session cookie ที่ถูกต้องและยังไม่หมดอายุ","correct":false,"why":"request ปลอมที่ browser ของเหยื่อส่งไปมี session cookie ที่ถูกต้องแนบไปเองอัตโนมัติ จึงผ่านการตรวจนี้ได้ ไม่ได้พิสูจน์ว่าผู้ใช้ตั้งใจส่งคำขอนั้น"},{"id":"B","text":"ใส่ CSRF token ที่สุ่มต่อ session ในฟอร์มและตรวจที่ server ทุกครั้ง","correct":true,"why":"ถูกต้อง หน้าเว็บของผู้โจมตีอ่านค่า token ของเราไม่ได้ จึงปลอม request ที่มี token ถูกต้องไม่ได้"},{"id":"C","text":"บังคับให้ทั้งเว็บใช้ HTTPS เท่านั้น","correct":false,"why":"HTTPS ปกป้องข้อมูลระหว่างทาง แต่ request ปลอมจาก browser ของเหยื่อก็วิ่งผ่าน HTTPS ได้เช่นกัน"},{"id":"D","text":"ตั้ง session cookie เป็น SameSite=Lax หรือ Strict","correct":true,"why":"ถูกต้อง browser จะไม่แนบ cookie ไปกับ request ข้ามเว็บไซต์ (ตามเงื่อนไขของแต่ละค่า) ทำให้ request ปลอมไม่มี session"}],"explanation":"CSRF อาศัยการที่ browser แนบ cookie ให้เองอัตโนมัติ มาตรการหลักคือ CSRF token และ SameSite cookie ซึ่งใช้ร่วมกันได้ ส่วนการตรวจว่ามี session cookie ที่ถูกต้อง และการใช้ HTTPS ไม่ได้แก้สาเหตุ เพราะ request ปลอมก็แนบ cookie จริงและวิ่งผ่าน HTTPS ได้"},{"id":"SEC-J-P-005","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"path-traversal-file-download","mobile":false,"type":"single","stem":"endpoint ดาวน์โหลดรายงานด้านล่างรับชื่อไฟล์จากผู้ใช้ ผู้โจมตีส่ง file=../../../etc/passwd แล้วอ่านไฟล์ระบบได้ วิธีป้องกันใดถูกต้อง","code":"import fs from 'fs';\n\napp.get('/download', (req, res) => {\n  const name = req.query.file as string;\n  fs.createReadStream('/var/app/reports/' + name).pipe(res);\n});","codeLang":"typescript","options":[{"id":"A","text":"ตรวจว่าชื่อไฟล์ลงท้ายด้วย .pdf เท่านั้น ก่อนส่งไฟล์ออกไปให้ผู้ใช้ดาวน์โหลด","correct":false,"why":"ค่า ../../../secret/data.pdf ยังลงท้าย .pdf และยังหลุดออกนอกโฟลเดอร์ได้ การตรวจนามสกุลไม่ได้จำกัดตำแหน่งไฟล์"},{"id":"B","text":"ย้ายโฟลเดอร์ reports ไปไว้ใน path ที่ชื่อยาวและเดายาก และไม่เปิดเผยชื่อโฟลเดอร์","correct":false,"why":"ผู้โจมตีไม่ต้องเดา path ของโฟลเดอร์ เขาแค่ใช้ ../ ไต่ออกจากโฟลเดอร์ที่แอปกำหนดให้อยู่แล้ว"},{"id":"C","text":"resolve path แล้วตรวจว่ายังอยู่ใน /var/app/reports หรือใช้ id แมปไปยังไฟล์ที่อนุญาต","correct":true,"why":"ถูกต้อง เพราะจำกัดได้ตรงจุดว่าไฟล์ที่เปิดต้องอยู่ในโฟลเดอร์ที่ตั้งใจให้ดาวน์โหลด"},{"id":"D","text":"ให้ client ทำ URL-encode ชื่อไฟล์ก่อนส่งมาที่ server เพื่อให้อักขระพิเศษปลอดภัย","correct":false,"why":"การ encode เป็นแค่รูปแบบการส่ง เมื่อ server decode แล้วก็ได้ ../ เหมือนเดิม และผู้โจมตีไม่จำเป็นต้องใช้ client ของเรา"}],"explanation":"Path traversal เกิดเมื่อนำอินพุตผู้ใช้ไปประกอบเป็นพาธไฟล์โดยไม่จำกัดขอบเขต แนวทางที่ปลอดภัยคือไม่ให้ผู้ใช้ระบุพาธเอง (ใช้ id หรือ allowlist) หรือ normalize พาธแล้วตรวจว่ายังอยู่ใต้โฟลเดอร์ที่กำหนด"},{"id":"SEC-J-P-006","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"security-misconfiguration-before-go-live","mobile":false,"type":"multiple","stem":"ก่อนเปิดใช้งานจริง (go-live) API บน cloud ของระบบสั่งซื้อ คุณถูกขอให้ตรวจเรื่องการตั้งค่าที่ผิดพลาด (security misconfiguration) ข้อใดควรทำ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เปิด directory listing ของเว็บเซิร์ฟเวอร์ไว้ เพื่อให้ทีมเข้าไปดูไฟล์ได้สะดวก","correct":false,"why":"การเปิด directory listing เผยโครงสร้างไฟล์และอาจเปิดไฟล์สำรองหรือไฟล์ตั้งค่าให้คนนอกเห็น จึงควรปิด"},{"id":"B","text":"เปลี่ยนรหัสผ่านเริ่มต้นของ admin console และบัญชีฐานข้อมูลที่มากับ product","correct":true,"why":"ถูกต้อง รหัสผ่านเริ่มต้นเป็นที่รู้กันทั่วไปและเป็นจุดแรกที่ผู้โจมตีลอง"},{"id":"C","text":"ปิด debug mode และหน้า error แบบละเอียดบน production","correct":true,"why":"ถูกต้อง stack trace และค่า config ใน debug page ช่วยผู้โจมตีเรียนรู้โครงสร้างระบบ"},{"id":"D","text":"ตั้ง CORS เป็น * เพื่อให้เว็บของทุกทีม integrate ได้โดยไม่ติดปัญหา","correct":false,"why":"CORS แบบเปิดทุกที่ทำให้เว็บใดๆ อ่านผลตอบกลับของ API ที่เรียกได้โดยไม่ใช้ credentials ผ่าน browser ของผู้ใช้ได้ รวมถึง API ที่จำกัดการเข้าถึงด้วยเครือข่ายภายใน ควรระบุเฉพาะ origin ที่ไว้ใจ"}],"explanation":"Security misconfiguration พบบ่อยจากค่า default ที่ไม่ปลอดภัยและการเปิดฟีเจอร์ที่ใช้ตอนพัฒนาค้างไว้ ควรมี checklist ก่อน go-live เช่น เปลี่ยน credential เริ่มต้น ปิด debug ปิดบริการที่ไม่ใช้ และจำกัด CORS ตามที่จำเป็น"},{"id":"SEC-J-P-007","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"vulnerable-outdated-component-upgrade","mobile":false,"type":"single","stem":"รายงาน npm audit ของระบบที่ใช้งานจริงแจ้งช่องโหว่ระดับ critical ในไลบรารีรับ-ส่งไฟล์ตัวหนึ่ง และมีเวอร์ชัน patch ที่แก้แล้วออกมา คุณควรทำอะไรเป็นอันดับแรก","options":[{"id":"A","text":"รอให้ถึงรอบ refactor ใหญ่ปลายปี แล้วค่อยอัปเกรดพร้อมกับงานอื่น","correct":false,"why":"ช่องโหว่ critical ที่มี patch แล้วปล่อยค้างไว้หลายเดือนเปิดโอกาสให้ถูกโจมตีด้วย exploit ที่เผยแพร่แล้ว"},{"id":"B","text":"อัปเกรดเป็นเวอร์ชันที่แก้แล้วและรัน regression test ก่อนปล่อย","correct":true,"why":"ถูกต้อง เป็นการแก้ที่ต้นเหตุ และ test ช่วยยืนยันว่าการอัปเกรดไม่ทำให้ฟีเจอร์เดิมเสีย"},{"id":"C","text":"ซ่อนเลขเวอร์ชันของไลบรารีใน response header ไม่ให้ใครรู้","correct":false,"why":"การซ่อนเวอร์ชันแค่ลดข้อมูลให้ผู้โจมตี ไม่ได้ปิดช่องโหว่ในโค้ดที่ยังใช้งานอยู่"},{"id":"D","text":"เพิ่ม WAF rule ที่ดักรูปแบบการโจมตีของช่องโหว่นี้ไว้ก่อน โดยคง dependency เวอร์ชันเดิม","correct":false,"why":"WAF ช่วยลดความเสี่ยงชั่วคราวได้ แต่กฎดักไม่ครบทุกรูปแบบ ช่องโหว่ในไลบรารียังอยู่ ควรใช้เป็นมาตรการเสริมระหว่างรออัปเกรดเท่านั้น"}],"explanation":"การใช้ component ที่มีช่องโหว่ที่ทราบแล้ว (Vulnerable and Outdated Components) เป็นความเสี่ยงที่ป้องกันได้ด้วยการอัปเกรดตามคำแนะนำของ scanner และมี test คุ้มกัน มาตรการชั่วคราวอย่าง WAF ใช้เสริมได้เท่านั้น"},{"id":"SEC-J-P-008","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"ssrf-fetch-url-from-user","mobile":false,"type":"single","stem":"ฟีเจอร์ \"นำเข้ารูปสินค้าจาก URL\" ให้ผู้ใช้วางลิงก์ แล้ว server ของเราไปดาวน์โหลดรูปมาเก็บ ผู้โจมตีใส่ URL ชี้ไปที่ http://169.254.169.254/ ซึ่งเป็นที่อยู่ภายในของ cloud ที่เข้าถึงจากภายในเครื่องเท่านั้น วิธีป้องกัน SSRF ข้อใดถูกต้อง","options":[{"id":"A","text":"อนุญาตเฉพาะโดเมนที่กำหนด และบล็อกการเรียกไปยัง IP ภายใน","correct":true,"why":"ถูกต้อง จำกัดปลายทางที่ server ยอมไปเรียก เพื่อไม่ให้ใช้ server เป็นตัวกลางเข้าถึงระบบภายใน"},{"id":"B","text":"ตรวจว่า URL ลงท้ายด้วย .jpg หรือ .png ก่อนที่ server จะเริ่มดาวน์โหลดรูป","correct":false,"why":"URL ที่ชี้ไปยังระบบภายในก็ใส่ .jpg ต่อท้ายได้ (เช่นเป็น query string) จึงไม่ได้จำกัดปลายทาง"},{"id":"C","text":"ให้ browser ของผู้ใช้ตรวจ URL ก่อนส่งมาที่ server ผ่านสคริปต์ในหน้าเว็บ","correct":false,"why":"การตรวจฝั่ง client ถูกข้ามได้ด้วยการยิง request ตรงไปที่ API"},{"id":"D","text":"ตั้ง timeout ของการดาวน์โหลดไว้ที่ 5 วินาทีและจำกัดขนาดไฟล์ที่ดึงมา","correct":false,"why":"timeout และการจำกัดขนาดช่วยเรื่องทรัพยากร แต่ไม่ได้ห้ามการเรียกไปยังระบบภายใน และ request ที่เข้าถึงข้อมูลภายในใช้เวลาไม่ถึง 5 วินาทีอยู่แล้ว"}],"explanation":"SSRF ทำให้ server ที่อยู่ในเครือข่ายภายในถูกใช้ไปเรียกปลายทางตามที่ผู้โจมตีกำหนด วิธีหลักคือ allowlist ปลายทาง บล็อก IP ภายใน/loopback/metadata และจำกัด egress ของเครื่องที่ทำหน้าที่ดาวน์โหลด"},{"id":"SEC-J-P-009","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J1","concept":"mass-assignment-profile-update","mobile":true,"type":"single","stem":"แอปมือถือส่ง PUT /api/profile พร้อม body {\"displayName\": \"...\", \"phone\": \"...\"} ผู้ทดสอบดักแก้ request เพิ่มฟิลด์ \"role\": \"admin\" แล้วบัญชีของเขากลายเป็นแอดมิน สาเหตุมาจากโค้ดด้านล่าง ควรแก้อย่างไร","code":"app.put('/api/profile', async (req, res) => {\n  await db.users.update(req.user.id, req.body);\n  res.sendStatus(204);\n});","codeLang":"typescript","options":[{"id":"A","text":"ซ่อนช่อง role ไม่ให้แสดงในหน้าจอแก้ไขโปรไฟล์ของแอป และไม่ใส่ในฟอร์มเลย","correct":false,"why":"ผู้โจมตีไม่ได้ใช้หน้าจอของแอป เขาแก้ request ด้วย proxy ได้ตรงๆ"},{"id":"B","text":"ทำ obfuscate โค้ดของแอปเพื่อไม่ให้ใครเห็นว่า API รับฟิลด์อะไร","correct":false,"why":"obfuscation ไม่ปิดช่องโหว่ฝั่ง server และผู้โจมตีดูรูปแบบ request ได้จากการดักข้อมูลอยู่ดี"},{"id":"C","text":"เลือกเฉพาะฟิลด์ที่อนุญาต (displayName, phone) จาก body ไปอัปเดต","correct":true,"why":"ถูกต้อง เป็นการใช้ allowlist ของฟิลด์ ฟิลด์อื่นอย่าง role จะถูกทิ้งแม้ผู้โจมตีส่งมา"},{"id":"D","text":"ตรวจชนิดข้อมูลของทุกฟิลด์ใน body ว่าเป็น string หรือ number","correct":false,"why":"role ที่เป็น string \"admin\" ก็ผ่านการตรวจชนิดข้อมูล ปัญหาคือฟิลด์ที่ไม่ควรให้แก้ ไม่ใช่ชนิดของข้อมูล"}],"explanation":"Mass assignment เกิดเมื่อนำ object จากผู้ใช้ไปเขียนลง model ทั้งก้อน แก้โดยกำหนดฟิลด์ที่ผู้ใช้แก้ได้ชัดเจน (DTO หรือ allowlist) และไม่ไว้ใจว่าแอปของเราจะส่งมาแค่ฟิลด์ที่ตั้งใจ เพราะผู้โจมตีแก้ request เองได้"},{"id":"SEC-J-P-010","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J2","concept":"oauth-authorization-code-pkce-mobile-login","mobile":true,"type":"single","stem":"แอปมือถือของคุณจะเพิ่มปุ่ม \"เข้าสู่ระบบด้วยบัญชีภายนอก\" ที่ใช้ identity provider รายหนึ่งซึ่งรองรับ OAuth 2.0 แนวทางใดสอดคล้องกับ OAuth 2.0 ที่ปลอดภัยสำหรับแอปมือถือ","options":[{"id":"A","text":"ให้ผู้ใช้กรอกรหัสผ่านของบัญชี provider ในแอปของเรา แล้วส่งต่อให้ provider ตรวจ","correct":false,"why":"แอปของเราจะเห็นรหัสผ่านของผู้ใช้ ซึ่งขัดกับเป้าหมายของ OAuth ที่ไม่ให้แอปปลายทางรู้รหัสผ่านของ provider"},{"id":"B","text":"ฝัง client secret ไว้ในแอปเพื่อให้แอปแลก token เองโดยตรงกับ provider","correct":false,"why":"แอปมือถือเป็น public client ไฟล์แอปถูกแกะเอา secret ออกมาได้ จึงใช้ secret ในแอปไม่ได้"},{"id":"C","text":"รับ user id ที่ provider ส่งมาให้แอป แล้วให้ backend เชื่อทันทีว่าเป็นผู้ใช้คนนั้น โดยไม่ตรวจ token","correct":false,"why":"ใครก็ส่ง user id ปลอมให้ backend ได้ ต้องพิสูจน์ตัวตนด้วย token ที่ตรวจกับ provider จริง"},{"id":"D","text":"เปิดหน้าล็อกอินของ provider ผ่าน browser ของระบบ แล้วรับ authorization code มาแลก token (ใช้ PKCE)","correct":true,"why":"ถูกต้อง รหัสผ่านอยู่กับ provider เท่านั้น แอปได้ code ชั่วคราวไปแลก token และ PKCE กัน code ที่ถูกดักไป"}],"explanation":"Authorization Code flow ให้ผู้ใช้ยืนยันตัวตนที่ฝั่ง identity provider แล้วแอปรับ code ไปแลก token สำหรับแอปมือถือและ single-page app ควรเพิ่ม PKCE เพราะเก็บ client secret ไว้ไม่ได้ และฝั่ง backend ต้องตรวจ token/ID token ก่อนสร้าง session ของระบบเรา"},{"id":"SEC-J-P-011","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J2","concept":"password-hashing-bcrypt-salt","mobile":false,"type":"single","stem":"คุณกำลังออกแบบตารางผู้ใช้ของระบบสมาชิก และต้องเลือกวิธีเก็บรหัสผ่าน วิธีใดเหมาะสมที่สุด","options":[{"id":"A","text":"hash ด้วย bcrypt หรือ argon2 ที่ออกแบบมาสำหรับรหัสผ่าน พร้อม salt","correct":true,"why":"ถูกต้อง ช้าโดยตั้งใจและมี salt ต่อผู้ใช้ ทำให้เดาแบบเหมารวมได้ยากแม้ฐานข้อมูลรั่ว"},{"id":"B","text":"hash ด้วย SHA-256 ตรงๆ โดยไม่ใส่ salt เพราะเป็นอัลกอริทึมมาตรฐานที่ใช้กันทั่วไป","correct":false,"why":"SHA-256 เร็วเกินไปสำหรับรหัสผ่านและไม่มี salt จึงถูกเดาจำนวนมากหรือใช้ rainbow table ได้"},{"id":"C","text":"เข้ารหัสด้วย AES แล้วเก็บคีย์ไว้ในไฟล์ config ของแอป","correct":false,"why":"รหัสผ่านที่เข้ารหัสแบบถอดกลับได้ ถ้าคีย์รั่วพร้อมฐานข้อมูล ผู้โจมตีถอดได้ทั้งหมด ควรเป็น one-way hash"},{"id":"D","text":"แปลงเป็น Base64 ก่อนเก็บ เพื่อไม่ให้อ่านออกด้วยตาเมื่อเปิดดูตารางข้อมูล","correct":false,"why":"Base64 เป็นการแปลงรูปแบบ ใครก็ถอดกลับได้ทันทีโดยไม่ต้องมีคีย์"}],"explanation":"รหัสผ่านต้องเก็บเป็น one-way hash ที่ช้าและมี salt (bcrypt, argon2, scrypt) เพื่อให้เมื่อฐานข้อมูลรั่วผู้โจมตีไม่ได้รหัสผ่านจริงง่ายๆ และไม่ควรเข้ารหัสแบบถอดกลับได้หรือใช้ hash ธรรมดาที่เร็ว"},{"id":"SEC-J-P-012","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J2","concept":"session-cookie-httponly-secure","mobile":false,"type":"multiple","stem":"เว็บแอปเก็บ session id ไว้ใน cookie ข้อใดเป็นการตั้งค่าที่ช่วยปกป้อง session cookie (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้งแฟล็ก HttpOnly เพื่อไม่ให้ JavaScript อ่าน cookie ได้","correct":true,"why":"ถูกต้อง ถ้ามี XSS สคริปต์ของผู้โจมตีก็อ่าน session id ไปไม่ได้โดยตรง"},{"id":"B","text":"ตั้ง Domain ของ cookie เป็น .example.co.th ให้ใช้ล็อกอินร่วมกันได้ทุก subdomain","correct":false,"why":"cookie ถูกส่งไปทุก subdomain ถ้า subdomain ใดมี XSS หรือถูกเจาะ ก็อ่านหรือเขียนทับ session cookie ได้ ควรจำกัด scope ให้แคบที่สุด"},{"id":"C","text":"ตั้งแฟล็ก Secure เพื่อให้ browser ส่ง cookie ผ่าน HTTPS เท่านั้น","correct":true,"why":"ถูกต้อง กัน cookie หลุดไปกับ request แบบ HTTP ที่ถูกดักอ่านได้"},{"id":"D","text":"ตั้ง SameSite=None เพื่อให้ cookie ถูกส่งไปกับทุก request ไม่ว่าเว็บใดเป็นผู้เรียก","correct":false,"why":"SameSite=None ทำให้ browser แนบ cookie ไปกับ request ข้ามเว็บไซต์ด้วย เปิดทางให้ CSRF ควรใช้ Lax หรือ Strict เว้นแต่จำเป็นจริง"}],"explanation":"Session id คือกุญแจชั่วคราวของผู้ใช้ จึงควรตั้ง HttpOnly และ Secure จำกัด scope ของ cookie (Domain/Path) ใช้ SameSite เป็น Lax หรือ Strict และกำหนดอายุของ session ให้เหมาะสม"},{"id":"SEC-J-P-013","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J2","concept":"mobile-token-secure-storage","mobile":true,"type":"single","stem":"หลังผู้ใช้ล็อกอินในแอปมือถือสำเร็จ แอปได้รับ access token และ refresh token ควรเก็บไว้ที่ไหนบนเครื่อง","options":[{"id":"A","text":"ในไฟล์ตั้งค่าธรรมดาของแอป (plain-text preferences) เพื่อให้อ่านและเรียกใช้ได้ง่าย","correct":false,"why":"ไฟล์ธรรมดาอ่านได้จากการสำรองข้อมูลหรือเครื่องที่ถูก root/jailbreak และไม่มีการป้องกันเพิ่ม"},{"id":"B","text":"ในไฟล์ภายในแอปที่แปลง token เป็น Base64 ไว้ก่อนเขียนลงเครื่อง","correct":false,"why":"Base64 ไม่ใช่การเข้ารหัส ใครได้ไฟล์ไปถอดค่าได้ทันที"},{"id":"C","text":"ใน Keychain (iOS) หรือเข้ารหัสด้วยคีย์ที่เก็บใน Android Keystore (Android)","correct":true,"why":"ถูกต้อง ที่เก็บของระบบปฏิบัติการจำกัดการเข้าถึงให้เฉพาะแอปของเรา และคีย์ที่ใช้เข้ารหัสไม่ได้อยู่ในไฟล์ของแอป"},{"id":"D","text":"ในฐานข้อมูล SQLite ของแอป โดยเข้ารหัสด้วยคีย์ที่เขียนไว้ในโค้ดของแอป","correct":false,"why":"คีย์ที่ฝังในแอปถูกแกะออกมาได้ด้วยการ decompile เมื่อได้คีย์และไฟล์ฐานข้อมูลก็ถอดรหัส token ได้ทั้งหมด"}],"explanation":"Token ที่ได้หลังล็อกอินเทียบเท่ากุญแจเข้าบัญชี ควรเก็บในที่เก็บข้อมูลลับของระบบปฏิบัติการ (Keychain บน iOS หรือคีย์จาก Android Keystore) ไม่เก็บเป็น plain text ไม่ใช้คีย์ที่ฝังในแอป และไม่เขียนลง log นอกจากนี้ access token ควรมีอายุสั้นเพื่อลดความเสียหายหากรั่ว"},{"id":"SEC-J-P-014","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J2","concept":"login-rate-limit-and-mfa","mobile":false,"type":"multiple","stem":"หน้าล็อกอินของเว็บถูกลองเดารหัสผ่านจำนวนมากจากหลาย IP ข้อใดช่วยลดความเสี่ยงที่หน้าล็อกอิน (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"จำกัดจำนวนครั้งที่ล็อกอินผิดต่อบัญชี (ไม่พึ่งการนับต่อ IP อย่างเดียว) และหน่วงเวลาหรือล็อกชั่วคราว","correct":true,"why":"ถูกต้อง การนับต่อบัญชีใช้ได้แม้ผู้โจมตีกระจายมาจากหลาย IP ทำให้การเดารหัสผ่านช้าลงและมีต้นทุนสูงขึ้น"},{"id":"B","text":"แสดงข้อความต่างกัน เช่น \"ไม่พบอีเมลนี้\" กับ \"รหัสผ่านไม่ถูกต้อง\"","correct":false,"why":"ข้อความที่ต่างกันบอกผู้โจมตีว่าอีเมลใดมีบัญชีอยู่ (user enumeration) ทำให้เป้าหมายแคบลง และไม่ได้ช่วยชะลอการเดารหัสผ่านเลย"},{"id":"C","text":"นับจำนวนครั้งที่ล็อกอินผิดในโค้ด JavaScript ของหน้าเว็บ แล้วปิดปุ่มล็อกอินเมื่อเกินกำหนด","correct":false,"why":"ผู้โจมตียิง request ไปที่ API ล็อกอินโดยตรงโดยไม่ผ่านหน้าเว็บ ตัวนับฝั่ง client จึงไม่มีผลกับการเดารหัสผ่านจำนวนมาก"},{"id":"D","text":"เปิดใช้ MFA (เช่น OTP) ที่หน้าล็อกอิน เพื่อให้รู้รหัสผ่านอย่างเดียวยังเข้าบัญชีไม่ได้","correct":true,"why":"ถูกต้อง ต่อให้ผู้โจมตีเดารหัสผ่านถูก ก็ยังต้องมีปัจจัยที่สอง จึงลดความเสียหายจากการเดารหัสผ่านได้มาก"}],"explanation":"หน้าล็อกอินที่ถูกเดารหัสผ่านจำนวนมากควรจำกัดอัตราการลองต่อบัญชี หน่วงเวลาหรือล็อกชั่วคราว และเสริมด้วย MFA ส่วนการนับฝั่ง client ถูกข้ามได้ และการตอบข้อความต่างกันตามสถานะบัญชียิ่งเปิดเผยข้อมูลให้ผู้โจมตี"},{"id":"SEC-J-P-015","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J3","concept":"pdpa-purpose-limitation-new-purpose","mobile":false,"type":"single","stem":"ร้านค้าออนไลน์เก็บเบอร์โทรลูกค้าเพื่อใช้ติดต่อเรื่องจัดส่งสินค้า โดยลูกค้ายินยอมตามวัตถุประสงค์นั้น ต่อมาทีมการตลาดอยากใช้เบอร์เดียวกันส่ง SMS โปรโมชัน ตามหลักการคุ้มครองข้อมูลส่วนบุคคล (PDPA) ควรทำอย่างไร","options":[{"id":"A","text":"ใช้ได้เลย เพราะข้อมูลอยู่ในระบบของบริษัทเราอยู่แล้วและเป็นของบริษัทเองโดยตรง","correct":false,"why":"การที่บริษัทถือข้อมูลอยู่ไม่ได้ให้สิทธิ์ใช้เพื่อวัตถุประสงค์อื่น ต้องใช้ตามวัตถุประสงค์ที่แจ้งไว้"},{"id":"B","text":"แจ้งวัตถุประสงค์ใหม่และขอความยินยอมการตลาดก่อนใช้ (เว้นแต่มีฐานทางกฎหมายอื่น)","correct":true,"why":"ถูกต้อง เป็นหลักจำกัดการใช้ตามวัตถุประสงค์ (purpose limitation) การใช้เพื่อการตลาดเป็นวัตถุประสงค์ใหม่"},{"id":"C","text":"ใช้ได้ถ้าใส่ข้อความ \"ตอบ STOP เพื่อยกเลิก\" ท้ายทุก SMS ที่ส่งไปหาลูกค้า","correct":false,"why":"ช่องทางยกเลิกเป็นสิ่งที่ดี แต่ไม่ทดแทนการแจ้งวัตถุประสงค์และขอความยินยอมก่อนใช้"},{"id":"D","text":"แจ้งวัตถุประสงค์ใหม่ในประกาศความเป็นส่วนตัวบนเว็บไซต์ แล้วเริ่มส่ง SMS โปรโมชันได้เลย","correct":false,"why":"การประกาศบนเว็บไซต์เป็นแค่การแจ้ง ไม่ใช่ความยินยอมของลูกค้าที่ให้ไว้เฉพาะวัตถุประสงค์จัดส่ง และลูกค้าส่วนใหญ่ไม่ได้ไปอ่านประกาศ"}],"explanation":"หลักสำคัญของ PDPA คือใช้ข้อมูลตามวัตถุประสงค์ที่แจ้งไว้เท่านั้น เมื่อจะใช้เพื่อวัตถุประสงค์ใหม่ต้องแจ้งและขอความยินยอมหรือมีฐานทางกฎหมายอื่น ในกรณีสงสัยควรปรึกษา DPO หรือฝ่ายกฎหมาย"},{"id":"SEC-J-P-016","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J3","concept":"hashed-national-id-not-anonymous","mobile":false,"type":"single","stem":"ทีมข้อมูลจะส่ง dataset ให้บริษัทภายนอกวิเคราะห์ โดยทำ SHA-256 กับเลขบัตรประชาชนในคอลัมน์ national_id แล้วบอกว่าข้อมูลนี้เป็น anonymous แล้ว คุณคิดว่าอย่างไร","options":[{"id":"A","text":"ใช่ เพราะ hash ย้อนกลับเป็นเลขเดิมไม่ได้ จึงระบุตัวบุคคลไม่ได้อีกแล้ว","correct":false,"why":"การย้อนกลับไม่ได้ไม่ได้แปลว่าเดาไม่ได้ เลขบัตรมีรูปแบบจำกัด ผู้โจมตีลอง hash ทุกค่าแล้วเทียบได้"},{"id":"B","text":"ใช่ ถ้าเปลี่ยนไปใช้ SHA-512 แทน เพราะผลลัพธ์ยาวกว่าและเดาได้ยากกว่าเดิมมาก","correct":false,"why":"ความยาวผลลัพธ์ไม่ได้แก้ปัญหา เพราะพื้นที่ของเลขบัตรยังเล็กพอให้ลองทุกค่า"},{"id":"C","text":"ไม่ใช่ เพราะ SHA-256 ถูกเจาะแล้ว ต้องเปลี่ยนไปใช้ bcrypt หรือ Argon2 จึงจะเป็น anonymous","correct":false,"why":"SHA-256 ไม่ได้ถูกเจาะ ปัญหาคือพื้นที่ค่าของเลขบัตรเล็ก bcrypt หรือ Argon2 แค่ทำให้ลองทุกค่าช้าลง แต่ยังโยงกลับหาบุคคลได้ จึงยังไม่ใช่ anonymous"},{"id":"D","text":"ไม่ใช่ เพราะเลขบัตรมีรูปแบบจำกัด ไล่ hash ทุกค่าที่เป็นไปได้ก็เดาเลขเดิมและโยงกลับหาบุคคลได้","correct":true,"why":"ถูกต้อง เป็นแค่ pseudonymisation ไม่ใช่ anonymisation ต้องลบหรือสรุปรวมจนระบุตัวไม่ได้จริง"}],"explanation":"การ hash ตัวระบุที่มีพื้นที่ค่าจำกัด (เลขบัตร เบอร์โทร) ยังเชื่อมโยงกลับหาบุคคลได้ จึงยังเป็นข้อมูลส่วนบุคคล หากต้องการแชร์จริงควรตัดตัวระบุทิ้ง ลดรายละเอียดหรือสรุปรวม และประเมินความเสี่ยงการระบุตัวตนซ้ำ"},{"id":"SEC-J-P-017","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J3","concept":"encryption-in-transit-and-at-rest","mobile":false,"type":"multiple","stem":"ระบบสมาชิกเก็บข้อมูลส่วนบุคคลของลูกค้า (ชื่อ ที่อยู่ เลขบัตรประชาชน) ทั้งในเว็บและแอปมือถือ ข้อใดเป็นแนวทางการเข้ารหัสที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ใช้ HTTP ธรรมดาได้ เพราะ server อยู่หลัง firewall ขององค์กร","correct":false,"why":"ข้อมูลระหว่างอุปกรณ์ของผู้ใช้กับ server ผ่านอินเทอร์เน็ตและ Wi-Fi สาธารณะ ซึ่ง firewall ปลายทางไม่ได้ปกป้อง"},{"id":"B","text":"ใช้ TLS (HTTPS) กับทุก endpoint ที่รับส่งข้อมูลส่วนบุคคล","correct":true,"why":"ถูกต้อง ป้องกันการดักอ่านและแก้ไขข้อมูลระหว่างทาง (in transit)"},{"id":"C","text":"เข้ารหัสข้อมูลอ่อนไหวในฐานข้อมูลและไฟล์ backup (at rest)","correct":true,"why":"ถูกต้อง ถ้าดิสก์หรือ backup หลุด ข้อมูลยังอ่านไม่ได้หากไม่มีคีย์"},{"id":"D","text":"เก็บคีย์เข้ารหัสไว้ใน secret manager แยกจากข้อมูลและซอร์สโค้ด","correct":true,"why":"ถูกต้อง การเข้ารหัสมีประโยชน์เมื่อคีย์ถูกเก็บและควบคุมสิทธิ์แยกจากข้อมูล"},{"id":"E","text":"ใช้ TLS เฉพาะหน้าล็อกอินและหน้าชำระเงิน ส่วนหน้าอื่นของเว็บและ API ใช้ HTTP เพื่อประหยัดทรัพยากร","correct":false,"why":"หน้าที่ใช้ HTTP ยังส่ง session cookie และข้อมูลส่วนบุคคลแบบอ่านได้ ถูกดักหรือแก้ไขระหว่างทางได้ และอาจถูกใช้ยึด session"}],"explanation":"การคุ้มครองข้อมูลส่วนบุคคลต้องครอบคลุมทั้งตอนส่ง (TLS) และตอนเก็บ (encryption at rest) และต้องจัดการคีย์อย่างถูกต้อง ถ้าคีย์วางไว้ข้างข้อมูลหรืออยู่ในซอร์สโค้ด การเข้ารหัสก็แทบไม่ช่วย"},{"id":"SEC-J-P-018","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J3","concept":"app-permission-data-minimisation","mobile":true,"type":"single","stem":"แอปร้านสะดวกซื้อมีฟีเจอร์ \"ค้นหาสาขาใกล้ฉัน\" ทีมโปรดักต์เสนอให้ขอสิทธิ์ตำแหน่งแบบตลอดเวลา (always) ตั้งแต่เปิดแอปครั้งแรก เผื่อใช้วิเคราะห์ในอนาคต ควรทำอย่างไรตามหลักการเก็บข้อมูลเท่าที่จำเป็น","options":[{"id":"A","text":"ขอสิทธิ์ตำแหน่งเฉพาะตอนใช้ฟีเจอร์ค้นหาสาขา พร้อมอธิบายเหตุผล","correct":true,"why":"ถูกต้อง ขอเท่าที่จำเป็นต่อวัตถุประสงค์ที่แจ้งผู้ใช้ และขอในจังหวะที่ผู้ใช้เข้าใจว่าทำไมต้องใช้"},{"id":"B","text":"ขอสิทธิ์ตำแหน่งแบบตลอดเวลาไว้ก่อน แล้วค่อยเลือกใช้ตามที่ทีมต้องการภายหลัง","correct":false,"why":"เป็นการเก็บข้อมูลเผื่อไว้โดยไม่มีวัตถุประสงค์ชัดเจน ขัดกับหลัก data minimisation และ purpose limitation"},{"id":"C","text":"ขอทุกสิทธิ์ที่แอปอาจใช้ในอนาคตพร้อมกันทั้งหมดตั้งแต่เปิดแอปครั้งแรก","correct":false,"why":"ขอเกินความจำเป็นและผู้ใช้ไม่เข้าใจเหตุผล ทำให้ไม่ไว้ใจและอาจปฏิเสธทั้งหมด"},{"id":"D","text":"ขอสิทธิ์ตำแหน่ง และถ้าผู้ใช้ปฏิเสธให้ปิดแอปไม่ให้ใช้งานต่อทุกฟีเจอร์","correct":false,"why":"ฟีเจอร์อื่นของแอปไม่จำเป็นต้องใช้ตำแหน่ง การบังคับให้ยอมรับเพื่อใช้บริการทั้งหมดไม่เหมาะสม"}],"explanation":"ควรเก็บข้อมูลเฉพาะที่จำเป็นต่อวัตถุประสงค์ที่แจ้งไว้ ขอสิทธิ์ในบริบทที่ใช้ และให้แอปทำงานส่วนที่ไม่เกี่ยวข้องต่อได้เมื่อผู้ใช้ไม่ให้สิทธิ์ การเก็บเผื่อไว้ก่อนเพิ่มความเสี่ยงทั้งด้านกฎหมายและความปลอดภัย"},{"id":"SEC-J-P-019","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J4","concept":"sast-source-scan-in-pull-request","mobile":false,"type":"single","stem":"ทีมต้องการตรวจหาจุดเสี่ยงในโค้ดที่เพิ่งเขียน เช่น การต่อสตริง SQL หรือการใช้ฟังก์ชันที่ไม่ปลอดภัย ตั้งแต่ตอนเปิด pull request ควรใช้เครื่องมือแบบใด","options":[{"id":"A","text":"DAST","correct":false,"why":"DAST ทดสอบแอปที่รันอยู่โดยส่ง request เข้าไป จึงตรวจโค้ดที่ยังไม่ได้ build และ deploy ไม่ได้ และไม่ได้ชี้บรรทัดโค้ดที่เสี่ยง"},{"id":"B","text":"SCA","correct":false,"why":"SCA ตรวจช่องโหว่ในไลบรารีที่ใช้ แต่ไม่ได้วิเคราะห์โค้ดที่ทีมเขียนเอง"},{"id":"C","text":"SAST","correct":true,"why":"ถูกต้อง SAST วิเคราะห์โค้ดโดยไม่ต้องรันแอป ตรวจรูปแบบโค้ดเสี่ยงอย่างการต่อสตริง SQL ได้เร็วตั้งแต่ก่อน merge"},{"id":"D","text":"Secret scanning","correct":false,"why":"Secret scanning หา key หรือรหัสผ่านที่เผลอ commit เข้ามา ไม่ได้วิเคราะห์รูปแบบโค้ดเสี่ยงอย่างการต่อสตริง SQL"}],"explanation":"SAST (static analysis) อ่านโค้ดโดยไม่รัน เหมาะกับการตรวจใน pull request ส่วน DAST ทดสอบแอปที่รันอยู่ และ SCA ตรวจ dependency เครื่องมือเหล่านี้ตรวจคนละมุมและใช้เสริมกันได้"},{"id":"SEC-J-P-020","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J4","concept":"sca-report-triage-dependencies","mobile":false,"type":"multiple","stem":"เครื่องมือ SCA แจ้งช่องโหว่ใน dependency 40 รายการของระบบเว็บ คุณควรจัดการอย่างไร (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ดู severity และตรวจว่าโค้ดของเราเรียกใช้ส่วนที่มีช่องโหว่และเข้าถึงได้จากภายนอกหรือไม่ แล้วจัดลำดับความสำคัญ","correct":true,"why":"ถูกต้อง ช่วยเลือกแก้สิ่งที่เสี่ยงจริงก่อน แทนที่จะแก้ตามลำดับรายการ"},{"id":"B","text":"ปิดรายการที่เป็น transitive dependency ทั้งหมด เพราะเราไม่ได้ติดตั้งเอง","correct":false,"why":"transitive dependency ถูกโหลดและรันในแอปของเราเช่นกัน ต้องประเมินความเสี่ยงเหมือนกัน"},{"id":"C","text":"ดู fixed version ที่ report แนะนำ อัปเกรดแล้วรัน test ก่อนปล่อย","correct":true,"why":"ถูกต้อง เป็นแนวทางแก้ที่ต้นเหตุ พร้อม test ยืนยันว่าไม่ทำให้ฟีเจอร์เดิมเสีย"},{"id":"D","text":"อัปเกรดทุก dependency ที่ถูกแจ้งเป็นเวอร์ชันล่าสุดพร้อมกันในครั้งเดียว แล้ว merge เข้า main ทันที","correct":false,"why":"การอัปเกรดหลายรายการข้าม major version พร้อมกันโดยยังไม่ทดสอบอาจทำให้ฟีเจอร์พังและหาต้นเหตุยาก ควรจัดลำดับความเสี่ยงและอัปเกรดเป็นชุดพร้อม test"}],"explanation":"ผลสแกนจำนวนมากต้องคัดกรองตามความเสี่ยงจริง (severity การเข้าถึงได้ ผลกระทบ) แล้วแก้ด้วยการอัปเกรดพร้อม test บันทึกเหตุผลของรายการที่ตัดสินใจไม่แก้ไว้ด้วย แต่ไม่ควรเมินเฉยหรือปิดเครื่องมือ"},{"id":"SEC-J-P-021","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J5","concept":"no-hardcoded-secret-in-mobile-app","mobile":true,"type":"single","stem":"นักพัฒนาแอปมือถือฝัง secret key ของ payment gateway เป็นค่าคงที่ในโค้ดแอปเพื่อเรียกชำระเงินจากแอปโดยตรง แล้วปล่อยขึ้น app store ควรแก้อย่างไร","options":[{"id":"A","text":"แปลง key เป็น Base64 และสลับตัวอักษรก่อนฝังในโค้ดของแอปทุกเวอร์ชันที่ปล่อย","correct":false,"why":"ใครแกะแอปก็ถอดกลับได้ การซ่อนด้วยการแปลงไม่ใช่การปกป้อง secret"},{"id":"B","text":"เก็บ secret key ไว้ที่ server ให้แอปเรียก backend ของเรา และหมุน (rotate) key ใหม่ แทน key เดิมที่เคยฝังไว้","correct":true,"why":"ถูกต้อง secret ไม่ออกจาก server ที่เราควบคุม และ key เดิมที่หลุดไปกับแอปที่ปล่อยแล้วต้องถือว่ารั่ว จึงต้องออก key ใหม่แทน"},{"id":"C","text":"แบ่ง key ออกเป็นสองท่อนและเก็บแยกไว้ในไฟล์ต่างกันภายในแอปเดียวกัน","correct":false,"why":"ผู้โจมตีประกอบสองท่อนกลับได้เมื่อแกะแอป เพราะทั้งสองไฟล์อยู่ในแพ็กเกจแอปเดียวกันที่แจกให้ทุกคน"},{"id":"D","text":"ย้าย key ไปไว้ในไฟล์ตั้งค่าของแอปแทนการเขียนตรงในโค้ดโปรแกรม","correct":false,"why":"ไฟล์ตั้งค่าถูกแพ็กอยู่ในแอปด้วย ผู้ใช้ทุกคนที่ติดตั้งแอปเข้าถึงได้เช่นกัน"}],"explanation":"อะไรก็ตามที่แพ็กอยู่ในแอปมือถือที่แจกจ่ายออกไปถือว่าผู้ใช้ทุกคนเข้าถึงได้ secret ต้องอยู่ฝั่ง server และถ้าเคยฝังไว้แล้วต้อง rotate key เดิมทันที"},{"id":"SEC-J-P-022","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J5","concept":"generic-error-response-no-stack-trace","mobile":false,"type":"single","stem":"API ของระบบจองตั๋วบน production ตอบกลับ stack trace และข้อความ SQL error ทั้งก้อนให้ client เมื่อเกิดข้อผิดพลาด ทีมควรปรับอย่างไร","options":[{"id":"A","text":"คงไว้เหมือนเดิม เพื่อให้ผู้ใช้คัดลอกข้อความแจ้งปัญหาให้ทีมได้ละเอียดทุกครั้ง","correct":false,"why":"รายละเอียดภายในช่วยผู้โจมตีรู้ชื่อตาราง ไลบรารี และโครงสร้างระบบ"},{"id":"B","text":"ตอบเฉพาะ SQL error เพราะข้อความนั้นไม่มีรหัสผ่านหรือข้อมูลลับปนอยู่เลย","correct":false,"why":"ข้อความ SQL เผยชื่อตาราง ชื่อคอลัมน์ และรูปแบบ query ซึ่งช่วยผู้โจมตีสร้าง injection ที่แม่นขึ้น"},{"id":"C","text":"ซ่อนข้อความในหน้าจอของ front-end แต่ยังส่งรายละเอียดใน response เหมือนเดิม","correct":false,"why":"รายละเอียดยังอยู่ใน response ผู้โจมตีเห็นได้จากเครื่องมือ network ของ browser"},{"id":"D","text":"บันทึกรายละเอียดลง server log แล้วตอบ client ด้วยข้อความทั่วไปพร้อมรหัสอ้างอิง","correct":true,"why":"ถูกต้อง ทีมยังไล่ปัญหาจาก log ได้ ส่วนผู้ใช้ภายนอกไม่ได้ข้อมูลภายใน"}],"explanation":"ข้อผิดพลาดที่แสดงต่อผู้ใช้ควรเป็นข้อความทั่วไป ส่วนรายละเอียดเชิงเทคนิคเก็บใน log ฝั่ง server ที่เข้าถึงได้เฉพาะทีม และใช้รหัสอ้างอิงเชื่อมระหว่างสองฝั่ง"},{"id":"SEC-J-P-023","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J5","concept":"no-sensitive-data-in-logs","mobile":true,"type":"multiple","stem":"ทีมแอปมือถือและ backend กำลังตั้งนโยบายเรื่อง log ข้อใดเป็นแนวทางที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้ทีมซัพพอร์ตและนักพัฒนาทุกคนเข้าถึง log ของ production ได้เต็มรูปแบบ เพื่อไล่ปัญหาได้เร็ว","correct":false,"why":"log มักมีข้อมูลผู้ใช้และข้อมูลภายในปนอยู่ การเปิดสิทธิ์กว้างเกินจำเป็นเพิ่มโอกาสรั่วจากคนใน ควรจำกัดสิทธิ์ตามบทบาท"},{"id":"B","text":"ไม่บันทึกข้อมูลอ่อนไหว หรือ mask ค่า เช่น แสดงเลขบัตรเป็น 1-2345-XXXXX-XX-X","correct":true,"why":"ถูกต้อง ลดข้อมูลสำคัญที่อยู่ใน log และยังพอใช้ไล่ปัญหาได้"},{"id":"C","text":"เก็บ log ทั้งหมดไว้ไม่มีกำหนดลบ เผื่อต้องใช้สืบสวนย้อนหลัง","correct":false,"why":"log ที่มีข้อมูลส่วนบุคคลถูกเก็บเกินความจำเป็น เพิ่มความเสี่ยงเมื่อรั่วและขัดกับหลักเก็บเท่าที่จำเป็น ควรกำหนดระยะเวลาเก็บและลบตามรอบ"},{"id":"D","text":"ปิด debug logging ในแอปเวอร์ชันที่ปล่อยจริง (release build)","correct":true,"why":"ถูกต้อง ลดข้อมูลภายในที่หลุดออกจากเครื่องผู้ใช้ และลดโอกาสที่ log ไปอยู่ในที่ที่ไม่ควร"}],"explanation":"Log ควรช่วยตรวจสอบเหตุการณ์ได้โดยไม่เก็บข้อมูลลับหรือข้อมูลส่วนบุคคลเกินจำเป็น ใช้การ mask ปิด debug log ใน release build และจำกัดสิทธิ์ผู้เข้าถึง log"},{"id":"SEC-J-P-024","level":"junior","pool":"practice","competency":"Application Security","descriptor":"J5","concept":"least-privilege-database-account","mobile":false,"type":"single","stem":"เว็บแอปร้านค้าเชื่อมต่อฐานข้อมูลด้วยบัญชี root เพราะสะดวกตอนรัน migration ตามหลักการให้สิทธิ์เท่าที่จำเป็น (least privilege) ควรทำอย่างไร","options":[{"id":"A","text":"ใช้ root ต่อไป แต่ซ่อนรหัสผ่านไว้ใน environment variable แทนการเขียนในโค้ด","correct":false,"why":"รหัสผ่านถูกซ่อนแล้ว แต่ถ้าแอปถูกโจมตี ผู้โจมตียังได้สิทธิ์ root เต็มของฐานข้อมูล"},{"id":"B","text":"ให้ทุกบริการใช้บัญชีเดียวกันเพื่อให้จัดการและหมุนรหัสผ่านง่ายขึ้นในทีม","correct":false,"why":"ทุกบริการได้สิทธิ์เท่ากัน ถ้าบริการหนึ่งถูกเจาะ ผลกระทบกระจายถึงทุกอย่างและตรวจสอบย้อนหลังไม่ได้ว่าใครทำ"},{"id":"C","text":"สร้างบัญชีเฉพาะแอป ให้เฉพาะ SELECT/INSERT/UPDATE บนตารางที่ใช้ และแยกบัญชี migration","correct":true,"why":"ถูกต้อง จำกัดความเสียหายหากแอปถูกโจมตี เช่น ลบตารางหรืออ่านข้อมูลที่ไม่เกี่ยวข้องไม่ได้"},{"id":"D","text":"ใช้ root ได้ถ้าจำกัดว่าเชื่อมต่อได้เฉพาะจาก IP ของ server แอป และเปิด audit log ไว้ด้วย","correct":false,"why":"จำกัด IP ช่วยอีกชั้นหนึ่ง แต่คำสั่งที่ถูกโจมตีผ่านแอปยังรันด้วยสิทธิ์ root ได้เหมือนเดิม"}],"explanation":"หลัก least privilege ลดผลกระทบเมื่อเกิดการโจมตี เช่น SQL injection แอปไม่ควรมีสิทธิ์ DDL หรือสิทธิ์ผู้ดูแลระบบ ส่วน migration ใช้บัญชีแยกที่ใช้เฉพาะตอน deploy"}],"exam":[{"id":"SEC-J-E-001","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"sql-injection-dynamic-order-by-allowlist","mobile":false,"type":"single","stem":"หน้ารายการสินค้าให้ผู้ใช้เลือกคอลัมน์ที่ต้องการเรียงลำดับผ่านพารามิเตอร์ sort ในโค้ดด้านล่าง ผู้โจมตีส่งค่า sort ที่มี SQL แทรกเข้ามาได้ วิธีป้องกันที่เหมาะสมคืออะไร","code":"const sort = req.query.sort as string;\nconst sql = `SELECT id, name, price FROM products ORDER BY ${sort}`;\nconst rows = await db.query(sql);","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยนเป็น ORDER BY $1 แล้วส่งค่า sort เป็น parameter ของ query","correct":false,"why":"placeholder ใช้แทน \"ค่า\" ได้ ไม่ใช่ชื่อคอลัมน์ ผลคือถูกมองเป็นค่าคงที่และไม่เรียงตามคอลัมน์ที่ต้องการ"},{"id":"B","text":"ตัดช่องว่างและเครื่องหมาย ; ออกจากค่า sort ก่อนต่อเข้า query","correct":false,"why":"blacklist ตัวอักขระบางตัวไม่พอ ผู้โจมตียังใส่นิพจน์หรือ subquery ที่ไม่ใช้เครื่องหมายเหล่านั้นได้"},{"id":"C","text":"ใช้ allowlist ของชื่อคอลัมน์ที่อนุญาต ถ้าค่าไม่ตรงให้ใช้ค่าเริ่มต้น","correct":true,"why":"ถูกต้อง ชื่อคอลัมน์ไม่ผูกเป็น parameter ได้ จึงต้องใช้ allowlist ที่ server กำหนดเอง"},{"id":"D","text":"ครอบค่า sort ด้วยเครื่องหมาย quote เป็น ORDER BY '...' ก่อนส่งเข้า query","correct":false,"why":"ผู้โจมตีใส่ quote ปิดและต่อ SQL ของตัวเองได้ และค่าที่ครอบ quote จะกลายเป็นข้อความคงที่ ไม่ใช่ชื่อคอลัมน์"}],"explanation":"Parameterized query ใช้กับค่า (value) ไม่ใช่ identifier อย่างชื่อคอลัมน์ หรือ keyword อย่างทิศทางการเรียง (ASC/DESC) กรณีผู้ใช้เลือกคอลัมน์ได้ ให้แมปค่าจากผู้ใช้ไปยังชื่อคอลัมน์จาก allowlist ฝั่ง server แล้วค่อยประกอบ SQL"},{"id":"SEC-J-E-002","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"dom-xss-innerhtml-vs-textcontent","mobile":false,"type":"single","stem":"หน้าเว็บแสดงข้อความต้อนรับจากชื่อใน URL ผู้โจมตีส่งลิงก์ ?name=\u003cimg src=x onerror=...> ให้ผู้ใช้กด แล้วสคริปต์ทำงานในหน้าเว็บของเรา ควรแก้โค้ดอย่างไร","code":"const params = new URLSearchParams(location.search);\nconst el = document.getElementById('welcome')!;\nel.innerHTML = 'สวัสดี ' + params.get('name');","codeLang":"typescript","options":[{"id":"A","text":"กำหนดค่าด้วย textContent แทน innerHTML เพื่อให้แสดงเป็นข้อความล้วน","correct":true,"why":"ถูกต้อง browser ไม่ตีความ HTML ในข้อความ จึงแสดง \u003cimg ...> เป็นตัวอักษรธรรมดา"},{"id":"B","text":"ตรวจชื่อไม่ให้ยาวเกิน 50 ตัวอักษรก่อนนำไปแสดง","correct":false,"why":"payload ที่ทำงานได้จริงสั้นกว่า 50 ตัวอักษรได้ การจำกัดความยาวไม่ได้กัน HTML ที่แทรกเข้ามา"},{"id":"C","text":"ลบข้อความ \u003cscript> ออกจากชื่อก่อนกำหนดค่าให้ innerHTML","correct":false,"why":"แท็กอย่าง \u003cimg onerror> หรือ \u003csvg onload> ไม่ต้องใช้ \u003cscript> จึงผ่านการกรองนี้ได้"},{"id":"D","text":"เปลี่ยนจาก innerHTML เป็น document.write เพื่อเขียนค่าตอนโหลดหน้า","correct":false,"why":"document.write ตีความ HTML เหมือนกัน ผลคือช่องโหว่เดิมยังอยู่"}],"explanation":"DOM-based XSS เกิดเมื่อ JavaScript ฝั่ง client นำข้อมูลที่ผู้โจมตีควบคุมได้ (เช่นจาก URL) ไปใส่ใน sink ที่ตีความ HTML วิธีที่ง่ายที่สุดคือใช้ API ที่ถือเป็นข้อความล้วน ถ้าจำเป็นต้องแสดง HTML จริงให้ผ่าน sanitizer ที่เชื่อถือได้"},{"id":"SEC-J-E-003","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"open-redirect-return-url-validation","mobile":false,"type":"single","stem":"หน้า /login ของเว็บรับพารามิเตอร์ returnUrl เพื่อพาผู้ใช้กลับไปหน้าเดิมหลังล็อกอิน ผู้โจมตีส่งลิงก์ /login?returnUrl=https://evil.example ให้เหยื่อ แล้วเหยื่อถูกพาไปยังเว็บปลอมที่หน้าตาคล้ายของเราหลังล็อกอิน ควรป้องกันอย่างไร","options":[{"id":"A","text":"แปลง returnUrl เป็น Base64 ก่อนส่งผ่านลิงก์","correct":false,"why":"Base64 เป็นแค่การแปลงรูป ผู้โจมตีเข้ารหัส URL ของตัวเองก็ได้ผลเหมือนเดิม"},{"id":"B","text":"ตรวจว่า returnUrl ขึ้นต้นด้วย https ก่อนพาไป","correct":false,"why":"เว็บปลอมก็ใช้ https ได้ การตรวจ scheme ไม่ได้จำกัดว่าปลายทางเป็นเว็บของเราหรือไม่"},{"id":"C","text":"ตรวจว่า returnUrl มีชื่อโดเมนของเราอยู่ในสตริง เช่น mysite.com","correct":false,"why":"https://evil.example/?mysite.com หรือ mysite.com.evil.example ก็ผ่านการตรวจ contains นี้"},{"id":"D","text":"รับเฉพาะ path ภายในเว็บของเราหรือเทียบกับ allowlist ของโดเมนที่อนุญาต","correct":true,"why":"ถูกต้อง ปลายทางถูกจำกัดให้อยู่ในที่ที่เรากำหนดจริง ไม่ขึ้นกับสตริงที่ผู้โจมตีสร้าง"}],"explanation":"Open redirect ทำให้ลิงก์ที่ดูน่าเชื่อถือพาไปเว็บอันตราย ใช้ในการฟิชชิง วิธีที่ปลอดภัยคืออนุญาตเฉพาะ path ภายใน (ขึ้นต้นด้วย / เดียว และ normalize แล้ว) หรือเทียบ host แบบตรงกันทุกตัวอักษรกับ allowlist ไม่ใช้ contains หรือ startsWith ที่หลบได้"},{"id":"SEC-J-E-004","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"file-upload-profile-photo-validation","mobile":true,"type":"multiple","stem":"แอปมือถือให้ผู้ใช้อัปโหลดรูปโปรไฟล์ไปยัง server แล้วแสดงรูปจาก URL ของ server ข้อใดเป็นแนวทางรับไฟล์อัปโหลดอย่างปลอดภัย (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจเนื้อหาจริงของไฟล์ (เช่น ลายเซ็นไฟล์) และจำกัดขนาดไฟล์ที่ฝั่ง server","correct":true,"why":"ถูกต้อง ไม่เชื่อชนิดไฟล์ที่ client บอกมา และกันไฟล์ขนาดใหญ่ที่ใช้ทรัพยากรหมด"},{"id":"B","text":"ตรวจเฉพาะนามสกุล .jpg หรือ .png จากชื่อไฟล์ที่ client ส่งมา","correct":false,"why":"ชื่อไฟล์แก้ได้ง่าย ไฟล์อันตรายเปลี่ยนนามสกุลเป็น .jpg ก็ผ่านการตรวจนี้"},{"id":"C","text":"ตั้งชื่อไฟล์ใหม่เองที่ server แทนการใช้ชื่อเดิมจากผู้ใช้","correct":true,"why":"ถูกต้อง กันการใช้ชื่อไฟล์ที่มี ../ หรือชื่อซ้ำเพื่อเขียนทับไฟล์อื่น"},{"id":"D","text":"เก็บไฟล์ไว้ในโฟลเดอร์เดียวกับโค้ดเว็บที่ server สั่งรันสคริปต์ได้","correct":false,"why":"ถ้ามีการอัปโหลดสคริปต์ขึ้นมา ไฟล์นั้นอาจถูกสั่งรันบน server ได้"},{"id":"E","text":"เก็บไฟล์นอก web root หรือใน object storage ที่ปิดการรันสคริปต์","correct":true,"why":"ถูกต้อง ต่อให้มีไฟล์แปลกปลอมเข้ามา ก็ไม่ถูกรันเป็นโค้ดบน server"}],"explanation":"การรับไฟล์จากผู้ใช้เป็นพื้นที่เสี่ยง ควรตรวจชนิดและขนาดฝั่ง server ตั้งชื่อใหม่เอง และเก็บในที่ที่ไม่ถูกรันเป็นโค้ด การตรวจฝั่งแอปมือถือช่วยประสบการณ์ผู้ใช้เท่านั้น ไม่ใช่การป้องกัน"},{"id":"SEC-J-E-005","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"command-injection-shell-exec","mobile":false,"type":"single","stem":"เครื่องมือภายในมี endpoint /ping ให้เจ้าหน้าที่ตรวจว่าเครื่องปลายทางตอบสนองไหม แต่ผู้โจมตีส่ง host=8.8.8.8; cat /etc/passwd แล้วได้เนื้อหาไฟล์ระบบกลับมา ควรแก้อย่างไร","code":"import { exec } from 'child_process';\n\napp.get('/ping', (req, res) => {\n  exec('ping -c 1 ' + req.query.host, (err, out) => res.send(out));\n});","codeLang":"typescript","options":[{"id":"A","text":"ลบเครื่องหมาย ; ออกจากค่า host ก่อนต่อเข้าคำสั่ง และกรองคำว่า cat กับ rm ออกด้วย","correct":false,"why":"shell ยังมีวิธีแทรกคำสั่งอื่น เช่น | & && หรือ $( ) และผู้โจมตีเปลี่ยนไปใช้คำสั่งอื่นแทน cat กับ rm ได้ เช่น tac หรือ less"},{"id":"B","text":"ใช้ execFile ส่งอาร์กิวเมนต์เป็นอาร์เรย์ไม่ผ่าน shell และตรวจ host ก่อน","correct":true,"why":"ถูกต้อง ค่าจากผู้ใช้เป็นอาร์กิวเมนต์ล้วน ไม่ถูกตีความเป็นคำสั่ง shell"},{"id":"C","text":"ครอบค่า host ด้วยเครื่องหมายอัญประกาศเดี่ยวในสตริงคำสั่ง เช่น ping -c 1 '8.8.8.8'","correct":false,"why":"ผู้โจมตีใส่เครื่องหมาย ' ปิดอัญประกาศเองแล้วต่อคำสั่งใหม่ได้ เช่น host=x'; cat /etc/passwd; echo ' จึงยังเป็น command injection"},{"id":"D","text":"เพิ่ม timeout ของคำสั่ง ping ให้สั้นลงเหลือ 1 วินาที","correct":false,"why":"คำสั่ง cat ที่แทรกเข้ามาเสร็จภายในเวลาสั้นมาก timeout ไม่ได้ป้องกันการรันคำสั่งอื่น"}],"explanation":"Command injection เกิดเมื่อประกอบสตริงคำสั่งให้ shell แล้วมีข้อมูลจากผู้ใช้ปนอยู่ การกรองอักขระหรือครอบด้วยเครื่องหมายคำพูดถูกเลี่ยงได้ ทางที่ดีคือเลี่ยง shell ใช้ API ที่รับอาร์กิวเมนต์แยก ตรวจรูปแบบอินพุตแบบ allowlist และรันด้วยสิทธิ์น้อยที่สุด"},{"id":"SEC-J-E-006","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"client-side-only-authorization-check","mobile":true,"type":"single","stem":"แอปมือถือสำหรับพนักงานร้านซ่อนปุ่ม \"ลบผู้ใช้\" จากพนักงานทั่วไป แต่ API DELETE /api/users/:id ตรวจแค่ว่าผู้เรียกล็อกอินอยู่ ผู้ทดสอบเรียก API ตรงด้วยบัญชีพนักงานแล้วลบผู้ใช้ได้ ควรแก้ที่ใด","options":[{"id":"A","text":"จำกัดจำนวนครั้งที่เรียก API ลบผู้ใช้ต่อนาทีต่อบัญชี และ log ทุกครั้งที่มีการลบ","correct":false,"why":"rate limit และ log ลดความเสียหายและช่วยตรวจย้อนหลังได้ แต่พนักงานทั่วไปยังลบผู้ใช้ได้ เพราะ server ยังไม่ตรวจสิทธิ์ของผู้เรียก"},{"id":"B","text":"ให้แอปตรวจ role ใน token ก่อนเรียก API แล้วส่ง request เฉพาะเมื่อเป็นแอดมิน","correct":false,"why":"การตรวจในแอปถูกข้ามได้โดยเรียก API ตรง server ต้องตรวจเองเสมอ"},{"id":"C","text":"ให้แอปแนบ header X-Role: admin เมื่อผู้ใช้เป็นแอดมินแล้ว server ตรวจ header นี้","correct":false,"why":"header ที่ client สร้างเองปลอมได้ ใครก็ใส่ X-Role: admin ได้"},{"id":"D","text":"ให้ server ตรวจสิทธิ์ของผู้เรียก (role/permission) ทุกครั้งที่รับ request นี้","correct":true,"why":"ถูกต้อง การตัดสินใจเรื่องสิทธิ์อยู่ที่ server ซึ่งผู้โจมตีแก้ไม่ได้"}],"explanation":"การควบคุมสิทธิ์ (authorization) ต้องทำฝั่ง server ทุก request ส่วน UI ที่ซ่อนปุ่มเป็นแค่ความสะดวกของผู้ใช้ ควรอ่าน role จากข้อมูลที่ server ออกให้และตรวจเองได้ ไม่เชื่อสิ่งที่ client บอกมา"},{"id":"SEC-J-E-007","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"insecure-randomness-reset-token","mobile":false,"type":"single","stem":"ระบบสร้าง token สำหรับลิงก์รีเซ็ตรหัสผ่านด้วยโค้ดด้านล่าง ทีมความปลอดภัยแจ้งว่าผู้โจมตีอาจเดา token ของผู้ใช้อื่นได้ ควรแก้อย่างไร","code":"function createResetToken(): string {\n  return Math.random().toString(36).slice(2, 10);\n}","codeLang":"typescript","options":[{"id":"A","text":"ต่อเวลาปัจจุบัน (Date.now()) ท้าย token เพื่อเพิ่มความสุ่ม","correct":false,"why":"เวลาเป็นค่าที่เดาได้ใกล้เคียง การต่อท้ายไม่ได้ทำให้ token เดายากขึ้นเท่าที่ควร"},{"id":"B","text":"แปลง token เป็น Base64 ก่อนส่งในลิงก์","correct":false,"why":"Base64 แค่เปลี่ยนหน้าตา ไม่เพิ่มความสุ่มของค่าเดิม"},{"id":"C","text":"ใช้ตัวสร้างเลขสุ่มระดับ cryptographic เช่น crypto.randomBytes และใช้ความยาวพอ","correct":true,"why":"ถูกต้อง ผลลัพธ์เดาไม่ได้ในทางปฏิบัติ ต่างจากตัวสุ่มทั่วไปที่ไม่ได้ออกแบบมาเพื่อความปลอดภัย"},{"id":"D","text":"ต่อผลของ Math.random() หลายรอบให้ token ยาวเป็น 20 ตัวอักษร","correct":false,"why":"ยังเป็นตัวสุ่มที่ไม่ปลอดภัยเหมือนเดิม ความยาวเพิ่มแต่การเดารูปแบบการสุ่มยังเป็นไปได้"}],"explanation":"ค่าที่ใช้เป็นความลับ เช่น reset token, session id, API key ต้องสร้างจากตัวสุ่มระดับ cryptographic (CSPRNG) ตัวสุ่มทั่วไปออกแบบมาเพื่อความเร็วและการกระจายตัว ไม่ใช่ความเดาไม่ได้ นอกจากนี้ token ควรหมดอายุเร็วและใช้ได้ครั้งเดียว"},{"id":"SEC-J-E-008","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J1","concept":"excessive-data-exposure-api-response","mobile":true,"type":"multiple","stem":"หน้ารายชื่อเพื่อนในแอปมือถือแสดงแค่ชื่อและรูป แต่ API /api/friends ตอบ object ผู้ใช้ทั้งแถว รวม passwordHash เลขบัตรประชาชน และโน้ตภายในกลับมา ข้อใดช่วยแก้ปัญหานี้และกันไม่ให้เกิดซ้ำ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ซ่อนฟิลด์เหล่านั้นไว้ในหน้าจอของแอปไม่ให้แสดง","correct":false,"why":"ข้อมูลยังถูกส่งมาถึงเครื่องผู้ใช้ ผู้โจมตีดูได้จากการดักข้อมูลหรือเครื่องมือ debug"},{"id":"B","text":"ให้ API ตอบเฉพาะฟิลด์ที่หน้าจอใช้ผ่าน DTO หรือ response schema ที่กำหนดไว้","correct":true,"why":"ถูกต้อง ข้อมูลที่ไม่ควรเห็นไม่ออกจาก server ตั้งแต่ต้น"},{"id":"C","text":"ให้แอปตัดฟิลด์ที่ไม่ใช้ทิ้งทันทีหลังรับ response","correct":false,"why":"ข้อมูลผ่านเครือข่ายและเข้าเครื่องผู้ใช้มาแล้ว การตัดทิ้งทีหลังไม่ช่วยเรื่องการรั่ว"},{"id":"D","text":"เพิ่ม test อัตโนมัติใน CI ที่ตรวจ response ของ endpoint นี้ว่าไม่มีฟิลด์นอกเหนือจาก schema ที่อนุญาต เช่น passwordHash","correct":true,"why":"ถูกต้อง ทำให้ฟิลด์อ่อนไหวที่เผลอหลุดเข้ามาในอนาคตถูกจับได้ตั้งแต่ก่อนปล่อย ไม่ต้องพึ่งการสังเกตด้วยตา"},{"id":"E","text":"ตรวจที่ server ว่าผู้เรียกมีสิทธิ์เห็นข้อมูลของเพื่อนคนนั้นหรือไม่ก่อนตอบ","correct":false,"why":"จำเป็นต่อการกัน IDOR แต่ไม่ได้แก้ปัญหาในโจทย์ เพราะ passwordHash และเลขบัตรไม่ควรถูกส่งให้ใครเลย แม้ผู้เรียกจะเป็นเพื่อนที่มีสิทธิ์เห็นชื่อก็ตาม"}],"explanation":"Excessive data exposure เกิดเมื่อ API ส่งข้อมูลเกินจำเป็นแล้วหวังให้ client กรอง ฝั่ง server ควรกำหนดฟิลด์ที่ส่งในแต่ละ endpoint (DTO หรือ response schema) และมี test ตรวจ schema ของ response ใน CI ส่วนข้อมูลอ่อนไหวอย่าง password hash ไม่ควรออกจาก server เลย การตรวจสิทธิ์การเห็นข้อมูลเป็นอีกเรื่องที่ต้องทำ แต่ไม่ได้แก้ปัญหาฟิลด์ที่ส่งเกิน"},{"id":"SEC-J-E-009","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J2","concept":"oauth-state-parameter-login-csrf","mobile":false,"type":"single","stem":"เว็บของคุณทำปุ่มล็อกอินผ่าน OAuth 2.0 และส่งผู้ใช้ไปหา provider พร้อมพารามิเตอร์ state ที่สุ่มค่า เมื่อ provider ส่งกลับมาที่ callback ระบบต้องทำอะไรกับ state และเพื่ออะไร","options":[{"id":"A","text":"ไม่ตรวจ state ก็ได้ เพราะ authorization code ที่ provider ออกให้ผูกกับผู้ใช้อยู่แล้ว","correct":false,"why":"code ไม่ได้ผูกกับ browser session ที่เริ่มคำขอ ผู้โจมตีเอา code ของตัวเองใส่ลิงก์ callback ให้เหยื่อเปิดได้ (login CSRF) state จึงต้องถูกตรวจ"},{"id":"B","text":"เทียบกับค่าที่เก็บใน session ถ้าไม่ตรงให้ปฏิเสธ เพื่อกัน login CSRF","correct":true,"why":"ถูกต้อง ผูกคำขอล็อกอินกับ session เดิม กัน CSRF ในกระบวนการ OAuth"},{"id":"C","text":"ตรวจเพียงว่ามี state ส่งกลับมา โดยไม่เทียบกับค่าที่ส่งไป","correct":false,"why":"ผู้โจมตีใส่ state ค่าใดก็ได้ในลิงก์ปลอม การมีค่าอยู่ไม่ได้พิสูจน์ว่า callback นี้มาจากคำขอที่ผู้ใช้คนนี้เริ่มเอง"},{"id":"D","text":"ตรวจ redirect_uri ที่ลงทะเบียนไว้กับ provider ซึ่งกัน login CSRF ได้เทียบเท่า state","correct":false,"why":"redirect_uri จำกัดว่า code ถูกส่งกลับไปที่ใด แต่ผู้โจมตียังส่งลิงก์ callback พร้อม code ของตัวเองมายัง redirect_uri ที่ถูกต้องให้เหยื่อเปิดได้"}],"explanation":"พารามิเตอร์ state เป็นค่าสุ่มต่อคำขอที่ผูกกับ session ของผู้ใช้ เมื่อ callback กลับมาต้องตรวจให้ตรงก่อนแลก code เพื่อกัน CSRF ที่บังคับให้เหยื่อล็อกอินเข้าบัญชีของผู้โจมตี"},{"id":"SEC-J-E-010","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J2","concept":"logout-invalidate-session-server-side","mobile":false,"type":"single","stem":"ผู้ดูแลระบบพบว่า session id ของผู้ใช้คนหนึ่งที่เคยหลุดไป ยังใช้เข้าบัญชีได้อยู่แม้ผู้ใช้กดปุ่ม \"ออกจากระบบ\" ไปแล้ว ควรแก้อย่างไร","options":[{"id":"A","text":"ทำให้ session ฝั่ง server เป็นโมฆะเมื่อ logout และกำหนดเวลาหมดอายุของ session","correct":true,"why":"ถูกต้อง session id เดิมใช้ไม่ได้อีกแม้ใครถือไว้"},{"id":"B","text":"ให้ปุ่ม \"ออกจากระบบ\" ลบ cookie ใน browser ก็เพียงพอแล้ว เพราะไม่มี cookie ก็เข้าไม่ได้","correct":false,"why":"ผู้ที่ได้ session id ไปแล้วส่งเองใน request ได้ โดยไม่ต้องใช้ cookie ในเครื่องผู้ใช้"},{"id":"C","text":"พาผู้ใช้ไปหน้าล็อกอินหลังกดออกจากระบบ","correct":false,"why":"การ redirect เปลี่ยนแค่หน้าจอ session บน server ยังคงอยู่"},{"id":"D","text":"เปลี่ยนชื่อ cookie ใหม่ทุกครั้งที่ผู้ใช้ล็อกอิน","correct":false,"why":"ชื่อ cookie ไม่ได้ทำให้ค่า session เก่าใช้ไม่ได้ และผู้โจมตีรู้ชื่อใหม่ได้ง่าย"}],"explanation":"การ logout ต้องทำลายสถานะ session ฝั่ง server (หรือเพิกถอน token ที่เกี่ยวข้อง) ไม่ใช่แค่ลบฝั่ง client นอกจากนี้ควรเปลี่ยน session id หลังล็อกอินสำเร็จ และตั้ง idle timeout"},{"id":"SEC-J-E-011","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J2","concept":"biometric-unlock-local-token","mobile":true,"type":"single","stem":"แอปธนาคารจะเพิ่มการเข้าด้วยลายนิ้วมือหรือใบหน้า แนวทางใดถูกต้องสำหรับการออกแบบ","options":[{"id":"A","text":"ส่งข้อมูลลายนิ้วมือไปเก็บบน server ของเรา เพื่อเทียบตอนล็อกอิน","correct":false,"why":"ข้อมูลชีวมิติเป็นข้อมูลอ่อนไหวมาก ระบบปฏิบัติการเก็บและเทียบในเครื่องอยู่แล้ว ไม่ควรเก็บเพิ่ม"},{"id":"B","text":"ใช้ชีวมิติปลดล็อก token ในที่เก็บลับของเครื่อง ส่วน server ตรวจ token ตามปกติ","correct":true,"why":"ถูกต้อง ผลของชีวมิติใช้ปลดการเข้าถึงข้อมูลลับในเครื่อง ไม่ได้แทนการพิสูจน์ตัวตนกับ server"},{"id":"C","text":"เก็บรหัสผ่านจริงเป็น plain text ในเครื่อง แล้วอ่านออกมาใช้เมื่อชีวมิติผ่านเท่านั้น","correct":false,"why":"รหัสผ่าน plain text ในเครื่องถูกอ่านได้เมื่อเครื่องถูกเจาะ หรือจาก backup"},{"id":"D","text":"เมื่อชีวมิติผ่านให้แอปส่ง flag authenticated=true ไปบอก server","correct":false,"why":"ใครก็ส่ง flag นี้เองได้โดยไม่ผ่านชีวมิติ server ต้องได้หลักฐานที่ตรวจสอบได้ เช่น token"}],"explanation":"ชีวมิติบนมือถือเป็นกลไกยืนยันตัวตนกับ \"เครื่อง\" เพื่อปลดการใช้ credential ที่เก็บไว้ปลอดภัย ฝั่ง server ยังต้องใช้ token ที่ตรวจสอบได้ และไม่ควรเก็บข้อมูลชีวมิติเอง"},{"id":"SEC-J-E-012","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J2","concept":"password-reset-flow-one-time-token","mobile":false,"type":"multiple","stem":"คุณออกแบบฟีเจอร์ \"ลืมรหัสผ่าน\" ของเว็บสมาชิก ข้อใดเป็นแนวทางที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ส่งรหัสผ่านใหม่ที่ระบบสร้างให้ทางอีเมลเป็นข้อความธรรมดา","correct":false,"why":"อีเมลไม่ใช่ช่องทางลับ และรหัสผ่านที่ส่งไปอยู่ในกล่องจดหมายนาน ควรให้ผู้ใช้ตั้งรหัสผ่านเองผ่านลิงก์"},{"id":"B","text":"ส่งลิงก์ที่มี token สุ่ม ใช้ได้ครั้งเดียว และหมดอายุในเวลาสั้น","correct":true,"why":"ถูกต้อง ลดโอกาสที่ลิงก์เก่าหรือที่หลุดไปจะถูกนำมาใช้"},{"id":"C","text":"สร้าง token จากรหัสผู้ใช้ต่อกับเวลาที่ขอรีเซ็ต เพื่อให้ตรวจง่าย","correct":false,"why":"ทั้งสองค่าเดาได้ ผู้โจมตีสร้าง token ของคนอื่นได้ ต้องใช้ค่าสุ่มที่เดาไม่ได้"},{"id":"D","text":"ตอบข้อความเดียวกัน เช่น \"ถ้ามีบัญชีนี้ เราได้ส่งอีเมลไปแล้ว\" ไม่ว่าอีเมลจะมีในระบบหรือไม่","correct":true,"why":"ถูกต้อง ไม่เปิดเผยว่าอีเมลใดมีบัญชีอยู่ในระบบ"}],"explanation":"ขั้นตอนรีเซ็ตรหัสผ่านเป็นประตูหลังของบัญชี จึงต้องใช้ token สุ่มที่ใช้ครั้งเดียวและหมดอายุเร็ว ไม่เปิดเผยว่ามีบัญชีหรือไม่ และไม่ส่งรหัสผ่านเป็น plain text"},{"id":"SEC-J-E-013","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J3","concept":"data-minimisation-signup-form","mobile":true,"type":"single","stem":"แอปสั่งอาหารกำลังออกแบบหน้าสมัครสมาชิก ทีมธุรกิจอยากเก็บเลขบัตรประชาชน ศาสนา และวันเกิด \"เผื่อใช้ในอนาคต\" ทั้งที่บริการตอนนี้ต้องใช้แค่เบอร์โทรและที่อยู่จัดส่ง ตามหลักการคุ้มครองข้อมูลส่วนบุคคลควรทำอย่างไร","options":[{"id":"A","text":"เก็บทั้งหมดไว้ก่อน แล้วค่อยขอความยินยอมเมื่อทีมธุรกิจจะนำไปใช้งานจริงภายหลัง","correct":false,"why":"ต้องแจ้งวัตถุประสงค์ก่อนหรือขณะเก็บ ไม่ใช่เก็บก่อนแล้วหาวัตถุประสงค์ทีหลัง"},{"id":"B","text":"เก็บเลขบัตรประชาชน ศาสนา และวันเกิดได้ ถ้าเข้ารหัสทุกฟิลด์ในฐานข้อมูลและจำกัดสิทธิ์คนเข้าถึง","correct":false,"why":"การเข้ารหัสลดความเสี่ยงตอนรั่ว แต่ไม่ได้ทำให้การเก็บเกินจำเป็นกลายเป็นถูกต้อง"},{"id":"C","text":"เก็บเฉพาะข้อมูลที่จำเป็นต่อบริการที่แจ้งไว้ และไม่เก็บส่วนที่ยังไม่มีวัตถุประสงค์ชัดเจน","correct":true,"why":"ถูกต้อง เป็นหลักการเก็บข้อมูลเท่าที่จำเป็น (data minimisation) ข้อมูลที่ยังไม่มีวัตถุประสงค์ไม่ควรเก็บเลย ไม่ใช่เก็บเป็นฟิลด์ทางเลือก"},{"id":"D","text":"เก็บเฉพาะข้อมูลที่ไม่ใช่ข้อมูลอ่อนไหว เช่น เลขบัตรประชาชนและวันเกิด ส่วนศาสนาให้ตัดออก","correct":false,"why":"ตัดศาสนาออกถูกทาง แต่เลขบัตรประชาชนและวันเกิดก็ยังไม่จำเป็นต่อบริการที่ใช้แค่เบอร์โทรและที่อยู่จัดส่ง การเก็บเผื่อไว้ยังขัดกับหลักเก็บเท่าที่จำเป็น"}],"explanation":"หลัก data minimisation คือเก็บเฉพาะข้อมูลที่จำเป็นต่อวัตถุประสงค์ที่แจ้ง ข้อมูลที่ยังไม่มีวัตถุประสงค์ชัดเจนไม่ควรเก็บเลย ยิ่งเก็บน้อย ความเสี่ยงเมื่อข้อมูลรั่วยิ่งน้อย ข้อมูลอ่อนไหวอย่างศาสนายิ่งต้องระวัง และต้องมีเหตุผลรองรับชัดเจน"},{"id":"SEC-J-E-014","level":"junior","pool":"exam","competency":"Application Security","descriptor":"J3","concept":"data-retention-delete-expired-data","mobile":false,"type":"single","stem":"บริษัทเก็บข้อมูลลูกค้าที่ปิดบัญชีไปแล้วไว้ตลอดไป เพราะ \"เผื่อได้ใช้วิเคราะห์\" ตามแนวคิดของการคุ้มครองข้อมูลส่วนบุคคล ควรทำอย่างไร","options":[{"id":"A","text":"กำหนดระยะเวลาเก็บตามวัตถุประสงค์ แล้วลบหรือทำให้ระบุตัวตนไม่ได้เมื่อครบกำหนด","correct":true,"why":"ถูกต้อง เก็บเท่าที่จำเป็นและมีกระบวนการลบตามกำหนด"},{"id":"B","text":"เก็บตลอดไปได้ ถ้าไฟล์ backup และฐานข้อมูลที่เก็บข้อมูลนั้นถูกเข้ารหัสไว้ทั้งหมด","correct":false,"why":"การเข้ารหัสเป็นเรื่องความปลอดภัย ไม่ได้ทำให้การเก็บเกินความจำเป็นไม่เป็นปัญหา"},{"id":"C","text":"ย้ายไปเก็บใน cold storage ที่ราคาถูกกว่าและเข้าถึงยาก โดยไม่กำหนดวันลบ","correct":false,"why":"ข้อมูลยังเก็บอยู่เกินความจำเป็นและยังเป็นข้อมูลส่วนบุคคล ที่เก็บถูกลงไม่ได้เปลี่ยนสถานะ"},{"id":"D"
