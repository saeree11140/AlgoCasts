`NOT MATERIALIZED` ควบคุมได้","Recursive CTE ประกอบด้วย anchor member (แถวเริ่มต้น) `UNION ALL` recursive member ที่อ้างถึงตัวเอง ใช้กับโครงสร้างลำดับชั้น เช่น org chart, หมวดหมู่ และกราฟ","ถ้าข้อมูลเป็นกราฟที่มีวงวน (cycle) recursive CTE จะวนไม่รู้จบ ป้องกันด้วยการเก็บ path ที่เดินผ่านแล้วและตัดเมื่อเจอซ้ำ, จำกัด depth, หรือใช้ `CYCLE` clause ของ PostgreSQL 14 ขึ้นไป ขีดจำกัดของระบบแตกต่างกัน เช่น SQL Server มี `MAXRECURSION` (ค่าเริ่มต้น 100) และ MySQL 8 มี `cte_max_recursion_depth` (ค่าเริ่มต้น 1000)","Window function อื่นที่ใช้บ่อย: `LAG`/`LEAD` (เทียบแถวก่อนหน้า/ถัดไป), `SUM() OVER (ORDER BY ...)` (running total) โดย window ไม่ลดจำนวนแถวต่างจาก GROUP BY","ใช้ window function ใน WHERE ตรงๆ ไม่ได้ ต้องห่อด้วย subquery หรือ CTE แล้วกรองที่ชั้นนอก"],"examFocus":["ถ้าถามแถวล่าสุดของแต่ละกลุ่มและข้อมูลมี timestamp ซ้ำ ให้เลือกวิธีที่มี tie-breaker ชัดเจน","ถ้าถามหาแถวที่ไม่มีในอีกชุด และมี NULL ได้ ให้เลือก NOT EXISTS แทน NOT IN","ถ้าถามการเดินโครงสร้างต้นไม้หรือกราฟ ให้ใช้ recursive CTE และนึกถึงวงวน","ถ้าต้องการอันดับโดยยังเก็บทุกแถว ให้เลือก window function ไม่ใช่ GROUP BY","ถ้าต้องกรองด้วยผลของ window function ให้ห่อด้วย CTE/subquery"],"pitfalls":["ใช้ `MAX(ts)` JOIN กลับแล้วคิดว่าได้หนึ่งแถวต่อกลุ่มเสมอ ทั้งที่ ts ซ้ำทำให้ได้หลายแถว","เขียน recursive CTE โดยไม่ป้องกันวงวนในข้อมูลที่เป็นกราฟ","คิดว่า ROW_NUMBER, RANK และ DENSE_RANK ให้ผลเหมือนกันเมื่อมีค่าเท่ากัน"],"example":{"lang":"sql","code":"WITH ranked AS (\n  SELECT o.*,\n         ROW_NUMBER() OVER (\n           PARTITION BY customer_id\n           ORDER BY created_at DESC, id DESC\n         ) AS rn\n  FROM orders o\n)\nSELECT * FROM ranked WHERE rn = 1;\n\n-- recursive CTE กันวงวนด้วย depth\nWITH RECURSIVE tree AS (\n  SELECT id, parent_id, 1 AS depth FROM nodes WHERE parent_id IS NULL\n  UNION ALL\n  SELECT n.id, n.parent_id, t.depth + 1\n  FROM nodes n JOIN tree t ON n.parent_id = t.id\n  WHERE t.depth < 20\n)\nSELECT * FROM tree;"}},{"descriptor":"AI-S3","competency":"Prompt & AI","title":"Prompt engineering ขั้นสูง: structured I/O และ few-shot","summary":"การออกแบบ prompt ให้ได้ผลลัพธ์ที่เครื่องอ่านได้และสม่ำเสมอ ด้วยโครงสร้าง input/output ที่ชัดเจน ตัวอย่างที่สมดุล และการประเมินคุณภาพอย่างเป็นระบบ","keyPoints":["Structured output: ระบุ JSON schema ให้ชัด (ชื่อ field, ชนิด, enum ที่อนุญาต, field ที่เป็น null ได้) และสั่งให้ตอบเฉพาะ JSON; ถ้าผู้ให้บริการมีฟีเจอร์ structured output / function calling ให้ใช้เพื่อบังคับ schema","ฝั่งแอปต้อง validate ผลด้วย schema parser เสมอ แล้วจัดการกรณี parse ไม่ผ่านด้วย retry แบบมีข้อความ error ส่งกลับ หรือ fallback ห้ามเชื่อว่าโมเดลจะตอบรูปแบบถูกทุกครั้ง","กำหนดพฤติกรรมเมื่อข้อมูลไม่พอ เช่น ให้ใส่ `null` หรือค่า unknown แทนการเดา เพื่อลด hallucination ในงาน extraction","รูปแบบวันที่: กำหนดผลลัพธ์เป็น ISO 8601 (`YYYY-MM-DD`) ระบุ timezone และถ้ามีคำเช่น พรุ่งนี้ ต้องส่งวันที่อ้างอิงปัจจุบันเข้าไปใน prompt; ระวังปี พ.ศ. ซึ่งมากกว่าปี ค.ศ. อยู่ 543","Few-shot: ให้ตัวอย่าง input/output ที่ครอบคลุมกรณีสำคัญและกรณีขอบ รูปแบบสม่ำเสมอ; ถ้าตัวอย่างมี label ไม่สมดุล (เช่น เกือบทั้งหมดเป็น positive) โมเดลมีแนวโน้มเอนเอียงไปทาง label ส่วนใหญ่ จึงควรสมดุลและระวังลำดับตัวอย่าง","การประมวลผลเป็นชุด (batch): ให้ทุก item มี id แล้วบังคับให้ผลลัพธ์ส่ง id กลับมา อย่าพึ่งลำดับของ array เพื่อจับคู่ผล เพราะโมเดลอาจข้ามหรือสลับลำดับ","แยกส่วนคำสั่งออกจากข้อมูลด้วย delimiter ชัดเจน (เช่น แท็กหรือ code fence) และถือเนื้อหาที่ผู้ใช้ป้อนเป็นข้อมูลไม่ใช่คำสั่ง ช่วยลดความเสี่ยง prompt injection","งานที่ซับซ้อนควรแตกเป็นหลายขั้น (prompt chaining) หรือให้โมเดลให้เหตุผลทีละขั้นก่อนสรุป และตั้ง temperature ต่ำสำหรับงาน extraction ที่ต้องการความสม่ำเสมอ","ประเมินผลงานเชิงสร้างสรรค์ เช่น summary ด้วย rubric ที่มีเกณฑ์ชัด (ความถูกต้องตามต้นฉบับ faithfulness, ความครบถ้วน, ความกระชับ, ภาษา) และชุดข้อมูลทดสอบคงที่; ถ้าใช้ LLM เป็นผู้ตัดสิน (LLM-as-judge) ควรสุ่มตรวจกับคนเพราะผู้ตัดสินก็มีอคติได้"],"examFocus":["ถ้าต้องให้ผลลัพธ์นำไปประมวลผลต่อโดยโปรแกรม ให้เลือก prompt ที่กำหนด schema ชัดเจนและมี validation ฝั่งแอป","ถ้าส่งหลายรายการในคำขอเดียว ให้เลือกแนวทางใส่ id ในอินพุตและบังคับให้ส่งกลับในผลลัพธ์","ถ้า few-shot ทำให้โมเดลตอบ label เดียวซ้ำๆ ให้ตรวจความสมดุลของตัวอย่าง","ถ้าดึงวันที่จากข้อความภาษาไทย ให้ระบุ format ผลลัพธ์ วันที่อ้างอิง และการแปลงปี พ.ศ.","ถ้าต้องการวัดว่า prompt ใหม่ดีกว่าเดิม ให้ใช้ rubric และชุดทดสอบเดียวกันเทียบ"],"pitfalls":["ขอ JSON ใน prompt แล้วไม่ validate ผล ซึ่งทำให้ระบบพังเมื่อโมเดลเติมคำอธิบายหรือรูปแบบผิด","จับคู่ผลลัพธ์ batch กับอินพุตตามลำดับ แทนที่จะใช้ id","ใส่ตัวอย่าง few-shot ที่เหมือนกันหมดหรือ label เอียง แล้วคาดว่าโมเดลจะแยกแยะกรณีอื่นได้"],"example":{"lang":"text","code":"ดึงข้อมูลจากข้อความต่อไปนี้ ตอบเป็น JSON เท่านั้น ตาม schema:\n{ 'items': [ { 'id': string, 'date': 'YYYY-MM-DD' | null, 'sentiment': 'positive' | 'neutral' | 'negative' } ] }\nกติกา: id ต้องตรงกับอินพุต, ถ้าไม่พบวันที่ให้ใส่ null อย่าเดา, ปี พ.ศ. ให้แปลงเป็น ค.ศ.\nวันที่อ้างอิงปัจจุบัน: 2025-06-01\n<items>\n[{ 'id': 'a1', 'text': '...' }, { 'id': 'a2', 'text': '...' }]\n</items>"}},{"descriptor":"PRG-S3","competency":"Program Coding","title":"Debug ขั้นสูงและ algorithm เพื่อ optimization","summary":"การหาสาเหตุของ bug ที่ไม่ชัดเจน เช่น async, race condition, ความคลาดเคลื่อนของตัวเลข และเลือกโครงสร้างข้อมูลหรือ algorithm ที่เหมาะเพื่อให้ถูกต้องและเร็วขึ้น","keyPoints":["`array.forEach(async ...)` ไม่รอ promise ของ callback ฟังก์ชันภายนอกจึงจบก่อนงานเสร็จ ให้ใช้ `for...of` กับ `await` (ทำทีละตัว) หรือ `await Promise.all(items.map(async ...))` (ทำพร้อมกัน)","เงินควรเก็บเป็นจำนวนเต็มหน่วยย่อย (เช่น สตางค์) เพื่อเลี่ยงความคลาดเคลื่อนของ floating point กำหนดจุดและกฎการปัดเศษ (rounding) ให้ชัด เช่น คำนวณ VAT 7% แล้วปัดครั้งเดียวที่ปลายทางหรือรายบรรทัดตามกติกาธุรกิจ","Cache in-flight promise: เก็บ promise ของคำขอที่กำลังทำงานไว้ใน cache เพื่อให้คำขอซ้ำที่มาพร้อมกันใช้ผลเดียวกัน (กัน cache stampede) และต้องลบรายการเมื่อ promise ล้มเหลวเพื่อไม่ให้ค้าง error","Stale response race: เมื่อส่งคำขอหลายครั้งต่อเนื่อง (เช่น ค้นหาขณะพิมพ์) คำตอบเก่าอาจมาถึงทีหลัง ให้ยกเลิกด้วย `AbortController` หรือเทียบ request id/ลำดับล่าสุดแล้วทิ้งผลที่ล้าสมัย","Pair sum: วิธี hash set/Map O(n) เก็บค่าที่เคยเห็นแล้วหา complement; หรือเรียงลำดับแล้วใช้ two pointers O(n log n) ที่ใช้หน่วยความจำเพิ่มน้อยกว่า เลือกตามข้อจำกัด","Binary search ต้องกำหนด invariant ของช่วงให้ชัด (เช่น ช่วง half-open `[lo, hi)`) เพื่อหา lower bound (ตำแหน่งแรกที่ `a[i] >= target`) โดยไม่เกิด off-by-one หรือลูปไม่จบ; ใช้ `mid = lo + Math.floor((hi - lo) / 2)`","ช่วงเวลา (interval) สองช่วง half-open ซ้อนกันเมื่อ `a.start < b.end && b.start < a.end`; ต้องตัดสินว่าช่วงที่ชนปลายพอดี (end เท่ากับ start) นับว่าซ้อนหรือไม่","Dynamic programming แบบ memoization: key ของ cache ต้องรวมตัวแปรสถานะทุกตัวที่มีผลต่อคำตอบ ถ้า key ขาดตัวแปร จะได้ผลผิดจากการใช้ค่าที่แคชไว้ของสถานะอื่น","การจัดกลุ่มตามวัน (day bucketing) ต้องใช้ timezone ของธุรกิจ เช่น Asia/Bangkok (UTC+7 ไม่มี DST) การตัดวันด้วย UTC ทำให้รายการช่วงเช้าตรู่ไทยตกไปคนละวัน","การเรียงหลาย key: เทียบ key แรกก่อน ถ้าเท่ากันค่อยเทียบ key ถัดไป; `Array.prototype.sort` ใน JavaScript เป็น stable ตั้งแต่ ES2019 เทคนิค debug: ทำซ้ำ bug ให้ได้ ลดเป็นตัวอย่างเล็กสุด ใช้ breakpoint/logging, แบ่งครึ่งหาจุดเริ่มผิด (เช่น `git bisect`) และ profile ก่อนปรับความเร็ว"],"examFocus":["ถ้าเจอฟังก์ชัน async ที่คืนผลก่อนงานเสร็จเมื่อใช้ forEach ให้เปลี่ยนเป็น for...of หรือ Promise.all","ถ้าเจอผลรวมเงินเพี้ยนระดับสตางค์ ให้เปลี่ยนเป็นจำนวนเต็มหน่วยย่อยและปัดเศษตามกติกา","ถ้ามีคำขอซ้ำพร้อมกันจำนวนมากไปที่ปลายทางเดียว ให้ใช้ in-flight promise cache","ถ้าหน้าจอแสดงผลของคำค้นเก่าทับของใหม่ ให้ยกเลิกหรือเทียบ request id","ถ้าถามวิธีเร็วขึ้นของปัญหาหาคู่/ช่วง/ค้นหา ให้วิเคราะห์ Big-O และเลือกโครงสร้างที่เหมาะ"],"pitfalls":["คิดว่า forEach รอ async callback ครบก่อนไปบรรทัดถัดไป","ใช้ memo key ที่ขาดตัวแปรสถานะ ทำให้ผลถูกใช้ผิดกรณี","ตัดวันด้วย UTC แล้วคาดว่าตรงกับวันตามเวลาไทย"],"example":{"lang":"javascript","code":"// lower bound: ตำแหน่งแรกที่ a[i] >= target (ช่วง [lo, hi))\nfunction lowerBound(a, target) {\n  let lo = 0, hi = a.length;\n  while (lo < hi) {\n    const mid = lo + Math.floor((hi - lo) / 2);\n    if (a[mid] < target) lo = mid + 1;\n    else hi = mid;\n  }\n  return lo;\n}\n\n// overlap ของช่วง half-open\nconst overlap = (a, b) => a.start < b.end && b.start < a.end;"}},{"descriptor":"PRG-S2","competency":"Program Coding","title":"Refactor legacy code และปรับปรุงประสิทธิภาพ","summary":"การปรับโครงสร้างโค้ดเก่าให้อ่านง่าย ลดความซ้ำซ้อน และแยก module โดยรักษาพฤติกรรมเดิมไว้ พร้อมแก้จุดที่ทำให้ช้าโดยไม่เปลี่ยนความหมาย","keyPoints":["ก่อน refactor ต้องมี test ที่ล็อกพฤติกรรมเดิม (characterization tests) แล้วทำทีละขั้นเล็กๆ รัน test ทุกขั้น; refactor คือเปลี่ยนโครงสร้างโดยไม่เปลี่ยนพฤติกรรมที่สังเกตได้","ลดการซ้อนของ if ด้วย guard clause / early return แต่ต้องรักษาลำดับการตรวจและข้อความ error เดิม เพราะผู้เรียกอาจพึ่งพาลำดับนั้น","ระวังพฤติกรรมที่เปลี่ยนแบบเงียบ: ทำให้ condition ที่เป็น falsy (0, '', null) ถูกตีความต่างไป, ลำดับการตรวจ validation ที่ต่างไป, หรือ error type ที่ต่างไป","แทนการค้นหาด้วย `find` ภายในลูปด้วย lookup `Map`/object เพื่อลดจาก O(n x m) เป็น O(n + m) แต่ถ้าข้อมูลมี key ซ้ำ `find` คืนตัวแรก ส่วนการสร้าง Map ตามปกติตัวหลังเขียนทับตัวแรก ต้องคงพฤติกรรมเดิมโดยไม่ใส่ซ้ำถ้ามี key อยู่แล้ว","`reduce` ที่ spread accumulator ทุกรอบ (`{ ...acc, [k]: v }`) คัดลอกทั้งก้อนทุกรอบ ทำให้เป็น O(n²) ให้แก้ accumulator เดิมโดยตรงหรือใช้ `Object.fromEntries` / `Map`","ถ้าเรียกงาน async จำนวนมาก การรันทั้งหมดพร้อมกัน (`Promise.all` ตรงๆ) อาจทำให้ทรัพยากรหมดหรือชนข้อจำกัดปลายทาง ใช้ concurrency limit (worker pool) เพื่อจำกัดจำนวนที่ทำงานพร้อมกัน","`Promise.all` ล้มเหลวทันทีเมื่อมีตัวใดตัวหนึ่ง reject ส่วน `Promise.allSettled` รอทุกตัวและให้ผลทั้งสำเร็จและล้มเหลว เหมาะเมื่อต้องการผลบางส่วน (partial results)","ลดความซ้ำซ้อนโดยแยกฟังก์ชันที่มีชื่อสื่อความหมาย แต่ไม่ควรรวมโค้ดที่แค่หน้าตาคล้ายกันแต่เหตุผลการเปลี่ยนต่างกัน (ระวัง abstraction ก่อนเวลา; มักรอจนซ้ำสามครั้งค่อยแยก)","ปรับประสิทธิภาพควรวัดก่อน (profile) หาคอขวดจริง แล้วค่อยแก้ ไม่ปรับตามความรู้สึก"],"examFocus":["ถ้าถามว่า refactor แล้วพฤติกรรมเปลี่ยนตรงไหน ให้ตรวจลำดับเงื่อนไข ค่า falsy และกรณี key ซ้ำ","ถ้าเจอ if ซ้อนหลายชั้นให้เลือกใช้ guard clause โดยคงผลลัพธ์เดิม","ถ้าเจอการค้นหาซ้ำๆ ในลูปให้เปลี่ยนเป็น Map แต่ตรวจเรื่อง key ซ้ำ","ถ้าเจอ reduce ที่ spread แล้วช้าเมื่อข้อมูลเยอะ ให้แก้เป็น accumulator ที่ mutate ภายใน","ถ้าต้องเรียก API จำนวนมากให้เลือก concurrency limit และเลือก allSettled เมื่อต้องการผลบางส่วน"],"pitfalls":["refactor พร้อมเปลี่ยน logic ในคราวเดียว ทำให้แยกไม่ออกว่าอะไรทำให้พฤติกรรมเปลี่ยน","เปลี่ยน find เป็น Map แล้วทำให้รายการซ้ำตัวหลังชนะแทนตัวแรก","ใช้ Promise.all กับงานที่ยอมให้ล้มเหลวบางส่วนได้ ทำให้ผลที่สำเร็จแล้วถูกทิ้ง"],"example":{"lang":"javascript","code":"// ช้า: spread ทุกรอบ O(n^2)\nconst byIdSlow = users.reduce((acc, u) => ({ ...acc, [u.id]: u }), {});\n\n// เร็ว: เติม Map ครั้งเดียว และคงพฤติกรรม find() = ตัวแรกชนะ\nconst byId = new Map();\nfor (const u of users) {\n  if (!byId.has(u.id)) byId.set(u.id, u);\n}"}},{"descriptor":"AI-S2","competency":"Prompt & AI","title":"นำฟีเจอร์ AI ขึ้น production: monitoring และ retraining","summary":"การดูแลฟีเจอร์ที่ใช้ AI หลังขึ้นระบบจริง ทั้งการวัดคุณภาพต่อเนื่อง ตรวจจับความเสื่อมถอย ควบคุมต้นทุน/ขนาด context และกระบวนการอัปเดตโมเดลหรือ prompt อย่างปลอดภัย","keyPoints":["ความแม่นยำลดลงหลัง deploy มักมาจาก data drift (การกระจายของอินพุตเปลี่ยน), concept drift (ความสัมพันธ์ระหว่างอินพุตกับคำตอบที่ถูกเปลี่ยนไป), การเปลี่ยนเวอร์ชันโมเดล/prompt, หรือบั๊กใน pipeline ข้อมูล เริ่มวินิจฉัยจากเทียบ metric แยกตามกลุ่มข้อมูลและช่วงเวลา และตรวจว่าอะไรเปลี่ยนก่อนเวลาที่เริ่มแย่ลง","ก่อนปล่อยการเปลี่ยน prompt หรือโมเดล ให้ประเมินแบบ offline กับชุดข้อมูลทดสอบ (golden set) ที่เป็นตัวแทนและมีกรณีขอบ เทียบเวอร์ชันเดิมกับใหม่ด้วย metric เดียวกัน เพื่อจับ regression","ปล่อยแบบค่อยเป็นค่อยไป: shadow mode (รันคู่โดยไม่ใช้ผล), canary หรือ A/B test และมีแผน rollback ที่ย้อนกลับได้เร็ว; ควรกำหนด (pin) เวอร์ชันโมเดลและเวอร์ชัน prompt อย่างชัดเจน","Monitoring คุณภาพใน production: สุ่มตัวอย่างคำขอจริง (sampling) ไปประเมินด้วยคนหรือ LLM-as-judge ตาม rubric เพราะไม่มี ground truth ให้ทุกคำขอ และรวบรวม feedback ของผู้ใช้ (เช่น thumbs up/down)","สัญญาณที่ควรเฝ้าดูสำหรับ LLM: latency, อัตราข้อผิดพลาดและ rate limit, การใช้ token และต้นทุนต่อคำขอ, อัตราที่ผลไม่ผ่าน schema validation, อัตรา fallback/refusal, และ metric คุณภาพจากการสุ่มประเมิน","ประวัติแชตที่ส่งทุกครั้งทำให้จำนวน token ต่อคำขอโตขึ้นเรื่อยๆ ทั้งต้นทุนและ latency เพิ่ม และอาจชนขีดจำกัด context window ใช้ sliding window, สรุปบทสนทนาเก่า (summarization), หรือดึงเฉพาะส่วนที่เกี่ยวข้องด้วย retrieval","Retraining (สำหรับโมเดลที่เรา train เอง): กำหนดตัวกระตุ้น (ตามตาราง หรือเมื่อ metric/drift เกินเกณฑ์), มี pipeline ข้อมูลและการ label ที่ตรวจสอบได้, ประเมินโมเดลใหม่กับ baseline ก่อน deploy (champion/challenger) และเก็บ versioning ของข้อมูล โมเดล และ prompt","ใส่ guardrails และ fallback (ตรวจ schema, ตัวกรองเนื้อหา, ส่งต่อคนเมื่อ confidence ต่ำ) และ log อย่างระมัดระวัง ไม่เก็บข้อมูลส่วนบุคคลดิบเกินจำเป็น และกำหนดอายุการเก็บ","แยก alert ตาม SLO (เช่น latency, อัตราผิดพลาด) ออกจาก metric คุณภาพ เพราะระบบอาจ ทำงานปกติ ทางเทคนิคแต่ให้คำตอบที่แย่ลงโดยไม่มี error"],"examFocus":["ถ้า accuracy ลดลงหลังใช้งานไปสักพัก ให้เลือกตรวจ data drift/concept drift และเทียบ metric แยกกลุ่มก่อนสรุป","ถ้าจะเปลี่ยน prompt ของฟีเจอร์ที่ใช้งานอยู่ ให้เลือกประเมิน offline กับ golden set แล้วปล่อยแบบ canary พร้อม rollback","ถ้ามี traffic จริงจำนวนมากแต่ไม่มีเฉลย ให้ใช้การสุ่มตัวอย่างไปประเมินด้วยคนหรือ rubric","ถ้าแชตยาวขึ้นแล้วช้าและแพงขึ้น ให้เลือกตัดหน้าต่าง สรุป หรือ retrieval","ถ้าถามสัญญาณที่ควร monitor ให้ครอบคลุมทั้งความเร็ว ต้นทุน ความผิดพลาด และคุณภาพ"],"pitfalls":["ดูแค่ uptime และ error rate แล้วสรุปว่าฟีเจอร์ AI ปกติ ทั้งที่คุณภาพคำตอบอาจลดลงเงียบๆ","ปล่อย prompt ใหม่ให้ผู้ใช้ทั้งหมดทันทีเพราะลองกับตัวอย่างไม่กี่รายการ","ส่งประวัติแชตทั้งหมดทุกครั้งโดยไม่จัดการ จนต้นทุนและ latency เพิ่มแบบไม่จำกัด"]}]}}</script>
<script>
/*
 * Scoring for one question. Pure function, no DOM, no Node-only APIs.
 * Loaded as a classic script in the browser (exposes window.ExamScoring)
 * and via require() from Node tests (module.exports).
 *
 * Rules (see the scoring table in the project context):
 *  - nothing selected                      -> 0
 *  - more options selected than correct    -> negative ? -penalty : 0
 *    (this overrides any partial credit)
 *  - otherwise                             -> right * max / k
 *                                             minus (negative only) wrong * penalty / k
 *    where k is the number of correct options.
 */
(function (root) {
  'use strict';

  function unique(list) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var key = String(list[i]);
      if (!seen[key]) {
        seen[key] = true;
        out.push(key);
      }
    }
    return out;
  }

  function clean(n) {
    // remove float noise and negative zero
    return Math.round(n * 1e6) / 1e6 + 0;
  }

  function scoreQuestion(question, selectedOptionIds, options) {
    var opts = options || {};
    var negative = Boolean(opts.negative);
    var max = opts.max === undefined ? 5 : opts.max;

  function startRun(level, mode, opts) {
    var pool = DATA.levels[level][poolFor(mode)];
    var questions = mode === 'exam' ? shuffle(pool) : pool.slice();
    state.run = {
      level: level,
      mode: mode,
      negative: !!opts.negative,
      minutes: opts.minutes,
      index: 0,
      submitted: false,
      auto: false,
      timer: null,
      endsAt: 0,
      announced: {},
      ui: {},
      items: questions.map(function (q) {
        return { q: q, options: shuffle(q.options), selected: [], confirmed: false, flagged: false };
      }),
    };
    state.screen = 'quiz';
    render();
    if (mode === 'exam') startTimer(state.run);
  }

  // ------------------------------------------------------------ timer

  function startTimer(run) {
    run.endsAt = Date.now() + run.minutes * 60000;
    [300, 60].forEach(function (mark) {
      if (run.minutes * 60 <= mark) run.announced[mark] = true; // do not announce a mark the exam never passes
    });
    tick();
    run.timer = setInterval(tick, 250);
  }

  function stopTimer() {
    if (state.run && state.run.timer) {
      clearInterval(state.run.timer);
      state.run.timer = null;
    }
  }

  function tick() {
    var run = state.run;
    if (!run || run.mode !== 'exam' || run.submitted || state.screen !== 'quiz' || !run.endsAt) return;
    var left = run.endsAt - Date.now();
    if (left <= 0) {
      finishExam(true);
      return;
    }
    if (run.ui.timerEl) {
      run.ui.timerEl.textContent = 'เหลือเวลา ' + fmtTime(left);
      run.ui.timerEl.className = left <= 60000 ? 'timer low' : 'timer';
    }
    if (run.bannerUntil && Date.now() >= run.bannerUntil) hideTimeBanner(run);
    var secs = Math.ceil(left / 1000);
    [300, 60].forEach(function (mark) {
      if (secs <= mark && !run.announced[mark] && run.ui.liveEl) {
        run.announced[mark] = true;
        var msg = 'เหลือเวลาอีก ' + (mark / 60) + ' นาที';
        run.ui.liveEl.textContent = msg; // screen readers
        showTimeBanner(run, msg, mark <= 60); // everyone else, inside the sticky header
      }
    });
  }

  // Non-blocking and hidden from assistive tech (the live region above already announces it).
  function showTimeBanner(run, msg, urgent) {
    var b = run.ui.bannerEl;
    if (!b) return;
    b.textContent = msg;
    b.className = urgent ? 'time-banner urgent' : 'time-banner';
    b.hidden = false;
    run.bannerUntil = Date.now() + 15000;
  }

  function hideTimeBanner(run) {
    run.bannerUntil = 0;
    if (run.ui.bannerEl) run.ui.bannerEl.hidden = true;
  }

  // ------------------------------------------------------------ quiz screen

  function renderQuiz() {
    var run = state.run;
    var ui = run.ui;
    var back = el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onBack });
    var badge = el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] });
    ui.liveEl = el('div', { class: 'sr-only', 'aria-live': 'polite' });
    var right;
    if (run.mode === 'exam') {
      ui.timerEl = el('div', { class: 'timer', role: 'timer' });
      right = ui.timerEl;
    } else {
      ui.scoreEl = el('div', { class: 'score-line', 'aria-live': 'polite' });
      right = ui.scoreEl;
    }
    var topbar = el('div', { class: 'topbar' }, back, badge, right);
    if (run.mode === 'exam') {
      // The timer stays visible while the page scrolls; the 5 and 1 minute banner lives in the same sticky block.
      ui.bannerEl = el('div', { class: 'time-banner', 'aria-hidden': 'true', hidden: true });
      root.appendChild(el('div', { class: 'sticky-head' }, topbar, ui.bannerEl));
    } else {
      root.appendChild(topbar);
    }
    root.appendChild(ui.liveEl);
    ui.card = el('section', { class: 'card', 'aria-label': 'คำถาม' });
    ui.nav = el('div', { class: 'qnav' });
    root.appendChild(ui.card);
    root.appendChild(ui.nav);
    if (run.mode === 'exam') {
      ui.palette = el('section', { class: 'card palette-wrap', 'aria-label': 'แผงเลือกข้อ' });
      root.appendChild(ui.palette);
    }
    renderQuestion('title');
    renderNav();
    renderPalette();
    updateScore();
  }

  function onBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam' ? 'การสอบที่กำลังทำอยู่จะถูกยกเลิกและคำตอบทั้งหมดจะหายไป' : 'ความคืบหน้าของการซ้อมนี้จะหายไป'],
      ok: 'กลับหน้าแรก',
      cancel: 'ทำต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'quiz') goStart(); });
  }

  function updateScore() {
    var run = state.run;
    if (!run.ui.scoreEl) return;
    var done = run.items.filter(function (i) { return i.confirmed; });
    var sum = 0;
    done.forEach(function (i) { sum += pointsOf(run, i); });
    run.ui.scoreEl.textContent = 'คะแนนสะสม ' + fmt(sum) + ' / ' + fmt(done.length * MAX) + ' (ตอบแล้ว ' + done.length + ' จาก ' + run.items.length + ' ข้อ)';
  }

  function codeBlock(q) {
    var codeEl = el('code', { text: q.code });
    if (q.codeLang) codeEl.setAttribute('data-lang', q.codeLang);
    return el('pre', { class: 'code', tabindex: '0', role: 'group', 'aria-label': 'โค้ดตัวอย่าง' + (q.codeLang ? ' (' + q.codeLang + ')' : '') }, codeEl);
  }

  function interactiveOptions(item, number) {
    var run = state.run;
    var multi = item.q.type === 'multiple';
    var set = el('fieldset', { class: 'options' },
      el('legend', { class: 'sr-only', text: 'ตัวเลือกของข้อ ' + number + (multi ? ' (เลือกได้หลายข้อ)' : '') }));
    item.options.forEach(function (opt, i) {
      var input = el('input', {
        type: multi ? 'checkbox' : 'radio',
        name: 'opt-' + run.index,
        value: opt.id,
        checked: item.selected.indexOf(opt.id) !== -1,
        onchange: function () { onSelect(item, opt.id, input.checked); },
      });
      set.appendChild(el('label', { class: 'opt' },
        input,
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('span', { class: 'opt-body' }, el('span', { class: 'opt-text', text: opt.text }))));
    });
    return set;
  }

  function onSelect(item, id, checked) {
    if (item.q.type === 'multiple') {
      var at = item.selected.indexOf(id);
      if (checked && at === -1) item.selected.push(id);
      if (!checked && at !== -1) item.selected.splice(at, 1);
    } else {
      item.selected = checked ? [id] : [];
    }
    renderNav();
    renderPalette();
    syncLeaveGuard();
  }

  function staticOptions(item) {
    var wrap = el('div', { class: 'options' });
    item.options.forEach(function (opt, i) {
      var isSel = item.selected.indexOf(opt.id) !== -1;
      var cls = 'opt' + (opt.correct ? ' is-correct' : (isSel ? ' is-wrong' : ''));
      wrap.appendChild(el('div', { class: cls },
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('div', { class: 'opt-body' },
          el('div', { class: 'opt-text', text: opt.text }),
          el('div', { class: 'tags' },
            el('span', { class: 'tag ' + (opt.correct ? 'ok' : 'bad'), text: opt.correct ? '✓ ถูก' : '✗ ผิด' }),
            isSel ? el('span', { class: 'tag sel', text: 'คุณเลือกข้อนี้' }) : null),
          el('p', { class: 'why' }, el('strong', { text: 'เหตุผล: ' }), opt.why))));
    });
    return wrap;
  }

  function pointsLine(points, answered) {
    var cls = 'points' + (points > 0 ? ' pos' : (points < 0 ? ' neg' : ''));
    return el('p', { class: cls, text: (answered ? '' : 'ไม่ได้ตอบ · ') + 'ได้ ' + fmt(points) + ' จาก ' + MAX + ' คะแนน' });
  }

  function renderQuestion(focusTarget) {
    var run = state.run;
    var item = run.items[run.index];
    var q = item.q;
    var number = run.index + 1;
    var card = run.ui.card;
    var showFeedback = run.mode === 'practice' && item.confirmed;
    clear(card);

    var title = el('h2', { class: 'qtitle', id: 'qtitle', tabindex: '-1', text: 'ข้อ ' + number + ' จาก ' + run.items.length });
    card.appendChild(title);
    if (q.type === 'multiple') card.appendChild(el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }));
    card.appendChild(el('p', { class: 'stem', text: q.stem }));
    if (q.code) card.appendChild(codeBlock(q));
    card.appendChild(showFeedback ? staticOptions(item) : interactiveOptions(item, number));

    var feedback = null;
    if (showFeedback) {
      feedback = el('div', { class: 'feedback', id: 'feedback', tabindex: '-1' },
        el('h3', { text: 'ผลของข้อนี้' }),
        pointsLine(pointsOf(run, item), true),
        el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), q.explanation));
      card.appendChild(feedback);
    }
    if (focusTarget === 'feedback' && feedback) feedback.focus();
    else if (focusTarget === 'title') title.focus();
  }

  function button(label, opts) {
    return el('button', {
      type: 'button',
      id: opts.id || null,
      class: 'btn' + (opts.primary ? ' primary' : ''),
      text: label,
      disabled: opts.disabled,
      'aria-pressed': opts.pressed === undefined ? null : String(opts.pressed),
      onclick: opts.onclick,
    });
  }

  function goTo(index) {
    var run = state.run;
    if (index < 0 || index >= run.items.length) return;
    run.index = index;
    renderQuestion('title');
    renderNav();
    renderPalette();
  }

  function renderNav() {
    var run = state.run;
    var item = run.items[run.index];
    var nav = run.ui.nav;
    clear(nav);
    var last = run.index === run.items.length - 1;
    nav.appendChild(button('← ข้อก่อนหน้า', { disabled: run.index === 0, onclick: function () { goTo(run.index - 1); } }));
    if (run.mode === 'practice') {
      if (!item.confirmed) {
        nav.appendChild(button('ยืนยันคำตอบ', { primary: true, disabled: item.selected.length === 0, onclick: confirmAnswer }));
      }
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('จบและดูผลสรุป', { onclick: finishPractice }));
    } else {
      nav.appendChild(button('⚑ ติดธงทบทวน', {
        id: 'flag-btn',
        pressed: item.flagged,
        onclick: function () {
          item.flagged = !item.flagged;
          renderNav();
          renderPalette();
          document.getElementById('flag-btn').focus();
        },
      }));
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('ส่งข้อสอบ', { primary: true, onclick: requestSubmit }));
    }
  }

  function renderPalette() {
    var run = state.run;
    var box = run.ui.palette;
    if (!box) return;
    clear(box);
    var grid = el('div', { class: 'palette' });
    run.items.forEach(function (item, i) {
      var answered = item.selected.length > 0;
      var cls = 'pal' + (answered ? ' answered' : '') + (item.flagged ? ' flagged' : '') + (i === run.index ? ' current' : '');
      var label = 'ข้อ ' + (i + 1) + (answered ? ' ตอบแล้ว' : ' ยังไม่ตอบ') + (item.flagged ? ' ติดธงทบทวน' : '');
      grid.appendChild(el('button', {
        type: 'button', class: cls, text: String(i + 1), 'aria-label': label,
        'aria-current': i === run.index ? 'true' : null,
        onclick: function () { goTo(i); },
      }));
    });
    var answeredCount = run.items.filter(function (i) { return i.selected.length > 0; }).length;
    var flaggedCount = run.items.filter(function (i) { return i.flagged; }).length;
    box.appendChild(el('h2', { class: 'small', text: 'แผงเลือกข้อ · ตอบแล้ว ' + answeredCount + ' จาก ' + run.items.length + ' ข้อ · ติดธง ' + flaggedCount + ' ข้อ' }));
    box.appendChild(grid);
    box.appendChild(el('div', { class: 'legend' },
      el('span', { text: 'สีทึบ = ตอบแล้ว' }),
      el('span', { text: 'ขอบอย่างเดียว = ยังไม่ตอบ' }),
      el('span', { text: '⚑ = ติดธงทบทวน' })));
  }

  // ------------------------------------------------------------ practice actions

  function confirmAnswer() {
    var run = state.run;
    var item = run.items[run.index];
    if (item.confirmed || item.selected.length === 0) return;
    item.confirmed = true;
    renderQuestion('feedback');
    renderNav();
    updateScore();
  }

  function finishPractice() {
    var run = state.run;
    var open = run.items.filter(function (i) { return !i.confirmed; }).length;
    function go() {
      if (state.run !== run) return;
      run.submitted = true;
      state.screen = 'result';
      render();
    }
    if (open === 0) {
      go();
      return;
    }
    askConfirm({
      title: 'จบการซ้อมและดูผลสรุป?',
      message: ['ยังไม่ได้ยืนยันคำตอบ ' + open + ' ข้อ ข้อเหล่านี้จะนับเป็น 0 คะแนน'],
      ok: 'จบและดูผล',
      cancel: 'ซ้อมต่อ',
    }).then(function (yes) { if (yes) go(); });
  }

  // ------------------------------------------------------------ exam actions

  function requestSubmit() {
    var run = state.run;
    var unanswered = run.items.filter(function (i) { return i.selected.length === 0; }).length;
    var flagged = run.items.filter(function (i) { return i.flagged; }).length;
    var lines = [unanswered > 0 ? 'ยังไม่ได้ตอบ ' + unanswered + ' ข้อ ข้อที่ไม่ตอบจะได้ 0 คะแนน' : 'ตอบครบทุกข้อแล้ว'];
    if (flagged > 0) lines.push('มี ' + flagged + ' ข้อที่ติดธงไว้ทบทวน');
    lines.push('เมื่อส่งแล้วจะแก้คำตอบไม่ได้');
    askConfirm({ title: 'ส่งข้อสอบ?', message: lines, ok: 'ส่งข้อสอบ', cancel: 'กลับไปทำต่อ' })
      .then(function (yes) { if (yes && state.run === run) finishExam(false); });
  }

  function finishExam(auto) {
    var run = state.run;
    if (!run || run.submitted) return;
    run.submitted = true;
    run.auto = !!auto;
    stopTimer();
    closeOpenDialog();
    state.screen = 'result';
    render();
  }

  // ------------------------------------------------------------ result screen

  // Groups the score by competency when the data defines competencies, otherwise by descriptor.
  function breakdown(run) {
    var byCompetency = Array.isArray(DATA.competencies) && DATA.competencies.length > 0;
    var map = {};
    var order = [];
    run.items.forEach(function (item) {
      var d = byCompetency ? (item.q.competency || '-') : (item.q.descriptor || '-');
      if (!map[d]) {
        map[d] = { code: d, count: 0, answered: 0, points: 0, max: 0 };
        order.push(d);
      }
      map[d].count++;
      map[d].max += MAX;
      map[d].points += pointsOf(run, item);
      if (isAnswered(run, item)) map[d].answered++;
    });
    var known = byCompetency ? DATA.competencies : Object.keys(DATA.descriptorNames || {});
    order.sort(function (a, b) {
      var ia = known.indexOf(a);
      var ib = known.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    return order.map(function (d) { return map[d]; });
  }

  function renderResult() {
    var run = state.run;
    var total = 0;
    var answered = 0;
    run.items.forEach(function (item) {
      total += pointsOf(run, item);
      if (isAnswered(run, item)) answered++;
    });
    var max = run.items.length * MAX;
    var pct = max > 0 ? (total / max) * 100 : 0;

    var heading = el('h1', { id: 'result-title', tabindex: '-1', text: run.mode === 'exam' ? 'ผลสอบ' : 'สรุปผลการซ้อม' });
    root.appendChild(el('div', { class: 'topbar' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack }),
      el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] })));
    root.appendChild(heading);

    if (run.auto) {
      root.appendChild(el('div', { class: 'error', role: 'status', text: 'หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ' }));
    }
    root.appendChild(el('div', { class: 'card' },
      el('div', { class: 'big-score', text: fmt(total) + ' / ' + fmt(max) + ' คะแนน' }),
      el('p', { text: fmt(pct) + '% · ตอบแล้ว ' + answered + ' จาก ' + run.items.length + ' ข้อ' + (run.mode === 'exam' ? (run.negative ? ' · เปิดการหักคะแนน' : ' · ไม่หักคะแนน') : '') }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'btn primary', text: run.mode === 'exam' ? 'สอบใหม่ (สุ่มลำดับใหม่)' : 'ซ้อมอีกครั้ง', onclick: onResultRetake }))));

    var rows = breakdown(run).map(function (d) {
      var p = d.max > 0 ? (d.points / d.max) * 100 : 0;
      var name = Array.isArray(DATA.competencies) && DATA.competencies.length > 0
        ? d.code
        : ((DATA.descriptorNames && DATA.descriptorNames[d.code]) || '');
      var bar = el('div', { class: 'bar', 'aria-hidden': 'true' }, el('span'));
      bar.firstChild.style.width = Math.max(0, Math.min(100, p)) + '%';
      return el('div', { class: 'desc-row' },
        el('div', null, el('strong', { text: name || d.code })),
        el('div', { class: 'small', text: 'คะแนน ' + fmt(d.points) + ' / ' + fmt(d.max) + ' (' + fmt(p) + '%) · ตอบแล้ว ' + d.answered + ' จาก ' + d.count + ' ข้อ' }),
        bar);
    });
    root.appendChild(el('section', { class: 'card', 'aria-labelledby': 'breakdown-title' },
      el('h2', { id: 'breakdown-title', text: 'คะแนนแยกตามหัวข้อ' }),
      rows));

    if (run.mode === 'exam') {
      root.appendChild(el('h2', { text: 'ทบทวนทุกข้อ (ตามลำดับที่ทำ)' }));
      run.items.forEach(function (item, i) {
        var answeredItem = item.selected.length > 0;
        var pts = pointsOf(run, item);
        root.appendChild(el('article', { class: 'review-item' + (answeredItem ? '' : ' unanswered') },
          el('h3', null, 'ข้อ ' + (i + 1) + ' ',
            answeredItem ? null : el('span', { class: 'tag warn', text: 'ไม่ได้ตอบ' }), ' ',
            item.flagged ? el('span', { class: 'tag', text: '⚑ ติดธง' }) : null),
          item.q.type === 'multiple' ? el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }) : null,
          el('p', { class: 'stem', text: item.q.stem }),
          item.q.code ? codeBlock(item.q) : null,
          staticOptions(item),
          el('div', { class: 'feedback' },
            pointsLine(pts, answeredItem),
            el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), item.q.explanation))));
      });
    }

    root.appendChild(el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack })));
    heading.focus();
  }

  // Leaving the result screen throws the review away, so both exits ask first.
  function onResultBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam'
        ? 'ผลสอบและการทบทวนเฉลยทุกข้อในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'
        : 'สรุปผลการซ้อมในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'],
      ok: 'กลับหน้าแรก',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'result') goStart(); });
  }

  function onResultRetake() {
    var run = state.run;
    var exam = run.mode === 'exam';
    askConfirm({
      title: exam ? 'สอบใหม่?' : 'ซ้อมอีกครั้ง?',
      message: exam
        ? ['ผลสอบและการทบทวนเฉลยของรอบนี้จะหายไป', 'ระบบจะเริ่มจับเวลา ' + run.minutes + ' นาทีทันที และสุ่มลำดับข้อใหม่']
        : ['สรุปผลการซ้อมรอบนี้จะหายไป และเริ่มซ้อมรอบใหม่ทันที'],
      ok: exam ? 'เริ่มสอบใหม่' : 'เริ่มซ้อมใหม่',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) {
      if (yes && state.run === run && state.screen === 'result') startRun(run.level, run.mode, { negative: run.negative, minutes: run.minutes });
    });
  }

  render();
  previewHook();
})();

</script>
</body>
