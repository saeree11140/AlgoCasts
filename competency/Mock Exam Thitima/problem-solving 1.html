 เก่าไม่ถูกแก้จึง undo ได้"},{"id":"C","text":"เรียก Object.freeze(state) ก่อนส่งเข้า addItem ทุกครั้งที่เพิ่มสินค้า","correct":false,"why":"ผิด เพราะ freeze ทำงานระดับชั้นเดียว อาร์เรย์ items ที่อยู่ลึกลงไปยังไม่ถูกล็อก push ยังสำเร็จและ prev ยังถูกแก้เช่นเดิม"},{"id":"D","text":"ให้ selector เทียบ cart.items.length แทนการเทียบ reference ของ cart","correct":false,"why":"ผิด เพราะซ่อนอาการเฉพาะกรณีจำนวนสินค้าเปลี่ยน แก้ coupon หรือแทนที่สินค้าแล้วความยาวเท่าเดิมจะพลาด และ prev ที่ถูกแก้ไปแล้วทำให้ undo ผิดอยู่ดี"}],"explanation":"การ spread ระดับบนทำสำเนาชั้นเดียว (shallow) object ลูกยังแชร์กับสถานะเก่า การแก้ค่าลึกลงไปจึงแก้ทั้งสถานะเก่าและใหม่พร้อมกัน แนวปฏิบัติของ state แบบ immutable คือคัดลอกทุกชั้นตามเส้นทางที่จะเปลี่ยน และปล่อยส่วนที่เหลือให้แชร์ reference เดิม เพื่อให้การเทียบ reference บอกได้ว่าอะไรเปลี่ยน"},{"id":"PS-S-P-028","level":"senior","pool":"practice","competency":"Program Coding","descriptor":"PRG-S2","concept":"lookup-map-keeps-first-match","mobile":false,"type":"single","stem":"ฟังก์ชันแนบชื่อลูกค้าให้ออเดอร์ทำงานช้ามากเมื่อมี orders 50,000 รายการและ customers 20,000 ราย ข้อมูล customers มาจากการ import หลายรอบ จึงมีบาง id ซ้ำกัน และระบบปัจจุบันใช้ชื่อจากแถวแรกที่พบเสมอ ต้องการ refactor ให้เร็วขึ้นโดยผลลัพธ์ต้องเหมือนเดิมทุกกรณี ข้อใดเหมาะสมที่สุด","code":"type Customer = { id: number; name: string };\ntype Order = { id: number; customerId: number };\n\nfunction attachCustomer(orders: Order[], customers: Customer[]) {\n  return orders.map((o) => ({\n    orderId: o.id,\n    customerName: customers.find((c) => c.id === o.customerId)?.name ?? 'unknown',\n  }));\n}","codeLang":"typescript","options":[{"id":"A","text":"สร้าง Map หนึ่งครั้งก่อน map โดยใส่ entry เฉพาะเมื่อ id นั้นยังไม่มีใน Map แล้วใช้ get ในแต่ละ order","correct":true,"why":"ถูก เพราะลดการค้นหาจาก O(n × m) เหลือประมาณ O(n + m) และการใส่เฉพาะ id ที่ยังไม่มีทำให้เก็บแถวแรกไว้ตรงกับพฤติกรรมของ find"},{"id":"B","text":"เรียง customers ตาม id หนึ่งครั้ง แล้วทำ binary search ธรรมดาที่หยุดทันทีเมื่อเจอ id ตรงกัน","correct":false,"why":"ผิด เพราะเมื่อมี id ซ้ำ binary search ที่หยุดเมื่อเจอครั้งแรกอาจหยุดที่แถวใดก็ได้ในกลุ่มซ้ำ ไม่ใช่แถวแรกของกลุ่ม ผลลัพธ์จึงไม่การันตีว่าตรงกับเดิม"},{"id":"C","text":"สร้าง Map ด้วย new Map(customers.map((c) => [c.id, c])) หนึ่งครั้งก่อนวนลูป แล้วเรียก get(o.customerId) ในแต่ละ order","correct":false,"why":"ผิด เพราะ constructor ของ Map ให้ entry หลังสุดทับ entry ก่อนหน้า เมื่อ id ซ้ำจะได้ชื่อจากแถวสุดท้ายแทนแถวแรก ผลลัพธ์จึงเปลี่ยนไปจากเดิม"},{"id":"D","text":"เปลี่ยน find เป็น filter(...)[0] ในทุกรอบของ map และคงโครงสร้างส่วนอื่นไว้เหมือนเดิม","correct":false,"why":"ผิด เพราะ filter วนครบทุกแถวทุกครั้ง ผลลัพธ์เท่าเดิมแต่ช้ากว่าเดิม ความซับซ้อนยังเป็น O(n × m) และไม่ได้แก้ปัญหาความเร็ว"}],"explanation":"โจทย์มีสองเงื่อนไขพร้อมกัน คือเร็วขึ้นและพฤติกรรมเดิมต้องไม่เปลี่ยน การเปลี่ยน find เป็น Map lookup เป็นวิธีมาตรฐาน แต่ต้องดูความหมายของ \"แถวแรกที่พบ\" ด้วย เพราะ Map ที่สร้างจากอาร์เรย์ตรง ๆ จะให้ค่าหลังสุดชนะ ก่อน refactor เรื่องประสิทธิภาพควรเขียนเทสต์ที่มี key ซ้ำเพื่อจับความต่างนี้"},{"id":"PS-S-P-029","level":"senior","pool":"practice","competency":"Program Coding","descriptor":"PRG-S3","concept":"binary-search-lower-bound","mobile":false,"type":"single","stem":"ฟังก์ชันหาตำแหน่งแรกที่ค่ามากกว่าหรือเท่ากับ x ในอาร์เรย์ที่เรียงแล้ว เมื่อเรียก lowerBound([10, 20, 30, 40], 30) โปรแกรมค้างโดย CPU เต็ม 100% ข้อใดอธิบายสาเหตุและวิธีแก้ได้ถูกต้อง","code":"function lowerBound(a: number[], x: number): number {\n  let lo = 0;\n  let hi = a.length;\n  while (lo \u003c hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (a[mid] \u003c x) lo = mid;\n    else hi = mid;\n  }\n  return lo;\n}\n\nconsole.log(lowerBound([10, 20, 30, 40], 30));","codeLang":"typescript","options":[{"id":"A","text":"เริ่มต้น hi เป็น a.length - 1 แทน a.length และคงส่วนอื่นของลูปไว้ตามเดิม","correct":false,"why":"ผิด เพราะการเปลี่ยนค่าเริ่มต้นของ hi ไม่แตะจุดที่ช่วงไม่หด ลูปยังค้างที่ lo = 1, hi = 2 แบบเดิม"},{"id":"B","text":"เมื่อ a[mid] \u003c x ต้องตั้ง lo = mid + 1 ซึ่งข้าม mid ที่ตรวจแล้ว มิฉะนั้น lo กับ hi ที่ห่างกัน 1 จะไม่หดอีก","correct":true,"why":"ถูก เพราะที่ lo = 1, hi = 2 ค่า mid คือ 1 ซึ่ง a[1] \u003c 30 และการตั้ง lo = mid ได้ 1 เท่าเดิม ลูปวนซ้ำไม่จบ การเลื่อนข้าม mid ทำให้ช่วงหดทุกรอบ"},{"id":"C","text":"เปลี่ยนเงื่อนไขของลูปเป็น lo \u003c= hi และคงการตั้งค่า lo กับ hi ในลูปไว้ตามเดิม","correct":false,"why":"ผิด เพราะเมื่อ lo เท่ากับ hi ลูปยังไม่หยุด และแต่ละรอบตั้ง lo หรือ hi เป็นค่า mid เดิม ช่วงไม่หดอีก ลูปค้างแม้กับค่าที่โค้ดเดิมทำงานได้ เช่น x = 10"},{"id":"D","text":"คำนวณ mid ด้วย Math.ceil แทน Math.floor และคงการตั้งค่า lo กับ hi ไว้ตามเดิม","correct":false,"why":"ผิด เพราะที่ lo = 1, hi = 2 ค่า mid กลายเป็น 2 ซึ่ง a[2] ไม่น้อยกว่า 30 จึงตั้ง hi = 2 เท่าเดิม ลูปยังไม่จบ เพียงเปลี่ยนจุดที่ค้าง"}],"explanation":"binary search ต้องมี invariant ที่ชัดและทุกรอบต้องทำให้ช่วงค้นหาหดลง ในรูปแบบช่วงครึ่งเปิด [lo, hi) การตั้ง lo = mid + 1 และ hi = mid เป็นคู่ที่รับประกันการหด การทดสอบด้วยอาร์เรย์เล็กมากและค่าที่ตรงกับสมาชิกตัวสุดท้ายของช่วงช่วยจับบั๊กลักษณะนี้ได้"},{"id":"PS-S-P-030","level":"senior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-S1","concept":"not-in-null-trap","mobile":false,"type":"multiple","stem":"ต้องการรายชื่อสินค้าที่ยังไม่เคยอยู่ในรายการสั่งซื้อใดเลย (ผลที่ถูกต้องคือ Ink และ Pad) แต่คำสั่งด้านล่างคืนศูนย์แถว ทั้งที่มีสินค้าที่ไม่เคยถูกสั่งอยู่จริง ข้อใดให้ผลถูกต้องบนข้อมูลนี้และข้อมูลลักษณะเดียวกัน (เลือกทุกข้อที่ถูก)","code":"CREATE TABLE products    (id INTEGER PRIMARY KEY, name TEXT);\nCREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, product_id INTEGER);\n\nINSERT INTO products VALUES (1, 'Pen'), (2, 'Ink'), (3, 'Pad');\nINSERT INTO order_items VALUES (1, 10, 1), (2, 10, NULL), (3, 11, 1);\n\nSELECT name\nFROM products\nWHERE id NOT IN (SELECT product_id FROM order_items);","codeLang":"sql","options":[{"id":"A","text":"WHERE id NOT IN (SELECT product_id FROM order_items WHERE product_id IS NOT NULL)","correct":true,"why":"ถูก เพราะตัดค่า NULL ออกจากรายการก่อนเปรียบเทียบ NOT IN จึงเหลือผลจริงหรือเท็จเท่านั้น"},{"id":"B","text":"WHERE NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = products.id)","correct":true,"why":"ถูก เพราะ EXISTS ตรวจว่ามีแถวที่ตรงเงื่อนไขหรือไม่ ไม่ได้เปรียบเทียบกับ NULL ในรายการ จึงไม่ถูกแถวที่ product_id เป็น NULL ทำให้ผลเป็น UNKNOWN"},{"id":"C","text":"INNER JOIN order_items oi ON oi.product_id = products.id แล้วกรอง WHERE oi.id IS NULL","correct":false,"why":"ผิด เพราะ INNER JOIN เก็บเฉพาะสินค้าที่มีคู่ใน order_items จึงไม่มีแถวที่ oi.id เป็น NULL เลย ผลลัพธ์ว่างเปล่า"},{"id":"D","text":"LEFT JOIN order_items oi ON oi.product_id = products.id แล้วกรอง WHERE oi.id IS NULL","correct":true,"why":"ถูก เพราะ LEFT JOIN ที่จับคู่ไม่ได้จะได้ oi.id เป็น NULL (anti-join) และแถว NULL ใน order_items ไม่เคยจับคู่กับสินค้าใดเลย"},{"id":"E","text":"WHERE id NOT IN (SELECT DISTINCT product_id FROM order_items)","correct":false,"why":"ผิด เพราะ DISTINCT ยังคงเก็บ NULL ไว้หนึ่งค่า NOT IN กับรายการที่มี NULL ยังให้ผล UNKNOWN สำหรับทุกสินค้าที่ไม่อยู่ในรายการ จึงยังได้ศูนย์แถว"}],"explanation":"NOT IN เทียบทีละค่าด้วย \u003c> และ AND ผลเข้าด้วยกัน เมื่อรายการมี NULL ผลการเทียบกับ NULL เป็น UNKNOWN ทำให้ทั้งเงื่อนไขไม่เป็นจริงสำหรับแถวใดเลย จึงได้ศูนย์แถวโดยไม่มี error ทางที่ปลอดภัยคือ NOT EXISTS, anti-join ด้วย LEFT JOIN ... IS NULL หรือกรอง NULL ออกจาก subquery ให้ชัดเจน"}],"exam":[{"id":"PS-S-E-001","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S1","concept":"transition-table-over-flags","mobile":false,"type":"single","stem":"พบออเดอร์ในฐานข้อมูลที่ isShipped และ isCancelled เป็นจริงพร้อมกัน และบางออเดอร์ถูกยกเลิกหลังจัดส่งไปแล้ว ทีมต้องการออกแบบใหม่ให้การเปลี่ยนสถานะผิดลำดับทำไม่ได้ และเพิ่มสถานะใหม่ในอนาคต เช่น คืนสินค้า ได้โดยไม่ต้องไล่แก้ทุกฟังก์ชัน","code":"type Order = { isPaid: boolean; isShipped: boolean; isCancelled: boolean };\n\nfunction pay(o: Order) { o.isPaid = true; }\nfunction ship(o: Order) { o.isShipped = true; }\nfunction cancel(o: Order) { o.isCancelled = true; }","codeLang":"typescript","options":[{"id":"A","text":"เก็บสถานะเดียวเป็น union type พร้อมตารางว่าแต่ละสถานะไปสถานะไหนได้ และให้ทุกการเปลี่ยนผ่านฟังก์ชัน transition() ที่ตรวจตารางก่อน","correct":true,"why":"ถูก เพราะชุดสถานะที่เป็นไปไม่ได้ไม่มีอยู่ในรูปแบบข้อมูล กฎอยู่ที่เดียว และสถานะใหม่คือการเพิ่มแถวในตาราง คอมไพเลอร์ช่วยตรวจว่าครบ"},{"id":"B","text":"เก็บอาร์เรย์ประวัติเหตุการณ์ของออเดอร์ เช่น paid, shipped แล้วอ่านสถานะปัจจุบันจากตัวสุดท้ายของอาร์เรย์","correct":false,"why":"ผิด เพราะการเก็บประวัติให้ร่องรอยแต่ไม่ได้ห้ามลำดับที่ผิด ยังต่อเหตุการณ์ cancelled ท้าย shipped ได้ ต้องมีตารางกฎตรวจก่อนต่อเหตุการณ์อยู่ดี"},{"id":"C","text":"ซ่อนปุ่มยกเลิกในหน้าจอเมื่อออเดอร์จัดส่งแล้ว และคงฟังก์ชันฝั่ง server ไว้ตามเดิม","correct":false,"why":"ผิด เพราะการกันที่หน้าจอไม่กันคำขอที่มาจากทางอื่น เช่น API ตรง งาน batch หรือแอปรุ่นเก่า ฝั่ง server ยังเปลี่ยนสถานะผิดลำดับได้"},{"id":"D","text":"เพิ่ม if (o.isShipped) return; ที่ต้นฟังก์ชัน cancel และเพิ่มเงื่อนไขทำนองเดียวกันในฟังก์ชันอื่นที่เกี่ยวข้องกับสถานะที่ห้ามย้อนกลับ","correct":false,"why":"ผิด เพราะกฎการเปลี่ยนสถานะกระจายอยู่ในหลายฟังก์ชัน ทุกสถานะใหม่ต้องไล่เพิ่มเงื่อนไขทุกที่ และ flag สามตัวยังประกอบเป็นชุดค่าที่เป็นไปไม่ได้ได้อีกมาก"}],"explanation":"boolean หลายตัวที่อธิบายสถานะเดียวกันสร้างชุดค่าผสมมากกว่าจำนวนสถานะจริง (3 ตัวได้ 8 แบบ ทั้งที่จริงมีไม่กี่แบบ) การเปลี่ยนเป็น state เดียวพร้อมตารางการเปลี่ยนผ่าน (state machine) ทำให้ \"สถานะที่เป็นไปไม่ได้\" ไม่มีทางแสดงออกมาในข้อมูล และการตรวจกฎอยู่ที่ชั้นข้อมูลเสมอ ไม่พึ่งหน้าจอ"},{"id":"PS-S-E-002","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S1","concept":"image-ai-mobile-pipeline","mobile":true,"type":"multiple","stem":"แอปมือถือประกันภัยให้ผู้ใช้ถ่ายรูปความเสียหายของรถ แล้วบริการ AI บนคลาวด์ประเมินประเภทความเสียหาย การประมวลผลใช้เวลา 3 ถึง 20 วินาทีขึ้นกับภาระของระบบ และผู้ใช้จำนวนมากใช้เครือข่ายมือถือที่ไม่เสถียร ข้อใดเป็นแนวทางที่เหมาะสมในการผนวกบริการนี้กับแอป (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ออกแบบเป็นงานแบบอะซิงโครนัส: อัปโหลดแล้วได้เลขงาน จากนั้นรอผลผ่านการแจ้งเตือนหรือการสอบถามสถานะ","correct":true,"why":"ถูก เพราะเวลาประมวลผลไม่แน่นอน การไม่ผูกกับการเชื่อมต่อเดียวที่ต้องค้างไว้ทำให้ผู้ใช้ออกจากหน้าจอหรือเครือข่ายหลุดชั่วคราวได้โดยงานไม่หาย"},{"id":"B","text":"ส่งภาพต้นฉบับความละเอียดสูงสุดจากกล้องขึ้นไปทุกครั้ง โดยไม่ลดขนาดบนเครื่อง","correct":false,"why":"ผิด เพราะภาพใหญ่เพิ่มเวลาอัปโหลดและต้นทุน และเกินความละเอียดที่โมเดลมักใช้จริง บนเครือข่ายไม่เสถียรยิ่งเสี่ยงที่การอัปโหลดล้มเหลวกลางทาง"},{"id":"C","text":"เมื่อโมเดลคืนความมั่นใจต่ำ ให้แอปขอให้ผู้ใช้ถ่ายใหม่หรือส่งต่อให้เจ้าหน้าที่ตรวจ แทนการสรุปผลอัตโนมัติ","correct":true,"why":"ถูก เพราะผลจากโมเดลมีความไม่แน่นอน การกำหนดเกณฑ์ความมั่นใจและทางสำรองที่มีมนุษย์ร่วมช่วยลดความเสียหายจากการตัดสินผิดในงานที่มีผลทางการเงิน"},{"id":"D","text":"ย่อและบีบอัดภาพบนเครื่องให้ขนาดพอเหมาะกับโมเดลก่อนอัปโหลด","correct":true,"why":"ถูก เพราะภาพต้นฉบับจากกล้องมือถือมีขนาดใหญ่ การลดขนาดช่วยให้อัปโหลดไวบนเครือข่ายที่ไม่เสถียรและลดต้นทุน โดยมักไม่กระทบความแม่นยำของงานนี้"},{"id":"E","text":"เปิดคำขอ HTTP เดียวค้างไว้และตั้ง timeout ยาวมากจนกว่าจะได้ผลประเมิน","correct":false,"why":"ผิด เพราะการเชื่อมต่อยาวบนมือถือหลุดได้ง่ายเมื่อเครือข่ายเปลี่ยนหรือแอปไปอยู่เบื้องหลัง ผู้ใช้จะเสียงานที่ทำไปแล้วและต้องอัปโหลดใหม่"}],"explanation":"การผนวกบริการ AI เข้ากับแอปมือถือควรคำนึงถึงข้อจำกัดของอุปกรณ์และเครือข่าย ลดขนาดข้อมูลก่อนส่ง ออกแบบกระบวนการที่ทนต่อเวลาประมวลผลที่ไม่แน่นอนด้วยงานแบบอะซิงโครนัส และมีทางสำรองเมื่อผลของโมเดลไม่แน่ใจ โดยเฉพาะในงานที่ผลมีนัยทางการเงิน"},{"id":"PS-S-E-003","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S2","concept":"reduce-spread-accumulator","mobile":false,"type":"single","stem":"ฟังก์ชันสร้าง lookup ของผู้ใช้ตาม id ทำงานเร็วพอกับข้อมูลหลักพันรายการ แต่เมื่อข้อมูลเพิ่มจาก 2,000 เป็น 8,000 รายการ (4 เท่า) เวลาเพิ่มขึ้นกว่า 10 เท่า การวัดซ้ำให้ผลใกล้เคียงกันทุกครั้ง และผลลัพธ์ยังต้องเป็น object แบบเดิมที่ผู้เรียกใช้อยู่ ข้อใดแก้ตรงจุดที่สุด","code":"type User = { id: string; name: string };\n\nfunction indexById(users: User[]): Record\u003cstring, User> {\n  return users.reduce(\n    (acc, u) => ({ ...acc, [u.id]: u }),\n    {} as Record\u003cstring, User>,\n  );\n}","codeLang":"typescript","options":[{"id":"A","text":"แบ่งผู้ใช้เป็นกลุ่มแล้วใช้ Promise.all ประมวลผลหลายกลุ่มพร้อมกัน ก่อนรวมผล","correct":false,"why":"ผิด เพราะงานนี้เป็น CPU ล้วนและรันบนเธรดเดียว Promise.all ไม่ทำให้เร็วขึ้น และขั้นรวมผลก็ยังต้องคัดลอก object ขนาดใหญ่"},{"id":"B","text":"สร้าง object ว่างหนึ่งตัว แล้ววนด้วย for...of กำหนด result[u.id] = u ทีละรายการ ก่อนคืนค่าเมื่อจบลูป","correct":true,"why":"ถูก เพราะแต่ละรายการเพิ่ม key เดียวลงใน object เดิม ไม่มีการคัดลอก acc ซ้ำ ต้นทุนรวมเป็นเส้นตรงตามจำนวนข้อมูล และผลลัพธ์ยังเป็น object แบบเดิม"},{"id":"C","text":"แทน spread ด้วย Object.assign({}, acc, { [u.id]: u }) ในทุกรอบของ reduce","correct":false,"why":"ผิด เพราะ Object.assign ลงใน object ว่างใหม่ก็คัดลอก acc ทั้งก้อนในทุกรอบเช่นเดียวกัน ต้นทุนยังเป็นกำลังสอง"},{"id":"D","text":"เปลี่ยนจาก reduce เป็น reduceRight ให้วนจากท้ายอาร์เรย์ไปหาต้นอาร์เรย์ โดยยังใช้ spread คัดลอก acc ในแต่ละรอบเหมือนเดิม","correct":false,"why":"ผิด เพราะทิศทางการวนไม่ได้เปลี่ยนจำนวนการคัดลอก ทุกรอบยังคัดลอก acc ทั้งก้อนใหม่ ต้นทุนรวมยังโตตามกำลังสองของจำนวนข้อมูล"}],"explanation":"รูปแบบ reduce ที่ spread accumulator ในทุกรอบเป็นรูปแบบยอดนิยมที่ดูสะอาดแต่แฝง O(n²) เพราะสร้างสำเนาของ acc ที่โตขึ้นเรื่อย ๆ เมื่อ acc เป็นตัวแปรภายในที่ไม่มีใครเห็นระหว่างทาง การแก้ไขโดยตรง (mutate) ปลอดภัยและเร็วกว่า สัญญาณที่ควรสังเกตคือเวลาโตเร็วกว่าขนาดข้อมูล"},{"id":"PS-S-E-004","level":"senior","pool":"exam","competency":"SQL Coding","descriptor":"SQLC-S4","concept":"which-inserts-rejected","mobile":false,"type":"multiple","stem":"ตาราง order_items ถูกสร้างด้วยข้อกำหนดด้านล่าง และมีแถว (100, 1, NULL, 2) อยู่แล้ว ฐานข้อมูลเปิดการบังคับ foreign key และมีสินค้า id 1 และ 2 กับคูปอง id 1 อยู่ในตารางที่อ้างอิง คำสั่ง INSERT ข้อใดต่อไปนี้ที่ฐานข้อมูลจะปฏิเสธ (เลือกทุกข้อที่ถูก)","code":"CREATE TABLE order_items (\n  order_id   INTEGER NOT NULL,\n  product_id INTEGER NOT NULL REFERENCES products (id),\n  coupon_id  INTEGER REFERENCES coupons (id),\n  qty        INTEGER CHECK (qty > 0),\n  PRIMARY KEY (order_id, product_id)\n);\n\n-- แถวที่มีอยู่แล้ว\nINSERT INTO order_items VALUES (100, 1, NULL, 2);","codeLang":"sql","options":[{"id":"A","text":"INSERT INTO order_items VALUES (101, 1, NULL, 1);","correct":false,"why":"ไม่ถูกปฏิเสธ เพราะ coupon_id เป็น NULL ได้ (foreign key ที่เป็น NULL ไม่ถูกตรวจ) และคู่ (101, 1) ไม่ซ้ำ"},{"id":"B","text":"INSERT INTO order_items VALUES (100, 1, 1, 3);","correct":true,"why":"ถูกปฏิเสธ เพราะคู่ (order_id, product_id) = (100, 1) ซ้ำกับ primary key ของแถวที่มีอยู่แล้ว แม้ coupon_id และ qty ต่างกัน"},{"id":"C","text":"INSERT INTO order_items VALUES (100, 2, NULL, NULL);","correct":false,"why":"ไม่ถูกปฏิเสธ เพราะ qty ไม่มี NOT NULL และ CHECK (qty > 0) ได้ UNKNOWN เมื่อ qty เป็น NULL ซึ่งผ่าน แถวนี้จึงถูกบันทึก"},{"id":"D","text":"INSERT INTO order_items VALUES (101, 2, NULL, 0);","correct":true,"why":"ถูกปฏิเสธ เพราะ qty = 0 ทำให้ CHECK (qty > 0) เป็นเท็จ"}],"explanation":"ข้อกำหนดแต่ละชนิดตอบคำถามต่างกัน PRIMARY KEY ห้ามค่าซ้ำและ NULL, CHECK ปฏิเสธเฉพาะเมื่อนิพจน์เป็นเท็จ (UNKNOWN จาก NULL ผ่าน), FOREIGN KEY ที่เป็น NULL ไม่ถูกตรวจ ดังนั้นถ้าต้องการให้ qty หรือ coupon_id ต้องมีค่า ต้องประกาศ NOT NULL แยกต่างหาก"},{"id":"PS-S-E-005","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S1","concept":"pii-masking-before-llm","mobile":false,"type":"single","stem":"ธนาคารแห่งหนึ่งจะใช้บริการ LLM ภายนอกสรุปหนังสือร้องเรียนของลูกค้า ซึ่งมีชื่อ เบอร์โทร และเลขบัตรประชาชน 13 หลักปะปนอยู่ ทีมกฎหมายกำหนดว่าข้อมูลระบุตัวตนส่งออกนอกองค์กรได้เท่าที่จำเป็นต่อวัตถุประสงค์เท่านั้น และสรุปต้องอ้างถึงบุคคลในเรื่องได้ถูกตัว ควรออกแบบอย่างไร","code":"เรียน ผู้จัดการ\nดิฉัน นางสาวสุภา ใจดี เลขบัตรประชาชน 1-1234-56789-01-2 โทร 081-234-5678\nถูกหักเงินซ้ำสองครั้งในวันที่ 3 มีนาคม ขอให้ตรวจสอบและคืนเงิน","codeLang":"text","options":[{"id":"A","text":"ขอความยินยอมครั้งเดียวตอนลูกค้าเปิดบัญชี แล้วส่งข้อความเต็มทุกฉบับในภายหลัง","correct":false,"why":"ผิด เพราะความยินยอมที่กว้างและครั้งเดียวไม่ได้แก้ปัญหาเรื่องการส่งข้อมูลเกินความจำเป็น และไม่ตอบข้อกำหนดของทีมกฎหมายที่ให้ส่งเท่าที่จำเป็น"},{"id":"B","text":"ส่งข้อความเต็มไปตามเดิม แต่ระบุใน prompt ว่าห้ามเก็บหรือนำข้อมูลส่วนบุคคลไปใช้ต่อ","correct":false,"why":"ผิด เพราะคำสั่งใน prompt ไม่ใช่การควบคุมทางเทคนิคหรือสัญญา ข้อมูลระบุตัวตนก็ถูกส่งออกนอกองค์กรไปแล้วจริง ขัดกับข้อกำหนดเท่าที่จำเป็น"},{"id":"C","text":"ลบเฉพาะเลขบัตรประชาชน 13 หลักออกจากข้อความก่อนส่ง และส่งชื่อกับเบอร์โทรไปตามเดิมพร้อมเนื้อหาร้องเรียนทั้งฉบับ","correct":false,"why":"ผิด เพราะชื่อและเบอร์โทรเป็นข้อมูลส่วนบุคคลที่ระบุตัวบุคคลได้ และการสรุปเรื่องร้องเรียนไม่ต้องใช้ค่าจริงของข้อมูลเหล่านี้"},{"id":"D","text":"แทนชื่อ เบอร์โทร และเลขบัตรด้วย placeholder เช่น [PERSON_1] ก่อนส่ง เก็บตารางแมปไว้ภายใน แล้วแทนกลับในสรุปที่ได้","correct":true,"why":"ถูก เพราะข้อมูลระบุตัวตนไม่ออกนอกองค์กร แต่โครงเรื่องและการอ้างถึงบุคคลยังคงอยู่ผ่าน placeholder แล้วระบบแทนกลับเมื่อได้ผล ตรงกับหลักใช้เท่าที่จำเป็น"}],"explanation":"เมื่อต้องส่งข้อความไปยัง LLM ภายนอก การลดข้อมูลระบุตัวตนก่อนส่ง (pseudonymization) ด้วย placeholder ที่แมปกลับได้เก็บภายในเป็นแนวทางที่รักษาประโยชน์ของงานไว้ พร้อมลดข้อมูลที่ออกนอกองค์กรให้น้อยที่สุด ไม่ควรพึ่งคำสั่งใน prompt เป็นมาตรการคุ้มครองข้อมูล"},{"id":"PS-S-E-006","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S3","concept":"interval-overlap-condition","mobile":true,"type":"single","stem":"แอปจองคิวคลินิกเก็บช่วงเวลาเป็นนาทีนับจากเที่ยงคืน โดยเวลาสิ้นสุดไม่นับรวม (ช่วง 540–600 คือ 9:00–10:00) จองต่อเนื่องกัน เช่น 9:00–10:00 กับ 10:00–11:00 ต้องจองได้ แต่ช่วงที่ซ้อนกันจริงต้องถูกปฏิเสธ ไม่ว่าช่วงไหนเริ่มก่อน พบว่าฟังก์ชันตรวจเวลาซ้อนทับให้ผลผิดทั้งสองทิศทาง เงื่อนไขใดทำให้ conflicts ถูกต้องทุกกรณี","code":"type Slot = { start: number; end: number }; // นาทีจากเที่ยงคืน, end ไม่นับรวม\n\nfunction conflicts(a: Slot, b: Slot): boolean {\n  return a.start \u003c= b.start && b.start \u003c= a.end;\n}","codeLang":"typescript","options":[{"id":"A","text":"b.start \u003c a.end || a.start \u003c b.end","correct":false,"why":"ผิด เพราะใช้ หรือ แทน และ ทำให้เป็นจริงเกือบทุกคู่ เช่น 540–600 กับ 700–760 ถูกนับว่าชนกัน"},{"id":"B","text":"a.start \u003c= b.end && b.start \u003c= a.end","correct":false,"why":"ผิด เพราะใช้ \u003c= ทำให้ช่วงที่ต่อกันพอดี (540–600 กับ 600–660) ถูกนับว่าชนกัน จองต่อเนื่องไม่ได้"},{"id":"C","text":"a.start \u003c b.start && b.start \u003c a.end","correct":false,"why":"ผิด เพราะตรวจเฉพาะกรณี b เริ่มภายใน a เท่านั้น พลาดกรณีที่ทั้งสองช่วงเริ่มเวลาเดียวกัน และกรณี b เริ่มก่อน a แต่ซ้อนเข้ามา"},{"id":"D","text":"a.start \u003c b.end && b.start \u003c a.end","correct":true,"why":"ถูก เพราะสองช่วงซ้อนกันก็ต่อเมื่อแต่ละช่วงเริ่มก่อนอีกช่วงจบ ช่วงที่ต่อกันพอดีเช่น 540–600 กับ 600–660 ให้เท็จ และครอบคลุมทั้งกรณีฝังในกันและเริ่มก่อน"}],"explanation":"เงื่อนไขช่วงเวลาซ้อนกันที่ถูกต้องและจำง่ายคือ \"ต่างฝ่ายต่างเริ่มก่อนอีกฝ่ายจบ\" ซึ่งจัดการทุกตำแหน่งสัมพัทธ์ได้ในนิพจน์เดียว และต้องตกลงให้ชัดว่าปลายช่วงรวมหรือไม่รวมเพื่อเลือก \u003c หรือ \u003c= การเขียนเทสต์ที่ไล่ทุกคู่ช่วงเล็ก ๆ เทียบกับการนับนาทีที่ซ้อนกันจริงเป็นวิธีพิสูจน์ที่ดี"},{"id":"PS-S-E-007","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S2","concept":"production-llm-signals","mobile":false,"type":"multiple","stem":"ทีมกำลังออกแบบแดชบอร์ดเฝ้าระวังฟีเจอร์ร่างคำตอบอีเมลด้วย LLM ที่จะเปิดให้พนักงาน 2,000 คนใช้ ต้องการตัวชี้วัดที่ช่วยบอกปัญหาด้านคุณภาพและต้นทุนได้เร็วโดยไม่ต้องรอร้องเรียน ข้อใดควรอยู่ในแดชบอร์ด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"อัตราที่ผู้ใช้แก้ไขร่างอย่างมากหรือลบร่างทิ้งแล้วเขียนเอง","correct":true,"why":"ควรมี เพราะเป็นสัญญาณคุณภาพจากการใช้งานจริงที่ไม่ต้องรอร้องเรียน ถ้าอัตราสูงขึ้นแสดงว่าร่างที่ได้ตรงความต้องการน้อยลง"},{"id":"B","text":"ต้นทุน token ต่อคำขอ และสัดส่วนคำขอที่ต้องใช้ทางสำรองเมื่อ LLM ล้มเหลวหรือถูกปฏิเสธ","correct":true,"why":"ควรมี เพราะต้นทุนและความพร้อมใช้ของบริการเป็นสองด้านหลักของการเฝ้าระวัง และการเพิ่มขึ้นผิดปกติเป็นสัญญาณให้ตรวจ prompt หรือผู้ให้บริการ"},{"id":"C","text":"ค่าความมั่นใจที่โมเดลรายงานไว้ในคำตอบของตัวเอง ใช้แทนความถูกต้องของร่าง","correct":false,"why":"ไม่ควรใช้แทน เพราะตัวเลขความมั่นใจที่โมเดลพูดถึงตัวเองไม่ได้ถูกปรับเทียบกับความจริง ร่างที่ผิดอาจมาพร้อมความมั่นใจสูง"},{"id":"D","text":"อัตราที่ผลลัพธ์ของโมเดลไม่ผ่านการตรวจโครงสร้างหรือกฎที่โค้ดกำหนด","correct":true,"why":"ควรมี เพราะเป็นสัญญาณตรง ๆ ว่าโมเดลทำตามรูปแบบที่ระบบต้องการหรือไม่ และการเปลี่ยนของค่านี้มักบอกการเปลี่ยนของ prompt โมเดล หรือข้อมูลขาเข้า"}],"explanation":"ตัวชี้วัดฟีเจอร์ LLM ควรครอบคลุมสามกลุ่ม คือรูปแบบ/ความถูกต้องที่ตรวจด้วยโค้ดได้, สัญญาณจากพฤติกรรมผู้ใช้ (แก้ไข ปฏิเสธ) และต้นทุน/ความพร้อมใช้ ค่าความมั่นใจที่โมเดลเขียนเองไม่ใช่ตัวชี้วัดที่เชื่อถือได้ หากไม่เคยปรับเทียบกับผลจริง"},{"id":"PS-S-E-008","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S3","concept":"dp-memo-key-completeness","mobile":false,"type":"multiple","stem":"ฟังก์ชันนับจำนวนวิธีทอนเงินแบบไม่คำนึงลำดับเหรียญ ให้ผลถูกต้องกับตัวอย่างเล็ก แต่เมื่อใช้เหรียญ 8 ชนิดเวลาเพิ่มขึ้นอย่างรวดเร็วตามยอดเงิน (ยอด 200 เรียกตัวเองประมาณ 22 ล้านครั้ง) และต้องรองรับยอดเป็นพัน ข้อใดขจัดการคำนวณซ้ำของปัญหาย่อยและยังได้จำนวนวิธีเท่าเดิม (เลือกทุกข้อที่ถูก)","code":"function ways(coins: number[], amount: number, i = 0): number {\n  if (amount === 0) return 1;\n  if (amount \u003c 0 || i === coins.length) return 0;\n  return ways(coins, amount - coins[i], i) + ways(coins, amount, i + 1);\n}\n\nconsole.log(ways([1, 2, 5], 5));","codeLang":"typescript","options":[{"id":"A","text":"ทำ bottom-up ด้วย dp array ขนาด amount + 1 โดยวนเหรียญทีละชนิดในลูปนอก แล้ววนยอดในลูปใน บวก dp[a - coin] เข้ากับ dp[a]","correct":true,"why":"ถูก เพราะลำดับลูปนอกเป็นเหรียญทำให้นับชุดเหรียญโดยไม่สนลำดับ ตรงกับฟังก์ชันเดิม และใช้เวลา O(จำนวนเหรียญ × ยอด)"},{"id":"B","text":"เพิ่มขนาด call stack ของ runtime ก่อนรันโปรแกรม แล้วคงฟังก์ชันไว้ตามเดิม","correct":false,"why":"ผิด เพราะปัญหาคือจำนวนครั้งที่เรียกซ้ำโตเร็วตามยอด ไม่ใช่ความลึกของ stack การเพิ่ม stack ไม่ลดจำนวนการคำนวณ"},{"id":"C","text":"เก็บผลย่อยใน Map ด้วย key ที่ประกอบด้วยทั้งตำแหน่งเหรียญ i และยอดคงเหลือ amount แล้วเช็ค Map ก่อนคำนวณทุกครั้ง","correct":true,"why":"ถูก เพราะผลของฟังก์ชันขึ้นกับสองค่านี้ครบ จำนวนสถานะที่ต่างกันมีแค่ (จำนวนเหรียญ × ยอด) การคำนวณซ้ำจึงหายไปและค่าเท่าเดิม"},{"id":"D","text":"memoize ด้วย key เป็น amount อย่างเดียว แล้วเก็บผลย่อยไว้ใน Map ก่อนคืนค่าในแต่ละการเรียก","correct":false,"why":"ผิด เพราะจำนวนวิธีขึ้นกับว่ายังเหลือเหรียญชนิดไหนให้ใช้ (ค่า i) ด้วย การใช้ amount เป็น key เดียวนำผลของ i อื่นมาใช้ผิด ตัวอย่างเล็กก็ได้คำตอบเพี้ยน"},{"id":"E","text":"เรียงเหรียญจากมูลค่ามากไปน้อยก่อนเรียก แล้วใช้ฟังก์ชันเดิมโดยไม่แก้ส่วนอื่น","correct":false,"why":"ผิด เพราะการเรียงลดจำนวนครั้งเรียกได้ราว 4 เท่า (ที่ยอด 150 จาก 5.7 ล้านเหลือ 1.4 ล้านครั้ง) แต่ปัญหาย่อยเดิมยังถูกคำนวณซ้ำจำนวนมากและเวลายังโตเร็วตามยอดเหมือนเดิม"}],"explanation":"ปัญหาที่แตกเป็นปัญหาย่อยซ้ำกัน แก้ด้วย dynamic programming ได้ทั้งแบบ top-down (memoization) และ bottom-up จุดที่พลาดบ่อยคือ key ของ memo ต้องมีครบทุกตัวแปรที่ผลลัพธ์ขึ้นอยู่ด้วย ถ้า key ขาดไป ผลลัพธ์จะผิดโดยไม่ error และแทบหาไม่เจอถ้าไม่มีเทสต์เทียบกับเวอร์ชันช้า"},{"id":"PS-S-E-009","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S3","concept":"bangkok-day-bucketing","mobile":false,"type":"multiple","stem":"รายงานยอดขายรายวันต้องจัดกลุ่มคำสั่งซื้อตามวันตามเวลาประเทศไทย แต่ server รันด้วย timezone UTC ออเดอร์เวลา 00:30 น. วันที่ 1 มีนาคม 2026 (เวลาไทย) ถูกนับเป็นยอดของวันที่ 28 กุมภาพันธ์ ข้อใดแก้ให้ได้วันที่ตามเวลาไทยโดยไม่ขึ้นกับ timezone ของเครื่องที่รัน (เลือกทุกข้อที่ถูก)","code":"function dayKey(d: Date): string {\n  return d.toISOString().slice(0, 10);\n}\n\nconsole.log(dayKey(new Date('2026-03-01T00:30:00+07:00')));","codeLang":"typescript","options":[{"id":"A","text":"ใช้ Intl.DateTimeFormat ที่ระบุ timeZone เป็น Asia/Bangkok แล้วประกอบปี เดือน วัน จาก formatToParts","correct":true,"why":"ถูก เพราะระบุเขตเวลาไว้ชัดเจนในโค้ด ผลจึงไม่ขึ้นกับ timezone ของเครื่อง และรองรับกรณีที่เขตเวลามีการเปลี่ยนแปลงกฎได้ดีกว่า offset ตายตัว"},{"id":"B","text":"บวก 7 ชั่วโมง (เป็นมิลลิวินาที) เข้ากับ timestamp ก่อน แล้วใช้ toISOString().slice(0, 10) (ประเทศไทยไม่ใช้ daylight saving)","correct":true,"why":"ถูก เพราะการบวกชดเชย offset คงที่ +07:00 แล้วอ่านวันที่แบบ UTC ให้ผลเหมือนกันทุกเครื่อง"},{"id":"C","text":"ใช้ d.toLocaleDateString(\"en-CA\") โดยไม่ระบุ timeZone ให้ได้สตริงรูปแบบ ปี-เดือน-วัน","correct":false,"why":"ผิด เพราะรูปแบบวันที่ถูกต้อง แต่เมื่อไม่ระบุ timeZone จะใช้ timezone ของเครื่อง เครื่อง UTC ยังได้ 2026-02-28"},{"id":"D","text":"ประกอบสตริงจาก getFullYear(), getMonth() + 1 และ getDate() ของ Date","correct":false,"why":"ผิด เพราะ getter เหล่านี้อ่านตาม timezone ของเครื่องที่รัน เมื่อ server เป็น UTC ได้วันที่ UTC ซึ่งเป็นวันที่ 28 กุมภาพันธ์เหมือนเดิม"}],"explanation":"การตีความ \"วัน\" ขึ้นกับเขตเวลาเสมอ timestamp ตัวเดียวกันอยู่คนละวันในคนละเขตเวลา ควรเก็บเวลาเป็น instant (UTC) แล้วคำนวณขอบเขตวันด้วยเขตเวลาของธุรกิจที่ระบุไว้ในโค้ดอย่างชัดเจน ไม่ใช้ค่าเริ่มต้นของเครื่อง เพราะเครื่องพัฒนาที่เป็นเวลาไทยจะซ่อนบั๊กนี้ไว้จนขึ้น production"},{"id":"PS-S-E-010","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S2","concept":"chat-history-token-growth","mobile":true,"type":"single","stem":"ผู้ช่วยแชตในแอปธนาคารบนมือถือเรียก LLM ทุกครั้งที่ผู้ใช้ส่งข้อความ ต้นทุนต่อบทสนทนาเพิ่มขึ้นสามเท่าในหนึ่งเดือน และบทสนทนายาวบางครั้งตอบหลุดประเด็นจากช่วงต้น log แสดงว่าจำนวน input token ต่อคำขอเพิ่มขึ้นทุกรอบของบทสนทนา ข้อใดแก้ตรงสาเหตุที่สุด","code":"const history: Message[] = [{ role: 'system', content: SYSTEM_PROMPT }];\n\nasync function onUserMessage(text: string) {\n  history.push({ role: 'user', content: text });\n  const reply = await llm.chat({ messages: history, maxOutputTokens: 300 });\n  history.push({ role: 'assistant', content: reply });\n  return reply;\n}","codeLang":"typescript","options":[{"id":"A","text":"ลดค่า maxOutputTokens จาก 300 ให้เหลือ 100 และคงการส่งประวัติทั้งหมดไว้ตามเดิม","correct":false,"why":"ผิด เพราะค่านี้จำกัดความยาวคำตอบ ไม่ใช่ขนาดประวัติที่ส่งเข้าไป ต้นทุนส่วนที่โตขึ้นเรื่อย ๆ คือ input ยังคงอยู่ และคำตอบอาจถูกตัดกลางคัน"},{"id":"B","text":"เก็บสำเนาของ history ไว้ในเครื่องผู้ใช้ แล้วให้แอปส่งสำเนานั้นพร้อมข้อความใหม่ไปยัง server ในแต่ละรอบ แทนการเก็บที่ server","correct":false,"why":"ผิด เพราะย้ายตำแหน่งที่เก็บประวัติ แต่จำนวน token ที่ส่งเข้าโมเดลยังเท่าเดิม ต้นทุนไม่ลด และเพิ่มความเสี่ยงที่ข้อมูลบทสนทนาถูกแก้ไขที่เครื่อง"},{"id":"C","text":"ตัด system prompt ออกจากข้อความที่ส่งตั้งแต่รอบที่สองเป็นต้นไป และคงประวัติที่เหลือไว้","correct":false,"why":"ผิด เพราะแต่ละคำขอเป็นอิสระ โมเดลไม่ได้จำ system prompt จากคำขอก่อนหน้า การตัดออกทำให้ผู้ช่วยลืมกติกาและพฤติกรรมที่ตั้งไว้"},{"id":"D","text":"จำกัดข้อความที่ส่งไปแต่ละรอบเป็น system prompt, สรุปย่อของบทสนทนาก่อนหน้า และข้อความล่าสุดไม่กี่รอบ แล้ววัด token ต่อคำขอ","correct":true,"why":"ถูก เพราะ input token โตตามความยาวของประวัติ การส่งเฉพาะช่วงล่าสุดกับสรุปของช่วงก่อนหน้าทำให้ขนาดคำขอคงที่ ต้นทุนไม่โตตามความยาวบทสนทนา และคงบริบทที่จำเป็น"}],"explanation":"LLM ส่วนใหญ่ไม่มีความจำระหว่างคำขอ ผู้พัฒนาต้องส่งบริบททั้งหมดที่ต้องใช้ทุกครั้ง การต่อประวัติไม่จำกัดจึงทำให้ต้นทุนและความล่าช้าโตตามความยาวบทสนทนา และบริบทที่ยาวเกินยังทำให้คุณภาพลดลง แนวทางที่ใช้คือ sliding window ร่วมกับสรุปบทสนทนาเก่า และเฝ้าดู token ต่อคำขอเป็นตัวชี้วัด"},{"id":"PS-S-E-011","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S3","concept":"multi-key-sort-stability","mobile":false,"type":"multiple","stem":"ต้องการแสดงรายชื่อพนักงานเรียงตามแผนก A ถึง Z และภายในแผนกเดียวกันเรียงเงินเดือนจากมากไปน้อย โค้ดปัจจุบันได้รายการที่เรียงตามเงินเดือนล้วน ๆ แผนกปะปนกัน ข้อใดให้ลำดับตามที่ต้องการอย่างถูกต้อง (เลือกทุกข้อที่ถูก)","code":"const staff = [\n  { name: 'Nok', dept: 'B', salary: 50 },\n  { name: 'Aom', dept: 'A', salary: 100 },\n  { name: 'Bee', dept: 'B', salary: 95 },\n  { name: 'Chai', dept: 'A', salary: 90 },\n];\n\nstaff.sort((a, b) => a.dept.localeCompare(b.dept));\nstaff.sort((a, b) => b.salary - a.salary);","codeLang":"typescript","options":[{"id":"A","text":"คำนวณคีย์แผนกและเงินเดือนของแต่ละคนครั้งเดียวเก็บคู่กับรายการ แล้วเรียงตามแผนกก่อนและเงินเดือนจากมากไปน้อย ก่อนแกะรายการออกมา","correct":true,"why":"ถูก เพราะเรียงด้วยคีย์ที่เก็บไว้ตามแผนกแล้วตามเงินเดือนจากมากไปน้อย ได้ลำดับสองชั้นตามต้องการ (decorate–sort–undecorate) และคำนวณคีย์เพียงครั้งเดียวต่อรายการ"},{"id":"B","text":"เรียงตามเงินเดือนจากมากไปน้อยก่อน แล้วค่อยเรียงตามแผนกทีหลัง โดยอาศัยการที่ Array.prototype.sort เป็น stable","correct":true,"why":"ถูก เพราะ stable sort คงลำดับเดิมของสมาชิกที่เท่ากัน การเรียงด้วยคีย์รองก่อนแล้วคีย์หลักทีหลังจึงได้ลำดับสองชั้น สเปกของ JavaScript รับประกันความ stable ตั้งแต่ ES2019"},{"id":"C","text":"ใช้ comparator ที่คืนค่า boolean: (a, b) => a.dept > b.dept && b.salary > a.salary","correct":false,"why":"ผิด เพราะ comparator ต้องคืนค่าลบ ศูนย์ หรือบวก ค่า boolean ถูกแปลงเป็น 0 หรือ 1 ไม่เคยเป็นลบ ทำให้ลำดับไม่แน่นอน"},{"id":"D","text":"ต่อสตริง dept กับ salary เช่น \"A-100\" ของแต่ละคน แล้วเรียงด้วย comparator เริ่มต้นของ sort()","correct":false,"why":"ผิด เพราะเทียบเป็นสตริงทีละตัวอักษร ภายในแผนกเดียวกันจึงเรียงแบบพจนานุกรมจากน้อยไปมาก \"B-50\" มาก่อน \"B-95\" ซึ่งกลับกับเงินเดือนจากมากไปน้อย"},{"id":"E","text":"ใช้ comparator เดียวที่เทียบแผนกก่อน และเมื่อแผนกเท่ากันค่อยเทียบเงินเดือน: a.dept.localeCompare(b.dept) || b.salary - a.salary","correct":true,"why":"ถูก เพราะ || ใช้ผลของคีย์ที่สองเฉพาะเมื่อคีย์แรกเสมอกัน (ค่าเป็น 0) ได้ลำดับสองชั้นในการเรียงรอบเดียว"}],"explanation":"การเรียงหลายคีย์ทำได้สองแบบที่ถูกต้อง คือ comparator เดียวที่ต่อคีย์ด้วย || หรือเรียงหลายรอบจากคีย์รองไปคีย์หลักโดยพึ่ง stable sort และถ้าคำนวณคีย์แพงก็เก็บคีย์ไว้ก่อนเรียงได้ (decorate–sort–undecorate) ข้อผิดพลาดที่พบบ่อยคือเรียงคีย์หลักก่อนแล้วคีย์รองทีหลัง (ซึ่งทับกัน) comparator ที่คืน boolean และการเรียงตัวเลขเป็นสตริง"},{"id":"PS-S-E-012","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S2","concept":"concurrency-limit-pool","mobile":false,"type":"multiple","stem":"งานซิงก์ข้อมูลส่งคำขอไปยัง API ของพาร์ตเนอร์ 3,000 รายการ พาร์ตเนอร์อนุญาตให้ค้างพร้อมกันไม่เกิน 10 คำขอ และตอบ 429 เมื่อเกิน ตอนนี้โค้ดยิงทั้งหมดพร้อมกัน ข้อใดจำกัดจำนวนคำขอที่ค้างอยู่พร้อมกันไม่เกิน 10 (เลือกทุกข้อที่ถูก)","code":"async function syncAll(ids: string[]) {\n  return Promise.all(ids.map((id) => pushToPartner(id)));\n}","codeLang":"typescript","options":[{"id":"A","text":"สร้าง worker 10 ตัว แต่ละตัววนหยิบ id ถัดไปจากตัวนับที่ใช้ร่วมกันมาประมวลผลทีละรายการจนหมด","correct":true,"why":"ถูก เพราะมีงานที่ทำอยู่พร้อมกันไม่เกินจำนวน worker และ worker ที่ทำเสร็จก็หยิบงานต่อทันที ไม่ต้องรอตัวที่ช้าที่สุดในชุด"},{"id":"B","text":"เปลี่ยน Promise.all เป็น Promise.allSettled แล้วตรวจผลที่ล้มเหลวจากสถานะ rejected ภายหลัง","correct":false,"why":"ผิด เพราะ allSettled ต่างจาก all แค่เรื่องการรวมผลเมื่อมี error ทุกคำขอยังถูกเริ่มพร้อมกันครบ 3,000 รายการ จึงยังเกินขีดจำกัด"},{"id":"C","text":"แบ่ง ids เป็นชุดละ 10 รายการ แล้ว await Promise.all ทีละชุดต่อเนื่องกัน","correct":true,"why":"ถูก เพราะภายในหนึ่งชุดมีคำขอค้างไม่เกิน 10 และชุดถัดไปเริ่มหลังชุดก่อนหน้าเสร็จทั้งหมด จึงไม่เกินขีดจำกัด แม้ปริมาณงานอาจต่ำกว่า worker pool เล็กน้อยเมื่อบางคำขอช้ากว่าตัวอื่นในชุด"},{"id":"D","text":"ใช้ semaphore ขนาด 10 โดยขอสิทธิ์ก่อนเรียกพาร์ตเนอร์ทุกครั้ง รอถ้าครบ 10 และคืนสิทธิ์ใน finally","correct":true,"why":"ถูก เพราะจำนวนผู้ถือสิทธิ์ไม่เกิน 10 เสมอ และการคืนสิทธิ์ใน finally ทำให้คำขอที่ error ไม่ทำให้สิทธิ์รั่วหาย"}],"explanation":"map แล้ว Promise.all เริ่มทุกงานทันที ไม่มีการจำกัดความขนาน หากต้องเคารพขีดจำกัดของระบบปลายทางต้องควบคุมที่ฝั่งเรา ทางเลือกหลักคือ worker pool, แบ่งเป็นชุด หรือ semaphore ต่างกันที่ปริมาณงานและความซับซ้อน ส่วน allSettled เป็นเรื่องการรวมผลลัพธ์ ไม่ใช่การจำกัดความขนาน"},{"id":"PS-S-E-013","level":"senior","pool":"exam","competency":"SQL Coding","descriptor":"SQLC-S1","concept":"recursive-cte-cycle","mobile":false,"type":"multiple","stem":"คำสั่งหาลูกทีมทั้งหมดของพนักงาน 1 ทำงานปกติมาเป็นปี แต่หลังมีคนแก้ข้อมูลผิด (manager_id ของพนักงาน 1 ถูกตั้งเป็น 3) คำสั่งนี้รันไม่จบและกิน CPU กับหน่วยความจำเรื่อย ๆ ข้อใดแก้ให้คำสั่งจบได้แม้ข้อมูลมีวงวน (เลือกทุกข้อที่ถูก)","code":"CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, manager_id INTEGER);\n\nINSERT INTO employees VALUES\n  (1, 'Ploy', 3), (2, 'Nate', 1), (3, 'Ice', 2), (4, 'Mint', 3);\n\nWITH RECURSIVE team(id, manager_id) AS (\n  SELECT id, manager_id FROM employees WHERE id = 1\n  UNION ALL\n  SELECT e.id, e.manager_id\n  FROM employees e JOIN team t ON e.manager_id = t.id\n)\nSELECT id FROM team;","codeLang":"sql","options":[{"id":"A","text":"เพิ่ม DISTINCT ใน SELECT สุดท้ายที่อ่านจาก team และคงส่วน recursive ไว้ตามเดิม","correct":false,"why":"ผิด เพราะ DISTINCT อยู่ท้ายสุด หลังจาก recursive CTE ทำงานเสร็จ ส่วน recursive ยังสร้างแถวใหม่ไม่รู้จบ คำสั่งจึงยังไม่จบ"},{"id":"B","text":"สร้าง index บน employees (manager_id) และคงคำสั่ง recursive CTE ไว้ตามเดิม","correct":false,"why":"ผิด เพราะ index ลดเวลาต่อรอบ แต่ไม่ได้เปลี่ยนว่ามีแถวใหม่ถูกสร้างทุกรอบหรือไม่ วงวนยังไม่จบ"},{"id":"C","text":"เพิ่มคอลัมน์ path ที่ต่อ id เข้าไปในแต่ละรอบ เช่น path || \",\" || e.id โดยไม่เพิ่มเงื่อนไขกรอง","correct":false,"why":"ผิด เพราะการต่อสตริงเพียงอย่างเดียวไม่ได้ตรวจว่า id ซ้ำกับใน path หรือไม่ ทุกรอบยังสร้างแถวใหม่ (และ path ที่ต่างกัน) ไม่จบ ต้องมีเงื่อนไขหยุดเมื่อ id อยู่ใน path แล้ว"},{"id":"D","text":"เปลี่ยน UNION ALL เป็น UNION ในส่วน recursive ซึ่งตัดแถวที่ซ้ำกับแถวที่เคยได้แล้วทิ้ง","correct":true,"why":"ถูก เพราะ team มีแค่ (id, manager_id) ซึ่งรอบใหม่ที่วนกลับมาซ้ำกับแถวเดิมทุกคอลัมน์ UNION จึงไม่ส่งแถวซ้ำเข้ารอบถัดไป และการวนจบ"},{"id":"E","text":"เพิ่มคอลัมน์ depth นับชั้นและใส่เงื่อนไข WHERE t.depth \u003c 10 ในส่วน recursive","correct":true,"why":"ถูก เพราะการหยุดที่ความลึกสูงสุดทำให้การวนจบแน่นอน (ได้แถวซ้ำภายในความลึกที่กำหนด จึงมักใช้ร่วมกับ DISTINCT หรือกรองผลต่อ)"}],"explanation":"recursive CTE ทำงานจนกว่ารอบหนึ่งจะไม่ได้แถวใหม่ ถ้าข้อมูลเป็นกราฟที่มีวงวน (ซึ่งตารางที่ไม่มี constraint ป้องกันก็เกิดได้) UNION ALL จะสร้างแถวไม่หยุด วิธีกันคือใช้ UNION เมื่อแถวไม่มีคอลัมน์ที่เปลี่ยนทุกรอบ, จำกัดความลึก หรือเก็บ path แล้วหยุดเมื่อพบ id ซ้ำ และควรแก้ข้อมูลหรือเพิ่มการตรวจที่ตัวต้นเหตุด้วย"},{"id":"PS-S-E-014","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S2","concept":"all-settled-partial-results","mobile":true,"type":"single","stem":"หน้าแรกของแอปมือถือโหลดข้อมูลสี่ส่วนจากสี่ API เมื่อ getPromos ล่มและตอบ 503 ทั้งหน้าแสดงข้อความ error ทั้งที่อีกสามส่วนโหลดสำเร็จ ต้องการให้ส่วนที่สำเร็จแสดงได้ ส่วนที่ล้มแสดงสถานะ error เฉพาะการ์ดของตัวเอง โดยเวลาโหลดรวมไม่ควรช้ากว่าเดิม","code":"async function loadHome(userId: string) {\n  const [profile, orders, promos, points] = await Promise.all([\n    getProfile(userId),\n    getOrders(userId),\n    getPromos(),\n    getPoints(userId),\n  ]);\n  return { profile, orders, promos, points };\n}","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยนเป็น await ทีละ API ภายใน try/catch แยกของแต่ละตัว","correct":false,"why":"ผิด เพราะแยก error ได้แต่คำขอทำงานต่อกันทีละตัว เวลารวมเท่ากับผลรวมของทุก API ช้ากว่าเดิมซึ่งยิงพร้อมกัน ขัดกับข้อกำหนดเวลาโหลด"},{"id":"B","text":"ใช้ Promise.any รอผลจากทั้งสี่ API แล้วอ่านค่าที่สำเร็จมาแสดง","correct":false,"why":"ผิด เพราะ Promise.any คืนผลแรกที่สำเร็จเพียงตัวเดียว ไม่ได้ข้อมูลครบทั้งสี่ส่วนที่หน้าจอต้องการ"},{"id":"C","text":"ห่อ Promise.all ด้วย try/catch เดียว ถ้ามี error ให้คืน object ที่มีค่าว่างทุกฟิลด์ และแสดงข้อความ error ที่หน้าจอแทน","correct":false,"why":"ผิด เพราะ Promise.all reject ทันทีเมื่อมีตัวใดล้ม ผลของตัวที่สำเร็จถูกทิ้งทั้งหมด หน้าจอจึงยังได้ข้อมูลว่างทั้งหน้า"},{"id":"D","text":"ยิงทั้งสี่พร้อมกันด้วย Promise.allSettled แล้วแปลงผลแต่ละตัวเป็นข้อมูลหรือสถานะ error ต่อการ์ด","correct":true,"why":"ถูก เพราะ allSettled รอจนทุกตัวจบและรายงานผลรายตัว สำเร็จหรือล้ม เวลารวมเท่ากับตัวที่ช้าที่สุดเหมือนเดิม และแต่ละการ์ดตัดสินสถานะของตนเองได้"}],"explanation":"Promise.all เหมาะเมื่อทุกส่วนจำเป็นต่อกัน (all-or-nothing) แต่หน้าจอแบบการ์ดอิสระควรยอมรับความล้มเหลวบางส่วน (graceful degradation) ด้วย allSettled ที่คงความขนาน ในแอปมือถือที่เครือข่ายไม่เสถียร การให้ผู้ใช้เห็นข้อมูลที่ได้ทันทีดีกว่าหน้า error ทั้งหน้า"},{"id":"PS-S-E-015","level":"senior","pool":"exam","competency":"Program Coding","descriptor":"PRG-S1","concept":"middleware-await-next","mobile":false,"type":"single","stem":"ระบบใช้ middleware pipeline แบบ chain of responsibility ให้ errorBoundary ครอบ middleware ตัวอื่นทั้งหมดรวมถึง auth แต่เมื่อ handler โยน error ระหว่างการทดสอบ errorBoundary ไม่เคยบันทึกว่า handled และ process บางครั้งจบด้วย unhandled rejection ส่วน log ของ request แสดงเพียง auth และ auth-after ข้อใดคือสาเหตุและทางแก้ที่ถูกต้อง","code":"type Ctx = { log: string[] };\ntype Next = () => Promise\u003cvoid>;\ntype Middleware = (ctx: Ctx, next: Next) => Promise\u003cvoid>;\n\nfunction compose(mws: Middleware[]) {\n  return (ctx: Ctx) => {\n    const run = (i: number): Promise\u003cvoid> => {\n      const mw = mws[i];\n      if (!mw) return Promise.resolve();\n      return mw(ctx, () => run(i + 1));\n    };\n    return run(0);\n  };\n}\n\nconst errorBoundary: Middleware = async (ctx, next) => {\n  try {\n    await next();\n  } catch {\n    ctx.log.push('handled');\n  }\n};\n\nconst auth: Middleware = async (ctx, next) => {\n  ctx.log.push('auth');\n  next();\n  ctx.log.push('auth-after');\n};\n\nconst handler: Middleware = async () => {\n  throw new Error('boom');\n};\n\ncompose([errorBoundary, auth, handler])({ log: [] });","codeLang":"typescript","options":[{"id":"A","text":"auth เรียก next() โดยไม่ await ทำให้ promise ที่ reject หลุดออกนอก try/catch ของ errorBoundary ต้องเปลี่ยนเป็น await next()","correct":true,"why":"ถูก เพราะ errorBoundary จับได้เฉพาะ error ที่ propagate กลับมาผ่าน promise ของ next() ที่มันรอ เมื่อ auth ปล่อยทิ้ง promise ของ handler กลายเป็น unhandled rejection แยกออกไป"},{"id":"B","text":"ย้าย errorBoundary ไปไว้หลัง auth ในอาร์เรย์ และคง auth ไว้ตามเดิมทุกบรรทัด","correct":false,"why":"ผิด เพราะย้ายแล้ว error ของ handler ถูกจับก็จริง แต่ error ที่เกิดใน auth เองหลุดออกนอก errorBoundary ขัดกับข้อกำหนดให้ครอบทุกตัว และ auth ยังเรียก next() โดยไม่รอเหมือนเดิม"},{"id":"C","text":"เพิ่ม process.on(\"unhandledRejection\") ให้บันทึก error ของ handler ลง ctx.log ของ request ที่เกิด error แล้วปล่อยให้ process ทำงานต่อ","correct":false,"why":"ผิด เพราะเป็นการดักที่ระดับ process ไม่รู้ว่า error เป็นของ request ไหน และทำให้ errorBoundary ไม่ทำงานตามหน้าที่ แค่ทำให้ process ไม่ล้มและซ่อนข้อบกพร่องไว้"},{"id":"D","text":"เปลี่ยน run ใน compose ให้ใช้ return await mw(ctx, ...) แทน return mw(ctx, ...) และประกาศ run เป็น async function","correct":false,"why":"ผิด เพราะ return await กับ return ในฟังก์ชันที่คืน promise อยู่แล้วให้ผลเหมือนกันสำหรับ error ที่ propagate มา ส่วน promise ที่ auth ปล่อยทิ้งไม่ได้อยู่ในสายนี้"}],"explanation":"ใน middleware แบบ onion error ต้องย้อนกลับผ่านสายของ promise ที่ทุกชั้นรอ (await หรือ return) ถ้าชั้นใดเรียก next() โดยไม่รอ สายนั้นขาด ชั้นนอกจึงจับไม่ได้ และ rejection กลายเป็นเหตุการณ์แยก นอกจากนี้โค้ดหลัง next() จะทำงานก่อนที่ชั้นถัดไปจะเสร็จ ซึ่งผิดความคาดหวังเรื่องลำดับด้วย"},{"id":"PS-S-E-016","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S3","concept":"summary-eval-rubric","mobile":false,"type":"multiple","stem":"ทีมต้องตัดสินใจว่าจะปล่อยโมเดลสรุปรายงานการประชุมเวอร์ชันใหม่หรือไม่ โดยมีชุดตัวอย่างรายงานจริง 200 ฉบับ ข้อใดเป็นวิธีประเมินคุณภาพของสรุปที่เชื่อถือได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"นับเฉพาะกรณีที่สรุปของโมเดลตรงกับสรุปอ้างอิงที่คนเขียนทุกตัวอักษร","correct":false,"why":"ผิด เพราะสรุปที่ดีเขียนได้หลายแบบ การเทียบทุกตัวอักษรให้คะแนนต่ำกับสรุปที่ถูกแต่ใช้คำต่างกัน และไม่วัดความครบถ้วนหรือความถูกต้องของเนื้อหา"},{"id":"B","text":"กำหนด rubric เช่น ข้อสรุปและงานที่มอบหมายครบ ไม่มีเนื้อหาที่ไม่มีในต้นฉบับ แล้วให้คนให้คะแนนตัวอย่างทั้งสองเวอร์ชัน","correct":true,"why":"ถูก เพราะ rubric ที่แยกเกณฑ์ชัดเจนทำให้การให้คะแนนซ้ำได้ และเกณฑ์ \"ไม่มีเนื้อหานอกต้นฉบับ\" จับปัญหาสรุปที่เพิ่มข้อเท็จจริงเองได้"},{"id":"C","text":"ใช้คะแนนความซ้ำของคำกับสรุปอ้างอิงเพียงตัวเดียวเป็นเกณฑ์ปล่อย","correct":false,"why":"ผิด เพราะคะแนนความซ้ำของคำวัดความคล้ายผิวหน้า สรุปที่สลับข้อเท็จจริงหรือเพิ่มข้อมูลเองยังได้คะแนนสูงได้ ใช้ประกอบได้แต่เดี่ยว ๆ ไม่พอเป็นเกณฑ์ตัดสิน"},{"id":"D","text":"ถ้าใช้ LLM เป็นผู้ตัดสิน ให้เทียบคะแนนของมันกับคะแนนของคนบนชุดตัวอย่างเดียวกันก่อนนำไปใช้ตัดสินแทนคน","correct":true,"why":"ถูก เพราะตัวตัดสินอัตโนมัติมีความลำเอียงของตัวเอง (เช่น ชอบคำตอบยาว) ต้องปรับเทียบกับมนุษย์ก่อนใช้แทน"}],"explanation":"งานสร้างข้อความไม่มีเฉลยเดียว การประเมินที่เชื่อถือได้ต้องแยกมิติคุณภาพด้วย rubric (ครบ ถูกต้อง ไม่แต่งเพิ่ม) ให้คนตรวจกับชุดตัวอย่างที่เป็นตัวแทน และถ้าใช้ LLM เป็นผู้ตัดสิน ต้องวัดว่ามันสอดคล้องกับคนเพียงใดก่อน ตัวชี้วัดอัตโนมัติแบบนับคำเป็นเพียงสัญญาณเสริม"},{"id":"PS-S-E-017","level":"senior","pool":"exam","competency":"SQL Coding","descriptor":"SQLC-S3","concept":"missing-fk-index-plan","mobile":false,"type":"single","stem":"รายงานดึงออเดอร์ของลูกค้าในเชียงใหม่ ลูกค้ามี 5,000 ราย (ราว 2% อยู่เชียงใหม่) และ orders มี 50,000 แถว คำสั่งใช้เวลานานเมื่อข้อมูลโตขึ้น แผนคิวรี่ (ผลจาก EXPLAIN QUERY PLAN ของ SQLite) สแกนทั้งตาราง orders ควรสร้าง index ใดเพื่อให้คำสั่งนี้ไม่ต้องสแกน orders ทั้งตาราง","code":"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);\nCREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, total INTEGER, created_at TEXT);\nCREATE INDEX idx_customers_city ON customers (city);\n\nSELECT o.id, o.total\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nWHERE c.city = 'Chiang Mai';\n\n-- EXPLAIN QUERY PLAN\n-- |--SCAN o\n-- `--SEARCH c USING INTEGER PRIMARY KEY (rowid=?)","codeLang":"sql","options":[{"id":"A","text":"CREATE INDEX idx_o2 ON orders (total, customer_id);","correct":false,"why":"ผิด เพราะคอลัมน์แรกของ index คือ total ซึ่งไม่ได้อยู่ในเงื่อนไข join ค้นด้วย customer_id ตรง ๆ ไม่ได้ แผนคงสแกน (อาจเป็นการสแกน index แทนตาราง) เหมือนเดิม"},{"id":"B","text":"CREATE INDEX idx_o3 ON orders (created_at);","correct":false,"why":"ผิด เพราะ created_at ไม่ปรากฏในเงื่อนไขของคำสั่งนี้ ตัวปรับแผนไม่มีเหตุใช้ index นี้ และการสแกน orders ยังอยู่"},{"id":"C","text":"CREATE INDEX idx_c1 ON customers (city, id);","correct":false,"why":"ผิด เพราะฝั่ง customers ค้นด้วย city ได้เร็วอยู่แล้วจาก idx_customers_city และ id เป็น primary key ปัญหาอยู่ที่ฝั่ง orders ที่ต้องสแกน"},{"id":"D","text":"CREATE INDEX idx_o1 ON orders (customer_id);","correct":true,"why":"ถูก เพราะใช้ index ค้น orders ด้วย customer_id ได้โดยตรง แผนเปลี่ยนเป็นหา customers เชียงใหม่ด้วย index city แล้วค้น orders ของแต่ละราย แทนการสแกน orders ทั้งตาราง"}],"explanation":"เมื่ออ่านแผนคิวรี่ให้ดูว่าตารางใดถูกสแกนทั้งตาราง (SCAN) แล้วถามว่าคอลัมน์ที่ใช้เชื่อมหรือกรองของตารางนั้นมี index ที่คอลัมน์แรกตรงกันหรือยัง คอลัมน์ foreign key ของตารางลูกที่ใช้ join มักต้องมี index เอง เพราะฐานข้อมูลหลายตัวไม่สร้างให้อัตโนมัติ และ index ต้องขึ้นต้นด้วยคอลัมน์ที่ใช้ค้น"},{"id":"PS-S-E-018","level":"senior","pool":"exam","competency":"SQL Coding","descriptor":"SQLC-S3","concept":"non-sargable-function-predicate","mobile":false,"type":"single","stem":"ตาราง orders มี 200 ล้านแถว คอลัมน์ created_at เก็บเป็นข้อความรูปแบบ ISO เช่น 2026-03-01 23:59:59.500 (อาจมีเศษวินาที) และมี index บน created_at อยู่แล้ว คำสั่งดึงออเดอร์ของวันที่ 1 มีนาคมด้านล่างช้ามาก แผนคิวรี่แสดงว่าสแกนทั้งตาราง ข้อใดแก้ให้ใช้ index ที่มีอยู่และได้ผลถูกต้องครบทุกแถวของวันนั้น โดยไม่สร้าง index ใหม่","code":"CREATE TABLE orders (id INTEGER PRIMARY KEY, total INTEGER, created_at TEXT);\nCREATE INDEX idx_orders_created_at ON orders (created_at);\n\nSELECT id, total\nFROM orders\nWHERE SUBSTR(created_at, 1, 10) = '2026-03-01';","codeLang":"sql","options":[{"id":"A","text":"WHERE DATE(created_at) = '2026-03-01'","correct":false,"why":"ผิด เพราะเป็นการเรียกฟังก์ชันกับคอลัมน์ในเงื่อนไขอีกแบบหนึ่ง ฐานข้อมูลต้องคำนวณทีละแถวจึงใช้ index ของ created_at ค้นช่วงไม่ได้ ยังสแกนทั้งตาราง"},{"id":"B","text":"WHERE created_at BETWEEN '2026-03-01' AND '2026-03-01 23:59:59'","correct":false,"why":"ผิด เพราะใช้ index ได้ แต่ขอบบนตัดที่ 23:59:59 แถวที่เวลาเป็น 23:59:59.500 ถูกเรียงไว้หลังขอบนี้ จึงหลุดจากผลลัพธ์โดยไม่มี error"},{"id":"C","text":"WHERE created_at >= '2026-03-01' AND created_at \u003c '2026-03-02'","correct":true,"why":"ถูก เพราะเทียบคอลัมน์ตรง ๆ กับขอบเขตแบบปลายเปิด index ใช้ค้นช่วงได้ และครอบคลุมทุกเวลาของวัน รวมเศษวินาทีท้ายวัน"},{"id":"D","text":"คงเงื่อนไข SUBSTR เดิม แล้วใส่ index hint บังคับให้ใช้ index บน created_at","correct":false,"why":"ผิด เพราะ index เรียงตามค่าเต็มของ created_at ไม่ใช่ผลของ SUBSTR การบังคับใช้ index อย่างมากได้แค่อ่าน index ทั้งก้อนแล้วคำนวณฟังก์ชันทุกแถว ไม่ได้กระโดดไปยังช่วงของวันนั้น"}],"explanation":"เงื่อนไขที่ห่อคอลัมน์ไว้ในฟังก์ชันทำให้ฐานข้อมูลใช้ index ของคอลัมน์ค้นช่วงไม่ได้ (non-sargable) ให้ย้ายการคำนวณไปฝั่งค่าคงที่ ใช้ช่วงปิดต้นและเปิดปลาย (>= วันนี้ และ \u003c วันถัดไป) ซึ่งถูกต้องกับค่าที่มีเศษเวลาด้วย ส่วน BETWEEN ที่ปลายวัน 23:59:59 พลาดข้อมูลที่มีเศษวินาที"},{"id":"PS-S-E-019","level":"senior","pool":"exam","competency":"SQL Coding","descriptor":"SQLC-S2","concept":"relational-division","mobile":false,"type":"single","stem":"ต้องการรายชื่อลูกค้าที่เคยซื้อสินค้าหมวด gift ครบทุกชิ้นในหมวดนั้น (ในข้อมูลตัวอย่างหมวด gift มีสินค้า 3 ชิ้น) ลูกค้าหนึ่งรายอาจซื้อสินค้าชิ้นเดียวกันหลายครั้ง ข้อใดคืนลูกค้าที่ตรงเงื่อนไขอย่างถูกต้อง (ผลที่ถูกต้องคือลูกค้า 1 และ 3)","code":"CREATE TABLE products  (id INTEGER PRIMARY KEY, category TEXT);\nCREATE TABLE purchases (customer_id INTEGER, product_id INTEGER);\n\nINSERT INTO products VALUES (1, 'gift'), (2, 'gift'), (3, 'gift'), (4, 'food'), (5, 'food');\nINSERT INTO purchases VALUES\n  (1, 1), (1, 2), (1, 3),\n  (2, 1), (2, 1), (2, 2),\n  (3, 1), (3, 2), (3, 3), (3, 4),\n  (4, 4), (4, 5);","codeLang":"sql","options":[{"id":"A","text":"JOIN products แล้ว WHERE category = 'gift' GROUP BY customer_id HAVING COUNT(*) = (SELECT COUNT(*) FROM products WHERE category = 'gift') ORDER BY customer_id","correct":false,"why":"ผิด เพราะ COUNT(*) นับแถวการซื้อ ไม่ใช่ชิ้นสินค้า ลูกค้า 2 ซื้อชิ้น 1 สองครั้งกับชิ้น 2 หนึ่งครั้ง รวม 3 แถวเท่ากับจำนวนสินค้า gift จึงถูกคืนผิด"},{"id":"B","text":"SELECT DISTINCT customer_id FROM purchases WHERE product_id IN (SELECT id FROM products WHERE category = 'gift')","correct":false,"why":"ผิด เพราะคืนลูกค้าที่ซื้อ gift อย่างน้อยหนึ่งชิ้น ได้ลูกค้า 1, 2 และ 3 ไม่ได้ตรวจว่าครบทุกชิ้น"},{"id":"C","text":"JOIN products แล้ว GROUP BY customer_id HAVING COUNT(DISTINCT product_id) = (SELECT COUNT(*) FROM products)","correct":false,"why":"ผิด เพราะไม่ได้กรองหมวดและเทียบกับจำนวนสินค้าทุกหมวด (5) ไม่มีลูกค้าคนใดซื้อครบทุกหมวด ผลลัพธ์ว่างเปล่า"},{"id":"D","text":"JOIN products แล้ว WHERE category = 'gift' GROUP BY customer_id HAVING COUNT(DISTINCT product_id) = (SELECT COUNT(*) FROM products WHERE category = 'gift')","correct":true,"why":"ถูก เพราะกรองเหลือเฉพาะสินค้า gift แล้วนับจำนวนชิ้นที่ไม่ซ้ำต่อลูกค้า เทียบกับจำนวนสินค้า gift ทั้งหมด ได้ลูกค้า 1 และ 3 (ลูกค้า 3 ซื้อ food เพิ่มก็ไม่กระทบ)"}],"explanation":"โจทย์ \"ครบทุกรายการในเซต\" (relational division) ทำได้ด้วยการกรองให้เหลือเซตที่สนใจ แล้วนับจำนวนค่าที่ไม่ซ้ำเทียบกับขนาดของเซตนั้น จุดที่พลาดบ่อยมีสามข้อ คือใช้ COUNT(*) แทน COUNT(DISTINCT), เทียบกับขนาดของเซตผิด (ลืมกรองหมวด) และใช้ IN ซึ่งตอบแค่ว่า \"มีอย่างน้อยหนึ่ง\""},{"id":"PS-S-E-020","level":"senior","pool":"exam","competency":"Prompt & AI","descriptor":"AI-S3","concept":"few-shot-label-imbalance","mobile":false,"type":"single","stem":"ทีมเพิ่มตัวอย่าง few-shot หกตัวอย่างลงใน prompt จัดข้อความเป็น spam หรือ ok หลังเปลี่ยน พบว่าข้อความปกติถูกจัดเป็น spam ราว 70% ทั้งที่ก่อนเพิ่มตัวอย่างอัตรานี้ต่ำมาก ตัวอย่างที่เพิ่มแสดงอยู่ด้านล่าง ข้อใดคือการแก้ที่ตรงสาเหตุที่สุด","code":"จัดข้อความเป็น spam หรือ ok ตอบด้วยคำเดียว\n\nข้อความ: ชนะรางวัล 1 ล้านบาท กดลิงก์ด่วน -> spam\nข้อความ: สมัครวันนี้รับฟรี iPhone -> spam\nข้อความ: ลดราคา 90% วันนี้วันเดียว -> spam\nข้อความ: บัญชีของคุณถูกล็อก ยืนยันที่นี่ -> spam\nข้อความ: ประชุมพรุ่งนี้ 10 โมง ห้อง 3 -> ok\nข้อความ: รับเงินด่วน อนุมัติไว ไม่ต้องค้ำ -> spam\n\nข้อความ: {input} ->","codeLang":"text","options":[{"id":"A","text":"เปลี่ยนป้ายจากคำว่า spam และ ok เป็นตัวเลข 1 และ 0 ในทุกตัวอย่าง และคงจำนวนตัวอย่างทั้งหกตามเดิม","correct":false,"why":"ผิด เพราะการเปลี่ยนชื่อป้ายไม่ได้แก้การกระจายตัวอย่างที่เอนเอียง และตัวเลขสื่อความหมายน้อยกว่าคำ อาจทำให้ความเข้าใจงานลดลง"},{"id":"B","text":"เพิ่มตัวอย่าง spam ให้มากขึ้นเป็น 20 ตัวอย่าง ที่ครอบคลุมสำนวนหลอกลวงหลายแบบ","correct":false,"why":"ผิด เพราะยิ่งเพิ่มตัวอย่าง spam ความเอนเอียงไปทาง spam ยิ่งชัดขึ้น ข้อความปกติจะยิ่งถูกจัดเป็น spam มากกว่าเดิม"},{"id":"C","text":"ปรับตัวอย่างให้สัดส่วน spam กับ ok สมดุลกัน สลับลำดับ และเพิ่มตัวอย่าง ok ที่หน้าตาคล้าย spam","correct":true,"why":"ถูก เพราะตัวอย่างที่เอนไปทางป้ายเดียวและป้ายท้ายสุดเป็น spam ผลักให้โมเดลเอนเอียงไปทางนั้น การทำให้สมดุลและมีกรณีก้ำกึ่งของ ok แก้ที่ต้นเหตุ"},{"id":"D","text":"ตั้ง temperature เป็น 0 และคงตัวอย่างทั้งหกตามเดิมทุกตัว พร้อมคำสั่งเดิมของ prompt","correct":false,"why":"ผิด เพราะ temperature ต่ำทำให้ผลนิ่งขึ้น แต่ความเอนเอียงจากตัวอย่างยังอยู่และอาจถูกเลือกซ้ำอย่างสม่ำเสมอแทน"}],"explanation":"ในการทำ few-shot ตัวอย่างทำหน้าที่สอนทั้งงานและการกระจายของป้าย ถ้าตัวอย่างเอนไปทางป้ายใดป้ายหนึ่ง หรือป้ายสุดท้ายก่อนคำถามซ้ำกัน โมเดลมักเอนตาม ควรสุ่มลำดับ ทำให้สัดส่วนป้ายใกล้เคียงกันหรือสะท้อนความจริง และใส่ตัวอย่างกรณีก้ำกึ่ง จากนั้นวัดผลกับชุดทดสอบที่มีเฉลย"}]}},"competencies":["Program Coding","SQL Coding","Prompt & AI"],"descriptorCompetency":{"PRG-J1":"Program Coding","PRG-J2":"Program Coding","SQLC-J1":"SQL Coding","AI-J1":"Prompt & AI","AI-J2":"Prompt & AI","PRG-S1":"Program Coding","PRG-S2":"Program Coding","PRG-S3":"Program Coding","SQLC-S1":"SQL Coding","SQLC-S2":"SQL Coding","SQLC-S3":"SQL Coding","SQLC-S4":"SQL Coding","AI-S1":"Prompt & AI","AI-S2":"Prompt & AI","AI-S3":"Prompt & AI"}}</script>
<script type="application/json" id="review-data">{"version":1,"levels":{"junior":[{"descriptor":"PRG-J2","competency":"Program Coding","title":"Debug โค้ดเบื้องต้นและ algorithm พื้นฐาน","summary":"การหา bug ในลูป เงื่อนไข และ sort ขนาดเล็กด้วยการ trace ค่าทีละรอบ ทักษะนี้สำคัญเพราะ bug ส่วนใหญ่มาจากจุดพื้นฐานอย่างขอบเขตของลูป ค่าเริ่มต้น และลำดับการประเมินเงื่อนไข","keyPoints":["Array ที่มี n ตัวมี index 0 ถึง n - 1 ลูปที่ใช้ `i <= arr.length` จะวนเกินหนึ่งรอบ (off-by-one) ให้ลองแทนค่ารอบแรกและรอบสุดท้ายเสมอ","ลำดับความสำคัญของตัวดำเนินการ: `&&` มาก่อน `||` ดังนั้น `a || b && c` คือ `a || (b && c)` ถ้าต้องการอีกความหมายให้ใส่วงเล็บ","ค่าเริ่มต้นของตัวแปรสะสมต้องไม่บิดเบือนผล เช่น หาค่ามากสุดห้ามเริ่มที่ 0 ถ้าข้อมูลอาจติดลบ ให้เริ่มจากสมาชิกตัวแรกหรือ -Infinity และกำหนดว่ารายการว่างจะคืนอะไร และตัวนับด้วย object/map ที่ไม่ได้กำหนดค่าเริ่มต้นจะได้ `undefined + 1 = NaN` ให้ใช้ `counts[k] = (counts[k] || 0) + 1`","การลบสมาชิกของ array ระหว่างที่วนลูปบน array เดียวกันทำให้ index เลื่อนและข้ามสมาชิก ให้สร้าง array ใหม่ด้วย filter หรือวนจากท้ายมาหน้า","Floating point เก็บค่าทศนิยมแบบประมาณ ทำให้ `0.1 + 0.2 === 0.3` เป็น false ให้เทียบด้วยช่วงความคลาดเคลื่อน (epsilon) หรือคำนวณเป็นจำนวนเต็ม","กฎปีอธิกสุรทิน: หารด้วย 4 ลงตัว และไม่ใช่ปีที่หารด้วย 100 ลงตัว ยกเว้นถ้าหารด้วย 400 ลงตัวก็ถือเป็นปีอธิกสุรทิน","Sort ใน JavaScript ถ้าไม่ใส่ comparator จะเรียงแบบ string (10 มาก่อน 9) ต้องใช้ `(a, b) => a - b` สำหรับตัวเลข และถ้าต้องเรียงหลาย key ให้ตัดสินด้วย key ถัดไปเมื่อ key แรกเท่ากัน","Bubble sort หนึ่งรอบ (pass) จะดันค่ามากสุดไปอยู่ท้ายสุดเท่านั้น ไม่ได้ทำให้ทั้ง array เรียงเสร็จ; selection sort ต้องสลับค่าโดยเก็บค่าชั่วคราวก่อนเขียนทับ","Nested loop ที่ด้านนอกวน n รอบและด้านในวน m รอบ จะทำงานตัวในรวม n x m ครั้ง ถ้าขอบเขตด้านในขึ้นกับตัวนอก (เช่น เริ่มที่ i + 1) ต้องนับเป็นผลรวมของลำดับ","การเทียบ string แบบ case-sensitive ทำให้ค้นหาไม่เจอเมื่อพิมพ์เล็กใหญ่ต่างกัน ให้ normalize ด้วย `toLowerCase()` ทั้งสองฝั่งก่อนเทียบ และ `length` ของข้อความภาษาไทยนับ code unit ซึ่งรวมสระบนและวรรณยุกต์ด้วย"],"examFocus":["ถ้าเจอโค้ดที่ผลลัพธ์ผิดแค่ตัวสุดท้ายหรือเกิด undefined ให้สงสัยเงื่อนไขหยุดของลูป (`<` กับ `<=`) ก่อน","ถ้าเจอโจทย์ให้ trace ลูป ให้เขียนตารางค่าตัวแปรทีละรอบ และดูว่า push, break, return อยู่ก่อนหรือหลังคำสั่งอัปเดต","ถ้าเจอเงื่อนไขที่ผสม `&&` กับ `||` แล้วผลไม่ตรงกฎธุรกิจ ให้ใส่วงเล็บให้ตรงกับกฎ","ถ้าเจอการเทียบเงินหรือทศนิยมแล้วไม่เท่ากัน ให้คิดถึง floating point และเลือกเทียบแบบมี epsilon หรือใช้จำนวนเต็ม","ถ้าเจอเงื่อนไขขอบ เช่น ส่วนลดเมื่อยอดตั้งแต่ 1,000 ให้ตรวจว่าใช้ `>=` หรือ `>` ตรงกับคำว่า ตั้งแต่ หรือ เกิน"],"pitfalls":["คิดว่า return ในลูปจะทำงานครบทุกรอบ แต่จริงๆ return ภายในลูปจะออกจากฟังก์ชันทันทีตั้งแต่รอบแรกที่ถึงบรรทัดนั้น","คิดว่า sort ตัวเลขใน JavaScript จะเรียงตามค่าโดยอัตโนมัติ ความจริงคือเรียงตามลำดับตัวอักษรถ้าไม่ใส่ comparator","แก้ bug โดยเดาแล้วลองแก้หลายจุดพร้อมกัน ควรทำซ้ำ bug ให้ได้ก่อน แล้วแก้ทีละจุดพร้อมตรวจผล"],"example":{"lang":"javascript","code":"function highestScore(scores) {\n  if (scores.length === 0) return null;\n  let max = scores[0];\n  for (let i = 1; i < scores.length; i++) {\n    if (scores[i] > max) max = scores[i];\n  }\n  return max;\n}\n\nconst counts = {};\nfor (const w of ['a', 'b', 'a']) {\n  counts[w] = (counts[w] || 0) + 1;\n}\n\n[10, 9, 1].sort((a, b) => a - b); // [1, 9, 10]"}},{"descriptor":"PRG-J1","competency":"Program Coding","title":"เขียนโค้ดสะอาด อ่านง่าย ตามมาตรฐาน","summary":"การเขียนโค้ดด้วยชื่อที่สื่อความหมาย การจัดรูปแบบที่สม่ำเสมอ และหน้าที่ของฟังก์ชันที่ชัดเจน เพื่อให้คนอื่นอ่านและแก้ไขต่อได้ง่าย","keyPoints":["ชื่อตัวแปรและฟังก์ชันต้องบอกเจตนา เช่น `totalPrice` ดีกว่า `tp` หรือ `data1` และไม่ควรใช้ชื่อที่ทำให้เข้าใจผิด","รูปแบบการตั้งชื่อทั่วไป: camelCase สำหรับตัวแปรและฟังก์ชันใน JavaScript/Java, PascalCase สำหรับ class, snake_case ใน Python, UPPER_SNAKE_CASE สำหรับค่าคงที่","Magic number คือตัวเลขหรือสตริงลอยๆ ในโค้ดที่ไม่บอกความหมาย ควรแยกเป็นค่าคงที่ที่มีชื่อ เช่น `VAT_RATE = 0.07` เพื่อแก้ที่เดียวและอ่านเข้าใจ","หนึ่งฟังก์ชันควรทำหน้าที่เดียว ถ้าฟังก์ชันทั้งคำนวณ ตรวจสอบ และบันทึกข้อมูลปนกัน ให้แยกเป็นฟังก์ชันย่อย","ชื่อฟังก์ชันแบบ `getX` หรือ `isX` ควรไม่มี side effect ซ่อนอยู่ (เช่น ลบข้อมูลหรือเขียนไฟล์) เพราะผู้อ่านคาดว่าเป็นการอ่านค่าอย่างเดียว","Boolean flag parameter เช่น `save(user, true)` อ่านไม่รู้ความหมายตรงจุดเรียก ให้แยกเป็นสองฟังก์ชันหรือส่ง options object ที่มีชื่อ","Comment ควรอธิบาย ทำไม ไม่ใช่ ทำอะไร ถ้าโค้ดอ่านเข้าใจได้เอง comment ซ้ำซ้อนเป็นสัญญาณรบกวน และไม่ควรเก็บโค้ดที่ถูกคอมเมนต์ทิ้ง (dead code) ไว้ เพราะมี version control เก็บประวัติอยู่แล้ว","การย่อหน้า (indentation) ต้องสม่ำเสมอทั้งโปรเจกต์ เลือกใช้ space หรือ tab อย่างใดอย่างหนึ่งและจำนวนเท่ากัน ควรใช้ formatter เช่น Prettier และ linter เช่น ESLint ให้บังคับอัตโนมัติ","ใช้ early return หรือ guard clause เพื่อลดการซ้อน if หลายชั้น ทำให้โค้ดแบนและอ่านง่ายขึ้น","ปฏิบัติตาม style guide ของภาษาหรือทีม เช่น PEP 8 สำหรับ Python เพื่อให้ทั้งทีมเขียนโค้ดหน้าตาเหมือนกัน"],"examFocus":["ถ้าเจอโค้ดที่มีตัวเลขลอยๆ หลายจุด ให้เลือกคำตอบที่แยกเป็นค่าคงที่ตั้งชื่อ","ถ้าเจอฟังก์ชันที่ชื่อสื่อว่าอ่านค่าแต่ไปแก้ข้อมูล ให้เลือกการเปลี่ยนชื่อให้ตรงพฤติกรรมหรือแยกฟังก์ชัน","ถ้าเจอชื่อตัวแปรย่อสั้นๆ และฟังก์ชันที่ทำหลายอย่าง ให้เลือกทั้งการตั้งชื่อใหม่และการแยกหน้าที่","ถ้าเจอคำถามเรื่อง comment ให้เลือก comment ที่อธิบายเหตุผล และลบโค้ดที่ถูกปิดไว้","ถ้าเจอโจทย์ชื่อที่ผิดข้อตกลงของภาษา ให้ระบุรูปแบบที่ถูกตาม convention ของภาษานั้น"],"pitfalls":["คิดว่าโค้ดที่สั้นที่สุดคือโค้ดสะอาดที่สุด ความจริงคือความอ่านง่ายสำคัญกว่าจำนวนบรรทัด","คิดว่าต้องใส่ comment ทุกบรรทัด ซึ่งทำให้เกิดสัญญาณรบกวน และ comment ที่ล้าสมัยยังทำให้เข้าใจผิดได้","ตั้งชื่อยาวและคลุมเครือหรือย่อจนอ่านไม่ออก ชื่อที่ดีต้องกระชับและบอกความหมายได้ในตัว"],"example":{"lang":"javascript","code":"const VAT_RATE = 0.07;\n\nfunction calculateTotalWithVat(subtotal) {\n  return subtotal * (1 + VAT_RATE);\n}\n\n// แทนที่ saveUser(user, true)\nfunction saveAndNotifyUser(user) { /* ... */ }\nfunction saveUser(user) { /* ... */ }"}},{"descriptor":"SQLC-J1","competency":"SQL Coding","title":"SQL พื้นฐาน, primary key และ normalization","summary":"การเขียน SELECT, JOIN, aggregate และเข้าใจแนวคิดเชิงสัมพันธ์ เช่น primary key กับ normalization ซึ่งเป็นรากฐานของการดึงข้อมูลให้ถูกต้อง โดยเฉพาะพฤติกรรมของ NULL ที่มักทำให้ผลลัพธ์ผิดโดยไม่รู้ตัว","keyPoints":["Primary key ต้อง unique และห้าม NULL มีได้หนึ่งตารางต่อหนึ่ง PK แต่ PK อาจประกอบจากหลายคอลัมน์ (composite key) ซึ่งค่าชุดรวมกันต้องไม่ซ้ำ ส่วนแต่ละคอลัมน์ซ้ำได้ Foreign key ชี้ไปยัง key ของอีกตารางเพื่อรักษาความสัมพันธ์ ถ้าคอลัมน์ FK เป็น NULL แถวนั้นจะไม่มีคู่ใน INNER JOIN","INNER JOIN คืนเฉพาะแถวที่จับคู่ได้ ส่วน LEFT JOIN คืนทุกแถวฝั่งซ้ายและเติม NULL ให้ฝั่งขวาที่ไม่มีคู่ ถ้าฝั่งขวามีหลายแถวต่อหนึ่งฝั่งซ้าย แถวฝั่งซ้ายจะซ้ำ","ใส่เงื่อนไขของตารางฝั่งขวาใน WHERE หลัง LEFT JOIN จะกรองแถว NULL ทิ้ง ทำให้ผลเหมือน INNER JOIN ถ้าต้องการคง LEFT JOIN ให้ย้ายเงื่อนไขไปไว้ใน ON","`WHERE` กรองแถวก่อนการจัดกลุ่ม ส่วน `HAVING` กรองกลุ่มหลัง aggregate ดังนั้นเงื่อนไขอย่าง `COUNT(*) > 5` ต้องอยู่ใน HAVING","`COUNT(*)` นับทุกแถว ส่วน `COUNT(col)` นับเฉพาะแถวที่ col ไม่เป็น NULL และ `COUNT(DISTINCT col)` นับค่าไม่ซ้ำ หลัง LEFT JOIN ให้นับคอลัมน์ของตารางฝั่งขวา มิฉะนั้นแถวที่ไม่มีคู่จะถูกนับเป็น 1","`x NOT IN (subquery)` จะไม่คืนแถวใดเลยถ้า subquery มีค่า NULL แม้แต่ตัวเดียว (เพราะผลเป็น UNKNOWN) ให้ใช้ `NOT EXISTS` หรือกรอง NULL ออกจาก subquery","เทียบ NULL ต้องใช้ `IS NULL` / `IS NOT NULL` เพราะ `= NULL` ไม่เคยเป็นจริง ตัวอย่างการลบแบบ soft delete มักกรองด้วย `deleted_at IS NULL`","`BETWEEN a AND b` รวมทั้งสองปลาย ถ้าคอลัมน์เป็น datetime การใช้ BETWEEN กับวันที่สิ้นสุดจะตัดเวลาหลังเที่ยงคืนของวันนั้นออก ควรใช้ `>= start AND < วันถัดไป`","GROUP BY ต้องใส่ทุกคอลัมน์ที่ไม่ได้อยู่ใน aggregate และควรจัดกลุ่มด้วย key ที่ unique (เช่น id) ถ้าจัดกลุ่มด้วยชื่อที่ซ้ำกัน คนละคนจะถูกรวมเป็นกลุ่มเดียว","Normalization: 1NF ค่าในแต่ละเซลล์ต้องเป็นค่าเดียว (ห้ามเก็บรายการคั่นด้วยจุลภาค), 2NF คอลัมน์ที่ไม่ใช่ key ต้องไม่ขึ้นกับบางส่วนของ composite key, 3NF คอลัมน์ที่ไม่ใช่ key ต้องไม่ขึ้นต่อกันเอง (transitive dependency)"],"examFocus":["ถ้าเจอ LEFT JOIN แล้วมีเงื่อนไขตารางขวาใน WHERE ผลลัพธ์แถวหาย ให้ย้ายเงื่อนไขไปที่ ON","ถ้าเจอ NOT IN แล้วผลเป็นว่างทั้งที่ควรมีแถว ให้สงสัยค่า NULL ใน subquery และเปลี่ยนเป็น NOT EXISTS","ถ้าเจอจำนวนนับสูงเกินจริงหลัง JOIN ให้ตรวจว่าตารางลูกทำให้แถวซ้ำหรือนับด้วย COUNT(*) ผิดที่","ถ้าเจอคอลัมน์ที่เก็บหลายค่าคั่นด้วยจุลภาค ให้เลือกแยกตารางความสัมพันธ์ตาม 1NF","ถ้าเจอคำถามกรองด้วยช่วงวันที่ของข้อมูลที่มีเวลา ให้ใช้ขอบเขตแบบ `>=` กับ `<`"],"pitfalls":["คิดว่า `COUNT(col)` กับ `COUNT(*)` ให้ผลเหมือนกัน แต่ต่างกันเมื่อมี NULL","ใช้ WHERE กับผล aggregate (เช่น `WHERE COUNT(*) > 1`) ซึ่งเป็นข้อผิดพลาด ต้องใช้ HAVING","คิดว่า PK ที่เป็น composite ทำให้แต่ละคอลัมน์ต้อง unique ซึ่งผิด ต้อง unique เฉพาะค่าที่รวมกัน"],"example":{"lang":"sql","code":"-- ลูกค้าทุกคนพร้อมจำนวนออเดอร์ (รวมคนที่ไม่มีออเดอร์ = 0)\nSELECT c.id, c.name, COUNT(o.id) AS order_count\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.id\n AND o.status = 'PAID'   -- เงื่อนไขตารางขวาอยู่ใน ON\nGROUP BY c.id, c.name;\n\n-- ลูกค้าที่ยังไม่เคยสั่งซื้อ\nSELECT c.id FROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);"}},{"descriptor":"AI-J1","competency":"Prompt & AI","title":"ใช้ AI coding assistant สร้างและ refactor โค้ด","summary":"การใช้ AI ช่วยเขียนและปรับโครงสร้างโค้ดอย่างมีวิจารณญาณ โดยถือว่าผลลัพธ์เป็นร่างที่ต้องตรวจสอบเสมอ เพราะ AI อาจสร้างโค้ดที่ดูถูกแต่ผิดจริงได้","keyPoints":["AI อาจ hallucinate คือสร้าง function, library หรือ package ที่ไม่มีอยู่จริง ต้องตรวจจากเอกสารทางการและลองรันหรือ compile ก่อนนำไปใช้ และระวังชื่อ package ที่ไม่คุ้นเคยก่อนติดตั้ง","ผลลัพธ์จาก AI ต้องถูกรีวิวเหมือนโค้ดที่เพื่อนร่วมทีมเขียน ผู้ใช้ยังรับผิดชอบโค้ดที่ commit เสมอ","ตรวจสอบด้วยการเขียนและรัน test ไม่ใช่เชื่อเพียงคำอธิบายของ AI ที่ฟังดูมั่นใจ คำอธิบายของ AI ก็ผิดได้ ให้เทียบกับเอกสารหรือผลการรันจริง","การ refactor ด้วย AI ควรทำทีละขั้นเล็กๆ โดยมี test ครอบคลุมพฤติกรรมเดิมก่อน แล้วรัน test หลังแต่ละขั้น เพื่อจับการเปลี่ยนพฤติกรรมโดยไม่ตั้งใจ","จุดที่ AI มักพลาดคือ boundary condition เช่น ค่าว่าง ค่า null ค่าติดลบ และการเปรียบเทียบ `<` กับ `<=` ตรวจกรณีขอบเหล่านี้เป็นพิเศษ","ให้บริบทกับ AI เช่น ภาษา เวอร์ชัน framework, coding convention ของโปรเจกต์ และโครงสร้างที่มีอยู่ เพื่อให้โค้ดเข้ากับระบบ","Regex ที่ AI สร้างต้องทดสอบด้วยทั้งตัวอย่างที่ควรตรงและไม่ควรตรง (negative cases) เพราะ pattern ที่กว้างเกินไปมักผ่านแค่กรณีบวก","โค้ดเฉพาะแพลตฟอร์ม เช่น มือถือ ให้ตรวจ permission ที่ขอเกินความจำเป็นและการจัดการข้อมูลผู้ใช้ตามหลัก least privilege","ห้ามวางความลับ เช่น API key, password หรือข้อมูลลูกค้าลงใน prompt ของเครื่องมือภายนอก และควรตรวจเรื่อง license ของโค้ดที่ได้มา"],"examFocus":["ถ้า AI แนะนำ import หรือ method ที่ไม่คุ้นเคย ให้ตรวจกับเอกสารทางการหรือรันก่อนใช้","ถ้าต้อง refactor โค้ดจำนวนมากด้วย AI ให้เลือกแนวทางแบ่งเป็นขั้นเล็กและมี test กำกับ","ถ้า AI อธิบายโค้ดได้ฟังดูน่าเชื่อ ให้ยืนยันด้วยการรันหรืออ่านเอกสาร","ถ้าโค้ดที่ AI สร้างผ่านตัวอย่างหลัก ให้ทดสอบกรณีขอบและกรณีที่ไม่ควรผ่านเพิ่ม","ถ้าต้องการให้ AI เขียนโค้ดตามมาตรฐานทีม ให้แนบ convention และตัวอย่างโค้ดที่มีอยู่เข้าไปใน prompt"],"pitfalls":["คิดว่าโค้ดที่ AI ให้มาแล้ว compile ผ่านหมายความว่าถูกต้อง ซึ่งยังอาจผิด logic หรือพฤติกรรมขอบ","ให้ AI refactor ทั้งไฟล์ในครั้งเดียวโดยไม่มี test ทำให้หาจุดที่พฤติกรรมเปลี่ยนไม่เจอ","คิดว่าถ้า AI เป็นคนเขียน ความรับผิดชอบเป็นของ AI ในความจริงผู้ที่นำโค้ดไปใช้เป็นผู้รับผิดชอบ"]},{"descriptor":"AI-J2","competency":"Prompt & AI","title":"Prompt engineering เบื้องต้นและการใช้ AI อย่างมีจริยธรรม","summary":"การเขียน prompt ที่ชัดเจนเพื่อให้ได้ผลลัพธ์ที่ใช้งานได้ พร้อมตระหนักถึงข้อมูลส่วนบุคคล นโยบายองค์กร และความรับผิดชอบเมื่อใช้ AI ช่วยงาน","keyPoints":["Prompt ที่ดีประกอบด้วย บทบาท/เป้าหมาย (task), บริบท (context), ข้อจำกัด (constraints), รูปแบบผลลัพธ์ (format) และตัวอย่างถ้าจำเป็น ยิ่งเจาะจงยิ่งได้ผลตรงความต้องการ","ระบุผู้อ่านและรูปแบบที่ต้องการ เช่น release note สำหรับผู้ใช้ทั่วไปแบบหัวข้อสั้นๆ จะได้ผลต่างจากสำหรับทีมพัฒนา","ขอ unit test ควรให้ signature ของฟังก์ชัน พฤติกรรมที่คาดหวัง framework ที่ใช้ และกรณีขอบที่ต้องครอบคลุม","ให้ AI ระบุสมมติฐานและ edge case ที่มันนึกถึงเอง เพื่อให้เรามองเห็นช่องว่างของความต้องการ","การถามต่อ (follow-up) เมื่อผลไม่ถูก ควรแนบ input ที่ล้มเหลว ผลที่ได้จริง ผลที่คาดหวัง และข้อความ error แทนการพูดว่า ใช้ไม่ได้","การพัฒนา prompt เป็นการวนปรับ (iterate) ไม่ใช่จบในครั้งเดียว ควรเก็บ prompt ที่ใช้ได้ผลไว้ใช้ซ้ำ","ห้ามส่งข้อมูลส่วนบุคคล (PII), ความลับทางธุรกิจ, credential หรือ token ไปยังเครื่องมือ AI ภายนอก ให้ลบหรือปิดบัง (mask) ก่อนส่ง เช่น log ที่มีอีเมลและเบอร์โทรของลูกค้า","ปฏิบัติตามนโยบายการใช้ AI ขององค์กรและกฎหมายคุ้มครองข้อมูลส่วนบุคคล เช่น PDPA ของไทย และเลือกใช้เครื่องมือที่องค์กรอนุมัติ","ผู้ใช้เป็นผู้รับผิดชอบผลงานที่ใช้ AI ช่วย ต้องตรวจสอบความถูกต้อง อคติ และลิขสิทธิ์/license ก่อนนำไปใช้ และควรเปิดเผยการใช้ AI เมื่อนโยบายกำหนด"],"examFocus":["ถ้าต้องส่งข้อมูลจริงให้ AI วิเคราะห์ ให้เลือกการ mask ข้อมูลอ่อนไหวก่อน หรือใช้เครื่องมือที่องค์กรอนุมัติ","ถ้า prompt ได้ผลไม่ตรง ให้เลือกเติมบริบท ตัวอย่าง และรูปแบบผลลัพธ์ แทนการเขียนสั้นลง","ถ้าต้องการให้ AI ช่วยเขียนเอกสารสำหรับกลุ่มผู้อ่านเฉพาะ ให้ระบุผู้อ่านและน้ำเสียง","ถ้ามีคำถามว่าใครรับผิดชอบเมื่อโค้ดจาก AI ผิด ให้ตอบว่าผู้นำไปใช้/ผู้ส่งงาน","ถ้าต้องการให้ AI ครอบคลุมกรณีขอบ ให้ขอให้ระบุสมมติฐานและ edge case ไว้ใน prompt"],"pitfalls":["คิดว่า prompt สั้นๆ กว้างๆ จะให้ผลดีกว่า ความจริงคือความคลุมเครือทำให้ AI เดาเอง","คิดว่าวางข้อมูลลูกค้าในเครื่องมือ AI ได้ถ้าเป็นแค่ข้อมูลเพื่อ debug ซึ่งยังเป็นความเสี่ยงต่อข้อมูลส่วนบุคคล","เชื่อคำตอบของ AI โดยไม่ตรวจเพราะฟังดูมั่นใจ AI ตอบผิดได้โดยใช้น้ำเสียงมั่นใจ"]}],"senior":[{"descriptor":"AI-S1","competency":"Prompt & AI","title":"สร้างแอปที่เชื่อมต่อบริการ AI (vision / NLP / LLM)","summary":"การออกแบบฟีเจอร์ที่เรียกใช้ AI service อย่างเชื่อถือได้ ปลอดภัย และคุ้มค่า ทั้งการเลือก on-device หรือ cloud, การรับมือความล้มเหลวของการเรียก LLM, การป้องกัน prompt injection และการปกป้องข้อมูลส่วนบุคคล","keyPoints":["On-device inference ให้ latency ต่ำ ทำงาน offline ได้ และข้อมูลไม่ออกจากเครื่อง (เหมาะกับรูปบัตรประชาชน) แต่ต้องใช้โมเดลขนาดเล็ก/ quantized และความแม่นยำอาจต่ำกว่า; cloud ได้โมเดลใหญ่แม่นยำกว่า แต่มี network latency ค่าใช้จ่ายต่อการเรียก และต้องส่งข้อมูลออก","งานด้านภาพ: object detection คืน bounding box, class และ confidence score; ใช้ confidence threshold กรองผล และ NMS (non-maximum suppression) ตัดกล่องซ้อนกัน; ปรับขนาดและบีบอัดภาพก่อนอัปโหลดเพื่อลดแบนด์วิดท์ และรันในงานเบื้องหลังเพื่อไม่ให้ UI ค้าง","งาน NLP ทั่วไป ได้แก่ classification, sentiment, NER (การดึงชื่อเฉพาะ), summarization และ embeddings เลือกบริการให้ตรงกับงาน ไม่จำเป็นต้องใช้ LLM กับทุกกรณี","การเรียก LLM ผ่านเครือข่ายต้องมี timeout, retry เฉพาะข้อผิดพลาดชั่วคราว (เช่น 429 และ 5xx) ด้วย exponential backoff ผสม jitter, เคารพ rate limit และไม่ retry ข้อผิดพลาด 4xx ที่เกิดจากคำขอผิด","ใส่ fallback เมื่อ AI ล้มเหลว (ข้อความเริ่มต้น, โหมดไม่มี AI หรือคิวทำภายหลัง) และอาจใช้ circuit breaker หยุดเรียกชั่วคราวเมื่อบริการล่ม; ถ้า retry การเขียนที่มีผลข้างเคียงต้องออกแบบให้ idempotent","ตรวจสอบผลลัพธ์ของ LLM ด้วย schema validation ก่อนใช้งาน เพราะผลอาจไม่ตรงรูปแบบ และควร cache ผลของ prompt ที่ซ้ำเพื่อลดต้นทุนและ latency","Prompt injection: ข้อความจากผู้ใช้หรือเอกสารภายนอกอาจมีคำสั่งแทรกเพื่อเปลี่ยนพฤติกรรมของโมเดล (รวมถึง indirect injection จากเว็บ/อีเมลที่โมเดลอ่าน) ป้องกันโดยแยกคำสั่งออกจากข้อมูล, ถือข้อมูลภายนอกเป็น untrusted, จำกัดสิทธิ์ของ tool/การกระทำที่โมเดลเรียกได้ (least privilege), ตรวจผลลัพธ์ และขอการยืนยันจากคนก่อนการกระทำที่เสี่ยง ไม่มีวิธีเดียวที่กันได้ 100%","อย่าใส่ความลับหรือ API key ไว้ในแอปฝั่ง client หรือใน prompt ให้เรียกผ่าน backend ที่ถือ key และควบคุมสิทธิ์/โควตา","ปกปิด PII ก่อนส่งให้ LLM ภายนอก เช่น แทนที่ชื่อ เลขบัตร เบอร์โทรด้วย placeholder (regex หรือ NER) แล้วค่อยแทนกลับหลังได้ผล และบันทึก log โดยไม่เก็บข้อมูลดิบ"],"examFocus":["ถ้าโจทย์เป็นภาพเอกสารที่มีข้อมูลส่วนบุคคลบนมือถือ ให้พิจารณา on-device processing หรือการเข้ารหัส/ลดข้อมูลก่อนส่งขึ้น cloud","ถ้าการเรียก LLM ล้มเหลวเป็นครั้งคราว ให้เลือก timeout + retry แบบ backoff กับ jitter + fallback ไม่ใช่ retry ทันทีไม่จำกัด","ถ้าข้อความผู้ใช้หรือเอกสารมีคำสั่งแปลกปลอม ให้เลือกแยกคำสั่งกับข้อมูล จำกัดสิทธิ์ tool และตรวจผลลัพธ์","ถ้าต้องส่งข้อความที่มี PII ไปให้โมเดลภายนอก ให้เลือก mask ก่อนส่ง","ถ้าต้องออกแบบ pipeline ภาพบนมือถือ ให้คิดเรื่องการย่อภาพ confidence threshold และไม่บล็อก UI thread"],"pitfalls":["ใส่กฎ ห้ามทำตามคำสั่งในข้อมูล ไว้ใน system prompt เพียงอย่างเดียวแล้วถือว่าปลอดภัย การป้องกันต้องมีหลายชั้น","retry ทุกข้อผิดพลาดแบบถี่ๆ ซึ่งทำให้ภาระเพิ่มและชน rate limit หนักขึ้น","เก็บ API key ไว้ในโค้ดแอปมือถือ ซึ่งถูกดึงออกมาได้"],"example":{"lang":"typescript","code":"async function callWithRetry<T>(fn: () => Promise<T>, max = 3): Promise<T> {\n  for (let attempt = 0; ; attempt++) {\n    try {\n      return await fn();\n    } catch (e: any) {\n      const retryable = e.status === 429 || e.status >= 500;\n      if (!retryable || attempt >= max) throw e;\n      const base = 500 * 2 ** attempt;\n      const jitter = Math.random() * base;\n      await new Promise(r => setTimeout(r, base + jitter));\n    }\n  }\n}"}},{"descriptor":"SQLC-S3","competency":"SQL Coding","title":"ปรับแต่ง query ด้วย index, การกรอง และ query plan","summary":"การทำให้ query เร็วขึ้นโดยเลือกและออกแบบ index ให้ตรงกับรูปแบบการกรอง/เรียงลำดับ อ่าน query plan และหลีกเลี่ยงรูปแบบที่ทำให้ index ใช้ไม่ได้","keyPoints":["Composite index ใช้ได้ตามหลัก leftmost prefix: index (a, b, c) ช่วย query ที่กรองด้วย a, หรือ a กับ b แต่ไม่ช่วยการกรองด้วย b อย่างเดียว","ลำดับคอลัมน์ใน composite index: วางคอลัมน์ที่กรองด้วยเท่ากับ (equality) ก่อน ตามด้วยคอลัมน์ที่เป็นช่วง (range) และคอลัมน์ที่ใช้ ORDER BY เพื่อให้เรียงได้โดยไม่ต้อง sort เพิ่ม","Sargable predicate: การครอบคอลัมน์ด้วย function เช่น `WHERE DATE(created_at) = '2025-01-01'` หรือ `LOWER(email) = ...` มักทำให้ใช้ index ปกติไม่ได้ ให้เขียนใหม่เป็นช่วง `created_at >= ... AND created_at < ...` หรือสร้าง functional/expression index","`LIKE 'abc%'` ใช้ index ได้ แต่ `LIKE '%abc'` โดยทั่วไปใช้ไม่ได้; การเทียบข้ามชนิดข้อมูลที่ทำให้เกิด implicit cast บนคอลัมน์ก็อาจทำให้ index ไม่ถูกใช้","Pagination แบบ OFFSET ต้องอ่านและทิ้งแถวที่ข้ามไป ยิ่งหน้าลึกยิ่งช้า ส่วน keyset pagination ใช้ `WHERE (sort_col, id) < (:last_sort, :last_id) ORDER BY sort_col DESC, id DESC LIMIT n` ซึ่งอาศัย index เร็วคงที่","Keyset ต้องเรียงด้วย key ที่ deterministic: เพิ่มคอลัมน์ unique (เช่น id) เป็น tie-breaker มิฉะนั้นแถวที่ค่าเท่ากันอาจหายหรือซ้ำข้ามหน้า","คอลัมน์ foreign key ฝั่งลูกควรมี index เพราะ JOIN และการลบ/อัปเดตแถวแม่ต้องค้นหาแถวลูก PostgreSQL ไม่สร้าง index ให้คอลัมน์ FK อัตโนมัติ (ต่างจาก InnoDB ของ MySQL ที่สร้างให้)","อ่าน plan ด้วย `EXPLAIN` (และ `EXPLAIN ANALYZE` ใน PostgreSQL ที่รัน query จริงและแสดงเวลาจริง) สังเกต Seq Scan/Index Scan, ประมาณการ vs จำนวนแถวจริง และขั้นตอน sort/hash join ที่มีต้นทุนสูง","Covering index (มีคอลัมน์ที่ query ต้องการครบ) ทำให้ไม่ต้องกลับไปอ่านตาราง; แต่ทุก index เพิ่มต้นทุนการเขียนและพื้นที่ จึงควรสร้างเฉพาะที่จำเป็น และ index บนคอลัมน์ selectivity ต่ำมักไม่ช่วย","หลีกเลี่ยง `SELECT *` ในเส้นทางที่ถี่ ดึงเฉพาะคอลัมน์ที่ใช้ และกรองให้เร็วที่สุดเท่าที่ทำได้"],"examFocus":["ถ้าเจอ query กรองด้วย 2-3 คอลัมน์ ให้เลือก composite index โดยวาง equality ก่อน range และตรวจ leftmost prefix","ถ้าเจอ WHERE ที่ใส่ function ครอบคอลัมน์แล้วช้า ให้เขียนใหม่เป็นช่วงที่ sargable","ถ้าหน้าลึกของ list ช้าลงเรื่อยๆ ให้เปลี่ยนจาก OFFSET เป็น keyset pagination พร้อม tie-breaker","ถ้า plan เป็น sequential scan ที่ JOIN ตารางลูก ให้ตรวจว่าคอลัมน์ FK มี index หรือไม่","ถ้าถามการยืนยันว่า index ถูกใช้ ให้ดูผล EXPLAIN ไม่ใช่เดา"],"pitfalls":["คิดว่าสร้าง index ทุกคอลัมน์แล้วจะเร็วเสมอ ความจริงคือ write ช้าลงและ optimizer อาจไม่เลือกใช้","คิดว่า index (a, b) ใช้ช่วยการกรองด้วย b อย่างเดียวได้เต็มที่ ซึ่งไม่ใช่ตามหลัก leftmost prefix","ใช้ keyset pagination โดยเรียงด้วยคอลัมน์ที่ค่าซ้ำได้ โดยไม่มี tie-breaker"],"example":{"lang":"sql","code":"-- index รองรับ filter + sort\nCREATE INDEX idx_orders_user_created\n  ON orders (user_id, created_at DESC, id DESC);\n\n-- keyset pagination (หน้าถัดไป)\nSELECT id, created_at, total\nFROM orders\nWHERE user_id = :uid\n  AND (created_at, id) < (:last_created_at, :last_id)\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n\n-- sargable: แทน DATE(created_at) = '2025-01-01'\nWHERE created_at >= '2025-01-01' AND created_at < '2025-01-02'"}},{"descriptor":"SQLC-S2","competency":"SQL Coding","title":"Query หลายตารางด้วย JOIN","summary":"การเลือกชนิด JOIN และวางเงื่อนไขให้ถูกตำแหน่ง รวมถึงรับมือปัญหา fan-out ที่ทำให้ผลรวมซ้ำ และรูปแบบ query ที่ต้องมีครบทุกค่า (relational division)","keyPoints":["INNER JOIN เก็บเฉพาะแถวที่จับคู่, LEFT/RIGHT JOIN เก็บแถวทั้งหมดของฝั่งที่ระบุ, FULL OUTER JOIN เก็บทั้งสองฝั่ง (MySQL ไม่รองรับโดยตรง), CROSS JOIN ให้ผลคูณคาร์ทีเซียน","ค่า NULL ใน key ไม่เคยจับคู่กันใน JOIN เพราะ `NULL = NULL` ไม่เป็นจริง","Fan-out: การ JOIN ตารางที่มีความสัมพันธ์ one-to-many สองสายพร้อมกัน (เช่น orders และ payments ของลูกค้าเดียวกัน) ทำให้แถวคูณกัน แล้ว SUM/COUNT ซ้ำเกินจริง แก้โดยรวมยอด (pre-aggregate) แต่ละฝั่งใน subquery หรือ CTE ก่อน แล้วค่อย JOIN, หรือใช้ `COUNT(DISTINCT ...)` เมื่อเหมาะสม","สำหรับ outer join: เงื่อนไขของตารางด้านที่ไม่ครบ (ฝั่งขวาของ LEFT JOIN) ที่ใส่ใน WHERE จะกรองแถว NULL ทิ้งและเปลี่ยนความหมายเป็น inner join; ถ้าต้องการกรองก่อนจับคู่ให้ใส่ใน ON","Anti-join (หาแถวที่ไม่มีคู่): ใช้ `LEFT JOIN ... WHERE right.key IS NULL` หรือ `NOT EXISTS` ส่วน semi-join (มีคู่อย่างน้อยหนึ่ง) ใช้ `EXISTS` ซึ่งไม่ทำให้แถวซ้ำ","Relational division (หาแถวที่เกี่ยวข้องกับ ครบทุกค่า ในชุดที่กำหนด): `GROUP BY` แล้ว `HAVING COUNT(DISTINCT item) = (จำนวน item ที่ต้องมี)` หรือใช้ `NOT EXISTS` ซ้อนสองชั้น","ความสัมพันธ์ many-to-many ต้องผ่านตารางเชื่อม (junction table) และ JOIN สองครั้ง ระวัง DISTINCT ที่ซ่อนปัญหาแถวซ้ำแทนที่จะแก้ที่ต้นเหตุ","Self join ใช้เทียบแถวในตารางเดียวกัน เช่น พนักงานกับหัวหน้า ต้องตั้ง alias ให้ชัดเจน"],"examFocus":["ถ้าผลรวมยอดขายสูงกว่าจริงหลัง JOIN หลายตารางลูก ให้สงสัย fan-out และแยกการรวมยอดก่อน JOIN","ถ้า LEFT JOIN ไม่คืนแถวที่ไม่มีคู่ตามคาด ให้ตรวจว่าเงื่อนไขอยู่ใน WHERE หรือ ON","ถ้าโจทย์ถามลูกค้าที่ซื้อครบทุกสินค้าที่กำหนด ให้ใช้รูปแบบ relational division ด้วย HAVING COUNT(DISTINCT)","ถ้าโจทย์ถามแถวที่ไม่มีข้อมูลในอีกตาราง ให้เลือก anti-join ที่ปลอดภัยกับ NULL","ถ้าต้องเลือกชนิด JOIN ให้ถามก่อนว่าต้องการเก็บแถวที่ไม่มีคู่หรือไม่"],"pitfalls":["แก้ผลรวมซ้ำโดยเติม DISTINCT ทับ ซึ่งอาจตัดแถวที่มีค่าเท่ากันจริงทิ้งและให้ผลผิด","ใช้ COUNT(DISTINCT) ใน relational division โดยไม่กรองให้อยู่ในชุดที่กำหนด ทำให้นับค่านอกชุดด้วย","คิดว่า LEFT JOIN แล้วกรองตารางขวาใน WHERE ยังคงแถวที่ไม่มีคู่ไว้"],"example":{"lang":"sql","code":"-- ป้องกัน fan-out: รวมยอดแต่ละฝั่งก่อน JOIN\nSELECT c.id, o.order_total, p.paid_total\nFROM customers c\nLEFT JOIN (\n  SELECT customer_id, SUM(total) AS order_total\n  FROM orders GROUP BY customer_id\n) o ON o.customer_id = c.id\nLEFT JOIN (\n  SELECT customer_id, SUM(amount) AS paid_total\n  FROM payments GROUP BY customer_id\n) p ON p.customer_id = c.id;\n\n-- relational division: ลูกค้าที่ซื้อครบทั้ง 3 สินค้า\nSELECT customer_id\nFROM purchases\nWHERE product_id IN (1, 2, 3)\nGROUP BY customer_id\nHAVING COUNT(DISTINCT product_id) = 3;"}},{"descriptor":"SQLC-S4","competency":"SQL Coding","title":"Data integrity constraints","summary":"การใช้ constraint ในฐานข้อมูลเพื่อรับประกันความถูกต้องของข้อมูลในระดับ schema โดยเฉพาะพฤติกรรมของ NULL ที่ทำให้ constraint ผ่านโดยไม่คาดคิด","keyPoints":["Constraint หลัก: `PRIMARY KEY`, `UNIQUE`, `NOT NULL`, `FOREIGN KEY`, `CHECK` และ `DEFAULT` การบังคับที่ฐานข้อมูลปลอดภัยกว่าการตรวจเฉพาะในแอป เพราะมีหลายทางที่ข้อมูลเข้าถึงตารางได้","`CHECK` จะปฏิเสธแถวก็ต่อเมื่อเงื่อนไขประเมินเป็น FALSE ถ้าเป็น UNKNOWN (เพราะมี NULL) แถวจะผ่าน เช่น `CHECK (price > 0)` ยอมรับ price ที่เป็น NULL ต้องใส่ `NOT NULL` เพิ่มถ้าไม่ต้องการ","`FOREIGN KEY` ที่เป็น NULL ผ่านการตรวจโดยปริยาย (พฤติกรรมปกติของ MATCH SIMPLE) ถ้าความสัมพันธ์ต้องมีเสมอให้ประกาศ NOT NULL","`UNIQUE` กับ NULL: PostgreSQL และ MySQL อนุญาตให้มี NULL ซ้ำหลายแถว ส่วน SQL Server ถือว่า NULL เท่ากันและอนุญาตเพียงแถวเดียว (PostgreSQL 15 ขึ้นไปมี `NULLS NOT DISTINCT` เป็นทางเลือก) พฤติกรรมจึงขึ้นกับ DBMS","Composite `UNIQUE` / PK บังคับความไม่ซ้ำของค่าชุดรวมกัน ไม่ใช่แต่ละคอลัมน์","การกระทำของ FK เมื่อแถวแม่ถูกลบ/แก้: `RESTRICT`/`NO ACTION` (ปฏิเสธ), `CASCADE` (ลบ/แก้ตาม), `SET NULL`, `SET DEFAULT` เลือกให้ตรงกับความหมายทางธุรกิจ ระวัง CASCADE ที่ลบข้อมูลต่อเนื่องโดยไม่ตั้งใจ","คำสั่ง INSERT หลายแถวในคำสั่งเดียวเป็น atomic: ถ้ามีแถวหนึ่งละเมิด constraint ทั้งคำสั่งจะล้มเหลวและไม่มีแถวใดถูกบันทึก (ยกเว้นใช้กลไกอย่าง ON CONFLICT DO NOTHING)","การเพิ่ม constraint ให้ตารางที่มีข้อมูลอยู่แล้วจะล้มเหลวถ้าข้อมูลเดิมละเมิด ต้องทำความสะอาดข้อมูลก่อน; MySQL บังคับใช้ CHECK ตั้งแต่เวอร์ชัน 8.0.16 (เวอร์ชันก่อนหน้ารับไวยากรณ์แต่ไม่บังคับ)","ความ unique ที่ต้องยกเว้นแถว soft delete ใช้ partial/filtered unique index (เช่น PostgreSQL `CREATE UNIQUE INDEX ... WHERE deleted_at IS NULL`)"],"examFocus":["ถ้าเจอ CHECK constraint ที่เกี่ยวกับคอลัมน์ที่เป็น NULL ได้ ให้คิดว่าแถวที่เป็น NULL ผ่านการตรวจ","ถ้าถามว่าคำสั่ง INSERT แถวใดถูกปฏิเสธ ให้ประเมินแต่ละแถวทีละ constraint โดยคิดผลของ NULL ด้วย","ถ้าต้องการให้ค่าห้ามว่างและต้องผ่านเงื่อนไข ให้ใช้ NOT NULL ร่วมกับ CHECK","ถ้าต้องการลบแถวแม่ที่มีลูกอยู่ ให้เลือก referential action ให้ตรงกับความต้องการ","ถ้าต้องการความ unique เฉพาะแถวที่ยังใช้งาน ให้พิจารณา partial unique index"],"pitfalls":["คิดว่า CHECK (x > 0) ปฏิเสธค่า NULL ซึ่งจริงๆ ผ่าน","คิดว่า UNIQUE ไม่ยอมให้ NULL ซ้ำในทุกฐานข้อมูล","ตรวจ constraint เฉพาะในโค้ดแอปแล้วถือว่าข้อมูลถูกต้อง ทั้งที่มีเส้นทางอื่นเขียนตารางได้"],"example":{"lang":"sql","code":"CREATE TABLE products (\n  id        BIGINT PRIMARY KEY,\n  sku       VARCHAR(40) NOT NULL UNIQUE,\n  price     NUMERIC(10,2) NOT NULL CHECK (price > 0),\n  stock     INT NOT NULL DEFAULT 0 CHECK (stock >= 0),\n  category_id BIGINT NOT NULL REFERENCES categories(id)\n    ON DELETE RESTRICT\n);\n-- ถ้า price ไม่มี NOT NULL: INSERT ... price = NULL จะผ่าน CHECK"}},{"descriptor":"PRG-S1","competency":"Program Coding","title":"ออกแบบโค้ด modular ด้วย design patterns","summary":"การเลือกและใช้ design pattern เพื่อให้โค้ดแยกส่วน นำกลับมาใช้ซ้ำ และขยายได้โดยไม่แก้ของเดิม พร้อมเข้าใจข้อควรระวังของแต่ละ pattern","keyPoints":["Strategy: แยกอัลกอริทึมที่สลับได้ไว้หลัง interface เดียวกัน การใช้ registry/map ของ strategy แทน `switch` ยาวๆ ทำให้เพิ่มตัวเลือกใหม่ได้โดยไม่แก้โค้ดเดิม (Open/Closed Principle)","Adapter / abstraction: ซ่อน SDK ของ payment gateway แต่ละเจ้าไว้หลัง interface ของเราเอง (ports and adapters) ทำให้สลับผู้ให้บริการและเขียน test ด้วย fake ได้ ตามหลัก Dependency Inversion","Observer / pub-sub: ผู้สมัครรับเหตุการณ์ควรได้รับ unsubscribe handle (ฟังก์ชันยกเลิก) เมื่อ subscribe เพื่อให้ยกเลิกได้และไม่เกิด memory leak จาก listener ที่ค้าง","Decorator / higher-order function: ห่อฟังก์ชันเพื่อเพิ่มพฤติกรรมข้างเคียง เช่น retry wrapper, logging, caching โดยไม่แก้ฟังก์ชันเดิม โดยต้องคง signature และสนใจเรื่อง idempotency เมื่อ retry","Middleware / Chain of Responsibility: แต่ละขั้นเรียก `next()` เพื่อส่งต่อ ใน async ต้อง `await next()` (หรือ return) เพื่อให้ลำดับการทำงานและการจัดการ error ถูกต้อง การลืม await ทำให้โค้ดหลัง `next()` ของขั้นปัจจุบันทำงานต่อและจบก่อนที่ขั้นถัดไปจะทำงานเสร็จ และ error จากขั้นถัดไปจะไม่ถูก try/catch ของขั้นปัจจุบันจับ","State pattern / transition table: เก็บกฎการเปลี่ยนสถานะเป็นตาราง (state, event) -> nextState แทนการใช้ boolean flag หลายตัว ลดสถานะที่เป็นไปไม่ได้ (impossible states) และตรวจสอบได้ง่าย","การอัปเดตข้อมูลแบบ immutable ใช้ copy เฉพาะเส้นทางที่เปลี่ยน (path copying) ส่วนที่ไม่เปลี่ยนแชร์ reference เดิม (structural sharing) การ spread แบบตื้น (shallow) ไม่ copy ระดับลึก จึงต้อง copy ทุกชั้นตามเส้นทางที่แก้","Singleton ทำให้เกิด global state และ test ยาก ควรใช้ dependency injection แทนเมื่อทำได้; Factory ใช้ซ่อนการสร้างอ็อบเจกต์ที่ซับซ้อน","เลือก pattern เมื่อมีปัญหาจริง ไม่ใช่ใส่ล่วงหน้า (YAGNI) และคำว่า high-performance ต้องวัดผลก่อนปรับ ไม่ใช่เดา"],"examFocus":["ถ้าเจอ switch/if-else ยาวที่ต้องเพิ่มกรณีบ่อย ให้เลือก strategy registry","ถ้าต้องรองรับ payment provider หลายเจ้า ให้เลือก interface กลางพร้อม adapter ต่อเจ้า","ถ้ามี subscribe แล้วหน้าถูกปิดแต่ยังได้รับเหตุการณ์ ให้เลือกคืน unsubscribe handle และเรียกยกเลิก","ถ้าเจอ boolean flag หลายตัวที่ผสมกันเกิดสถานะเพี้ยน ให้เลือก state machine แบบ transition table","ถ้าเจอ middleware ที่ลำดับทำงานไม่ตรงหรือ error หลุด ให้ตรวจว่า await next() หรือ return แล้วหรือไม่"],"pitfalls":["ใช้ pattern เกินความจำเป็นจนโค้ดซับซ้อนกว่าเดิม","คิดว่า shallow copy (spread) ทำให้ object ซ้อนในไม่ถูกแชร์ ความจริงคืออ็อบเจกต์ชั้นในยังเป็น reference เดียวกัน","ใช้ Singleton เป็นที่เก็บสถานะรวมจนทดสอบและแยก module ไม่ได้"],"example":{"lang":"typescript","code":"interface PaymentGateway {\n  charge(amount: number): Promise<string>;\n}\n\nconst gateways: Record<string, PaymentGateway> = {\n  stripeLike: { charge: async (a) => `ok-${a}` },\n  bankX: { charge: async (a) => `bx-${a}` },\n};\n\nfunction pay(provider: string, amount: number) {\n  const g = gateways[provider];\n  if (!g) throw new Error('unknown provider');\n  return g.charge(amount); // เพิ่มเจ้าใหม่โดยไม่แก้ pay()\n}"}},{"descriptor":"SQLC-S1","competency":"SQL Coding","title":"Query ซับซ้อน: subquery, CTE, window function","summary":"การเขียน query ที่ซับซ้อนให้ถูกและอ่านง่ายด้วย subquery, CTE (รวม recursive) และ window function โดยระวังเรื่อง tie, NULL และการวนไม่รู้จบ","keyPoints":["ดึงแถวล่าสุดต่อกลุ่ม: ใช้ `ROW_NUMBER() OVER (PARTITION BY group_col ORDER BY ts DESC, id DESC) = 1` ใน subquery/CTE; ถ้าใช้ `MAX(ts)` แล้ว JOIN กลับ และมีแถวที่ ts เท่ากัน จะได้หลายแถวต่อกลุ่ม ต้องกำหนด tie-breaker","`RANK()` ให้อันดับเท่ากันเมื่อค่าเท่ากัน (และข้ามเลขถัดไป), `DENSE_RANK()` ไม่ข้ามเลข, `ROW_NUMBER()` ให้เลขไม่ซ้ำเสมอ เลือกตามต้องการว่าจะเก็บแถวที่เสมอกันหรือไม่","PostgreSQL มี `DISTINCT ON (col) ... ORDER BY col, ts DESC` เป็นทางลัดสำหรับ latest-per-group (เฉพาะ PostgreSQL)","`NOT IN (subquery)` ล้มเหลวเมื่อมี NULL ใน subquery ให้ใช้ `NOT EXISTS` ที่ปลอดภัยกว่า; correlated subquery ถูกประเมินต่อแถวแม่ในเชิงตรรกะ ต้องระวังประสิทธิภาพ","CTE (`WITH name AS (...)`) ช่วยแตก query ซับซ้อนเป็นขั้นอ่านง่าย; ใน PostgreSQL 12 ขึ้นไป CTE ที่ไม่ recursive และถูกอ้างครั้งเดียวมักถูก inline และมีคำสั่ง `MATERIALIZED` /
