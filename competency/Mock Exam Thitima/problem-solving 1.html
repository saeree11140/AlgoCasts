<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>ข้อสอบซ้อม Problem Solving &amp; AI</title>
<style>
/* Soft "warm paper" theme — easier on the eyes for long reading sessions */
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --surface-2: #f1ebdf;
  --fg: #3a352d;
  --muted: #6b6357;
  --border: #e3dccd;
  --border-strong: #cfc6b4;
  --accent: #2f6f6a;
  --accent-soft: #e3efec;
  --accent-fg: #ffffff;
  --ok: #2e7048;
  --ok-bg: #e7f2e9;
  --bad: #a8433c;
  --bad-bg: #f9ebe8;
  --warn: #855d12;
  --warn-bg: #faf0da;
  --focus: #c27a1a;
  --code-bg: #f4efe4;
  --shadow: 0 1px 2px rgba(80, 60, 30, 0.05), 0 2px 8px rgba(80, 60, 30, 0.04);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: 20px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", "Thonburi", "Leelawadee UI", Tahoma, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1d1a;
    --surface: #282521;
    --surface-2: #322e29;
    --fg: #e6dfd2;
    --muted: #b3aa9b;
    --border: #3d3832;
    --border-strong: #554e45;
    --accent: #7fc3bb;
    --accent-soft: #243532;
    --accent-fg: #13201f;
    --ok: #8fd1a4;
    --ok-bg: #1e3026;
    --bad: #f0a097;
    --bad-bg: #3a2420;
    --warn: #e8c47a;
    --warn-bg: #362c18;
    --focus: #f0b45e;
    --code-bg: #24211d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.8;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--gutter);
  padding-bottom: 64px;
}

h1, h2, h3 { line-height: 1.4; margin: 0 0 10px; font-weight: 650; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 14px; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
[tabindex="-1"]:focus { outline: none; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.muted { color: var(--muted); }
.small { font-size: 0.92rem; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* buttons */
.btn {
  font: inherit;
  min-height: 46px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
  font-weight: 600;
}

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* start screen */
fieldset {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px var(--gutter) var(--gutter);
  margin: 0 0 16px;
  min-width: 0;
  background: var(--surface);
  box-shadow: var(--shadow);
}
legend { font-weight: 650; padding: 0 8px; }

.choice {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.choice:hover { background: var(--surface-2); }
.choice input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice input:focus-visible { outline: none; }
.choice .text { min-width: 0; }

.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input[type="number"] {
  font: inherit;
  width: 8rem;
  min-height: 46px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--fg);
}
.error {
  color: var(--bad);
  background: var(--bad-bg);
  border: 1px solid var(--bad);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
}

/* quiz header */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.9rem;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.15rem;
  padding: 4px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.timer.low { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

/* exam only: the header (timer + warning banner) stays on screen while scrolling */
.sticky-head {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.sticky-head .topbar { margin-bottom: 0; }
.time-banner {
  margin-top: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--warn);
  background: var(--warn-bg);
  color: var(--warn);
  font-weight: 650;
}
.time-banner.urgent { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
/* focusing a question title or feedback must not leave it under the sticky header */
.sticky-head ~ .card .qtitle,
.sticky-head ~ .card .feedback { scroll-margin-top: 10rem; }
.score-line { font-weight: 600; }

/* question */
.qtitle { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.01em; }
.multi-note {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 12px;
  border-radius: 8px;
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid var(--warn);
  font-weight: 600;
  font-size: 0.95rem;
}
.stem { font-size: 1.14rem; line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }

pre.code {
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  max-width: 100%;
  font-family: var(--mono);
  font-size: 0.88rem;
  line-height: 1.6;
  tab-size: 2;
}
pre.code code {
  font: inherit;
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
}

.options { border: 0; padding: 0; margin: 0 0 16px; background: transparent; box-shadow: none; }
.opt {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
label.opt { cursor: pointer; }
label.opt:hover { background: var(--surface-2); border-color: var(--border-strong); }
label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
label.opt input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
label.opt input:focus-visible { outline: none; }
.letter {
  flex: 0 0 auto;
  min-width: 1.75em;
  height: 1.75em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 700;
  font-size: 0.85rem;
  margin-top: 3px;
}
label.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt-body { flex: 1 1 auto; min-width: 0; }
.opt-text { white-space: pre-wrap; }

.opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag {
  font-size: 0.85rem;
  font-weight: 650;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.sel { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.why { margin: 6px 0 0; font-size: 0.97rem; line-height: 1.75; color: var(--muted); }
.opt.is-correct .why, .opt.is-wrong .why { color: var(--fg); }

.feedback {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px var(--gutter);
  margin: 0 0 16px;
  background: var(--surface-2);
}
.feedback h3 { margin-bottom: 6px; }
.feedback .points { font-weight: 700; }
.feedback .points.pos { color: var(--ok); }
.feedback .points.neg { color: var(--bad); }
.explain { white-space: pre-wrap; margin: 10px 0 0; line-height: 1.85; }

/* navigation + palette */
.qnav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.qnav .spacer { flex: 1 1 0; }

.palette-wrap { margin-top: 14px; }
.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.pal {
  position: relative;
  font: inherit;
  font-size: 0.95rem;
  min-height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  padding: 0;
  transition: background-color 0.15s ease;
}
.pal:hover { background: var(--surface-2); }
.pal.answered { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.pal.current { outline: 3px solid var(--focus); outline-offset: 1px; }
.pal.flagged::after {
  content: "\2691";
  position: absolute;
  top: -2px;
  right: 3px;
  font-size: 0.8rem;
  color: var(--warn);
  text-shadow: 0 0 2px var(--surface);
}
.pal.answered.flagged::after { color: var(--accent-fg); text-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9rem; color: var(--muted); }

/* results */
.big-score { font-size: 2.2rem; font-weight: 750; line-height: 1.2; margin: 6px 0; color: var(--accent); }
.desc-row { padding: 12px 0; border-top: 1px solid var(--border); }
.desc-row:first-child { border-top: 0; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.review-item { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gutter); margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow); }
.review-item.unanswered { border-color: var(--warn); }

/* review screen */
#app.wide { max-width: 1120px; }
.rv-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.rv-filter { display: block; width: 100%; max-width: 100%; font: inherit; min-height: 46px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); }
code.ic { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); border: 1px solid var(--border); overflow-wrap: anywhere; }
mark { background: var(--warn-bg); color: var(--fg); border-bottom: 2px solid var(--warn); border-radius: 3px; padding: 0 1px; }

.rv-toolbar { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin: 6px 0 4px; }
.rv-prog { flex: 1 1 240px; min-width: 0; }
.rv-prog-text { font-size: 0.95rem; color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
.rv-prog .bar { margin-top: 0; }
.rv-tools { display: flex; flex-wrap: wrap; gap: 10px; }

.rv-layout { margin-top: 0; }
.rv-below { margin-top: 16px; }
.rv-side { display: none; }
.rv-main { min-width: 0; font-size: 1.05rem; line-height: 1.75; max-width: calc(72ch + 2 * var(--gutter) + 2px); margin: 0 auto; }
.rv-side[hidden], .rv-toc-m[hidden] { display: none !important; }

/* table of contents */
.rv-toc-title { font-size: 1.05rem; margin: 0 0 4px; }
.rv-toc-h { font-size: 0.82rem; font-weight: 650; color: var(--muted); margin: 14px 0 4px; line-height: 1.4; }
.rv-toc-list { list-style: none; margin: 0; padding: 0; }
.rv-toc-list a { display: flex; gap: 6px; align-items: baseline; min-height: 44px; padding: 8px 8px; border-radius: 8px; color: var(--fg); text-decoration: none; line-height: 1.45; font-size: 0.97rem; }
.rv-toc-list a:hover { background: var(--accent-soft); }
.rv-tick { flex: 0 0 1.1em; visibility: hidden; color: var(--ok); font-weight: 700; }
.rv-toc-list a.read .rv-tick { visibility: visible; }
.rv-tl { min-width: 0; }
.rv-toc-m { margin: 0 0 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.rv-toc-m > summary { cursor: pointer; min-height: 48px; padding: 10px var(--gutter); font-weight: 650; display: flex; align-items: center; }
.rv-toc-m .rv-toc-body { padding: 0 calc(var(--gutter) - 8px) var(--gutter); }

@media (min-width: 1000px) {
  .rv-layout { display: grid; grid-template-columns: 280px minmax(0, calc(72ch + 2 * var(--gutter) + 2px)); justify-content: center; gap: 36px; align-items: start; }
  .rv-main { margin: 0; width: 100%; }
  .rv-side { display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px 6px 12px 0; }
  .rv-toc-m { display: none; }
  .rv-toc-list a { min-height: 34px; padding: 5px 8px; }
}

/* topic card (accordion) */
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
.rv-card[open] { border-color: var(--accent); }
.rv-sum { display: flex; align-items: center; gap: 12px; padding: 14px var(--gutter); min-height: 60px; cursor: pointer; list-style: none; border-radius: var(--radius); }
.rv-sum::-webkit-details-marker { display: none; }
.rv-sum::marker { content: ''; }
.rv-sum:hover { background: var(--surface-2); }
.rv-sum::after { content: ''; flex: 0 0 auto; width: 0.55em; height: 0.55em; margin: 0 4px 0 2px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.15s ease; }
.rv-card[open] > .rv-sum::after { transform: rotate(-135deg); }
.rv-badge { flex: 0 0 auto; min-width: 2.8em; text-align: center; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-weight: 650; font-size: 0.9rem; line-height: 1.6; }
.rv-sum-main { flex: 1 1 auto; min-width: 0; display: block; }
.rv-sum-main h3 { margin: 0; font-size: 1.1rem; line-height: 1.5; }
.rv-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; }
.rv-meta { font-size: 0.88rem; color: var(--muted); }
.rv-readtag { font-size: 0.8rem; line-height: 1.5; padding: 0 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.rv-readtag[hidden] { display: none; }

.rv-body { padding: 6px var(--gutter) var(--gutter); }
.rv-body > * + * { margin-top: 28px; }
.rv-body > .rv-name { margin-top: 10px; margin-bottom: 0; }
.rv-lead { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px 16px; font-size: 1.12rem; line-height: 1.7; }
.rv-lead p { margin: 0; }
.rv-lab-top { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; line-height: 1.5; }
.rv-sec-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 12px; font-size: 1.05rem; line-height: 1.5; }
.rv-count { font-size: 0.85rem; font-weight: 400; color: var(--muted); }

.rv-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rv-point { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.rv-num { flex: 0 0 auto; width: 2rem; height: 2rem; margin-top: 0.1rem; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 650; line-height: 1; }
.rv-pt { min-width: 0; }
.rv-term { display: block; font-weight: 650; margin-bottom: 2px; }
.rv-rest { display: block; }

.rv-qa { display: grid; gap: 10px; }
.rv-qa-head { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0 14px; font-size: 0.82rem; font-weight: 650; color: var(--muted); }
.rv-qa-row { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.rv-qa-row.full { grid-template-columns: 1fr; }
.rv-q { padding: 12px 14px; background: var(--surface-2); min-width: 0; }
.rv-a { padding: 12px 14px; background: var(--ok-bg); border-left: 4px solid var(--ok); min-width: 0; }
.rv-lab { display: block; font-size: 0.78rem; font-weight: 650; line-height: 1.5; margin-bottom: 2px; color: var(--muted); }
.rv-a .rv-lab { color: var(--ok); }
@media (min-width: 561px) {
  .rv-qa .rv-lab { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}
@media (max-width: 560px) {
  .rv-qa-head { display: none; }
  .rv-qa-row { grid-template-columns: 1fr; }
  .rv-a { border-left: 0; border-top: 4px solid var(--ok); }
}

.rv-pits { display: grid; gap: 10px; }
.rv-pit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: var(--radius-sm); }
.rv-x { flex: 0 0 auto; color: var(--bad); font-weight: 700; }

.rv-ex > summary { cursor: pointer; display: flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--accent); }
.rv-ex pre.code { margin-top: 6px; }

.rv-foot { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
.rv-read-btn[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.rv-read-btn[aria-pressed="true"]::before { content: '\2713\00a0'; }

/* focus mode */
.fc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.fc-keys { font-size: 0.85rem; color: var(--muted); }
.fc-head { max-width: 640px; margin: 20px auto 0; }
.fc-topic { display: flex; align-items: center; gap: 10px; }
.fc-title { margin: 0; font-size: 1.1rem; line-height: 1.45; min-width: 0; }
.fc-pos { margin: 6px 0 10px; }
.fc-head .bar { margin-top: 0; }
.fc-prog-text { margin: 6px 0 0; }
.fc-stage { max-width: 640px; margin: 20px auto 0; }
.fc-card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 30px 34px; min-height: 300px; font-size: 1.3rem; line-height: 1.7; }
.fc-card.t-key { border-top-color: var(--muted); }
.fc-card.t-ex { border-top-color: var(--ok); }
.fc-card.t-pit { border-top-color: var(--bad); }
.fc-card.t-end { border-top-color: var(--accent); }
.fc-card.enter { animation: fc-in 0.18s ease-out; }
@keyframes fc-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fc-chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 20px; font-size: 1rem; }
.fc-chip { display: inline-block; padding: 1px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--fg); font-size: 0.85rem; font-weight: 650; line-height: 1.7; }
.fc-chip.sum { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.fc-chip.ex { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.fc-chip.pit { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.fc-prevmark { font-size: 0.85rem; color: var(--muted); }
.fc-text { margin: 0; }
.fc-term { display: block; font-weight: 650; margin-bottom: 8px; }
.fc-sub { margin: 18px 0 0; font-size: 0.95rem; line-height: 1.6; }
.fc-x { color: var(--bad); font-weight: 700; margin-right: 8px; }
.fc-answer { margin-top: 24px; padding: 16px 20px; background: var(--ok-bg); border-left: 5px solid var(--ok); border-radius: var(--radius-sm); }
.fc-answer p { margin: 0; }
.fc-answer .rv-lab { color: var(--ok); }
.fc-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn.fc-big { min-height: 52px; padding: 10px 22px; font-size: 1.05rem; }
.btn.good { border-color: var(--ok); color: var(--ok); }
.fc-nav { max-width: 640px; margin: 18px auto 0; display: flex; gap: 12px; }
.fc-nav .btn { flex: 1 1 0; }
.fc-note { margin: 0 0 14px; }
@media (max-width: 480px) {
  .fc-card { padding: 22px 18px 26px; font-size: 1.2rem; min-height: 260px; }
  .fc-keys { display: none; }
}

/* dialog */
dialog.dlg {
  max-width: min(480px, calc(100vw - 32px));
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  padding: var(--gutter);
  box-shadow: 0 10px 40px rgba(40, 30, 15, 0.2);
}
dialog.dlg::backdrop { background: rgba(40, 32, 20, 0.45); }
dialog.dlg .row { justify-content: flex-end; margin-top: 14px; }

@media (max-width: 480px) {
  :root { --gutter: 16px; }
  body { font-size: 1rem; }
  h1 { font-size: 1.35rem; }
  .stem { font-size: 1.07rem; }
  .big-score { font-size: 1.8rem; }
  .qnav .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

culate และชื่อสั้นอย่าง x, y ยังไม่บอกว่าคำนวณอะไรจากอะไร จึงไม่ช่วยให้อ่านง่ายขึ้น"},{"id":"C","text":"เขียน 0.07 เป็น 7 / 100 ในนิพจน์เดิม เพื่อให้เห็นว่าเป็นเปอร์เซ็นต์","correct":false,"why":"ตัวเลขยังฝังอยู่ในนิพจน์ ไม่มีชื่อบอกความหมาย และถ้าอัตราเปลี่ยนก็ต้องไล่แก้ทุกจุดที่เขียนตัวเลขนี้"},{"id":"D","text":"ตั้งชื่อฟังก์ชันเป็น calculateVat พารามิเตอร์เป็น unitPrice กับ quantity และเก็บอัตราภาษีในค่าคงที่ชื่อ VAT_RATE","correct":true,"why":"ถูกต้อง ชื่อบอกเจตนา ค่าคงที่มีชื่อและแก้ได้จุดเดียว จุดเรียกใช้อ่านเป็นประโยคได้ และผลลัพธ์เหมือนเดิม"}],"explanation":"ชื่อที่สื่อความหมายและค่าคงที่ที่มีชื่อ (แทน magic number) ทำให้โค้ดอ่านเข้าใจได้โดยไม่ต้องพึ่งคอมเมนต์ และแก้อัตราภาษีได้ที่เดียว คอมเมนต์ใช้อธิบาย \"ทำไม\" ที่โค้ดบอกไม่ได้ ไม่ใช่ชดเชยชื่อที่คลุมเครือ"},{"id":"PS-J-P-004","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"operator-precedence-and-or","mobile":false,"type":"single","stem":"กติกา checkout คือผู้ใช้ที่ล็อกอินหรือถือ guest token ต้องมีสินค้าในตะกร้าอย่างน้อย 1 ชิ้นจึงกดสั่งซื้อได้ แต่พบว่าผู้ใช้ที่ล็อกอินแล้วและตะกร้าว่างยังสั่งซื้อได้ ตามโค้ดด้านล่างที่พิมพ์ true นิพจน์ใดแก้ให้ตรงกติกา","code":"const isLoggedIn = true;\nconst hasGuestToken = false;\nconst cartCount = 0;\n\nconst canCheckout = isLoggedIn || hasGuestToken && cartCount > 0;\nconsole.log(canCheckout);","codeLang":"typescript","options":[{"id":"A","text":"isLoggedIn || (hasGuestToken && cartCount > 0)","correct":false,"why":"วงเล็บนี้ตรงกับการจัดกลุ่มที่ภาษาทำให้อยู่แล้ว (&& ถูกประเมินก่อน ||) ความหมายจึงเหมือนเดิม ผู้ใช้ที่ล็อกอินและตะกร้าว่างยังได้ true"},{"id":"B","text":"(isLoggedIn || hasGuestToken) && cartCount > 0","correct":true,"why":"ถูกต้อง วงเล็บทำให้ต้องผ่านเงื่อนไขตัวตนอย่างใดอย่างหนึ่งก่อน แล้วจึงนำไป && กับเงื่อนไขจำนวนสินค้า"},{"id":"C","text":"isLoggedIn && hasGuestToken && cartCount > 0","correct":false,"why":"เงื่อนไขนี้ต้องมีทั้งล็อกอินและ guest token พร้อมกัน ผู้ใช้ที่ล็อกอินอย่างเดียวจะสั่งซื้อไม่ได้เลย"},{"id":"D","text":"isLoggedIn || hasGuestToken || cartCount > 0","correct":false,"why":"แค่มีสินค้าในตะกร้าก็ผ่าน และผู้ใช้ที่ล็อกอินพร้อมตะกร้าว่างก็ยังผ่านเหมือนเดิม"}],"explanation":"ในภาษาส่วนใหญ่ && มีลำดับความสำคัญสูงกว่า || ดังนั้น a || b && c จึงอ่านเป็น a || (b && c) ถ้าต้องการให้เงื่อนไขตัวสุดท้ายใช้กับทั้ง a และ b ต้องใส่วงเล็บเอง วงเล็บยังช่วยให้คนอ่านเห็นเจตนาแม้ไม่ต้องจำลำดับความสำคัญ"},{"id":"PS-J-P-005","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"retry-backoff-loop-trace","mobile":true,"type":"single","stem":"แอปมือถือซิงก์ข้อมูลขึ้นเซิร์ฟเวอร์ด้วยการ retry แบบ backoff โค้ดด้านล่างจำลองการเก็บเวลารอ (มิลลิวินาที) ก่อน retry แต่ละครั้ง โดยการส่งสำเร็จในความพยายามครั้งที่ 3 เมื่อรันแล้วจะพิมพ์ข้อความใด","code":"const waits: number[] = [];\nlet delay = 500;\n\nfor (let attempt = 1; attempt \u003c= 4; attempt++) {\n  const ok = attempt === 3;\n  if (ok) break;\n  waits.push(delay);\n  delay *= 2;\n}\n\nconsole.log(waits.join(\",\"));","codeLang":"typescript","options":[{"id":"A","text":"500,1000,2000","correct":false,"why":"ค่า 2000 จะถูกเก็บเมื่อความพยายามครั้งที่ 3 ล้มเหลว แต่รอบนั้นสำเร็จและ break ก่อนถึงบรรทัด push"},{"id":"B","text":"500,1000,2000,4000","correct":false,"why":"ผลนี้ต้องให้ลูปรันครบ 4 รอบโดยไม่หยุด แต่ break ออกจากลูปตั้งแต่ความพยายามครั้งที่ 3"},{"id":"C","text":"500,1000","correct":true,"why":"ถูกต้อง ความพยายามครั้งที่ 1 และ 2 ล้มเหลวจึง push 500 และ 1000 ส่วนครั้งที่ 3 สำเร็จจึง break ออกก่อน push"},{"id":"D","text":"1000,2000","correct":false,"why":"delay ถูก push ก่อนแล้วจึงคูณ 2 ค่าแรกที่เก็บจึงเป็น 500 ไม่ใช่ค่าที่คูณแล้ว"}],"explanation":"เวลา trace ลูปให้เขียนตารางค่าของ attempt, delay และ waits ทีละรอบ และสังเกตลำดับของคำสั่งในลูป (push ก่อนหรือหลังคูณ) รวมถึงจุดที่ break ตัดการทำงานของรอบนั้นทั้งรอบ"},{"id":"PS-J-P-006","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"max-initial-value-zero","mobile":false,"type":"multiple","stem":"ฟังก์ชัน highestScore ใช้หาค่ามากที่สุดจากรายการตัวเลขซึ่งอาจมีค่าติดลบ ข้อใดเป็นผลที่เกิดขึ้นจริงเมื่อเรียกใช้ฟังก์ชันนี้ (เลือกทุกข้อที่ถูก)","code":"function highestScore(scores: number[]): number {\n  let best = 0;\n  for (const s of scores) {\n    if (s > best) best = s;\n  }\n  return best;\n}\n\nconsole.log(highestScore([-5, -2, -9]), highestScore([]), highestScore([4, 9, 2]));","codeLang":"typescript","options":[{"id":"A","text":"highestScore([-5, -2, -9]) คืนค่า -2","correct":false,"why":"ค่า -2 คือค่ามากสุดจริงของรายการ แต่ best เริ่มที่ 0 และไม่มีสมาชิกใดมากกว่า 0 ฟังก์ชันจึงคืน 0"},{"id":"B","text":"highestScore([-5, -2, -9]) คืนค่า 0","correct":true,"why":"ถูกต้อง ค่าเริ่มต้นของ best คือ 0 ซึ่งมากกว่าทุกสมาชิกที่ติดลบ จึงไม่ถูกแทนที่และ 0 ไม่ใช่สมาชิกของรายการด้วยซ้ำ"},{"id":"C","text":"highestScore([]) เกิด error เพราะไม่มีสมาชิกให้เปรียบเทียบ","correct":false,"why":"for...of บน array ว่างไม่รันตัวลูปเลย ฟังก์ชันจึงคืนค่าเริ่มต้นของ best โดยไม่มี error"},{"id":"D","text":"highestScore([]) คืนค่า 0 ซึ่งแยกไม่ออกจากกรณีที่คะแนนสูงสุดคือ 0 จริง ๆ","correct":true,"why":"ถูกต้อง array ว่างคืนค่าเริ่มต้น 0 ผู้เรียกจึงบอกไม่ได้ว่าไม่มีข้อมูลหรือคะแนนสูงสุดเท่ากับ 0"},{"id":"E","text":"highestScore([4, 9, 2]) คืนค่า 9","correct":true,"why":"ถูกต้อง เมื่อมีค่าบวกอยู่ในรายการ ค่าเริ่มต้น 0 ถูกแทนที่ตามลำดับจนเหลือ 9"}],"explanation":"การตั้งค่าเริ่มต้นของตัวแปรสะสมต้องเป็นค่าที่ไม่บิดเบือนผลในกรณีสุดขอบ สำหรับหาค่ามากสุดควรเริ่มจากสมาชิกตัวแรกของรายการ (และตัดสินใจว่ารายการว่างจะคืนอะไรหรือ throw) แทนการใช้ 0 โดยอัตโนมัติ"},{"id":"PS-J-P-007","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J1","concept":"unclear-names-mixed-responsibilities","mobile":false,"type":"multiple","stem":"โค้ดด้านล่างใช้กรองรายการที่ยอดเงินเกินค่าที่กำหนด เพื่อนร่วมทีมรีวิวแล้วเห็นว่าอ่านและดูแลยาก ข้อใดเป็นจุดที่ควรปรับปรุงจริง (เลือกทุกข้อที่ถูก)","code":"function proc(d: any[], t: number) {\n  let r = [];\n  for (let i = 0; i \u003c d.length; i++) {\n    if (d[i].amt > t) {\n      r.push(d[i]);\n    }\n  }\n  console.log(\"done \" + r.length);\n  return r;\n}","codeLang":"typescript","options":[{"id":"A","text":"ชื่อ proc, d, t และ r ไม่บอกว่าเป็นข้อมูลอะไร ผู้อ่านต้องไล่เนื้อหาในฟังก์ชันเพื่อเดาความหมาย","correct":true,"why":"ถูกต้อง ชื่อที่สื่อความหมาย เช่น filterLargeOrders, orders, minAmount จะทำให้จุดเรียกใช้อ่านเข้าใจได้ทันที"},{"id":"B","text":"ใช้ let กับ r ทั้งที่ไม่เคยกำหนดค่าใหม่ ทำให้ฟังก์ชันคืนผลผิด","correct":false,"why":"let แทน const ไม่ทำให้ผลผิด ฟังก์ชันคืนรายการที่กรองถูกต้อง การใช้ const เป็นเรื่องบอกเจตนาให้ชัดเท่านั้น"},{"id":"C","text":"ฟังก์ชันทั้งกรองข้อมูลและพิมพ์ log ในตัวเดียว ทำให้นำไปใช้ซ้ำในที่ที่ไม่ต้องการ log ได้ยาก","correct":true,"why":"ถูกต้อง หนึ่งฟังก์ชันควรทำหน้าที่เดียว การพิมพ์ log ควรอยู่ที่ผู้เรียกหรือชั้นที่ดูแลเรื่อง logging"},{"id":"D","text":"ชนิด any[] ทำให้ TypeScript ตรวจชื่อ field ไม่ได้ เช่น พิมพ์ amnt ผิดก็ยังคอมไพล์ผ่าน","correct":true,"why":"ถูกต้อง any ปิดการตรวจชนิดของสมาชิก ควรกำหนด interface เช่น Order ที่มี field amount เพื่อให้พิมพ์ผิดแล้ว error ตั้งแต่ตอนคอมไพล์"}],"explanation":"ความอ่านง่ายมาจากชื่อที่สื่อความหมาย ฟังก์ชันที่ทำหน้าที่เดียว และชนิดข้อมูลที่ compiler ช่วยตรวจ ส่วนการเลือก let หรือ const ไม่กระทบผลลัพธ์ แต่ const บอกผู้อ่านว่าตัวแปรไม่ถูกกำหนดค่าใหม่"},{"id":"PS-J-P-008","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"remove-while-iterating","mobile":false,"type":"single","stem":"ระบบตะกร้าต้องการลบรายการ \"b\" ทุกตัวออกจาก array ด้านล่าง เมื่อรันโค้ดแล้วพิมพ์ผล จะได้ข้อความใด","code":"const cart = [\"a\", \"b\", \"b\", \"c\"];\n\nfor (let i = 0; i \u003c cart.length; i++) {\n  if (cart[i] === \"b\") {\n    cart.splice(i, 1);\n  }\n}\n\nconsole.log(cart.join(\"\"));","codeLang":"typescript","options":[{"id":"A","text":"ac","correct":false,"why":"ผลนี้คือสิ่งที่ผู้เขียนตั้งใจ แต่โค้ดลบรายการ \"b\" ได้เพียงตัวเดียว"},{"id":"B","text":"abc","correct":true,"why":"ถูกต้อง เมื่อลบ \"b\" ที่ index 1 รายการถัดมาเลื่อนมาอยู่ที่ index 1 แต่ i เพิ่มเป็น 2 ไปแล้ว จึงข้าม \"b\" ตัวที่สองไป"},{"id":"C","text":"abbc","correct":false,"why":"splice ทำงานจริง \"b\" ตัวแรกถูกลบไปแล้ว array จึงไม่เหลือ \"b\" สองตัวเหมือนเดิม"},{"id":"D","text":"ab","correct":false,"why":"ลูปยังวนต่อจนครบความยาวใหม่ของ array \"c\" ไม่ได้ถูกลบเพราะไม่ตรงเงื่อนไข"}],"explanation":"การลบสมาชิกจาก array ระหว่างที่วนด้วย index ทำให้สมาชิกที่ตามมาเลื่อนตำแหน่งและถูกข้าม แนวทางที่ปลอดภัยคือสร้าง array ใหม่ด้วย filter หรือวนจากท้ายมาต้น"},{"id":"PS-J-P-009","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"sort-comparator-tie-break","mobile":false,"type":"single","stem":"ลีดเดอร์บอร์ดต้องเรียงผู้เล่นตามคะแนนจากมากไปน้อย และถ้าคะแนนเท่ากันให้เรียงตามชื่อจาก A ไป Z เมื่อรันโค้ดด้านล่าง จะพิมพ์ลำดับชื่อใด","code":"const players = [\n  { name: \"Mali\", score: 80 },\n  { name: \"Anan\", score: 95 },\n  { name: \"Boon\", score: 80 },\n  { name: \"Chai\", score: 95 },\n];\n\nplayers.sort((a, b) => {\n  if (a.score !== b.score) return b.score - a.score;\n  return a.name.localeCompare(b.name);\n});\n\nconsole.log(players.map((p) => p.name).join(\",\"));","codeLang":"typescript","options":[{"id":"A","text":"Chai,Anan,Mali,Boon","correct":false,"why":"ลำดับนี้เรียงชื่อจาก Z ไป A ในกลุ่มคะแนนเท่ากัน แต่ตัวเปรียบเทียบใช้ a.name.localeCompare(b.name) ซึ่งเรียง A ไป Z"},{"id":"B","text":"Anan,Chai,Mali,Boon","correct":false,"why":"ลำดับนี้คงลำดับเดิมของคนคะแนนเท่ากัน (Mali อยู่ก่อน Boon) ซึ่งเกิดเมื่อไม่มีเงื่อนไขเรียงตามชื่อ แต่โค้ดมีเงื่อนไขนี้อยู่"},{"id":"C","text":"Boon,Mali,Anan,Chai","correct":false,"why":"ลำดับนี้เรียงคะแนนจากน้อยไปมาก แต่ b.score - a.score เรียงจากมากไปน้อย"},{"id":"D","text":"Anan,Chai,Boon,Mali","correct":true,"why":"ถูกต้อง คะแนน 95 มาก่อน 80 และในแต่ละกลุ่มที่คะแนนเท่ากัน ชื่อถูกเรียง A ไป Z"}],"explanation":"ตัวเปรียบเทียบสำหรับ sort ต้องคืนค่าติดลบ ศูนย์ หรือบวก และเรียงหลายเงื่อนไขได้โดยตรวจเงื่อนไขหลักก่อน เมื่อค่าเท่ากันจึงตัดสินด้วยเงื่อนไขรอง ควรทดลองกับข้อมูลที่มีค่าซ้ำเสมอ เพราะข้อมูลที่ไม่ซ้ำจะไม่เผยว่า tie-break ถูกหรือไม่"},{"id":"PS-J-P-010","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"text-input-string-concatenation","mobile":true,"type":"single","stem":"หน้าตะกร้าในแอปมือถือมีปุ่ม + เพื่อเพิ่มจำนวนสินค้า ค่าจำนวนอ่านมาจากช่องกรอกข้อความ (TextInput) จึงเป็นข้อความเสมอ เมื่อผู้ใช้กดปุ่ม + โค้ดด้านล่างจะพิมพ์ค่าใด","code":"const qtyText: string = \"3\";\nconst newQty = qtyText + 1;\nconsole.log(newQty);","codeLang":"typescript","options":[{"id":"A","text":"31","correct":true,"why":"ถูกต้อง ตัวดำเนินการ + กับข้อความทำหน้าที่ต่อสตริง ค่า 1 ถูกแปลงเป็น \"1\" แล้วต่อท้าย \"3\" ได้ \"31\""},{"id":"B","text":"4","correct":false,"why":"ผลนี้ต้องแปลง qtyText เป็นตัวเลขก่อนบวก แต่โค้ดไม่ได้แปลง ชนิดของค่าจึงยังเป็นข้อความ"},{"id":"C","text":"NaN","correct":false,"why":"NaN เกิดเมื่อแปลงข้อความที่ไม่ใช่ตัวเลขเป็นตัวเลข แต่ที่นี่ไม่มีการแปลงเป็นตัวเลขเกิดขึ้นเลย การต่อสตริงสำเร็จตามปกติ"},{"id":"D","text":"เกิด TypeError เพราะบวกข้อความกับตัวเลขไม่ได้","correct":false,"why":"ภาษาที่รันโค้ดนี้อนุญาตให้ + ระหว่างข้อความกับตัวเลข โดยแปลงตัวเลขเป็นข้อความ จึงไม่เกิด error แต่ได้ผลที่ผิดจากที่ตั้งใจ"}],"explanation":"ค่าจากช่องกรอกข้อมูล (ทั้งเว็บและมือถือ) มักเป็นข้อความ ต้องแปลงเป็นตัวเลขอย่างชัดเจนก่อนคำนวณ เช่น Number(qtyText) พร้อมตรวจว่าแปลงสำเร็จ แล้วจึงบวก ไม่ควรพึ่งการแปลงชนิดอัตโนมัติ"},{"id":"PS-J-P-011","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"floating-point-equality","mobile":false,"type":"single","stem":"ระบบคำนวณยอดรวมจากสินค้า 2 ชิ้น แล้วเทียบกับยอดที่คาดไว้ 0.3 บาท เมื่อรันโค้ดด้านล่างจะพิมพ์ข้อความใด","code":"const prices = [0.1, 0.2];\nconst total = prices[0] + prices[1];\n\nconsole.log(total === 0.3, total.toFixed(2));","codeLang":"typescript","options":[{"id":"A","text":"true 0.30","correct":false,"why":"0.1 กับ 0.2 เก็บเป็นเลขฐานสองไม่ได้พอดี ผลบวกจึงไม่เท่ากับ 0.3 เป๊ะ การเปรียบเทียบด้วย === จึงได้ false"},{"id":"B","text":"false 0.30000000000000004","correct":false,"why":"ค่า total เป็น 0.30000000000000004 จริง แต่ toFixed(2) จัดรูปให้มีทศนิยม 2 ตำแหน่ง จึงพิมพ์ 0.30"},{"id":"C","text":"false 0.30","correct":true,"why":"ถูกต้อง ผลบวกเป็นค่าประมาณที่คลาดเคลื่อนเล็กน้อย จึงไม่เท่ากับ 0.3 แต่เมื่อปัดเป็นทศนิยม 2 ตำแหน่งจะแสดง 0.30"},{"id":"D","text":"true 0.3","correct":false,"why":"ผลเปรียบเทียบไม่ใช่ true และ toFixed(2) ให้ทศนิยมสองตำแหน่งเสมอ จึงไม่พิมพ์ 0.3"}],"explanation":"จำนวนทศนิยมแบบ floating point เป็นค่าประมาณ จึงไม่ควรเปรียบเทียบด้วยความเท่ากันตรง ๆ เก็บเงินเป็นหน่วยย่อย (เช่น สตางค์เป็นจำนวนเต็ม) หรือเปรียบเทียบด้วยค่าความคลาดเคลื่อนที่ยอมรับได้"},{"id":"PS-J-P-012","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J2","concept":"leap-year-century-rule","mobile":false,"type":"multiple","stem":"ฟังก์ชัน isLeapYear ใช้ตรวจว่าปี ค.ศ. ที่ส่งเข้าไปเป็นปีอธิกสุรทิน (ปีที่กุมภาพันธ์มี 29 วัน) หรือไม่ การเรียกฟังก์ชันด้วยปีใดต่อไปนี้ให้ผลที่ไม่ตรงกับปฏิทินจริง (เลือกทุกข้อที่ถูก)","code":"function isLeapYear(year: number): boolean {\n  return year % 4 === 0 && year % 100 !== 0;\n}","codeLang":"typescript","options":[{"id":"A","text":"isLeapYear(1900)","correct":false,"why":"ผลตรงกับปฏิทินจริง ปี 1900 ไม่ใช่ปีอธิกสุรทิน และฟังก์ชันคืน false"},{"id":"B","text":"isLeapYear(2000)","correct":true,"why":"ถูกต้อง ปี 2000 เป็นปีอธิกสุรทินเพราะหารด้วย 400 ลงตัว แต่ฟังก์ชันคืน false เพราะ 2000 หารด้วย 100 ลงตัว"},{"id":"C","text":"isLeapYear(2023)","correct":false,"why":"ผลตรงกับปฏิทินจริง 2023 หารด้วย 4 ไม่ลงตัว ฟังก์ชันคืน false"},{"id":"D","text":"isLeapYear(2024)","correct":false,"why":"ผลตรงกับปฏิทินจริง 2024 หารด้วย 4 ลงตัวและหารด้วย 100 ไม่ลงตัว ฟังก์ชันคืน true"},{"id":"E","text":"isLeapYear(2400)","correct":true,"why":"ถูกต้อง ปี 2400 เป็นปีอธิกสุรทินเพราะหารด้วย 400 ลงตัว แต่ฟังก์ชันคืน false จากเงื่อนไขหารด้วย 100"}],"explanation":"กฎของปีอธิกสุรทินมีข้อยกเว้นซ้อนกัน คือหารด้วย 4 ลงตัว ยกเว้นปีที่หารด้วย 100 ลงตัว แต่ปีที่หารด้วย 400 ลงตัวก็ยังเป็นปีอธิกสุรทิน เวลาทดสอบฟังก์ชันที่มีเงื่อนไขซ้อนกัน ให้เลือกค่าตัวอย่างที่ครบทุกกิ่ง ไม่ใช่เฉพาะค่าที่เห็นบ่อย"},{"id":"PS-J-P-013","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J1","concept":"misleading-name-side-effect","mobile":false,"type":"single","stem":"ทีมเรียกฟังก์ชัน getTotal ด้วยราคาเดียวกันสองครั้ง ครั้งแรกสำหรับหน้าสรุปคำสั่งซื้อ ครั้งที่สองสำหรับใบเสร็จ เมื่อรันโค้ดด้านล่างจะพิมพ์อะไร และฟังก์ชันนี้มีปัญหาด้านความอ่านง่ายอย่างไร","code":"let discountUsed = false;\n\nfunction getTotal(price: number): number {\n  if (!discountUsed) {\n    discountUsed = true;\n    return price * 0.9;\n  }\n  return price;\n}\n\nconsole.log(getTotal(100), getTotal(100));","codeLang":"typescript","options":[{"id":"A","text":"พิมพ์ 90 100 ชื่อ get ฟังดูเป็นการอ่านค่า แต่ฟังก์ชันแก้ตัวแปรภายนอกด้วย ผลจึงขึ้นกับว่าเคยเรียกมาก่อนหรือไม่","correct":true,"why":"ถูกต้อง การเรียกครั้งแรกตั้ง discountUsed เป็น true และได้ 90 ครั้งที่สองได้ 100 ชื่อที่ฟังดูเป็นการอ่านค่าจึงทำให้ผู้ใช้ฟังก์ชันเข้าใจผิด"},{"id":"B","text":"พิมพ์ 90 90 เพราะทั้งสองครั้งใช้ราคา 100 เท่ากัน ผลลัพธ์จึงต้องเท่ากันและชื่อฟังก์ชันไม่ใช่ปัญหา","correct":false,"why":"ผลลัพธ์ของฟังก์ชันขึ้นกับตัวแปร discountUsed ไม่ใช่เฉพาะราคา ครั้งที่สองจึงไม่ได้ส่วนลด"},{"id":"C","text":"พิมพ์ 100 100 เพราะ discountUsed เริ่มเป็น false จึงไม่เข้าเงื่อนไขลดราคา ฟังก์ชันคืนราคาเดิม","correct":false,"why":"เงื่อนไข !discountUsed เป็นจริงเมื่อ discountUsed เป็น false ครั้งแรกจึงเข้าบล็อกและคืน 90"},{"id":"D","text":"เกิด error เพราะฟังก์ชันแก้ค่าตัวแปรที่ประกาศนอกฟังก์ชันไม่ได้ และตัวแปรนั้นเป็นของขอบเขตภายนอก","correct":false,"why":"ฟังก์ชันอ่านและเขียนตัวแปรในขอบเขตภายนอกที่ประกาศด้วย let ได้ โปรแกรมไม่ error"}],"explanation":"ชื่อฟังก์ชันควรบอกพฤติกรรมจริง ฟังก์ชันที่คืนค่าเฉย ๆ ไม่ควรแอบเปลี่ยนสถานะภายนอก (side effect) ถ้าจำเป็นต้องเปลี่ยน ให้ตั้งชื่อให้เห็น เช่น applyDiscountOnce หรือส่งสถานะเข้ามาเป็นพารามิเตอร์ เพื่อให้เรียกซ้ำด้วยค่าเดิมแล้วได้ผลเดิม"},{"id":"PS-J-P-014","level":"junior","pool":"practice","competency":"Program Coding","descriptor":"PRG-J1","concept":"comment-noise-dead-code","mobile":false,"type":"multiple","stem":"โค้ดด้านล่างเป็นส่วนส่งสินค้าของออเดอร์ที่ชำระเงินแล้ว ผู้รีวิวบอกว่ามีปัญหาด้านความสะอาดของโค้ด ข้อใดเป็นการปรับปรุงที่เหมาะสม (เลือกทุกข้อที่ถูก)","code":"// loop through the orders\nfor (const order of orders) {\n  // check if the status is paid\n  if (order.status === \"paid\") {\n    ship(order); // ship the order\n  }\n}\n\n// ship(order, { express: true });\n// const TAX_RATE = 0.05;","codeLang":"typescript","options":[{"id":"A","text":"ลบคอมเมนต์ที่เล่าซ้ำสิ่งที่โค้ดบอกอยู่แล้ว เช่น คอมเมนต์ check if the status is paid","correct":true,"why":"ถูกต้อง โค้ด order.status === \"paid\" อ่านได้ชัดอยู่แล้ว คอมเมนต์ควรอธิบายเหตุผลทางธุรกิจที่โค้ดบอกไม่ได้"},{"id":"B","text":"เพิ่มคอมเมนต์อธิบายทุกบรรทัดที่ยังไม่มี เพื่อให้ผู้อ่านรุ่นหลังเข้าใจโค้ดมากขึ้น","correct":false,"why":"คอมเมนต์ที่เล่าซ้ำสิ่งที่โค้ดบอกอยู่แล้วเพิ่มความรก และมักไม่ถูกแก้ตามเมื่อโค้ดเปลี่ยน ทำให้ขัดกับโค้ดจริงในภายหลัง"},{"id":"C","text":"ลบบรรทัดโค้ดเก่าที่คอมเมนต์ปิดไว้ เพราะประวัติการแก้ไขย้อนดูได้จากระบบจัดการเวอร์ชันอยู่แล้ว","correct":true,"why":"ถูกต้อง โค้ดที่ถูกคอมเมนต์ปิดทิ้งไว้เป็นของตกค้าง ถ้าต้องกลับไปดูก็เปิดประวัติของไฟล์ได้"},{"id":"D","text":"ย้ายบรรทัดที่ถูกคอมเมนต์ปิดไปรวมไว้ท้ายไฟล์ เผื่อต้องย้อนกลับไปใช้โค้ดเก่า","correct":false,"why":"โค้ดเก่าที่คอมเมนต์ไว้ทำให้ผู้อ่านสงสัยว่ายังใช้อยู่หรือไม่ และการย้อนกลับไปดูโค้ดเก่าทำได้จากประวัติใน Git อยู่แล้ว"}],"explanation":"คอมเมนต์ที่ดีบอก \"ทำไม\" ซึ่งโค้ดบอกเองไม่ได้ ส่วนการเล่าว่าโค้ดทำอะไรควรให้ชื่อตัวแปรและโครงสร้างโค้ดบอกเอง โค้ดเก่าที่ปิดด้วยคอมเมนต์ควรลบ เพราะระบบจัดการเวอร์ชันเก็บประวัติให้อยู่แล้ว"},{"id":"PS-J-P-015","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"left-join-where-filter","mobile":false,"type":"single","stem":"ต้องการรายงานจำนวนออเดอร์ที่ชำระเงินแล้ว (paid) ของลูกค้าทุกคน โดยลูกค้าที่ไม่มีออเดอร์ที่จ่ายแล้วต้องแสดงเป็น 0 เมื่อรันคำสั่งด้านล่าง จะได้ผลลัพธ์ใด","code":"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);\nCREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, status TEXT);\n\nINSERT INTO customers VALUES (1, 'Anong'), (2, 'Boon'), (3, 'Chai');\nINSERT INTO orders VALUES (101, 1, 'paid'), (102, 1, 'cancelled'), (103, 2, 'cancelled');\n\nSELECT c.name, COUNT(o.id) AS paid_orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.status = 'paid'\nGROUP BY c.name;","codeLang":"sql","options":[{"id":"A","text":"3 แถว: Anong 1, Boon 0, Chai 0","correct":false,"why":"ผลนี้คือสิ่งที่รายงานต้องการ แต่เงื่อนไข WHERE ตัดแถวของ Boon และ Chai ออกไปก่อนถึงขั้นนับ"},{"id":"B","text":"1 แถว: Anong 1","correct":true,"why":"ถูกต้อง LEFT JOIN สร้างแถวของ Boon (status cancelled) และ Chai (status เป็น NULL) แต่ WHERE o.status = 'paid' ตัดทั้งสองแถวออก เหลือเพียง Anong ผลจึงเหมือน INNER JOIN"},{"id":"C","text":"2 แถว: Anong 1, Boon 0","correct":false,"why":"แถวของ Boon มี status เป็น cancelled ซึ่งไม่ผ่านเงื่อนไข status = 'paid' จึงถูกตัดออก"},{"id":"D","text":"3 แถว: Anong 2, Boon 1, Chai 0","correct":false,"why":"ผลนี้นับออเดอร์ทุกสถานะ แต่คำสั่งนี้กรองด้วย status = 'paid' ก่อนจะนับ"}],"explanation":"เงื่อนไข WHERE ที่อ้างคอลัมน์ของตารางฝั่งขวาของ LEFT JOIN จะตัดแถวที่ไม่มีคู่ (ค่าเป็น NULL) ออก ทำให้ LEFT JOIN ทำงานเหมือน INNER JOIN ถ้าต้องการเก็บลูกค้าทุกคน ให้ย้ายเงื่อนไข status ไปไว้ใน ON เช่น ON o.customer_id = c.id AND o.status = 'paid'"},{"id":"PS-J-P-016","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"not-in-subquery-null","mobile":false,"type":"single","stem":"ต้องการค้นหาสินค้าที่ยังไม่เคยถูกสั่งซื้อเลย ซึ่งตามข้อมูลต้องได้ Stapler เมื่อรันคำสั่งด้านล่าง ผลลัพธ์เป็นอย่างไร","code":"CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT);\nCREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, product_id INTEGER);\n\nINSERT INTO products VALUES (1, 'Pen'), (2, 'Notebook'), (3, 'Stapler');\nINSERT INTO order_items VALUES (1, 100, 1), (2, 100, NULL), (3, 101, 2);\n\nSELECT name\nFROM products\nWHERE id NOT IN (SELECT product_id FROM order_items);","codeLang":"sql","options":[{"id":"A","text":"ได้ 1 แถว: Stapler","correct":false,"why":"ผลนี้คือสิ่งที่ตั้งใจ แต่แถวที่ product_id เป็น NULL ใน subquery ทำให้ NOT IN ไม่คืนแถวใดเลย"},{"id":"B","text":"ได้ 2 แถว: Notebook และ Stapler","correct":false,"why":"Notebook ถูกสั่งซื้อในออเดอร์ 101 จึงอยู่ในผลของ subquery และไม่ควรอยู่ในผลลัพธ์ ไม่ว่า NULL จะถูกนับหรือไม่"},{"id":"C","text":"เกิด error เพราะ subquery มีค่า NULL","correct":false,"why":"ฐานข้อมูลไม่ error คำสั่งรันสำเร็จ เพียงแต่เงื่อนไขของทุกแถวไม่เป็นจริง"},{"id":"D","text":"ไม่ได้แถวใดเลย","correct":true,"why":"ถูกต้อง id NOT IN (1, NULL, 2) แปลเป็น id \u003c> 1 AND id \u003c> NULL AND id \u003c> 2 ซึ่งมีส่วน \u003c> NULL ให้ผลเป็น UNKNOWN ทำให้ไม่มีแถวใดผ่าน"}],"explanation":"ถ้ามี NULL อยู่ในผลของ subquery ที่ใช้กับ NOT IN เงื่อนไขจะไม่มีวันเป็นจริงสำหรับทุกแถว แนวทางที่ปลอดภัยคือใช้ NOT EXISTS หรือเติม WHERE product_id IS NOT NULL ใน subquery"},{"id":"PS-J-P-017","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"count-star-vs-count-column","mobile":false,"type":"multiple","stem":"ตาราง reviews เก็บคะแนนรีวิวสินค้า บางรีวิวยังไม่มีคะแนน (rating เป็น NULL) เมื่อรันคำสั่งด้านล่าง ข้อใดเป็นจริงเกี่ยวกับผลลัพธ์ (เลือกทุกข้อที่ถูก)","code":"CREATE TABLE reviews (id INTEGER PRIMARY KEY, product_id INTEGER, rating INTEGER);\n\nINSERT INTO reviews VALUES (1, 1, 5), (2, 1, NULL), (3, 1, 3), (4, 1, NULL);\n\nSELECT COUNT(*) AS a,\n       COUNT(rating) AS b,\n       AVG(rating) AS c,\n       SUM(rating) AS d\nFROM reviews;","codeLang":"sql","options":[{"id":"A","text":"คอลัมน์ a ได้ 4 เพราะ COUNT(*) นับทุกแถว รวมแถวที่ rating เป็น NULL","correct":true,"why":"ถูกต้อง COUNT(*) นับจำนวนแถว ไม่สนใจค่าในคอลัมน์ใด ตารางมี 4 แถว"},{"id":"B","text":"คอลัมน์ c ได้ 2 เพราะ AVG หารผลรวม 8 ด้วยจำนวนแถวทั้งหมด 4","correct":false,"why":"AVG ข้ามค่า NULL ทั้งตัวตั้งและตัวหาร จึงหารด้วย 2 (จำนวนแถวที่มีคะแนน) ไม่ใช่ 4"},{"id":"C","text":"คอลัมน์ b ได้ 2 เพราะ COUNT(rating) นับเฉพาะแถวที่ rating ไม่เป็น NULL","correct":true,"why":"ถูกต้อง COUNT(คอลัมน์) ข้ามค่า NULL จึงนับได้แค่ 2 แถวคือคะแนน 5 และ 3"},{"id":"D","text":"คอลัมน์ c ได้ค่าเท่ากับ 4 เพราะ AVG ข้ามแถวที่เป็น NULL แล้วเฉลี่ยจาก 5 กับ 3","correct":true,"why":"ถูกต้อง (5 + 3) / 2 = 4 บางฐานข้อมูลแสดงเป็น 4.0 หรือ 4.0000 แต่ค่าเท่ากัน"}],"explanation":"ฟังก์ชันรวมค่าอย่าง SUM, AVG, COUNT(คอลัมน์) ข้ามค่า NULL แต่ COUNT(*) นับทุกแถว เวลาเขียนรายงานเฉลี่ยจึงต้องรู้ว่า NULL หมายถึง \"ยังไม่มีข้อมูล\" หรือ \"ศูนย์\" ถ้าต้องการให้ NULL นับเป็น 0 ใช้ COALESCE(rating, 0) ก่อนเฉลี่ย"},{"id":"PS-J-P-018","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"where-vs-having-aggregate","mobile":false,"type":"single","stem":"ต้องการแสดงนักเรียนที่ลงทะเบียนตั้งแต่ 2 วิชาขึ้นไป พร้อมจำนวนวิชา แต่คำสั่งด้านล่างทำงานไม่สำเร็จและแจ้ง error เกี่ยวกับฟังก์ชันรวม (aggregate) แก้อย่างไรจึงได้ผลที่ถูกต้อง","code":"CREATE TABLE enrollments (student_id INTEGER, course TEXT);\n\nINSERT INTO enrollments VALUES\n  (1, 'Math'), (1, 'Art'),\n  (2, 'Math'),\n  (3, 'Art'), (3, 'Math'), (3, 'Bio');\n\nSELECT student_id, COUNT(*) AS courses\nFROM enrollments\nWHERE COUNT(*) >= 2\nGROUP BY student_id;","codeLang":"sql","options":[{"id":"A","text":"ย้ายเงื่อนไขเป็น HAVING COUNT(*) >= 2 ไว้หลัง GROUP BY student_id","correct":true,"why":"ถูกต้อง HAVING กรองกลุ่มหลังจัดกลุ่มและคำนวณฟังก์ชันรวมแล้ว ได้ผลเป็นนักเรียน 1 (2 วิชา) และ 3 (3 วิชา)"},{"id":"B","text":"เปลี่ยนเป็น WHERE courses >= 2 โดยใช้ alias courses ที่ตั้งไว้ใน SELECT","correct":false,"why":"WHERE ทำงานก่อนการจัดกลุ่ม ค่า courses ซึ่งมาจากฟังก์ชันรวมจึงยังไม่มี คำสั่งจึงยัง error (ข้อความอาจต่างกันตามฐานข้อมูล)"},{"id":"C","text":"เปลี่ยนเป็น WHERE COUNT(student_id) >= 2 เพราะ COUNT ของคอลัมน์ใช้ใน WHERE ได้","correct":false,"why":"ฟังก์ชันรวมทุกตัวใช้ใน WHERE ไม่ได้ ไม่ว่าจะ COUNT(*) หรือ COUNT ของคอลัมน์ เพราะ WHERE กรองแถวก่อนจัดกลุ่ม"},{"id":"D","text":"เปลี่ยนเป็น GROUP BY course และคงเงื่อนไข WHERE COUNT(*) >= 2 ไว้","correct":false,"why":"การเปลี่ยนคอลัมน์ที่จัดกลุ่มไม่แก้ปัญหา เพราะฟังก์ชันรวมยังอยู่ใน WHERE และยังเปลี่ยนความหมายของรายงานเป็นนับตามวิชา"}],"explanation":"WHERE กรองแถวดิบก่อนการจัดกลุ่ม จึงใช้ฟังก์ชันรวมไม่ได้ ส่วน HAVING กรองกลุ่มหลัง GROUP BY ใช้เงื่อนไขกับผลของฟังก์ชันรวมได้ หลักจำคือ เงื่อนไขกับค่าของแต่ละแถวไว้ WHERE เงื่อนไขกับค่ารวมของกลุ่มไว้ HAVING"},{"id":"PS-J-P-019","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"group-by-non-unique-name","mobile":true,"type":"single","stem":"แอปขายของเก็บตะกร้าไว้ในฐานข้อมูล SQLite บนเครื่องผู้ใช้ สินค้ารหัส 10 และ 11 เป็นสินค้าคนละตัว (สายชาร์จคนละรุ่น) แต่ใช้ชื่อแสดงผลเหมือนกัน หน้าตะกร้าใช้คำสั่งด้านล่างแล้วแสดงเพียง 2 บรรทัด ทั้งที่ควรเป็น 3 บรรทัด ควรแก้อย่างไร","code":"CREATE TABLE cart_items (\n  id INTEGER PRIMARY KEY,\n  product_id INTEGER,\n  product_name TEXT,\n  qty INTEGER\n);\n\nINSERT INTO cart_items VALUES\n  (1, 10, 'Cable', 2),\n  (2, 11, 'Cable', 1),\n  (3, 12, 'Charger', 1);\n\nSELECT product_name, SUM(qty) AS total_qty\nFROM cart_items\nGROUP BY product_name;","codeLang":"sql","options":[{"id":"A","text":"เพิ่ม DISTINCT หลัง SELECT เพื่อให้แต่ละรายการแยกกันและไม่ถูกรวมเป็นบรรทัดเดียว","correct":false,"why":"DISTINCT ตัดแถวผลลัพธ์ที่ซ้ำ ไม่ได้เปลี่ยนวิธีจัดกลุ่ม ชื่อ Cable สองตัวรวมกันตั้งแต่ขั้น GROUP BY แล้ว"},{"id":"B","text":"เปลี่ยน SUM(qty) เป็น COUNT(*) เพื่อให้นับสินค้าแต่ละรายการแยกกันตามรหัสสินค้า","correct":false,"why":"ฟังก์ชันรวมที่เปลี่ยนไม่มีผลต่อการจัดกลุ่ม ยังคงได้ 2 กลุ่มตามชื่อ และตัวเลขที่แสดงก็ไม่ใช่จำนวนชิ้นอีกต่อไป"},{"id":"C","text":"จัดกลุ่มด้วยรหัสสินค้า คือ GROUP BY product_id, product_name เพราะชื่อไม่ใช่ค่าเฉพาะของสินค้า","correct":true,"why":"ถูกต้อง กลุ่มถูกแบ่งตามรหัสสินค้าที่ไม่ซ้ำกัน ผลจึงเป็น 3 บรรทัด และ product_name ที่ต่อท้ายใน GROUP BY ทำให้เลือกแสดงชื่อได้ตามมาตรฐาน SQL"},{"id":"D","text":"เพิ่ม ORDER BY product_name เพื่อให้แถวที่ชื่อเหมือนกันอยู่ติดกันและไม่ถูกรวมกัน","correct":false,"why":"ORDER BY ใช้เรียงลำดับผลลัพธ์ ไม่มีผลต่อการรวมแถวใน GROUP BY"}],"explanation":"GROUP BY รวมแถวที่ค่าของคอลัมน์ที่ระบุเท่ากันเท่านั้น ถ้าเลือกคอลัมน์ที่ไม่ใช่ตัวระบุเฉพาะ (เช่น ชื่อ) แถวของสิ่งต่างกันอาจถูกรวมเข้าด้วยกันโดยไม่รู้ตัว ควรจัดกลุ่มด้วยคีย์ที่ระบุตัวตนได้ แล้วค่อยเอาชื่อมาแสดง"},{"id":"PS-J-P-020","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"composite-primary-key-duplicate","mobile":false,"type":"single","stem":"ตาราง order_items ใช้คู่ (order_id, product_id) เป็น primary key ผสม และแต่ละคำสั่ง INSERT รันแยกกัน ไม่ได้อยู่ใน transaction เดียว เมื่อรันทั้งหมดแล้ว SELECT สุดท้ายจะให้ผลใด","code":"CREATE TABLE order_items (\n  order_id INTEGER,\n  product_id INTEGER,\n  qty INTEGER,\n  PRIMARY KEY (order_id, product_id)\n);\n\nINSERT INTO order_items VALUES (1, 10, 2);\nINSERT INTO order_items VALUES (1, 11, 1);\nINSERT INTO order_items VALUES (2, 10, 5);\nINSERT INTO order_items VALUES (1, 10, 3);\n\nSELECT COUNT(*), SUM(qty) FROM order_items;","codeLang":"sql","options":[{"id":"A","text":"4 แถว ผลรวม qty เท่ากับ 11","correct":false,"why":"ผลนี้ต้องให้ INSERT ทั้งสี่คำสั่งสำเร็จ แต่คำสั่งสุดท้ายซ้ำคู่ (1, 10) ที่มีอยู่แล้วจึงถูกปฏิเสธ"},{"id":"B","text":"3 แถว ผลรวม qty เท่ากับ 8","correct":true,"why":"ถูกต้อง คำสั่งที่สามผ่านเพราะคู่ (2, 10) ไม่ซ้ำกับคู่อื่น ส่วนคำสั่งสุดท้ายซ้ำกับ (1, 10) จึงล้มเหลวและแถวเดิมที่ qty 2 ยังอยู่ ผลรวมคือ 2 + 1 + 5"},{"id":"C","text":"2 แถว ผลรวม qty เท่ากับ 3","correct":false,"why":"ผลนี้เกิดเมื่อ product_id ต้องไม่ซ้ำกันเพียงคอลัมน์เดียว แต่ primary key ผสมตรวจความซ้ำของทั้งคู่ (order_id, product_id)"},{"id":"D","text":"3 แถว ผลรวม qty เท่ากับ 9","correct":false,"why":"ผลนี้ต้องให้คำสั่งสุดท้ายแทนที่แถวเดิม (qty 3 แทน 2) แต่ INSERT ธรรมดาไม่ทำเช่นนั้น ถ้าซ้ำจะถูกปฏิเสธและแถวเดิมคงอยู่"}],"explanation":"primary key ผสมบังคับให้ชุดค่าของทุกคอลัมน์ในคีย์รวมกันห้ามซ้ำ แต่แต่ละคอลัมน์ซ้ำกันเองได้ INSERT ที่ละเมิดคีย์จะล้มเหลวทั้งคำสั่ง ไม่แก้หรือรวมแถวเดิมให้ ถ้าต้องการอัปเดตเมื่อซ้ำ ต้องใช้รูปแบบ upsert ของฐานข้อมูลนั้น"},{"id":"PS-J-P-021","level":"junior","pool":"practice","competency":"SQL Coding","descriptor":"SQLC-J1","concept":"inner-join-duplicate-rows","mobile":false,"type":"multiple","stem":"ลูกค้าหนึ่งคนมีได้หลายออเดอร์ ต้องการรายชื่อลูกค้าที่มีออเดอร์อย่างน้อยหนึ่งรายการ โดยแต่ละคนปรากฏครั้งเดียว แต่คำสั่งด้านล่างแสดง Anong สองบรรทัด การแก้ข้อใดทำให้ได้ผลตามต้องการ (เลือกทุกข้อที่ถูก)","code":"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);\nCREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, total INTEGER);\n\nINSERT INTO customers VALUES (1, 'Anong'), (2, 'Boon');\nINSERT INTO orders VALUES (101, 1, 500), (102, 1, 300), (103, 2, 200);\n\nSELECT c.name\nFROM customers c\nINNER JOIN orders o ON o.customer_id = c.id;","codeLang":"sql","options":[{"id":"A","text":"เปลี่ยนเป็น SELECT DISTINCT c.name โดยคง FROM และ JOIN เดิม","correct":true,"why":"ถูกต้อง DISTINCT ตัดแถวผลลัพธ์ที่ซ้ำกันออก ได้ Anong และ Boon อย่างละหนึ่งบรรทัด"},{"id":"B","text":"เพิ่ม LIMIT 2 ท้ายคำสั่ง","correct":false,"why":"LIMIT 2 ตัดเหลือสองแถวแรกซึ่งคือ Anong สองบรรทัด และทำให้ Boon หายไป"},{"id":"C","text":"เปลี่ยน INNER JOIN เป็น LEFT JOIN","correct":false,"why":"LEFT JOIN เก็บแถวฝั่งซ้ายทุกแถวและยังจับคู่กับออเดอร์ทุกรายการ Anong จึงยังซ้ำสองบรรทัด"},{"id":"D","text":"เพิ่ม GROUP BY c.name ท้ายคำสั่ง","correct":true,"why":"ถูกต้อง GROUP BY รวมแถวที่ชื่อเดียวกันเป็นหนึ่งกลุ่ม จึงได้ Anong และ Boon อย่างละหนึ่งบรรทัด"},{"id":"E","text":"เพิ่ม ORDER BY c.name ท้ายคำสั่ง","correct":false,"why":"ORDER BY แค่เรียงลำดับแถว ไม่ลดจำนวนแถวที่ซ้ำ Anong ยังขึ้นสองบรรทัด"}],"explanation":"JOIN แบบหนึ่งต่อหลาย (one-to-many) ทำให้แถวฝั่ง \"หนึ่ง\" ซ้ำตามจำนวนแถวฝั่ง \"หลาย\" ต้องการรายการไม่ซ้ำให้ใช้ DISTINCT หรือ GROUP BY หรือเปลี่ยนไปใช้ EXISTS ที่ตรวจเพียงว่ามีออเดอร์หรือไม่โดยไม่ขยายแถว"},{"id":"PS-J-P-022","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J1","concept":"hallucinated-helper-import","mobile":false,"type":"single","stem":"นักพัฒนาให้ผู้ช่วย AI เขียนโค้ดแสดงปีพุทธศักราชในหน้ารายงาน แล้วได้โค้ดด้านล่าง เมื่อคอมไพล์พบ error ว่า dateHelpers.ts ไม่มี export ชื่อ toThaiYear ทั้งที่ไฟล์นี้มีอยู่จริงในโปรเจกต์ ควรทำอะไรเป็นอย่างแรก","code":"import { toThaiYear } from \"./utils/dateHelpers\";\n\nconst label = `ปี ${toThaiYear(new Date())}`;","codeLang":"typescript","options":[{"id":"A","text":"ติดตั้งแพ็กเกจ npm ที่ชื่อ toThaiYear เพราะน่าจะเป็นไลบรารีที่ AI หมายถึงตั้งแต่แรก แล้วทดสอบใหม่","correct":false,"why":"แพ็กเกจที่ชื่อตรงกันอาจเป็นคนละอย่างกับที่ต้องการ และการติดตั้งโดยไม่ตรวจสอบเพิ่มความเสี่ยงด้านความปลอดภัย ควรดูก่อนว่าโปรเจกต์มีฟังก์ชันที่ต้องการอยู่แล้วหรือไม่"},{"id":"B","text":"ใส่ // @ts-ignore เหนือบรรทัด import แล้วทดสอบตอนรันโปรแกรม","correct":false,"why":"การปิด error ไม่ได้ทำให้ฟังก์ชันปรากฏขึ้น ตอนรันจึงยังล้มเหลวอยู่ดี เช่น อาจเจอ error ว่า toThaiYear ไม่ใช่ฟังก์ชัน หรือโมดูลไม่มี export ชื่อนี้ แล้วแต่วิธี build และรัน"},{"id":"C","text":"ส่ง error ให้ AI สร้างโค้ดชุดใหม่ แล้วนำไปใช้ทันทีโดยไม่เปิดไฟล์ดู","correct":false,"why":"AI อาจเดาชื่อฟังก์ชันที่ไม่มีอยู่ซ้ำอีกครั้ง ถ้ามันไม่ได้เห็นเนื้อหาไฟล์ dateHelpers.ts จริง"},{"id":"D","text":"เปิด dateHelpers.ts ดูว่า export อะไรไว้จริง แล้วเลือกใช้ฟังก์ชันที่มีหรือเขียนเพิ่มเอง","correct":true,"why":"ถูกต้อง AI อาจแต่งชื่อฟังก์ชันที่ฟังดูสมเหตุสมผลแต่ไม่มีจริง (hallucination) ต้องตรวจกับโค้ดจริงของโปรเจกต์ก่อนตัดสินใจ"}],"explanation":"ผู้ช่วย AI อาจอ้างฟังก์ชัน คลาส หรือแพ็กเกจที่ไม่มีอยู่จริงด้วยน้ำเสียงมั่นใจ เมื่อ compiler หรือ error บอกว่าสิ่งที่ถูกอ้างไม่มี ให้ตรวจกับต้นทางจริง (โค้ดโปรเจกต์ เอกสาร type definition) ก่อน แล้วค่อยตัดสินใจ ไม่ใช่ปิด error หรือสุ่มถามซ้ำ"},{"id":"PS-J-P-023","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J1","concept":"ai-refactor-small-steps-with-tests","mobile":false,"type":"single","stem":"ทีมต้องการ refactor ไฟล์ OrderService.ts ยาว 800 บรรทัด ซึ่งมี unit test ครอบคลุมบางส่วน โดยใช้ผู้ช่วย AI วิธีใดลดความเสี่ยงที่พฤติกรรมเปลี่ยนไปโดยไม่รู้ตัวได้มากที่สุด","options":[{"id":"A","text":"รัน test ที่มีอยู่ให้ผ่านก่อน แล้วให้ AI แยกโค้ดทีละส่วนเล็ก ๆ รัน test ซ้ำและอ่าน diff ก่อนไปส่วนถัดไป","correct":true,"why":"ถูกต้อง test ชุดเดิมเป็นหลักฐานว่าพฤติกรรมไม่เปลี่ยน การทำทีละก้าวทำให้เห็นว่าก้าวไหนทำพัง และอ่าน diff จับสิ่งที่ test ไม่ครอบคลุมได้"},{"id":"B","text":"ส่งทั้งไฟล์ให้ AI เขียนใหม่ในครั้งเดียว แล้วตรวจว่าแอปเปิดได้และหน้าหลักทำงานตามปกติก่อนรวมโค้ด","correct":false,"why":"การเปลี่ยนทั้งไฟล์พร้อมกันทำให้หาจุดที่พฤติกรรมเปลี่ยนยาก และแอปเปิดได้ไม่ได้แปลว่ากฎทางธุรกิจที่ซ่อนอยู่ยังเหมือนเดิม"},{"id":"C","text":"ให้ AI เขียน test ใหม่ทั้งหมดให้ไฟล์ที่มันสร้างใหม่ แล้วใช้ test ชุดนั้นยืนยันว่าผลลัพธ์ถูกต้อง","correct":false,"why":"test ที่เขียนจากโค้ดใหม่อาจสะท้อนพฤติกรรมใหม่ที่เปลี่ยนไปแล้ว จึงไม่ยืนยันว่าพฤติกรรมเดิมถูกรักษาไว้"},{"id":"D","text":"ให้ AI สรุปเป็นข้อความว่าเปลี่ยนอะไรไปบ้าง แล้วอ่านสรุปนั้นแทนการเปิดดู diff ของโค้ดทั้งหมด","correct":false,"why":"คำสรุปของ AI อาจตกหล่นหรือไม่ตรงกับโค้ดจริง ต้องดูการเปลี่ยนแปลงจริงใน diff"}],"explanation":"การ refactor ด้วย AI ใช้หลักเดียวกับ refactor ทั่วไป คือมี test ที่ผ่านก่อน ทำทีละก้าวเล็ก ตรวจซ้ำทุกก้าว และอ่าน diff เองเพราะ AI ปรับพฤติกรรมเล็ก ๆ โดยไม่แจ้งได้ ความเร็วที่ได้จาก AI ไม่ควรแลกกับการตรวจสอบ"},{"id":"PS-J-P-024","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J1","concept":"verify-ai-code-explanation","mobile":false,"type":"single","stem":"นักพัฒนาเจอฟังก์ชัน f ในโค้ดเก่าและถามผู้ช่วย AI ว่าทำอะไร AI ตอบอย่างมั่นใจว่า \"คำนวณเลขฟีโบนัชชีลำดับที่ n\" วิธีใดตรวจสอบคำอธิบายนี้ได้น่าเชื่อถือที่สุด","code":"function f(n: number): number {\n  return n > 1 ? n * f(n - 1) : 1;\n}","codeLang":"typescript","options":[{"id":"A","text":"ถาม AI ซ้ำว่ามั่นใจหรือไม่ ถ้าตอบเหมือนเดิมก็ใช้คำอธิบายนั้นได้","correct":false,"why":"AI ตอบซ้ำด้วยความมั่นใจเท่าเดิมได้แม้คำตอบผิด การถามซ้ำไม่ใช่การตรวจสอบกับโค้ดจริง"},{"id":"B","text":"ยึดตามคำอธิบายเพราะ AI อธิบายเป็นขั้นตอนอย่างละเอียด","correct":false,"why":"ความละเอียดของคำอธิบายไม่ได้รับประกันว่าถูก คำอธิบายที่ฟังดูสมเหตุสมผลอาจไม่ตรงกับโค้ดที่เขียนจริง"},{"id":"C","text":"เรียก f ด้วยค่าที่รู้คำตอบอยู่แล้ว เช่น f(5) แล้วเทียบกับคำอธิบาย","correct":true,"why":"ถูกต้อง f(5) ได้ 120 แต่ลำดับฟีโบนัชชีที่ 5 คือ 5 ผลรันจริงขัดกับคำอธิบาย (ฟังก์ชันนี้คือแฟกทอเรียล)"},{"id":"D","text":"เปลี่ยนชื่อฟังก์ชันเป็น fibonacci ตามที่ AI บอก แล้วรอดูว่ามีใครแจ้งปัญหา","correct":false,"why":"การตั้งชื่อตามคำอธิบายที่ยังไม่ได้ตรวจสอบจะฝังความเข้าใจผิดลงในโค้ดและทำให้คนอื่นหลงทางตาม"}],"explanation":"เมื่อใช้ AI อธิบายโค้ดที่ไม่คุ้น ให้ถือคำอธิบายเป็นข้อสันนิษฐานที่ต้องพิสูจน์ ทดลองรันด้วยอินพุตที่รู้คำตอบ ใส่ debugger หรือ log เพื่อดูค่าจริง ก่อนจะเชื่อหรือแก้ชื่อและเอกสารตามที่ AI บอก"},{"id":"PS-J-P-025","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J2","concept":"pii-secrets-in-crash-log","mobile":true,"type":"single","stem":"แอปมือถือของบริษัทเกิด crash บนเครื่องผู้ใช้ นักพัฒนาอยากให้แชตบอต AI สาธารณะ (ที่บริษัทยังไม่ได้อนุมัติให้ใช้กับข้อมูลลูกค้า) ช่วยวิเคราะห์สาเหตุ log ที่มีอยู่ประกอบด้วย stack trace, อีเมลของผู้ใช้, รหัสอุปกรณ์ และ access token ของผู้ใช้ วิธีใดเหมาะสมที่สุด","options":[{"id":"A","text":"วาง log ทั้งหมดตามที่ได้มา เพราะ AI ต้องเห็นบริบทครบถ้วนจึงวิเคราะห์สาเหตุได้แม่นยำที่สุด","correct":false,"why":"log ที่มี token และข้อมูลส่วนบุคคลของผู้ใช้ไม่ควรถูกส่งออกไปยังบริการภายนอกที่ไม่ได้รับอนุมัติ ข้อมูลที่ส่งไปแล้วเรียกคืนไม่ได้"},{"id":"B","text":"ตัดอีเมล รหัสอุปกรณ์ และ token ออกหรือแทนด้วยค่าตัวอย่างปลอม เหลือ stack trace และข้อความ error ที่จำเป็น","correct":true,"why":"ถูกต้อง ส่วนที่ AI ใช้วิเคราะห์ crash คือ stack trace และข้อความ error ข้อมูลส่วนบุคคลและ credential ไม่เกี่ยวกับสาเหตุจึงนำออกได้"},{"id":"C","text":"วาง log ทั้งหมดแต่เขียนใน prompt ว่าข้อมูลนี้เป็นความลับและห้ามนำไปใช้ต่อหรือเก็บไว้","correct":false,"why":"ข้อความใน prompt ไม่ได้ควบคุมว่าบริการจะเก็บหรือประมวลผลข้อมูลอย่างไร ข้อมูลถูกส่งออกไปแล้วตั้งแต่ตอนวาง"},{"id":"D","text":"แทนที่ token ด้วยเครื่องหมายดอกจัน แต่คงอีเมลและรหัสอุปกรณ์ไว้ เพราะสองอย่างนี้ไม่ใช่รหัสผ่าน","correct":false,"why":"อีเมลและรหัสอุปกรณ์อาจเป็นข้อมูลส่วนบุคคลที่ระบุตัวผู้ใช้ได้ตาม PDPA การปิดเฉพาะ token ยังทำให้ข้อมูลผู้ใช้รั่วออกไป"}],"explanation":"ก่อนส่งข้อมูลให้เครื่องมือ AI ภายนอก ให้ถามว่าส่วนไหนจำเป็นต่อการแก้ปัญหาจริง แล้วส่งเฉพาะส่วนนั้น ลบหรือปลอมข้อมูลส่วนบุคคล, token, รหัสผ่าน และข้อมูลลูกค้า และใช้เฉพาะเครื่องมือที่บริษัทอนุมัติให้ใช้กับข้อมูลระดับนั้น"},{"id":"PS-J-P-026","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J2","concept":"prompt-context-for-unit-tests","mobile":false,"type":"single","stem":"นักพัฒนาต้องการให้ผู้ช่วย AI เขียน unit test ให้ฟังก์ชัน calculateShipping(weightKg, isMember) ซึ่งคิดค่าส่งฟรีสำหรับสมาชิกที่พัสดุหนักไม่เกิน 5 กก. เปรียบเทียบ prompt ต่อไปนี้ prompt ใดมีแนวโน้มให้ผลที่นำไปใช้ได้ดีที่สุด","options":[{"id":"A","text":"เขียน unit test ด้วย Jest ให้ฟังก์ชัน calculateShipping ด้านล่าง ครอบคลุมสมาชิกและไม่ใช่สมาชิก ค่าขอบที่ 5 กก. ตอบเป็นโค้ดอย่างเดียว [วางโค้ดฟังก์ชัน]","correct":true,"why":"ถูกต้อง ระบุเครื่องมือ ใส่โค้ดจริง บอกกรณีที่ต้องครอบคลุม (รวมค่าขอบ) และรูปแบบคำตอบ AI จึงมีข้อมูลพอสร้าง test ที่ตรงกับพฤติกรรมของฟังก์ชัน"},{"id":"B","text":"ช่วยเขียน test ให้ฟังก์ชันนี้หน่อย ให้ครบทุกกรณีที่เป็นไปได้ และเขียนให้ดีที่สุดเหมือนมืออาชีพที่ทำงานมาหลายปี [วางโค้ดฟังก์ชัน]","correct":false,"why":"มีโค้ดแต่ไม่ระบุเครื่องมือทดสอบ กรณีที่ต้องการ และรูปแบบคำตอบ คำว่า \"ดีที่สุด\" และ \"ครบทุกกรณี\" ไม่ได้บอก AI ว่าต้องครอบคลุมอะไร"},{"id":"C","text":"คุณคือโปรแกรมเมอร์ที่เก่งที่สุดในโลกและไม่เคยทำผิดพลาด จงเขียน test ที่สมบูรณ์แบบ ครบทุกกรณี ให้ฟังก์ชัน calculateShipping โดยไม่มีข้อผิดพลาด","correct":false,"why":"ไม่มีโค้ดของฟังก์ชันและไม่มีกติกาธุรกิจ AI ต้องเดาพฤติกรรมเอง การกำหนดบทบาทที่เกินจริงไม่ได้เพิ่มข้อมูลที่จำเป็น"},{"id":"D","text":"เขียน test ให้ฟังก์ชัน calculateShipping โดยดูจากโค้ดทั้งโปรเจกต์ของร้านค้าที่แนบไป และให้ครอบคลุมมากที่สุดเท่าที่จะทำได้ในครั้งเดียว","correct":false,"why":"การแนบโค้ดทั้งโปรเจกต์โดยไม่ชี้ว่าให้ใช้ส่วนไหน ทำให้ข้อมูลที่เกี่ยวข้องปนกับข้อมูลที่ไม่เกี่ยว และยังไม่บอกกรณีหรือรูปแบบผลลัพธ์ที่ต้องการ"}],"explanation":"prompt ที่ดีให้บริบทที่จำเป็นและเจาะจง คือโค้ดหรือข้อมูลที่เกี่ยวข้อง เครื่องมือหรือกรอบที่ใช้ สิ่งที่ต้องครอบคลุม ข้อจำกัด และรูปแบบผลลัพธ์ การเพิ่มคำชมหรือกำหนดบทบาทเกินจริงไม่ทดแทนข้อมูลเหล่านี้"},{"id":"PS-J-P-027","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J2","concept":"responsible-ai-use-company-policy","mobile":false,"type":"multiple","stem":"บริษัทอนุญาตให้ใช้ผู้ช่วยเขียนโค้ด AI ที่ผ่านการอนุมัติแล้วกับโค้ดภายใน ข้อใดเป็นแนวปฏิบัติที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ระบุใน pull request ว่าส่วนใดสร้างด้วย AI ตามที่ทีมกำหนด เพื่อให้ผู้รีวิวตรวจส่วนนั้นอย่างละเอียด","correct":true,"why":"ถูกต้อง การเปิดเผยการใช้ AI ช่วยให้ผู้รีวิวรู้ว่าควรตรวจส่วนไหนเป็นพิเศษ"},{"id":"B","text":"วางสัญญาที่มีข้อมูลธุรกิจของลูกค้าลงในแชตบอต AI สาธารณะ เพื่อให้สรุปประเด็นสำคัญได้เร็วขึ้น","correct":false,"why":"สัญญาของลูกค้ามักมีข้อมูลที่ต้องรักษาความลับ การส่งให้บริการภายนอกที่ไม่ได้รับอนุมัติเสี่ยงต่อการละเมิดข้อตกลงและกฎหมาย"},{"id":"C","text":"เมื่อ AI ให้โค้ดก้อนใหญ่ที่ดูคัดลอกมา เช่น มีหัวไฟล์ระบุสัญญาอนุญาต ให้ตรวจเงื่อนไขการใช้งานก่อนนำไปใส่ในผลิตภัณฑ์","correct":true,"why":"ถูกต้อง โค้ดที่ AI สร้างอาจคล้ายกับโค้ดต้นฉบับที่มีเงื่อนไขสัญญาอนุญาต ผู้ที่นำไปใช้ต้องรับผิดชอบการตรวจสอบนี้"},{"id":"D","text":"ส่ง pull request ที่ AI เขียนทั้งหมดโดยไม่อ่านก่อน เพราะผู้รีวิวจะตรวจอีกรอบอยู่แล้ว","correct":false,"why":"ผู้ส่งโค้ดต้องรับผิดชอบโค้ดของตัวเองก่อนส่งรีวิว การปล่อยให้ผู้รีวิวเป็นด่านเดียวทำให้บั๊กที่ AI สร้างหลุดได้ง่าย"},{"id":"E","text":"ใช้เฉพาะเครื่องมือที่บริษัทอนุมัติ และไม่นำโค้ดหรือข้อมูลภายในไปใช้กับเครื่องมือที่ยังไม่ได้อนุมัติ","correct":true,"why":"ถูกต้อง เครื่องมือแต่ละตัวมีเงื่อนไขการเก็บและใช้ข้อมูลต่างกัน บริษัทอนุมัติหลังประเมินแล้วว่าเหมาะกับข้อมูลระดับใด"}],"explanation":"การใช้ AI อย่างรับผิดชอบคือใช้เครื่องมือที่ได้รับอนุมัติ ปกป้องข้อมูลที่เป็นความลับและข้อมูลส่วนบุคคล เปิดเผยการใช้ตามนโยบายทีม ตรวจที่มาและสัญญาอนุญาตของโค้ดที่ได้ และอ่านตรวจโค้ดเองก่อนส่งต่อ เพราะความรับผิดชอบต่อโค้ดยังเป็นของคนที่นำไปใช้"},{"id":"PS-J-P-028","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J1","concept":"ai-generated-assignment-bug","mobile":false,"type":"single","stem":"ผู้ช่วย AI สร้างโค้ดกรองผู้ใช้ที่มีสถานะ active ให้ นักพัฒนาลองรันกับผู้ใช้ 3 คน (active, banned, active) ก่อนนำไปใช้ เมื่อรันโค้ดด้านล่างจะพิมพ์ข้อความใด","code":"const users = [\n  { name: \"Anan\", status: \"active\" },\n  { name: \"Boon\", status: \"banned\" },\n  { name: \"Chai\", status: \"active\" },\n];\n\nconst activeUsers = users.filter((u) => (u.status = \"active\"));\nconsole.log(activeUsers.length, users[1].status);","codeLang":"typescript","options":[{"id":"A","text":"2 banned","correct":false,"why":"ผลนี้คือสิ่งที่นักพัฒนาตั้งใจ แต่ u.status = \"active\" เป็นการกำหนดค่า ไม่ใช่การเปรียบเทียบ"},{"id":"B","text":"3 banned","correct":false,"why":"ผู้ใช้ทั้ง 3 คนผ่านตัวกรองจริง แต่ในกระบวนการนั้นสถานะของ Boon ถูกเขียนทับเป็น active ไปแล้ว"},{"id":"C","text":"2 active","correct":false,"why":"จำนวนผู้ใช้ที่ผ่านตัวกรองคือ 3 ไม่ใช่ 2 เพราะค่าที่ถูกกำหนดคือ \"active\" ซึ่งเป็นค่าจริงเสมอ"},{"id":"D","text":"3 active","correct":true,"why":"ถูกต้อง การกำหนดค่า u.status = \"active\" คืนค่า \"active\" ซึ่งเป็นค่าจริงทุกรอบ ทุกคนผ่านตัวกรอง และสถานะของ Boon ถูกเปลี่ยนเป็น active ด้วย"}],"explanation":"โค้ดจาก AI อ่านแล้วดูสมเหตุสมผลได้แม้มีบั๊กเล็ก ๆ เช่น ใช้ = แทน === การทดสอบด้วยข้อมูลที่มีทั้งแถวที่ควรผ่านและไม่ควรผ่าน (และตรวจว่าข้อมูลต้นฉบับไม่ถูกแก้) จับบั๊กนี้ได้ ส่วน linter ที่เปิดกฎเตือนการกำหนดค่าในเงื่อนไขก็ช่วยได้"},{"id":"PS-J-P-029","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J2","concept":"follow-up-prompt-failing-case","mobile":false,"type":"multiple","stem":"AI สร้างฟังก์ชัน formatThaiPhone ที่แปลงเบอร์โทรเป็นรูปแบบ 081-234-5678 เมื่อทดสอบกับอินพุต +66812345678 กลับได้ผลที่ผิดรูปแบบ นักพัฒนาจะตอบกลับ AI เพื่อให้แก้ได้ตรงจุด ข้อความตอบกลับควรมีองค์ประกอบใด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"พิมพ์คำสั่งเดิมซ้ำอีกครั้ง พร้อมเน้นว่าต้องไม่ผิดพลาดอีก","correct":false,"why":"การเน้นย้ำไม่ได้เพิ่มข้อมูลว่าผิดตรงไหน AI ยังไม่รู้ว่าอินพุตแบบไหนทำให้พัง"},{"id":"B","text":"ระบุอินพุตที่ใช้จริง ผลที่ได้ และผลที่คาดหวัง เช่น อินพุต +66812345678 คาดหวัง 081-234-5678","correct":true,"why":"ถูกต้อง ตัวอย่างที่ล้มเหลวพร้อมผลที่คาดหวังเป็นข้อมูลที่เจาะจงที่สุด ทำให้ AI เห็นช่องว่างระหว่างโค้ดกับความต้องการ"},{"id":"C","text":"สั่งให้ลองใหม่หลายแบบแล้วเลือกแบบที่รันผ่านตัวอย่างแรกที่เจอ","correct":false,"why":"โค้ดที่ผ่านตัวอย่างเดียวอาจพังกับรูปแบบอินพุตอื่น เช่น เบอร์ที่มีขีดหรือช่องว่าง การสุ่มหลายแบบไม่ได้แก้สาเหตุ"},{"id":"D","text":"ระบุข้อจำกัดที่ต้องคงไว้ เช่น ห้ามเปลี่ยนชื่อและพารามิเตอร์ของฟังก์ชัน และให้แก้เฉพาะส่วนที่ผิด","correct":true,"why":"ถูกต้อง ข้อจำกัดช่วยให้การแก้ไม่ทำลายส่วนที่ใช้งานได้อยู่และผู้เรียกฟังก์ชันเดิมยังทำงานต่อไปได้"},{"id":"E","text":"ล้างบทสนทนาแล้วเริ่มใหม่ด้วยคำสั่งสั้น ๆ ว่าช่วยเขียนฟังก์ชันแปลงเบอร์โทร","correct":false,"why":"การเริ่มใหม่ทิ้งบริบทที่สะสมมา รวมถึงโค้ดและอินพุตที่ทำให้พัง ซึ่งเป็นข้อมูลที่ช่วยให้แก้ได้ตรงจุด"}],"explanation":"เมื่อผลลัพธ์จาก AI ผิด ให้ป้อนหลักฐานที่ตรวจสอบได้กลับไป ได้แก่ อินพุตที่ล้มเหลว ผลจริง ผลที่คาดหวัง และสิ่งที่ห้ามเปลี่ยน การสั่งซ้ำพร้อมเน้นย้ำหรือสุ่มลองหลายครั้งไม่เพิ่มข้อมูล"},{"id":"PS-J-P-030","level":"junior","pool":"practice","competency":"Prompt & AI","descriptor":"AI-J1","concept":"review-ai-mobile-permissions","mobile":true,"type":"multiple","stem":"นักพัฒนาแอปมือถือให้ผู้ช่วย AI สร้างหน้าค้นหาสาขาใกล้ฉัน โค้ดที่ได้ขอสิทธิ์ตำแหน่งแบบใช้งานตลอดเวลา (รวมตอนแอปอยู่เบื้องหลัง) ขอสิทธิ์เข้าถึงรายชื่อผู้ติดต่อ และส่งตำแหน่งผู้ใช้ไปยังบริการวิเคราะห์ของบุคคลที่สาม ก่อนนำโค้ดนี้ไปใช้ ข้อใดเป็นการตรวจสอบที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ถ้าแอปรันบนเครื่องจำลองแล้วค้นหาสาขาได้ ก็นำโค้ดนี้ไปใช้ต่อได้","correct":false,"why":"การที่ฟีเจอร์ทำงานได้ไม่ได้บอกว่าสิทธิ์และการส่งข้อมูลพอเหมาะกับความจำเป็น ปัญหาด้านความเป็นส่วนตัวไม่แสดงในการทดลองใช้งานทั่วไป"},{"id":"B","text":"เทียบสิทธิ์ที่โค้ดขอกับสิ่งที่ฟีเจอร์ต้องใช้จริง แล้วตัดสิทธิ์ส่วนเกินออก เช่น ใช้ตำแหน่งเฉพาะตอนใช้งานแอป และไม่ขอรายชื่อผู้ติดต่อ","correct":true,"why":"ถูกต้อง ฟีเจอร์ค้นหาสาขาใกล้ตัวไม่จำเป็นต้องรู้ตำแหน่งตอนอยู่เบื้องหลังหรืออ่านรายชื่อผู้ติดต่อ การขอเท่าที่จำเป็นลดความเสี่ยงด้านข้อมูลส่วนบุคคล"},{"id":"C","text":"ให้ AI ประเมินเองว่าโค้ดที่มันสร้างปลอดภัยและตรงตามนโยบายของสโตร์หรือไม่ แล้วเชื่อผลประเมินนั้น","correct":false,"why":"AI อาจประเมินโค้ดของตัวเองผิดหรือไม่รู้นโยบายล่าสุดของสโตร์ ผู้พัฒนายังต้องตรวจเทียบกับนโยบายจริงเอง"},{"id":"D","text":"ตรวจว่าโค้ดส่งข้อมูลผู้ใช้ไปบริการภายนอกหรือไม่ และสอดคล้องกับนโยบายความเป็นส่วนตัวของแอปและข้อมูลที่ต้องแจ้งตอนส่งแอปเข้าสโตร์หรือไม่","correct":true,"why":"ถูกต้อง การส่งตำแหน่งให้บุคคลที่สามต้องเปิดเผยตามนโยบายความเป็นส่วนตัวและแบบฟอร์มข้อมูลของสโตร์ และอาจต้องได้รับความยินยอมจากผู้ใช้"}],"explanation":"โค้ดที่ AI สร้างอาจเพิ่มสิทธิ์และการเชื่อมต่อเกินจำเป็น สำหรับแอปมือถือต้องตรวจว่าขอสิทธิ์เท่าที่ฟีเจอร์ต้องใช้ และข้อมูลผู้ใช้ไม่ถูกส่งออกไปโดยไม่ได้แจ้งหรือขอความยินยอม ซึ่งกระทบทั้งความเป็นส่วนตัวของผู้ใช้และการผ่านการตรวจของสโตร์"}],"exam":[{"id":"PS-J-E-001","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"nested-loop-iteration-count","mobile":false,"type":"single","stem":"ระบบจัดที่นั่งต้องนับจำนวนคู่ที่นั่ง (i, j) ในโซนที่นั่งหมายเลข 1 ถึง 3 โดย j ต้องไม่น้อยกว่า i เมื่อรันโค้ดด้านล่างจะพิมพ์ค่าใด","code":"let count = 0;\n\nfor (let i = 1; i \u003c= 3; i++) {\n  for (let j = i; j \u003c= 3; j++) {\n    count++;\n  }\n}\n\nconsole.log(count);","codeLang":"typescript","options":[{"id":"A","text":"9","correct":false,"why":"ผลนี้ได้เมื่อลูปในเริ่มที่ j = 1 ทุกรอบ จึงวน 3 รอบต่อค่า i แต่โค้ดนี้กำหนด j เริ่มที่ค่าเดียวกับ i"},{"id":"B","text":"6","correct":true,"why":"ถูกต้อง เมื่อ i = 1 ลูปในวน 3 รอบ (j = 1, 2, 3) เมื่อ i = 2 วน 2 รอบ และเมื่อ i = 3 วน 1 รอบ รวม 3 + 2 + 1 = 6"},{"id":"C","text":"3","correct":false,"why":"ผลนี้เท่ากับจำนวนรอบของลูปนอกอย่างเดียว แต่ลูปในทำให้ count เพิ่มหลายครั้งต่อหนึ่งค่า i"},{"id":"D","text":"5","correct":false,"why":"ผลนี้ได้เมื่อลูปในของ i = 1 วนเพียง 2 รอบ แต่เงื่อนไข j \u003c= 3 ทำให้วน 3 รอบ"}],"explanation":"จำนวนรอบของลูปซ้อนเท่ากับผลรวมของจำนวนรอบลูปในในแต่ละรอบของลูปนอก ถ้าค่าเริ่มของลูปในขึ้นกับตัวแปรของลูปนอก ให้เขียนตารางค่า i แล้วนับ j ที่เกิดขึ้นทีละแถวแทนการคูณจำนวนรอบเอาเอง"},{"id":"PS-J-E-002","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"case-sensitive-contact-search","mobile":true,"type":"single","stem":"ช่องค้นหารายชื่อในแอปมือถือกรองรายชื่อด้วย includes เมื่อผู้ใช้พิมพ์ \"som\" โค้ดด้านล่างจะพิมพ์ผลใด","code":"const contacts = [\"Somchai\", \"Napat\", \"somsri\", \"Malee\"];\nconst keyword = \"som\";\n\nconst result = contacts.filter((name) => name.includes(keyword));\nconsole.log(result.join(\",\"));","codeLang":"typescript","options":[{"id":"A","text":"Somchai,somsri","correct":false,"why":"ผลนี้ต้องให้การเทียบข้อความไม่สนตัวพิมพ์เล็กใหญ่ แต่ includes แยกตัวพิมพ์ใหญ่ S ออกจาก s"},{"id":"B","text":"Somchai","correct":false,"why":"ชื่อ Somchai ขึ้นต้นด้วย S ตัวพิมพ์ใหญ่ จึงไม่ตรงกับ som ที่เป็นตัวพิมพ์เล็กทั้งหมด"},{"id":"C","text":"somsri","correct":true,"why":"ถูกต้อง includes เทียบแบบแยกตัวพิมพ์เล็กใหญ่ มีเพียง somsri ที่มีข้อความ som ตัวพิมพ์เล็กอยู่จริง"},{"id":"D","text":"บรรทัดว่าง เพราะ includes ใช้ได้กับ array เท่านั้น ไม่ใช้กับข้อความ","correct":false,"why":"includes ใช้ได้ทั้ง array และข้อความ และ somsri มี som อยู่จริง จึงมีผลลัพธ์"}],"explanation":"การค้นหาข้อความที่ผู้ใช้พิมพ์ควรทำให้เป็นรูปแบบเดียวกันก่อนเทียบ เช่น toLowerCase ทั้งชื่อและคำค้น เพราะผู้ใช้ไม่ได้สนใจตัวพิมพ์เล็กใหญ่ ส่วนภาษาไทยไม่มีตัวพิมพ์เล็กใหญ่ แต่ควรระวังการปรับรูปข้อความอื่น เช่น ช่องว่างหน้าท้าย"},{"id":"PS-J-E-003","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J1","concept":"boolean-flag-parameters","mobile":false,"type":"single","stem":"ผู้รีวิวบอกว่าบรรทัดที่เรียก createInvoice ในโค้ดด้านล่างอ่านแล้วไม่รู้ว่า true และ false หมายถึงอะไร และสลับตำแหน่งกันโดยไม่รู้ตัวได้ วิธีแก้ใดทำให้จุดเรียกอ่านง่ายและกันการสลับตำแหน่งได้ดีที่สุด","code":"function createInvoice(order: Order, sendEmail: boolean, includeVat: boolean) {\n  // ...\n}\n\ncreateInvoice(order, true, false);","codeLang":"typescript","options":[{"id":"A","text":"เปลี่ยนเป็นรับอ็อบเจ็กต์ options เรียกเป็น createInvoice(order, { sendEmail: true, includeVat: false })","correct":true,"why":"ถูกต้อง ชื่อ field อยู่ที่จุดเรียกจึงอ่านรู้ความหมาย และการสลับลำดับ field ไม่ทำให้ค่าผิดตำแหน่ง"},{"id":"B","text":"เพิ่มคอมเมนต์ท้ายบรรทัดที่เรียกว่า // sendEmail, includeVat เพื่อบอกลำดับของค่า และใส่คอมเมนต์เดียวกันทุกจุดที่เรียกฟังก์ชันนี้","correct":false,"why":"คอมเมนต์ไม่ได้ถูกตรวจโดยคอมไพเลอร์ ถ้าสลับค่าหรือแก้ฟังก์ชันภายหลัง คอมเมนต์อาจไม่ตรงกับโค้ดโดยไม่มีใครรู้"},{"id":"C","text":"สลับลำดับพารามิเตอร์ให้ includeVat มาก่อน sendEmail เพราะเป็นข้อมูลที่สำคัญกว่า","correct":false,"why":"การสลับลำดับไม่ได้ทำให้จุดเรียกอ่านรู้ความหมาย และการส่งค่าผิดตำแหน่งก็ยังไม่ถูกตรวจ เพราะทั้งสองตัวเป็นชนิด boolean"},{"id":"D","text":"แยกเป็นหลายฟังก์ชัน เช่น createInvoiceWithEmailNoVat ให้ครบทุกชุดค่า true และ false","correct":false,"why":"จำนวนฟังก์ชันเพิ่มตามชุดค่าที่ผสมกันได้ และชื่อยาวขึ้นเรื่อย ๆ ทำให้ดูแลรักษายากกว่าเดิม"}],"explanation":"พารามิเตอร์ boolean หลายตัวติดกันทำให้จุดเรียกอ่านยากและสลับกันง่าย การส่งเป็นอ็อบเจ็กต์ที่มีชื่อ field (named arguments) ช่วยให้จุดเรียกบอกความหมายได้ในตัว และ TypeScript ยังตรวจชื่อ field ให้ด้วย"},{"id":"PS-J-E-004","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"thai-string-length-limit","mobile":false,"type":"single","stem":"ฟอร์มสมัครสมาชิกกำหนดให้ชื่อเล่นยาวไม่เกิน 5 ตัวอักษร ผู้ใช้กรอก \"สวัสดี\" ซึ่งเห็นบนหน้าจอเป็น 4 ตำแหน่ง (ส วั ส ดี) เมื่อรันโค้ดด้านล่างจะพิมพ์ผลใด","code":"const nickname = \"สวัสดี\";\n\nconsole.log(nickname.length, nickname.length \u003c= 5);","codeLang":"typescript","options":[{"id":"A","text":"4 true เพราะ length นับตำแหน่งตัวอักษรตามที่เห็นบนหน้าจอ","correct":false,"why":"length ไม่ได้นับตามที่ตามองเห็น สระบนและวรรณยุกต์แต่ละตัวเป็นอักขระแยกในข้อความ จึงถูกนับด้วย"},{"id":"B","text":"5 true เพราะสระและวรรณยุกต์ไม่ถูกนับรวมใน length","correct":false,"why":"สระและวรรณยุกต์เป็นอักขระที่มีตำแหน่งของตัวเองในข้อความ และ length นับรวมทุกตัว"},{"id":"C","text":"18 false เพราะตัวอักษรไทยหนึ่งตัวใช้ 3 ไบต์ในการเข้ารหัส และ length นับเป็นจำนวนไบต์ทั้งหมด","correct":false,"why":"ขนาดในไบต์ขึ้นกับรูปแบบการเข้ารหัส แต่ length ของสตริงนับหน่วยอักขระ ไม่ใช่ไบต์"},{"id":"D","text":"6 false เพราะ length นับทุกอักขระรวมสระและวรรณยุกต์ ส ว ั ส ด ี เป็น 6 ตัว","correct":true,"why":"ถูกต้อง ข้อความนี้ประกอบด้วย 6 อักขระ เพราะสระ ั และ ี เป็นอักขระแยก จึงเกินเกณฑ์ 5"}],"explanation":"จำนวนอักขระที่โปรแกรมนับกับจำนวนตำแหน่งที่ผู้ใช้เห็นบนหน้าจอไม่ตรงกันเสมอไปในภาษาไทย เพราะสระบน สระล่าง และวรรณยุกต์เป็นอักขระที่ประกอบกับพยัญชนะ เมื่อกำหนดข้อจำกัดความยาวของข้อความภาษาไทย ควรตกลงกันว่านับแบบใด และทดสอบด้วยคำที่มีสระและวรรณยุกต์"},{"id":"PS-J-E-005","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"bubble-sort-single-pass","mobile":false,"type":"multiple","stem":"โค้ดด้านล่างเดินผ่าน array หนึ่งรอบตามแบบ bubble sort ข้อใดเป็นจริงเกี่ยวกับผลของโค้ดนี้ (เลือกทุกข้อที่ถูก)","code":"const a = [5, 1, 4, 2, 8];\nlet swaps = 0;\n\nfor (let j = 0; j \u003c a.length - 1; j++) {\n  if (a[j] > a[j + 1]) {\n    const tmp = a[j];\n    a[j] = a[j + 1];\n    a[j + 1] = tmp;\n    swaps++;\n  }\n}\n\nconsole.log(a.join(\",\"), swaps);","codeLang":"typescript","options":[{"id":"A","text":"หลังรอบเดียว array เป็น 1,2,4,5,8 เรียงครบแล้ว","correct":false,"why":"เมื่อเดินรอบเดียว ค่า 2 ยังอยู่หลัง 4 (ผลคือ 1,4,2,5,8) จึงต้องเดินรอบต่อไปอีกอย่างน้อยหนึ่งรอบ"},{"id":"B","text":"หลังรอบเดียว array เป็น 1,4,2,5,8 ซึ่งยังเรียงไม่ครบ","correct":true,"why":"ถูกต้อง ค่า 5 ถูกสลับไปทางขวาจนไปหยุดหน้า 8 แต่ 4 กับ 2 ยังอยู่ผิดลำดับ"},{"id":"C","text":"มีการสลับค่าเกิดขึ้น 3 ครั้ง","correct":true,"why":"ถูกต้อง 5 สลับกับ 1, 4 และ 2 ตามลำดับ ส่วนคู่ 5 กับ 8 ไม่ต้องสลับ"},{"id":"D","text":"มีการสลับค่าเกิดขึ้น 4 ครั้ง เพราะมีการเปรียบเทียบ 4 คู่และทุกคู่สลับ","correct":false,"why":"มีการเปรียบเทียบ 4 คู่จริง แต่คู่สุดท้าย (5 กับ 8) เรียงถูกอยู่แล้วจึงไม่สลับ"}],"explanation":"bubble sort เปรียบเทียบคู่ที่อยู่ติดกันและสลับเมื่อลำดับผิด การเดินหนึ่งรอบดันค่ามากที่สุดไปท้ายรายการ แต่ยังไม่ทำให้ทั้งรายการเรียงครบ จึงต้องเดินซ้ำหลายรอบ ตอน trace ให้เขียนสถานะของ array หลังการเปรียบเทียบแต่ละครั้ง"},{"id":"PS-J-E-006","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"discount-boundary-comparison","mobile":false,"type":"single","stem":"โปรโมชันระบุว่า ซื้อครบ 1,000 บาทขึ้นไปลด 10% และซื้อครบ 500 บาทขึ้นไปลด 5% เมื่อรันโค้ดด้านล่างจะพิมพ์ผลใด","code":"function discountRate(total: number): number {\n  if (total > 1000) return 0.1;\n  if (total > 500) return 0.05;\n  return 0;\n}\n\nconsole.log(discountRate(1000), discountRate(500), discountRate(501));","codeLang":"typescript","options":[{"id":"A","text":"0.1 0.05 0.05","correct":false,"why":"ผลนี้ตรงตามโปรโมชัน แต่เงื่อนไข > ไม่รวมค่าที่เท่ากับ 1000 และ 500"},{"id":"B","text":"0.05 0 0.05","correct":true,"why":"ถูกต้อง 1000 ไม่ผ่านเงื่อนไข total > 1000 จึงตกไปที่ขั้น 5% ส่วน 500 ไม่ผ่านทั้งสองเงื่อนไขจึงได้ 0 ลูกค้าที่ซื้อครบพอดีได้ส่วนลดต่ำกว่าที่ประกาศ"},{"id":"C","text":"0.05 0.05 0.05","correct":false,"why":"500 ไม่มากกว่า 500 จึงไม่ผ่านเงื่อนไขขั้น 5%"},{"id":"D","text":"0.1 0 0.05","correct":false,"why":"1000 ไม่มากกว่า 1000 จึงไม่ได้ 10%"}],"explanation":"ข้อความอย่าง \"ครบ X ขึ้นไป\" ต้องใช้ >= ไม่ใช่ > ปัญหาขอบเขตเกิดที่ค่าที่เท่ากับเกณฑ์พอดี ซึ่งมักไม่ถูกทดสอบ เวลาทดสอบเงื่อนไขช่วงให้ลองค่าก่อนเกณฑ์ ที่เกณฑ์ และหลังเกณฑ์เสมอ"},{"id":"PS-J-E-007","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J1","concept":"naming-convention-violations","mobile":false,"type":"multiple","stem":"ทีมกำหนด convention ว่าชื่อ interface ใช้ PascalCase ชื่อฟังก์ชันและตัวแปรทั่วไปใช้ camelCase และค่าคงที่ที่กำหนดครั้งเดียวใช้ UPPER_SNAKE_CASE ชื่อใดในโค้ดด้านล่างไม่เป็นไปตาม convention (เลือกทุกข้อที่ถูก)","code":"interface userProfile {\n  id: string;\n  displayName: string;\n}\n\nconst MAX_RETRY = 3;\nlet isLoading = false;\n\nfunction FetchUser(id: string): userProfile {\n  return { id, displayName: \"\" };\n}","codeLang":"typescript","options":[{"id":"A","text":"MAX_RETRY","correct":false,"why":"เป็นไปตาม convention เพราะเป็นค่าคงที่ที่กำหนดครั้งเดียวและใช้ UPPER_SNAKE_CASE"},{"id":"B","text":"isLoading","correct":false,"why":"เป็นไปตาม convention เพราะเป็นตัวแปรทั่วไปและใช้ camelCase"},{"id":"C","text":"userProfile","correct":true,"why":"ถูกต้อง ชื่อ interface ต้องเป็น PascalCase คือ UserProfile"},{"id":"D","text":"displayName","correct":false,"why":"เป็นไปตาม convention เพราะชื่อ field ใช้ camelCase"},{"id":"E","text":"FetchUser","correct":true,"why":"ถูกต้อง ชื่อฟังก์ชันต้องเป็น camelCase คือ fetchUser"}],"explanation":"convention ด้านการตั้งชื่อช่วยให้ผู้อ่านรู้ชนิดของสิ่งที่เห็นจากรูปแบบชื่อทันที เครื่องมืออย่าง ESLint ตั้งกฎตรวจให้อัตโนมัติได้ ทำให้การรีวิวไม่ต้องเสียเวลากับเรื่องนี้"},{"id":"PS-J-E-008","level":"junior","pool":"exam","competency":"Program Coding","descriptor":"PRG-J2","concept":"uninitialized-counter-map","mobile":false,"type":"single","stem":"โค้ดด้านล่างนับจำนวนครั้งที่แต่ละคำปรากฏใน array เมื่อรันแล้วพิมพ์ผล จะได้ผลใด","code":"const counts: Record\u003cstring, number> = {};\n\nfor (const word of [\"a\", \"b\", \"a\"]) {\n  counts[word] = counts[word] + 1;\n}\n\nconsole.log(counts.a, counts.b);","codeLang":"typescript","
