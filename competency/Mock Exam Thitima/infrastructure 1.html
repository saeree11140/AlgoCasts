<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>ข้อสอบซ้อม Infrastructure &amp; DevOps</title>
<style>
/* Soft "warm paper" theme — easier on the eyes for long reading sessions */
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --surface-2: #f1ebdf;
  --fg: #3a352d;
  --muted: #6b6357;
  --border: #e3dccd;
  --border-strong: #cfc6b4;
  --accent: #2f6f6a;
  --accent-soft: #e3efec;
  --accent-fg: #ffffff;
  --ok: #2e7048;
  --ok-bg: #e7f2e9;
  --bad: #a8433c;
  --bad-bg: #f9ebe8;
  --warn: #855d12;
  --warn-bg: #faf0da;
  --focus: #c27a1a;
  --code-bg: #f4efe4;
  --shadow: 0 1px 2px rgba(80, 60, 30, 0.05), 0 2px 8px rgba(80, 60, 30, 0.04);
  --radius: 14px;
  --radius-sm: 10px;
  --gutter: 20px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", "Thonburi", "Leelawadee UI", Tahoma, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1d1a;
    --surface: #282521;
    --surface-2: #322e29;
    --fg: #e6dfd2;
    --muted: #b3aa9b;
    --border: #3d3832;
    --border-strong: #554e45;
    --accent: #7fc3bb;
    --accent-soft: #243532;
    --accent-fg: #13201f;
    --ok: #8fd1a4;
    --ok-bg: #1e3026;
    --bad: #f0a097;
    --bad-bg: #3a2420;
    --warn: #e8c47a;
    --warn-bg: #362c18;
    --focus: #f0b45e;
    --code-bg: #24211d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.8;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--gutter);
  padding-bottom: 64px;
}

h1, h2, h3 { line-height: 1.4; margin: 0 0 10px; font-weight: 650; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 14px; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
[tabindex="-1"]:focus { outline: none; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.muted { color: var(--muted); }
.small { font-size: 0.92rem; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* buttons */
.btn {
  font: inherit;
  min-height: 46px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
  font-weight: 600;
}

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

/* start screen */
fieldset {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px var(--gutter) var(--gutter);
  margin: 0 0 16px;
  min-width: 0;
  background: var(--surface);
  box-shadow: var(--shadow);
}
legend { font-weight: 650; padding: 0 8px; }

.choice {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.choice:hover { background: var(--surface-2); }
.choice input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice input:focus-visible { outline: none; }
.choice .text { min-width: 0; }

.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input[type="number"] {
  font: inherit;
  width: 8rem;
  min-height: 46px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--fg);
}
.error {
  color: var(--bad);
  background: var(--bad-bg);
  border: 1px solid var(--bad);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
}

/* quiz header */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.9rem;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.15rem;
  padding: 4px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.timer.low { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

/* exam only: the header (timer + warning banner) stays on screen while scrolling */
.sticky-head {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.sticky-head .topbar { margin-bottom: 0; }
.time-banner {
  margin-top: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--warn);
  background: var(--warn-bg);
  color: var(--warn);
  font-weight: 650;
}
.time-banner.urgent { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
/* focusing a question title or feedback must not leave it under the sticky header */
.sticky-head ~ .card .qtitle,
.sticky-head ~ .card .feedback { scroll-margin-top: 10rem; }
.score-line { font-weight: 600; }

/* question */
.qtitle { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.01em; }
.multi-note {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 12px;
  border-radius: 8px;
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid var(--warn);
  font-weight: 600;
  font-size: 0.95rem;
}
.stem { font-size: 1.14rem; line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }

pre.code {
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  max-width: 100%;
  font-family: var(--mono);
  font-size: 0.88rem;
  line-height: 1.6;
  tab-size: 2;
}
pre.code code {
  font: inherit;
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
}

.options { border: 0; padding: 0; margin: 0 0 16px; background: transparent; box-shadow: none; }
.opt {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
label.opt { cursor: pointer; }
label.opt:hover { background: var(--surface-2); border-color: var(--border-strong); }
label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
label.opt input { margin: 7px 0 0; flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
label.opt input:focus-visible { outline: none; }
.letter {
  flex: 0 0 auto;
  min-width: 1.75em;
  height: 1.75em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 700;
  font-size: 0.85rem;
  margin-top: 3px;
}
label.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt-body { flex: 1 1 auto; min-width: 0; }
.opt-text { white-space: pre-wrap; }

.opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag {
  font-size: 0.85rem;
  font-weight: 650;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.sel { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.why { margin: 6px 0 0; font-size: 0.97rem; line-height: 1.75; color: var(--muted); }
.opt.is-correct .why, .opt.is-wrong .why { color: var(--fg); }

.feedback {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px var(--gutter);
  margin: 0 0 16px;
  background: var(--surface-2);
}
.feedback h3 { margin-bottom: 6px; }
.feedback .points { font-weight: 700; }
.feedback .points.pos { color: var(--ok); }
.feedback .points.neg { color: var(--bad); }
.explain { white-space: pre-wrap; margin: 10px 0 0; line-height: 1.85; }

/* navigation + palette */
.qnav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.qnav .spacer { flex: 1 1 0; }

.palette-wrap { margin-top: 14px; }
.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.pal {
  position: relative;
  font: inherit;
  font-size: 0.95rem;
  min-height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  padding: 0;
  transition: background-color 0.15s ease;
}
.pal:hover { background: var(--surface-2); }
.pal.answered { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.pal.current { outline: 3px solid var(--focus); outline-offset: 1px; }
.pal.flagged::after {
  content: "\2691";
  position: absolute;
  top: -2px;
  right: 3px;
  font-size: 0.8rem;
  color: var(--warn);
  text-shadow: 0 0 2px var(--surface);
}
.pal.answered.flagged::after { color: var(--accent-fg); text-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9rem; color: var(--muted); }

/* results */
.big-score { font-size: 2.2rem; font-weight: 750; line-height: 1.2; margin: 6px 0; color: var(--accent); }
.desc-row { padding: 12px 0; border-top: 1px solid var(--border); }
.desc-row:first-child { border-top: 0; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.review-item { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gutter); margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow); }
.review-item.unanswered { border-color: var(--warn); }

/* review screen */
#app.wide { max-width: 1120px; }
.rv-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.rv-filter { display: block; width: 100%; max-width: 100%; font: inherit; min-height: 46px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); }
code.ic { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); border: 1px solid var(--border); overflow-wrap: anywhere; }
mark { background: var(--warn-bg); color: var(--fg); border-bottom: 2px solid var(--warn); border-radius: 3px; padding: 0 1px; }

.rv-toolbar { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin: 6px 0 4px; }
.rv-prog { flex: 1 1 240px; min-width: 0; }
.rv-prog-text { font-size: 0.95rem; color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
.rv-prog .bar { margin-top: 0; }
.rv-tools { display: flex; flex-wrap: wrap; gap: 10px; }

.rv-layout { margin-top: 0; }
.rv-below { margin-top: 16px; }
.rv-side { display: none; }
.rv-main { min-width: 0; font-size: 1.05rem; line-height: 1.75; max-width: calc(72ch + 2 * var(--gutter) + 2px); margin: 0 auto; }
.rv-side[hidden], .rv-toc-m[hidden] { display: none !important; }

/* table of contents */
.rv-toc-title { font-size: 1.05rem; margin: 0 0 4px; }
.rv-toc-h { font-size: 0.82rem; font-weight: 650; color: var(--muted); margin: 14px 0 4px; line-height: 1.4; }
.rv-toc-list { list-style: none; margin: 0; padding: 0; }
.rv-toc-list a { display: flex; gap: 6px; align-items: baseline; min-height: 44px; padding: 8px 8px; border-radius: 8px; color: var(--fg); text-decoration: none; line-height: 1.45; font-size: 0.97rem; }
.rv-toc-list a:hover { background: var(--accent-soft); }
.rv-tick { flex: 0 0 1.1em; visibility: hidden; color: var(--ok); font-weight: 700; }
.rv-toc-list a.read .rv-tick { visibility: visible; }
.rv-tl { min-width: 0; }
.rv-toc-m { margin: 0 0 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.rv-toc-m > summary { cursor: pointer; min-height: 48px; padding: 10px var(--gutter); font-weight: 650; display: flex; align-items: center; }
.rv-toc-m .rv-toc-body { padding: 0 calc(var(--gutter) - 8px) var(--gutter); }

@media (min-width: 1000px) {
  .rv-layout { display: grid; grid-template-columns: 280px minmax(0, calc(72ch + 2 * var(--gutter) + 2px)); justify-content: center; gap: 36px; align-items: start; }
  .rv-main { margin: 0; width: 100%; }
  .rv-side { display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px 6px 12px 0; }
  .rv-toc-m { display: none; }
  .rv-toc-list a { min-height: 34px; padding: 5px 8px; }
}

/* topic card (accordion) */
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
.rv-card[open] { border-color: var(--accent); }
.rv-sum { display: flex; align-items: center; gap: 12px; padding: 14px var(--gutter); min-height: 60px; cursor: pointer; list-style: none; border-radius: var(--radius); }
.rv-sum::-webkit-details-marker { display: none; }
.rv-sum::marker { content: ''; }
.rv-sum:hover { background: var(--surface-2); }
.rv-sum::after { content: ''; flex: 0 0 auto; width: 0.55em; height: 0.55em; margin: 0 4px 0 2px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.15s ease; }
.rv-card[open] > .rv-sum::after { transform: rotate(-135deg); }
.rv-badge { flex: 0 0 auto; min-width: 2.8em; text-align: center; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-weight: 650; font-size: 0.9rem; line-height: 1.6; }
.rv-sum-main { flex: 1 1 auto; min-width: 0; display: block; }
.rv-sum-main h3 { margin: 0; font-size: 1.1rem; line-height: 1.5; }
.rv-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; }
.rv-meta { font-size: 0.88rem; color: var(--muted); }
.rv-readtag { font-size: 0.8rem; line-height: 1.5; padding: 0 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.rv-readtag[hidden] { display: none; }

.rv-body { padding: 6px var(--gutter) var(--gutter); }
.rv-body > * + * { margin-top: 28px; }
.rv-body > .rv-name { margin-top: 10px; margin-bottom: 0; }
.rv-lead { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px 16px; font-size: 1.12rem; line-height: 1.7; }
.rv-lead p { margin: 0; }
.rv-lab-top { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; line-height: 1.5; }
.rv-sec-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 12px; font-size: 1.05rem; line-height: 1.5; }
.rv-count { font-size: 0.85rem; font-weight: 400; color: var(--muted); }

.rv-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rv-point { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.rv-num { flex: 0 0 auto; width: 2rem; height: 2rem; margin-top: 0.1rem; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 650; line-height: 1; }
.rv-pt { min-width: 0; }
.rv-term { display: block; font-weight: 650; margin-bottom: 2px; }
.rv-rest { display: block; }

.rv-qa { display: grid; gap: 10px; }
.rv-qa-head { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0 14px; font-size: 0.82rem; font-weight: 650; color: var(--muted); }
.rv-qa-row { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.rv-qa-row.full { grid-template-columns: 1fr; }
.rv-q { padding: 12px 14px; background: var(--surface-2); min-width: 0; }
.rv-a { padding: 12px 14px; background: var(--ok-bg); border-left: 4px solid var(--ok); min-width: 0; }
.rv-lab { display: block; font-size: 0.78rem; font-weight: 650; line-height: 1.5; margin-bottom: 2px; color: var(--muted); }
.rv-a .rv-lab { color: var(--ok); }
@media (min-width: 561px) {
  .rv-qa .rv-lab { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}
@media (max-width: 560px) {
  .rv-qa-head { display: none; }
  .rv-qa-row { grid-template-columns: 1fr; }
  .rv-a { border-left: 0; border-top: 4px solid var(--ok); }
}

.rv-pits { display: grid; gap: 10px; }
.rv-pit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: var(--radius-sm); }
.rv-x { flex: 0 0 auto; color: var(--bad); font-weight: 700; }

.rv-ex > summary { cursor: pointer; display: flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--accent); }
.rv-ex pre.code { margin-top: 6px; }

.rv-foot { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
.rv-read-btn[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.rv-read-btn[aria-pressed="true"]::before { content: '\2713\00a0'; }

/* focus mode */
.fc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.fc-keys { font-size: 0.85rem; color: var(--muted); }
.fc-head { max-width: 640px; margin: 20px auto 0; }
.fc-topic { display: flex; align-items: center; gap: 10px; }
.fc-title { margin: 0; font-size: 1.1rem; line-height: 1.45; min-width: 0; }
.fc-pos { margin: 6px 0 10px; }
.fc-head .bar { margin-top: 0; }
.fc-prog-text { margin: 6px 0 0; }
.fc-stage { max-width: 640px; margin: 20px auto 0; }
.fc-card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 30px 34px; min-height: 300px; font-size: 1.3rem; line-height: 1.7; }
.fc-card.t-key { border-top-color: var(--muted); }
.fc-card.t-ex { border-top-color: var(--ok); }
.fc-card.t-pit { border-top-color: var(--bad); }
.fc-card.t-end { border-top-color: var(--accent); }
.fc-card.enter { animation: fc-in 0.18s ease-out; }
@keyframes fc-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fc-chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 20px; font-size: 1rem; }
.fc-chip { display: inline-block; padding: 1px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--fg); font-size: 0.85rem; font-weight: 650; line-height: 1.7; }
.fc-chip.sum { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.fc-chip.ex { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.fc-chip.pit { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.fc-prevmark { font-size: 0.85rem; color: var(--muted); }
.fc-text { margin: 0; }
.fc-term { display: block; font-weight: 650; margin-bottom: 8px; }
.fc-sub { margin: 18px 0 0; font-size: 0.95rem; line-height: 1.6; }
.fc-x { color: var(--bad); font-weight: 700; margin-right: 8px; }
.fc-answer { margin-top: 24px; padding: 16px 20px; background: var(--ok-bg); border-left: 5px solid var(--ok); border-radius: var(--radius-sm); }
.fc-answer p { margin: 0; }
.fc-answer .rv-lab { color: var(--ok); }
.fc-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn.fc-big { min-height: 52px; padding: 10px 22px; font-size: 1.05rem; }
.btn.good { border-color: var(--ok); color: var(--ok); }
.fc-nav { max-width: 640px; margin: 18px auto 0; display: flex; gap: 12px; }
.fc-nav .btn { flex: 1 1 0; }
.fc-note { margin: 0 0 14px; }
@media (max-width: 480px) {
  .fc-card { padding: 22px 18px 26px; font-size: 1.2rem; min-height: 260px; }
  .fc-keys { display: none; }
}

/* dialog */
dialog.dlg {
  max-width: min(480px, calc(100vw - 32px));
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  padding: var(--gutter);
  box-shadow: 0 10px 40px rgba(40, 30, 15, 0.2);
}
dialog.dlg::backdrop { background: rgba(40, 32, 20, 0.45); }
dialog.dlg .row { justify-content: flex-end; margin-top: 14px; }

@media (max-width: 480px) {
  :root { --gutter: 16px; }
  body { font-size: 1rem; }
  h1 { font-size: 1.35rem; }
  .stem { font-size: 1.07rem; }
  .big-score { font-size: 1.8rem; }
  .qnav .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

actices (e.g., IAM roles, encryption) and SLA principles for compliance alignment"},"levels":{"junior":{"practice":[{"id":"OPS-J-P-001","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J1","concept":"dockerfile-layer-cache-order","mobile":false,"type":"single","stem":"Dockerfile ของ Node.js API ของทีมเป็นดังโค้ดด้านล่าง ทุกครั้งที่นักพัฒนาแก้ไฟล์ใน src แม้เพียงบรรทัดเดียว การ docker build ใช้เวลาหลายนาทีเพราะติดตั้ง dependencies ใหม่ทั้งหมด ควรปรับ Dockerfile อย่างไรให้ build ซ้ำเร็วขึ้นมากที่สุด","code":"FROM node:20-slim\nWORKDIR /app\nCOPY . .\nRUN npm ci\nRUN npm run build\nCMD [\"node\", \"dist/server.js\"]","codeLang":"dockerfile","options":[{"id":"A","text":"เพิ่ม --no-cache ในคำสั่ง docker build เพื่อให้ Docker สร้างทุก layer ใหม่ให้สะอาด","correct":false,"why":"การใช้ --no-cache คือการปิดการใช้ cache ทั้งหมด ทำให้ทุก layer ถูกสร้างใหม่ทุกครั้ง build จึงช้าลงกว่าเดิม ซึ่งตรงข้ามกับเป้าหมาย"},{"id":"B","text":"COPY เฉพาะ package.json กับ package-lock.json ก่อน แล้ว RUN npm ci จากนั้นค่อย COPY ซอร์สที่เหลือเข้าไป","correct":true,"why":"ถูกต้อง layer ที่ติดตั้ง dependencies จะถูก cache ไว้ตราบที่ไฟล์ทั้งสองไม่เปลี่ยน เมื่อแก้แค่ซอร์ส Docker จึงสร้างใหม่เฉพาะ layer ที่อยู่หลังการ COPY ซอร์ส"},{"id":"C","text":"รวมคำสั่ง RUN npm ci กับ RUN npm run build เป็นคำสั่งเดียวด้วย && เพื่อลดจำนวน layer","correct":false,"why":"ลดจำนวน layer ได้ แต่คำสั่งรวมนี้ยังอยู่หลัง COPY . . ซึ่ง cache หลุดทุกครั้งที่ซอร์สเปลี่ยน npm ci จึงยังรันใหม่ทุกครั้งเหมือนเดิม"},{"id":"D","text":"รัน npm ci บนเครื่องนักพัฒนาก่อน แล้วให้ COPY . . นำโฟลเดอร์ node_modules เข้า image แทนการติดตั้งใน Dockerfile","correct":false,"why":"COPY . . ยังหลุด cache ทุกครั้งที่ซอร์สเปลี่ยน ทำให้ต้องคัดลอก node_modules ทั้งก้อนใหม่ และ native module ที่ build บน macOS หรือ Windows อาจใช้บน Linux ใน container ไม่ได้"}],"explanation":"Docker cache ทีละ layer ตามลำดับคำสั่ง เมื่อ layer ใดเปลี่ยน layer ที่อยู่ถัดจากนั้นทั้งหมดต้องสร้างใหม่ จึงควรเรียงจากสิ่งที่เปลี่ยนน้อย (ไฟล์ที่ระ "ทีมกำลังเขียน pipeline แรกสำหรับ API ผู้นำทีมต้องการให้ทุก Pull Request ที่เปิดไปยัง main ถูก build และรัน unit test อัตโนมัติ ส่วนการ deploy ไป staging ให้เกิดขึ้นเฉพาะเมื่อโค้ดถูก merge เข้า main แล้ว การตั้งค่าแบบใดตรงกับความต้องการนี้","options":[{"id":"A","text":"ตั้ง trigger ให้ทำงานกับ PR ที่ชี้ไป main และกับ commit บน main โดยขั้นตอน deploy มีเงื่อนไขให้รันเมื่อ branch เป็น main","correct":true,"why":"ถูกต้อง PR ได้ build และ test เป็นด่านตรวจก่อน merge ส่วน deploy ผูกกับ main ซึ่งเป็นโค้ดที่ผ่านการรีวิวแล้ว"},{"id":"B","text":"ตั้ง trigger ให้ทำงานกับทุก branch และทุก PR แล้วให้ขั้นตอน deploy ทำงานทุกครั้ง เพื่อให้ผู้รีวิวทดลองบน staging ได้ทันที","correct":false,"why":"โค้ดใน PR ที่ยังไม่ผ่านรีวิวจะเขียนทับ staging หลาย PR แย่งกัน deploy และ staging อาจมีโค้ดที่ไม่เคยถูก merge"},{"id":"C","text":"ตั้ง schedule ให้ build และ test ทุกคืน แล้ว deploy ไป staging หลังรอบกลางคืนผ่าน","correct":false,"why":"ผู้เปิด PR ต้องรอข้ามคืนกว่าจะรู้ผล และถ้ารอบนั้นล้ม ก็บอกยากว่าเกิดจาก PR ใดในวันนั้น"},{"id":"D","text":"ตั้ง trigger เฉพาะ commit บน main ไม่ผูกกับ PR แล้วให้ build, test, deploy รันต่อกันทั้งหมด","correct":false,"why":"ปัญหาจะถูกพบหลัง merge เข้า main แล้ว ทำให้ main พังได้และกระทบทุกคนที่ดึงโค้ดล่าสุด ไม่มีด่านตรวจก่อน merge ตามที่ผู้นำทีมต้องการ"}],"explanation":"CI ที่ดีให้ feedback ก่อน merge (build และ test ตอนเปิด PR) ส่วน CD ผูกกับ branch ที่เชื่อถือได้ การแยกสองส่วนนี้ด้วย trigger และเงื่อนไขของขั้นตอน deploy เป็นพื้นฐานของ pipeline ที่ปลอดภัยและเร็ว"},{"id":"OPS-J-P-004","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J2","concept":"container-bind-localhost-port-mapping","mobile":false,"type":"single","stem":"นักพัฒนา build image ของ API ที่มีโค้ดด้านล่างสำเร็จ แล้วรัน docker run -d -p 3000:3000 my-api จากนั้น docker logs แสดง listening on 3000 และ docker ps แสดงว่า container ทำงานอยู่ แต่เมื่อรัน curl http://localhost:3000/health จากเครื่องโฮสต์ กลับไม่ได้ response กลับมา (เช่น Empty reply from server หรือ connection reset) สาเหตุที่น่าจะเป็นคืออะไร","code":"import express from \"express\";\n\nconst app = express();\napp.get(\"/health\", (_req, res) => res.send(\"ok\"));\napp.listen(3000, \"127.0.0.1\", () => console.log(\"listening on 3000\"));","codeLang":"typescript","options":[{"id":"A","text":"Dockerfile ไม่มีคำสั่ง EXPOSE 3000 พอร์ตจึงไม่ถูกเปิดให้เครื่องโฮสต์เข้าถึง แม้จะใส่ -p ตอนรัน container แล้ว","correct":false,"why":"EXPOSE เป็นเพียงข้อมูลบอกว่าแอปใช้พอร์ตใด ไม่ได้เป็นตัวเปิดพอร์ต การเปิดพอร์ตไปยังโฮสต์ทำด้วย -p ซึ่งใส่ไว้แล้ว"},{"id":"B","text":"พอร์ต 3000 บนเครื่องโฮสต์ถูก firewall ของ Docker ปิดไว้ ต้องสร้าง network ใหม่ด้วย docker network create ก่อน","correct":false,"why":"bridge network เริ่มต้นใช้งานร่วมกับ -p ได้อยู่แล้ว และอาการ Empty reply แปลว่าการเชื่อมต่อถึงปลายทางแล้วแต่ไม่มีอะไรตอบ ไม่ใช่ถูกปฏิเสธที่ firewall"},{"id":"C","text":"image ถูก build บน CPU คนละสถาปัตยกรรมกับเครื่องโฮสต์ (เช่น build บนเครื่อง ARM แล้วนำมารันบนเครื่อง x86) จึงรับ request ไม่ได้","correct":false,"why":"ถ้าสถาปัตยกรรมไม่ตรง ปกติ container จะรันไม่ขึ้นหรือมีคำเตือนชัดเจน แต่ในที่นี้แอปรันและเขียน log ได้ตามปกติ"},{"id":"D","text":"แอปผูกพอร์ตไว้ที่ 127.0.0.1 ภายใน container จึงรับได้เฉพาะ request ที่มาจากใน container เอง ต้องเปลี่ยนเป็น 0.0.0.0","correct":true,"why":"ถูกต้อง request จากโฮสต์เข้ามาทาง network interface ของ container ไม่ใช่ loopback ของ container แอปที่ฟังเฉพาะ 127.0.0.1 จึงไม่ได้รับ"}],"explanation":"การ map พอร์ตด้วย -p เปิดทางจากโฮสต์เข้า container เท่านั้น แอปข้างในต้องฟังที่ address ที่รับ traffic จากภายนอกได้ด้วย (0.0.0.0) เรื่องนี้เป็นสาเหตุที่พบบ่อยเมื่อ container ดูปกติแต่เรียกจากโฮสต์ไม่ได้"},{"id":"OPS-J-P-005","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J2","concept":"managed-vs-self-hosted-db","mobile":false,"type":"single","stem":"ทีมเล็กกำลังเลือกระหว่างติดตั้ง PostgreSQL เองบน VM กับใช้บริการฐานข้อมูลแบบ managed ของผู้ให้บริการคลาวด์ ข้อใดอธิบายลักษณะของบริการแบบ managed ได้ถูกต้อง","options":[{"id":"A","text":"ผู้ให้บริการออกแบบ schema และปรับ query ให้เหมาะกับแอปของเราโดยอัตโนมัติตามรูปแบบการใช้งานที่ตรวจพบ","correct":false,"why":"ผู้ให้บริการไม่รู้ business logic ของแอป การออกแบบ schema, index และ query ยังเป็นงานของทีมเสมอ"},{"id":"B","text":"ผู้ให้บริการดูแลงานระดับระบบ เช่น patch, backup และ failover ส่วนทีมยังเป็นเจ้าของ schema, query และสิทธิ์เข้าถึงข้อมูล","correct":true,"why":"ถูกต้อง managed service ลดงานดูแลโครงสร้างพื้นฐาน แต่ข้อมูลและวิธีใช้งานยังเป็นความรับผิดชอบของผู้ใช้"},{"id":"C","text":"ทีมได้สิทธิ์ root บนเครื่องที่รันฐานข้อมูล เพื่อปรับแต่งค่าระดับระบบปฏิบัติการและติดตั้งส่วนเสริมได้เต็มที่เหมือนติดตั้งเอง","correct":false,"why":"บริการ managed มักไม่เปิดสิทธิ์ระดับระบบปฏิบัติการของเครื่องให้ผู้ใช้ ปรับได้เฉพาะพารามิเตอร์ที่ผู้ให้บริการเปิดไว้"},{"id":"D","text":"ค่าบริการคิดเฉพาะพื้นที่เก็บข้อมูล เพราะผู้ให้บริการรับภาระส่วนเครื่องคำนวณและเครือข่ายให้ทั้งหมดแล้ว","correct":false,"why":"บริการ managed คิดค่า instance หรือ compute ที่จัดสรรให้ด้วย และโดยรวมมักแพงกว่า VM ขนาดเท่ากันเพราะรวมค่าบริการดูแลระบบ"}],"explanation":"managed service คือการจ่ายให้ผู้ให้บริการดูแลโครงสร้างพื้นฐานแทน ได้แก่ patch, backup, failover แลกกับราคาที่สูงขึ้นและสิทธิ์ปรับแต่งที่จำกัด ส่วนการออกแบบข้อมูลและการควบคุมสิทธิ์ยังเป็นหน้าที่ของทีม"},{"id":"OPS-J-P-006","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J1","concept":"dockerignore-build-context","mobile":false,"type":"multiple","stem":"ทีมเพิ่มไฟล์ .dockerignore ให้โปรเจกต์ Node.js และ TypeScript ที่ Dockerfile ติดตั้งด้วย npm ci แล้วคอมไพล์ด้วย npm run build ภายใน image เพื่อให้ build context เล็กลงและไม่นำของที่ไม่ควรอยู่ใน image เข้าไป รายการใดควรใส่ใน .dockerignore (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ไฟล์ package-lock.json ที่ล็อกเวอร์ชันของ dependency","correct":false,"why":"npm ci ต้องใช้ไฟล์นี้ในการติดตั้ง ถ้าตัดออกจาก context การ build จะล้มเหลว"},{"id":"B","text":"โฟลเดอร์ node_modules ที่ติดตั้งไว้บนเครื่องนักพัฒนา","correct":true,"why":"ถูกต้อง image ติดตั้ง dependencies เองอยู่แล้ว การส่ง node_modules จากเครื่องเข้าไปทำให้ context ใหญ่ และ native module ที่ build บน macOS หรือ Windows อาจไปทับของที่ใช้บน Linux"},{"id":"C","text":"โฟลเดอร์ src ที่เก็บซอร์สโค้ด TypeScript ของแอป","correct":false,"why":"เป็นซอร์สที่ขั้นตอน build ต้องใช้คอมไพล์ ถ้าไม่อยู่ใน context จะไม่มีอะไรให้ build"},{"id":"D","text":"ไฟล์ .env ที่เก็บ secret ของเครื่องนักพัฒนา","correct":true,"why":"ถูกต้อง ถ้า COPY . . ไฟล์นี้จะถูกฝังใน layer ของ image และติดไปกับ image ทุกที่ที่ถูกแจกจ่าย"},{"id":"E","text":"ไฟล์ tsconfig.json ที่กำหนดค่าของคอมไพเลอร์","correct":false,"why":"คอมไพเลอร์ TypeScript ต้องอ่านไฟล์นี้ตอน npm run build ถ้าตัดออกการ build จะล้มหรือใช้ค่า default ผิดจากที่ตั้งใจ"}],"explanation":".dockerignore ควรตัดสิ่งที่ image สร้างเองได้ (เช่น node_modules) และสิ่งที่ไม่ควรออกจากเครื่อง (เช่น .env, .git) แต่ต้องไม่ตัดไฟล์ที่ขั้นตอน build ต้องใช้ ผลคือ build เร็วขึ้นและลดความเสี่ยง secret รั่วเข้า image"},{"id":"OPS-J-P-007","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J3","concept":"iam-least-privilege-role-for-app","mobile":false,"type":"single","stem":"แอป backend ที่รันบน VM ในคลาวด์ต้องอ่านไฟล์รูปภาพจาก bucket เดียวคือ product-images เท่านั้น ควรกำหนดสิทธิ์ให้แอปอย่างไรจึงปลอดภัยและสอดคล้องกับหลัก least privilege","options":[{"id":"A","text":"สร้าง access key ของบัญชีผู้ดูแลระบบแล้วใส่ในไฟล์ config ของแอป เพื่อให้เข้าถึง storage ได้ทุกกรณี","correct":false,"why":"key ของ admin มีสิทธิ์เกินความจำเป็นมาก ถ้าไฟล์ config รั่ว ผู้โจมตีควบคุมทั้งบัญชีคลาวด์ได้"},{"id":"B","text":"ตั้ง bucket เป็น public read เพื่อให้แอปอ่านรูปได้ทันทีโดยไม่มีขั้นตอนยืนยันตัวตนที่ซับซ้อน","correct":false,"why":"ทุกคนบนอินเทอร์เน็ตอ่านรูปใน bucket ได้ด้วย ซึ่งเกินความต้องการและอาจทำให้ข้อมูลที่ไม่ควรเปิดรั่วออกไป"},{"id":"C","text":"ผูก IAM role ให้ VM โดยกำหนดสิทธิ์อ่านอย่างเดียวและจำกัดเฉพาะ bucket product-images","correct":true,"why":"ถูกต้อง role ให้ credential ชั่วคราวแก่ VM โดยไม่ต้องเก็บ key ในโค้ด และสิทธิ์แคบเท่าที่งานต้องใช้ ความเสียหายจึงจำกัดหากแอปถูกโจมตี"},{"id":"D","text":"ผูก role ที่อ่านและเขียนได้ทุก bucket ในบัญชีให้ VM เพื่อรองรับฟีเจอร์ที่อาจเพิ่มในอนาคต","correct":false,"why":"สิทธิ์กว้างกว่างานที่ใช้จริง หากแอปถูกเจาะ ผู้โจมตีแก้หรือลบข้อมูลใน bucket อื่นได้ ควรเพิ่มสิทธิ์เมื่อมีความต้องการจริงเท่านั้น"}],"explanation":"หลัก least privilege คือให้เฉพาะสิทธิ์ที่จำเป็นต่อหน้าที่ และใช้ role กับ credential ชั่วคราวแทน key ถาวรที่ฝังในโค้ด วิธีนี้จำกัดความเสียหายเมื่อเกิดเหตุและตรวจสอบย้อนหลังได้ง่าย"},{"id":"OPS-J-P-008","level":"junior","pool":"practice","competency":"CI/CD","descriptor":"CICD-J3","concept":"pipeline-green-but-tests-failed","mobile":false,"type":"multiple","stem":"pipeline ของทีมขึ้นสีเขียวและ deploy ไป staging เรียบร้อยแล้ว แต่เมื่อเปิดรายงานผลทดสอบกลับพบ unit test ล้มเหลวหลายข้อ ข้อใดเป็นสาเหตุที่เป็นไปได้ของเหตุการณ์นี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ขั้นตอนติดตั้ง dependencies ใช้ npm ci แทน npm install ในทุก job ของ pipeline","correct":false,"why":"ชนิดของคำสั่งติดตั้งไม่ทำให้ผลของ test ถูกมองข้าม ถ้า test ล้มและคำสั่งรัน test ส่ง exit code ผิดปกติ ขั้นตอนนั้นก็ต้องล้มด้วย"},{"id":"B","text":"คำสั่งรัน test ต่อท้ายด้วย || true ทำให้ส่ง exit code 0 เสมอ","correct":true,"why":"ถูกต้อง pipeline ตัดสินสำเร็จหรือล้มจาก exit code ของคำสั่ง เมื่อ || true กลบความล้มเหลว ขั้นตอนจึงผ่านทั้งที่ test ล้ม"},{"id":"C","text":"ขั้นตอนรัน test ตั้งค่า continue on error ไว้ ความล้มเหลวจึงไม่หยุดขั้นตอนถัดไป","correct":true,"why":"ถูกต้อง การตั้งค่านี้ให้ pipeline เดินต่อแม้ขั้นตอนนั้นล้ม ผลคือ deploy ทำงานต่อได้ทั้งที่มี test ล้ม"},{"id":"D","text":"สคริปต์ส่งผลจาก test ผ่าน pipe ไปยัง tee เพื่อเก็บ log โดยไม่ได้เปิด pipefail","correct":true,"why":"ถูกต้อง ใน shell ปกติ exit code ของ pipeline คือของคำสั่งสุดท้าย (tee) ซึ่งสำเร็จเสมอ ความล้มเหลวของ test จึงหายไป"}],"explanation":"สีเขียวของ pipeline หมายถึงทุกขั้นตอนคืน exit code สำเร็จ ไม่ได้หมายความว่า test ผ่านเสมอ ควรตรวจว่ามี || true, continue on error หรือ pipe ที่กลบ exit code หรือไม่ และตั้งให้ pipeline ล้มตามผลของ test เสมอ"},{"id":"OPS-J-P-009","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J1","concept":"multi-stage-build-size","mobile":false,"type":"single","stem":"image ของ API (Node.js และ TypeScript) ที่ build จาก Dockerfile แบบขั้นตอนเดียวมีขนาดประมาณ 1.2 GB เพราะมี TypeScript compiler, devDependencies และซอร์สโค้ดติดอยู่ด้วย ทีมต้องการให้ image ที่ใช้รันจริงเล็กลง แนวทางใดตรงจุดที่สุด","options":[{"id":"A","text":"ใช้ multi-stage build: stage แรก build โปรเจกต์ stage สุดท้ายคัดลอกเฉพาะผลลัพธ์ที่ build แล้วกับ production dependencies","correct":true,"why":"ถูกต้อง image สุดท้ายมีเฉพาะสิ่งที่ใช้รัน ส่วน compiler และ devDependencies อยู่ใน stage แรกซึ่งไม่ถูกนำไปเป็น image ที่ deploy"},{"id":"B","text":"เพิ่มคำสั่ง RUN rm -rf node_modules/typescript ที่ท้าย Dockerfile เพื่อลบ compiler และไฟล์ที่ไม่ใช้ออกจาก image","correct":false,"why":"ไฟล์ยังคงอยู่ใน layer ก่อนหน้า การลบใน layer ใหม่เพียงซ่อนไฟล์ ขนาดรวมของ image จึงไม่ลดลง"},{"id":"C","text":"รัน docker image prune บนเซิร์ฟเวอร์ที่ deploy ทุกครั้งหลังปล่อยเวอร์ชัน เพื่อล้างส่วนที่ไม่ใช้ออกจาก image","correct":false,"why":"prune ลบ image ที่ไม่ได้ถูกใช้งาน ไม่ได้ลดขนาดของ image ตัวที่ใช้อยู่ และเนื้อหาข้างใน image ก็ไม่เปลี่ยน"},{"id":"D","text":"บีบอัด node_modules เป็นไฟล์ .tar.gz แล้ว COPY เข้า image และแตกไฟล์ตอน container เริ่มทำงาน เพื่อลดขนาดไฟล์ใน image","correct":false,"why":"ได้ขนาดไฟล์ที่ COPY เล็กลง แต่ devDependencies ยังอยู่ในไฟล์บีบอัด ขนาดหลังแตกไฟล์เท่าเดิม และทำให้ container เริ่มทำงานช้าลง"}],"explanation":"ขนาดของ image คือผลรวมของทุก layer การลบไฟล์ใน layer หลังไม่ทำให้ layer ก่อนหน้าเล็กลง วิธีที่ได้ผลคือ multi-stage build ที่เก็บเฉพาะผลลัพธ์ที่ต้องใช้รันไว้ใน stage สุดท้าย ซึ่งช่วยทั้งขนาด เวลา pull และพื้นที่โจมตี"},{"id":"OPS-J-P-010","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J1","concept":"queue-decouple-slow-task","mobile":false,"type":"single","stem":"ระบบสั่งซื้อออนไลน์เรียกบริการส่งอีเมลยืนยันแบบ synchronous ภายใน API สั่งซื้อ ช่วงที่ผู้ให้บริการอีเมลตอบช้า ลูกค้าต้องรอหน้า checkout หลายวินาทีหรือเจอ timeout ทั้งที่คำสั่งซื้อถูกบันทึกแล้ว ควรปรับ flow ระหว่างส่วนประกอบของระบบอย่างไร","options":[{"id":"A","text":"เพิ่ม timeout ของ API สั่งซื้อเป็น 2 นาที เพื่อให้รอผลการส่งอีเมลได้ครบทุกครั้งก่อนตอบลูกค้า","correct":false,"why":"ลูกค้ายังต้องรอเท่าเดิมหรือนานกว่าเดิม และ connection ที่ค้างนานกินทรัพยากรของ API ทำให้ช่วงที่โหลดสูงยิ่งแย่ลง"},{"id":"B","text":"ให้ API เรียกส่งอีเมลซ้ำอัตโนมัติสามครั้งภายใน request เดียวเมื่อเกิด timeout ก่อนตอบลูกค้า","correct":false,"why":"ลูกค้ารอนานขึ้นอีก และถ้าอีเมลฉบับแรกถูกส่งไปแล้วแต่ response ช้า อาจเกิดอีเมลซ้ำหลายฉบับ"},{"id":"C","text":"ย้ายการบันทึกคำสั่งซื้อไปไว้หลังส่งอีเมลสำเร็จ เพื่อให้แน่ใจว่าอีเมลถึงก่อนจึงบันทึกคำสั่งซื้อ","correct":false,"why":"ถ้าบริการอีเมลช้าหรือล้ม คำสั่งซื้อจะไม่ถูกบันทึกเลย ทำให้เสียยอดขายเพียงเพราะงานรองมีปัญหา"},{"id":"D","text":"ให้ API ส่งข้อความลง message queue แล้วตอบลูกค้าทันที โดยมี worker แยกอ่านคิวไปส่งอีเมลเอง","correct":true,"why":"ถูกต้อง งานที่ช้าถูกแยกออกจากเส้นทางหลักของ request หากผู้ให้บริการอีเมลช้า worker ลองส่งใหม่ได้โดยลูกค้าไม่ต้องรอ"}],"explanation":"queue ช่วยแยกงานรองที่ช้าหรือไม่เสถียรออกจากเส้นทางที่ผู้ใช้กำลังรอ API เพียงบันทึกคำสั่งและวางข้อความลงคิว ส่วน worker ทำงานต่อแบบ asynchronous พร้อมลองใหม่ได้ เป็นรูปแบบพื้นฐานของการสื่อสารระหว่างบริการบนคลาวด์"},{"id":"OPS-J-P-011","level":"junior","pool":"practice","competency":"CI/CD","descriptor":"CICD-J2","concept":"npm-ci-lockfile-in-pipeline","mobile":false,"type":"single","stem":"สคริปต์ build ใน pipeline เดิมใช้ npm install และบางครั้ง build ที่ผ่านบนเครื่องนักพัฒนากลับล้มใน CI ทีมจะเปลี่ยนเป็น npm ci เหตุผลที่สมเหตุสมผลที่สุดของการเปลี่ยนครั้งนี้คืออะไร","options":[{"id":"A","text":"npm ci ข้าม devDependencies จึงติดตั้งได้เร็วกว่า และทำให้ node_modules ที่ได้มีขนาดเล็กลงกว่า npm install","correct":false,"why":"โดย default npm ci ติดตั้ง devDependencies ด้วย หากต้องการข้ามต้องระบุตัวเลือกเพิ่มเอง"},{"id":"B","text":"npm ci ติดตั้งตามเวอร์ชันที่ล็อกใน package-lock.json พอดี และล้มทันทีถ้าไฟล์นี้ไม่ตรงกับ package.json","correct":true,"why":"ถูกต้อง ผลการติดตั้งจึงซ้ำได้ทุกครั้งในทุกเครื่อง และถ้านักพัฒนาลืมอัปเดต lockfile pipeline จะแจ้งทันทีแทนที่จะติดตั้งเวอร์ชันที่ต่างออกไปเงียบ ๆ"},{"id":"C","text":"npm ci อัปเดตทุกแพ็กเกจเป็นเวอร์ชันล่าสุดที่ package.json อนุญาต เพื่อให้ได้แพตช์ล่าสุดเสมอ","correct":false,"why":"พฤติกรรมของ npm ci ตรงข้ามกับนี้ คือยึดเวอร์ชันตาม lockfile และไม่แก้ไขไฟล์ lockfile"},{"id":"D","text":"npm ci นำ node_modules จาก build รอบก่อนมาใช้ซ้ำ จึงดาวน์โหลดน้อยลงและ build เร็วขึ้นกว่า npm install","correct":false,"why":"npm ci ลบโฟลเดอร์ node_modules ที่มีอยู่แล้วติดตั้งใหม่ทุกครั้ง การเร่งความเร็วมาจาก cache ของ npm ซึ่งเป็นอีกกลไกหนึ่ง"}],"explanation":"สคริปต์ใน pipeline ควรให้ผลซ้ำได้ npm ci อ่านเวอร์ชันจาก lockfile โดยตรงและไม่ปรับไฟล์ ต่างจาก npm install ที่อาจเลือกเวอร์ชันใหม่ตามช่วงใน package.json ทำให้ build ต่างกันตามเวลาและเครื่อง"},{"id":"OPS-J-P-012","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J2","concept":"container-data-lost-after-rm","mobile":false,"type":"single","stem":"API ของทีมรับไฟล์แนบจากผู้ใช้และเก็บไว้ที่โฟลเดอร์ /app/uploads ภายใน container หลังปล่อยเวอร์ชันใหม่ด้วยการหยุดและลบ container เดิม แล้วรัน container ใหม่จาก image ที่ build ใหม่ ไฟล์แนบเดิมของผู้ใช้หายหมด ควรแก้อย่างไรให้ไฟล์อยู่รอดข้ามการ deploy","options":[{"id":"A","text":"ตั้ง restart policy ของ container เป็น always เพื่อให้ container ถูกสร้างกลับมาพร้อมไฟล์และสถานะเดิมทุกครั้งที่ถูกลบ","correct":false,"why":"restart policy ใช้เริ่ม container ที่หยุดเอง ไม่ได้กู้ container ที่ถูกลบ และข้อมูลที่เขียนในตัว container หายไปพร้อมกับมัน"},{"id":"B","text":"COPY โฟลเดอร์ uploads เข้า image ใน Dockerfile เพื่อให้ไฟล์ของผู้ใช้ติดไปกับ image ทุกเวอร์ชันที่ build","correct":false,"why":"ไฟล์ที่ผู้ใช้อัปโหลดเกิดขึ้นตอนรัน ไม่มีอยู่ตอน build image และการเก็บข้อมูลผู้ใช้ไว้ใน image ก็ทำให้ image โตและปนข้อมูลกับโค้ด"},{"id":"C","text":"เก็บ /app/uploads ไว้บน volume ที่ผูกกับ container เพื่อให้ข้อมูลอยู่นอก container และใช้ต่อกับ container ตัวใหม่ได้","correct":true,"why":"ถูกต้อง volume มีวงจรชีวิตแยกจาก container การลบหรือสร้าง container ใหม่จึงไม่ทำให้ข้อมูลหาย (หรือใช้ object storage ภายนอกแทนก็ได้)"},{"id":"D","text":"เพิ่มพื้นที่ดิสก์ของเครื่อง host ให้มากขึ้น เพื่อให้ container มีที่เก็บไฟล์เพียงพอและเก็บไฟล์ได้นานขึ้น","correct":false,"why":"ขนาดดิสก์ไม่เกี่ยวกับการหาย ข้อมูลหายเพราะ writable layer ของ container ถูกลบพร้อมกับ container ไม่ใช่เพราะพื้นที่เต็ม"}],"explanation":"ระบบไฟล์ที่เขียนได้ของ container อยู่ได้เท่าอายุของ container เอง ข้อมูลที่ต้องอยู่ต่อควรเก็บใน volume หรือบริการภายนอก เช่น object storage และ database แล้วปล่อยให้ container เป็นสิ่งที่สร้างทิ้งสร้างใหม่ได้"},{"id":"OPS-J-P-013","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J2","concept":"pricing-break-even-serverless-vs-vm","mobile":false,"type":"single","stem":"ทีมกำลังเลือกที่รัน API ภายในองค์กร ตัวเลือกแรกเป็นฟังก์ชันแบบ serverless คิดเงิน 0.40 บาทต่อ 1,000 requests และไม่คิดเงินเมื่อไม่มีการเรียก ตัวเลือกที่สองเป็น VM ราคาคงที่ 1,500 บาทต่อเดือนซึ่งรับ workload นี้ได้ไม่ว่าจะมีกี่ requests ปัจจุบัน API มีประมาณ 2 ล้าน requests ต่อเดือน และคาดว่าจะเพิ่มเป็น 5 ล้านภายในปีหน้า (ไม่นับ free tier และค่าใช้จ่ายอื่น) ข้อสรุปใดถูกต้อง","options":[{"id":"A","text":"ตอนนี้ serverless ถูกกว่า (ประมาณ 800 บาทต่อเดือน) แต่ที่ 5 ล้าน requests จะอยู่ที่ประมาณ 2,000 บาท แพงกว่า VM","correct":true,"why":"ถูกต้อง 2,000,000 หาร 1,000 คูณ 0.40 ได้ 800 บาท ส่วน 5,000,000 ได้ 2,000 บาท ซึ่งเกิน 1,500 บาทของ VM"},{"id":"B","text":"serverless ถูกกว่า VM ทั้งสองระดับ เพราะไม่เสียเงินในช่วงที่ไม่มีการเรียกใช้ และจ่ายตามปริมาณจริงเท่านั้น","correct":false,"why":"ข้อดีเรื่องไม่จ่ายตอนว่างไม่ได้ทำให้ถูกกว่าเสมอ ที่ 5 ล้าน requests ค่าฟังก์ชันประมาณ 2,000 บาท สูงกว่า VM"},{"id":"C","text":"VM ถูกกว่าทั้งสองระดับ เพราะราคาคงที่ 1,500 บาทต่ำกว่าค่าฟังก์ชันตั้งแต่ปริมาณปัจจุบันที่ 2 ล้าน requests","correct":false,"why":"ที่ 2 ล้าน requests ค่าฟังก์ชันอยู่ที่ประมาณ 800 บาท ต่ำกว่า 1,500 บาทของ VM"},{"id":"D","text":"ตอนนี้ serverless แพงกว่า (ประมาณ 8,000 บาทต่อเดือน) แต่จะถูกลงเรื่อย ๆ เมื่อจำนวน requests เพิ่มขึ้นในปีหน้า","correct":false,"why":"ตัวเลขคลาดเคลื่อน 10 เท่า และทิศทางก็ผิด เพราะค่าบริการแบบนี้เพิ่มตามจำนวน requests แบบเส้นตรง ไม่ใช่ลดลง"}],"explanation":"การเลือกรูปแบบราคาต้องคำนวณจากปริมาณการใช้จริงและแนวโน้ม แบบจ่ายตามการใช้เหมาะกับงานที่ใช้น้อยหรือไม่สม่ำเสมอ ส่วนราคาคงที่คุ้มกว่าเมื่อโหลดสูงและสม่ำเสมอ จุดตัดในโจทย์นี้อยู่ที่ประมาณ 3.75 ล้าน requests ต่อเดือน"},{"id":"OPS-J-P-014","level":"junior","pool":"practice","competency":"CI/CD","descriptor":"CICD-J1","concept":"mobile-signing-secrets-in-ci","mobile":true,"type":"multiple","stem":"ทีมกำลังตั้ง pipeline ให้ build แอปมือถือ release ที่ต้องเซ็น (sign) และส่งขึ้น store อัตโนมัติ ข้อมูลใดควรเก็บไว้ในที่เก็บ secret ของ pipeline (เช่น secure files หรือ secret variables) แทนการ commit ไว้ใน Git repo (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ไฟล์ keystore หรือใบรับรองที่ใช้เซ็นแอป","correct":true,"why":"ถูกต้อง ใครได้ไฟล์นี้ไปสามารถเซ็นแอปในนามของทีมได้ จึงต้องเก็บในที่เก็บ secret และเข้าถึงเฉพาะขั้นตอนที่เซ็น"},{"id":"B","text":"application ID หรือ bundle ID ของแอป","correct":false,"why":"เป็นข้อมูลสาธารณะที่ปรากฏบน store และอยู่ในโปรเจกต์อยู่แล้ว เก็บใน repo ได้ตามปกติ"},{"id":"C","text":"version name ที่แสดงให้ผู้ใช้เห็น","correct":false,"why":"เป็นข้อมูลที่เปิดเผยได้และต้องตามไปกับซอร์สในแต่ละ release จึงควรอยู่ใน repo"},{"id":"D","text":"รหัสผ่านของ keystore และของ key ที่ใช้เซ็น","correct":true,"why":"ถูกต้อง รหัสผ่านใช้ปลดล็อกการเซ็นแอป หากรั่วเท่ากับให้คนอื่นเซ็นแอปแทนทีมได้ จึงต้องเก็บเป็น secret"},{"id":"E","text":"API key หรือ service account ที่ใช้อัปโหลดแอปไปยัง store","correct":true,"why":"ถูกต้อง credential นี้ส่งแอปขึ้น store ในนามของทีมได้ จึงต้องเก็บเป็น secret และจำกัดสิทธิ์เฉพาะการอัปโหลด"}],"explanation":"ข้อมูลที่ให้อำนาจ เช่น กุญแจเซ็นแอป รหัสผ่าน และ credential ของ store ต้องอยู่ในที่เก็บ secret ของ pipeline ไม่ใช่ใน Git ส่วนข้อมูลที่เปิดเผยได้ เช่น bundle ID และเลขเวอร์ชัน อยู่ใน repo ตามปกติ"},{"id":"OPS-J-P-015","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J3","concept":"sla-composite-serial-dependencies","mobile":false,"type":"single","stem":"ฝ่ายขายต้องการเสนอ SLA ความพร้อมใช้งาน 99.95% ให้ลูกค้าองค์กร ระบบของเราต้องเรียกทั้งบริการ API gateway (SLA ของผู้ให้บริการ 99.9%) และฐานข้อมูล managed (SLA ของผู้ให้บริการ 99.9%) หากตัวใดตัวหนึ่งล่ม ระบบจะใช้งานไม่ได้ และให้ถือว่าการล่มของสองบริการเกิดขึ้นอิสระต่อกัน ข้อใดถูกต้อง","options":[{"id":"A","text":"เสนอ 99.95% ได้ เพราะ SLA ของทั้งสองบริการเป็น 99.9% ซึ่งผ่านเกณฑ์ขั้นต่ำของลูกค้าองค์กรอยู่แล้ว","correct":false,"why":"ค่า 99.9% ต่ำกว่า 99.95% ที่จะสัญญา และความพร้อมรวมของระบบที่พึ่งพาทั้งสองบริการยังต่ำกว่าค่าของแต่ละบริการอีก"},{"id":"B","text":"เสนอ 99.95% ได้ เพราะมีสองบริการทำงานเสริมกัน ความพร้อมรวมจึงสูงกว่า 99.9% ของแต่ละบริการ","correct":false,"why":"ความซ้ำซ้อนแบบนั้นต้องเป็นบริการที่ทำหน้าที่เดียวกันและสลับแทนกันได้ แต่ที่นี่ต้องพึ่งทั้งสองพร้อมกัน ความพร้อมรวมจึงต่ำลง"},{"id":"C","text":"เสนอได้สูงสุด 99.9% เท่านั้น เพราะความพร้อมรวมเท่ากับค่าของบริการที่ต่ำที่สุดในสองบริการ","correct":false,"why":"ความพร้อมรวมของบริการที่ต้องพึ่งพากันทั้งหมดต้องคูณกัน ไม่ใช่เท่ากับตัวที่ต่ำที่สุด ผลจริงต่ำกว่า 99.9%"},{"id":"D","text":"เสนอ 99.95% ไม่ได้ถ้าไม่เพิ่มการสำรอง เพราะความพร้อมรวมคือ 99.9% คูณ 99.9% ได้ราว 99.8%","correct":true,"why":"ถูกต้อง เมื่อระบบพึ่งพาหลายบริการแบบต่อกัน ต้องคูณความพร้อมของแต่ละตัว เพดานของ SLA ที่เสนอได้จึงต่ำกว่า SLA ของผู้ให้บริการ เว้นแต่จะออกแบบให้ทนต่อการล่มของบริการเหล่านั้น"}],"explanation":"SLA ที่เราสัญญากับลูกค้าถูกจำกัดโดย SLA ของบริการที่เราพึ่งพา เมื่อต้องใช้หลายบริการพร้อมกัน ความพร้อมรวมคือผลคูณ ซึ่งต่ำกว่าตัวใดตัวหนึ่ง จึงต้องตรวจก่อนเซ็นสัญญา และเพิ่มความซ้ำซ้อนถ้าต้องการสัญญาให้สูงกว่านั้น"},{"id":"OPS-J-P-016","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J1","concept":"dockerfile-good-practices","mobile":false,"type":"multiple","stem":"ขณะรีวิว Dockerfile ของเพื่อนร่วมทีม ข้อใดเป็นแนวปฏิบัติที่ดีในการเขียน Dockerfile (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ใส่ EXPOSE 8080 เพื่อเปิดพอร์ตนั้นให้เครื่องโฮสต์เข้าถึงได้ทันทีที่ container ทำงาน","correct":false,"why":"EXPOSE เป็นเพียงข้อมูลประกอบ ไม่ได้เปิดพอร์ตให้โฮสต์ การเปิดต้อง map พอร์ตด้วย -p หรือค่าเทียบเท่าตอนรัน container"},{"id":"B","text":"ระบุเวอร์ชันของ base image ให้ชัด เช่น node:20-slim แทน tag latest","correct":true,"why":"ถูกต้อง การ build ซ้ำจะได้ base image เดิม ผลลัพธ์คาดเดาได้ ต่างจาก latest ที่เปลี่ยนไปเมื่อผู้ดูแล image ออกรุ่นใหม่"},{"id":"C","text":"เพิ่มคำสั่ง USER เพื่อให้แอปรันด้วยผู้ใช้ที่ไม่ใช่ root","correct":true,"why":"ถูกต้อง หากแอปถูกเจาะ ผู้โจมตีจะได้สิทธิ์เท่าผู้ใช้ทั่วไปใน container ไม่ใช่ root ความเสียหายจึงจำกัดกว่า"},{"id":"D","text":"รวม apt-get update กับ apt-get install ไว้ใน RUN เดียวกัน","correct":true,"why":"ถูกต้อง ถ้าแยกเป็นสอง RUN layer ของ update อาจถูก cache ค้างเก่าแล้วใช้กับ install ที่เปลี่ยนรายการแพ็กเกจ ทำให้ติดตั้งผิดหรือล้มเหลว"}],"explanation":"Dockerfile ที่ดีควรให้ build ซ้ำได้ (ระบุเวอร์ชัน base image และจัดลำดับคำสั่งให้ cache ทำงานถูก) และลดความเสี่ยง (ไม่รันเป็น root) ส่วน EXPOSE เป็นเอกสารว่าแอปใช้พอร์ตใด ไม่ใช่ตัวเปิดพอร์ต"},{"id":"OPS-J-P-017","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J2","concept":"compose-service-name-networking","mobile":false,"type":"single","stem":"ทีมใช้ Docker Compose รัน api กับ postgres เป็นสอง service ในไฟล์เดียวกัน หลังรัน docker compose up พบว่า postgres ขึ้นสถานะ running แต่ api ล้มและมี log ดังนี้ ECONNREFUSED 127.0.0.1:5432 ควรแก้ที่ใด","code":"services:\n  api:\n    build: .\n    environment:\n      DATABASE_URL: postgres://app:secret@localhost:5432/shop\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_USER: app\n      POSTGRES_PASSWORD: secret\n      POSTGRES_DB: shop","codeLang":"yaml","options":[{"id":"A","text":"เพิ่ม ports: \"5432:5432\" ให้ service api เพื่อเปิดทางไปยังพอร์ตของฐานข้อมูลจาก container ของ api","correct":false,"why":"ports ของ api เปิดพอร์ตของ api ออกสู่โฮสต์ ไม่ได้สร้างเส้นทางไปหา postgres ปัญหาอยู่ที่ปลายทางที่แอปเรียก"},{"id":"B","text":"เปลี่ยน host ใน DATABASE_URL เป็น postgres ซึ่งเป็นชื่อ service เพราะ localhost ใน api คือ container ของ api เอง","correct":true,"why":"ถูกต้อง โดยค่าเริ่มต้น service ในไฟล์ Compose เดียวกันอยู่ใน network เดียวกันและเรียกกันด้วยชื่อ service ได้ ส่วน localhost ภายใน container คือตัว container นั้นเอง ซึ่งไม่มีฐานข้อมูลรันอยู่"},{"id":"C","text":"เปลี่ยน host ใน DATABASE_URL เป็น 0.0.0.0 เพื่อให้เชื่อมต่อได้ทุก network interface ของเครื่อง","correct":false,"why":"0.0.0.0 ใช้ตอนให้ server ฟังทุก interface ไม่ใช่ปลายทางที่ client ควรเรียก และยังชี้กลับมาที่ container ของ api เองอยู่ดี"},{"id":"D","text":"เพิ่ม depends_on: [postgres] ให้ service api เพื่อให้ api เริ่มทำงานหลังจากฐานข้อมูลเริ่มเสร็จแล้ว","correct":false,"why":"depends_on ควบคุมลำดับการเริ่ม ไม่ได้เปลี่ยนที่อยู่ปลายทาง และในกรณีนี้ postgres ขึ้นแล้ว สาเหตุคือ address ที่ใช้เรียกไม่ถูกต้อง"}],"explanation":"ใน Docker Compose โดยค่าเริ่มต้นทุก service อยู่ใน network เดียวกันและมี DNS ชื่อ service ให้ใช้ localhost ในแต่ละ container หมายถึงตัวมันเอง เมื่อต้องเชื่อมไปอีก service ให้ใช้ชื่อ service เป็น host"},{"id":"OPS-J-P-018","level":"junior","pool":"practice","competency":"CI/CD","descriptor":"CICD-J2","concept":"build-once-promote-artifact","mobile":false,"type":"single","stem":"pipeline ของทีมมีสอง job แยกกัน job deploy-staging ดึงซอร์สมา build เอง ส่วน job deploy-production ก็ดึงซอร์สมา build เองอีกครั้งหลังได้รับอนุมัติ ครั้งหนึ่ง QA ทดสอบบน staging ผ่านทั้งหมด แต่บน production พบพฤติกรรมต่างออกไปทั้งที่ใช้ commit เดียวกัน แนวทางแก้ที่ดีที่สุดคืออะไร","options":[{"id":"A","text":"ล็อกเวอร์ชัน Node.js ของ build agent ทั้งสอง job ให้เหมือนกัน แล้วให้แต่ละ job build ของตัวเองต่อไป","correct":false,"why":"ลดความต่างได้บางส่วน แต่ยัง build สองรอบ ผลลัพธ์อาจต่างจาก dependency ที่ไม่ได้ล็อกหรือสภาพแวดล้อมของแต่ละรอบ ของที่ทดสอบจึงยังไม่ใช่ของที่ deploy"},{"id":"B","text":"เพิ่ม integration test ใน job deploy-production ให้รันหลัง deploy เสร็จ เพื่อตรวจว่าระบบทำงานปกติ","correct":false,"why":"พบปัญหาหลังของขึ้น production แล้ว ซึ่งช้ากว่าการป้องกันและไม่ได้แก้เหตุที่ของสองชุดต่างกัน"},{"id":"C","text":"build ครั้งเดียวแล้วเก็บผลลัพธ์เป็น artifact หรือ image ที่ติด tag แล้วนำตัวเดิมไป deploy ทุก environment","correct":true,"why":"ถูกต้อง สิ่งที่ผ่านการทดสอบบน staging คือไฟล์เดียวกับที่ขึ้น production ความต่างจึงเหลือแค่ configuration ของแต่ละ environment"},{"id":"D","text":"ใช้ agent pool เดียวกันสำหรับ build ทั้งสอง job เพื่อให้ได้เครื่องและสภาพแวดล้อมเดียวกันทั้งสองรอบ","correct":false,"why":"agent อาจเป็นเครื่องเดียวกัน แต่ build ยังเกิดสองรอบในเวลาต่างกัน dependency หรือ cache ที่เปลี่ยนไประหว่างรอบก็ยังทำให้ผลต่างได้"}],"explanation":"หลัก build once, deploy many: สร้าง artifact ครั้งเดียวแล้วเลื่อนชั้น (promote) ไปแต่ละ environment โดยแยกเฉพาะ configuration วิธีนี้ทำให้สิ่งที่ทดสอบกับสิ่งที่ปล่อยเป็นของชิ้นเดียวกัน"},{"id":"OPS-J-P-019","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J1","concept":"push-notification-token-flow","mobile":true,"type":"multiple","stem":"ทีมกำลังเพิ่มการแจ้งเตือนแบบ push ให้แอปมือถือ (iOS และ Android) เมื่อสถานะคำสั่งซื้อเปลี่ยน ข้อใดอธิบายการสื่อสารระหว่างแอป, backend และบริการบนคลาวด์ได้ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"backend ส่งข้อความผ่านบริการ push ของแพลตฟอร์ม (APNs สำหรับ iOS, FCM สำหรับ Android) ไปยังเครื่องผู้ใช้","correct":true,"why":"ถูกต้อง เครื่องมือถือรักษาการเชื่อมต่อกับบริการ push ของแพลตฟอร์มอยู่แล้ว backend จึงส่งผ่านบริการนั้นแทนการติดต่อเครื่องโดยตรง"},{"id":"B","text":"แอปขอ device token แล้วส่งมาลงทะเบียนที่ backend เพื่อให้ backend รู้ว่าต้องส่งถึงเครื่องไหน","correct":true,"why":"ถูกต้อง token ใช้ระบุอุปกรณ์ปลายทาง backend ต้องเก็บคู่กับผู้ใช้เพื่อเลือกส่งถูกคน"},{"id":"C","text":"backend เปิดการเชื่อมต่อตรงไปยัง IP ของมือถือผู้ใช้เพื่อส่งข้อความแจ้งเตือนทันทีที่สถานะคำสั่งซื้อเปลี่ยน","correct":false,"why":"มือถืออยู่หลัง NAT ของเครือข่ายมือถือ IP เปลี่ยนบ่อยและ backend เริ่มเชื่อมต่อเข้าไปไม่ได้ จึงต้องส่งผ่านบริการ push ของแพลตฟอร์ม"},{"id":"D","text":"token อาจเปลี่ยนหรือใช้ไม่ได้ เช่น หลังติดตั้งแอปใหม่ backend จึงควรอัปเดต token และลบตัวที่ถูกปฏิเสธ","correct":true,"why":"ถูกต้อง token ที่ค้างเก่าทำให้ส่งไม่ถึงและเสียทรัพยากร การดูแลวงจรชีวิตของ token เป็นส่วนหนึ่งของ flow นี้"}],"explanation":"การ push ไปยังมือถือต้องผ่านบริการของแพลตฟอร์ม โดยแอปลงทะเบียน token กับ backend และ backend ส่งข้อความพร้อม token ไปที่บริการนั้น อย่าลืมจัดการ token ที่หมดอายุหรือเปลี่ยนด้วย"},{"id":"OPS-J-P-020","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J2","concept":"container-oom-killed-exit-137","mobile":false,"type":"single","stem":"งานประมวลผลรายงานรันใน container ด้วยคำสั่งด้านล่าง ทุกครั้งที่ประมวลผลไฟล์ CSV ขนาดใหญ่ container จะหยุดกลางคัน docker ps -a แสดงสถานะ Exited (137) และ log ของแอปไม่มีข้อความ error ใดก่อนหยุด ควรสงสัยสิ่งใดก่อน","code":"docker run -d --name report-job -m 256m report-worker:1.4\n\ndocker ps -a\nCONTAINER ID   IMAGE               STATUS                     NAMES\n3f2a9c1d5b7e   report-worker:1.4   Exited (137) 3 minutes ago report-job","codeLang":"bash","options":[{"id":"A","text":"container ใช้หน่วยความจำเกินขีดจำกัดจนถูกระบบสั่งหยุด (OOM kill) ตรวจด้วย docker inspect ที่ฟิลด์ OOMKilled","correct":true,"why":"ถูกต้อง exit code 137 คือ 128 บวก 9 หมายถึงถูกส่งสัญญาณ SIGKILL ซึ่งการเกินขีดจำกัดหน่วยความจำเป็นสาเหตุที่พบบ่อย และแอปที่ถูกฆ่าทันทีมักไม่มีโอกาสเขียน log"},{"id":"B","text":"แอปเกิด unhandled exception ทำให้ Node.js จบการทำงานด้วย exit code 137 โดยไม่ทิ้ง stack trace ไว้","correct":false,"why":"unhandled exception ของ Node.js จบด้วย exit code 1 และมักมี stack trace ใน log ซึ่งไม่ตรงกับอาการที่ log เงียบ"},{"id":"C","text":"Docker daemon ถูกรีสตาร์ทระหว่างที่งานกำลังทำงาน จึงหยุดทุก container ที่กำลังรันอยู่บนเครื่องนั้น","correct":false,"why":"อาการเกิดซ้ำทุกครั้งกับงานไฟล์ใหญ่เท่านั้น ไม่ตรงกับเหตุการณ์ที่ daemon รีสตาร์ทครั้งเดียวและกระทบ container อื่นด้วย"},{"id":"D","text":"พอร์ตที่แอปใช้ชนกับ container อื่นบนเครื่องเดียวกัน Docker จึงบังคับปิด container ระหว่างประมวลผล","correct":false,"why":"พอร์ตชนมักทำให้ container เริ่มไม่ขึ้นพร้อมข้อความ error ชัดเจน ไม่ใช่ทำงานไปแล้วถูกหยุดกลางคันตอนประมวลผลไฟล์"}],"explanation":"Exited (137) คือสัญญาณว่า process ถูกฆ่าจากภายนอก ซึ่งกรณีที่พบบ่อยคือเกินขีดจำกัดหน่วยความจำของ container เมื่อ log ไม่มีอะไรเลย ให้เช็ก docker inspect ว่า OOMKilled เป็น true หรือไม่ แล้วเลือกเพิ่ม limit หรือแก้การใช้หน่วยความจำของงาน เช่น อ่านไฟล์เป็น stream"},{"id":"OPS-J-P-021","level":"junior","pool":"practice","competency":"CI/CD","descriptor":"CICD-J3","concept":"ci-case-sensitive-filename","mobile":false,"type":"single","stem":"นักพัฒนารันแอป Node.js บน macOS ได้ปกติ แต่ขั้นตอน smoke test ใน pipeline ซึ่งรันบน agent Linux ล้มด้วย error ด้านล่าง ทั้งสองเครื่องใช้ Node.js เวอร์ชันและ lockfile เดียวกันตามที่กำหนดใน repo และไฟล์ในโปรเจกต์ชื่อ src/utils/DateFormat.js ก็มีอยู่ใน repo จริง สาเหตุที่น่าจะเป็นคืออะไร","code":"Error: Cannot find module '../utils/dateFormat'\nRequire stack:\n- /home/vsts/work/1/s/src/pages/orders.js","codeLang":"text","options":[{"id":"A","text":"agent Linux ใช้ shallow clone ซึ่งดึงเฉพาะ commit ล่าสุด จึงได้ไฟล์ในโฟลเดอร์ src/utils มาไม่ครบเหมือนที่มีอยู่ใน repo","correct":false,"why":"shallow clone จำกัดเฉพาะประวัติ commit ที่ดึงมา ไม่ได้ทำให้ไฟล์ใน working tree ของ commit ที่ checkout หายไป ไฟล์ที่อยู่ใน repo จึงมาครบ"},{"id":"B","text":"smoke test รันก่อนขั้นตอน npm ci ใน pipeline จึงยังไม่มี dependency ของโปรเจกต์ให้โหลดครบ ณ เวลาที่รัน","correct":false,"why":"ถ้า dependency ขาด error จะระบุชื่อแพ็กเกจ ไม่ใช่ path แบบ relative ของไฟล์ในโปรเจกต์ที่อยู่ใน repo"},{"id":"C","text":"ต้องรัน npm cache clean ก่อนทุกครั้งที่ build บน agent เพราะ cache เก่าทำให้หาไฟล์ซอร์สไม่พบ","correct":false,"why":"cache ของ npm เกี่ยวกับแพ็กเกจที่ดาวน์โหลด ไม่เกี่ยวกับการหาไฟล์ซอร์สภายในโปรเจกต์"},{"id":"D","text":"ชื่อใน require ตัวพิมพ์ไม่ตรงกับชื่อไฟล์จริง ระบบไฟล์ Linux แยกตัวพิมพ์ แต่ค่าเริ่มต้นของ macOS มักไม่แยก","correct":true,"why":"ถูกต้อง dateFormat กับ DateFormat เป็นคนละชื่อบน Linux ขณะที่ volume ของ macOS ที่ตั้งค่าตามปกติมักไม่แยกตัวพิมพ์จึงหาไฟล์เจอ (ขึ้นกับการตั้งค่า volume) ควรแก้ชื่อใน require ให้ตรงชื่อไฟล์จริง"}],"explanation":"build หรือรันที่ผ่านบนเครื่องแต่ล้มใน CI มักเกิดจากความต่างของสภาพแวดล้อม ตัวอย่างคลาสสิกคือระบบไฟล์ที่แยกตัวพิมพ์ใหญ่เล็กต่างกัน วิธีอ่านคือดูบรรทัดแรกของ error แล้วเทียบชื่อที่เรียกกับชื่อไฟล์จริงอย่างละเอียด และตัดสาเหตุอื่นด้วยข้อมูลใน error เช่น error ของแพ็กเกจที่ขาดจะระบุชื่อแพ็กเกจ การรัน CI บน Linux ซึ่งแยกตัวพิมพ์จึงเป็นด่านที่จับปัญหานี้ก่อนขึ้นระบบจริง"},{"id":"OPS-J-P-022","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J2","concept":"hidden-cost-egress-snapshots","mobile":false,"type":"multiple","stem":"ทีมประเมินค่าใช้จ่ายของระบบใหม่บนคลาวด์จากราคา VM และฐานข้อมูลเท่านั้น แต่บิลเดือนแรกสูงกว่าประมาณการมาก รายการใดเป็นค่าใช้จ่ายที่มักถูกมองข้ามจนทำให้บิลสูงกว่าที่คาด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ค่า data transfer ขาออกจากคลาวด์ไปยังอินเทอร์เน็ตหรือไปยัง region อื่น","correct":true,"why":"ถูกต้อง ผู้ให้บริการส่วนใหญ่คิดค่าข้อมูลที่ออกจากคลาวด์ ระบบที่ส่งไฟล์หรือรูปจำนวนมากให้ผู้ใช้จึงมีค่านี้สูงโดยไม่คาดคิด"},{"id":"B","text":"ค่า data transfer ขาเข้าเมื่อผู้ใช้อัปโหลดข้อมูลเข้ามายังคลาวด์ ซึ่งมักคิดแพงกว่าขาออก","correct":false,"why":"ผู้ให้บริการหลักส่วนใหญ่ไม่คิดค่าข้อมูลขาเข้าจากอินเทอร์เน็ต จึงไม่ใช่สาเหตุของบิลที่สูงเกินคาด"},{"id":"C","text":"snapshot และ backup ที่สะสมไว้โดยไม่มีนโยบายลบรุ่นเก่า","correct":true,"why":"ถูกต้อง ข้อมูลสำรองถูกคิดค่าพื้นที่เก็บตามขนาดที่สะสม ถ้าไม่ตั้งอายุหรือจำนวนที่เก็บ ค่าใช้จ่ายจะโตขึ้นทุกเดือน"},{"id":"D","text":"ค่าสร้าง IAM role และ policy ที่คิดตามจำนวนที่สร้างขึ้น","correct":false,"why":"บริการจัดการตัวตนและสิทธิ์ของผู้ให้บริการหลักมักไม่คิดค่าแยกตามจำนวน role หรือ policy ที่สร้าง"},{"id":"E","text":"ค่าติดตั้ง (setup fee) ที่คิดครั้งเดียวทุกครั้งที่สร้าง VM ใหม่","correct":false,"why":"ผู้ให้บริการหลักส่วนใหญ่คิดตามเวลาและทรัพยากรที่ใช้ ไม่ได้คิดค่าติดตั้งต่อ VM แยกต่างหาก"}],"explanation":"การประเมินราคาไม่ควรดูแค่ compute และฐานข้อมูล ควรรวมค่าข้อมูลขาออก พื้นที่เก็บ snapshot และ backup ที่สะสม ค่า log และ monitoring ด้วย แล้วตั้ง alert ด้านงบประมาณเพื่อให้เห็นความผิดปกติเร็ว"},{"id":"OPS-J-P-023","level":"junior","pool":"practice","competency":"Container","descriptor":"CTR-J1","concept":"docker-compose-local-backend-mobile","mobile":true,"type":"single","stem":"ทีมมือถือต้องรัน backend API, PostgreSQL และ Redis บนเครื่องตัวเองเพื่อพัฒนาแอป ที่ผ่านมาแต่ละคนติดตั้งเองจนเวอร์ชันไม่ตรงกัน ทำให้บั๊กเกิดเฉพาะบางเครื่อง ทีมควรใช้ Docker อย่างไรให้เหมาะกับงานนี้","options":[{"id":"A","text":"รวม API, PostgreSQL และ Redis ไว้ใน container เดียวด้วย Dockerfile เดียวเพื่อให้เริ่มระบบง่าย","correct":false,"why":"การรวมหลายบริการไว้ใน container เดียวทำให้อัปเกรด ดู log และจำกัดทรัพยากรแยกกันไม่ได้ จึงมักไม่แนะนำ ควรแยกเป็นหนึ่งบริการต่อหนึ่ง container"},{"id":"B","text":"เขียนไฟล์ Docker Compose ที่ประกาศแต่ละบริการพร้อมเวอร์ชัน image ไว้ใน repo ให้ทุกคนรันด้วยคำสั่งเดียว","correct":true,"why":"ถูกต้อง ทุกเครื่องได้ชุดบริการและเวอร์ชันเดียวกัน ความต่างของ environment ที่ทำให้บั๊กเกิดเฉพาะเครื่องจึงหายไป"},{"id":"C","text":"ให้แต่ละคนสร้าง VM ของตัวเองบนคลาวด์แล้วติดตั้งบริการด้วยมือตามขั้นตอนในเอกสาร wiki แล้วต่อเข้าจากเครื่องตัวเอง","correct":false,"why":"ยังเป็นการติดตั้งด้วยมือ เวอร์ชันอาจไม่ตรงกันอีก และมีค่าใช้จ่ายของ VM ต่อคนเพิ่มขึ้นโดยไม่จำเป็น"},{"id":"D","text":"ใช้ image tag latest ของ PostgreSQL และ Redis เพื่อให้ทุกคนได้เวอร์ชันล่าสุดเหมือนกันเสมอ","correct":false,"why":"latest ที่แต่ละเครื่อง pull มาอาจต่างกันตามเวลาและ image ที่ค้างอยู่ใน cache ของเครื่อง เวอร์ชันจึงไม่ตรงกันได้อีก"}],"explanation":"Docker Compose ช่วยให้ทีมนิยามสภาพแวดล้อมพัฒนาเป็นโค้ดและแชร์ผ่าน repo ทำให้ทุกคนรัน backend เวอร์ชันเดียวกันได้ รวมถึงทีมมือถือที่ต้องการ backend ในเครื่องโดยไม่ต้องติดตั้งเอง"},{"id":"OPS-J-P-024","level":"junior","pool":"practice","competency":"Cloud","descriptor":"CLD-J3","concept":"pdpa-data-protection-cloud","mobile":false,"type":"multiple","stem":"ระบบเก็บข้อมูลส่วนบุคคลของลูกค้า (ชื่อ เบอร์โทร ที่อยู่) ไว้ใน object storage และฐานข้อมูล managed บนคลาวด์ เพื่อให้สอดคล้องกับ PDPA ทีมควรทำอะไรบ้างด้านความปลอดภัย (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เปิด encryption at rest ของ storage และฐานข้อมูล และบังคับให้ client เชื่อมต่อผ่าน TLS","correct":true,"why":"ถูกต้อง ข้อมูลถูกป้องกันทั้งตอนอยู่ในที่เก็บและตอนเดินทางบนเครือข่าย เป็นมาตรการพื้นฐานของการรักษาความมั่นคงปลอดภัยของข้อมูลส่วนบุคคล"},{"id":"B","text":"ตั้ง bucket เป็น public read แต่ตั้งชื่อไฟล์แบบสุ่มยาว ๆ เพื่อให้เดาลิงก์ไม่ได้และลดโอกาสที่คนนอกจะเจอ","correct":false,"why":"ใครได้ลิงก์ก็เปิดอ่านได้ และลิงก์อาจรั่วจาก log, browser history หรือการแชร์ การซ่อนด้วยชื่อไม่ใช่การควบคุมการเข้าถึง"},{"id":"C","text":"กำหนดสิทธิ์ผ่าน IAM role ตามหน้าที่ของแต่ละบทบาท และเปิด audit log ของการเข้าถึงข้อมูล","correct":true,"why":"ถูกต้อง จำกัดผู้เข้าถึงให้เหลือเท่าที่จำเป็นและตรวจสอบย้อนหลังได้ว่าใครเข้าถึงอะไร ซึ่งสนับสนุนการแสดงความรับผิดชอบตาม PDPA"},{"id":"D","text":"แชร์ access key ชุดเดียวกันให้ทั้งทีมใช้ เพื่อลดภาระในการจัดการบัญชีผู้ใช้และสิทธิ์รายคน","correct":false,"why":"ระบุตัวผู้กระทำไม่ได้ เพิกถอนสิทธิ์รายคนไม่ได้ และเมื่อ key รั่วต้องเปลี่ยนให้ทุกคนพร้อมกัน"}],"explanation":"การคุ้มครองข้อมูลส่วนบุคคลบนคลาวด์เริ่มจากการเข้ารหัสทั้งตอนเก็บและตอนส่ง การควบคุมสิทธิ์ตามหลัก least privilege ผ่าน IAM และการเก็บ audit log การเปิดข้อมูลเป็นสาธารณะหรือแชร์ key ร่วมกันขัดกับหลักเหล่านี้"}],"exam":[{"id":"OPS-J-E-001","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J1","concept":"image-tag-version-vs-latest","mobile":false,"type":"single","stem":"ทีมปล่อย API ขึ้น production โดย build image แล้ว push ขึ้น registry ด้วย tag latest ทุกครั้งที่ deploy ต่อมาเวอร์ชันล่าสุดมีบั๊กร้ายแรง ผู้ดูแลต้อง rollback แต่หา image ของเวอร์ชันก่อนหน้าที่เคยรันอยู่จริงไม่ได้ชัดเจน ควรปรับวิธีตั้ง tag ของ image อย่างไร","options":[{"id":"A","text":"ใช้ docker pull กับ tag latest ซ้ำอีกครั้ง เพื่อดึงเวอร์ชันก่อนหน้าที่เคยรันอยู่กลับมาจาก registry","correct":false,"why":"latest ชี้ไปที่ image ที่ push ล่าสุดเท่านั้น การ pull ซ้ำจึงได้ image ตัวที่มีบั๊กตัวเดิม"},{"id":"B","text":"ใช้ tag ตามชื่อ branch เช่น main ซึ่งทุกครั้งที่ merge จะ push ทับ tag เดิมใน registry เสมอ","correct":false,"why":"tag ชื่อ branch เป็น tag ที่ถูกเขียนทับได้เหมือน latest จึงระบุไม่ได้ว่า image ของเวอร์ชันก่อนหน้าคือตัวไหน"},{"id":"C","text":"ติด tag ที่ไม่ซ้ำ เช่นหมายเลข release หรือ commit SHA แล้ว deploy โดยอ้างถึง tag นั้น","correct":true,"why":"ถูกต้อง แต่ละ tag ชี้ image ตัวเดียวตลอด การ rollback จึงทำได้โดยกลับไปใช้ tag ของเวอร์ชันก่อนหน้า และรู้เสมอว่า production รันโค้ดจาก commit ใด"},{"id":"D","text":"ตั้ง image pull policy เป็น always ให้ทุกเครื่องบน production ดึง image ใหม่ก่อนเริ่ม container","correct":false,"why":"การดึงใหม่ทุกครั้งทำให้ได้ image ล่าสุดของ tag นั้นเสมอ แต่ไม่ได้ช่วยให้ย้อนกลับเวอร์ชันเก่าได้ เพราะ tag ยังไม่แยกแต่ละเวอร์ชัน"}],"explanation":"tag latest และ tag ที่ถูกเขียนทับได้ไม่บอกว่ากำลังรันโค้ดเวอร์ชันใด ควรใช้ tag ที่ไม่ซ้ำและไม่ถูกเขียนทับ เช่น เลขเวอร์ชันหรือ commit SHA เพื่อให้ติดตามและ rollback ได้"},{"id":"OPS-J-E-002","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J1","concept":"cdn-edge-caching-static","mobile":true,"type":"single","stem":"แอปมือถือของร้านค้าแสดงรูปสินค้าที่เก็บอยู่ใน object storage ของ region เดียวในสิงคโปร์ ผู้ใช้ต่างจังหวัดบ่นว่ารูปโหลดช้า และค่า data transfer ที่ออกจาก storage สูงขึ้นตามจำนวนผู้ใช้ ควรเพิ่มส่วนประกอบใดเข้าไปใน flow การโหลดรูป","options":[{"id":"A","text":"เพิ่ม load balancer หน้า object storage เพื่อกระจาย request ของแอปไปยังหลายเครื่องให้รับโหลดได้มากขึ้น","correct":false,"why":"object storage ขยายรองรับ request ได้เองอยู่แล้ว ปัญหาคือระยะทางและปริมาณข้อมูลที่ส่งออก load balancer ไม่ได้ทำให้รูปอยู่ใกล้ผู้ใช้ขึ้น"},{"id":"B","text":"เพิ่ม CDN ให้แอปโหลดรูปผ่าน CDN ที่แคชไฟล์ไว้ใกล้ผู้ใช้ และดึงจาก storage เฉพาะเมื่อยังไม่มีในแคช","correct":true,"why":"ถูกต้อง ผู้ใช้ได้รูปจากจุดที่ใกล้กว่า และจำนวนครั้งที่ต้องดึงรูปจาก storage ต้นทางลดลง ความเร็วจึงดีขึ้นและค่าส่งข้อมูลออกจาก storage ลดลง แต่ CDN ก็มีค่าบริการของตัวเองที่ต้องนำมาเทียบ"},{"id":"C","text":"เพิ่มจำนวน API server แล้วให้ API ดึงรูปจาก storage ส่งต่อให้แอป แทนการให้แอปโหลดจาก storage ตรง","correct":false,"why":"ทุก byte ของรูปยังต้องผ่าน server อีกชั้น ทำให้ช้าลงและเพิ่มภาระกับค่า bandwidth ของ server โดยไม่ได้ทำให้รูปอยู่ใกล้ผู้ใช้"},{"id":"D","text":"แปลงรูปเป็น Base64 ก่อนเก็บใน storage เพื่อให้แอปรับข้อมูลเป็นข้อความได้เร็วขึ้นและจัดการง่ายขึ้น","correct":false,"why":"Base64 ทำให้ไฟล์ใหญ่ขึ้นประมาณหนึ่งในสาม ส่งข้อมูลมากขึ้นและช้าลง ไม่ได้ช่วยเรื่องระยะทางหรือค่าส่งข้อมูล"}],"explanation":"CDN แคชเนื้อหาที่ไม่ค่อยเปลี่ยน เช่น รูป ไว้ในจุดให้บริการใกล้ผู้ใช้ ลด latency และลดภาระกับ origin ในแผนผัง flow ของระบบ CDN จึงอยู่ระหว่างแอปกับ storage สำหรับเนื้อหาแบบ static"},{"id":"OPS-J-E-003","level":"junior","pool":"exam","competency":"CI/CD","descriptor":"CICD-J1","concept":"pipeline-secrets-variable-group","mobile":false,"type":"single","stem":"นักพัฒนาเขียน pipeline YAML สำหรับ deploy API ไป staging และต้องส่งรหัสผ่านฐานข้อมูลให้ขั้นตอน deploy ใช้ ควรจัดการรหัสผ่านนี้อย่างไร","options":[{"id":"A","text":"เก็บเป็น secret variable หรือดึงจาก secret store แล้วให้ pipeline อ้างถึงตอนรัน ไม่เขียนค่าลงไฟล์ YAML","correct":true,"why":"ถูกต้อง ค่าอยู่นอกซอร์สโค้ด คุมสิทธิ์การเข้าถึงได้ และ pipeline จะ mask ค่าใน log เมื่อเป็น secret"},{"id":"B","text":"เขียนรหัสผ่านใน YAML แบบเข้ารหัส Base64 เพื่อให้คนที่เปิดไฟล์อ่านไม่ออก แล้วให้ขั้นตอน deploy ถอดรหัสก่อนใช้","correct":false,"why":"Base64 เป็นแค่การแปลงรูปแบบ ถอดกลับได้ทันทีด้วยคำสั่งเดียว ใครเปิด repo ได้ก็ได้รหัสผ่านไป"},{"id":"C","text":"เขียนรหัสผ่านลงไฟล์ config ใน repo แล้วตั้งสิทธิ์ของ repo เป็น private เพื่อจำกัดคนที่อ่านได้","correct":false,"why":"ทุกคนที่อ่าน repo ได้จะเห็นรหัสผ่าน และค่ายังอยู่ใน Git history ตลอดแม้ลบไฟล์ในภายหลัง การเปลี่ยนรหัสต้อง commit ใหม่"},{"id":"D","text":"ให้ผู้กดรัน pipeline พิมพ์รหัสผ่านเป็น runtime parameter ธรรมดาทุกครั้งที่รัน แล้วส่งต่อให้ขั้นตอน deploy","correct":false,"why":"parameter ธรรมดาไม่ถูกปกปิด ค่ายังปรากฏในประวัติการรันและ log ได้ และการพึ่งคนพิมพ์ทุกครั้งทำให้ผิดพลาดง่าย"}],"explanation":"ค่าลับไม่ควรอยู่ในซอร์สโค้ดหรือ YAML ให้เก็บใน secret store หรือ secret variable ของ pipeline เพราะควบคุมสิทธิ์ได้ หมุนเวียนค่าได้โดยไม่ต้องแก้โค้ด และไม่รั่วไปกับ Git history"},{"id":"OPS-J-E-004","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J2","concept":"build-context-copy-outside","mobile":false,"type":"single","stem":"โปรเจกต์ monorepo มีโฟลเดอร์ shared อยู่ระดับเดียวกับโฟลเดอร์ api นักพัฒนาเข้าไปในโฟลเดอร์ api แล้วรัน docker build -t api . ได้ error ดังด้านล่าง ใน Dockerfile มีบรรทัด COPY ../shared ./shared และโฟลเดอร์ shared มีอยู่จริง ควรทำอย่างไร","code":"COPY failed: forbidden path outside the build context: ../shared ()","codeLang":"text","options":[{"id":"A","text":"เปลี่ยนคำสั่งเป็น ADD เพราะ COPY รองรับเฉพาะไฟล์เดี่ยวและคัดลอกทั้งโฟลเดอร์ไม่ได้เหมือน ADD","correct":false,"why":"COPY คัดลอกทั้งโฟลเดอร์ได้ ปัญหาไม่ได้อยู่ที่ชนิดของคำสั่ง แต่อยู่ที่ตำแหน่งของโฟลเดอร์ที่ชี้ไป"},{"id":"B","text":"ใช้ chmod เปิดสิทธิ์อ่านให้โฟลเดอร์ shared เพราะ Docker ไม่มีสิทธิ์อ่านโฟลเดอร์นี้ตอน build","correct":false,"why":"ข้อความ error ไม่ใช่ permission denied แต่ระบุว่าเส้นทางอยู่นอก build context ซึ่งการเปลี่ยนสิทธิ์ไฟล์ไม่ช่วย"},{"id":"C","text":"เพิ่ม shared ลงใน .dockerignore เพื่อให้ Docker มองเห็นและรวมโฟลเดอร์นี้เข้า build context","correct":false,"why":".dockerignore ใช้ตัดไฟล์ออกจาก context การใส่เข้าไปมีผลตรงข้าม คือทำให้ Docker ไม่ส่งโฟลเดอร์นั้นไปเลย"},{"id":"D","text":"รัน build จากโฟลเดอร์รากของ monorepo ให้ context ครอบคลุม api และ shared แล้วชี้ Dockerfile ด้วย -f","correct":true,"why":"ถูกต้อง Docker ส่งเฉพาะไฟล์ใน build context ไปให้ builder การ COPY ออกนอก context จึงทำไม่ได้ ต้องขยาย context ให้ครอบคลุมสิ่งที่จะคัดลอก"}],"explanation":"build context คือชุดไฟล์ที่ Docker ส่งให้ builder (โฟลเดอร์ที่ระบุท้ายคำสั่ง docker build) คำสั่ง COPY อ้างถึงได้เฉพาะไฟล์ในนั้น ถ้าต้องใช้ไฟล์ข้างนอก ให้ย้ายจุดที่รัน build หรือขยาย context แล้วแก้ path ใน COPY ให้อิงจาก context ใหม่ เช่น COPY shared ./shared"},{"id":"OPS-J-E-005","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J2","concept":"reserved-vs-on-demand-steady-load","mobile":false,"type":"single","stem":"ทีมมีฐานข้อมูลสองชุด ชุด production เปิดตลอดเดือน (730 ชั่วโมง) ส่วนชุด dev ใช้เฉพาะเวลาทำงานประมาณ 176 ชั่วโมงต่อเดือน และปิดเองเมื่อไม่ใช้ ผู้ให้บริการคิดราคาแบบ on-demand ชั่วโมงละ 10 บาท หรือแบบ commitment ชั่วโมงละ 6 บาท โดยจ่ายครบทุกชั่วโมงของเดือนไม่ว่าจะใช้หรือไม่ การเลือกแบบใดทำให้ค่าใช้จ่ายรวมต่ำที่สุด","options":[{"id":"A","text":"ใช้ on-demand ทั้งสองชุด เพราะจ่ายตามชั่วโมงที่ใช้จริงและไม่ผูกมัดระยะยาว จึงรวมเป็นประมาณ 9,060 บาทต่อเดือน","correct":false,"why":"ชุด production ที่เปิดตลอดจะจ่าย 7,300 บาทแบบ on-demand แต่ถ้าใช้ commitment จะเหลือ 4,380 บาท รวมแล้วแพงกว่าตัวเลือกที่ดีที่สุด"},{"id":"B","text":"ใช้ commitment ทั้งสองชุด เพราะราคาต่อชั่วโมงถูกกว่า on-demand จึงรวมเป็นประมาณ 8,760 บาทต่อเดือน","correct":false,"why":"ชุด dev ใช้จริงเพียง 176 ชั่วโมงแต่ commitment คิดครบ 730 ชั่วโมง เป็น 4,380 บาท ขณะที่ on-demand เพียง 1,760 บาท"},{"id":"C","text":"ใช้ production แบบ on-demand และ dev แบบ commitment เพื่อให้ production ยืดหยุ่น รวมประมาณ 11,680 บาท","correct":false,"why":"เป็นการเลือกกลับด้าน ทำให้ทั้งสองชุดจ่ายแพงที่สุดในกรณีของตัวเอง คือ 7,300 บาทกับ 4,380 บาท"},{"id":"D","text":"ใช้ production แบบ commitment (ประมาณ 4,380 บาท) และ dev แบบ on-demand (ประมาณ 1,760 บาท) รวมราว 6,140 บาท","correct":true,"why":"ถูกต้อง commitment คุ้มเมื่อใช้งานเต็มเวลาสม่ำเสมอ ส่วนงานที่ใช้เป็นช่วงสั้น ๆ ควรจ่ายแบบ on-demand ผลรวม 6,140 บาทต่ำที่สุดในทุกตัวเลือก"}],"explanation":"แบบ commitment ให้ราคาต่อหน่วยถูกลงแลกกับการจ่ายครบตามที่ผูกไว้ จึงคุ้มกับโหลดที่เปิดต่อเนื่อง ส่วนโหลดที่ใช้ไม่สม่ำเสมอเหมาะกับ on-demand ควรคำนวณตามชั่วโมงใช้งานจริงของแต่ละ environment ก่อนตัดสินใจ"},{"id":"OPS-J-E-006","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J1","concept":"container-vs-vm-differences","mobile":false,"type":"multiple","stem":"เพื่อนร่วมทีมที่คุ้นเคยกับ virtual machine ถามว่า container ต่างจาก VM อย่างไร ข้อใดเป็นความต่างที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"container แต่ละตัวมี kernel ของระบบปฏิบัติการเป็นของตัวเองเหมือนกับ VM จึงแยกการทำงานจากกันได้เท่า VM","correct":false,"why":"container ใช้ kernel ร่วมกับเครื่องโฮสต์ ส่วนการมี kernel แยกเป็นของ VM"},{"id":"B","text":"container ใช้ kernel ร่วมกับเครื่องโฮสต์ จึงเริ่มทำงานเร็วและใช้ทรัพยากรน้อยกว่า VM ทั่วไป","correct":true,"why":"ถูกต้อง ไม่ต้องบูตระบบปฏิบัติการทั้งชุด container จึงเริ่มภายในไม่กี่วินาทีและแบ่งทรัพยากรของโฮสต์กันได้อย่างเบา"},{"id":"C","text":"การแยกส่วน (isolation) ของ container แข็งแรงกว่า VM เพราะอยู่ในระดับ process ที่เบากว่าการจำลองทั้งเครื่อง","correct":false,"why":"VM แยกกันที่ระดับฮาร์ดแวร์จำลองและมี kernel ของตัวเอง ขอบเขตการแยกโดยทั่วไปแข็งแรงกว่า container ที่แชร์ kernel"},{"id":"D","text":"image เดียวกันสร้าง container ได้หลายตัว และแต่ละตัวมี process และระบบไฟล์ส่วนที่เขียนได้เป็นของตัวเอง","correct":true,"why":"ถูกต้อง image เป็นแม่แบบแบบอ่านอย่างเดียว container แต่ละตัวที่สร้างจากมันมี writable layer และ process แยกกัน"},{"id":"E","text":"image ที่ build สำหรับ Linux รันบน kernel ของ Windows ได้โดยตรง แม้เครื่องโฮสต์จะไม่มี Linux kernel อยู่เลย","correct":false,"why":"image ของ Linux ต้องใช้ Linux kernel การรันบน Windows หรือ macOS ทำได้ผ่าน VM แบบ Linux ที่ซ่อนอยู่เบื้องหลัง ไม่ได้รันบน kernel ของ Windows โดยตรง"}],"explanation":"container คือ process ที่ถูกแยกขอบเขตบน kernel เดียวกับโฮสต์ จึงเบาและเร็วกว่า VM ที่จำลองทั้งเครื่องรวม kernel แต่ก็ได้ขอบเขตการแยกที่เบากว่า การเลือกใช้ขึ้นกับความต้องการเรื่องความเร็ว ความหนาแน่น และความปลอดภัย"},{"id":"OPS-J-E-007","level":"junior","pool":"exam","competency":"CI/CD","descriptor":"CICD-J3","concept":"ci-timezone-dependent-test","mobile":false,"type":"single","stem":"ฟังก์ชันตรวจเวลาทำการของร้าน (09:00 ถึง 18:00 ตามเวลาไทย) มี unit test ดังโค้ดด้านล่าง test ผ่านบนเครื่องนักพัฒนาในประเทศไทยทุกครั้ง แต่ใน pipeline ซึ่งรันบน agent ที่โฮสต์ในต่างประเทศ ล้มด้วยข้อความ Expected: true, Received: false ควรทำอย่างไร","code":"export function isOpen(now: Date): boolean {\n  const h = now.getHours();\n  return h >= 9 && h \u003c 18;\n}\n\ntest(\"เปิดทำการตอน 09:30 เวลาไทย\", () => {\n  const now = new Date(\"2026-03-02T02:30:00Z\");\n  expect(isOpen(now)).toBe(true);\n});","codeLang":"typescript","options":[{"id":"A","text":"ตั้ง pipeline ให้รันซ้ำอัตโนมัติสูงสุดสามครั้ง เพราะ test นี้น่าจะไม่เสถียรเป็นบางครั้งบน agent","correct":false,"why":"test ล้มสม่ำเสมอบน agent เครื่องนั้น ไม่ได้สุ่มเกิด การรันซ้ำจะได้ผลเดิมและบดบังปัญหาจริงของโค้ด"},{"id":"B","text":"ให้ฟังก์ชันคำนวณชั่วโมงโดยระบุ timezone เป็น Asia/Bangkok ชัดเจน แทน getHours() ที่ใช้ timezone ของเครื่อง","correct":true,"why":"ถูกต้อง ผลของฟังก์ชันจะไม่ขึ้นกับเครื่องที่รัน ทั้งบนเครื่องนักพัฒนา agent ใน pipeline และเซิร์ฟเวอร์จริง (ตั้ง TZ ของ pipeline ให้ตรงกันก็เป็นอีกทางที่ใช้ได้ แต่แก้ที่โค้ดทนทานกว่า)"},{"id":"C","text":"เปลี่ยนค่าที่ test คาดหวังเป็น false เพื่อให้ผ่านบน agent ของ pipeline และยังคงใช้ฟังก์ชัน isOpen เดิมต่อไป","correct":false,"why":"ทำให้ test ผ่านบน agent แต่ไปล้มบนเครื่องในไทยและขัดกับข้อกำหนดว่า 09:30 เวลาไทยต้องเป็นเวลาทำการ"},{"id":"D","text":"ติดตั้ง Node.js เวอร์ชันเดียวกับเครื่องนักพัฒนาบน agent ของ pipeline เพื่อให้สภาพแวดล้อมตรงกัน","correct":false,"why":"ความต่างของเวอร์ชัน Node.js ไม่ใช่สาเหตุ ผลต่างมาจากการที่ getHours() อ่าน timezone ของเครื่องที่รัน"}],"explanation":"โค้ดที่อ่านเวลาท้องถิ่นของเครื่อง (getHours, toLocaleString แบบไม่ระบุ timezone) จะให้ผลต่างกันตามที่รัน ซึ่งเป็นสาเหตุที่ test ผ่านในเครื่องแต่ล้มใน CI ให้ระบุ timezone ที่ต้องการอย่างชัดเจนในโค้ดที่เกี่ยวกับเวลาธุรกิจ เช่น UTC+7 ของไทย"},{"id":"OPS-J-E-008","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J1","concept":"api-gateway-single-entry-mobile","mobile":true,"type":"multiple","stem":"แอปมือถือของบริษัทต้องเรียกข้อมูลจาก backend service หลายตัว (orders, products, users) ทีมจึงวาง API gateway ไว้หน้าบริการเหล่านี้บนคลาวด์ ข้อใดอธิบายบทบาทของ API gateway ใน flow การสื่อสารนี้ได้ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เป็นจุดเข้าเดียวที่แอปเรียก แล้วส่งต่อ request ไปยัง service ที่รับผิดชอบตาม path","correct":true,"why":"ถูกต้อง แอปรู้จักที่อยู่เดียว ส่วนการเลือกว่าจะส่งต่อไป service ไหนเป็นหน้าที่ของ gateway"},{"id":"B","text":"เก็บข้อมูลคำสั่งซื้อและสินค้าถาวรไว้ใน gateway เองเพื่อตอบแอปได้เร็ว แทนการถามจาก service ปลายทาง","correct":false,"why":"gateway ไม่ได้เป็นที่เก็บข้อมูลของระบบ ข้อมูลหลักยังอยู่ในแต่ละ service และฐานข้อมูลของมัน"},{"id":"C","text":"ตรวจ token ของผู้เรียกและจำกัดอัตราการเรียก (rate limit) ก่อนส่ง request เข้าระบบ","correct":true,"why":"ถูกต้อง การจัดการร่วมที่ทุก request ต้องผ่านอย่างการตรวจสิทธิ์และ rate limit ทำที่จุดเดียวได้ แทนการเขียนซ้ำในทุก service"},{"id":"D","text":"ทำหน้าที่แทนฐานข้อมูลของแต่ละ service จึงไม่จำเป็นที่ service ต้องมีฐานข้อมูลของตัวเอง","correct":false,"why":"gateway ส่งต่อ request ไม่ได้เก็บข้อมูลถาวรแทน service แต่ละ service ยังต้องมีที่เก็บข้อมูลของตัวเอง"},{"id":"E","text":"ซ่อนที่อยู่และการแบ่ง service ภายในไว้ ทำให้ปรับโครงสร้างด้านหลังได้โดยแอปไม่ต้องเปลี่ยนที่อยู่ที่เรียก","correct":true,"why":"ถูกต้อง แอปที่ติดตั้งแล้วอัปเดตไม่ทัน gateway ช่วยให้ทีมแยกหรือรวม service ด้านหลังได้โดยไม่กระทบแอปเวอร์ชันเก่า"}],"explanation":"API gateway เป็นด่านหน้าของระบบ รวมการกำหนดเส้นทาง การตรวจสิทธิ์ และ rate limit ไว้ที่เดียว ช่วยซ่อนโครงสร้างภายใน ซึ่งสำคัญกับแอปมือถือเพราะอัปเดตให้ผู้ใช้ทุกคนพร้อมกันไม่ได้"},{"id":"OPS-J-E-009","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J1","concept":"bind-mount-hot-reload-dev","mobile":false,"type":"single","stem":"นักพัฒนาเว็บใช้ container รัน dev server ของ React เพื่อให้ทุกคนมี environment เหมือนกัน แต่ทุกครั้งที่แก้โค้ดต้อง build image ใหม่และรัน container ใหม่ถึงจะเห็นผล ควรปรับวิธีรัน container ในช่วงพัฒนาอย่างไร","options":[{"id":"A","text":"ลดจำนวน layer ใน Dockerfile ให้เหลือชั้นเดียวเพื่อให้ build image ใหม่ได้เร็วขึ้นทุกครั้งที่แก้โค้ด","correct":false,"why":"ยังต้อง build และรัน container ใหม่ทุกครั้งอยู่ดี ทำให้เร็วขึ้นได้บ้างแต่ไม่แก้ที่ต้นเหตุว่าโค้ดที่แก้อยู่นอก container"},{"id":"B","text":"ใช้ docker cp คัดลอกไฟล์ที่เพิ่งแก้เข้า container ที่รันอยู่ ทุกครั้งหลังกดบันทึกไฟล์ในเครื่องนักพัฒนา","correct":false,"why":"ต้องทำเองทุกครั้งที่แก้ และไฟล์ที่ลบหรือเปลี่ยนชื่อก็ไม่ตามไปด้วย เป็นภาระที่ bind mount จัดการให้โดยอัตโนมัติ"},{"id":"C","text":"mount โฟลเดอร์ซอร์สของเครื่องนักพัฒนาเข้า container ด้วย bind mount (-v) ให้ dev server เห็นไฟล์ที่แก้ทันที","correct":true,"why":"ถูกต้อง ไฟล์ในเครื่องกับใน container เป็นชุดเดียวกัน dev server จึงตรวจพบการเปลี่ยนแปลงและ reload ได้เอง โดยไม่ต้อง build ใหม่ (บางสภาพแวดล้อมอาจต้องเปิดโหมด polling ของตัวตรวจไฟล์)"},{"id":"D","text":"ย้ายการรัน dev server ออกจาก container ไปรันบนเครื่องโฮสต์โดยตรง แล้วใช้ container เฉพาะบริการอื่นอย่างฐานข้อมูล","correct":false,"why":"เห็นผลทันทีก็จริง แต่ dev server กลับไปพึ่งเครื่องของแต่ละคน ทำให้เสียเป้าหมายที่ทีมใช้ container เพื่อให้ทุกคนมี environment เหมือนกัน"}],"explanation":"ในช่วงพัฒนา การ bind mount โฟลเดอร์ซอร์สเข้า container ทำให้แก้โค้ดบนเครื่องแล้วเห็นผลทันที ส่วน image ที่ build เสร็จสมบูรณ์เป็นของที่ใช้ตอน deploy จริง จึงแยกวิธีรันสองกรณีนี้ออกจากกัน"},{"id":"OPS-J-E-010","level":"junior","pool":"exam","competency":"CI/CD","descriptor":"CICD-J2","concept":"mobile-build-number-increment","mobile":true,"type":"single","stem":"pipeline ของแอปมือถือ build ไฟล์ release แล้วอัปโหลดขึ้น store โดยอัตโนมัติ แต่ครั้งล่าสุดการอัปโหลดถูกปฏิเสธเพราะหมายเลข build (build number) ซ้ำกับตัวที่เคยอัปโหลดไปแล้ว ค่านี้ถูกเขียนค้างไว้ในไฟล์ config ของโปรเจกต์ ควรจัดการอย่างไร","options":[{"id":"A","text":"ลบ build
