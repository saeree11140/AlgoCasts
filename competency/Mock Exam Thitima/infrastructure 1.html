 เก่าที่ซ้ำออกจากหน้าจัดการของ store แล้วอัปโหลดไฟล์ใหม่ซ้ำด้วยหมายเลข build เดิม","correct":false,"why":"store ส่วนใหญ่ไม่อนุญาตให้นำหมายเลข build ที่เคยอัปโหลดแล้วกลับมาใช้ แม้ลบรุ่นเก่าไปแล้ว และวิธีนี้เป็นการแก้ด้วยมือทุกรอบ"},{"id":"B","text":"ให้นักพัฒนาแก้หมายเลข build ในไฟล์ config ด้วยมือก่อนทุกครั้งที่จะ release แล้วจึง commit ขึ้น repo ของทีม","correct":false,"why":"พึ่งการจำของคน ถ้าลืมก็ล้มซ้ำ และขั้นตอนมือแทรกอยู่ใน pipeline ที่ควรอัตโนมัติ"},{"id":"C","text":"ใช้วันที่ปัจจุบันเป็น version name และตั้งหมายเลข build เป็น 1 ใหม่ทุกครั้งที่ pipeline เริ่มทำงาน","correct":false,"why":"หมายเลข build ที่เป็น 1 ซ้ำกันทุกรอบ จึงถูกปฏิเสธซ้ำเมื่อรัน release มากกว่าหนึ่งครั้งใน version เดียวกัน และบาง store ต้องการให้ค่าเพิ่มขึ้นเสมอแม้ version name เปลี่ยน"},{"id":"D","text":"ให้ pipeline ใช้ตัวนับที่เพิ่มขึ้นทุกรอบ เช่นเลข run ของ pipeline เป็นหมายเลข build แล้วฉีดค่าตอน build","correct":true,"why":"ถูกต้อง ตัวนับของ pipeline เพิ่มขึ้นทุกรอบและไม่ซ้ำ จึงได้หมายเลข build ที่ store ยอมรับโดยไม่มีขั้นตอนมือ"}],"explanation":"หมายเลข build ของแอปมือถือต้องไม่ซ้ำและเพิ่มขึ้นในทุกการอัปโหลด ให้ pipeline เป็นผู้กำหนดเองจากตัวนับ ส่วน version name ที่ผู้ใช้เห็นยังคงเป็นเรื่องของทีมผลิตภัณฑ์"},{"id":"OPS-J-E-011","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J3","concept":"sla-downtime-budget-calc","mobile":false,"type":"single","stem":"สัญญาระบุว่าบริการต้องมี availability 99.9% ต่อเดือน (คิดเดือนละ 30 วัน เท่ากับ 43,200 นาที) ในเดือนที่ผ่านมาระบบล่มรวม 90 นาที ข้อสรุปใดถูกต้อง","options":[{"id":"A","text":"ไม่ตามเกณฑ์ เพราะ 99.9% ยอมให้ล่มได้ราว 43 นาทีต่อเดือน แต่ล่มจริง 90 นาที (availability ราว 99.79%)","correct":true,"why":"ถูกต้อง 0.1% ของ 43,200 นาทีเท่ากับ 43.2 นาที และ 1 ลบ 90 หาร 43,200 ได้ประมาณ 99.79% ซึ่งต่ำกว่า 99.9%"},{"id":"B","text":"ตามเกณฑ์ เพราะระบบล่มเพียงราว 0.2% ของทั้งเดือน ซึ่งน้อยกว่า 1% ที่สัญญายอมให้ล่มได้ในแต่ละเดือน","correct":false,"why":"สัญญา 99.9% ยอมให้ล่มได้ 0.1% ไม่ใช่ 1% และ 0.2% ที่ล่มจริงก็เกิน 0.1% ที่ยอมให้"},{"id":"C","text":"ตามเกณฑ์ เพราะ 99.9% ยอมให้ล่มได้ราว 9 ชั่วโมงต่อเดือน ซึ่งมากกว่า 90 นาทีที่ล่มไปจริงในเดือนนี้","correct":false,"why":"ตัวเลขราว 9 ชั่วโมงเป็นเวลาล่มที่ 99.9% ยอมให้ในหนึ่งปี (ประมาณ 8.76 ชั่วโมง) ไม่ใช่ต่อเดือน"},{"id":"D","text":"ไม่ตามเกณฑ์ เพราะ availability ที่ได้เหลือราว 98% (ล่มไป 2% ของเดือน) ซึ่งต่ำกว่า 99.9% ที่สัญญาไว้","correct":false,"why":"ผลคำนวณคลาดเคลื่อน 10 เท่า 90 นาทีจาก 43,200 นาทีเป็นราว 0.2% ไม่ใช่ 2% ข้อสรุปว่าไม่ตามเกณฑ์ถูก แต่ตัวเลขไม่ถูก"}],"explanation":"availability คือสัดส่วนเวลาที่ใช้งานได้ต่อเวลาทั้งหมด 99.9% ต่อเดือนเทียบเท่าเวลาล่มที่ยอมได้ประมาณ 43 นาที ควรคำนวณงบเวลาล่มจากเดือนจริงของสัญญาก่อนเปรียบเทียบกับผลที่วัดได้ และระวังสับสนระหว่างค่าต่อเดือนกับต่อปี"},{"id":"OPS-J-E-012","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J2","concept":"port-already-allocated","mobile":false,"type":"single","stem":"นักพัฒนารัน docker run -d -p 8080:80 nginx แล้วได้ error ดังด้านล่าง ทั้งที่เมื่อวานรันได้ปกติ ควรเริ่มตรวจและแก้อย่างไร","code":"docker: Error response from daemon: driver failed programming external connectivity\non endpoint eager_turing: Bind for 0.0.0.0:8080 failed: port is already allocated.","codeLang":"text","options":[{"id":"A","text":"image nginx ในเครื่องเสียหาย ควรลบ image แล้วรัน docker pull ใหม่ก่อนสั่งรัน container อีกครั้ง","correct":false,"why":"error ระบุว่าผูกพอร์ต 8080 ไม่ได้ ไม่ใช่ปัญหาของตัว image ซึ่งสร้าง container ผ่านขั้นตอนมาแล้วจนถึงตอนเปิดพอร์ต"},{"id":"B","text":"พอร์ต 8080 ของโฮสต์ถูกโปรแกรมหรือ container อื่นใช้อยู่ ให้หาตัวที่ใช้แล้วหยุดมัน หรือเปลี่ยนเป็น -p 8081:80","correct":true,"why":"ถูกต้อง พอร์ตฝั่งโฮสต์ผูกกับ process ได้ทีละตัว ตรวจด้วย docker ps หรือเครื่องมือดูพอร์ตของระบบ แล้วเลือกหยุดตัวเดิมหรือ map ไปพอร์ตอื่น"},{"id":"C","text":"พอร์ต 80 ภายใน container ถูกใช้แล้ว ต้องแก้ให้ nginx ฟังพอร์ตอื่นภายใน container แทนพอร์ต 80 เดิม","correct":false,"why":"container แต่ละตัวมี network namespace ของตัวเอง พอร์ต 80 ในนั้นไม่ชนกับตัวอื่น และ error ระบุ 0.0.0.0:8080 ซึ่งเป็นฝั่งโฮสต์"},{"id":"D","text":"ต้องเพิ่มพอร์ต 8080 ลงใน EXPOSE ของ Dockerfile แล้ว build image ใหม่ก่อน จึงจะ map พอร์ตนี้ด้วย -p ได้","correct":false,"why":"EXPOSE เป็นเพียงข้อมูลประกอบ การ map ด้วย -p ใช้ได้โดยไม่ต้องมี EXPOSE และไม่ใช่ที่มาของ error นี้"}],"explanation":"port is already allocated แปลว่าพอร์ตฝั่งโฮสต์มีผู้ใช้อยู่แล้ว ซึ่งอาจเป็น container เก่าที่ลืมหยุดหรือโปรแกรมอื่นในเครื่อง ให้หาผู้ใช้พอร์ตนั้นก่อน แล้วหยุดมันหรือเปลี่ยนพอร์ตฝั่งโฮสต์ในคำสั่ง -p"},{"id":"OPS-J-E-013","level":"junior","pool":"exam","competency":"CI/CD","descriptor":"CICD-J2","concept":"pipeline-dependency-cache-key","mobile":false,"type":"single","stem":"ขั้นตอนติดตั้ง dependencies ใน pipeline ใช้เวลา 4 นาทีทุกครั้ง ทีมจะเพิ่มขั้นตอน cache โฟลเดอร์ cache ของ npm เพื่อให้ build เร็วขึ้น และต้องกำหนด cache key เพื่อบอกว่าเมื่อใดควรใช้ cache เดิมหรือสร้างใหม่ key แบบใดเหมาะที่สุด","options":[{"id":"A","text":"ใช้หมายเลข build ของแต่ละรอบ (ตัวเลขที่ pipeline เพิ่มให้ทุกครั้งที่รัน) เป็น key ของ cache","correct":false,"why":"หมายเลข build เปลี่ยนทุกรอบ key จึงไม่เคยตรงกับ cache เดิม ทำให้ไม่มีการใช้ cache ซ้ำเลย"},{"id":"B","text":"ใช้วันที่ของวัน build (เช่น 2026-03-02) เป็น key เพื่อให้สร้าง cache ใหม่วันละครั้ง","correct":false,"why":"key เปลี่ยนทุกวันแม้ lockfile ไม่เปลี่ยน ทำให้สร้าง cache ใหม่โดยไม่จำเป็น และภายในวันเดียวกันก็ไม่ตอบสนองเมื่อ dependency เปลี่ยน"},{"id":"C","text":"ใช้ค่า hash ของ package-lock.json เป็นส่วนหลักของ key เพื่อให้สร้าง cache ใหม่เมื่อ dependency เปลี่ยน","correct":true,"why":"ถูกต้อง lockfile ไม่เปลี่ยน key เดิมก็ใช้ cache เดิมได้ทันที พอเพิ่มหรืออัปเดตแพ็กเกจ hash เปลี่ยนและ cache ถูกสร้างใหม่"},{"id":"D","text":"ใช้ข้อความคงที่ เช่น npm-cache เป็น key ตลอดไป เพื่อให้ทุกรอบเจอ cache เดิมแน่นอน","correct":false,"why":"cache แรกถูกใช้ต่อไปเรื่อย ๆ แพ็กเกจที่เพิ่มหรือเปลี่ยนทีหลังมักไม่เข้า cache ต้องดาวน์โหลดใหม่ทุกรอบและแก้ได้เมื่อไปล้าง cache เอง"}],"explanation":"cache key ควรผูกกับสิ่งที่กำหนดเนื้อหาของ cache คือไฟล์ lockfile เมื่อ lockfile เปลี่ยน key เปลี่ยนและสร้าง cache ใหม่ เมื่อไม่เปลี่ยน build จะใช้ cache เดิมได้ทันที"},{"id":"OPS-J-E-014","level":"junior","pool":"exam","competency":"Container","descriptor":"CTR-J2","concept":"container-debug-commands-logs-inspect-exec","mobile":false,"type":"multiple","stem":"container ของ API ขึ้นสถานะ running แต่ตอบ request ผิดปกติ เมื่อต้องสืบหาสาเหตุเบื้องต้น คำสั่งหรือวิธีใดช่วยได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"docker logs เพื่ออ่านข้อความที่แอปเขียนออก stdout และ stderr ย้อนหลังตามช่วงเวลาที่เกิดปัญหา","correct":true,"why":"ถูกต้อง แอปที่ทำงานตามแนวปฏิบัติของ container เขียน log ออก stdout และ stderr ซึ่ง docker logs อ่านได้ เป็นจุดเริ่มต้นที่ควรดูก่อน"},{"id":"B","text":"docker system prune -a เพื่อล้างทรัพยากรที่ไม่ใช้ แล้วรัน container ใหม่ให้สะอาด","correct":false,"why":"เป็นการลบ image และทรัพยากรที่ไม่ได้ใช้ออกทั้งเครื่อง ไม่ได้บอกสาเหตุของอาการ และทำให้ต้องดึง image ใหม่โดยไม่จำเป็น"},{"id":"C","text":"docker exec -it แล้วเปิด shell เข้าไปดู environment variable ไฟล์ config และลองเรียกบริการที่แอปพึ่งพา","correct":true,"why":"ถูกต้อง การเข้าไปดูจากมุมของ container เองเห็นสิ่งที่แอปเห็นจริง เช่นค่าตัวแปรและการเชื่อมต่อ"},{"id":"D","text":"docker inspect เพื่อดู config จริงของ container เช่น environment, mounts, network และสถานะ health","correct":true,"why":"ถูกต้อง ช่วยตรวจว่าค่าที่ตั้งไว้ตรงกับที่ตั้งใจหรือไม่ เช่น ตัวแปรสภาพแวดล้อมหรือ volume ที่ผูกผิดที่"}],"explanation":"ลำดับสืบเบื้องต้น: อ่าน log ด้วย docker logs ตรวจค่าที่ตั้งจริงด้วย docker inspect และเข้าไปดูภายในด้วย docker exec ก่อนจะเปลี่ยนหรือลบอะไร การล้างทรัพยากรทั้งเครื่องไม่ใช่การวินิจฉัย"},{"id":"OPS-J-E-015","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J2","concept":"right-size-low-utilization","mobile":false,"type":"multiple","stem":"VM ตัวหนึ่งสำหรับ API ภายในมี CPU เฉลี่ยประมาณ 8% และหน่วยความจำประมาณ 20% มาตลอดสามเดือน บิลรายเดือนสูงเกินงบ ข้อใดช่วยลดค่าใช้จ่ายได้ตรงกับสาเหตุนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ซื้อ commitment ระยะ 3 ปีสำหรับ VM ขนาดปัจจุบัน เพื่อรับส่วนลดต่อชั่วโมง","correct":false,"why":"ล็อกขนาดที่เกินความจำเป็นไว้ถึง 3 ปี แม้ได้ส่วนลดต่อหน่วย ก็ยังจ่ายสำหรับกำลังที่ไม่ได้ใช้ และเปลี่ยนขนาดภายหลังได้ยาก"},{"id":"B","text":"ลดขนาด VM ลงเป็นรุ่นที่เล็กกว่า (right-sizing) โดยอาศัยสถิติการใช้งานจริง","correct":true,"why":"ถูกต้อง ใช้ทรัพยากรเฉลี่ยต่ำมากเมื่อเทียบกับที่จัดสรร การลดขนาดลดราคาต่อชั่วโมงโดยตรง ควรเผื่อช่วงโหลดสูงสุดจากสถิติด้วย"},{"id":"C","text":"เพิ่ม VM เป็นสองตัวเพื่อให้ CPU เฉลี่ยต่อเครื่องต่ำลงไปอีก","correct":false,"why":"เป็นการจ่ายเพิ่มสำหรับกำลังที่ไม่ได้ใช้ ปัญหาคือจัดสรรเกินความต้องการ การเพิ่มเครื่องทำให้เกินมากขึ้น"},{"id":"D","text":"ตั้งเวลาปิดและเปิด VM อัตโนมัติ หรือใช้ autoscaling หากภาระงานมีช่วงที่ไม่ได้ใช้เลย","correct":true,"why":"ถูกต้อง ลดชั่วโมงที่ต้องจ่ายในช่วงที่ไม่มีคนใช้ ใช้ได้เมื่อรูปแบบการใช้งานเอื้อ เช่น API ภายในที่ใช้เฉพาะเวลาทำงาน"}],"explanation":"เมื่อสถิติจริงชี้ว่าใช้ทรัพยากรน้อยกว่าที่จัดสรรมาก ให้ปรับขนาดให้เหมาะสมก่อน แล้วค่อยพิจารณาตัวเลือกด้านราคา เช่น commitment กับขนาดที่ปรับแล้ว การซื้อส่วนลดก่อนปรับขนาดเป็นการล็อกความสิ้นเปลืองไว้"},{"id":"OPS-J-E-016","level":"junior","pool":"exam","competency":"Cloud","descriptor":"CLD-J3","concept":"shared-responsibility-managed-db","mobile":false,"type":"multiple","stem":"ทีมย้ายฐานข้อมูลลูกค้าไปใช้บริการฐานข้อมูล managed ของผู้ให้บริการคลาวด์ ภายใต้แนวคิด shared responsibility งานใดยังเป็นความรับผิดชอบของทีมเราเอง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ติดตั้งแพตช์ระบบปฏิบัติการบนเครื่องที่รันฐานข้อมูล และตั้งเวลา reboot เครื่องเมื่อมีรุ่นใหม่","correct":false,"why":"สำหรับบริการ managed ผู้ให้บริการเป็นผู้ดูแลเครื่องและระบบปฏิบัติการข้างใต้ ทีมกำหนดได้เพียงช่วงเวลา maintenance ตามที่บริการเปิดให้"},{"id":"B","text":"กำหนดผู้ใช้และสิทธิ์ที่เข้าถึงฐานข้อมูล รวมถึงการหมุนเวียนรหัสผ่านและ key","correct":true,"why":"ถูกต้อง ใครเข้าถึงข้อมูลได้เป็นเรื่องของลูกค้าเสมอ ผู้ให้บริการเตรียมกลไกให้ แต่ทีมต้องตั้งค่าและดูแลเอง"},{"id":"C","text":"ดูแลความปลอดภัยทางกายภาพของ data center ที่ตั้งเครื่องฐานข้อมูล รวมถึงการควบคุมการเข้าออกอาคาร","correct":false,"why":"ความปลอดภัยทางกายภาพของอาคารและฮาร์ดแวร์เป็นความรับผิดชอบของผู้ให้บริการคลาวด์ในทุกรูปแบบบริการ"},{"id":"D","text":"ตั้งค่า network ให้ฐานข้อมูลเข้าถึงได้เฉพาะจากแอปของเรา ไม่เปิดสู่อินเทอร์เน็ตสาธารณะ","correct":true,"why":"ถูกต้อง ผู้ให้บริการมีตัวเลือก network ให้ แต่การเลือกเปิดหรือปิดการเข้าถึงจากภายนอกเป็นการตั้งค่าของทีม"},{"id":"E","text":"ออกแบบ schema, index และกำหนดอายุการเก็บและการลบข้อมูลส่วนบุคคลตาม PDPA","correct":true,"why":"ถูกต้อง เนื้อหาและวงจรชีวิตของข้อมูลเป็นหน้าที่ของเจ้าของข้อมูล ผู้ให้บริการไม่รู้ว่าข้อมูลใดต้องเก็บหรือลบเมื่อใด"}],"explanation":"ใน shared responsibility ผู้ให้บริการดูแลโครงสร้างพื้นฐานและบริการที่ยกให้ ส่วนลูกค้ารับผิดชอบข้อมูล สิทธิ์การเข้าถึง และการตั้งค่า network ของตน การใช้บริการ managed ลดงานแพตช์และฮาร์ดแวร์ แต่ไม่ได้โอนความรับผิดชอบด้านข้อมูลไปให้"}]},"senior":{"practice":[{"id":"OPS-S-P-001","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S1","concept":"container-network-segmentation","mobile":false,"type":"single","stem":"ทีมรัน web, api และ db ด้วย Docker Compose บน VM เครื่องเดียว ข้อกำหนดคือ ผู้ใช้ภายนอกเข้าถึงได้เฉพาะ web, api ต้องเรียก db ด้วยชื่อ service ได้ และ web ต้องเชื่อมต่อ db โดยตรงไม่ได้ ควรกำหนดเครือข่ายของ container อย่างไรจึงตรงกับข้อกำหนดทั้งหมด","options":[{"id":"A","text":"ให้ทุก service อยู่ใน network เดียวกัน แล้วผูก port ของ db ไว้กับ 127.0.0.1 ของ host เพื่อกันไม่ให้ภายนอกเข้าถึง db ได้","correct":false,"why":"ผิด เพราะการผูก port กับ 127.0.0.1 จำกัดการเข้าถึงจากภายนอก host เท่านั้น แต่ web ยังอยู่ใน network เดียวกับ db จึงเรียกชื่อและ port ของ db ได้โดยตรง ซึ่งขัดกับข้อกำหนดข้อสุดท้าย"},{"id":"B","text":"ใช้ network mode แบบ host กับทุก service แล้วตั้ง firewall บน VM ให้ web ออกไปหา api ได้เท่านั้น และ api ออกไปหา db ได้เท่านั้น","correct":false,"why":"ผิด เพราะโหมด host ทำให้ container ใช้ network ของ host ร่วมกัน ไม่มีการแยกเครือข่ายและไม่มีการ resolve ชื่อ service อีกทั้งกฎ firewall ที่แยกตามแต่ละ process ดูแลยากและพลาดง่ายกว่าการแยก network"},{"id":"C","text":"สร้าง user-defined network สองวง วงแรกมี web กับ api วงที่สองมี api กับ db โดย api อยู่ทั้งสองวง และ publish port เฉพาะของ web","correct":true,"why":"ถูก เพราะ container จะคุยกันได้เฉพาะเมื่ออยู่ใน network เดียวกัน การแยกเป็นสองวงทำให้ web มองไม่เห็น db ส่วน api เรียก db ด้วยชื่อ service ผ่าน DNS ภายในของ network ได้ และมีเพียง web เท่านั้นที่เปิด port ออกสู่ภายนอก"},{"id":"D","text":"เชื่อม container ผ่าน legacy link ระหว่างเฉพาะคู่ที่ต้องคุยกัน โดยปล่อยให้ทั้งหมดอยู่ใน default bridge เพราะจำกัดการเชื่อมต่อได้ละเอียดกว่า","correct":false,"why":"ผิด เพราะ legacy link เป็นกลไกที่เลิกแนะนำแล้ว และ container บน default bridge เดียวกันยังเรียกหากันทาง IP ได้อยู่ จึงไม่ได้แยก web ออกจาก db จริง"}],"explanation":"การแยก network ให้ตรงกับเส้นทางการสื่อสารที่ต้องการคือเครื่องมือหลักของ container networking: ใครอยู่ network เดียวกันจึงคุยกันได้ และชื่อ service ถูก resolve ผ่าน DNS ภายใน เมื่อมีหลายชั้นให้ใช้ service ที่อยู่คร่อมสองวงทำหน้าที่เป็นด่านกลาง และเปิด port ออกสู่ภายนอกเฉพาะ service ที่ต้องรับผู้ใช้ ในงานจริงควรเสริม firewall ระดับ host ด้วย แต่ไม่ควรใช้แทนการแยก network"},{"id":"OPS-S-P-002","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S1","concept":"stateful-container-data-durability","mobile":false,"type":"multiple","stem":"ทีมรัน PostgreSQL เป็น container เดียวบน VM สำหรับระบบภายใน เคยเกิดเหตุข้อมูลหายหลังลบ container แล้วสร้างใหม่ตอนอัปเกรด version ข้อใดช่วยให้ข้อมูลอยู่รอดเมื่อเปลี่ยน container และกู้คืนได้เมื่อ VM เสียหาย (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"สั่ง docker commit เก็บ container เป็น image ทุกคืน แล้วใช้ image นั้นสร้าง container ใหม่ตอนอัปเกรด","correct":false,"why":"ผิด เพราะ image ของ PostgreSQL มักประกาศ data directory เป็น volume ทำให้ commit ไม่เก็บข้อมูลส่วนนี้ อีกทั้งไฟล์ฐานข้อมูลที่กำลังถูกเขียนขณะ commit อาจอยู่ในสภาพไม่สอดคล้องกัน"},{"id":"B","text":"mount data directory จาก volume ที่อยู่นอกวงจรชีวิตของ container เช่น named volume หรือ bind mount ไปยังดิสก์ถาวร","correct":true,"why":"ถูก เพราะข้อมูลที่อยู่ใน volume ยังคงอยู่เมื่อ container ถูกลบ และ container ใหม่ mount volume เดิมกลับมาใช้ต่อได้"},{"id":"C","text":"เก็บข้อมูลใน writable layer ของ container ตามเดิม แล้วอัปเกรดโดย docker exec เข้าไปติดตั้ง version ใหม่แทนการสร้าง container ใหม่","correct":false,"why":"ผิด เพราะข้อมูลใน writable layer ผูกกับ container ตัวนั้น หาก container ถูกลบหรือ VM เสียก็หายหมด และการแก้ภายใน container ที่รันอยู่ทำให้สภาพจริงต่างจาก image จนทำซ้ำไม่ได้"},{"id":"D","text":"รัน container ตัวที่สองบน VM เดียวกันให้ชี้ไปที่ data directory เดียวกับตัวแรก เพื่อให้มีตัวสำรองพร้อมสลับ","correct":false,"why":"ผิด เพราะ PostgreSQL สองตัวที่เขียน data directory เดียวกันพร้อมกันทำให้ข้อมูลเสียหายได้ และไม่ใช่การทำสำเนา ถ้าต้องการตัวสำรองต้องใช้ replication ที่แยกชุดข้อมูลกัน"},{"id":"E","text":"ตั้งงานสำรองข้อมูลเป็นรอบด้วย dump หรือ snapshot ของ volume ส่งไปเก็บนอก VM และซ้อมกู้คืนจริงเป็นระยะ","correct":true,"why":"ถูก เพราะ volume อยู่บน VM เดียวกัน หาก VM หรือดิสก์เสียก็หายไปด้วย สำเนาที่เก็บภายนอกและการซ้อมกู้คืนเป็นสิ่งที่ยืนยันว่ากู้ได้จริง"}],"explanation":"volume แก้ปัญหาเรื่องอายุของ container แต่ไม่ใช่ backup: ถ้า VM หรือดิสก์เสีย หรือมีคนลบข้อมูลผิด volume ก็หายหรือเสียไปด้วย จึงต้องแยกสองเรื่อง คือข้อมูลต้องไม่ผูกกับ container และต้องมีสำเนาภายนอกที่พิสูจน์แล้วว่ากู้คืนได้ การซ้อมกู้คืนสำคัญพอ ๆ กับการสำรอง"},{"id":"OPS-S-P-003","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S2","concept":"migration-wave-planning","mobile":false,"type":"single","stem":"บริษัทมี 12 แอปรันบน VM ทีมเพิ่งเริ่มใช้ container และต้องย้ายให้ครบภายใน 6 เดือน โดยธุรกิจรับ downtime ได้น้อยมาก ควรวางลำดับการย้ายอย่างไร","options":[{"id":"A","text":"เริ่มจาก service แบบ stateless ที่ความเสี่ยงต่ำและมีการทดสอบอัตโนมัติ เพื่อวางท่อ build, registry, deploy และ monitoring ก่อน แล้วค่อยย้ายระบบสำคัญและระบบที่มี state โดยเก็บ VM เดิมไว้ให้ย้อนกลับ","correct":true,"why":"ถูก เพราะรอบแรกคือการเรียนรู้และสร้างแพลตฟอร์ม ความผิดพลาดจึงควรเกิดกับระบบที่กระทบน้อย เมื่อกระบวนการนิ่งแล้วจึงย้ายระบบที่เสี่ยงกว่า และ VM เดิมที่ยังอยู่ทำให้ย้อนกลับได้เมื่อมีปัญหา"},{"id":"B","text":"เริ่มจากระบบชำระเงินซึ่งสำคัญที่สุด เพราะถ้าย้ายสำเร็จก็ยืนยันได้ทันทีว่าแนวทางนี้ใช้ได้กับระบบที่เหลือทั้งหมดของบริษัท และได้รับความสนใจจากผู้บริหารมากพอที่จะได้ทรัพยากรสนับสนุนเต็มที่","correct":false,"why":"ผิด เพราะทีมยังไม่มีประสบการณ์ จึงเอาระบบที่เสียหายสูงสุดมาเป็นบทเรียนแรก ความผิดพลาดในการตั้งค่า storage, network หรือ monitoring จะกระทบรายได้โดยตรง"},{"id":"C","text":"แยกทุกแอปเป็น microservices ให้เสร็จก่อน แล้วค่อยบรรจุเป็น container ในรอบเดียวเพื่อลดจำนวนรอบการย้ายตลอดระยะ 6 เดือนนี้ และได้สถาปัตยกรรมที่เหมาะกับ container ตั้งแต่แรกโดยแทบไม่มีงานแก้ภายหลัง","correct":false,"why":"ผิด เพราะการ refactor สถาปัตยกรรมกับการย้ายแพลตฟอร์มเป็นการเปลี่ยนสองเรื่องพร้อมกัน ทำให้หาสาเหตุเมื่อมีปัญหาได้ยาก และเสี่ยงที่จะไม่ทันกำหนดเวลา ควรบรรจุแอปเดิมเป็น container ก่อนโดยแก้เท่าที่จำเป็น"},{"id":"D","text":"ย้ายทั้ง 12 แอปพร้อมกันในช่วง maintenance window สุดสัปดาห์เดียว เพื่อให้ช่วงที่ต้องดูแลสองระบบคู่กันสั้นที่สุดและตัดภาระเดิมออกเร็ว","correct":false,"why":"ผิด เพราะการสลับทั้งหมดในครั้งเดียวทำให้ช่วงที่ปัญหาปรากฏพร้อมกันหลายระบบ ทีมที่ยังไม่ชำนาญรับมือไม่ทัน และแผนย้อนกลับของ 12 แอปพร้อมกันซับซ้อนมาก ซึ่งขัดกับเงื่อนไขที่รับ downtime ได้น้อย"}],"explanation":"การย้ายหลายระบบควรเป็นคลื่นเป็นลำดับ: คลื่นแรกใช้ระบบความเสี่ยงต่ำเพื่อสร้างและพิสูจน์แพลตฟอร์ม คลื่นถัดไปขยับไปสู่ระบบที่สำคัญและมี state และเก็บเส้นทางย้อนกลับไว้จนกว่าจะมั่นใจ แยกเรื่อง lift-and-shift ออกจากการ refactor เพื่อให้รู้ว่าปัญหามาจากอะไร"},{"id":"OPS-S-P-004","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S2","concept":"stateless-prerequisites-for-replicas","mobile":false,"type":"multiple","stem":"เว็บแอปเดิมรันบน VM เครื่องเดียว เก็บ session ในหน่วยความจำของ process บันทึกไฟล์ที่ผู้ใช้อัปโหลดลงดิสก์ของเครื่อง และมี scheduled job ที่รันอยู่ใน process เดียวกัน ทีมจะย้ายไปรันเป็น container หลาย replica หลัง load balancer สิ่งใดต้องจัดการก่อนเพิ่มจำนวน replica (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ย้าย session ไปเก็บใน store กลาง เช่น Redis หรือใช้ token ที่ฝั่ง client ถือ เพื่อให้ replica ใดก็ตอบผู้ใช้คนเดิมได้","correct":true,"why":"ถูก เพราะ session ในหน่วยความจำของ replica หนึ่งจะไม่มีใน replica อื่น ผู้ใช้จะถูกเด้งออกจากระบบเมื่อคำขอไปตกที่ตัวอื่น"},{"id":"B","text":"ฝังโฟลเดอร์ที่ผู้ใช้อัปโหลดไว้ใน image ตอน build เพื่อให้ทุก replica เห็นไฟล์ชุดเดียวกัน","correct":false,"why":"ผิด เพราะไฟล์ที่อัปโหลดเกิดขึ้นตอนรัน ไม่ใช่ตอน build ไฟล์ใหม่ที่ผู้ใช้ส่งมาไม่ถูกแชร์ให้ replica อื่น และ image จะต้องถูก build ใหม่ทุกครั้งที่มีไฟล์เพิ่ม"},{"id":"C","text":"ย้ายไฟล์ที่อัปโหลดไปไว้ใน object storage หรือ shared storage ที่ทุก replica เข้าถึงได้ แทนดิสก์ของ container","correct":true,"why":"ถูก เพราะไฟล์บนดิสก์ของ replica หนึ่งอีกตัวมองไม่เห็น และหายไปเมื่อ container ถูกแทนที่"},{"id":"D","text":"แยก scheduled job ให้รันเป็นงานเดียว เช่น เป็น job แยกต่างหากหรือใช้ lock กลาง ไม่ให้ทุก replica รันงานเดียวกันซ้ำ","correct":true,"why":"ถูก เพราะถ้า job ฝังอยู่ใน process ของแอป ทุก replica จะรันงานเดียวกันพร้อมกัน เช่น ตัดยอดหรือส่งอีเมลซ้ำหลายรอบ"}],"explanation":"การรันหลาย replica ต้องการให้แต่ละตัวแทนกันได้ (stateless) สิ่งที่ผูกกับเครื่องเดียว ไม่ว่า session ในหน่วยความจำ ไฟล์บนดิสก์ หรืองานตั้งเวลาใน process ต้องย้ายไปไว้ที่ที่ใช้ร่วมกันหรือแยกออกมาก่อน ไม่เช่นนั้นการเพิ่ม replica จะสร้างบั๊กที่เกิดเป็นช่วง ๆ ซึ่งหาสาเหตุยาก"},{"id":"OPS-S-P-005","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S3","concept":"scan-gate-unfixed-findings-exception-policy","mobile":false,"type":"single","stem":"pipeline ของ 10 บริการเพิ่มด่าน scan image ที่ทำให้ build ล้มเมื่อพบช่องโหว่ระดับ HIGH ขึ้นไปทุกรายการ หลังเปิดใช้ build ราว 60% ถูกบล็อก เมื่อดูรายงานพบว่าส่วนใหญ่เป็นช่องโหว่ในแพ็กเกจระบบปฏิบัติการของ base image ที่ผู้ดูแล distribution ระบุสถานะว่ายังไม่มีรุ่นแก้ไข ทีมแพตช์เองไม่ได้ ธุรกิจต้องปล่อยเวอร์ชันตามกำหนด ขณะที่ทีมความปลอดภัยไม่ต้องการให้ช่องโหว่ที่มีรุ่นแก้ไขแล้วหลุดไปถึง production ควรกำหนดนโยบายของด่าน scan อย่างไร","options":[{"id":"A","text":"ลดเกณฑ์ให้ล้มเฉพาะระดับ CRITICAL สำหรับทุกบริการ แล้วเก็บรายการระดับ HIGH ไว้ในรายงานเป็นข้อมูลประกอบและให้ทีมทยอยแก้ตามรอบพัฒนา","correct":false,"why":"ผิด เพราะช่องโหว่ HIGH ที่มีรุ่นแก้ไขแล้วจะผ่านขึ้น production ได้ ทั้งที่แก้ได้ง่ายด้วยการอัปเดตแพ็กเกจหรือ base image ซึ่งเป็นสิ่งที่ทีมความปลอดภัยไม่ต้องการ"},{"id":"B","text":"ให้ด่าน scan แจ้งเตือนอย่างเดียวโดยไม่บล็อก build ในช่วงใกล้ release แล้วกลับมาบล็อกเมื่อพ้นช่วงนั้น พร้อมสรุปรายการที่พบส่งให้ทีมความปลอดภัยทุกสัปดาห์เพื่อตามแก้ภายหลัง","correct":false,"why":"ผิด เพราะช่วง release คือช่วงที่ image ใหม่ขึ้น production มากที่สุด การปิดด่านจึงปล่อยทั้งช่องโหว่ที่แก้ได้และแก้ไม่ได้ผ่านไป และด่านที่เปิดปิดตามช่วงเวลาอาจถูกลืมเปิดกลับ"},{"id":"C","text":"เพิ่มรหัส CVE ทั้งหมดที่พบในรายงานตอนนี้ลง allowlist ถาวรของด่าน scan แล้วบล็อกเฉพาะ CVE ที่ไม่อยู่ในรายการ เพื่อให้ build ผ่านต่อได้","correct":false,"why":"ผิด เพราะรายการปัจจุบันปนช่องโหว่ที่มีรุ่นแก้ไขแล้วเข้าไปด้วย และ allowlist ถาวรไม่มีเจ้าของหรือวันหมดอายุ เมื่อ distribution ออกรุ่นแก้ไขภายหลังด่านก็ยังปล่อยผ่านต่อไป"},{"id":"D","text":"บล็อกเมื่อพบ HIGH ขึ้นไปที่มีรุ่นแก้ไขแล้ว ส่วนที่ยังไม่มีรุ่นแก้ไขให้บันทึกเป็นข้อยกเว้นที่มีเจ้าของ เหตุผล และวันหมดอายุ แล้วประเมินใหม่เมื่อครบกำหนด","correct":true,"why":"ถูก เพราะสิ่งที่ทีมลงมือแก้ได้จริงคือการใช้รุ่นที่แก้แล้ว ด่านจึงบล็อกเฉพาะส่วนนั้น ส่วนที่ยังไม่มีรุ่นแก้ไขต้องมีข้อยกเว้นที่ตรวจสอบได้และหมดอายุ จึงไม่ถูกลืม และเมื่อมีรุ่นแก้ไขออกมาด่านจะเริ่มบล็อกเอง"}],"explanation":"ด่าน scan ที่เข้มโดยไม่แยกว่าช่องโหว่แก้ได้หรือไม่ ทำให้ทีมถูกบล็อกด้วยสิ่งที่ตัวเองแก้ไม่ได้ และนำไปสู่การปิดด่านหรือเพิ่มข้อยกเว้นแบบกว้าง นโยบายที่ดีบล็อกสิ่งที่ลงมือแก้ได้ และจัดการสิ่งที่ยังแก้ไม่ได้ด้วยข้อยกเว้นที่มีเจ้าของ เหตุผล และวันหมดอายุ พร้อมมาตรการทดแทนตามความเสี่ยง เช่น ตรวจว่าแพ็กเกจนั้นเข้าถึงได้จากภายนอกหรือไม่ ผลที่ได้คือด่านยังมีความหมาย ไม่ถูกเลี่ยง และไม่ขวางการปล่อยด้วยเหตุที่ทีมควบคุมไม่ได้"},{"id":"OPS-S-P-006","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S3","concept":"container-runtime-hardening","mobile":false,"type":"multiple","stem":"ทีมต้องการลดความเสียหายในกรณีที่ผู้โจมตีใช้ช่องโหว่ของแอปจนรันคำสั่งภายใน container ได้ มาตรการใดช่วยจำกัดขอบเขตความเสียหายนั้นได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"รัน process ของแอปด้วยผู้ใช้ที่ไม่ใช่ root ภายใน container","correct":true,"why":"ถูก เพราะหากแอปถูกยึด ผู้โจมตีจะได้สิทธิ์ของผู้ใช้ธรรมดา ติดตั้งเครื่องมือหรือแก้ไฟล์ระบบได้ยากกว่า และเพิ่มความยากในการหลุดออกจาก container"},{"id":"B","text":"mount docker socket ของ host เข้าไปใน container เพื่อให้แอปรายงานสถานะของ container อื่นได้","correct":false,"why":"ผิด เพราะการเข้าถึง docker socket เท่ากับควบคุม Docker daemon ของ host ผู้โจมตีสั่งสร้าง container ที่มีสิทธิ์สูงและยึดเครื่องได้ จึงเป็นการขยายความเสียหาย"},{"id":"C","text":"ตั้ง root filesystem เป็น read-only และเปิดให้เขียนเฉพาะ volume ชั่วคราวที่จำเป็น","correct":true,"why":"ถูก เพราะผู้โจมตีแก้ binary หรือวางไฟล์ใหม่ลง filesystem ของ container ไม่ได้ ความเสียหายจำกัดอยู่ในพื้นที่เขียนที่เปิดไว้"},{"id":"D","text":"ตั้ง secret ด้วย ENV ใน Dockerfile แล้วลบทิ้งในคำสั่ง RUN ชั้นถัดไปเมื่อใช้เสร็จ","correct":false,"why":"ผิด เพราะค่าที่ตั้งด้วย ENV ถูกเก็บใน metadata ของ image และอยู่ใน environment ของ process ที่รัน ผู้โจมตีที่รันคำสั่งได้จึงอ่านได้ การลบในชั้นถัดมาไม่ได้ลบค่าออกจากชั้นเดิม"},{"id":"E","text":"ถอด Linux capabilities ที่แอปไม่ได้ใช้ออก แล้วเพิ่มกลับเฉพาะตัวที่จำเป็น","correct":true,"why":"ถูก เพราะ capabilities แบ่งสิทธิ์พิเศษของ root เป็นส่วนย่อย การเหลือเฉพาะที่ใช้จริงจำกัดสิ่งที่ process ทำได้แม้ถูกยึด"}],"explanation":"แนวคิดคือสมมติว่าแอปถูกยึดได้ แล้วจำกัดสิ่งที่ผู้โจมตีทำต่อได้: ใช้ผู้ใช้ไม่ใช่ root, filesystem แบบ read-only และเหลือ capabilities เท่าที่ใช้ ส่วนการเปิดทางเข้าถึง Docker daemon หรือฝัง secret ไว้ใน image ตรงข้ามกับเป้าหมายนี้ มาตรการเหล่านี้ใช้ร่วมกับการไม่รัน container แบบ privileged"},{"id":"OPS-S-P-007","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S3","concept":"image-layer-secret-leak","mobile":false,"type":"single","stem":"นักพัฒนา COPY ไฟล์ .npmrc ที่มี token ของ private package registry เข้าไปใน image เพื่อใช้ npm install แล้วสั่ง RUN rm .npmrc ในคำสั่งถัดไป จากนั้น push image ขึ้น registry ภายในบริษัทที่หลายทีมเข้าถึงได้ ทีมความปลอดภัยพบเรื่องนี้ ควรจัดการอย่างไร","options":[{"id":"A","text":"คงไว้ตามเดิม เพราะ filesystem ของ container ที่รันอยู่ไม่มีไฟล์ .npmrc แล้ว จึงไม่มีใครเข้าถึง token ผ่าน container ได้","correct":false,"why":"ผิด เพราะชั้นของ image ที่ COPY ไฟล์เข้ามายังเก็บเนื้อไฟล์ไว้ครบ ผู้ที่ pull image แล้วแตกชั้นออกอ่านได้ แม้ container ที่รันจะมองไม่เห็นไฟล์แล้ว"},{"id":"B","text":"revoke token นั้นแล้วออกใหม่ จากนั้น build ใหม่โดยส่ง token ผ่านกลไก build secret ที่ไม่ถูกเขียนลงชั้นของ image","correct":true,"why":"ถูก เพราะ token ที่เคยอยู่ใน image ที่ push ไปแล้วอาจถูกคนที่ pull ไปอ่านได้ การเพิกถอนจึงเป็นขั้นแรก ส่วน build secret ใช้ไฟล์เฉพาะตอน build โดยไม่บันทึกลงชั้นของ image"},{"id":"C","text":"ส่ง token ด้วย ARG ตอน build แทนการ COPY ไฟล์ เพราะค่า ARG ไม่ถูกบันทึกลงใน image","correct":false,"why":"ผิด เพราะค่า ARG ที่ถูกใช้ในคำสั่ง RUN มักปรากฏใน history ของ image ได้ จึงไม่ใช่ที่ปลอดภัยสำหรับ secret ต้องใช้กลไก build secret แทน"},{"id":"D","text":"รวมชั้นของ image เป็นชั้นเดียว (squash) แล้ว push ทับ tag เดิม เพื่อไม่ให้เหลือไฟล์ในประวัติของ image","correct":false,"why":"ผิด เพราะ image รุ่นเดิมอาจถูก pull หรือ cache ไว้แล้ว และ digest เดิมยังเข้าถึงได้ ผู้ที่ได้ไปก่อนหน้ายังมี token อยู่ จึงยังต้อง revoke ไม่ว่าจะสร้าง image ใหม่อย่างไร"}],"explanation":"ชั้นของ image ไม่เปลี่ยนแปลงหลังสร้าง การลบไฟล์ในชั้นถัดไปไม่ได้ลบข้อมูลที่อยู่ในชั้นก่อนหน้า เมื่อ secret เคยหลุดไปกับ image ที่แจกจ่ายแล้วให้ถือว่าถูกเปิดเผย: revoke ก่อน แล้วค่อยแก้กระบวนการ build ให้ใช้ build secret ที่ไม่เขียนลงชั้น ห้ามใช้ ARG หรือ ENV กับ secret"},{"id":"OPS-S-P-008","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S1","concept":"pvc-access-mode-multi-replica","mobile":false,"type":"single","stem":"ทีมใช้ Kubernetes ให้ Deployment 3 replica ใช้ PersistentVolumeClaim เดียวกัน ชนิด ReadWriteOnce (ผูกกับดิสก์แบบ block ที่ attach ได้ทีละ node) สำหรับเก็บไฟล์ที่แอปเขียน ผลคือ pod ที่ถูกจัดไปอยู่คนละ node ค้างอยู่ที่สถานะ ContainerCreating พร้อม error เรื่อง volume attach ควรแก้อย่างไรให้สอดคล้องกับลักษณะของข้อมูล","options":[{"id":"A","text":"แยกตามลักษณะข้อมูล: ข้อมูลเฉพาะแต่ละ replica ใช้ StatefulSet ที่ให้ volume ต่อ replica ส่วนไฟล์ที่ทุก replica ต้องเห็นร่วมกันย้ายไป object storage หรือ shared file storage ที่เขียนจากหลาย node ได้","correct":true,"why":"ถูก เพราะ ReadWriteOnce ออกแบบให้ใช้ดิสก์กับ node เดียว จึงต้องให้แต่ละ replica มีดิสก์ของตนเอง หรือเปลี่ยนไปใช้ที่เก็บข้อมูลที่ออกแบบมาให้หลาย node เข้าถึงพร้อมกัน ให้ตรงกับว่าข้อมูลเป็นของใคร"},{"id":"B","text":"บังคับให้ทุก pod ไปรันบน node เดียวกันด้วย node selector เพื่อให้ attach ดิสก์ได้ ซึ่ง ReadWriteOnce อนุญาตให้ pod หลายตัวบน node เดียวกันใช้ volume ร่วมกันได้อยู่แล้ว และแอปยังคงทำงานแบบเดิมทุกอย่าง","correct":false,"why":"ผิด เพราะแก้อาการได้เฉพาะหน้าแต่ทำให้ทั้ง service ตกอยู่บน node เดียว ถ้า node ล่มทุก replica หยุดพร้อมกัน และการเขียนไฟล์เดียวกันพร้อมกันจากหลาย pod ก็ยังไม่ได้รับการจัดการ"},{"id":"C","text":"เปลี่ยน access mode ใน PVC เป็น ReadWriteMany โดยยังใช้ดิสก์ block เดิมเพื่อให้ทุก node attach พร้อมกันได้","correct":false,"why":"ผิด เพราะ access mode ที่ขอต้องได้รับการรองรับจาก storage ที่อยู่เบื้องหลัง ดิสก์ block ทั่วไปไม่รองรับการ attach หลาย node พร้อมกัน การแก้ใน manifest จึงไม่ทำให้ดิสก์เปลี่ยนความสามารถ"},{"id":"D","text":"ลดเหลือ 1 replica และใช้ rolling update เพื่อให้ปล่อยเวอร์ชันใหม่ได้โดยไม่มี downtime","correct":false,"why":"ผิด เพราะเสียความสามารถในการขยายและทนต่อความล้มเหลว และ rolling update อาจสร้าง pod ใหม่บนอีก node ขณะที่ pod เก่ายังถือดิสก์อยู่ จึงเจอปัญหา attach เดิมซ้ำอีก"}],"explanation":"ก่อนเลือกวิธีแก้ ให้ถามว่าข้อมูลนั้นเป็นของแต่ละ replica หรือใช้ร่วมกัน ถ้าเป็นของแต่ละตัวให้ใช้ volume ต่อ replica (StatefulSet พร้อม volume claim ต่อ replica) ถ้าต้องใช้ร่วมกันให้ใช้ storage ที่รองรับหลาย node ตั้งแต่ต้น เช่น object storage การบังคับ pod ให้อยู่ node เดียวเป็นเพียงการเลี่ยงข้อจำกัดโดยแลกกับความพร้อมใช้งาน"},{"id":"OPS-S-P-009","level":"senior","pool":"practice","competency":"Container","descriptor":"CTR-S2","concept":"per-service-cutover-validation","mobile":false,"type":"multiple","stem":"ทีมกำลังย้ายบริการคำนวณค่าคอมมิชชันรายเดือนจาก cron บน VM ไปเป็น Kubernetes CronJob ผลลัพธ์ที่ได้คือตัวเลขที่ใช้จ่ายเงินจริงให้พนักงานขาย ข้อใดช่วยลดความเสี่ยงของการสลับมาใช้ตัวใหม่ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"รันเวอร์ชัน container คู่ขนานกับงานบน VM ด้วยข้อมูลชุดเดียวกัน โดยไม่เขียนผลจริง แล้วเปรียบเทียบผลลัพธ์ก่อนสลับ","correct":true,"why":"ถูก เพราะการเทียบผลของสองระบบกับข้อมูลชุดเดียวกันเผยความต่างที่ทดสอบด้วยตัวอย่างไม่พบ เช่น การปัดเศษหรือ timezone ก่อนที่จะกระทบการจ่ายเงินจริง"},{"id":"B","text":"ปิด cron บน VM ทันทีที่ container job รันสำเร็จครั้งแรก เพื่อกันไม่ให้สองระบบคำนวณซ้ำกัน","correct":false,"why":"ผิด เพราะการรันจบโดยไม่มี error ไม่ได้บอกว่าตัวเลขถูกต้อง และการปิดทางเดิมทันทีทำให้ย้อนกลับไม่ได้หากพบความต่างภายหลัง"},{"id":"C","text":"ปรับสูตรคำนวณให้ตรงกับเงื่อนไขคอมมิชชันใหม่ในจังหวะเดียวกับการย้าย เพื่อให้การทดสอบรอบเดียวครอบคลุมทั้งสองเรื่อง","correct":false,"why":"ผิด เพราะการเปลี่ยนแพลตฟอร์มกับการเปลี่ยนสูตรพร้อมกันทำให้เมื่อผลต่างจากเดิมแล้วบอกไม่ได้ว่าเกิดจากสาเหตุใด และตัดโอกาสใช้ผลของระบบเดิมเป็นเกณฑ์เทียบ"},{"id":"D","text":"กำหนดเกณฑ์การย้อนกลับไว้ล่วงหน้า และคง cron บน VM ให้พร้อมใช้จนกว่ารอบจ่ายจริงรอบแรกจะผ่านการตรวจสอบ","correct":true,"why":"ถูก เพราะถ้าพบความผิดพลาดหลังสลับจะมีทางกลับที่ตกลงกันไว้แล้ว ไม่ต้องตัดสินใจกลางวิกฤต"},{"id":"E","text":"ตัดสินใจสลับใช้งานจริงจากผลทดสอบด้วยข้อมูลตัวอย่างขนาดเล็กที่เขียนขึ้นเองซึ่งครอบคลุมกรณีปกติเท่านั้น","correct":false,"why":"ผิด เพราะข้อมูลที่เขียนเองมักไม่มีกรณีมุมจากข้อมูลจริง เช่น ค่าว่าง ยอดติดลบ หรือรายการข้ามเดือน ควรเทียบกับข้อมูลจริงที่ปกปิดข้อมูลส่วนบุคคลแล้วหากจำเป็น"}],"explanation":"งานที่ผลลัพธ์เป็นตัวเงินควรย้ายแบบ parallel run: ให้ระบบใหม่คำนวณจากข้อมูลจริงชุดเดียวกันแต่ยังไม่เขียนผล แล้วเทียบกับระบบเดิม และเก็บระบบเดิมไว้เป็นทางกลับพร้อมเกณฑ์ที่ตกลงไว้ก่อน อย่าเปลี่ยนตัวแปรสองอย่างพร้อมกัน เพราะจะอธิบายความต่างไม่ได้"},{"id":"OPS-S-P-010","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S1","concept":"client-event-batching-ingestion-cost","mobile":true,"type":"single","stem":"แอปมือถือของแพลตฟอร์มซื้อขายสินค้าส่ง analytics event (เปิดหน้า ดูสินค้า กดปุ่ม) ไปที่ backend ทีละ event ผ่าน API gateway และ function ที่เขียนลงฐานข้อมูลโดยตรง ผู้ใช้ active 400,000 คนต่อวัน คนละราว 150 event รวมราว 60 ล้านคำขอต่อวัน ค่า gateway และ function ที่คิดตามจำนวนคำขอสูงกว่าประมาณการหลายเท่า ฐานข้อมูลเขียนไม่ทันช่วงเย็น และผู้ใช้บ่นว่าแบตเตอรี่หมดเร็ว ฝ่ายวิเคราะห์ต้องการทุก event ของผู้ใช้แต่ละราย ยอมให้ข้อมูลช้าได้ไม่เกิน 2 นาที และ event ต้องไม่หายแม้ผู้ใช้ปิดแอปก่อนส่ง ทีมควรปรับ flow อย่างไร","options":[{"id":"A","text":"เพิ่ม provisioned throughput ของฐานข้อมูล ขยายโควตาคำขอของ gateway และเพิ่ม instance ของ function ให้รับช่วงเย็นได้ โดยคงการส่งทีละ event จากแอปไว้ตามเดิม","correct":false,"why":"ผิด เพราะแก้ที่ปลายทางโดยไม่แตะต้นเหตุคือจำนวนคำขอ ค่าใช้จ่ายต่อคำขอยังเท่าเดิมและเพิ่มค่ากำลังเขียนของฐานข้อมูลอีก ส่วนแบตเตอรี่ยังสิ้นเปลืองจากการส่งข้อมูลถี่"},{"id":"B","text":"ให้แอปสุ่มส่งเพียง 1 ใน 10 ของ event ในแต่ละเครื่อง และเก็บเฉพาะตัวนับสรุปของ event ที่เหลือไว้ เพื่อให้จำนวนคำขอและภาระการเขียนลดลงอย่างชัดเจน","correct":false,"why":"ผิด เพราะฝ่ายวิเคราะห์ต้องการทุก event ของผู้ใช้แต่ละราย การสุ่มทิ้งทำให้ลำดับการใช้งานของแต่ละคนขาดหาย วิเคราะห์เส้นทางของผู้ใช้รายบุคคลไม่ได้"},{"id":"C","text":"บีบอัด payload ของแต่ละ event ด้วย gzip เปิดใช้ HTTP keep-alive และใช้รูปแบบข้อมูลแบบ binary แทน JSON เพื่อลดปริมาณข้อมูลและจำนวนครั้งที่เปิดการเชื่อมต่อ","correct":false,"why":"ผิด เพราะ event หนึ่งตัวมีขนาดเล็กอยู่แล้วจึงบีบอัดได้น้อย และค่าบริการคิดตามจำนวนคำขอ ซึ่งยังเป็น 60 ล้านต่อวัน การเขียนลงฐานข้อมูลก็ยังเป็นทีละแถว keep-alive ลดเพียงต้นทุนการเปิดการเชื่อมต่อ"},{"id":"D","text":"ให้แอปเก็บ event ลงที่เก็บของเครื่องแล้วส่งเป็นชุดเมื่อครบจำนวน ครบเวลา หรือก่อนไปเบื้องหลัง ลบหลังได้รับยืนยัน ฝั่ง cloud ใส่ queue แล้วเขียนแบบ bulk","correct":true,"why":"ถูก เพราะถ้าส่งชุดละราว 50 event คำขอจะลดจาก 60 ล้านเหลือราว 1.2 ล้านต่อวัน ลดทั้งค่า gateway และ function และจำนวนครั้งที่เปิดวิทยุสื่อสาร ที่เก็บในเครื่องพร้อมการยืนยันกัน event หายเมื่อแอปถูกปิด ส่วน queue กับ bulk write ช่วยให้ฐานข้อมูลรับช่วงพีคได้ ความล่าช้าระดับวินาทีถึงนาทีอยู่ในที่ฝ่ายวิเคราะห์ยอมรับ"}],"explanation":"เมื่อค่าใช้จ่ายและภาระโตตามจำนวนคำขอ ให้ถามก่อนว่าข้อมูลต้องมาถึงทันทีแค่ไหน analytics ทนความล่าช้าได้ จึงรวม event เป็นชุดที่ฝั่ง client ได้ (ตั้งเกณฑ์ตามจำนวน เวลา และตอนแอปไปเบื้องหลัง) แล้วส่งผ่านตัวพักข้อมูลให้ฝั่ง cloud เขียนแบบ bulk การเพิ่มกำลังของปลายทาง การสุ่มทิ้ง และการบีบอัดไม่ลดจำนวนคำขอหรือไม่ตรงเงื่อนไขของธุรกิจ ควรตั้งเพดานจำนวน event ที่เก็บในเครื่อง และให้ event มี id เพื่อตัดข้อมูลซ้ำที่ปลายทาง เพราะการส่งชุดซ้ำเมื่อเครือข่ายหลุดเกิดได้"},{"id":"OPS-S-P-011","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S1","concept":"vpc-tier-network-flows","mobile":false,"type":"multiple","stem":"แผนภาพสถาปัตยกรรมบน cloud ของระบบสมัครสินเชื่อมี load balancer, application server, ฐานข้อมูลแบบ managed และการเรียก API ของผู้ให้บริการตรวจเครดิตภายนอก ทีมต้องกำหนดเส้นทางสื่อสารระหว่างองค์ประกอบเหล่านี้ ข้อใดเป็นการออกแบบที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"วางฐานข้อมูลใน public subnet พร้อมอนุญาตเฉพาะ IP ของ application server และเครื่องนักพัฒนา เพื่อให้ debug สะดวก","correct":false,"why":"ผิด เพราะฐานข้อมูลมี endpoint ที่เข้าถึงได้จากอินเทอร์เน็ต ถ้า allowlist ผิดหรือ IP ของเครื่องนักพัฒนาเปลี่ยนมือ จะเปิดช่องให้โจมตีโดยตรง ควรเข้าถึงผ่านทางที่ควบคุมได้ เช่น VPN หรือ bastion"},{"id":"B","text":"วาง application server ใน private subnet ให้รับทราฟฟิกจากผู้ใช้ผ่าน load balancer เท่านั้น","correct":true,"why":"ถูก เพราะ application server ไม่มีเส้นทางจากอินเทอร์เน็ตมาถึงโดยตรง จุดเข้าสู่ระบบเหลือที่ load balancer ซึ่งควบคุมและตรวจสอบได้"},{"id":"C","text":"ให้ฐานข้อมูลแบบ managed อยู่ใน private subnet และอนุญาตการเชื่อมต่อเฉพาะจาก security group ของ application server","correct":true,"why":"ถูก เพราะฐานข้อมูลเข้าถึงได้จากเฉพาะชั้นแอปที่จำเป็น แม้มี IP ภายในอื่นในเครือข่ายก็เชื่อมต่อไม่ได้ ลดพื้นผิวโจมตีของข้อมูลที่อ่อนไหว"},{"id":"D","text":"ให้ application server มี public IP ของตัวเอง เพื่อให้เรียก API ผู้ให้บริการตรวจเครดิตออกอินเทอร์เน็ตได้โดยตรง","correct":false,"why":"ผิด เพราะ public IP เปิดเส้นทางขาเข้าสู่ server ด้วย การออกอินเทอร์เน็ตควรผ่าน NAT gateway หรือ egress proxy ซึ่งอนุญาตขาออกอย่างเดียวและกำหนด IP ขาออกคงที่ได้"}],"explanation":"แบ่งชั้นตามหน้าที่: จุดรับทราฟฟิกจากภายนอกเป็น load balancer ชั้นแอปและชั้นข้อมูลอยู่ใน private subnet และกำหนดว่าใครเรียกใครได้ด้วย security group ส่วนทางออกอินเทอร์เน็ตให้ผ่านอุปกรณ์ที่ทำหน้าที่ขาออกโดยเฉพาะ การอ่านแผนภาพควรไล่ดูทุกเส้นว่าทราฟฟิกวิ่งทางไหนและเปิดอะไรให้ใคร"},{"id":"OPS-S-P-012","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S1","concept":"mobile-retry-backoff-jitter-thundering-herd","mobile":true,"type":"single","stem":"แอปมือถือสั่งอาหารมีผู้ใช้ออนไลน์พร้อมกันราว 300,000 เครื่อง ระหว่าง deploy backend เวอร์ชันใหม่ gateway ตอบ 503 อยู่ราว 2 นาที แอปทุกเครื่องถูกเขียนให้ลองส่งคำขอที่ล้มซ้ำทุก 3 วินาทีแบบไม่จำกัดครั้ง เมื่อ backend กลับมาปกติ ระบบล่มซ้ำภายในไม่กี่วินาที กราฟคำขอต่อวินาทีเป็นคลื่นแหลมซ้ำเป็นจังหวะ และ autoscaling ขยายเครื่องตามไม่ทัน ทีมควรปรับพฤติกรรมการลองซ้ำและการตอบของระบบอย่างไร เพื่อให้การกู้คืนครั้งหน้าไม่ล่มซ้ำ","options":[{"id":"A","text":"ตั้งจำนวนเครื่องขั้นต่ำของ gateway และ backend ไว้ที่ระดับรับโหลดพีคตลอดเวลา และอุ่นเครื่องไว้ล่วงหน้าก่อน deploy ทุกครั้ง","correct":false,"why":"ผิด เพราะเพิ่มต้นทุนถาวรเพื่อรับคลื่นที่เกิดจากพฤติกรรมของ client ขนาดคลื่นขึ้นกับจำนวน client ที่ค้างรออยู่ ถ้าระบบล่มนานขึ้นคลื่นก็ใหญ่ขึ้นอีก ต้นเหตุคือจังหวะลองซ้ำที่พร้อมกัน ไม่ใช่กำลังของเครื่อง"},{"id":"B","text":"ให้แอปรอนานขึ้นเป็นทวีคูณทุกครั้งที่ล้ม พร้อมสุ่มเวลารอในแต่ละเครื่อง กำหนดเพดานเวลารอและจำนวนครั้ง และใช้ Retry-After จาก gateway","correct":true,"why":"ถูก เพราะการรอที่ขยายเป็นทวีคูณลดอัตราคำขอรวมระหว่างที่ระบบมีปัญหา การสุ่มทำให้เครื่องที่ล้มพร้อมกันไม่กลับมาพร้อมกัน คำขอจึงกระจายตัวหลังกู้คืน Retry-After ให้ฝั่ง server กำหนดจังหวะได้ และเพดานจำนวนครั้งกันการลองไม่สิ้นสุด"},{"id":"C","text":"เปลี่ยนช่วงลองซ้ำจาก 3 วินาทีเป็น 5 วินาทีในทุกเครื่อง พร้อมกำหนดเพดานจำนวนครั้งที่ลองต่อคำขอ เพื่อให้จำนวนคำขอต่อวินาทีหลังกู้คืนลดลง","correct":false,"why":"ผิด เพราะทุกเครื่องยังลองในจังหวะเดียวกัน ได้คลื่นที่ห่างขึ้นแต่ขนาดเท่าเดิม backend ที่เพิ่งฟื้นจึงต้องรับ client ทั้งหมดในช่วงเวลาสั้น ๆ เหมือนเดิม"},{"id":"D","text":"ให้ gateway ส่งคำขอที่ backend ตอบล้มซ้ำไปอีกไม่เกิน 3 ครั้งโดยเว้นระยะสั้น ๆ ก่อนตอบ 503 เพื่อให้แอปเจอ error น้อยลง","correct":false,"why":"ผิด เพราะคำขอหนึ่งครั้งจากแอปอาจกลายเป็นสูงสุด 4 ครั้งที่ตกบน backend ที่กำลังฟื้น และไม่แตะจังหวะลองซ้ำของแอปที่ยังพร้อมกันอยู่ การลองซ้ำหลายชั้นคูณกันได้"}],"explanation":"เมื่อ client จำนวนมากล้มพร้อมกันแล้วลองซ้ำด้วยช่วงเวลาคงที่ คำขอจะกลับมาเป็นก้อนพร้อมกัน (thundering herd) ซึ่งซ้ำเติมระบบที่เพิ่งฟื้น ในแบบจำลองง่าย ๆ ที่ทุกเครื่องเริ่มล้มพร้อมกัน ช่วงรอคงที่ไม่ว่าจะ 3 หรือ 5 วินาทีทำให้คำขอรวมเป็นก้อนเดียว ส่วนการรอแบบทวีคูณพร้อมสุ่มกระจายคำขอออกได้มาก แนวปฏิบัติคือ retry เฉพาะข้อผิดพลาดชั่วคราว เช่น 503 หรือ timeout ไม่ retry ข้อผิดพลาดจากตัวคำขอ เช่น 400 หรือ 422 ใส่เพดานจำนวนครั้ง และให้คำขอที่เปลี่ยนสถานะ เช่น สั่งซื้อ มี idempotency key เพื่อไม่ให้ซ้ำ ฝั่ง server ควรตอบ Retry-After และปฏิเสธส่วนเกินเพื่อปกป้องตัวเอง (load shedding) ขณะฟื้น"},{"id":"OPS-S-P-013","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S2","concept":"commitment-baseline-ondemand-peak","mobile":false,"type":"single","stem":"ระบบภายในองค์กรใช้ compute ขั้นต่ำคงที่ราว 8 vCPU ตลอด 24 ชั่วโมง และในเวลาทำการ 09:00-18:00 ต้องใช้เพิ่มเป็นราว 24 vCPU ฝ่ายการเงินยอมผูกสัญญาการใช้ระยะยาว (commitment) เพื่อรับส่วนลด ควรเลือกรูปแบบการซื้อแบบใดให้ต้นทุนรวมต่ำและยังรองรับช่วงพีค","options":[{"id":"A","text":"ผูกสัญญาระยะยาวที่ 24 vCPU เพื่อรับส่วนลดกับทุกชั่วโมง รวมทั้งช่วงที่ต้องใช้มากที่สุด","correct":false,"why":"ผิด เพราะ commitment คิดเงินตลอดสัญญาไม่ว่าใช้จริงหรือไม่ นอกเวลาทำการใช้เพียง 8 vCPU จึงจ่ายค่าส่วนที่ว่างอยู่ราว 15 ชั่วโมงต่อวัน ซึ่งอาจมากกว่าส่วนลดที่ได้"},{"id":"B","text":"ใช้ spot หรือ preemptible ทั้งหมดทั้งส่วนฐานและส่วนพีค เพราะราคาต่อหน่วยต่ำที่สุด","correct":false,"why":"ผิด เพราะผู้ให้บริการเรียกคืนเครื่องได้ทุกเมื่อ ระบบภายในที่ต้องพร้อมใช้ตลอดเวลาทำการจะสะดุดเมื่อเครื่องถูกเรียกคืน ราคาต่ำเหมาะกับงานที่ทนการหยุดได้"},{"id":"C","text":"ผูกสัญญาที่ 8 vCPU ซึ่งใช้ตลอดเวลา และใช้ on-demand ร่วมกับ autoscaling สำหรับส่วนที่เพิ่มในเวลาทำการ","correct":true,"why":"ถูก เพราะส่วนลดจาก commitment คุ้มเมื่อใช้เต็มทุกชั่วโมง ปริมาณฐานที่คงที่จึงเหมาะกับสัญญา ส่วนช่วงพีคที่ใช้ไม่ทั้งวันจ่ายตามจริงจึงถูกกว่าจองไว้ทั้งวัน"},{"id":"D","text":"ใช้ on-demand ทั้งหมดไปก่อน เพราะโหลดไม่คงที่ตลอดวัน จึงยังไม่ควรผูกสัญญากับส่วนใด","correct":false,"why":"ผิด เพราะส่วนฐาน 8 vCPU ใช้คงที่ตลอดเวลา เป็นส่วนที่พยากรณ์ได้แน่นอน การไม่ผูกสัญญากับส่วนนี้เท่ากับจ่ายราคาเต็มโดยไม่จำเป็น"}],"explanation":"แบ่งโหลดเป็นส่วนที่คงที่กับส่วนที่แกว่ง: ส่วนฐานซื้อด้วยสัญญาระยะยาว ส่วนที่แกว่งซื้อแบบจ่ายตามใช้ และปรับสัดส่วนเป็นระยะตามข้อมูลการใช้จริง ถ้าไม่แน่ใจว่าฐานจะคงอยู่ ให้เลือกสัญญาที่ครอบคลุมเพียงบางส่วนของฐานก่อน"},{"id":"OPS-S-P-014","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S2","concept":"managed-vs-self-managed-tco","mobile":false,"type":"multiple","stem":"ทีมเปรียบเทียบต้นทุนระหว่าง PostgreSQL ที่ติดตั้งเองบน VM กับบริการ managed database ที่รองรับ high availability ข้อใดควรรวมอยู่ในการประเมินต้นทุนรวมของสองทางเลือก (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ราคาต่อชั่วโมงของ vCPU และ RAM ที่เทียบกันตรง ๆ ระหว่างสองแบบ เพราะส่วนอื่นของสองแบบใกล้เคียงกัน","correct":false,"why":"ผิด เพราะส่วนที่ต่างกันมากคือแรงงานดูแลและโครงสร้าง HA จึงมักไม่ใกล้เคียงกัน การเทียบเฉพาะราคา compute มองข้ามต้นทุนหลักของแบบติดตั้งเอง"},{"id":"B","text":"เวลาวิศวกรที่ใช้ดูแล patch, backup, failover และการซ้อมกู้คืนในแบบติดตั้งเอง","correct":true,"why":"ถูก เพราะงานดูแลเหล่านี้เป็นต้นทุนจริงของแบบติดตั้งเอง แม้ไม่ปรากฏในใบแจ้งหนี้ ส่วนบริการ managed รวมงานส่วนใหญ่ไว้ในราคาแล้ว"},{"id":"C","text":"ส่วนต่างค่า license ซอฟต์แวร์ฐานข้อมูล เพราะแบบติดตั้งเองต้องซื้อ license ของ PostgreSQL เพิ่ม","correct":false,"why":"ผิด เพราะ PostgreSQL เป็นซอฟต์แวร์โอเพนซอร์สที่ไม่มีค่า license จึงไม่ใช่ปัจจัยที่ทำให้สองแบบต่างกัน (ต่างจากฐานข้อมูลเชิงพาณิชย์ที่ license เป็นต้นทุนสำคัญ)"},{"id":"D","text":"ค่าพื้นที่จัดเก็บ IOPS ที่จองไว้ ระยะเก็บ backup และเครื่องสำรอง (replica) ที่จำเป็นต่อ HA ของทั้งสองแบบ","correct":true,"why":"ถูก เพราะต้นทุนของฐานข้อมูลที่ใช้งานจริงมาจากทั้งส่วนที่จองไว้และส่วนสำรองที่ต้องมี การเทียบเฉพาะเครื่องหลักทำให้ต้นทุนของ HA หายไป"},{"id":"E","text":"ค่า data transfer ระหว่าง zone ที่เกิดจากการ replicate และจากแอปที่เรียกฐานข้อมูลข้าม zone","correct":true,"why":"ถูก เพราะการทำ HA มักมีทราฟฟิกข้าม zone ที่คิดเงิน และเป็นส่วนที่ไม่ปรากฏในราคาเครื่องต่อชั่วโมง"}],"explanation":"TCO ของฐานข้อมูลไม่ใช่ราคา compute อย่างเดียว ต้องรวมแรงงานดูแล ส่วนจองไว้ ส่วนสำรองที่ HA ต้องมี และค่าส่งข้อมูลข้าม zone ของทั้งสองทางเลือกด้วยเกณฑ์เดียวกัน จึงจะเทียบกันได้ตรง ๆ ผลอาจพลิกตามขนาดทีมและระดับ SLA ที่ต้องการ"},{"id":"OPS-S-P-015","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S2","concept":"serverless-breakeven-steady-load","mobile":false,"type":"single","stem":"API ภายในรับคำขอสม่ำเสมอราว 300 คำขอต่อวินาทีตลอด 24 ชั่วโมง ปัจจุบันรันบน container 4 instance ที่ใช้ CPU ราว 60% ผู้บริหารเสนอให้ย้ายไปใช้ฟังก์ชันแบบ serverless ที่คิดเงินตามจำนวนการเรียกและเวลารัน โดยเชื่อว่าจะประหยัดกว่า ทีมควรตัดสินใจอย่างไร","options":[{"id":"A","text":"ประมาณต้นทุนจากข้อมูลจริง คือจำนวนคำขอต่อเดือน เวลารัน และหน่วยความจำต่อคำขอ เทียบกับค่า instance แล้วดู cold start และข้อจำกัดของแพลตฟอร์มประกอบ","correct":true,"why":"ถูก เพราะ pay-per-invocation คุ้มกับโหลดที่ไม่สม่ำเสมอหรือมีช่วงว่าง ที่โหลดสูงคงที่ตลอดเวลาอาจแพงกว่า instance ที่ใช้เต็ม จึงต้องคำนวณจุดคุ้มทุนจากตัวเลขจริง"},{"id":"B","text":"ย้ายตามข้อเสนอ เพราะ serverless ไม่มีค่าใช้จ่ายตอนว่าง จึงถูกกว่า container ในกรณีนี้","correct":false,"why":"ผิด เพราะข้อดีเรื่องไม่มีค่าตอนว่างมีค่าเมื่อมีช่วงว่าง API นี้ไม่มีช่วงว่างเลย ส่วนค่าต่อการเรียกที่คูณกับปริมาณราว 777 ล้านครั้งต่อเดือนอาจสูงกว่าค่า instance"},{"id":"C","text":"ย้ายเฉพาะเมื่อ latency ของ serverless ผ่านเกณฑ์ เพราะต้นทุนของทั้งสองแบบแปรผันตามโหลดใกล้เคียงกัน","correct":false,"why":"ผิด เพราะต้นทุนของสองแบบไม่ได้แปรผันใกล้เคียงกัน instance คิดตามเวลาที่เปิด ส่วน serverless คิดตามปริมาณการเรียก จึงต้องคำนวณเทียบกัน"},{"id":"D","text":"ทดลองย้ายเฉพาะ endpoint ที่ช้าที่สุดก่อนโดยยังไม่ประเมินต้นทุน แล้วดูใบแจ้งหนี้เดือนถัดไปเพื่อตัดสินใจว่าจะย้ายส่วนที่เหลือต่อหรือย้อนกลับมาใช้ container ตามเดิม","correct":false,"why":"ผิด เพราะวิธีนี้ได้ข้อมูลช้าและวัดยาก ใบแจ้งหนี้รวมหลายบริการ ขณะที่ประมาณการเบื้องต้นจากข้อมูลการใช้งานที่มีอยู่แล้วทำได้ก่อนลงมือ"}],"explanation":"ราคาตามการเรียกกับราคาตามเวลาที่เปิดมีจุดคุ้มทุน: งานที่มีช่วงว่างหรือแกว่งมากได้เปรียบ serverless ส่วนงานที่ใช้เต็มสม่ำเสมออาจถูกกว่าบน instance ที่จองไว้ ควรคำนวณจากปริมาณและระยะเวลาจริง แล้วนำปัจจัยอื่นอย่าง cold start ข้อจำกัดเวลารัน และแรงงานดูแลมาประกอบ"},{"id":"OPS-S-P-016","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S3","concept":"workload-identity-over-static-keys","mobile":false,"type":"multiple","stem":"ทีมพบ access key ระยะยาวของ user บน cloud อยู่ในไฟล์ .env ที่ถูก commit ลง repository ภายใน key นี้ใช้อ่านเขียน bucket ที่เก็บเอกสารลูกค้า และมีสิทธิ์กว้างกว่าที่แอปต้องใช้ ทีมควรทำอะไรบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ปิดใช้งานและหมุนเปลี่ยน key ทันที แล้วตรวจ log การเข้าถึงย้อนหลังว่ามีการใช้ key ผิดปกติหรือไม่","correct":true,"why":"ถูก เพราะ key ที่เคยอยู่ใน repository ต้องสันนิษฐานว่าหลุดแล้ว การเพิกถอนหยุดการใช้ต่อ และ log ช่วยประเมินว่าข้อมูลถูกเข้าถึงหรือไม่ ซึ่งมีผลต่อการแจ้งเหตุตาม PDPA"},{"id":"B","text":"ลบไฟล์ .env ออกจาก commit ล่าสุดและเพิ่มชื่อไฟล์ใน .gitignore เพื่อให้ไม่มีใครเห็น key นี้ใน repository อีก","correct":false,"why":"ผิด เพราะ key ยังอยู่ในประวัติของ repository ผู้ที่เข้าถึง repository เปิดดู commit เก่าก็ยังเห็น key ได้ ส่วน .gitignore เพียงกันไม่ให้ไฟล์นี้ถูก commit ซ้ำ"},{"id":"C","text":"เข้ารหัสไฟล์ .env ด้วยรหัสผ่านร่วมของทีม แล้ว commit กลับเข้า repository เพื่อให้ยังใช้ร่วมกันได้","correct":false,"why":"ผิด เพราะ key ฉบับเดิมที่ไม่ได้เข้ารหัสยังอยู่ในประวัติ และรหัสผ่านร่วมที่แชร์กันกว้างปกป้อง key ไม่ได้ดีนักเมื่อมีคนออกจากทีม"},{"id":"D","text":"ให้แอปใช้ role ที่ผูกกับ compute ซึ่งออก credential ชั่วคราวให้อัตโนมัติ และจำกัดสิทธิ์เหลือเฉพาะ bucket และการกระทำที่ใช้จริง","correct":true,"why":"ถูก เพราะ credential ชั่วคราวหมดอายุเอง ไม่ต้องเก็บ key ในไฟล์ และสิทธิ์ที่แคบทำให้ถ้าหลุดอีกก็เสียหายน้อยกว่า"}],"explanation":"เมื่อ credential ระยะยาวหลุด ให้ถือว่าถูกเปิดเผยแล้ว: เพิกถอนและตรวจร่องรอยก่อน แล้วแก้ที่ต้นเหตุด้วยการไม่ใช้ key ระยะยาวเลย ให้ workload ได้ credential ชั่วคราวผ่าน role และให้สิทธิ์น้อยที่สุดเท่าที่ใช้ การลบไฟล์ออกจาก commit ล่าสุดไม่ได้ลบข้อมูลจากประวัติของ repository"},{"id":"OPS-S-P-017","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S3","concept":"pdpa-encryption-key-management","mobile":false,"type":"multiple","stem":"ระบบเก็บข้อมูลสุขภาพของลูกค้าบน cloud ต้องแสดงมาตรการรักษาความมั่นคงปลอดภัยตาม PDPA ข้อใดเป็นการประยุกต์ใช้การเข้ารหัสและการควบคุมที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เข้ารหัสข้อมูลที่จัดเก็บด้วยคีย์ใน key management service และแยกสิทธิ์ผู้ดูแลคีย์ออกจากผู้ดูแลข้อมูล","correct":true,"why":"ถูก เพราะการแยกหน้าที่ทำให้คนที่เข้าถึงข้อมูลดิบได้ไม่สามารถถอดรหัสเองได้ และ key management service จัดการวงจรชีวิตคีย์ เช่น การหมุนเปลี่ยนและการเพิกถอน"},{"id":"B","text":"บังคับ TLS กับทุกการเชื่อมต่อ ทั้งจากผู้ใช้และระหว่าง service ภายใน","correct":true,"why":"ถูก เพราะข้อมูลสุขภาพที่วิ่งผ่านเครือข่าย แม้เป็นเครือข่ายภายใน ก็ควรเข้ารหัสระหว่างทางเพื่อกันการดักอ่านหรือแก้ไข"},{"id":"C","text":"ใช้การเข้ารหัสดิสก์ระดับ volume ที่ผู้ให้บริการจัดการให้เป็นมาตรการหลัก แทนการควบคุมสิทธิ์และ audit ระดับแอป","correct":false,"why":"ผิด เพราะการเข้ารหัสดิสก์ปกป้องกรณีที่ดิสก์ถูกนำออกไป แต่แอปที่ถูกยึดหรือผู้ใช้ที่มีสิทธิ์อ่านเห็นข้อมูลแบบถอดรหัสแล้ว จึงต้องมีการควบคุมสิทธิ์และ audit ควบคู่"},{"id":"D","text":"เปิดบันทึกการเข้าถึงข้อมูลและการใช้คีย์ เพื่อตรวจสอบย้อนหลังและแสดงต่อผู้ตรวจสอบได้","correct":true,"why":"ถูก เพราะมาตรการรักษาความปลอดภัยต้องพิสูจน์ได้ว่าใครเข้าถึงอะไรเมื่อไร และใช้ตรวจจับการเข้าถึงผิดปกติหรือประเมินผลกระทบเมื่อเกิดเหตุ"}],"explanation":"มาตรการตาม PDPA ไม่ได้มีวิธีเดียว แต่ต้องครอบคลุมทั้งข้อมูลขณะจัดเก็บ ขณะส่งผ่าน การควบคุมสิทธิ์ และหลักฐานการเข้าถึง การเข้ารหัสระดับดิสก์ที่เปิดไว้ให้เป็นพื้นฐานที่ดีแต่ไม่พอเมื่อพิจารณาแอปหรือผู้ใช้ที่มีสิทธิ์เป็นผู้ก่อภัย ควรมีการจัดการคีย์ที่แยกหน้าที่และการบันทึก audit"},{"id":"OPS-S-P-018","level":"senior","pool":"practice","competency":"Cloud","descriptor":"CLD-S3","concept":"data-residency-backups-logs-region-policy","mobile":false,"type":"single","stem":"บริษัทประกันภัยแห่งหนึ่งทำสัญญากับลูกค้าองค์กรว่าข้อมูลส่วนบุคคลของผู้เอาประกันต้องถูกจัดเก็บและประมวลผลภายในประเทศไทยเท่านั้น ระบบรันบน cloud region ที่ตั้งในประเทศไทย ทั้งแอปและฐานข้อมูล ผู้ตรวจสอบพบว่า การสำรองฐานข้อมูลถูกตั้งให้คัดลอกไปเก็บใน region ต่างประเทศเพื่อลดค่าจัดเก็บ log ของแอปที่มีเลขบัตรประชาชนถูกส่งไปบริการวิเคราะห์ log ที่ประมวลผลนอกประเทศ และนักพัฒนาสร้างทรัพยากรใน region ใดก็ได้ ทีมควรแก้อย่างไรให้เป็นไปตามสัญญาและกันไม่ให้เกิดซ้ำ","options":[{"id":"A","text":"คงฐานข้อมูลหลักไว้ใน region ในประเทศ และให้ backup กับ log ไปอยู่ใน region ที่ราคาจัดเก็บถูกที่สุด โดยจำกัดสิทธิ์เข้าถึงเฉพาะทีมที่เกี่ยวข้องและเปิดบันทึกการเข้าถึงไว้","correct":false,"why":"ผิด เพราะ backup คือสำเนาของข้อมูลชุดเดียวกับฐานข้อมูล และ log มีเลขบัตรประชาชน ทั้งสองยังเป็นข้อมูลส่วนบุคคลที่ถูกเก็บนอกประเทศ จึงขัดกับสัญญา"},{"id":"B","text":"เข้ารหัสข้อมูลที่ออกไปนอกประเทศด้วยคีย์ที่บริษัทถือเองและเก็บไว้ในประเทศ พร้อมบันทึกการใช้คีย์ไว้เป็นหลักฐาน แล้วให้ backup และบริการวิเคราะห์ log ทำงานต่อไปตามเดิม","correct":false,"why":"ผิด เพราะสัญญากำหนดสถานที่จัดเก็บและประมวลผล การเข้ารหัสไม่ได้ทำให้ข้อมูลอยู่ในประเทศ และบริการวิเคราะห์ log ต้องอ่านเนื้อหาของ log จึงประมวลผลได้ ซึ่งแปลว่าเนื้อหาถูกถอดรหัสนอกประเทศ"},{"id":"C","text":"กำหนด region ที่อนุญาตให้ครอบคลุมทุกที่ที่มีข้อมูลส่วนบุคคล เช่น replica backup log ย้ายของที่อยู่นอกขอบเขตกลับมา และตั้ง policy ปฏิเสธการสร้างนอก region","correct":true,"why":"ถูก เพราะข้อกำหนดเรื่องถิ่นที่เก็บข้อมูลต้องครอบคลุมทุกสำเนา ไม่ใช่เฉพาะฐานข้อมูลหลัก การย้ายของเดิมกลับมาแก้ที่เกิดแล้ว ส่วน policy ที่ปฏิเสธการสร้างนอก region กันไม่ให้เกิดซ้ำก่อนเกิดเหตุ"},{"id":"D","text":"ทำข้อตกลงการประมวลผลข้อมูลกับผู้ให้บริการ cloud ให้ครอบคลุมการเก็บ backup และ log ในต่างประเทศ และบันทึกเป็นความเสี่ยงที่ยอมรับได้ในทะเบียนความเสี่ยงของบริษัท","correct":false,"why":"ผิด เพราะข้อตกลงกับผู้ให้บริการและการยอมรับความเสี่ยงภายในบริษัทไม่ใช่ความยินยอมจากลูกค้าซึ่งเป็นคู่สัญญาที่กำหนดเงื่อนไขไว้ ระบบจึงยังฝ่าฝืนสัญญา และไม่มีกลไกกันทรัพยากรใหม่ออกนอก region"}],"explanation":"ข้อกำหนดเรื่องถิ่นที่เก็บข้อมูลมักพลาดที่สำเนาข้างเคียง ได้แก่ backup, snapshot, replica, log, ข้อมูลทดสอบที่คัดลอกจาก production และผลการวิเคราะห์ ควรตรวจทุกที่ที่ข้อมูลไปถึง ลดข้อมูลส่วนบุคคลใน log ด้วยการ mask ตั้งแต่ต้นทาง และใช้มาตรการแบบป้องกัน (policy ที่ปฏิเสธการสร้างนอก region) แทนการตรวจย้อนหลังอย่างเดียว ถ้าไม่มี region สำรองในประเทศ ต้องออกแบบ DR ภายในขอบเขตที่อนุญาต หรือขอความเห็นชอบจากลูกค้าเป็นลายลักษณ์อักษร การเข้ารหัสและเอกสารภายในเป็นมาตรการเสริม ไม่ใช่ตัวแทนของเงื่อนไขที่ตกลงกับลูกค้า"},{"id":"OPS-S-P-019","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S1","concept":"iac-environment-parity-plan-apply-gate","mobile":false,"type":"single","stem":"ทีมมี environment dev, staging และ production บน cloud ซึ่งสร้างและปรับค่าผ่าน portal ด้วยมือ เดือนก่อน production ล่มหลังปล่อยเวอร์ชันใหม่ เพราะค่า timeout และกฎ firewall ของ staging ต่างจาก production โดยไม่มีใครรู้ว่าต่างเมื่อไรและใครแก้ ทีมใช้ Azure DevOps Pipelines อยู่แล้ว และต้องการให้ทั้งสาม environment ต่างกันเฉพาะส่วนที่ตั้งใจ เช่น ขนาดเครื่องและจำนวน instance รวมทั้งตรวจสอบย้อนหลังได้ว่าใครเปลี่ยนอะไร ควรปรับ workflow อย่างไร","options":[{"id":"A","text":"จัดทำ checklist ค่าตั้งของแต่ละ environment ใน wiki และให้ผู้ดูแลเทียบ staging กับ production ด้วยมือก่อนปล่อยทุกครั้ง พร้อมบันทึกผลการเทียบไว้ใน ticket ของ release","correct":false,"why":"ผิด เพราะการเทียบด้วยมือพลาดง่ายเมื่อมีค่าจำนวนมาก ไม่กันการแก้ใน portal หลังเทียบเสร็จ และไม่มีประวัติการเปลี่ยนแปลงที่ตรวจสอบได้"},{"id":"B","text":"แยก template ต่อ environment โดยคัดลอกจากของ production แล้วแก้ค่าที่ต่างในแต่ละไฟล์ เก็บทั้งสามชุดไว้ในโฟลเดอร์เดียวกันใน repo เดียวกัน และให้ pipeline เป็นผู้ apply ทุกชุด","correct":false,"why":"ผิด เพราะสำเนาหลายชุดเริ่มต่างกันได้ทุกครั้งที่มีคนแก้ชุดหนึ่งแล้วลืมอีกสองชุด ความต่างที่ไม่ได้ตั้งใจจึงกลับมาทั้งที่ pipeline เป็นผู้ apply"},{"id":"C","text":"ใช้ template ชุดเดียวกับไฟล์ parameter ต่อ environment ให้ผู้ดูแลรัน apply จากเครื่องของตนเองหลังรีวิวโค้ดใน PR แล้ว และคงสิทธิ์แก้ใน portal ไว้สำหรับกรณีฉุกเฉิน","correct":false,"why":"ผิด เพราะการแก้ใน portal ทำให้ environment หลุดจาก template ได้อีก และการ apply จากเครื่องผู้ดูแลทำให้ผลขึ้นกับเครื่องและเวอร์ชันเครื่องมือของแต่ละคน ไม่มี plan ให้ทีมรีวิวและบันทึกไม่ครบ"},{"id":"D","text":"กำหนด infrastructure เป็นโค้ดใน repo ด้วย template เดียวและ parameter ต่อ environment ให้เฉพาะ pipeline apply โดยดู plan ใน PR มี approval ที่ production และตรวจ drift","correct":true,"why":"ถูก เพราะความต่างระหว่าง environment เหลือเฉพาะค่าใน parameter ซึ่งรีวิวได้ ทุกการเปลี่ยนผ่าน PR และ pipeline จึงมีประวัติ และการตรวจ drift จับการแก้นอกกระบวนการได้"}],"explanation":"ความต่างที่ไม่ได้ตั้งใจระหว่าง environment เกิดจากการแก้ด้วยมือและสำเนาที่แยกกัน ทางแก้คือให้ infrastructure มีแหล่งความจริงเดียวคือ template ใน repo ส่วนที่ต่างตามตั้งใจอยู่ใน parameter ต่อ environment การเปลี่ยนแปลงทุกครั้งผ่าน PR ที่เห็น plan ก่อน และให้เฉพาะ pipeline ที่มี identity ของตัวเองเป็นผู้ apply พร้อม approval ที่ production การตรวจ drift เป็นรอบช่วยจับสิ่งที่หลุดมา ส่วนกรณีฉุกเฉินควรมีสิทธิ์แบบ break-glass ที่บันทึกการใช้ และต้องย้อนค่ากลับเข้า template หลังเหตุ"},{"id":"OPS-S-P-020","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S2","concept":"sast-dast-pipeline-placement","mobile":false,"type":"multiple","stem":"ทีมจะเพิ่ม SonarQube และ OWASP ZAP เข้า pipeline ของ web API ที่ deploy ไปยัง test environment ก่อนขึ้น production ข้อใดเป็นการวางตำแหน่งและเงื่อนไขที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"รัน ZAP แบบ active scan กับ production ทุกครั้งหลัง release เพื่อให้ได้ผลจาก environment จริง","correct":false,"why":"ผิด เพราะ active scan ส่งคำขอโจมตีจริง อาจเขียนข้อมูลขยะ ทำให้ระบบช้า หรือกระทบผู้ใช้จริง ควรทำกับ environment ทดสอบ"},{"id":"B","text":"รัน SonarQube สัปดาห์ละครั้งแบบ manual นอก pipeline เพราะการวิเคราะห์ทำให้ build ช้า","correct":false,"why":"ผิด เพราะข้อบกพร่องที่พบหลัง merge หลายวันแก้ยากกว่าและไม่มีกลไกบังคับให้แก้ ควรตรวจในจังหวะ PR ที่ผู้เขียนยังจำบริบทได้"},{"id":"C","text":"รัน SonarQube analysis ใน stage build และใช้ quality gate ของ new code เป็นเงื่อนไขผ่านหรือไม่ผ่านของ PR","correct":true,"why":"ถูก เพราะการวิเคราะห์โค้ดต้องการเพียง source และเป็นผลที่ควรรู้ก่อน merge การจำกัดที่ new code ทำให้ gate บังคับใช้ได้โดยไม่ขวางงานเพราะหนี้เดิม"},{"id":"D","text":"รัน ZAP ใน stage unit test โดยชี้ไปที่ source code เพื่อสแกนก่อน deploy","correct":false,"why":"ผิด เพราะ ZAP เป็นเครื่องมือทดสอบแอปที่รันอยู่ผ่าน HTTP ไม่ได้อ่าน source code จึงต้องมีแอปที่ deploy แล้วให้ยิงทดสอบ"},{"id":"E","text":"รัน ZAP หลัง deploy ไปยัง test environment ที่ใช้ข้อมูลทดสอบ และให้ pipeline ล้มเมื่อพบ alert ระดับสูงตามเกณฑ์ที่ตกลงกัน","correct":true,"why":"ถูก เพราะ ZAP โจมตีแอปที่กำลังรันอยู่จริง จึงต้องทำหลัง deploy และทำกับ environment ที่ไม่กระทบผู้ใช้จริง พร้อมเกณฑ์ที่ชัดว่าระดับใดล้ม pipeline"}],"explanation":"เครื่องมือแต่ละชนิดต้องการสิ่งที่ต่างกัน: การวิเคราะห์โค้ดแบบ static ใช้ source จึงวางตั้งแต่ build และ PR ส่วนการทดสอบแบบ dynamic ต้องมีแอปรัน จึงวางหลัง deploy ไป environment ทดสอบ และทั้งสองต้องมีเกณฑ์ผ่านไม่ผ่านที่ตกลงกันไว้ก่อน ไม่ใช่เพียงรายงาน"},{"id":"OPS-S-P-021","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S3","concept":"flaky-test-gate-handling","mobile":false,"type":"single","stem":"integration test ชุดหนึ่งใน pipeline ล้มแบบสุ่มราว 1 ใน 8 ครั้งโดยโค้ดไม่เปลี่ยน ทำให้ PR ถูกบล็อกและนักพัฒนากด re-run จนชิน หัวหน้าทีมเสนอให้ตั้ง retry อัตโนมัติ 3 ครั้งทั้ง stage จนกว่าจะผ่าน ทีมควรจัดการอย่างไร","options":[{"id":"A","text":"ตั้ง retry 3 ครั้งทั้ง stage ตามข้อเสนอ เพราะแก้ได้เร็วที่สุด pipeline เป็นสีเขียวมากขึ้น และนักพัฒนาไม่เสียเวลากด re-run เองอีก ทั้งยังปรับค่าได้ง่ายในไฟล์ pipeline ไฟล์เดียว","correct":false,"why":"ผิด เพราะ retry ซ่อนความไม่เสถียรไว้ รวมถึงบั๊กจริงที่เกิดเป็นบางครั้งก็ผ่านได้ด้วยการลองซ้ำ และเวลา pipeline เพิ่มขึ้นทุกครั้งที่เจอ"},{"id":"B","text":"แยก test ที่ไม่เสถียรออกจาก gate หลักเป็นกลุ่มที่ยังรันแต่ไม่บล็อก พร้อมเจ้าของและกำหนดเวลาแก้ต้นเหตุ เช่น state ที่ใช้ร่วมกัน หรือลำดับการรัน ส่วน gate หลักมีเฉพาะ test ที่เสถียร","correct":true,"why":"ถูก เพราะ gate ที่เชื่อถือได้ทำให้ผลสีแดงมีความหมาย ส่วนการแยกพร้อมเจ้าของทำให้ปัญหาไม่ถูกลืม และการแก้ต้นเหตุทำให้ test กลับมาเป็นส่วนของ gate ได้"},{"id":"C","text":"ถอด integration test ออกจาก pipeline แล้วรันเฉพาะก่อน release เพื่อไม่ให้ขวางการ merge และให้นักพัฒนาได้ผลตอบกลับเร็วขึ้นจากชุด unit test ที่เสถียรกว่า","correct":false,"why":"ผิด เพราะข้อบกพร่องที่ integration test ควรจับได้จะถูกพบช้าลง ณ จุดที่แก้แพงที่สุด และ test ที่ไม่ถูกรันบ่อยจะเสื่อมได้ง่าย"},{"id":"D","text":"เพิ่ม timeout ของทุก test เป็นสองเท่า เพราะความล้มแบบสุ่มมักมาจากเครื่อง agent ที่ช้า","correct":false,"why":"ผิด เพราะเป็นการเดาสาเหตุโดยไม่ตรวจสอบ ความล้มแบบสุ่มมักมาจาก state ที่ใช้ร่วมกัน ลำดับการรัน หรือเวลาที่ขึ้นกับสภาพแวดล้อม การเพิ่ม timeout ไม่แก้สิ่งเหล่านั้นและทำให้ล้มช้าลง"}],"explanation":"test ที่ล้มสุ่มทำลายความเชื่อถือของ gate ให้แยกมันออกอย่างมีระบบแทนการซ่อนด้วย retry: ยังรันเพื่อเก็บข้อมูล มีเจ้าของ และมีกำหนดแก้ เมื่อแก้ต้นเหตุแล้วจึงย้ายกลับเข้า gate retry เฉพาะจุดที่รู้ว่ามีสาเหตุภายนอกที่ชั่วคราว เช่น การดาวน์โหลด dependency เหมาะกว่าการ retry ทั้ง stage"},{"id":"OPS-S-P-022","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S4","concept":"mobile-release-signing-reproducible","mobile":true,"type":"multiple","stem":"ทีมแอปมือถือพบว่า build ของเวอร์ชันเดียวกันที่ออกจากเครื่องนักพัฒนากับที่ออกจาก CI ไม่ตรงกัน และเคยปล่อยเวอร์ชันที่เซ็นด้วยใบรับรองผิด ทีมต้องการให้การส่งมอบ release เป็นไปอย่างสม่ำเสมอ ข้อใดเป็นแนวทางที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เก็บใบรับรองสำหรับ release ไว้ในเครื่องของ lead developer และให้เขา build release จากเครื่องตนเอง เพื่อควบคุมที่จุดเดียว","correct":false,"why":"ผิด เพราะ release ผูกกับเครื่องและคนคนเดียว ผลลัพธ์ขึ้นกับสภาพแวดล้อมในเครื่อง ถ้าเครื่องหายหรือคนลาออกจะ release ไม่ได้ และตรวจสอบย้อนหลังไม่ได้"},{"id":"B","text":"เก็บข้อมูลสำหรับเซ็นแอปไว้ใน secure store ของ pipeline และอนุญาตให้เฉพาะ stage release ที่ผ่านการอนุมัติใช้ได้","correct":true,"why":"ถูก เพราะ release ถูกเซ็นด้วยข้อมูลชุดเดียวกันเสมอ ไม่ขึ้นกับเครื่องของใคร และจำกัดคนที่เข้าถึงข้อมูลเซ็นที่สำคัญนี้"},{"id":"C","text":"build release จาก tag ของ commit ที่ระบุ โดยล็อก version ของ dependency และเครื่องมือ build","correct":true,"why":"ถูก เพราะ input ที่เหมือนกันจะให้ผลลัพธ์ใกล้เคียงกัน และย้อนดูได้ว่า build ออกมาจากโค้ดใด"},{"id":"D","text":"ให้ build number เพิ่มขึ้นอัตโนมัติจากตัวนับของ pipeline เพื่อให้ทุก build ตรวจย้อนกลับถึง commit ได้","correct":true,"why":"ถูก เพราะร้านค้ากำหนดว่าเลขนี้ต้องไม่ซ้ำและเพิ่มขึ้น การให้ pipeline จัดการเลขลดความผิดพลาดจากการแก้มือ และเชื่อมกลับถึงโค้ดที่ build ได้"}],"explanation":"ความสม่ำเสมอของการส่งมอบ (consistent delivery) มาจากการตัดความต่างที่เกิดจากคนและเครื่อง: ใช้ข้อมูลเซ็นชุดเดียวใน secure store ของ pipeline, build จาก commit และ dependency ที่ล็อกไว้, และให้ระบบกำหนดเลข build ทำให้ release ตรวจสอบย้อนหลังได้ สำหรับแอปมือถือ การเซ็นผิดหรือเลข build ซ้ำมีผลโดยตรงต่อการอัปโหลดขึ้นร้านค้า"},{"id":"OPS-S-P-023","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S5","concept":"branch-policy-pr-validation-trunk","mobile":false,"type":"single","stem":"ทีมนักพัฒนา 12 คนใช้ feature branch อายุ 2-3 สัปดาห์ แล้ว merge เข้า main พร้อมกันก่อนปิด sprint ทำให้เกิด conflict ใหญ่และ build พังหลัง merge เป็นประจำ ทีมต้องการให้การรวมโค้ดราบรื่นขึ้น ควรปรับอย่างไร","options":[{"id":"A","text":"เพิ่มรอบ merge จาก main เข้า feature branch สัปดาห์ละครั้ง และ merge เข้า main หลังปิด sprint เหมือนเดิม","correct":false,"why":"ผิด เพราะช่วยลด conflict ได้บางส่วน แต่ branch ยังอายุยาว การรวมจริงยังเกิดพร้อมกันตอนท้าย sprint และ main ยังไม่ถูกบังคับให้ผ่านการตรวจก่อนรับโค้ด"},{"id":"B","text":"อนุญาตให้ push ตรงเข้า main เพื่อให้รวมโค้ดได้บ่อยขึ้น แล้วให้ pipeline รัน test ตามหลัง","correct":false,"why":"ผิด เพราะรวมได้บ่อยจริง แต่โค้ดที่ทำให้ build พังเข้า main ได้ก่อนถูกตรวจ ทุกคนที่ดึงโค้ดล่าสุดได้รับผลกระทบ"},{"id":"C","text":"ใช้ branch อายุสั้นและ merge เข้า main บ่อย โดยตั้ง branch policy ให้ PR ต้องผ่าน build กับ test อัตโนมัติและมีผู้รีวิว และซ่อนงานที่ยังไม่เสร็จหลัง feature flag","correct":true,"why":"ถูก เพราะการรวมโค้ดเป็นส่วนเล็กและบ่อยทำให้ conflict เล็กลง policy บังคับให้ main ผ่านการตรวจเสมอ และ feature flag แยกการ merge ออกจากการเปิดใช้ฟีเจอร์"},{"id":"D","text":"ให้ release manager เป็นผู้ merge ทุก branch เข้า main แทนนักพัฒนา เพื่อให้คนเดียวแก้ conflict อย่างสม่ำเสมอและรู้สถานะของ main ตลอดเวลา ซึ่งช่วยลดความสับสนในทีม","correct":false,"why":"ผิด เพราะผู้ merge ไม่ใช่เจ้าของโค้ดจึงแก้ conflict ได้ยากและมักต้องถามกลับ ทั้งยังเกิดคอขวดที่คนคนเดียวซึ่งต้องรับงานจากนักพัฒนา 12 คน"}],"explanation":"การลด conflict และ build พังมาจากการรวมโค้ดเล็ก ๆ บ่อย ๆ และให้ระบบบังคับคุณภาพที่ทางเข้า: branch policy ที่ต้องมี build, test และ review ก่อน merge ส่วน feature flag ทำให้ merge งานที่ยังไม่เสร็จเข้า main ได้โดยไม่เปิดใช้กับผู้ใช้ การรอรวมทีเดียวตอนท้ายรอบคือการเก็บความเสี่ยงไว้ปะทุพร้อมกัน"},{"id":"OPS-S-P-024","level":"senior","pool":"practice","competency":"CI/CD","descriptor":"CICD-S6","concept":"mobile-ci-pipeline-speed","mobile":true,"type":"multiple","stem":"pipeline ของแอปมือถือ (Android และ iOS) ใช้เวลา 40 นาทีต่อ PR เพราะรันทุกอย่างบน agent macOS ตัวเดียว ทั้ง lint, unit test และ build ของทั้งสองแพลตฟอร์ม ขณะที่ agent macOS มีจำนวนจำกัดและต้นทุนสูงกว่า agent Linux ข้อใดช่วยให้ pipeline เร็วขึ้นโดยยังตรวจคุณภาพได้ครบ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แยก job ให้ lint, unit test และ build ของ Android ไปรันบน agent Linux และใช้ agent macOS เฉพาะงานของ iOS","correct":true,"why":"ถูก เพราะงานที่ไม่ต้องใช้ macOS ไปรันบน agent ที่ถูกกว่าและมีมากกว่า ลดคิวรอ agent macOS ซึ่งเป็นทรัพยากรจำกัด"},{"id":"B","text":"ข้ามการ build ใน PR และ build เฉพาะ branch release เพื่อลดเวลา","correct":false,"why":"ผิด เพราะ build ที่พังจะถูกพบหลัง merge ซึ่งไปบล็อกคนอื่น และเสียจุดประสงค์ของการตรวจใน PR"},{"id":"C","text":"cache dependency และ build cache โดยใช้ key จากไฟล์ lock หรือไฟล์กำหนด dependency","correct":true,"why":"ถูก เพราะการดาวน์โหลด dependency และการ compile ซ้ำมักใช้เวลาส่วนใหญ่ของ build การใช้ cache ซ้ำเมื่อ dependency ไม่เปลี่ยนตัดเวลาส่วนนี้ และ key ที่ผูกกับไฟล์ lock ทำให้ cache ไม่ค้างเวอร์ชันเก่า"},{"id":"D","text":"รันงานของทั้งสองแพลตฟอร์มต่อกันเป็น job เดียวเพื่อลดเวลาเริ่ม agent","correct":false,"why":"ผิด เพราะงานที่ควรขนานถูกเรียงต่อกัน เวลารวมเพิ่มขึ้นและการล้มของแพลตฟอร์มหนึ่งบังผลของอีกแพลตฟอร์ม เวลาเริ่ม agent ที่ประหยัดได้น้อยกว่ามาก"},{"id":"E","text":"รัน job ที่ไม่ขึ้นต่อกันขนานกัน และวางงานที่เร็วและล้มบ่อย เช่น lint และ unit test ไว้ก่อน build","correct":true,"why":"ถูก เพราะการขนานลดเวลารวม และงานที่ล้มเร็วทำให้รู้ผลเสียตั้งแต่ต้นโดยไม่ต้องรอ build ที่แพงกว่า"}],"explanation":"เร่ง pipeline โดยไม่ลดการตรวจ: ย้ายงานไปยังทรัพยากรที่เหมาะกว่า (สำหรับมือถือ เฉพาะงานที่ต้องใช้ macOS อย่างการ build และเซ็น iOS เท่านั้นที่ต้องอยู่บน agent macOS) ใช้ cache อย่างมี key ที่ถูกต้อง ขนานงานที่ไม่ขึ้นต่อกัน และเรียงงานให้ล้มเร็ว การตัดขั้นตอนตรวจออกเป็นการแลกคุณภาพกับเวลา"}],"exam":[{"id":"OPS-S-E-001","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S1","concept":"container-egress-ip-allowlist","mobile":false,"type":"single","stem":"แอปที่รันเป็น container บน Kubernetes cluster ต้องเชื่อมต่อฐานข้อมูล on-premises ของพันธมิตร ซึ่งควบคุมการเข้าถึงด้วยรายการ IP ที่อนุญาต (allowlist) ทีมพันธมิตรไม่ยอมเปิดช่วง IP กว้าง ขณะที่ pod ถูกสร้างใหม่และได้ IP ใหม่อยู่เสมอ ควรออกแบบอย่างไร","options":[{"id":"A","text":"ส่ง IP ของ pod ที่มีอยู่ทั้งหมดให้พันธมิตรเพิ่มใน allowlist และแจ้งอัปเดตทุกครั้งที่ pod เปลี่ยน","correct":false,"why":"ผิด เพราะ pod เปลี่ยน IP บ่อยตามการ scale และ deploy รายการจะล้าหลังจนเชื่อมต่อไม่ได้ และเป็นภาระประสานงานต่อเนื่อง"},{"id":"B","text":"ให้ทราฟฟิกขาออกจาก cluster ผ่านทางออกที่มี IP คงที่ เช่น NAT gateway หรือ egress gateway แล้วให้พันธมิตรอนุญาตเฉพาะ IP นั้น","correct":true,"why":"ถูก เพราะ IP ที่พันธมิตรเห็นคือ IP ของทางออก ซึ่งคงที่และไม่เปลี่ยนตาม pod จึงอนุญาตแคบได้โดยไม่ต้องตามแก้รายการบ่อย ๆ"},{"id":"C","text":"ขอให้พันธมิตรอนุญาตช่วง IP ทั้ง subnet ของ cluster แล้วคุมสิทธิ์ด้วย username และ password ของฐานข้อมูล","correct":false,"why":"ผิด เพราะช่วง IP กว้างเปิดให้ทุกเครื่องใน subnet เข้าถึงพอร์ตฐานข้อมูลได้ ซึ่งพันธมิตรไม่ยอมรับ และลดชั้นการป้องกันเหลือเพียงรหัสผ่าน"},{"id":"D","text":"รัน pod ด้วย hostNetwork บน node ที่กำหนดไว้ แล้วให้พันธมิตรอนุญาต IP ของ node เหล่านั้น","correct":false,"why":"ผิด เพราะผูกงานกับ node เฉพาะ หาก node ถูกแทนที่หรือ autoscaling เพิ่มลด IP ก็เปลี่ยน และ hostNetwork ลดการแยกเครือข่ายระหว่าง pod กับ host ลงด้วย"}],"explanation":"เมื่อปลายทางควบคุมด้วย IP แต่ต้นทางเปลี่ยน IP ตลอด ให้บีบทราฟฟิกขาออกผ่านจุดเดียวที่มี IP คงที่ แล้วอนุญาตแคบเฉพาะจุดนั้น วิธีนี้แยกความเปลี่ยนแปลงภายใน cluster ออกจากสัญญาที่ทำกับภายนอก และยังควรใช้การยืนยันตัวตนของฐานข้อมูลควบคู่เสมอ"},{"id":"OPS-S-E-002","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S1","concept":"l4-connection-balancing-long-lived-grpc","mobile":false,"type":"multiple","stem":"บริการ gRPC ภายในบน Kubernetes มี 3 replica อยู่หลัง Service แบบ ClusterIP client ภายในราว 200 pod เปิดการเชื่อมต่อ HTTP/2 ค้างไว้ตลอดอายุ pod และส่งคำขอจำนวนมากผ่านการเชื่อมต่อนั้น เมื่อ CPU ของ replica สูง ทีมเพิ่มเป็น 9 replica แต่พบว่า replica ใหม่ 6 ตัวรับโหลดน้อยมาก ขณะที่ 3 ตัวเดิมยังใช้ CPU สูง ข้อใดช่วยกระจายโหลดไปยัง replica ใหม่ได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"วาง proxy หรือ sidecar ที่เข้าใจโปรโตคอลของบริการไว้หน้า replica ให้เลือก replica ทีละคำขอ","correct":true,"why":"ถูก เพราะ proxy ระดับคำขอรับการเชื่อมต่อจาก client แล้วเลือก backend ใหม่ให้ทุกคำขอ แม้ client จะใช้การเชื่อมต่อเดิมต่อไป replica ใหม่จึงได้รับส่วนแบ่งทันที"},{"id":"B","text":"เปลี่ยนชนิด Service จาก ClusterIP เป็น NodePort ให้ทราฟฟิกจากทุก node วิ่งเข้าถึง replica ได้ทุกตัวพร้อมกัน","correct":false,"why":"ผิด เพราะ NodePort ใช้กลไกกระจายระดับการเชื่อมต่อแบบเดียวกัน คำขอที่วิ่งบนการเชื่อมต่อที่เปิดอยู่แล้วยังไปที่ replica เดิมเหมือนเดิม"},{"id":"C","text":"ตั้งอายุสูงสุดของการเชื่อมต่อที่ฝั่ง server ให้ปิดอย่างนุ่มนวลเป็นระยะ แล้วให้ client เชื่อมต่อใหม่","correct":true,"why":"ถูก เพราะเมื่อ client เชื่อมต่อใหม่ การเลือก replica จะเกิดอีกครั้งจากชุด replica ปัจจุบัน ซึ่งรวมตัวใหม่ด้วย โหลดจึงทยอยกระจายออกไป โดยต้องปิดแบบนุ่มนวลเพื่อไม่ตัดคำขอที่กำลังทำ"},{"id":"D","text":"ให้ client ใช้ headless Service และตั้ง round-robin ที่ฝั่ง client พร้อมรีเฟรชรายการที่อยู่ของ pod เป็นระยะ","correct":true,"why":"ถูก เพราะ client รู้ที่อยู่ของทุก replica และเลือกเองทีละคำขอ จึงใช้ replica ใหม่ได้เมื่อรีเฟรชรายการที่อยู่แล้ว"},{"id":"E","text":"เปิด session affinity แบบ ClientIP บน Service เพื่อจัดการการเชื่อมต่อของ client แต่ละตัวที่มาจาก pod ต้นทาง","correct":false,"why":"ผิด เพราะ affinity ผูก client เดิมไว้กับ replica เดิม ซึ่งยิ่งทำให้ replica ใหม่ไม่ได้รับโหลดจาก client ที่เชื่อมต่ออยู่แล้ว"}],"explanation":"Service ใน Kubernetes กระจายทราฟฟิกระดับการเชื่อมต่อ (L4) ส่วน gRPC บน HTTP/2 ส่งหลายคำขอผ่านการเชื่อมต่อเดียว เมื่อ client เปิดการเชื่อมต่อค้างไว้ replica ที่ถูกเลือกตอนเปิดจะรับคำขอทั้งหมดของ client นั้น การเพิ่ม replica จึงไม่ช่วยจนกว่าจะมีการเลือกใหม่ ทางแก้คือย้ายการเลือกไปที่ระดับคำขอ (proxy แบบ L7 หรือ client-side load balancing) หรือบังคับให้เชื่อมต่อใหม่เป็นระยะ ส่วนการเปลี่ยนชนิด Service หรือเปิด affinity ไม่เปลี่ยนพฤติกรรมนี้ และควรตรวจการกระจายโหลดจริงหลังเพิ่ม replica เสมอ"},{"id":"OPS-S-E-003","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S2","concept":"stateful-db-container-migration-decision","mobile":false,"type":"single","stem":"องค์กรกำลังย้ายระบบสั่งซื้อจาก VM ไปรันบน Kubernetes ฐานข้อมูล production เป็น relational database ขนาด 800 GB ที่ต้องการ RPO ต่ำและ RTO สั้น ทีมยังไม่เคยดูแลงานแบบ stateful บน cluster มาก่อน ควรตัดสินใจเรื่องฐานข้อมูลอย่างไรในรอบการย้ายนี้","options":[{"id":"A","text":"ย้ายฐานข้อมูลเข้าไปรันเป็น pod พร้อมกับแอป เพื่อให้ทั้งระบบอยู่บนแพลตฟอร์มเดียวกัน จัดการด้วยเครื่องมือชุดเดียว และใช้ประโยชน์จากระบบอัตโนมัติของ cluster ได้อย่างเต็มที่","correct":false,"why":"ผิด เพราะ stateful workload ต้องการการออกแบบเรื่อง storage, failover, backup และการอัปเกรดที่ทีมยังไม่ชำนาญ ย้ายพร้อมกันกับแอปทำให้ความเสี่ยงสองเรื่องซ้อนกัน"},{"id":"B","text":"ย้ายฐานข้อมูลเป็น pod ก่อนแอป เพื่อพิสูจน์ storage และ failover ให้เสร็จก่อนย้ายส่วนแอป","correct":false,"why":"ผิด เพราะเป็นการเริ่มจากส่วนที่เสี่ยงที่สุดของระบบ production ที่มีเป้า RPO และ RTO เข้มงวด หากพิสูจน์ ควรทำใน environment ทดสอบก่อน ไม่ใช่กับข้อมูลจริง"},{"id":"C","text":"แปลงฐานข้อมูลเป็น NoSQL ที่ออกแบบมาสำหรับ container เพื่อให้ย้ายขึ้น cluster ได้ง่ายขึ้น","correct":false,"why":"ผิด เพราะเป็นการเปลี่ยนโมเดลข้อมูลและโค้ดแอปทั้งระบบ ซึ่งเป็นงานใหญ่คนละเรื่องกับการย้ายแพลตฟอร์ม และไม่รับประกันว่าจะบรรลุ RPO และ RTO"},{"id":"D","text":"ย้ายเฉพาะชั้นแอปแบบ stateless ก่อน และคงฐานข้อมูลไว้บน managed service หรือ VM เดิมที่มี HA และ backup อยู่แล้ว จนกว่าทีมจะพร้อมดูแลงาน stateful และซ้อมกู้คืนได้","correct":true,"why":"ถูก เพราะความเสี่ยงสูงสุดอยู่ที่ข้อมูล การแยกชั้นแอปออกมาย้ายก่อนได้ประโยชน์ของแพลตฟอร์มโดยไม่เอา RPO และ RTO ไปเสี่ยงกับทักษะที่ทีมยังไม่มี"}],"explanation":"ไม่จำเป็นต้องย้ายทุกอย่างพร้อมกัน: ชั้น stateless ได้ประโยชน์จาก container ทันทีและเสี่ยงต่ำ ส่วนฐานข้อมูลที่มี RPO และ RTO เข้มงวดควรอยู่กับบริการที่มี HA และ backup พิสูจน์แล้ว จนกว่าทีมจะมีความสามารถและผ่านการซ้อมกู้คืน การเปลี่ยนแพลตฟอร์มควรแยกจากการเปลี่ยนเทคโนโลยีข้อมูล"},{"id":"OPS-S-E-004","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S2","concept":"zero-downtime-cutover-traffic-shift","mobile":false,"type":"multiple","stem":"ต้องย้ายบริการ API ที่มีผู้ใช้ตลอด 24 ชั่วโมงจาก VM ไปรันเป็น container โดยไม่ให้เกิด downtime และเวอร์ชันใหม่ต้องเปลี่ยน schema ของฐานข้อมูลที่ใช้ร่วมกัน ข้อใดช่วยให้การสลับทำได้โดยบริการไม่หยุด (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ออกแบบการเปลี่ยน schema ให้เข้ากันได้ทั้งสองทิศทาง โดยเพิ่มของใหม่ก่อนและลบของเก่าทีหลัง เพื่อให้โค้ดเก่าบน VM และโค้ดใหม่บน container ใช้ฐานข้อมูลเดียวกันได้ช่วงเปลี่ยน","correct":true,"why":"ถูก เพราะช่วงสลับมีทั้งสองเวอร์ชันทำงานพร้อมกัน ถ้า schema ใหม่ทำให้โค้ดเก่าพัง บริการก็หยุด"},{"id":"B","text":"หยุด VM ในช่วงที่มีผู้ใช้น้อยที่สุด แล้วรัน migration และเปิด container แทนภายในหนึ่งชั่วโมง","correct":false,"why":"ผิด เพราะเป็นการยอมให้เกิด downtime ในช่วงนั้น ซึ่งขัดกับเงื่อนไขที่ห้ามหยุด และถ้า migration มีปัญหาก็ย้อนกลับยาก"},{"id":"C","text":"ทยอยย้ายทราฟฟิกที่ load balancer ตามสัดส่วนเข้า container พร้อม health check และย้อนกลับได้ทันทีเมื่อค่าผิดปกติ","correct":true,"why":"ถูก เพราะเริ่มจากสัดส่วนเล็กทำให้พบปัญหาก่อนกระทบผู้ใช้ส่วนใหญ่ และปรับสัดส่วนกลับได้ทันทีโดยไม่ต้องรอ"},{"id":"D","text":"ลด TTL ของ DNS เหลือ 1 นาทีก่อนวันย้าย แล้วเปลี่ยน record ให้ชี้ไปที่ container ทั้งหมดในครั้งเดียว","correct":false,"why":"ผิด เพราะเป็นการสลับทั้งหมดในครั้งเดียว ไม่มีช่วงลองกับสัดส่วนเล็ก ถ้าเวอร์ชันใหม่มีปัญหาผู้ใช้ทุกคนได้รับผลพร้อมกัน และการย้อนกลับต้องรอ DNS เพราะ resolver บางตัวอาจถือค่าเก่าเกิน TTL"}],"explanation":"การย้ายแบบไม่หยุดต้องแก้สองเรื่อง คือข้อมูล (schema ที่เข้ากันได้สองเวอร์ชัน แบบ expand ก่อน contract ทีหลัง) และทราฟฟิก (ย้ายทีละส่วนพร้อมตัวชี้วัดและทางกลับ) การเปลี่ยน DNS ทีเดียวเสี่ยงกระทบผู้ใช้ทุกคนและย้อนกลับได้ช้า ส่วนการหยุดระบบแม้สั้นก็ขัดกับเงื่อนไขนี้"},{"id":"OPS-S-E-005","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S3","concept":"continuous-image-rescan","mobile":false,"type":"single","stem":"image ของ API ผ่านการ scan โดยไม่พบช่องโหว่ระดับ critical ตอน build และถูก deploy มา 2 เดือนโดยไม่มี commit ใหม่ หลังจากนั้นมีการประกาศช่องโหว่ระดับ critical ของไลบรารีใน base image นั้น ทีมจะรู้และจัดการได้อย่างไรให้เป็นระบบ","options":[{"id":"A","text":"scan image ใน registry และที่ deploy อยู่เป็นรอบ แล้ว rebuild บน base image ที่แพตช์แล้วและ deploy ใหม่","correct":true,"why":"ถูก เพราะช่องโหว่ถูกค้นพบหลัง build ได้เสมอ ผลสะอาดตอน build จึงไม่รับประกันตลอดไป การ scan ซ้ำจับของใหม่ได้ และการ rebuild ผ่าน pipeline เดิมคือทางแก้ที่ทำซ้ำได้"},{"id":"B","text":"ทำให้ scan ตอน build เข้มขึ้น เช่น ให้ pipeline ล้มเมื่อพบช่องโหว่ระดับ medium ขึ้นไป","correct":false,"why":"ผิด เพราะ scan ตอน build ตรวจได้เฉพาะช่องโหว่ที่รู้ในเวลานั้น ช่องโหว่ที่ประกาศหลังจากนั้นเกิดกับ image ที่ deploy แล้ว โดยไม่มี build ใหม่ให้ตรวจ"},{"id":"C","text":"ตั้ง tag ของ image เป็น latest ให้ node ดึง base image ใหม่ทุกครั้งที่ pod รีสตาร์ท","correct":false,"why":"ผิด เพราะ node ดึงเฉพาะ image ของแอปที่ push ไว้แล้ว ไม่ได้ดึง base image แยกหรือ rebuild ให้ ถ้าไม่มีการ rebuild ก็ยังได้ image เดิมที่มีช่องโหว่ และ tag ที่เปลี่ยนค่าได้ทำให้บอกไม่ได้ว่ารุ่นใดรันอยู่"},{"id":"D","text":"exec เข้าไปอัปเดตแพ็กเกจใน container ที่รันอยู่บน production ทันทีที่พบช่องโหว่","correct":false,"why":"ผิด เพราะการแก้ใน container ที่รันอยู่หายไปเมื่อ pod ถูกสร้างใหม่ ไม่ผ่านการทดสอบ และทำให้สภาพจริงต่างจาก image ที่ตรวจแล้ว"}],"explanation":"ความปลอดภัยของ image ไม่หยุดที่ตอน build เพราะช่องโหว่ถูกประกาศภายหลัง จึงต้อง scan ซ้ำสิ่งที่อยู่ใน registry และที่รันอยู่ แล้วให้การแก้ไขวิ่งผ่านท่อ rebuild และ deploy เดิมเพื่อให้ได้ image ใหม่ที่ผ่านการทดสอบ ไม่แก้สดใน container"},{"id":"OPS-S-E-006","level":"senior","pool":"exam","competency":"Container","descriptor":"CTR-S3","concept":"image-provenance-signing-digest","mobile":false,"type":"multiple","stem":"องค์กรต้องการให้ cluster รันเฉพาะ image ที่มาจาก pipeline ของบริษัท หลังพบว่านักพัฒนาเคย build image บนเครื่องตนเองแล้ว push ขึ้น registry และ deploy ข้อใดช่วยบังคับเงื่อนไขนี้ได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"บังคับให้ทุก deployment ระบุ tag แบบ semantic version เช่น 1.4.2 แทน latest","correct":false,"why":"ผิด เพราะ tag เป็นเพียงชื่อที่ผู้ที่มีสิทธิ์ push สร้างหรือเขียนทับได้ จึงไม่ได้บอกว่า image มาจากไหน"},{"id":"B","text":"ให้ pipeline เซ็น image หลัง build และตั้ง admission policy ใน cluster ให้ปฏิเสธ image ที่ไม่มีลายเซ็นที่ตรวจสอบได้","correct":true,"why":"ถูก เพราะลายเซ็นพิสูจน์ที่มาของ image และ admission policy บังคับตรวจก่อนรัน image ที่ build นอก pipeline จึงถูกปฏิเสธ"},{"id":"C","text":"เปิด vulnerability scan ที่ registry เพื่อไม่ให้ image ที่มีช่องโหว่ถูก deploy","correct":false,"why":"ผิด เพราะ scan ตรวจช่องโหว่ใน image ไม่ได้ตรวจที่มา image ที่ build บนเครื่องนักพัฒนาและสะอาดก็ผ่านได้ จึงไม่ตอบเงื่อนไขเรื่องแหล่งที่มา"},{"id":"D","text":"จำกัดสิทธิ์ push ของ registry ให้เฉพาะ service principal ของ pipeline และอ้างอิง image ใน manifest ด้วย digest","correct":true,"why":"ถูก เพราะเมื่อมีเพียง pipeline ที่ push ได้ ที่มาของ image ถูกจำกัดตั้งแต่ต้นทาง และ digest ผูกกับเนื้อหาที่แน่นอน ไม่ถูกเขียนทับเหมือน tag"}],"explanation":"ที่มาของ image (provenance) ต้องบังคับทั้งต้นทางและปลายทาง: ต้นทางจำกัดว่าใคร push ได้ ปลายทางตรวจลายเซ็นก่อนรัน และอ้างอิงด้วย digest เพื่อให้สิ่งที่รันคือสิ่งที่ผ่านการตรวจ การ scan ช่องโหว่และการตั้งชื่อ tag ที่ดีเป็นประโยชน์ แต่ตอบคนละคำถาม"},{"id":"OPS-S-E-007","level":"senior","pool":"exam","competency":"CI/CD","descriptor":"CICD-S7","concept":"idempotent-deployment-rerun","mobile":false,"type":"single","stem":"pipeline deploy ของบริการหนึ่งล้มกลางทางเพราะเครือข่ายขัดข้อง โดย migration รันไปแล้วแต่ยังไม่ได้เปลี่ยน config เมื่อกด re-run สคริปต์ deploy สร้าง resource ซ้ำและต่อท้ายค่าใน config ไปอีกชุด ทีมต้องการให้การ deploy ทำซ้ำได้และให้ผลเหมือนเดิมไม่ว่ารันกี่ครั้ง ควรปรับอย่างไร","options":[{"id":"A","text":"เพิ่มการตรวจ error ในสคริปต์ให้หยุดทันที และกำหนดให้ผู้ดูแลล้างสถานะที่ค้างด้วยมือตามคู่มือก่อนกด re-run ทุกครั้ง เพื่อให้สภาพเริ่มต้นสะอาดก่อนรันใหม่ในแต่ละครั้ง","correct":false,"why":"ผิด เพราะวิธีนี้ยังพึ่งขั้นตอนมือที่พลาดได้ และไม่แก้ปัญหาของสคริปต์ที่รันซ้ำแล้วได้ผลต่างจากเดิม"},{"id":"B","text":"ปิดการ re-run ของ stage deploy และให้สร้าง release ใหม่ทุกครั้งที่ล้ม เพื่อให้ทุกการ deploy เริ่มจากสถานะที่ผ่านการตรวจสอบของ release ใหม่","correct":false,"why":"ผิด เพราะ release ใหม่ก็ยังรันสคริปต์ชุดเดิมบนสถานะที่ค้างอยู่ ปัญหาเดิมจึงเกิดซ้ำ และเพิ่มจำนวน release ที่ไม่จำเป็น"},{"id":"C","text":"เขียนขั้น deploy แบบ declarative หรือ idempotent ที่ให้ได้สถานะปลายทางเดิมทุกครั้ง deploy artifact ที่ระบุ version คงที่ และทำให้ migration รันซ้ำได้อย่างปลอดภัย","correct":true,"why":"ถูก เพราะเมื่อขั้นตอนระบุสถานะปลายทางแทนลำดับคำสั่ง การรันซ้ำหลังล้มกลางทางจึงลู่เข้าสู่สถานะเดิม ไม่สร้างหรือต่อท้ายซ้ำ"},{"id":"D","text":"เพิ่ม retry อัตโนมัติ 3 ครั้งให้ขั้น deploy เพื่อให้ผ่านเมื่อเครือข่ายกลับมา","correct":false,"why":"ผิด เพราะ retry ของสคริปต์ที่ไม่ idempotent ทำให้เกิดการสร้างและต่อท้ายซ้ำหลายรอบ ปัญหาแย่ลง"}],"explanation":"การ deploy ที่เชื่อถือได้ต้องรันซ้ำได้อย่างปลอดภัย เพราะ pipeline ล้มกลางทางเป็นเรื่องปกติ ใช้เครื่องมือหรือสคริปต์ที่ระบุสถานะปลายทาง (declarative) จัดการ migration ให้ตรวจก่อนทำ และ deploy artifact ที่ระบุ version ชัดเจน จึงทำให้ re-run เป็นการแก้ปัญหา ไม่ใช่การสร้างปัญหาใหม่"},{"id":"OPS-S-E-008","level":"senior","pool":"exam","competency":"CI/CD","descriptor":"CICD-S8","concept":"post-deploy-smoke-test-gate","mobile":false,"type":"multiple","stem":"pipeline ของบริการหนึ่งแสดงผล deploy สำเร็จเป็นสีเขียว แต่ผู้ใช้พบว่าเวอร์ชันใหม่ crash ตั้งแต่เริ่มทำงานเพราะค่า config ผิด ทีมต้องการเพิ่มการตรวจสอบหลัง deploy ข้อใดช่วยตรวจพบปัญหาแบบนี้ภายใน pipeline ได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"รัน unit test ซ้ำอีกรอบหลัง deploy เพื่อยืนยันว่าโค้ดเวอร์ชันเดียวกันยังผ่าน","correct":false,"why":"ผิด เพราะ unit test ไม่ได้เรียกแอปที่ deploy จริง และผ่านมาแล้วก่อน deploy ผลจึงไม่ต่างและไม่เห็นค่า config ของ environment"},{"id":"B","text":"เพิ่ม stage ตรวจ readiness หรือ health endpoint ของ instance ที่ deploy จริง และเรียก endpoint ธุรกิจหลักหนึ่งหรือสองตัว ถ้าไม่ผ่านให้ pipeline ล้ม","correct":true,"why":"ถูก เพราะการเรียกแอปที่รันจริงเผยปัญหา config ที่ไม่ปรากฏตอน build และผลที่ล้มทำให้ pipeline ไม่รายงานสำเร็จเท็จ"},{"id":"C","text":"เพิ่ม linter ตรวจ syntax ของไฟล์ config และ manifest ก่อน deploy","correct":false,"why":"ผิด เพราะ linter ตรวจรูปแบบของไฟล์ แต่ค่าที่ผิดความหมาย เช่น URL ชี้ผิดที่ ยังผ่านการตรวจรูปแบบได้ และไม่แสดงว่าแอปที่รันอยู่ทำงานจริง"},{"id":"D","text":"ให้ pipeline รอ rollout เสร็จ และย้อนกลับอัตโนมัติเมื่อ instance ใหม่ไม่ผ่านเกณฑ์ภายในเวลาที่กำหนด","correct":true,"why":"ถูก เพราะ instance ที่ crash ตั้งแต่เริ่มจะไม่ผ่านเกณฑ์ของการ rollout การย้อนกลับอัตโนมัติจำกัดผลกระทบต่อผู้ใช้"},{"id":"E","text":"เพิ่ม timeout ของ task deploy เพื่อให้รอ instance เริ่มทำงานนานขึ้นก่อนสรุปผล","correct":false,"why":"ผิด เพราะการรอนานขึ้นไม่ได้ตรวจอะไรเพิ่ม instance ที่ crash ก็ยัง crash และ task อาจรายงานสำเร็จตามเงื่อนไขเดิมที่ไม่ได้ดูสถานะจริง"}],"explanation":"pipeline ที่เขียวหมายถึงคำสั่ง deploy จบ ไม่ได้แปลว่าแอปทำงานได้ จึงต้องมีการตรวจสอบหลัง deploy (deployment validation) ที่ดูแอปที่รันจริง ได้แก่ health check, smoke test และเงื่อนไขการ rollout พร้อมการย้อนกลับอัตโนมัติ การตรวจก่อน deploy เช่น unit test และ lint ยังจำเป็น แต่จับปัญหาของ environment ไม่ได้"},{"id":"OPS-S-E-009","level":"senior","pool":"exam","competency":"CI/CD","descriptor":"CICD-S1","concept":"mobile-environment-variants-signing","mobile":true,"type":"single","stem":"ทีมแอปมือถือต้องมี environment dev, staging และ production ซึ่งใช้ API base URL และ key ของบริการภายนอกต่างกัน ปัจจุบันใช้ build เดียวที่มีเมนูซ่อนให้สลับ environment ได้ในแอป ทีมความปลอดภัยกังวลว่าแอปที่ปล่อยให้ผู้ใช้จริงยังมีค่าของ staging ติดอยู่ ควรออกแบบ pipeline อย่างไร","options":[{"id":"A","text":"คง build เดียวไว้ แต่ป้องกันเมนูซ่อนด้วยรหัสผ่านและเปลี่ยนรหัสผ่านทุกเดือน","correct":false,"why":"ผิด เพราะค่าของ staging ยังอยู่ในแอปที่ผู้ใช้จริงได้รับ ผู้ที่ถอดแอปหรือรู้รหัสผ่านก็เข้าถึงได้ และการเปลี่ยนรหัสเป็นภาระโดยไม่แก้ที่ต้นเหตุ"},{"id":"B","text":"กำหนด build variant แยกต่อ environment จาก commit เดียวกัน แต่ละตัวมี config, application id และข้อมูลเซ็นของตัวเอง ส่ง staging ให้ผู้ทดสอบผ่านช่องทางภายใน ส่วน production ผ่าน approval ก่อนส่งขึ้นร้านค้า","correct":true,"why":"ถูก เพราะ build production ไม่มีค่าหรือเมนูของ environment อื่นอยู่เลย ผู้ทดสอบติดตั้ง staging ควบคู่กับ production บนเครื่องเดียวกันได้ด้วย application id ที่ต่างกัน และ approval ควบคุมการปล่อย"},{"id":"C","text":"ให้แอปดึง config ของ environment จาก remote config ตอนเปิดแอป และใช้ build เดียวกันทุก environment โดยเลือก environment จากหน้าล็อกอินสำหรับผู้ใช้ภายในที่ได้รับสิทธิ์ ซึ่งเปลี่ยนค่าได้ทันทีโดยไม่ผ่านการ build ใหม่ และผู้ใช้ทั่วไปได้ production เป็นค่าเริ่มต้น","correct":false,"why":"ผิด เพราะ build ที่ผู้ใช้จริงได้รับยังมีทางเลือกไปยังทุก environment ถ้าการตรวจสิทธิ์พลาดหรือถูกแก้ฝั่งเครื่อง ผู้ใช้ก็อาจชี้ไป staging ได้ ซึ่งเป็นความเสี่ยงเดิม และเพิ่มจุดล้มเหลวเมื่อดึง config ไม่สำเร็จ"},{"id":"D","text":"build production บนเครื่องของผู้ปล่อยเวอร์ชัน โดยลบค่า staging ออกด้วยมือก่อนส่งร้านค้า เพื่อให้มั่นใจว่าสะอาด","correct":false,"why":"ผิด เพราะการลบด้วยมือพลาดได้และตรวจสอบย้อนหลังไม่ได้ build จากเครื่องบุคคลทำให้ผลขึ้นกับสภาพแวดล้อมของเครื่องนั้น และไม่ใช่ artifact ที่ผ่านการทดสอบบน CI"}],"explanation":"ค่าที่แตกต่างตาม environment ในแอปมือถือถูกฝังไปก
