ับ binary จึงควรแยก build variant ต่อ environment จาก commit เดียวกัน พร้อม application id และข้อมูลเซ็นแยก เพื่อให้ไม่มีค่าของ environment อื่นหลุดไปกับ build ที่ผู้ใช้จริงได้รับ และให้ production ผ่าน approval ก่อนปล่อย"},{"id":"OPS-S-E-010","level":"senior","pool":"exam","competency":"CI/CD","descriptor":"CICD-S2","concept":"zap-triage-policy-authenticated-scan","mobile":false,"type":"multiple","stem":"ทีมเพิ่ม ZAP scan ใน pipeline แล้วพบ alert 40 รายการต่อครั้ง ปะปนกันทั้งระดับสูง ปานกลาง และข้อมูลเชิงแนะนำ บางส่วนเป็น false positive และ endpoint ส่วนใหญ่ของ API ต้องล็อกอินก่อนจึงเข้าถึงได้ ข้อใดทำให้ผลสแกนใช้ประโยชน์ได้โดยไม่ขวางงานของทีม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้งให้ทุก alert ไม่ว่าระดับใดทำให้ pipeline ล้ม เพื่อให้ทีมแก้ครบทั้งหมด","correct":false,"why":"ผิด เพราะ alert เชิงแนะนำและ false positive ทำให้ pipeline แดงอยู่ตลอด ทีมจะหาทางข้ามหรือปิดการตรวจ ทำให้ได้ผลตรงข้าม"},{"id":"B","text":"สแกนเฉพาะหน้า login และหน้าสาธารณะ เพราะเป็นจุดที่ผู้โจมตีเข้าถึงได้ก่อน","correct":false,"why":"ผิด เพราะช่องโหว่ที่ร้ายแรงมักอยู่หลังล็อกอิน เช่น การเข้าถึงข้อมูลของผู้ใช้คนอื่น ผู้โจมตีสมัครบัญชีเองเพื่อเข้าถึงส่วนนี้ได้"},{"id":"C","text":"ให้ pipeline ล้มเฉพาะ finding ระดับสูงที่เกิดใหม่ ส่วนระดับอื่นส่งเข้า backlog พร้อมเจ้าของและกำหนดเวลา และบันทึก false positive ที่ยืนยันแล้วพร้อมเหตุผลและวันทบทวน","correct":true,"why":"ถูก เพราะเกณฑ์ที่ชัดทำให้ pipeline ล้มเมื่อมีความเสี่ยงสูงจริงเท่านั้น ส่วนที่เหลือมีเจ้าของตามแก้ และการบันทึกเหตุผลของ false positive ป้องกันการซ่อนปัญหาจริงไว้เงียบ ๆ"},{"id":"D","text":"ตั้งค่า ZAP ให้ล็อกอินด้วยบัญชีทดสอบ (authentication context) เพื่อให้สแกนครอบคลุม endpoint หลังล็อกอินด้วย","correct":true,"why":"ถูก เพราะถ้า ZAP เข้าถึงได้แค่หน้าสาธารณะ endpoint ส่วนใหญ่ที่ต้องล็อกอินจะไม่ถูกทดสอบเลย ผล scan สะอาดจึงให้ความมั่นใจเกินจริง"}],"explanation":"การสแกนความปลอดภัยแบบ dynamic ใช้ได้จริงเมื่อมีสองสิ่ง คือ coverage (สแกนหลังล็อกอินด้วย context ที่กำหนด) และนโยบายคัดกรอง (ล้มเฉพาะสิ่งที่ร้ายแรงและใหม่ ส่วนที่เหลือมีเจ้าของและเวลา พร้อมเหตุผลของการยกเว้น) หากเข้มงวดทุกระดับ ทีมมักเลี่ยงเครื่องมือ หากหลวมเกินไป ช่องโหว่ถูกซ่อนไว้"},{"id":"OPS-S-E-011","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S1","concept":"private-endpoint-managed-service","mobile":false,"type":"single","stem":"แอปบน VM ใน private subnet ต้องอ่านเขียนข้อมูลใน managed object storage และ managed database ซึ่งตามค่าเริ่มต้นเข้าถึงผ่าน public endpoint ข้อกำหนดด้านความปลอดภัยระบุว่าทราฟฟิกระหว่างแอปกับบริการเหล่านี้ต้องไม่ผ่านอินเทอร์เน็ตสาธารณะ ควรออกแบบการเชื่อมต่ออย่างไร","options":[{"id":"A","text":"สร้าง private endpoint ใน VPC ไปยังแต่ละบริการ ให้ DNS ชี้ไปยัง IP ภายใน และปิด public access ที่ฝั่งบริการ","correct":true,"why":"ถูก เพราะทราฟฟิกวิ่งในเครือข่ายส่วนตัวไปยังบริการโดยตรง ไม่ผ่านอินเทอร์เน็ตสาธารณะ และการปิด public access ฝั่งบริการกันการเข้าถึงจากทางอื่น"},{"id":"B","text":"ให้ VM ออกผ่าน NAT gateway ไปยัง public endpoint โดยจำกัดด้วย allowlist เป็น IP ของ NAT","correct":false,"why":"ผิด เพราะทราฟฟิกยังใช้ public endpoint ของบริการ แม้จำกัดแหล่งที่มาแล้วก็ยังเป็นเส้นทางสาธารณะ ซึ่งขัดกับข้อกำหนด"},{"id":"C","text":"ติดตั้ง VPN client ในแอปบน VM แล้วเข้ารหัสทราฟฟิกไปยัง public endpoint","correct":false,"why":"ผิด เพราะบริการ managed โดยทั่วไปไม่มี VPN server ที่ปลายทางให้ต่อ และเพิ่มความซับซ้อนโดยไม่เปลี่ยนว่าปลายทางคือ public endpoint"},{"id":"D","text":"บังคับใช้ TLS กับทุกการเชื่อมต่อไปยัง public endpoint เพราะข้อมูลถูกเข้ารหัสระหว่างทางแล้ว","correct":false,"why":"ผิด เพราะ TLS ปกป้องเนื้อหา แต่ข้อกำหนดคือเส้นทางต้องไม่ผ่านอินเทอร์เน็ตสาธารณะ ซึ่ง TLS ไม่ได้ตอบ"}],"explanation":"เมื่อข้อกำหนดพูดถึงเส้นทางของทราฟฟิก ให้แก้ที่เส้นทาง ไม่ใช่เพียงเข้ารหัส: private endpoint ทำให้บริการ managed ปรากฏเป็น IP ภายในของเครือข่ายเรา แล้วปิด public access ที่ฝั่งบริการ ส่วน TLS ใช้ควบคู่เพื่อเข้ารหัสเนื้อหาเสมอ"},{"id":"OPS-S-E-012","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S2","concept":"storage-tier-lifecycle-retrieval-fee","mobile":true,"type":"single","stem":"แอปมือถือสำหรับเก็บรูปครอบครัวเก็บรูปที่ผู้ใช้อัปโหลดไว้ใน object storage ชั้น standard รวม 300 TB (300,000 GB) ผู้ใช้ถือว่าแอปเป็นคลังถาวร ราว 85% ของรูปมีอายุเกิน 60 วัน และแต่ละเดือนมีรูปเก่าถูกเปิดดูเพียงราว 2% แต่เมื่อผู้ใช้กดดูรูปเก่า แอปต้องแสดงรูปภายใน 2 วินาที ทีมการเงินขอให้ลดค่าจัดเก็บ ราคาสมมติต่อ GB ต่อเดือน: standard 0.020, infrequent-access 0.010 บวกค่าดึงข้อมูล 0.010 ต่อ GB ที่ถูกอ่าน, archive 0.002 บวกค่าดึง 0.020 ต่อ GB โดย archive ต้องขอคืนสภาพก่อนอ่านและใช้เวลาหลายชั่วโมง ทีมควรทำอย่างไร","options":[{"id":"A","text":"ตั้ง lifecycle ให้ย้ายรูปที่อายุเกิน 60 วันไป archive เพื่อใช้ราคาจัดเก็บที่ต่ำที่สุด และเก็บรูปล่าสุดไว้ใน standard ตามเดิม","correct":false,"why":"ผิด เพราะค่าจัดเก็บรวมจะลดลงมากที่สุด (ราว 1,500 จากราว 6,000 หน่วยต่อเดือน) แต่รูปเก่าต้องรอคืนสภาพหลายชั่วโมง ไม่ตรงเงื่อนไขแสดงรูปภายใน 2 วินาที ผู้ใช้จะเปิดรูปเก่าไม่ได้ทันที"},{"id":"B","text":"ลบรูปที่ไม่ถูกเปิดดูเกิน 12 เดือนโดยอัตโนมัติ และแจ้งผู้ใช้ไว้ในข้อกำหนดการใช้งาน เพื่อลดปริมาณข้อมูลที่ต้องเก็บ","correct":false,"why":"ผิด เพราะผู้ใช้ฝากรูปไว้เป็นคลังถาวร การลบเป็นการเปลี่ยนสิ่งที่บริการสัญญาไว้ ไม่ใช่การปรับต้นทุน และรูปที่ไม่มีใครเปิดดูหลายเดือนมักเป็นรูปที่ผู้ใช้อยากเก็บไว้ที่สุด"},{"id":"C","text":"คงรูปทั้งหมดไว้ใน standard เพื่อเลี่ยงค่าดึงข้อมูลที่ infrequent-access คิดเมื่อผู้ใช้เปิดรูปเก่า และทบทวนใหม่เมื่ออัตราการเปิดรูปเก่าเปลี่ยนไป","correct":false,"why":"ผิด เพราะค่าดึง 0.010 ต่อ GB ที่ถูกอ่าน เทียบกับส่วนต่างค่าจัดเก็บ 0.010 ต่อ GB ต่อเดือน เมื่อรูปเก่าถูกอ่านเพียง 2% ต่อเดือน ค่าดึงรวมราว 51 หน่วย เทียบกับส่วนที่ประหยัดได้ราว 2,550 หน่วย (ประมาณ 2% ของส่วนที่ประหยัดได้)"},{"id":"D","text":"ตั้ง lifecycle ให้ย้ายรูปที่อายุเกิน 60 วันไป infrequent-access เพื่อลดค่าจัดเก็บ โดยรูปยังอ่านได้โดยไม่ต้องรอคืนสภาพ","correct":true,"why":"ถูก เพราะค่าจัดเก็บรวมลดจากราว 6,000 เหลือราว 3,500 หน่วยต่อเดือน (ลดราว 42%) รวมค่าดึงข้อมูลแล้ว และค่าดึงจะกินส่วนที่ประหยัดจนหมดก็ต่อเมื่อรูปเก่าถูกอ่านครบทั้งหมดทุกเดือน ซึ่งห่างจาก 2% มาก"}],"explanation":"การเลือกชั้นของ storage ต้องดูสามอย่างพร้อมกัน คือราคาจัดเก็บ ค่าดึงข้อมูล และเวลาที่ต้องรอกว่าจะอ่านได้ ชั้นที่ถูกที่สุดไม่ใช่ชั้นที่เหมาะเสมอไป archive ถูกกว่าแต่ผิดเงื่อนไขเวลา ส่วน infrequent-access ลดต้นทุนได้โดยยังอ่านได้ตามปกติ และจะไม่คุ้มก็ต่อเมื่ออัตราการอ่านสูงมาก ก่อนตั้ง lifecycle ควรดูอัตราการเปิดรูปเก่าจริงจาก log การเข้าถึง และตรวจเงื่อนไขของผู้ให้บริการ เช่น ขนาดวัตถุขั้นต่ำหรือระยะเก็บขั้นต่ำของแต่ละชั้น ซึ่งอาจทำให้ตัวเลขต่างจากที่คำนวณ"},{"id":"OPS-S-E-013","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S2","concept":"nonprod-schedule-shutdown-commitment-mismatch","mobile":false,"type":"multiple","stem":"ทีมแพลตฟอร์มพบว่าค่า cloud ของ environment ที่ไม่ใช่ production (dev, test, staging) คิดเป็นราว 35% ของบิลรวม VM และฐานข้อมูลของ dev และ test เปิดอยู่ตลอด 24 ชั่วโมง แต่ใช้งานจริงเฉพาะวันจันทร์ถึงศุกร์ 08:00-19:00 (ราว 55 ชั่วโมงจาก 168 ชั่วโมงต่อสัปดาห์) ส่วนข้อมูลทดสอบของ staging ใช้เวลาครึ่งวันในการสร้างใหม่ ผู้ให้บริการเสนอ reserved capacity 1 ปีที่ลดราคาลง 40% เมื่อเทียบกับ on-demand ข้อใดช่วยลดต้นทุนโดยไม่รบกวนนักพัฒนา (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้งตารางให้ปิด VM ของ dev และ test นอกเวลางานและเปิดก่อนเริ่มงาน พร้อมช่องทางให้นักพัฒนาสั่งเปิดนอกเวลาได้","correct":true,"why":"ถูก เพราะค่า compute คิดตามชั่วโมงที่เปิด การเปิดเฉพาะเวลางานใช้ราว 33% ของชั่วโมงทั้งหมด (55 จาก 168) ค่าดิสก์ยังคิดต่อ จึงลดได้น้อยกว่า 67% เล็กน้อย และช่องทางเปิดนอกเวลากันงานด่วนถูกขวาง"},{"id":"B","text":"บังคับให้ resource ใน non-production มี tag เจ้าของและวันหมดอายุ และมีงานเก็บกวาดที่แจ้งเจ้าของก่อนลบ","correct":true,"why":"ถูก เพราะ resource ที่ถูกสร้างทดลองแล้วลืม เช่น VM ดิสก์ และ snapshot เป็นต้นทุนที่สะสมโดยไม่มีผู้ใช้ tag ทำให้หาเจ้าของได้ และการแจ้งก่อนลบกันการลบของที่ยังใช้อยู่"},{"id":"C","text":"ซื้อ reserved capacity 1 ปีให้ VM ของ dev และ test ทั้งหมด เพื่อรับส่วนลดจากผู้ให้บริการ และกำหนดรอบทบทวนปีละครั้ง","correct":false,"why":"ผิด เพราะ reserved ถูกคิดตลอด 24 ชั่วโมงไม่ว่าจะใช้หรือไม่ จ่ายราว 60% ของ on-demand แบบเปิดตลอด ขณะที่เปิดเฉพาะเวลางานแบบ on-demand จ่ายราว 33% และไม่ผูกสัญญา เมื่อใช้งานเพียงหนึ่งในสาม ส่วนลดจึงไม่คุ้ม"},{"id":"D","text":"ย้ายฐานข้อมูล staging ไปรันบน spot หรือ interruptible instance เพื่อใช้ราคาต่ำสุด โดยยังเปิดตลอด 24 ชั่วโมงเหมือนเดิม","correct":false,"why":"ผิด เพราะเครื่องอาจถูกเรียกคืนได้ทุกเมื่อ ฐานข้อมูลที่ทีมใช้ร่วมกันจะดับกลางงาน และข้อมูลทดสอบที่ใช้ครึ่งวันในการสร้างใหม่เสี่ยงต้องสร้างซ้ำ ผลเสียต่อนักพัฒนาสูงกว่าส่วนที่ประหยัดได้"},{"id":"E","text":"ใช้ฐานข้อมูลแบบ serverless ที่หยุดคิดค่า compute อัตโนมัติเมื่อไม่มีการเชื่อมต่อสำหรับ dev และ test","correct":true,"why":"ถูก เพราะ dev และ test ใช้งานเป็นช่วง ๆ ค่า compute จึงหยุดเมื่อว่าง และไม่ต้องตั้งตารางเอง แต่ค่าจัดเก็บยังคิดต่อ และการเชื่อมต่อครั้งแรกหลังหยุดอาจช้ากว่าปกติ"}],"explanation":"ต้นทุนของ environment ที่ใช้เป็นช่วงเวลาควรจ่ายตามชั่วโมงที่ใช้จริง วิธีที่ได้ผลคือทำให้ของที่ไม่ได้ใช้ไม่ทำงาน (ตารางปิดเปิด ฐานข้อมูลที่หยุดเองได้) และเก็บกวาดของที่ถูกลืม ส่วนการผูกสัญญาระยะยาวเหมาะกับโหลดคงที่ตลอดเวลา ไม่ใช่โหลดที่ใช้ราวหนึ่งในสาม ควรคำนวณเทียบเสมอ (ในที่นี้ 60% เทียบกับ 33% ของ on-demand 24 ชั่วโมง) ส่วน capacity ราคาถูกที่ถูกเรียกคืนได้ ควรใช้กับงานที่รับการสะดุดได้ ไม่ใช่ข้อมูลที่ทีมต้องใช้ร่วมกันและสร้างใหม่ยาก"},{"id":"OPS-S-E-014","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S3","concept":"dr-strategy-rto-rpo-cost","mobile":false,"type":"single","stem":"ระบบชำระเงินของบริษัทต้องรอดจากเหตุที่ทั้ง region ล่มด้วย RTO 30 นาที และ RPO 5 นาที ทีมประเมินทางเลือกดังนี้ backup และ restore ข้าม region ใช้เวลากู้ราว 3 ชั่วโมง, pilot light ต้องใช้เวลาขยายระบบราว 1 ชั่วโมง, warm standby คือระบบย่อขนาดที่รันอยู่แล้ว สลับได้ภายใน 10-20 นาที ค่าใช้จ่ายราว 1.5 เท่าของ region เดียว, active-active สลับได้ในไม่กี่วินาที ค่าใช้จ่ายราว 2 เท่าและซับซ้อนมากเรื่องข้อมูลที่เขียนจากสอง region ทีมควรเลือกแบบใด","options":[{"id":"A","text":"backup และ restore ข้าม region เพราะต้นทุนต่ำที่สุดและยังกู้ระบบได้ในที่สุด","correct":false,"why":"ผิด เพราะเวลากู้ราว 3 ชั่วโมงเกิน RTO 30 นาทีหลายเท่า และ backup เป็นรอบมักมีช่วงข้อมูลที่ขาดมากกว่า RPO 5 นาที"},{"id":"B","text":"pilot light พร้อมสคริปต์ขยายระบบอัตโนมัติ เพราะต้นทุนต่ำกว่า warm standby และสคริปต์ที่ซ้อมไว้แล้วช่วยให้ขยายระบบได้เร็วพอใกล้เคียงเป้าหมาย","correct":false,"why":"ผิด เพราะเวลาขยายระบบราว 1 ชั่วโมงเกิน RTO 30 นาที แม้ใช้สคริปต์ก็ต้องรอ resource ถูกสร้างและระบบอุ่นเครื่อง"},{"id":"C","text":"warm standby พร้อม replication ข้อมูลแบบ asynchronous ที่ lag ไม่เกิน 5 นาที เพราะอยู่ในเป้า RTO และ RPO ด้วยต้นทุนต่ำกว่า active-active","correct":true,"why":"ถูก เพราะ warm standby สลับได้ใน 10-20 นาที อยู่ในเป้า 30 นาที และ lag ของ replication ที่ควบคุมไม่เกิน 5 นาทีตรงกับ RPO โดยไม่ต้องจ่ายเพิ่มและรับความซับซ้อนของ active-active"},{"id":"D","text":"active-active เพราะสลับได้เร็วที่สุดและปลอดภัยที่สุด","correct":false,"why":"ผิด เพราะเกินกว่าที่เป้า RTO และ RPO ต้องการ และแลกด้วยต้นทุนราวสองเท่ากับความซับซ้อนของข้อมูลจากสอง region เมื่อมีทางเลือกที่ตรงเป้าด้วยต้นทุนต่ำกว่า"}],"explanation":"เลือกรูปแบบ DR จาก RTO และ RPO ที่ธุรกิจกำหนดก่อน แล้วเลือกแบบที่ถูกที่สุดที่ยังอยู่ในเป้า ไม่ใช่แบบที่ดีที่สุดในทางเทคนิค ในกรณีนี้ warm standby ตรงเป้าโดยไม่ต้องจ่ายเกิน และต้องซ้อมสลับจริงเป็นระยะเพื่อพิสูจน์ว่าได้ตามเป้า รวมถึงเฝ้าดู replication lag ให้ไม่เกิน RPO"},{"id":"OPS-S-E-015","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S3","concept":"pipeline-identity-least-privilege","mobile":false,"type":"multiple","stem":"pipeline ของทีมใช้ service principal ตัวเดียวที่มีสิทธิ์ Owner ระดับ subscription พร้อม client secret ที่ไม่มีวันหมดอายุ เพื่อ deploy ทุก environment ทีมความปลอดภัยขอให้ปรับให้สอดคล้องกับหลัก least privilege ข้อใดเป็นแนวทางที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แยก identity ต่อ environment และให้ role เฉพาะ resource group ที่ต้อง deploy เท่านั้น","correct":true,"why":"ถูก เพราะ identity ของ dev ที่หลุดจะไม่กระทบ production และสิทธิ์ที่จำกัดเฉพาะขอบเขตที่ใช้ลดความเสียหายเมื่อถูกยึด"},{"id":"B","text":"คงสิทธิ์ Owner ไว้ แต่เปลี่ยน client secret เป็นรหัสที่ยาวและซับซ้อนขึ้นและเก็บเป็นตัวแปรของ pipeline","correct":false,"why":"ผิด เพราะความยาวของ secret ไม่ลดขอบเขตความเสียหายเมื่อหลุด ผู้ที่ได้ secret ยังได้สิทธิ์ Owner ทั้ง subscription"},{"id":"C","text":"ใช้ workload identity federation หรือ managed identity เพื่อให้ได้ credential ชั่วคราวแทน secret อายุยาว","correct":true,"why":"ถูก เพราะไม่มี secret ถาวรให้หลุดจาก pipeline และ credential ชั่วคราวหมดอายุเอง"},{"id":"D","text":"ตั้ง approval และ check บน environment production ก่อนที่ stage deploy จะใช้ identity ของ production ได้","correct":true,"why":"ถูก เพราะมีคนยืนยันก่อนที่สิทธิ์ที่ทรงพลังที่สุดจะถูกใช้ และเป็นการแยกหน้าที่ระหว่างผู้เขียนโค้ดกับผู้อนุมัติ"}],"explanation":"least privilege ของ pipeline มีสามด้าน: ขอบเขต (แยก identity ต่อ environment และจำกัด role ในขอบเขตที่ใช้), อายุของ credential (ใช้แบบชั่วคราวผ่าน federation หรือ managed identity), และการควบคุมการใช้ (approval บน environment ที่เสี่ยง) การเสริมความแข็งแรงของ secret โดยไม่ลดสิทธิ์ไม่ได้แก้ผลกระทบเมื่อหลุด"},{"id":"OPS-S-E-016","level":"senior","pool":"exam","competency":"Cloud","descriptor":"CLD-S1","concept":"at-least-once-idempotent-consumer","mobile":false,"type":"single","stem":"ระบบรับ webhook แจ้งการชำระเงินผ่าน PromptPay จากผู้ให้บริการ ส่งเข้า queue แล้วมี worker อัปเดตสถานะคำสั่งซื้อและส่งอีเมลยืนยัน ช่วงที่ worker ถูกรีสตาร์ท ลูกค้าบางรายได้อีเมลยืนยันสองฉบับ ทั้งที่ queue ตั้งให้ส่งข้อความซ้ำได้หากไม่ได้รับการ ack ควรแก้อย่างไรให้สอดคล้องกับการทำงานของ flow นี้","options":[{"id":"A","text":"ตั้ง visibility timeout ของ queue เป็นค่าสูงมาก เพื่อไม่ให้มีข้อความถูกส่งซ้ำ","correct":false,"why":"ผิด เพราะค่าที่สูงเพียงทำให้ข้อความที่ค้างถูกส่งซ้ำช้าลงและกระทบความเร็วของการกู้งาน แต่ไม่ได้ป้องกันการส่งซ้ำ เมื่อ worker ล้มหลังทำงานแต่ก่อน ack ยังเกิดซ้ำได้"},{"id":"B","text":"ออกแบบ worker ให้ idempotent โดยเก็บ id ของเหตุการณ์ชำระเงินหรือสถานะที่ส่งอีเมลแล้ว และตรวจก่อนทำงาน เพื่อให้ประมวลผลข้อความเดิมซ้ำแล้วผลไม่เปลี่ยน","correct":true,"why":"ถูก เพราะ queue แบบ at-least-once อาจส่งข้อความเดิมซ้ำได้เมื่อ worker ล้มก่อน ack การตรวจ id ก่อนทำช่วยให้การรับซ้ำไม่ก่อผลซ้ำ เหลือเพียงจังหวะแคบที่ล้มหลังส่งอีเมลแต่ก่อนบันทึกสถานะซึ่งอาจยังซ้ำได้"},{"id":"C","text":"เปลี่ยนไปใช้ queue ที่รับประกัน exactly-once ทุกขั้นตั้งแต่ webhook ถึงอีเมล เพื่อกำจัดข้อความซ้ำที่ต้นทาง แล้วให้ worker เขียนแบบเดิมที่ทำงานครั้งเดียวต่อข้อความได้","correct":false,"why":"ผิด เพราะการรับประกัน exactly-once ภายใน queue ไม่ครอบคลุมผลข้างเคียงภายนอก เช่น การส่งอีเมล ซึ่งยังเกิดซ้ำได้หาก worker ล้มกลางทาง จึงต้องทำให้ตัวทำงาน idempotent อยู่ดี"},{"id":"D","text":"ให้ worker ack ข้อความตั้งแต่ตอนรับก่อนเริ่มทำงาน เพื่อไม่ให้ถูกส่งซ้ำ","correct":false,"why":"ผิด เพราะถ้า worker ล้มหลัง ack แต่ก่อนทำงานเสร็จ ข้อความหายและไม่มีการอัปเดตสถานะหรืออีเมลเลย ซึ่งอันตรายกว่าอีเมลซ้ำสำหรับเหตุการณ์ชำระเงิน"}],"explanation":"ระบบ messaging ส่วนใหญ่ให้ความหมายแบบ at-least-once เพื่อไม่ให้ข้อความหาย ผลคือผู้รับต้องทนต่อข้อความซ้ำ: เก็บ id ของเหตุการณ์แล้วตรวจก่อนทำ เพื่อไม่ให้การประมวลผลซ้ำก่อผลซ้ำ แต่งานภายนอกอย่างอีเมลยังอาจซ้ำได้ถ้าล้มหลังส่งและก่อนบันทึก การพยายามกันการซ้ำด้วย ack ล่วงหน้าเปลี่ยนปัญหาเป็นข้อความหายซึ่งแย่กว่าสำหรับงานชำระเงิน"}]}},"competencies":["Container","CI/CD","Cloud"],"descriptorCompetency":{"CTR-J1":"Container","CTR-J2":"Container","CICD-J1":"CI/CD","CICD-J2":"CI/CD","CICD-J3":"CI/CD","CLD-J1":"Cloud","CLD-J2":"Cloud","CLD-J3":"Cloud","CTR-S1":"Container","CTR-S2":"Container","CTR-S3":"Container","CICD-S1":"CI/CD","CICD-S2":"CI/CD","CICD-S3":"CI/CD","CICD-S4":"CI/CD","CICD-S5":"CI/CD","CICD-S6":"CI/CD","CICD-S7":"CI/CD","CICD-S8":"CI/CD","CLD-S1":"Cloud","CLD-S2":"Cloud","CLD-S3":"Cloud"}}</script>
<script type="application/json" id="review-data">{"version":1,"levels":{"junior":[{"descriptor":"CTR-J1","competency":"Container","title":"Docker พื้นฐาน: Dockerfile, image, Compose","summary":"การห่อแอปเป็น image ด้วย Dockerfile แล้วรันเป็น container ให้ได้สภาพแวดล้อมเหมือนกันทุกเครื่อง เป็นพื้นฐานของการ deploy สมัยใหม่ และข้อสอบมักถามเรื่องการเขียน Dockerfile ให้เร็ว เล็ก และปลอดภัย","keyPoints":["image คือแม่แบบที่อ่านอย่างเดียว ส่วน container คือ instance ที่กำลังรันของ image นั้น (เทียบ class กับ object) สร้างด้วย `docker build -t ชื่อ:tag .` และรันด้วย `docker run`","Docker สร้าง image เป็น layer ตามลำดับคำสั่ง แล้ว cache ทีละ layer: ถ้า layer ใดเปลี่ยน layer ถัดจากนั้นทุกชั้นต้องสร้างใหม่ จึงควร `COPY package*.json` แล้ว `RUN npm ci` ก่อน แล้วค่อย `COPY . .` เพื่อให้ชั้น dependencies ถูกใช้ซ้ำเมื่อแก้แค่ซอร์สโค้ด","`.dockerignore` ตัดไฟล์ออกจาก build context เช่น `node_modules`, `.git`, `.env` ทำให้ context เล็กลง build เร็วขึ้น และ secret ไม่หลุดเข้า image แต่ห้ามตัดไฟล์ที่ขั้นตอน build ต้องใช้","multi-stage build ใช้หลาย `FROM` เช่น `FROM node:20 AS build` แล้วใน stage สุดท้าย `COPY --from=build /app/dist ./dist` เก็บเฉพาะของที่ใช้รัน ทำให้ image เล็กลงและมีพื้นที่โจมตีน้อยลง (การ `RUN rm` ใน layer หลังไม่ทำให้ layer ก่อนหน้าเล็กลง)","ระบุเวอร์ชันของ base image ให้ชัด (เช่น `node:20-slim`) แทน `latest` และใช้ `USER` ที่ไม่ใช่ root เพื่อให้ build ซ้ำได้และลดความเสี่ยง","`EXPOSE` เป็นเพียงเอกสารบอกว่าแอปฟังพอร์ตใด ไม่ได้เปิดพอร์ตให้ภายนอก ต้องใช้ `-p โฮสต์:container` ตอน `docker run` (หรือ `ports:` ใน Compose)","`CMD` กำหนดคำสั่งเริ่มต้นที่ถูกแทนที่ได้ตอน `docker run` ส่วน `ENTRYPOINT` กำหนดโปรแกรมหลักที่ตายตัวกว่า และรูปแบบ exec (`[\"node\", \"server.js\"]`) ทำให้ process รับ signal ได้ตรง","container ไม่ใช่ VM: ใช้ kernel เดียวกับโฮสต์ จึงเบาและเริ่มเร็วกว่า แต่การแยกขอบเขตอ่อนกว่า VM ที่จำลองทั้งเครื่องรวม kernel","tag แบบ `latest` เป็นแค่ชื่อ tag ที่ถูกเขียนทับได้ ไม่บอกว่าเป็นโค้ดเวอร์ชันใด ใน production ควรใช้ tag ที่ไม่ซ้ำ เช่น เลขเวอร์ชันหรือ commit SHA เพื่อให้ติดตามและ rollback ได้","Docker Compose นิยามหลาย service (เช่น api, PostgreSQL, Redis) ในไฟล์ YAML เดียวและรันด้วย `docker compose up -d` ช่วยให้ทุกคนในทีมมีสภาพแวดล้อมพัฒนาเดียวกัน ส่วน bind mount (`./src:/app/src`) ใช้ตอนพัฒนาเพื่อแก้โค้ดแล้วเห็นผลทันที"],"examFocus":["ถ้าเจอ build ช้าเพราะติดตั้ง dependencies ใหม่ทุกครั้งที่แก้โค้ด ให้ดูลำดับคำสั่ง COPY/RUN และแยกไฟล์ที่ระบุ dependencies ขึ้นมาก่อน","ถ้าเจอ image ใหญ่เพราะมี compiler และ devDependencies ติดมา ให้เลือก multi-stage build","ถ้าเจอโจทย์ให้เลือก .dockerignore ให้ตัดสิ่งที่ image สร้างเองได้และสิ่งที่เป็นความลับ แต่ไม่ตัดไฟล์ที่ build ต้องใช้","ถ้าเจอโจทย์ให้ทีมรัน backend และฐานข้อมูลในเครื่องพัฒนาให้เหมือนกัน ให้ตอบ Docker Compose","ถ้าเจอการ push ขึ้น production ด้วย tag `latest` ให้เปลี่ยนเป็น tag เวอร์ชันหรือ commit SHA","ถ้าเจอโจทย์เปรียบเทียบ container กับ VM ให้เน้นว่าใช้ kernel ร่วมกัน เบากว่าแต่แยกขอบเขตอ่อนกว่า"],"pitfalls":["เข้าใจว่า `EXPOSE` เปิดพอร์ตให้เข้าถึงจากภายนอก ที่จริงต้อง publish พอร์ตด้วย `-p`","เข้าใจว่าลบไฟล์ด้วย `RUN rm` ใน layer ถัดไปจะทำให้ image เล็กลง ที่จริง layer เดิมยังอยู่ในขนาดรวม","ใส่ `COPY . .` ก่อน `RUN npm ci` ทำให้ cache ของ dependencies เสียทุกครั้งที่แก้โค้ด","คิดว่า container มีการแยกขอบเขตเท่ากับ VM เพราะใช้ kernel ร่วมกับโฮสต์"],"example":{"lang":"dockerfile","code":"FROM node:20 AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:20-slim\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY --from=build /app/dist ./dist\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"dist/server.js\"]"}},{"descriptor":"CLD-J1","competency":"Cloud","title":"อ่านแผนภาพและ flow การสื่อสารของบริการ cloud","summary":"การอธิบายว่าบริการ cloud ต่าง ๆ (API gateway, queue, storage, CDN, push) เชื่อมต่อกันอย่างไรในสถาปัตยกรรมของระบบ ข้อสอบมักให้โจทย์ระบบจริงแล้วถามว่าควรวางบริการใดและข้อมูลไหลทางไหน","keyPoints":["API gateway เป็นด่านหน้ารวมการ routing, การตรวจสิทธิ์ (authentication) และ rate limit ไว้ที่เดียว ซ่อนโครงสร้าง backend ภายใน ลดภาระที่ client ต้องรู้จัก service หลายตัว ซึ่งสำคัญกับแอปมือถือที่อัปเดตให้ผู้ใช้ทุกคนทันทีไม่ได้","ไฟล์ขนาดใหญ่ไม่ควรวิ่งผ่าน API server: ให้ API ตรวจสิทธิ์แล้วออก presigned URL (URL ชั่วคราวที่มีอายุจำกัด) ให้ client อัปโหลดตรงไปยัง object storage วิธีนี้แยกการควบคุมออกจากการขนข้อมูล","message queue ช่วยแยกงานช้าหรือไม่เสถียร (เช่น ส่งอีเมล) ออกจากเส้นทางที่ผู้ใช้รออยู่: API บันทึกงานแล้ววางข้อความลงคิว ส่วน worker ประมวลผลแบบ asynchronous และลองใหม่ได้เมื่อล้มเหลว","synchronous คือผู้เรียกต้องรอผลลัพธ์ ส่วน asynchronous คือส่งงานไปแล้วไปทำอย่างอื่นต่อ ถ้าบริการปลายทางล่มช่วงสั้น ๆ แบบ async ผู้ใช้ไม่ต้องเห็น error","CDN แคชเนื้อหาที่ไม่ค่อยเปลี่ยน (รูป ไฟล์ static) ไว้ที่ edge ใกล้ผู้ใช้ ลด latency และลดภาระของ origin ในแผนภาพ CDN จึงอยู่ระหว่างแอปกับ storage หรือเว็บเซิร์ฟเวอร์","push notification ไปมือถือต้องผ่านบริการของแพลตฟอร์ม: iOS ใช้ APNs, Android ใช้ FCM แอปลงทะเบียนเพื่อได้ device token ส่งให้ backend เก็บ แล้ว backend ส่งข้อความพร้อม token ไปที่บริการนั้น และต้องลบ token ที่หมดอายุหรือไม่ถูกต้อง","load balancer กระจายคำขอไปยังหลาย instance ของแอปและตรวจ health ของแต่ละตัว ทำให้ระบบรองรับโหลดและทนต่อ instance ที่ล้ม","การอ่านแผนภาพ: ลูกศรแสดงทิศทางการเรียก/การไหลของข้อมูล ส่วนที่เปิดสู่ internet อยู่ด้านหน้า (CDN, gateway, load balancer) ส่วน database และ worker มักอยู่ด้านหลังโดยไม่เปิดสู่สาธารณะ","object storage เหมาะกับไฟล์ขนาดใหญ่และ static content ส่วน relational database เหมาะกับข้อมูลที่มีโครงสร้างและต้องการ transaction"],"examFocus":["ถ้าเจอโจทย์อัปโหลดไฟล์ใหญ่ที่ทำ API server ช้า ให้ตอบ presigned URL อัปโหลดตรงไป storage","ถ้าเจอบริการรองที่ช้าหรือล่ม (ส่งอีเมล) ลากให้ API หลักช้า ให้ใช้ queue และ worker","ถ้าเจอรูปโหลดช้าสำหรับผู้ใช้ที่อยู่ไกลจาก region ของ storage ให้เพิ่ม CDN","ถ้าเจอแอปมือถือต้องเรียก service หลายตัว ให้ตอบ API gateway เป็น entry point เดียว","ถ้าเจอโจทย์ push แจ้งเตือนมือถือ ให้ลำดับ: แอปลงทะเบียน token, backend เก็บ token, backend ส่งผ่าน APNs/FCM","ถ้าเจอโจทย์วาด flow ให้ระบุว่าอะไรอยู่หน้าด่าน (public) และอะไรอยู่หลัง (private)"],"pitfalls":["ส่งไฟล์ใหญ่ผ่าน API server เพราะคิดว่าปลอดภัยกว่า ทั้งที่ presigned URL ก็ตรวจสิทธิ์ได้และไม่ทำให้ server เป็นคอขวด","เรียกบริการรองแบบ synchronous ในเส้นทางหลัก ทำให้ความช้าหรือความล้มเหลวของบริการนั้นลามถึงผู้ใช้","เข้าใจว่า CDN ใช้กับเนื้อหาที่เปลี่ยนทุกคำขอหรือเฉพาะผู้ใช้ได้ดีเท่ากัน ที่จริงคุ้มที่สุดกับเนื้อหาที่แคชซ้ำได้","ส่ง push จากแอปไปหาแอปโดยตรง ที่จริงต้องผ่านบริการ push ของแพลตฟอร์ม"]},{"descriptor":"CICD-J1","competency":"CI/CD","title":"เขียน pipeline build-deploy อย่างง่าย","summary":"การเขียน pipeline (เช่น YAML ใน Azure DevOps หรือ GitHub Actions) ที่ build และ test อัตโนมัติ แล้ว deploy เมื่อเหมาะสม รวมถึงการจัดการ secret อย่างถูกต้อง","keyPoints":["CI (Continuous Integration) คือ build และ test ทุกครั้งที่มีการเปลี่ยนโค้ด ส่วน CD (Continuous Delivery/Deployment) คือส่งมอบหรือ deploy ผลลัพธ์ที่ผ่านการตรวจแล้วไปยัง environment","โครงสร้าง pipeline YAML ของ Azure DevOps: `trigger` (เมื่อ push), `pool` (agent ที่รัน), `stages` > `jobs` > `steps` ส่วน GitHub Actions ใช้ `on:`, `jobs:`, `steps:`","CI ให้ feedback ก่อน merge: ตั้งให้ build และ test รันตอนเปิด Pull Request ส่วน deploy ควรผูกกับ branch ที่เชื่อถือได้ เช่น `main` ผ่านเงื่อนไข `condition` หรือ trigger ที่แยกกัน","ใน Azure Repos ต้องตั้ง build validation ผ่าน branch policy เพื่อให้ pipeline รันตอน PR ส่วนใน GitHub ใช้ `pull_request` trigger","ค่าลับ (รหัสผ่านฐานข้อมูล, API key, กุญแจเซ็นแอป) ต้องไม่อยู่ใน source code หรือ YAML ให้เก็บใน secret store ของ pipeline เช่น secret variable, variable group หรือเชื่อมกับ Azure Key Vault (GitHub ใช้ `secrets`)","ในการใช้ secret variable ของ Azure DevOps ค่าจะไม่ถูกส่งเป็น environment variable ให้ script โดยอัตโนมัติ ต้อง map เองผ่าน `env:` ของ step และ pipeline จะ mask ค่าในบันทึก log","ข้อมูลที่เปิดเผยได้ เช่น bundle ID หรือชื่อ environment เก็บเป็น variable ธรรมดาได้ ส่วนสิ่งที่ให้อำนาจ เช่น กุญแจเซ็นแอปมือถือและ credential ของ store ต้องอยู่ใน secret store","pipeline ควรเริ่มจากง่าย: checkout, ติดตั้ง dependencies, build, test, publish artifact แล้วค่อยเพิ่ม deploy"],"examFocus":["ถ้าเจอโจทย์ให้ทุก PR ไป main ถูก build และ test แต่ deploy เฉพาะเมื่อ merge เข้า main ให้แยกด้วย trigger และ condition ของขั้นตอน deploy","ถ้าเจอรหัสผ่านที่ต้องส่งให้ขั้นตอน deploy ให้เก็บใน secret variable หรือ Key Vault ไม่ใส่ใน YAML","ถ้าเจอ pipeline ที่ build แอปมือถือและต้องเซ็น ให้เก็บ keystore/certificate และรหัสใน secure files หรือ secret ของ pipeline","ถ้าเจอคำถามว่าอะไรควรเป็น secret ให้แยกระหว่างข้อมูลที่ให้อำนาจ (secret) กับข้อมูลที่ไม่ลับ (variable ธรรมดา)"],"pitfalls":["ใส่รหัสผ่านใน YAML แล้วอาศัยว่า repository เป็น private ซึ่งยังรั่วผ่านประวัติ Git และผู้ที่มีสิทธิ์อ่านทุกคน","ให้ทุก branch deploy ไปยัง production เพราะไม่ได้ตั้งเงื่อนไขของขั้นตอน deploy","คิดว่าทุกค่าต้องเป็น secret ทำให้จัดการยากเกินจำเป็น เช่น bundle ID ไม่ใช่ความลับ"],"example":{"lang":"yaml","code":"trigger:\n  branches:\n    include: [main]\n\npool:\n  vmImage: ubuntu-latest\n\nstages:\n- stage: Build\n  jobs:\n  - job: BuildTest\n    steps:\n    - script: npm ci && npm run build && npm test\n- stage: Deploy\n  dependsOn: Build\n  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))\n  jobs:\n  - job: DeployStaging\n    steps:\n    - script: ./deploy.sh\n      env:\n        DB_PASSWORD: $(dbPassword)"}},{"descriptor":"CTR-J2","competency":"Container","title":"แก้ปัญหา container เบื้องต้น","summary":"การสืบหาสาเหตุเมื่อ container ไม่ทำงานตามที่คาด ตั้งแต่ log, exit code, port, network ไปจนถึงข้อมูลที่หายไป ข้อสอบมักให้อาการแล้วถามสาเหตุหรือคำสั่งที่ใช้ตรวจ","keyPoints":["ลำดับสืบเบื้องต้น: `docker ps -a` ดูสถานะ, `docker logs <container>` อ่าน log (`-f` ติดตาม, `--tail N` ดูท้าย), `docker inspect <container>` ดูค่าที่ตั้งจริงและสถานะ, `docker exec -it <container> sh` เข้าไปดูภายใน ควรทำก่อนลบหรือเปลี่ยนอะไร","exit code 137 = 128 + 9 คือ process ถูกฆ่าด้วย SIGKILL มักเกิดจากเกินขีดจำกัดหน่วยความจำ (OOM kill) ให้ดู `docker inspect` ที่ `State.OOMKilled` และเพิ่ม limit หรือลดการใช้หน่วยความจำของแอป ส่วน 143 = SIGTERM (ถูกสั่งหยุดตามปกติ)","container หยุดทันทีหลังเริ่มเมื่อ process หลัก (PID 1) จบหรือ crash เสมอ ต้องดู log และ exit code ว่าจบเพราะอะไร","แอปที่ฟังที่ `localhost`/`127.0.0.1` ภายใน container จะไม่รับ traffic ที่ map มาจากโฮสต์ แม้ใช้ `-p 3000:3000` ต้องให้แอป bind ที่ `0.0.0.0`","error `port is already allocated` แปลว่าพอร์ตฝั่งโฮสต์ถูกใช้อยู่แล้ว (อาจเป็น container เก่าที่ยังรัน หรือโปรแกรมอื่น) ให้หาผู้ใช้พอร์ตก่อนแล้วหยุด หรือเปลี่ยนพอร์ตฝั่งโฮสต์ (`-p 8081:80`)","ใน Docker Compose ทุก service อยู่ network เดียวกันโดยค่าเริ่มต้นและ resolve ชื่อ service เป็น DNS ได้ ดังนั้น api เชื่อมฐานข้อมูลด้วยชื่อ service เช่น `postgres` ไม่ใช่ `localhost` (ซึ่งหมายถึงตัว container เอง)","ระบบไฟล์ที่เขียนได้ของ container อยู่ได้เท่าอายุ container: เมื่อ `docker rm` ข้อมูลหาย ข้อมูลที่ต้องอยู่ต่อควรเก็บใน volume (`-v ชื่อ:/path`) หรือ object storage/database ภายนอก","คำสั่ง `COPY` อ้างได้เฉพาะไฟล์ใน build context (โฟลเดอร์ท้ายคำสั่ง `docker build`) ไม่ใช่ path ภายนอก เช่น `../shared` ถ้าต้องใช้ ให้เลื่อน context ขึ้นไปที่ root แล้วชี้ Dockerfile ด้วย `-f`","`docker stats` ดูการใช้ CPU/หน่วยความจำแบบ real time ส่วน `docker compose logs <service>` ดู log ของ service ใน Compose"],"examFocus":["ถ้าเจอ container ออกด้วย Exited (137) และ log ว่างเปล่า ให้สงสัย OOM kill แล้วตรวจ `docker inspect`","ถ้าเจอ `docker run -p` แล้วเปิดจากเบราว์เซอร์ไม่ได้ทั้งที่ container รัน ให้ตรวจว่าแอป bind 0.0.0.0 หรือไม่","ถ้าเจอ API เชื่อมฐานข้อมูลไม่ได้ใน Compose ให้ใช้ชื่อ service แทน localhost","ถ้าเจอข้อมูลที่อัปโหลดหายหลังสร้าง container ใหม่ ให้ใช้ volume หรือบริการภายนอก","ถ้าเจอ COPY หาไฟล์ไม่เจอใน monorepo ให้คิดเรื่อง build context","ถ้าเจอ port is already allocated ให้หาผู้ใช้พอร์ตก่อน ไม่ใช่ลบทุกอย่าง"],"pitfalls":["ใช้ `docker system prune` หรือลบทุก container ทันทีเพื่อแก้ปัญหา ซึ่งทำลายหลักฐานและข้อมูล ควรอ่าน log และ inspect ก่อน","เข้าใจว่า `-p` ทำให้แอปรับ traffic ได้ทุกกรณี ทั้งที่ต้อง bind 0.0.0.0 ด้วย","ใช้ `localhost` เชื่อมไปยัง service อื่นใน Compose","เก็บข้อมูลสำคัญไว้ในระบบไฟล์ของ container โดยไม่ mount volume"],"example":{"lang":"bash","code":"docker ps -a\ndocker logs --tail 100 api\ndocker inspect api --format '{{.State.ExitCode}} {{.State.OOMKilled}}'\ndocker exec -it api sh"}},{"descriptor":"CLD-J2","competency":"Cloud","title":"Managed service และรูปแบบราคา cloud","summary":"การแยกบริการ managed ออกจากแบบดูแลเอง และเลือกรูปแบบราคาให้ตรงกับรูปแบบการใช้งานจริง เพื่อไม่จ่ายเกินจำเป็น ข้อสอบมักให้คำนวณจุดคุ้มทุนหรือเลือกรูปแบบที่เหมาะ","keyPoints":["managed service คือผู้ให้บริการดูแลโครงสร้างพื้นฐานให้ (patch, backup, failover) แลกกับราคาที่สูงกว่าและสิทธิ์ปรับแต่งที่จำกัด ส่วนแบบติดตั้งเองบน VM ควบคุมได้เต็มที่แต่ทีมต้องรับภาระดูแลเอง","on-demand (pay-as-you-go) จ่ายตามที่ใช้จริง ยืดหยุ่นแต่ราคาต่อหน่วยสูงสุด เหมาะกับโหลดที่ไม่แน่นอนหรือใช้ไม่ต่อเนื่อง","reserved/commitment (เช่น ผูกสัญญา 1 หรือ 3 ปี) ได้ราคาต่อหน่วยถูกลงแลกกับการจ่ายครบตามที่ผูกไว้ แม้ไม่ได้ใช้ จึงคุ้มกับโหลดที่เปิดตลอดและสม่ำเสมอ เช่น ฐานข้อมูล production","spot/preemptible ถูกมากแต่ผู้ให้บริการเรียกคืนเครื่องได้ จึงเหมาะกับงานที่หยุดแล้วทำต่อได้ ไม่เหมาะกับระบบที่ต้องพร้อมตลอด","serverless (เช่น ฟังก์ชัน) คิดตามจำนวนการเรียกและเวลาประมวลผล ไม่เสียเงินตอนไม่มีคำขอ เหมาะกับโหลดน้อยหรือไม่สม่ำเสมอ แต่ถ้าโหลดสูงและสม่ำเสมอ ราคาคงที่ของ VM อาจถูกกว่า","จุดคุ้มทุน (break-even) คำนวณจาก ค่าคงที่ต่อเดือน หารด้วย ราคาต่อหน่วยของแบบจ่ายตามใช้ เช่น ถ้า VM เดือนละ 1,000 บาท และ serverless คิด 0.40 บาทต่อพันคำขอ จุดคุ้มทุนคือ 2.5 ล้านคำขอต่อเดือน (ตัวเลขเพื่อสาธิตวิธีคำนวณ)","ค่าใช้จ่ายแฝงที่มักถูกลืม: ค่าข้อมูลขาออก (egress) ออกจาก cloud ซึ่งมักคิดเงิน ส่วนข้อมูลขาเข้ามักฟรี, พื้นที่ snapshot และ backup ที่สะสม, ค่า log/monitoring, IP ที่จองไว้เฉยๆ","right-sizing คือปรับขนาดทรัพยากรให้ตรงการใช้จริง ถ้า CPU เฉลี่ย 8% มาตลอด ควรลดขนาดก่อนแล้วค่อยพิจารณา commitment กับขนาดใหม่ ไม่ใช่ซื้อส่วนลดกับขนาดที่ใหญ่เกิน","ตั้ง budget และ alert และติด tag ให้ทรัพยากรเพื่อดูว่าค่าใช้จ่ายเป็นของทีมหรือโปรเจกต์ใด"],"examFocus":["ถ้าเจอทีมเล็กเลือกระหว่างติดตั้งฐานข้อมูลเองกับ managed ให้ชั่งภาระดูแลและเวลาของทีมเทียบกับราคาที่สูงขึ้น","ถ้าเจอโจทย์ให้คำนวณว่าเลือก serverless หรือ VM ให้คำนวณจากปริมาณใช้จริงและหาจุดคุ้มทุน","ถ้าเจอฐานข้อมูล production เปิด 24/7 และ dev ใช้เฉพาะเวลาทำงาน ให้ reserved กับ production และ on-demand (หรือปิดตามเวลา) กับ dev","ถ้าเจอบิลสูงกว่าที่ประเมิน ให้ตรวจ egress, snapshot, log นอกเหนือจาก compute","ถ้าเจอ VM ที่ใช้ CPU ต่ำมาก ให้ right-size ก่อนซื้อ commitment"],"pitfalls":["เลือกรูปแบบราคาที่ถูกที่สุดต่อหน่วยโดยไม่ดูรูปแบบการใช้จริง เช่น ซื้อ reserved กับงานที่ใช้ไม่กี่ชั่วโมงต่อเดือน","ประเมินค่าใช้จ่ายจาก VM และฐานข้อมูลอย่างเดียว ลืม egress, snapshot และ log","เข้าใจว่า managed service ถูกกว่าเสมอ ที่จริงจ่ายเพื่อแลกกับงานดูแลที่ลดลง","ซื้อส่วนลดก่อนปรับขนาดที่เหมาะสม ทำให้ผูกสัญญากับทรัพยากรที่ใหญ่เกินไป"]},{"descriptor":"CLD-J3","competency":"Cloud","title":"IAM, encryption, SLA และ compliance พื้นฐาน","summary":"การใช้แนวปฏิบัติด้านความปลอดภัยบน cloud (สิทธิ์ที่จำเป็นเท่านั้น, เข้ารหัส, audit) และเข้าใจ SLA เพื่อให้ระบบสอดคล้องกับข้อกำหนด เช่น PDPA","keyPoints":["least privilege คือให้เฉพาะสิทธิ์ที่จำเป็นต่อหน้าที่ เช่น แอปที่อ่านรูปจาก bucket เดียวควรได้สิทธิ์อ่าน (read-only) เฉพาะ bucket นั้น ไม่ใช่สิทธิ์ทั้ง account หรือเขียน/ลบ","ให้แอปที่รันบน cloud ใช้ role ที่ผูกกับ resource (เช่น IAM role ของ VM, managed identity) ซึ่งได้ credential ชั่วคราวอัตโนมัติ แทน access key ถาวรที่ฝังในโค้ดหรือ config","อย่าใช้ root account/บัญชีเจ้าของสำหรับงานประจำวัน เปิด MFA ให้ผู้ใช้ และตรวจทบทวนสิทธิ์เป็นระยะ","encryption at rest เข้ารหัสข้อมูลที่เก็บ (disk, object storage, database) มักใช้บริการจัดการกุญแจ (KMS/Key Vault) ส่วน encryption in transit ใช้ TLS ตอนส่งข้อมูล ควรเปิดทั้งสองอย่าง","audit log (เช่น บันทึกกิจกรรมของ account) ใช้ตรวจย้อนหลังว่าใครทำอะไร ซึ่งเป็นหลักฐานสำหรับ compliance","shared responsibility model: ผู้ให้บริการรับผิดชอบโครงสร้างพื้นฐาน (และส่วนที่ managed ให้) ส่วนลูกค้ารับผิดชอบข้อมูล สิทธิ์การเข้าถึง และการตั้งค่า network ของตน แม้ใช้ managed database ก็ยังต้องจัดการสิทธิ์และการตั้งค่าเอง","SLA คือคำสัญญาด้านความพร้อมใช้งาน (availability) เช่น 99.9% ต่อเดือนที่ 30 วัน (43,200 นาที) ยอมล่มได้ราว 43.2 นาที ส่วน 99.99% ยอมล่มได้ราว 4.3 นาที ค่าชดเชยมักเป็นเครดิตบริการ ไม่ใช่การรับประกันว่าจะไม่ล่ม","เมื่อระบบต้องพึ่งหลายบริการที่ต้องใช้ครบพร้อมกัน (ต่อแบบอนุกรม) ความพร้อมรวมคือผลคูณของแต่ละตัว จึงต่ำกว่าตัวที่ต่ำที่สุด เช่น 99.9% คูณ 99.9% ได้ราว 99.8%","PDPA (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562) ต้องมีมาตรการรักษาความมั่นคงปลอดภัยของข้อมูลส่วนบุคคล เช่น เข้ารหัส ควบคุมสิทธิ์ และเก็บ audit log การเก็บข้อมูลส่วนบุคคลใน bucket ที่เปิดสาธารณะไม่สอดคล้องกับหลักการนี้"],"examFocus":["ถ้าเจอแอปที่ต้องเข้าถึง storage เดียว ให้เลือก role ที่จำกัดสิทธิ์เฉพาะ resource นั้น ไม่ใช่ key ถาวรหรือสิทธิ์ admin","ถ้าเจอฝ่ายขายอยากเสนอ SLA สูง ให้ตรวจ SLA ของบริการที่พึ่งพาและคำนวณความพร้อมรวมก่อน","ถ้าเจอโจทย์แปลง SLA เป็นเวลาล่มที่ยอมได้ ให้คูณจำนวนนาทีของช่วงเวลาตามสัญญากับ (1 − availability)","ถ้าเจอโจทย์ข้อมูลส่วนบุคคลของลูกค้า ให้เลือกคำตอบที่มีทั้งเข้ารหัส สิทธิ์แบบ least privilege และ audit log","ถ้าเจอ shared responsibility กับ managed database ให้ตอบว่าลูกค้ายังรับผิดชอบข้อมูล สิทธิ์ และ network"],"pitfalls":["ฝัง access key ถาวรในโค้ดหรือ repository เพราะสะดวก","คิดว่า managed service ทำให้ผู้ให้บริการรับผิดชอบความปลอดภัยของข้อมูลและสิทธิ์ทั้งหมด","บวกหรือเฉลี่ย SLA ของบริการที่ต่อแบบอนุกรม แทนที่จะคูณ","เปิดสิทธิ์กว้างไว้ก่อนแล้วค่อยลดทีหลังโดยไม่ได้ทบทวน"]},{"descriptor":"CICD-J3","competency":"CI/CD","title":"ติดตามและแก้ pipeline ที่ล้มเหลว","summary":"การอ่านผลการรัน pipeline หาสาเหตุเมื่อ build หรือ test ล้ม และแยกความต่างระหว่างปัญหาของโค้ดกับปัญหาของสภาพแวดล้อม","keyPoints":["วิธีอ่าน log ที่ล้ม: หาบรรทัด error แรกสุดของขั้นตอนที่ล้ม (error ถัดๆ มักเป็นผลตามมา) แล้วดู exit code ของคำสั่ง","pipeline เป็นสีเขียวหมายถึงทุกขั้นตอนคืน exit code 0 ไม่ได้แปลว่า test ผ่านเสมอ ให้ตรวจว่ามี `|| true`, `continueOnError` (Azure DevOps) หรือ `continue-on-error` (GitHub Actions) หรือ pipe ที่กลบ exit code ของคำสั่ง test หรือไม่","ใน shell script ใช้ `set -e` และ `set -o pipefail` เพื่อให้ script หยุดเมื่อมีคำสั่งล้มแม้อยู่ในท่อ pipe","ปัญหา pass ในเครื่องแต่ล้มใน CI มักมาจากความต่างของ environment: ระบบไฟล์ที่แยกตัวพิมพ์ใหญ่เล็ก (Linux แยก ส่วน macOS/Windows โดยปกติไม่แยก) จึง `import './User'` ผ่านบน Mac แต่ไม่เจอไฟล์ `user.js` บน agent Linux","ความต่างอื่นที่พบบ่อย: เวอร์ชัน runtime/เครื่องมือ (Node, JDK), ตัวแปร environment ที่ไม่ได้ตั้งใน pipeline, ไฟล์ที่ไม่ได้ commit, ลำดับการติดตั้ง dependencies","test ที่ขึ้นกับ timezone หรือเวลาท้องถิ่นของเครื่อง (`getHours`, `toLocaleString` แบบไม่ระบุ timezone) ให้ผลต่างกันตามเครื่องที่รัน แก้โดยระบุ timezone ให้ชัดหรือฉีดเวลาเข้าไปในฟังก์ชัน (inject clock)","เผยแพร่ผล test เป็นรายงาน (เช่น task publish test results) เพื่อดูว่า test ใดล้มโดยไม่ต้องไล่ log ทั้งหมด","test ที่ล้มสุ่มโดยโค้ดไม่เปลี่ยน (flaky) ต้องหาสาเหตุ ไม่ใช่กด re-run จนผ่าน"],"examFocus":["ถ้าเจอ pipeline เขียวแต่รายงาน test มี fail ให้ตรวจว่ามีการกลบ exit code หรือ continue on error หรือไม่","ถ้าเจอผ่านบนเครื่องแต่ล้มบน agent ให้เปรียบเทียบ environment: ชื่อไฟล์ตัวพิมพ์ใหญ่เล็ก, timezone, เวอร์ชัน, env var","ถ้าเจอ error หลายบรรทัด ให้เริ่มจากบรรทัดแรกที่ผิด","ถ้าเจอ test เวลาทำการที่ล้มเฉพาะใน CI ให้ระบุ timezone ในโค้ดหรือ test"],"pitfalls":["ปิดการล้มของขั้นตอน test (`|| true`) เพื่อให้ pipeline เขียว ซึ่งซ่อนปัญหาจริง","แก้ด้วยการ re-run จนผ่านโดยไม่หาสาเหตุ","คิดว่าเครื่องนักพัฒนากับ agent เหมือนกัน จึงไม่ตรวจความต่างของ environment"]},{"descriptor":"CICD-J2","competency":"CI/CD","title":"สคริปต์ compile, test, package ใน pipeline","summary":"การเขียนและดูแลสคริปต์ขั้นตอน build ให้รันซ้ำได้ผลเหมือนเดิม ตั้งแต่ติดตั้ง dependencies, test, package จนถึง cache และการเลื่อน artifact ไป environment ต่างๆ","keyPoints":["ใน pipeline ใช้ `npm ci` แทน `npm install`: `npm ci` ติดตั้งตามเวอร์ชันใน lockfile อย่างเคร่งครัด ลบ `node_modules` เดิมก่อน และไม่แก้ lockfile ส่วน `npm install` อาจเลือกเวอร์ชันใหม่ตามช่วงใน `package.json` ทำให้ build ไม่ซ้ำ","ลำดับพื้นฐานของสคริปต์: ติดตั้ง dependencies, compile/build, test, package แล้วเผยแพร่ artifact (เช่น `npm pack`, build image, zip) สคริปต์ควรหยุดทันทีเมื่อขั้นตอนใดล้ม","build once, deploy many: สร้าง artifact ครั้งเดียวแล้ว promote ไปแต่ละ environment โดยแยกเฉพาะ configuration ไม่ build ใหม่ในแต่ละ environment เพราะสิ่งที่ทดสอบอาจไม่ตรงกับสิ่งที่ deploy","cache เร่ง pipeline ได้: ติดตั้ง dependencies 4 นาทีทุกครั้งควร cache โฟลเดอร์ package โดยให้ cache key ผูกกับ hash ของ lockfile เมื่อ lockfile เปลี่ยน key เปลี่ยนและสร้าง cache ใหม่ เมื่อไม่เปลี่ยนใช้ cache เดิม","publish artifact ด้วย task ของ pipeline (Azure DevOps: publish pipeline artifact, GitHub: `actions/upload-artifact`) เพื่อส่งต่อให้ job/stage ถัดไป","หมายเลข build ของแอปมือถือต้องไม่ซ้ำและเพิ่มขึ้นทุกครั้งที่อัปโหลด: Android ใช้ `versionCode` (จำนวนเต็ม), iOS ใช้ build number (`CFBundleVersion`) ให้ pipeline กำหนดจากตัวนับ เช่น `Build.BuildId` ส่วน version name ที่ผู้ใช้เห็น (เช่น 2.4.0) เป็นเรื่องของทีมผลิตภัณฑ์","ใช้ semantic versioning (MAJOR.MINOR.PATCH) สำหรับเวอร์ชันของ release และผูก artifact กับ commit เพื่อย้อนรอยได้","สคริปต์ควรเขียนให้รันซ้ำได้ (ไม่พึ่งสถานะที่ค้างจากการรันครั้งก่อน) และดึงค่าที่ต่างตาม environment จากตัวแปร ไม่ฝังตายตัว"],"examFocus":["ถ้าเจอ build ที่ผ่านบนเครื่องนักพัฒนาแต่ล้มบางครั้งใน pipeline เพราะ dependencies เวอร์ชันเปลี่ยน ให้ใช้ `npm ci` กับ lockfile","ถ้าเจอ job deploy แต่ละ environment build ซอร์สเอง ให้เปลี่ยนเป็น build ครั้งเดียวแล้ว promote artifact","ถ้าเจอ cache ที่ไม่ได้ผลหรือได้ของเก่า ให้ตรวจ key ว่าผูกกับ lockfile หรือไม่","ถ้าเจอการอัปโหลดแอปมือถือถูกปฏิเสธเพราะ build ซ้ำ ให้ pipeline เพิ่มหมายเลข build อัตโนมัติ"],"pitfalls":["ใช้ `npm install` ใน pipeline แล้ว build ได้ผลไม่คงที่","build ใหม่ใน production job ทำให้ artifact ที่ deploy ไม่ใช่ตัวที่ทดสอบแล้ว","ตั้ง cache key เป็นค่าคงที่ ทำให้ได้ cache เก่าแม้ dependencies เปลี่ยน","ให้คนแก้หมายเลข build ด้วยมือก่อนทุก release จนลืมหรือซ้ำ"],"example":{"lang":"yaml","code":"steps:\n- task: Cache@2\n  inputs:\n    key: 'npm | \"$(Agent.OS)\" | package-lock.json'\n    path: $(Pipeline.Workspace)/.npm\n- script: npm ci --cache $(Pipeline.Workspace)/.npm\n- script: npm run build\n- script: npm test\n- publish: dist\n  artifact: app"}}],"senior":[{"descriptor":"CTR-S1","competency":"Container","title":"Container networking และ storage ขั้นสูง","summary":"การออกแบบ network และการเก็บข้อมูลของ container ให้แยกขอบเขตถูกต้อง ข้อมูลไม่หาย และทำงานได้กับหลาย replica บน Kubernetes โดยเข้าใจข้อจำกัดของแต่ละชนิด","keyPoints":["Docker network driver หลัก: `bridge` (ค่าเริ่มต้นบนเครื่องเดียว), `host` (ใช้ network ของโฮสต์ตรง ไม่มีการแยก), `none` (ไม่มี network), `overlay` (เชื่อมหลายโฮสต์ใน Swarm) บน user-defined bridge, container resolve ชื่อกันได้ด้วย DNS ของ Docker","แยก network ให้ตรงเส้นทางสื่อสารที่ต้องการ: ใน Compose ให้ web กับ api อยู่ network หนึ่ง และ api กับ db อยู่อีก network หนึ่ง เพื่อให้ web คุยกับ db ตรงไม่ได้ ใครอยู่ network เดียวกันจึงคุยกันได้ และชื่อ service ถูก resolve เฉพาะใน network ที่ร่วมกัน","network ที่ตั้ง `internal: true` ใน Compose จะไม่มีทางออกสู่ภายนอก เหมาะกับชั้นฐานข้อมูล ส่วนพอร์ตที่ publish (`ports:`) เปิดเฉพาะ service ที่ต้องรับผู้ใช้ภายนอก","ชนิดการเก็บข้อมูล: named volume (Docker จัดการ), bind mount (ผูกโฟลเดอร์ของโฮสต์ เหมาะกับตอนพัฒนา), tmpfs (อยู่ในหน่วยความจำ ไม่คงอยู่) volume แก้เรื่องอายุของ container แต่ไม่ใช่ backup: ถ้าดิสก์ของ VM เสียหรือมีคนลบข้อมูลผิด volume ก็หายไปด้วย จึงต้องมี backup นอกเครื่องและทดสอบ restore ตาม RPO/RTO","Kubernetes: `PersistentVolumeClaim` (PVC) ขอพื้นที่, `StorageClass` กำหนดชนิดและการ provision แบบ dynamic, `reclaimPolicy` (`Delete` หรือ `Retain`) กำหนดชะตาของข้อมูลเมื่อลบ claim","access mode ของ PVC: `ReadWriteOnce` (mount แบบอ่านเขียนได้จาก node เดียว), `ReadOnlyMany`, `ReadWriteMany` (หลาย node) และ `ReadWriteOncePod` (pod เดียว) ไม่ใช่ทุก storage backend รองรับทุกโหมด","Deployment 3 replica ที่ใช้ PVC เดียวกัน ต้องถามก่อนว่าข้อมูลเป็นของแต่ละ replica หรือใช้ร่วมกัน: ถ้าเป็นของแต่ละตัว (เช่น ฐานข้อมูล) ใช้ `StatefulSet` กับ `volumeClaimTemplates` ให้ได้ volume ต่อ replica ถ้าใช้ร่วมกันจริงต้องใช้ storage ที่รองรับ `ReadWriteMany` หรือย้ายไปเก็บใน object storage","Kubernetes `Service` แบบ ClusterIP กระจายทราฟฟิกระดับการเชื่อมต่อ (L4) gRPC บน HTTP/2 ส่งหลายคำขอผ่านการเชื่อมต่อเดียวที่เปิดค้างไว้ จึงทำให้ replica บางตัวรับโหลดหนักกว่าเพราะ client ติดอยู่กับ replica เดิม แก้ด้วย load balancing ระดับ L7 (proxy เช่น Envoy หรือ service mesh) หรือ client-side load balancing กับ headless service","ปลายทางที่ควบคุมด้วย IP allowlist (เช่น ฐานข้อมูลของพันธมิตร) ขณะที่ pod เปลี่ยน IP ตลอด: ให้ทราฟฟิกขาออกผ่านจุดเดียวที่มี IP คงที่ เช่น NAT gateway หรือ egress gateway แล้วอนุญาตเฉพาะ IP นั้น","`NetworkPolicy` ใน Kubernetes จำกัดว่า pod ใดคุยกับ pod ใดได้ (ต้องมี network plugin ที่รองรับ) ค่าเริ่มต้นคือ pod คุยกันได้ทั้งหมด"],"examFocus":["ถ้าเจอโจทย์ให้ผู้ใช้ภายนอกเข้าถึงเฉพาะ web แต่ db ห้ามเข้าถึงตรง ให้แยก network ตามชั้นและไม่ publish พอร์ตของ db","ถ้าเจอฐานข้อมูล container เดียวที่ข้อมูลเคยหาย ให้ตอบ volume พร้อม backup นอกเครื่อง ไม่ใช่ volume อย่างเดียว","ถ้าเจอหลาย replica ใช้ PVC โหมด ReadWriteOnce ร่วมกันแล้ว pod ค้าง ให้ถามว่าข้อมูลเป็นของแต่ละตัวหรือร่วมกัน แล้วเลือก StatefulSet หรือ storage แบบ RWX/object storage","ถ้าเจอ gRPC ที่โหลดไม่กระจายทั้งที่มีหลาย replica หลัง ClusterIP ให้คิดเรื่อง L4 กับ long-lived connection แล้วเลือก L7 หรือ client-side balancing","ถ้าเจอปลายทางจำกัดด้วย IP แต่ต้นทางเป็น cluster ที่ IP เปลี่ยน ให้ใช้ egress ที่มี IP คงที่"],"pitfalls":["เข้าใจว่า volume คือ backup ที่ทำให้ปลอดภัยแล้ว","เพิ่มจำนวน replica เพื่อให้ gRPC กระจายโหลด ทั้งที่การเชื่อมต่อยาวทำให้โหลดยังเอียง","ตั้ง PVC เป็น RWX โดยไม่ตรวจว่า storage backend รองรับหรือไม่ แล้วใช้กับฐานข้อมูลที่ไม่ได้ออกแบบให้หลายตัวเขียนไฟล์เดียวกัน","เปิด IP range กว้างทั้ง cluster ให้ปลายทางแทนการบีบผ่านจุดเดียว"],"example":{"lang":"yaml","code":"services:\n  web:\n    networks: [front]\n    ports: [\"443:443\"]\n  api:\n    networks: [front, back]\n  db:\n    networks: [back]\n    volumes: [dbdata:/var/lib/postgresql/data]\nnetworks:\n  front: {}\n  back:\n    internal: true\nvolumes:\n  dbdata: {}"}},{"descriptor":"CTR-S2","competency":"Container","title":"นำการย้ายระบบเข้า container (migration)","summary":"การวางแผนและนำโครงการย้ายหลายระบบจาก VM ไปเป็น container ให้เสี่ยงต่ำ มีลำดับ มีการพิสูจน์ผล และมีทางกลับ ข้อสอบเน้นการตัดสินใจและลำดับการย้ายมากกว่าคำสั่ง","keyPoints":["ย้ายเป็นคลื่น (wave): คลื่นแรกเลือกระบบความเสี่ยงต่ำเพื่อสร้างและพิสูจน์แพลตฟอร์มและกระบวนการ คลื่นถัดไปค่อยขยับไปสู่ระบบสำคัญและระบบที่มี state และเก็บทางย้อนกลับไว้ทุกคลื่น ไม่ใช่ย้ายทุกระบบพร้อมกันภายใน big bang","ก่อนรันหลาย replica ต้องทำให้แอป stateless: ย้าย session ออกจากหน่วยความจำของ process ไปไว้ใน shared store (เช่น Redis), ย้ายไฟล์ที่ผู้ใช้อัปโหลดจากดิสก์เครื่องไปเก็บใน object storage, และย้ายงานตั้งเวลาใน process ไปเป็น job แยก (เช่น Kubernetes CronJob) ไม่ให้ทุก replica รันซ้ำ","หลัก twelve-factor ที่เกี่ยวข้อง: config ผ่าน environment variable, log เขียนที่ stdout/stderr, process stateless, graceful shutdown เมื่อได้ SIGTERM","กำหนด `readiness probe` (พร้อมรับ traffic หรือยัง) และ `liveness probe` (ยังทำงานอยู่หรือไม่) และ resource requests/limits ให้เหมาะสมก่อนขึ้น production","งานที่ผลลัพธ์เป็นตัวเงินหรือผิดแล้วย้อนยาก (เช่น คำนวณคอมมิชชัน) ควรย้ายแบบ parallel run: ระบบใหม่คำนวณจากข้อมูลจริงชุดเดียวกันแต่ยังไม่เขียนผล แล้วเทียบกับระบบเดิม และเก็บระบบเดิมไว้เป็นทางกลับจนมั่นใจ","ไม่จำเป็นต้องย้ายทุกอย่างพร้อมกัน: ชั้น stateless ได้ประโยชน์จาก container ทันทีและเสี่ยงต่ำ ส่วนฐานข้อมูล production ที่มี RPO และ RTO เข้มงวดควรอยู่กับบริการ managed ที่มี HA และ backup ครบ หรือย้ายภายหลังเมื่อทีมพร้อม","zero-downtime cutover ต้องแก้สองเรื่อง คือข้อมูลและทราฟฟิก: ฝั่งข้อมูลให้ schema เข้ากันได้ทั้งสองเวอร์ชัน (แบบ expand ก่อน แล้ว contract ทีหลัง) ฝั่งทราฟฟิกย้ายทีละส่วน (weighted routing/canary) พร้อมตัวชี้วัดและทางกลับ","strangler pattern: ค่อย ๆ ย้ายฟังก์ชันหรือเส้นทางทีละส่วนไปบริการใหม่ ขณะที่ระบบเดิมยังรับส่วนที่เหลือ ลดความเสี่ยงเมื่อเทียบกับการเขียนใหม่ทั้งหมด","ตั้งเกณฑ์ผ่านของแต่ละขั้น (error rate, latency, ความถูกต้องของข้อมูล) และเกณฑ์ rollback ไว้ก่อนเริ่ม ไม่ตัดสินใจตอนเกิดปัญหา","ปัจจัยที่ไม่ใช่เทคนิคก็สำคัญ: ทักษะของทีม, การอบรม, runbook, monitoring และ on-call ของแพลตฟอร์มใหม่ ต้องพร้อมก่อนย้ายระบบสำคัญ"],"examFocus":["ถ้าเจอ 12 แอปบน VM และทีมเพิ่งเริ่มใช้ container ให้เลือกแผนแบบคลื่น เริ่มจากระบบเสี่ยงต่ำ","ถ้าเจอแอปเก็บ session ในหน่วยความจำหรือไฟล์บนดิสก์ ให้ระบุสิ่งที่ต้องย้ายออกก่อนเพิ่ม replica","ถ้าเจองาน batch ที่ผลเป็นตัวเงิน ให้เลือก parallel run และเทียบผลก่อนปิดระบบเดิม","ถ้าเจอฐานข้อมูล relational production ให้พิจารณาไม่ย้ายพร้อมกัน หรือใช้บริการ managed ตาม RPO/RTO","ถ้าเจอบริการ 24 ชั่วโมงที่ห้าม downtime ให้ตอบ schema ที่เข้ากันได้สองเวอร์ชันและย้ายทราฟฟิกทีละส่วนพร้อมทางกลับ"],"pitfalls":["ย้ายทุกระบบพร้อมกันเพื่อให้ทันกำหนด ทำให้ปัญหาที่ยังไม่รู้มาพร้อมกันทั้งหมดโดยไม่มีทางกลับ","เพิ่ม replica ก่อนทำให้แอป stateless ทำให้ผู้ใช้หลุด session หรือไฟล์หาย","ปิดระบบเดิมทันทีที่ระบบใหม่ทำงานได้ โดยยังไม่มีหลักฐานเทียบผล","เปลี่ยน schema แบบ breaking ในขั้นเดียว ทำให้เวอร์ชันเก่าและใหม่ทำงานร่วมกันไม่ได้ระหว่างย้าย"]},{"descriptor":"CTR-S3","competency":"Container","title":"นโยบายความปลอดภัยของ container image","summary":"การควบคุมความเสี่ยงตลอดวงจรของ image ตั้งแต่ตอน build, scan, ที่มา (provenance) ไปจนถึงตอนรัน และการออกแบบนโยบายให้บังคับใช้ได้จริงโดยไม่ทำให้ทีมถูกบล็อกโดยไม่จำเป็น","keyPoints":["ลดพื้นที่โจมตี: ใช้ base image เล็กหรือ minimal (เช่น slim หรือ distroless) ใช้ multi-stage build ไม่ใส่เครื่องมือ build ใน image สุดท้าย และใช้ `USER` ที่ไม่ใช่ root","image scan (เช่น Trivy, Grype) ตรวจช่องโหว่ใน OS package และ dependency ของแอป ใช้เป็นด่านใน pipeline ได้ นโยบายที่ดีบล็อกเฉพาะสิ่งที่ร้ายแรงและแก้ได้ (เช่น ระดับ CRITICAL/HIGH ที่มีเวอร์ชันแก้แล้ว Trivy มีตัวเลือก `--ignore-unfixed`) ส่วนที่ยังไม่มีทางแก้ให้ติดตามพร้อมเจ้าของ","ด่านที่เข้มโดยไม่แยกว่าแก้ได้หรือไม่ ทำให้ทีมถูกบล็อกด้วยสิ่งที่แก้ไม่ได้ แล้วนำไปสู่การปิดด่านหรือยกเว้นแบบกว้าง ข้อยกเว้นที่ดีต้องแคบ มีเหตุผล มีเจ้าของ และมีวันหมดอายุ","ความปลอดภัยของ image ไม่หยุดที่ตอน build เพราะช่องโหว่ถูกประกาศภายหลัง จึงต้อง scan ซ้ำเป็นระยะทั้ง image ใน registry และที่กำลังรัน แล้วให้การแก้ไขวิ่งผ่านท่อ rebuild แล้ว deploy ใหม่ ไม่ใช่แพตช์ใน container ที่รันอยู่","layer ของ image ไม่เปลี่ยนแปลงหลังสร้าง: `COPY .npmrc` แล้ว `RUN rm` ในชั้นถัดไปไม่ได้ลบข้อมูลจากชั้นก่อนหน้า ผู้ที่ได้ image ดึง secret ได้ ถ้า secret เคยหลุดไปกับ image ที่แจกจ่ายแล้วให้ถือว่าถูกเปิดเผย ต้อง revoke/rotate","ส่ง secret เข้าตอน build อย่างปลอดภัยด้วย BuildKit secret mount (`RUN --mount=type=secret,id=...`) ซึ่งไม่ถูกเก็บใน layer และอย่าส่ง secret ผ่าน `ARG`/`ENV` เพราะอ่านได้จากประวัติ image","runtime hardening เพื่อลดความเสียหายเมื่อแอปถูกยึด: รันเป็นผู้ใช้ไม่ใช่ root, root filesystem แบบ read-only, ลด capabilities (`--cap-drop=ALL` แล้วเพิ่มเท่าที่จำเป็น), `no-new-privileges` ส่วนบน Kubernetes ใช้ `securityContext` (`runAsNonRoot`, `readOnlyRootFilesystem`, `allowPrivilegeEscalation: false`)","สิ่งที่ไม่ควรทำเพื่อแก้ปัญหา: รัน container แบบ `--privileged` หรือ mount `/var/run/docker.sock` เข้า container เพราะเท่ากับเปิดสิทธิ์ระดับโฮสต์","provenance: จำกัดว่าใคร push เข้า registry ได้, เซ็น image (เช่น cosign/Sigstore) และให้ cluster ตรวจลายเซ็นก่อนรันผ่าน admission control, อ้างอิง image ด้วย digest (`image@sha256:...`) เพราะ tag เปลี่ยนชี้ไปที่อื่นได้แต่ digest ไม่เปลี่ยน","SBOM (รายการส่วนประกอบของ image) ช่วยตอบได้เร็วว่าได้รับผลกระทบจากช่องโหว่ใหม่หรือไม่"],"examFocus":["ถ้าเจอด่าน scan ที่ล้ม build ด้วยช่องโหว่ที่ยังไม่มีเวอร์ชันแก้ ให้ปรับนโยบายแยกแก้ได้/แก้ไม่ได้ พร้อมข้อยกเว้นที่มีเจ้าของและวันหมดอายุ","ถ้าเจอ secret อยู่ใน layer ของ image ที่ถูก push แล้ว ให้ revoke/rotate secret และ build ใหม่โดยใช้ secret mount","ถ้าเจอ image ที่ผ่าน scan ตอน build แต่ใช้มา 2 เดือน ให้ตอบ scan ซ้ำต่อเนื่องและ rebuild","ถ้าเจอโจทย์ให้ cluster รันเฉพาะ image จาก pipeline ของบริษัท ให้ตอบ ตรวจลายเซ็นตอน admission, จำกัดสิทธิ์ push และอ้างด้วย digest","ถ้าเจอโจทย์ลดความเสียหายเมื่อแอปถูกเจาะ ให้เลือก non-root, read-only filesystem, drop capabilities"],"pitfalls":["เข้าใจว่าลบไฟล์ secret ในชั้นถัดไปของ Dockerfile ทำให้ secret หายไปจาก image","ใช้ tag เป็นหลักฐานของที่มา ทั้งที่ tag เขียนทับได้","ผ่าน scan ครั้งเดียวตอน build แล้วถือว่าปลอดภัยตลอดไป","แก้ช่องโหว่ด้วยการเข้าไปแพตช์ใน container ที่รันอยู่ ซึ่งหายไปเมื่อสร้างใหม่และตรวจสอบย้อนไม่ได้"],"example":{"lang":"dockerfile","code":"# syntax=docker/dockerfile:1\nFROM node:20-slim\nWORKDIR /app\nCOPY package*.json ./\nRUN --mount=type=secret,id=npmrc,target=/root/.npmrc \\\n    npm ci --omit=dev\nCOPY . .\nUSER node\nCMD [\"node\", \"server.js\"]"}},{"descriptor":"CLD-S1","competency":"Cloud","title":"ออกแบบสถาปัตยกรรม cloud: network, async, ความทนทาน","summary":"การอธิบายและออกแบบ flow ระหว่างบริการ cloud ในระดับสถาปัตยกรรม ครอบคลุมการแบ่งชั้นเครือข่าย การเข้าถึงบริการ managed แบบ private และรูปแบบการสื่อสารที่ทนความล้มเหลวเมื่อมีผู้ใช้จำนวนมาก","keyPoints":["แบ่งชั้นตามหน้าที่ใน VPC/VNet: จุดรับทราฟฟิกจากภายนอกคือ load balancer ใน public subnet ชั้นแอปและชั้นข้อมูลอยู่ใน private subnet และใช้ security group ควบคุมว่าใครเรียกใครได้ (เช่น db รับเฉพาะจาก app tier) ส่วนทางออกสู่ internet ของ private subnet ผ่าน NAT gateway","security group เป็น stateful (อนุญาตขาไปแล้ว ขากลับอัตโนมัติ) และผูกกับ resource ส่วน network ACL เป็น stateless ระดับ subnet ตามที่ AWS นิยาม ในแผนภาพควรกำหนดกฎด้วยการอ้างอิง security group ปลายทางแทนช่วง IP กว้าง","เมื่อข้อกำหนดพูดถึงเส้นทางของทราฟฟิก ให้แก้ที่เส้นทาง ไม่ใช่แค่เข้ารหัส: private endpoint (เช่น PrivateLink, Private Endpoint) ทำให้บริการ managed (object storage, database) ปรากฏเป็น IP ภายในของเครือข่ายเรา แล้วปิด public access ของบริการนั้น ทำให้ทราฟฟิกไม่ออก internet","เมื่อค่าใช้จ่ายและภาระโตตามจำนวนคำขอ ให้ถามก่อนว่าข้อมูลต้องมาถึงทันทีแค่ไหน: analytics ทนความล่าช้าได้ จึงรวม event เป็นชุด (batch) ที่ฝั่ง client ตามจำนวนหรือเวลา ลดจำนวนคำขอและค่าใช้จ่าย","retry ที่ไม่มีการหน่วงแบบสุ่มทำให้เกิด thundering herd: client จำนวนมากล้มพร้อมกันแล้วลองซ้ำด้วยช่วงเวลาคงที่ คำขอกลับมาเป็นก้อนซ้ำเติมระบบที่เพิ่งฟื้น ใช้ exponential backoff ร่วมกับ jitter (สุ่มเวลา) และจำกัดจำนวนครั้ง","messaging ส่วนใหญ่ให้ความหมายแบบ at-least-once เพื่อไม่ให้ข้อความหาย ผลคือผู้รับต้องทนต่อข้อความซ้ำ (idempotent consumer): เก็บ id ของเหตุการณ์/idempotency key แล้วตรวจก่อนทำ เช่น webhook การชำระเงินที่อาจถูกส่งซ้ำต้องไม่ตัดเงินสองครั้ง","ข้อความที่ประมวลผลล้มซ้ำหลายครั้งควรย้ายไป dead-letter queue (DLQ) เพื่อตรวจภายหลัง ไม่ให้บล็อกคิวหลัก","รูปแบบทนความล้มเหลว: timeout ที่ชัดเจน, circuit breaker, backpressure/rate limit, และ health check ที่ load balancer ใช้ถอด instance ที่ไม่พร้อม","กระจาย instance ข้ามหลาย availability zone เพื่อทนต่อ zone ล่ม แต่ต้องคิดค่าส่งข้อมูลข้าม zone และ state ที่ต้องซิงก์","synchronous เหมาะเมื่อผู้เรียกต้องการผลทันที ส่วน asynchronous (queue/event) เหมาะเมื่อต้องการแยกการพึ่งพาและรับโหลดสูงชั่วคราว (buffering) แลกกับความซับซ้อนและ eventual consistency"],"examFocus":["ถ้าเจอแผนภาพที่ให้เลือกว่าสิ่งใดอยู่ public/private ให้ตอบ load balancer ด้านนอก แอปและ db ใน private subnet พร้อมกฎ security group ตามสายการเรียก","ถ้าเจอข้อกำหนดว่าทราฟฟิกห้ามออก internet เมื่อแอปคุยกับ storage/database แบบ managed ให้ตอบ private endpoint และปิด public access","ถ้าเจอแอปมือถือที่ส่ง event ถี่จนค่าใช้จ่ายสูง ให้ตอบ batching ฝั่ง client","ถ้าเจอ client หลายแสนเครื่อง retry พร้อมกันหลัง deploy ล้ม ให้ตอบ exponential backoff + jitter","ถ้าเจอ webhook ที่อาจถูกส่งซ้ำ ให้ตอบ idempotent consumer ด้วย id ของเหตุการณ์"],"pitfalls":["เข้าใจว่าเข้ารหัสทราฟฟิกเท่ากับทราฟฟิกไม่ผ่าน internet ทั้งที่เส้นทางยังเป็นสาธารณะ","retry ด้วยช่วงเวลาคงที่ หรือ retry ไม่จำกัด ทำให้ปัญหาลุกลาม","คิดว่าคิวส่งข้อความครั้งเดียว (exactly-once) เสมอ จึงไม่ออกแบบให้ทนข้อความซ้ำ","วาง database ใน public subnet เพื่อให้เชื่อมต่อง่าย"]},{"descriptor":"CLD-S2","competency":"Cloud","title":"วิเคราะห์ต้นทุน cloud: commitment, TCO, storage tier","summary":"การเลือกรูปแบบราคาและบริการ managed โดยวิเคราะห์จากรูปแบบการใช้งานจริงและต้นทุนรวม (TCO) รวมถึงค่าแฝง ข้อสอบมักให้ตัวเลขหรือรูปแบบโหลดแล้วให้ตัดสินใจแบบ trade-off","keyPoints":["แบ่งโหลดเป็นส่วนฐานที่คงที่กับส่วนที่แกว่ง: ส่วนฐานซื้อด้วย commitment ระยะยาว (reserved instance/savings plan) ส่วนที่แกว่งตามช่วงเวลาทำการหรือ peak ซื้อแบบ on-demand และทบทวนสัดส่วนตามข้อมูลการใช้จริงเป็นระยะ","ความเสี่ยงของ commitment คือจ่ายครบแม้ไม่ได้ใช้ ถ้าไม่แน่ใจว่าฐานจะอยู่ต่อ ให้ commit น้อยกว่าฐานที่เห็นและเพิ่มภายหลัง แบบ savings plan ยืดหยุ่นกว่า reservation ที่ผูกกับชนิดเครื่อง (รายละเอียดต่างกันตามผู้ให้บริการ)","TCO ของฐานข้อมูลไม่ใช่ราคา compute อย่างเดียว ต้องรวมแรงงานดูแล (patch, backup, tuning, on-call) ส่วนที่จองไว้ ส่วนสำรองที่ HA ต้องมี (standby) และค่าส่งข้อมูลข้าม zone แล้วเทียบ managed กับ self-managed ด้วยเกณฑ์เดียวกัน","จุดคุ้มทุนของ serverless: คิดตามการเรียก/เวลารัน จึงได้เปรียบกับงานที่มีช่วงว่างหรือแกว่งมาก ส่วนงานที่รับคำขอสม่ำเสมอเต็มที่ตลอด 24 ชั่วโมงอาจถูกกว่าบน instance หรือ container ที่จองไว้ ต้องคำนวณจากปริมาณจริง ไม่ตัดสินจากหลักการ","ชั้นของ object storage (hot/standard, cool/infrequent, archive): ชั้นเย็นกว่าราคาเก็บถูกลงแต่มีค่าดึงข้อมูล (retrieval fee) สูงขึ้น มักมีระยะเก็บขั้นต่ำ (ลบก่อนมีค่าปรับ) และ archive อาจใช้เวลาหลายชั่วโมงกว่าจะอ่านได้ ต้องดูราคาเก็บ ค่าดึง และเวลารอพร้อมกัน","lifecycle policy ย้ายหรือลบข้อมูลตามอายุอัตโนมัติ แต่ถ้าผู้ใช้เปิดรูปเก่าบ่อย การย้ายไปชั้นเย็นเกินไปอาจทำให้ค่าดึงและความหน่วงเพิ่มมากกว่าที่ประหยัดได้","environment ที่ไม่ใช่ production (dev, test, staging) ใช้เป็นช่วงเวลา: ทำให้ของที่ไม่ได้ใช้ไม่ทำงาน ด้วยตารางปิด/เปิดอัตโนมัติ ฐานข้อมูลที่หยุดเองได้ และเก็บกวาดทรัพยากรที่ลืม ไม่ควรซื้อ commitment แบบ 24 ชั่วโมงให้ของที่ใช้ 10 ชั่วโมงต่อวัน","spot/preemptible เหมาะกับงานที่ทนการถูกเรียกคืนได้ (batch, CI agent, งานประมวลผลที่ checkpoint ได้) ไม่เหมาะกับบริการที่ต้องพร้อมตลอด","ค่าแฝงที่ต้องใส่ในการประเมิน: egress, ข้ามภูมิภาคและข้าม zone, snapshot/backup ที่สะสม, log และ metric, NAT gateway ตามปริมาณข้อมูล, IP/ดิสก์ที่ไม่ได้แนบ","FinOps พื้นฐาน: tag ทรัพยากรตามทีม/โปรเจกต์ เพื่อ showback/chargeback, ตั้ง budget alert, และทบทวนการใช้งานเป็นรอบ"],"examFocus":["ถ้าเจอโหลดที่มีฐานคงที่ 24 ชั่วโมงและ peak ในเวลาทำการ ให้ตอบ commitment สำหรับฐาน และ on-demand สำหรับส่วนที่เกิน","ถ้าเจอการเปรียบเทียบ managed กับ self-managed database ให้รวมแรงงาน, ส่วนสำรอง HA และค่า cross-zone ทั้งสองฝั่ง","ถ้าเจอ API รับโหลดสม่ำเสมอสูง ให้คำนวณเทียบ serverless กับ instance ที่จอง อย่าสมมติว่า serverless ถูกกว่า","ถ้าเจอข้อมูลรูปที่เก็บยาวนานแต่เปิดน้อย ให้ชั่งราคาเก็บ ค่าดึง และเวลารอของแต่ละชั้นก่อนเลือก archive","ถ้าเจอค่าใช้จ่ายของ environment ที่ไม่ใช่ production สูง ให้ตอบตารางปิดเปิดและไม่ซื้อ commitment ที่ไม่ตรงชั่วโมงใช้งาน"],"pitfalls":["เลือกชั้น storage ที่ถูกที่สุดต่อ GB โดยไม่นับค่าดึงและเวลารอ","ซื้อ commitment กับ environment ที่เปิดเป็นช่วงเวลา ทำให้จ่ายตลอดเวลาทั้งที่ใช้บางช่วง","เปรียบเทียบ TCO โดยนับเฉพาะราคา instance ของฝั่ง self-managed","ตัดสินใจว่า serverless ถูกกว่าเสมอโดยไม่คำนวณจากปริมาณคำขอจริง"]},{"descriptor":"CLD-S3","competency":"Cloud","title":"Security, DR และ compliance บน cloud ขั้นสูง","summary":"การออกแบบ identity ของ workload, การจัดการกุญแจและ PDPA, ถิ่นที่เก็บข้อมูล, DR ตาม RTO/RPO และ SLA ที่เซ็นกับลูกค้า โดยชั่งน้ำหนักความเสี่ยงและต้นทุน","keyPoints":["credential ระยะยาวที่หลุด (เช่น access key ใน repository) ให้ถือว่าถูกเปิดเผยแล้ว: เพิกถอน (revoke) และตรวจร่องรอยการใช้จาก audit log ก่อน แล้วแก้ต้นเหตุโดยไม่ใช้ key ระยะยาวเลย การลบไฟล์จาก commit ล่าสุดไม่พอเพราะยังอยู่ในประวัติ Git","workload identity: ให้ workload ได้ credential ชั่วคราวจาก identity ที่ผูกกับตัวมันเอง (IAM role, managed identity, IRSA/workload identity บน Kubernetes) และให้ pipeline ใช้ federation แบบ OIDC แทน secret ถาวร","least privilege ของ pipeline มีสามด้าน: ขอบเขต (แยก identity ต่อ environment และจำกัด role ในขอบเขตที่ใช้ ไม่ใช้ Owner ระดับ subscription ตัวเดียวทุกที่), อายุของ credential (ชั่วคราวผ่าน federation) และการอนุมัติ (production ต้องผ่าน approval)","การจัดการกุญแจ: ใช้ KMS/Key Vault, envelope encryption (กุญแจข้อมูลถูกเข้ารหัสด้วยกุญแจหลัก), เปิด key rotation, แยกผู้ดูแลกุญแจออกจากผู้ใช้ข้อมูล และบันทึก audit การใช้กุญแจ การเข้ารหัสดิสก์ที่เปิดเป็นค่าเริ่มต้นเป็นเพียงชั้นหนึ่ง ไม่ครบมาตรการ","มาตรการตาม PDPA ต้องครอบคลุมข้อมูลขณะจัดเก็บ ขณะส่งผ่าน การควบคุมสิทธิ์ และหลักฐานการเข้าถึง ไม่มีวิธีเดียวที่ครบ และกฎหมายกำหนดให้แจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) ภายใน 72 ชั่วโมงนับแต่ทราบเหตุ ตามเงื่อนไขของกฎหมาย","data residency: ข้อกำหนดถิ่นที่เก็บข้อมูลมักพลาดที่สำเนาข้างเคียง ได้แก่ backup, snapshot, replica ข้าม region, log, ข้อมูลทดสอบที่คัดลอกจาก production และผลการวิเคราะห์ ต้องตรวจทุกที่ที่ข้อมูลไปถึง และบังคับด้วย policy (เช่น จำกัด region ที่สร้าง resource ได้ ผ่าน Azure Policy หรือ SCP)","DR strategy เรียงจากถูกและช้าไปแพงและเร็ว: backup & restore, pilot light, warm standby, multi-site active-active เลือกจาก RTO (ยอมให้ระบบหยุดนานเท่าใด) และ RPO (ยอมสูญเสียข้อมูลย้อนหลังเท่าใด) ที่ธุรกิจกำหนด แล้วเลือกแบบที่ถูกที่สุดที่ยังอยู่ในเป้า","RPO ขึ้นกับความถี่ของการ replicate/backup ส่วน RTO ขึ้นกับความพร้อมของสภาพแวดล้อมสำรองและการสลับ ต้องซ้อมสลับ (DR drill) และทดสอบ restore จริง","SLA แบบอนุกรม: ความพร้อมรวมของบริการที่ต้องใช้ครบพร้อมกันคือผลคูณ ซึ่งต่ำกว่าตัวใดตัวหนึ่ง จึงต้องตรวจก่อนเซ็นสัญญากับลูกค้า ถ้าเสนอ 99.95% แต่พึ่งพาสองบริการ 99.9% ผลคูณราว 99.8% ซึ่งต่ำกว่าที่สัญญา; แบบขนาน (redundant) คือ 1 − (1 − a)(1 − b)","shared responsibility ยังใช้กับบริการ managed: ลูกค้ารับผิดชอบข้อมูล สิทธิ์ และการตั้งค่า network"],"examFocus":["ถ้าเจอ access key หลุดใน repo ให้ลำดับ: revoke, ตรวจ audit log, แล้วเปลี่ยนเป็น workload identity/federation","ถ้าเจอ pipeline ใช้ service principal เดียวสิทธิ์ Owner ให้แยกต่อ environment, จำกัดขอบเขต role และใช้ federation","ถ้าเจอข้อกำหนดข้อมูลต้องอยู่ในประเทศ ให้ตรวจ backup, replica, log และข้อมูลทดสอบด้วย ไม่ใช่เฉพาะฐานข้อมูลหลัก","ถ้าเจอ RTO 30 นาทีและ RPO 5 นาที ให้เลือกแบบ DR ที่ตรงเป้าด้วยต้นทุนต่ำสุด (มักเป็น warm standby) ไม่ใช่ active-active โดยอัตโนมัติ","ถ้าเจอโจทย์ SLA ที่ต้องเสนอลูกค้า ให้คูณ SLA ของบริการที่พึ่งพาก่อนตัดสินใจ"],"pitfalls":["แก้ key ที่หลุดด้วยการลบไฟล์ในคอมมิตถัดไปโดยไม่ revoke","เข้าใจว่าเปิดการเข้ารหัสดิสก์ค่าเริ่มต้นแล้วสอดคล้อง PDPA ครบ","เลือก DR แบบดีที่สุดทางเทคนิคแทนแบบที่ตรง RTO/RPO ด้วยต้นทุนต่ำสุด","ตรวจ region เฉพาะข้อมูลหลัก แต่ backup หรือ log ไปอยู่นอกประเทศ"]},{"descriptor":"CICD-S1","competency":"CI/CD","title":"ออกแบบ pipeline หลาย environment ใน Azure DevOps","summary":"การออกแบบ workflow ที่ส่ง artifact เดียวผ่านหลาย environment และ deployment target โดยแยกค่าตาม environment, ควบคุมการอนุมัติ และไม่ให้ environment ต่างกันโดยไม่ตั้งใจ","keyPoints":["โครงสร้างหลัก: หนึ่ง stage ต่อ environment (Build, Dev, Staging, Production) ใช้ `dependsOn` และ `condition` กำหนดลำดับ และใช้ deployment job (`- deployment:`) ที่อ้าง `environment:` เพื่อให้ได้ประวัติการ deploy ของ environment นั้น","Environment ใน Azure DevOps ผูก approval และ check (อนุมัติโดยคน, business hours, branch control ฯลฯ) ไว้ที่ตัว environment ไม่ได้เขียนใน YAML จึงบังคับกับทุก pipeline ที่ deploy ไปที่นั่น","deployment strategy ของ deployment job: `runOnce`, `rolling` และ `canary` ใช้เลือกวิธีปล่อยตามความเสี่ยงของ target","ค่าต่างตาม environment (URL, connection string, ขนาด, feature) แยกด้วย variable group ต่อ environment หรือ parameter ของ template ส่วน secret เชื่อมกับ Azure Key Vault และอ้างอิงผ่าน variable group","ใช้ YAML template (`template:` พร้อม `parameters:`) ให้ขั้นตอน deploy เหมือนกันทุก environment ต่างกันเฉพาะ parameter ลดการคัดลอก pipeline แยกที่ทำให้ค่าเพี้ยน","service connection แยกต่อ environment และจำกัดสิทธิ์ตาม scope ของ environment นั้น ไม่ใช้ identity ตัวเดียวสิทธิ์สูงทุกที่","build once, deploy many: promote artifact เดิมไปทุก environment ไม่ build ใหม่ เพื่อให้สิ่งที่ทดสอบตรงกับสิ่งที่ขึ้น production","infrastructure as code (Bicep/Terraform): template ใน repo เป็นแหล่งความจริงเดียว ส่วนที่ต่างตั้งใจอยู่ใน parameter ต่อ environment การเปลี่ยนผ่าน PR และ pipeline แสดง plan/what-if ก่อน apply ผ่านด่านอนุมัติ และไม่ให้แก้ด้วยมือใน portal เพื่อกัน configuration drift","แอปมือถือ: ค่าตาม environment ฝังไปกับ binary จึงควรแยก build variant (flavor/scheme) ต่อ environment จาก commit เดียวกัน พร้อม application id และข้อมูลเซ็นแยก และไม่ปล่อยเมนูสลับ environment ในแอปที่ผู้ใช้จริงได้รับ","production ต้องผ่าน approval และมีแผน rollback ที่ซ้อมไว้แล้ว"],"examFocus":["ถ้าเจอ production ล่มเพราะค่า timeout/firewall ของ staging ไม่เหมือน production ให้ตอบ IaC เป็นแหล่งความจริง พร้อม parameter ต่อ environment และ plan ก่อน apply","ถ้าเจอโจทย์อยากให้มีคนอนุมัติก่อนขึ้น production ให้ตั้ง approval ที่ environment ใน Azure DevOps","ถ้าเจอ build เดียวที่มีเมนูสลับ environment ในแอปมือถือ ให้แยก build variant ต่อ environment","ถ้าเจอ pipeline ที่คัดลอกไฟล์แยกต่อ environment ให้ใช้ template ร่วมกับ parameter","ถ้าเจอ secret ต่าง environment ให้ใช้ variable group/Key Vault ต่อ environment"],"pitfalls":["ปรับค่าด้วยมือใน portal ของ production เพื่อแก้เร็ว ทำให้ drift และตรวจสอบย้อนไม่ได้","build ใหม่ทุก environment แล้วเรียกว่าเป็น artifact เดียวกัน","ใช้ service principal เดียวสิทธิ์กว้างกับทุก environment","เขียนเงื่อนไขอนุมัติใน script ของ pipeline แทนการตั้งที่ environment ทำให้ข้ามได้"],"example":{"lang":"yaml","code":"stages:\n- stage: Staging\n  jobs:\n  - deployment: DeployStaging\n    environment: staging\n    strategy:\n      runOnce:\n        deploy:\n          steps:\n          - template: steps/deploy.yml\n            parameters: { serviceConnection: sc-staging }\n- stage: Production\n  dependsOn: Staging\n  jobs:\n  - deployment: DeployProd\n    environment: production\n    strategy:\n      runOnce:\n        deploy:\n          steps:\n          - template: steps/deploy.yml\n            parameters: { serviceConnection: sc-prod }"}},{"descriptor":"CICD-S2","competency":"CI/CD","title":"Security scan ใน pipeline: SonarQube และ ZAP","summary":"การผนวกการสแกนคุณภาพและความปลอดภัยเข้า pipeline อย่างเหมาะสม โดยวาง SAST และ DAST ในตำแหน่งที่ถูกต้อง ตั้งเกณฑ์ผ่านไม่ผ่านที่ใช้ได้จริง และคัดกรองผลเพื่อไม่ให้ทีมเลี่ยงเครื่องมือ","keyPoints":["SAST (static analysis) อย่าง SonarQube วิเคราะห์ซอร์สโค้ดโดยไม่ต้องรันแอป จึงวางตั้งแต่ขั้น build และ PR ส่วน DAST (dynamic) อย่าง OWASP ZAP โจมตีแอปที่กำลังรัน จึงต้องวางหลัง deploy ไป environment ทดสอบ","ใน Azure DevOps ใช้ extension ของ SonarQube สามขั้น: prepare analysis, run analysis (ตามชนิดโปรเจกต์), publish quality gate result (แสดงสถานะ quality gate ในหน้าสรุปของ build) ถ้าต้องการให้ pipeline ล้มเมื่อ quality gate ไม่ผ่าน ให้ตั้ง `sonar.qualitygate.wait=true` ใน additional properties ของขั้น prepare analysis","Quality Gate ของ SonarQube คือชุดเงื่อนไขผ่าน/ไม่ผ่าน (เช่น coverage, duplication, ช่องโหว่ใหม่) แนวทาง Clean as You Code เน้นให้เกณฑ์ใช้กับโค้ดใหม่ (new code) เพื่อไม่ถูกบล็อกด้วยหนี้เก่าทั้งหมดในครั้งเดียว","ZAP มีโหมดหลักผ่านสคริปต์ใน Docker image: baseline scan (`zap-baseline.py` แบบ passive ไม่โจมตี) , full scan (`zap-full-scan.py` มี active attack) และ API scan (`zap-api-scan.py` ใช้นิยาม API เช่น OpenAPI)","active scan ส่ง payload โจมตีจริง จึงรันกับ test environment เท่านั้น ไม่รันกับ production และข้อมูลทดสอบอาจถูกเปลี่ยนแปลง","เพื่อให้ DAST ครอบคลุม API ที่ต้องล็อกอิน ต้องสแกนแบบ authenticated โดยกำหนด context และ authentication ให้ ZAP เข้าถึง endpoint ที่อยู่หลังล็อกอิน ไม่เช่นนั้นสแกนได้เฉพาะหน้าสาธารณะ","นโยบายคัดกรอง: ให้ pipeline ล้มเฉพาะสิ่งที่ร้ายแรงและเป็นของใหม่ ส่วนที่เหลือมีเจ้าของและเวลาแก้ พร้อมเหตุผลของข้อยกเว้น (false positive ระบุผ่านไฟล์ rules/config ของ ZAP)","ถ้าเข้มทุกระดับ ทีมมักเลี่ยงหรือปิดเครื่องมือ ถ้าหลวมเกินไป ช่องโหว่ถูกซ่อน ต้องตกลงเกณฑ์ก่อนเปิดใช้ ไม่ใช่เพียงสร้างรายงาน","ชนิดการสแกนอื่นที่เสริมกัน: SCA (dependency scan) ตรวจช่องโหว่ของไลบรารีที่ใช้ และ secret scanning ตรวจ credential ที่หลุดใน repo"],"examFocus":["ถ้าเจอโจทย์ว่าวาง SonarQube ที่ไหน ให้ตอบตั้งแต่ build/PR เพราะใช้ซอร์สโค้ด","ถ้าเจอโจทย์ว่าวาง ZAP ที่ไหน ให้ตอบหลัง deploy ไป test environment เพราะต้องมีแอปรัน","ถ้าเจอ ZAP alert 40 รายการปะปนและ endpoint ส่วนใหญ่ต้องล็อกอิน ให้ตอบสแกนแบบ authenticated และตั้งนโยบายล้มเฉพาะระดับสูงที่เป็นของใหม่","ถ้าเจอโจทย์ว่าเครื่องมือสแกนควรทำให้ build ล้มหรือไม่ ให้ตอบว่ามีเกณฑ์ที่ตกลงไว้ก่อน ไม่ใช่เพียงรายงาน"],"pitfalls":["รัน ZAP กับโค้ดที่ยังไม่ได้ deploy หรือรัน SonarQube หลัง deploy เท่านั้น","ตั้งให้ล้มทุกระดับ alert ทำให้ทีมปิดด่านทั้งหมด","รัน active scan กับ production","สแกน API ที่ต้องล็อกอินโดยไม่ตั้ง authentication แล้วเข้าใจว่าได้ผลสะอาด"]},{"descriptor":"CICD-S3","competency":"CI/CD","title":"Build และ test อัตโนมัติ: ความเชื่อถือได้ของ test","summary":"การทำให้ขั้นตอน build และ test อัตโนมัติเชื่อถือได้ โดยเฉพาะการจัดการ test ที่ล้มสุ่ม (flaky) ซึ่งทำลายความเชื่อถือของ gate และการออกแบบ test ให้ไม่ขึ้นกับสิ่งแวดล้อม","keyPoints":["flaky test คือ test ที่ผลเปลี่ยนโดยโค้ดไม่เปลี่ยน มักมาจากลำดับ/เวลา (race, timing), ข้อมูลร่วมกันระหว่าง test, ทรัพยากรภายนอก, เวลาหรือ timezone, ค่าสุ่ม","การตั้ง retry อัตโนมัติทั้ง stage จนกว่าจะผ่านเป็นการซ่อนปัญหา: ความเชื่อถือของ gate ลดลง และ bug จริงที่เกิดบางครั้งก็ผ่านไปได้ retry ควรจำกัดเฉพาะจุดที่รู้ว่ามีสาเหตุภายนอกชั่วคราว เช่น การดาวน์โหลด dependency","วิธีจัดการอย่างเป็นระบบ: quarantine (แยก test ที่ไม่เสถียรออกจาก gate แต่ยังรันเพื่อเก็บข้อมูล), ระบุเจ้าของและกำหนดเวลาแก้, เมื่อแก้ต้นเหตุแล้วย้ายกลับเข้า gate และวัดอัตราความล้มเหลวเป็นตัวเลข","test pyramid: unit test จำนวนมากเร็ว, integration test ปานกลาง, end-to-end น้อยและช้า ยิ่งสูงยิ่งเสี่ยง flaky ควรเรียงให้ test เร็วรันก่อนเพื่อล้มเร็ว (fail fast)","ทำให้ test เป็น deterministic: ฉีด clock และตัวสุ่มเข้าไปแทนการอ่านเวลาจริง, ไม่พึ่งลำดับการรัน, แต่ละ test สร้างและล้างข้อมูลของตัวเอง, ไม่ใช้ sleep แบบเดาเวลา ให้รอเงื่อนไขแทน","integration test ควรรันกับ dependency ที่สร้างใหม่ทุกครั้ง เช่น service container หรือฐานข้อมูลชั่วคราว เพื่อไม่ให้ผลขึ้นกับสถานะที่ค้าง","เผยแพร่ผล test และ code coverage ใน pipeline เพื่อดูแนวโน้ม และอาจตั้งเกณฑ์ coverage ขั้นต่ำ โดยระวังว่า coverage สูงไม่ได้แปลว่า test มีคุณภาพ","แบ่งงาน test แบบขนาน (sharding) ลดเวลา แต่ต้องมั่นใจว่า test ไม่แย่งข้อมูลหรือพอร์ตเดียวกัน"],"examFocus":["ถ้าเจอ test ล้มสุ่มราว 1 ใน 8 ครั้งและหัวหน้าเสนอ retry ทั้ง stage ให้ตอบ quarantine มีเจ้าของและกำหนดเวลาแก้ ไม่ซ่อนด้วย retry","ถ้าเจอโจทย์ว่าจะ retry อะไรได้ ให้ตอบเฉพาะจุดที่ล้มจากสาเหตุภายนอกชั่วคราว","ถ้าเจอ test ที่ล้มเฉพาะบางเครื่อง/เวลา ให้หาสิ่งที่ไม่ deterministic เช่น เวลา ลำดับ ข้อมูลร่วม","ถ้าเจอ pipeline ช้า ให้เรียง test เร็วก่อนและแยกงานขนาน แต่ไม่ลดการตรวจ"],"pitfalls":["กด re-run จนผ่านเป็นนิสัย จน gate หมดความหมาย","ลบหรือปิด test ที่ไม่เสถียรโดยไม่มีเจ้าของและแผนแก้","เพิ่ม sleep ยาวขึ้นเพื่อให้ test ผ่านแทนการรอเงื่อนไขที่แท้จริง","ใช้ฐานข้อมูลร่วมกันระหว่างงาน test ที่รันขนาน"]},{"descriptor":"CICD-S4","competency":"CI/CD","title":"Pipeline ส่งมอบสม่ำเสมอ: ตรวจย้อนได้และไม่ขึ้นกับคน","summary":"การตั้ง pipeline ให้ผลการส่งมอบเหมือนกันทุกครั้ง โดยตัดความต่างที่เกิดจากคนและเครื่อง ผูกทุก release กับ commit และ artifact ที่ตรวจย้อนได้ ตัวอย่างเด่นคือการ release แอปมือถือ","keyPoints":["consistent delivery มาจากการตัดความต่างที่เกิดจากคนและเครื่อง: release ออกจาก CI เท่านั้น ไม่ build จากเครื่องนักพัฒนา เพื่อให้ผลไม่ขึ้นกับเครื่องหรือสภาพแวดล้อมของใคร","ล็อกอินพุต: build จาก commit ที่ระบุ ใช้ lockfile และเวอร์ชันเครื่องมือที่ระบุ (เช่น เวอร์ชัน SDK/Node/JDK) และระบุ base image ให้ชัด เพื่อให้ build ซ้ำได้ผลเดิม","ข้อมูลเซ็นแอป (keystore, certificate, provisioning profile) ใช้ชุดเดียวใน secure store ของ pipeline (เช่น secure files/ secret) ไม่ให้แต่ละคนถือสำเนา เพื่อไม่ให้เซ็นด้วยใบรับรองผิด","ให้ระบบกำหนดหมายเลข build เอง (ตัวนับเพิ่มขึ้นทุกครั้ง) เพราะ store ปฏิเสธ build ซ้ำ ส่วน version name ที่ผู้ใช้เห็นเป็นเรื่องของทีมผลิตภัณฑ์","artifact immutable และมี version: เก็บ artifact ที่ build แล้วพร้อม metadata (commit SHA, build number) เพื่อให้ release ตรวจสอบย้อนหลังและ rollback ไปเวอร์ชันก่อนหน้าได้ด้วยการ deploy artifact เดิม","build once, promote: ใช้ artifact เดียวผ่านทุก environment และแยกเฉพาะ configuration","pipeline เป็นโค้ด (YAML ใน repo) ผ่าน PR review ทำให้การเปลี่ยนแปลงกระบวนการส่งมอบตรวจสอบและย้อนได้ และใช้ template ร่วมเพื่อให้ทุกบริการใช้มาตรฐานเดียวกัน","การควบคุมคนเข้าแทรก: protected branch, approval ก่อน production, จำกัดผู้ที่แก้ pipeline และ service connection","วัดผลด้วย metric เช่น lead time, deployment frequency, change failure rate, time to restore (DORA) เพื่อดูว่าการส่งมอบสม่ำเสมอขึ้นจริง"],"examFocus":["ถ้าเจอ build เวอร์ชันเดียวกันจากเครื่องนักพัฒนากับ CI ไม่ตรงกัน ให้ตอบ build จาก CI เท่านั้น ล็อก dependency และ commit","ถ้าเจอเคยปล่อยแอปที่เซ็นด้วยใบรับรองผิด ให้ตอบเก็บข้อมูลเซ็นชุดเดียวใน secure store ของ pipeline","ถ้าเจออัปโหลด store ถูกปฏิเสธเพราะหมายเลข build ซ้ำ ให้ตอบให้ระบบกำหนดหมายเลข build อัตโนมัติ","ถ้าเจอคำถามว่า release ตรวจย้อนหลังได้อย่างไร ให้ตอบผูก artifact กับ commit SHA และ build number"],"pitfalls":["ให้นักพัฒนา build และอัปโหลด release จากเครื่องตัวเองเมื่อ pipeline ช้า","ใช้ tag `latest` หรือเวอร์ชันลอยของ dependency ใน build ของ release","แจกไฟล์ keystore ให้หลายคน ทำให้ควบคุมและหมุนเวียนไม่ได้","คิดว่า approval เพียงอย่างเดียวทำให้ release สม่ำเสมอ ทั้งที่ build ยังไม่ซ้ำได้"]},{"descriptor":"CICD-S5","competency":"CI/CD","title":"การรวมโค้ดร่วมกัน: branch policy และ trunk-based","summary":"การออกแบบวิธีทำงานร่วมกันของทีมให้การรวมโค้ดราบรื่น conflict น้อย และคุณภาพถูกบังคับที่ทางเข้า โดยใช้ branch policy, PR validation และ feature flag","keyPoints":["conflict ใหญ่และ build พังหลัง merge มักเกิดจาก branch อายุยาว (สัปดาห์) ที่รวมพร้อมกันตอนท้ายรอบ แนวทางคือรวมโค้ดเล็ก ๆ บ่อย ๆ (continuous integration) ตามแนว trunk-based development ที่ branch สั้นและ merge เข้า main อย่างน้อยทุกวันหรือไม่กี่วัน","branch policy บังคับคุณภาพที่ทางเข้า: ต้องมี build validation ผ่าน, จำนวน reviewer ขั้นต่ำ, การแก้ comment ครบ, ห้าม push ตรงเข้า main (protected branch) ใน Azure DevOps ตั้งที่ branch policy ส่วน GitHub ใช้ branch protection/ruleset","PR validation: pipeline รัน build, test, lint ก่อน merge เพื่อให้ main อยู่ในสภาพที่ build ผ่านเสมอ","feature flag ทำให้ merge งานที่ยังไม่เสร็จเข้า main ได้โดยไม่เปิดให้ผู้ใช้เห็น แยกการ deploy ออกจากการ release ฟีเจอร์ แต่ต้องมีวินัยลบ flag เก่าออก","PR ที่เล็กและมีจุดประสงค์เดียวรีวิวเร็วและเสี่ยงน้อยกว่า PR ใหญ่ที่รวมหลายเรื่อง","กลยุทธ์ merge: merge commit (เก็บประวัติครบ), squash (ประวัติ main สะอาด หนึ่ง commit ต่อ PR), rebase (ประวัติเป็นเส้นตรง) ทีมควรตกลงแนวเดียว","ให้เจ้าของโค้ดเป็นผู้รีวิว: GitHub มีไฟล์ `CODEOWNERS` ส่วน Azure DevOps ตั้ง required reviewers ตาม path ได้","main ต้องอยู่ในสถานะ deployable เสมอ: ถ้า build พังต้องแก้หรือ revert ทันทีก่อนงานอื่น","merge queue (เช่นใน GitHub) ช่วยรันตรวจกับสถานะ main ล่าสุดก่อน merge เพื่อกัน PR สองตัวที่ผ่านแยกกันแต่พังเมื่อรวมกัน"],"examFocus":["ถ้าเจอทีม 12 คนใช้ branch อายุ 2-3 สัปดาห์แล้วชนกันตอนท้ายรอบ ให้ตอบรวมบ่อยและเล็ก ใช้ branch policy บังคับ build/test/review และใช้ feature flag สำหรับงานที่ยังไม่เสร็จ","ถ้าเจอโจทย์อยากให้ main ไม่พัง ให้ตอบ PR validation และห้าม push ตรง","ถ้าเจองานใหญ่ที่ไม่เสร็จใน sprint ให้ merge เป็นชิ้นเล็กหลัง feature flag","ถ้าเจอโจทย์ว่ากฎใดควรบังคับที่ทางเข้า ให้เลือกสิ่งที่ระบบตรวจอัตโนมัติได้ ไม่ใช่พึ่งความจำของคน"],"pitfalls":["รอรวมโค้ดทีเดียวตอนท้ายรอบ ซึ่งเก็บความเสี่ยงไว้ปะทุพร้อมกัน","ใช้ branch policy แต่ให้ผู้ดูแลข้ามได้เป็นประจำ","ทิ้ง feature flag ที่หมดประโยชน์ไว้จนโค้ดซับซ้อน","ถือว่าการ review โดยคนแทน build และ test อัตโนมัติได้"]},{"descriptor":"CICD-S6","competency":"CI/CD","title":"ตั้งค่า CI tool: agent, ขนาน, cache, ความเร็ว","summary":"การตั้งค่าเครื่องมือ CI ให้ build และ test เร็วและคุ้มค่า โดยเลือก agent ให้เหมาะกับงาน ขนานงาน ใช้ cache อย่างถูกต้อง และเรียงงานให้ล้มเร็ว โดยไม่ลดการตรวจสอบ","keyPoints":["เลือก agent ตามงาน: งานส่วนใหญ่รันบน agent Linux ที่ถูกกว่าและมีมาก ส่วนงานที่ต้องใช้ macOS เท่านั้น (เช่น build และเซ็นแอป iOS) จึงจำกัดให้รันบน agent macOS ซึ่งมีจำกัดและแพงกว่า","แยก job ที่ไม่ขึ้นต่อกันให้รันขนานกัน เช่น lint, unit test, build Android และ build iOS ใน Azure DevOps ใช้ job หลายตัวใน stage เดียวกัน และ `strategy: matrix` สำหรับรันหลายชุดค่า ใน GitHub Actions ใช้ `strategy.matrix`","เรียงงานให้ล้มเร็ว (fail fast): ขั้นตอนถูกและเร็ว เช่น lint และ unit test มาก่อน ขั้นตอนแพงและช้ามาทีหลัง จะได้รู้ผลเร็วและไม่เปลืองเวลา agent","cache อย่างมี key ที่ถูกต้อง: ผูก key กับ hash ของ lockfile (ถ้ามีหลายแพลตฟอร์มให้รวมชื่อ OS ใน key) พร้อม restore key สำรอง ถ้า key ไม่เปลี่ยนตาม dependencies จะได้ cache เก่าที่ผิด","ใช้ path filter หรือ trigger ตามการเปลี่ยนแปลงใน monorepo เพื่อรันเฉพาะส่วนที่เกี่ยวข้องกับไฟล์ที่แก้","ใช้ YAML template/reusable workflow ร่วมกันหลาย pipeline เพื่อให้ตั้งค่าตรงกันและแก้จุดเดียว","Microsoft-hosted agent สะอาดใหม่ทุกครั้ง เริ่มทันที จ่ายตามจำนวน parallel job ส่วน self-hosted agent ควบคุมเครื่องมือ สิทธิ์ และเข้าถึง network ภายในได้ แต่ต้องดูแลเอง","ส่งต่อ artifact ระหว่าง job/stage ผ่าน pipeline artifact แทนการ build ซ้ำ และตั้ง timeout ของ job เพื่อไม่ให้งานค้างกินเวลา agent","การเร่ง pipeline ที่ถูกต้องคือย้ายงานไปทรัพยากรที่เหมาะ ขนาน และ cache ไม่ใช่ตัดขั้นตอนตรวจ เพราะเป็นการแลกคุณภาพกับเวลา"],"examFocus":["ถ้าเจอ pipeline มือถือ 40 นาทีที่รันทุกอย่างบน macOS ให้ย้ายงานที่ไม่ต้องใช้ macOS ไป Linux ขนานงานอิสระ และเก็บ macOS ไว้เฉพาะ build/เซ็น iOS","ถ้าเจอ cache ไม่ได้ผล ให้ตรวจ key ว่าผูกกับ lockfile","ถ้าเจอ monorepo ที่ทุก PR รันทุกอย่าง ให้ใช้ path filter","ถ้าเจอโจทย์เลือกวิธีเร่งความเร็ว ให้ตัดตัวเลือกที่ลดการตรวจ (เช่น ข้าม test) ออกก่อน","ถ้าเจอโจทย์ต้องเข้าถึงทรัพยากรใน network ภายในองค์กร ให้พิจารณา self-hosted agent"],"pitfalls":["ข้าม test หรือ lint บน PR เพื่อให้เร็ว","รันทุกงานบน agent macOS เพราะสะดวก ทั้งที่แพงและมีจำกัด","ตั้ง cache key เป็นค่าคงที่","ขนานงานที่ต้องใช้ผลของกันและกันโดยไม่กำหนด dependency"],"example":{"lang":"yaml","code":"jobs:\n- job: Lint\n  pool: { vmImage: ubuntu-latest }\n  steps:\n  - script: npm ci && npm run lint\n- job: UnitTest\n  pool: { vmImage: ubuntu-latest }\n  steps:\n  - script: npm ci && npm test\n- job: BuildIOS\n  dependsOn: [Lint, UnitTest]\n  pool: { vmImage: macos-latest }\n  steps:\n  - script: ./build_ios.sh"}},{"descriptor":"CICD-S7","competency":"CI/CD","title":"Deploy ที่ทำซ้ำได้: idempotency และกลยุทธ์ปล่อย","summary":"การออกแบบการ deploy ให้รันซ้ำได้อย่างปลอดภัยเมื่อ pipeline ล้มกลางทาง และให้ผลเหมือนเดิมทุกครั้ง ผ่านเครื่องมือแบบ declarative, migration ที่ตรวจก่อนทำ และ artifact ที่ระบุเวอร์ชัน","keyPoints":["pipeline ล้มกลางทางเป็นเรื่องปกติ (เครือข่ายขัดข้อง, timeout) ดังนั้นการ deploy ต้อง idempotent: รันซ้ำกี่ครั้งก็ได้ผลปลายทางเดียวกัน ไม่สร้าง resource ซ้ำและไม่ต่อท้ายค่า config ซ้ำ","ใช้เครื่องมือหรือสคริปต์แบบ declarative ที่ระบุสถานะปลายทาง (เช่น Terraform, Bicep, Kubernetes manifest ด้วย `kubectl apply`) ให้เครื่องมือเปรียบเทียบกับสถานะปัจจุบันและทำเฉพาะส่วนที่ต่าง แทนสคริปต์แบบ imperative ที่สั่งทำทีละคำสั่ง","สคริปต์ที่เขียนเองให้ตรวจก่อนทำ (check-then-act): ถ้า resource มีอยู่แล้วให้ข้าม หรือใช้คำสั่งที่เป็น upsert และเขียนค่าด้วยการตั้งค่าให้เท่ากับค่าที่ต้องการ ไม่ใช้การต่อท้าย (append)","database migration ใช้เครื่องมือที่บันทึกเวอร์ชันที่รันแล้วในตาราง (เช่น Flyway, Liquibase, EF Core migrations) เพื่อรันเฉพาะที่ยังไม่รัน และออกแบบ migration แบบ expand/contract เพื่อให้เวอร์ชันเก่าและใหม่ทำงานร่วมกันได้ระหว่างปล่อย","deploy artifact ที่ระบุเวอร์ชันชัดเจน (และอ้างด้วย digest สำหรับ image) ไม่ใช่ `latest` เพื่อให้ re-run หรือ rollback ได้ของเดิมแน่นอน","กลยุทธ์ปล่อย: rolling (ทยอยแทนที่ instance), blue-green (สลับทราฟฟิกระหว่างสองชุด ย้อนกลับเร็ว แต่ใช้ทรัพยากรสองเท่าชั่วคราว), canary (ปล่อยส่วนน้อยก่อนแล้วขยายตามตัวชี้วัด)","rollback ที่เชื่อถือได้คือการ deploy artifact เวอร์ชันก่อนหน้าด้วยกระบวนการเดียวกัน แต่ต้องคิดเรื่อง schema ของฐานข้อมูลที่เปลี่ยนไปแล้วด้วย (ซึ่ง expand/contract ช่วยได้)","ป้องกันการ deploy ซ้อนกัน: ใช้ exclusive lock check ของ environment ใน Azure DevOps หรือ `concurrency` ใน GitHub Actions เพื่อไม่ให้สองการรันเขียนทับกัน","ห้ามแก้ environment ด้วยมือนอก pipeline เพราะทำให้สถานะจริงต่างจากที่ pipeline คาดและการรันซ้ำให้ผลไม่เหมือนเดิม (drift)"],"examFocus":["ถ้าเจอ deploy ล้มกลางทางแล้ว re-run สร้าง resource ซ้ำและต่อท้าย config ให้ตอบเปลี่ยนเป็น declarative และทำให้ migration กับสคริปต์ตรวจก่อนทำ","ถ้าเจอโจทย์ migration ที่รันไปแล้วบางส่วน ให้ตอบใช้เครื่องมือที่บันทึกเวอร์ชันที่รันแล้ว","ถ้าเจอโจทย์ต้องย้อนกลับเร็ว ให้พิจารณา blue-green หรือ deploy artifact เวอร์ชันก่อนหน้า","ถ้าเจอสอง pipeline deploy environment เดียวกันพร้อมกัน ให้ใช้ lock หรือ concurrency control"],"pitfalls":["เขียนสคริปต์ที่สมมติว่าจะรันครั้งเดียวสำเร็จเสมอ","deploy ด้วย tag `latest` จึงไม่รู้ว่าการ re-run ใช้เวอร์ชันใด","คิดว่าการ rollback โค้ดย้อน schema ฐานข้อมูลให้โดยอัตโนมัติ","แก้ค่าบนเซิร์ฟเวอร์ด้วยมือแล้วเชื่อว่า pipeline จะจัดการต่อให้"]},{"descriptor":"CICD-S8","competency":"CI/CD","title":"Unit test, lint และ deployment validation","summary":"การผนวกเครื่องมือตรวจสอบเข้า pipeline ทั้งก่อน deploy (unit test, lint, IaC validation) และหลัง deploy (health check, smoke test, rollout condition) เพราะ pipeline เขียวไม่ได้แปลว่าแอปทำงานได้","keyPoints":["ด่านก่อน deploy: unit test, lint (เช่น ESLint ที่คืน exit code ไม่ใช่ศูนย์เมื่อพบปัญหา), type check, ตรวจรูปแบบ (format check), image scan และตรวจ template ของ infrastructure (`terraform validate`/`plan`, Bicep what-if) ตรวจสิ่งที่ไม่ต้องใช้แอปที่รันจริง","pipeline เขียวหมายถึงคำสั่ง deploy จบ ไม่ได้แปลว่าแอปทำงาน เช่น แอป crash ตอนเริ่มเพราะ config ผิดยังเขียวได้ จึงต้องมี deployment validation ที่ดูแอปที่รันจริง","health check endpoint (เช่น `/health`) ตรวจว่าแอปเริ่มได้และต่อ dependency ที่จำเป็นได้ pipeline เรียกหลัง deploy และล้มเมื่อไม่ผ่านหลังรอตาม timeout","smoke test คือชุด test เล็กๆ ที่ทดสอบเส้นทางสำคัญบนระบบที่ deploy แล้ว (เช่น ล็อกอิน เรียก API หลักหนึ่งตัว) ทำให้จับ config ผิด เวอร์ชันผิด หรือสิทธิ์ขาดที่ test ก่อน deploy จับไม่ได้ เพราะเป็นปัญหาของ environment","บน Kubernetes ใช้ `kubectl rollout status deployment/<ชื่อ> --timeout=...` ให้ pipeline รอและล้มเมื่อ rollout ไม่สำเร็จ และ `readiness probe` ป้องกันไม่ให้ traffic ไปถึง pod ที่ยังไม่พร้อม; `liveness probe` ใช้รีสตาร์ท container ที่ค้าง","rollout condition และ rollback อัตโนมัติ: เมื่อ validation ล้มให้ย้อนกลับเอง (เช่น `kubectl rollout undo`) หรือหยุด canary ตามตัวชี้วัด เช่น error rate","ผลของ unit test และ coverage ควรเผยแพร่เป็นรายงานใน pipeline เพื่อดูแนวโน้ม และตั้ง lint/test เป็นด่านบังคับของ PR ไม่ใช่เพียงคำเตือน","ใส่ synthetic monitoring หรือ post-deploy check ต่อเนื่องสำหรับ production เพื่อจับปัญหาหลังปล่อยได้ในนาทีแรก","แยกบทบาท: unit test และ lint จับข้อผิดพลาดของโค้ดตั้งแต่ต้น ส่วน deployment validation จับข้อผิดพลาดของการ deploy และ environment ทั้งสองจำเป็นและไม่ทดแทนกัน"],"examFocus":["ถ้าเจอ pipeline เขียวแต่แอป crash ตอนเริ่มเพราะ config ผิด ให้เพิ่ม health check, smoke test หลัง deploy และเงื่อนไข rollout พร้อมย้อนกลับอัตโนมัติ","ถ้าเจอโจทย์ถามว่าสิ่งใดจับปัญหาของ environment ได้ ให้เลือกการตรวจหลัง deploy ไม่ใช่ unit test หรือ lint","ถ้าเจอโจทย์ถามว่าการตรวจใดต้องทำก่อน deploy ให้ตอบ unit test, lint, type check และ IaC validation","ถ้าเจอ deploy ไป Kubernetes ที่ pipeline ไม่รู้ว่าสำเร็จหรือไม่ ให้ใช้ rollout status และ readiness probe"],"pitfalls":["ใช้ unit test และ lint เพียงอย่างเดียวเป็นหลักฐานว่า deploy สำเร็จ","ตรวจเพียงว่าคำสั่ง deploy คืน exit code 0","health check ที่ตอบ 200 เสมอโดยไม่ตรวจ dependency ที่จำเป็น","ตั้ง lint เป็นคำเตือนอย่างเดียวจนไม่มีใครแก้"],"example":{"lang":"yaml","code":"- script: kubectl rollout status deployment/api --timeout=120s\n  displayName: Wait for rollout\n- script: |\n    curl --fail --retry 5 --retry-delay 5 \\\n      https://staging.example.com/health\n  displayName: Smoke test\n- script: kubectl rollout undo deployment/api\n  displayName: Rollback on failure\n  condition: failed()"}}]}}</script>
<script>
/*
 * Scoring for one question. Pure function, no DOM, no Node-only APIs.
 * Loaded as a classic script in the browser (exposes window.ExamScoring)
 * and via require() from Node tests (module.exports).
 *
 * Rules (see the scoring table in the project context):
 *  - nothing selected                      -> 0
 *  - more options selected than correct    -> negative ? -penalty : 0
 *    (this overrides any partial credit)
 *  - otherwise                             -> right * max / k
 *                                             minus (negative only) wrong * penalty / k
 *    where k is the number of correct options.
 */
(function (root) {
  'use strict';

  function unique(list) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var key = String(list[i]);
      if (!seen[key]) {
        seen[key] = true;
        out.push(key);
      }
    }
    return out;
  }

  function clean(n) {
    // remove float noise and negative zero
