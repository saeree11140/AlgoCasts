์ และข้อความ error ที่ชัดเจน","ถ้าเจอคำถามทำให้หน้าเว็บรองรับมือถือ ให้ตอบ viewport meta + media query/flex/grid","ถ้าเจอคำถามหาสาเหตุ layout เพี้ยน ให้เปิด DevTools ตรวจ Elements/Console/Network"],"pitfalls":["ใช้ `div` ทำปุ่มโดยไม่ใส่ role และการจัดการคีย์บอร์ด","ใช้ placeholder แทน label","ล็อกขนาดฟอนต์หรือความสูงเป็น px ทำให้ผู้ใช้ที่ต้องการตัวอักษรใหญ่อ่านไม่ได้","ใช้สีแดงอย่างเดียวบอกว่าช่องกรอกผิด"],"example":{"lang":"html","code":"<label for='email'>อีเมล</label>\n<input id='email' type='email' autocomplete='email' required>\n\n<button type='button' aria-label='ปิดหน้าต่าง'>\n  <svg aria-hidden='true' width='16' height='16'><path d='M4 4l8 8M12 4l-8 8'/></svg>\n</button>"}},{"descriptor":"TST-J1","competency":"Unit & Functional Testing","title":"เขียน unit test สำหรับโมดูลของตัวเอง","summary":"Unit test ตรวจพฤติกรรมของหน่วยเล็กที่สุดแบบแยกส่วน เพื่อจับบั๊กเร็วและให้ความมั่นใจเวลา refactor การเขียนให้แม่นยำ อิสระต่อกัน และอ่านง่ายเป็นสิ่งสำคัญ","keyPoints":["โครงสร้างมาตรฐาน AAA: Arrange (เตรียมข้อมูล), Act (เรียกสิ่งที่ทดสอบ), Assert (ตรวจผล)","unit test ที่ดีมีคุณสมบัติแบบ FIRST: Fast, Isolated/Independent, Repeatable, Self-validating, Timely","แต่ละเทสต์ควรตรวจพฤติกรรมเดียว ชื่อบอกสถานการณ์และผลที่คาด เช่น `returns 0 discount when cart is empty`","เทสต์ต้องอิสระต่อกัน ลำดับการรันไม่ควรมีผล ถ้า instance หรือ state ใช้ร่วมกันข้ามเทสต์จะเกิด order dependence ให้สร้างใหม่ใน `beforeEach`","assertion ต้องเฉพาะเจาะจงพอจะจับค่าผิดได้ เช่น `expect(rate).toBe(0.07)` ดีกว่า `toBeTruthy()` ที่ผ่านแม้ค่าผิด","เลขทศนิยมลอยตัวเปรียบเทียบด้วย `toBeCloseTo` แทน `toBe` ใน Jest/Vitest","เฟรมเวิร์กยอดนิยม: Jest และ Vitest (JS/TS), JUnit (Java), pytest (Python), xUnit/NUnit (.NET)","เทสต์ที่ผ่านทุกครั้งไม่ได้แปลว่าดี ต้องแน่ใจว่าเทสต์ล้มเมื่อโค้ดผิด (ลองทำให้โค้ดผิดแล้วดูว่าเทสต์จับได้)","code coverage สูงไม่ได้รับประกันคุณภาพของ assertion เป็นเพียงตัวชี้วัดว่าบรรทัดใดถูกรัน","test pyramid: ควรมี unit test จำนวนมาก, integration น้อยลง และ end-to-end น้อยที่สุด เพราะช้าและเปราะ"],"examFocus":["ถ้าเจอเทสต์ที่ผ่านแม้ค่าที่คืนผิด ให้ชี้ว่า assertion หลวมเกินไป และใช้ค่าที่คาดเฉพาะเจาะจง","ถ้าเจอเทสต์ที่ล้มเมื่อรันสลับลำดับ ให้ชี้ว่าแชร์ state และแก้ด้วยการสร้างใหม่ในแต่ละเทสต์","ถ้าเจอคำถามลักษณะของ unit test ที่ดี ให้เลือก เร็ว อิสระ ทำซ้ำได้ ตรวจผลอัตโนมัติ","ถ้าเจอโจทย์ว่าควรเรียงเทสต์อย่างไร ให้ตอบ AAA"],"pitfalls":["ให้เทสต์พึ่งผลของเทสต์ก่อนหน้า","เขียนเทสต์ที่ไม่มี assertion หรือตรวจแค่ว่าไม่ error","เทสต์หนึ่งตรวจหลายเรื่องจนไม่รู้ว่าอะไรพัง","ดู coverage 100% แล้วสรุปว่าไม่มีบั๊ก"],"example":{"lang":"typescript","code":"describe('calcDiscount', () => {\n  let cart: Cart;\n  beforeEach(() => {\n    cart = new Cart();             // สร้างใหม่ทุกเทสต์\n  });\n\n  it('returns 0 when cart is empty', () => {\n    expect(calcDiscount(cart)).toBe(0);\n  });\n\n  it('applies 10 percent for totals over 1000', () => {\n    cart.add({ price: 1200, qty: 1 });\n    expect(calcDiscount(cart)).toBeCloseTo(120);\n  });\n});"}},{"descriptor":"WEB-J2","competency":"Web & Mobile Development","title":"ความปลอดภัยฝั่ง frontend/มือถือ และการส่งแอปขึ้น store","summary":"ผู้พัฒนา frontend และแอปมือถือต้องป้องกันช่องโหว่พื้นฐาน เช่น XSS และ CSRF เก็บ token อย่างปลอดภัย ขอสิทธิ์เท่าที่จำเป็น และเตรียมแอปให้ผ่านขั้นตอนส่งขึ้น App Store และ Google Play","keyPoints":["XSS (Cross-Site Scripting) คือการแทรกสคริปต์ผ่านข้อมูลที่ผู้ใช้ควบคุมแล้วถูกแสดงบนหน้าเว็บ มีแบบ reflected, stored และ DOM-based","ป้องกัน XSS: encode/escape ข้อมูลตอนแสดงผล ใช้ `textContent` แทน `innerHTML`; React escape ให้โดยค่าเริ่มต้น แต่ `dangerouslySetInnerHTML` ข้ามการป้องกันนั้น","ถ้าต้องแสดง HTML จากผู้ใช้จริง ให้ sanitize ด้วยไลบรารีที่เชื่อถือได้ เช่น DOMPurify และเสริมด้วย Content-Security-Policy (CSP)","CSRF คือการหลอกให้เบราว์เซอร์ที่ล็อกอินอยู่ส่งคำขอที่ไม่ได้ตั้งใจ ป้องกันด้วย CSRF token และ cookie แบบ `SameSite` (Lax หรือ Strict)","cookie ที่เก็บ session/token ควรตั้ง `HttpOnly` (JS อ่านไม่ได้), `Secure` (ส่งเฉพาะ HTTPS) และ `SameSite`","บนเว็บ `localStorage` ถูกอ่านได้ด้วยสคริปต์ จึงเสี่ยงถ้ามี XSS ทำให้ token ที่เก็บไว้ถูกขโมย","บนมือถือเก็บ token ในที่เก็บที่ปลอดภัยของระบบ: Keychain (iOS) และ Keystore/EncryptedSharedPreferences (Android) ไม่ใช้ SharedPreferences/UserDefaults/AsyncStorage แบบข้อความธรรมดาเก็บความลับ","ขอสิทธิ์ (permission) เท่าที่จำเป็น ขอในจังหวะที่ใช้งานจริงพร้อมอธิบายเหตุผล และรองรับกรณีผู้ใช้ปฏิเสธโดยที่แอปยังใช้ส่วนอื่นได้","เช็กลิสต์ส่งขึ้น store: เพิ่มเลขเวอร์ชัน/build, ลงนามแอป (signing), นโยบายความเป็นส่วนตัว (privacy policy) และการประกาศข้อมูล (App Privacy บน App Store, Data safety บน Google Play), ภาพหน้าจอและคำอธิบาย, บัญชีทดสอบสำหรับผู้ตรวจ, ทดสอบบนอุปกรณ์จริง","ช่องทางส่ง: App Store Connect (iOS) และ Google Play Console (Android) ; Google Play ใช้ไฟล์ Android App Bundle (.aab) สำหรับแอปใหม่"],"examFocus":["ถ้าเจอโจทย์แสดงข้อความที่ผู้ใช้กรอกบนหน้าเว็บ ให้ escape/ใช้ `textContent` ไม่ใช้ `innerHTML`","ถ้าเจอคำถามที่เก็บ token บนมือถือ ให้ตอบ Keychain หรือ Keystore","ถ้าเจอแอปที่ขอสิทธิ์กล้อง/ตำแหน่ง/รายชื่อติดต่อตั้งแต่เปิดแอป ให้ปรับเป็นขอเมื่อจะใช้ฟีเจอร์นั้นและขอเท่าที่จำเป็น","ถ้าเจอคำถามป้องกัน CSRF ให้ตอบ CSRF token หรือ SameSite cookie","ถ้าเจอเช็กลิสต์ก่อนส่งแอป ให้เลือก privacy policy, เวอร์ชัน, signing, ภาพหน้าจอ, ทดสอบบนเครื่องจริง"],"pitfalls":["เชื่อว่า framework อย่าง React กัน XSS ได้ทุกกรณี ทั้งที่ใช้ `dangerouslySetInnerHTML` แล้วเสี่ยง","เก็บ token ในที่เก็บข้อความธรรมดาของแอป","ขอสิทธิ์ทั้งหมดไว้ก่อนเผื่อใช้ ทำให้ผู้ใช้ไม่ไว้ใจและอาจถูก store ปฏิเสธ","ซ่อนปุ่มฝั่ง client แล้วคิดว่าปลอดภัย โดยไม่ตรวจสิทธิ์ที่ server"],"example":{"lang":"typescript","code":"// ปลอดภัย: ใส่เป็นข้อความ ไม่ถูกตีความเป็น HTML\nel.textContent = userComment;\n\n// เสี่ยง XSS ถ้า userComment มีสคริปต์\n// el.innerHTML = userComment;\n\n// ถ้าจำเป็นต้องแสดง HTML ให้ sanitize ก่อน\nel.innerHTML = DOMPurify.sanitize(userComment);"}},{"descriptor":"MON-J4","competency":"Monitoring and Logging","title":"วิเคราะห์ปัญหาด้วยข้อมูล monitoring และ observability","summary":"การแก้ปัญหาที่ดีเริ่มจากข้อมูล ไม่ใช่การเดา ต้องเชื่อมโยง metrics, logs และ traces เข้ากับเวลาและการเปลี่ยนแปลงของระบบ เพื่อหาจุดที่เป็นสาเหตุ","keyPoints":["เริ่มจากอาการ (symptom) ที่ผู้ใช้เห็น เช่น latency สูงหรือ error rate เพิ่ม แล้วค่อย ๆ ตีกรอบว่าอยู่ชั้นใด (client, network, API, ฐานข้อมูล)","เทียบ metrics หลายตัวในช่วงเวลาเดียวกัน เช่น error rate ที่เพิ่มพร้อม CPU, memory, connection pool หรือ queue ที่ใกล้เต็ม เพื่อหา correlation","ตรวจการเปลี่ยนแปลงล่าสุดที่ตรงช่วงเวลา เช่น deploy, config change, traffic spike (ใช้ deploy marker บนกราฟ) แต่ correlation ไม่เท่ากับ causation ต้องยืนยันด้วยข้อมูลเพิ่ม","distributed trace ช่วยหา span ที่ช้าที่สุด ถ้าเวลาส่วนใหญ่อยู่ใน span ฝั่ง backend ปัญหาอยู่ที่ backend ถ้าอยู่ที่ฝั่ง client หรือ network ให้ตรวจที่นั้น","ในมือถือ ให้แยกว่าเวลาหายไปที่ไหน: การเรนเดอร์ในแอป, เครือข่าย, หรือเวลาตอบของ API โดยดูจาก trace/ข้อมูล performance ของแอป","กรองข้อมูลตามมิติ เช่น เวอร์ชันแอป, รุ่นอุปกรณ์, OS, region, endpoint ; หากปัญหาเกิดเฉพาะบางมิติ แสดงว่าตีกรอบได้แล้ว","แอปเวอร์ชันเก่าอาจพังเมื่อ API เปลี่ยนแบบไม่รองรับย้อนหลัง (breaking change) ผู้ใช้อัปเดตแอปไม่พร้อมกัน จึงต้องรักษา backward compatibility, ทำ API versioning (เช่น `/v1`) หรือบังคับอัปเดตอย่างมีแผน","ตั้งสมมติฐาน ทดสอบทีละข้อ และเปลี่ยนทีละอย่าง เพื่อรู้ว่าอะไรได้ผล พร้อมบันทึกสิ่งที่พบ","ดู saturation (ทรัพยากรใกล้เต็ม) ควบคู่กับ error และ latency เพราะมักเป็นสาเหตุก่อนระบบล่ม"],"examFocus":["ถ้าเจอโจทย์ error เพิ่มหลัง deploy ไม่นาน ให้เทียบเวลา deploy กับกราฟ และพิจารณา rollback ขณะตรวจสาเหตุ","ถ้าเจอ trace ที่แสดงว่า span ของฐานข้อมูลใช้เวลาเกือบทั้งหมด ให้ตรวจ query และ connection pool","ถ้าเจอข้อมูลว่า crash หรือ error เกิดเฉพาะแอปเวอร์ชันเก่า ให้สงสัยการเปลี่ยน API ที่ไม่เข้ากันย้อนหลัง","ถ้าเจอเมตริกหลายตัวผิดปกติพร้อมกัน ให้เรียงตามเวลาเพื่อหาว่าตัวไหนเปลี่ยนก่อน","ถ้าเจอคำถามขั้นแรกของการ troubleshoot ให้ตอบว่ารวบรวมข้อมูลและตีกรอบอาการก่อนแก้"],"pitfalls":["เดาสาเหตุแล้วแก้ทันทีโดยไม่ดูข้อมูล","สรุปว่าการ deploy เป็นสาเหตุเพียงเพราะเวลาตรงกัน โดยไม่ตรวจเพิ่ม","ดูเฉพาะค่าเฉลี่ยรวมซึ่งซ่อนปัญหาที่เกิดเฉพาะบางกลุ่มผู้ใช้","เปลี่ยนหลายอย่างพร้อมกันจนไม่รู้ว่าอะไรแก้ปัญหา"]},{"descriptor":"WEB-J3","competency":"Web & Mobile Development","title":"Backend route, CRUD กับฐานข้อมูล และ authentication","summary":"งาน backend พื้นฐานคือสร้าง route/REST API เชื่อมฐานข้อมูลเพื่อ CRUD และยืนยันตัวตนผู้ใช้ด้วย session หรือ JWT โดยต้องเก็บรหัสผ่านและเขียน query อย่างปลอดภัย","keyPoints":["route ผูก HTTP method กับ path เข้ากับ handler เช่น ใน Express: `app.get('/users/:id', handler)` ; middleware ใช้ร่วมกัน เช่น ตรวจ auth, parse body","CRUD แมปกับ HTTP: Create = POST, Read = GET, Update = PUT/PATCH, Delete = DELETE","ห้ามเก็บรหัสผ่านเป็นข้อความธรรมดา ให้ hash ด้วยอัลกอริทึมที่ออกแบบมาสำหรับรหัสผ่านและช้าโดยตั้งใจ เช่น bcrypt, scrypt หรือ Argon2 พร้อม salt (ไลบรารีมักจัดการ salt ให้)","การใช้ hash เร็วอย่าง MD5 หรือ SHA-256 ล้วน ๆ เก็บรหัสผ่านไม่เหมาะ เพราะเดารหัสแบบ brute force ได้เร็ว","ป้องกัน SQL injection ด้วย parameterized query / prepared statement ที่แยกคำสั่งออกจากข้อมูล ไม่ต่อสตริง SQL จากข้อมูลผู้ใช้","JWT ประกอบด้วย header.payload.signature (เข้ารหัสแบบ base64url) ; payload อ่านได้โดยใครก็ตามที่ถือ token จึงห้ามใส่ข้อมูลลับ","การ decode JWT ไม่เท่ากับการ verify ต้อง verify signature ด้วย secret/public key ที่ถูกต้อง และตรวจ `exp` (หมดอายุ) , `iss`, `aud` ; ระบุอัลกอริทึมที่ยอมรับไว้ชัดเจน ไม่เชื่อค่าใน header ตรง ๆ","session-based auth เก็บสถานะที่ server และส่ง session ID ใน cookie ส่วน JWT เป็น stateless แต่เพิกถอนก่อนหมดอายุได้ยากกว่า","ตอบ 401 เมื่อยังไม่ยืนยันตัวตนหรือ token ไม่ถูกต้อง และ 403 เมื่อยืนยันตัวตนแล้วแต่ไม่มีสิทธิ์","เก็บ secret และ connection string ใน environment variable ไม่ commit ลง repository"],"examFocus":["ถ้าเจอโจทย์เก็บรหัสผ่านผู้ใช้ ให้ตอบ hash ด้วย bcrypt/Argon2 พร้อม salt ไม่ใช่เข้ารหัสแบบถอดกลับได้หรือเก็บตรง ๆ","ถ้าเจอโค้ดต่อสตริง SQL ด้วยค่าจากผู้ใช้ ให้ชี้ช่องโหว่ SQL injection และแก้เป็น parameterized query","ถ้าเจอโค้ดที่แค่ decode JWT แล้วเชื่อ payload ให้ชี้ว่าต้อง verify signature และตรวจ exp","ถ้าเจอคำถามเปรียบเทียบ session กับ JWT ให้ตอบเรื่อง stateful กับ stateless และการเพิกถอน","ถ้าเจอโจทย์ map ปฏิบัติการ CRUD เป็น HTTP method ให้ตอบตามตารางด้านบน"],"pitfalls":["เก็บรหัสผ่านแบบ hash เร็วธรรมดาโดยไม่มี salt","คิดว่า JWT เข้ารหัสเนื้อหา ทั้งที่แค่เซ็นไว้ อ่าน payload ได้","ใช้ `jwt.decode` แทน `jwt.verify` ในการตรวจสิทธิ์","ใช้ escape สตริงเองแทน parameterized query"],"example":{"lang":"typescript","code":"app.post('/login', async (req, res) => {\n  const { email, password } = req.body;\n  const { rows } = await db.query(\n    'SELECT id, password_hash FROM users WHERE email = $1',\n    [email]                              // parameterized\n  );\n  const user = rows[0];\n  if (!user || !(await bcrypt.compare(password, user.password_hash))) {\n    return res.status(401).json({ message: 'invalid credentials' });\n  }\n  const token = jwt.sign({ sub: user.id }, process.env.JWT_SECRET, { expiresIn: '15m' });\n  res.json({ token });\n});"}},{"descriptor":"TST-J3","competency":"Unit & Functional Testing","title":"Assertion และ mocking เพื่อแยกโค้ดที่ทดสอบ","summary":"การ mock ช่วยตัดการพึ่งพาภายนอก (ฐานข้อมูล เครือข่าย เวลา) เพื่อให้ unit test เร็วและคาดเดาได้ แต่ต้องเลือก mock เท่าที่จำเป็นและให้ mock ตรงกับของจริง","keyPoints":["test double ประเภทหลัก: dummy (ส่งไปเฉย ๆ), stub (คืนค่าที่กำหนด), fake (implementation ง่าย ๆ ที่ใช้งานได้ เช่น repository ในหน่วยความจำ), mock/spy (บันทึกการเรียกเพื่อตรวจ)","ควร mock ขอบเขตภายนอกที่ช้า ไม่แน่นอน หรือมี side effect: เครือข่าย, ฐานข้อมูล, ส่งอีเมล, เวลา (clock), random","ไม่ควร mock โค้ดที่กำลังทดสอบเอง หรือ value object ง่าย ๆ เพราะจะกลายเป็นทดสอบ mock แทนโค้ดจริง","fake repository แบบ in-memory เหมาะกับการทดสอบ ViewModel/service ที่ไม่ต้องเรียกฐานข้อมูลจริง","เวลาเป็น dependency ที่ควรควบคุม: ใน Jest/Vitest ใช้ fake timers และกำหนดเวลาด้วย `jest.useFakeTimers()` และ `jest.setSystemTime(...)` หรือฉีด clock เข้า class","ตรวจการเรียกด้วย spy/mock: `toHaveBeenCalledWith(...)`, `toHaveBeenCalledTimes(n)`, `not.toHaveBeenCalled()`","ตั้งค่าที่ mock คืน: `jest.fn().mockResolvedValue(x)` สำหรับ async, `mockReturnValue(x)` สำหรับ sync, `mockRejectedValue(err)` สำหรับกรณีล้มเหลว","ล้าง mock ระหว่างเทสต์ (`jest.clearAllMocks()`, `jest.restoreAllMocks()` หรือการตั้งค่า config) เพื่อไม่ให้ state รั่วข้ามเทสต์","mock อาจเพี้ยนไปจากของจริง (contract drift) ทำให้เทสต์ผ่านแต่ระบบจริงพัง ลดความเสี่ยงด้วย contract test, ใช้ type ให้ mock ตรงกับ interface จริง และมี integration test ครอบคลุม","อย่าตรวจรายละเอียด implementation มากเกินไป (เช่น ลำดับการเรียกภายใน) เพราะเทสต์จะพังทุกครั้งที่ refactor ทั้งที่พฤติกรรมไม่เปลี่ยน"],"examFocus":["ถ้าเจอโจทย์ทดสอบ service ที่ส่งอีเมล ให้ mock ตัวส่งอีเมลและตรวจว่าถูกเรียกด้วยค่าที่ถูกต้อง","ถ้าเจอโค้ดที่ใช้เวลาปัจจุบัน ให้ตรึงเวลาด้วย fake clock เพื่อให้ผลคงที่","ถ้าเจอคำถามควร mock อะไร ให้เลือก dependency ภายนอก ไม่ใช่ตัวที่กำลังทดสอบ","ถ้าเจอเทสต์ผ่านแต่ production พังเพราะ API จริงเปลี่ยน ให้ชี้ว่า mock เพี้ยนจากสัญญาจริงและเสนอ contract test","ถ้าเจอคำถามความต่างของ stub, mock, fake ให้ตอบตามนิยามด้านบน"],"pitfalls":["mock ทุกอย่างจนเทสต์ไม่ได้ตรวจโค้ดจริง","ลืมตรวจว่า mock ถูกเรียกด้วยพารามิเตอร์ที่ถูกต้อง ตรวจแค่ว่าถูกเรียก","ใช้ mock ที่ไม่ตรงกับ interface จริงและไม่เคยมีเทสต์ที่ใช้ของจริงเลย","ไม่ล้าง mock ระหว่างเทสต์ทำให้ผลปนกัน"],"example":{"lang":"typescript","code":"it('sends welcome email after signup', async () => {\n  jest.useFakeTimers().setSystemTime(new Date('2025-01-01T00:00:00Z'));\n  const mailer = { send: jest.fn().mockResolvedValue(undefined) };\n  const service = new SignupService(new FakeUserRepo(), mailer);\n\n  await service.signup('a@x.com');\n\n  expect(mailer.send).toHaveBeenCalledTimes(1);\n  expect(mailer.send).toHaveBeenCalledWith('a@x.com', expect.stringContaining('Welcome'));\n  jest.useRealTimers();\n});"}},{"descriptor":"WEB-J4","competency":"Web & Mobile Development","title":"จัดการ error/edge case ฝั่ง backend และหลักการ REST","summary":"API ที่ดีตอบ HTTP status code ที่สื่อความหมาย จัดการข้อมูลผิดปกติได้ และไม่เปิดเผยรายละเอียดภายในให้ผู้โจมตีเห็น","keyPoints":["ใช้ status code ให้ตรงความหมาย: 200 OK, 201 Created (พร้อม `Location`), 204 No Content, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 409 Conflict, 422 Unprocessable Entity, 500 Internal Server Error","ถ้าไม่พบ resource ตาม id ที่ร้องขอ ตอบ 404; แต่ collection ที่ค้นหาแล้วว่างควรตอบ 200 พร้อม list ว่าง ไม่ใช่ 404","ข้อมูลที่ client ส่งมาผิดรูปแบบหรือขาด ตอบ 400 (หรือ 422 ถ้าโครงสร้างถูกแต่ความหมายไม่ผ่านกฎ) พร้อมบอกว่าช่องไหนผิด","ตอบ 409 เมื่อชนกับสถานะปัจจุบัน เช่น สร้างข้อมูลที่ซ้ำกับค่าที่ต้องไม่ซ้ำ","ห้ามส่ง stack trace, ข้อความ error ของฐานข้อมูล, path ภายใน หรือเวอร์ชันซอฟต์แวร์กลับไปให้ client เพราะช่วยให้ผู้โจมตีรู้โครงสร้างระบบ","แนวปฏิบัติ: บันทึกรายละเอียดเต็มใน log ฝั่ง server แล้วตอบ client ด้วยข้อความทั่วไปพร้อมรหัสอ้างอิง (correlation ID) เพื่อใช้ค้นหา log","ใช้ global error handler/middleware จัดการ exception ที่ไม่ได้ดักไว้ให้ตอบ 500 อย่างปลอดภัย แทนที่จะให้ process ล้มหรือเปิดเผยข้อมูล","ใช้รูปแบบ error response ที่สม่ำเสมอ เช่น `{ code, message, details }` หรือ Problem Details (RFC 9457)","ตรวจสอบ (validate) input ที่ขอบระบบเสมอ: ชนิดข้อมูล ความยาว ช่วงค่า เพราะฝั่ง client เชื่อถือไม่ได้","REST: ใช้ URL แทน resource เป็นคำนาม (`/orders/42`) และให้ HTTP method บอกการกระทำ ; GET ต้องไม่เปลี่ยนข้อมูล และ PUT/DELETE เป็น idempotent"],"examFocus":["ถ้าเจอโจทย์ค้นหา resource ด้วย id ที่ไม่มีอยู่ ให้ตอบ 404","ถ้าเจอ response ที่มี stack trace หรือ SQL error ให้ชี้ว่ารั่วข้อมูลภายในและแก้เป็นข้อความทั่วไป + log ฝั่ง server","ถ้าเจอข้อมูลที่ client ส่งมาไม่ผ่าน validation ให้ตอบ 400/422 พร้อมรายละเอียดช่องที่ผิด","ถ้าเจอคำถามเลือก status code ให้จับคู่ตามความหมาย ไม่ใช้ 200 กับทุกกรณีแล้วใส่ error ใน body","ถ้าเจอคำถามความต่าง 401 กับ 403 ให้ตอบว่า 401 คือยังไม่ยืนยันตัวตน 403 คือยืนยันแล้วแต่ไม่มีสิทธิ์"],"pitfalls":["ตอบ 200 พร้อม body ที่บอกว่า error ทำให้ client แยกความสำเร็จไม่ได้","ส่ง error message ดิบจาก exception ให้ client","ตอบ 500 กับความผิดพลาดที่เกิดจากข้อมูล client (ควรเป็น 4xx)","ใช้ 404 กับรายการค้นหาที่ไม่มีผลลัพธ์"],"example":{"lang":"typescript","code":"app.get('/orders/:id', async (req, res) => {\n  const order = await orderRepo.findById(req.params.id);\n  if (!order) return res.status(404).json({ code: 'ORDER_NOT_FOUND', message: 'order not found' });\n  res.json(order);\n});\n\n// global error handler: ไม่รั่วรายละเอียดภายใน\napp.use((err, req, res, next) => {\n  logger.error({ err, requestId: req.id });\n  res.status(500).json({ code: 'INTERNAL_ERROR', message: 'something went wrong', requestId: req.id });\n});"}},{"descriptor":"MON-J3","competency":"Monitoring and Logging","title":"ดูแลรักษาเครื่องมือ monitoring และลด alert noise","summary":"ระบบ monitoring ต้องได้รับการดูแลให้ทำงานถูกต้องและ alert มีคุณค่า ถ้ามี alert มากเกินไปหรือไม่ตรงประเด็น ทีมจะเริ่มเพิกเฉย (alert fatigue) และพลาด incident จริง","keyPoints":["alert ที่ดีต้อง actionable คือมีคนต้องทำอะไรบางอย่างจริง ๆ และเกี่ยวกับอาการที่กระทบผู้ใช้ (symptom-based) มากกว่าตัวเลขภายในที่ไม่ส่งผลอะไร","alert noise คือ alert ที่ถี่ ซ้ำ หรือไม่จำเป็นต้องลงมือ ทำให้เกิด alert fatigue","วิธีลด noise: ปรับ threshold ให้เหมาะกับพฤติกรรมจริง, กำหนดระยะเวลาที่เกินเกณฑ์ต่อเนื่องก่อนแจ้ง (เช่น `for: 5m` ใน Prometheus), กรอง flapping, จัดกลุ่ม/dedupe alert ที่เกี่ยวข้อง","จัดระดับความรุนแรง: ระดับที่ต้องปลุกคนทันที (page) ต่างจากระดับที่รอเช้าได้ (ticket/notification)","ใช้ maintenance window หรือ silence ชั่วคราวระหว่างงานบำรุงรักษาที่วางแผนไว้ เพื่อไม่ให้เกิด alert หลอก และต้องเปิดกลับหลังเสร็จ","ทบทวน alert เป็นระยะ: ลบหรือปรับ alert ที่ไม่เคยมีใครลงมือ หรือที่ผิดพลาดบ่อย และบันทึกเหตุผลของการปรับ","งานดูแล monitoring ประจำ: ตรวจว่า agent/exporter/collector ทำงานอยู่, ตรวจ retention และพื้นที่เก็บข้อมูล, อัปเดต dashboard เมื่อบริการเปลี่ยน, เพิ่ม monitoring ให้บริการใหม่","ทดสอบว่า alert ยังส่งถึงผู้รับจริงและเส้นทาง on-call ถูกต้อง รวมถึงมี heartbeat (dead man's switch) เพื่อรู้เมื่อตัว monitoring เองหยุดทำงาน","ระบุเจ้าของของแต่ละ alert และ runbook ที่อธิบายวิธีตอบสนอง และอัปเดตเมื่อระบบเปลี่ยน"],"examFocus":["ถ้าเจอโจทย์ alert เตือนบ่อยจนทีมเมิน ให้ปรับ threshold/ระยะเวลา ลดซ้ำซ้อน และคงเฉพาะที่ actionable","ถ้าเจอโจทย์ alert หลอกระหว่าง deploy ที่วางแผนไว้ ให้ใช้ maintenance window หรือ silence ที่มีกำหนดเวลา","ถ้าเจอคำถามงานดูแล monitoring ประจำ ให้เลือกตรวจ agent ยังรายงาน, dashboard ถูกต้อง, alert ถึงผู้รับ","ถ้าเจอตัวเลือกปิด alert ทิ้งทั้งหมดเพื่อลด noise ให้ตัดทิ้ง เพราะเสี่ยงพลาด incident จริง"],"pitfalls":["ปิดหรือเมิน alert เพราะรำคาญโดยไม่หาสาเหตุ","ตั้ง threshold ต่ำเกินไป ให้เตือนทุกการกระเพื่อมชั่วคราว","ลืมยกเลิก silence หลังงานเสร็จ","ไม่มีใครรู้ว่า monitoring เองหยุดทำงานเพราะไม่มี heartbeat"]},{"descriptor":"TST-J2","competency":"Unit & Functional Testing","title":"ออกแบบและรัน test case ง่าย ๆ ให้ครอบคลุม","summary":"การออกแบบ test case ที่ดีเริ่มจากข้อกำหนด (spec) เลือกข้อมูลที่ตัวแทนได้ครบ รวมกรณีขอบและกรณีผิดพลาด เพื่อจับบั๊กด้วยจำนวนเทสต์ที่พอเหมาะ","keyPoints":["ผลที่คาดหวัง (expected) ต้องมาจาก spec/ข้อกำหนด ไม่ใช่จากการรันโค้ดแล้วลอกผลออกมา เพราะจะยอมรับบั๊กที่มีอยู่","Boundary value analysis: ทดสอบค่าที่ขอบของช่วงและใกล้ขอบ เช่น ถ้าช่วงที่ถูกคือ 1-100 ให้ลอง 0, 1, 2, 99, 100, 101 เพราะบั๊กชอบเกิดที่ `<` กับ `<=`","Equivalence partitioning: แบ่งอินพุตเป็นกลุ่มที่ควรประพฤติเหมือนกัน แล้วเลือกตัวแทนหนึ่งค่าต่อกลุ่ม เพื่อลดจำนวนเทสต์","ต้องมีทั้ง happy path (กรณีปกติ) และ negative case (อินพุตไม่ถูกต้อง เช่น ว่าง, null, ชนิดผิด, ค่าติดลบ, ยาวเกิน)","ตัวอย่างการออกแบบเทสต์ OTP: ถูกต้อง, ผิด, หมดอายุ, ความยาวไม่ครบ/มีตัวอักษร, ใช้ซ้ำหลังสำเร็จแล้ว, ลองผิดเกินจำนวนครั้งที่กำหนด","test case หนึ่งอันควรระบุ: ชื่อ/ID, เงื่อนไขตั้งต้น, อินพุต, ผลที่คาดหวัง ให้ตรวจผลแบบอัตโนมัติได้","table-driven / parameterized test (เช่น `test.each` ใน Jest, `@pytest.mark.parametrize`) ช่วยรันหลายชุดข้อมูลด้วยโค้ดเทสต์เดียว","ตั้งชื่อเทสต์ให้บอกสถานการณ์และผลที่คาด เมื่อล้มจะรู้ทันทีว่าอะไรพัง","เมื่อเจอบั๊ก ควรเขียนเทสต์ที่ล้มด้วยบั๊กนั้นก่อนแก้ แล้วแก้จนผ่าน เพื่อกันการกลับมาซ้ำ (regression test)","ผลของเทสต์ต้องกำหนดแน่นอน หลีกเลี่ยงการพึ่งเวลา สุ่ม หรือข้อมูลภายนอกที่เปลี่ยนไปมา"],"examFocus":["ถ้าเจอฟังก์ชันที่รับค่าตามช่วง ให้เลือกเทสต์ที่ขอบล่าง ขอบบน และเลยขอบออกไปหนึ่งค่า","ถ้าเจอชุดเทสต์ที่มีแต่กรณีปกติ ให้ชี้ว่าขาด negative case เช่น อินพุตว่างหรือรูปแบบผิด","ถ้าเจอคำถามว่าจะรู้ผลที่คาดจากไหน ให้ตอบว่าจากข้อกำหนดของระบบ","ถ้าเจอโจทย์ออกแบบเทสต์ของการตรวจรหัส OTP ให้ครอบคลุมถูก ผิด หมดอายุ รูปแบบผิด และจำกัดจำนวนครั้ง","ถ้าเจอข้อมูลทดสอบหลายชุดที่ตรรกะเดียวกัน ให้ใช้ parameterized test"],"pitfalls":["ทดสอบเฉพาะค่ากลางของช่วงแล้วคิดว่าครอบคลุม","ลอกผลจากโค้ดมาเป็น expected value","ลืมกรณี null หรือข้อมูลว่าง","เขียนเทสต์จำนวนมากที่ซ้ำกันทั้งที่อยู่ใน equivalence class เดียวกัน"],"example":{"lang":"typescript","code":"describe('isValidAge (accepts 18-60)', () => {\n  test.each([\n    [17, false],   // ใต้ขอบล่าง\n    [18, true],    // ขอบล่าง\n    [19, true],\n    [59, true],\n    [60, true],    // ขอบบน\n    [61, false],   // เหนือขอบบน\n  ])('age %i -> %s', (age, expected) => {\n    expect(isValidAge(age)).toBe(expected);\n  });\n\n  it('rejects NaN', () => {\n    expect(isValidAge(NaN)).toBe(false);\n  });\n});"}},{"descriptor":"WEB-J5","competency":"Web & Mobile Development","title":"ออกแบบ/เรียกใช้ REST API, token auth และ third-party API","summary":"การทำงานกับ API ต้องเลือก HTTP method ให้ถูก แนบ token อย่างถูกวิธี จัดการ token หมดอายุ และรับมือข้อจำกัดของ API ภายนอก เช่น rate limit","keyPoints":["แมป method: GET อ่านข้อมูล (safe และ idempotent), POST สร้าง resource ใหม่หรือสั่งงาน (ไม่ idempotent), PUT แทนที่ทั้งก้อน, PATCH แก้บางส่วน, DELETE ลบ","ตัวอย่างเส้นทาง: `GET /orders` ดึงรายการ, `GET /orders/42` ดึงรายการเดียว, `POST /orders` สร้างใหม่ และ URL ใช้คำนามไม่ใช่กริยา","ส่ง token ผ่าน header `Authorization: Bearer <token>` ไม่ใส่ใน query string เพราะถูกบันทึกลง log และ history ได้","ตอบ 401 เมื่อ token หมดอายุหรือไม่ถูกต้อง ฝั่ง client ควรจัดการ: ใช้ refresh token ขอ access token ใหม่ แล้วลองเรียกซ้ำหนึ่งครั้ง ถ้ายังไม่ได้ให้พาผู้ใช้ไปล็อกอินใหม่","ระวัง loop ของการ refresh และกรณีมีหลายคำขอล้มพร้อมกัน ควร refresh ครั้งเดียวแล้วให้คำขอที่เหลือรอผล","รับมือ 429 Too Many Requests: อ่าน header `Retry-After` ถ้ามี แล้วรอตามนั้น มิฉะนั้นใช้ exponential backoff ร่วมกับ jitter และจำกัดจำนวนครั้ง ลดการเรียกซ้ำด้วย caching","เมื่อใช้ SDK หรือ REST ของบริการภายนอก: เก็บ API key ไว้ฝั่ง server ไม่ฝังในแอป client, ตั้ง timeout, จัดการ error และตรวจเอกสารว่ามีข้อจำกัดอย่างไร","จัดทำเอกสาร endpoint ด้วยมาตรฐานเช่น OpenAPI/Swagger ระบุ path, method, พารามิเตอร์, ตัวอย่าง request/response และ status code ที่เป็นไปได้","ตอบ JSON ที่สม่ำเสมอ และใช้ pagination (เช่น `limit`/`offset` หรือ cursor) สำหรับรายการยาว","ใช้ HTTPS เสมอเมื่อส่ง token หรือข้อมูลส่วนตัว"],"examFocus":["ถ้าเจอโจทย์เลือก method สำหรับสร้างรายการใหม่ ให้ตอบ POST ; ดึงข้อมูลให้ตอบ GET","ถ้าเจอแอปที่ได้ 401 เพราะ token หมดอายุ ให้ refresh token แล้ว retry หนึ่งครั้ง ถ้าไม่สำเร็จให้ล็อกอินใหม่","ถ้าเจอ API ภายนอกตอบ 429 ให้รอตาม `Retry-After` หรือ backoff แล้วค่อยลองใหม่ ไม่ยิงซ้ำทันที","ถ้าเจอโจทย์ต้องใส่ API key ของบริการภายนอก ให้เรียกผ่าน backend ของเรา ไม่ฝัง key ในแอป","ถ้าเจอคำถามเรื่องเอกสาร API ให้ตอบว่าใช้ OpenAPI/Swagger ระบุ endpoint และตัวอย่าง"],"pitfalls":["ใช้ GET เพื่อสร้างหรือลบข้อมูล","ใส่ token ใน URL query string","ลองเรียกใหม่ทันทีวนไม่หยุดเมื่อได้ 429 ซึ่งทำให้ถูกบล็อกนานขึ้น","เมื่อได้ 401 ให้ล็อกเอาต์ทันทีโดยไม่ลอง refresh token"],"example":{"lang":"typescript","code":"async function apiFetch(url: string, retried = false): Promise<Response> {\n  const res = await fetch(url, {\n    headers: { Authorization: `Bearer ${getAccessToken()}` },\n  });\n  if (res.status === 401 && !retried) {\n    await refreshAccessToken();           // ขอ token ใหม่\n    return apiFetch(url, true);           // ลองซ้ำครั้งเดียว\n  }\n  if (res.status === 429) {\n    const wait = Number(res.headers.get('Retry-After') ?? 1);\n    await new Promise(r => setTimeout(r, wait * 1000));\n  }\n  return res;\n}"}}],"senior":[{"descriptor":"GIT-S1","competency":"Git","title":"Branching workflow: feature, release, hotfix","summary":"เลือกและออกแบบ branching strategy ให้เข้ากับจังหวะ release ของทีมและความพร้อมของ CI/CD เพราะกลยุทธ์ที่ไม่เหมาะจะทำให้เกิด merge conflict สะสมหรือปล่อยของที่ยังไม่พร้อมขึ้น production","keyPoints":["Git Flow มี branch ถาวรสองสาย คือ `main` (โค้ดที่ปล่อยแล้ว มี tag ทุกเวอร์ชัน) และ `develop` (งานรอบถัดไป) บวก branch ชั่วคราว `feature/*`, `release/*`, `hotfix/*`","`feature/*` แตกจาก `develop` และ merge กลับ `develop` เมื่อเสร็จ ควรอายุสั้นและ sync กับ `develop` สม่ำเสมอเพื่อลด conflict","`release/*` แตกจาก `develop` เมื่อฟีเจอร์ครบ: แช่แข็งฟีเจอร์ใหม่ แก้เฉพาะบั๊ก/เอกสาร/เลขเวอร์ชัน แล้ว merge เข้า `main` พร้อม tag และ merge กลับ `develop` เพื่อไม่ให้การแก้หายไป","`hotfix/*` ต้องแตกจากโค้ดที่ production ใช้อยู่จริง (`main` หรือ tag ล่าสุด) ไม่ใช่จาก `develop` ที่มีงานค้างครึ่งทาง แล้ว merge เข้า `main` + ติด tag ใหม่ (เช่น patch version) และนำกลับเข้า `develop` (หรือ `release/*` ถ้ามีอยู่ระหว่างนั้น)","Trunk-based development: ทุกคน commit เข้า `main`/trunk ผ่าน branch อายุสั้นมาก (ประมาณไม่เกิน 1-2 วัน) พึ่ง CI ที่เร็วและ feature flag เพื่อซ่อนงานที่ยังไม่เสร็จ เหมาะกับทีมที่ deploy บ่อย","GitHub Flow เป็นแบบเรียบง่าย: `main` deploy ได้เสมอ แตก branch -> เปิด Pull Request -> review -> merge -> deploy ไม่มี `develop`/`release` แยก","Git Flow เหมาะกับผลิตภัณฑ์ที่ปล่อยเป็นรอบ/ต้องดูแลหลายเวอร์ชันพร้อมกัน (เช่น แอป mobile, ซอฟต์แวร์ที่ลูกค้าติดตั้งเอง) ส่วน trunk-based เหมาะกับเว็บ/SaaS ที่ปล่อยต่อเนื่อง","`git merge --no-ff` สร้าง merge commit เสมอ ทำให้เห็นขอบเขตของ branch ใน history ส่วน fast-forward จะไม่เหลือร่องรอยว่าเคยมี branch","ตั้งชื่อ branch ตามแบบแผน (`feature/ABC-123-login`, `hotfix/2.4.1`) และใช้ branch protection กับ `main`/`release/*` เพื่อบังคับ review และ CI"],"examFocus":["ถ้า production มีบั๊กด่วนแต่ `develop` มีงานที่ยังไม่เสร็จ ให้ถามว่าต้องแตก hotfix จากไหน และต้อง merge/tag อะไรบ้างหลังแก้","ถ้ามี `release/*` เปิดอยู่แล้วเจอบั๊ก ให้แก้บน release branch แล้วส่งกลับ `develop` อย่าให้ `develop` ถูกดึงเข้า release หรือฟีเจอร์ใหม่หลุดเข้า release","ถ้าโจทย์บอกว่า deploy วันละหลายครั้ง มี CI เร็ว และมี feature flag ให้เลือก trunk-based; ถ้าบอกว่าปล่อยเป็นรอบและต้อง hotfix เวอร์ชันเก่า ให้เลือก Git Flow/release branch","ถ้าทีมบ่นว่า feature branch อายุยาวแล้ว merge ยาก ให้ตอบด้วยการแบ่งงานให้เล็กลง merge บ่อยขึ้น และใช้ feature flag","ถ้าต้องดูแลหลายเวอร์ชันที่ลูกค้าใช้อยู่ ให้มี maintenance branch เช่น `release/2.x` และ cherry-pick การแก้ข้ามไป"],"pitfalls":["แตก hotfix จาก `develop` ทำให้โค้ดงานค้างที่ยังไม่ผ่าน release หลุดขึ้น production ไปด้วย","merge hotfix/release เข้า `main` อย่างเดียวโดยไม่นำกลับ `develop` ทำให้บั๊กเดิมกลับมาในรอบถัดไป","คิดว่า trunk-based แปลว่าไม่มี branch หรือไม่มี review: จริงๆ ยังมี branch/PR แต่อายุสั้นมาก และต้องมี automated test ที่เชื่อถือได้","คิดว่า Git Flow ดีที่สุดเสมอ: ในทีมที่ deploy ต่อเนื่อง branch จำนวนมากเป็นภาระและทำให้ integration ช้า"]},{"descriptor":"GIT-S2","competency":"Git","title":"แก้ merge conflict ซับซ้อนและ rebase","summary":"เข้าใจว่า merge กับ rebase ต่างกันอย่างไร เมื่อไรควรเขียน history ใหม่ และเมื่อไรห้ามทำ เพื่อให้ได้ history ที่สะอาดโดยไม่ทำให้งานของเพื่อนร่วมทีมพัง","keyPoints":["`git merge` รวม history สองสายด้วย merge commit และไม่แก้ commit เดิม ส่วน `git rebase` ยก commit ของ branch ไปต่อบน base ใหม่ ทำให้ได้ commit ใหม่ (hash เปลี่ยน) และ history เป็นเส้นตรง","กฎทอง: อย่า rebase branch ที่ push แล้วและมีคนอื่นใช้/อิงอยู่ เพราะ history ที่เขียนใหม่จะไม่ตรงกับของคนอื่น ทำให้เกิด commit ซ้ำและ conflict ซ้อน","กับ shared feature branch ทางปลอดภัยคือ `git merge main` เข้ามา; ถ้าจำเป็นต้อง rebase ต้องตกลงเวลากับทุกคนและให้ทุกคน reset/rebase ตามหลัง push","ถ้าต้อง force push หลัง rebase ให้ใช้ `git push --force-with-lease` แทน `--force` เพราะจะปฏิเสธถ้า remote มี commit ใหม่ที่เรายังไม่เห็น","Conflict marker: `<<<<<<<` (ฝั่งเรา) `=======` `>>>>>>>` (ฝั่งที่เอามารวม) แก้ไฟล์ให้ถูก แล้ว `git add` และ `git rebase --continue` (หรือ `git merge --continue`); เลิกได้ด้วย `--abort`","ระหว่าง rebase ความหมาย `ours`/`theirs` สลับกัน: `ours` คือ branch ปลายทางที่กำลังต่อบน ส่วน `theirs` คือ commit ของเราที่กำลังถูก replay","`git rebase -i` ใช้ `squash`/`fixup` รวม commit, `reword` แก้ข้อความ, `drop` ลบ, สลับลำดับ เหมาะทำความสะอาด commit ก่อนเปิด PR","`git rebase --onto <newbase> <oldbase> <branch>` ย้ายเฉพาะ commit ที่อยู่หลัง `<oldbase>` ไปต่อบน `<newbase>` ใช้บ่อยเมื่อ branch แรกถูก squash merge เข้า main แล้ว branch ที่แตกต่อจากมันต้องตัด commit เก่าทิ้ง","Squash merge สร้าง commit ใหม่หนึ่งอันบน main โดยไม่ถือว่า commit เดิมเป็นบรรพบุรุษ จึงทำให้ rebase/merge แบบปกติของ branch ลูกเจอ conflict ซ้ำ","`git rerere` (reuse recorded resolution) จำวิธีแก้ conflict ที่เคยแก้แล้ว เหมาะกับ long-lived branch ที่ rebase/merge ซ้ำบ่อยๆ; `merge.conflictStyle=zdiff3` (หรือ `diff3`) แสดง base ด้วยทำให้แก้ง่ายขึ้น"],"examFocus":["ถ้ามีหลายคนทำงานบน feature branch เดียวกันและต้องอัปเดตจาก main ให้เลือก merge ไม่ใช่ rebase + force push","ถ้า branch ลูกแตกจาก branch แม่ที่ถูก squash merge ไปแล้ว ให้ใช้ `git rebase --onto main <old-parent> <child>`","ถ้า long-lived branch เจอ conflict ซ้ำๆ ทุกครั้งที่ sync ให้ merge main เข้ามาบ่อยขึ้น เปิด `rerere` และแบ่งงานให้สั้นลง","ถ้าต้องการ history เส้นตรงใน main ให้เลือก rebase ก่อน merge แบบ fast-forward หรือ squash merge และตั้ง branch protection ให้บังคับ linear history","ถ้า rebase ผิดพลาดกลางทาง ให้ `git rebase --abort` หรือกู้ด้วย `git reflog`"],"pitfalls":["คิดว่า rebase ปลอดภัยเสมอ: มันเขียน history ใหม่ จึงอันตรายกับ branch ที่แชร์กัน","ใช้ `git push --force` ตรงๆ จนทับ commit ของเพื่อนร่วมทีม ควรใช้ `--force-with-lease` อย่างน้อย","แก้ conflict โดยเลือกฝั่งเดียวทั้งไฟล์ (`--ours`/`--theirs`) โดยไม่อ่านว่าอีกฝั่งเปลี่ยนอะไร ทำให้งานหาย","สับสน ours/theirs ระหว่าง rebase กับ merge ซึ่งความหมายกลับกัน"]},{"descriptor":"GIT-S3","competency":"Git","title":"Tagging และ release management","summary":"ใช้ tag ระบุจุดปล่อยเวอร์ชันที่ตรวจย้อนได้ และจัดการ rollback/release อย่างปลอดภัย เพื่อให้รู้ว่า production รันโค้ดชุดไหนอยู่","keyPoints":["Lightweight tag (`git tag v1.2.0`) เป็นแค่ pointer ไปที่ commit; annotated tag (`git tag -a v1.2.0 -m 'msg'`) เป็น object แยกที่เก็บชื่อผู้ tag วันเวลา ข้อความ และสามารถเซ็นด้วย GPG ได้ (`-s`) จึงเหมาะกับ release","`git push` ไม่ส่ง tag ไปให้โดยอัตโนมัติ ต้อง `git push origin v1.2.0` หรือ `git push --tags`","Semantic Versioning `MAJOR.MINOR.PATCH`: MAJOR เมื่อมี breaking change, MINOR เมื่อเพิ่มฟีเจอร์แบบเข้ากันได้, PATCH เมื่อแก้บั๊กที่เข้ากันได้","`git describe` ใช้ tag ล่าสุดสร้างชื่อเวอร์ชันจาก commit (ค่าเริ่มต้นนับเฉพาะ annotated tag) นิยมใช้ฝังเลขเวอร์ชันใน build","`git tag -l 'v2.*'` แสดงรายการ tag และ `git show v1.2.0` ดูรายละเอียด; `git checkout v1.2.0` จะเข้าสู่ detached HEAD","Release tag ควรถือเป็น immutable: ห้ามย้ายหรือลบแล้วสร้างใหม่หลังเผยแพร่แล้ว เพราะคนอื่น/ระบบ build อาจ cache หรืออิง hash เดิมอยู่ ถ้าพบปัญหาให้ออก tag ใหม่ (เช่น `v1.2.1`)","Rollback ทำได้สองทาง: deploy artifact/tag เวอร์ชันก่อนหน้า (เร็ว ไม่แก้ history) หรือ fix-forward ออกเวอร์ชันแก้ไขใหม่ บน `main` ใช้ `git revert` แทน reset","แพลตฟอร์มอย่าง GitHub/GitLab รองรับ protected tags/tag rules เพื่อจำกัดว่าใครสร้างหรือลบ release tag ได้","Build ที่ deploy ควรผูกกับ tag + artifact ที่ build ครั้งเดียว (build once, deploy many) เพื่อให้สิ่งที่ทดสอบเท่ากับสิ่งที่ปล่อย"],"examFocus":["ถ้าต้องการบันทึกว่าใคร release เมื่อไรและมีข้อความประกอบ ให้ใช้ annotated tag ไม่ใช่ lightweight","ถ้า production พังหลัง deploy v2.4.0 และมี v2.3.5 ที่เสถียร ให้เลือกระหว่าง rollback ไปที่ tag ก่อนหน้าเพื่อกู้บริการก่อน แล้วค่อยแก้และออก patch","ถ้ามีคนอยากย้าย tag ที่ปล่อยไปแล้วให้ชี้ commit ใหม่ ให้ปฏิเสธ แล้วออก tag เวอร์ชันใหม่แทน","ถ้าทีมอื่น clone แล้วไม่เห็น tag ให้ตรวจว่าได้ push tag แล้วหรือยัง","ถ้าเลือกเลขเวอร์ชัน ให้ดูว่าการเปลี่ยนแปลง break API เดิมหรือไม่ เพื่อกำหนด MAJOR/MINOR/PATCH"],"pitfalls":["คิดว่า `git push` จะส่ง tag ไปด้วย ซึ่งไม่จริง","ลบแล้วสร้าง tag เดิมใหม่เพื่อ 'แก้' release ทำให้ผู้ที่ดึง tag ไปแล้วมี hash ไม่ตรงกับ remote และตรวจย้อนไม่ได้","ใช้ `git reset --hard` + force push บน `main` เพื่อ rollback production ซึ่งเขียน history ทับและกระทบทีม","ใช้ branch name เช่น `main` แทน tag เป็นตัวอ้างอิงเวอร์ชันที่ deploy ซึ่งเปลี่ยนค่าได้ตลอดเวลา"]},{"descriptor":"GIT-S4","competency":"Git","title":"คำสั่งขั้นสูง: cherry-pick, revert, stash, reflog, patch","summary":"รู้จักเครื่องมือจัดการ history และการแก้ไขที่เลือกใช้ให้ถูกสถานการณ์ โดยเฉพาะตอนต้องกู้งานหรือแก้บน branch ที่แชร์กับคนอื่น","keyPoints":["`git cherry-pick <sha>` คัดลอกการเปลี่ยนแปลงของ commit หนึ่งไปสร้าง commit ใหม่บน branch ปัจจุบัน (hash ต่างจากเดิม) ใช้ย้ายการแก้บั๊กไป `release/*` หรือ maintenance branch; ใส่ `-x` เพื่อบันทึก sha ต้นทางในข้อความ commit","cherry-pick ช่วงได้ด้วย `A..B` (ไม่รวม A) และ `-n`/`--no-commit` เพื่อรวมหลายการแก้เป็น commit เดียว; ถ้าเจอ conflict ใช้ `--continue` หรือ `--abort`","การ revert merge commit ต้องระบุ parent ด้วย `git revert -m 1 <merge-sha>` (parent 1 คือสายที่ merge เข้าไป เช่น `main`) การ revert สร้าง commit ใหม่ที่ย้อนผล จึงปลอดภัยบน branch ที่แชร์","หลัง revert merge แล้ว ถ้าจะ merge branch เดิมอีกครั้ง Git จะถือว่า commit เหล่านั้นถูก merge ไปแล้วและไม่นำกลับ ต้อง revert ตัว revert นั้นก่อน (หรือสร้าง commit ใหม่)","`git reset --soft/--mixed/--hard`: soft ย้าย HEAD อย่างเดียว, mixed (ค่าเริ่มต้น) ล้าง staging ด้วย, hard ล้าง working tree ด้วย; reset เขียน history ใหม่จึงไม่ควรใช้กับ commit ที่ push แล้ว ให้ใช้ `revert` แทน","`git stash push -m 'msg'` เก็บงานค้างชั่วคราวเพื่อสลับ branch; ค่าเริ่มต้นไม่รวมไฟล์ untracked (ต้องใส่ `-u`) และไม่รวมไฟล์ ignored (ต้อง `-a`); `stash pop` ใช้แล้วลบทิ้งส่วน `stash apply` เก็บไว้ในรายการ","`git stash list`, `git stash show -p`, `git stash branch <name>` (สร้าง branch จาก stash) ใช้จัดการหลายรายการ","`git reflog` บันทึกการเคลื่อนของ HEAD/branch ในเครื่อง ใช้กู้ commit ที่หายหลัง `reset --hard` หรือ rebase พลาด เช่น `git reset --hard HEAD@{2}`; reflog เป็นของเครื่องนั้นเท่านั้น และมีอายุจำกัด (ค่าเริ่มต้นประมาณ 90 วันสำหรับ entry ที่ยังเข้าถึงได้ และ 30 วันสำหรับที่เข้าถึงไม่ได้)","สร้าง patch: `git format-patch -<n>` เช่น `-3` หรือ `origin/main..HEAD` (หนึ่งไฟล์ต่อ commit พร้อม author/ข้อความ) แล้วนำไปใช้ด้วย `git am`; `git diff > change.patch` แล้ว `git apply` ใช้กับการเปลี่ยนแปลงที่ไม่มี metadata","`git commit --amend` แก้ commit ล่าสุด และ `git bisect` ค้นหา commit ที่ทำให้เกิดบั๊กด้วย binary search"],"examFocus":["ถ้าต้องส่งการแก้บั๊กหนึ่ง commit ไปยัง release branch โดยไม่เอา commit อื่นของ develop ให้ใช้ cherry-pick","ถ้าต้องย้อน merge ที่เข้า `main` ไปแล้วและมีคนดึงไปแล้ว ให้ `git revert -m 1` ไม่ใช่ reset + force push","ถ้ากำลังแก้งานแล้วต้องสลับไปแก้บั๊กด่วน ให้ `stash` (พร้อม `-u` ถ้ามีไฟล์ใหม่) แล้วกลับมา `stash pop`","ถ้า `git reset --hard` ทำ commit หาย ให้ดู `git reflog` แล้ว reset ไปที่ entry ก่อนหน้า","ถ้าต้องแชร์การเปลี่ยนแปลงโดยไม่มี remote ร่วมกัน ให้ใช้ `format-patch` / `am`"],"pitfalls":["revert merge commit โดยไม่ใส่ `-m` จะ error เพราะ Git ไม่รู้ว่าจะย้อนฝั่งไหน","คิดว่า stash เก็บไฟล์ใหม่ที่ยังไม่ track ให้ด้วยโดยอัตโนมัติ","คิดว่า reflog กู้ได้ทุกเครื่องหรือตลอดไป: มันเป็นข้อมูลในเครื่องและหมดอายุ","cherry-pick ซ้ำกับ merge ภายหลังอาจเกิด conflict/commit ซ้ำ เพราะ Git ไม่รู้ว่าสอง commit เป็นการเปลี่ยนเดียวกัน"]},{"descriptor":"GIT-S5","competency":"Git","title":"Access control และ code review สำหรับทีม distributed","summary":"กำหนดสิทธิ์และกระบวนการ review ให้ปกป้อง branch สำคัญและคุณภาพโค้ด โดยไม่ทำให้ทีมที่อยู่คนละ timezone ทำงานติดขัด","keyPoints":["หลัก least privilege: ให้สิทธิ์น้อยที่สุดที่ทำงานได้ ผ่าน team/role (เช่น Read, Triage, Write, Maintain, Admin บน GitHub) แทนการให้รายบุคคล","Branch protection / rulesets บน `main` และ `release/*`: บังคับ PR, จำนวน approval ขั้นต่ำ, ผ่าน status check (CI) ก่อน merge, ต้อง up-to-date กับ base, ห้าม force push/ลบ branch, ตัวเลือกบังคับ linear history และ signed commits","`CODEOWNERS` ระบุเจ้าของ path (เช่น `/payments/ @team-payments`) ให้ระบบขอ review อัตโนมัติ และเปิด 'require review from code owners' เพื่อบังคับว่าต้องผ่านเจ้าของส่วนนั้น","ผู้รับเหมา/contractor ควรได้สิทธิ์จำกัด: ใช้ fork + PR หรือสิทธิ์เฉพาะ repo/branch, ไม่ให้ push ตรงเข้า `main`, ถอนสิทธิ์เมื่อหมดสัญญา และใช้ SSO/MFA","Review แบบ async ข้าม timezone: PR เล็กและโฟกัสเรื่องเดียว, คำอธิบายใน PR template (ทำไม/ทดสอบอย่างไร), ให้ automation (lint, test, security scan) ตรวจก่อนคนเพื่อลดรอบ, ตกลง SLA การ review และสลับ reviewer ตาม timezone","ใช้ draft PR เพื่อขอ feedback เร็ว, comment ให้ชัดเจนว่าอะไร blocker และอะไรเป็นคำแนะนำ, และเลี่ยงการรอ approval ของคนคนเดียว (bus factor)","Merge queue ช่วยให้ PR หลายอันถูกทดสอบกับ `main` ล่าสุดทีละลำดับก่อน merge ลดปัญหา main พังจาก PR ที่ชนกัน","จัดการ secret: ห้าม commit credential; เปิด secret scanning/push protection และใช้ deploy key หรือ token สิทธิ์น้อยแทนบัญชีส่วนตัว"],"examFocus":["ถ้าบริษัทมี contractor ภายนอกที่ต้องแก้โค้ดบางโมดูล ให้ตอบด้วย branch protection + CODEOWNERS + สิทธิ์จำกัด (หรือ fork) ไม่ใช่ให้สิทธิ์ admin","ถ้า review ช้าเพราะทีมอยู่คนละ timezone ให้แก้ด้วย PR ขนาดเล็ก, automation, reviewer หลายคน และข้อตกลง SLA มากกว่าการลดมาตรฐาน review","ถ้าต้องบังคับว่าการแก้ส่วน payment ต้องผ่านทีม payment ให้ใช้ CODEOWNERS พร้อม require code owner review","ถ้าอยากกันไม่ให้ merge โดยที่ CI ยังไม่ผ่าน ให้ตั้ง required status checks","ถ้าคนเดียวมีสิทธิ์ push ตรง `main` ให้ถือเป็นความเสี่ยง ต้องปิดด้วย branch protection"],"pitfalls":["คิดว่า CODEOWNERS บังคับได้เองทันที: ต้องเปิดตัวเลือกใน branch protection ด้วยจึงจะ block merge","ให้ admin bypass ได้ตลอดจน rule ไม่มีผลกับคนสำคัญ ควรจำกัดและตรวจสอบ","แก้ปัญหา review ช้าด้วยการลดจำนวน reviewer เหลือศูนย์ ซึ่งทำให้คุณภาพตก","ใช้บัญชีส่วนตัวของพนักงานเป็น credential ของ CI ทำให้ตามสิทธิ์และถอนสิทธิ์ยาก"]},{"descriptor":"SQL-S1","competency":"SQL","title":"Query ซับซ้อน: subquery, CTE, window, indexing","summary":"เขียน query ที่ถูกต้องและเร็วสำหรับโจทย์อย่าง 'แถวล่าสุดต่อกลุ่ม' หรือ 'ลูกค้าที่มีรายการ' โดยเข้าใจ semantics ของ NULL และผลต่อ performance","keyPoints":["CTE (`WITH name AS (...)`) ทำให้ query อ่านง่ายและใช้ซ้ำได้ใน statement เดียว; recursive CTE (`WITH RECURSIVE` ส่วน SQL Server ไม่ต้องใส่คำว่า RECURSIVE) ใช้กับข้อมูลลำดับชั้น เช่น org chart","ใน PostgreSQL 12+ CTE ที่ไม่ recursive และถูกอ้างครั้งเดียวจะถูก inline โดยค่าเริ่มต้น และควบคุมได้ด้วย `MATERIALIZED` / `NOT MATERIALIZED`","แถวล่าสุดต่อกลุ่ม: `ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC)` แล้วกรอง `rn = 1` ต้องกรองในชั้นนอก (CTE/subquery) เพราะ window function ใช้ใน `WHERE` ตรงๆ ไม่ได้","`ROW_NUMBER` ให้เลขไม่ซ้ำเสมอ ส่วน `RANK` ข้ามเลขเมื่อมีค่าเท่ากัน และ `DENSE_RANK` ไม่ข้ามเลข; ควรใส่ tie-breaker ใน `ORDER BY` เพื่อผลที่แน่นอน","`EXISTS (SELECT 1 FROM ... WHERE ...)` เป็น semi-join: คืนแถวฝั่งนอกครั้งเดียวไม่ว่าฝั่งในจะตรงกี่แถว ต่างจาก `JOIN` ที่ทำให้แถวซ้ำเมื่อเป็น one-to-many","`NOT IN (subquery)` อันตราย: ถ้า subquery คืนค่า NULL แม้แต่แถวเดียว เงื่อนไขจะเป็น UNKNOWN และไม่คืนแถวเลย ให้ใช้ `NOT EXISTS` หรือกรอง NULL ออกก่อน","Correlated subquery อ้างคอลัมน์จาก query นอกและรันต่อแถว (optimizer มักแปลงเป็น join ได้); scalar subquery ต้องคืนไม่เกินหนึ่งแถว","PostgreSQL มี `DISTINCT ON (col) ... ORDER BY col, created_at DESC` และ `LATERAL` join สำหรับโจทย์ top-N ต่อกลุ่ม","Index ช่วย `WHERE`, `JOIN`, `ORDER BY`: สร้าง index บน foreign key ที่ใช้ join, ใช้ covering index เพื่อไม่ต้องอ่านตาราง, และจำไว้ว่า index ทำให้ write ช้าลงและกินที่"],"examFocus":["ถ้าต้องดึงคำสั่งซื้อล่าสุดของลูกค้าแต่ละคน ให้ใช้ window function ใน CTE แล้วกรองชั้นนอก","ถ้าต้องหา 'ลูกค้าที่มีออเดอร์' และไม่ต้องการแถวซ้ำ ให้ใช้ `EXISTS` (หรือ `DISTINCT` หลัง join แต่มีต้นทุนมากกว่า)","ถ้า query `NOT IN` คืนผลว่างผิดปกติ ให้สงสัยค่า NULL ใน subquery แล้วเปลี่ยนเป็น `NOT EXISTS`","ถ้าโจทย์ถามว่าเลือก CTE หรือ subquery ให้ตอบเรื่องความอ่านง่ายและการใช้ซ้ำ ส่วน performance ขึ้นกับ optimizer/DB engine","ถ้าต้องเดินต้นไม้ผู้บังคับบัญชา ให้ใช้ recursive CTE"],"pitfalls":["ใช้ `WHERE ROW_NUMBER() OVER (...) = 1` โดยตรง ซึ่งไม่ถูกต้องตามลำดับการประมวลผล SQL","คิดว่า CTE เร็วกว่า subquery เสมอ หรือเป็นการ cache ผลลัพธ์เสมอ ซึ่งขึ้นกับ engine","ใช้ `NOT IN` กับคอลัมน์ที่เป็น nullable","ใช้ `SELECT DISTINCT` ปิดปัญหา join ที่ทำให้แถวซ้ำ แทนที่จะแก้ที่ต้นเหตุ"],"example":{"lang":"sql","code":"WITH ranked AS (\n  SELECT o.*,\n         ROW_NUMBER() OVER (\n           PARTITION BY o.customer_id\n           ORDER BY o.created_at DESC, o.id DESC\n         ) AS rn\n  FROM orders o\n)\nSELECT * FROM ranked WHERE rn = 1;\n\n-- ลูกค้าที่ไม่มีออเดอร์ (ปลอดภัยกับ NULL)\nSELECT c.id FROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id\n);"}},{"descriptor":"SQL-S2","competency":"SQL","title":"JOIN หลายตาราง","summary":"ใช้ JOIN ชนิดที่ถูกต้องและระวังผลข้างเคียง เช่น แถวซ้ำจาก one-to-many ที่ทำให้ยอดรวมผิด ซึ่งเป็นบั๊กข้อมูลที่พบบ่อยในรายงาน","keyPoints":["`INNER JOIN` คืนเฉพาะแถวที่ตรงทั้งสองฝั่ง, `LEFT JOIN` เก็บทุกแถวฝั่งซ้ายและเติม NULL เมื่อไม่ตรง, `FULL OUTER JOIN` เก็บทุกแถวทั้งสองฝั่ง, `CROSS JOIN` ได้ผลคูณคาร์ทีเซียน","Fan-out: join ตารางแม่กับลูกสองตาราง (เช่น orders กับ items และ payments) แล้ว `SUM` ทำให้ยอดซ้ำคูณกัน ต้อง aggregate แต่ละฝั่งใน subquery/CTE ให้เหลือหนึ่งแถวต่อคีย์ก่อนแล้วค่อย join","เงื่อนไขกรองคอลัมน์ของตารางฝั่งขวาของ `LEFT JOIN` ควรอยู่ใน `ON` ถ้าอยู่ใน `WHERE` (เช่น `r.status = 'x'`) แถวที่เป็น NULL จะถูกตัดและ LEFT JOIN กลายเป็น INNER JOIN โดยปริยาย","Anti-join: `LEFT JOIN ... WHERE r.id IS NULL` หา 'แถวที่ไม่มีคู่' ได้เทียบเท่ากับ `NOT EXISTS`","Self join ใช้เมื่อตารางอ้างถึงตัวเอง เช่น `employees e JOIN employees m ON e.manager_id = m.id` เพื่อเทียบพนักงานกับหัวหน้า ต้องตั้ง alias ต่างกัน และใช้ LEFT JOIN ถ้าต้องการรวมคนที่ไม่มีหัวหน้า","`FULL OUTER JOIN` เหมาะกับ reconciliation เทียบสองแหล่งข้อมูล: ฝั่งที่เป็น NULL บอกว่าแถวนั้นขาดหายในอีกฝั่ง; MySQL ไม่มี FULL OUTER JOIN ต้องจำลองด้วย `LEFT JOIN UNION RIGHT JOIN`","คีย์ที่เป็น NULL ไม่เคยเท่ากับอะไร (`NULL = NULL` เป็น UNKNOWN) จึงไม่ match ใน join; PostgreSQL ใช้ `IS NOT DISTINCT FROM` เพื่อเทียบแบบถือว่า NULL เท่ากัน","`COUNT(*)` นับทุกแถวรวมแถวที่เป็น NULL จาก outer join แต่ `COUNT(col)` ข้าม NULL จึงใช้นับจำนวนที่มีคู่ได้","`UNION` ตัดแถวซ้ำ (ช้ากว่า) ส่วน `UNION ALL` ไม่ตัด ใช้เมื่อรู้ว่าไม่ซ้ำหรือต้องการทุกแถว"],"examFocus":["ถ้ายอดขายรวมหลัง join หลายตารางสูงกว่าความจริง ให้หา fan-out แล้ว pre-aggregate ก่อน join","ถ้าต้องแสดงลูกค้าทุกคนรวมคนที่ไม่เคยสั่ง ให้ใช้ LEFT JOIN และระวังเงื่อนไขใน WHERE","ถ้าต้องเทียบระเบียนสองระบบว่ามีขาด/เกินตรงไหน ให้ใช้ FULL OUTER JOIN แล้วดูฝั่งที่เป็น NULL","ถ้าต้องหาพนักงานที่เงินเดือนมากกว่าหัวหน้า ให้ใช้ self join","ถ้าต้องหาข้อมูลที่ไม่มีคู่ ให้เลือก anti-join (`NOT EXISTS` หรือ LEFT JOIN + IS NULL)"],"pitfalls":["ใส่ `DISTINCT` หลัง join เพื่อลบแถวซ้ำ ทั้งที่ยอด SUM ผิดไปแล้วและ DISTINCT ไม่แก้","ใส่เงื่อนไขของตารางขวาไว้ใน WHERE ของ LEFT JOIN แล้วแปลกใจว่าลูกค้าบางคนหาย","ลืมว่า join บนคีย์ NULL ไม่ match","ใช้ `UNION` ทั้งที่ต้องการเก็บแถวซ้ำ ทำให้จำนวนแถวหายโดยไม่รู้ตัว"],"example":{"lang":"sql","code":"-- ป้องกัน fan-out: รวมยอดแต่ละฝั่งก่อน join\nSELECT o.id, i.items_total, p.paid_total\nFROM orders o\nLEFT JOIN (\n  SELECT order_id, SUM(price * qty) AS items_total\n  FROM order_items GROUP BY order_id\n) i ON i.order_id = o.id\nLEFT JOIN (\n  SELECT order_id, SUM(amount) AS paid_total\n  FROM payments GROUP BY order_id\n) p ON p.order_id = o.id;"}},{"descriptor":"SQL-S3","competency":"SQL","title":"เพิ่มความเร็ว query: index, filter, query plan","summary":"อ่าน query plan และออกแบบ index/เงื่อนไขกรองให้ DB ใช้ index ได้จริง เพราะ query ที่ถูกต้องแต่ scan ทั้งตารางจะช้าลงตามขนาดข้อมูล","keyPoints":["ใช้ `EXPLAIN` / `EXPLAIN ANALYZE` (PostgreSQL, MySQL 8) ดูแผนจริง: Seq/Full Table Scan, Index Scan, Index Only Scan, จำนวนแถวประมาณ vs จริง และเวลา ก่อนจะเดาว่าต้องสร้าง index","Sargable: เงื่อนไขที่ใช้ index ได้ ต้องไม่ห่อคอลัมน์ด้วยฟังก์ชัน เช่น `WHERE DATE(created_at) = '2025-01-01'` หรือ `YEAR(col) = 2025` ทำให้ใช้ index ไม่ได้ ให้เขียนเป็นช่วง `created_at >= '2025-01-01' AND created_at < '2025-01-02'`","ถ้าจำเป็นต้องค้นด้วย expression ให้สร้าง functional/expression index (เช่น `CREATE INDEX ON t (LOWER(email))` ใน PostgreSQL)","Composite index ใช้ได้ตามหลัก leftmost prefix: วางคอลัมน์ที่เทียบเท่า (`=`) ก่อน ตามด้วยคอลัมน์ช่วง (`>`, `BETWEEN`) และคอลัมน์ `ORDER BY` เพื่อให้ index คืนข้อมูลเรียงโดยไม่ต้อง sort","ลำดับคอลัมน์ใน composite index มีผล: index (a, b) ช่วยกรอง `a` หรือ `a,b` แต่ไม่ช่วยกรอง `b` อย่างเดียวได้ดี","`LIKE 'abc%'` (prefix) ใช้ B-tree index ได้ แต่ `LIKE '%abc'` (leading wildcard) ใช้ไม่ได้ ต้องใช้ full-text search หรือ trigram index (`pg_trgm`)","Covering index (คอลัมน์ที่ query ต้องใช้อยู่ใน index ครบ เช่น `INCLUDE` ใน PostgreSQL 11+ และ SQL Server) ทำให้ไม่ต้องกลับไปอ่านตาราง","Pagination: `OFFSET n` ต้องอ่านแล้วทิ้ง n แถวจึงช้าลงเมื่อหน้าลึก; keyset/seek pagination ใช้ `WHERE (created_at, id) < (?, ?) ORDER BY created_at DESC, id DESC LIMIT 20` ซึ่งเร็วคงที่และไม่ข้าม/ซ้ำเมื่อมีข้อมูลใหม่ แต่กระโดดไปหน้าที่ N ไม่ได้","Implicit type conversion (เทียบ string กับ number) และ collation ที่ไม่ตรงอาจทำให้ index ไม่ถูกใช้; หลีกเลี่ยง `SELECT *` และดึงเฉพาะคอลัมน์ที่ใช้"],"examFocus":["ถ้า query กรองวันที่ด้วยฟังก์ชันบนคอลัมน์แล้วช้า ให้เขียนใหม่เป็นช่วงวันที่แบบ half-open","ถ้ามี query `WHERE status = ? AND created_at >= ? ORDER BY created_at` ให้ออกแบบ composite index `(status, created_at)`","ถ้าค้นข้อความแบบ contains ช้า ให้เลือก full-text/trigram index แทนการหวังให้ B-tree ช่วย","ถ้า API list แบบ infinite scroll ช้าเมื่อเลื่อนลึก ให้เปลี่ยนจาก OFFSET เป็น keyset pagination","ถ้าสร้าง index แล้ว optimizer ไม่ใช้ ให้ดู plan, ความ selective ของข้อมูล, type conversion และสถิติ (ANALYZE)"],"pitfalls":["สร้าง index ทุกคอลัมน์ 'เผื่อไว้' ทำให้ INSERT/UPDATE ช้าและเปลืองที่","เชื่อว่า index ถูกใช้เสมอ: ถ้าเงื่อนไขไม่ selective optimizer อาจเลือก full scan ซึ่งถูกต้อง","ลำดับคอลัมน์ composite index ผิด (ช่วงมาก่อนความเท่ากัน)","ใช้ OFFSET ที่ลึกกับตารางใหญ่แล้วโทษว่า DB ช้า"],"example":{"lang":"sql","code":"-- ไม่ sargable: ห่อคอลัมน์ด้วยฟังก์ชัน\nSELECT * FROM orders WHERE DATE(created_at) = '2025-03-01';\n\n-- sargable: ช่วงแบบ half-open\nSELECT * FROM orders\nWHERE created_at >= '2025-03-01' AND created_at < '2025-03-02';\n\n-- keyset pagination\nSELECT id, created_at FROM orders\nWHERE (created_at, id) < ('2025-03-01 10:00:00', 1500)\nORDER BY created_at DESC, id DESC\nLIMIT 20;"}},{"descriptor":"SQL-S4","competency":"SQL","title":"Data integrity constraints","summary":"ใช้ constraint ในฐานข้อมูลเป็นด่านสุดท้ายของความถูกต้องของข้อมูล เพราะการตรวจในแอปอย่างเดียวพลาดได้เมื่อมี concurrency, หลาย service หรือ retry","keyPoints":["ชนิดหลัก: `PRIMARY KEY` (ไม่ซ้ำและไม่ NULL), `UNIQUE`, `NOT NULL`, `CHECK (price >= 0)`, `FOREIGN KEY`, `DEFAULT`","การตรวจ 'เช็คก่อนแล้วค่อย insert' ในแอปมี race condition ระหว่างสองคำขอ; `UNIQUE` constraint ทำให้ DB ปฏิเสธตัวที่สองแน่นอน แล้วแอปจัดการ error นั้น","Webhook/consumer ที่อาจถูกส่งซ้ำ ควร idempotent: เก็บ `event_id` หรือ idempotency key ด้วย `UNIQUE` แล้วใช้ `INSERT ... ON CONFLICT DO NOTHING` (PostgreSQL) หรือ `ON DUPLICATE KEY UPDATE` (MySQL) เพื่อไม่ประมวลผลซ้ำ","การเขียนหลายตารางที่ต้องสำเร็จพร้อมกันให้อยู่ใน transaction เดียว (`BEGIN ... COMMIT`) เพื่อ atomicity และ rollback เมื่อผิดพลาด","Foreign key ป้องกัน orphan row; ตัวเลือกเมื่อลบ/แก้ parent: `CASCADE` (ลบลูกตาม), `SET NULL`, `RESTRICT` (ห้ามลบถ้ามีลูก ตรวจทันที), `NO ACTION` (คล้าย RESTRICT แต่ใน PostgreSQL ตรวจท้าย statement และเลื่อนได้เมื่อประกาศ DEFERRABLE)","ข้อมูลที่ต้องเก็บตามกฎหมาย/บัญชี (เช่น ประวัติธุรกรรม) แต่ผู้ใช้ขอลบข้อมูลส่วนบุคคลตาม PDPA: ใช้ FK แบบ `RESTRICT` ไม่ให้ลบแถวแม่ที่มีธุรกรรมผูกอยู่ แล้วใช้ anonymize (ล้าง/แทนที่ฟิลด์ที่ระบุตัวตนได้) โดยคงคีย์ไว้ให้ความสัมพันธ์ยังครบ","หลีกเลี่ยง `ON DELETE CASCADE` กับข้อมูลที่ต้องเก็บเป็นหลักฐาน เพราะลบแม่แล้วลูกหายตามโดยไม่ตั้งใจ","Soft delete (`deleted_at`) ทำให้ UNIQUE ชนกับแถวที่ถูก 'ลบ' แล้ว; PostgreSQL แก้ด้วย partial unique index (`CREATE UNIQUE INDEX ... WHERE deleted_at IS NULL`)","ชนิดข้อมูลที่เหมาะสมก็เป็นส่วนของ integrity: ใช้ `DECIMAL/NUMERIC` กับเงิน ไม่ใช้ float, ใช้ `NOT NULL` กับฟิลด์ที่ต้องมีเสมอ"],"examFocus":["ถ้า webhook ถูกส่งซ้ำแล้วเกิดรายการซ้ำ ให้เพิ่ม unique constraint บน event id และทำ insert แบบ idempotent","ถ้าสองคำขอพร้อมกันสร้างข้อมูลซ้ำ ให้ตอบว่าต้องมี unique constraint ที่ DB ไม่ใช่แค่ตรวจในโค้ด","ถ้าผู้ใช้ขอลบข้อมูลตาม PDPA แต่ยังมีออเดอร์ที่ต้องเก็บ ให้เลือก anonymize + FK restrict แทนการ cascade delete","ถ้าอัปเดตหลายตารางแล้วบางตารางสำเร็จบางตารางไม่ ให้ห่อด้วย transaction","ถ้าถามว่าต้องการลบลูกอัตโนมัติเมื่อลบแม่หรือไม่ ให้พิจารณาผลต่อข้อมูลที่ต้องเก็บก่อนเลือก CASCADE"],"pitfalls":["เชื่อใจ validation ฝั่งแอปอย่างเดียว ทั้งที่มีหลาย service หรือ script เขียนตารางเดียวกัน","ใช้ `CASCADE` ทุกที่เพื่อความสะดวกจนลบข้อมูลสำคัญตาม","คิดว่า 'ลบแถวผู้ใช้' คือคำตอบเดียวของ PDPA ทั้งที่อาจต้องเก็บบางข้อมูลตามกฎหมายอื่น","ปิด/ข้าม constraint ชั่วคราวเพื่อโหลดข้อมูลแล้วลืมเปิด ทำให้ข้อมูลเสียถาวร"],"example":{"lang":"sql","code":"CREATE TABLE payment_events (\n  id          BIGSERIAL PRIMARY KEY,\n  event_id    TEXT NOT NULL UNIQUE,\n  order_id    BIGINT NOT NULL REFERENCES orders(id) ON DELETE RESTRICT,\n  amount      NUMERIC(12,2) NOT NULL CHECK (amount >= 0)\n);\n\nINSERT INTO payment_events (event_id, order_id, amount)\nVALUES ($1, $2, $3)\nON CONFLICT (event_id) DO NOTHING;"}},{"descriptor":"OOP-S1","competency":"OOP","title":"Class hierarchy: inheritance และ polymorphism","summary":"ออกแบบลำดับชั้นของ class ให้ใช้ polymorphism แทนการเช็คชนิด และรู้ข้อจำกัดของ inheritance เพื่อไม่ให้ subclass พังเมื่อ base class เปลี่ยน","keyPoints":["Polymorphism (dynamic dispatch) คือการเรียก method ผ่านชนิดแม่แล้วระบบเลือก implementation ของชนิดจริงตอน runtime ต่างจาก overload ที่ถูกเลือกตอน compile time จากชนิดของ argument","แทนที่ `if/switch` ตามชนิด (type code) ด้วย polymorphism: ให้แต่ละ subclass มี method เดียวกัน (เช่น `calculateFee()`) เมื่อเพิ่มชนิดใหม่ก็เพิ่ม class ใหม่โดยไม่แก้โค้ดเดิม สอดคล้อง Open/Closed Principle","Abstract method บังคับให้ subclass ต้อง implement; ส่วน method ที่มี implementation เริ่มต้นใน base class เป็นจุดที่ subclass override ได้","Template Method pattern: base class นิยามลำดับขั้นของอัลกอริทึมใน method หนึ่ง (ควรทำให้ override ไม่ได้ เช่น `final`) และเรียก step/hook ที่เป็น abstract หรือ optional ให้ subclass เติมเฉพาะส่วนที่ต่าง เหมาะกับงานที่มีขั้นตอนร่วมแต่รายละเอียดต่าง เช่น export หลายรูปแบบ","Fragile base class problem: ถ้า method ใน base class เรียก method อื่นของตัวเอง (self-call) และ subclass override method นั้น พฤติกรรมอาจเปลี่ยนโดยไม่ตั้งใจ (เช่น subclass ที่นับจำนวนการ add แล้ว `addAll` ใน base เรียก `add` ซ้ำจนนับสองรอบ) ทำให้ subclass ผูกกับรายละเอียดภายในของแม่","แนวทางลดความเปราะบาง: ปิด method ที่ไม่ตั้งใจให้ override (`final`/`sealed`), เอกสารระบุ self-use, หรือใช้ composition/delegation แทน inheritance","ในภาษาที่รองรับ มี keyword ช่วยตรวจ เช่น `@Override` (Java), `override` (TypeScript/C#/Kotlin) ให้ compiler เตือนเมื่อ signature ไม่ตรง","อย่าเรียก overridable method จาก constructor ของ base class เพราะ subclass อาจยังไม่ถูก initialize field","ลำดับชั้นควรตื้นและสื่อ is-a จริง; ถ้าแค่ต้องการใช้โค้ดซ้ำ ให้พิจารณา composition"],"examFocus":["ถ้าเจอโค้ดที่ `switch (type)` ซ้ำหลายที่และเพิ่มชนิดใหม่ทีไรต้องแก้ทุกที่ ให้ refactor เป็น polymorphism","ถ้า subclass ที่ override method แล้วผลลัพธ์ผิดเพราะ base เรียกเมธอดนั้นภายใน ให้ระบุว่าเป็น fragile base class และแก้ด้วย composition หรือปิดการ override","ถ้ามี workflow ที่ขั้นตอนเหมือนกันแต่รายละเอียด (เช่น format ไฟล์) ต่างกัน ให้เลือก Template Method","ถ้าโจทย์ถามว่าเมธอดไหนถูกเรียกจาก reference ชนิดแม่ที่ชี้ object ลูก ให้ตอบตาม dynamic dispatch","ถ้าอยากเพิ่มพฤติกรรมให้ class โดยไม่แก้ base ให้พิจารณา subclass, strategy หรือ decorator ตามความเหมาะสม"],"pitfalls":["ใช้ inheritance เพื่อ reuse โค้ดอย่างเดียวทั้งที่ความสัมพันธ์ไม่ใช่ is-a","คิดว่า subclass ไม่ต้องรู้รายละเอียดภายในของ base class ซึ่งไม่จริงเมื่อมี self-call","สร้างลำดับชั้นลึกหลายระดับจนตามพฤติกรรมไม่ได้","ทำให้ Template Method ที่ subclass override ตัว method หลักได้ ทำให้ลำดับขั้นตอนถูกทำลาย"],"example":{"lang":"typescript","code":"abstract class Exporter {\n  // template method: ลำดับคงที่ ไม่ให้ subclass เปลี่ยน\n  export(rows: Row[]): string {\n    const data = this.filter(rows);\n    return this.header() + this.format(data) + this.footer();\n  }\n  protected filter(rows: Row[]): Row[] { return rows; } // hook\n  protected abstract header(): string;\n  protected abstract format(rows: Row[]): string;\n  protected footer(): string { return ''; }              // hook\n}\n\nclass CsvExporter extends Exporter {\n  protected header() { return 'id,name\\n'; }\n  protected format(rows: Row[]) {\n    return rows.map(r => `${r.id},${r.name}`).join('\\n');\n  }\n}"}},{"descriptor":"OOP-S2","competency":"OOP","title":"Composition และ aggregation","summary":"เลือกความสัมพันธ์ระหว่าง object (has-a vs is-a, ownership และ lifetime) ให้เหมาะสม เพื่อให้ระบบยืดหยุ่นและไม่เกิด class ระเบิดจากการผสม inheritance","keyPoints":["Composition คือ has-a แบบเจ้าของเด็ดขาด: part มี lifetime ผูกกับ whole (ลบ whole แล้ว part หายตาม) เช่น Order กับ OrderLine; part ไม่ถูกแชร์ให้ whole อื่น","Aggregation คือ has-a แบบหลวม: part มีชีวิตอิสระและอาจแชร์ได้ เช่น Team กับ Player (ยุบทีม ผู้เล่นยังอยู่) ใน UML composition ใช้ข้าวหลามตัดทึบ ส่วน aggregation ใช้ข้าวหลามตัดกลวง","Association เป็นความสัมพันธ์ทั่วไปที่เบากว่านั้น (รู้จักกัน/ใช้กัน) ไม่มีความเป็นเจ้าของ","Composition over inheritance: ประกอบพฤติกรรมจาก object เล็กๆ (strategy, decorator) ผ่าน interface แทนการสร้าง subclass ทุกชุดผสม เช่น Notifier ที่ส่ง Email+SMS+Push จะไม่ทำให้ต้องมี `EmailSmsNotifier`, `EmailPushNotifier` ... แบบ combinatorial explosion","Decorator ห่อ object ด้วย interface เดียวกันเพื่อเพิ่มพฤติกรรมซ้อนกันได้ตอน runtime; Strategy สลับอัลกอริทึมที่ฉีดเข้ามา","ตรวจ is-a ด้วย Liskov: ถ้า subclass ใช้แทนแม่ไม่ได้ทุกกรณี แปลว่าไม่ใช่ is-a จริง เช่น `Stack extends List` ทำให้ Stack เปิด method แทรก/ลบกลางลิสต์ที่ทำลายกฎ LIFO (กรณีคลาสสิก `java.util.Stack extends Vector`) ควรให้ Stack มี list ข้างใน (has-a) และเปิดเฉพาะ `push/pop/peek`","Delegation: class นอกส่งต่องานไปยัง object ที่ถือไว้ ทำให้เปลี่ยน implementation ได้โดยไม่กระทบผู้เรียก","เมื่อเป็น composition ให้ whole สร้างและจัดการ part เอง (และไม่ปล่อย reference ภายในออกไปตรงๆ); aggregation มักรับ part จากภายนอกผ่าน constructor/setter"],"examFocus":["ถ้าต้องเลือกระหว่าง composition กับ aggregation ให้ถามว่า part ยังมีความหมายเมื่อ whole ถูกลบหรือไม่ และถูกแชร์หรือไม่","ถ้ามีหลายคุณสมบัติที่ผสมกันได้อิสระ (เช่น ช่องทางแจ้งเตือน) แล้ว subclass เพิ่มเป็นทวีคูณ ให้เสนอ composition / decorator","ถ้าเห็น `class X extends Y` เพียงเพื่อยืมโค้ดบาง method ให้ตั้งคำถาม is-a และเสนอ has-a","ถ้า subclass ต้อง override method ให้ throw exception เพราะไม่รองรับ แสดงว่าสัมพันธ์ is-a ผิด","ถ้าโจทย์ถามเรื่อง lifetime ของ object ในแผนภาพ UML ให้ดูสัญลักษณ์ข้าวหลามตัด"],"pitfalls":["เข้าใจว่า aggregation กับ composition เหมือนกัน ทั้งที่ต่างกันที่ ownership/lifetime","คิดว่า composition ต้องมีโค้ดมากกว่าเสมอจนไม่คุ้ม: ในระยะยาวลดการผูกติดและทดสอบง่ายกว่า","ใช้ inheritance เพราะ 'ได้ method ฟรี' ทั้งที่ทำให้ interface ของ subclass กว้างเกินจำเป็น","ปล่อย reference ของ part ภายใน composition ออกไปแก้ไขได้ ทำให้ whole เสีย invariant"]},{"descriptor":"OOP-S3","competency":"OOP","title":"Access modifier, abstract class, interface","summary":"ใช้ access modifier และ abstraction เพื่อซ่อนรายละเอียดภายในและกำหนด contract ที่ชัดเจน ช่วยให้แก้ไข implementation ได้โดยไม่กระทบผู้ใช้","keyPoints":["Access modifier ทั่วไป: `public` (ทุกที่), `protected` (class และ subclass — ใน Java รวม class อื่นใน package เดียวกันด้วย), `private` (เฉพาะ class นั้น) และบางภาษามีระดับ package/module เช่น package-private (default ของ Java), `internal` (C#, Kotlin)","ใน TypeScript คำว่า `private` ตรวจเฉพาะตอน compile (ยังเข้าถึงได้ใน JavaScript ตอน runtime) ส่วน `#field` เป็น private ระดับ runtime จริง","Encapsulation ไม่ใช่แค่ getter/setter: ต้องรักษา invariant ของ object โดยให้เปลี่ยนสถานะผ่าน method ที่ตรวจกฎ (tell, don't ask) แทนการเปิด field ให้แก้ตรงๆ","การ return collection ภายในออกไปตรงๆ (เช่น `getItems()` คืน list จริง) ทำให้ผู้เรียกแก้ไขข้างในได้โดยข้าม method ควบคุม: ให้คืน read-only view (`Collections.unmodifiableList`, `readonly T[]`) หรือสำเนา (defensive copy) และเปิด method `add/remove` ที่ตรวจเงื่อนไขแทน","Defensive copy ใช้ทั้งตอนรับเข้า constructor และตอนส่งออก เพื่อไม่ให้ภายนอกยังถือ reference ที่แก้ state ภายในได้","Interface ระบุ contract (ว่าทำอะไรได้) โดยไม่มี state; class implement ได้หลาย interface (Java 8+ มี `default` method ได้)","Abstract class ใช้เมื่ออยากแชร์ state/implementation บางส่วนระหว่างคลาสที่เกี่ยวข้องกัน แต่ extends ได้เพียงตัวเดียวใน Java/C#/TypeScript","หลักเลือก: ต้องการกำหนดความสามารถที่หลายชนิดไม่เกี่ยวกันทำได้ -> interface; ต้องการโครงร่วมพร้อมโค้ดและ state -> abstract class; ผสมกันได้ (interface กำหนด contract, abstract class ให้ base implementation)","Immutable object (final field, ไม่มี setter) ช่วย encapsulation และ thread safety"],"examFocus":["ถ้า method คืน list ภายในให้ภายนอกแก้ได้ ให้ตอบ read-only view/copy และ method แก้ไขที่ควบคุมได้","ถ้าต้องให้ class ที่ไม่เกี่ยวกันหลายตัวมีความสามารถ `Comparable`/`Serializable` ให้ใช้ interface","ถ้ามีโค้ดซ้ำระหว่าง subclass พร้อม state ร่วมกัน ให้ใช้ abstract class","ถ้าอยากเปลี่ยน implementation โดยไม่กระทบผู้เรียก ให้ผู้เรียกพึ่ง interface ไม่ใช่ concrete class","ถ้าถามว่า field ควรเป็น access level ไหน ให้เริ่มจากแคบที่สุด (`private`) แล้วขยายเมื่อจำเป็น"],"pitfalls":["ทำ field เป็น `private` แต่มี getter/setter ทุกตัวแบบไม่ตรวจอะไร ซึ่งแทบไม่ต่างจาก public","`final`/`readonly` กับ reference ไม่ได้ทำให้ object ที่ชี้ไปไม่เปลี่ยน (ยังแก้เนื้อหา list ได้)","สับสนว่า abstract class กับ interface ใช้แทนกันได้หมด ทั้งที่ interface ไม่เก็บ state ของ instance และ class สืบทอดได้หลาย interface แต่ abstract class ได้ตัวเดียว","เชื่อว่า TypeScript `private` ปกป้องข้อมูลตอน runtime"]},{"descriptor":"OOP-S4","competency":"OOP","title":"Refactor ตามหลัก SOLID","summary":"ใช้ SOLID เป็นเกณฑ์ตัดสินว่าโค้ดผูกกันเกินไปตรงไหนและควรแยกอย่างไร เพื่อให้แก้ไข ทดสอบ และขยายง่ายขึ้นโดยไม่ over-engineer","keyPoints":["S — Single Responsibility: class ควรมีเหตุผลให้เปลี่ยนเพียงเรื่องเดียว (ต่อ actor/ความรับผิดชอบเดียว) เช่นแยกการคำนวณราคา การบันทึกลง DB และการส่งอีเมลออกจาก `OrderService` ก้อนเดียว","O — Open/Closed: เปิดให้ขยายแต่ปิดไม่ให้แก้โค้ดเดิม ทำผ่าน abstraction/polymorphism เช่นเพิ่ม payment method ใหม่ด้วย class ใหม่แทนการแก้ `if/else`","L — Liskov Substitution: object ของ subclass ต้องแทน base ได้โดยโปรแกรมยังถูกต้อง ห้ามเสริม precondition ให้เข้มกว่า หรือทำ postcondition อ่อนลง; subclass ที่ throw `UnsupportedOperationException` ในเมธอดที่แม่สัญญาไว้ (เช่น refund ที่ไม่รองรับ) ละเมิด LSP","I — Interface Segregation: อย่าบังคับให้ client พึ่ง method ที่ไม่ใช้ แยก interface ใหญ่ ('fat') เป็น interface เล็กตามบทบาท เช่น `Readable` / `Writable` แทน `Store` ที่มีทุกอย่าง","D — Dependency Inversion: high-level module ไม่ควรพึ่ง low-level module ตรงๆ ทั้งคู่ควรพึ่ง abstraction; ให้ `OrderService` พึ่ง interface `PaymentGateway` ที่ฉีดผ่าน constructor","Dependency Injection (DI) เป็นเทคนิคส่ง dependency เข้ามาจากภายนอก ส่วน DIP เป็นหลักการออกแบบ ซึ่งสองอย่างเกี่ยวข้องแต่ไม่ใช่สิ่งเดียวกัน; DI ช่วยให้ทดสอบด้วย fake/mock ง่าย","ลำดับ refactor ที่ปลอดภัย: เขียน test ครอบพฤติกรรมเดิมก่อน -> ทำทีละขั้น (extract method/class/interface) -> รัน test ทุกขั้น","สัญญาณว่าละเมิด: class ใหญ่มาก (God class), `new` concrete class ภายใน logic, `instanceof`/switch ตามชนิด, subclass ที่ override เพื่อโยน error หรือไม่ทำอะไร","SOLID เป็นแนวทาง ไม่ใช่กฎตายตัว: แยกมากเกินไปทำให้ซับซ้อนโดยไม่จำเป็น (over-abstraction)"],"examFocus":["ถ้า class เดียวทั้งคำนวณ บันทึก และแจ้งเตือน ให้ตอบ SRP และแยกเป็นหลายคลาสที่ประสานกันผ่าน interface","ถ้า service สร้าง `new StripeClient()` เองแล้วทดสอบยาก ให้ใช้ DIP: พึ่ง interface แล้วฉีดผ่าน constructor","ถ้า subclass ของ `PaymentMethod` โยน exception ใน `refund()` ให้ชี้ว่าละเมิด LSP แล้วแยก interface (เช่น `Refundable`) หรือปรับ hierarchy","ถ้า interface มี method หลายสิบตัวแต่ client ใช้แค่ 2-3 ตัว ให้ใช้ ISP","ถ้าเพิ่มฟีเจอร์ทีไรต้องแก้ if/else เดิม ให้ใช้ OCP ด้วย polymorphism/strategy"],"pitfalls":["ตีความ SRP เป็น 'หนึ่ง class หนึ่ง method' ซึ่งเล็กเกินไป ความหมายคือเหตุผลในการเปลี่ยนแปลงเรื่องเดียว","คิดว่า DI container = DIP แค่ใช้ framework ก็ถือว่าทำแล้ว ทั้งที่ยังพึ่ง concrete class","แก้ LSP ด้วยการจับ exception ที่ผู้เรียกแทนที่จะปรับ design","refactor ใหญ่ทีเดียวโดยไม่มี test รองรับ"],"example":{"lang":"typescript","code":"interface PaymentGateway {\n  charge(orderId: string, amount: number): Promise<void>;\n}\n\nclass OrderService {\n  // DIP: พึ่ง abstraction และรับผ่าน constructor\n  constructor(private readonly gateway: PaymentGateway) {}\n\n  async checkout(orderId: string, amount: number) {\n    await this.gateway.charge(orderId, amount);\n  }\n}\n\n// ทดสอบด้วย fake ได้โดยไม่ต้องเรียกระบบจริง\nconst fake: PaymentGateway = { charge: async () => {} };\nnew OrderService(fake).checkout('o1', 100);"}},{"descriptor":"OOP-S5","competency":"OOP","title":"Debug/maintain OOP codebase และ design pattern","summary":"อ่านและแก้โค้ด OOP ขนาดกลางอย่างเป็นระบบ รู้จักบั๊กคลาสสิกเรื่อง reference/shared state และเลือกใช้ design pattern เมื่อมีปัญหาจริงเท่านั้น","keyPoints":["Adapter: ห่อ class/SDK ที่ interface ไม่ตรงกับที่ระบบต้องการให้เป็น interface ของเรา ใช้แยกโค้ดแอปออกจาก vendor SDK เปลี่ยนผู้ให้บริการได้โดยแก้จุดเดียว และ mock ในการทดสอบได้","Singleton มีปัญหาเรื่อง global state ซ่อน dependency ทดสอบยาก และระวัง thread safety; ทางแก้คือสร้าง instance เดียวที่ composition root แล้วฉีด (inject) เข้า class ที่ต้องใช้","Factory ซ่อนการสร้าง object ที่ซับซ้อน; Strategy สลับอัลกอริทึม; Observer แจ้งการเปลี่ยนแปลงแบบ publish/subscribe; Decorator เพิ่มพฤติกรรม; Facade ให้ interface เรียบง่ายหน้าระบบย่อยที่ซับซ้อน; Repository แยกการเข้าถึงข้อมูลออกจาก domain","การ assign object/array ในภาษาส่วนใหญ่ (JS, Java, Python) คัดลอก 'reference' ไม่ใช่ข้อมูล ตัวแปรสองตัวจึงชี้ object เดียวกัน การแก้ผ่านตัวหนึ่งกระทบอีกตัว","Shallow copy (`[...arr]`, `{...obj}`, `Object.assign`, `Array.slice`, Java `clone()` ทั่วไป) คัดลอกชั้นบนสุด แต่ object ซ้อนใน ยังใช้ร่วมกัน; deep copy ต้องคัดลอกทุกชั้น (เช่น `structuredClone` ใน JS สมัยใหม่)","บั๊กจาก shared mutable state: ค่าเริ่มต้นที่เป็น mutable ถูกใช้ร่วมกัน (เช่น default argument เป็น list ใน Python, static field ที่เป็น collection) ทำให้ข้อมูลรั่วข้ามคำขอ/instance","ขั้นตอน debug: reproduce ให้ได้ -> ทำให้เล็กลง -> ตั้งสมมติฐานและตรวจด้วย debugger/log/test -> แก้ที่ต้นเหตุ -> เพิ่ม regression test","Maintain code เก่า: เขียน characterization test จับพฤติกรรมปัจจุบันก่อน refactor, แก้เป็นขั้นเล็กๆ, ลด coupling ที่จุดที่เปลี่ยนบ่อย","Anti-pattern ที่พบบ่อย: God class, anemic domain model (object มีแต่ข้อมูลไม่มีพฤติกรรม), copy-paste, ใช้ pattern เกินจำเป็น"],"examFocus":["ถ้าต้องใช้ SDK ของผู้ให้บริการภายนอกกระจายอยู่ทั่วโค้ด ให้ห่อด้วย Adapter หลัง interface ของเรา","ถ้าแก้ list ในที่หนึ่งแล้วอีกที่เปลี่ยนตามโดยไม่คาดคิด ให้สงสัย shared reference / shallow copy","ถ้าโค้ดใช้ Singleton ทั่วไปแล้วทดสอบยากหรือมี state รั่วระหว่าง test ให้เปลี่ยนเป็น injection","ถ้าต้องเลือก pattern ให้เริ่มจากปัญหาที่เห็นจริง (การสร้าง/การสลับอัลกอริทึม/การแจ้งเหตุการณ์) ไม่ใช่เลือก pattern ก่อน","ถ้าต้องแก้โค้ดที่ไม่มี test ให้เพิ่ม test ครอบก่อนแก้"],"pitfalls":["คิดว่า `const`/`final` ทำให้ object ไม่เปลี่ยน: มันล็อกแค่ตัวแปรที่ชี้","คิดว่า spread/`slice` คัดลอกลึก ทั้งที่เป็นแค่ชั้นแรก","ใช้ Singleton เพราะ 'สะดวกเรียกได้ทุกที่' โดยไม่คิดผลต่อการทดสอบ","ยัด pattern ลงโค้ดที่ไม่มีปัญหา ทำให้ซับซ้อนเกินจำเป็น"],"example":{"lang":"typescript","code":"const base = { tags: ['a'], meta: { n: 1 } };\n\nconst shallow = { ...base };\nshallow.tags.push('b');      // base.tags ก็เปลี่ยนด้วย (ชี้ array เดียวกัน)\n\nconst deep = structuredClone(base);\ndeep.tags.push('c');         // base ไม่ถูกกระทบ"}},{"descriptor":"MON-S1","competency":"Monitoring and Logging","title":"Observability: metrics, logs, traces","summary":"ออกแบบการสังเกตระบบให้ตอบได้ทั้งว่า 'มีปัญหาหรือไม่' และ 'เกิดที่ไหน เพราะอะไร' ด้วยสัญญาณที่เสริมกัน โดยควบคุมต้นทุนและความเป็นส่วนตัวของข้อมูล","keyPoints":["สามเสาหลัก: metrics (ตัวเลขอนุกรมเวลา ราคาถูก เหมาะกับ alert/trend), logs (เหตุการณ์ละเอียดรายครั้ง), traces (เส้นทางของคำขอข้าม service); ใช้ร่วมกันโดยผูกด้วย `trace_id`/`request_id`","Symptom-based alerting: แจ้งเตือนจากอาการที่ผู้ใช้รู้สึก (error rate, latency สูง, availability ต่ำ) ไม่ใช่จากสาเหตุที่เป็นไปได้ (CPU 80%) เพราะสาเหตุสูงได้โดยผู้ใช้ไม่เดือดร้อน และ alert ที่ไม่ actionable ทำให้เกิด alert fatigue","Four golden signals (Google SRE): latency, traffic, errors, saturation; RED method สำหรับ service (Rate, Errors, Duration); USE method สำหรับ resource (Utilization, Saturation, Errors)","วัด latency ด้วย percentile (p95/p99) จาก histogram ไม่ใช่ค่าเฉลี่ย เพราะค่าเฉลี่ยซ่อน tail ที่ผู้ใช้บางส่วนเจอจริง","Structured log: บันทึกเป็น JSON/key-value ที่มี field มาตรฐาน เช่น `timestamp`, `level`, `service`, `env`, `version`, `trace_id`, `request_id`, `user_id` (ถ้าอนุญาต) เพื่อค้นและ aggregate ได้ ต่างจาก log เป็นข้อความอิสระที่ต้อง parse","อย่าใส่ข้อมูลอ่อนไหวใน log (password, token, เลขบัตร, ข้อมูลส่วนบุคคลเกินจำเป็น) และใช้ log level ให้ถูก (`ERROR` เฉพาะสิ่งที่ต้องมีคนดู)","Cardinality ของ metric label: ทุกชุดค่า label ที่ต่างกันคือ time series ใหม่ ห้ามใช้ค่าที่มีหลากหลายสูงอย่าง `user_id`, `request_id`, URL เต็มที่มี id เป็น label เพราะทำให้ระบบ metric ช้า/แพง; ให้ใช้ label จำกัด (route template, status class) และเก็บรายละเอียดไว้ใน log/trace","Mobile crash reporting: stack trace ที่ถูก obfuscate/strip ต้องมีไฟล์ช่วยแปล (symbolication): iOS ใช้ dSYM, Android ใช้ `mapping.txt` ของ R8/ProGuard, JS ใช้ source map ต้องอัปโหลดให้ตรงเวอร์ชัน build ตั้งแต่ตอน release จึงจะอ่านได้","SLI/SLO และ error budget: กำหนดเป้าหมายระดับบริการเป็นตัวเลข (เช่น 99.9% ของคำขอสำเร็จ) และ alert ตามอัตราการใช้ budget (burn rate)"],"examFocus":["ถ้าทีมถูก alert ตอนตี 3 เพราะ CPU สูงแต่ผู้ใช้ไม่กระทบ ให้เสนอ alert ตามอาการ (error rate/latency SLO) และเก็บ CPU เป็น dashboard/ข้อมูลวินิจฉัย","ถ้า dashboard metric ช้าหรือค่าใช้จ่ายพุ่งหลังเพิ่ม label `user_id` ให้ชี้ปัญหา high cardinality","ถ้าต้องค้นหา log ของคำขอเดียวข้ามหลาย service ให้ใช้ structured log ที่มี correlation/trace id","ถ้า crash report บนมือถือเห็นแต่ชื่อฟังก์ชันที่ถูกย่อ ให้ตรวจว่าอัปโหลด dSYM / mapping file / source map ของเวอร์ชันนั้นแล้วหรือยัง","ถ้าถามว่าจะใช้ metric, log หรือ trace กับคำถามใด: ภาพรวม/แนวโน้ม -> metric, รายละเอียดเหตุการณ์ -> log, ช้าตรงไหนในสายคำขอ -> trace"],"pitfalls":["ตั้ง alert ทุก metric ที่วัดได้ ทำให้เกิด alert fatigue และคนเมินสัญญาณจริง","ใช้ค่าเฉลี่ย latency เป็นตัวชี้วัดหลัก","ใส่ identifier ที่ไม่จำกัดค่าเป็น metric label","เก็บ log ทุกอย่างที่ระดับ debug ใน production โดยไม่คิดต้นทุนและข้อมูลส่วนตัว"]},{"descriptor":"MON-S2","competency":"Monitoring and Logging","title":"Incident response, runbook, post-mortem","summary":"นำการตอบสนองเหตุการณ์ให้เป็นระบบ: กู้บริการให้เร็วก่อน แล้วค่อยหาสาเหตุ พร้อมเรียนรู้ผ่าน post-mortem แบบไม่โทษตัวบุคคล","keyPoints":["วงจร incident: detect -> triage/ประกาศระดับความรุนแรง (SEV) -> mitigate -> resolve -> post-mortem/follow-up","Mitigate first: ลดผลกระทบให้ผู้ใช้ก่อน (rollback, ปิด feature flag, failover, เพิ่ม capacity, route traffic ออก) แล้วค่อยหา root cause เมื่อระบบเสถียร เพราะการไล่หาสาเหตุกลางไฟไหม้ยืดเวลาที่ผู้ใช้เสียหาย","บทบาทหลัก: Incident Commander (ตัดสินใจและประสานงาน ไม่ลงไปแก้เอง), Ops/Technical lead (ลงมือแก้), Communications lead (อัปเดต stakeholder/ลูกค้า/status page), Scribe (จดไทม์ไลน์)","Runbook ที่ดีระบุ: อาการและ alert ที่เกี่ยวข้อง, ผลกระทบ, ขั้นตอนตรวจวินิจฉัย (คำสั่ง/ลิงก์ dashboard), ขั้นตอน mitigate พร้อมวิธี rollback, เงื่อนไข escalate และผู้รับผิดชอบ; ต้องอัปเดตหลังเกิดเหตุจริงและทดสอบ (game day)","สื่อสารสม่ำเสมอตามรอบเวลา แม้ยังไม่มีความคืบหน้า และใช้ช่องทางเดียว (incident channel) เป็นศูนย์กลาง","Blameless post-mortem: โฟกัสที่ระบบ/กระบวนการที่เปิดโอกาสให้เกิดความผิดพลาด ไม่ใช่หาคนผิด เพื่อให้คนกล้าเปิดเผยข้อมูลจริง","โครงสร้าง post-mortem: สรุปผลกระทบ, ไทม์ไลน์, root cause และ contributing factors, สิ่งที่ทำได้ดี/ไม่ดี, ข้อสรุป และ action items ที่มีเจ้าของและกำหนดเวลา","เทคนิคหา root cause: 5 Whys, fishbone; root cause มักมีหลายปัจจัย 'human error' ไม่ใช่ root cause แต่เป็นสัญญาณว่าระบบไม่มี guardrail","ตัวชี้วัดที่ใช้บ่อย: MTTD (ตรวจพบ), MTTA (รับทราบ), MTTR (กู้คืน — ต้องนิยามให้ชัดว่าหมายถึง repair/recovery/resolve)"],"examFocus":["ถ้าบริการล่มหลัง deploy และยังไม่รู้สาเหตุ ให้ rollback/ปิด flag เพื่อกู้ก่อน แล้ววิเคราะห์ต่อ","ถ้าทุกคนกระโดดเข้ามาแก้พร้อมกันจนสับสน ให้แต่งตั้ง Incident Commander และแบ่งบทบาท","ถ้า post-mortem สรุปว่า 'วิศวกรพิมพ์ผิด' ให้ปรับเป็นการหาปัจจัยเชิงระบบ เช่น ไม่มี validation, ไม่มี review, ไม่มี rollback อัตโนมัติ","ถ้า action item เป็นแค่ 'ระวังให้มากขึ้น' ให้เปลี่ยนเป็นงานที่วัดได้พร้อมเจ้าของและเดดไลน์","ถ้าต้องเขียน runbook ให้ on-call มือใหม่ใช้ ให้ทำเป็นขั้นตอนชัดเจนตามอาการ ไม่ใช่คำอธิบายสถาปัตยกรรม"],"pitfalls":["ไล่หา root cause ให้ครบก่อนจะ mitigate","ให้ Incident Commander ลงไปแก้เองจนไม่มีคนประสานงาน","ทำ post-mortem เพื่อหาคนผิด ทำให้คนปิดบังข้อมูลครั้งหน้า","เขียน action item ที่ไม่มีเจ้าของ/กำหนดเวลา แล้วไม่ติดตาม"]},{"descriptor":"MON-S3","competency":"Monitoring and Logging","title":"ปรับปรุง performance และ reliability","summary":"ใช้ข้อมูลจริงจากผู้ใช้และการปล่อยแบบค่อยเป็นค่อยไปเพื่อค้นหาคอขวดและลดความเสี่ยงของการ release โดยเฉพาะบนมือถือที่เรียกคืน build ไม่ได้ทันที","keyPoints":["RUM (Real User Monitoring) วัดจากอุปกรณ์/เบราว์เซอร์ผู้ใช้จริง ต่างจาก synthetic monitoring ที่จำลองการเรียกจากจุดคงที่ ทั้งสองเสริมกัน: synthetic จับ outage ได้เร็วและคาดการณ์ได้ RUM สะท้อนประสบการณ์จริง","แยก (segment) ข้อมูลตามเวอร์ชันแอป, OS, รุ่นอุปกรณ์/ระดับเครื่อง, ชนิดเครือข่าย, ภูมิภาค เพราะค่าเฉลี่ยรวมซ่อนกลุ่มที่ช้าจริง (เช่น เครื่องต่ำ + เครือข่ายช้า)","App startup บนมือถือแยก cold start (โปรเซสยังไม่มี), warm และ hot start: วัดและตั้งเป้าแยกกัน เพราะสาเหตุและวิธีแก้ต่างกัน","ตัวชี้วัดความเสถียรของแอป: crash-free users/sessions, ANR rate (Android), error rate ของ API, latency p95/p99","Staged rollout: Google Play ปล่อยเป็นเปอร์เซ็นต์ของผู้ใช้และหยุด (halt) ได้; App Store มี phased release ทยอยปล่อยให้ผู้ใช้ที่อัปเดตอัตโนมัติเป็นเวลา 7 วัน; ตั้ง health gate (เช่น crash-free rate ต้องไม่ต่ำกว่าเกณฑ์) ก่อนเพิ่มสัดส่วน","บนมือถือ rollback binary ที่ผู้ใช้ติดตั้งแล้วไม่ได้ จึงต้องมีกลไกลดความเสี่ยงอื่น: feature flag / remote config / kill switch, force update สำหรับเวอร์ชันที่มีปัญหาร้ายแรง","Canary release และ blue-green deployment ฝั่ง backend: ปล่อยให้ traffic ส่วนน้อยก่อน เทียบ metric กับ baseline แล้วค่อยขยายหรือ rollback อัตโนมัติ","ปรับปรุงด้วยวงจร: วัด baseline -> หาคอขวดด้วย profiling/trace -> แก้ทีละจุด -> วัดซ้ำ; ตั้ง performance budget และ SLO เพื่อไม่ให้ถดถอย","รูปแบบ reliability: timeout, retry พร้อม exponential backoff + jitter (เฉพาะ operation ที่ idempotent), circuit breaker, bulkhead, caching, graceful degradation"],"examFocus":["ถ้าแอปช้าเฉพาะบางกลุ่มผู้ใช้ ให้ segment ข้อมูล RUM ตามรุ่นเครื่อง/OS/เครือข่ายก่อนสรุป","ถ้า release เวอร์ชันใหม่ของแอปแล้ว crash-free rate ตก ให้หยุด staged rollout และใช้ flag/ปล่อยเวอร์ชันแก้ ไม่ใช่รอ 'rollback' ใน store","ถ้าอยากลดความเสี่ยงของการ deploy backend ให้เสนอ canary + auto rollback ตาม metric","ถ้าถามว่าจะรู้ได้อย่างไรว่าการปรับปรุงได้ผล ให้ตอบว่ามี baseline และเปรียบเทียบ metric ก่อน-หลังด้วย percentile","ถ้า retry ทำให้ระบบล่มหนักขึ้นช่วงโหลดสูง ให้ใช้ backoff + jitter และ circuit breaker"],"pitfalls":["ดูแค่ค่าเฉลี่ยทั้งระบบจนพลาดกลุ่มผู้ใช้ที่มีปัญหา","ปล่อยเวอร์ชันแอป 100% ทันทีโดยไม่มีแผนหยุด","retry ทุกอย่างทันทีและไม่จำกัด จนเกิด retry storm","ปรับปรุงด้วยความรู้สึกโดยไม่มี baseline"]},{"descriptor":"MON-S4","competency":"Monitoring and Logging","title":"Distributed tracing และ APM","summary":"ติดตามคำขอเดียวข้ามหลาย service ด้วย trace/span เพื่อหาว่าเวลาหายไปที่ไหน และตัดสินใจ sampling ให้ได้ข้อมูลที่ต้องการโดยไม่แพงเกินไป","keyPoints":["Trace คือเส้นทางทั้งหมดของคำขอหนึ่ง ประกอบด้วย span หลายอัน; span หนึ่งคือหนึ่งหน่วยงาน มี name, เวลาเริ่ม/ระยะเวลา, attributes, status และ parent span id ที่ทำให้ต่อเป็นต้นไม้","Context propagation: ต้องส่ง trace context ผ่านทุกขอบเขต (HTTP header, message header ของ queue, async job) ถ้าขาดช่วงใด trace จะแตกเป็นหลายเส้น มาตรฐานคือ W3C Trace Context header `traceparent` (รูปแบบ version-trace_id-parent_id-flags) และ `tracestate`","มือถือ/ไคลเอนต์ต้องสร้าง span ฝั่ง client และ inject header ลงใน request ออกไป เพื่อให้ trace ต่อจากแอปถึง backend ได้; ถ้า backend ไม่ใช้ header เดียวกันหรือ gateway ตัด header trace จะขาด","OpenTelemetry (OTel) เป็นมาตรฐานเปิดสำหรับสร้างและส่ง telemetry (API/SDK, auto-instrumentation, Collector, โปรโตคอล OTLP) ลดการผูกกับ vendor","Head-based sampling ตัดสินใจเก็บหรือไม่ตั้งแต่เริ่ม trace (เช่น สุ่ม 10%) ถูกและง่าย แต่อาจพลาด trace ที่ error หรือช้าซึ่งเกิดไม่บ่อย","Tail-based sampling ตัดสินใจหลัง trace จบ (มักทำที่ Collector) จึงเก็บ trace ที่ error/ช้าได้ครบ แต่ต้อง buffer span ไว้ทั้งหมดชั่วคราว ใช้ทรัพยากรและซับซ้อนกว่า","กลยุทธ์ที่ใช้บ่อย: เก็บทุก trace ที่ error หรือช้ากว่าเกณฑ์ + สุ่มสัดส่วนเล็กน้อยของที่เหลือ และให้ downstream เคารพการตัดสินใจของ parent (parent-based) เพื่อไม่ให้ trace ขาดครึ่ง","ผูก log กับ trace โดยใส่ `trace_id` และ `span_id` ใน log เพื่อกระโดดจาก trace ไปดู log ของ span นั้นได้","APM ให้ service map, latency breakdown ต่อ dependency, error tracking; ระวังไม่ใส่ข้อมูลส่วนบุคคลหรือค่าที่มี cardinality สูงมากใน span attributes ที่ต้อง index"],"examFocus":["ถ้า trace จากแอปมือถือไม่ต่อกับ trace ฝั่ง server ให้ตรวจว่าแอป inject `traceparent` และ gateway/proxy ส่งผ่าน header ไปจริง","ถ้าต้องการเห็น trace ของคำขอที่ error ทุกครั้งแม้ traffic สูง ให้เลือก tail-based sampling (หรือ rule เก็บ error เสมอ)","ถ้าต้นทุน tracing สูงเกินไป ให้ลดด้วย sampling ที่ฉลาดขึ้น ไม่ใช่ปิด tracing ทั้งหมด","ถ้า trace ผ่าน message queue แล้วขาด ให้ส่ง context ผ่าน message headers/attributes","ถ้าถามว่า span กับ trace ต่างกันอย่างไร: trace = ทั้งคำขอ, span = ขั้นตอนหนึ่งใน trace"],"pitfalls":["คิดว่า head-based sampling จะเก็บ error ครบ","คิดว่า tracing แทน log/metric ได้ทั้งหมด ทั้งที่ทั้งสามเสริมกัน","สร้าง trace id ใหม่ในทุก service แทนที่จะส่งต่อของเดิม","ใส่ข้อมูลอ่อนไหวลงใน span attributes"]},{"descriptor":"WEB-S1","competency":"Web & Mobile Development","title":"Rendering pattern, state, storage, navigation","summary":"เลือก rendering pattern และกลยุทธ์จัดการ state/storage ให้เหมาะกับชนิดเนื้อหา (สาธารณะหรือส่วนตัว) และข้อจำกัดของแพลตฟอร์ม เช่น process ของแอปมือถือถูกระบบฆ่า","keyPoints":["CSR/SPA: ส่ง JS bundle แล้ว render ในเบราว์เซอร์ ตอบสนองเร็วหลังโหลดแรกแต่ first paint ช้ากว่าและ SEO/แชร์ลิงก์ไม่ดีถ้าเนื้อหาต้องรอ JS; SSR: render HTML ที่เซิร์ฟเวอร์ต่อคำขอแล้ว hydrate ฝั่ง client เหมาะกับหน้า public ที่ต้องการ SEO และ first paint เร็ว","SSG สร้าง HTML ตอน build (เร็วและถูก เหมาะกับเนื้อหาที่เปลี่ยนไม่บ่อย) และ ISR/revalidate สร้างใหม่เป็นระยะ; หน้า private หลัง login เช่น dashboard ไม่ต้องการ SEO จึงใช้ SPA/CSR ได้ ไม่จำเป็นต้องจ่ายต้นทุน SSR","Hydration คือการผูก event/state เข้ากับ HTML ที่เซิร์ฟเวอร์ render มา; ต้องให้ผล render ฝั่ง server และ client ตรงกันมิฉะนั้นเกิด hydration mismatch","แยกชนิด state: local UI state, global client state, server state (ข้อมูลจาก API ที่ควรมี cache/refetch/invalidate เช่น TanStack Query/SWR) และ URL state (query param ที่แชร์/ย้อนกลับได้); อย่ายัดข้อมูล server ทั้งหมดลง global store","Web storage: `localStorage` (ถาวร, synchronous, ประมาณ 5 MB ต่อ origin, JS อ่านได้ทั้งหมดจึงเสี่ยง XSS), `sessionStorage` (ต่อแท็บ), IndexedDB (ข้อมูลโครงสร้างจำนวนมาก, async), Cache Storage (response ของ service worker), cookie (ส่งไปกับ request อัตโนมัติ)","มือถือ: ระบบปฏิบัติการอาจฆ่า process ของแอปที่อยู่เบื้องหลังเมื่อขาดหน่วยความจำ (process death) เมื่อกลับมาแอปต้องกู้ state ที่ผู้ใช้เห็นได้: Android ใช้ `onSaveInstanceState`/`SavedStateHandle`/persist ลงที่เก็บถาวร, iOS ใช้ state restoration/`@SceneStorage`; ข้อมูลสำคัญต้อง persist ไม่เก็บไว้แค่ในหน่วยความจำ","ความลับ (token) บนมือถือควรเก็บใน Keychain (iOS) / Keystore (Android) ไม่ใช่ SharedPreferences/AsyncStorage แบบ plain text","Offline-first และ sync: เขียนลง local DB (SQLite/Room/Core Data/IndexedDB) ก่อน แล้วใส่คิว (outbox) รอส่งเมื่อออนไลน์; แต่ละรายการมี idempotency key เพื่อ retry ได้ปลอดภัย, retry แบบ exponential backoff, และมีนโยบายแก้ conflict (last-write-wins, version/ETag, merge ตามฟิลด์)","Navigation: client-side routing (History API) ไม่โหลดหน้าใหม่; รองรับ deep link / universal link บนมือถือ และเก็บ state สำคัญใน URL/route param เพื่อกลับมาถึงหน้าเดิมได้"],"examFocus":["ถ้าหน้า marketing/สินค้า public ต้องติดอันดับค้นหาและโหลดเร็ว ให้เลือก SSR/SSG; ถ้าเป็นหลังบ้านหลัง login ให้ SPA ได้","ถ้าผู้ใช้กรอกฟอร์มค้างไว้แล้วสลับแอปไปนานแล้วข้อมูลหาย ให้สงสัย process death และให้บันทึก/กู้ state","ถ้าต้องให้แอปใช้งานเขียนข้อมูลได้ตอนออฟไลน์ ให้ใช้ local DB + outbox queue + idempotency + conflict policy","ถ้าเลือกที่เก็บ token บนเว็บและมือถือ ให้นึกถึงความเสี่ยง XSS (localStorage) และ Keychain/Keystore บนมือถือ","ถ้าเกิดข้อมูลไม่ตรงกันระหว่างหลายอุปกรณ์ ให้ถามนโยบาย conflict resolution"],"pitfalls":["ใช้ SSR กับทุกหน้าเพราะ 'ดีกว่า' ทั้งที่เพิ่มต้นทุนเซิร์ฟเวอร์และความซับซ้อน","เก็บ state ผู้ใช้ไว้ใน memory ของแอปมือถืออย่างเดียว","retry คิวออฟไลน์โดยไม่มี idempotency ทำให้เกิดรายการซ้ำ","เก็บข้อมูลละเอียดอ่อนใน localStorage/ที่เก็บ plain text"]},{"descriptor":"WEB-S2","competency":"Web & Mobile Development","title":"UI performance: virtualization, code splitting, รูปภาพ","summary":"ทำให้ UI ลื่นและโหลดเร็วด้วยการลดงานที่ทำ ลดข้อมูลที่ส่ง และวัดผลด้วยเครื่องมือ profiling ไม่ใช่การเดา","keyPoints":["List virtualization/windowing: render เฉพาะรายการที่มองเห็น (+ buffer) และ recycle view: Android `RecyclerView`, iOS `UITableView`/`UICollectionView` (cell reuse), React Native `FlatList`, เว็บใช้ไลบรารีอย่าง `react-window`; ให้ key/id ที่เสถียรและหลีกเลี่ยงการคำนวณหนักใน item","Code splitting ด้วย dynamic `import()` แบ่ง bundle ตาม route หรือ component ใหญ่ ให้โหลดเมื่อต้องใช้ (lazy loading) ลด JS ที่ต้อง parse ตอนเริ่ม; วิเคราะห์ขนาดด้วย bundle analyzer และใช้ tree shaking","Core Web Vitals: LCP (Largest Contentful Paint) ดีเมื่อ <= 2.5 วินาที, INP (Interaction to Next Paint) <= 200 ms, CLS (Cumulative Layout Shift) <= 0.1 (วัดที่เปอร์เซ็นไทล์ที่ 75 ของผู้ใช้จริง)","รูปที่เป็น LCP element (hero image) ไม่ควร lazy-load; ควร preload หรือใส่ `fetchpriority='high'` และ lazy-load รูปที่อยู่นอกจอ (`loading='lazy'`)","รูปภาพ: ใช้รูปแบบสมัยใหม่ (WebP/AVIF), ส่งขนาดให้พอดีหน้าจอด้วย `srcset`/`sizes`, บีบอัดเหมาะสม, และใช้ CDN ที่ resize/แปลงเป็นหลาย variant ตามอุปกรณ์ (มือถือไม่ควรโหลดรูปขนาดเดสก์ท็อป)","กำหนด `width`/`height` (หรือ aspect-ratio) ของรูปและพื้นที่โฆษณา/embed เพื่อไม่ให้ layout กระโดด (ลด CLS)","Animation ที่ลื่น: ใช้ property ที่ compositor ทำได้โดยไม่ reflow อย่าง `transform` และ `opacity` แทน `top/left/width/height`; เป้า 60 fps = ประมาณ 16.7 ms ต่อเฟรม","ลด re-render ที่ไม่จำเป็น (memoization อย่างมีหลักฐาน), debounce/throttle event ถี่ๆ, ย้ายงานหนักไป Web Worker/background thread, อย่าบล็อก main/UI thread","วัดก่อนแก้: Chrome DevTools Performance/Lighthouse บนเว็บ, Android Studio Profiler, Xcode Instruments บนมือถือ"],"examFocus":["ถ้ารายการยาวหลายพันแถวทำให้ scroll กระตุกหรือกินหน่วยความจำ ให้ใช้ virtualization","ถ้า LCP ช้าเพราะ hero image ให้ preload/ลดขนาด/ใช้รูปแบบใหม่และอย่า lazy-load รูปนั้น","ถ้า bundle แรกใหญ่ ให้ทำ route-based code splitting และ lazy load ส่วนที่ไม่ได้ใช้ทันที","ถ้าผู้ใช้มือถือโหลดรูปขนาดใหญ่เกิน ให้ใช้ responsive images และ CDN image variants","ถ้า animation กระตุก ให้ตรวจว่า animate property ที่ทำให้ layout ใหม่หรือไม่ แล้วเปลี่ยนเป็น transform/opacity"],"pitfalls":["lazy-load ทุกรูปรวมถึงรูปบนจอแรกทำให้ LCP แย่ลง","ใช้ `React.memo`/`useMemo` ทุกที่โดยไม่วัดผล","ส่งรูปความละเอียดสูงตัวเดียวให้ทุกอุปกรณ์แล้วย่อด้วย CSS","แยก bundle มากเกินไปจน request เป็นจำนวนมาก/waterfall"]},{"descriptor":"WEB-S3","competency":"Web & Mobile Development","title":"CSS ขั้นสูง, PWA, XSS/CSRF","summary":"ใช้ CSS สมัยใหม่และ PWA เพื่อประสบการณ์ที่ยืดหยุ่นและใช้ออฟไลน์ได้ พร้อมปิดช่องโหว่ฝั่ง frontend ที่พบบ่อยอย่าง XSS และ CSRF","keyPoints":["CSS custom properties (`--color-bg` และ `var(--color-bg)`) เป็นค่าที่ resolve ตอน runtime ในเบราว์เซอร์ จึงเปลี่ยนธีมได้ทันทีโดยสลับค่าที่ `:root` หรือ `[data-theme='dark']`; ต่างจากตัวแปร Sass (`$color`)/Less (`@color`) ที่ถูก compile เป็นค่าคงที่ก่อน deploy","Sass/Less
