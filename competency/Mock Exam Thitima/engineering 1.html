ง และบางครั้งผู้ใช้เห็นรายการซ้ำหรือตกหล่น เมื่อมีธุรกรรมใหม่เข้ามาระหว่างเลื่อนหน้า วิธีใดช่วยแก้ปัญหา (เลือกทุกข้อที่ถูก)","code":"SELECT id, created_at, amount\nFROM transactions\nWHERE account_id = :account_id\nORDER BY created_at DESC, id DESC\nLIMIT 50 OFFSET :offset;","codeLang":"sql","options":[{"id":"A","text":"ใช้ keyset (cursor) pagination: ส่ง created_at และ id ของแถวสุดท้ายเป็น cursor แล้วเพิ่มเงื่อนไข AND (created_at \u003c :c OR (created_at = :c AND id \u003c :i)) ตาม ORDER BY","correct":true,"why":"ถูก เพราะเริ่มอ่านต่อจากตำแหน่งของแถวสุดท้ายแทนการนับข้ามแถว จึงเร็วเท่ากันทุกหน้า และแถวใหม่ที่เข้ามาด้านหน้าไม่ทำให้ตำแหน่งของหน้าถัดไปเลื่อน"},{"id":"B","text":"เพิ่ม index บน created_at อย่างเดียวและคง OFFSET ไว้ เพราะ index ทำให้การข้าม 100,000 แถวใช้เวลาคงที่ไม่ว่าจะเลื่อนไปลึกแค่ไหน","correct":false,"why":"OFFSET ยังต้องเดินผ่านรายการใน index และทิ้งแถวไปตามจำนวน offset เวลาจึงเพิ่มตามความลึกของหน้า และปัญหารายการซ้ำหรือตกหล่นยังอยู่"},{"id":"C","text":"มี index (account_id, created_at, id) ให้ตรงกับเงื่อนไขและ ORDER BY เพื่อเริ่มอ่านจาก cursor ได้ทันทีและหยุดเมื่อครบ 50 แถว","correct":true,"why":"ถูก เพราะ account_id ที่อยู่นำหน้าทำให้อ่านเฉพาะรายการของบัญชีนั้น ส่วน created_at และ id เรียงตรงกับ ORDER BY โดย id ช่วยให้ลำดับไม่กำกวมเมื่อ created_at ซ้ำกัน keyset จึงใช้ index ได้เต็มที่"},{"id":"D","text":"รัน SELECT COUNT(*) ก่อนทุกหน้า เพื่อคำนวณ offset ใหม่ให้ตรงกับจำนวนแถวปัจจุบันก่อนส่ง offset นั้นเข้าคำค้นหลัก","correct":false,"why":"COUNT(*) ต้องนับแถวทั้งหมดจึงช้าลงอีก และไม่ได้แก้ที่ต้นเหตุ เพราะการเลื่อนตำแหน่งของแถวระหว่างโหลดหน้ายังคงเกิดขึ้น"}],"explanation":"OFFSET ต้องอ่านแล้วทิ้งแถวตามจำนวนที่ข้าม และตำแหน่งเลื่อนเมื่อข้อมูลเปลี่ยน ส่วน keyset pagination อ้างอิงค่าของแถวสุดท้ายและใช้ index ที่ขึ้นต้นด้วยคอลัมน์ที่กรองแล้วเรียงตรงกับ ORDER BY จึงเร็วคงที่และเสถียรกว่าสำหรับรายการที่มีข้อมูลเข้ามาตลอด"},{"id":"ENG-S-E-011","level":"senior","pool":"exam","competency":"SQL","descriptor":"SQL-S4","concept":"sql-foreign-key-restrict-anonymize-pdpa","mobile":false,"type":"single","stem":"ลูกค้าคนหนึ่งขอใช้สิทธิ์ลบข้อมูลส่วนบุคคลตาม PDPA แต่บริษัทต้องเก็บข้อมูลคำสั่งซื้อและใบกำกับภาษีไว้ตามกฎหมาย ซึ่งบันทึกอยู่ในตาราง orders และ invoices อยู่แล้ว คอลัมน์ orders.customer_id เป็น NOT NULL และมี FOREIGN KEY อ้างอิง customers(id) เพื่อรับประกันว่าทุกออเดอร์ระบุลูกค้าได้ ทีมต้องเลือกพฤติกรรมของ FK และวิธีดำเนินการกับแถวใน customers ควรเลือกแบบใด","options":[{"id":"A","text":"เปลี่ยน FK เป็น ON DELETE CASCADE แล้วลบแถวใน customers เพื่อให้ข้อมูลส่วนบุคคลหายทั้งหมดตามสิทธิ์ของลูกค้า รวมถึงข้อมูลที่ผูกกับลูกค้านั้น","correct":false,"why":"CASCADE ลบ orders ของลูกค้าตามไปด้วย ซึ่งทำให้ข้อมูลที่กฎหมายกำหนดให้ต้องเก็บหายไป"},{"id":"B","text":"เปลี่ยน FK เป็น ON DELETE SET NULL แล้วลบแถวใน customers เพื่อให้ออเดอร์ยังอยู่ต่อไปโดยไม่มีข้อมูลลูกค้าผูกอยู่อีก","correct":false,"why":"orders.customer_id เป็น NOT NULL การตั้งเป็น NULL จะผิดข้อจำกัดและการลบถูกปฏิเสธ ต้องแก้โครงสร้างที่ออกแบบไว้เพื่อประกันความสัมพันธ์"},{"id":"C","text":"คง FK แบบ ON DELETE RESTRICT ไม่ลบแถวใน customers แต่แทนที่ข้อมูลส่วนบุคคล เช่น ชื่อ อีเมล เบอร์โทร ด้วยค่าที่ระบุตัวตนไม่ได้ (anonymize)","correct":true,"why":"ถูก เพราะข้อมูลที่ต้องเก็บยังอยู่ครบและความสัมพันธ์ของ FK ไม่ขาด ขณะที่ข้อมูลส่วนบุคคลที่ไม่จำเป็นถูกกำจัดออกจากระบบจริง"},{"id":"D","text":"ปิด FK constraint ชั่วคราว ลบแถวใน customers แล้วเปิดใหม่ เพื่อให้ลบได้โดยออเดอร์และใบกำกับภาษียังอยู่ครบตามเดิม","correct":false,"why":"orders จะชี้ไปยังลูกค้าที่ไม่มีอยู่ (orphan) และการเปิด constraint กลับอาจล้มเหลวหรือไม่ตรวจแถวเดิม ทำให้ความสัมพันธ์เสียหายถาวร"}],"explanation":"FOREIGN KEY ควรถูกเลือกให้สอดคล้องกับข้อกำหนดทางธุรกิจและกฎหมาย เมื่อข้อมูลต้องเก็บแต่ข้อมูลส่วนบุคคลต้องหายไป ให้คง referential integrity ด้วย RESTRICT และทำ anonymization ที่แถวแทนการลบ แทนที่จะเปิดช่องให้ลบหรือตัดความสัมพันธ์"},{"id":"ENG-S-E-012","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S1","concept":"oop-template-method-shared-export-steps","mobile":false,"type":"single","stem":"ระบบส่งออกรายงานมีคลาส CsvExporter, XlsxExporter และ PdfExporter ที่คัดลอกขั้นตอนเดียวกันไปไว้ในแต่ละคลาส คือตรวจสิทธิ์ ดึงข้อมูล แปลงเป็นรูปแบบไฟล์ แล้วบันทึก audit log โดยต่างกันเฉพาะขั้นแปลงรูปแบบ เมื่อต้องแก้ขั้นตรวจสิทธิ์ ต้องแก้ 3 ไฟล์ และเคยแก้พลาดไฟล์หนึ่ง ทีมต้องเพิ่มรูปแบบใหม่ปีละหลายครั้งโดยคนละทีม และการเพิ่มรูปแบบใหม่ต้องไม่แก้โค้ดของรูปแบบเดิมที่ผ่านการทดสอบแล้ว ควรปรับด้วยแนวทางใด","options":[{"id":"A","text":"ย้ายแต่ละขั้นตอนเป็นเมธอด static ในคลาส ExportUtils แล้วให้ทั้งสามคลาสเรียกทีละขั้นตามลำดับของตัวเอง เพื่อใช้โค้ดของแต่ละขั้นร่วมกันในที่เดียว","correct":false,"why":"ลดโค้ดซ้ำของเนื้อขั้นตอน แต่ลำดับขั้นตอนยังซ้ำอยู่ในทุกคลาส รูปแบบใหม่อาจเรียงขั้นผิดหรือลืม audit log ได้"},{"id":"B","text":"รวมสามคลาสเป็น Exporter คลาสเดียวที่รับพารามิเตอร์ format และใช้ switch ในขั้นแปลงรูปแบบ ส่วนขั้นอื่นเขียนไว้ครั้งเดียวในเมธอด export เดียวกัน","correct":false,"why":"ทุกรูปแบบใหม่ต้องแก้คลาสนี้ซึ่งผ่านการทดสอบแล้ว ขัดกับข้อห้ามแก้โค้ดเดิมและทำให้หลายทีมแก้ไฟล์เดียวกันชนกัน"},{"id":"C","text":"ให้คลาสสืบทอดต่อกันเป็นสาย PdfExporter → XlsxExporter → CsvExporter เพื่อนำขั้นตอนของคลาสก่อนหน้ากลับมาใช้ ลดการคัดลอกระหว่างคลาส","correct":false,"why":"ความสัมพันธ์ \"เป็น\" ไม่จริง Pdf ไม่ใช่ชนิดหนึ่งของ Xlsx การสืบทอดเพื่อประหยัดโค้ดทำให้รูปแบบหนึ่งพกพฤติกรรมของอีกรูปแบบมาด้วยและผูกกันแน่น"},{"id":"D","text":"สร้างคลาสแม่แบบ abstract กำหนดลำดับขั้นตอนไว้ในเมธอด export() (Template Method) โดยขั้นตรวจสิทธิ์ ดึงข้อมูล และ audit log อยู่ในแม่ ส่วนขั้นแปลงรูปแบบให้คลาสลูก implement","correct":true,"why":"ถูก เพราะลำดับขั้นตอนและขั้นร่วมอยู่ที่เดียว แก้ครั้งเดียวมีผลกับทุกรูปแบบ และรูปแบบใหม่เป็นการเพิ่มคลาสลูกโดยไม่แตะคลาสเดิม"}],"explanation":"เมื่อขั้นตอนของอัลกอริทึมเหมือนกันแต่ต่างกันบางขั้น ใช้ Template Method กำหนดโครงลำดับขั้นตอนไว้ในคลาสแม่และให้คลาสลูกเติมเฉพาะส่วนที่ต่าง จะลดโค้ดซ้ำและเปิดให้ขยายโดยไม่แก้ของเดิม (Open/Closed)"},{"id":"ENG-S-E-013","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S2","concept":"oop-is-a-vs-has-a-stack-extends-list","mobile":false,"type":"multiple","stem":"ทีมสร้างคลาส Stack ด้วยการสืบทอดจากคลาส List ของไลบรารี เพื่อ reuse โค้ดโดยเพิ่มเมธอด push และ pop ภายหลังพบว่าโค้ดฝั่งผู้ใช้เรียก insertAt และ remove ที่ตำแหน่งกลางของ Stack ได้ ทำให้ลำดับเข้าหลังออกก่อน (LIFO) ที่ Stack ต้องรักษาไว้เสียไป ข้อใดเป็นแนวทางแก้ที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้ Stack เก็บ List เป็นสมาชิกภายใน (has-a) และเปิดเฉพาะ push, pop, peek เพราะ Stack ใช้ List เป็นที่เก็บ ไม่ใช่ชนิดหนึ่งของ List","correct":true,"why":"ถูก เพราะ composition ซ่อนเมธอดที่ไม่ควรเปิด ผู้ใช้จึงทำลายลำดับ LIFO ผ่านทางอื่นไม่ได้ และเปลี่ยนที่เก็บภายในได้โดยผู้ใช้ไม่รู้"},{"id":"B","text":"override insertAt และ remove ในคลาส Stack ให้ throw exception เมื่อถูกเรียก ก็ปลอดภัยเพียงพอ เพราะ Stack ยังเป็น List อยู่","correct":false,"why":"โค้ดที่รับ List และเรียกเมธอดเหล่านี้จะพังตอนรันเมื่อได้ Stack ซึ่งเป็นการละเมิดสัญญาของคลาสแม่ (Liskov) ปัญหาถูกซ่อนไว้ไม่ได้ถูกแก้"},{"id":"C","text":"ลดระดับการเข้าถึงของเมธอดที่สืบทอดมาอย่าง insertAt และ remove ให้เป็น private ในคลาส Stack เพื่อไม่ให้ผู้ใช้ภายนอกเรียกเมธอดเหล่านี้ได้","correct":false,"why":"ภาษาส่วนใหญ่ไม่อนุญาตให้คลาสลูกลดระดับการเข้าถึงของเมธอดที่สืบทอดมา และถึงทำได้ก็ยังผิดสัญญาของ List ที่ผู้ใช้ผ่านชนิดแม่ยังเรียกเมธอดเหล่านี้ได้"},{"id":"D","text":"กำหนด interface Stack\u003cT> ที่มีแค่ push, pop, peek และสร้างคลาส ListBackedStack ที่ implement โดยใช้ List ภายใน เพื่อเปลี่ยนที่เก็บภายหลังได้","correct":true,"why":"ถูก เพราะผู้ใช้พึ่งสัญญาเล็กที่สะท้อนพฤติกรรมของ Stack จริง ๆ และ implementation ซ่อนอยู่หลัง interface จึงเปลี่ยนไปใช้ array หรือ linked list ได้โดยไม่กระทบ"},{"id":"E","text":"สร้างคลาสแม่ใหม่ StackList ที่สืบทอดจาก List แล้วให้ Stack สืบทอดต่อจาก StackList อีกชั้น เพื่อแยกส่วนที่เกี่ยวกับ stack ออกจากคลาส List","correct":false,"why":"เพิ่มชั้นสืบทอดโดยไม่ได้เปลี่ยนความสัมพันธ์ Stack ยังเป็นลูกของ List และยังเปิดเมธอดทั้งหมดของ List ให้ผู้ใช้เหมือนเดิม"}],"explanation":"สืบทอดเมื่อความสัมพันธ์เป็น \"is-a\" จริงและคลาสลูกแทนที่คลาสแม่ได้โดยไม่ผิดสัญญา ถ้าเพียงต้องการนำพฤติกรรมของอีกคลาสมาใช้ ให้ใช้ composition ซ่อนรายละเอียดไว้ภายใน และเปิดเฉพาะสัญญาที่ต้องการ"},{"id":"ENG-S-E-014","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S3","concept":"oop-encapsulation-leaking-internal-collection","mobile":false,"type":"multiple","stem":"คลาส Order ด้านล่างมี lines เป็น private readonly แต่ทีมพบว่า total ไม่ตรงกับผลรวมของ lines เป็นครั้งคราว โดยพบว่าโค้ดส่วนอื่นเรียก order.getLines().push(...) หรือแก้ price ของ line ที่ได้มาโดยตรง ข้อใดช่วยรักษา invariant ของ Order ได้ (เลือกทุกข้อที่ถูก)","code":"class Order {\n  private readonly lines: OrderLine[] = [];\n  private total = 0;\n\n  addLine(line: OrderLine): void {\n    this.lines.push(line);\n    this.total += line.price * line.qty;\n  }\n\n  getLines(): OrderLine[] {\n    return this.lines;\n  }\n\n  getTotal(): number {\n    return this.total;\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"ระบุใน JSDoc ของ getLines() ว่าห้ามแก้ไขค่าที่ได้รับกลับไป และตรวจใน code review ว่าผู้เรียกไม่แก้ค่านั้น พร้อมเพิ่มตัวอย่างการใช้ที่ถูกต้องในเอกสาร","correct":false,"why":"เป็นเพียงข้อตกลงที่ไม่มีอะไรบังคับ ภาษาและ compiler ไม่ขัดขวางการ push จึงหลุดได้ง่ายเมื่อโค้ดฐานใหญ่ขึ้นหรือมีผู้เขียนใหม่"},{"id":"B","text":"คืนสำเนาแบบอ่านอย่างเดียว (เช่น ReadonlyArray ของ OrderLine ที่ immutable) จาก getLines() และให้การเปลี่ยนแปลงผ่านเมธอดของ Order เช่น addLine หรือ removeLine","correct":true,"why":"ถูก เพราะ Order เป็นผู้ควบคุมทางเดียวในการเปลี่ยน lines จึงอัปเดต total ให้สอดคล้องได้ทุกครั้ง และผู้เรียกแก้เนื้อในโดยตรงไม่ได้"},{"id":"C","text":"เปลี่ยน lines เป็น public readonly เพราะ readonly ป้องกันการแก้เนื้อในอาร์เรย์อยู่แล้ว ผู้เรียกจึงอ่านได้โดยตรงอย่างปลอดภัยโดยไม่ผ่านเมธอด","correct":false,"why":"readonly ห้ามกำหนดค่าให้ตัวแปรใหม่เท่านั้น ไม่ห้ามเรียก push หรือแก้สมาชิกของอาร์เรย์เดิม การเปิดเป็น public จึงทำให้ปัญหาแย่ลง"},{"id":"D","text":"เลิกเก็บ total เป็นฟิลด์แยก แล้วคำนวณจาก lines ทุกครั้งที่เรียก getTotal() เพื่อไม่ให้มีข้อมูลสองที่ที่ต้องตรงกัน","correct":true,"why":"ถูก เพราะ total เป็นข้อมูลที่หาได้จาก lines (derived data) การไม่เก็บซ้ำทำให้ไม่มีโอกาสไม่ตรงกัน ไม่ว่า lines จะถูกเปลี่ยนด้วยทางใด"}],"explanation":"Encapsulation ไม่ใช่แค่ private ที่ field แต่คือการไม่ปล่อย reference ภายในที่แก้ไขได้ออกไป ควรคืนสำเนาหรือมุมมองอ่านอย่างเดียว ให้การเปลี่ยนแปลงผ่านเมธอดของคลาสที่ดูแล invariant และหลีกเลี่ยงข้อมูลซ้ำที่ต้องรักษาให้ตรงกัน"},{"id":"ENG-S-E-015","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S4","concept":"oop-liskov-substitution-unsupported-refund","mobile":false,"type":"single","stem":"RefundService วนเรียก refund กับทุก PaymentMethod ในรายการ ต่อมาทีมเพิ่ม CashOnDelivery ซึ่งคืนเงินผ่านระบบไม่ได้เพราะลูกค้าจ่ายเงินสดกับพนักงานส่งของ จึง override refund ให้ throw Error ทำให้ RefundService ล้มกลางทางเมื่อเจอ CashOnDelivery ควรแก้ที่ต้นเหตุอย่างไร","code":"abstract class PaymentMethod {\n  abstract refund(orderId: string, amount: number): Promise\u003cvoid>;\n}\n\nclass CashOnDelivery extends PaymentMethod {\n  async refund(): Promise\u003cvoid> {\n    throw new Error('refund not supported');\n  }\n}\n\nasync function refundAll(methods: PaymentMethod[], orderId: string, amount: number) {\n  for (const m of methods) {\n    await m.refund(orderId, amount);\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"ให้ RefundService จับ exception ที่เกิดจาก refund แล้วใช้ instanceof ข้ามกรณี CashOnDelivery เพื่อให้ลูปคืนเงินของวิธีอื่นทำงานต่อได้ครบ","correct":false,"why":"แก้ที่อาการ ผู้เรียกต้องรู้จักคลาสลูกทุกตัวที่ผิดสัญญา และเมื่อมีชนิดใหม่ที่คืนเงินไม่ได้ต้องแก้ซ้ำ"},{"id":"B","text":"แยกความสามารถคืนเงินเป็น interface Refundable ให้เฉพาะวิธีที่คืนเงินได้ implement และให้ RefundService รับเฉพาะ Refundable เพื่อไม่ให้ชนิดลูกผิดสัญญาของแม่","correct":true,"why":"ถูก เพราะ CashOnDelivery ไม่อยู่ในรายการที่ถูกส่งให้ RefundService ตั้งแต่ระดับชนิด ทุกคลาสที่ผ่านเข้ามาจึงทำตามสัญญา refund ได้จริง (Liskov Substitution)"},{"id":"C","text":"ให้ CashOnDelivery.refund คืนค่าเงียบ ๆ โดยไม่ทำอะไรแทนการ throw เพื่อให้ลูปทำงานต่อได้ และไม่มีข้อผิดพลาดหลุดขึ้นไปถึงผู้ใช้","correct":false,"why":"ผู้เรียกเข้าใจว่าคืนเงินสำเร็จทั้งที่ไม่ได้ทำอะไร เป็นความล้มเหลวที่เงียบและอาจกระทบลูกค้าและบัญชี"},{"id":"D","text":"เพิ่มเมธอด canRefund() ในคลาสแม่ ให้ CashOnDelivery คืน false และให้ผู้เรียกทุกจุดเช็คก่อนเรียก refund ทุกครั้ง โดยคง refund ในคลาสแม่ไว้ตามเดิม","correct":false,"why":"ผู้เรียกทุกจุดต้องจำเช็ค ถ้าลืมก็พังเหมือนเดิม และ CashOnDelivery ยังเป็นชนิดลูกที่รับสัญญา refund ซึ่งทำไม่ได้"}],"explanation":"หลัก Liskov: ชนิดลูกต้องใช้แทนชนิดแม่ได้โดยไม่ทำให้ผู้เรียกพัง ถ้าคลาสลูกต้อง throw ว่าไม่รองรับเมธอดของแม่ แปลว่าลำดับชั้นหรือสัญญาออกแบบไม่ตรงกับความจริง ให้แยกความสามารถออกเป็น interface เล็กแทนการจัดการกรณีพิเศษที่ผู้เรียก"},{"id":"ENG-S-E-016","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S4","concept":"oop-interface-segregation-fat-store","mobile":false,"type":"single","stem":"อินเทอร์เฟซ ReportStore มีเมธอด read, list, write, delete และ archive มีคลาส implement สามตัว คือ DatabaseStore (ทำได้ครบ) S3ReadOnlyMirror (อ่านอย่างเดียว) และ AuditViewer ที่ใช้เพียง read กับ list แต่ต้องเขียนเมธอดที่เหลือเป็น stub ที่ throw ทีมพบว่าการเพิ่มเมธอดใหม่ใน ReportStore ต้องแก้ทุกคลาสแม้ไม่เกี่ยวข้อง ควรปรับอย่างไร","options":[{"id":"A","text":"คงอินเทอร์เฟซเดิมไว้ แล้วสร้าง abstract class BaseReportStore ที่ implement ทุกเมธอดด้วยการ throw ให้คลาสลูก override เฉพาะที่รองรับ เพื่อลดจำนวน stub ที่ต้องเขียนซ้ำ","correct":false,"why":"ย้ายโค้ด stub ไปไว้ที่คลาสแม่ แต่สัญญายังกว้างเหมือนเดิม ผู้เรียกยังไม่รู้จากชนิดว่าเมธอดใดใช้ได้ และความผิดพลาดยังเกิดตอนรัน"},{"id":"B","text":"เพิ่มเมธอด supports(operation) ในอินเทอร์เฟซเดิม ให้ผู้เรียกเช็คก่อนเรียกเมธอดทุกครั้ง และให้คลาสที่ไม่รองรับคืนค่า false","correct":false,"why":"อินเทอร์เฟซยังอ้วนและทุกคลาสยังต้องแก้เมื่อเพิ่มเมธอด ภาระการเช็คตกอยู่ที่ผู้เรียกทุกจุดซึ่งลืมได้"},{"id":"C","text":"แยกเป็นอินเทอร์เฟซเล็กตามบทบาท เช่น ReportReader (read, list), ReportWriter (write, delete), ReportArchiver (archive) ให้แต่ละคลาส implement เท่าที่ใช้","correct":true,"why":"ถูก เพราะผู้ใช้แต่ละราย (Interface Segregation) พึ่งเฉพาะเมธอดที่ใช้จริง การเพิ่มเมธอดในบทบาทหนึ่งไม่กระทบคลาสที่ไม่ได้ implement บทบาทนั้น และไม่ต้องมี stub"},{"id":"D","text":"รวม S3ReadOnlyMirror และ AuditViewer เข้าเป็นคลาสเดียว เพื่อให้เหลือผู้ implement เพียงสองตัวที่ต้องแก้เมื่อมีเมธอดใหม่","correct":false,"why":"ลดจำนวนคลาสแต่ไม่ได้แก้ปัญหาสัญญากว้างเกินจำเป็น และรวมความรับผิดชอบสองอย่างที่ไม่เกี่ยวกันไว้ด้วยกัน"}],"explanation":"ผู้ที่ implement หรือใช้อินเทอร์เฟซไม่ควรถูกบังคับให้พึ่งเมธอดที่ตัวเองไม่ใช้ (Interface Segregation) อินเทอร์เฟซที่อ้วนทำให้เกิด stub ที่ throw และการเปลี่ยนที่กระทบทุกคลาส ให้แยกตามบทบาทของผู้ใช้"},{"id":"ENG-S-E-017","level":"senior","pool":"exam","competency":"OOP","descriptor":"OOP-S5","concept":"oop-singleton-global-state-to-injection","mobile":false,"type":"multiple","stem":"โค้ดฐานเดิมมี ConfigManager.getInstance(), Logger.getInstance() และ DbPool.getInstance() แบบ Singleton ที่ถูกเรียกจากหลายสิบคลาส ทีมพบว่า unit test ต้องตั้งค่าและล้างสถานะของ singleton ระหว่างเทสต์ บางเทสต์ผ่านหรือไม่ผ่านตามลำดับการรัน และทดสอบด้วยค่ากำหนดที่ต่างกันในกระบวนการเดียวกันไม่ได้ แนวทางใดแก้ปัญหาโดยยังคงให้มีอินสแตนซ์เดียวใน production (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ให้คลาสที่ใช้งานรับ dependency ผ่าน constructor แทนการเรียก getInstance() เอง","correct":true,"why":"ถูก เพราะความต้องการถูกประกาศให้เห็นที่ constructor เทสต์ส่งตัวปลอมหรือค่ากำหนดต่างกันเข้าไปได้ในแต่ละเทสต์โดยไม่แชร์สถานะ"},{"id":"B","text":"เพิ่มเมธอด reset() แบบ public ให้แต่ละ singleton และเรียกก่อนทุกเทสต์ เพื่อล้างสถานะที่ค้างจากเทสต์ก่อนหน้า","correct":false,"why":"ลดอาการค้างของสถานะ แต่ยังเป็น global ที่ซ่อนอยู่ ยังทดสอบด้วยค่ากำหนดต่างกันพร้อมกันไม่ได้ และเปิดเมธอดล้างสถานะให้โค้ดจริงเรียกได้ด้วย"},{"id":"C","text":"เปลี่ยนคลาสเหล่านี้เป็นคลาสที่มีเมธอด static ทั้งหมดเพื่อเลี่ยงการสร้างอินสแตนซ์ และเรียกใช้ผ่านชื่อคลาสโดยตรง","correct":false,"why":"static ยังเป็นสถานะ global ที่ผูกแน่นกับผู้เรียก และแทนที่ด้วยตัวปลอมในเทสต์ได้ยากกว่าเดิม"},{"id":"D","text":"กำหนดอินเทอร์เฟซให้ ConfigManager และ Logger เพื่อให้เทสต์แทนด้วย fake หรือ stub ได้","correct":true,"why":"ถูก เพราะผู้ใช้พึ่งสัญญา ไม่ผูกกับ implementation จริง เทสต์จึงควบคุมค่ากำหนดและตรวจผลที่เขียนได้โดยไม่แตะระบบภายนอก"},{"id":"E","text":"สร้างอินสแตนซ์เพียงตัวเดียวที่จุดประกอบแอป (composition root) หรือ DI container ที่ตั้ง lifetime เป็นอินสแตนซ์เดียว แล้วส่งต่อให้ผู้ใช้","correct":true,"why":"ถูก เพราะยังได้อินสแตนซ์เดียวใน production ตามเดิม แต่การควบคุมอายุอยู่ที่จุดประกอบ ไม่ใช่ตัวคลาสเอง จึงสร้างชุดใหม่ต่อเทสต์ได้"}],"explanation":"ปัญหาของ Singleton คือสถานะ global ที่ซ่อนอยู่ ทำให้ทดสอบและสลับตัวแทนยาก ให้แยก \"มีอินสแตนซ์เดียว\" ออกจากตัวคลาส โดยให้จุดประกอบแอปควบคุมอายุ และส่ง dependency เข้าไปผ่านอินเทอร์เฟซ"},{"id":"ENG-S-E-018","level":"senior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-S1","concept":"mon-metric-label-cardinality","mobile":false,"type":"single","stem":"ทีมเพิ่ม metric ของเวลาตอบสนอง API ร้านค้าออนไลน์ในระบบเก็บ metric แบบ time series โดยใส่ label user_id และ request_path (เส้นทางจริงที่มี id สินค้าต่อท้าย) เพื่อให้ไล่ดูรายผู้ใช้ได้ หนึ่งสัปดาห์ต่อมาระบบเก็บ metric ใช้หน่วยความจำเพิ่มหลายเท่าและ query บน dashboard ช้ามาก ควรแก้อย่างไรโดยยังไล่ปัญหาของผู้ใช้รายคนได้","options":[{"id":"A","text":"ใช้ label ที่มีค่าจำกัด เช่น route template (/products/:id), method และสถานะ แล้วย้ายการไล่ดูรายผู้ใช้ไปที่ trace หรือ log","correct":true,"why":"ถูก เพราะ metric หนึ่งชุดค่า label คือหนึ่ง time series การจำกัดค่า label ลดจำนวน series ลง ส่วนรายละเอียดรายผู้ใช้เหมาะกับ trace และ log ที่ออกแบบมาเก็บข้อมูลรายคำขอ"},{"id":"B","text":"คง label user_id ไว้ แต่ลด retention ของ metric ลงเหลือ 2 วัน เพื่อให้จำนวน time series ที่ต้องเก็บลดลงตามไปด้วยในระยะยาว","correct":false,"why":"ผิด เพราะจำนวน series ที่ active ขณะนั้นยังสูงเท่าเดิม หน่วยความจำและ query ที่ช้าอยู่ที่ series ที่เขียนอยู่ ไม่ใช่เฉพาะข้อมูลย้อนหลัง"},{"id":"C","text":"เปลี่ยนค่า user_id เป็น hash แล้วคง label ไว้ เพื่อไม่ให้ข้อมูลส่วนบุคคลปรากฏตรงๆ ใน metric และใน dashboard ของทีมงานทุกคน","correct":false,"why":"ผิด เพราะ hash ของผู้ใช้แต่ละคนยังเป็นค่าที่ต่างกันทุกคน จำนวน series จึงเท่าเดิม แก้ได้แค่เรื่องการเปิดเผยตัวตน ไม่ได้แก้ปัญหาหน่วยความจำ"},{"id":"D","text":"เพิ่มหน่วยความจำของเครื่องเก็บ metric และยืดช่วงเวลา scrape เป็นสองเท่า เพื่อรองรับจำนวน series ที่เพิ่มขึ้นต่อไปตามจำนวนผู้ใช้ที่เข้ามา","correct":false,"why":"ผิด เพราะ series ที่เกิดจาก label ค่าไม่จำกัดโตตามผู้ใช้และสินค้า เพิ่มทรัพยากรได้แค่ชั่วคราว และต้นทุนจะเพิ่มต่อไปเรื่อยๆ ตามจำนวนผู้ใช้"}],"explanation":"ในระบบ metric แบบ time series ทุกชุดค่า label ที่ไม่ซ้ำกันคือหนึ่ง series จึงต้องจำกัด cardinality ของ label ให้มีค่าจำกัดและรู้ขอบเขตล่วงหน้า ข้อมูลที่มีค่ามากมายไม่จำกัด เช่น user id หรือ order id ควรอยู่ใน trace หรือ log ที่ออกแบบมาสำหรับค้นรายเหตุการณ์"},{"id":"ENG-S-E-019","level":"senior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-S2","concept":"mon-incident-commander-roles","mobile":false,"type":"multiple","stem":"ช่วง flash sale 12.12 ระบบชำระเงินล่มทั้งหมด มีวิศวกร 12 คนเข้า channel เหตุการณ์ และเริ่มมีข้อเสนอที่ขัดกันหลายทาง ผู้นำเหตุการณ์ควรทำอะไรเพื่อให้การตอบสนองเป็นระเบียบและกู้ระบบได้เร็ว (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"มอบบทบาทชัดเจน เช่น ผู้ตัดสินใจ ผู้ลงมือแก้ และผู้สื่อสารกับฝ่ายธุรกิจ เพื่อให้มีคนเดียวสั่งการและคนอื่นไม่ลงมือชนกัน","correct":true,"why":"ถูก เพราะเหตุการณ์ใหญ่ที่คนจำนวนมากลงมือพร้อมกันโดยไม่มีบทบาทแยกกันทำให้การแก้ซ้ำซ้อนหรือชนกัน บทบาทชัดทำให้สั่งการและติดตามได้"},{"id":"B","text":"ให้ทุกคนที่เห็นสาเหตุที่เป็นไปได้ลองแก้ในระบบจริงพร้อมกัน เพื่อให้เจอทางที่ได้ผลเร็วที่สุด","correct":false,"why":"ผิด เพราะการแก้หลายทางพร้อมกันในระบบจริงทำให้ไม่รู้ว่าอะไรได้ผล เปลี่ยนสถานะระบบซ้อนกัน และอาจทำให้ปัญหาแย่ลงหรือย้อนกลับยาก"},{"id":"C","text":"รอจนระบุสาเหตุหลักได้ชัดเจนก่อน จึงค่อยลงมือกู้ระบบและแจ้งข่าวฝ่ายธุรกิจ เพื่อไม่ให้ส่งข้อมูลคลาดเคลื่อน","correct":false,"why":"ผิด เพราะระหว่างรอ ผู้ใช้จ่ายเงินไม่ได้ต่อเนื่องและฝ่ายธุรกิจไม่รู้สถานการณ์ การแจ้งสถานะเท่าที่ทราบพร้อมระบุว่ายังสืบสวนอยู่ทำได้โดยไม่ต้องรอสาเหตุ"},{"id":"D","text":"ให้ผู้เชี่ยวชาญของระบบที่น่าจะเป็นต้นเหตุลงมือเพียงคนเดียวในแชตส่วนตัว เพื่อลดความวุ่นวายใน channel แล้วแจ้งผลเมื่อเสร็จ","correct":false,"why":"ผิด เพราะการย้ายการสื่อสารไปแชตส่วนตัวทำให้ทีมที่เหลือไม่เห็นความคืบหน้า ไม่มีบันทึกเหตุการณ์ร่วม และไม่มีใครตรวจสอบสมมติฐานของคนเดียว"},{"id":"E","text":"ให้ลำดับกับการลดผลกระทบก่อน เช่น rollback หรือปิดฟีเจอร์ที่เพิ่งปล่อย แล้วหาสาเหตุหลังระบบกลับมาให้บริการ พร้อมแจ้งสถานะเป็นรอบสม่ำเสมอ","correct":true,"why":"ถูก เพราะการลดผลกระทบด้วยวิธีที่รู้ผลเร็วช่วยให้ผู้ใช้จ่ายเงินได้โดยเร็ว และการแจ้งสถานะเป็นรอบสม่ำเสมอลดการถามซ้ำที่รบกวนผู้ลงมือแก้"}],"explanation":"การรับมือเหตุการณ์ใหญ่ต้องมีโครงสร้าง คือมีผู้นำที่ตัดสินใจ แยกบทบาทแก้กับสื่อสาร เน้นลดผลกระทบก่อนหาสาเหตุ ทำงานใน channel เดียวเพื่อให้มีบันทึกร่วม และแจ้งสถานะตามรอบ เมื่อจบแล้วจึงนำ timeline ไปทำ post-mortem"},{"id":"ENG-S-E-020","level":"senior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-S3","concept":"mon-mobile-staged-rollout-health-gate","mobile":true,"type":"single","stem":"ทีมมือถือปล่อยเวอร์ชันใหม่ผ่าน staged rollout ใน store ทีละ 5%, 20%, 50%, 100% แต่ที่ผ่านมามีครั้งที่ผู้ใช้เจอ crash หนักหลังขยายเป็น 50% ทีมรู้จากรีวิวใน store หลายวันให้หลัง ทีมต้องการให้การตัดสินใจขยายหรือหยุดการปล่อยเชื่อถือได้และเร็วขึ้น ควรทำอย่างไร","options":[{"id":"A","text":"รอรีวิวและคะแนนใน store ครบ 3 วันในแต่ละขั้น แล้วประชุมทีมตัดสินใจร่วมกันว่าจะขยายต่อหรือไม่ในแต่ละครั้งที่ถึงกำหนด","correct":false,"why":"ผิด เพราะรีวิวมาช้า มาจากผู้ใช้ส่วนน้อย และเป็นความรู้สึกมากกว่าตัวเลข ทำให้ตรวจจับปัญหาได้ช้าและขึ้นกับคนที่เขียนรีวิว"},{"id":"B","text":"ดู crash-free sessions รวมของทุกเวอร์ชันในแดชบอร์ดเดียว และขยายขั้นถัดไปเมื่อค่ารวมยังสูงกว่า 99% อย่างต่อเนื่องหลายวัน","correct":false,"why":"ผิด เพราะผู้ใช้เวอร์ชันเก่าเป็นส่วนใหญ่ ค่ารวมจึงกลบปัญหาของเวอร์ชันใหม่ที่ยังมีผู้ใช้น้อยในขั้น 5% หรือ 20%"},{"id":"C","text":"เทียบเวอร์ชันใหม่กับเดิมด้วย crash-free sessions, ANR และ cold start ที่ตัวอย่างพอ ตั้งเกณฑ์ล่วงหน้า และหยุดขยายเมื่อแย่กว่าเกณฑ์","correct":true,"why":"ถูก เพราะเกณฑ์ที่ตกลงไว้ก่อนและการเทียบรายเวอร์ชันที่จำนวนตัวอย่างพอ ทำให้ตัดสินใจขยายหรือหยุดได้เร็วและไม่ขึ้นกับความรู้สึก"},{"id":"D","text":"ขยายเป็น 100% ทันทีหลังผ่านการทดสอบภายใน เพื่อให้ได้ข้อมูลจากผู้ใช้จำนวนมากที่สุด แล้วแก้ปัญหาที่พบด้วย hotfix","correct":false,"why":"ผิด เพราะ hotfix บนมือถือต้องผ่านขั้นตอน store และผู้ใช้ต้องอัปเดตตาม ผู้ใช้ทั้งหมดจึงเจอปัญหาไปก่อนระหว่างที่รอแก้"}],"explanation":"จุดประสงค์ของ staged rollout คือให้ผู้ใช้กลุ่มเล็กเป็นตัวชี้วัดก่อนขยาย จึงต้องมีตัวชี้วัดสุขภาพรายเวอร์ชันและเกณฑ์ที่ตกลงล่วงหน้า เพื่อหยุดการขยายอัตโนมัติหรือกึ่งอัตโนมัติ ไม่ใช่รอรีวิวหรือดูค่ารวมที่ถูกเวอร์ชันเก่ากลบ"},{"id":"ENG-S-E-021","level":"senior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-S4","concept":"mon-tracing-sampling-strategy","mobile":true,"type":"multiple","stem":"ระบบใช้ distributed tracing กับแอปมือถือและ backend ที่มีคำขอราว 8 ล้านครั้งต่อวัน ตอนนี้แอปตัดสินใจสุ่มเก็บ 1% ตั้งแต่ต้นคำขอ (head-based sampling) ทำให้ trace ของคำขอที่ช้าหรือล้มเหลวซึ่งเกิดไม่บ่อยมักไม่ถูกเก็บ ขณะที่งบพื้นที่เก็บ trace จำกัด แนวทางใดช่วยเก็บ trace ที่มีค่าได้โดยไม่เพิ่มต้นทุนมาก (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มอัตราสุ่มแบบ head-based ที่ฝั่งแอปเป็น 100% เพราะเป็นวิธีเดียวที่รับประกันว่าจะไม่พลาด trace สำคัญ","correct":false,"why":"ผิด เพราะ 100% ของ 8 ล้านคำขอต่อวันเพิ่มต้นทุนเก็บและส่งข้อมูล รวมถึงภาระบนเครื่องผู้ใช้อย่างมาก ทั้งที่ trace ส่วนใหญ่เป็นคำขอปกติที่ไม่ได้ใช้"},{"id":"B","text":"ให้ backend สร้าง span ทุกคำขอโดยไม่ยึดผลสุ่มของแอป แล้วใช้ collector แบบ tail-based sampling เก็บ trace ที่ error หรือช้ากว่าเกณฑ์","correct":true,"why":"ถูก เพราะ tail-based sampling ตัดสินหลังเห็น trace ครบ จึงเลือกเก็บเฉพาะ trace ที่ผิดปกติได้ ซึ่งการตัดสินตั้งแต่ต้นคำขอทำไม่ได้"},{"id":"C","text":"คง head-based sampling อัตราต่ำสำหรับ trace ปกติ เพื่อให้ได้ภาพ baseline ของระบบในต้นทุนต่ำ","correct":true,"why":"ถูก เพราะ baseline จากตัวอย่างสุ่มเพียงพอสำหรับดูแนวโน้มปกติ จึงเก็บ trace ปกติจำนวนน้อยควบคู่กับการเก็บ trace ที่ผิดปกติได้"},{"id":"D","text":"ตั้งอัตราสุ่มตามความสำคัญของเส้นทาง เช่น ชำระเงินสุ่มสูงกว่าการดูรายการสินค้า เพราะผลทางธุรกิจและความเสี่ยงต่างกัน","correct":true,"why":"ถูก เพราะเส้นทางที่มีมูลค่าสูงควรมีข้อมูลสืบสวนมากกว่า การกำหนดอัตราต่อเส้นทางจึงใช้งบเก็บ trace ได้คุ้มกว่าอัตราเดียวทั้งระบบ"}],"explanation":"การสุ่มตั้งแต่ต้นคำขอถูกและง่าย แต่ไม่รู้ล่วงหน้าว่าคำขอไหนจะผิดปกติ จึงมักพลาด trace สำคัญ แนวทางที่ใช้กันคือเก็บ baseline ด้วย head sampling อัตราต่ำ ผสมการตัดสินท้าย trace (tail-based) ที่ฝั่ง backend เพื่อเก็บ error และ trace ที่ช้า และปรับอัตราตามความสำคัญของเส้นทาง"},{"id":"ENG-S-E-022","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S1","concept":"web-ssr-public-spa-private","mobile":false,"type":"single","stem":"บริษัทมีเว็บขายประกันออนไลน์ หน้าสินค้าและบทความต้องติดอันดับ search engine และแสดง preview ได้ถูกต้องเมื่อแชร์ผ่าน LINE ส่วนพื้นที่ลูกค้าหลังล็อกอิน (ดูกรมธรรม์ เคลมออนไลน์) มีการโต้ตอบมากและไม่ต้องให้ search engine เก็บ ทีมมีขนาดเล็กและต้องการลดการดูแลสองระบบ แนวทางใดเหมาะที่สุด","options":[{"id":"A","text":"สร้างทั้งเว็บเป็น SPA ที่เรนเดอร์ฝั่งไคลเอนต์ทั้งหมด และเพิ่ม meta tag ผ่าน JavaScript หลังโหลดหน้าให้ search engine และ LINE อ่านได้","correct":false,"why":"ผิด เพราะ bot ของ LINE และ search engine บางตัวอ่านเฉพาะ HTML ที่เซิร์ฟเวอร์ส่งมา meta ที่เพิ่มด้วย JavaScript ภายหลังจึงอาจไม่ถูกอ่านและ preview ผิด"},{"id":"B","text":"เรนเดอร์ทุกหน้าฝั่งเซิร์ฟเวอร์ใหม่ทุกครั้งที่ผู้ใช้กดลิงก์หรือส่งฟอร์ม ทั้งหน้าสาธารณะและพื้นที่ลูกค้า โดยไม่มี state ฝั่งไคลเอนต์","correct":false,"why":"ผิด เพราะพื้นที่ลูกค้าที่โต้ตอบมากจะรู้สึกช้าและกระตุก ทุกการกระทำต้องโหลดหน้าใหม่ จึงไม่เหมาะกับส่วนที่ต้องตอบสนองทันที"},{"id":"C","text":"ใช้บริการ prerender เฉพาะตอนมี bot เข้า และให้ผู้ใช้ทั่วไปได้ SPA เปล่าตามเดิมทุกหน้า","correct":false,"why":"ผิด เพราะต้องแยกว่าคำขอใดเป็น bot ซึ่งตรวจพลาดได้ ต้องดูแลบริการเพิ่ม และหน้าที่ bot เห็นอาจต่างจากที่ผู้ใช้เห็น"},{"id":"D","text":"ใช้เฟรมเวิร์กเดียวที่ทำ SSR หรือ pre-render ให้หน้าสาธารณะ และให้พื้นที่ลูกค้าทำงานแบบ SPA หลังล็อกอิน","correct":true,"why":"ถูก เพราะหน้าสาธารณะได้ HTML ครบตั้งแต่แรกสำหรับ SEO และ preview ส่วนพื้นที่ลูกค้าได้การโต้ตอบแบบ SPA ภายใต้เฟรมเวิร์กเดียวที่ดูแลง่าย"}],"explanation":"ไม่จำเป็นต้องเลือกรูปแบบการเรนเดอร์เดียวทั้งเว็บ หน้าสาธารณะที่ต้องให้ search engine และ bot อ่านเหมาะกับ SSR หรือ SSG ส่วนพื้นที่หลังล็อกอินที่โต้ตอบมากเหมาะกับ SPA เฟรมเวิร์กสมัยใหม่รองรับทั้งสองแบบในโปรเจกต์เดียว ช่วยลดภาระดูแลหลายระบบ"},{"id":"ENG-S-E-023","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S2","concept":"web-mobile-image-variants-cdn","mobile":true,"type":"single","stem":"แอปมือถือร้านขายของออนไลน์มีผู้ใช้ต่างจังหวัดจำนวนมากที่ใช้เครือข่ายมือถือไม่เสถียรและแพ็กเกจข้อมูลจำกัด ภาพสินค้าที่ร้านค้าอัปโหลดมีขนาดราว 4 MB ต่อภาพ แอปแสดงภาพเล็กในหน้ารายการ แต่แสดงกว้างเต็มจอในหน้ารายละเอียด ทีมจะลดข้อมูลที่ผู้ใช้ต้องโหลดโดยยังให้ภาพคมชัดได้อย่างไร","options":[{"id":"A","text":"บีบอัดภาพต้นฉบับทุกภาพให้เหลือประมาณ 300 KB ด้วยคุณภาพต่ำ และใช้ไฟล์เดียวกันกับทุกหน้าจอและทุกหน้าของแอป","correct":false,"why":"ผิด เพราะภาพเต็มจอจะแตกหรือเบลอบนจอความละเอียดสูง ขณะที่ภาพเล็กในหน้ารายการยังโหลดไฟล์ใหญ่กว่าที่ต้องใช้"},{"id":"B","text":"สร้างภาพหลายขนาดและรูปแบบบีบอัดหลังอัปโหลด เสิร์ฟผ่าน CDN และให้แอปขอขนาดที่พอดีกับพื้นที่แสดงผลและความละเอียดจอ","correct":true,"why":"ถูก เพราะแต่ละหน้าจอโหลดเฉพาะขนาดที่ใช้จริง หน้ารายการได้ไฟล์เล็ก หน้ารายละเอียดได้ภาพคมชัด และ CDN ลดเวลาโหลดสำหรับผู้ใช้ที่อยู่ไกลเซิร์ฟเวอร์"},{"id":"C","text":"ให้แอปดาวน์โหลดภาพต้นฉบับ แล้วย่อขนาดในเครื่องก่อนแสดง และเก็บภาพที่ย่อแล้วไว้ในแคชของเครื่องเพื่อเปิดภาพเดิมซ้ำได้โดยไม่เรียกเครือข่าย","correct":false,"why":"ผิด เพราะข้อมูลที่ผู้ใช้โหลดผ่านเครือข่ายยังเป็นภาพ 4 MB ทุกภาพ การย่อในเครื่องไม่ได้ประหยัดข้อมูลและยังใช้แบตเตอรี่กับหน่วยความจำ"},{"id":"D","text":"ให้ผู้ใช้เลือกโหมดประหยัดข้อมูลเองในหน้าตั้งค่า และปิดการแสดงภาพสินค้าทั้งหมดในโหมดนั้นจนกว่าจะเปลี่ยนกลับ","correct":false,"why":"ผิด เพราะผู้ใช้ส่วนใหญ่ไม่ได้เปิดตั้งค่านี้ และการไม่เห็นภาพสินค้าเลยทำให้ซื้อได้ยาก แก้ปัญหาที่ต้นเหตุของขนาดภาพไม่ได้"}],"explanation":"ขนาดข้อมูลที่ผู้ใช้โหลดคือเรื่องที่แก้ได้ที่เซิร์ฟเวอร์ ไม่ใช่ที่เครื่อง ควรมี pipeline สร้างภาพหลายขนาดและรูปแบบ แล้วให้ไคลเอนต์ขอขนาดที่พอดีกับพื้นที่แสดงผลและความละเอียดจอ พร้อมแคชที่ CDN เพื่อประหยัดทั้งข้อมูลและเวลา"},{"id":"ENG-S-E-024","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S3","concept":"web-pwa-offline-shell-queue","mobile":false,"type":"multiple","stem":"ทีมทำ PWA สำหรับระบบเช็กอินหน้างานอีเวนต์ ซึ่งสัญญาณอินเทอร์เน็ตในฮอลล์ไม่เสถียร ผู้ใช้ต้องเปิดแอปได้และบันทึกการเช็กอินได้แม้ออฟไลน์ แล้วส่งภายหลังเมื่อออนไลน์ แนวทางใดเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แคชคำตอบ API รายชื่อผู้เข้างานแบบ cache-first ไม่มีวันหมดอายุ เพื่อให้เปิดดูได้เร็วที่สุด","correct":false,"why":"ผิด เพราะรายชื่อเปลี่ยนตลอดช่วงงาน ถ้าไม่มีวันหมดอายุหรือการตรวจสอบกับเซิร์ฟเวอร์ ผู้ใช้จะเห็นรายชื่อเก่าและเช็กอินผิดคนได้"},{"id":"B","text":"ใช้ service worker แคช app shell (HTML หลัก และ CSS, JS ที่ใส่ hash ในชื่อไฟล์) แบบ cache-first เพื่อให้เปิดแอปได้ทันทีแม้ออฟไลน์","correct":true,"why":"ถูก เพราะ shell เปลี่ยนเมื่อปล่อยเวอร์ชันใหม่เท่านั้น ไฟล์ที่มี hash ใช้ cache-first ได้ปลอดภัยเพราะเวอร์ชันใหม่ใช้ชื่อใหม่ ส่วน HTML หลักที่ชื่อคงที่ต้องอัปเดตพร้อม service worker รุ่นใหม่"},{"id":"C","text":"ให้ service worker แคชทุก request รวมถึง POST ที่ส่งเช็กอิน แล้วเล่นซ้ำจากแคชของเบราว์เซอร์เมื่อต่อเน็ตได้","correct":false,"why":"ผิด เพราะ Cache API ใช้เก็บคำตอบของคำขอแบบ GET ไม่ได้ออกแบบให้เก็บคำขอ POST เพื่อเล่นซ้ำ การเช็กอินที่ออฟไลน์จึงต้องเก็บเป็นข้อมูลของแอปเอง"},{"id":"D","text":"เก็บการเช็กอินที่ยังไม่ส่งใน IndexedDB แล้วส่งผ่านคิวเมื่อกลับมาออนไลน์ เช่น ด้วย Background Sync หรือเมื่อแอปตรวจพบว่าออนไลน์","correct":true,"why":"ถูก เพราะ IndexedDB เก็บข้อมูลของแอปแบบถาวรในเบราว์เซอร์ และคิวที่ส่งตอนออนไลน์ช่วยให้การเช็กอินที่ทำออฟไลน์ไม่หาย"},{"id":"E","text":"แสดงสถานะออฟไลน์และจำนวนรายการที่รอส่งให้ผู้ใช้เห็น พร้อมกลไกกันส่งซ้ำ เช่น idempotency key ที่เซิร์ฟเวอร์","correct":true,"why":"ถูก เพราะผู้ใช้ต้องรู้ว่ารายการใดยังไม่ถึงเซิร์ฟเวอร์ และการส่งซ้ำจากการลองใหม่ต้องไม่ทำให้เช็กอินซ้ำสองครั้ง"}],"explanation":"PWA แบบออฟไลน์แยกเป็นสองส่วน ส่วนโค้ดแอป (app shell) แคชด้วย service worker ได้เพราะเปลี่ยนตามรอบปล่อยเวอร์ชัน ส่วนข้อมูลที่ผู้ใช้สร้างต้องเก็บใน storage ของแอปและส่งผ่านคิวที่กันซ้ำได้ ข้อมูลที่เปลี่ยนบ่อยอย่างรายชื่อต้องมีกลยุทธ์ตรวจกับเซิร์ฟเวอร์ ไม่ใช่แคชถาวร"},{"id":"ENG-S-E-025","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S4","concept":"web-graphql-mobile-query-protection","mobile":true,"type":"multiple","stem":"ทีมเปิด GraphQL endpoint ให้แอปมือถือหลายหน้าจอขอเฉพาะ field ที่ต้องใช้บนเครือข่ายช้า หลังเปิดใช้งานพบ query ที่ซ้อน relation ลึกหลายชั้น (สินค้า รีวิว ผู้เขียน รีวิวอื่นของผู้เขียน) ทำให้ฐานข้อมูลโหลดหนักเป็นช่วงๆ มาตรการใดแก้ที่ต้นเหตุของปัญหานี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ปิด introspection ของ schema ใน production เพื่อให้ผู้เรียกไม่เห็นความสัมพันธ์ระหว่าง type จึงสร้าง query ลึกไม่ได้","correct":false,"why":"ผิด เพราะการปิดแค่ซ่อนข้อมูลของ schema แต่ผู้ที่รู้ชื่อ field ยังส่ง query ลึกได้ และ query ที่ซ้อนลึกก็ยังส่งเข้ามาถึงเซิร์ฟเวอร์ได้เหมือนเดิม"},{"id":"B","text":"จำกัดความลึกและคะแนนความซับซ้อน (complexity) ของ query ที่เซิร์ฟเวอร์ และปฏิเสธ query ที่เกินเพดานก่อนรัน","correct":true,"why":"ถูก เพราะการตรวจก่อนรันตัด query ที่แพงเกินเหตุออกก่อนถึงฐานข้อมูล ปัญหาโหลดจาก query ซ้อนลึกจึงถูกจำกัดที่ต้นทาง"},{"id":"C","text":"ตั้ง rate limit ต่อ IP ตามจำนวนคำขอต่อนาทีอย่างเดียว เพราะ query ลึกแต่ละครั้งนับเป็นหนึ่งคำขอเหมือนกัน","correct":false,"why":"ผิด เพราะ query หนึ่งครั้งอาจแพงต่างกันหลายร้อยเท่า การนับจำนวนคำขออย่างเดียวจึงไม่จำกัดภาระจริงของฐานข้อมูล"},{"id":"D","text":"ใช้ batching ของการดึงข้อมูล เช่น DataLoader ใน resolver เพื่อรวมการอ่านข้อมูลลูกให้เป็นคำสั่งฐานข้อมูลน้อยลง ลดปัญหา N+1","correct":true,"why":"ถูก เพราะ resolver ที่ดึงข้อมูลทีละรายการทำให้จำนวน query ฐานข้อมูลโตตามชั้นของความสัมพันธ์ การรวมคำสั่งลดภาระได้ตรงจุด"}],"explanation":"ปัญหา query ซ้อนลึกมีสองด้าน ด้านแรกคือผู้เรียกกำหนดความแพงของ query เองได้ จึงต้องจำกัดความลึกและความซับซ้อนที่เซิร์ฟเวอร์ ด้านที่สองคือ resolver ที่ดึงข้อมูลทีละรายการทำให้เกิด N+1 จึงต้องรวมคำสั่งอ่านข้อมูล การซ่อน schema หรือจำกัดตามจำนวนคำขอไม่ได้แก้สองอย่างนี้"},{"id":"ENG-S-E-026","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S4","concept":"web-rate-limit-key-cgnat","mobile":true,"type":"single","stem":"API ของแอปมือถือตั้ง rate limit ไว้ที่ 100 คำขอต่อนาทีต่อ IP หลังแคมเปญใหญ่ มีผู้ใช้เครือข่ายมือถือเจ้าเดียวกันที่อยู่ในงานสัมมนาเดียวกันถูกบล็อกพร้อมกันจำนวนมาก (ได้ 429) ขณะที่สคริปต์ที่ยิง API จากหลาย IP กลับผ่านไปได้ ทีมควรปรับ rate limit อย่างไร","options":[{"id":"A","text":"ใช้ key ตามตัวตนที่ยืนยันแล้ว เช่น user id หรือ token อุปกรณ์ สำหรับ endpoint ที่ล็อกอิน และใช้ IP เป็นเพดานสูงสำหรับ endpoint สาธารณะ","correct":true,"why":"ถูก เพราะผู้ใช้หลายคนอาจใช้ IP เดียวกันจากการแชร์ที่อยู่ของเครือข่ายมือถือ การจำกัดตามตัวตนทำให้ผู้ใช้แต่ละคนมีโควตาของตัวเอง และสคริปต์ที่ใช้บัญชีเดียวยังถูกจำกัด"},{"id":"B","text":"เปลี่ยนเป็น 1,000 คำขอต่อนาทีต่อ IP กับทุก endpoint เพื่อให้ผู้ใช้ที่อยู่หลัง IP เดียวกันใช้งานได้พร้อมกันทั้งหมดโดยไม่ถูกบล็อก","correct":false,"why":"ผิด เพราะการยกเพดานเท่ากันทุก endpoint ทำให้ผู้โจมตีรายเดียวยิงได้มากขึ้นสิบเท่าจาก IP เดียว และยังไม่แยกผู้ใช้แต่ละคนออกจากกัน"},{"id":"C","text":"เพิ่มช่วง IP ของเครือข่ายมือถือทุกเจ้าเข้า allowlist เพื่อให้ไม่ถูกจำกัดอัตราเลย ไม่ว่าคำขอจะมาจากแอปหรือไม่","correct":false,"why":"ผิด เพราะช่วง IP ของผู้ให้บริการมือถือกว้างมาก ผู้โจมตีที่ใช้ซิมหรือเครือข่ายเดียวกันจะหลุดการจำกัดทั้งหมด และช่วง IP เปลี่ยนได้"},{"id":"D","text":"ใช้ค่า User-Agent ของแอปเป็น key เพราะทุกคำขอจากแอปมี User-Agent ที่ระบุเวอร์ชันของแอปอยู่แล้วเสมอ","correct":false,"why":"ผิด เพราะผู้ใช้ทุกคนที่ใช้แอปเวอร์ชันเดียวกันจะมี User-Agent เหมือนกันและแชร์โควตาเดียว อีกทั้งผู้โจมตีปลอมค่านี้ได้ง่าย"}],"explanation":"IP ไม่ใช่ตัวตนของผู้ใช้ที่เชื่อถือได้บนเครือข่ายมือถือ เพราะหลายคนอาจใช้ IP เดียวกัน (NAT) ควรใช้ตัวตนที่ผ่านการยืนยัน เช่น user id หรือ token ของอุปกรณ์ เป็น key ของโควตา และใช้ IP เป็นเพดานกว้างๆ ป้องกันการยิงโดยไม่ล็อกอิน"},{"id":"ENG-S-E-027","level":"senior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-S5","concept":"web-api-deprecation-partner-lifecycle","mobile":false,"type":"multiple","stem":"บริษัทมี REST API สำหรับพาร์ตเนอร์ร้านค้า 40 ราย ต้องเลิกใช้ endpoint /v1/orders/search ที่ไม่มีการแบ่งหน้า (ทำให้ฐานข้อมูลหนัก) และให้ใช้ /v2/orders ที่แบ่งหน้าแทน ทีมจะบริหารวงจรชีวิตของ endpoint เก่าอย่างไรจึงลดผลกระทบต่อพาร์ตเนอร์ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ปิด /v1 ในวันที่ /v2 ขึ้นระบบจริง เพราะส่งอีเมลแจ้งพาร์ตเนอร์แล้ว และการเปิดสองเวอร์ชันพร้อมกันทำให้ดูแลซับซ้อน","correct":false,"why":"ผิด เพราะพาร์ตเนอร์ต้องใช้เวลาแก้และทดสอบระบบของตัวเอง การปิดทันทีทำให้ระบบของพาร์ตเนอร์ที่ยังเรียก /v1 ใช้งานไม่ได้ในวันเดียวกัน"},{"id":"B","text":"ประกาศกำหนดการเลิกใช้ล่วงหน้า และส่ง header บอกสถานะ deprecation พร้อมวันที่ sunset ในคำตอบของ /v1 ให้ผู้เรียกที่ตรวจ header ได้รับสัญญาณ","correct":true,"why":"ถูก เพราะการประกาศล่วงหน้าพร้อมสัญญาณในตัวคำตอบให้เวลาพาร์ตเนอร์ปรับระบบ และเครื่องมือฝั่งพาร์ตเนอร์ตรวจ header เหล่านี้ได้อัตโนมัติ"},{"id":"C","text":"เปลี่ยนพฤติกรรมของ /v1 ให้แบ่งหน้าเองโดยคืนเฉพาะ 50 รายการแรก เพื่อลดภาระฐานข้อมูลโดยพาร์ตเนอร์ยังเรียกด้วยโค้ดเดิมได้ตามเดิม","correct":false,"why":"ผิด เพราะพาร์ตเนอร์ที่คาดว่าได้ทุกรายการจะได้ข้อมูลไม่ครบโดยไม่รู้ตัว เป็นการเปลี่ยนสัญญาแบบเงียบที่ทำให้ข้อมูลผิดพลาดตามมา"},{"id":"D","text":"เก็บ metric การเรียก /v1 แยกตามพาร์ตเนอร์ (API key) เพื่อดูว่าใครยังเรียกอยู่ แล้วติดต่อรายที่ยังใช้ก่อนวันปิด","correct":true,"why":"ถูก เพราะทำให้ทีมรู้ว่าใครยังพึ่ง /v1 อยู่จริง และปิดได้เมื่อเหลือผู้ใช้น้อยหรือเมื่อทุกรายย้ายแล้ว แทนการเดาจากการแจ้งทั่วไป"},{"id":"E","text":"แจ้งเฉพาะพาร์ตเนอร์รายใหญ่ 5 รายแรกที่มียอดเรียกสูงสุด เพราะรายเล็กเรียกน้อยจนไม่น่าจะกระทบระบบ","correct":false,"why":"ผิด เพราะการเรียกน้อยไม่ได้แปลว่าไม่สำคัญต่อพาร์ตเนอร์รายนั้น และ endpoint ที่หายไปทำให้ระบบของรายเล็กใช้งานไม่ได้เช่นกัน"}],"explanation":"การเลิกใช้ endpoint ที่มีผู้บริโภคภายนอกต้องทำเป็นกระบวนการ ประกาศล่วงหน้า ส่งสัญญาณในตัวคำตอบ ตามดูการใช้งานรายผู้เรียก และติดต่อรายที่ยังไม่ย้ายก่อนปิด การเปลี่ยนพฤติกรรมเดิมแบบเงียบถือเป็น breaking change ที่ซ่อนอยู่"},{"id":"ENG-S-E-028","level":"senior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-S1","concept":"test-coverage-exclusions-legit","mobile":false,"type":"multiple","stem":"ทีมตั้ง quality gate coverage 80% บน new code ใน SonarQube และกำลังกำหนด coverage exclusions เพื่อไม่ให้ตัวเลขบิดเบือน ไฟล์กลุ่มใดต่อไปนี้ยกเว้นออกจาก coverage ได้อย่างสมเหตุสมผล (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"โค้ดที่เครื่องมือสร้างอัตโนมัติ เช่น client ที่ generate จาก OpenAPI หรือโค้ดที่ถูกสร้างใหม่ทุก build","correct":true,"why":"ถูก เพราะโค้ดที่ generate ไม่ได้เขียนด้วยมือและถูกสร้างใหม่ทุกครั้ง ทดสอบที่โค้ดต้นทางหรือ generator แทน การนับรวมจึงบิดเบือนตัวเลข"},{"id":"B","text":"คลาส service ที่มีตรรกะคำนวณส่วนลด ซึ่งเขียน test ยากเพราะต้องพึ่ง dependency หลายตัว","correct":false,"why":"ผิด เพราะตรรกะธุรกิจคือส่วนที่ควรมี test มากที่สุด การเขียนยากเป็นสัญญาณให้ปรับโครงสร้างเพื่อให้ทดสอบได้ ไม่ใช่เหตุให้ตัดออกจากการวัด"},{"id":"C","text":"คลาส DTO หรือ model ที่มีแต่ field กับ getter และ setter โดยไม่มีตรรกะใดๆ อยู่ในตัวคลาส","correct":true,"why":"ถูก เพราะไม่มีพฤติกรรมให้ตรวจ test ที่เขียนจะเป็นเพียงการเรียก getter กับ setter และดันตัวเลขโดยไม่ได้ลดความเสี่ยง"},{"id":"D","text":"บล็อก catch และเส้นทางจัดการ error ทั้งหมด เพราะเกิดขึ้นได้ยากในการทดสอบและทำให้ branch coverage ต่ำ","correct":false,"why":"ผิด เพราะเส้นทาง error เป็นที่ที่บั๊กรุนแรงมักซ่อนอยู่ การยกเว้นจึงทำให้จุดเสี่ยงที่สุดหายจากรายงาน ควรจำลองความล้มเหลวด้วย stub แทน"},{"id":"E","text":"จุดเริ่มต้นแอปที่มีแต่การต่อสาย dependency และการโหลด config โดยไม่มีตรรกะธุรกิจ และถูกครอบคลุมด้วย integration test อยู่แล้ว","correct":true,"why":"ถูก เพราะเป็นโค้ดประกอบที่ไม่มีตรรกะให้ unit test ตรวจ และถูกพิสูจน์การทำงานโดย integration test ที่ขึ้นระบบจริง"}],"explanation":"ยกเว้นออกจาก coverage ได้เมื่อโค้ดไม่มีตรรกะที่ควรทดสอบหรือถูกสร้างอัตโนมัติ เช่น DTO ที่ไม่มีตรรกะ โค้ดที่ generate และโค้ดต่อสาย ส่วนโค้ดที่มีตรรกะธุรกิจหรือจัดการ error ไม่ควรยกเว้นเพียงเพราะเขียน test ยาก เพราะเท่ากับซ่อนความเสี่ยงจากรายงาน"},{"id":"ENG-S-E-029","level":"senior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-S2","concept":"test-mutation-survivors-weak-assertions","mobile":false,"type":"single","stem":"โมดูลคำนวณดอกเบี้ยมี line และ branch coverage 100% แต่เมื่อทีมรัน mutation testing (เครื่องมือแก้โค้ดเล็กน้อย เช่น เปลี่ยน > เป็น >= หรือ + เป็น - แล้วดูว่า test ล้มหรือไม่) พบว่า mutant รอดจำนวนมาก ข้อมูลนี้บอกอะไร และทีมควรทำอะไรต่อ","options":[{"id":"A","text":"แสดงว่าเครื่องมือ coverage ทำงานผิดพลาด ควรลดเกณฑ์ coverage ลงและเชื่อผลจาก mutation testing แทนทั้งหมดต่อจากนี้","correct":false,"why":"ผิด เพราะ coverage ไม่ได้ผิด ตัวเลขถูกต้องในสิ่งที่วัด คือบรรทัดและ branch ถูกรัน เพียงแต่ไม่ได้วัดคุณภาพของ assertion จึงใช้สองอย่างเสริมกัน"},{"id":"B","text":"แสดงว่าโค้ดมีบั๊กมาก ควรเพิ่มจำนวน test ของทุกเมธอดเป็นสองเท่าเพื่อให้ฆ่า mutant ได้ครบทุกตัวในรอบถัดไป","correct":false,"why":"ผิด เพราะ mutant ที่รอดชี้ว่า test ปัจจุบันตรวจไม่พอ ไม่ได้ชี้ว่าโค้ดมีบั๊ก และการเพิ่มจำนวน test โดยไม่ปรับ assertion ก็ยังปล่อยให้ mutant รอดต่อไป"},{"id":"C","text":"แสดงว่า test รันโค้ดแต่ assertion อ่อน ไม่ตรวจค่าสำคัญ ควรดู mutant ที่รอดแล้วเพิ่ม assertion โดยเริ่มจากโค้ดเสี่ยงสูง","correct":true,"why":"ถูก เพราะ mutant ที่รอดคือการเปลี่ยนพฤติกรรมที่ test ไม่จับได้ จึงบอกตำแหน่งที่ assertion ขาด และการเริ่มจากโค้ดเสี่ยงสูงใช้เวลาอย่างคุ้ม"},{"id":"D","text":"แสดงว่า mutant เหล่านั้นไม่มีผลต่อธุรกิจ จึงเพิกเฉยได้ทั้งหมด และใช้ coverage 100% เป็นหลักฐานคุณภาพของโมดูลต่อไป","correct":false,"why":"ผิด เพราะ mutant ส่วนใหญ่เป็นการเปลี่ยนพฤติกรรมจริงที่ test จับไม่ได้ มีเพียงบางตัวที่เป็น equivalent mutant ซึ่งต้องตรวจเป็นรายตัวไม่ใช่เพิกเฉยทั้งหมด"}],"explanation":"coverage บอกว่าโค้ดถูกรัน ส่วน mutation testing ตรวจว่า test จับการเปลี่ยนพฤติกรรมได้จริงหรือไม่ mutant ที่รอดจึงชี้ช่องว่างของ assertion ควรไล่ดูตามความเสี่ยงโดยเฉพาะโค้ดคำนวณเงิน และยอมรับว่ามี equivalent mutant ที่ต้องตรวจแยกเป็นรายตัว"},{"id":"ENG-S-E-030","level":"senior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-S2","concept":"test-mobile-device-matrix-by-analytics","mobile":true,"type":"single","stem":"แอปมือถือมี test อัตโนมัติที่รันบน emulator สองรุ่นเสมอ แต่หลังปล่อยแต่ละเวอร์ชันมักพบบั๊กเฉพาะเครื่อง เช่น จอเล็กจนปุ่มชำระเงินถูกบัง หรือระบบปฏิบัติการรุ่นเก่าที่ไม่รองรับฟีเจอร์ งบ device farm จำกัดที่ 12 อุปกรณ์ต่อรอบ ควรเลือกอุปกรณ์ที่จะทดสอบด้วยหลักการใด","options":[{"id":"A","text":"เลือกรุ่นเรือธงล่าสุดของแต่ละยี่ห้อ 12 รุ่น เพราะมีสเปกสูงสุดและรองรับฟีเจอร์ครบ ถ้าผ่านบนรุ่นเหล่านี้ก็น่าจะผ่านบนรุ่นอื่น","correct":false,"why":"ผิด เพราะบั๊กตามโจทย์มาจากจอเล็กและระบบปฏิบัติการเก่า ซึ่งรุ่นเรือธงล่าสุดไม่มีเงื่อนไขเหล่านั้น ผลผ่านบนรุ่นเรือธงจึงบอกอะไรไม่ได้เกี่ยวกับเครื่องที่ผู้ใช้จริงใช้"},{"id":"B","text":"สุ่มเลือกอุปกรณ์ใหม่ทุกรอบจากรายการของ device farm เพื่อให้ได้ความหลากหลายมากที่สุดในระยะยาวของโครงการ","correct":false,"why":"ผิด เพราะการสุ่มทำให้ผลแต่ละรอบเทียบกันไม่ได้ และอาจไม่มีรอบไหนทดสอบเครื่องกลุ่มที่ผู้ใช้จำนวนมากใช้อยู่เลย"},{"id":"C","text":"ทดสอบบน emulator ที่ตั้งค่าได้ทุกขนาดหน้าจอและเวอร์ชันระบบปฏิบัติการ เพราะครอบคลุมทุกชุดโดยไม่มีค่าใช้จ่ายเพิ่มเติมจากงบ device farm","correct":false,"why":"ผิด เพราะแม้ emulator ตั้งขนาดจอและ OS ได้ แต่ไม่จำลองพฤติกรรมเฉพาะของผู้ผลิตเครื่อง ประสิทธิภาพจริง และการจัดการหน่วยความจำบนอุปกรณ์จริง จึงอาจพลาดบั๊กเฉพาะเครื่อง และไม่ได้ตอบว่าควรใช้งบ device farm กับเครื่องใด"},{"id":"D","text":"ใช้ analytics ของผู้ใช้จริงจัดอันดับรุ่นเครื่อง ขนาดจอ และ OS แล้วเลือกให้ครอบคลุมผู้ใช้ส่วนใหญ่ บวกจอเล็กสุดและ OS เก่าสุดที่รองรับ","correct":true,"why":"ถูก เพราะตัดสินจากเครื่องที่ผู้ใช้ใช้จริง ครอบคลุมผู้ใช้ส่วนใหญ่ด้วยจำนวนอุปกรณ์จำกัด และเพิ่มขอบเขตที่เป็นต้นเหตุของบั๊กเฉพาะเครื่อง"}],"explanation":"ทดสอบทุกอุปกรณ์ไม่ได้ จึงเลือกจากข้อมูลผู้ใช้จริงให้ครอบคลุมส่วนใหญ่ ผสมกรณีขอบเขต เช่น จอเล็กสุดและ OS เก่าสุดที่ยังรองรับ แล้วทบทวนตามที่ตลาดเครื่องเปลี่ยน ส่วน emulator ใช้ได้ในรอบพัฒนาแต่ไม่แทนเครื่องจริงสำหรับบั๊กเฉพาะเครื่อง"},{"id":"ENG-S-E-031","level":"senior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-S3","concept":"test-fake-clock-session-timeout","mobile":true,"type":"multiple","stem":"แอปมือถือธนาคารสมมติมีกฎให้ออกจากระบบอัตโนมัติเมื่อไม่มีการใช้งานเกิน 5 นาที และเมื่อแอปกลับจากพื้นหลังหลังผ่านไปเกิน 5 นาทีต้องให้ยืนยันตัวตนใหม่ ทีมต้องการ test ที่เร็วและคงที่สำหรับกฎนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ปรับ timeout ใน test เป็น 5 วินาทีแล้วใช้การหน่วงเวลาจริงรอ เพราะเป็นพฤติกรรมเดียวกันและเร็วกว่ารอ 5 นาที","correct":false,"why":"ผิด เพราะ test ยังต้องรอเวลาจริงและผลขึ้นกับเวลาที่เครื่องรัน CI ซึ่งอาจช้า จึงไม่คงที่ และไม่ได้ทดสอบค่า 5 นาทีที่ใช้งานจริง"},{"id":"B","text":"เลื่อนเวลาของระบบในเครื่องที่รัน CI ไปข้างหน้าก่อนรัน test เพราะเป็นวิธีที่ใกล้เคียงสถานการณ์จริงที่สุด","correct":false,"why":"ผิด เพราะการเปลี่ยนเวลาของระบบกระทบ test อื่นและกระบวนการอื่นที่รันบนเครื่องเดียวกัน เช่น การตรวจ certificate หรือ token และรีเซ็ตกลับยาก"},{"id":"C","text":"ให้ตรรกะ timeout รับ clock เป็น dependency ผ่าน interface และใช้ fake clock ใน test เพื่อเลื่อนเวลาไปข้างหน้า 5 นาทีได้ทันที","correct":true,"why":"ถูก เพราะเมื่อเวลาเป็นค่าที่ฉีดเข้าได้ test เลื่อนเวลาได้ในหน่วยมิลลิวินาที โดยไม่รอจริง และผลทำซ้ำได้ทุกครั้ง"},{"id":"D","text":"จำลองการส่งแอปไปพื้นหลังและกลับมาผ่าน lifecycle event ที่ห่อไว้ และตรวจขอบเขต เช่น 4 นาที 59 วินาทีกับ 5 นาที 1 วินาที","correct":true,"why":"ถูก เพราะกฎมีสองส่วนคือไม่ได้ใช้งานและกลับจากพื้นหลัง การจำลอง lifecycle กับเวลาที่ขอบเขตตรวจได้ว่ากฎทำงานถูกที่เส้นแบ่ง"}],"explanation":"เวลาคือ dependency ที่ควบคุมไม่ได้ในการทดสอบ จึงควรฉีด clock เข้ามาและใช้ fake clock เลื่อนเวลาแทนการรอจริงหรือแก้เวลาของเครื่อง จากนั้นทดสอบขอบเขตของกฎ และจำลองเหตุการณ์ lifecycle ของแอป เพื่อให้ test เร็ว คงที่ และทำซ้ำได้"},{"id":"ENG-S-E-032","level":"senior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-S3","concept":"test-stub-drift-contract","mobile":false,"type":"single","stem":"ทีมเขียน unit test ของ service ชำระเงินโดย stub ผู้ให้บริการ payment gateway ด้วยคำตอบ JSON ที่เขียนไว้เองในโค้ด test ทุก test ผ่านใน CI แต่หลังผู้ให้บริการเปลี่ยนชื่อ field สถานะใน response ระบบจริงกลับล้มเหลวทั้งที่ test ยังเขียว sandbox ของผู้ให้บริการมีโควตาต่ำกว่าจำนวนครั้งที่ CI รันต่อวันมาก และทีมต้องการรู้ภายในหนึ่งวันเมื่อ response เปลี่ยน ควรปรับกลยุทธ์ test อย่างไร","options":[{"id":"A","text":"เลิกใช้ stub ทั้งหมด แล้วให้ทุก test เรียก sandbox ของผู้ให้บริการจริงทุกครั้งที่รันใน CI ทั้ง unit test และ integration test","correct":false,"why":"ผิด เพราะจำนวนครั้งที่ CI รันเกินโควตาของ sandbox test จะช้า ขึ้นกับเครือข่าย และล้มโดยไม่เกี่ยวกับโค้ดของเรา ทั้งที่ปัญหาแก้ได้โดยทำให้ stub ตรงกับของจริง"},{"id":"B","text":"ให้ stub อ้างอิงตัวอย่าง response จริงที่บันทึกไว้หรือ schema และรัน contract test กับ sandbox วันละครั้งแยกจาก pipeline หลัก","correct":true,"why":"ถูก เพราะ unit test ยังเร็วด้วย stub และไม่ใช้โควตา ส่วน contract test วันละครั้งใช้โควตาน้อยและอาจเห็นการเปลี่ยนสัญญาภายในหนึ่งวัน หาก sandbox เปลี่ยนตามของจริง"},{"id":"C","text":"เพิ่มจำนวน stub ของ response แบบต่างๆ ในโค้ด test ให้ครอบคลุมสถานะที่เป็นไปได้ของผู้ให้บริการให้มากขึ้น","correct":false,"why":"ผิด เพราะ stub ที่เพิ่มมาถูกเขียนจากความเข้าใจเดิมของทีม ถ้าความเข้าใจนั้นไม่ตรงกับของจริง ก็ทำให้ test เขียวผิดๆ มากขึ้นกว่าเดิม"},{"id":"D","text":"เปลี่ยนเป็นการตรวจว่า HTTP client ถูกเรียกครบจำนวนครั้งและด้วยพารามิเตอร์ตรงกับที่เขียนไว้ เพื่อให้เห็นการเปลี่ยนแปลงของโค้ด","correct":false,"why":"ผิด เพราะเป็นการตรวจวิธีเรียกใช้ ไม่ใช่รูปแบบ response ที่ผู้ให้บริการส่งกลับ จึงไม่จับการเปลี่ยนชื่อ field ของฝั่งผู้ให้บริการ"}],"explanation":"stub ที่ทีมเขียนเองไม่รับประกันว่าตรงกับของจริง จึงมีความเสี่ยงที่จะเขียวทั้งที่ระบบจริงล้ม วิธีลดคือผูก stub กับตัวอย่าง response จริงหรือ schema และมี contract/smoke test กับ sandbox เป็นระยะ โดยยังคง unit test ที่เร็วด้วย stub ไว้"}]}},"competencies":["Git","SQL","OOP","Monitoring and Logging","Web & Mobile Development","Unit & Functional Testing"],"descriptorCompetency":{"GIT-J1":"Git","GIT-J2":"Git","GIT-J3":"Git","GIT-J4":"Git","SQL-J1":"SQL","OOP-J1":"OOP","OOP-J2":"OOP","OOP-J3":"OOP","OOP-J4":"OOP","OOP-J5":"OOP","MON-J1":"Monitoring and Logging","MON-J2":"Monitoring and Logging","MON-J3":"Monitoring and Logging","MON-J4":"Monitoring and Logging","WEB-J1":"Web & Mobile Development","WEB-J2":"Web & Mobile Development","WEB-J3":"Web & Mobile Development","WEB-J4":"Web & Mobile Development","WEB-J5":"Web & Mobile Development","TST-J1":"Unit & Functional Testing","TST-J2":"Unit & Functional Testing","TST-J3":"Unit & Functional Testing","GIT-S1":"Git","GIT-S2":"Git","GIT-S3":"Git","GIT-S4":"Git","GIT-S5":"Git","SQL-S1":"SQL","SQL-S2":"SQL","SQL-S3":"SQL","SQL-S4":"SQL","OOP-S1":"OOP","OOP-S2":"OOP","OOP-S3":"OOP","OOP-S4":"OOP","OOP-S5":"OOP","MON-S1":"Monitoring and Logging","MON-S2":"Monitoring and Logging","MON-S3":"Monitoring and Logging","MON-S4":"Monitoring and Logging","WEB-S1":"Web & Mobile Development","WEB-S2":"Web & Mobile Development","WEB-S3":"Web & Mobile Development","WEB-S4":"Web & Mobile Development","WEB-S5":"Web & Mobile Development","TST-S1":"Unit & Functional Testing","TST-S2":"Unit & Functional Testing","TST-S3":"Unit & Functional Testing"}}</script>
<script type="application/json" id="review-data">{"version":1,"levels":{"junior":[{"descriptor":"GIT-J1","competency":"Git","title":"Git พื้นฐาน: staging, history, .gitignore, clone","summary":"Git เป็นระบบ version control ที่เก็บประวัติการเปลี่ยนแปลงของซอร์สโค้ดเป็นสแนปช็อต ช่วยให้ย้อนดู ตรวจสอบ และทำงานร่วมกันได้ การเข้าใจพื้นที่ทั้งสามของ Git เป็นรากฐานของทุกคำสั่ง","keyPoints":["Git มี 3 พื้นที่หลัก: working directory (ไฟล์ที่แก้อยู่), staging area หรือ index (สิ่งที่จะเข้า commit ถัดไป) และ repository (ประวัติ commit)","`git add <file>` บันทึกสแนปช็อตของไฟล์ ณ เวลาที่รันคำสั่ง ถ้าแก้ไฟล์ต่อหลัง add การแก้ครั้งหลังจะยังไม่อยู่ใน staging จนกว่าจะ add ซ้ำ","`git commit` บันทึกเฉพาะสิ่งที่อยู่ใน staging area ไม่ได้อ่านจาก working directory โดยตรง","`git status` แสดงสถานะ: Changes to be committed (staged), Changes not staged for commit, Untracked files; ไฟล์เดียวกันอยู่ได้ทั้งสองหมวดถ้าแก้หลัง add","`git diff` ดูการเปลี่ยนแปลงที่ยังไม่ staged ส่วน `git diff --staged` ดูสิ่งที่จะเข้า commit; `git restore --staged <file>` ถอนไฟล์ออกจาก staging","`.gitignore` มีผลกับไฟล์ที่ยัง untracked เท่านั้น ไฟล์ที่ถูก commit แล้วจะยังถูกติดตามต่อ ต้องใช้ `git rm --cached <file>` เพื่อเลิกติดตามแล้ว commit","ถ้าไฟล์ลับ (เช่น .env) เคยถูก commit แล้ว ค่าจะยังอยู่ในประวัติ ต้องเปลี่ยน (rotate) รหัสหรือ key ที่หลุดไปด้วย ไม่ใช่แค่เพิ่มใน .gitignore","`git log --oneline` ดูประวัติแบบย่อ, `git log -p -- <path>` ดูประวัติของไฟล์พร้อมเนื้อหาที่เปลี่ยน, `git show <commit>` ดูรายละเอียด commit เดียว","`git blame <file>` แสดงว่าแต่ละบรรทัดถูกแก้ล่าสุดโดยใครใน commit ไหน (ใช้เข้าใจที่มา ไม่ใช่หาคนผิด)","`git clone <url>` คัดลอก repository พร้อมประวัติทั้งหมด และตั้งค่า remote ชื่อ `origin` ชี้กลับไปที่ต้นทางให้อัตโนมัติ; `git init` สร้าง repository ใหม่ในเครื่อง"],"examFocus":["ถ้าเจอโจทย์แก้ไฟล์หลัง `git add` แล้วค่อย commit ให้ตอบว่า commit มีเฉพาะเนื้อหาตอน add และการแก้ครั้งหลังยังเป็น unstaged","ถ้าเจอไฟล์ที่อยู่ใน .gitignore แล้วแต่ยังขึ้น modified ให้นึกถึงว่าไฟล์ถูก tracked อยู่ก่อน และแก้ด้วย `git rm --cached`","ถ้าเจอคำถามหาว่าบรรทัดนี้ใครแก้และเมื่อไร ให้เลือก `git blame` (ระดับบรรทัด) และ `git log -p -- <path>` (ระดับไฟล์)","ถ้าเจอคำถามว่า clone ได้อะไรมา ให้ตอบว่าได้ประวัติทั้งหมด ไม่ใช่แค่ไฟล์ล่าสุด และมี remote ชื่อ origin","ถ้าเจอคำถามว่าควรทำอะไรก่อน commit ให้ตอบว่ารัน `git status` และ `git diff --staged` เพื่อตรวจว่ามีเฉพาะสิ่งที่ตั้งใจ"],"pitfalls":["เข้าใจผิดว่า commit เก็บสถานะ working directory ล่าสุด ความจริงเก็บจาก staging area","เข้าใจผิดว่าเพิ่มชื่อใน .gitignore แล้ว Git จะเลิกติดตามไฟล์ที่ commit ไปแล้วทันที","เข้าใจผิดว่า `git rm --cached` ลบไฟล์ออกจากเครื่อง จริง ๆ แค่เลิกติดตาม (ไฟล์ยังอยู่ในดิสก์)","เข้าใจผิดว่า `git blame` ใช้ระบุคนผิด ความจริงใช้ดูประวัติเพื่อเข้าใจเหตุผลของการแก้"],"example":{"lang":"bash","code":"git status\ngit add cart.ts\ngit diff --staged        # สิ่งที่จะเข้า commit\ngit diff                 # สิ่งที่แก้หลัง add (ยังไม่ staged)\ngit commit -m 'fix: apply coupon before tax'\n\necho '.env' >> .gitignore\ngit rm --cached .env     # เลิกติดตาม แต่ไม่ลบไฟล์ในเครื่อง\ngit commit -m 'chore: stop tracking .env'"}},{"descriptor":"GIT-J2","competency":"Git","title":"Commit, merge และการแก้ conflict","summary":"การ commit อย่างเป็นระบบและการ merge งานจากหลายคนเป็นงานประจำของทีม ต้องรู้วิธีแก้ conflict และการย้อนการเปลี่ยนแปลงที่ push แล้วอย่างปลอดภัย","keyPoints":["commit ที่ดีควรเล็ก ทำเรื่องเดียว (atomic) และข้อความอธิบายว่าทำอะไรและทำไม เช่น ใช้รูปแบบสั่งการสั้น ๆ หรือ Conventional Commits (`feat:`, `fix:`)","`git merge <branch>` รวมงานเข้ากับ branch ปัจจุบัน ถ้าไม่มีงานแยกทางกันจะเป็น fast-forward (แค่ขยับ pointer) ถ้าแยกทางกันจะสร้าง merge commit ที่มี parent สองตัว","`git merge --no-ff` บังคับสร้าง merge commit แม้ fast-forward ได้ เพื่อเก็บร่องรอยว่ามี branch แยก","conflict เกิดเมื่อสอง branch แก้บรรทัดเดียวกันของไฟล์เดียวกัน Git จะใส่เครื่องหมาย `<<<<<<<`, `=======`, `>>>>>>>` ในไฟล์","ขั้นตอนแก้ conflict: `git status` ดูไฟล์ที่ชน, แก้ไฟล์ให้เหลือเนื้อหาที่ถูกต้องและลบ marker, `git add <file>`, แล้ว `git commit` (หรือ `git merge --continue`)","`git merge --abort` ยกเลิกการ merge และกลับสู่สถานะก่อน merge","`git revert <commit>` สร้าง commit ใหม่ที่ทำตรงข้ามกับ commit เดิม ประวัติไม่ถูกเขียนใหม่ จึงเหมาะกับ commit ที่ push แล้ว","`git reset` ย้าย branch pointer และเขียนประวัติใหม่ ไม่ควรใช้กับ commit ที่ push ไปยัง branch ที่คนอื่นใช้ร่วม","`git commit --amend` แก้ commit ล่าสุด ใช้เฉพาะ commit ที่ยังไม่ push","การ revert merge commit ต้องระบุ parent ที่จะคงไว้ด้วย `git revert -m 1 <merge-commit>`"],"examFocus":["ถ้าเจอโจทย์ commit ที่ push ขึ้น main แล้วมีบั๊ก ให้ตอบ `git revert` ไม่ใช่ reset แล้ว force push","ถ้าเจอ conflict ให้ตอบลำดับ: เปิดไฟล์ แก้ marker เลือกเนื้อหาที่ถูก add แล้ว commit","ถ้าเจอคำถามเรื่อง merge commit ให้ตอบว่ามี parent สองตัว (ตัวหนึ่งคือ branch ปลายทาง อีกตัวคือ branch ที่รวมเข้ามา)","ถ้าเจอข้อความ commit ที่คลุมเครือเช่น update หรือ fix ให้เลือกตัวที่บอกสิ่งที่เปลี่ยนและเหตุผล","ถ้าเจอคำถามว่าเมื่อไรเกิด fast-forward ให้ตอบว่าเมื่อ branch ปลายทางไม่มี commit ใหม่ที่แยกทางออกมา"],"pitfalls":["แก้ conflict แล้วลืม `git add` ทำให้ Git ยังมองว่าไฟล์ยังไม่ resolved","เหลือ marker `<<<<<<<` ไว้ในโค้ดแล้ว commit","ใช้ `git reset --hard` แล้ว force push กับ branch ร่วม ทำให้ประวัติของเพื่อนร่วมทีมพัง","ใช้ commit ก้อนใหญ่รวมหลายเรื่อง ทำให้ revert หรือ review ยาก"],"example":{"lang":"bash","code":"git switch main\ngit merge feature/coupon        # เกิด conflict\ngit status                      # ดูไฟล์ที่ชน\n# แก้ไฟล์ ลบ <<<<<<< ======= >>>>>>> แล้ว\ngit add src/coupon.ts\ngit commit                      # หรือ git merge --continue\n\n# ย้อน commit ที่ push แล้วอย่างปลอดภัย\ngit revert 3f2a1bc\ngit push origin main"}},{"descriptor":"GIT-J3","competency":"Git","title":"ทำงานร่วมกันด้วย remote, Pull Request และ code review","summary":"งานทีมต้อง sync กับ remote repository และผ่าน Pull Request เพื่อให้ผู้อื่นตรวจก่อนรวมโค้ด การรู้วิธีรับมือเมื่อ push ถูกปฏิเสธและการเตรียม PR ที่ดีช่วยให้ทีมทำงานเร็วขึ้น","keyPoints":["`git fetch` ดึงข้อมูลใหม่จาก remote โดยไม่แตะ working directory ส่วน `git pull` คือ fetch แล้ว merge (หรือ rebase ถ้าใช้ `--rebase`)","push ถูกปฏิเสธด้วยข้อความ non-fast-forward / rejected แปลว่า remote มี commit ที่เครื่องเรายังไม่มี ต้อง `git pull` (หรือ `git pull --rebase`) รวมงานให้เสร็จแล้ว push ใหม่","ห้าม `git push --force` ทับ branch ร่วมเพื่อเลี่ยงการ pull เพราะจะลบ commit ของคนอื่น ถ้าจำเป็นจริงกับ branch ส่วนตัวให้ใช้ `--force-with-lease` ซึ่งปลอดภัยกว่า","workflow ทั่วไป: สร้าง branch จาก main, commit, push branch, เปิด Pull Request, รอ review และ CI, แก้ตามความเห็น, merge","PR ที่ดีควรเล็กและโฟกัสเรื่องเดียว ถ้าใหญ่เกินไปให้แยกเป็นหลาย PR เพราะ reviewer ตรวจได้ละเอียดกว่าและ revert ง่ายกว่า","รายละเอียด PR ควรมี: อธิบายว่าเปลี่ยนอะไรและทำไม, ลิงก์ issue/ticket, วิธีทดสอบ, ภาพหน้าจอถ้ามี UI","ก่อนเปิด PR ควร self-review diff ตัวเอง รัน test/lint ในเครื่อง และ rebase/merge จาก main ล่าสุดให้ conflict หมดก่อน","เมื่อได้รับความเห็น review ให้ commit แก้เพิ่มลง branch เดิมแล้ว push PR จะอัปเดตอัตโนมัติ ไม่ต้องเปิด PR ใหม่","ตอบความเห็นแต่ละข้ออย่างสุภาพ ถ้าไม่เห็นด้วยให้อธิบายเหตุผล และ resolve thread เมื่อแก้แล้ว","Draft PR ใช้ขอความเห็นช่วงต้นโดยยังไม่พร้อม merge; โมเดล fork ใช้ remote ชื่อ `upstream` ชี้ไป repo ต้นทาง"],"examFocus":["ถ้าเจอ push ถูกปฏิเสธเพราะ remote นำหน้า ให้ pull/rebase แล้ว push ใหม่ ไม่ใช่ force push","ถ้าเจอ PR ที่แก้หลายร้อยไฟล์หลายเรื่อง ให้แยกเป็น PR เล็กตามเรื่อง","ถ้าเจอ reviewer ขอแก้ ให้ push commit เพิ่มใน branch เดิม","ถ้าเจอคำถามเช็กลิสต์ก่อนเปิด PR ให้เลือก self-review, รัน test, อัปเดตจาก main, เขียนคำอธิบายชัดเจน","ถ้าเจอคำถามความต่างระหว่าง fetch กับ pull ให้ตอบว่า fetch ไม่เปลี่ยนไฟล์ในเครื่อง"],"pitfalls":["ใช้ `git push --force` เป็นทางออกแรกเมื่อ push ไม่ผ่าน","ปิด PR แล้วเปิดใหม่ทุกครั้งที่ต้องแก้ตามความเห็น ซึ่งทำให้ประวัติการ review หาย","ส่ง PR ที่ยังไม่เคยรันเทสต์เลยโดยหวังให้ reviewer หาบั๊กให้","เข้าใจผิดว่า `git pull` เป็นแค่ดาวน์โหลดเฉยๆ ความจริงมีขั้น merge/rebase ด้วย"],"example":{"lang":"bash","code":"git push origin feature/coupon\n# ! [rejected] feature/coupon -> feature/coupon (non-fast-forward)\ngit pull --rebase origin feature/coupon\ngit push origin feature/coupon\n\n# หลังได้ review comment\ngit add .\ngit commit -m 'address review: validate empty coupon code'\ngit push                # PR อัปเดตอัตโนมัติ"}},{"descriptor":"GIT-J4","competency":"Git","title":"Branching strategy แบบ Git Flow และ Semantic Versioning","summary":"ทีมใช้กลยุทธ์ branching เพื่อจัดการการพัฒนา การปล่อยเวอร์ชัน และการแก้ด่วนอย่างเป็นระเบียบ Git Flow เป็นรูปแบบคลาสสิกที่มี branch หลายประเภทพร้อมกฎการรวมที่ชัดเจน","keyPoints":["Git Flow มี branch ถาวร 2 ตัว: `main` (โค้ดที่ปล่อยจริงและติด tag เวอร์ชัน) และ `develop` (โค้ดรวมสำหรับรอบถัดไป)","`feature/*` แตกจาก `develop` และ merge กลับเข้า `develop` เมื่อเสร็จ ไม่แตกจาก main","`release/*` แตกจาก `develop` เพื่อเตรียมปล่อย (แก้บั๊กเล็กน้อย ปรับเลขเวอร์ชัน) แล้ว merge เข้า `main` ติด tag และ merge กลับ `develop`","`hotfix/*` แตกจาก `main` เพื่อแก้บั๊ก production ด่วน แล้ว merge เข้า `main` ติด tag และ merge กลับเข้า `develop` (หรือ release branch ที่เปิดอยู่) ด้วย เพื่อไม่ให้บั๊กกลับมา","Semantic Versioning รูปแบบ `MAJOR.MINOR.PATCH`: MAJOR เมื่อมี breaking change, MINOR เมื่อเพิ่มความสามารถแบบเข้ากันได้ย้อนหลัง, PATCH เมื่อแก้บั๊กแบบเข้ากันได้","hotfix ที่แก้บั๊กอย่างเดียวจึงเพิ่มเลข PATCH เช่น 1.4.0 เป็น 1.4.1","ติด tag แบบมีคำอธิบายด้วย `git tag -a v1.4.1 -m 'hotfix: ...'` และ tag ไม่ถูก push อัตโนมัติ ต้องใช้ `git push origin v1.4.1` (หรือ `--tags`)","ตั้งชื่อ branch ให้สื่อความหมาย เช่น `feature/login-otp`, `hotfix/payment-null`","ทางเลือกอื่น: GitHub Flow (main + feature branch + PR) และ trunk-based development (branch อายุสั้น merge เข้า main บ่อย) ซึ่งเรียบง่ายกว่า Git Flow"],"examFocus":["ถ้าเจอบั๊ก production ด่วน ให้แตก `hotfix/*` จาก `main` ไม่ใช่จาก `develop`","ถ้าเจอคำถามว่า hotfix เสร็จต้อง merge ไปที่ไหน ให้ตอบ main และ develop","ถ้าเจอโจทย์พัฒนาฟีเจอร์ใหม่ ให้แตก `feature/*` จาก `develop`","ถ้าเจอโจทย์เลือกเลขเวอร์ชันหลังแก้บั๊กอย่างเดียว ให้เพิ่ม PATCH; เพิ่มความสามารถใหม่ให้เพิ่ม MINOR; breaking change ให้เพิ่ม MAJOR","ถ้าเจอคำถามจุดประสงค์ของ release branch ให้ตอบว่าเป็นช่วงตรึงฟีเจอร์เพื่อทดสอบและเตรียมปล่อย"],"pitfalls":["แตก hotfix จาก develop ซึ่งอาจมีฟีเจอร์ที่ยังไม่พร้อมปล่อยปนเข้าไป","merge hotfix เข้า main อย่างเดียวแล้วลืม develop ทำให้บั๊กกลับมาในรอบหน้า","เพิ่มเลข MINOR หรือ MAJOR สำหรับการแก้บั๊กเล็ก ๆ ที่ไม่เปลี่ยนพฤติกรรมภายนอก","เข้าใจผิดว่า `git push` จะส่ง tag ไปด้วยโดยอัตโนมัติ"],"example":{"lang":"bash","code":"git switch main\ngit switch -c hotfix/payment-null\n# แก้บั๊กและ commit\ngit switch main\ngit merge --no-ff hotfix/payment-null\ngit tag -a v1.4.1 -m 'hotfix: handle null payment'\ngit switch develop\ngit merge --no-ff hotfix/payment-null\ngit push origin main develop v1.4.1"}},{"descriptor":"SQL-J1","competency":"SQL","title":"SQL พื้นฐานและแนวคิด relational (PK, FK, normalization)","summary":"SQL ใช้ query และแก้ไขข้อมูลในฐานข้อมูลเชิงสัมพันธ์ ต้องเข้าใจ NULL, JOIN, การจัดกลุ่ม และการออกแบบตารางที่ลดความซ้ำซ้อนด้วย key และ normalization","keyPoints":["ลำดับการประมวลผลเชิงตรรกะ: FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY ทำให้ WHERE กรองแถวก่อนจัดกลุ่ม ส่วน HAVING กรองกลุ่มหลังคำนวณ aggregate","NULL หมายถึงไม่มีค่า/ไม่ทราบค่า เปรียบเทียบด้วย `= NULL` ได้ผล UNKNOWN (ไม่ใช่ true) ต้องใช้ `IS NULL` หรือ `IS NOT NULL`","`COUNT(*)` นับทุกแถว ส่วน `COUNT(column)` ข้ามแถวที่ column เป็น NULL; `COUNT(DISTINCT column)` นับค่าไม่ซ้ำ; `SUM`/`AVG` ก็ข้าม NULL","`ORDER BY` เป็นสิ่งเดียวที่รับประกันลำดับผลลัพธ์ ถ้าไม่ระบุ ลำดับแถวไม่แน่นอน แม้จะดูเหมือนเรียงตาม id","Primary Key (PK) ต้องไม่ซ้ำและไม่เป็น NULL มีได้ตารางละหนึ่ง (อาจเป็น composite) ; surrogate key (เช่น id อัตโนมัติ) เสถียรกว่า natural key (เช่น เลขบัตร อีเมล) ที่อาจเปลี่ยนค่าได้","Foreign Key (FK) ชี้ไปยัง PK ของอีกตาราง เพื่อรักษา referential integrity ไม่ให้มีแถวลูกที่อ้างถึงแม่ที่ไม่มีอยู่ และกำหนดพฤติกรรมตอนลบได้ เช่น `ON DELETE CASCADE`","`INNER JOIN` คืนเฉพาะแถวที่จับคู่กันได้ทั้งสองตาราง; `LEFT JOIN` คืนทุกแถวฝั่งซ้ายและเติม NULL ถ้าไม่มีคู่","`GROUP BY` จัดกลุ่มแล้วใช้ aggregate เช่น `SUM`, `COUNT`, `AVG`, `MIN`, `MAX` ; ทุก column ใน SELECT ที่ไม่ใช่ aggregate ต้องอยู่ใน GROUP BY","`UPDATE`/`DELETE` ที่ไม่มี `WHERE` จะกระทบทุกแถว ควรเขียน `SELECT` ด้วยเงื่อนไขเดียวกันตรวจก่อน และทำใน transaction","Normalization: 1NF ค่าในแต่ละช่องต้องเป็นค่าเดี่ยว (atomic) ไม่ใส่รายการคั่นด้วยจุลภาคในช่องเดียว; 2NF ไม่มี partial dependency กับบางส่วนของ composite key; 3NF ไม่มี transitive dependency ; ช่วยลดความซ้ำซ้อนที่ก่อ insert/update/delete anomaly"],"examFocus":["ถ้าเจอคำถามหาแถวที่ค่าว่าง ให้ใช้ `IS NULL` ไม่ใช่ `= NULL`","ถ้าเจอเงื่อนไขบน aggregate เช่น ยอดรวมมากกว่า 1000 ให้ใช้ `HAVING` ส่วนเงื่อนไขบนค่าในแถวให้ใช้ `WHERE`","ถ้าเจอคำถามจำนวนแถวที่ column เป็น NULL บางแถว ให้แยกให้ออกระหว่าง `COUNT(*)` และ `COUNT(col)`","ถ้าเจอตารางที่เก็บหลายค่าในช่องเดียว (เช่น รายการสินค้าคั่นจุลภาค) ให้บอกว่าละเมิด 1NF และแยกเป็นตารางลูก","ถ้าเจอข้อมูลลูกค้าซ้ำในทุกแถวของคำสั่งซื้อ ให้ชี้ว่าเกิด update anomaly และแยกตารางพร้อม FK","ถ้าเจอโจทย์เขียน query ยอดรวมต่อลูกค้า ให้ใช้ JOIN + `GROUP BY` ลูกค้า + `SUM`"],"pitfalls":["เขียน `WHERE COUNT(*) > 1` ซึ่งผิด ต้องใช้ HAVING","คิดว่า `COUNT(column)` นับ NULL ด้วย","ไม่ใส่ `WHERE` ตอน `UPDATE` หรือ `DELETE` จนแก้ทั้งตาราง","คิดว่า SELECT ที่ไม่มี ORDER BY จะเรียงตาม PK เสมอ","ใช้ข้อมูลที่เปลี่ยนค่าได้ เช่น อีเมล เป็น PK แล้วต้องไล่แก้ FK ทุกตาราง"],"example":{"lang":"sql","code":"SELECT c.id, c.name, SUM(o.total) AS total_spent\nFROM customers c\nINNER JOIN orders o ON o.customer_id = c.id\nWHERE o.status = 'PAID'\nGROUP BY c.id, c.name\nHAVING SUM(o.total) > 1000\nORDER BY total_spent DESC;\n\nSELECT * FROM users WHERE phone IS NULL;"}},{"descriptor":"OOP-J1","competency":"OOP","title":"แนวคิด OOP: class, object, method, attribute","summary":"OOP จัดโปรแกรมเป็นออบเจ็กต์ที่รวมข้อมูลกับพฤติกรรมไว้ด้วยกัน การเข้าใจความต่างของ class กับ object และบทบาทของ this เป็นพื้นฐานของแนวคิดอื่นทั้งหมด","keyPoints":["class คือแบบพิมพ์เขียว (blueprint) ที่กำหนดโครงสร้างและพฤติกรรม ส่วน object คือ instance ที่สร้างจาก class ด้วย `new` และแต่ละ instance มีข้อมูลเป็นของตัวเอง","attribute (หรือ field/property) คือข้อมูลสถานะของ object เช่น `name`, `balance`; method คือพฤติกรรมหรือการกระทำที่ object ทำได้ เช่น `deposit()`","ใช้ `this` ภายใน method เพื่ออ้างถึง instance ปัจจุบัน (ใน Python ใช้ `self`) เพื่อเข้าถึง attribute ของ object ตัวนั้น","สร้างหลาย object จาก class เดียวได้ การแก้ attribute ของ object หนึ่งไม่กระทบอีก object (เว้นแต่เป็นสมาชิกแบบ static ที่ใช้ร่วมกัน)","ข้อมูลที่ต่างกันต่อ object ควรเป็น instance attribute ส่วนค่าที่ใช้ร่วมกันทุก object ควรเป็น static/class-level","ค่าที่คำนวณได้จาก attribute อื่น (เช่น ราคารวม) มักทำเป็น method หรือ getter แทนการเก็บซ้ำ เพื่อลดโอกาสข้อมูลไม่ตรงกัน","ตั้งชื่อ class เป็นคำนาม (`Order`, `Customer`) และ method เป็นคำกริยา (`calculateTotal`, `cancel`)","method ที่ไม่ใช้ `this` และไม่ต้องการ state ของ instance อาจเหมาะเป็น static method"],"examFocus":["ถ้าเจอคำถามความต่างของ class กับ object ให้ตอบว่า class เป็นแบบ ส่วน object เป็นตัวจริงที่สร้างจากแบบนั้น","ถ้าเจอโค้ดสร้างสอง object แล้วแก้อันหนึ่ง ให้ตอบว่าอีกอันไม่เปลี่ยน (ถ้าไม่ใช่ static หรือ reference เดียวกัน)","ถ้าเจอ `this.x` ใน method ให้ตอบว่าหมายถึง attribute ของ instance ที่เรียก method นั้น","ถ้าเจอคำถามว่าสิ่งใดควรเป็น attribute หรือ method ให้ใช้หลัก ข้อมูล/สถานะ เป็น attribute และ การกระทำ เป็น method"],"pitfalls":["สับสนว่า class คือ object เอง ทั้งที่ class เป็นแบบและ object คือตัวที่สร้างขึ้น","ลืมใช้ `this.` ใน JavaScript/TypeScript แล้วอ้างถึงตัวแปรภายนอกผิดตัว","เก็บค่าที่คำนวณได้ซ้ำเป็น attribute แล้วลืมอัปเดตให้ตรงกัน"],"example":{"lang":"typescript","code":"class Product {\n  name: string;\n  price: number;\n  constructor(name: string, price: number) {\n    this.name = name;\n    this.price = price;\n  }\n  priceWithTax(rate: number): number {\n    return this.price * (1 + rate);\n  }\n}\nconst a = new Product('Pen', 10);\nconst b = new Product('Book', 100);\na.price = 12;                 // b.price ยังเป็น 100"}},{"descriptor":"OOP-J2","competency":"OOP","title":"สร้าง class และ instantiate object (constructor, static)","summary":"การสร้าง class ที่ใช้งานได้ต้องกำหนด constructor, ค่าเริ่มต้น และแยกให้ออกระหว่างสมาชิกของ instance กับสมาชิก static ของ class","keyPoints":["constructor เป็นเมธอดพิเศษที่ถูกเรียกอัตโนมัติตอน `new` ใช้กำหนดค่าเริ่มต้นให้ object (ใน JS/TS ชื่อ `constructor`, ใน Python ชื่อ `__init__`, ใน Java ชื่อเดียวกับ class)","บังคับให้ต้องส่งข้อมูลจำเป็นด้วยการใส่เป็นพารามิเตอร์ของ constructor ทำให้สร้าง object ที่ข้อมูลไม่ครบไม่ได้","พารามิเตอร์ค่าเริ่มต้นใน TypeScript: `constructor(name: string, qty = 1)` ถ้าไม่ส่ง qty จะได้ 1","TypeScript มี parameter properties: `constructor(private name: string)` ประกาศ field และกำหนดค่าในบรรทัดเดียว","สมาชิก `static` เป็นของ class ไม่ใช่ของ instance เข้าถึงผ่านชื่อ class เช่น `Counter.count` และใช้ร่วมกันทุก object","static counter ใช้นับจำนวน object ที่สร้าง โดยเพิ่มค่าใน constructor : `Counter.count++`","static method เรียกผ่านชื่อ class และใช้ `this` อ้าง instance ไม่ได้ เพราะไม่ผูกกับ object ใด","ใน Java ถ้าไม่เขียน constructor เลย คอมไพเลอร์จะสร้าง default constructor ให้ แต่เมื่อเขียน constructor เองแล้ว default จะไม่ถูกสร้างอัตโนมัติ","ใน Python อย่าใช้ค่า default ที่เป็น mutable เช่น `def __init__(self, items=[])` เพราะ list ถูกใช้ร่วมกันทุก instance ให้ใช้ `None` แล้วสร้างใหม่ใน constructor"],"examFocus":["ถ้าเจอโจทย์ต้องการให้ object มีข้อมูลบางอย่างเสมอ ให้ตอบว่าบังคับผ่านพารามิเตอร์ใน constructor","ถ้าเจอโจทย์นับจำนวน instance ที่ถูกสร้าง ให้ใช้ static field ที่เพิ่มค่าใน constructor","ถ้าเจอโค้ดที่สร้าง object โดยไม่ส่งพารามิเตอร์ที่มี default ให้ตอบค่า default","ถ้าเจอการเรียก static member ผ่านอินสแตนซ์หรือใช้ `this` ใน static method ให้ชี้ว่าผิดหรือใช้ไม่ได้"],"pitfalls":["คิดว่า static field แยกคนละค่าต่อ object ความจริงมีค่าเดียวร่วมกัน","ลืมเรียก constructor ด้วย `new` ใน JS/TS","ใช้ค่า default แบบ mutable ใน Python จนข้อมูลรั่วข้ามระหว่าง instance"],"example":{"lang":"typescript","code":"class Ticket {\n  static count = 0;\n  readonly id: number;\n  constructor(public title: string, public priority = 'normal') {\n    Ticket.count++;\n    this.id = Ticket.count;\n  }\n}\nconst t1 = new Ticket('Login bug');           // priority = 'normal'\nconst t2 = new Ticket('Slow page', 'high');\nconsole.log(Ticket.count);                     // 2"}},{"descriptor":"OOP-J3","competency":"OOP","title":"Encapsulation: ซ่อนข้อมูลและรวมพฤติกรรมไว้ใน class","summary":"Encapsulation คือการรวมข้อมูลกับเมธอดที่เกี่ยวข้องไว้ใน class เดียว และซ่อนรายละเอียดภายใน โดยเปิดเฉพาะช่องทางที่ควบคุมได้ เพื่อรักษาความถูกต้องของข้อมูลและเปลี่ยนภายในได้โดยไม่กระทบผู้ใช้","keyPoints":["ซ่อนข้อมูลด้วย access modifier: `private` (ใช้ได้เฉพาะใน class), `protected` (class และ subclass — ใน Java รวม class อื่นใน package เดียวกันด้วย), `public` (ทุกที่)","ใน TypeScript `private` ตรวจตอน compile เท่านั้น ส่วน `#field` เป็น private จริงระดับ runtime ของ JavaScript","ใน Python ไม่มี private จริง ใช้ convention `_name` และ `__name` (name mangling)","ให้เปลี่ยนค่าผ่านเมธอดที่ตรวจกฎก่อน เช่น `withdraw()` ที่ตรวจว่ายอดพอและจำนวนมากกว่า 0 แทนการให้แก้ `balance` ตรง ๆ","getter อ่านค่าได้ ส่วน setter ควรตรวจความถูกต้อง ถ้ามีแต่ getter (getter-only) property นั้นเป็น read-only จากภายนอก","ใน TS/JS: `get total() { ... }` ไม่มี setter ทำให้กำหนดค่าไม่ได้ (TS รายงาน error; JS ในโหมด strict โยน TypeError)","ประโยชน์: รักษา invariant (กฎของข้อมูล) , เปลี่ยน implementation ภายในได้โดยโค้ดภายนอกไม่ต้องแก้, ลดการพึ่งพากันและดีบักง่ายขึ้น","ระวังไม่คืน reference ของ collection ภายในออกไปตรง ๆ เพราะผู้เรียกแก้ได้ ให้คืนสำเนา หรือแบบ readonly","รวมข้อมูลกับพฤติกรรมที่ใช้ข้อมูลนั้นไว้ใน class เดียวกัน (high cohesion) แทนการกระจายฟังก์ชันที่แก้ข้อมูลไว้หลายที่"],"examFocus":["ถ้าเจอโจทย์ต้องป้องกันยอดเงินติดลบ ให้ตอบว่าทำ field เป็น private และตรวจใน method ที่แก้ค่า","ถ้าเจอคำถามประโยชน์ของ encapsulation ให้ตอบว่าเปลี่ยนโครงสร้างภายในได้โดยไม่กระทบโค้ดที่เรียกใช้","ถ้าเจอ property ที่ต้องอ่านได้อย่างเดียว ให้ใช้ getter โดยไม่มี setter","ถ้าเจอโค้ดที่แก้ field ของ object ตรง ๆ จนข้ามกฎธุรกิจ ให้ชี้ว่าละเมิด encapsulation"],"pitfalls":["คิดว่า encapsulation คือแค่การเขียน getter/setter ให้ทุก field โดยไม่ตรวจอะไรเลย ซึ่งไม่ได้ปกป้องข้อมูล","คิดว่า `private` ใน TypeScript กันได้ตอน runtime (จริง ๆ เป็นการตรวจตอน compile)","คืน array ภายในออกไปตรง ๆ แล้วผู้เรียกแก้เนื้อหาได้"],"example":{"lang":"typescript","code":"class BankAccount {\n  #balance = 0;\n  deposit(amount: number): void {\n    if (amount <= 0) throw new Error('amount must be positive');\n    this.#balance += amount;\n  }\n  withdraw(amount: number): void {\n    if (amount > this.#balance) throw new Error('insufficient funds');\n    this.#balance -= amount;\n  }\n  get balance(): number {      // getter-only: อ่านได้อย่างเดียว\n    return this.#balance;\n  }\n}"}},{"descriptor":"OOP-J4","competency":"OOP","title":"Inheritance: นำโค้ดกลับมาใช้และขยายด้วย subclass","summary":"Inheritance ให้ subclass รับสมาชิกจาก superclass และเพิ่มหรือแทนที่พฤติกรรมได้ ใช้เมื่อความสัมพันธ์เป็นแบบ is-a เพื่อลดโค้ดซ้ำ","keyPoints":["ใช้ `extends` สร้าง subclass ที่รับ attribute และ method (ที่เข้าถึงได้) จาก superclass โดยไม่ต้องเขียนซ้ำ","ทดสอบความเหมาะสมด้วย is-a: `Dog` is-a `Animal` ถูกต้อง แต่ `Car` is-a `Engine` ไม่ถูก (เป็น has-a ควรใช้ composition)","override คือการเขียน method ชื่อเดียวกันใน subclass เพื่อเปลี่ยนพฤติกรรม ใช้ `super.method()` เรียกพฤติกรรมของ superclass เพื่อต่อยอด","ใน constructor ของ subclass ต้องเรียก `super(...)` เพื่อสร้างส่วนของ superclass ก่อน และใน JS/TS ต้องเรียกก่อนใช้ `this`","สมาชิก `private` ของ superclass subclass เข้าถึงโดยตรงไม่ได้ (ใช้ `protected` ถ้าต้องการให้ subclass ใช้ได้)","Polymorphism: ตัวแปรชนิด superclass ถือ object ของ subclass ได้ และเรียก method ที่ถูก override จะทำงานตามชนิดจริงของ object","class ใน Java/TS/JS สืบทอดจาก superclass ได้เพียงตัวเดียว (single inheritance) แต่ implement interface ได้หลายตัว","หลัก composition over inheritance: ถ้าไม่ใช่ is-a ชัดเจน ให้ประกอบ object เข้าด้วยกันแทน เพราะ inheritance ผูกโค้ดแน่นกว่า","abstract class ใช้เป็นฐานที่สร้าง instance ตรง ๆ ไม่ได้ และบังคับให้ subclass เติม method ที่ประกาศไว้"],"examFocus":["ถ้าเจอคำถามเลือกความสัมพันธ์ที่ควรใช้ inheritance ให้เลือกคู่ที่เป็น is-a จริง","ถ้าเจอ subclass ที่ต้องการเพิ่มพฤติกรรมต่อจากของแม่ ให้ override แล้วเรียก `super.method()`","ถ้าเจอ subclass ที่ไม่ได้เขียน method บางตัว ให้ตอบว่าใช้ของ superclass ได้ทันที","ถ้าเจอ constructor ของ subclass ที่ไม่เรียก `super(...)` ให้ชี้ว่าเกิดข้อผิดพลาด (ใน JS/TS)"],"pitfalls":["ใช้ inheritance เพียงเพราะอยากใช้โค้ดซ้ำ ทั้งที่ไม่ใช่ is-a","คิดว่า subclass เข้าถึง private ของแม่ได้","override แล้วลืมเรียก `super` ทำให้ logic ของแม่หายไป"],"example":{"lang":"typescript","code":"class Employee {\n  constructor(public name: string, protected baseSalary: number) {}\n  pay(): number { return this.baseSalary; }\n}\nclass Manager extends Employee {\n  constructor(name: string, baseSalary: number, private bonus: number) {\n    super(name, baseSalary);\n  }\n  pay(): number {\n    return super.pay() + this.bonus;   // ต่อยอดของแม่\n  }\n}\nconsole.log(new Manager('Ann', 50000, 8000).pay()); // 58000"}},{"descriptor":"OOP-J5","competency":"OOP","title":"เขียนตัวอย่างโค้ด OOP: reference และลำดับเรียก constructor","summary":"การอ่านและเขียนโค้ดตัวอย่าง OOP ต้องเข้าใจว่าตัวแปร object เก็บ reference และเข้าใจลำดับการสร้าง object เมื่อมี inheritance","keyPoints":["ตัวแปรที่เก็บ object (ใน JS/TS, Java, Python) เก็บ reference ไม่ใช่ตัวสำเนา การ `b = a` ทำให้ a และ b ชี้ไป object เดียวกัน","เมื่อสอง reference ชี้ object เดียวกัน การแก้ผ่านตัวหนึ่งจะเห็นผลผ่านอีกตัวด้วย","ต้องการสำเนา: shallow copy ด้วย spread `{...obj}` (แต่ object ซ้อนข้างในยังใช้ร่วมกัน), deep copy ด้วย `structuredClone(obj)` ซึ่งมีใน Node และเบราว์เซอร์รุ่นใหม่","การเปรียบเทียบ `===` ของ object ใน JS เปรียบเทียบ reference ไม่ใช่เนื้อหา (ใน Java `==` เปรียบเทียบ reference ส่วน `.equals()` เปรียบเทียบเนื้อหาได้ก็ต่อเมื่อ class override `equals()` เช่น `String` ; ค่าเริ่มต้นของ `Object.equals()` ยังเทียบ reference)","การส่ง object เข้า function จะส่ง reference ไปด้วย (pass by sharing) function แก้ field ของ object นั้นได้และผู้เรียกจะเห็นผล","ลำดับเรียก constructor เมื่อมีสืบทอด: constructor ของ superclass ทำงานก่อน แล้วจึงถึง constructor ของ subclass","ใน TS/JS field initializer ของ subclass ถูกกำหนดหลัง `super()` คืนค่าแล้ว","ใน Java ถ้าไม่ได้เขียน `super(...)` เอง คอมไพเลอร์จะแทรก `super()` แบบไม่มีพารามิเตอร์ให้ ถ้า superclass ไม่มี constructor แบบนั้นจะคอมไพล์ไม่ผ่าน","ตัวอย่างโค้ดที่ดีสาธิตแนวคิดเดียวให้ชัด มีชื่อสื่อความหมาย และมี output ที่คาดเดาได้"],"examFocus":["ถ้าเจอโค้ด `const b = a; b.x = 5;` แล้วถามค่า `a.x` ให้ตอบ 5 เพราะเป็น object เดียวกัน","ถ้าเจอโค้ด new subclass พร้อม `console.log` ใน constructor ทั้งสองชั้น ให้ตอบว่าพิมพ์ของ superclass ก่อน","ถ้าเจอคำถามต้องการ object ที่แก้แล้วไม่กระทบต้นฉบับ ให้ทำสำเนา (copy) ไม่ใช่ assign","ถ้าเจอการเปรียบเทียบ object สองตัวที่เนื้อหาเหมือนกัน ให้ระวังว่า `===` ได้ false"],"pitfalls":["คิดว่า `b = a` สร้างสำเนาของ object","คิดว่าสำเนาแบบ spread เป็น deep copy ทั้งที่ object ซ้อนในยังแชร์กัน","คิดว่า constructor ของ subclass ทำงานก่อนของ superclass"],"example":{"lang":"typescript","code":"class Animal {\n  constructor() { console.log('Animal'); }\n}\nclass Dog extends Animal {\n  constructor() { super(); console.log('Dog'); }\n}\nnew Dog();                // พิมพ์ Animal แล้วตามด้วย Dog\n\nconst a = { n: 1 };\nconst b = a;              // reference เดียวกัน\nb.n = 5;\nconsole.log(a.n);         // 5\nconst c = structuredClone(a);\nc.n = 9;                  // a.n ยังเป็น 5"}},{"descriptor":"MON-J1","competency":"Monitoring and Logging","title":"อ่าน logs, metrics และ traces เพื่อ triage","summary":"Observability ประกอบด้วย logs, metrics และ traces ซึ่งช่วยให้เข้าใจพฤติกรรมของระบบและคัดแยกเหตุการณ์ผิดปกติได้เร็ว ต้องอ่านให้เป็นและรู้ว่าตัวชี้วัดใดหลอกตาได้","keyPoints":["logs คือบันทึกเหตุการณ์ทีละรายการ, metrics คือค่าตัวเลขตามเวลา (เช่น request rate, error rate, CPU), traces คือเส้นทางของ request หนึ่งผ่านหลายบริการ","ระดับ log ทั่วไป: DEBUG, INFO, WARN, ERROR (และ FATAL/CRITICAL) ใน production มักเปิดตั้งแต่ INFO ขึ้นไป","structured log (เช่น JSON) ค้นหาและกรองง่ายกว่าข้อความอิสระ และควรมี timestamp, level, message, correlation/request ID","อ่าน log เป็นลำดับเวลา: หา error แรกสุดที่ผิดปกติ ไม่ใช่ error สุดท้าย เพราะ error ที่ตามมามักเป็นผลต่อเนื่อง","stack trace: ดูชนิด exception และข้อความ แล้วไล่ดู frame ที่อยู่ในโค้ดของเราเองเพื่อหาจุดเกิดเหตุ","mobile crash report ควรอ่าน: ชนิด exception/สัญญาณ, stack trace, เวอร์ชันแอป, รุ่นอุปกรณ์และ OS, สถานะก่อนเกิด crash ; ต้อง symbolicate (dSYM บน iOS, mapping file ของ ProGuard/R8 บน Android) จึงจะอ่านชื่อ method ได้","ค่าเฉลี่ย (average) ของ latency ซ่อนปัญหาช่วงท้าย (tail) ได้ จึงควรดู percentile เช่น p50 (มัธยฐาน), p95, p99 ซึ่งบอกประสบการณ์ของผู้ใช้ที่ช้าที่สุดบางส่วน","ชุดตัวชี้วัดที่ใช้บ่อย: RED (Rate, Errors, Duration) สำหรับบริการ และ Four Golden Signals (latency, traffic, errors, saturation)","trace ประกอบด้วย span หลายอัน แต่ละ span คือขั้นตอนหนึ่งพร้อมเวลาเริ่มและระยะเวลา ใช้หาว่าขั้นตอนใดใช้เวลามากสุด","การ triage คือประเมินผลกระทบและความรุนแรงก่อน ว่ากระทบผู้ใช้กี่คน บริการใด แล้วจึงตัดสินว่าจะส่งต่อหรือแก้เอง"],"examFocus":["ถ้าเจอลำดับ log ที่มี error หลายบรรทัด ให้หาบรรทัดแรกที่ผิดปกติตามเวลาเป็นต้นเหตุที่น่าสงสัย","ถ้าเจอข้อมูลว่าค่าเฉลี่ยเวลาตอบสนองปกติแต่ผู้ใช้บ่นว่าช้า ให้ดู p95/p99","ถ้าเจอ crash report ของแอปมือถือ ให้ดูเวอร์ชันแอป รุ่นเครื่อง OS และจุดบนสุดของ stack trace ในโค้ดของเรา","ถ้าเจอคำถามว่าควรใช้ข้อมูลชนิดใดตอบคำถามไหน ให้จับคู่: metrics บอกว่ามีปัญหา, traces บอกว่าช้าตรงไหน, logs บอกรายละเอียดว่าเกิดอะไร","ถ้าเจอ log ที่มี correlation ID ให้ใช้ ID นั้นตามรอย request ข้ามบริการ"],"pitfalls":["ใช้ค่าเฉลี่ยตัดสินว่าระบบเร็วพอ ทั้งที่ p99 สูงมาก","ไปแก้ error บรรทัดสุดท้ายซึ่งเป็นแค่ผลพวง","ใส่ข้อมูลอ่อนไหว เช่น รหัสผ่านหรือ token ลงใน log","อ่าน crash report โดยไม่ดูเวอร์ชันแอป ทำให้ไปแก้บั๊กที่แก้ไปแล้ว"]},{"descriptor":"MON-J2","competency":"Monitoring and Logging","title":"ขั้นตอนตอบสนองต่อ incident เบื้องต้น","summary":"เมื่อเกิด incident ทีมต้องทำตามขั้นตอนที่ชัดเจน แจ้งคนที่เกี่ยวข้อง บันทึกสิ่งที่ทำ และส่งต่อเมื่อเกินความสามารถ เพื่อลดผลกระทบและเรียนรู้ภายหลัง","keyPoints":["ขั้นตอนทั่วไป: ตรวจจับ/รับทราบ (acknowledge), ประเมินผลกระทบและระดับความรุนแรง (severity), แจ้งทีมและผู้เกี่ยวข้อง, บรรเทาผลกระทบ (mitigate), แก้ไข, ปิดและทบทวน","สิ่งแรกที่ควรทำคือแจ้งทีม/ผู้ดูแลที่ถูกต้อง (เช่น ผ่าน incident channel หรือ on-call) และเปิด ticket ก่อนลงมือแก้เงียบ ๆ คนเดียว","ควรบรรเทาผลกระทบก่อนหาสาเหตุราก เช่น rollback เวอร์ชันล่าสุด, ปิด feature flag, สลับไปแผนสำรอง แล้วค่อยหา root cause ภายหลัง","บันทึก incident ควรมี: เวลาที่เริ่ม/พบ, อาการและผลกระทบ, ระบบที่เกี่ยวข้อง, สิ่งที่ทำไปแล้วพร้อมเวลาและผู้ทำ, ลิงก์ log/dashboard, สถานะปัจจุบัน","บันทึกเป็นไทม์ไลน์ระหว่างเกิดเหตุ ไม่รอจนจบแล้วค่อยนึกย้อน เพราะรายละเอียดหายง่าย","ใช้ ticket system (เช่น Jira, ServiceNow, PagerDuty ในส่วน alert) เป็นศูนย์กลางติดตามสถานะและผู้รับผิดชอบ","ส่งต่อ (escalate) เมื่อเกินสิทธิ์หรือความรู้, ผลกระทบกำลังขยาย, ไม่คืบหน้าภายในเวลาที่ตกลงกัน หรือความรุนแรงสูง ไม่ควรรอจนเสียเวลานาน","ใช้ runbook/playbook ของระบบนั้นเป็นแนวทางเมื่อมี และสื่อสารสถานะให้ผู้มีส่วนได้ส่วนเสียเป็นระยะ","หลังจบควรทำ post-incident review แบบ blameless เพื่อหาสาเหตุเชิงระบบและกำหนดงานป้องกันซ้ำ ไม่ใช่หาคนผิด"],"examFocus":["ถ้าเจอโจทย์พบระบบล่มระหว่างเวร ให้ตอบ รับทราบ ประเมินผลกระทบ แจ้งทีม เปิด ticket แล้วบรรเทา","ถ้าเจอคำถามว่าควรบันทึกอะไร ให้เลือกไทม์ไลน์ อาการ ผลกระทบ และการกระทำทั้งหมดพร้อมเวลา","ถ้าเจอโจทย์ติดปัญหานานเกินกำหนดหรือเกินสิทธิ์ ให้ escalate ไปยังผู้เชี่ยวชาญหรือหัวหน้าทีมพร้อมข้อมูลที่รวบรวมไว้","ถ้าเจอตัวเลือกให้แก้เงียบ ๆ โดยไม่บอกใครหรือไม่บันทึก ให้ตัดทิ้ง"],"pitfalls":["รอหาสาเหตุรากให้ครบก่อนค่อยบรรเทา ทำให้ผู้ใช้เสียหายนานขึ้น","แก้ไขโดยไม่จดสิ่งที่ทำ ทำให้ทีมอื่นซ้ำงานหรือทำให้ปัญหาแย่ลง","ไม่ escalate เพราะกลัวถูกมองว่าไม่เก่ง","ใช้ post-incident review เพื่อโทษบุคคล"]},{"descriptor":"WEB-J1","competency":"Web & Mobile Development","title":"พัฒนา UI เว็บ/มือถือ: responsive และ accessibility","summary":"การสร้างหน้าจอที่ใช้ได้กับทุกอุปกรณ์และทุกคนต้องใช้ HTML ที่มีความหมาย CSS แบบ responsive และคำนึงถึง accessibility เช่น ป้ายกำกับสำหรับ screen reader และการรองรับขนาดตัวอักษรที่ผู้ใช้ปรับ","keyPoints":["ใช้ semantic HTML5 เช่น `header`, `nav`, `main`, `section`, `article`, `footer`, `button` แทน `div` ที่ไม่มีความหมาย เพราะ screen reader และ keyboard ใช้งานได้ดีกว่า","ทุกรูปที่สื่อความหมายต้องมี `alt`; รูปตกแต่งใช้ `alt=''` ; ช่องฟอร์มต้องมี `label` ผูกด้วย `for`/`id` ไม่ใช้ placeholder แทน label","responsive: ใส่ `<meta name='viewport' content='width=device-width, initial-scale=1'>`, ใช้ media query, ออกแบบ mobile-first, ใช้ Flexbox/Grid และหน่วยสัมพัทธ์ เช่น `rem`, `%`, `fr`","รองรับผู้ใช้ที่ขยายขนาดตัวอักษร: หลีกเลี่ยงความสูงคงที่ ปล่อยให้ข้อความขึ้นบรรทัดใหม่ และทดสอบเลย์เอาต์ที่ฟอนต์ใหญ่ (Dynamic Type บน iOS, `sp` บน Android)","ปุ่มไอคอนที่ไม่มีข้อความต้องมีชื่อสำหรับเทคโนโลยีช่วยเหลือ: เว็บใช้ `aria-label`, React Native ใช้ `accessibilityLabel`, Android ใช้ `contentDescription` ; ทดสอบด้วย screen reader เช่น VoiceOver (iOS) และ TalkBack (Android)","ขนาดพื้นที่แตะควรใหญ่พอ: แนวทาง Apple ประมาณ 44x44 pt และ Material Design ประมาณ 48x48 dp","WCAG: คอนทราสต์ข้อความปกติอย่างน้อย 4.5:1 (AA) และข้อความใหญ่ 3:1 ; อย่าใช้สีอย่างเดียวบอกสถานะ ต้องมีข้อความหรือไอคอนประกอบ","รองรับคีย์บอร์ด: เรียงลำดับ tab สมเหตุสมผล และต้องเห็นกรอบ focus ชัดเจน","ฟอร์มที่เข้าถึงได้: label ครบ, ข้อความ error บอกว่าผิดอะไรและเชื่อมกับช่อง, ใช้ `type` ที่เหมาะ (`email`, `tel`), ระบุช่องที่จำเป็น","เครื่องมือดีบัก: เบราว์เซอร์ DevTools (Elements, Console, Network), และ framework ข้ามแพลตฟอร์ม เช่น React Native หรือ Flutter ใช้โค้ดชุดเดียวสร้างแอปหลายแพลตฟอร์ม"],"examFocus":["ถ้าเจอปุ่มที่เป็นไอคอนล้วน ให้เติม label สำหรับ screen reader (accessibility label)","ถ้าเจอโจทย์ผู้ใช้ตั้งฟอนต์ใหญ่แล้วข้อความถูกตัด ให้เลิกใช้ความสูงคงที่และใช้ layout ที่ยืดหยุ่น","ถ้าเจอเช็กลิสต์ฟอร์มที่เข้าถึงได้ ให้เลือก label, ลำดับ focus, คอนทราสต
