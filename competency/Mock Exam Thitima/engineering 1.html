mmit"},{"id":"B","text":"cart.ts ทั้งสองครั้งที่แก้ เพราะไฟล์ที่ add ไว้แล้ว Git จะอัปเดตเนื้อหาล่าสุดให้ตอน commit เอง","correct":false,"why":"git add เก็บสแนปช็อตของไฟล์ ณ ตอนที่สั่ง add การแก้ไขหลังจากนั้นไม่ตามเข้า staging area อัตโนมัติ"},{"id":"C","text":"เฉพาะ cart.ts ตามที่แก้ไว้ตอน add ส่วนที่แก้ภายหลังและ coupon.ts ยังค้างอยู่ใน working directory","correct":true,"why":"ถูกต้อง commit ได้เนื้อหาตามสแนปช็อตตอน add ส่วนที่แก้ภายหลังยังเป็น Changes not staged for commit ต้อง add ซ้ำก่อนจึงจะเข้า commit ถัดไป"},{"id":"D","text":"ไม่มีอะไรถูกบันทึก เพราะ cart.ts เปลี่ยนไปหลัง add Git จึงปฏิเสธการ commit จนกว่าจะ add ใหม่","correct":false,"why":"Git ไม่ปฏิเสธ commit เมื่อมีของใน staging area อยู่แล้ว มันบันทึกสแนปช็อตเดิมนั้นตามปกติ"}],"explanation":"staging area คือพื้นที่พักที่เก็บสแนปช็อตของไฟล์ตอน git add และ git commit บันทึกจากพื้นที่นี้เท่านั้น ไม่ได้อ่านจาก working directory โดยตรง แนวทางใช้งานจริงคือรัน git status ก่อน commit ทุกครั้ง ถ้าไฟล์เดียวกันขึ้นทั้ง Changes to be committed และ Changes not staged for commit แปลว่ามีการแก้หลัง add และต้อง add ซ้ำถ้าต้องการให้เข้า commit นี้"},{"id":"ENG-J-P-002","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J1","concept":"git-ignore-already-tracked-file","mobile":false,"type":"single","stem":"ทีมเพิ่มบรรทัด .env ลงในไฟล์ .gitignore แล้ว แต่ไฟล์ .env เคยถูก commit เข้า repository มาตั้งแต่ต้น พอเปลี่ยนค่าคอนฟิกในเครื่อง git status ก็ยังขึ้นว่า .env ถูกแก้ไข (modified) สาเหตุและวิธีแก้ที่ตรงจุดคืออะไร","options":[{"id":"A","text":"ไฟล์ถูก track อยู่แล้ว ซึ่ง .gitignore ไม่มีผล ต้องหยุด track ด้วย git rm --cached .env แล้ว commit","correct":true,"why":"ถูกต้อง git rm --cached เอาไฟล์ออกจาก index โดยไม่ลบไฟล์ในเครื่อง หลังจากนั้น .gitignore จึงมีผลกับไฟล์นี้"},{"id":"B","text":"Git ยังไม่โหลดกติกาใน .gitignore ใหม่ ต้องรัน git gc ก่อนกติกานี้จึงมีผลกับไฟล์ทุกไฟล์","correct":false,"why":"Git อ่าน .gitignore ทุกครั้งที่ตรวจสถานะ ไม่มีขั้นตอนโหลดใหม่ และ git gc เป็นคำสั่งจัดการพื้นที่เก็บข้อมูล ไม่เกี่ยวกับกติกา ignore"},{"id":"C","text":"ต้องลบไฟล์ .env ออกจากเครื่องก่อน แล้วสร้างใหม่ด้วยชื่อเดิม Git จึงจะเริ่มเคารพกติกา","correct":false,"why":"การลบทำให้ git status แสดงว่าไฟล์ที่ track อยู่ถูกลบ และไฟล์ที่สร้างใหม่ชื่อเดิมก็ยังถูก track อยู่เหมือนเดิม"},{"id":"D","text":"ต้อง commit และ push ไฟล์ .gitignore ขึ้น remote ก่อน กติกาจึงจะเริ่มทำงานกับไฟล์ในเครื่องของทุกคน","correct":false,"why":".gitignore มีผลในเครื่องทันทีโดยไม่ต้อง push การที่ .env ยังขึ้น modified เกิดจากไฟล์ถูก track อยู่แล้ว ไม่เกี่ยวกับ remote"}],"explanation":"Git ตัดสินจากสถานะ tracked หรือ untracked ไฟล์ที่ถูก commit ไปแล้วจะยังถูกติดตามต่อ แม้เพิ่มชื่อลง .gitignore ภายหลัง ต้อง git rm --cached เพื่อเลิกติดตาม และอย่าลืมว่าค่าลับที่เคย commit แล้วยังอยู่ในประวัติ จึงควรเปลี่ยนรหัสหรือ key ที่หลุดไปด้วย"},{"id":"ENG-J-P-003","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J1","concept":"git-find-line-author-and-history","mobile":false,"type":"multiple","stem":"บั๊กยอดส่วนลดผิดเกิดจากบางบรรทัดในไฟล์ discount.ts คุณอยากรู้ว่าแต่ละบรรทัดถูกแก้ล่าสุดโดยใครใน commit ไหน และอยากไล่ดูการเปลี่ยนแปลงของไฟล์นี้ย้อนหลังพร้อมเนื้อหาที่เปลี่ยน คำสั่งใดช่วยได้บ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"git status discount.ts เพื่อดูรายการ commit ที่เคยแก้ไฟล์นี้","correct":false,"why":"git status แสดงสถานะปัจจุบันของ working directory และ staging area ไม่ได้แสดงประวัติ commit"},{"id":"B","text":"git blame discount.ts เพื่อดูว่าแต่ละบรรทัดถูกแก้ล่าสุดโดยใครใน commit ใด","correct":true,"why":"ถูกต้อง git blame แสดงผู้แก้และ commit ล่าสุดของทุกบรรทัดในไฟล์"},{"id":"C","text":"git diff เพื่อดูว่าใครเป็นคนแก้ไฟล์นี้ในอดีต","correct":false,"why":"git diff ที่ไม่ระบุ commit เทียบแค่การแก้ที่ยังไม่ได้ commit ไม่มีข้อมูลผู้แก้ในอดีต"},{"id":"D","text":"git log -p -- discount.ts เพื่อดูประวัติ commit ของไฟล์นี้พร้อมส่วนที่เปลี่ยนในแต่ละครั้ง","correct":true,"why":"ถูกต้อง git log -p กับ path ของไฟล์แสดงรายการ commit ที่แตะไฟล์นั้น พร้อม diff ของแต่ละ commit"},{"id":"E","text":"git branch -a เพื่อหาว่า branch ไหนเคยแก้ไฟล์นี้","correct":false,"why":"git branch -a แค่แสดงรายชื่อ branch ทั้งในเครื่องและ remote ไม่บอกว่า branch ไหนแก้ไฟล์ไหน"}],"explanation":"งานสืบหาที่มาของบั๊กใช้ git blame เพื่อดูระดับบรรทัด และ git log -p -- \u003cpath> เพื่อดูประวัติระดับไฟล์ ทั้งสองบอกเฉพาะว่าใครแก้และแก้อะไร ไม่ใช่ใครผิด ควรอ่านข้อความ commit และ PR ที่เกี่ยวข้องต่อเพื่อเข้าใจเหตุผลของการแก้ก่อนสรุป"},{"id":"ENG-J-P-004","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J2","concept":"git-commit-practices","mobile":false,"type":"multiple","stem":"ทีมกำลังตกลงแนวปฏิบัติการ commit เพื่อให้ประวัติใน repository ย้อนดูและ revert เป็นส่วน ๆ ได้ง่าย ข้อใดเป็นแนวปฏิบัติที่เหมาะสมบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แยก commit ตามเรื่องที่แก้ เช่น การแก้สูตรภาษีแยกจากการจัดรูปแบบโค้ดของโมดูลอื่น","correct":true,"why":"ถูกต้อง commit ที่มีจุดประสงค์เดียวอ่านง่ายและ revert เฉพาะเรื่องได้โดยไม่กระทบงานอื่น"},{"id":"B","text":"รวมงานทั้งวันเป็น commit เดียวตอนเย็นพร้อมข้อความสั้น ๆ ว่า update เพื่อให้จำนวน commit น้อย","correct":false,"why":"commit ก้อนใหญ่ revert เฉพาะส่วนไม่ได้ และข้อความ update ไม่บอกว่าเปลี่ยนอะไรหรือเพราะอะไร ทำให้ git blame และ git log ใช้งานยาก"},{"id":"C","text":"เขียนข้อความ commit ให้บอกว่าเปลี่ยนอะไรและเพราะอะไร เช่น ปัดเศษ VAT เป็นสตางค์ตามเอกสารบัญชี","correct":true,"why":"ถูกต้อง ข้อความที่บอกเหตุผลช่วยให้คนที่มาอ่านทีหลังเข้าใจเจตนาของการแก้ไข"},{"id":"D","text":"ตรวจรายการไฟล์ที่ staged ก่อน commit ว่าไม่มีไฟล์ที่ไม่เกี่ยวข้องหรือค่าลับอย่างรหัสผ่านปนอยู่","correct":true,"why":"ถูกต้อง การตรวจก่อน commit ป้องกันไฟล์ขยะและข้อมูลลับหลุดเข้าประวัติ ซึ่งลบออกจากประวัติได้ยากหลังจาก push แล้ว"}],"explanation":"commit ที่ดีคือหน่วยงานเล็กที่ย้อนกลับได้ มีข้อความอธิบายเหตุผล และผ่านการตรวจรายการไฟล์ก่อนบันทึก ประวัติที่สะอาดช่วยให้ git blame, git revert และการ review ทำได้เร็วขึ้นจริงในทีม"},{"id":"ENG-J-P-005","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J2","concept":"git-merge-conflict-resolve-steps","mobile":false,"type":"single","stem":"คุณรัน git merge feature/export-invoice บน main แล้ว Git แจ้งว่ามี conflict ในไฟล์ tax.ts ซึ่งมีส่วนหนึ่งเป็นดังด้านล่าง ทีมยืนยันว่าอัตรา VAT ที่ถูกต้องคือ 0.07 แต่ฝั่ง feature ยังมีโค้ดส่วนอื่นในไฟล์เดียวกันที่ต้องเก็บไว้ ขั้นตอนต่อไปที่ถูกต้องคืออะไร","code":"\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\nconst VAT_RATE = 0.07;\n=======\nconst VAT_RATE = 0.1;\n>>>>>>> feature/export-invoice","codeLang":"text","options":[{"id":"A","text":"รัน git add tax.ts ทันทีเพื่อแจ้ง Git ว่ารับทราบ conflict แล้ว จากนั้น commit โดยยังไม่ได้แก้เนื้อหาในไฟล์","correct":false,"why":"การ add ไฟล์ที่ยังมีเครื่องหมาย conflict จะ commit เครื่องหมายเหล่านั้นเข้าไปในโค้ดจริง และทำให้โปรแกรม compile ไม่ผ่านหรือพฤติกรรมผิด"},{"id":"B","text":"เลือกไฟล์ tax.ts ฝั่ง main ทั้งไฟล์มาทับ (เช่น git checkout --ours) แล้ว add และ commit","correct":false,"why":"วิธีนี้ทิ้งโค้ดส่วนอื่นของฝั่ง feature ที่ต้องเก็บไว้ไปทั้งหมด ไม่ใช่เฉพาะบรรทัดที่ขัดแย้ง"},{"id":"C","text":"ลบ tax.ts ทิ้งแล้วดึงไฟล์จาก origin/main มาใหม่ทั้งไฟล์ เพื่อให้ไม่เหลือ conflict","correct":false,"why":"จะสูญเสียงานของฝั่ง feature ในไฟล์นี้ทั้งหมด และไม่ได้เป็นการ merge สองฝั่งเข้าด้วยกัน"},{"id":"D","text":"แก้ไฟล์ให้เหลือเนื้อหาที่ต้องการ ลบเครื่องหมาย \u003c\u003c\u003c\u003c\u003c\u003c\u003c, =======, >>>>>>> แล้ว git add tax.ts และ commit","correct":true,"why":"ถูกต้อง conflict ต้องถูกตัดสินด้วยคนว่าจะเก็บเนื้อหาส่วนไหน จากนั้น add เพื่อบอก Git ว่าไฟล์พร้อม แล้ว commit เพื่อจบการ merge"}],"explanation":"Git รวมสองฝั่งอัตโนมัติได้เมื่อแก้คนละบรรทัด แต่ถ้าแก้บรรทัดเดียวกันต้องให้คนเลือก ขั้นตอนคือแก้ไฟล์ให้เป็นเนื้อหาสุดท้ายที่ถูกต้อง ลบเครื่องหมาย conflict ครบ add แล้ว commit ก่อน push ควรรัน test หรือ build ในเครื่องอีกครั้ง และถามเจ้าของโค้ดอีกฝั่งหากไม่แน่ใจว่าควรเก็บค่าไหน"},{"id":"ENG-J-P-006","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J3","concept":"git-push-rejected-remote-ahead","mobile":false,"type":"single","stem":"คุณ commit งานในเครื่องเสร็จแล้วรัน git push origin main แต่ถูกปฏิเสธด้วยข้อความ ! [rejected] main -> main (non-fast-forward) ทั้งที่คุณมีสิทธิ์ push ปกติ จะจัดการอย่างไรจึงถูกต้อง","options":[{"id":"A","text":"ใช้ git push --force เพื่อให้ commit ของคุณแทนที่สิ่งที่อยู่บน remote ตอนนี้ แล้วแจ้งทีมให้ดึงใหม่","correct":false,"why":"การ force push จะเขียนทับ commit ของเพื่อนที่อยู่บน remote ทำให้งานของเขาหายจากประวัติ ไม่ควรใช้กับ branch ที่ใช้ร่วมกัน"},{"id":"B","text":"ดึง commit ใหม่จาก remote มารวมก่อน (git pull หรือ fetch แล้ว merge) แก้ conflict แล้ว push ใหม่","correct":true,"why":"ถูกต้อง remote มี commit ที่เครื่องคุณยังไม่มี ต้องรวมประวัติของสองฝั่งให้ต่อกันก่อนจึง push ได้"},{"id":"C","text":"รัน git commit --amend แล้ว push ซ้ำ เพราะ commit ล่าสุดของคุณอาจมีข้อมูลไม่ครบ","correct":false,"why":"การแก้ commit ล่าสุดไม่ได้นำ commit ใหม่ของเพื่อนจาก remote เข้ามา push จึงยังถูกปฏิเสธด้วยเหตุผลเดิม"},{"id":"D","text":"ลบ repository ในเครื่องแล้ว clone ใหม่จาก remote จากนั้นนำไฟล์ที่แก้ไว้มาวางทับ","correct":false,"why":"commit ในเครื่องที่ยังไม่ได้ push หายไปพร้อมโฟลเดอร์ และการวางไฟล์ทับอาจเขียนทับงานล่าสุดของเพื่อนโดยไม่รู้ตัว"}],"explanation":"ข้อความ non-fast-forward หมายความว่าประวัติของ remote ไปไกลกว่าในเครื่อง ต้อง fetch เพื่อเห็นงานใหม่ แล้ว merge ก่อน push ส่วน git pull รวมการ fetch กับการรวมประวัติไว้ด้วยกัน แต่ถ้าประวัติสองฝั่งแยกกันและยังไม่ได้ตั้งวิธีรวม Git อาจให้ระบุ --no-rebase หรือ --rebase ก่อน การ force push ควรสงวนไว้กับ branch ส่วนตัวของตนเองเท่านั้น"},{"id":"ENG-J-P-007","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J3","concept":"git-pr-too-large","mobile":false,"type":"single","stem":"คุณเป็น reviewer ได้รับ pull request ที่แก้ 60 ไฟล์ ซึ่งรวมการเปลี่ยนชื่อโฟลเดอร์ การอัปเกรดไลบรารี และฟีเจอร์คูปองใหม่ไว้ด้วยกัน CI ผ่านทั้งหมด การตอบสนองต่อ PR นี้แบบใดเหมาะสมที่สุด","options":[{"id":"A","text":"ขอให้ผู้เขียนแยกเป็น PR ย่อยที่มีจุดประสงค์เดียว เพื่อให้ review ละเอียดและ revert เฉพาะส่วนได้","correct":true,"why":"ถูกต้อง PR ที่เล็กและโฟกัสเรื่องเดียวทำให้ reviewer เห็นผลกระทบของแต่ละการเปลี่ยนแปลง และย้อนกลับเฉพาะส่วนที่มีปัญหาได้"},{"id":"B","text":"approve ได้เลย เพราะ CI ผ่านทั้งหมด ซึ่งแปลว่าโค้ดทุกส่วนผ่านการตรวจสอบครบแล้วและพร้อมใช้งานจริง","correct":false,"why":"CI ที่ผ่านบอกได้แค่ว่า build และ test ที่มีอยู่ผ่าน ไม่ครอบคลุมเรื่องตรรกะทางธุรกิจ ความอ่านง่าย หรือผลกระทบของการอัปเกรดไลบรารี"},{"id":"C","text":"review เฉพาะไฟล์ที่ตัวเองคุ้นเคย แล้ว approve โดยให้ผู้เขียนรับผิดชอบไฟล์ที่เหลือเอง","correct":false,"why":"การ approve หมายถึง reviewer ยืนยันทั้ง PR ส่วนที่ไม่ได้อ่านก็กลายเป็นส่วนที่ไม่มีใครตรวจ"},{"id":"D","text":"review เฉพาะไฟล์ test เพราะ test ที่ครอบคลุมเพียงพอย่อมสะท้อนความถูกต้องของโค้ดจริงแทนการอ่านโค้ด","correct":false,"why":"test อาจเขียนไม่ครบหรือผิดเจตนาได้ จึงต้องอ่านโค้ดหลักควบคู่กัน และ PR ขนาดนี้ก็ยังรวมหลายเรื่องที่ควรแยกกันอยู่ดี"}],"explanation":"PR ที่ใหญ่และรวมหลายเรื่องทำให้ code review มีคุณภาพต่ำลง เพราะ reviewer เหนื่อยและมองข้ามจุดสำคัญ แนวปฏิบัติในทีมคือหนึ่ง PR ต่อหนึ่งจุดประสงค์ ถ้าแยกไม่ได้ให้ผู้เขียนอธิบายลำดับการอ่านใน description เพื่อช่วย reviewer"},{"id":"ENG-J-P-008","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J4","concept":"git-flow-feature-branch-flow","mobile":false,"type":"single","stem":"ทีมใช้ Git Flow และคุณได้รับมอบหมายให้ทำฟีเจอร์ส่วนลดสำหรับสมาชิก ตอนนี้ branch develop มีงานล่าสุดของเพื่อนร่วมทีมอยู่ ควรเริ่มและส่งมอบงานฟีเจอร์นี้อย่างไรตาม Git Flow","options":[{"id":"A","text":"แตก feature/member-discount จาก main แล้ว merge กลับเข้า main เมื่อทำเสร็จ","correct":false,"why":"main ใน Git Flow เก็บโค้ดที่ปล่อยขึ้น production แล้ว ฟีเจอร์ที่ยังไม่ผ่านรอบ release ไม่ควรเข้า main โดยตรง"},{"id":"B","text":"ทำงานบน develop โดยตรงทุก commit จนเสร็จ แล้วค่อยแตก branch ตอนใกล้ปล่อย","correct":false,"why":"การ commit ลง develop ตรง ๆ ทำให้งานที่ยังไม่เสร็จของแต่ละคนปนกัน และ develop ไม่อยู่ในสภาพพร้อมปล่อยอีกต่อไป"},{"id":"C","text":"แตก feature/member-discount จาก release ที่เปิดอยู่ แล้ว merge กลับเข้า release เมื่อเสร็จ","correct":false,"why":"release branch ใน Git Flow ใช้เตรียมปล่อยและรับเฉพาะการแก้บั๊ก ไม่ใช่ที่รับฟีเจอร์ใหม่"},{"id":"D","text":"แตก feature/member-discount จาก develop แล้วเปิด PR กลับเข้า develop เมื่อทำเสร็จ","correct":true,"why":"ถูกต้อง ใน Git Flow ฟีเจอร์แตกจาก develop และกลับเข้า develop เพื่อรอรวมกับฟีเจอร์อื่นในรอบ release"}],"explanation":"Git Flow แบ่งบทบาท branch ชัดเจน main เก็บโค้ดที่ปล่อยแล้ว develop เป็นแนวรวมงานของรอบถัดไป feature แตกจาก develop และกลับเข้า develop ตามลำดับ การทำตามบทบาทนี้ทำให้ทุกคนรู้ว่าโค้ดบน branch ไหนพร้อมใช้แค่ไหน"},{"id":"ENG-J-P-009","level":"junior","pool":"practice","competency":"Git","descriptor":"GIT-J4","concept":"git-flow-hotfix-and-release-rules","mobile":false,"type":"multiple","stem":"ทีมใช้ Git Flow และพบบั๊กการคิดยอดชำระบน production ที่ต้องแก้ด่วนก่อนรอบ release ถัดไป โดยตอนนี้ยังไม่มี release branch ที่เปิดอยู่ ข้อใดสอดคล้องกับ Git Flow บ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แตก hotfix branch จาก develop เพราะ develop เป็นโค้ดที่ใหม่ที่สุด","correct":false,"why":"develop มีฟีเจอร์ที่ยังไม่ผ่านรอบ release อยู่ด้วย การแตก hotfix จากตรงนั้นจะพาโค้ดที่ยังไม่พร้อมขึ้น production ไปด้วย"},{"id":"B","text":"แตก hotfix branch จาก main เพราะ main ตรงกับโค้ดที่อยู่บน production","correct":true,"why":"ถูกต้อง การแก้ด่วนต้องเริ่มจากโค้ดที่ใช้งานจริงเพื่อให้การแก้กระทบเฉพาะบั๊กนั้น"},{"id":"C","text":"เมื่อแก้เสร็จ merge hotfix เข้าทั้ง main และ develop เพื่อให้การแก้ไขไม่หายไปในรอบถัดไป","correct":true,"why":"ถูกต้อง main รับการแก้เพื่อปล่อยทันที ส่วน develop รับด้วยเพื่อไม่ให้บั๊กเดิมกลับมาตอน release รอบหน้า"},{"id":"D","text":"merge hotfix เข้า main อย่างเดียว เพราะ develop จะได้รับการแก้ไขเองตอนปล่อยรอบหน้า","correct":false,"why":"develop ไม่ได้รับการแก้อัตโนมัติ ถ้าไม่ merge ลงไปบั๊กเดิมจะกลับมาเมื่อ merge release ใหม่"},{"id":"E","text":"release branch แตกจาก develop และรับเฉพาะการแก้บั๊กกับการเตรียมปล่อย ไม่เพิ่มฟีเจอร์ใหม่","correct":true,"why":"ถูกต้อง ช่วง release ใช้ทดสอบและเก็บรายละเอียด ส่วนฟีเจอร์ใหม่รอรอบถัดไป"}],"explanation":"หลักของ Git Flow คือ hotfix เริ่มจาก main แล้วกลับเข้าทั้ง main และ develop ส่วน release เริ่มจาก develop และรับเฉพาะการแก้เพื่อปล่อย สำหรับกรณีที่มี release branch เปิดอยู่ ต้นฉบับของ Git Flow ให้ merge hotfix เข้า release branch นั้นแทน develop เพราะ release จะถูก merge ลง develop ทีหลังอยู่แล้ว"},{"id":"ENG-J-P-010","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-null-comparison-is-null","mobile":false,"type":"single","stem":"ตาราง customers มีคอลัมน์ phone ซึ่งเป็น NULL เมื่อลูกค้ายังไม่กรอกเบอร์โทร ทีม CRM ต้องการรายชื่อลูกค้าที่ยังไม่มีเบอร์ คุณเขียน query ด้านล่างแล้วได้ผลลัพธ์ 0 แถว ทั้งที่มีลูกค้าไม่มีเบอร์อยู่จริง เงื่อนไขใดให้ผลถูกต้อง","code":"SELECT name FROM customers WHERE phone = NULL;","codeLang":"sql","options":[{"id":"A","text":"เปลี่ยนเป็น WHERE phone = '' เพื่อหาแถวที่ไม่มีค่า","correct":false,"why":"'' คือสตริงว่างซึ่งเป็นค่าหนึ่ง ไม่ใช่ NULL เงื่อนไขนี้จะได้เฉพาะแถวที่เก็บสตริงว่างไว้จริง ๆ"},{"id":"B","text":"เปลี่ยนเป็น WHERE phone IS NULL","correct":true,"why":"ถูกต้อง NULL แปลว่าไม่ทราบค่า ต้องตรวจด้วย IS NULL เพราะการเทียบด้วย = ได้ผลเป็น UNKNOWN เสมอ"},{"id":"C","text":"เปลี่ยนเป็น WHERE phone = 'NULL' โดยใส่เครื่องหมายคำพูดครอบ","correct":false,"why":"'NULL' เป็นสตริงตัวอักษรสี่ตัว ไม่ใช่ค่า NULL ของฐานข้อมูล จะตรงกับแถวที่พิมพ์คำว่า NULL ลงไปเท่านั้น"},{"id":"D","text":"เปลี่ยนเป็น WHERE phone LIKE NULL","correct":false,"why":"LIKE กับ NULL ก็ได้ผลเป็น UNKNOWN เช่นกัน ไม่มีแถวใดผ่านเงื่อนไข"}],"explanation":"ใน SQL ผลของการเทียบใด ๆ กับ NULL ด้วยตัวดำเนินการอย่าง = หรือ \u003c> คือ UNKNOWN และ WHERE เก็บเฉพาะแถวที่เงื่อนไขเป็นจริง จึงไม่ได้แถวเลย ต้องใช้ IS NULL หรือ IS NOT NULL และควรแยกความหมายของ NULL ออกจากสตริงว่างตั้งแต่ตอนออกแบบข้อมูล"},{"id":"ENG-J-P-011","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-having-vs-where-aggregate","mobile":false,"type":"single","stem":"ทีมวิเคราะห์ต้องการ customer_id ที่มีคำสั่งซื้อตั้งแต่ 3 รายการขึ้นไป แต่ query ด้านล่างรันไม่ผ่านและฐานข้อมูลแจ้ง error ควรแก้อย่างไรจึงถูกต้อง","code":"SELECT customer_id, COUNT(*) AS order_count\nFROM orders\nWHERE COUNT(*) >= 3\nGROUP BY customer_id;","codeLang":"sql","options":[{"id":"A","text":"เปลี่ยน WHERE เป็น ON เพราะเงื่อนไขที่เกี่ยวกับการนับต้องเขียนใน ON","correct":false,"why":"ON ใช้กำหนดเงื่อนไขการเชื่อมตารางใน JOIN ไม่ใช่ที่กรองผลการรวมกลุ่ม และ query นี้ก็ไม่ได้มี JOIN"},{"id":"B","text":"เพิ่ม DISTINCT หน้า customer_id เพื่อให้ COUNT(*) คำนวณก่อนถูกกรอง","correct":false,"why":"DISTINCT ตัดแถวซ้ำของผลลัพธ์ ไม่ได้เปลี่ยนลำดับขั้นตอนการประมวลผล WHERE ยังทำงานก่อนการรวมกลุ่มเหมือนเดิม"},{"id":"C","text":"ย้ายเงื่อนไข COUNT(*) >= 3 ไปไว้ใน HAVING ต่อจาก GROUP BY","correct":true,"why":"ถูกต้อง WHERE กรองแถวก่อนรวมกลุ่ม จึงใช้ aggregate function ไม่ได้ ส่วน HAVING กรองกลุ่มหลังรวมแล้ว"},{"id":"D","text":"เปลี่ยน COUNT(*) ใน WHERE เป็น COUNT(customer_id) เพราะ COUNT(*) นำมากรองแถวไม่ได้","correct":false,"why":"ปัญหาคือ aggregate function ทุกตัวใช้ใน WHERE ไม่ได้ ไม่ว่าจะนับด้วย * หรือด้วยชื่อคอลัมน์"}],"explanation":"ลำดับการประมวลผลคือ FROM, WHERE, GROUP BY, HAVING แล้วจึง SELECT เงื่อนไขที่อ้างผลรวมกลุ่ม เช่น COUNT หรือ SUM ต้องอยู่ใน HAVING ส่วนเงื่อนไขของแต่ละแถวควรอยู่ใน WHERE เพราะกรองก่อนรวมกลุ่มทำให้ประมวลผลข้อมูลน้อยลง"},{"id":"ENG-J-P-012","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-primary-key-surrogate-choice","mobile":false,"type":"single","stem":"ทีมกำลังออกแบบตาราง customers ของระบบสมาชิกร้านค้าออนไลน์ มีข้อมูลเลขบัตรประชาชน อีเมล ชื่อ-นามสกุล และเบอร์โทร ควรเลือกอะไรเป็น primary key ที่ตารางอื่น เช่น orders จะอ้างอิงผ่าน foreign key","options":[{"id":"A","text":"คอลัมน์ id ตัวเลขที่ระบบสร้างให้ ซึ่งไม่ซ้ำและไม่ผูกกับข้อมูลส่วนบุคคล","correct":true,"why":"ถูกต้อง surrogate key ไม่ซ้ำ ไม่เปลี่ยนค่า และไม่ทำให้ข้อมูลส่วนบุคคลกระจายไปทุกตารางที่อ้างถึง"},{"id":"B","text":"เลขบัตรประชาชน เพราะแต่ละคนมีเลขของตัวเองและมีอยู่ในข้อมูลแล้ว","correct":false,"why":"เลขบัตรเป็นข้อมูลส่วนบุคคลที่อ่อนไหวตาม PDPA การใช้เป็น key ทำให้ค่านี้ไปปรากฏในทุกตารางที่อ้างถึง และลูกค้าบางรายก็อาจไม่มีเลขนี้"},{"id":"C","text":"อีเมล เพราะลูกค้าแต่ละคนมีอีเมลของตัวเองและอ่านค่าเข้าใจง่ายกว่าตัวเลข","correct":false,"why":"อีเมลเปลี่ยนได้ เมื่อลูกค้าเปลี่ยนอีเมลต้องไล่แก้ค่าในทุกตารางที่อ้างถึง key นี้ด้วย"},{"id":"D","text":"ชื่อ-นามสกุล เพราะอ่านง่ายเมื่อดูข้อมูลในตารางอื่นที่อ้างอิงถึง","correct":false,"why":"คนสองคนชื่อและนามสกุลเหมือนกันได้ จึงไม่ซ้ำกันจริงและใช้เป็น primary key ไม่ได้"}],"explanation":"primary key ที่ดีต้องไม่ซ้ำ ไม่เป็น NULL และไม่ควรเปลี่ยนค่า การใช้คอลัมน์ id ที่ระบบสร้างให้ตอบโจทย์ทั้งสามข้อและเลี่ยงการกระจายข้อมูลส่วนบุคคลไปทั่วฐานข้อมูล ส่วนอีเมลหรือเลขบัตรที่ต้องไม่ซ้ำควรกำหนดเป็น unique constraint แยกต่างหาก"},{"id":"ENG-J-P-013","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-order-by-needed-for-order","mobile":false,"type":"single","stem":"หน้า dashboard แสดงสินค้าตามลำดับที่ได้จาก query ด้านล่าง ผู้ทดสอบพบว่าลำดับบน staging ไม่เหมือนบน production และบางครั้งลำดับสลับไปหลังมีการอัปเดตข้อมูล สาเหตุที่ตรงที่สุดคืออะไร","code":"SELECT id, name, created_at\nFROM products\nWHERE is_active = TRUE;","codeLang":"sql","options":[{"id":"A","text":"ฐานข้อมูลเรียงผลลัพธ์ตาม primary key ให้อยู่แล้วเสมอ ปัญหาจึงอยู่ที่โค้ดฝั่งแอป","correct":false,"why":"ถ้าไม่ระบุ ORDER BY ฐานข้อมูลไม่รับประกันลำดับ แม้บางครั้งผลจะดูเรียงตาม key ก็เป็นผลจากแผนการอ่านข้อมูลที่เปลี่ยนได้"},{"id":"B","text":"ต้องสร้าง index บนคอลัมน์ created_at ก่อน ฐานข้อมูลจึงจะคืนข้อมูลตามลำดับเวลา","correct":false,"why":"index ช่วยให้เรียงเร็วขึ้น แต่ไม่ได้บังคับลำดับของผลลัพธ์ที่ไม่ได้สั่งเรียง"},{"id":"C","text":"เวลาของเซิร์ฟเวอร์ staging กับ production ไม่ตรงกัน ข้อมูลจึงเรียงต่างกัน","correct":false,"why":"เวลาของเซิร์ฟเวอร์ไม่มีผลกับลำดับแถวของ query นี้ ซึ่งไม่ได้อ้างอิงเวลาปัจจุบันเลย"},{"id":"D","text":"ไม่มี ORDER BY ลำดับแถวจึงไม่รับประกัน ต้องระบุ เช่น ORDER BY created_at DESC, id DESC","correct":true,"why":"ถูกต้อง ลำดับของผลลัพธ์รับประกันได้ด้วย ORDER BY เท่านั้น และควรเพิ่มคอลัมน์ id ท้ายสุดเพื่อให้ลำดับของแถวที่เวลาเท่ากันคงที่"}],"explanation":"ตารางในฐานข้อมูลเชิงสัมพันธ์ไม่มีลำดับแถวที่แน่นอน ผลที่ออกมาขึ้นกับแผนการอ่านข้อมูล index ที่ถูกใช้ และการอัปเดตที่เกิดขึ้น ดังนั้นทุก query ที่ผลต้องเรียงอย่างคงที่ต้องมี ORDER BY และควรมีคอลัมน์ที่ไม่ซ้ำเป็นตัวตัดสินท้ายสุด"},{"id":"ENG-J-P-014","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-count-column-skips-null","mobile":false,"type":"single","stem":"ตาราง orders มีคอลัมน์ coupon_code ซึ่งเป็น NULL เมื่อออเดอร์นั้นไม่ได้ใช้คูปอง และคูปองรหัสเดียวกันถูกใช้ได้หลายออเดอร์ ทีมการตลาดต้องการจำนวนออเดอร์ที่ใช้คูปอง query ใดให้ค่าที่ต้องการ","options":[{"id":"A","text":"SELECT COUNT(*) FROM orders;","correct":false,"why":"COUNT(*) นับทุกแถวของ orders รวมออเดอร์ที่ไม่ได้ใช้คูปองด้วย"},{"id":"B","text":"SELECT COUNT(coupon_code) FROM orders;","correct":true,"why":"ถูกต้อง COUNT(คอลัมน์) นับเฉพาะแถวที่ค่าในคอลัมน์นั้นไม่เป็น NULL ซึ่งก็คือออเดอร์ที่ใช้คูปอง"},{"id":"C","text":"SELECT COUNT(DISTINCT coupon_code) FROM orders;","correct":false,"why":"ได้จำนวนรหัสคูปองที่ไม่ซ้ำกัน ไม่ใช่จำนวนออเดอร์ และจะน้อยกว่าจริงเมื่อรหัสเดียวกันถูกใช้หลายออเดอร์"},{"id":"D","text":"SELECT COUNT(customer_id) FROM orders;","correct":false,"why":"ได้จำนวนออเดอร์ที่มี customer_id ไม่เป็น NULL ซึ่งไม่เกี่ยวกับการใช้คูปอง"}],"explanation":"COUNT(*) นับแถว ส่วน COUNT(คอลัมน์) ข้ามค่า NULL และ COUNT(DISTINCT คอลัมน์) นับเฉพาะค่าที่ไม่ซ้ำ จึงต้องเลือกให้ตรงกับสิ่งที่ธุรกิจถามจริง ๆ ว่านับแถว นับออเดอร์ที่มีค่า หรือนับค่าที่แตกต่างกัน"},{"id":"ENG-J-P-015","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-redundancy-anomalies","mobile":false,"type":"multiple","stem":"ตาราง orders ด้านล่างเก็บชื่อและเบอร์โทรของลูกค้าซ้ำในทุกแถวของออเดอร์ที่ลูกค้าคนนั้นสั่ง การออกแบบแบบนี้อาจก่อปัญหาใดได้บ้าง (เลือกทุกข้อที่ถูก)","code":"orders(order_id PK, customer_name, customer_phone, product, qty)","codeLang":"text","options":[{"id":"A","text":"ลูกค้าเปลี่ยนเบอร์โทร ต้องแก้ทุกแถวของลูกค้าคนนั้น ถ้าแก้ไม่ครบ ข้อมูลของคนเดียวกันจะขัดแย้งกัน","correct":true,"why":"ถูกต้อง ข้อมูลเดียวกันถูกเก็บหลายที่ จึงเสี่ยงที่บางแถวถูกแก้แต่บางแถวไม่ถูกแก้ (update anomaly)"},{"id":"B","text":"ลบออเดอร์สุดท้ายของลูกค้าแล้ว ข้อมูลติดต่อของลูกค้าคนนั้นหายไปด้วย","correct":true,"why":"ถูกต้อง เพราะข้อมูลลูกค้าอยู่ในแถวของออเดอร์ การลบแถวสุดท้ายจึงลบข้อมูลลูกค้าไปด้วย (delete anomaly)"},{"id":"C","text":"บันทึกลูกค้าที่เพิ่งสมัครและยังไม่เคยสั่งซื้อไม่ได้ นอกจากสร้างแถวออเดอร์เปล่า ๆ ขึ้นมา","correct":true,"why":"ถูกต้อง ข้อมูลลูกค้าไม่มีที่อยู่ของตัวเอง จึงต้องพึ่งแถวออเดอร์ (insert anomaly)"},{"id":"D","text":"เมื่อกำหนด order_id เป็น primary key แล้ว ฐานข้อมูลจะป้องกันไม่ให้ข้อมูลลูกค้าถูกบันทึกซ้ำหลายแถวเอง","correct":false,"why":"primary key ป้องกันได้แค่ order_id ซ้ำ ไม่ได้ควบคุมความซ้ำซ้อนของข้อมูลลูกค้าในคอลัมน์อื่น"}],"explanation":"การเก็บข้อมูลของสิ่งหนึ่งซ้ำในหลายแถวทำให้เกิด update, delete และ insert anomaly การทำ normalization คือแยกลูกค้าไปไว้ในตาราง customers แล้วให้ orders อ้างอิงด้วย customer_id ทำให้แก้ข้อมูลลูกค้าที่เดียวและลบออเดอร์ได้โดยข้อมูลลูกค้ายังอยู่"},{"id":"ENG-J-P-016","level":"junior","pool":"practice","competency":"SQL","descriptor":"SQL-J1","concept":"sql-inner-join-semantics","mobile":false,"type":"multiple","stem":"ทีมใช้ query ด้านล่างเพื่อดึงชื่อลูกค้าและยอดของแต่ละออเดอร์ ข้อใดอธิบายผลลัพธ์ของ INNER JOIN แบบนี้ได้ถูกต้องบ้าง (เลือกทุกข้อที่ถูก)","code":"SELECT c.name, o.total\nFROM customers c\nINNER JOIN orders o ON o.customer_id = c.id;","codeLang":"sql","options":[{"id":"A","text":"คืนทุกแถวของ customers แม้ลูกค้าไม่มีออเดอร์ โดยช่อง total ของลูกค้านั้นเป็น NULL","correct":false,"why":"พฤติกรรมนี้เป็นของ LEFT JOIN ส่วน INNER JOIN ตัดแถวที่ไม่มีคู่ออกจากผลลัพธ์"},{"id":"B","text":"คืนเฉพาะแถวที่เงื่อนไขหลัง ON เป็นจริง ลูกค้าที่ไม่เคยสั่งซื้อจึงไม่ปรากฏในผล","correct":true,"why":"ถูกต้อง INNER JOIN เก็บเฉพาะคู่แถวที่ตรงเงื่อนไข ลูกค้าที่ไม่มีออเดอร์ไม่มีคู่ จึงถูกตัดออก"},{"id":"C","text":"คอลัมน์ที่ใช้เชื่อมต้องมีชื่อเหมือนกันในทั้งสองตารางจึงจะ join ได้","correct":false,"why":"เงื่อนไข ON ระบุคอลัมน์ได้อิสระ เช่น o.customer_id กับ c.id ที่ชื่อต่างกันก็เชื่อมกันได้"},{"id":"D","text":"ผลลัพธ์ถูกเรียงตามคอลัมน์ที่ใช้เชื่อมโดยอัตโนมัติ","correct":false,"why":"การเรียงผลลัพธ์ต้องใช้ ORDER BY เท่านั้น JOIN ไม่รับประกันลำดับของแถว"},{"id":"E","text":"ถ้าลูกค้า 1 คนมี 3 ออเดอร์ ชื่อลูกค้าคนนั้นจะปรากฏ 3 แถวในผลลัพธ์","correct":true,"why":"ถูกต้อง ทุกคู่แถวที่ตรงเงื่อนไขกลายเป็นหนึ่งแถวในผลลัพธ์ ความสัมพันธ์แบบหนึ่งต่อหลายจึงทำให้ฝั่งหนึ่งซ้ำ"}],"explanation":"INNER JOIN สร้างแถวผลลัพธ์จากทุกคู่แถวที่ตรงเงื่อนไข ON ผลคือแถวที่ไม่มีคู่หายไป และแถวฝั่ง \"หนึ่ง\" ซ้ำตามจำนวนแถวฝั่ง \"หลาย\" ถ้าต้องการให้ลูกค้าที่ไม่มีออเดอร์ยังอยู่ในผลต้องใช้ LEFT JOIN และถ้าต้องการลำดับต้องใส่ ORDER BY"},{"id":"ENG-J-P-017","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J1","concept":"oop-class-vs-object-instances","mobile":false,"type":"single","stem":"จากโค้ดด้านล่าง ข้อใดอธิบายความสัมพันธ์ระหว่าง Customer กับตัวแปร a และ b ได้ถูกต้อง","code":"class Customer {\n  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n}\n\nconst a = new Customer(\"สมชาย\");\nconst b = new Customer(\"มาลี\");\na.name = \"สมศักดิ์\";\nconsole.log(b.name);","codeLang":"typescript","options":[{"id":"A","text":"a และ b ใช้ค่า name ร่วมกัน เพราะสร้างจาก class เดียวกัน การแก้ a.name จึงทำให้ b.name เปลี่ยนตามด้วย","correct":false,"why":"แต่ละ object มี attribute เป็นของตัวเอง การแก้ a.name ไม่กระทบ b.name โค้ดนี้จึงพิมพ์ มาลี"},{"id":"B","text":"การเขียน new Customer(...) ซ้ำจะได้ object ตัวเดิมกลับมา a กับ b จึงชี้ไปที่ object เดียวกัน","correct":false,"why":"ทุกครั้งที่ใช้ new จะสร้าง object ใหม่ที่แยกกัน จึงได้ a และ b เป็นคนละตัว"},{"id":"C","text":"Customer เป็นแม่แบบ (class) ส่วน a และ b เป็น object แยกกันสองตัวที่แต่ละตัวมีค่า name ของตัวเอง","correct":true,"why":"ถูกต้อง class กำหนดโครงสร้างและพฤติกรรม ส่วน object แต่ละตัวเก็บค่าข้อมูลของตัวเอง"},{"id":"D","text":"a และ b เป็น class ใหม่ที่ได้จาก Customer จึงมีค่า name ต่างกันได้","correct":false,"why":"a และ b เป็น object (instance) ไม่ใช่ class การสร้าง class ใหม่จากของเดิมต้องใช้ extends"}],"explanation":"class คือแม่แบบที่ระบุว่า object จะมี attribute และ method อะไรบ้าง ส่วน object คือสิ่งที่ถูกสร้างจากแม่แบบนั้นด้วย new โดยแต่ละตัวเก็บสถานะของตัวเอง ความเข้าใจนี้เป็นฐานของทุกเรื่องใน OOP เช่น การที่ลูกค้าสองคนในระบบมีข้อมูลต่างกันได้แม้ใช้ class เดียวกัน"},{"id":"ENG-J-P-018","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J1","concept":"oop-this-keyword-attribute-access","mobile":false,"type":"single","stem":"รันโค้ดด้านล่างแล้วเกิด error ว่าหาตัวแปรชื่อ balance ไม่พบในบรรทัดภายใน deposit ทั้งที่ประกาศ balance ไว้ใน class แล้ว สาเหตุและวิธีแก้ที่ถูกต้องคืออะไร","code":"class Wallet {\n  balance: number = 0;\n\n  deposit(amount: number): void {\n    balance = balance + amount;\n  }\n}\n\nconst w = new Wallet();\nw.deposit(100);","codeLang":"typescript","options":[{"id":"A","text":"balance เป็น attribute ของ object ต้องอ้างเป็น this.balance ภายใน method","correct":true,"why":"ถูกต้อง ภายใน method ต้องใช้ this เพื่อระบุว่าเป็นค่าของ object ตัวที่ถูกเรียกใช้ method"},{"id":"B","text":"ต้องประกาศ let balance ใหม่ภายใน deposit ก่อนใช้ ค่าจะถูกเก็บลง object ให้เอง","correct":false,"why":"let สร้างตัวแปรชั่วคราวเฉพาะภายใน method ไม่ได้เปลี่ยน attribute ของ object และตัวแปรชั่วคราวหายไปเมื่อ method จบ"},{"id":"C","text":"balance ต้องเป็น static จึงจะเข้าถึงจากภายใน method ได้โดยใช้ชื่อลอย ๆ","correct":false,"why":"static เป็นของ class ไม่ใช่ของแต่ละ object และต้องอ้างผ่านชื่อ class เช่น Wallet.balance ไม่ได้ทำให้ใช้ชื่อลอย ๆ ได้"},{"id":"D","text":"deposit ต้องมี return balance ตอนท้าย เพื่อให้ตัวแปรนี้ถูกส่งออกมาใช้ภายใน method","correct":false,"why":"return ส่งค่าออกจาก method หลังคำนวณเสร็จ ไม่ได้ทำให้ชื่อ balance มองเห็นได้ภายใน method"}],"explanation":"attribute ของ object ไม่ใช่ตัวแปรทั่วไปในขอบเขตของ method ต้องเข้าถึงผ่าน this ซึ่งชี้ไปยัง object ที่กำลังเรียก method อยู่ เมื่อมีลูกค้าสองคนที่มี Wallet คนละใบ this.balance ของแต่ละใบจึงแยกกันอย่างถูกต้อง"},{"id":"ENG-J-P-019","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J2","concept":"oop-constructor-required-fields","mobile":false,"type":"single","stem":"ร้านค้าออนไลน์ต้องการให้ object ของ Product ทุกตัวมีชื่อและราคาตั้งแต่ถูกสร้าง เพื่อไม่ให้มีสินค้าที่ยังไม่มีราคาหลุดไปใช้งาน ควรออกแบบ class อย่างไร","options":[{"id":"A","text":"กำหนด price = 0 เป็นค่าเริ่มต้นของทุกสินค้า แล้วให้ผู้ใช้ตั้งราคาจริงทีหลัง","correct":false,"why":"สินค้าที่ลืมตั้งราคาจะมีราคา 0 ซึ่งดูเหมือนข้อมูลถูกต้อง และอาจถูกขายฟรีโดยไม่มีใครรู้"},{"id":"B","text":"สร้าง method setPrice แล้วให้ผู้ใช้ class เรียกต่อจาก new Product ทุกครั้ง","correct":false,"why":"ขึ้นกับว่าผู้เรียกจะจำเรียกครบหรือไม่ จึงยังมี object ที่อยู่ในสถานะไม่สมบูรณ์ได้ช่วงหนึ่ง"},{"id":"C","text":"เก็บ name และ price เป็น static attribute ของ class เพื่อให้ทุกที่เข้าถึงได้","correct":false,"why":"static มีค่าเดียวร่วมกันทั้ง class สินค้าทุกชิ้นจะมีชื่อและราคาเหมือนกัน"},{"id":"D","text":"รับ name และ price ผ่าน constructor แล้วกำหนดให้ attribute ตั้งแต่ตอนสร้าง object","correct":true,"why":"ถูกต้อง constructor บังคับให้ผู้สร้างต้องส่งค่าที่จำเป็นมา object จึงมีข้อมูลครบตั้งแต่ถูกสร้าง"}],"explanation":"constructor คือจุดที่ใช้ทำให้ object อยู่ในสถานะที่ถูกต้องตั้งแต่เกิด ข้อมูลที่ขาดไม่ได้ควรเป็นพารามิเตอร์ของ constructor แทนการให้ผู้ใช้ตั้งทีหลัง ซึ่งช่วยลดบั๊กจากการลืมตั้งค่า"},{"id":"ENG-J-P-020","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J2","concept":"oop-static-counter","mobile":false,"type":"single","stem":"ระบบต้องออกเลขที่ออเดอร์ให้ต่อเนื่อง 1, 2, 3 ไปเรื่อย ๆ สำหรับ Order ทุกตัวที่ถูกสร้างขึ้นในโปรแกรม โดยให้ class ออกเลขเอง ควรเก็บตัวนับไว้ที่ไหน","options":[{"id":"A","text":"เป็น attribute ของ object ที่เริ่มที่ 0 แล้วเพิ่มค่าใน constructor","correct":false,"why":"แต่ละ Order มีตัวนับของตัวเอง ซึ่งเริ่มที่ 0 ใหม่ทุกครั้ง ทุกออเดอร์จึงได้เลข 1 เหมือนกัน"},{"id":"B","text":"เป็น static attribute ของ class Order แล้วเพิ่มค่าใน constructor","correct":true,"why":"ถูกต้อง static attribute มีเพียงชุดเดียวต่อ class ทุกครั้งที่สร้าง object ใหม่จึงนับต่อจากค่าเดิม"},{"id":"C","text":"เป็นตัวแปร let count = 0 ภายใน constructor แล้วเพิ่มค่า","correct":false,"why":"ตัวแปรภายใน constructor ถูกสร้างใหม่ทุกครั้งที่เรียก และหายไปเมื่อจบการทำงาน จึงนับต่อไม่ได้"},{"id":"D","text":"ให้ constructor อ่านค่า this.id ของ object ที่เพิ่งสร้างแล้วบวก 1","correct":false,"why":"object ที่เพิ่งสร้างยังไม่มี id จึงได้ค่าที่ไม่ใช่ตัวเลข และไม่มีข้อมูลของออเดอร์ก่อนหน้าให้นับต่อ"}],"explanation":"attribute ของ instance เป็นของ object แต่ละตัว ส่วน static เป็นของ class และมีชุดเดียวที่ทุก object ใช้ร่วมกัน เลขลำดับ ตัวนับจำนวน object หรือค่าคงที่ของ class จึงเหมาะกับ static แต่ควรระวังเรื่องการเข้าถึงพร้อมกันหากโปรแกรมมีหลาย thread หรือหลายเครื่อง เพราะตัวนับในหน่วยความจำไม่ใช่ที่ออกเลขที่เหมาะกับระบบจริงแบบกระจาย"},{"id":"ENG-J-P-021","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J3","concept":"oop-private-balance-rules","mobile":false,"type":"single","stem":"โค้ดหลายจุดในระบบตั้งค่า balance ของบัญชีโดยตรง ทำให้เคยเกิดบัญชีที่ยอดติดลบ ทั้งที่กติกากำหนดว่ายอดเงินห้ามติดลบ ควรปรับ class BankAccount อย่างไร","code":"class BankAccount {\n  balance: number = 0;\n}\n\nconst acc = new BankAccount();\nacc.balance = -500;","codeLang":"typescript","options":[{"id":"A","text":"เพิ่มคอมเมนต์ใน class เตือนว่าห้ามตั้ง balance เป็นค่าติดลบ แล้วแจ้งทีมให้ระวัง","correct":false,"why":"คอมเมนต์ไม่ได้ป้องกันอะไร โค้ดที่เขียนผิดยังคอมไพล์และรันผ่านได้เหมือนเดิม"},{"id":"B","text":"เพิ่ม getBalance() และ setBalance() ที่อ่านและกำหนดค่าตรง ๆ โดยยังเปิด balance ให้เข้าถึงได้เหมือนเดิม","correct":false,"why":"ถ้า setBalance ไม่ตรวจเงื่อนไข และ balance ยังเข้าถึงตรงได้ ก็ไม่ได้ช่วยบังคับกติกาใด ๆ"},{"id":"C","text":"ทำ balance เป็น private แล้วให้เปลี่ยนค่าผ่าน method เช่น deposit และ withdraw ที่ตรวจเงื่อนไขก่อน","correct":true,"why":"ถูกต้อง การปิดการเข้าถึงตรงและเปิดทางเฉพาะ method ที่ตรวจกติกา ทำให้กติกาถูกบังคับใช้ที่จุดเดียว"},{"id":"D","text":"ทำ balance เป็น static เพื่อให้มีค่าเดียวที่ตรวจสอบได้ง่ายทั้งโปรแกรม","correct":false,"why":"static ทำให้ทุกบัญชีใช้ยอดเงินเดียวกัน ซึ่งผิดความหมาย และยังเขียนค่าติดลบได้เหมือนเดิม"}],"explanation":"encapsulation คือการรวมข้อมูลและกติกาที่ควบคุมข้อมูลนั้นไว้ใน class เดียว โดยซ่อนข้อมูลภายในและเปิดเฉพาะ method ที่ตรวจเงื่อนไขก่อนเปลี่ยนค่า getter และ setter ที่ทำแค่อ่านหรือเขียนตรง ๆ ไม่ได้เพิ่มความปลอดภัยให้ข้อมูลเลย"},{"id":"ENG-J-P-022","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J3","concept":"oop-encapsulation-benefits-change-internals","mobile":false,"type":"multiple","stem":"ทีมต้องการเปลี่ยนวิธีเก็บราคาใน class Product จากตัวเลขหน่วยบาทเป็นจำนวนเต็มหน่วยสตางค์ภายใน class โดยโค้ดส่วนอื่นอ่านราคาผ่าน method getPriceBaht() และตัวเก็บค่าเป็น private อยู่แล้ว ข้อใดเป็นประโยชน์ที่ได้จากการซ่อนข้อมูลภายใน class บ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"โค้ดส่วนอื่นที่เรียก getPriceBaht() ยังทำงานได้เหมือนเดิม เพราะเปลี่ยนเฉพาะวิธีเก็บค่าภายใน class","correct":true,"why":"ถูกต้อง ผู้เรียกผูกกับ method ที่เป็นสัญญาของ class ไม่ได้ผูกกับวิธีเก็บข้อมูลข้างใน"},{"id":"B","text":"ค่าราคาที่เก็บใน private field ถูกเข้ารหัสไว้ ผู้ใช้เปิดดูค่าจากภายนอกโปรแกรมไม่ได้","correct":false,"why":"private คือกติกาการเข้าถึงในระดับภาษา ไม่ได้เข้ารหัสข้อมูล ค่าใน memory หรือใน JavaScript ที่ส่งถึงเบราว์เซอร์ยังถูกอ่านได้"},{"id":"C","text":"กติกา เช่น ราคาห้ามติดลบ ตรวจที่ method ของ class แห่งเดียว แล้วมีผลกับทุกจุดที่เรียกใช้","correct":true,"why":"ถูกต้อง เมื่อการเปลี่ยนค่าต้องผ่าน method ที่ตรวจเงื่อนไข ทุกผู้เรียกจึงอยู่ภายใต้กติกาเดียวกัน"},{"id":"D","text":"โปรแกรมทำงานเร็วขึ้น เพราะการเรียก method ถูกปรับให้เร็วกว่าการอ่านตัวแปรตรง ๆ","correct":false,"why":"การซ่อนข้อมูลเป็นเรื่องการออกแบบ ไม่ได้ทำให้โปรแกรมเร็วขึ้น และการเรียก method ไม่ได้เร็วกว่าการอ่านตัวแปรโดยตรง"},{"id":"E","text":"ภายนอกอ่านราคาได้เท่าที่ class เปิดให้ แต่แก้ค่าตรง ๆ ไม่ได้ ค่าจึงเปลี่ยนผ่านกติกาของ class เท่านั้น","correct":true,"why":"ถูกต้อง class ควบคุมว่าจะเปิดอะไรให้ภายนอกอ่านหรือเขียนได้ และสถานะภายในจึงเปลี่ยนตามกติกาที่ตั้งไว้"}],"explanation":"ประโยชน์หลักของ encapsulation คือแยกสัญญาที่เปิดต่อภายนอก (method) ออกจากรายละเอียดภายใน ทำให้เปลี่ยนวิธีเก็บข้อมูลได้โดยไม่กระทบผู้เรียก และรวมกติกาไว้ที่เดียว แต่ไม่ใช่กลไกความปลอดภัยของข้อมูล ข้อมูลลับต้องป้องกันด้วยการเข้ารหัสและสิทธิ์การเข้าถึงที่ถูกต้อง"},{"id":"ENG-J-P-023","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J4","concept":"oop-inheritance-is-a-relationship","mobile":false,"type":"multiple","stem":"ทีมกำลังออกแบบ class ของระบบร้านค้าออนไลน์ ข้อใดเป็นการใช้ extends ที่เหมาะสมบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Engine extends Car เพราะเครื่องยนต์เป็นส่วนสำคัญที่สุดของรถ","correct":false,"why":"เครื่องยนต์เป็นส่วนประกอบของรถ ไม่ใช่รถชนิดหนึ่ง ความสัมพันธ์แบบมีเป็นส่วนประกอบควรเก็บเป็น attribute ไม่ใช่ inheritance"},{"id":"B","text":"SavingsAccount extends BankAccount เพราะบัญชีออมทรัพย์คือบัญชีธนาคารประเภทหนึ่ง","correct":true,"why":"ถูกต้อง บัญชีออมทรัพย์เป็นบัญชีธนาคารชนิดหนึ่งจริง และสืบทอดพฤติกรรมพื้นฐานร่วมกันได้อย่างสมเหตุสมผล"},{"id":"C","text":"Order extends Customer เพราะออเดอร์ต้องใช้ชื่อและเบอร์โทรของลูกค้า","correct":false,"why":"ออเดอร์ไม่ใช่ลูกค้าชนิดหนึ่ง ควรให้ Order อ้างถึง Customer เป็น attribute แทนการสืบทอด"},{"id":"D","text":"SmsNotification extends Notification เพราะ SMS คือการแจ้งเตือนรูปแบบหนึ่งที่ใช้ส่วนร่วมของการแจ้งเตือน","correct":true,"why":"ถูกต้อง SMS เป็นการแจ้งเตือนชนิดหนึ่งจริง จึงใช้ส่วนที่เหมือนกันจากคลาสแม่และเพิ่มส่วนเฉพาะของตัวเองได้"}],"explanation":"ใช้ inheritance เมื่อ subclass เป็นชนิดหนึ่งของ superclass จริง (is-a) ส่วนความสัมพันธ์แบบเป็นส่วนประกอบหรือแค่ต้องการใช้ข้อมูลของอีกคลาสควรให้ class หนึ่งเก็บอีกคลาสเป็น attribute (has-a) การใช้ extends เพียงเพื่อยืมโค้ดทำให้โครงสร้างสับสนและผูกกันแน่นเกินจำเป็น"},{"id":"ENG-J-P-024","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J4","concept":"oop-override-with-super-call","mobile":false,"type":"single","stem":"โค้ดด้านล่างคำนวณเงินเดือนของผู้จัดการ ข้อใดระบุค่าที่พิมพ์และเหตุผลได้ถูกต้อง","code":"class Employee {\n  protected salary: number;\n  constructor(salary: number) {\n    this.salary = salary;\n  }\n  getPay(): number {\n    return this.salary;\n  }\n}\n\nclass Manager extends Employee {\n  getPay(): number {\n    return super.getPay() + 5000;\n  }\n}\n\nconsole.log(new Manager(30000).getPay());","codeLang":"typescript","options":[{"id":"A","text":"35000 เพราะ Manager override getPay และเรียกของ Employee ผ่าน super แล้วบวกเพิ่ม","correct":true,"why":"ถูกต้อง super.getPay() คืนเงินเดือนฐาน 30000 จาก Employee แล้วบวก 5000 ตามที่ Manager กำหนด"},{"id":"B","text":"30000 เพราะ Manager ไม่ได้ประกาศ salary ของตัวเอง จึงใช้ getPay ของ Employee ตามเดิม","correct":false,"why":"Manager ประกาศ getPay ของตัวเองไว้ จึงเป็นตัวที่ถูกเรียกกับ object ชนิด Manager ไม่ใช่ของ Employee"},{"id":"C","text":"5000 เพราะ getPay ของ Manager แทนที่ของ Employee ทั้งหมด จึงไม่นำเงินเดือนฐานมาคิด","correct":false,"why":"การ override แทนที่ตัว method ก็จริง แต่ในที่นี้ยังเรียก super.getPay() เพื่อนำค่าจากคลาสแม่มาใช้ต่อ"},{"id":"D","text":"เกิด error เพราะ subclass เรียก method ชื่อเดียวกับตัวเองของคลาสแม่ไม่ได้","correct":false,"why":"การเรียก super.ชื่อ method จากภายใน method ที่ override ไว้เป็นวิธีมาตรฐานในการต่อยอดพฤติกรรมของคลาสแม่"}],"explanation":"subclass override method เพื่อเปลี่ยนหรือเพิ่มพฤติกรรมได้ และเรียกเวอร์ชันของคลาสแม่ผ่าน super เมื่อต้องการต่อยอดแทนที่จะเขียนซ้ำ ทำให้กติกาพื้นฐานอยู่ที่เดียวและส่วนเฉพาะของแต่ละชนิดอยู่ใน subclass"},{"id":"ENG-J-P-025","level":"junior","pool":"practice","competency":"OOP","descriptor":"OOP-J5","concept":"oop-object-reference-assignment","mobile":false,"type":"single","stem":"ข้อใดระบุค่าที่พิมพ์จากโค้ดตะกร้าสินค้าด้านล่างและเหตุผลได้ถูกต้อง","code":"class Cart {\n  items: string[] = [];\n  add(product: string): void {\n    this.items.push(product);\n  }\n}\n\nconst cartA = new Cart();\nconst cartB = cartA;\ncartB.add(\"น้ำดื่ม\");\nconsole.log(cartA.items.length);","codeLang":"typescript","options":[{"id":"A","text":"0 เพราะ cartB เป็นสำเนาของ cartA สินค้าที่เพิ่มเข้า cartB จึงไม่ไปอยู่ใน cartA","correct":false,"why":"การกำหนด cartB = cartA ไม่ได้คัดลอก object แต่คัดลอกตัวอ้างอิง ทั้งสองตัวแปรจึงชี้ไปที่ object เดียวกัน"},{"id":"B","text":"undefined เพราะ items ถูกสร้างใหม่ทันทีที่กำหนด cartB = cartA","correct":false,"why":"การกำหนดค่าตัวแปรไม่ทำให้เกิดการสร้าง object หรือ attribute ใหม่ items ยังเป็นอาร์เรย์เดิม"},{"id":"C","text":"เกิด error เพราะกำหนด object ให้ตัวแปรอีกตัวโดยตรงไม่ได้ ต้องใช้ new ทุกครั้ง","correct":false,"why":"การกำหนด object ให้ตัวแปรอื่นทำได้ตามปกติ และเป็นรูปแบบที่ใช้ส่ง object ไปมาในโปรแกรมทั่วไป"},{"id":"D","text":"1 เพราะ cartA และ cartB ชี้ object เดียวกัน การเพิ่มผ่าน cartB จึงเห็นผ่าน cartA ด้วย","correct":true,"why":"ถูกต้อง ตัวแปรเก็บตัวอ้างอิงไปยัง object การเรียก add ผ่านตัวแปรใดก็เปลี่ยน object ตัวเดียวกัน"}],"explanation":"ตัวแปรที่เก็บ object เก็บเป็นตัวอ้างอิง ไม่ใช่ตัวข้อมูลเอง การกำหนดค่าจากตัวแปรหนึ่งไปอีกตัวจึงทำให้ชี้ object เดียวกัน เรื่องนี้เป็นต้นเหตุของบั๊กที่ฟังก์ชันแก้ object ที่รับเข้ามาแล้วผู้เรียกเห็นผลเปลี่ยนโดยไม่ตั้งใจ ถ้าต้องการสำเนาที่แยกกันต้องสร้าง object ใหม่หรือคัดลอกให้ชัดเจน"},{"id":"ENG-J-P-026","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J1","concept":"mon-read-log-sequence","mobile":false,"type":"single","stem":"ทีมกำลังตรวจ log ของ order-api หลังลูกค้ารายงานว่ากดสั่งซื้อแล้วหน้าจอค้างอยู่นาน ข้อใดสรุปสิ่งที่เกิดกับคำสั่งซื้อ A102 จาก log ด้านล่างได้ถูกต้อง","code":"10:02:11 INFO  order-api  POST /orders 201 85ms orderId=A101\n10:02:14 WARN  order-api  payment timeout, retry 1/3 orderId=A102\n10:02:17 WARN  order-api  payment timeout, retry 2/3 orderId=A102\n10:02:20 ERROR order-api  payment failed after 3 attempts orderId=A102\n10:02:20 INFO  order-api  POST /orders 502 9120ms orderId=A102","codeLang":"text","options":[{"id":"A","text":"คำสั่งซื้อ A101 ล้มเหลวก่อน จึงทำให้ A102 ถูกลองชำระเงินซ้ำ เพราะ log ทั้งสองรายการเกิดห่างกันไม่กี่วินาที","correct":false,"why":"ไม่ถูกต้อง: A101 ตอบ 201 สำเร็จด้วยเวลา 85 ms และเป็นคนละ orderId กับ A102 การเชื่อมเหตุการณ์ต้องดูจาก orderId ไม่ใช่แค่เวลาที่ใกล้กัน"},{"id":"B","text":"บรรทัด WARN เป็นเพียงคำเตือนที่เกิดเบื้องหลัง จึงไม่มีผลต่อเวลาที่ลูกค้ารอคำตอบ","correct":false,"why":"ไม่ถูกต้อง: การ retry เกิดภายใน request เดียวกัน เวลา 9120 ms ที่ลูกค้ารอส่วนใหญ่คือเวลาของการรอและลองเรียกชำระเงินซ้ำ"},{"id":"C","text":"การเรียกชำระเงินของ A102 หมดเวลาและลองซ้ำจนล้มเหลวใน request เดียว ลูกค้าจึงรอราว 9 วินาทีแล้วได้ 502","correct":true,"why":"ถูกต้อง: บรรทัดที่มี orderId=A102 เรียงตามเวลาเล่าเหตุการณ์ครบ ตั้งแต่ timeout ครั้งแรก การลองซ้ำ จนล้มเหลวและตอบ 502 ด้วยเวลา 9120 ms"},{"id":"D","text":"คำสั่งซื้อ A102 ถูกสร้างสำเร็จแล้วเพราะมีบรรทัด 201 ส่วน ERROR ที่ตามมาเป็นของ request อื่นที่ไม่เกี่ยวกับคำสั่งซื้อนี้","correct":false,"why":"ไม่ถูกต้อง: บรรทัด 201 เป็นของ orderId=A101 ส่วน ERROR และ 502 มี orderId=A102 จึงเป็น request เดียวกับที่ลูกค้าเจอปัญหา"}],"explanation":"การอ่าน log ให้เริ่มจากคีย์ที่ผูกเหตุการณ์เข้าด้วยกัน เช่น orderId หรือ request id แล้วเรียงตามเวลา ระดับ WARN ที่เกิดซ้ำก่อน ERROR มักเป็นเส้นทางของปัญหาเดียวกัน อย่าเชื่อมเหตุการณ์ด้วยเวลาที่ใกล้กันเพียงอย่างเดียว และอย่ามองข้าม WARN เพราะ retry ทำให้ latency เพิ่มขึ้นจริง"},{"id":"ENG-J-P-027","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J2","concept":"mon-incident-first-steps","mobile":false,"type":"single","stem":"เวลา 02:10 ระบบแจ้งเตือนว่า error rate ของ payment-api สูงขึ้นอย่างต่อเนื่อง คุณเป็นวิศวกรเวรที่เพิ่งเริ่มงานและเป็นคนแรกที่เห็นการแจ้งเตือน ข้อใดเป็นสิ่งที่ควรทำเป็นอันดับแรกตามขั้นตอนรับมือเหตุการณ์พื้นฐาน","options":[{"id":"A","text":"เปิด incident ticket และแจ้งทีมผ่านช่องทางที่กำหนด พร้อมระบุอาการและเวลาที่เริ่มพบ","correct":true,"why":"ถูกต้อง: การแจ้งทีมและเปิด ticket ตั้งแต่ต้นทำให้ทุกคนเห็นภาพเดียวกัน มีที่บันทึกขั้นตอน และขอความช่วยเหลือได้ทันเวลา"},{"id":"B","text":"รีสตาร์ททุก instance ของ payment-api ทันที แล้วค่อยแจ้งทีมเมื่ออาการหายไปแล้ว","correct":false,"why":"ไม่ถูกต้อง: การรีสตาร์ททันทีอาจล้างสถานะในหน่วยความจำที่เป็นหลักฐานของปัญหา และอาจไม่แก้สาเหตุจริง ขณะที่ทีมที่ควรร่วมตัดสินใจยังไม่รู้เรื่อง"},{"id":"C","text":"ค้นหาสาเหตุด้วยตัวเองให้ได้ข้อสรุปที่ชัดเจนก่อน แล้วจึงแจ้งทีมพร้อมรายงานที่ครบถ้วน","correct":false,"why":"ไม่ถูกต้อง: ถ้าใช้เวลาสืบคนเดียวนาน ผู้ใช้ได้รับผลกระทบต่อเนื่องและทีมที่อาจรู้ปัญหานี้อยู่แล้วก็ไม่มีโอกาสช่วย"},{"id":"D","text":"ย้อนกลับ (rollback) release ล่าสุดทันที เพราะ error rate ที่พุ่งมักมาจากการ deploy","correct":false,"why":"ไม่ถูกต้อง: ยังไม่ได้ตรวจว่าปัญหาสัมพันธ์กับ release จริงหรือไม่ การ rollback โดยไม่แจ้งใครอาจเพิ่มความสับสน และอาจไม่แก้อาการเลยหากสาเหตุไม่ได้มาจาก release"}],"explanation":"ขั้นตอนพื้นฐานของการรับมือเหตุการณ์คือรับรู้ แจ้งผู้เกี่ยวข้อง และบันทึกลง ticket ก่อนลงมือแก้ เพราะการแก้ที่รีบเกินไปอาจทำลายหลักฐานหรือซ้ำซ้อนกับงานของคนอื่น ผู้มีประสบการณ์น้อยยิ่งควรดึงทีมเข้ามาเร็ว"},{"id":"ENG-J-P-028","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J1","concept":"mob-accessibility-label-icon-button","mobile":true,"type":"single","stem":"แอปสั่งอาหารมีปุ่มตะกร้าที่เป็นไอคอนล้วน ไม่มีข้อความกำกับ ผู้ใช้ที่เปิด screen reader รายงานว่าได้ยินแค่คำว่า \"ปุ่ม\" โดยไม่รู้ว่าปุ่มนี้ทำอะไร ควรปรับอย่างไร","options":[{"id":"A","text":"เพิ่ม tooltip ที่แสดงข้อความเมื่อเอาเมาส์ไปชี้ที่ไอคอนตะกร้าค้างไว้สักครู่","correct":false,"why":"ไม่ถูกต้อง: อุปกรณ์สัมผัสไม่มีการชี้ด้วยเมาส์ และ tooltip แบบนี้ไม่ใช่สิ่งที่ screen reader บนมือถือใช้อ่านชื่อปุ่ม"},{"id":"B","text":"เปลี่ยนสีไอคอนให้เข้มขึ้นเพื่อให้ contrast กับพื้นหลังสูงขึ้นตามมาตรฐาน","correct":false,"why":"ไม่ถูกต้อง: contrast ช่วยผู้ที่มองเห็นไม่ชัด แต่ไม่ได้ทำให้ปุ่มมีชื่อที่ screen reader อ่านได้"},{"id":"C","text":"ขยายไอคอนให้ใหญ่ขึ้นและเว้นระยะรอบปุ่มให้กว้างขึ้นเพื่อให้แตะง่าย","correct":false,"why":"ไม่ถูกต้อง: ขนาดพื้นที่แตะช่วยให้กดแม่นขึ้น แต่ไม่ได้บอก screen reader ว่าปุ่มนี้ชื่ออะไรและทำอะไร"},{"id":"D","text":"กำหนดป้ายกำกับ accessibility ให้ปุ่ม เช่น \"ตะกร้าสินค้า\"","correct":true,"why":"ถูกต้อง: องค์ประกอบที่เป็นภาพล้วนต้องมีป้ายกำกับเป็นข้อความ เพื่อให้เทคโนโลยีช่วยเหลือบอกผู้ใช้ได้ว่าปุ่มทำอะไร"}],"explanation":"ไอคอนที่ไม่มีข้อความต้องมีป้ายกำกับสำหรับ accessibility ทั้งบน iOS, Android และเว็บ ควรตั้งชื่อให้บอกการกระทำ (เช่น \"เปิดตะกร้าสินค้า\") และทดสอบด้วย screen reader จริงของแพลตฟอร์มก่อนปล่อย"},{"id":"ENG-J-P-029","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J1","concept":"test-assertion-catches-wrong-rate","mobile":false,"type":"single","stem":"ทีมมีฟังก์ชันคำนวณ VAT ตามโค้ดด้านล่าง ถ้ามีคนแก้อัตราภาษีจาก 0.07 เป็น 0.17 โดยไม่ตั้งใจ เทสข้อใดจะล้มและช่วยเตือนปัญหานี้ได้","code":"export function calcVat(price: number): number {\n  return Math.round(price * 0.07 * 100) / 100;\n}","codeLang":"typescript","options":[{"id":"A","text":"expect(calcVat(1000)).toBeGreaterThan(0)","correct":false,"why":"ไม่ถูกต้อง: เมื่อแก้เป็น 0.17 ผลเป็น 170 ซึ่งยังมากกว่า 0 เทสนี้จึงยังผ่าน"},{"id":"B","text":"expect(calcVat(1000)).toBe(70)","correct":true,"why":"ถูกต้อง: ใช้ค่าที่คาดหวังมาจากกฎภาษี 7% ของ 1000 ถ้าอัตราเปลี่ยนเป็น 0.17 ผลจะเป็น 170 และเทสล้มทันที"},{"id":"C","text":"expect(typeof calcVat(1000)).toBe('number')","correct":false,"why":"ไม่ถูกต้อง: ตรวจเพียงชนิดของผลลัพธ์ ซึ่งยังเป็น number ไม่ว่าอัตราจะเป็น 0.07 หรือ 0.17"},{"id":"D","text":"expect(calcVat(1000)).toBe(calcVat(1000))","correct":false,"why":"ไม่ถูกต้อง: เทียบผลลัพธ์ของฟังก์ชันกับตัวมันเอง จึงผ่านเสมอไม่ว่าสูตรจะผิดอย่างไร"}],"explanation":"assertion ที่ดีต้องเทียบกับค่าที่คาดหวังซึ่งได้มาจากข้อกำหนดโดยตรง เทสที่ตรวจแค่ว่ามีค่า ชนิดถูก หรือเท่ากับตัวเอง จะผ่านแม้ตรรกะผิด วิธีตรวจคือลองแก้โค้ดให้ผิดเล็กน้อยแล้วดูว่าเทสล้มหรือไม่"},{"id":"ENG-J-P-030","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J2","concept":"mob-token-storage-mobile","mobile":true,"type":"multiple","stem":"ทีมกำลังเขียนแอปมือถือที่ให้ผู้ใช้ login แล้วรับ access token จาก API ข้อใดเป็นแนวปฏิบัติที่เหมาะสมในการจัดการ token และความลับในแอป (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เก็บ token ไว้ในที่เก็บข้อมูลปลอดภัยที่ระบบปฏิบัติการจัดไว้ให้ เช่น Keychain หรือ Keystore","correct":true,"why":"ถูกต้อง: ที่เก็บส่วนนี้ถูกออกแบบมาเก็บความลับ และแยกจากไฟล์ธรรมดาที่แอปอื่นหรือการสำรองข้อมูลอาจเข้าถึงได้"},{"id":"B","text":"ฝัง secret key ของระบบชำระเงินไว้ในโค้ดแอปแล้วทำ obfuscation เพื่อให้อ่านยาก","correct":false,"why":"ไม่ถูกต้อง: โค้ดที่อยู่บนเครื่องผู้ใช้สามารถถูกดึงออกมาวิเคราะห์ได้ obfuscation ทำได้เพียงชะลอ ไม่ได้ปกป้องความลับ"},{"id":"C","text":"ส่งทุก request ไปยัง API ผ่าน HTTPS เท่านั้น","correct":true,"why":"ถูกต้อง: HTTPS เข้ารหัสข้อมูลระหว่างทาง ป้องกันการดักอ่าน token ในเครือข่ายสาธารณะ เช่น Wi-Fi ร้านกาแฟ"},{"id":"D","text":"กำหนดอายุ access token ให้สั้น และใช้ refresh token สำหรับขอ token ใหม่","correct":true,"why":"ถูกต้อง: ถ้า token รั่วไหล ช่วงเวลาที่ใช้ได้จะจำกัด ส่วน refresh token ควรเก็บในที่ปลอดภัยเช่นเดียวกัน"}],"explanation":"ข้อมูลที่อยู่ในแอปถือว่าผู้ใช้หรือผู้โจมตีเข้าถึงได้ ความลับของระบบหลังบ้านจึงต้องอยู่ที่เซิร์ฟเวอร์ ส่วน token ของผู้ใช้ให้เก็บในที่เก็บข้อมูลปลอดภัยของระบบ ส่งผ่าน HTTPS และให้มีอายุจำกัด"},{"id":"ENG-J-P-031","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J4","concept":"mon-metrics-correlate-troubleshoot","mobile":false,"type":"single","stem":"หลัง deploy เวอร์ชันใหม่ของ order-api ตอน 14:00 ลูกค้าแจ้งว่าระบบช้า ทีมเปิดแดชบอร์ดแล้วได้ค่าตามตารางนี้ ข้อใดเป็นสมมติฐานแรกที่ควรตรวจ","code":"metric                         13:50    14:10\np95 latency (ms)                 320    4,800\nCPU usage (%)                     35       38\nmemory usage (%)                  52       54\nrequests per second              120      118\nDB connections in use (of 20)     11       20","codeLang":"text","options":[{"id":"A","text":"คำขอรอ connection จาก DB pool ที่เต็ม ควรตรวจโค้ดที่ถือ connection นานหรือ query ที่ช้าลง","correct":true,"why":"ถูกต้อง: ในตารางมีค่าเดียวที่เปลี่ยนไปพร้อม latency คือจำนวน connection ที่ใช้เต็ม 20 จาก 20 จึงเป็นเบาะแสที่ควรตามก่อน"},{"id":"B","text":"CPU ของเครื่องไม่พอรับโหลดของเวอร์ชันใหม่ ควรเพิ่มขนาดเครื่องของ order-api ให้ใหญ่ขึ้นก่อน","correct":false,"why":"ไม่ถูกต้อง: CPU ขยับจาก 35% เป็น 38% เท่านั้น ไม่ได้เป็นคอขวด การเพิ่มเครื่องจึงไม่น่าแก้อาการนี้"},{"id":"C","text":"ปริมาณคำขอสูงเกินกำลังรองรับ ควรเพิ่มจำนวน instance ของ order-api ให้มากขึ้นทันที","correct":false,"why":"ไม่ถูกต้อง: requests per second แทบไม่เปลี่ยน (120 เป็น 118) แปลว่าไม่ได้มีโหลดเพิ่ม"},{"id":"D","text":"หน่วยความจำรั่วสะสมหลัง deploy ควรรีสตาร์ทบริการเป็นระยะเพื่อคืนหน่วยความจำ","correct":false,"why":"ไม่ถูกต้อง: memory เปลี่ยนเพียง 52% เป็น 54% ไม่เข้ากับอาการของหน่วยความจำรั่วที่มักค่อย ๆ เพิ่มจนใกล้เต็ม"}],"explanation":"เวลาแก้ปัญหาด้วย metric ให้เปรียบเทียบก่อนและหลังเหตุการณ์ แล้วดูว่า metric ใดเปลี่ยนไปพร้อมอาการ จากนั้นตั้งสมมติฐานจากตัวที่เปลี่ยน ไม่ใช่เดาจากตัวที่คุ้นเคย เช่น CPU เสมอไป"},{"id":"ENG-J-P-032","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J3","concept":"web-password-storage-hash","mobile":false,"type":"single","stem":"ทีมกำลังทำระบบสมัครสมาชิกและ login ของเว็บไซต์ ข้อใดเป็นวิธีเก็บรหัสผ่านของผู้ใช้ในฐานข้อมูลที่เหมาะสม","options":[{"id":"A","text":"เข้ารหัสด้วย AES แล้วเก็บกุญแจไว้ในไฟล์ config ของแอป เพื่อถอดรหัสกลับมาเทียบตอน login","correct":false,"why":"ไม่ถูกต้อง: การเข้ารหัสแบบถอดกลับได้ทำให้ถ้ากุญแจรั่วไหล รหัสผ่านของทุกคนถูกอ่านได้ทันที"},{"id":"B","text":"แฮชด้วย SHA-256 รอบเดียวโดยไม่ใส่ salt เพราะเป็นแฮชทางเดียวอยู่แล้ว","correct":false,"why":"ไม่ถูกต้อง: SHA-256 คำนวณเร็วมาก จึงเดารหัสผ่านย้อนกลับได้เร็ว และรหัสผ่านเดียวกันจะได้ค่าแฮชเดียวกันทำให้โจมตีด้วยตารางสำเร็จรูปได้"},{"id":"C","text":"แฮชด้วย bcrypt หรือ argon2 พร้อม salt ที่ต่างกันในแต่ละผู้ใช้","correct":true,"why":"ถูกต้อง: อัลกอริทึมกลุ่มนี้ออกแบบให้คำนวณช้าโดยตั้งใจ และ salt ทำให้รหัสผ่านซ้ำกันได้ค่าแฮชต่างกัน"},{"id":"D","text":"แปลงเป็น Base64 ก่อนเก็บ เพื่อให้ไม่ได้เป็นข้อความที่อ่านออกด้วยตาเปล่า","correct":false,"why":"ไม่ถูกต้อง: Base64 เป็นเพียงการแปลงรูปแบบ ใครก็ถอดกลับได้ทันทีโดยไม่ต้องมีกุญแจ"}],"explanation":"ระบบไม่ควรเก็บรหัสผ่านที่ถอดกลับได้ ให้เก็บค่าแฮชจากอัลกอริทึมที่ออกแบบสำหรับรหัสผ่านพร้อม salt แล้วตอน login ให้แฮชรหัสที่กรอกมาเทียบกับค่าที่เก็บ"},{"id":"ENG-J-P-033","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J3","concept":"test-fake-repository-viewmodel","mobile":true,"type":"single","stem":"ทีมมือถือเขียน unit test ให้ OrderListViewModel ซึ่งดึงรายการออเดอร์จาก OrderRepository ที่เรียก REST API ควรออกแบบเทสอย่างไรจึงตรวจตรรกะของ ViewModel ได้อย่างเสถียร","options":[{"id":"A","text":"ให้ ViewModel เรียก API ของ staging จริง เพื่อให้ข้อมูลในเทสใกล้เคียงกับ production","correct":false,"why":"ไม่ถูกต้อง: ผลของเทสจะขึ้นกับเครือข่ายและข้อมูลบน staging ที่เปลี่ยนไปเรื่อย ๆ ทำให้เทสล้มโดยที่โค้ด ViewModel ไม่ได้ผิด"},{"id":"B","text":"ส่ง repository จำลองที่คืนรายการคงที่เข้าไป แล้วตรวจสถานะที่ ViewModel เปิดให้หน้าจอ","correct":true,"why":"ถูกต้อง: การแทนที่ dependency ด้วยของจำลองทำให้ตรวจเฉพาะตรรกะของ ViewModel ได้ ผลเหมือนเดิมทุกครั้งและรันได้เร็ว"},{"id":"C","text":"รันเทสบนเครื่องจริงที่ต่อ Wi-Fi ของออฟฟิศ เพื่อให้ได้ความเร็วเครือข่ายใกล้เคียงของผู้ใช้","correct":false,"why":"ไม่ถูกต้อง: ความเร็วเครือข่ายไม่ได้เป็นส่วนของตรรกะที่กำลังทดสอบ และทำให้เทสช้ากับไม่นิ่งโดยไม่จำเป็น"},{"id":"D","text":"ตั้งเวลารอ 5 วินาทีให้ API ตอบกลับก่อนค่อยตรวจผลลัพธ์ในเทส","correct":false,"why":"ไม่ถูกต้อง: การรอตามเวลาที่คาดเดาทำให้เทสช้า และยังล้มได้ถ้าวันไหนเครือข่ายหรือเซิร์ฟเวอร์ตอบช้ากว่าที่เดาไว้"}],"explanation":"unit test ควรแยกโค้ดที่ทดสอบออกจากของภายนอก เช่น เครือข่ายและเซิร์ฟเวอร์ โดยส่ง dependency จำลองเข้าไป เทสจึงเร็ว เสถียร และชี้ได้ว่าความผิดอยู่ที่ตรรกะของเราเอง การทดสอบการเชื่อมต่อจริงเป็นหน้าที่ของ integration test อีกชั้นหนึ่ง"},{"id":"ENG-J-P-034","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J4","concept":"web-rest-not-found-status","mobile":false,"type":"single","stem":"ลูกค้าเรียก GET /orders/9999 แต่ไม่มีคำสั่งซื้อหมายเลขนี้ในฐานข้อมูล API ควรตอบกลับอย่างไรจึงตรงหลักการของ RESTful","options":[{"id":"A","text":"ตอบ 200 พร้อม body {\"success\": false, \"message\": \"not found\"} ให้ฝั่ง client อ่านผลจาก body","correct":false,"why":"ไม่ถูกต้อง: 200 บอกว่าคำขอสำเร็จ ทำให้ client ทั่วไป ตัวแคช และเครื่องมือ monitoring เข้าใจผิดว่ามีข้อมูลอยู่จริง"},{"id":"B","text":"ตอบ 500 เพราะการค้นหาแล้วไม่พบข้อมูลเป็นความผิดพลาดของฝั่งเซิร์ฟเวอร์เอง","correct":false,"why":"ไม่ถูกต้อง: 500 ใช้กับความผิดพลาดภายในที่ไม่คาดคิด การค้นหาไม่พบเป็นสถานการณ์ปกติที่คาดไว้ได้และเกิดจากทรัพยากรที่ขอไม่มีอยู่"},{"id":"C","text":"ตอบ 204 No Content เพราะไม่มีข้อมูลให้ส่งกลับไปยังผู้เรียก","correct":false,"why":"ไม่ถูกต้อง: 204 หมายถึงคำขอสำเร็จและไม่มีเนื้อหาตอบกลับ ซึ่งสื่อว่าสำเร็จ ไม่ได้บอกว่าไม่พบทรัพยากร"},{"id":"D","text":"ตอบ 404 Not Found พร้อม body ที่อธิบายว่าไม่พบคำสั่งซื้อรหัสนี้","correct":true,"why":"ถูกต้อง: 404 บอกชัดว่าทรัพยากรที่ร้องขอไม่มีอยู่ และ body ช่วยให้ผู้เรียกเข้าใจเหตุผลได้"}],"explanation":"RESTful API ใช้ HTTP status code สื่อผลลัพธ์ให้ตรงความหมาย ไม่พบทรัพยากรใช้ 404 ข้อมูลที่ผู้เรียกส่งผิดใช้กลุ่ม 4xx ส่วนความผิดพลาดภายในจริง ๆ ใช้ 5xx การตอบ 200 ทุกกรณีทำให้การจัดการ error และการ monitoring ยากขึ้น"},{"id":"ENG-J-P-035","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J3","concept":"mon-alert-noise-tuning","mobile":false,"type":"single","stem":"Alert \"CPU เกิน 70% นาน 1 นาที\" ของ reporting-service ดังทุกคืนช่วง 00:00-00:30 ซึ่งเป็นเวลารัน batch สรุปยอดประจำวันตามปกติ จนทีมเริ่มไม่สนใจข้อความเตือน คุณได้รับมอบหมายให้ช่วยดูแล alert rule ควรทำอย่างไร","options":[{"id":"A","text":"ปิดการแจ้งเตือนของ rule นี้ออกจากช่องทางของทีมถาวร เพื่อให้ช่องแจ้งเตือนเหลือเฉพาะเรื่องสำคัญ","correct":false,"why":"ไม่ถูกต้อง: ถ้าเกิดปัญหาจริงนอกช่วง batch จะไม่มีใครได้รับแจ้ง ควรปรับเงื่อนไขให้แม่นยำขึ้นแทนการตัดช่องทางทิ้ง"},{"id":"B","text":"ปรับ rule หลังทบทวนกับทีม เช่น ขยายระยะเวลาหรือยกเว้นช่วง batch และบันทึกลง ticket","correct":true,"why":"ถูกต้อง: ปรับให้ alert ตรงกับพฤติกรรมปกติและยังจับความผิดปกติจริงได้ พร้อมบันทึกการเปลี่ยนแปลงเพื่อให้ทีมตรวจสอบย้อนหลังได้"},{"id":"C","text":"ลบ rule นี้ทิ้ง แล้วค่อยสร้างใหม่เมื่อมีเหตุการณ์จริงที่ทำให้ทีมต้องการดู CPU อีกครั้ง","correct":false,"why":"ไม่ถูกต้อง: ระหว่างที่ไม่มี rule ระบบจะไม่เตือนเมื่อ CPU สูงผิดปกตินอกช่วง batch และกว่าจะสร้างใหม่ก็อาจสายเกินไป"},{"id":"D","text":"เพิ่ม threshold ของทุก service เป็น 95% เพื่อให้ alert ดังน้อยลงทั้งระบบ","correct":false,"why":"ไม่ถูกต้อง: การปรับกว้างทั้งระบบทำให้ service อื่นที่ควรเตือนตั้งแต่ CPU 70% ได้รับแจ้งช้าลงโดยไม่จำเป็น"}],"explanation":"alert ที่ดังบ่อยจนคนเมินเป็นความเสี่ยงเท่ากับไม่มี alert งานดูแลคือทบทวนประวัติ ปรับเงื่อนไขให้เฉพาะเจาะจง เช่น ระยะเวลา ช่วงเวลา หรือสภาวะที่คาดไว้ และบันทึกการเปลี่ยนแปลง อย่าปิดหรือลบ rule เพียงเพื่อลดเสียงรบกวน"},{"id":"ENG-J-P-036","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J2","concept":"test-boundary-values-design","mobile":false,"type":"single","stem":"ทีมต้องออกแบบกรณีทดสอบให้ฟังก์ชันคิดค่าส่งด้านล่าง ชุดน้ำหนักพัสดุ (กิโลกรัม) ชุดใดช่วยจับข้อผิดพลาดของเงื่อนไขในฟังก์ชันได้ดีที่สุด","code":"function shippingFee(weightKg: number): number {\n  if (weightKg \u003c= 1) return 40;\n  if (weightKg \u003c= 5) return 80;\n  return 150;\n}","codeLang":"typescript","options":[{"id":"A","text":"ทดสอบที่ 1, 2, 5 และ 6 โดยกำหนดค่าที่คาดไว้ของแต่ละค่าล่วงหน้า","correct":true,"why":"ถูกต้อง: 1 และ 5 อยู่บนขอบของเงื่อนไข ส่วน 2 และ 6 อยู่ในช่วงถัดไป จึงจับกรณีเขียน \u003c= เป็น \u003c ได้ เช่น น้ำหนัก 1 ต้องได้ 40 และ 5 ต้องได้ 80"},{"id":"B","text":"ทดสอบที่ 0.2, 0.5 และ 0.8 ซึ่งอยู่ในช่วงน้ำหนักเดียวกันทั้งหมด","correct":false,"why":"ไม่ถูกต้อง: ทุกค่าตกในเงื่อนไขแรกเหมือนกัน จึงไม่ตรวจช่วงอื่นและไม่ตรวจขอบของเงื่อนไข"},{"id":"C","text":"ทดสอบที่ 0.5, 3 และ 10 ซึ่งแต่ละค่าอยู่คนละช่วงราคา","correct":false,"why":"ไม่ถูกต้อง: ครอบคลุมครบทุกช่วงแต่ใช้ค่ากลางช่วง ถ้าเงื่อนไขขอบเขตผิดเป็น \u003c แทน \u003c= เทสชุดนี้ก็ยังผ่าน"},{"id":"D","text":"ทดสอบที่ 0, -1 และ 100 ซึ่งเป็นค่าสุดโต่งของ input","correct":false,"why":"ไม่ถูกต้อง: ค่าสุดโต่งช่วยตรวจ input ที่ผิดปกติ แต่ไม่ได้แตะขอบ 1 และ 5 ซึ่งเป็นจุดที่เงื่อนไขเปลี่ยนผล"}],"explanation":"ข้อผิดพลาดเรื่อง \u003c, \u003c= มักเกิดตรงขอบของช่วงค่า การออกแบบเทสจึงควรเลือกค่าบนขอบและค่าถัดจากขอบ (boundary value) นอกเหนือจากค่ากลางช่วง และกำหนดผลที่คาดไว้จากข้อกำหนดก่อนรันเทส"},{"id":"ENG-J-P-037","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J1","concept":"mob-large-font-layout","mobile":true,"type":"single","stem":"ผู้ใช้สูงอายุตั้งขนาดตัวอักษรของระบบมือถือเป็นขนาดใหญ่ แล้วพบว่าข้อความในการ์ดสินค้าของแอปถูกตัดและซ้อนทับกัน ทีมควรแก้อย่างไรให้เหมาะกับการเข้าถึงมากที่สุด","options":[{"id":"A","text":"ล็อกขนาดตัวอักษรของแอปเป็นค่าคงที่ เพื่อให้เลย์เอาต์ที่ออกแบบไว้ไม่เพี้ยน","correct":false,"why":"ไม่ถูกต้อง: ผู้ใช้ตั้งขนาดใหญ่เพราะจำเป็นต้องใช้ การล็อกขนาดทำให้อ่านแอปไม่ได้ ซึ่งแย่กว่าเดิม"},{"id":"B","text":"ลดขนาดตัวอักษรอัตโนมัติจนข้อความพอดีกับความสูงของการ์ดที่ออกแบบไว้เดิม","correct":false,"why":"ไม่ถูกต้อง: ข้อความจะกลับมาเล็กจนอ่านยากอีก ซึ่งขัดกับเจตนาของการตั้งขนาดตัวอักษรใหญ่"},{"id":"C","text":"ให้การ์ดสูงตามเนื้อหา ข้อความขึ้นบรรทัดใหม่ได้ และทดสอบที่ขนาดตัวอักษรใหญ่","correct":true,"why":"ถูกต้อง: เลย์เอาต์ที่ยืดหยุ่นรองรับข้อความที่ใหญ่ขึ้นโดยไม่สูญเสียเนื้อหา และการทดสอบที่ขนาดใหญ่ทำให้เห็นปัญหาก่อนปล่อย"},{"id":"D","text":"จำกัดชื่อสินค้าไว้ไม่เกิน 10 ตัวอักษร เพื่อให้ข้อความอยู่ในบรรทัดเดียว","correct":false,"why":"ไม่ถูกต้อง: ตัดข้อมูลสินค้าที่ผู้ใช้ต้องใช้ และตัวอักษรที่ใหญ่ขึ้นก็ยังอาจล้นความกว้างของการ์ดได้"}],"explanation":"แอปควรเคารพการตั้งขนาดตัวอักษรของระบบ และออกแบบเลย์เอาต์ให้ยืดหยุ่น เช่น ความสูงตามเนื้อหา ข้อความขึ้นบรรทัดใหม่ได้ รองรับการเลื่อน แทนการใช้ขนาดคงที่ แล้วทดสอบที่ขนาดตัวอักษรใหญ่สุดก่อนปล่อยทุกครั้ง"},{"id":"ENG-J-P-038","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J1","concept":"mon-mobile-crash-report-reading","mobile":true,"type":"single","stem":"หลังปล่อยแอปเวอร์ชัน 2.3.1 ทีมเปิดรายงาน crash จากเครื่องมือ crash reporting แล้วเห็นกลุ่มที่พบมากที่สุดดังนี้ ข้อใดเป็นข้อสรุปที่รายงานนี้สนับสนุนมากที่สุด","code":"Crash group : null reference at CartScreen.loadItems\nAffected    : 1,240 sessions\nBy app ver  : 2.3.0 -> 12    | 2.3.1 -> 1,228\nBy OS       : Android 13 -> 610 | Android 12 -> 598 | other -> 32\nBy device   : 14 models, none above 15%","codeLang":"text","options":[{"id":"A","text":"เป็นบั๊กเฉพาะของ Android 13 เพราะมีจำนวน crash สูงที่สุด ควรแก้เฉพาะระบบปฏิบัติการนี้ก่อนเป็นอันดับแรก","correct":false,"why":"ไม่ถูกต้อง: Android 13 และ 12 มี crash ใกล้เคียงกัน (610 กับ 598) จึงไม่ได้ชี้ว่าระบบปฏิบัติการใดเป็นต้นเหตุ"},{"id":"B","text":"เกิดจากมือถือบางรุ่น จึงควรจำกัดการรองรับเฉพาะรุ่นที่ crash เกิดขึ้นบ่อย","correct":false,"why":"ไม่ถูกต้อง: crash กระจายอยู่ในหลายรุ่น (14 รุ่น และไม่มีรุ่นใดเกิน 15%) ไม่ได้กระจุกที่รุ่นเฉพาะ"},{"id":"C","text":"เกิดจากเครือข่ายของผู้ใช้ไม่เสถียร จึงควรเพิ่มเวลา timeout ของการเรียก API","correct":false,"why":"ไม่ถูกต้อง: ข้อผิดพลาดคือ null reference ในโค้ดหน้าจอ และรายงานนี้ไม่มีข้อมูลเครือข่ายสนับสนุนข้อสรุปนี้"},{"id":"D","text":"น่าจะเกี่ยวกับการเปลี่ยนแปลงใน 2.3.1 ที่แตะ CartScreen.loadItems ควรเทียบโค้ดกับ 2.3.0","correct":true,"why":"ถูกต้อง: crash เกือบทั้งหมด (1,228 จาก 1,240) อยู่ในเวอร์ชัน 2.3.1 และตรงกับตำแหน่งในโค้ดเดียว จึงเป็นเบาะแสว่าเกิดจากการเปลี่ยนแปลงใน release นั้น"}],"explanation":"การอ่านรายงาน crash ให้ดูว่าตัวแปรใดกระจุก เช่น เวอร์ชันแอป ระบบปฏิบัติการ หรือรุ่นอุปกรณ์ ตัวแปรที่กระจุกที่สุดคือเบาะแสแรก ส่วนตัวที่กระจายสม่ำเสมอมักไม่ใช่ต้นเหตุ จากนั้นไปไล่ดูการเปลี่ยนแปลงของโค้ดที่ตรงกับตำแหน่งใน stack trace"},{"id":"ENG-J-P-039","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J3","concept":"test-what-to-mock","mobile":false,"type":"multiple","stem":"ทีมกำลังเขียน unit test ให้ OrderService.placeOrder ซึ่งคำนวณยอดรวมด้วยเมธอด calcTotal() ของคลาสเอง แล้วเรียก PaymentGatewayClient (ส่ง HTTP ไปยังผู้ให้บริการชำระเงินภายนอก) และ EmailSender (ส่งอีเมลยืนยัน) จากนั้นสร้างอ็อบเจ็กต์ Order เป็นผลลัพธ์ ข้อใดควรแทนด้วยของจำลอง (mock/stub) ในเทสนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"PaymentGatewayClient","correct":true,"why":"ถูกต้อง: เป็นการเรียกระบบภายนอกผ่านเครือข่าย ถ้าใช้ตัวจริงเทสจะช้า ไม่เสถียร และอาจตัดเงินจริง"},{"id":"B","text":"เมธอด calcTotal() ของ OrderService เอง","correct":false,"why":"ไม่ถูกต้อง: เป็นตรรกะที่เรากำลังต้องการทดสอบ ถ้าจำลองทิ้งไปจะไม่มีอะไรตรวจว่ายอดรวมคำนวณถูก"},{"id":"C","text":"อ็อบเจ็กต์ Order ที่ใช้เก็บผลลัพธ์","correct":false,"why":"ไม่ถูกต้อง: เป็นข้อมูลธรรมดาที่สร้างได้ง่ายและไม่มีผลข้างเคียง การจำลองไม่ช่วยอะไรและทำให้เทสอ่านยาก"},{"id":"D","text":"EmailSender","correct":true,"why":"ถูกต้อง: การส่งอีเมลเป็นผลข้างเคียงภายนอก ควรใช้ตัวจำลองเพื่อตรวจว่าถูกเรียกด้วยข้อมูลที่ถูกต้อง โดยไม่ส่งอีเมลจริง"},{"id":"E","text":"ตัว OrderService ที่กำลังทดสอบ","correct":false,"why":"ไม่ถูกต้อง: ถ้าจำลองคลาสที่ทดสอบ เทสจะตรวจของจำลองแทนโค้ดจริง"}],"explanation":"ของจำลองควรใช้แทน dependency ที่ช้า ไม่เสถียร หรือมีผลข้างเคียงภายนอก เช่น HTTP, อีเมล, เวลา ส่วนตรรกะของคลาสที่ทดสอบและข้อมูลธรรมดาให้ใช้ของจริง มิฉะนั้นเทสจะไม่ได้ตรวจโค้ดที่ตั้งใจ"},{"id":"ENG-J-P-040","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J3","concept":"web-sql-parameterized-query","mobile":false,"type":"single","stem":"ผู้ทดสอบกรอกอีเมลเป็น ' OR '1'='1 ในช่องค้นหาผู้ใช้ แล้วระบบแสดงข้อมูลของผู้ใช้ทุกคน โค้ดฝั่งเซิร์ฟเวอร์เป็นดังนี้ ควรแก้ไขอย่างไร","code":"const sql = `SELECT id, name FROM users WHERE email = '${email}'`;\nconst rows = await db.query(sql);","codeLang":"typescript","options":[{"id":"A","text":"ใช้ replace ลบเครื่องหมาย ' ออกจากอีเมลก่อนนำไปต่อสตริง","correct":false,"why":"ไม่ถูกต้อง: การลบอักขระที่รู้จักเป็นวิธีที่ถูกเลี่ยงได้ง่าย และอาจทำให้อีเมลที่มีเครื่องหมายนี้ซึ่งใช้ได้จริงผิดเพี้ยนไป"},{"id":"B","text":"ใช้ parameterized query ส่งค่าอีเมลเป็นพารามิเตอร์แยกจากคำสั่ง SQL","correct":true,"why":"ถูกต้อง: ฐานข้อมูลแยกคำสั่งออกจากข้อมูล ค่าที่ผู้ใช้กรอกจึงไม่ถูกตีความเป็นส่วนหนึ่งของ SQL"},{"id":"C","text":"ตรวจรูปแบบอีเมลที่ฟอร์มฝั่ง browser ก่อนส่ง request ไปยังเซิร์ฟเวอร์","correct":false,"why":"ไม่ถูกต้อง: การตรวจฝั่ง browser ถูกข้ามได้ด้วยการส่ง request ตรงเข้าเซิร์ฟเวอร์ จึงใช้ป้องกัน SQL injection ไม่ได้"},{"id":"D","text":"ครอบ db.query ด้วย try/catch แล้วคืนข้อความ error กลางเมื่อเกิดความผิดพลาด","correct":false,"why":"ไม่ถูกต้อง: คำสั่งนี้ไม่ได้ล้มเหลว มันทำงานสำเร็จและคืนข้อมูลทุกแถว try/catch จึงไม่ช่วยป้องกัน"}],"explanation":"SQL injection เกิดเมื่อนำค่าจากผู้ใช้ไปต่อเป็นข้อความคำสั่ง SQL ทางแก้พื้นฐานคือ parameterized query หรือ prepared statement ที่ส่งคำสั่งและค่าแยกกันไปยังฐานข้อมูล การกรองหรือการตรวจฝั่ง browser ใช้เป็นชั้นเสริมได้เท่านั้น"},{"id":"ENG-J-P-041","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J2","concept":"mon-incident-record-contents","mobile":false,"type":"multiple","stem":"ระหว่างจัดการเหตุการณ์ที่ระบบสั่งซื้อช้า คุณต้องบันทึกความคืบหน้าลงใน incident ticket ข้อใดควรอยู่ในบันทึกนั้น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ชื่อนักพัฒนาที่ commit ล่าสุด พร้อมระบุว่าเป็นผู้ก่อให้เกิดเหตุการณ์","correct":false,"why":"ไม่ถูกต้อง: ยังไม่มีหลักฐานว่าใครเป็นต้นเหตุ และการชี้ตัวบุคคลไม่ช่วยแก้ปัญหา ควรบันทึกข้อเท็จจริงของระบบ"},{"id":"B","text":"ไทม์ไลน์พร้อมเวลา ตั้งแต่เวลาที่ได้รับแจ้ง สิ่งที่ตรวจ และสิ่งที่ลงมือทำพร้อมผลลัพธ์","correct":true,"why":"ถูกต้อง: ไทม์ไลน์ช่วยให้คนที่เข้ามาช่วยทีหลังเห็นภาพเดียวกัน และใช้ทบทวนเหตุการณ์ภายหลังได้"},{"id":"C","text":"ข้อสรุปสาเหตุที่แน่ชัดตั้งแต่ชั่วโมงแรก แม้ยังตรวจสอบไม่ครบ","correct":false,"why":"ไม่ถูกต้อง: ข้อสรุปที่ยังไม่ผ่านการพิสูจน์อาจชี้ทีมไปผิดทางและต้องแก้บันทึกภายหลัง ควรบันทึกเป็นสมมติฐานที่รอตรวจ"},{"id":"D","text":"ผลกระทบ เช่น บริการและจำนวนผู้ใช้ที่ได้รับผลกระทบ และสถานะล่าสุดของเหตุการณ์","correct":true,"why":"ถูกต้อง: ผลกระทบและสถานะทำให้ผู้เกี่ยวข้องประเมินความเร่งด่วนและรู้ว่าตอนนี้เหตุการณ์อยู่ขั้นใด"}],"explanation":"incident ticket ที่ดีบันทึกข้อเท็จจริงเป็นลำดับเวลา สิ่งที่ลงมือทำและผลที่ได้ ผลกระทบ และสถานะปัจจุบัน สมมติฐานที่ยังไม่ยืนยันควรระบุว่าเป็นสมมติฐาน และเลี่ยงการชี้ตัวบุคคลเพราะเป้าหมายคือแก้ระบบและเรียนรู้"},{"id":"ENG-J-P-042","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J2","concept":"mob-store-submission-checklist","mobile":true,"type":"multiple","stem":"ทีมกำลังเตรียมส่งแอปมือถือเวอร์ชันแรกขึ้นร้านแอป (App Store หรือ Google Play) ข้อใดควรทำเพื่อให้ผ่านการ review ได้ราบรื่น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ส่ง build ที่ยังชี้ไปยังเซิร์ฟเวอร์ staging และเปิดเมนูสำหรับนักพัฒนาไว้ เพื่อให้ทีมตามดู log ระหว่าง review ได้","correct":false,"why":"ไม่ถูกต้อง: ผู้ review ควรเห็นแอปแบบที่ผู้ใช้จะได้รับ เมนูนักพัฒนาอาจเปิดเผยข้อมูล และ staging อาจล่มหรือข้อมูลไม่ครบระหว่าง review"},{"id":"B","text":"ส่ง release build ที่ sign แล้ว หลังทดสอบบนอุปกรณ์จริงว่าเปิดและใช้ฟีเจอร์หลักได้","correct":true,"why":"ถูกต้อง: ผู้ review ตรวจแอปที่ผู้ใช้จะได้รับ ถ้าแอปเปิดไม่ได้หรือ crash ตั้งแต่ใช้งานแรกมักถูกปฏิเสธ"},{"id":"C","text":"ระบุข้อมูลส่วนบุคคลที่แอปเก็บ และให้ลิงก์นโยบายความเป็นส่วนตัวตามที่ร้านแอปกำหนด","correct":true,"why":"ถูกต้อง: ร้านแอปกำหนดให้เปิดเผยการเก็บข้อมูลผู้ใช้ ซึ่งสอดคล้องกับหน้าที่ตาม PDPA และถ้ากรอกไม่ตรงกับพฤติกรรมจริงของแอปก็อาจถูกปฏิเสธ"},{"id":"D","text":"ขอ permission ทุกชนิดที่อาจใช้ในอนาคตตั้งแต่เวอร์ชันแรก เพื่อลดจำนวนครั้งที่ต้องส่งตรวจใหม่","correct":false,"why":"ไม่ถูกต้อง: การขอสิทธิ์เกินกว่าที่ฟีเจอร์ปัจจุบันใช้มักถูกปฏิเสธ และผู้ใช้อาจไม่ไว้ใจแอปที่ขอสิทธิ์เกินจำเป็น"},{"id":"E","text":"เตรียมบัญชีทดสอบและวิธีใช้ให้ผู้ review หากแอปต้อง login ก่อนจึงใช้งานฟีเจอร์หลักได้","correct":true,"why":"ถูกต้อง: ถ้าผู้ review เข้าสู่ระบบไม่ได้ก็ตรวจฟีเจอร์ไม่ได้ ซึ่งเป็นสาเหตุที่พบบ่อยของการถูกปฏิเสธหรือถูกขอข้อมูลเพิ่ม"}],"explanation":"ก่อนส่งแอปขึ้นร้านควรเตรียม release build ที่ทดสอบแล้ว ข้อมูลความเป็นส่วนตัวที่ตรงกับพฤติกรรมจริง สิทธิ์ที่ขอเท่าที่ใช้ และบัญชีทดสอบสำหรับผู้ review เกณฑ์ของแต่ละร้านต่างกันเล็กน้อย จึงควรอ่านแนวทางล่าสุดของร้านที่จะส่งด้วย"},{"id":"ENG-J-P-043","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J5","concept":"mob-handle-401-token-expired","mobile":true,"type":"single","stem":"แอปมือถือส่ง request พร้อม access token ไปยัง API แล้วได้ตอบกลับ 401 Unauthorized หลังผู้ใช้เปิดแอปค้างไว้นาน ฝั่งแอปควรจัดการอย่างไร","options":[{"id":"A","text":"ส่ง request เดิมด้วย token เดิมซ้ำทันทีในลูปจนกว่าจะได้ 200 กลับมา เพื่อให้ผู้ใช้ทำงานต่อได้อย่างต่อเนื่อง","correct":false,"why":"ไม่ถูกต้อง: token เดิมยังใช้ไม่ได้ การส่งซ้ำจึงได้ 401 เหมือนเดิมและสร้างโหลดให้เซิร์ฟเวอร์โดยเปล่าประโยชน์"},{"id":"B","text":"แสดงข้อความ \"เกิดข้อผิดพลาด\" ทั่วไป แล้วปล่อยให้ผู้ใช้อยู่หน้าเดิมจนกว่าจะปิดแอปแล้วเปิดใหม่","correct":false,"why":"ไม่ถูกต้อง: ผู้ใช้ไม่รู้ว่าต้องทำอะไรต่อ ทั้งที่แอปมีวิธีขอ token ใหม่หรือพาไปเข้าสู่ระบบได้"},{"id":"C","text":"ขอ token ใหม่ด้วย refresh token แล้วลองส่ง request เดิมอีกครั้ง หากขอไม่ได้ให้พาไป login","correct":true,"why":"ถูกต้อง: 401 บอกว่าการยืนยันตัวตนไม่ผ่านหรือหมดอายุ จึงต่ออายุหรือให้ผู้ใช้ยืนยันตัวตนใหม่ แล้วจึงลองคำขอเดิม"},{"id":"D","text":"เก็บรหัสผ่านของผู้ใช้ไว้ในเครื่องแล้วแนบไปกับทุก request แทนการใช้ token ตัวเดิม","correct":false,"why":"ไม่ถูกต้อง: รหัสผ่านที่เก็บในเครื่องและส่งซ้ำทุกครั้งเพิ่มความเสี่ยงรั่วไหลอย่างมาก token ถูกออกแบบมาเพื่อไม่ต้องทำเช่นนี้"}],"explanation":"เมื่อ API ตอบ 401 ฝั่งไคลเอนต์ควรต่ออายุ token ผ่านขั้นตอนที่ระบบกำหนด (เช่น refresh token) หรือพาผู้ใช้ไปยืนยันตัวตนใหม่ แล้วจึงลองคำขอเดิม พร้อมจำกัดจำนวนครั้งที่ลองเพื่อไม่ให้วนไม่รู้จบ"},{"id":"ENG-J-P-044","level":"junior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-J5","concept":"web-http-method-mapping","mobile":false,"type":"multiple","stem":"ทีมกำลังออกแบบ endpoint ของ API ร้านค้าออนไลน์ ข้อใดจับคู่การทำงานกับ HTTP method และ path ได้ตรงกับการใช้ method มาตรฐาน (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ดูรายละเอียดคำสั่งซื้อ: GET /orders/7","correct":true,"why":"ถูกต้อง: GET ใช้อ่านข้อมูลโดยไม่เปลี่ยนสถานะของระบบ"},{"id":"B","text":"แก้ไขอีเมลลูกค้า: GET /customers/5?email=new@shop.com","correct":false,"why":"ไม่ถูกต้อง: GET ควรปลอดภัยต่อการเรียกซ้ำ การใช้เปลี่ยนข้อมูลเสี่ยงให้ crawler, prefetch หรือแคชทำให้ข้อมูลถูกแก้โดยไม่ตั้งใจ"},{"id":"C","text":"ลบสินค้ารหัส 12: DELETE /products/12","correct":true,"why":"ถูกต้อง: DELETE ใช้ลบทรัพยากรที่ระบุด้วย URL ตรงตามความหมายของ method"},{"id":"D","text":"สร้างลูกค้าใหม่: PUT /customers","correct":false,"why":"ไม่ถูกต้อง: PUT ใช้แทนที่ทรัพยากรที่ระบุตำแหน่งชัดเจน การสร้างรายการใหม่ที่เซิร์ฟเวอร์เป็นผู้กำหนดรหัสนิยมใช้ POST ไปยัง collection"},{"id":"E","text":"สร้างคำสั่งซื้อใหม่: GET /orders/new?item=3","correct":false,"why":"ไม่ถูกต้อง: การสร้างข้อมูลด้วย GET ขัดกับความหมายของ method ควรใช้ POST /orders พร้อมข้อมูลใน body"}],"explanation":"method มาตรฐานมีความหมายชัดเจน GET อ่าน POST สร้าง PUT/PATCH แก้ DELETE ลบ การใช้ให้ตรงความหมายทำให้ client แคช และเครื่องมือต่าง ๆ ทำงานถูกต้องและเอกสาร API เข้าใจง่าย"},{"id":"ENG-J-P-045","level":"junior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-J4","concept":"mon-trace-slow-span-mobile","mobile":true,"type":"single","stem":"ผู้ใช้แอปมือถือรายงานว่าเปิดหน้าตะกร้าแล้วโหลดช้าประมาณ 5 วินาที ทีมเปิด trace ของ request ที่ตรงกับผู้ใช้รายนั้นได้ผลดังนี้ ควรเริ่มตรวจที่ใดก่อน","code":"GET /cart                              total 4,950 ms\n |- api-gateway        auth check              18 ms\n |- cart-service       load cart               42 ms\n |- inventory-service  check stock          4,810 ms\n '- cart-service       build response          65 ms","codeLang":"text","options":[{"id":"A","text":"inventory-service ในขั้นตรวจสต็อก เพราะใช้เวลาเกือบทั้งหมด","correct":true,"why":"ถูกต้อง: ขั้นนี้ใช้ 4,810 ms จากทั้งหมด 4,950 ms จึงเป็นส่วนที่ทำให้ช้า ควรดู query หรือการเรียกต่อของบริการนี้ต่อ"},{"id":"B","text":"การแสดงผลของแอปบนมือถือ เพราะผู้ใช้เห็นอาการที่หน้าจอเป็นรายการแรก","correct":false,"why":"ไม่ถูกต้อง: เวลาฝั่งเซิร์ฟเวอร์เกือบ 5 วินาทีอธิบายอาการได้เกือบทั้งหมดแล้ว การตรวจการแสดงผลควรมาทีหลัง"},{"id":"C","text":"api-gateway ในขั้นตรวจสิทธิ์ เพราะเป็นด่านแรกของทุก request","correct":false,"why":"ไม่ถูกต้อง: ขั้นนี้ใช้เพียง 18 ms การเป็นด่านแรกไม่ได้ทำให้เป็นสาเหตุของความช้า"},{"id":"D","text":"เครือข่ายมือถือของผู้ใช้ เพราะ trace ไม่ได้วัดส่วนนี้","correct":false,"why":"ไม่ถูกต้อง: แม้ trace ไม่ครอบคลุมเครือข่าย แต่ฝั่งเซิร์ฟเวอร์ใช้เวลาเกือบเท่าที่ผู้ใช้รอ จึงควรตรวจส่วนที่วัดได้และช้าก่อน"}],"explanation":"trace แสดงเวลาของแต่ละช่วงใน request เดียว ให้หา span ที่ใช้เวลามากที่สุดแล้วเริ่มสืบจากตรงนั้น ไม่ใช่ตรงที่เห็นอาการหรือส่วนที่คุ้นเคย เมื่อรู้บริการที่ช้าแล้วค่อยดู log และ metric ของบริการนั้นต่อ"},{"id":"ENG-J-P-046","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J1","concept":"test-good-unit-test-traits","mobile":true,"type":"multiple","stem":"ทีมมือถือเขียน unit test ให้ฟังก์ชัน validatePhone ที่ตรวจเบอร์โทรไทยก่อนส่งฟอร์มสมัครสมาชิกในแอป ข้อใดเป็นลักษณะของ unit test ที่ดี (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ผลของแต่ละเทสไม่ขึ้นกับลำดับการรันหรือผลของเทสอื่น","correct":true,"why":"ถูกต้อง: เทสที่เป็นอิสระต่อกันทำให้รันเดี่ยว รันขนาน หรือสลับลำดับได้ผลเหมือนเดิม และเมื่อล้มก็ชี้ปัญหาได้ตรง"},{"id":"B","text":"รันกี่ครั้งก็ได้ผลเหมือนเดิม โดยไม่พึ่งเครือข่ายหรือเวลาปัจจุบัน","correct":true,"why":"ถูกต้อง: เทสที่ผลคงที่ให้ผลล้มที่เชื่อถือได้ ส่วนเทสที่พึ่งปัจจัยภายนอกจะล้มบางครั้งโดยโค้ดไม่ได้ผิด"},{"id":"C","text":"รวมหลายกรณี เช่น เบอร์ถูกต้อง เบอร์สั้น และเบอร์มีตัวอักษร ไว้ในเทสเดียวเพื่อให้ไฟล์เทสสั้น","correct":false,"why":"ไม่ถูกต้อง: เมื่อเทสรวมล้ม ไม่รู้ว่ากรณีใดผิด และถ้า assertion แรกล้ม กรณีที่ตามมาจะไม่ถูกตรวจ ควรแยกเป็นเทสละกรณี"},{"id":"D","text":"ตั้งชื่อเทสให้บอกกรณีและผลที่คาด เช่น rejects_phone_with_letters","correct":true,"why":"ถูกต้อง: ชื่อที่สื่อความหมายทำให้เห็นทันทีว่ากรณีใดล้มโดยไม่ต้องอ่านโค้ดเทส"}],"explanation":"unit test ที่ดีเป็นอิสระต่อกัน ให้ผลซ้ำได้ เร็ว ตรวจกรณีละเรื่อง และชื่อบอกเจตนา ลักษณะเหล่านี้ทำให้เมื่อเทสล้มทีมรู้ได้ทันทีว่าอะไรผิดและเชื่อผลของเทสได้"},{"id":"ENG-J-P-047","level":"junior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-J2","concept":"test-expected-from-spec","mobile":true,"type":"single","stem":"ทีมเขียนฟังก์ชัน formatBaht สำหรับแสดงราคาบนหน้าจอแอป สเปกของงานระบุให้แสดงทศนิยม 2 ตำแหน่งเสมอ นักพัฒนารันฟังก์ชันด้วยค่า 1234.5 ได้ผล \"฿1,234.5\" แล้วคัดลอกผลนี้ไปเป็นค่าที่คาดหวังในเทส เทสผ่านทันที วิธีนี้มีปัญหาอะไรและควรทำอย่างไร","options":[{"id":"A","text":"เพิ่มค่าอื่น เช่น 0 และ 1000000 เข้าเทส โดยยังคัดลอกผลจากฟังก์ชันเป็นค่าที่คาดหวังตามเดิม","correct":false,"why":"ไม่ถูกต้อง: ยิ่งคัดลอกผลจากโค้ดมากขึ้น ก็ยิ่งยืนยันพฤติกรรมปัจจุบันมากขึ้นโดยไม่ได้เทียบกับสเปก ข้อผิดพลาดเดิมยังไม่ถูกจับ"},{"id":"B","text":"เปลี่ยนไปใช้ snapshot test ที่บันทึกผลของฟังก์ชันเป็นค่าอ้างอิงให้อัตโนมัติ","correct":false,"why":"ไม่ถูกต้อง: snapshot บันทึกผลที่ฟังก์ชันให้ในปัจจุบัน ถ้าผลนั้นผิดสเปกก็ถูกบันทึกเป็นค่าอ้างอิงที่ผิดไปด้วย"},{"id":"C","text":"ทดสอบผ่านหน้าจอจริงบนอุปกรณ์แทน เพราะ unit test ตรวจรูปแบบข้อความไม่ได้","correct":false,"why":"ไม่ถูกต้อง: unit test ตรวจสตริงที่ฟังก์ชันคืนได้โดยตรง และเร็วกว่าการเปิดแอปตรวจด้วยมือมาก"},{"id":"D","text":"กำหนดค่าที่คาดหวังจากสเปกก่อนรันโค้ด เช่น \"฿1,234.50\" แล้วแก้ฟังก์ชันให้ผ่าน","correct":true,"why":"ถูกต้อง: ค่าที่คาดหวังต้องมาจากความต้องการ ไม่ใช่จากโค้ด มิฉะนั้นเทสจะยืนยันว่าข้อผิดพลาดนั้นถูกต้อง"}],"explanation":"เทสที่ใช้ผลของโค้ดเป็น Git","descriptor":"GIT-J1","concept":"git-clone-copies-history-origin","mobile":false,"type":"single","stem":"น้องใหม่ในทีมรัน git clone พร้อม URL ของ repository ครั้งแรกบนเครื่องตัวเอง ข้อใดอธิบายสิ่งที่ได้มาหลังรันคำสั่งนี้ได้ถูกต้อง","options":[{"id":"A","text":"ได้เฉพาะไฟล์ล่าสุดของ branch หลักโดยไม่มีประวัติ commit ย้อนหลัง","correct":false,"why":"โดยปกติ clone ดึงประวัติ commit ทั้งหมดมาด้วย จะได้เฉพาะไฟล์ล่าสุดก็ต่อเมื่อเลือก shallow clone เอง"},{"id":"B","text":"ได้สำเนา repository พร้อมประวัติ commit และ remote ชื่อ origin ที่ชี้ไป URL นั้น","correct":true,"why":"ถูกต้อง clone สร้าง repository ในเครื่องที่มีประวัติครบ และตั้ง remote ชื่อ origin ให้โดยอัตโนมัติ"},{"id":"C","text":"ได้โฟลเดอร์ที่เชื่อมกับเซิร์ฟเวอร์แบบเรียลไทม์ แก้ไฟล์แล้วขึ้น remote ทันที","correct":false,"why":"Git ไม่ซิงค์ไฟล์แบบเรียลไทม์ การส่งงานขึ้น remote ต้องสั่ง commit และ push เอง"},{"id":"D","text":"ได้ทุก branch ของ remote เป็น local branch พร้อมใช้งานทั้งหมดทันทีหลังรันคำสั่งเสร็จ","correct":false,"why":"โดยปกติ clone สร้าง local branch เฉพาะ branch หลัก ส่วน branch อื่นปรากฏเป็น remote-tracking branch เช่น origin/develop"}],"explanation":"git clone คือจุดเริ่มทำงานกับ repository ที่มีอยู่แล้ว ได้ประวัติครบและ remote ชื่อ origin ที่ใช้กับ fetch, pull และ push ต่อไป เมื่อต้องการทำงานบน branch อื่นให้ checkout จาก origin/ชื่อ branch นั้น"},{"id":"ENG-J-E-002","level":"junior","pool":"exam","competency":"Git","descriptor":"GIT-J2","concept":"git-revert-pushed-commit","mobile":false,"type":"single","stem":"commit ที่แก้โค้ดคิดโปรโมชันแฟลชเซลถูก push เข้า main และเพื่อนร่วมทีมดึงไปใช้แล้วหลายคน เพิ่งพบว่า commit นั้นทำให้ราคาผิด ควรย้อนการเปลี่ยนแปลงอย่างไรจึงปลอดภัยต่อทีมที่สุด","options":[{"id":"A","text":"รัน git reset --hard ไปก่อน commit นั้น แล้ว git push --force","correct":false,"why":"การเขียนประวัติของ branch ที่แชร์ใหม่ทำให้ประวัติของเพื่อนที่ดึงไปแล้วไม่ตรงกับ remote และ commit ใหม่ของเขาอาจหายหรือเกิด conflict"},{"id":"B","text":"สร้าง branch ใหม่จาก commit ก่อนหน้า ลบ main เดิมบน remote แล้วตั้ง branch ใหม่เป็น main แทน","correct":false,"why":"ผลไม่ต่างจากการเขียนประวัติใหม่ ทุกคนที่ดึง main เดิมไปแล้วต้องจัดการประวัติที่แตกต่างกันเอง"},{"id":"C","text":"ลบไฟล์ที่ commit นั้นแก้ออกจาก repository ทั้งหมด แล้ว commit การลบ","correct":false,"why":"ทำให้สูญเสียโค้ดส่วนอื่นในไฟล์เหล่านั้นด้วย ซึ่งไม่เกี่ยวกับบั๊ก และไม่ใช่การย้อนเฉพาะการเปลี่ยนแปลงที่ผิด"},{"id":"D","text":"ใช้ git revert กับ commit นั้นเพื่อสร้าง commit ใหม่ที่ย้อนผลของมัน แล้ว push ตามปกติ","correct":true,"why":"ถูกต้อง revert เพิ่ม commit ใหม่เข้าไปในประวัติโดยไม่แก้ของเดิม จึงปลอดภัยกับทุกคนที่ดึงไปแล้ว"}],"explanation":"กับ branch ที่แชร์กันแล้ว ให้แก้ด้วยการเพิ่มประวัติ ไม่ใช่เขียนประวัติใหม่ git revert จึงเป็นวิธีมาตรฐานในการยกเลิกผลของ commit ที่ push แล้ว ส่วน reset แล้ว force push เหมาะกับ branch ส่วนตัวที่ยังไม่มีใครดึงไปใช้เท่านั้น"},{"id":"ENG-J-E-003","level":"junior","pool":"exam","competency":"Git","descriptor":"GIT-J2","concept":"git-merge-commit-two-parents","mobile":false,"type":"multiple","stem":"main มี commit ใหม่จากเพื่อนหลังจากคุณแตก branch feature ออกไป ต่อมาคุณอยู่บน main แล้วรัน git merge feature และไม่เกิด conflict ข้อใดเป็นผลที่เกิดขึ้นจริงบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"Git สร้าง merge commit ใหม่ที่มี parent สองตัว คือปลายของ main และปลายของ feature","correct":true,"why":"ถูกต้อง เมื่อสองฝั่งต่างมี commit ใหม่ Git จะรวมด้วย merge commit ที่เชื่อมประวัติทั้งสองสายเข้าด้วยกัน"},{"id":"B","text":"commit ของ feature ถูกเขียนใหม่ให้มี hash ใหม่ต่อท้ายปลายของ main","correct":false,"why":"การเขียน commit ใหม่ให้ต่อท้ายคือพฤติกรรมของ rebase ไม่ใช่ merge ซึ่งคง commit เดิมไว้"},{"id":"C","text":"branch feature ถูกลบออกโดยอัตโนมัติเมื่อ merge สำเร็จ","correct":false,"why":"git merge ไม่ลบ branch ที่ถูกนำมารวม ต้องสั่งลบเอง (หรือใช้ตัวเลือกลบ branch ของแพลตฟอร์มตอน merge PR)"},{"id":"D","text":"commit เดิมของทั้งสอง branch ยังอยู่ในประวัติด้วย hash เดิม","correct":true,"why":"ถูกต้อง merge ไม่แก้ commit ที่มีอยู่ ประวัติของแต่ละสายจึงยังตรวจย้อนได้ครบ"}],"explanation":"merge รวมสองสายประวัติโดยเพิ่ม merge commit ที่มี parent สองตัว ไม่แตะ commit เดิม ข้อดีคือประวัติตรงกับความเป็นจริงและปลอดภัยกับ branch ที่แชร์กัน ส่วนข้อเสียคือประวัติอาจดูแตกแขนง"},{"id":"ENG-J-E-004","level":"junior","pool":"exam","competency":"Git","descriptor":"GIT-J3","concept":"git-pr-address-review-comments","mobile":false,"type":"single","stem":"reviewer เขียนคอมเมนต์ใน pull request ให้แก้ 2 จุดก่อนจะอนุมัติ ผู้เขียนควรทำอย่างไรเพื่อให้การ review ดำเนินต่อได้เหมาะสม","options":[{"id":"A","text":"แก้โค้ดแล้ว push เพิ่มบน branch เดิม PR จะอัปเดตเอง แล้วตอบคอมเมนต์ว่าแก้แล้ว","correct":true,"why":"ถูกต้อง PR ผูกกับ branch จึงแสดง commit ใหม่ทันที และ reviewer เห็นการแก้เทียบกับคอมเมนต์เดิมได้ในที่เดียว"},{"id":"B","text":"ปิด PR นี้ แล้วเปิด PR ใหม่ด้วย branch ใหม่ที่มีโค้ดซึ่งแก้ตามคอมเมนต์แล้วทั้งหมด","correct":false,"why":"ประวัติคอมเมนต์และการพูดคุยของ PR เดิมจะแยกจากงานใหม่ reviewer ต้องไล่ตามหาว่าจุดไหนแก้แล้วบ้าง"},{"id":"C","text":"merge PR เข้า main ไปก่อน เพื่อไม่ให้งานช้า แล้วค่อยแก้ตามคอมเมนต์ใน PR ถัดไป","correct":false,"why":"โค้ดที่ reviewer ขอให้แก้เข้าไปอยู่ใน main แล้ว และอาจถูก deploy ไปก่อนจะแก้"},{"id":"D","text":"แก้โค้ดบน main โดยตรง แล้วแจ้ง reviewer ให้ไปดูผลที่ main","correct":false,"why":"ข้ามกระบวนการ review และนำการเปลี่ยนแปลงที่ยังไม่ได้รับอนุมัติเข้า branch หลัก"}],"explanation":"กระบวนการ pull request คือวนระหว่างเขียน รับคอมเมนต์ แก้ และให้ reviewer ยืนยัน โดยทำบน branch เดียวกันจนกว่าจะอนุมัติ การตอบคอมเมนต์ทีละข้อช่วยให้ reviewer ตรวจต่อได้เร็ว และประวัติทั้งหมดอยู่ใน PR เดียว"},{"id":"ENG-J-E-005","level":"junior","pool":"exam","competency":"Git","descriptor":"GIT-J3","concept":"git-pr-checklist-before-open","mobile":false,"type":"multiple","stem":"ก่อนเปิด pull request เข้า branch develop ข้อใดเป็นสิ่งที่ผู้เขียนควรทำบ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"อ่าน diff ของตัวเองก่อน เพื่อตรวจว่ามีเฉพาะการเปลี่ยนแปลงที่ตั้งใจ ไม่มี debug log หรือค่าลับติดมา","correct":tr
