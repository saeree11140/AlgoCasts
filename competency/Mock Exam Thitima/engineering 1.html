 เพิ่ม nesting, mixin, function, partial/module (`@use`) ช่วยจัดระเบียบ CSS; CSS สมัยใหม่รองรับ nesting และ custom properties เอง ลดความจำเป็นของ preprocessor บางส่วน","Layout และ responsive: Flexbox (มิติเดียว), Grid (สองมิติ), media query, container query, `prefers-color-scheme`/`prefers-reduced-motion`; จัดการ specificity และใช้ naming ที่สม่ำเสมอ (เช่น BEM) หลีกเลี่ยง `!important`","PWA ประกอบด้วย Web App Manifest, service worker และ HTTPS; service worker มีวงจร install -> activate -> fetch และทำหน้าที่ proxy ระหว่างหน้าเว็บกับเครือข่าย","กลยุทธ์ cache: cache-first (asset คงที่/app shell), network-first (ข้อมูลที่ต้องสด), stale-while-revalidate (ให้ของเก่าทันทีแล้วอัปเดตเบื้องหลัง); ต้องมีขั้นตอนเปลี่ยนเวอร์ชัน cache เพื่อไม่ให้ผู้ใช้ค้างไฟล์เก่า","Offline write: เก็บคำขอลงคิว (IndexedDB) แล้วส่งเมื่อกลับมาออนไลน์ (Background Sync API ช่วยได้แต่ไม่รองรับทุกเบราว์เซอร์ จึงต้องมี fallback เช่นส่งเมื่อ `online` event หรือเปิดแอปใหม่)","XSS คือการแทรก script ที่รันใน origin ของเรา (stored/reflected/DOM-based) ป้องกันด้วย output encoding ตามบริบท, หลีกเลี่ยง `innerHTML`/`dangerouslySetInnerHTML`/`eval`, sanitize HTML ที่จำเป็นต้องแสดงด้วยไลบรารี (เช่น DOMPurify), และตั้ง Content-Security-Policy; framework อย่าง React escape ข้อความให้โดยค่าเริ่มต้น","CSRF คือเว็บอื่นทำให้เบราว์เซอร์ผู้ใช้ส่งคำขอที่แนบ cookie ไปยังเว็บเราโดยอัตโนมัติ ป้องกันด้วย `SameSite` cookie (Lax/Strict), anti-CSRF token, ตรวจ `Origin`/`Referer` และไม่ใช้ GET ทำการเปลี่ยนแปลง","ที่เก็บ token ใน SPA: `localStorage` ถูกขโมยได้ถ้ามี XSS; cookie แบบ `HttpOnly; Secure; SameSite` ป้องกัน JS อ่านได้แต่ต้องป้องกัน CSRF เพิ่ม; token ใน header `Authorization` ที่ JS แนบเองไม่ถูกส่งอัตโนมัติจึงไม่เสี่ยง CSRF แต่เสี่ยง XSS ไม่มีตัวเลือกใดปลอดภัยโดยไม่มี trade-off"],"examFocus":["ถ้าต้องสลับธีมสว่าง/มืดโดยไม่ rebuild CSS และไม่โหลดไฟล์ใหม่ ให้ใช้ CSS custom properties","ถ้าเว็บต้องเปิดได้ตอนออฟไลน์ ให้ใช้ service worker cache app shell แล้วเลือก strategy ตามชนิดข้อมูล","ถ้าโจทย์ถามที่เก็บ access token ของ SPA ให้ชั่งน้ำหนัก XSS (localStorage) กับ CSRF (cookie) และบอกมาตรการเสริม (CSP, SameSite, HttpOnly)","ถ้าแสดง HTML ที่ผู้ใช้กรอก ให้ sanitize และใช้ CSP ไม่ใช่แค่ตรวจฝั่ง client","ถ้า API ใช้ cookie session และมีฟอร์มจากเว็บอื่นยิงเข้ามาได้ ให้ใช้ SameSite/anti-CSRF token"],"pitfalls":["คิดว่า Sass variables เปลี่ยนค่าตอน runtime ได้","คิดว่า HttpOnly cookie แก้ได้ทั้ง XSS และ CSRF: กัน JS อ่าน token แต่ XSS ยังสั่งทำรายการในนามผู้ใช้ได้ และ CSRF ต้องแก้แยก","cache-first กับ API ข้อมูลสด ทำให้ผู้ใช้เห็นข้อมูลเก่าตลอด","sanitize ที่ฝั่ง client อย่างเดียวแล้วเชื่อว่าปลอดภัย"],"example":{"lang":"css","code":"/* ธีมเปลี่ยนที่ runtime ด้วย custom properties */\n:root {\n  --bg: #ffffff;\n  --text: #1a1a1a;\n}\n[data-theme='dark'] {\n  --bg: #121212;\n  --text: #f2f2f2;\n}\nbody {\n  background: var(--bg);\n  color: var(--text);\n}"}},{"descriptor":"WEB-S4","competency":"Web & Mobile Development","title":"Design API: REST/GraphQL, layered, security","summary":"ออกแบบ API ที่แบ่งชั้นชัดเจน ดึงข้อมูลได้ยืดหยุ่นแต่ปลอดภัยและคาดการณ์ภาระได้ ครอบคลุม pagination, authentication/authorization และการป้องกันการใช้งานเกินขอบเขต","keyPoints":["Layered architecture: Controller (รับ HTTP, validate input, map เป็น DTO, คืน status code), Service (business logic, transaction), Repository (เข้าถึงข้อมูล); การพึ่งพาไหลลงล่างเท่านั้น ไม่ให้ controller เรียก DB ตรงหรือ service รู้เรื่อง HTTP","ใช้ DTO/schema validation (เช่น JSON Schema, Zod, class-validator) ที่ขอบระบบ และใช้ parameterized query/ORM แทนการต่อ string กัน SQL injection; sanitize/escape ข้อมูลตามปลายทางการใช้","Offset pagination (`?page=&limit=`) ง่ายแต่ช้าเมื่อลึกและข้อมูลอาจข้าม/ซ้ำเมื่อมีรายการใหม่แทรกระหว่างอ่าน; cursor pagination ใช้ opaque cursor ที่อ้างตำแหน่งจริง (เช่น created_at + id) จึงเหมาะกับ feed ที่เปลี่ยนตลอด ต้องเรียงด้วยคีย์ที่ไม่ซ้ำ (tie-breaker) และส่ง `nextCursor` กลับ","การกรอง/เรียงลำดับ: whitelist ฟิลด์ที่อนุญาตให้ filter/sort, จำกัด `limit` สูงสุด เพื่อไม่ให้ลูกค้าสั่งงานหนักเกินไป","GraphQL ปล่อยให้ client ระบุฟิลด์เอง จึงต้องป้องกัน query ที่หนักเกิน: จำกัด depth, วิเคราะห์ query complexity/cost, จำกัด pagination size, timeout, และ persisted query/allowlist สำหรับแอปมือถือที่รู้ query ล่วงหน้า; แก้ปัญหา N+1 ด้วย DataLoader/batching","Rate limiting: อัลกอริทึม token bucket (รองรับ burst), leaky bucket, fixed window, sliding window; ตอบ `429 Too Many Requests` พร้อม `Retry-After`","การเลือก key ของ rate limit: IP อย่างเดียวไม่เป็นธรรมเมื่อผู้ใช้จำนวนมากใช้ IP ร่วมกัน (CGNAT ของเครือข่ายมือถือ, office NAT) จึงควรใช้ identity ที่ยืนยันแล้ว (user id/API key/client id) เป็นหลัก และใช้ IP เป็นชั้นเสริมสำหรับคำขอที่ยังไม่ login พร้อมเพดานที่ผ่อนปรนกว่า","OAuth2: SPA และมือถือ (public client) ควรใช้ Authorization Code flow + PKCE ไม่ใช้ implicit flow; Access token อายุสั้น + refresh token (ทำ rotation); scope จำกัดสิทธิ์","JWT: ตรวจลายเซ็นด้วย algorithm ที่กำหนดฝั่งเซิร์ฟเวอร์ และตรวจ `exp`, `iss`, `aud`; payload ไม่ได้เข้ารหัส (แค่ encode) จึงห้ามใส่ความลับ; เพิกถอนยากจึงใช้อายุสั้น","แยก 401 (ยังไม่ยืนยันตัวตน) กับ 403 (ยืนยันแล้วแต่ไม่มีสิทธิ์), 400/422 สำหรับ input ไม่ถูกต้อง, 404, 409 สำหรับ conflict"],"examFocus":["ถ้า feed แบบเลื่อนไม่สิ้นสุดมีรายการซ้ำ/ตกหล่นเมื่อมีโพสต์ใหม่ ให้เปลี่ยนจาก offset เป็น cursor pagination","ถ้าผู้ใช้มือถือหลายคนถูก rate limit พร้อมกันเพราะใช้ IP เดียวกัน ให้เปลี่ยน key เป็น identity ที่ยืนยันแล้ว","ถ้า GraphQL endpoint ถูกยิง query ซ้อนลึกจนเซิร์ฟเวอร์ช้า ให้จำกัด depth/complexity และใช้ persisted query","ถ้า controller มี business logic และ SQL ปนกัน ให้แยกชั้นตาม controller-service-repository","ถ้าแอปมือถือ/SPA ต้อง login ผ่าน OAuth2 ให้เลือก Authorization Code + PKCE"],"pitfalls":["ใช้ offset pagination กับ feed ที่เปลี่ยนตลอดเวลา","จำกัด rate ด้วย IP อย่างเดียวหรือเชื่อ `X-Forwarded-For` ที่ client ปลอมได้โดยไม่ผ่าน proxy ที่เชื่อถือ","เชื่อ payload ของ JWT โดยไม่ตรวจลายเซ็นและ claims","เก็บ client secret ในแอปมือถือ/SPA ซึ่งถอดออกมาได้"],"example":{"lang":"sql","code":"-- cursor pagination: cursor = (created_at, id) ของรายการสุดท้ายในหน้าก่อน\nSELECT id, created_at, body\nFROM posts\nWHERE (created_at, id) < ($1, $2)\nORDER BY created_at DESC, id DESC\nLIMIT 21;  -- ขอเกิน 1 แถวเพื่อรู้ว่ามีหน้าถัดไปหรือไม่"}},{"descriptor":"WEB-S5","competency":"Web & Mobile Development","title":"API versioning, deprecation และการนำทีม","summary":"เปลี่ยน API โดยไม่ทำให้ client เดิมพัง โดยเฉพาะแอปมือถือเวอร์ชันเก่าและพาร์ทเนอร์ที่เราควบคุมไม่ได้ พร้อมตัดสินใจเชิงสถาปัตยกรรมอย่างมีหลักฐาน","keyPoints":["Non-breaking (ทำได้ใน version เดิม): เพิ่ม field ใหม่ในผลลัพธ์, เพิ่ม endpoint, เพิ่ม query param ที่ optional; Breaking: ลบ/เปลี่ยนชื่อ field, เปลี่ยนชนิดข้อมูล, ทำ field ที่ optional ให้ required, เปลี่ยนความหมาย/ status code, เข้มงวด validation กว่าเดิม","Client ควรเป็น tolerant reader (เพิกเฉยต่อ field ที่ไม่รู้จัก) และ server ควรยึดหลัก 'additive change' เพื่อลดความจำเป็นต้องออก version ใหม่","วิธีทำ versioning: ใน path (`/v1/orders`), header/media type (`Accept: application/vnd.example.v2+json`), query param; path ง่ายและเห็นชัด ส่วน header สะอาดกว่าแต่ debug/cache ยากกว่า","แอปมือถือ: ผู้ใช้ไม่อัปเดตตามทันที จึงมีเวอร์ชันเก่าใช้งานพร้อมกันเป็นเดือนหรือเป็นปี ต้องให้ API เวอร์ชันเก่ายังทำงานตามระยะเวลาที่ตกลง, วัดสัดส่วนผู้ใช้ต่อเวอร์ชันแอป/API, ส่ง header เวอร์ชันแอปมาด้วย, และมีกลไก minimum supported version / force update สำหรับกรณีจำเป็น","Deprecation lifecycle: ประกาศ -> ระบุวันที่ Sunset -> ให้ migration guide -> เฝ้าดูการใช้งานรายผู้ใช้/พาร์ทเนอร์ -> ติดต่อรายที่ยังใช้ -> ปิดจริง; ใช้ response header `Deprecation` (RFC 9745) และ `Sunset` (RFC 8594) บอกกลไกอัตโนมัติ","ก่อนปิดอาจทำ brownout (ปิดชั่วคราวเป็นช่วงสั้นๆ) เพื่อให้ผู้ที่ไม่อ่านประกาศรู้ตัว แล้วหลัง sunset ตอบ `410 Gone` หรือ error ที่ชัดเจน","ตัวสัญญา: เขียน contract ด้วย OpenAPI/GraphQL schema, ตรวจ breaking change อัตโนมัติใน CI, ทำ contract test กับ consumer สำคัญ","การตัดสินใจเชิงสถาปัตยกรรม: บันทึกเป็น ADR (Architecture Decision Record) ที่ระบุบริบท ตัวเลือก trade-off และเหตุผล; ใช้ design review/RFC ให้ทีมมีส่วนร่วมและตรวจสอบย้อนหลังได้","การนำทีม: ตั้ง coding/API guideline ร่วมกัน, review ที่ตัดสินด้วยข้อมูล, แบ่งงานตามขอบเขตความรับผิดชอบ, จัดการ technical debt อย่างโปร่งใสด้วยลำดับความสำคัญ"],"examFocus":["ถ้าต้องเปลี่ยนชื่อ field ที่แอปมือถือเวอร์ชันเก่ายังใช้ ให้คง field เดิมไว้ (เพิ่มของใหม่คู่กัน) หรือออก version ใหม่ แล้ว deprecate ตามกำหนด ไม่ใช่เปลี่ยนทันที","ถ้าพาร์ทเนอร์หลายรายยังเรียก endpoint เก่าที่จะเลิก ให้ประกาศ timeline, วัดการใช้งานรายพาร์ทเนอร์, ติดต่อโดยตรง, ใช้ Sunset header และ brownout ก่อนปิด","ถ้าถามว่าการเปลี่ยนแบบใดต้องขึ้น major version ให้ดูว่าทำให้ client ที่ถูกต้องตามสัญญาเดิมพังหรือไม่","ถ้าทีมเห็นต่างเรื่องสถาปัตยกรรม ให้ใช้ ADR/design review เปรียบเทียบ trade-off ตามข้อกำหนดและต้นทุน","ถ้าต้องบังคับให้ผู้ใช้เวอร์ชันเก่ามาก (มีช่องโหว่) อัปเดต ให้ใช้ minimum version + force update ที่แจ้งผู้ใช้ชัดเจน"],"pitfalls":["คิดว่าการเพิ่ม field เป็น breaking change เสมอ (ส่วนใหญ่ไม่ใช่ถ้า client เป็น tolerant reader)","ปิด API เวอร์ชันเก่าตามกำหนดภายในโดยไม่ดูว่ามี client ใช้งานอยู่เท่าไร","ออก version ใหม่ทุกครั้งที่แก้เล็กน้อย จนต้องดูแลหลายเวอร์ชันเกินกำลัง","ตัดสินใจสถาปัตยกรรมโดยไม่บันทึกเหตุผล ทำให้ทีมใหม่ตามไม่ทัน"]},{"descriptor":"TST-S1","competency":"Unit & Functional Testing","title":"Coverage threshold และ SonarQube quality gate","summary":"ตั้งและรายงานเกณฑ์ coverage อย่างมีความหมาย โดยเข้าใจว่าตัวเลข coverage วัดอะไรได้และวัดอะไรไม่ได้ เพื่อใช้เป็นประตูคุณภาพโดยไม่เกิดการเล่นตัวเลข","keyPoints":["Line coverage วัดว่าบรรทัดถูกรันหรือไม่; branch (condition) coverage วัดว่าทุกทางของ `if`/`switch` ถูกรันหรือไม่ จึงเข้มกว่า; coverage บอกว่าโค้ดถูก 'รัน' ไม่ได้บอกว่าถูกตรวจสอบ","Coverage สูงไม่เท่ากับคุณภาพ: test ที่ไม่มี assertion หรือ assert อ่อนก็เพิ่ม coverage ได้ จึงต้องดูร่วมกับคุณภาพ assertion (เช่น mutation testing) และ test ที่ครอบคลุม edge case","SonarQube/SonarCloud ไม่ได้รัน test เอง: test runner สร้างรายงาน coverage (JaCoCo สำหรับ Java, lcov/Istanbul สำหรับ JS/TS, Cobertura/coverage.xml สำหรับ Python/.NET) แล้วชี้ให้ Sonar นำเข้า เช่น `sonar.javascript.lcov.reportPaths`","Quality Gate คือชุดเงื่อนไขผ่าน/ไม่ผ่านที่ตรวจหลัง analysis; gate ค่าเริ่มต้น 'Sonar way' เน้น 'new code' เช่น coverage บน new code อย่างน้อย 80%, duplication บน new code ไม่เกิน 3%, ไม่มี issue ใหม่ (new issues = 0) และ security hotspot ใหม่ต้องถูก review ครบ 100% (เวอร์ชันเก่าใช้เงื่อนไข rating A ของ reliability/security/maintainability แทนเรื่อง issue)","แนวคิด Clean as You Code: บังคับมาตรฐานกับโค้ดที่เพิ่ม/แก้ใหม่ (new code period เช่นตั้งแต่ release ก่อนหน้า, N วัน หรือเทียบ branch อ้างอิง) เพื่อไม่ให้ legacy ทำให้ gate ล้มทั้งหมดแต่ไม่ให้หนี้ใหม่เพิ่ม","ผูก Quality Gate กับ CI/PR: gate ไม่ผ่านให้ block merge (PR decoration/status check) เพื่อให้เกณฑ์มีผลจริง","Coverage exclusions ที่ชอบธรรม: โค้ดที่สร้างอัตโนมัติ, DTO/model ที่ไม่มี logic, config, migration, bootstrap/main (`sonar.coverage.exclusions`); การยกเว้นโค้ด business logic ที่ทดสอบยากเพื่อให้ตัวเลขผ่านเป็นการเล่นตัวเลข","ตั้งเกณฑ์ตามความเสี่ยง: โมดูลหลักสำคัญ (payment, auth) ควรเข้มกว่า; เกณฑ์ที่สูงแบบเหมารวมทำให้เกิด test คุณภาพต่ำเพื่อไล่ตัวเลข","รายงานให้ทีมเห็นแนวโน้ม (trend) และ coverage ของ new code ใน PR ไม่ใช่แค่ตัวเลขรวมทั้ง repo"],"examFocus":["ถ้า repo เก่ามี coverage รวมต่ำ 30% แต่ต้องการกันไม่ให้แย่ลง ให้ตั้ง quality gate บน new code (เช่น 80%) แทนบังคับ 80% รวมทั้งระบบทันที","ถ้า coverage ถึงเกณฑ์แล้วแต่บั๊กยังหลุด ให้ตอบเรื่อง assertion อ่อน/ขาด branch/edge case ไม่ใช่เพิ่ม coverage อย่างเดียว","ถ้าทีมอยากยกเว้นไฟล์จาก coverage ให้ตัดสินว่าเป็น generated/config/ไม่มี logic (ชอบธรรม) หรือเป็น logic ที่แค่ทดสอบยาก (ไม่ควร)","ถ้า Sonar แสดง coverage 0% ทั้งที่มี test ให้ตรวจว่าสร้างรายงานและตั้ง path ของรายงานถูกต้องและรายงานตรงกับ source path","ถ้าต้องบังคับมาตรฐานใน PR ให้ผูก quality gate เป็น required check"],"pitfalls":["เชื่อว่า 100% coverage = ไม่มีบั๊ก","เขียน test ที่เรียกโค้ดแต่ไม่ assert เพื่อให้ gate ผ่าน","ตั้ง threshold ทั้ง repo สูงทันทีกับ legacy ทำให้ทีมถูกบล็อกและหันไปหาทางลัด","คิดว่า SonarQube รัน unit test ให้เอง"]},{"descriptor":"TST-S2","competency":"Unit & Functional Testing","title":"หาและปิด gap ของ test coverage","summary":"ตัดสินใจว่าจะเติม test ตรงไหนก่อนโดยดูความเสี่ยงและคุณภาพของ assertion ไม่ใช่ไล่ตัวเลข coverage ให้ครบทุกบรรทัด","keyPoints":["จัดลำดับตามความเสี่ยง: เส้นทางที่ผลกระทบสูง (payment, auth, ข้อมูลผู้ใช้), โค้ดที่เปลี่ยนบ่อย, โค้ดที่เคยมีบั๊ก, logic ซับซ้อน ก่อนโค้ดที่ง่ายหรือไม่มีผลกระทบ","อ่านรายงาน coverage ระดับ branch เพื่อหา condition/else/exception path ที่ไม่เคยถูกรัน ไม่ใช่ดูแค่ตัวเลขรวม","Boundary value analysis: ทดสอบที่ขอบของช่วงค่า (min, max, ก่อน/หลังขอบหนึ่งหน่วย เช่น 0, 1, limit-1, limit, limit+1) และ equivalence partitioning เลือกตัวแทนจากแต่ละกลุ่มที่พฤติกรรมเหมือนกัน","Table-driven/parameterized test (`it.each`, `@ParameterizedTest`, pytest `parametrize`) ครอบคลุมหลาย input ด้วยโครงเดียว อ่านง่ายและเติม case ได้ง่าย","ทดสอบ negative/error path ด้วย: input ผิดรูปแบบ, null/ว่าง, timeout, dependency ล้มเหลว, exception ที่คาดไว้","Mutation testing (เช่น Stryker สำหรับ JS/TS, PIT สำหรับ Java) แก้โค้ดเล็กน้อยโดยอัตโนมัติ (mutant) แล้วดูว่า test จับได้ไหม; mutant ที่ survive บ่งว่า assertion อ่อนหรือขาด case ไม่ใช่ว่าโค้ดผิด; mutation score ใช้ประเมินคุณภาพ test","มือถือ: ต้องทดสอบเส้นทางที่ผู้ใช้ปฏิเสธ permission (กล้อง, ตำแหน่ง, แจ้งเตือน), 'ไม่ถามอีก' และเปลี่ยนใน Settings, เครือข่ายหลุด, พื้นที่เต็ม, แอปถูก kill","Device matrix: เลือกอุปกรณ์/OS/ขนาดหน้าจอที่ทดสอบจากข้อมูล analytics ของผู้ใช้จริง (กลุ่มที่ใช้เยอะ + กลุ่มเสี่ยงอย่างเครื่องต่ำ/OS เก่าที่ยังรองรับ) ไม่ใช่ทดสอบทุกรุ่นหรือเลือกตามความสะดวก","ไม่ต้องไล่ 100%: ค่าตอบแทนลดลงเมื่อ coverage สูงขึ้น ใช้เวลากับ test ที่ลดความเสี่ยงได้มากสุด"],"examFocus":["ถ้ามีเวลาจำกัดและโมดูลหลายตัว coverage ต่ำ ให้เริ่มจากโมดูลที่เสี่ยงสูงสุดและเปลี่ยนบ่อย","ถ้า test ผ่านหมดแต่ mutation score ต่ำ ให้ปรับ assertion และเพิ่ม case ที่ฆ่า mutant ที่ survive","ถ้าฟังก์ชันตรวจเงื่อนไขตัวเลข/วันที่ ให้ออกแบบ boundary test แบบ table-driven","ถ้าแอปมือถือขอ permission ให้มี test กรณี denied และ permanently denied ด้วย","ถ้าต้องเลือกอุปกรณ์ทดสอบ ให้ใช้ข้อมูล analytics ของฐานผู้ใช้"],"pitfalls":["เติม test ที่ง่ายที่สุดเพื่อดันเปอร์เซ็นต์ โดยละเลยโค้ดเสี่ยง","ทดสอบเฉพาะ happy path","คิดว่า mutant ที่ survive หมายถึงโค้ดหลักมีบั๊ก (จริงๆ หมายถึง test ตรวจไม่ถึง)","ทดสอบบน emulator รุ่นล่าสุดตัวเดียวแล้วสรุปว่าครอบคลุมผู้ใช้"],"example":{"lang":"typescript","code":"// boundary + table-driven: ส่วนลดเมื่อซื้อครบ 1000\ndescribe('discount', () => {\n  it.each([\n    [999.99, 0],\n    [1000, 100],\n    [1000.01, 100.001],\n    [0, 0],\n  ])('amount %p -> discount %p', (amount, expected) => {\n    expect(calcDiscount(amount)).toBeCloseTo(expected);\n  });\n\n  it('rejects negative amount', () => {\n    expect(() => calcDiscount(-1)).toThrow();\n  });\n});"}},{"descriptor":"TST-S3","competency":"Unit & Functional Testing","title":"Mocking/stubbing dependency ภายนอก","summary":"แยก unit ที่ทดสอบออกจาก dependency ที่ช้า ไม่เสถียร หรือมีผลข้างเคียง (เครือข่าย เวลา payment) อย่างพอดี โดยไม่ให้ test หลุดจากความจริงของระบบ","keyPoints":["Test double ชนิดต่างๆ: dummy (เติม parameter), stub (คืนค่าที่กำหนดไว้), spy (บันทึกการเรียก), mock (ตั้งความคาดหวังและตรวจ interaction), fake (implementation ง่ายที่ใช้งานได้จริง เช่น in-memory repository)","ใช้ stub เมื่อสนใจ 'ผลลัพธ์' และ mock/spy เมื่อสนใจว่า 'ถูกเรียกอย่างไร'; การ verify interaction มากเกินไปทำให้ test ผูกกับ implementation และพังเมื่อ refactor","Mock เฉพาะ boundary ที่เราคุมได้: ห่อ SDK/ไลบรารีภายนอกด้วย adapter ของเรา แล้ว mock adapter นั้น แทนที่จะ mock type ของ third-party โดยตรง (don't mock what you don't own)","Dependency Injection ทำให้สลับ dependency จริงเป็น double ได้ง่าย; โค้ดที่สร้าง dependency เองข้างใน (`new HttpClient()`) ทดสอบยาก","เวลา: แยกการอ่านเวลาออกเป็น `Clock` ที่ inject ได้ หรือใช้ fake timer (`jest.useFakeTimers()` ฯลฯ) เพื่อทดสอบ timeout/session expiry/retry แบบกำหนดผลได้ ไม่ใช้ `sleep` จริงที่ช้าและ flaky","ทำให้ test เป็น deterministic: ควบคุมแหล่งความไม่แน่นอน (เวลา, random, locale/timezone, ลำดับ async, network, ข้อมูลเริ่มต้น) โดยตรึงหรือ seed ค่า","UI/mobile test ที่เสถียร: ใช้ข้อมูลทดสอบคงที่, mock หรือ stub network, ปิด/ลดความสำคัญของ animation, ตั้ง locale/timezone/ธีมให้คงที่, รอ condition แทน sleep","Payment SDK บนมือถือ: ใน unit/UI test ให้ stub ผ่าน interface ของเรา (ไม่เรียกระบบจริงและไม่ตัดเงิน) และแยก test กับ sandbox/test mode ของผู้ให้บริการสำหรับ integration","Stub drift: stub/mocked response ค่อยๆ ไม่ตรงกับพฤติกรรมจริงของ service เมื่อ service เปลี่ยน test จึงผ่านแต่ production พัง; ลดด้วย contract test (เช่น consumer-driven contracts อย่าง Pact), บันทึก response จริงมาใช้ใหม่เป็นระยะ และมี integration test บางส่วนกับ sandbox"],"examFocus":["ถ้า test เรียก API ภายนอกจริงแล้วช้า/ไม่เสถียร ให้ฉีด stub/fake ที่ boundary แล้วเก็บ integration test จำนวนน้อยแยกไว้","ถ้าต้องทดสอบ session timeout 30 นาที ให้ใช้ fake clock/inject Clock ไม่ใช่รอจริง","ถ้า test ผ่านแต่ production ล้มหลัง service ปลายทางเปลี่ยน schema ให้ชี้ stub drift และเสนอ contract test","ถ้า UI test บนมือถือ flaky ให้ตรวจแหล่ง non-determinism: network, animation, เวลา, ข้อมูล, locale","ถ้าถามว่าควร mock อะไร: dependency ที่ช้า ไม่แน่นอน มีผลข้างเคียงหรือแพง ไม่ใช่ logic ภายในที่กำลังทดสอบ"],"pitfalls":["mock ทุกอย่างจน test เหลือแค่ตรวจว่า mock ถูกเรียก ไม่ได้ทดสอบพฤติกรรมจริง","mock type ของ third-party ตรงๆ ทำให้ test ผูกกับ API ภายนอกและพังเมื่อ upgrade","ใช้ `sleep` รอเวลาจริงใน test","ปล่อย stub ค้างไม่อัปเดตเมื่อ contract จริงเปลี่ยน"],"example":{"lang":"typescript","code":"jest.useFakeTimers();\n\nit('expires session after 30 minutes idle', () => {\n  const session = createSession(Date.now());\n\n  jest.advanceTimersByTime(29 * 60 * 1000);\n  expect(session.isActive()).toBe(true);\n\n  jest.advanceTimersByTime(2 * 60 * 1000);\n  expect(session.isActive()).toBe(false);\n});"}}]}}</script>
<script>
/*
 * Scoring for one question. Pure function, no DOM, no Node-only APIs.
 * Loaded as a classic script in the browser (exposes window.ExamScoring)
 * and via require() from Node tests (module.exports).
 *
 * Rules (see the scoring table in the project context):
 *  - nothing selected                      -> 0
 *  - more options selected than correct    -> negative ? -penalty : 0
 *    (this overrides any partial credit)
 *  - otherwise                             -> right * max / k
 *                                             minus (negative only) wrong * penalty / k
 *    where k is the number of correct options.
 */
(function (root) {
  'use strict';

  function unique(list) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var key = String(list[i]);
      if (!seen[key]) {
        seen[key] = true;
        out.push(key);
      }
    }
    return out;
  }

  function clean(n) {
    // remove float noise and negative zero
    return Math.round(n * 1e6) / 1e6 + 0;
  }

  function scoreQuestion(question, selectedOptionIds, options) {
    var opts = options || {};
    var negative = Boolean(opts.negative);
    var max = opts.max === undefined ? 5 : opts.max;
    var penalty = opts.penalty === undefined ? 1 : opts.penalty;

    var correctIds = [];
    for (var i = 0; i < question.options.length; i++) {
      if (question.options[i].correct) correctIds.push(String(question.options[i].id));
    }
    var k = correctIds.length;
    if (k === 0) throw new Error('question ' + question.id + ' has no correct option');

    var selected = unique(selectedOptionIds || []);
    if (selected.length === 0) return 0;

    if (selected.length > k) return clean(negative ? -penalty : 0);

    var right = 0;
    for (var j = 0; j < selected.length; j++) {
      if (correctIds.indexOf(selected[j]) !== -1) right++;
    }
    var wrong = selected.length - right;

    var score = (right * max) / k;
    if (negative) score -= (wrong * penalty) / k;
    return clean(score);
  }

  var api = { scoreQuestion: scoreQuestion };
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.ExamScoring = api;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/*
 * Exam practice page. Classic script, inlined by build.mjs after scoring.js.
 * All text from question data is written with textContent / text nodes only.
 * No persistence, no network.
 */
(function () {
  'use strict';

  var Scoring = window.ExamScoring;
  var DATA = JSON.parse(document.getElementById('exam-data').textContent);
  var root = document.getElementById('app');

  var MAX = DATA.scorePerQuestion;
  var LEVEL_LABEL = { junior: 'Junior', senior: 'Senior' };
  var MODE_LABEL = { practice: 'โหมดซ้อม', exam: 'โหมดสอบจริง' };
  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  var state = {
    screen: 'start', // start | quiz | result
    setup: { level: 'junior', mode: 'practice', negative: false, minutes: '', minutesTouched: false },
    run: null,
  };
  var openDialog = null;

  // ------------------------------------------------------------ helpers

  function appendKids(node, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) {
      kid.forEach(function (k) { appendKids(node, k); });
    } else if (typeof kid === 'string' || typeof kid === 'number') {
      node.appendChild(document.createTextNode(String(kid)));
    } else {
      node.appendChild(kid);
    }
  }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'text') node.textContent = v;
        else if (k === 'class') node.className = v;
        else if (k === 'checked' || k === 'value') node[k] = v;

      var raw = JSON.parse(node.textContent);
      if (!raw || typeof raw !== 'object' || !raw.levels || typeof raw.levels !== 'object') return null;
      var names = DATA.descriptorNames || {};
      var out = { junior: [], senior: [] };
      var total = 0;
      Object.keys(out).forEach(function (level) {
        var list = Array.isArray(raw.levels[level]) ? raw.levels[level] : [];
        list.forEach(function (t, i) {

          var topic = {
            id: t.descriptor,

            title: t.title,

              ? { code: t.example.code, codeLang: typeof t.example.lang === 'string' ? t.example.lang : '' }
              : null,

            .concat(topic.keyPoints, topic.examFocus, topic.pitfalls, topic.example ? [topic.example.code] : [])
            .join('\n').toLowerCase();

  // `inline code` in data strings becomes <code>; everything is a text node, never innerHTML.
  function inlineNodes(text) {

    var out = [];
    parts.forEach(function (part, i) {
      if (i >= closedUpTo) {
        if (i > 0 || part !== '') out.push((i > 0 ? '`' : '') + part);
      } else if (i % 2 === 1) {
        if (part !== '') out.push(el('code', { class: 'ic', text: part }));
      } else if (part !== '') {

  // ---- review: persistence. Every storage access is guarded; when storage throws, marks live in memory for this page only.
  var memStore = {};

  function splitQA(text) {

    while (at !== -1) {
      if (at > from) out.push(s.slice(from, at));

  // ------------------------------------------------------------ timer

  function startTimer(run) {
    run.endsAt = Date.now() + run.minutes * 60000;
    [300, 60].forEach(function (mark) {
      if (run.minutes * 60 <= mark) run.announced[mark] = true; // do not announce a mark the exam never passes
    });
    tick();
    run.timer = setInterval(tick, 250);
  }

  function stopTimer() {
    if (state.run && state.run.timer) {
      clearInterval(state.run.timer);
      state.run.timer = null;

  }

  function tick() {
    var run = state.run;
    if (!run || run.mode !== 'exam' || run.submitted || state.screen !== 'quiz' || !run.endsAt) return;
    var left = run.endsAt - Date.now();
    if (left <= 0) {
      finishExam(true);
      return;
    }
    if (run.ui.timerEl) {
      run.ui.timerEl.textContent = 'เหลือเวลา ' + fmtTime(left);
      run.ui.timerEl.className = left <= 60000 ? 'timer low' : 'timer';
    }
    if (run.bannerUntil && Date.now() >= run.bannerUntil) hideTimeBanner(run);
    var secs = Math.ceil(left / 1000);
    [300, 60].forEach(function (mark) {
      if (secs <= mark && !run.announced[mark] && run.ui.liveEl) {
        run.announced[mark] = true;
        var msg = 'เหลือเวลาอีก ' + (mark / 60) + ' นาที';
        run.ui.liveEl.textContent = msg; // screen readers
        showTimeBanner(run, msg, mark <= 60); // everyone else, inside the sticky header
      }
    });

  function showTimeBanner(run, msg, urgent) {

    b.className = urgent ? 'time-banner urgent' : 'time-banner';
    b.hidden = false;
    run.bannerUntil = Date.now() + 15000;
  }

  function hideTimeBanner(run) {
    run.bannerUntil = 0;
    if (run.ui.bannerEl) run.ui.bannerEl.hidden = true;

  // ------------------------------------------------------------ quiz screen

  function renderQuiz() {
    var run = state.run;
    var ui = run.ui;
    var back = el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onBack });
    var badge = el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] });
    ui.liveEl = el('div', { class: 'sr-only', 'aria-live': 'polite' });
    var right;
    if (run.mode === 'exam') {
      ui.timerEl = el('div', { class: 'timer', role: 'timer' });
      right = ui.timerEl;
    } else {
      ui.scoreEl = el('div', { class: 'score-line', 'aria-live': 'polite' });
      right = ui.scoreEl;
    }
    var topbar = el('div', { class: 'topbar' }, back, badge, right);
    if (run.mode === 'exam') {
      // The timer stays visible while the page scrolls; the 5 and 1 minute banner lives in the same sticky block.
      ui.bannerEl = el('div', { class: 'time-banner', 'aria-hidden': 'true', hidden: true });
      root.appendChild(el('div', { class: 'sticky-head' }, topbar, ui.bannerEl));
    } else {
      root.appendChild(topbar);
    }
    root.appendChild(ui.liveEl);
    ui.card = el('section', { class: 'card', 'aria-label': 'คำถาม' });
    ui.nav = el('div', { class: 'qnav' });
    root.appendChild(ui.card);
    root.appendChild(ui.nav);
    if (run.mode === 'exam') {
      ui.palette = el('section', { class: 'card palette-wrap', 'aria-label': 'แผงเลือกข้อ' });
      root.appendChild(ui.palette);
    }
    renderQuestion('title');
    renderNav();
    renderPalette();
    updateScore();
  }

  function onBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam' ? 'การสอบที่กำลังทำอยู่จะถูกยกเลิกและคำตอบทั้งหมดจะหายไป' : 'ความคืบหน้าของการซ้อมนี้จะหายไป'],
      ok: 'กลับหน้าแรก',
      cancel: 'ทำต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'quiz') goStart(); });
  }

  function updateScore() {
    var run = state.run;
    if (!run.ui.scoreEl) return;
    var done = run.items.filter(function (i) { return i.confirmed; });
    var sum = 0;
    done.forEach(function (i) { sum += pointsOf(run, i); });
    run.ui.scoreEl.textContent = 'คะแนนสะสม ' + fmt(sum) + ' / ' + fmt(done.length * MAX) + ' (ตอบแล้ว ' + done.length + ' จาก ' + run.items.length + ' ข้อ)';
  }

  function codeBlock(q) {
    var codeEl = el('code', { text: q.code });
    if (q.codeLang) codeEl.setAttribute('data-lang', q.codeLang);
    return el('pre', { class: 'code', tabindex: '0', role: 'group', 'aria-label': 'โค้ดตัวอย่าง' + (q.codeLang ? ' (' + q.codeLang + ')' : '') }, codeEl);
  }

  function interactiveOptions(item, number) {
    var run = state.run;
    var multi = item.q.type === 'multiple';
    var set = el('fieldset', { class: 'options' },
      el('legend', { class: 'sr-only', text: 'ตัวเลือกของข้อ ' + number + (multi ? ' (เลือกได้หลายข้อ)' : '') }));
    item.options.forEach(function (opt, i) {
      var input = el('input', {
        type: multi ? 'checkbox' : 'radio',
        name: 'opt-' + run.index,
        value: opt.id,
        checked: item.selected.indexOf(opt.id) !== -1,
        onchange: function () { onSelect(item, opt.id, input.checked); },
      });
      set.appendChild(el('label', { class: 'opt' },
        input,
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('span', { class: 'opt-body' }, el('span', { class: 'opt-text', text: opt.text }))));
    });
    return set;
  }

  function onSelect(item, id, checked) {
    if (item.q.type === 'multiple') {
      var at = item.selected.indexOf(id);
      if (checked && at === -1) item.selected.push(id);
      if (!checked && at !== -1) item.selected.splice(at, 1);
    } else {
      item.selected = checked ? [id] : [];
    }
    renderNav();
    renderPalette();
    syncLeaveGuard();
  }

  function staticOptions(item) {
    var wrap = el('div', { class: 'options' });
    item.options.forEach(function (opt, i) {
      var isSel = item.selected.indexOf(opt.id) !== -1;
      var cls = 'opt' + (opt.correct ? ' is-correct' : (isSel ? ' is-wrong' : ''));
      wrap.appendChild(el('div', { class: cls },
        el('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[i] }),
        el('div', { class: 'opt-body' },
          el('div', { class: 'opt-text', text: opt.text }),
          el('div', { class: 'tags' },
            el('span', { class: 'tag ' + (opt.correct ? 'ok' : 'bad'), text: opt.correct ? '✓ ถูก' : '✗ ผิด' }),
            isSel ? el('span', { class: 'tag sel', text: 'คุณเลือกข้อนี้' }) : null),
          el('p', { class: 'why' }, el('strong', { text: 'เหตุผล: ' }), opt.why))));
    });
    return wrap;
  }

  function pointsLine(points, answered) {
    var cls = 'points' + (points > 0 ? ' pos' : (points < 0 ? ' neg' : ''));
    return el('p', { class: cls, text: (answered ? '' : 'ไม่ได้ตอบ · ') + 'ได้ ' + fmt(points) + ' จาก ' + MAX + ' คะแนน' });
  }

  function renderQuestion(focusTarget) {
    var run = state.run;
    var item = run.items[run.index];
    var q = item.q;
    var number = run.index + 1;
    var card = run.ui.card;
    var showFeedback = run.mode === 'practice' && item.confirmed;
    clear(card);

    var title = el('h2', { class: 'qtitle', id: 'qtitle', tabindex: '-1', text: 'ข้อ ' + number + ' จาก ' + run.items.length });
    card.appendChild(title);
    if (q.type === 'multiple') card.appendChild(el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }));
    card.appendChild(el('p', { class: 'stem', text: q.stem }));
    if (q.code) card.appendChild(codeBlock(q));
    card.appendChild(showFeedback ? staticOptions(item) : interactiveOptions(item, number));

    var feedback = null;
    if (showFeedback) {
      feedback = el('div', { class: 'feedback', id: 'feedback', tabindex: '-1' },
        el('h3', { text: 'ผลของข้อนี้' }),
        pointsLine(pointsOf(run, item), true),
        el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), q.explanation));
      card.appendChild(feedback);
    }
    if (focusTarget === 'feedback' && feedback) feedback.focus();
    else if (focusTarget === 'title') title.focus();
  }

  function button(label, opts) {
    return el('button', {
      type: 'button',
      id: opts.id || null,
      class: 'btn' + (opts.primary ? ' primary' : ''),
      text: label,
      disabled: opts.disabled,
      'aria-pressed': opts.pressed === undefined ? null : String(opts.pressed),
      onclick: opts.onclick,
    });
  }

  function goTo(index) {
    var run = state.run;
    if (index < 0 || index >= run.items.length) return;
    run.index = index;
    renderQuestion('title');
    renderNav();
    renderPalette();
  }

  function renderNav() {
    var run = state.run;
    var item = run.items[run.index];
    var nav = run.ui.nav;
    clear(nav);
    var last = run.index === run.items.length - 1;
    nav.appendChild(button('← ข้อก่อนหน้า', { disabled: run.index === 0, onclick: function () { goTo(run.index - 1); } }));
    if (run.mode === 'practice') {
      if (!item.confirmed) {
        nav.appendChild(button('ยืนยันคำตอบ', { primary: true, disabled: item.selected.length === 0, onclick: confirmAnswer }));
      }
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('จบและดูผลสรุป', { onclick: finishPractice }));
    } else {
      nav.appendChild(button('⚑ ติดธงทบทวน', {
        id: 'flag-btn',
        pressed: item.flagged,
        onclick: function () {
          item.flagged = !item.flagged;
          renderNav();
          renderPalette();
          document.getElementById('flag-btn').focus();
        },
      }));
      nav.appendChild(button('ข้อถัดไป →', { disabled: last, onclick: function () { goTo(run.index + 1); } }));
      nav.appendChild(el('span', { class: 'spacer' }));
      nav.appendChild(button('ส่งข้อสอบ', { primary: true, onclick: requestSubmit }));
    }
  }

  function renderPalette() {
    var run = state.run;
    var box = run.ui.palette;
    if (!box) return;
    clear(box);
    var grid = el('div', { class: 'palette' });
    run.items.forEach(function (item, i) {
      var answered = item.selected.length > 0;
      var cls = 'pal' + (answered ? ' answered' : '') + (item.flagged ? ' flagged' : '') + (i === run.index ? ' current' : '');
      var label = 'ข้อ ' + (i + 1) + (answered ? ' ตอบแล้ว' : ' ยังไม่ตอบ') + (item.flagged ? ' ติดธงทบทวน' : '');
      grid.appendChild(el('button', {
        type: 'button', class: cls, text: String(i + 1), 'aria-label': label,
        'aria-current': i === run.index ? 'true' : null,
        onclick: function () { goTo(i); },
      }));
    });
    var answeredCount = run.items.filter(function (i) { return i.selected.length > 0; }).length;
    var flaggedCount = run.items.filter(function (i) { return i.flagged; }).length;
    box.appendChild(el('h2', { class: 'small', text: 'แผงเลือกข้อ · ตอบแล้ว ' + answeredCount + ' จาก ' + run.items.length + ' ข้อ · ติดธง ' + flaggedCount + ' ข้อ' }));
    box.appendChild(grid);
    box.appendChild(el('div', { class: 'legend' },
      el('span', { text: 'สีทึบ = ตอบแล้ว' }),
      el('span', { text: 'ขอบอย่างเดียว = ยังไม่ตอบ' }),
      el('span', { text: '⚑ = ติดธงทบทวน' })));
  }

  // ------------------------------------------------------------ practice actions

  function confirmAnswer() {
    var run = state.run;
    var item = run.items[run.index];
    if (item.confirmed || item.selected.length === 0) return;
    item.confirmed = true;
    renderQuestion('feedback');
    renderNav();
    updateScore();
  }

  function finishPractice() {
    var run = state.run;
    var open = run.items.filter(function (i) { return !i.confirmed; }).length;
    function go() {
      if (state.run !== run) return;
      run.submitted = true;
      state.screen = 'result';
      render();
    }
    if (open === 0) {
      go();
      return;
    }
    askConfirm({
      title: 'จบการซ้อมและดูผลสรุป?',
      message: ['ยังไม่ได้ยืนยันคำตอบ ' + open + ' ข้อ ข้อเหล่านี้จะนับเป็น 0 คะแนน'],
      ok: 'จบและดูผล',
      cancel: 'ซ้อมต่อ',
    }).then(function (yes) { if (yes) go(); });
  }

  // ------------------------------------------------------------ exam actions

  function requestSubmit() {
    var run = state.run;
    var unanswered = run.items.filter(function (i) { return i.selected.length === 0; }).length;
    var flagged = run.items.filter(function (i) { return i.flagged; }).length;
    var lines = [unanswered > 0 ? 'ยังไม่ได้ตอบ ' + unanswered + ' ข้อ ข้อที่ไม่ตอบจะได้ 0 คะแนน' : 'ตอบครบทุกข้อแล้ว'];
    if (flagged > 0) lines.push('มี ' + flagged + ' ข้อที่ติดธงไว้ทบทวน');
    lines.push('เมื่อส่งแล้วจะแก้คำตอบไม่ได้');
    askConfirm({ title: 'ส่งข้อสอบ?', message: lines, ok: 'ส่งข้อสอบ', cancel: 'กลับไปทำต่อ' })
      .then(function (yes) { if (yes && state.run === run) finishExam(false); });
  }

  function finishExam(auto) {
    var run = state.run;
    if (!run || run.submitted) return;
    run.submitted = true;
    run.auto = !!auto;
    stopTimer();
    closeOpenDialog();
    state.screen = 'result';
    render();
  }

  // ------------------------------------------------------------ result screen

  // Groups the score by competency when the data defines competencies, otherwise by descriptor.
  function breakdown(run) {
    var byCompetency = Array.isArray(DATA.competencies) && DATA.competencies.length > 0;
    var map = {};
    var order = [];
    run.items.forEach(function (item) {
      var d = byCompetency ? (item.q.competency || '-') : (item.q.descriptor || '-');
      if (!map[d]) {
        map[d] = { code: d, count: 0, answered: 0, points: 0, max: 0 };
        order.push(d);
      }
      map[d].count++;
      map[d].max += MAX;
      map[d].points += pointsOf(run, item);
      if (isAnswered(run, item)) map[d].answered++;
    });
    var known = byCompetency ? DATA.competencies : Object.keys(DATA.descriptorNames || {});
    order.sort(function (a, b) {
      var ia = known.indexOf(a);
      var ib = known.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    return order.map(function (d) { return map[d]; });
  }

  function renderResult() {
    var run = state.run;
    var total = 0;
    var answered = 0;
    run.items.forEach(function (item) {
      total += pointsOf(run, item);
      if (isAnswered(run, item)) answered++;
    });
    var max = run.items.length * MAX;
    var pct = max > 0 ? (total / max) * 100 : 0;

    var heading = el('h1', { id: 'result-title', tabindex: '-1', text: run.mode === 'exam' ? 'ผลสอบ' : 'สรุปผลการซ้อม' });
    root.appendChild(el('div', { class: 'topbar' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack }),
      el('span', { class: 'badge', text: LEVEL_LABEL[run.level] + ' · ' + MODE_LABEL[run.mode] })));
    root.appendChild(heading);

    if (run.auto) {
      root.appendChild(el('div', { class: 'error', role: 'status', text: 'หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ' }));
    }
    root.appendChild(el('div', { class: 'card' },
      el('div', { class: 'big-score', text: fmt(total) + ' / ' + fmt(max) + ' คะแนน' }),
      el('p', { text: fmt(pct) + '% · ตอบแล้ว ' + answered + ' จาก ' + run.items.length + ' ข้อ' + (run.mode === 'exam' ? (run.negative ? ' · เปิดการหักคะแนน' : ' · ไม่หักคะแนน') : '') }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'btn primary', text: run.mode === 'exam' ? 'สอบใหม่ (สุ่มลำดับใหม่)' : 'ซ้อมอีกครั้ง', onclick: onResultRetake }))));

    var rows = breakdown(run).map(function (d) {
      var p = d.max > 0 ? (d.points / d.max) * 100 : 0;
      var name = Array.isArray(DATA.competencies) && DATA.competencies.length > 0
        ? d.code
        : ((DATA.descriptorNames && DATA.descriptorNames[d.code]) || '');
      var bar = el('div', { class: 'bar', 'aria-hidden': 'true' }, el('span'));
      bar.firstChild.style.width = Math.max(0, Math.min(100, p)) + '%';
      return el('div', { class: 'desc-row' },
        el('div', null, el('strong', { text: name || d.code })),
        el('div', { class: 'small', text: 'คะแนน ' + fmt(d.points) + ' / ' + fmt(d.max) + ' (' + fmt(p) + '%) · ตอบแล้ว ' + d.answered + ' จาก ' + d.count + ' ข้อ' }),
        bar);
    });
    root.appendChild(el('section', { class: 'card', 'aria-labelledby': 'breakdown-title' },
      el('h2', { id: 'breakdown-title', text: 'คะแนนแยกตามหัวข้อ' }),
      rows));

    if (run.mode === 'exam') {
      root.appendChild(el('h2', { text: 'ทบทวนทุกข้อ (ตามลำดับที่ทำ)' }));
      run.items.forEach(function (item, i) {
        var answeredItem = item.selected.length > 0;
        var pts = pointsOf(run, item);
        root.appendChild(el('article', { class: 'review-item' + (answeredItem ? '' : ' unanswered') },
          el('h3', null, 'ข้อ ' + (i + 1) + ' ',
            answeredItem ? null : el('span', { class: 'tag warn', text: 'ไม่ได้ตอบ' }), ' ',
            item.flagged ? el('span', { class: 'tag', text: '⚑ ติดธง' }) : null),
          item.q.type === 'multiple' ? el('p', { class: 'multi-note', text: 'เลือกได้หลายข้อ' }) : null,
          el('p', { class: 'stem', text: item.q.stem }),
          item.q.code ? codeBlock(item.q) : null,
          staticOptions(item),
          el('div', { class: 'feedback' },
            pointsLine(pts, answeredItem),
            el('p', { class: 'explain' }, el('strong', { text: 'คำอธิบาย: ' }), item.q.explanation))));
      });
    }

    root.appendChild(el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', text: '← กลับหน้าแรก', onclick: onResultBack })));
    heading.focus();
  }

  // Leaving the result screen throws the review away, so both exits ask first.
  function onResultBack() {
    var run = state.run;
    askConfirm({
      title: 'กลับหน้าแรก?',
      message: [run.mode === 'exam'
        ? 'ผลสอบและการทบทวนเฉลยทุกข้อในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'
        : 'สรุปผลการซ้อมในหน้านี้จะหายไป และเปิดดูย้อนหลังไม่ได้'],
      ok: 'กลับหน้าแรก',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) { if (yes && state.run === run && state.screen === 'result') goStart(); });
  }

  function onResultRetake() {
    var run = state.run;
    var exam = run.mode === 'exam';
    askConfirm({
      title: exam ? 'สอบใหม่?' : 'ซ้อมอีกครั้ง?',
      message: exam
        ? ['ผลสอบและการทบทวนเฉลยของรอบนี้จะหายไป', 'ระบบจะเริ่มจับเวลา ' + run.minutes + ' นาทีทันที และสุ่มลำดับข้อใหม่']
        : ['สรุปผลการซ้อมรอบนี้จะหายไป และเริ่มซ้อมรอบใหม่ทันที'],
      ok: exam ? 'เริ่มสอบใหม่' : 'เริ่มซ้อมใหม่',
      cancel: 'ดูผลต่อ',
    }).then(function (yes) {
      if (yes && state.run === run && state.screen === 'result') startRun(run.level, run.mode, { negative: run.negative, minutes: run.minutes });
    });
  }

  render();
  previewHook();
})();

</script>
</body>
</html>
