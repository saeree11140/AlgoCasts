ue,"why":"ถูกต้อง การทบทวนงานตัวเองก่อนช่วยจับของที่หลุดมาและลดเวลาที่ reviewer ต้องใช้"},{"id":"B","text":"รวมงานอีกหลายเรื่องใน sprint ไว้ใน PR เดียวกัน เพื่อให้ reviewer เปิดดูครั้งเดียว","correct":false,"why":"PR ที่รวมหลายเรื่องยาก review และ revert ทั้งก้อนแทนที่จะ revert เฉพาะเรื่องที่มีปัญหา"},{"id":"C","text":"commit โฟลเดอร์ build output ไปด้วย เพื่อให้ reviewer รันดูผลได้ทันที","correct":false,"why":"ไฟล์ที่สร้างจาก build ทำให้ diff ใหญ่และเต็มไปด้วยเนื้อหาที่ไม่มีใครอ่าน reviewer ควรสร้างผลลัพธ์จากโค้ดต้นฉบับเอง"},{"id":"D","text":"รวมโค้ดล่าสุดของ develop เข้ามาใน branch แล้วรัน test ในเครื่องให้ผ่าน","correct":true,"why":"ถูกต้อง ช่วยเจอ conflict และความไม่เข้ากันกับงานล่าสุดก่อนส่งให้ผู้อื่นตรวจ"},{"id":"E","text":"เขียน description ให้บอกว่าแก้อะไร ทำไม ทดสอบอย่างไร พร้อมลิงก์ work item","correct":true,"why":"ถูกต้อง ช่วยให้ reviewer เข้าใจบริบทและตรวจเทียบกับความต้องการได้"}],"explanation":"PR ที่ดีคือเล็ก โฟกัสเรื่องเดียว สะอาด และมีบริบทครบ ผู้เขียนควรตรวจงานตัวเอง ทำให้ branch ทันกับต้นทาง และเขียนคำอธิบายก่อนส่ง เพื่อให้เวลาของ reviewer ถูกใช้กับการตรวจตรรกะ ไม่ใช่การตามหาสิ่งที่ผู้เขียนควรจัดการเอง"},{"id":"ENG-J-E-006","level":"junior","pool":"exam","competency":"Git","descriptor":"GIT-J4","concept":"git-semver-tag-hotfix","mobile":false,"type":"single","stem":"ระบบชำระเงินบน production อยู่ที่ tag v2.3.0 ทีมแก้บั๊กปัดเศษยอดชำระด้วย hotfix โดยไม่เพิ่มฟีเจอร์ใหม่และไม่เปลี่ยน API ที่ใช้งานอยู่ หลัง merge hotfix เข้า main แล้ว ควรติด tag เวอร์ชันถัดไปเป็นอะไรตาม Semantic Versioning","options":[{"id":"A","text":"v2.4.0 เพราะมีการเปลี่ยนแปลงโค้ดบน production","correct":false,"why":"เลข minor เพิ่มเมื่อมีฟีเจอร์ใหม่ที่ใช้งานร่วมกับของเดิมได้ ส่วนการแก้บั๊กอย่างเดียวไม่ใช่กรณีนั้น"},{"id":"B","text":"v3.0.0 เพราะบั๊กนี้เกี่ยวกับการเงินจึงเป็นการเปลี่ยนครั้งใหญ่","correct":false,"why":"เลข major เพิ่มเมื่อมีการเปลี่ยนแปลงที่ทำให้ผู้ใช้เดิมใช้งานไม่ได้ ซึ่งไม่เกิดจากการแก้บั๊กในกรณีนี้"},{"id":"C","text":"v2.3.1 เพราะเป็นการแก้บั๊กที่ใช้งานร่วมกับเวอร์ชันเดิมได้","correct":true,"why":"ถูกต้อง Semantic Versioning ใช้เลขตัวท้าย (patch) สำหรับการแก้บั๊กที่ยังเข้ากันได้กับ API เดิม"},{"id":"D","text":"ย้าย tag v2.3.0 ให้ชี้ commit ใหม่ เพื่อให้เลขเวอร์ชันคงเดิม","correct":false,"why":"การย้าย tag ที่ปล่อยไปแล้วทำให้เลขเวอร์ชันเดียวกันหมายถึงโค้ดคนละชุด ย้อนตรวจสอบว่าอะไรอยู่บน production ไม่ได้"}],"explanation":"Semantic Versioning ใช้รูปแบบ MAJOR.MINOR.PATCH โดย patch สำหรับแก้บั๊กที่เข้ากันได้ minor สำหรับเพิ่มความสามารถที่เข้ากันได้ และ major สำหรับการเปลี่ยนที่ไม่เข้ากัน tag ที่ปล่อยแล้วควรเป็นตัวชี้ที่ไม่เปลี่ยนเพื่อให้ย้อนดูและ rollback ได้"},{"id":"ENG-J-E-007","level":"junior","pool":"exam","competency":"SQL","descriptor":"SQL-J1","concept":"sql-update-without-where-safety","mobile":false,"type":"single","stem":"เพื่อนร่วมทีมรันคำสั่งด้านล่างบน production เพื่อลดราคาสินค้าหมวดเสื้อผ้าสำหรับแฟลชเซล แต่ผลคือสินค้าทุกชิ้นในร้านถูกลดราคาไปด้วย ก่อนรันคำสั่งแก้ข้อมูลบน production ครั้งต่อไป วิธีป้องกันที่ตรงจุดที่สุดคืออะไร","code":"UPDATE products\nSET price = price * 0.8;","codeLang":"sql","options":[{"id":"A","text":"ใส่ LIMIT 10 ท้ายคำสั่งเพื่อจำกัดไม่ให้เกิน 10 แถวต่อครั้ง (ในฐานข้อมูลที่รองรับ) แล้วรันซ้ำจนครบ","correct":false,"why":"LIMIT ไม่ได้เลือกสินค้าหมวดที่ต้องการ แถวที่ถูกแก้อาจเป็นสินค้าหมวดอื่น และไม่ช่วยตรวจว่าเงื่อนไขถูกต้อง"},{"id":"B","text":"เพิ่มเงื่อนไข WHERE price > 0 เพื่อให้คำสั่งมี WHERE กำกับทุกครั้งก่อนรันบน production","correct":false,"why":"เงื่อนไขนี้ไม่ได้เลือกหมวดเสื้อผ้าและตรงกับสินค้าเกือบทุกชิ้น การมี WHERE อย่างเดียวไม่ได้ช่วยตรวจว่าแถวที่จะถูกแก้ถูกต้อง"},{"id":"C","text":"เขียน SELECT ด้วยเงื่อนไขเดียวกันเพื่อตรวจแถวก่อน แล้วรัน UPDATE ในทรานแซกชันที่ ROLLBACK ได้จนกว่าจะยืนยัน","correct":true,"why":"ถูกต้อง การดูแถวที่จะโดนล่วงหน้าและตรวจจำนวนแถวที่ถูกแก้ก่อน COMMIT ช่วยจับคำสั่งที่กว้างเกินไปได้ทันเวลา"},{"id":"D","text":"รันคำสั่งนอกเวลาทำการ เพื่อลดจำนวนลูกค้าที่ได้รับผลกระทบจากราคาที่ผิดพลาด","correct":false,"why":"ลดผู้เห็นข้อมูลผิดได้เพียงชั่วคราว แต่ข้อมูลที่ถูกแก้ผิดยังเสียหายเท่าเดิมและต้องกู้คืนอยู่ดี"}],"explanation":"UPDATE และ DELETE ที่ไม่มี WHERE กระทบทุกแถว แนวปฏิบัติบน production คือเขียน SELECT ด้วยเงื่อนไขเดียวกันก่อน ตรวจจำนวนแถว ใช้ทรานแซกชันเพื่อให้ย้อนกลับได้ และมีสำรองข้อมูลล่าสุดไว้เสมอ ผลที่ได้จะลดความเสียหายจากความผิดพลาดของคนซึ่งป้องกันไม่ได้ด้วยความระมัดระวังอย่างเดียว"},{"id":"ENG-J-E-008","level":"junior","pool":"exam","competency":"SQL","descriptor":"SQL-J1","concept":"sql-inner-join-write-query","mobile":false,"type":"single","stem":"ระบบมีตารางตามโครงสร้างด้านล่าง ต้องการแสดงชื่อสินค้าคู่กับคะแนนของแต่ละรีวิวที่มีอยู่ query ใดถูกต้อง","code":"products(id, name)\nreviews(id, product_id, rating)","codeLang":"text","options":[{"id":"A","text":"SELECT p.name, r.rating FROM products p INNER JOIN reviews r ON r.product_id = p.id;","correct":true,"why":"ถูกต้อง เชื่อมด้วย foreign key product_id ของ reviews กับ id ของ products ได้คู่สินค้ากับรีวิวของสินค้านั้น"},{"id":"B","text":"SELECT p.name, r.rating FROM products p INNER JOIN reviews r ON r.id = p.id;","correct":false,"why":"เชื่อมด้วย id ของสองตารางซึ่งเป็นคนละความหมาย รีวิวหมายเลข 1 จึงถูกจับคู่กับสินค้าหมายเลข 1 ทั้งที่อาจไม่เกี่ยวกัน"},{"id":"C","text":"SELECT p.name, r.rating FROM products p, reviews r;","correct":false,"why":"ไม่มีเงื่อนไขเชื่อม ได้ผลคูณทุกคู่ของสินค้ากับรีวิว (cartesian product) จำนวนแถวเท่ากับ สินค้า x รีวิว"},{"id":"D","text":"SELECT name, rating FROM products INNER JOIN reviews ON product_id = id;","correct":false,"why":"ทั้งสองตารางมีคอลัมน์ id ฐานข้อมูลจึงแจ้งว่า id กำกวม ต้องระบุตารางหรือ alias นำหน้าชื่อคอลัมน์"}],"explanation":"JOIN ต้องเชื่อมด้วยคอลัมน์ที่มีความหมายตรงกัน ซึ่งปกติคือ foreign key กับ primary key ที่อ้างถึง และควรใส่ alias นำหน้าคอลัมน์เมื่อมีชื่อซ้ำกัน การลืมเงื่อนไขเชื่อมจะได้จำนวนแถวมหาศาลโดยไม่มี error ซึ่งควรสังเกตจากจำนวนแถวที่ผิดปกติ"},{"id":"ENG-J-E-009","level":"junior","pool":"exam","competency":"SQL","descriptor":"SQL-J1","concept":"sql-first-normal-form-list-column","mobile":false,"type":"single","stem":"ตาราง orders ด้านล่างเก็บรหัสสินค้าที่ลูกค้าสั่งไว้ในคอลัมน์เดียวคั่นด้วยจุลภาค เช่น 101,205,309 ทีมพบว่าการหาออเดอร์ที่มีสินค้ารหัส 205 และการรวมยอดขายต่อสินค้าทำได้ยากและช้า ควรแก้โครงสร้างอย่างไร","code":"orders(order_id PK, customer_id, product_ids)","codeLang":"text","options":[{"id":"A","text":"เพิ่มคอลัมน์ product_id_1, product_id_2, product_id_3 เพื่อแยกค่าออกจากกัน","correct":false,"why":"ยังเป็นกลุ่มคอลัมน์ซ้ำที่จำกัดจำนวนสินค้าต่อออเดอร์ไว้ที่สามชิ้น และค้นหาต้องไล่ทุกคอลัมน์"},{"id":"B","text":"เปลี่ยน product_ids เป็นชนิดข้อมูลข้อความที่ยาวขึ้น แล้วค้นหาด้วย LIKE '%205%'","correct":false,"why":"LIKE '%205%' จะจับรหัสอย่าง 1205 หรือ 2051 ที่มี 205 เป็นส่วนหนึ่งด้วย และไม่ได้แก้ปัญหาโครงสร้างข้อมูล"},{"id":"C","text":"สร้าง index บนคอลัมน์ product_ids เพื่อให้ค้นหาเร็วขึ้น","correct":false,"why":"index ทำงานกับค่าทั้งก้อนในช่อง ไม่ได้แยกรหัสสินค้าแต่ละตัวออกจากกัน การค้นหาแบบ LIKE '%205%' ก็ใช้ index แบบปกติไม่ได้ผล"},{"id":"D","text":"แยกเป็นตาราง order_items(order_id, product_id) ให้หนึ่งแถวต่อหนึ่งสินค้า","correct":true,"why":"ถูกต้อง หนึ่งช่องเก็บหนึ่งค่า จึงค้นหา นับ และ JOIN ตามสินค้าได้โดยตรง รองรับจำนวนสินค้าต่อออเดอร์ไม่จำกัด"}],"explanation":"การเก็บหลายค่าไว้ในช่องเดียวขัดกับ First Normal Form ทางแก้คือแยกความสัมพันธ์แบบหนึ่งต่อหลายออกเป็นตารางลูกที่ให้หนึ่งแถวต่อหนึ่งค่า ซึ่งยังเอื้อให้ใส่ foreign key และ index ที่ใช้ประโยชน์ได้จริง"},{"id":"ENG-J-E-010","level":"junior","pool":"exam","competency":"SQL","descriptor":"SQL-J1","concept":"sql-foreign-key-integrity","mobile":false,"type":"multiple","stem":"ตาราง orders มีคอลัมน์ customer_id ที่ตั้งเป็น foreign key อ้างถึง customers(id) ข้อใดเป็นผลของ foreign key constraint นี้บ้าง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ทำให้ INNER JOIN ระหว่างสองตารางนี้เร็วขึ้นเสมอ แม้ยังไม่ได้สร้าง index เพิ่ม","correct":false,"why":"constraint ใช้รักษาความถูกต้องของข้อมูล ไม่ใช่ตัวเร่งความเร็ว ความเร็วของ JOIN ขึ้นกับ index และแผนการประมวลผล"},{"id":"B","text":"การเพิ่มออเดอร์ที่ customer_id ไม่มีอยู่ในตาราง customers จะถูกฐานข้อมูลปฏิเสธ","correct":true,"why":"ถูกต้อง foreign key กันไม่ให้มีออเดอร์ที่อ้างถึงลูกค้าที่ไม่มีอยู่จริง"},{"id":"C","text":"การลบลูกค้าที่ยังมีออเดอร์อ้างอิงอยู่จะถูกปฏิเสธ ถ้าไม่ได้กำหนดให้ลบตามกัน เช่น ON DELETE CASCADE","correct":true,"why":"ถูกต้อง โดยค่าเริ่มต้นฐานข้อมูลไม่ยอมให้ลบแถวแม่ที่ยังมีแถวลูกอ้างถึง เพื่อไม่ให้เกิดออเดอร์ลอยไร้เจ้าของ"},{"id":"D","text":"ใส่ NULL ใน customer_id ของออเดอร์ได้ ถ้าคอลัมน์ไม่ได้กำหนด NOT NULL เช่น ออเดอร์ที่ยังไม่ระบุลูกค้า","correct":true,"why":"ถูกต้อง foreign key ตรวจเฉพาะค่าที่ไม่ใช่ NULL ว่ามีอยู่ในตารางแม่ ถ้าต้องบังคับให้ต้องมีลูกค้าเสมอต้องกำหนด NOT NULL เพิ่ม"}],"explanation":"foreign key คือเครื่องมือรักษา referential integrity ระหว่างตาราง ป้องกันข้อมูลลูกที่ชี้ไปหาแม่ที่ไม่มีอยู่ และกำหนดพฤติกรรมเมื่อลบหรือแก้แถวแม่ได้ แต่ไม่ได้ทดแทน index และไม่ได้ทำให้ query เร็วขึ้นเอง"},{"id":"ENG-J-E-011","level":"junior","pool":"exam","competency":"SQL","descriptor":"SQL-J1","concept":"sql-group-by-sum-per-customer","mobile":false,"type":"single","stem":"ต้องการยอดขายรวมของลูกค้าแต่ละคนจากตาราง orders(id, customer_id, total) query ใดให้ผลถูกต้อง","options":[{"id":"A","text":"SELECT customer_id, SUM(total) FROM orders GROUP BY total;","correct":false,"why":"GROUP BY total จัดกลุ่มตามยอดของแต่ละออเดอร์ ไม่ใช่ตามลูกค้า ผลที่ได้จึงไม่ใช่ยอดรวมต่อลูกค้า"},{"id":"B","text":"SELECT customer_id, SUM(total) FROM orders GROUP BY customer_id;","correct":true,"why":"ถูกต้อง จัดกลุ่มตาม customer_id แล้วรวมยอดของทุกออเดอร์ในกลุ่มเดียวกัน ได้หนึ่งแถวต่อลูกค้า"},{"id":"C","text":"SELECT customer_id, total FROM orders ORDER BY customer_id, total DESC;","correct":false,"why":"ได้รายการออเดอร์ทุกแถวเรียงตามลูกค้า ไม่มีการรวมยอด"},{"id":"D","text":"SELECT customer_id, SUM(total) FROM orders;","correct":false,"why":"ไม่มี GROUP BY ฐานข้อมูลส่วนใหญ่แจ้ง error เพราะ customer_id ไม่ได้อยู่ในการจัดกลุ่ม ส่วนบางระบบอาจคืนแถวเดียวที่รวมทุกออเดอร์"}],"explanation":"เมื่อใช้ aggregate function ร่วมกับคอลัมน์ธรรมดา ต้องระบุคอลัมน์เหล่านั้นใน GROUP BY เพื่อบอกว่าจะรวมค่าตามกลุ่มใด การเลือกคอลัมน์ที่ใช้จัดกลุ่มให้ตรงกับคำถามทางธุรกิจ เช่น รายลูกค้าหรือรายวัน เป็นขั้นตอนสำคัญที่สุดของ query แบบสรุป"},{"id":"ENG-J-E-012","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J1","concept":"oop-method-vs-attribute-design","mobile":false,"type":"multiple","stem":"ทีมกำลังออกแบบ class Product ของร้านค้าออนไลน์ ข้อใดควรเป็น method (พฤติกรรมของ object) มากกว่าเป็น attribute (ข้อมูลที่เก็บไว้) (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"คำนวณราคาสุทธิหลังหักส่วนลดจาก price และ discountRate","correct":true,"why":"ถูกต้อง ค่าที่คำนวณจากข้อมูลอื่นได้ควรเป็น method เพื่อให้ถูกต้องเสมอเมื่อ price หรือส่วนลดเปลี่ยน"},{"id":"B","text":"รหัส SKU ของสินค้า","correct":false,"why":"SKU เป็นข้อมูลที่เก็บไว้กับสินค้า จึงเป็น attribute"},{"id":"C","text":"ชื่อสินค้าที่แสดงบนหน้าเว็บ","correct":false,"why":"ชื่อสินค้าเป็นข้อมูลที่เก็บไว้ จึงเป็น attribute"},{"id":"D","text":"ตรวจว่าจำนวนคงเหลือพอสำหรับจำนวนที่สั่งหรือไม่","correct":true,"why":"ถูกต้อง เป็นการกระทำที่ใช้ข้อมูลของ object ตัดสินใจ จึงเป็น method เช่น hasStock(qty)"}],"explanation":"attribute เก็บสถานะของ object ส่วน method คือสิ่งที่ object ทำหรือตอบได้จากสถานะนั้น ค่าที่คำนวณได้จาก attribute อื่นมักทำเป็น method เพื่อไม่ต้องเก็บซ้ำและไม่ล้าสมัย"},{"id":"ENG-J-E-013","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J2","concept":"oop-constructor-default-parameter","mobile":false,"type":"single","stem":"ค่า percent ที่พิมพ์ออกมาจากโค้ดคูปองด้านล่างคืออะไร","code":"class Coupon {\n  code: string;\n  percent: number;\n  constructor(code: string, percent: number = 10) {\n    this.code = code;\n    this.percent = percent;\n  }\n}\n\nconst c = new Coupon(\"NEWYEAR\");\nconsole.log(c.percent);","codeLang":"typescript","options":[{"id":"A","text":"undefined เพราะไม่ได้ส่งอาร์กิวเมนต์ตัวที่สองเข้า constructor","correct":false,"why":"พารามิเตอร์ percent มีค่าเริ่มต้นกำหนดไว้ จึงไม่เป็น undefined เมื่อผู้เรียกไม่ส่งค่ามา"},{"id":"B","text":"0 เพราะตัวเลขที่ไม่ได้ส่งค่ามาจะถูกกำหนดเป็นศูนย์โดยอัตโนมัติ","correct":false,"why":"ภาษาไม่ได้เติมศูนย์ให้เอง ค่าที่ใช้คือค่าเริ่มต้นที่เขียนไว้ใน constructor"},{"id":"C","text":"เกิด error ตอนคอมไพล์ เพราะส่งอาร์กิวเมนต์ไม่ครบตามที่ constructor ประกาศไว้","correct":false,"why":"พารามิเตอร์ที่มีค่าเริ่มต้นเป็นตัวเลือกได้ ผู้เรียกจึงเว้นไม่ส่งได้โดยไม่มี error"},{"id":"D","text":"10 เพราะ constructor ใช้ค่าเริ่มต้นเมื่อผู้เรียกไม่ได้ส่ง percent มา","correct":true,"why":"ถูกต้อง ค่าเริ่มต้นของพารามิเตอร์จะถูกใช้เมื่อไม่ได้ส่งค่านั้น ทำให้ percent ของคูปองนี้เป็น 10"}],"explanation":"constructor เป็นจุดกำหนดค่าเริ่มต้นของ object ได้ทั้งแบบบังคับส่งและแบบมีค่าเริ่มต้น เหมาะกับค่าที่ส่วนใหญ่เหมือนกัน แต่ต้องเลือกค่าเริ่มต้นให้สมเหตุสมผลกับธุรกิจ เพราะผู้เรียกที่ลืมส่งจะได้ค่านั้นโดยไม่รู้ตัว"},{"id":"ENG-J-E-014","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J3","concept":"oop-group-data-and-behavior","mobile":false,"type":"single","stem":"ระบบสั่งซื้อเดิมมีฟังก์ชัน calcTax(order), applyDiscount(order) และ formatOrder(order) กระจายอยู่หลายไฟล์ โดย order เป็นเพียง object ที่เก็บข้อมูล ทีมจะย้ายฟังก์ชันเหล่านี้มาเป็น method ของ class Order ข้อใดเป็นประโยชน์ที่ได้ตรงที่สุด","options":[{"id":"A","text":"ฟังก์ชันทำงานเร็วขึ้น เพราะ method ถูกประมวลผลเร็วกว่าฟังก์ชันทั่วไปที่แยกอยู่ต่างหาก","correct":false,"why":"การย้ายมาเป็น method เป็นเรื่องโครงสร้างโค้ด ไม่ได้ทำให้ประสิทธิภาพการทำงานเปลี่ยนอย่างมีนัยสำคัญ"},{"id":"B","text":"ข้อมูลออเดอร์กับการทำงานที่ใช้ข้อมูลนั้นอยู่รวมกัน ผู้เรียกใช้ order.calcTax() ได้ตรง ๆ","correct":true,"why":"ถูกต้อง รวมข้อมูลและพฤติกรรมที่เกี่ยวข้องไว้ในที่เดียว ทำให้แก้ไขและทำความเข้าใจได้ง่ายขึ้น"},{"id":"C","text":"เรียกใช้ผ่านชื่อ class ได้ตรง ๆ โดยไม่สร้าง object ของ Order ขึ้นมาก่อน","correct":false,"why":"method ของ instance ใช้ข้อมูลของ object แต่ละตัว จึงต้องเรียกผ่าน object ที่สร้างไว้ ไม่ใช่ผ่านชื่อ class"},{"id":"D","text":"ไฟล์อื่นจะเรียก method เหล่านี้ไม่ได้อีก ทำให้โค้ดปลอดภัยขึ้นกว่าเดิมมาก","correct":false,"why":"method ที่เป็น public ยังเรียกจากไฟล์อื่นได้ตามปกติ การย้ายมาไว้ใน class ไม่ได้จำกัดการเรียกใช้"}],"explanation":"encapsulation ไม่ได้หมายถึงการซ่อนอย่างเดียว แต่รวมถึงการนำข้อมูลกับพฤติกรรมที่เกี่ยวข้องมาไว้ด้วยกัน เมื่อกติกาของออเดอร์อยู่ใน Order การแก้กติกาหนึ่งจุดมีผลกับทุกที่ที่ใช้ และผู้เรียกไม่ต้องผูกกับโครงสร้างภายในของออเดอร์"},{"id":"ENG-J-E-015","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J3","concept":"oop-getter-only-property","mobile":false,"type":"multiple","stem":"จากโค้ดด้านล่าง ข้อใดถูกต้องเกี่ยวกับการใช้งาน object acc บ้าง (เลือกทุกข้อที่ถูก)","code":"class Account {\n  private _balance: number = 0;\n\n  get balance(): number {\n    return this._balance;\n  }\n\n  deposit(amount: number): void {\n    this._balance += amount;\n  }\n}\n\nconst acc = new Account();","codeLang":"typescript","options":[{"id":"A","text":"อ่านค่าด้วย acc._balance ได้จากภายนอก class เพราะมี getter อยู่แล้ว","correct":false,"why":"_balance ถูกประกาศเป็น private ภายนอก class เข้าถึงโดยตรงไม่ได้ (คอมไพเลอร์ปฏิเสธ) ต้องอ่านผ่าน getter"},{"id":"B","text":"อ่านยอดเงินได้ด้วย acc.balance โดยใช้รูปแบบเดียวกับการอ่าน attribute ทั่วไป","correct":true,"why":"ถูกต้อง getter ทำให้เรียกอ่านค่าได้เหมือนเข้าถึง attribute โดยข้างในเป็นโค้ดของ class"},{"id":"C","text":"ต้องประกาศ set balance คู่กับ get balance เสมอ มิฉะนั้นคอมไพล์ไม่ผ่าน","correct":false,"why":"ประกาศ getter อย่างเดียวได้ ผลคือ property นั้นอ่านได้อย่างเดียว ซึ่งมักตั้งใจใช้เพื่อป้องกันการแก้จากภายนอก"},{"id":"D","text":"getter ทำให้ balance ถูกเก็บซ้ำเป็นอีกตัวแปรหนึ่ง ซึ่งต้องคอยซิงก์กับ _balance เอง","correct":false,"why":"getter เป็นโค้ดที่คืนค่าตอนถูกอ่าน ไม่ได้สร้างตัวแปรเก็บค่าอีกชุดแยกต่างหาก"},{"id":"E","text":"เปลี่ยนยอดเงินได้ผ่าน deposit เท่านั้น เพราะ balance ไม่มี setter และ TypeScript จะแจ้ง error ถ้าเขียน acc.balance = 100","correct":true,"why":"ถูกต้อง property ที่มีเฉพาะ getter ถือเป็น read-only การเปลี่ยนค่าต้องผ่าน method ที่ class เปิดไว้"}],"explanation":"getter ที่ไม่มี setter ใช้เปิดข้อมูลให้อ่านได้โดยป้องกันการแก้จากภายนอก ส่วนการเปลี่ยนค่าทำผ่าน method ที่ตรวจกติกา เช่น deposit เป็นรูปแบบพื้นฐานของ encapsulation ที่ใช้บ่อยในโค้ดจริง"},{"id":"ENG-J-E-016","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J4","concept":"oop-subclass-inherits-members","mobile":false,"type":"single","stem":"เมื่อสร้าง Dog แล้วเรียก describe() ตามโค้ดด้านล่าง จะได้ข้อความอะไร","code":"class Animal {\n  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n  describe(): string {\n    return \"สัตว์ชื่อ \" + this.name;\n  }\n}\n\nclass Dog extends Animal {}\n\nconsole.log(new Dog(\"มะลิ\").describe());","codeLang":"typescript","options":[{"id":"A","text":"สัตว์ชื่อ มะลิ เพราะ Dog สืบทอด constructor และ describe มาจาก Animal","correct":true,"why":"ถูกต้อง subclass ที่ไม่ประกาศ constructor ของตัวเองจะใช้ constructor ของคลาสแม่ และเรียก method ที่สืบทอดมาได้"},{"id":"B","text":"สัตว์ชื่อ undefined เพราะ Dog ไม่มี constructor ของตัวเอง จึงไม่ได้รับค่า name","correct":false,"why":"เมื่อ subclass ไม่ประกาศ constructor จะใช้ของคลาสแม่ และส่งอาร์กิวเมนต์ต่อให้ จึงได้ name เป็น มะลิ"},{"id":"C","text":"เกิด error เพราะ class ที่ไม่มีเนื้อหาอย่าง Dog สร้าง object ไม่ได้","correct":false,"why":"class ที่ไม่มีสมาชิกของตัวเองสร้าง object ได้ตามปกติ และได้สมาชิกทั้งหมดของคลาสแม่มาด้วย"},{"id":"D","text":"เกิด error เพราะ Dog ต้องประกาศ describe ของตัวเองก่อนจึงเรียกใช้ได้","correct":false,"why":"method ที่สืบทอดมาเรียกใช้ได้ทันที ไม่จำเป็นต้องประกาศซ้ำใน subclass เว้นแต่ต้องการเปลี่ยนพฤติกรรม"}],"explanation":"inheritance ทำให้ subclass ได้ attribute, method และ constructor ของคลาสแม่โดยไม่ต้องเขียนซ้ำ จึงมีไว้ลดโค้ดซ้ำเมื่อสองชนิดมีส่วนร่วมกันจริง และจะเขียนเพิ่มหรือ override เฉพาะส่วนที่ต่างกันเท่านั้น"},{"id":"ENG-J-E-017","level":"junior","pool":"exam","competency":"OOP","descriptor":"OOP-J5","concept":"oop-constructor-call-order","mobile":false,"type":"single","stem":"รันโค้ดด้านล่างแล้วข้อความที่พิมพ์ออกมามีลำดับเป็นอย่างไร","code":"class Base {\n  constructor() {\n    console.log(\"สร้าง Base\");\n  }\n}\n\nclass Derived extends Base {\n  constructor() {\n    super();\n    console.log(\"สร้าง Derived\");\n  }\n}\n\nnew Derived();","codeLang":"typescript","options":[{"id":"A","text":"สร้าง Derived แล้วตามด้วย สร้าง Base เพราะ constructor ของ subclass ทำงานก่อน","correct":false,"why":"constructor ของ subclass เริ่มทำงานก่อนก็จริง แต่บรรทัด super() ทำให้ constructor ของคลาสแม่ทำงานจบก่อนส่วนที่เหลือของ subclass"},{"id":"B","text":"สร้าง Derived อย่างเดียว เพราะ constructor ของ Base ไม่ถูกเรียกเมื่อสร้าง object ชนิด Derived","correct":false,"why":"ส่วนของคลาสแม่ต้องถูกสร้างเสมอ และ super() คือการเรียก constructor ของคลาสแม่โดยตรง"},{"id":"C","text":"สร้าง Base แล้วตามด้วย สร้าง Derived เพราะ super() เรียก constructor ของคลาสแม่ก่อน","correct":true,"why":"ถูกต้อง สร้างส่วนของคลาสแม่ให้เสร็จก่อน แล้วจึงสร้างส่วนเพิ่มเติมของ subclass"},{"id":"D","text":"เกิด error เพราะข้อความใน Derived ต้องถูกพิมพ์ก่อนเรียก super()","correct":false,"why":"โค้ดนี้ไม่เกิด error การพิมพ์ข้อความหลัง super() เป็นรูปแบบที่ใช้ได้ตามปกติ และผลคือ constructor ของคลาสแม่พิมพ์ก่อนเสมอ"}],"explanation":"การสร้าง object ของ subclass เริ่มจากส่วนของคลาสแม่ก่อนเสมอ ผ่านการเรียก super() จากนั้นจึงถึงส่วนของ subclass จึงควรให้ constructor ของ subclass เรียก super() ก่อนแตะ this เพื่อให้ส่วนที่สืบทอดมาพร้อมใช้งาน"},{"id":"ENG-J-E-018","level":"junior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-J1","concept":"mon-latency-percentile-vs-average","mobile":false,"type":"single","stem":"ลูกค้าบ่นว่า API ค้นหาสินค้าช้า แต่แดชบอร์ดแสดง average response time เพียง 200 ms ทีมจึงเปิดดูค่าเพิ่มเติมของช่วง 1 ชั่วโมงที่ผ่านมาได้ตามนี้ ควรอ่านผลอย่างไร","code":"endpoint: GET /products/search   (last 1 hour)\naverage : 200 ms\np50     :  90 ms\np95     : 1,400 ms\np99     : 3,800 ms","codeLang":"text","options":[{"id":"A","text":"ค่า average ต่ำจึงแปลว่าระบบเร็วพอแล้ว คำร้องเรียนน่าจะมาจากเครือข่ายหรืออุปกรณ์ของลูกค้า","correct":false,"why":"ไม่ถูกต้อง: ค่าเฉลี่ยเป็นเพียงภาพรวม ข้อมูล p95 และ p99 แสดงว่ามีคำขอจำนวนหนึ่งช้ามากจริง จึงไม่ควรโยนปัญหาไปที่ฝั่งลูกค้าก่อน"},{"id":"B","text":"คำขอส่วนใหญ่เร็ว แต่บางส่วนช้ามาก (p95, p99 สูง) ซึ่ง average ซ่อนไว้ ควรตามดูคำขอที่ช้า","correct":true,"why":"ถูกต้อง: percentile แสดงหางของการกระจายที่ค่าเฉลี่ยกลบไว้ ผู้ใช้ที่เจอคำขอช้าเหล่านั้นคือผู้ที่บ่น"},{"id":"C","text":"ควรดูเฉพาะ p50 เพราะสะท้อนประสบการณ์ของผู้ใช้ส่วนใหญ่ และ p50 ก็ต่ำอยู่แล้ว","correct":false,"why":"ไม่ถูกต้อง: p50 บอกเพียงครึ่งหนึ่งของคำขอ ผู้ใช้อีกส่วนที่เจอคำขอช้าถูกมองข้ามไป โดยเฉพาะหาง p95 และ p99"},{"id":"D","text":"ควรขยายช่วงเวลาที่ดูเป็นหลายวัน เพื่อให้ average นิ่งขึ้นก่อนค่อยวิเคราะห์","correct":false,"why":"ไม่ถูกต้อง: การขยายช่วงเวลาทำให้ค่าเฉลี่ยเจือจางยิ่งขึ้น ปัญหาในช่วงเวลาที่ช้าอาจถูกกลบหายไปอีก"}],"explanation":"ค่าเฉลี่ยของเวลาตอบสนองซ่อนคำขอที่ช้าไว้ได้ ตัวชี้วัดที่เหมาะกว่าสำหรับประสบการณ์ผู้ใช้คือ percentile เช่น p95 และ p99 เวลาอ่านแดชบอร์ดให้ดูทั้งค่ากลางและหางของการกระจายคู่กัน"},{"id":"ENG-J-E-019","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J1","concept":"mob-accessibility-form-checklist","mobile":true,"type":"multiple","stem":"ทีมกำลังทำหน้ากรอกที่อยู่จัดส่งในแอปมือถือ และต้องการให้ผู้ใช้ที่ใช้ screen reader หรือมีสายตาเลือนรางใช้งานได้ ข้อใดเป็นแนวปฏิบัติที่ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"บอกว่าช่องไหนกรอกผิดด้วยการเปลี่ยนสีขอบช่องเป็นสีแดงเท่านั้น","correct":false,"why":"ไม่ถูกต้อง: ผู้ที่ตาบอดสีหรือใช้ screen reader จะไม่รู้ว่ามีข้อผิดพลาด ควรมีข้อความอธิบายประกอบสี"},{"id":"B","text":"ให้ทุกช่องกรอกมีป้ายชื่อที่ screen reader อ่านได้ ไม่ใช้เพียงข้อความ placeholder ในช่อง","correct":true,"why":"ถูกต้อง: placeholder หายไปเมื่อเริ่มพิมพ์และอาจไม่ถูกอ่านเป็นชื่อช่อง ป้ายชื่อที่ผูกกับช่องทำให้ผู้ใช้รู้ว่ากำลังกรอกอะไร"},{"id":"C","text":"แจ้งช่องที่กรอกผิดด้วย toast ที่หายเองใน 2 วินาที เพื่อไม่ให้บังช่องกรอก","correct":false,"why":"ไม่ถูกต้อง: ข้อความที่หายเองเร็วอาจอ่านไม่ทันหรือไม่ถูกอ่านโดย screen reader ผู้ใช้จึงไม่รู้ว่าต้องแก้ช่องใด ควรให้ข้อความอยู่ติดกับช่องจนกว่าจะแก้เสร็จ"},{"id":"D","text":"ใช้ข้อความสีเทาอ่อนบนพื้นขาวเพื่อให้หน้าจอดูเรียบ","correct":false,"why":"ไม่ถูกต้อง: contrast ต่ำทำให้ผู้ที่มองเห็นไม่ชัดอ่านได้ยาก โดยเฉพาะกลางแดด"},{"id":"E","text":"ทำพื้นที่แตะของปุ่มให้ใหญ่พอ และเว้นระยะจากปุ่มข้างเคียงให้แตะไม่พลาด","correct":true,"why":"ถูกต้อง: เป้าหมายการแตะที่ใหญ่พอและไม่ชิดกันช่วยผู้ใช้ที่มีปัญหาด้านการเคลื่อนไหวและผู้ใช้ทั่วไปด้วย"}],"explanation":"accessibility บนมือถือเริ่มจากพื้นฐาน ได้แก่ ป้ายชื่อที่เครื่องอ่านได้ การไม่ใช้สีเป็นสัญญาณเพียงอย่างเดียว contrast ที่พอ และพื้นที่แตะที่ใหญ่พอ แล้วทดสอบด้วย screen reader จริงบนเครื่อง"},{"id":"ENG-J-E-020","level":"junior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-J1","concept":"test-shared-instance-order-dependence","mobile":false,"type":"single","stem":"นักพัฒนาเขียนเทสสองข้อให้คลาส Cart ด้านล่าง เมื่อรันทั้งไฟล์ เทสข้อที่สองล้มด้วยข้อความ \"Expected: 150, Received: 250\" สาเหตุที่เป็นไปได้มากที่สุดและวิธีแก้คืออะไร","code":"class Cart {\n  private items: { sku: string; price: number }[] = [];\n  add(sku: string, price: number) { this.items.push({ sku, price }); }\n  total(): number { return this.items.reduce((sum, i) => sum + i.price, 0); }\n}\n\nconst cart = new Cart();\n\ntest('one item', () => {\n  cart.add('A', 100);\n  expect(cart.total()).toBe(100);\n});\n\ntest('two items', () => {\n  cart.add('A', 100);\n  cart.add('B', 50);\n  expect(cart.total()).toBe(150);\n});","codeLang":"typescript","options":[{"id":"A","text":"เมธอด total() คำนวณผิด ควรแก้ reduce ให้เริ่มนับจาก 0 ใหม่ทุกครั้งที่เรียก เพื่อไม่ให้ค่าค้าง","correct":false,"why":"ไม่ถูกต้อง: reduce เริ่มจาก 0 อยู่แล้ว ผลรวม 250 มาจากรายการที่สะสมอยู่ใน items ไม่ใช่จากสูตรผิด"},{"id":"B","text":"ควรเปลี่ยน toBe เป็น toEqual เพราะเป็นการเปรียบเทียบตัวเลขที่ได้จากการคำนวณ","correct":false,"why":"ไม่ถูกต้อง: ตัวเลขเปรียบเทียบด้วย toBe ได้ถูกต้อง การเปลี่ยน matcher ไม่ทำให้ผลรวม 250 เปลี่ยนเป็น 150"},{"id":"C","text":"เทสทำงานแบบขนานจนผลปนกัน ควรใส่ await รอให้เทสข้อแรกจบก่อนเริ่มข้อที่สอง","correct":false,"why":"ไม่ถูกต้อง: เทสในไฟล์เดียวกันของเฟรมเวิร์กทั่วไปรันทีละข้อตามลำดับอยู่แล้ว และเทสนี้ไม่ได้เป็น async ปัญหาคือข้อมูลที่ค้างอยู่"},{"id":"D","text":"ตัวแปร cart ถูกใช้ร่วมกันทุกเทสจึงมีรายการค้างจากเทสแรก ควรสร้าง Cart ใหม่ใน beforeEach","correct":true,"why":"ถูกต้อง: 100 จากเทสแรกรวมกับ 100 และ 50 ของเทสที่สองเป็น 250 เทสที่ไม่แชร์สถานะกันจะไม่ขึ้นกับลำดับการรัน"}],"explanation":"unit test ต้องเป็นอิสระต่อกัน การสร้างอ็อบเจ็กต์ที่มีสถานะไว้นอกเทสแล้วใช้ร่วมกันทำให้ผลเทสขึ้นกับลำดับ ควรสร้างอินสแตนซ์ใหม่ในแต่ละเทส เช่นใน beforeEach เพื่อให้รันเดี่ยวหรือสลับลำดับก็ได้ผลเหมือนเดิม"},{"id":"ENG-J-E-021","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J3","concept":"web-jwt-verify-vs-decode","mobile":false,"type":"single","stem":"ผู้ทดสอบสร้าง JWT ปลอมด้วยตัวเอง โดยแก้ role ใน payload เป็น admin แล้วเรียก API ที่ใช้ middleware ด้านล่างได้สำเร็จ สาเหตุที่เป็นไปได้มากที่สุดคืออะไร","code":"import jwt from 'jsonwebtoken';\n\nexport function auth(req, res, next) {\n  const token = req.headers.authorization?.split(' ')[1];\n  if (!token) return res.status(401).end();\n  req.user = jwt.decode(token);\n  next();\n}","codeLang":"typescript","options":[{"id":"A","text":"โค้ดอ่านข้อมูลใน token โดยไม่ตรวจลายเซ็น ควรเปลี่ยนไปตรวจด้วย secret key","correct":true,"why":"ถูกต้อง: การถอดรหัสอ่านข้อมูลอย่างเดียวไม่รับประกันว่า token ออกโดยเซิร์ฟเวอร์ ต้องตรวจลายเซ็นก่อนเชื่อถือข้อมูลใน payload"},{"id":"B","text":"payload ของ JWT ไม่ได้เข้ารหัส ควรเข้ารหัส payload ด้วย AES ก่อนส่งให้ client ใช้งาน","correct":false,"why":"ไม่ถูกต้อง: การที่ payload อ่านได้ไม่ใช่ช่องโหว่ที่ทำให้ปลอม token ได้ การปลอมสำเร็จเพราะเซิร์ฟเวอร์ไม่ตรวจลายเซ็น"},{"id":"C","text":"token ไม่มีเวลาหมดอายุ (exp) จึงมีใครสร้างขึ้นมาแล้วนำมาใช้ได้ตลอดไป","correct":false,"why":"ไม่ถูกต้อง: exp จำกัดอายุของ token ที่ถูกต้อง แต่ไม่ได้ป้องกันการปลอม token ที่เซิร์ฟเวอร์ไม่ตรวจลายเซ็น"},{"id":"D","text":"ระบบรับ token ผ่าน HTTP แทน HTTPS จึงถูกดักแก้ไขระหว่างทางได้ง่าย","correct":false,"why":"ไม่ถูกต้อง: ผู้ทดสอบสร้าง token เองแล้วส่งตรงเข้า API ไม่ได้ดักของใคร ปัญหาคือฝั่งเซิร์ฟเวอร์ไม่ตรวจสอบ token"}],"explanation":"JWT ประกอบด้วย payload ที่ใครก็อ่านได้ ความน่าเชื่อถืออยู่ที่ลายเซ็น เซิร์ฟเวอร์ต้องตรวจลายเซ็นด้วยกุญแจที่ถูกต้องทุกครั้ง (เช่น เรียก verify) และตรวจเวลาหมดอายุ ก่อนนำข้อมูลใน token ไปใช้ตัดสินสิทธิ์"},{"id":"ENG-J-E-022","level":"junior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-J3","concept":"mon-maintain-monitoring-tasks","mobile":false,"type":"multiple","stem":"คุณได้รับมอบหมายให้ช่วยดูแลระบบ monitoring ของทีม ซึ่งเก็บ log, metric และส่ง alert ข้อใดเป็นงานดูแลที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้งนโยบายเก็บ log ตามอายุและตรวจพื้นที่ดิสก์ของที่เก็บ log เป็นระยะ","correct":true,"why":"ถูกต้อง: log สะสมเรื่อย ๆ ถ้าดิสก์เต็ม ระบบเก็บ log อาจหยุดทำงานเมื่อต้องการใช้ข้อมูลมากที่สุด"},{"id":"B","text":"ลบ dashboard ที่เดือนที่แล้วไม่มีใครเปิดดูทั้งหมด เพื่อให้หน้ารวมไม่รก","correct":false,"why":"ไม่ถูกต้อง: dashboard บางอันใช้เฉพาะตอนเกิดเหตุหรือรายงานรายไตรมาส ควรถามเจ้าของและสำรองก่อนลบ"},{"id":"C","text":"ตรวจว่า agent เก็บ metric บนเซิร์ฟเวอร์ใหม่ส่งข้อมูลเข้าระบบจริงหลังติดตั้ง","correct":true,"why":"ถูกต้อง: ถ้าติดตั้งแล้วไม่มีข้อมูลเข้า alert จะเงียบเหมือนระบบปกติ ซึ่งอันตรายกว่า"},{"id":"D","text":"ทดสอบว่าช่องทางส่งแจ้งเตือน เช่น LINE หรืออีเมล ยังถึงผู้รับเวรจริง","correct":true,"why":"ถูกต้อง: ช่องทางที่ถูกเปลี่ยนสิทธิ์หรือหมดอายุทำให้ alert ไม่ถึงคน การทดสอบเป็นระยะช่วยให้พบก่อนเกิดเหตุจริง"}],"explanation":"การดูแลระบบ monitoring ครอบคลุมทั้งตัวเก็บข้อมูล พื้นที่เก็บ และช่องทางแจ้งเตือน ต้องตรวจเป็นระยะว่าข้อมูลยังเข้า พื้นที่ยังพอ และคนรับเวรยังได้รับแจ้งจริง เพราะ monitoring ที่เสียเงียบ ๆ อันตรายกว่าไม่มี"},{"id":"ENG-J-E-023","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J4","concept":"web-error-response-leak-details","mobile":false,"type":"single","stem":"ทีมกำลังทบทวนโค้ด endpoint ด้านล่างก่อนขึ้น production ข้อใดเป็นความเสี่ยงหลักของ error handler นี้","code":"app.get('/orders/:id', async (req, res) => {\n  try {\n    const order = await db.orders.findById(req.params.id);\n    res.json(order);\n  } catch (err) {\n    res.status(500).json({ error: err.message, stack: err.stack });\n  }\n});","codeLang":"typescript","options":[{"id":"A","text":"การตอบ 500 ทำให้ client ลองเรียกซ้ำไม่หยุด จนเซิร์ฟเวอร์ถูกเรียกถี่ขึ้นเรื่อย ๆ","correct":false,"why":"ไม่ถูกต้อง: การตอบ 500 ไม่ได้บังคับให้ client ลองซ้ำ พฤติกรรมการลองใหม่ขึ้นกับการเขียนฝั่ง client"},{"id":"B","text":"catch ดักข้อผิดพลาดไว้เองจนทำให้ process ของเซิร์ฟเวอร์หยุดทำงานทั้งระบบ","correct":false,"why":"ไม่ถูกต้อง: catch ที่ตอบกลับได้ทำให้ process ทำงานต่อ ไม่ได้ทำให้หยุด"},{"id":"C","text":"ผู้เรียกเห็น error และ stack trace ภายใน ควรเก็บไว้ใน log แล้วตอบข้อความทั่วไป","correct":true,"why":"ถูกต้อง: stack trace และข้อความ error อาจเผยชื่อตาราง path ของโค้ด หรือเวอร์ชันไลบรารี ซึ่งช่วยผู้โจมตีวางแผน"},{"id":"D","text":"async handler ใช้ try/catch ไม่ได้ ต้องส่ง error ผ่าน callback เท่านั้นจึงจะดักได้","correct":false,"why":"ไม่ถูกต้อง: async/await ใช้ try/catch ดัก error ได้ตามปกติ"}],"explanation":"อย่าส่งรายละเอียดภายในของ error กลับไปให้ผู้เรียก ให้บันทึกรายละเอียดใน log ฝั่งเซิร์ฟเวอร์ แล้วตอบด้วย status ที่เหมาะสมกับข้อความทั่วไป อาจแนบรหัสอ้างอิงเพื่อให้ทีมค้น log ได้ภายหลัง"},{"id":"ENG-J-E-024","level":"junior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-J2","concept":"test-missing-negative-case","mobile":true,"type":"single","stem":"แอปมือถือมีฟังก์ชันตัดยอดเงินใน wallet พร้อมเทสหนึ่งข้อตามโค้ดด้านล่าง ข้อกำหนดบอกว่ายอดเงินห้ามติดลบ ข้อใดเป็นกรณีทดสอบที่ควรเพิ่มเป็นอันดับแรก","code":"export function pay(balance: number, amount: number): number {\n  if (amount > balance) throw new Error('INSUFFICIENT_FUNDS');\n  return balance - amount;\n}\n\ntest('pays when balance is enough', () => {\n  expect(pay(500, 200)).toBe(300);\n});","codeLang":"typescript","options":[{"id":"A","text":"เรียก pay(500, 200) อีกครั้งในเทสใหม่ เพื่อยืนยันว่าผลลัพธ์คงที่","correct":false,"why":"ไม่ถูกต้อง: เป็นกรณีเดียวกับเทสเดิมทุกประการ ไม่ได้เพิ่มความครอบคลุมใหม่"},{"id":"B","text":"เรียก pay(100, 200) แล้วตรวจว่าโยน INSUFFICIENT_FUNDS","correct":true,"why":"ถูกต้อง: เป็นเส้นทางที่ข้อกำหนดเรื่องห้ามติดลบพึ่งพา และยังไม่มีเทสใดตรวจ"},{"id":"C","text":"เรียก pay(500, 100) และ pay(500, 50) ซึ่งยอดเงินพอทั้งคู่","correct":false,"why":"ไม่ถูกต้อง: เป็นกรณียอดเงินพอเหมือนเดิม เพิ่มจำนวนเทสแต่ไม่เพิ่มพฤติกรรมที่ตรวจ"},{"id":"D","text":"ตรวจว่า pay คืนค่าชนิด number เมื่อเรียกด้วย 500 และ 200","correct":false,"why":"ไม่ถูกต้อง: เทสเดิมที่ตรวจว่าได้ 300 ครอบคลุมเรื่องนี้อยู่แล้ว และการตรวจแค่ชนิดอ่อนกว่า"}],"explanation":"เทสชุดแรกมักเขียนเฉพาะเส้นทางปกติ (happy path) ให้ไล่ดูข้อกำหนดแล้วถามว่าพฤติกรรมใดยังไม่มีเทสตรวจ โดยเฉพาะกรณีผิดพลาดและค่าขอบ เช่น ยอดเงินไม่พอ และพิจารณากรณี amount เท่ากับ balance เพิ่มด้วย"},{"id":"ENG-J-E-025","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J5","concept":"mob-third-party-rate-limit-429","mobile":true,"type":"single","stem":"แอปมือถือแสดงอัตราแลกเปลี่ยนโดยเรียก API ของผู้ให้บริการภายนอกจากเครื่องผู้ใช้ทุก 1 วินาที เมื่อผู้ใช้เพิ่มขึ้น บางเครื่องเริ่มได้ตอบกลับ 429 Too Many Requests พร้อม header Retry-After: 30 ควรปรับแอปอย่างไร","options":[{"id":"A","text":"ลดความถี่ในการเรียก เก็บค่าล่าสุดไว้แสดง และรอตามเวลา Retry-After ก่อนเรียกครั้งถัดไป","correct":true,"why":"ถูกต้อง: 429 บอกให้ลดอัตราการเรียก การรอตามที่ผู้ให้บริการกำหนดและลดความถี่ทำให้แอปทำงานต่อได้โดยไม่ถูกจำกัดซ้ำ"},{"id":"B","text":"เรียกซ้ำทันทีเมื่อได้ 429 จนกว่าจะได้ 200 เพื่อให้ข้อมูลที่แสดงเป็นปัจจุบันที่สุดตลอดเวลา","correct":false,"why":"ไม่ถูกต้อง: การเรียกซ้ำทันทีเพิ่มภาระและอาจทำให้ถูกจำกัดนานขึ้นหรือถูกระงับการใช้งาน"},{"id":"C","text":"สร้างหลาย API key แล้วสลับใช้เพื่อเลี่ยงเพดานการเรียกของแต่ละคีย์ให้พ้นขีดจำกัด","correct":false,"why":"ไม่ถูกต้อง: เป็นการหลบข้อจำกัดที่ผู้ให้บริการตั้งไว้ อาจผิดข้อตกลงการใช้งานและทำให้ถูกระงับคีย์ทั้งหมด"},{"id":"D","text":"เปลี่ยนจาก GET เป็น POST เพราะ POST ไม่ถูกนับรวมในโควตาการเรียกของผู้ให้บริการ","correct":false,"why":"ไม่ถูกต้อง: ผู้ให้บริการนับคำขอทุกแบบ การเปลี่ยน method ไม่ช่วยและอาจขัดกับเอกสาร API"}],"explanation":"เมื่อเรียก API ภายนอกต้องอ่านข้อจำกัดอัตราการเรียกและตอบสนองต่อ 429 ให้เหมาะสม เช่น เคารพ Retry-After ลดความถี่ ใช้ค่าที่เก็บไว้ชั่วคราว และไม่พยายามหลบเพดานของผู้ให้บริการ"},{"id":"ENG-J-E-026","level":"junior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-J2","concept":"mon-escalation-when-stuck","mobile":false,"type":"single","stem":"คุณเป็นวิศวกรเวรตอนดึก พบว่าผู้ใช้บางส่วนชำระเงินไม่ผ่านมาตั้งแต่ 23:40 คุณทำตาม runbook ครบทุกขั้น (ตรวจสถานะบริการ รีสตาร์ท worker) แต่อาการยังอยู่ ข้อใดเป็นสิ่งที่ควรทำต่อ","options":[{"id":"A","text":"ลองปรับค่า configuration ของ production ตามที่คาดว่าน่าจะช่วย เพื่อให้แก้เสร็จก่อนเช้า","correct":false,"why":"ไม่ถูกต้อง: การปรับค่าบน production ตามการเดาโดยไม่ปรึกษาใครอาจทำให้ปัญหาแย่ลง และไม่มีใครรู้ว่าเปลี่ยนอะไรไป"},{"id":"B","text":"บันทึกไว้ใน ticket แล้วรอให้ทีมเข้างานตอนเช้าจึงค่อยแจ้ง เพราะกระทบผู้ใช้เพียงบางส่วน","correct":false,"why":"ไม่ถูกต้อง: การชำระเงินไม่ผ่านกระทบรายได้โดยตรง การรอหลายชั่วโมงทำให้ผู้ใช้เสียหายต่อเนื่อง ทั้งที่มีผู้ติดต่อลำดับถัดไปตามนโยบาย on-call"},{"id":"C","text":"ลองรีสตาร์ทบริการอื่นที่เกี่ยวข้องไปทีละตัวจนกว่าอาการจะหาย โดยไม่แจ้งใคร","correct":false,"why":"ไม่ถูกต้อง: การรีสตาร์ทแบบสุ่มอาจกระทบบริการอื่นที่ปกติดี และทำลายหลักฐานที่ใช้หาสาเหตุ"},{"id":"D","text":"ยกระดับไปยังผู้ติดต่อลำดับถัดไปตามนโยบาย on-call พร้อมแจ้งสิ่งที่ตรวจแล้วและผลที่ได้","correct":true,"why":"ถูกต้อง: เมื่อ runbook แก้ไม่ได้ ควรขอความช่วยเหลือจากผู้ที่มีความรู้เพิ่มตามลำดับที่กำหนด พร้อมบันทึกที่ทำไปแล้วเพื่อไม่ต้องทำซ้ำ"}],"explanation":"runbook ครอบคลุมเฉพาะกรณีที่คาดไว้ เมื่อทำครบแล้วอาการยังอยู่ให้ยกระดับตามนโยบาย on-call ไม่ใช่เดาแก้เองหรือรอ และควรบันทึกสิ่งที่ตรวจและผลลัพธ์ลง ticket เพื่อให้คนถัดไปต่อยอดได้ทันที"},{"id":"ENG-J-E-027","level":"junior","pool":"exam","competency":"Monitoring and Logging","descriptor":"MON-J4","concept":"mon-old-app-version-api-change","mobile":true,"type":"single","stem":"ตอน 10:00 ทีมแบ็กเอนด์ deploy API เวอร์ชันใหม่ หลังจากนั้นผู้ใช้แอปมือถือรายงานว่าหน้ารายการสินค้าว่าง ทีมสรุป error ใน log ฝั่งแอปตั้งแต่ 10:00 แยกตามเวอร์ชันแอปได้ดังนี้ ข้อใดควรตรวจและแก้เป็นอันดับแรก","code":"errors in app logs since 10:00, grouped by appVersion\nappVersion   count   message\n2.4.0            3   ProductListParser: missing field \"price\"\n2.3.2        9,870   ProductListParser: missing field \"price\"\n2.3.1        4,120   ProductListParser: missing field \"price\"","codeLang":"text","options":[{"id":"A","text":"เป็นปัญหาของแอปรุ่นเก่า ควรบังคับให้ผู้ใช้ทุกคนอัปเดตเป็น 2.4.0 ก่อน แล้วค่อยปิดเรื่องนี้","correct":false,"why":"ไม่ถูกต้อง: ผู้ใช้รุ่นเก่ายังใช้งานอยู่จริง การอัปเดตทั้งหมดใช้เวลานาน และยังไม่ได้ตรวจว่า API ที่เพิ่ง deploy เปลี่ยนอะไร"},{"id":"B","text":"อุปกรณ์ของผู้ใช้เวอร์ชันเก่ามีหน่วยความจำไม่พอ ควรแนะนำให้ผู้ใช้ล้างแคชของแอปเองก่อน","correct":false,"why":"ไม่ถูกต้อง: ข้อความ error เหมือนกันทุกเวอร์ชันและชี้ว่าข้อมูลที่ได้รับไม่มี field ที่ต้องการ ไม่เกี่ยวกับหน่วยความจำ"},{"id":"C","text":"API ที่ deploy ตอน 10:00 อาจไม่มี field price ที่แอปรุ่นเก่ายังใช้ ควรตรวจ diff ของ API","correct":true,"why":"ถูกต้อง: error เริ่มหลัง deploy และเกิดกับแอปรุ่นเก่าที่คาดหวังรูปแบบข้อมูลเดิม จึงควรเริ่มจากการเปลี่ยนแปลงของ API"},{"id":"D","text":"เป็นปัญหา cache ของ CDN ควรล้าง cache ของรายการสินค้าทั้งหมดที่เก็บไว้บน CDN ทันที","correct":false,"why":"ไม่ถูกต้อง: error เป็นการ parse ข้อมูลที่ขาด field ในแอป และไม่มีข้อมูลที่ชี้ว่าเป็นเรื่อง cache การล้างอาจไม่แก้อะไรและเพิ่มภาระเซิร์ฟเวอร์"}],"explanation":"เมื่อ error เริ่มหลัง deploy และเกิดกับแอปรุ่นเก่ามากกว่ารุ่นใหม่ ควรสงสัยว่า API เปลี่ยนจนไม่เข้ากับแอปรุ่นที่ยังใช้งานอยู่ แอปมือถือต่างจากเว็บตรงที่ผู้ใช้ไม่ได้อัปเดตพร้อมกัน API จึงต้องรองรับแอปรุ่นเก่าไปอีกระยะ"},{"id":"ENG-J-E-028","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J2","concept":"web-xss-output-handling","mobile":false,"type":"multiple","stem":"หน้ารีวิวสินค้าของเว็บแสดงความคิดเห็นที่ผู้ใช้พิมพ์ ผู้ทดสอบโพสต์ข้อความที่มีแท็ก \u003cscript> แล้วพบว่าสคริปต์ทำงานเมื่อผู้ใช้คนอื่นเปิดหน้านั้น ข้อใดช่วยป้องกันปัญหานี้ได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"แสดงความคิดเห็นเป็นข้อความธรรมดา โดย escape อักขระพิเศษของ HTML แทนการแทรกเป็น HTML","correct":true,"why":"ถูกต้อง: เมื่อ \u003c และ > ถูกแสดงเป็นตัวอักษร เบราว์เซอร์จะไม่ตีความเป็นแท็กและไม่รันสคริปต์"},{"id":"B","text":"ตรวจหาแท็ก \u003cscript> ในฟอร์มฝั่ง browser ก่อนส่งความคิดเห็น","correct":false,"why":"ไม่ถูกต้อง: ผู้โจมตีส่ง request ตรงไปยังเซิร์ฟเวอร์ข้ามฟอร์มได้ และยังมีวิธีฝังสคริปต์แบบอื่นที่ไม่ใช้แท็กนี้"},{"id":"C","text":"ตั้ง Content-Security-Policy เพื่อจำกัดแหล่งสคริปต์ที่อนุญาตให้ทำงาน เป็นชั้นป้องกันเสริม","correct":true,"why":"ถูกต้อง: CSP ช่วยลดความเสียหายเมื่อมีสคริปต์แปลกปลอมหลุดมา แต่ไม่ควรใช้แทนการ escape ข้อมูลที่แสดง"},{"id":"D","text":"ใช้ token ป้องกัน CSRF กับฟอร์มส่งความคิดเห็น","correct":false,"why":"ไม่ถูกต้อง: CSRF ป้องกันการส่งคำขอแทนผู้ใช้จากเว็บอื่น ซึ่งเป็นการโจมตีคนละแบบกับการฝังสคริปต์ผ่านข้อมูลที่แสดง"}],"explanation":"XSS เกิดเมื่อข้อมูลจากผู้ใช้ถูกแสดงเป็น HTML หรือสคริปต์ ทางป้องกันหลักคือ escape ตามบริบทตอนแสดงผล (หรือใช้ API ของเฟรมเวิร์กที่ทำให้) และเสริมด้วย CSP การตรวจฝั่ง browser และ CSRF token แก้คนละปัญหา"},{"id":"ENG-J-E-029","level":"junior","pool":"exam","competency":"Web & Mobile Development","descriptor":"WEB-J2","concept":"mob-permission-request-minimal","mobile":true,"type":"single","stem":"ทีมส่งแอปขนส่งขึ้นร้านแอปแล้วถูกปฏิเสธ เหตุผลคือแอปขอสิทธิ์เข้าถึงตำแหน่งที่ตั้งตลอดเวลาตั้งแต่เปิดแอปครั้งแรก ทั้งที่ฟีเจอร์ที่ใช้ตำแหน่งมีเพียงหน้าติดตามพัสดุ ควรแก้อย่างไร","options":[{"id":"A","text":"เพิ่มข้อความในคำอธิบายแอปว่าต้องใช้ตำแหน่งตลอดเวลา แล้วส่งตรวจใหม่โดยยังไม่แก้โค้ด","correct":false,"why":"ไม่ถูกต้อง: ปัญหาอยู่ที่พฤติกรรมของแอปที่ขอสิทธิ์เกินความจำเป็น คำอธิบายที่เพิ่มไม่ได้เปลี่ยนสิ่งนั้น"},{"id":"B","text":"ขอสิทธิ์ตำแหน่งแบบแม่นยำสูงสุดเสมอ เพราะแม่นยำกว่าจึงตรงกับเหตุผลของฟีเจอร์ติดตาม","correct":false,"why":"ไม่ถูกต้อง: ความแม่นยำสูงและการขอตลอดเวลายิ่งเกินความจำเป็นของฟีเจอร์ที่ใช้ตำแหน่งเป็นบางหน้า"},{"id":"C","text":"ขอสิทธิ์ตำแหน่งตอนผู้ใช้เปิดหน้าติดตามพัสดุ พร้อมอธิบายเหตุผลก่อนขอ และขอเท่าที่ฟีเจอร์ต้องใช้","correct":true,"why":"ถูกต้อง: ขอตอนที่ใช้งานจริงพร้อมเหตุผลที่ผู้ใช้เข้าใจ และขอระดับสิทธิ์ที่จำเป็นเท่านั้น ตรงกับแนวทางของร้านแอปและหลักความเป็นส่วนตัว"},{"id":"D","text":"ย้ายคำขอสิทธิ์ไปไว้ที่หน้าแรกพร้อมปุ่มยอมรับทั้งหมดในครั้งเดียว เพื่อให้ผู้ใช้ตอบจบในคราวเดียว","correct":false,"why":"ไม่ถูกต้อง: ยังเป็นการขอสิทธิ์ล่วงหน้าโดยผู้ใช้ไม่เห็นเหตุผล และการรวมหลายสิทธิ์ทำให้ผู้ใช้ปฏิเสธหรือเลิกใช้แอปได้ง่าย"}],"explanation":"ขอสิทธิ์ของอุปกรณ์เท่าที่ฟีเจอร์ต้องใช้ และขอในจังหวะที่ผู้ใช้เข้าใจเหตุผล เช่น ตอนเปิดฟีเจอร์นั้น วิธีนี้ทั้งผ่านการ review ได้ง่ายขึ้นและสอดคล้องกับหลักการให้ข้อมูลเท่าที่จำเป็นตาม PDPA"},{"id":"ENG-J-E-030","level":"junior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-J2","concept":"test-case-design-otp-validation","mobile":true,"type":"multiple","stem":"ทีมมือถือเขียนเทสให้ validateOtp(code) ที่ตรวจว่ารหัส OTP ต้องเป็นตัวเลข 6 หลักพอดี ก่อนส่งไปยืนยันกับเซิร์ฟเวอร์ ตอนนี้มีเทสเดียวคือรหัส \"123456\" ที่คาดว่าผ่าน ข้อใดเป็นกรณีที่ควรเพิ่มเพื่อให้ครอบคลุมเงื่อนไขจริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"\"12345\" และ \"1234567\" ซึ่งสั้นไปและยาวไปหนึ่งหลัก คาดว่าไม่ผ่าน","correct":true,"why":"ถูกต้อง: ทดสอบขอบของความยาวทั้งสองด้าน ซึ่งเป็นจุดที่เงื่อนไขความยาวมักเขียนพลาด"},{"id":"B","text":"\"654321\", \"111111\" และ \"999999\" ซึ่งเป็นรหัสที่ถูกต้องเช่นเดียวกัน","correct":false,"why":"ไม่ถูกต้อง: ทั้งหมดเป็นกรณีประเภทเดียวกับ \"123456\" ที่มีเทสอยู่แล้ว เพิ่มจำนวนเทสแต่ไม่เพิ่มเงื่อนไขที่ตรวจ"},{"id":"C","text":"\"12a456\" ซึ่งยาว 6 ตัวแต่มีตัวอักษรแทรก คาดว่าไม่ผ่าน","correct":true,"why":"ถูกต้อง: ตรวจเงื่อนไขว่าต้องเป็นตัวเลขล้วน ซึ่งเป็นเงื่อนไขคนละข้อกับความยาว"},{"id":"D","text":"ขอ OTP จริงจาก SMS ของบริการภายนอกแล้วนำมากรอกในเทส","correct":false,"why":"ไม่ถูกต้อง: ทำให้ผลเทสขึ้นกับเครือข่ายและบริการภายนอก รันซ้ำอัตโนมัติไม่ได้ และไม่ได้ตรวจเงื่อนไขของ validateOtp โดยตรง"}],"explanation":"การออกแบบกรณีทดสอบควรไล่ตามเงื่อนไขของข้อกำหนดทีละข้อ ได้แก่ ความยาว (รวมค่าขอบทั้งสองด้าน) และชนิดอักขระ หลีกเลี่ยงการเพิ่มเทสที่เป็นกรณีเดียวกันซ้ำ ๆ และไม่พึ่งบริการภายนอกเมื่อทดสอบตรรกะการตรวจรูปแบบ"},{"id":"ENG-J-E-031","level":"junior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-J3","concept":"test-mock-contract-drift","mobile":false,"type":"single","stem":"เทสของ ShippingService ใช้ mock ของ CarrierClient ที่คืน { fee: 45 } และผ่านทั้งหมด แต่หลังขึ้น production ระบบคำนวณค่าส่งได้ NaN เมื่อตรวจพบว่า API จริงของผู้ให้บริการขนส่งคืนฟิลด์ชื่อ shippingFee แทน fee ควรปรับวิธีใช้ mock อย่างไรเพื่อลดปัญหานี้","options":[{"id":"A","text":"ยกเลิก mock ทั้งหมดและให้ทุกเทสเรียก API จริงของผู้ให้บริการขนส่งทุกครั้งที่รัน เพื่อให้ได้รูปแบบข้อมูลจริง","correct":false,"why":"ไม่ถูกต้อง: เทสจะช้า ขึ้นกับเครือข่ายและโควตาของผู้ให้บริการ และอาจมีค่าใช้จ่าย ควรแยกการตรวจรูปแบบจริงเป็นเทสอีกชั้นหนึ่ง"},{"id":"B","text":"ให้ข้อมูลใน mock ตามรูปแบบจริงจากเอกสารของผู้ให้บริการ และเพิ่มเทส integration กับ sandbox เป็นระยะ","correct":true,"why":"ถูกต้อง: mock ที่ตรงกับรูปแบบจริงทำให้ unit test สะท้อนความเป็นจริง ส่วนเทสกับ sandbox ช่วยจับกรณีที่ API เปลี่ยนโดยที่ mock ไม่ทัน"},{"id":"C","text":"เพิ่มจำนวน mock ให้คืนค่าหลายแบบ เช่น fee เท่ากับ 0, 45 และ 9999 ในเทสเดิม","correct":false,"why":"ไม่ถูกต้อง: ค่าต่างกันแต่ยังใช้ชื่อฟิลด์ผิดเหมือนเดิม จึงไม่ช่วยจับกรณีที่โครงสร้างข้อมูลไม่ตรงกับ API จริง"},{"id":"D","text":"ใช้ชนิด any ให้ผลตอบกลับใน mock เพื่อให้เทสยืดหยุ่นกับการเปลี่ยนแปลงของรูปแบบข้อมูล","correct":false,"why":"ไม่ถูกต้อง: any ปิดการตรวจชนิดข้อมูล ทำให้ความไม่ตรงกันของโครงสร้างไม่ถูกจับตั้งแต่ตอน compile หรือตอนเทส"}],"explanation":"mock ที่ไม่ตรงกับพฤติกรรมจริงทำให้เทสผ่านทั้งที่ระบบจริงพัง ให้สร้างข้อมูลจำลองจากรูปแบบจริงในเอกสารหรือตัวอย่างของผู้ให้บริการ และมีเทสระดับ integration ที่ตรวจกับของจริงหรือ sandbox เป็นระยะ เพื่อจับความเปลี่ยนแปลงของสัญญา"},{"id":"ENG-J-E-032","level":"junior","pool":"exam","competency":"Unit & Functional Testing","descriptor":"TST-J3","concept":"test-coupon-service-spy-assertions","mobile":true,"type":"multiple","stem":"ในแอปมือถือ CouponService.apply(code) เรียก CouponApi เพื่อตรวจคูปอง ส่งผลให้หน้าจอ และเรียก AnalyticsTracker บันทึกเหตุการณ์เมื่อใช้คูปองสำเร็จ ข้อใดเป็นแนวทางเขียน unit test ที่เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้ง CouponApi จำลองให้ตอบว่าคูปองหมดอายุ แล้วตรวจว่าผลที่ส่งให้หน้าจอเป็นข้อความคูปองหมดอายุ","correct":true,"why":"ถูกต้อง: การจำลองกรณีล้มเหลวทำให้ทดสอบเส้นทาง error ของ CouponService ได้โดยไม่ต้องรอให้ backend ตอบแบบนั้นจริง"},{"id":"B","text":"ตั้ง CouponApi จำลองให้ตอบสำเร็จอย่างเดียว เพราะกรณีคูปองไม่ถูกต้องเป็นหน้าที่ของ backend ที่จะทดสอบ","correct":false,"why":"ไม่ถูกต้อง: แอปมีตรรกะจัดการคำตอบที่ล้มเหลวเป็นของตัวเอง ซึ่งต้องมีเทสของฝั่งแอป"},{"id":"C","text":"ใช้ AnalyticsTracker จำลอง แล้วตรวจว่ารับชื่อเหตุการณ์และรหัสคูปองตรงกับที่ผู้ใช้ใช้ เมื่อใช้คูปองสำเร็จ","correct":true,"why":"ถูกต้อง: ของจำลองบันทึกอาร์กิวเมนต์ที่ถูกส่งมา จึงตรวจเนื้อหาของเหตุการณ์ได้โดยไม่ต้องส่งข้อมูลวิเคราะห์จริง"},{"id":"D","text":"ตรวจลำดับการเรียกเมธอด private ภายใน CouponService ว่าตรงกับโค้ดที่เขียนไว้ทุกขั้น","correct":false,"why":"ไม่ถูกต้อง: ผูกเทสกับรายละเอียดการเขียนภายใน ทำให้เทสล้มเมื่อ refactor ทั้งที่พฤติกรรมที่ผู้ใช้เห็นไม่เปลี่ยน"},{"id":"E","text":"สร้าง mock ใหม่ในแต่ละเทส เพื่อให้ประวัติการเรียกจากเทสก่อนหน้าไม่ปนเข้ามา","correct":true,"why":"ถูกต้อง: ของจำลองที่ใช้ซ้ำสะสมประวัติการเรียก ทำให้การตรวจจำนวนครั้งหรืออาร์กิวเมนต์ผิดเพี้ยน"}],"explanation":"เทสของคลาสที่พึ่งพาบริการภายนอกควรจำลอง dependency ทั้งกรณีสำเร็จและล้มเหลว ตรวจผลลัพธ์ที่ผู้ใช้หรือหน้าจอเห็น และตรวจการเรียก dependency ผ่านของจำลอง ไม่ผูกกับรายละเอียดภายใน และเริ่มทุกเทสด้วยของจำลองที่สะอาด"}]},"senior":{"practice":[{"id":"ENG-S-P-001","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S1","concept":"git-hotfix-branch-base-from-production","mobile":false,"type":"single","stem":"ระบบ production รันเวอร์ชัน v2.4.0 ซึ่งตรงกับ main และมี tag กำกับไว้ ส่วน develop มีฟีเจอร์ของรอบถัดไปที่ทำเสร็จเพียงครึ่งทางรวมอยู่ด้วย ทีมพบบั๊กคำนวณส่วนลดผิดใน production และต้องแก้ภายในวันนี้ โดยห้ามพาฟีเจอร์ที่ยังไม่พร้อมขึ้นไปด้วย ควรทำอย่างไรจึงเหมาะสมที่สุด","options":[{"id":"A","text":"แตก branch hotfix จาก develop แล้วแก้บั๊กที่นั่น จากนั้น deploy จาก develop เพราะเป็น branch ที่มีโค้ดล่าสุดที่ผ่าน CI แล้ว และทีมกำลังทำงานอยู่ที่นั่นทุกวัน","correct":false,"why":"develop มีฟีเจอร์ที่ยังไม่ผ่านการทดสอบรอบ release ปนอยู่ การ deploy จาก branch นี้จึงพาโค้ดครึ่งทางขึ้น production ไปด้วย ซึ่งขัดกับเงื่อนไขในโจทย์"},{"id":"B","text":"แก้บั๊กบน develop ก่อน แล้ว revert commit ของฟีเจอร์ครึ่งทางทั้งหมดออกชั่วคราวเพื่อให้ develop พร้อม deploy จากนั้นค่อย revert การ revert นั้นกลับมาเมื่อฟีเจอร์เสร็จ","correct":false,"why":"ต้อง revert หลาย commit แล้วนำกลับมาทีหลัง ทั้งเสี่ยงพลาดและทำให้ history ของ develop ซับซ้อน ทั้งที่มีจุดอ้างอิงที่ตรงกับ production อยู่แล้วคือ main และ tag"},{"id":"C","text":"แตก hotfix branch จาก main ที่มี tag v2.4.0 แก้และทดสอบ แล้ว merge เข้า main พร้อมติด tag v2.4.1 จากนั้นนำการแก้กลับเข้า develop ด้วยการ merge หรือ cherry-pick","correct":true,"why":"ถูก เพราะ hotfix เริ่มจากโค้ดที่ production ใช้อยู่จริง จึงไม่พาฟีเจอร์อื่นไปด้วย การติด tag ทำให้ตรวจย้อนหลังได้ และการนำการแก้กลับเข้า develop กันไม่ให้บั๊กเดิมกลับมาในรอบ release ถัดไป"},{"id":"D","text":"แตก hotfix branch จาก main แก้และทดสอบ แล้ว merge เข้า main และ deploy ทันที โดยปล่อยให้ develop ได้รับการแก้นี้ตอนถึงรอบ release ถัดไปตามขั้นตอนปกติของทีม","correct":false,"why":"จุดเริ่มต้นถูกต้อง แต่ develop ไม่ได้รับการแก้ บั๊กเดิมจึงยังอยู่ในโค้ดของรอบหน้า และอาจเกิด conflict ใหญ่ตอน release เพราะไฟล์เดียวกันถูกแก้แยกกัน"}],"explanation":"Hotfix ต้องเริ่มจากโค้ดที่ production ใช้อยู่จริง (main หรือ tag ล่าสุด) ไม่ใช่จาก develop ที่มีงานค้าง และต้องจบด้วยสองอย่างเสมอ คือติด tag เวอร์ชันใหม่เพื่อให้ย้อนตรวจได้ และนำการแก้กลับเข้า develop (หรือ release branch ที่เปิดอยู่) เพื่อไม่ให้บั๊กเดิมกลับมา"},{"id":"ENG-S-P-002","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S1","concept":"git-release-branch-stabilisation-rules","mobile":false,"type":"multiple","stem":"ทีมแตก branch release/3.0 จาก develop เพื่อเตรียมปล่อยเวอร์ชัน 3.0 ในอีก 2 สัปดาห์ ขณะที่ทีมอื่นพัฒนาฟีเจอร์ของเวอร์ชัน 3.1 ต่อบน develop แนวปฏิบัติใดเหมาะสมกับ release branch นี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"merge develop เข้า release/3.0 เป็นระยะ เพื่อให้ release branch ได้โค้ดล่าสุดตลอดช่วงที่ QA ทดสอบ","correct":false,"why":"การ merge develop เข้ามาพาฟีเจอร์ของ 3.1 เข้ามาปนใน release ที่กำลังทดสอบ ทำให้สิ่งที่ปล่อยจริงไม่ตรงกับสิ่งที่ QA ผ่านมาแล้ว"},{"id":"B","text":"แก้เฉพาะบั๊กและงานเตรียม release เช่น ปรับเลขเวอร์ชันและเอกสารบน release/3.0 โดยไม่เพิ่มฟีเจอร์ใหม่เข้ามา","correct":true,"why":"ถูก เพราะ release branch มีไว้ให้เนื้อหานิ่ง การเพิ่มฟีเจอร์ใหม่ระหว่างทดสอบทำให้ผลทดสอบที่ผ่านไปแล้วใช้ไม่ได้"},{"id":"C","text":"ติด tag v3.0.0 ที่ commit ล่าสุดของ develop ทันทีที่ QA ผ่าน เพราะ develop เป็นที่รวมโค้ดทั้งหมดของทีม","correct":false,"why":"develop มีโค้ดของ 3.1 อยู่ด้วย tag จึงชี้ไปที่โค้ดที่ไม่ใช่สิ่งที่ผ่านการทดสอบและไม่ใช่สิ่งที่ปล่อย"},{"id":"D","text":"เมื่อแก้บั๊กบน release/3.0 ให้นำการแก้นั้น merge กลับเข้า develop ด้วย เพื่อให้เวอร์ชัน 3.1 ไม่กลับมามีบั๊กเดิม","correct":true,"why":"ถูก เพราะการแก้บน release branch ไม่ไปอยู่ใน develop เอง หากไม่นำกลับ บั๊กเดิมจะโผล่อีกในรอบถัดไป"},{"id":"E","text":"เมื่อ QA ผ่านให้ merge release/3.0 เข้า main แล้วติด tag v3.0.0 ที่ commit บน main นั้น","correct":true,"why":"ถูก เพราะ main และ tag แทนสิ่งที่ปล่อยจริง และ tag ที่ชี้ commit นี้ตรงกับโค้ดที่ผ่านการทดสอบพอดี"}],"explanation":"หลัก release branch คือแช่แข็งเนื้อหา แก้เฉพาะบั๊ก แล้วส่งการแก้ไปสองทาง ทางหนึ่งไปที่ main พร้อม tag อีกทางกลับเข้า develop ส่วนการดึง develop เข้ามาหรือ tag ที่ develop ทำให้สิ่งที่ปล่อยไม่ตรงกับสิ่งที่ทดสอบ"},{"id":"ENG-S-P-003","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S2","concept":"git-update-shared-feature-branch-safely","mobile":false,"type":"multiple","stem":"นักพัฒนา 3 คนทำงานร่วมกันบน branch feature/checkout ที่ push ขึ้น remote แล้ว และทุกคนมีสำเนาในเครื่องที่มี commit ของตัวเอง ระหว่างนี้ main มีการเปลี่ยนแปลงใหม่ ทีมต้องการอัปเดต feature/checkout ให้ทันกับ main โดยไม่ทำให้งานของเพื่อนร่วมทีมเสียหาย วิธีใดเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"merge main เข้า feature/checkout แล้ว push ตามปกติ","correct":true,"why":"ถูก เพราะการ merge เพิ่ม commit ต่อท้าย history เดิม ไม่เขียน history ที่เพื่อนถืออยู่ใหม่ ทุกคนจึง pull ต่อได้ตามปกติ"},{"id":"B","text":"rebase feature/checkout ลงบน main ในเครื่อง แล้ว push -f ทับ remote ทันที เพราะ history เป็นเส้นตรงดีกว่า","correct":false,"why":"rebase เปลี่ยน hash ของ commit ที่ push ไปแล้ว การ push -f ทับอาจลบ commit ใหม่ที่เพื่อน push ไว้ และสำเนาของเพื่อนจะแยกจาก history ใหม่จนต้องแก้กันวุ่นวาย"},{"id":"C","text":"ลบ feature/checkout ใน remote แล้วสร้างใหม่จาก main พร้อม cherry-pick ทุก commit กลับเข้ามา","correct":false,"why":"commit ที่ cherry-pick ได้ hash ใหม่ทั้งหมด เพื่อนที่ยังถือ branch เดิมจะมี commit ซ้ำเนื้อหาแต่ hash ต่างกัน ทำให้ merge ภายหลังเกิด conflict หรือโค้ดซ้ำ"},{"id":"D","text":"ประสานกับทุกคนให้ push งานที่ค้างให้เสร็จก่อน จากนั้นให้คนเดียว rebase แล้ว push ด้วย --force-with-lease และแจ้งให้ทุกคนดึง history ใหม่ตามไป","correct":true,"why":"ถูก เพราะการ rebase บน branch ร่วมทำได้เมื่อตกลงกันก่อนและไม่มีงานค้าง ส่วน --force-with-lease จะปฏิเสธการ push หากมี commit ใหม่บน remote ที่ผู้ push ยังไม่เคยเห็น"}],"explanation":"Rebase เขียน history ใหม่ จึงเหมาะกับ branch ส่วนตัวที่ยังไม่มีใครอิง สำหรับ branch ที่ทีมใช้ร่วมกัน ทางที่ปลอดภัยคือ merge main เข้ามา หรือถ้าต้องการ history เส้นตรงจริง ให้ตกลงเวลากับทุกคนก่อนและใช้ --force-with-lease แทน push -f"},{"id":"ENG-S-P-004","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S2","concept":"git-rebase-onto-after-squash-merge","mobile":false,"type":"single","stem":"นักพัฒนา A แตก feature/cart-api ออกจาก main ส่วนนักพัฒนา B แตก feature/cart-ui ต่อจาก feature/cart-api และมี commit ของตัวเอง 3 อัน ต่อมา feature/cart-api ถูก squash merge เข้า main แล้วลบทิ้ง เมื่อ B รัน git rebase main บน feature/cart-ui เกิด conflict ในไฟล์ที่ feature/cart-api เคยแก้ ทั้งที่ B ไม่ได้แก้ไฟล์เหล่านั้น สาเหตุและวิธีแก้ที่เหมาะสมที่สุดคืออะไร","options":[{"id":"A","text":"commit เดิมของ cart-api ยังอยู่ในประวัติของ cart-ui แต่ไม่ตรงกับ squash commit บน main จึงถูกเล่นซ้ำ ใช้ rebase --onto main โดยระบุปลาย cart-api เดิมเป็นจุดเริ่ม","correct":true,"why":"ถูก เพราะ squash merge สร้าง commit ใหม่ที่ git มองว่าไม่ใช่ชุดเดียวกับ commit เดิม rebase ปกติจึงพยายามเล่นซ้ำของเดิมทั้งหมด การระบุจุดเริ่มด้วย --onto ตัดส่วนที่ merge เข้า main ไปแล้วออก"},{"id":"B","text":"กู้ branch feature/cart-api กลับมา แล้ว merge เข้า feature/cart-ui ก่อน จากนั้นจึง rebase feature/cart-ui ลงบน main อีกครั้งเพื่อให้ git เห็นประวัติของ cart-api ครบ","correct":false,"why":"การ merge branch เดิมเข้ามายังพา commit ชุดเดิมซึ่งไม่ตรงกับ squash commit บน main ไปด้วย ปัญหา conflict จึงเกิดซ้ำและ history ซับซ้อนขึ้น"},{"id":"C","text":"revert squash commit ของ feature/cart-api บน main ออกก่อน แล้ว merge feature/cart-api กลับเข้า main ด้วย merge commit ปกติ จึงค่อย rebase feature/cart-ui ลงบน main","correct":false,"why":"เป็นการแก้ main ที่ทุกคนใช้อยู่เพื่อแก้ปัญหา branch เดียว เสี่ยงกระทบคนอื่นและเพิ่มงานโดยไม่จำเป็น เพราะ rebase ฝั่ง B ปรับได้เองโดยไม่แตะ main"},{"id":"D","text":"แก้ conflict ทุกครั้งที่เกิดโดยเลือกฝั่ง main ทั้งหมด เพราะโค้ดของ feature/cart-api อยู่บน main แล้ว ทำจนครบทุก commit แล้วจึง push","correct":false,"why":"ต้องไล่แก้ conflict ทีละ commit ของ cart-api เดิมซ้ำหลายรอบ และเสี่ยงเลือกผิดฝั่งเมื่อ commit ของ B แตะบรรทัดใกล้เคียง ขณะที่ rebase --onto เล่นซ้ำเฉพาะ commit ของ B จึงไม่เกิด conflict จากส่วนของ cart-api เลย"}],"explanation":"เมื่อ branch ฐานถูก squash merge (หรือ rebase merge) เข้า main commit เดิมจะไม่ตรงกับของใหม่อีกต่อไป branch ที่แตกต่อจากมันจึงต้องบอก git ว่าให้เล่นซ้ำเฉพาะ commit ของตัวเอง ด้วย git rebase --onto \u003cปลายใหม่> \u003cปลาย branch ฐานเดิม> \u003cbranch ของเรา>"},{"id":"ENG-S-P-005","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S3","concept":"git-annotated-tag-release-facts","mobile":false,"type":"multiple","stem":"ทีมกำหนดให้ทุก release ของบริการ payment ต้องมี tag เช่น v1.12.0 เพื่อตรวจสอบย้อนหลังได้ว่า production รันโค้ดชุดไหน นักพัฒนาเสนอให้ใช้ annotated tag แทน lightweight tag ข้อความใดเป็นจริงเกี่ยวกับการใช้ tag ใน release (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"การ push branch ที่ tag ชี้อยู่ขึ้น remote จะส่ง tag ไปให้ด้วยโดยอัตโนมัติ ทีมจึงตรวจสอบจาก remote ได้ทันที","correct":false,"why":"การ push branch ไม่ได้ส่ง tag ไปด้วย ต้อง push tag นั้นหรือ push tags อย่างชัดเจน มิฉะนั้น tag อยู่แค่ในเครื่องของผู้สร้าง"},{"id":"B","text":"ถ้า tag v1.12.0 ชี้ผิด commit ให้ย้ายไปยัง commit ใหม่แล้ว push ทับได้ และทุกคนที่เคย fetch ไปแล้วจะได้ tag ใหม่โดยอัตโนมัติ","correct":false,"why":"ผู้ที่ fetch tag เดิมไปแล้วจะไม่ได้ tag ใหม่โดยอัตโนมัติ ในเครื่องของแต่ละคนจึงอาจมี v1.12.0 ที่ชี้ commit ต่างกัน ซึ่งทำลายความน่าเชื่อถือของการอ้างอิงเวอร์ชัน"},{"id":"C","text":"annotated tag เก็บชื่อผู้สร้าง วันที่ และข้อความของ release เป็น object ของตัวเอง และลงลายมือชื่อได้ ส่วน lightweight tag เป็นเพียงตัวชี้ไปยัง commit","correct":true,"why":"ถูก เพราะข้อมูลผู้สร้างและข้อความช่วยให้ตรวจสอบย้อนหลังได้ และการลงลายมือชื่อช่วยยืนยันที่มา ส่วน lightweight tag ไม่มีข้อมูลเหล่านี้"},{"id":"D","text":"เมื่อลบ branch ที่ใช้สร้าง release ไปแล้ว tag ที่ชี้ commit บน branch นั้นจะถูกลบตามไปด้วย","correct":false,"why":"tag เป็นตัวชี้อิสระที่ไม่ผูกกับ branch การลบ branch ไม่ลบ tag และ commit ที่ tag ชี้อยู่จึงยังเข้าถึงได้"},{"id":"E","text":"tag ที่สร้างในเครื่องจะยังไม่อยู่บน remote จนกว่าจะ push tag นั้น หรือ push tags ทั้งหมดอย่างชัดเจน","correct":true,"why":"ถูก เพราะ git push ค่าเริ่มต้นส่งเฉพาะ branch ทีมที่ต้องการให้ release ตรวจสอบได้จาก remote จึงต้องมีขั้นตอน push tag ใน pipeline หรือในคู่มือ release"}],"explanation":"Tag ที่ใช้กำกับ release ควรเป็น annotated tag ที่ push ขึ้น remote อย่างชัดเจน และถือว่าเปลี่ยนไม่ได้หลังปล่อย เพราะ tag ไม่ผูกกับ branch, git push ไม่ส่ง tag ไปเองตามค่าเริ่มต้น และ tag ที่ย้ายแล้วไม่อัปเดตในเครื่องของผู้ที่ fetch ไปแล้วโดยอัตโนมัติ"},{"id":"ENG-S-P-006","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S3","concept":"git-rollback-by-previous-tag-fix-forward","mobile":false,"type":"single","stem":"release v1.8.0 ถูก deploy ขึ้น production เมื่อชั่วโมงก่อน แล้วพบว่าการชำระเงินบางรายการล้มเหลว ทีมมี tag v1.7.2 ที่เสถียรอยู่ และ pipeline สามารถ deploy จาก tag ใดก็ได้ ต้องการกู้บริการให้เร็วที่สุดโดยยังตรวจสอบย้อนหลังได้ว่าแต่ละช่วงเวลา production รันโค้ดอะไร ควรทำอย่างไร","options":[{"id":"A","text":"ลบ tag v1.8.0 ทั้งในเครื่องและ remote แล้วสร้าง v1.8.0 ใหม่ที่ commit ซึ่งแก้บั๊กแล้ว เพื่อให้เลขเวอร์ชันเดิมชี้ไปที่โค้ดที่ถูกต้องและไม่มีเวอร์ชันที่เสียค้างอยู่ในรายการ release","correct":false,"why":"การย้าย tag ทำให้บันทึกการ deploy ที่อ้างถึง v1.8.0 ชี้ไปโค้ดคนละชุดกับที่เคยรันจริง และเครื่องที่เคย fetch tag เดิมไปแล้วอาจยังชี้ commit เก่า ทำให้ตรวจย้อนหลังไม่ได้"},{"id":"B","text":"รัน git reset --hard ไปที่ commit ของ v1.7.2 บน main แล้ว force push เพื่อให้ main ตรงกับโค้ดที่ production ใช้ แล้วค่อยแก้บั๊กต่อจากจุดนั้น","correct":false,"why":"เป็นการลบ commit ที่ merge หลัง v1.7.2 ออกจาก main ที่ทีมใช้ร่วมกัน ทำให้งานของคนอื่นหายหรือ history แยกกัน และไม่จำเป็นต่อการกู้บริการ เพราะ deploy จาก tag เดิมได้ทันที"},{"id":"C","text":"revert ทุก commit ที่อยู่ใน v1.8.0 บน main แล้ว deploy จาก main โดยไม่ออก tag ใหม่ เพราะเลขเวอร์ชันควรมีเฉพาะ release ที่เสถียร และจะได้ไม่มีเวอร์ชันที่ถูกถอนค้างอยู่ในประวัติ","correct":false,"why":"ช้ากว่าการ deploy tag เดิม และเมื่อไม่มี tag กำกับ ก็ไม่มีจุดอ้างอิงว่า production ช่วงนั้นรันโค้ดชุดไหน ซึ่งขัดกับข้อกำหนดเรื่องการตรวจสอบย้อนหลัง"},{"id":"D","text":"deploy จาก tag v1.7.2 เพื่อกู้บริการก่อน แล้วแก้บั๊กบน branch และปล่อยเป็น tag ใหม่ เช่น v1.8.1 โดยเก็บ tag v1.8.0 ไว้เป็นบันทึกว่าเคยปล่อย","correct":true,"why":"ถูก เพราะ rollback ด้วย tag ที่เสถียรทำได้ทันทีโดยไม่แตะ history และ tag ทุกอันยังชี้ commit เดิม บันทึกจึงตรงกับความจริง ส่วนการแก้บั๊กไปข้างหน้าออกเป็นเวอร์ชันใหม่"}],"explanation":"Tag คือบันทึกว่าเวอร์ชันนั้นคือโค้ดชุดไหน เมื่อ release พังให้ rollback โดยชี้ไปที่ tag เสถียรตัวก่อนหน้า แล้วแก้ไปข้างหน้าด้วย tag ใหม่ ไม่ย้ายหรือลบ tag เดิม และไม่เขียน history ของ main ใหม่"},{"id":"ENG-S-P-007","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S4","concept":"git-cherry-pick-fix-to-release-branch","mobile":false,"type":"multiple","stem":"บั๊กความปลอดภัยถูกแก้แล้วบน main ด้วย commit เดียว (รอบ ๆ มี commit ฟีเจอร์ใหม่หลายอัน) ทีมต้องนำเฉพาะการแก้นี้ไปใส่ release/2.3 ที่ลูกค้ากำลังใช้งานอยู่ โดยไม่เอาฟีเจอร์ใหม่ไปด้วย ข้อใดเป็นจริงเกี่ยวกับการใช้ cherry-pick ในกรณีนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"cherry-pick สร้าง commit ใหม่บน release/2.3 ที่มี hash ต่างจากต้นฉบับ แม้เนื้อหาการเปลี่ยนแปลงเหมือนกัน","correct":true,"why":"ถูก เพราะ commit ถูกคัดลอกไปวางบนฐานใหม่ จึงมี parent และ hash ใหม่ ไม่ได้ย้ายหรือเชื่อมกับ commit เดิม"},{"id":"B","text":"เมื่อ merge release/2.3 กลับเข้า main ภายหลัง git จะรู้ว่า commit ที่ cherry-pick มาเป็นการเปลี่ยนแปลงเดียวกับต้นฉบับ และข้ามให้โดยอัตโนมัติเสมอ","correct":false,"why":"git ไม่ได้ผูก commit ที่ cherry-pick กับต้นฉบับ การ merge ภายหลังอาจเกิด conflict หรือมีการเปลี่ยนแปลงซ้ำในจุดที่แก้ไปแล้ว ต้องตรวจผลเอง"},{"id":"C","text":"ถ้าโค้ดรอบ ๆ บน release/2.3 ต่างจาก main อาจเกิด conflict ที่ต้องแก้เอง และควรทดสอบ release/2.3 หลัง pick เพราะ commit เดี่ยว ๆ อาจพึ่งพาโค้ดที่อยู่ใน commit ก่อนหน้าซึ่งไม่ได้ตามมา","correct":true,"why":"ถูก เพราะ cherry-pick ย้ายเฉพาะส่วนต่างของ commit นั้น หากฟังก์ชันที่มันเรียกใช้มีเฉพาะบน main พฤติกรรมอาจต่างไปแม้ไม่มี conflict"},{"id":"D","text":"ใส่ตัวเลือก -x ตอน cherry-pick เพื่อให้ hash ของ commit ต้นฉบับถูกบันทึกไว้ใน commit message ช่วยให้ตามรอยที่มาของการแก้ได้","correct":true,"why":"ถูก เพราะ -x เพิ่มบรรทัดอ้างอิง commit ต้นฉบับ ทำให้ผู้ตรวจสอบและเครื่องมือค้นหาได้ว่าการแก้บน release branch มาจากไหน"}],"explanation":"Cherry-pick เหมาะกับการนำการแก้เฉพาะจุดไปยัง release branch ที่ต้องไม่รับงานอื่น แต่ผลลัพธ์คือ commit สำเนาที่ไม่เชื่อมกับต้นฉบับ ควรบันทึกที่มาด้วย -x ทดสอบบน branch ปลายทางเสมอ และระวังการ merge สองฝั่งกลับมาชนกันภายหลัง"},{"id":"ENG-S-P-008","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S4","concept":"git-revert-merge-commit-on-shared-main","mobile":false,"type":"single","stem":"branch feature/promo ถูก merge เข้า main ด้วย merge commit และ push ไปแล้ว 3 ชั่วโมง มีเพื่อนร่วมทีมหลายคน pull main ไปทำงานต่อแล้ว ภายหลังพบว่าฟีเจอร์นี้ทำให้ยอดรวมในตะกร้าผิด ต้องถอดฟีเจอร์ออกจาก main ทันที ส่วน feature/promo จะแก้แล้วนำกลับมา merge ใหม่ภายหลัง วิธีใดเหมาะสมที่สุด","options":[{"id":"A","text":"รัน git reset --hard ไปที่ commit ก่อน merge แล้ว push --force เพื่อให้ฟีเจอร์หายไปจาก main ทันที และให้ history ของ main สะอาดไม่มี merge commit ของฟีเจอร์","correct":false,"why":"เป็นการเขียน history ของ branch ที่ทีมใช้ร่วมกันใหม่ ผู้ที่ pull ไปแล้วจะมี history ไม่ตรงกับ remote และ commit ที่เพื่อนเพิ่ง push หลัง merge อาจหายไป"},{"id":"B","text":"ใช้ git revert -m 1 กับ merge commit แล้ว push ปกติ เมื่อนำฟีเจอร์กลับมา ต้อง revert commit revert นั้นก่อน มิฉะนั้นการเปลี่ยนแปลงเดิมจะไม่ถูกนำกลับมา","correct":true,"why":"ถูก เพราะ revert สร้าง commit ใหม่ต่อท้าย history จึงปลอดภัยกับคนที่ pull ไปแล้ว -m 1 ระบุให้คงฝั่ง main ไว้ ส่วนการ merge ซ้ำ git จะมองว่าการเปลี่ยนแปลงเดิมถูก merge ไปแล้ว จึงต้องยกเลิก revert ก่อน"},{"id":"C","text":"revert เฉพาะ commit ล่าสุดของ feature/promo ที่อยู่ใน merge นั้น เพราะเป็น commit ที่ทำให้ยอดรวมผิดตามที่ทดสอบพบ แล้ว push ตามปกติ","correct":false,"why":"commit อื่นของฟีเจอร์ยังอยู่บน main ฟีเจอร์จึงถูกถอดไม่ครบ และยอดรวมในตะกร้าอาจยังผิดอยู่ หรือเหลือโค้ดครึ่งทาง"},{"id":"D","text":"สร้าง commit ใหม่ที่นำไฟล์ทั้งหมดกลับไปเป็นสภาพก่อน merge ด้วย git checkout \u003ccommit ก่อน merge> -- . แล้ว push ตามปกติเพื่อไม่เขียน history ใหม่","correct":false,"why":"วิธีนี้ย้อนไฟล์ทั้งหมดรวมถึงงานของคนอื่นที่ merge เข้า main หลังฟีเจอร์นี้ด้วย จึงลบงานที่ไม่เกี่ยวข้องออกไปพร้อมกัน"}],"explanation":"ถ้า commit ถูก push และมีคนใช้ต่อแล้ว ให้ย้อนด้วย commit ใหม่ (revert) ไม่ใช่เขียน history ใหม่ สำหรับ merge commit ต้องระบุ parent ด้วย -m และต้องจำไว้ว่าเมื่อจะนำ branch เดิมกลับมา ต้องยกเลิก revert นั้นก่อน"},{"id":"ENG-S-P-009","level":"senior","pool":"practice","competency":"Git","descriptor":"GIT-S5","concept":"git-branch-protection-codeowners-contractors","mobile":false,"type":"multiple","stem":"บริษัทมีทีมพัฒนากระจายอยู่ 3 โซนเวลา และมีผู้รับเหมาภายนอก 4 คนที่ต้องส่งโค้ดเข้าระบบ payment ซึ่งต้องตรวจตามมาตรฐานภายในและ PDPA ทีมกำลังตั้งค่า repository บนแพลตฟอร์มโฮสต์ มาตรการใดช่วยควบคุมสิทธิ์และกระบวนการรีวิวได้เหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตั้ง branch protection บน main และ release/* ให้ต้องผ่าน PR ที่มีผู้อนุมัติอย่างน้อยหนึ่งคนที่ไม่ใช่ผู้เขียน และผ่าน status check ของ CI ก่อน merge","correct":true,"why":"ถูก เพราะป้องกันการ push ตรงและบังคับให้มีคนที่สองตรวจ พร้อมการตรวจอัตโนมัติ เป็นพื้นฐานของการควบคุมโค้ดที่ขึ้น production"},{"id":"B","text":"ให้สิทธิ์ admin แก่ tech lead ทุกโซนเวลา เพื่อให้ข้ามกฎ protection ได้เมื่อมีเหตุเร่งด่วนโดยไม่รอผู้อนุมัติ และลดการรอข้ามโซนเวลาในช่วงปล่อยงานด่วน","correct":false,"why":"การเปิดช่องข้ามกฎให้หลายคนทำให้กฎ protection ไม่มีผลจริงและตรวจสอบย้อนหลังยาก ควรมีขั้นตอน hotfix ที่ยังต้องผ่านผู้อนุมัติ แต่ลดขั้นตอนได้ตามที่ตกลงกัน"},{"id":"C","text":"กำหนด CODEOWNERS ให้โฟลเดอร์ payment ต้องมีทีมที่รับผิดชอบเป็นผู้อนุมัติ เพื่อให้การแก้ส่วนสำคัญไม่ผ่านโดยคนที่ไม่รู้บริบท","correct":true,"why":"ถูก เพราะ CODEOWNERS ผูกผู้รีวิวที่ต้องอนุมัติกับพาธของโค้ด ทำให้ส่วนอ่อนไหวมีเจ้าของตรวจเสมอ ไม่ขึ้นกับว่าใครเป็นผู้เปิด PR"},{"id":"D","text":"ให้ผู้รับเหมาส่งงานผ่าน fork หรือ branch ที่มีสิทธิ์จำกัด แล้วเปิด pull request เข้ามา แทนการให้สิทธิ์เขียนตรงที่ branch หลัก","correct":true,"why":"ถูก เพราะลดสิทธิ์ให้เท่าที่จำเป็น (least privilege) และทุกการเปลี่ยนแปลงจากภายนอกต้องผ่านการรีวิวก่อนเข้ามา"},{"id":"E","text":"ล็อกการ push ทุก branch รวมถึง feature branch ให้ทำได้เฉพาะ admin เพื่อความปลอดภัยสูงสุด และให้นักพัฒนาส่งงานผ่าน admin เท่านั้น","correct":false,"why":"จำกัดเกินความจำเป็นจนนักพัฒนาทำงานบน feature branch ของตัวเองไม่ได้ และสร้างคอขวดที่ admin ไม่กี่คน ควรป้องกันเฉพาะ branch ที่ขึ้น production"}],"explanation":"การควบคุมโค้ดสำหรับทีมกระจายคือใช้กลไกของแพลตฟอร์มแทนการพึ่งความตกลงกันด้วยปาก ได้แก่ branch protection, CODEOWNERS และสิทธิ์ขั้นต่ำสำหรับผู้ที่อยู่นอกทีม โดยไม่เปิดช่องข้ามกฎให้คนจำนวนมาก และไม่ล็อกจนงานปกติติดขัด"},{"id":"ENG-S-P-010","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S1","concept":"sql-cte-row-number-latest-per-group","mobile":false,"type":"single","stem":"ตาราง orders (order_id, customer_id, status, created_at) มีประมาณ 20 ล้านแถว ต้องการรายงานคำสั่งซื้อล่าสุดของลูกค้าแต่ละคนพร้อมคอลัมน์ทั้งหมดของแถวนั้น และลูกค้าที่มีสองออเดอร์เวลาเดียวกันต้องได้แถวเดียวอย่างแน่นอน ฐานข้อมูลรองรับ window function และ CTE ตามมาตรฐาน SQL วิธีเขียนใดเหมาะสมที่สุด","options":[{"id":"A","text":"หา MAX(created_at) ของแต่ละ customer_id ด้วย GROUP BY แล้ว JOIN กลับตาราง orders ด้วย customer_id และ created_at เพื่อดึงคอลัมน์ที่เหลือของแถวนั้นมา","correct":false,"why":"ถ้าลูกค้ามีสองออเดอร์ที่ created_at เท่ากับค่าสูงสุด การ JOIN จะได้สองแถว ซึ่งขัดกับเงื่อนไขว่าต้องได้แถวเดียว"},{"id":"B","text":"ใช้ CTE ที่มี ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC, order_id DESC) แล้วเลือกแถวที่ลำดับเป็น 1","correct":true,"why":"ถูก เพราะ ROW_NUMBER ให้ลำดับไม่ซ้ำภายในแต่ละกลุ่ม และ order_id เป็น tie-breaker ทำให้ผลแน่นอนเมื่อเวลาเท่ากัน อ่านตารางผ่านครั้งเดียว"},{"id":"C","text":"เขียน SELECT * FROM orders GROUP BY customer_id ORDER BY created_at DESC เพื่อให้ได้แถวบนสุดของแต่ละกลุ่มตามลำดับเวลาที่เรียงไว้","correct":false,"why":"การเลือกคอลัมน์ที่ไม่ได้อยู่ใน GROUP BY และไม่ได้ aggregate อาจ error หรือคืนแถวใดแถวหนึ่งในกลุ่มโดยไม่แน่นอน ขึ้นกับฐานข้อมูล ORDER BY ไม่ได้เลือกแถวภายในกลุ่ม"},{"id":"D","text":"ดึงรายชื่อลูกค้าทั้งหมดมาก่อน แล้วให้แอปวนสั่ง SELECT ... ORDER BY created_at DESC LIMIT 1 ของลูกค้าทีละคน แล้วรวมผลในหน่วยความจำของแอป","correct":false,"why":"ต้องส่งคำค้นเป็นจำนวนเท่าลูกค้า (N+1) บนข้อมูลระดับล้านแถว เสียเวลาไปกับ round trip และโหลดฐานข้อมูลมากกว่าคำค้นเดียว"}],"explanation":"งาน \"แถวล่าสุดต่อกลุ่ม\" ที่ต้องได้แถวเดียวแน่นอน ควรใช้ ROW_NUMBER() ร่วมกับ tie-breaker ที่ไม่ซ้ำ เพราะวิธี MAX แล้ว JOIN กลับให้ผลซ้ำเมื่อค่าเท่ากัน และ GROUP BY โดยเลือกคอลัมน์อื่นไม่รับประกันว่าจะได้แถวไหน"},{"id":"ENG-S-P-011","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S1","concept":"sql-exists-semijoin-one-row-per-customer","mobile":false,"type":"single","stem":"ตาราง customers(id, name) และ orders(id, customer_id, total) ต้องการรายชื่อลูกค้าที่เคยมีออเดอร์ยอด total ตั้งแต่ 5,000 บาทขึ้นไปอย่างน้อยหนึ่งรายการ โดยแสดงลูกค้าละหนึ่งแถว ลูกค้าบางคนมีออเดอร์ยอดสูงหลายรายการ คำค้นใดให้ผลตรงโจทย์","options":[{"id":"A","text":"SELECT c.id, c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.total >= 5000","correct":false,"why":"ลูกค้าที่มีออเดอร์ยอดสูงหลายรายการจะปรากฏซ้ำหลายแถว เพราะ JOIN สร้างหนึ่งแถวต่อหนึ่งออเดอร์ที่ตรงเงื่อนไข"},{"id":"B","text":"SELECT c.id, c.name FROM customers c JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name HAVING SUM(o.total) >= 5000","correct":false,"why":"เงื่อนไขนี้ตรวจยอดรวมของทุกออเดอร์ ไม่ใช่ออเดอร์เดี่ยว ลูกค้าที่มีออเดอร์ละ 2,000 จำนวนสามรายการจะถูกเลือกทั้งที่ไม่เคยมีออเดอร์ถึง 5,000"},{"id":"C","text":"SELECT c.id, c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id AND o.total >= 5000","correct":false,"why":"LEFT JOIN คืนลูกค้าทุกคนเสมอ แม้ไม่มีออเดอร์ที่ตรงเงื่อนไข (ค่าฝั่ง orders เป็น NULL) และลูกค้าที่ตรงหลายออเดอร์ก็ยังซ้ำ"},{"id":"D","text":"SELECT c.id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.total >= 5000)","correct":true,"why":"ถูก เพราะ EXISTS เป็น semi-join ตรวจแค่ว่ามีออเดอร์ที่ตรงเงื่อนไขหรือไม่ ได้ลูกค้าละหนึ่งแถวโดยไม่ต้องกำจัดแถวซ้ำ"}],"explanation":"เมื่อต้องการ \"ผู้ที่มีรายการอย่างน้อยหนึ่งรายการ\" ให้คิดเป็น semi-join ด้วย EXISTS (หรือ IN) แทน JOIN ซึ่งขยายจำนวนแถวตามรายการลูก และระวังการเปลี่ยนความหมายของเงื่อนไขเมื่อย้ายไปไว้หลัง HAVING"},{"id":"ENG-S-P-012","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S2","concept":"sql-join-fanout-duplicated-sums","mobile":false,"type":"multiple","stem":"ออเดอร์หนึ่งมีสินค้าหลายรายการและอาจชำระเงินแบบแบ่งจ่ายหลายงวด รายงานด้านล่างให้ยอดผิดในออเดอร์ที่มีสินค้า 3 รายการและชำระ 2 งวด ทั้งยอดสินค้าและยอดที่ชำระสูงกว่าความจริง วิธีแก้ใดทำให้ผลถูกต้อง (เลือกทุกข้อที่ถูก)","code":"SELECT o.id,\n       SUM(oi.price * oi.qty) AS items_total,\n       SUM(p.amount)          AS paid_total\nFROM orders o\nJOIN order_items oi ON oi.order_id = o.id\nJOIN payments p     ON p.order_id = o.id\nGROUP BY o.id;","codeLang":"sql","options":[{"id":"A","text":"เปลี่ยนเป็น SUM(DISTINCT p.amount) และ SUM(DISTINCT oi.price * oi.qty) เพื่อกำจัดค่าที่ถูกนับซ้ำจากการ JOIN ให้เหลือครั้งเดียว","correct":false,"why":"DISTINCT ตัดค่าที่เท่ากันออกแม้เป็นคนละรายการจริง เช่น ชำระงวดละ 150 บาทสองงวดจะถูกนับเป็น 150 บาทครั้งเดียว ผลจึงผิดอีกแบบ"},{"id":"B","text":"รวมยอดของ order_items และของ payments แยกกันเป็น CTE หรือ subquery ที่ GROUP BY order_id ก่อน แล้ว JOIN ผลทั้งสองเข้ากับ orders","correct":true,"why":"ถูก เพราะแต่ละตารางถูกยุบเหลือหนึ่งแถวต่อออเดอร์ก่อน JOIN จึงไม่เกิดการคูณจำนวนแถวระหว่างสองตารางลูก"},{"id":"C","text":"เปลี่ยน JOIN ทั้งสองจุดเป็น LEFT JOIN เพื่อให้รวมทุกแถวของ orders และไม่ตัดออเดอร์ที่ไม่มีรายการชำระออกจากรายงาน","correct":false,"why":"LEFT JOIN ไม่ได้เปลี่ยนการคูณจำนวนแถวระหว่าง order_items กับ payments ยอดจึงยังถูกนับซ้ำเหมือนเดิม"},{"id":"D","text":"คำนวณแต่ละยอดด้วย correlated subquery ในรายการ SELECT เช่น (SELECT SUM(amount) FROM payments WHERE order_id = o.id)","correct":true,"why":"ถูก เพราะแต่ละยอดคำนวณจากตารางของตัวเองตามออเดอร์นั้น ไม่มีการ JOIN ข้ามตารางลูกจึงไม่เกิดการคูณ"}],"explanation":"เมื่อ JOIN ตารางลูกสองตารางที่เป็นแบบ one-to-many เข้ากับตารางแม่ในคำค้นเดียว แถวจะถูกคูณกัน (fan-out) ทำให้ SUM เกินจริง ต้องสรุปยอดของแต่ละตารางลูกให้เหลือหนึ่งแถวต่อคีย์ก่อน JOIN หรือใช้ subquery แยกต่อยอด"},{"id":"ENG-S-P-013","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S2","concept":"sql-self-join-compare-with-manager","mobile":false,"type":"single","stem":"ตาราง employees(id, name, salary, manager_id) โดย manager_id อ้างอิง id ของพนักงานอีกแถวในตารางเดียวกัน (พนักงานระดับสูงสุดมี manager_id เป็น NULL) ต้องการรายชื่อพนักงานที่เงินเดือนสูงกว่าหัวหน้าของตัวเอง ควรเขียนคำค้นอย่างไร","options":[{"id":"A","text":"SELECT e.name FROM employees e JOIN employees m ON e.manager_id = m.id WHERE e.salary > m.salary","correct":true,"why":"ถูก เพราะ self-join ตั้งชื่อแทนตารางเป็นสองบทบาท e คือพนักงาน m คือหัวหน้า เชื่อมด้วย manager_id = id แล้วเทียบเงินเดือนในแถวเดียวกัน"},{"id":"B","text":"SELECT e.name FROM employees e JOIN employees m ON e.id = m.manager_id WHERE e.salary > m.salary","correct":false,"why":"เงื่อนไข JOIN กลับด้าน e จึงเป็นหัวหน้าและ m เป็นลูกน้อง ผลที่ได้คือรายชื่อหัวหน้าที่เงินเดือนสูงกว่าลูกน้อง"},{"id":"C","text":"SELECT name FROM employees WHERE salary > (SELECT MAX(salary) FROM employees WHERE id = manager_id)","correct":false,"why":"ภายใน subquery ชื่อ id และ manager_id หมายถึงคอลัมน์ของ employees ใน subquery เอง ไม่ได้ผูกกับแถวนอก จึงเทียบกันเองและแทบไม่ตรงเงื่อนไข ต้องตั้งชื่อแทนตารางแล้วอ้างให้ชัด"},{"id":"D","text":"SELECT e.name FROM employees e LEFT JOIN employees m ON e.manager_id = m.id WHERE e.salary > m.salary OR m.id IS NULL","correct":false,"why":"เงื่อนไข OR m.id IS NULL ดึงพนักงานที่ไม่มีหัวหน้ามาด้วยทุกคน ทั้งที่ไม่มีหัวหน้าให้เทียบเงินเดือน"}],"explanation":"Self-join ใช้เมื่อต้องเทียบแถวกับแถวอื่นในตารางเดียวกัน ต้องตั้งชื่อแทน (alias) ให้แต่ละบทบาท และระวังทิศทางของเงื่อนไข JOIN ส่วน subquery ที่ไม่ได้อ้างคอลัมน์ของแถวนอกให้ชัดจะถูกตีความเป็นคอลัมน์ภายในเอง"},{"id":"ENG-S-P-014","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S3","concept":"sql-function-wrapped-column-date-range","mobile":false,"type":"single","stem":"ตาราง orders มี index บน created_at (ชนิด timestamp ไม่มี time zone เก็บค่าเป็น UTC) ประมาณ 50 ล้านแถว หน้ารายงานของร้านค้าไทยต้องการออเดอร์ของวันที่ 5 พฤศจิกายน 2026 ตามเวลา UTC+7 คำค้นปัจจุบันตอบช้า และ EXPLAIN แสดงว่าสแกนทั้งตาราง ควรปรับคำค้นอย่างไรให้ผลถูกต้องและใช้ index ได้","code":"SELECT id, total\nFROM orders\nWHERE DATE(created_at + INTERVAL '7' HOUR) = '2026-11-05';","codeLang":"sql","options":[{"id":"A","text":"เปลี่ยนเป็น WHERE created_at LIKE '2026-11-05%' เพื่อเลี่ยงการห่อคอลัมน์ด้วยฟังก์ชัน และให้เทียบข้อความตรง ๆ กับค่าวันที่ที่ต้องการ","correct":false,"why":"LIKE กับคอลัมน์ชนิดเวลาต้องแปลงเป็นข้อความก่อนเทียบ ซึ่งมักใช้ index ไม่ได้ อีกทั้งค่าที่เก็บเป็น UTC จึงได้ช่วงของวันที่ 5 ตามเวลา UTC ไม่ใช่เวลาไทย"},{"id":"B","text":"เปลี่ยนเป็น WHERE created_at BETWEEN '2026-11-05 00:00:00' AND '2026-11-05 23:59:59' เพราะเป็นเงื่อนไขช่วงที่ใช้ index ได้","correct":false,"why":"ใช้ index ได้ แต่ขอบเขตเป็นเวลา UTC ผลจึงเลื่อนไป 7 ชั่วโมงจากวันของไทย และขอบบน 23:59:59 ตัดเศษวินาทีของออเดอร์ที่เข้ามาหลังจากนั้นออกไป"},{"id":"C","text":"เปลี่ยนเป็น WHERE created_at >= '2026-11-04 17:00:00' AND created_at \u003c '2026-11-05 17:00:00' (ขอบเขตวันที่ 5 เวลาไทยในรูป UTC)","correct":true,"why":"ถูก เพราะเทียบคอลัมน์ตรง ๆ แบบช่วงปิด-เปิด ฐานข้อมูลจึงใช้ index ค้นเฉพาะช่วงได้ และขอบเขตครอบคลุมวันตามเวลาไทยครบโดยไม่ตกหล่นเศษวินาที"},{"id":"D","text":"เปลี่ยนชนิดคอลัมน์ created_at เป็น DATE แล้วเทียบ created_at = '2026-11-05' ซึ่งเทียบวันที่ได้ตรง ๆ และใช้ index บนคอลัมน์ได้เต็มที่","correct":false,"why":"ทำให้สูญเสียเวลาของวัน ซึ่งส่วนอื่นของระบบอาจต้องใช้ และค่าที่เก็บยังเป็นวันตาม UTC ไม่ได้แก้ปัญหาการเทียบวันของเวลาไทย"}],"explanation":"การห่อคอลัมน์ที่มี index ด้วยฟังก์ชันหรือการคำนวณทำให้ฐานข้อมูลต้องคำนวณทีละแถว ควรย้ายการคำนวณไปฝั่งค่าคงที่และเขียนเป็นเงื่อนไขช่วง และเมื่อข้อมูลเก็บเป็น UTC ต้องแปลงขอบเขตของวันตามเวลาไทยเป็น UTC ให้ถูกก่อน"},{"id":"ENG-S-P-015","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S3","concept":"sql-composite-index-design-order-by","mobile":false,"type":"multiple","stem":"หน้า \"ประวัติคำสั่งซื้อ\" ของแอปเรียกคำค้นด้านล่างบ่อยมาก ตาราง orders มี 30 ล้านแถว ลูกค้าหนึ่งคนมีออเดอร์ได้หลายร้อยรายการ และแถวส่วนใหญ่มี status เป็น PAID ทีมกำลังออกแบบ index ให้คำค้นนี้เร็ว ข้อความใดเกี่ยวกับการออกแบบ index เป็นจริง (เลือกทุกข้อที่ถูก)","code":"SELECT id, total\nFROM orders\nWHERE customer_id = ? AND status = 'PAID'\nORDER BY created_at DESC\nLIMIT 20;","codeLang":"sql","options":[{"id":"A","text":"index บน (customer_id, status, created_at) รองรับทั้งเงื่อนไขเท่ากับสองคอลัมน์และการเรียงตาม created_at จึงอ่านผลที่เรียงแล้วและหยุดเมื่อครบ 20 แถว","correct":true,"why":"ถูก เพราะคอลัมน์ที่ใช้เงื่อนไขเท่ากับอยู่นำหน้า ส่วนคอลัมน์เรียงลำดับอยู่ท้าย ภายในกลุ่ม customer_id และ status เดียวกัน รายการจึงเรียงตามเวลาอยู่แล้ว"},{"id":"B","text":"index บน (created_at, customer_id, status) ให้ผลเท่ากับ index บน (customer_id, status, created_at) เพราะ index ใช้ทั้งสามคอลัมน์เหมือนกัน ลำดับของคอลัมน์ในนิยามจึงไม่มีผล","correct":false,"why":"ลำดับของคอลัมน์ใน composite index สำคัญ เมื่อ created_at นำหน้า ฐานข้อมูลใช้ index ค้นหาลูกค้าคนหนึ่งตรง ๆ ไม่ได้ และต้องเดินผ่านรายการของลูกค้าทุกคนตามเวลา"},{"id":"C","text":"สร้าง index แยกบน customer_id, status และ created_at อย่างละหนึ่งอัน ฐานข้อมูลจะรวมผลของทั้งสามเพื่อให้ได้ลำดับเวลาจากการสแกน index ได้","correct":false,"why":"index แยกกันอาจถูกนำมารวมเพื่อกรอง แต่ไม่ให้ผลที่เรียงตาม created_at ฐานข้อมูลยังต้องเรียงผลลัพธ์เองหลังรวมแถว"},{"id":"D","text":"index บน (customer_id, created_at) ก็ช่วยได้ ฐานข้อมูลอ่านย้อนจากรายการล่าสุดของลูกค้าและตรวจ status ทีละแถวจนครบ 20 แถว เมื่อแถวส่วนใหญ่เป็น PAID","correct":true,"why":"ถูก เพราะการเรียงตามเวลาภายในลูกค้าคนเดียวมาจาก index แล้ว และเมื่อสัดส่วน PAID สูง จะอ่านเพียงไม่กี่แถวก็ครบ แต่ถ้า PAID พบน้อยก็ต้องอ่านเกินมากขึ้น"},{"id":"E","text":"index บน (status) อย่างเดียวเหมาะที่สุด เพราะ status อยู่ในเงื่อนไข WHERE และเป็นเงื่อนไขที่คัดแถวได้แคบที่สุดจึงลดงานของฐานข้อมูลได้มากที่สุด","correct":false,"why":"status ที่ PAID เป็นส่วนใหญ่ของตารางคัดแถวได้น้อยมาก index นี้ยังต้องกรอง customer_id และเรียงผลเองบนแถวจำนวนมหาศาล"}],"explanation":"ออกแบบ composite index โดยวางคอลัมน์ที่ใช้เงื่อนไขเท่ากับไว้หน้า ตามด้วยคอลัมน์ที่ใช้เรียงลำดับ เพื่อให้ index คืนผลที่เรียงแล้วและฐานข้อมูลหยุดอ่านได้เมื่อครบ LIMIT ส่วนคอลัมน์ที่คัดแถวได้น้อย (selectivity ต่ำ) ไม่ควรเป็นตัวนำของ index"},{"id":"ENG-S-P-016","level":"senior","pool":"practice","competency":"SQL","descriptor":"SQL-S4","concept":"sql-unique-fk-transaction-webhook-integrity","mobile":false,"type":"multiple","stem":"ระบบรับ webhook แจ้งชำระเงินจาก payment gateway ซึ่งอาจส่งเหตุการณ์เดิมซ้ำเมื่อ timeout และเซิร์ฟเวอร์ของเรารันหลายอินสแตนซ์พร้อมกัน ทีมต้องการให้ข้อมูลในตาราง payments ถูกต้องแม้ webhook เดิมถูกส่งซ้ำหรืออ้างถึงออเดอร์ที่ไม่มีอยู่ในระบบ และการบันทึกการชำระกับการเปลี่ยนสถานะออเดอร์ต้องสำเร็จหรือล้มไปพร้อมกัน มาตรการใดช่วยในระดับฐานข้อมูลได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ตรวจในโค้ดด้วย SELECT ก่อนว่ามี gateway_transaction_id นี้แล้วหรือไม่ ถ้ายังไม่มีจึง INSERT โดยไม่เพิ่ม constraint ใด ๆ ในตาราง","correct":false,"why":"สองอินสแตนซ์อาจ SELECT พร้อมกันแล้วไม่พบแถว จากนั้นต่างก็ INSERT สำเร็จ ได้แถวซ้ำ การตรวจในโค้ดแยกจากการเขียนไม่ใช่การป้องกันที่แน่นอน"},{"id":"B","text":"กำหนด UNIQUE constraint บน gateway_transaction_id และให้โค้ดจัดการการ insert ซ้ำ (ใช้ upsert ที่ฐานข้อมูลรองรับหรือจับ error duplicate key) แล้วตอบรับ webhook ตามปกติ","correct":true,"why":"ถูก เพราะฐานข้อมูลเป็นตัวตัดสินเมื่อมีสองคำขอแข่งกัน และการตอบรับ webhook ซ้ำอย่างสุภาพทำให้ผู้ส่งหยุด retry"},{"id":"C","text":"กำหนด FOREIGN KEY จาก payments.order_id ไปยัง orders.id","correct":true,"why":"ถูก เพราะฐานข้อมูลจะปฏิเสธการบันทึกการชำระของออเดอร์ที่ไม่มีอยู่จริง ไม่ปล่อยให้เกิดแถวกำพร้าในตาราง payments"},{"id":"D","text":"ใช้ id แบบ auto-increment เป็น PRIMARY KEY ของ payments เพราะค่านี้ไม่ซ้ำกันอยู่แล้ว จึงกันไม่ให้บันทึกธุรกรรมเดียวกันซ้ำได้","correct":false,"why":"ค่า auto-increment ถูกสร้างใหม่ทุกครั้งที่ INSERT จึงไม่เคยซ้ำ แต่นั่นไม่เกี่ยวกับตัวธุรกรรมของ gateway เหตุการณ์เดิมที่ส่งซ้ำจะได้ id ใหม่และกลายเป็นแถวซ้ำ"},{"id":"E","text":"ทำการ INSERT ลง payments และการ UPDATE สถานะออเดอร์ใน transaction เดียวกัน เพื่อไม่ให้เหลือสถานะครึ่งทางเมื่อมี error กลางทาง","correct":true,"why":"ถูก เพราะ transaction รับประกันว่าสองการเขียนสำเร็จหรือถูกยกเลิกพร้อมกัน เมื่อ webhook ถูกส่งซ้ำและ insert ซ้ำล้ม การเปลี่ยนสถานะที่ทำไปแล้วก็ถูก rollback ไปด้วย"}],"explanation":"Constraint ในฐานข้อมูลคือด่านสุดท้ายที่ทำงานได้แม้โค้ดหลายอินสแตนซ์แข่งกัน UNIQUE ป้องกันข้อมูลซ้ำ FOREIGN KEY ป้องกันแถวกำพร้า และ transaction ป้องกันสถานะครึ่งทาง การตรวจในโค้ดอย่างเดียวหรือการพึ่ง id ที่ระบบสร้างเองไม่ป้องกันธุรกรรมซ้ำ"},{"id":"ENG-S-P-017","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S1","concept":"oop-replace-type-switch-with-polymorphism","mobile":false,"type":"single","stem":"โค้ดด้านล่างคำนวณค่าธรรมเนียมตามวิธีชำระเงิน switch ลักษณะเดียวกันนี้ซ้ำอยู่อีก 6 ฟังก์ชัน เช่น คำนวณการคืนเงิน รูปแบบใบเสร็จ และตรวจวงเงิน ธุรกิจเพิ่มวิธีชำระเงินใหม่ปีละหลายแบบ และทีมมักลืมแก้บางจุด ต้องการให้การเพิ่มวิธีชำระเงินใหม่เกิดขึ้นในที่เดียว ควรปรับโครงสร้างอย่างไร","code":"function calculateFee(payment: Payment): number {\n  switch (payment.method) {\n    case 'card':\n      return payment.amount * 0.029;\n    case 'promptpay':\n      return payment.amount * 0.007;\n    case 'wallet':\n      return 10;\n    default:\n      throw new Error('unsupported method');\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"ย้าย switch ทั้ง 7 ฟังก์ชันไปรวมไว้ในไฟล์ PaymentUtils ไฟล์เดียว เพื่อให้หาเจอง่ายและแก้ครบในที่เดียวเมื่อมีวิธีชำระเงินใหม่เพิ่มเข้ามา","correct":false,"why":"ยังคงต้องแก้ทุกฟังก์ชันที่มี switch ทุกครั้งที่เพิ่มวิธีใหม่ เพียงแต่อยู่ในไฟล์เดียวกัน และความรู้เกี่ยวกับแต่ละวิธีชำระเงินยังกระจายอยู่หลายฟังก์ชัน"},{"id":"B","text":"เปลี่ยน payment.method จาก string เป็น enum และเปิดการตรวจ exhaustive switch เพื่อให้ compiler เตือนทุกจุดที่ลืมจัดการวิธีชำระเงินใหม่","correct":false,"why":"ช่วยให้ไม่ลืมแก้บางจุด แต่ยังต้องแก้ switch ทั้ง 7 ที่ทุกครั้งที่เพิ่มวิธีใหม่ ไม่ได้ทำให้การเพิ่มเกิดในที่เดียว"},{"id":"C","text":"กำหนดอินเทอร์เฟซที่มีเมธอด fee, refund, receipt และวงเงิน ให้แต่ละวิธีชำระเงินเป็นคลาสที่ implement เอง แล้วให้โค้ดเรียกผ่านชนิดกลาง การเพิ่มวิธีใหม่คือเพิ่มคลาสใหม่","correct":true,"why":"ถูก เพราะพฤติกรรมของแต่ละวิธีรวมอยู่ในคลาสของมันเอง โค้ดที่เรียกใช้พึ่งเฉพาะชนิดแม่ (polymorphism) การเพิ่มวิธีใหม่จึงเป็นการเพิ่มคลาสโดยไม่แก้ฟังก์ชันเดิม"},{"id":"D","text":"เก็บอัตราค่าธรรมเนียม รูปแบบใบเสร็จ และวงเงินของแต่ละวิธีเป็นข้อมูลในตาราง config แล้วให้ทุกฟังก์ชันอ่านค่ามาคำนวณแทนการเขียนค่าไว้ใน switch","correct":false,"why":"ย้ายตัวเลขไปเป็นข้อมูลได้ แต่พฤติกรรมที่ต่างกันจริง เช่น ขั้นตอนคืนเงินหรือรูปแบบใบเสร็จ ยังต้องมีตรรกะแยกตามวิธีชำระเงิน จึงยังต้องมี if หรือ switch กระจายอยู่"}],"explanation":"เมื่อ switch ตามชนิดซ้ำกันหลายจุดและชนิดใหม่เพิ่มบ่อย ให้ใช้ polymorphism ย้ายพฤติกรรมไปไว้กับแต่ละชนิด ผู้เรียกพึ่งแค่สัญญากลาง ทำให้การขยายเป็นการเพิ่มคลาสแทนการแก้โค้ดเดิม (Open/Closed) ส่วนกรณีที่ตัวแปรต่างกันแค่ตัวเลขอาจใช้ข้อมูลอย่างเดียวพอ"},{"id":"ENG-S-P-018","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S1","concept":"oop-fragile-base-class-self-call","mobile":false,"type":"multiple","stem":"โค้ดด้านล่างต้องการนับจำนวนสินค้าที่ถูกเพิ่มลงตะกร้า ทีมรัน b.addAll(['a', 'b', 'c']) แล้วดู b.count ผลลั
