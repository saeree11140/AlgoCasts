พธ์และแนวทางแก้ข้อใดถูกต้อง (เลือกทุกข้อที่ถูก)","code":"class Basket {\n  protected items: string[] = [];\n  add(item: string): void {\n    this.items.push(item);\n  }\n  addAll(list: string[]): void {\n    list.forEach((i) => this.add(i));\n  }\n}\n\nclass CountingBasket extends Basket {\n  count = 0;\n  add(item: string): void {\n    this.count++;\n    super.add(item);\n  }\n  addAll(list: string[]): void {\n    this.count += list.length;\n    super.addAll(list);\n  }\n}\n\nconst b = new CountingBasket();\nb.addAll(['a', 'b', 'c']);\nconsole.log(b.count);","codeLang":"typescript","options":[{"id":"A","text":"เกิด stack overflow เพราะ addAll ของคลาสลูกเรียก super.addAll ซึ่งเรียก add ของลูก แล้ววนกลับมาเรียก addAll อีกรอบจนไม่สิ้นสุด","correct":false,"why":"add ของคลาสลูกเรียก super.add ไม่ได้เรียก addAll จึงไม่มีการวนกลับ โปรแกรมทำงานจบตามปกติ ปัญหาจริงคือจำนวนที่นับซ้ำ"},{"id":"B","text":"แก้ได้ทันทีโดยลบบรรทัด super.add(item) ออกจาก add ของคลาสลูก เพื่อไม่ให้นับซ้ำ เพราะ addAll ของคลาสแม่เรียก add ของลูกอยู่แล้ว","correct":false,"why":"การลบ super.add ทำให้สินค้าไม่ถูกเก็บลงรายการ items ส่วน this.count++ ยังอยู่ b.count จึงยังเป็น 6 ตัวเลขไม่ได้แก้และตะกร้าก็ไม่ทำงาน"},{"id":"C","text":"b.count เป็น 6 เพราะ addAll ของแม่เรียก this.add ซึ่งถูก override ในลูก จึงนับซ้ำทั้งใน addAll ของลูกและใน add ของลูก","correct":true,"why":"ถูก เพราะ addAll ของลูกบวกจำนวนรายการ 3 ก่อน แล้ว super.addAll เรียก add ของลูกอีก 3 ครั้งซึ่งนับเพิ่ม รวมเป็น 6 (items ยังมี 3 รายการ)"},{"id":"D","text":"แก้ที่ต้นเหตุโดยให้ CountingBasket เก็บ Basket เป็นสมาชิก (composition) แล้ว delegate เมธอดไปให้ พร้อมนับเอง ไม่ผูกกับรายละเอียดภายในของแม่","correct":true,"why":"ถูก เพราะ composition ผูกกับสัญญาสาธารณะของ Basket เท่านั้น หากคลาสแม่เปลี่ยนวิธีทำงานภายใน การนับของเราไม่เพี้ยนตาม ต่างจากการสืบทอดที่ต้องรู้ implementation ของแม่"}],"explanation":"ปัญหา fragile base class: คลาสลูกที่ override เมธอดซึ่งคลาสแม่เรียกใช้ภายในตัวเอง ถูกผูกกับรายละเอียดภายในของแม่ (self-use) และพังได้เมื่อแม่เปลี่ยน การใช้ composition และ delegate ผ่านสัญญาสาธารณะลดการผูกนี้"},{"id":"ENG-S-P-019","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S2","concept":"oop-composition-over-inheritance-notifier-combos","mobile":false,"type":"single","stem":"ระบบแจ้งเตือนมีอินเทอร์เฟซ Notifier และคลาสลูก EmailNotifier, SmsNotifier, LineNotifier ต่อมาธุรกิจต้องการส่งแบบรวมหลายช่องทาง เช่น Email+SMS, Email+LINE หรือทั้งสามช่องทาง และต้องการความสามารถเสริม เช่น retry กับ logging ที่นำไปผสมกับช่องทางใดก็ได้ ทีมเริ่มสร้างคลาสอย่าง EmailSmsRetryNotifier จนจำนวนคลาสบวมขึ้นอย่างรวดเร็ว ควรปรับอย่างไร","options":[{"id":"A","text":"ประกอบความสามารถเป็นวัตถุผ่านอินเทอร์เฟซ Notifier เดียวกัน เช่น CompositeNotifier ที่ถือหลาย Notifier กับ RetryNotifier ที่ห่อ Notifier อีกตัว แล้วประกอบตอนรัน","correct":true,"why":"ถูก เพราะการประกอบ (composition) ให้จำนวนคลาสโตแบบเชิงเส้นตามจำนวนความสามารถ ไม่ใช่โตตามจำนวนชุดผสม และเปลี่ยนชุดผสมได้ตอนรัน"},{"id":"B","text":"สร้างคลาสแม่ตัวเดียวที่มี flag boolean เช่น useEmail, useSms, useLine, retry, log แล้วใช้ if ภายในเมธอด send เพื่อรวมทุกชุดผสมในคลาสเดียว ลดจำนวนคลาสลงเหลือคลาสเดียว","correct":false,"why":"คลาสเดียวสะสมเงื่อนไขมากขึ้นทุกครั้งที่เพิ่มความสามารถ ต้องแก้โค้ดที่ผ่านการทดสอบแล้วทุกครั้ง และทดสอบแต่ละชุดผสมได้ยาก"},{"id":"C","text":"ใช้การสืบทอดหลายคลาสหรือ mixin ซ้อนกันหลายชั้น ให้คลาสผสมสืบทอดจากหลาย Notifier พร้อมกัน เพื่อลดโค้ดซ้ำของการส่งในแต่ละช่องทางและการ retry","correct":false,"why":"ยังต้องประกาศคลาสสำหรับแต่ละชุดผสม จำนวนชุดยังโตแบบ combinatorial และการสืบทอดหลายสายอาจเกิดความกำกวมเมื่อสองคลาสแม่มีเมธอดชื่อเดียวกัน"},{"id":"D","text":"เรียงคลาสเป็นสายสืบทอดเดียว เช่น RetryEmailNotifier สืบทอดจาก EmailNotifier แล้วให้ชุดผสมสืบทอดต่อกันจากง่ายไปซับซ้อน เพื่อใช้โค้ดของชั้นก่อนหน้าซ้ำ","correct":false,"why":"สายสืบทอดเดียวกำหนดลำดับความสามารถตายตัว ชุดผสมที่ไม่ตรงลำดับ เช่น SMS+LINE ที่ไม่มี Email ก็ยังต้องมีคลาสแยกหรือยังพกความสามารถที่ไม่ต้องการมาด้วย"}],"explanation":"เมื่อความสามารถหลายอย่างต้องนำมาผสมกันได้อย่างอิสระ การสืบทอดทำให้จำนวนคลาสระเบิด ให้เปลี่ยนไปใช้ composition (เช่น composite และ decorator) ที่ประกอบวัตถุผ่านอินเทอร์เฟซเดียวกัน แล้วเลือกชุดผสมตอนสร้างวัตถุ"},{"id":"ENG-S-P-020","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S2","concept":"oop-aggregation-vs-composition-lifetime","mobile":false,"type":"multiple","stem":"ทีมกำลังวาด class diagram ของระบบ e-commerce และถกเถียงว่าความสัมพันธ์ใดควรเป็น composition (ส่วนย่อยมีอายุผูกกับส่วนรวม) หรือ aggregation (ส่วนย่อยอยู่ได้เองและอาจถูกใช้ร่วมกัน) ข้อใดเป็นการจัดประเภทที่สมเหตุสมผล (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ShoppingCart กับ Product เป็น composition เพราะตะกร้าบรรจุสินค้า จึงต้องลบสินค้าทิ้งเมื่อตะกร้าถูกล้าง","correct":false,"why":"สินค้ายังต้องอยู่ในแคตตาล็อกและอยู่ในตะกร้าของผู้อื่นได้ ตะกร้าเพียงอ้างถึงสินค้า ความสัมพันธ์นี้จึงไม่ผูกอายุ (aggregation หรือ association)"},{"id":"B","text":"Order กับ OrderLine เป็น composition เพราะรายการสินค้าในออเดอร์ไม่มีความหมายเมื่อออเดอร์ถูกลบ และถูกสร้างโดยออเดอร์เอง","correct":true,"why":"ถูก เพราะ OrderLine เป็นส่วนหนึ่งของออเดอร์นั้นโดยเฉพาะ ไม่ถูกแชร์ให้ออเดอร์อื่น และอายุผูกกับออเดอร์"},{"id":"C","text":"Warehouse กับ Product เป็น aggregation เพราะสินค้ายังมีอยู่ในแคตตาล็อกและย้ายไปคลังอื่นได้แม้คลังเดิมถูกปิด","correct":true,"why":"ถูก เพราะ Product อยู่ได้โดยไม่ขึ้นกับคลังใดคลังหนึ่ง และสัมพันธ์กับคลังแบบหลวม ๆ"},{"id":"D","text":"Team กับ Employee เป็น aggregation เพราะพนักงานยังอยู่ในบริษัทเมื่อทีมถูกยุบ และพนักงานคนหนึ่งอยู่ได้หลายทีม","correct":true,"why":"ถูก เพราะ Employee มีอายุอิสระจาก Team และถูกใช้ร่วมกันได้ ซึ่งเป็นลักษณะของ aggregation"}],"explanation":"ตัวตัดสินระหว่าง composition กับ aggregation คือเรื่องอายุและการเป็นเจ้าของ ถ้าส่วนย่อยตายพร้อมส่วนรวมและไม่ถูกแชร์ให้ใช้ composition ถ้าส่วนย่อยอยู่ได้เองหรือถูกใช้ร่วมกันให้ใช้ aggregation ซึ่งส่งผลต่อการออกแบบ cascade delete และการสร้างวัตถุ"},{"id":"ENG-S-P-021","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S3","concept":"oop-interface-vs-abstract-class-capabilities","mobile":false,"type":"single","stem":"ระบบรองรับผู้ให้บริการชำระเงินหลายราย (PromptPay, บัตรเครดิต, wallet) ทุกรายต้องมีเมธอด charge และ refund ตามสัญญาเดียวกัน แต่แต่ละรายมี SDK และ state ภายในต่างกันมาก และบางรายรองรับความสามารถเสริม เช่น Reconcilable หรือรับ webhook ได้ (บางรายมีแค่บางอย่าง) ภาษาที่ใช้สืบทอดคลาสได้เพียงคลาสเดียว ควรกำหนดสัญญากลางอย่างไร","options":[{"id":"A","text":"ใช้ abstract class PaymentProvider ที่รวมทุกเมธอด ทั้ง charge, refund, reconcile และ webhook ให้ผู้ให้บริการที่ไม่รองรับบางอย่าง throw NotSupported","correct":false,"why":"ผู้ให้บริการต้องแบกเมธอดที่ตัวเองไม่ใช้ และผู้เรียกไม่รู้ล่วงหน้าว่าเมธอดใดจะพัง จึงเกิดข้อผิดพลาดตอนรัน ทั้งที่ควรบอกได้จากชนิด"},{"id":"B","text":"ใช้คลาสแม่ธรรมดา PaymentProvider ที่ implement เมธอดเป็นค่าเริ่มต้นไว้ แล้วให้คลาสลูก override เฉพาะส่วนที่ต่าง เพื่อลดโค้ดซ้ำ","correct":false,"why":"การเรียก charge หรือ refund ของแม่ไม่มีพฤติกรรมเริ่มต้นที่ถูกต้อง เพราะแต่ละรายผ่าน SDK คนละแบบ ค่าเริ่มต้นจึงไร้ความหมายและอาจถูกใช้โดยไม่ตั้งใจ"},{"id":"C","text":"ใช้ abstract class ซ้อนเป็นสายเดียว BaseProvider → ReconcilableProvider → WebhookProvider แล้วให้ผู้ให้บริการสืบทอดจากชั้นที่ใกล้เคียงที่สุด","correct":false,"why":"สายสืบทอดเดียวบังคับให้ผู้ที่รองรับ webhook แต่ไม่รองรับ reconcile ต้องรับความสามารถที่ไม่ใช้มาด้วย หรือสร้างลำดับชั้นเพิ่มจนไม่ครอบคลุมทุกชุดผสม"},{"id":"D","text":"กำหนด interface สำหรับสัญญา charge/refund และ interface แยกสำหรับแต่ละความสามารถเสริม แล้วให้ผู้ให้บริการแต่ละรายเลือก implement เท่าที่รองรับ","correct":true,"why":"ถูก เพราะ implement ได้หลาย interface ในภาษาที่สืบทอดคลาสได้ตัวเดียว ผู้เรียกขอเฉพาะความสามารถที่ต้องใช้ผ่านชนิด และไม่ผูกกับคลาสแม่ใด"}],"explanation":"ใช้ interface กำหนดสัญญาและความสามารถที่ผู้ implement เลือกประกอบได้ ใช้ abstract class เมื่อมีสถานะหรือโค้ดร่วมที่ควรแชร์ในลำดับชั้นเดียว การยัดทุกความสามารถไว้ในสัญญาเดียวแล้วโยน NotSupported ทำให้ละเมิด Interface Segregation"},{"id":"ENG-S-P-022","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S4","concept":"oop-srp-split-order-service","mobile":false,"type":"multiple","stem":"OrderService.placeOrder ในโค้ดเดิมทำทุกอย่างในเมธอดเดียว ตามที่ระบุไว้ในคอมเมนต์ด้านล่าง ทีมต้องแก้ทั้งสูตรคำนวณราคา SQL และเทมเพลตอีเมลบ่อย และทดสอบเมธอดนี้ยากเพราะต้องต่อฐานข้อมูลกับ SMTP จริง การ refactor ข้อใดสอดคล้องกับ Single Responsibility Principle และรักษาพฤติกรรมเดิม (เลือกทุกข้อที่ถูก)","code":"class OrderService {\n  placeOrder(dto: OrderDto): Order {\n    // 1. validate input fields\n    // 2. calculate price, coupon, VAT 7%\n    // 3. INSERT INTO orders ... (raw SQL)\n    // 4. build HTML email and send through SMTP client\n    // 5. write audit log line\n    return order;\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"แยกการคำนวณราคาไปไว้ในคลาสเช่น PriceCalculator ที่ไม่รู้จักฐานข้อมูลหรืออีเมล เพื่อทดสอบสูตรราคาด้วย unit test ได้โดยตรง","correct":true,"why":"ถูก เพราะตรรกะธุรกิจที่เปลี่ยนบ่อยถูกแยกออกจากเรื่องโครงสร้างพื้นฐาน มีเหตุผลเดียวที่จะเปลี่ยนและทดสอบได้ง่าย"},{"id":"B","text":"แยกเป็นเมธอด private หลายตัวภายใน OrderService เช่น validate, price, save, sendMail โดยยังเป็นคลาสเดียวกัน เพราะแต่ละเมธอดทำหน้าที่เดียวแล้ว","correct":false,"why":"คลาสยังมีเหตุผลให้เปลี่ยนหลายเรื่อง (ราคา SQL อีเมล) และยังต้องต่อฐานข้อมูลกับ SMTP จริงเพื่อทดสอบ การแยกเมธอดช่วยอ่านง่ายขึ้นแต่ไม่ได้แยกความรับผิดชอบระดับคลาส"},{"id":"C","text":"แยกการเข้าถึงฐานข้อมูลไปไว้ใน OrderRepository และให้ OrderService เรียกผ่านอินเทอร์เฟซ","correct":true,"why":"ถูก เพราะการเปลี่ยน SQL หรือฐานข้อมูลไม่กระทบตรรกะการสั่งซื้อ และทดสอบ OrderService ด้วย repository ปลอมได้"},{"id":"D","text":"ย้ายโค้ดทั้งหมดที่แยกแล้วไปรวมไว้ในคลาส static OrderHelper เพียงคลาสเดียว เพื่อให้เรียกใช้ได้สะดวกจากทุกที่","correct":false,"why":"เป็นการรวมความรับผิดชอบหลายเรื่องกลับไว้ที่เดียวเหมือนเดิม และเมธอด static ที่เรียกจากทุกที่ทำให้สลับตัวจริงด้วยตัวปลอมตอนทดสอบได้ยาก"},{"id":"E","text":"แยกการสร้างและส่งอีเมลเป็นคลาสแจ้งเตือน เช่น OrderMailer ที่ OrderService เรียกหลังบันทึกคำสั่งซื้อสำเร็จ","correct":true,"why":"ถูก เพราะรูปแบบอีเมลและช่องทางส่งเปลี่ยนด้วยเหตุผลคนละอย่างกับกฎการสั่งซื้อ และยังรักษาลำดับเดิมคือบันทึกก่อนแจ้งเตือน"}],"explanation":"SRP ไม่ได้หมายถึงการแยกเมธอดให้สั้น แต่หมายถึงให้แต่ละคลาสมีเหตุผลเดียวที่จะเปลี่ยน แยกตรรกะธุรกิจ การเข้าถึงข้อมูล และการแจ้งเตือนออกจากกัน แล้วประกอบกันผ่านอินเทอร์เฟซ จะได้ทั้งแก้ง่ายและทดสอบแยกส่วนได้"},{"id":"ENG-S-P-023","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S4","concept":"oop-dependency-inversion-inject-gateway","mobile":false,"type":"single","stem":"บริษัทต้องรองรับผู้ให้บริการชำระเงินรายใหม่ในบางประเทศ และต้องการเขียน unit test ของ InvoiceService โดยไม่เรียกระบบภายนอกจริง ควรปรับโครงสร้างโค้ดด้านล่างอย่างไร","code":"class InvoiceService {\n  private gateway = new LegacyGateway();\n\n  charge(invoice: Invoice): Receipt {\n    const result = this.gateway.createCharge(invoice.total, invoice.currency);\n    return new Receipt(invoice.id, result.reference);\n  }\n}","codeLang":"typescript","options":[{"id":"A","text":"เพิ่มพารามิเตอร์ country ใน charge แล้วใช้ if/else ภายใน InvoiceService เลือกระหว่าง LegacyGateway กับ NewGateway ตามประเทศของใบแจ้งหนี้","correct":false,"why":"InvoiceService ยังผูกกับคลาสจริงทั้งสองและต้องถูกแก้ทุกครั้งที่เพิ่มผู้ให้บริการ อีกทั้งยังทดสอบโดยไม่เรียกระบบภายนอกไม่ได้"},{"id":"B","text":"สร้างอินเทอร์เฟซ PaymentGateway ให้ InvoiceService รับผ่าน constructor ให้ LegacyGateway และผู้ให้บริการใหม่ implement แล้วให้จุดประกอบแอปเลือกตัวที่ส่งเข้าไป","correct":true,"why":"ถูก เพราะ InvoiceService พึ่งนามธรรม (Dependency Inversion) การสลับผู้ให้บริการและการใส่ตัวปลอมในเทสต์ทำที่จุดประกอบ โดยไม่แก้ตรรกะใบแจ้งหนี้"},{"id":"C","text":"ทำให้ LegacyGateway เป็น singleton ที่เรียกผ่าน LegacyGateway.getInstance() เพื่อให้เทสต์เข้าถึงและแทนค่าภายในได้สะดวกโดยไม่แก้ constructor","correct":false,"why":"ยังเป็นการผูกกับคลาสจริงแบบ global ที่ซ่อนอยู่ ทดสอบแบบขนานได้ยาก และไม่ช่วยให้สลับผู้ให้บริการรายใหม่"},{"id":"D","text":"สร้างคลาส NewInvoiceService สืบทอดจาก InvoiceService แล้ว override charge ให้ใช้ผู้ให้บริการใหม่ และคัดลอกส่วนอื่นของคลาสเดิมมาปรับให้ใช้กับผู้ให้บริการใหม่","correct":false,"why":"ได้โค้ดซ้ำสองชุดที่ต้องแก้ตามกันทุกครั้ง และเมื่อมีผู้ให้บริการอีกรายต้องสร้างคลาสลูกเพิ่มโดยยังทดสอบกับระบบภายนอกจริงอยู่"}],"explanation":"ให้คลาสระดับสูงพึ่งอินเทอร์เฟซ ไม่สร้างหรือค้นหา implementation เอง (Dependency Inversion และ Dependency Injection) จะได้สลับผู้ให้บริการตามเงื่อนไขและใช้ตัวปลอมในการทดสอบได้ โดยไม่ต้องแก้ตรรกะธุรกิจ"},{"id":"ENG-S-P-024","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S5","concept":"oop-adapter-wrap-vendor-sdk","mobile":false,"type":"single","stem":"ระบบหลักเรียกผ่านอินเทอร์เฟซ ShippingProvider { quote(parcel): Money; book(parcel): TrackingNo } ซึ่งมีโค้ดเรียกใช้หลายสิบจุดและใช้กับขนส่งหลายราย ต้องเพิ่มขนส่งรายใหม่ที่ SDK มีเพียง calcRate(weightGram, zip) กับ createShipment(xmlPayload) ที่รับ-ส่งข้อมูลคนละรูปแบบ และห้ามแก้ SDK ของผู้ขาย ควรใช้แนวทางใด","options":[{"id":"A","text":"เขียน adapter ที่ implement ShippingProvider โดยแปลง Parcel เป็นพารามิเตอร์และ XML ภายใน เรียก SDK ของผู้ขาย แล้วแปลงผลกลับเป็นชนิดที่ระบบหลักใช้","correct":true,"why":"ถูก เพราะ adapter ซ่อนความต่างของ SDK ไว้หลังอินเทอร์เฟซเดิม โค้ดเรียกใช้หลายสิบจุดจึงไม่ต้องเปลี่ยน และความรู้เรื่อง XML อยู่ในที่เดียว"},{"id":"B","text":"แก้อินเทอร์เฟซ ShippingProvider ให้รับ payload แบบกว้าง (any) เพื่อให้แต่ละรายส่งข้อมูลในรูปแบบของตัวเองได้ แล้วให้ผู้เรียกแต่ละจุดเตรียมข้อมูลเอง","correct":false,"why":"ทำให้ทุกจุดที่เรียกใช้และทุก implementation เดิมต้องแก้ตาม ชนิดข้อมูลสูญเสียความหมาย และผลักความต่างของ SDK ไปให้ผู้เรียกทุกจุด"},{"id":"C","text":"คัดลอกซอร์สของ SDK มาไว้ในโปรเจกต์แล้วแก้ชื่อเมธอดและชนิดข้อมูลให้ตรงกับ ShippingProvider เพื่อให้เรียกใช้ผ่านอินเทอร์เฟซเดิมได้ตรง ๆ","correct":false,"why":"ฝ่าฝืนข้อห้ามแก้ SDK ของผู้ขาย และต้องตามแก้ทุกครั้งที่ผู้ขายออกเวอร์ชันใหม่ ภาระดูแลสูงกว่าการเขียนชั้นแปลงบาง ๆ"},{"id":"D","text":"ให้ทุกจุดที่เรียก ShippingProvider ตรวจว่าเป็นขนส่งรายใหม่หรือไม่ ถ้าใช่ให้เรียก SDK ใหม่โดยตรงและแปลงข้อมูลเองที่จุดนั้น","correct":false,"why":"กระจายความรู้เรื่องขนส่งรายใหม่ไปทุกจุดที่เรียกใช้ ต้องแก้หลายสิบที่ และขัดกับจุดประสงค์ของอินเทอร์เฟซกลาง"}],"explanation":"Adapter ใช้เมื่อมีอินเทอร์เฟซที่ผู้เรียกพึ่งอยู่แล้ว กับของที่มีอยู่แต่รูปร่างต่างกันและแก้ไม่ได้ ชั้นแปลงเล็ก ๆ หนึ่งคลาสทำให้โค้ดเดิมไม่ต้องรู้เรื่องความต่าง และมีที่เดียวให้แก้เมื่อ SDK เปลี่ยน"},{"id":"ENG-S-P-025","level":"senior","pool":"practice","competency":"OOP","descriptor":"OOP-S5","concept":"oop-debug-shared-array-reference-copy","mobile":false,"type":"single","stem":"ผู้ใช้กดดูตัวอย่างตะกร้าพร้อมของแถม (previewWithGift) แล้วกดกลับ แต่พบว่าของแถมปรากฏในตะกร้าจริงและถูกคิดเงินด้วย โค้ดด้านล่างเป็นส่วนที่เกี่ยวข้อง ข้อใดวินิจฉัยสาเหตุและวิธีแก้ได้เหมาะสมที่สุด","code":"class Cart {\n  constructor(public items: CartItem[] = []) {}\n  addItem(item: CartItem): void {\n    this.items.push(item);\n  }\n}\n\nfunction previewWithGift(cart: Cart): Cart {\n  const preview = new Cart(cart.items);\n  preview.addItem({ sku: 'GIFT', qty: 1, price: 0 });\n  return preview;\n}","codeLang":"typescript","options":[{"id":"A","text":"ปัญหาอยู่ที่ฟังก์ชันรับ cart เป็นพารามิเตอร์ ซึ่งทำให้ตัวแปร cart ในฟังก์ชันคืออ็อบเจกต์ตัวเดิมจากภายนอก ควรแก้ให้ addItem คืนอ็อบเจกต์ใหม่แทนการแก้ของเดิม","correct":false,"why":"ฟังก์ชันสร้าง Cart ตัวใหม่ด้วย new Cart อยู่แล้ว สิ่งที่ถูกใช้ร่วมกันคืออาร์เรย์ items ที่ส่งเข้า constructor การเปลี่ยน addItem อย่างเดียวไม่แก้การใช้อาร์เรย์ร่วมกัน"},{"id":"B","text":"เรียก Object.freeze(cart) ก่อนส่งเข้าฟังก์ชัน เพื่อให้ตะกร้าเดิมแก้ไขไม่ได้ และตัวอย่างยังทำงานต่อได้โดยไม่มีผลกับตะกร้าจริง","correct":false,"why":"Object.freeze ล็อกเฉพาะคุณสมบัติของ cart ชั้นนอก แต่อาร์เรย์ items เป็นอ็อบเจกต์ที่อ้างถึงอยู่ ยังเรียก push ได้ ของแถมจึงยังเข้าตะกร้าเดิม"},{"id":"C","text":"Cart ใหม่ถืออาร์เรย์ items ตัวเดียวกับ cart เดิม (แชร์ reference) การ push จึงเปลี่ยนทั้งสองตัว ควรคัดลอกอาร์เรย์ตอนสร้าง (defensive copy) เช่น [...items]","correct":true,"why":"ถูก เพราะ new Cart(cart.items) ส่ง reference เดียวกันเข้าไป การคัดลอกอาร์เรย์ทำให้ Cart แต่ละตัวมีรายการของตัวเอง ส่วน item ที่เป็นอ็อบเจกต์อาจต้องคัดลอกลึกขึ้นอยู่กับว่ามีการแก้ค่าใน item หรือไม่"},{"id":"D","text":"เปลี่ยนการประกาศเป็น public readonly items: CartItem[] ใน TypeScript เพื่อกันไม่ให้ push ลงอาร์เรย์ของตะกร้าจากภายนอกหรือจากฟังก์ชันอื่น","correct":false,"why":"readonly ใน TypeScript ห้ามกำหนดค่าให้คุณสมบัติใหม่เท่านั้น ไม่ได้ห้ามเรียก push บนอาร์เรย์เดิม และเป็นการตรวจตอน compile ไม่ได้ป้องกันตอนรัน"}],"explanation":"บั๊กแนว aliasing เกิดเมื่อสองอ็อบเจกต์ถือ reference ไปยังคอลเลกชันเดียวกัน อ็อบเจกต์ที่ควรเป็นเจ้าของข้อมูลของตัวเองควรคัดลอกตอนรับเข้ามา (defensive copy) การ freeze แบบตื้นหรือ readonly ของภาษาไม่ได้ป้องกันการแก้เนื้อในของคอลเลกชัน"},{"id":"ENG-S-P-026","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S1","concept":"mon-symptom-based-alerting","mobile":false,"type":"single","stem":"ทีม platform ของระบบจองตั๋วคอนเสิร์ตออนไลน์ถูก page เฉลี่ย 35 ครั้งต่อคืน ส่วนใหญ่มาจาก alert 'CPU ของ node เกิน 80% นาน 5 นาที' ซึ่งดังตอน batch สร้างรายงานทำงาน และมักหายเองโดยผู้ใช้ไม่รู้สึกอะไร แต่เมื่อสัปดาห์ก่อนผู้ใช้จ่ายเงินไม่ได้นาน 20 นาทีโดยไม่มี alert ใดดังเลย ทีมต้องการปรับ alerting ให้ on-call ถูกปลุกเมื่อมีเหตุจำเป็นจริง ควรทำสิ่งใดเป็นอันดับแรก","options":[{"id":"A","text":"ปรับ threshold ของ CPU เป็น 95% และขยายช่วงเวลาที่ต้องเกินเป็น 15 นาที เพื่อให้ alert ดังน้อยลงแต่ยังคุมทุก node อยู่","correct":false,"why":"ผิด เพราะยังเป็น alert ที่ตั้งจากสาเหตุที่เป็นไปได้ จำนวน page อาจลดลง แต่เหตุที่ผู้ใช้จ่ายเงินไม่ได้โดย CPU ปกติก็ยังตรวจไม่พบเหมือนเดิม"},{"id":"B","text":"ตั้ง alert จากอาการที่ผู้ใช้รับรู้ เช่น อัตราชำระเงินสำเร็จและ latency ของ checkout เทียบเป้า SLO แล้วย้าย CPU ไปไว้ใน dashboard","correct":true,"why":"ถูก เพราะ alert ตามอาการจับเหตุที่กระทบผู้ใช้ได้ไม่ว่าสาเหตุคืออะไร และตัดเสียงรบกวนจากสัญญาณที่ไม่กระทบผู้ใช้ออกจากการปลุก on-call"},{"id":"C","text":"เพิ่ม alert ให้ครบทุก metric ของทุก service เช่น memory, disk, thread count และ GC time เพื่อให้ตรวจจับปัญหาได้ก่อนที่จะกระทบผู้ใช้","correct":false,"why":"ผิด เพราะ alert ที่เพิ่มขึ้นส่วนใหญ่เป็นสัญญาณจากสาเหตุที่ไม่ได้กระทบผู้ใช้เสมอไป ทำให้ on-call ถูกปลุกถี่ขึ้นและเริ่มชินกับ alert (alert fatigue)"},{"id":"D","text":"ย้าย batch สร้างรายงานไปรันช่วงกลางวัน เพื่อให้ CPU alert ดังตอนที่ทีมยังอยู่ครบและตอบสนองได้ทันที","correct":false,"why":"ผิด เพราะเป็นการย้ายเวลาที่เสียงรบกวนเกิดขึ้น ไม่ได้แก้ที่ alert ที่ไม่ตรงกับผลกระทบ และช่องโหว่ที่ตรวจเหตุจ่ายเงินไม่ได้ก็ยังอยู่"}],"explanation":"alert ที่ปลุกคนควรผูกกับสิ่งที่ผู้ใช้หรือธุรกิจรู้สึก เช่น ความสำเร็จของ transaction และ latency เทียบกับ SLO ส่วนสัญญาณภายในอย่าง CPU เหมาะเป็นข้อมูลประกอบการวินิจฉัยหรือ ticket ที่ไม่ต้องปลุกใคร ในงานจริงควรทบทวน alert ที่เคยดังว่าครั้งใดต้องมีคนลงมือแก้จริง และตัดที่ไม่ต้องลงมือออกอย่างสม่ำเสมอ"},{"id":"ENG-S-P-027","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S1","concept":"mon-structured-log-fields","mobile":false,"type":"multiple","stem":"ระบบสั่งซื้อออนไลน์แยกเป็น 6 service ทีมกำลังกำหนดมาตรฐาน log กลางเพื่อใช้ไล่ปัญหาข้ามบริการ โดยมีข้อกำหนดด้าน PDPA ว่าข้อมูลที่ระบุตัวลูกค้าได้โดยตรงห้ามไปอยู่ใน log ที่นักพัฒนาทุกคนเปิดอ่านได้ แนวทางใดต่อไปนี้เหมาะสมกับมาตรฐานนี้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"บันทึก request body ทั้งก้อนที่ระดับ INFO ในทุก request เพื่อให้ย้อนดูได้ครบว่าลูกค้าส่งอะไรมาเมื่อเกิดปัญหา","correct":false,"why":"ผิด เพราะ request body มักมีชื่อ ที่อยู่ เบอร์โทร ทำให้ข้อมูลส่วนบุคคลไปกองอยู่ใน log ที่คนจำนวนมากเข้าถึงได้ ขัดกับข้อกำหนด PDPA ของโจทย์"},{"id":"B","text":"เขียน log เป็น JSON ที่มี field ชื่อคงที่ เช่น timestamp, service, level, event และ trace id เดียวกันตลอดคำขอที่ข้ามบริการ","correct":true,"why":"ถูก เพราะ field คงที่ทำให้ค้นและรวม log ของแต่ละ service ได้ด้วย query เดียว และ trace id ช่วยเรียงเหตุการณ์ของคำขอเดียวกันข้ามบริการ"},{"id":"C","text":"ให้แต่ละ service ตั้งชื่อ field และรูปแบบวันที่เองตามความถนัดของทีมเจ้าของ เพราะทีมนั้นรู้ดีที่สุดว่าควรบันทึกอะไร","correct":false,"why":"ผิด เพราะ field ที่ไม่ตรงกันทำให้ค้นข้ามบริการไม่ได้ และการตั้ง alert จาก log ต้องเขียนกฎแยกตามแต่ละ service"},{"id":"D","text":"ใส่ identifier ภายใน เช่น order id หรือ customer id แทนชื่อ เบอร์โทร และเลขบัตรประชาชน แล้วไปดูข้อมูลจริงจากระบบที่คุมสิทธิ์","correct":true,"why":"ถูก เพราะ identifier ภายในพอสำหรับไล่เหตุการณ์ และข้อมูลที่ระบุตัวโดยตรงยังอยู่ในระบบที่คุมสิทธิ์และ audit ได้ ส่วน customer id ยังโยงกลับถึงตัวบุคคลได้ จึงยังต้องคุมสิทธิ์และอายุของ log"},{"id":"E","text":"กำหนดความหมายของระดับ log ให้ตรงกัน เช่น ERROR ใช้เฉพาะกรณีที่ต้องมีคนตรวจสอบ เพื่อให้ค้นและตั้ง alert จากระดับ log ได้เชื่อถือได้","correct":true,"why":"ถูก เพราะถ้าทุก service ใช้ระดับ log ด้วยความหมายเดียวกัน การกรอง ERROR และการตั้ง alert จึงสะท้อนเหตุที่ควรตามจริง"}],"explanation":"มาตรฐาน log ที่ดีทำให้ค้นข้ามบริการได้ด้วยโครงสร้างและ trace id เดียวกัน และกันข้อมูลที่ระบุตัวลูกค้าได้โดยตรงออกตั้งแต่ตอนเขียน log ไม่ใช่มาแก้ภายหลัง เพราะ log มักถูกเก็บนานและมีคนเข้าถึงมาก ควรมี field กลางที่ทุก service ใช้ร่วมกันและตรวจรูปแบบนี้ใน code review หรือใน pipeline"},{"id":"ENG-S-P-028","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S2","concept":"mon-runbook-mitigate-first","mobile":false,"type":"single","stem":"Webhook จากผู้ให้บริการ payment gateway ส่งมาที่ระบบเราแล้วได้ HTTP 500 ต่อเนื่องตั้งแต่ตี 3 ออเดอร์ที่ลูกค้าจ่ายเงินแล้วยังค้างที่สถานะ 'รอชำระ' วิศวกรเวรคนใหม่เปิด runbook ของเหตุการณ์นี้เพื่อทำตาม ลำดับขั้นตอนใดใน runbook เหมาะสมที่สุด","options":[{"id":"A","text":"ไล่อ่าน stack trace จนพบ root cause และแก้โค้ดให้เสร็จก่อน แล้วค่อยแจ้งทีมและฝ่ายดูแลลูกค้าเมื่อระบบกลับมาปกติ","correct":false,"why":"ผิด เพราะระหว่างที่ไล่หาสาเหตุ ออเดอร์ที่จ่ายแล้วยังค้างต่อไป และทีมกับฝ่ายดูแลลูกค้าไม่รู้สถานการณ์จนรับสายลูกค้าไม่ได้"},{"id":"B","text":"แจ้งทีมและเปิด ticket แล้วรอให้เจ้าของ payment module ตื่นมารับช่วงต่อ โดยเวรคนใหม่เฝ้าดูอาการอย่างเดียวและไม่ลงมือแก้อะไรกับระบบเลยจนกว่าจะมีคนมา","correct":false,"why":"ผิด เพราะการแจ้งเป็นขั้นตอนที่ถูก แต่การรอโดยไม่ทำสิ่งที่ runbook เตรียมไว้ให้ลดผลกระทบทำให้ความเสียหายขยายออกไปโดยไม่จำเป็น"},{"id":"C","text":"สั่ง restart ทุก instance ของ service ซ้ำจนกว่า error จะหยุด แล้วปิด incident ทันทีเมื่อ log ไม่มี 500 อีกในช่วงสั้นๆ","correct":false,"why":"ผิด เพราะ restart อาจกลบอาการชั่วคราวโดยไม่รู้สาเหตุ ออเดอร์ที่ค้างอยู่ยังไม่ถูกแก้ และไม่มีบันทึกเหตุการณ์ไว้ใช้วิเคราะห์ภายหลัง"},{"id":"D","text":"แจ้งทีมและเปิด incident ก่อน ลดผลกระทบด้วย rollback release ล่าสุดตามขั้นตอนที่เตรียมไว้ แล้วจึงหา root cause พร้อมบันทึก timeline","correct":true,"why":"ถูก เพราะ runbook ที่ดีให้ลดผลกระทบกับผู้ใช้ก่อน พร้อมสื่อสารและบันทึกเหตุการณ์ ส่วนการหาสาเหตุเชิงลึกทำต่อได้เมื่อระบบเสถียรแล้ว"}],"explanation":"ในเหตุการณ์จริงเป้าหมายแรกคือหยุดความเสียหายต่อผู้ใช้ด้วยวิธีที่เตรียมไว้และเห็นผลเร็ว เช่น rollback หรือปิดฟีเจอร์ ไม่ใช่การรู้สาเหตุให้ครบ runbook จึงควรเรียงเป็นประเมิน แจ้ง ลดผลกระทบ แล้วค่อยวินิจฉัย โดยบันทึกเหตุการณ์ไปตลอด เพื่อให้วิศวกรที่ไม่คุ้นกับระบบทำตามได้โดยไม่ต้องตัดสินใจเองในจุดเสี่ยง"},{"id":"ENG-S-P-029","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S2","concept":"mon-blameless-postmortem","mobile":false,"type":"multiple","stem":"หลังเหตุการณ์ฐานข้อมูลล่มนาน 2 ชั่วโมง จาก migration ที่ lock ตารางหลักช่วงที่มีผู้ใช้เยอะ ทีมจะทำ post-mortem แนวทางใดทำให้เอกสารนี้ช่วยป้องกันเหตุซ้ำได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ระบุว่าสาเหตุหลักคือวิศวกรที่รัน migration ตรวจสอบไม่ดีพอ แล้วให้หัวหน้าทีมตักเตือนเป็นรายบุคคลเพื่อไม่ให้เกิดซ้ำ","correct":false,"why":"ผิด เพราะการโทษที่ตัวบุคคลไม่ได้แก้ช่องว่างของกระบวนการ คนอื่นก็ทำพลาดแบบเดียวกันได้ และคนจะเริ่มปิดบังข้อมูลในเหตุการณ์ครั้งต่อไป"},{"id":"B","text":"บันทึก timeline พร้อมหลักฐาน เช่น graph และ log ที่แสดงเวลาเริ่ม migration เวลาที่ตารางถูก lock และเวลาที่ระบบฟื้นตัว","correct":true,"why":"ถูก เพราะ timeline ที่อ้างอิงหลักฐานทำให้เห็นลำดับเหตุและผล และตรวจสอบย้อนหลังได้โดยไม่ต้องพึ่งความจำของผู้ร่วมเหตุการณ์"},{"id":"C","text":"สรุปปัจจัยร่วมเชิงระบบ เช่น migration ไม่มีขั้น review และไม่เคยทดสอบกับข้อมูลปริมาณจริง แล้วกำหนด action item ที่มีผู้รับผิดชอบและกำหนดเสร็จ","correct":true,"why":"ถูก เพราะปัจจัยเชิงระบบเป็นสิ่งที่แก้ได้ถาวร และ action item ที่มีเจ้าของกับกำหนดเวลาถูกติดตามจนเสร็จ ไม่ค้างเป็นข้อเสนอแนะลอยๆ"},{"id":"D","text":"ปิดเอกสารด้วยข้อสรุปว่าเกิดจาก migration ที่ไม่ดี และขอให้ทุกคนระมัดระวังมากขึ้นเมื่อรัน migration ครั้งถัดไป","correct":false,"why":"ผิด เพราะ 'ระมัดระวังมากขึ้น' ไม่ใช่มาตรการที่ตรวจสอบหรือบังคับใช้ได้ ปัจจัยของระบบจึงไม่เปลี่ยนและเหตุแบบเดิมเกิดซ้ำได้"}],"explanation":"post-mortem แบบ blameless ถามว่าระบบและกระบวนการเปิดช่องให้เกิดความผิดพลาดได้อย่างไร ไม่ถามว่าใครผิด เอกสารควรมี timeline ที่อิงหลักฐาน ปัจจัยร่วมเชิงระบบ และ action item ที่ตรวจว่าเสร็จหรือไม่ได้ เช่น เพิ่มขั้น review ของ migration หรือรันบนข้อมูลจำลองขนาดจริงก่อน"},{"id":"ENG-S-P-030","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S3","concept":"mon-mobile-rum-startup-segmentation","mobile":true,"type":"single","stem":"หลังปล่อยแอปมือถือเวอร์ชัน 4.2 เวลา cold start ที่ percentile 95 บน dashboard รวมเพิ่มจาก 2.1 เป็น 2.6 วินาที แต่ QA วัดบนเครื่องทดสอบรุ่นใหม่ของบริษัทแล้วไม่พบความต่างจากเวอร์ชันก่อน ขณะที่มีรีวิวใน store บ่นว่าเปิดแอปช้าลงเฉพาะผู้ใช้บางกลุ่ม ทีมควรทำอะไรเพื่อหาสาเหตุอย่างมีประสิทธิภาพที่สุด","options":[{"id":"A","text":"แยก cold start ของผู้ใช้จริงตามเวอร์ชันแอป รุ่นเครื่อง และ RAM เพื่อหากลุ่มที่ช้าลง แล้ว profile บนเครื่องรุ่นล่างกลุ่มนั้น","correct":true,"why":"ถูก เพราะการแยกส่วน (segment) ทำให้เห็นว่าความช้าอยู่กับเครื่องกลุ่มใด ซึ่งเครื่องทดสอบรุ่นใหม่ของ QA มองไม่เห็น แล้วจึงตรวจซ้ำบนเครื่องที่ตรงกลุ่ม"},{"id":"B","text":"ใช้ค่าเฉลี่ยของ cold start ทุกเครื่อง ซึ่งยังต่ำกว่าเป้า 3 วินาที เป็นตัวชี้วัดหลักในการตัดสินใจว่าต้องแก้หรือไม่ในรอบนี้","correct":false,"why":"ผิด เพราะค่าเฉลี่ยรวมซ่อนกลุ่มที่ช้าลงจริงไว้ได้ เมื่อผู้ใช้ส่วนใหญ่ใช้เครื่องเร็ว ค่าที่ percentile สูงและการแยกกลุ่มจึงสำคัญกว่า"},{"id":"C","text":"ย้อนกลับไปปล่อยเวอร์ชัน 4.1 ให้ผู้ใช้ทั้งหมดทันที แล้วค่อยหาสาเหตุหลังจากนั้นด้วยการทดสอบบนเครื่องของทีมเอง","correct":false,"why":"ผิด เพราะบนมือถือการย้อนกลับต้องปล่อย build ใหม่ผ่านขั้นตอนของ store และผู้ใช้ต้องอัปเดตตาม ทั้งที่ยังไม่รู้ว่าสาเหตุคืออะไรและกระทบกลุ่มใด"},{"id":"D","text":"เพิ่มความถี่การส่ง metric ของแอปจากทุก 1 นาทีเป็นทุก 10 วินาที เพื่อให้เห็นรายละเอียดของการเปิดแอปแต่ละครั้งได้มากขึ้น","correct":false,"why":"ผิด เพราะปัญหาอยู่ที่ไม่ทราบว่าความช้าเกิดกับกลุ่มใด ไม่ใช่ความละเอียดของเวลาที่เก็บ การส่งถี่ขึ้นยังเพิ่มการใช้แบตเตอรี่และข้อมูลของผู้ใช้"}],"explanation":"ปัญหาประสิทธิภาพบนมือถือมักเกิดเฉพาะบางรุ่นเครื่อง บางเวอร์ชัน OS หรือบางเครือข่าย ค่ารวมและเครื่องทดสอบรุ่นใหม่จึงมองไม่เห็น การแยกข้อมูลผู้ใช้จริงตามมิติเหล่านี้ช่วยตีกรอบสาเหตุก่อนลงมือ profile ซึ่งถูกกว่าและเร็วกว่าการเดาแล้วย้อนเวอร์ชัน"},{"id":"ENG-S-P-031","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S4","concept":"mon-mobile-trace-propagation","mobile":true,"type":"multiple","stem":"แอปมือถือเรียก API gateway ซึ่งเรียกต่อไปยัง service สั่งซื้อและ service สต็อก ทีมติดตั้ง distributed tracing ฝั่ง backend แล้ว แต่เมื่อผู้ใช้ร้องเรียนว่ากดสั่งซื้อช้า trace ที่เห็นเริ่มที่ gateway และไม่เห็นเวลาที่เสียไปก่อนคำขอถึงเซิร์ฟเวอร์ ทำอย่างไรจึงจะเห็นภาพตั้งแต่ฝั่งแอป (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่ม log ที่ gateway บันทึกเวลาที่ได้รับ request แล้วให้ผู้ใช้แจ้งเวลาที่กดปุ่มเพื่อเทียบเองตอนร้องเรียน","correct":false,"why":"ผิด เพราะเวลาจากการแจ้งของผู้ใช้ไม่แม่นยำและนาฬิกาเครื่องอาจไม่ตรงกับเซิร์ฟเวอร์ อีกทั้งไม่ได้ผูกกับ trace ที่มีอยู่"},{"id":"B","text":"สร้าง span ฝั่งแอปครอบการเรียก API และส่ง trace context ไปใน HTTP header มาตรฐาน เพื่อให้ gateway ต่อ trace เดิมต่อไป","correct":true,"why":"ถูก เพราะ trace context ที่ส่งไปกับ request ทำให้ span ฝั่งแอปและ span ฝั่ง backend อยู่ใน trace เดียวกัน เห็นเวลารวมตั้งแต่ผู้ใช้กดปุ่ม"},{"id":"C","text":"ให้ gateway สร้าง trace id ใหม่ในทุก request แล้วส่งกลับใน response เพื่อให้แอปเก็บไว้ใช้อ้างอิง","correct":false,"why":"ผิด เพราะ trace ที่ gateway เริ่มเองยังไม่มีช่วงก่อนถึง gateway ต่อให้แอปเก็บ id ไว้ก็ไม่ได้เวลาที่เสียไปฝั่งแอปและเครือข่าย"},{"id":"D","text":"เพิ่มอัตราสุ่มเก็บ trace ฝั่ง backend เป็น 100% เพราะ trace ที่ขาดช่วงต้นน่าจะเกิดจากการสุ่มทิ้ง","correct":false,"why":"ผิด เพราะสิ่งที่ขาดคือ span ฝั่งแอป ไม่ใช่ trace ที่ถูกสุ่มทิ้ง การเพิ่ม sampling จึงไม่ทำให้เห็นช่วงก่อนถึง gateway และเพิ่มต้นทุนเก็บข้อมูล"},{"id":"E","text":"บันทึกเวลาแยกเฟสใน span ของแอป เช่น เวลารอเครือข่ายกับเวลาประมวลผลบนเครื่องหลังได้ response เพื่อแยกว่าเวลาหายไปกับการรอหรือในแอปเอง","correct":true,"why":"ถูก เพราะการแตกเวลาเป็นเฟสทำให้แยกได้ว่าเวลาหายไปที่ใด ซึ่ง backend trace อย่างเดียวบอกไม่ได้ว่าช้าที่เครือข่ายหรือในแอปเอง"}],"explanation":"distributed tracing ต้องเริ่มที่จุดแรกที่ผู้ใช้สัมผัส ถ้าฝั่งแอปไม่ส่ง trace context backend ก็เริ่ม trace ใหม่เองและไม่เห็นเวลาก่อนถึงเซิร์ฟเวอร์ การให้แอปสร้าง span และส่ง context ผ่าน header มาตรฐานทำให้เห็นทั้งเส้นทาง ควรระวังข้อมูลส่วนบุคคลใน attribute ของ span และต้นทุนการส่งข้อมูลจากเครื่องผู้ใช้ด้วย"},{"id":"ENG-S-P-032","level":"senior","pool":"practice","competency":"Monitoring and Logging","descriptor":"MON-S1","concept":"mon-mobile-crash-symbolication","mobile":true,"type":"multiple","stem":"แอปมือถือรุ่นใหม่มี crash-free sessions ลดจาก 99.5% เหลือ 98.1% ทีมเปิดรายงาน crash ใน crash reporting tool แล้วเห็น stack trace เป็นชื่อฟังก์ชันที่ถูกย่อและเลขที่อยู่หน่วยความจำ จึงไล่หาสาเหตุไม่ได้ แนวทางใดช่วยให้การติดตาม crash ครั้งต่อไปมีประสิทธิภาพขึ้น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"อัปโหลดไฟล์ symbol หรือ mapping ของแต่ละ build ขึ้น crash reporting tool ในขั้นตอน CI เพื่อแปลง stack trace กลับเป็นชื่อฟังก์ชันและเลขบรรทัด","correct":true,"why":"ถูก เพราะ stack trace ที่ถูกย่อชื่อต้องใช้ไฟล์ symbol ของ build เดียวกันจึงอ่านได้ และการอัปโหลดอัตโนมัติใน CI ทำให้ไม่ตกหล่นเมื่อ build ใหม่"},{"id":"B","text":"ปิดการย่อชื่อ (obfuscation หรือ minification) ในทุก build รวมถึง build ที่ปล่อยจริง เพื่อให้ stack trace อ่านออกโดยตรง","correct":false,"why":"ผิด เพราะการปิดทำให้โค้ดถูกวิเคราะห์ย้อนกลับได้ง่ายขึ้นและอาจทำให้แอปใหญ่ขึ้น ทั้งที่วิธีที่ถูกคือเก็บไฟล์ symbol ไว้แปลง trace แทน"},{"id":"C","text":"แนบเวอร์ชันแอป เวอร์ชันระบบปฏิบัติการ รุ่นเครื่อง และ breadcrumb ของการกระทำล่าสุดของผู้ใช้ไปกับรายงานทุกครั้ง โดยตัดข้อมูลส่วนบุคคลออก","correct":true,"why":"ถูก เพราะบริบทเหล่านี้ช่วยเห็นว่า crash กระจุกที่เวอร์ชัน รุ่นเครื่อง หรือขั้นตอนใด และการตัดข้อมูลส่วนบุคคลออกยังรักษาข้อกำหนดด้านความเป็นส่วนตัว"},{"id":"D","text":"จัดกลุ่ม crash ที่มี stack trace ลักษณะเดียวกันเป็น issue เดียว และเรียงตามจำนวนผู้ใช้ที่ได้รับผลกระทบ เพื่อแก้ตัวที่กระทบมากที่สุดก่อน","correct":true,"why":"ถูก เพราะการรวมกลุ่มลดรายงานซ้ำให้เหลือจำนวน issue ที่จัดการได้ และการเรียงตามผู้ใช้ที่กระทบช่วยเลือกงานที่คุ้มที่สุดก่อน"}],"explanation":"crash reporting ที่ใช้ได้จริงต้องอ่าน stack trace ได้ (ไฟล์ symbol ต่อ build) มีบริบทพอให้แยกกลุ่ม (เวอร์ชัน เครื่อง breadcrumb) และจัดลำดับตามผลกระทบต่อผู้ใช้ โดยต้องระวังไม่ส่งข้อมูลส่วนบุคคลมากับรายงาน การอัปโหลด symbol ควรอยู่ใน pipeline ปล่อยแอปเพื่อไม่ให้ลืม"},{"id":"ENG-S-P-033","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S1","concept":"web-mobile-process-death-state-restore","mobile":true,"type":"single","stem":"แอปมือถือสั่งอาหารมีขั้นตอนชำระเงิน 4 หน้า ผู้ใช้กรอกที่อยู่และเลือกคูปองแล้วสลับไปเปิดแอปธนาคารเพื่อโอนเงิน เมื่อกลับมาพบว่าแอปเริ่มใหม่ที่หน้าแรกและข้อมูลที่กรอกหาย เพราะระบบปฏิบัติการปิดแอปเพื่อเอาหน่วยความจำคืนขณะอยู่เบื้องหลัง ควรออกแบบ state ของขั้นตอนนี้อย่างไร","options":[{"id":"A","text":"ขอใช้หน่วยความจำให้มากขึ้นและเพิ่ม cache ในหน่วยความจำ เพื่อให้ระบบปฏิบัติการไม่เลือกปิดแอปของเราขณะอยู่เบื้องหลังเมื่อเครื่องขาดแคลน","correct":false,"why":"ผิด เพราะแอปที่อยู่เบื้องหลังถูกปิดได้เสมอเมื่อเครื่องต้องการหน่วยความจำ แอปควบคุมเรื่องนี้ไม่ได้ และ cache เพิ่มยิ่งทำให้มีโอกาสถูกเลือกปิดก่อน"},{"id":"B","text":"เก็บ state ของทุกหน้าไว้ใน singleton ระดับแอปในหน่วยความจำ แล้วให้แต่ละหน้าอ่านค่าจาก singleton นั้นเมื่อถูกสร้างใหม่","correct":false,"why":"ผิด เพราะ singleton ในหน่วยความจำหายไปพร้อมกับ process ที่ถูกปิด เมื่อแอปเปิดใหม่ ข้อมูลที่กรอกจึงหายเหมือนเดิม"},{"id":"C","text":"บันทึก state ที่จำเป็นลงที่เก็บถาวรเป็นระยะ กู้กลับเมื่อเปิดใหม่ และตรวจราคากับคูปองกับเซิร์ฟเวอร์ซ้ำก่อนไปต่อ","correct":true,"why":"ถูก เพราะ state ที่อยู่นอกหน่วยความจำรอดจากการถูกปิด และการตรวจกับเซิร์ฟเวอร์อีกครั้งกันการใช้ราคาหรือคูปองที่หมดอายุไปแล้วระหว่างที่ผู้ใช้ไปโอนเงิน"},{"id":"D","text":"เริ่มกระบวนการชำระเงินใหม่ตั้งแต่หน้าแรกทุกครั้งที่ผู้ใช้กลับเข้าแอป โดยให้ผู้ใช้ยืนยันข้อมูลอีกรอบเพื่อให้ข้อมูลเป็นปัจจุบัน","correct":false,"why":"ผิด เพราะผู้ใช้ที่กำลังโอนเงินอยู่ต้องเสียข้อมูลที่กรอกไปและอาจเกิดการสั่งซ้ำ ทั้งที่แก้ได้โดยกู้ state ที่บันทึกไว้"}],"explanation":"แอปมือถือต้องออกแบบโดยถือว่า process อาจถูกระบบปิดได้ทุกเมื่อขณะอยู่เบื้องหลัง state ที่ผู้ใช้เสียไม่ได้ต้องอยู่ในที่ที่รอดจากการปิด ส่วนค่าที่เปลี่ยนตามเวลา เช่น ราคา คูปอง สต็อก ต้องตรวจกับเซิร์ฟเวอร์ใหม่ตอนกู้คืน ไม่เชื่อค่าที่เก็บไว้ในเครื่อง"},{"id":"ENG-S-P-034","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S1","concept":"web-mobile-offline-sync-queue","mobile":true,"type":"multiple","stem":"แอปมือถือสำหรับพนักงานเก็บเงินหน้าร้านต้องรับออเดอร์ได้แม้สัญญาณอินเทอร์เน็ตหลุดเป็นช่วงๆ แล้วซิงก์ขึ้นเซิร์ฟเวอร์เมื่อกลับมาออนไลน์ แนวทางใดช่วยให้การซิงก์ถูกต้องและกู้คืนได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เก็บออเดอร์ที่ยังไม่ซิงก์ไว้ในหน่วยความจำของแอป และส่งทั้งหมดทีเดียวเมื่อแอปตรวจพบว่ากลับมาออนไลน์","correct":false,"why":"ผิด เพราะถ้าแอปถูกปิดหรือเครื่องดับก่อนส่ง ออเดอร์ทั้งหมดที่อยู่ในหน่วยความจำจะหายไป ซึ่งเป็นข้อมูลการขายที่ลูกค้าจ่ายเงินแล้ว"},{"id":"B","text":"เขียนออเดอร์ลงฐานข้อมูลในเครื่องก่อนทุกครั้ง แล้วให้ตัวซิงก์อ่านจากคิวในเครื่องและลองส่งใหม่เมื่อไม่สำเร็จ","correct":true,"why":"ถูก เพราะข้อมูลที่อยู่ในที่เก็บถาวรของเครื่องรอดจากการปิดแอป และคิวที่ลองส่งใหม่ทำให้ไม่ตกหล่นเมื่อสัญญาณกลับมา"},{"id":"C","text":"แนบ idempotency key ที่สร้างในเครื่องไปกับแต่ละออเดอร์ เพื่อให้การส่งซ้ำจากการลองใหม่ไม่สร้างออเดอร์ซ้ำที่เซิร์ฟเวอร์","correct":true,"why":"ถูก เพราะการลองส่งใหม่หลังหมดเวลา อาจทำให้เซิร์ฟเวอร์ได้รับออเดอร์เดิมสองครั้ง และ key เดียวกันทำให้เซิร์ฟเวอร์ตรวจพบและไม่สร้างซ้ำ"},{"id":"D","text":"ให้ข้อมูลที่แก้ไขล่าสุดตามเวลาในนาฬิกาของเครื่องชนะเสมอเมื่อแก้ข้อมูลเดียวกันชนกัน ไม่ว่าจะเป็นยอดเงินหรือสต็อกสินค้า","correct":false,"why":"ผิด เพราะนาฬิกาของเครื่องปรับได้และเดินไม่ตรงกัน ข้อมูลที่ใหม่กว่าจริงอาจถูกทับ และกับสต็อกหรือยอดเงินการทับค่ากันตรงๆ ทำให้ตัวเลขผิด"},{"id":"E","text":"กำหนดนโยบายแก้ความขัดแย้งแยกตามชนิดข้อมูล เช่น สต็อกให้เซิร์ฟเวอร์ตัดสิน บันทึกของลูกค้าให้รวมผลหรือถามผู้ใช้ และแสดงสถานะซิงก์ในหน้าจอ","correct":true,"why":"ถูก เพราะข้อมูลแต่ละชนิดมีความหมายต่างกัน จึงต้องใช้กฎต่างกัน และการแสดงสถานะซิงก์ทำให้ผู้ใช้รู้ว่ารายการใดยังค้างอยู่"}],"explanation":"แอปแบบ offline-first ต้องเขียนลงที่เก็บในเครื่องก่อน ใช้คิวซิงก์ที่ลองใหม่ได้ ใช้ idempotency key กันซ้ำ และมีนโยบายแก้ความขัดแย้งตามชนิดข้อมูล โดยไม่พึ่งนาฬิกาของเครื่องเป็นตัวตัดสิน เพราะความถูกต้องของข้อมูลธุรกิจสำคัญกว่าความเรียบง่ายของกลไกซิงก์"},{"id":"ENG-S-P-035","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S2","concept":"web-mobile-list-virtualization","mobile":true,"type":"single","stem":"หน้ารายการสินค้าในแอปมือถือมี 3,000 รายการ แต่ละรายการมีรูปภาพ เมื่อเลื่อนบนเครื่อง Android ราคาประหยัดจะกระตุก และแอปใช้หน่วยความจำสูงจนถูกระบบปิดเป็นบางครั้ง การแก้ปัญหาใดตรงจุดที่สุด","options":[{"id":"A","text":"สร้างแถวของสินค้าครบ 3,000 รายการตั้งแต่เปิดหน้า แล้วโหลดรูปความละเอียดเต็มเก็บไว้ในหน่วยความจำ เพื่อให้เลื่อนกลับมาดูซ้ำได้ทันที","correct":false,"why":"ผิด เพราะการสร้างทุกแถวและเก็บรูปเต็มความละเอียดทั้งหมดเป็นสาเหตุที่ทำให้หน่วยความจำสูงและกระตุก ทำให้ปัญหาแย่ลง"},{"id":"B","text":"ใช้รายการแบบ virtualized ที่สร้างและรีไซเคิลเฉพาะแถวที่อยู่บนจอ โหลดข้อมูลทีละช่วง และขอรูปขนาดย่อที่พอดีกับพื้นที่แสดงผล","correct":true,"why":"ถูก เพราะจำนวนแถวและรูปในหน่วยความจำจะเหลือเท่าที่เห็นบนจอ จึงลดทั้งการกระตุกและการใช้หน่วยความจำได้ตรงกับอาการ"},{"id":"C","text":"ลดแอนิเมชันของแอปทุกหน้า และเปลี่ยนไปโหลดรูปบน main thread เพื่อให้รูปขึ้นพร้อมกับแถวและไม่เห็นภาพกะพริบ","correct":false,"why":"ผิด เพราะการโหลดและถอดรหัสรูปบน main thread บล็อกการวาดหน้าจอ ทำให้กระตุกมากกว่าเดิม ส่วนแอนิเมชันไม่ใช่สาเหตุหลักของโจทย์นี้"},{"id":"D","text":"เพิ่ม timeout ของ API และเปิด gzip ที่เซิร์ฟเวอร์ เพราะน่าจะเกิดจากการดาวน์โหลดข้อมูล JSON ที่ช้า","correct":false,"why":"ผิด เพราะอาการคือกระตุกขณะเลื่อนและหน่วยความจำสูง ซึ่งเป็นปัญหาการเรนเดอร์และการถือข้อมูลในเครื่อง ไม่ใช่เวลาดาวน์โหลดข้อมูล"}],"explanation":"รายการยาวบนมือถือต้องไม่ถือทุกแถวไว้พร้อมกัน ใช้ list ที่รีไซเคิล view เฉพาะที่มองเห็น แบ่งโหลดข้อมูลเป็นช่วง และขอรูปขนาดพอดีกับจอ การวัดด้วย profiler บนเครื่องรุ่นล่างก่อนและหลังแก้ ช่วยยืนยันว่าแก้ถูกจุด"},{"id":"ENG-S-P-036","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S2","concept":"web-lcp-code-splitting-images","mobile":false,"type":"multiple","stem":"หน้า landing ของแคมเปญลดราคามี hero image เป็น JPEG ขนาด 3 MB และ JavaScript bundle รวม 1.8 MB ที่ทั้งเว็บถูกรวมเป็นไฟล์เดียว ผู้ใช้มือถือบน 4G วัด Largest Contentful Paint ได้ราว 6 วินาที มาตรการใดช่วยลด LCP ได้จริง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ย่อและแปลงรูป hero เป็นรูปแบบที่บีบอัดดีกว่า เช่น WebP หรือ AVIF พร้อมเสิร์ฟหลายขนาดผ่าน srcset ตามความกว้างหน้าจอ","correct":true,"why":"ถูก เพราะรูป hero เป็นองค์ประกอบที่ใช้วัด LCP การลดขนาดไฟล์และส่งขนาดที่พอดีกับหน้าจอลดเวลาดาวน์โหลดรูปบนเครือข่ายมือถือโดยตรง"},{"id":"B","text":"ตั้ง lazy loading ให้รูป hero ด้วย เพื่อให้เบราว์เซอร์เลื่อนการโหลดรูปไปจนกว่าจำเป็นและลดข้อมูลที่โหลดตอนแรก","correct":false,"why":"ผิด เพราะรูป hero อยู่บนจอตั้งแต่แรก การเลื่อนโหลดทำให้รูปที่เป็น LCP element ขึ้นช้าลง lazy loading เหมาะกับรูปที่อยู่นอกจอเท่านั้น"},{"id":"C","text":"แยก bundle ตามเส้นทาง (route-based code splitting) ให้หน้า landing โหลดเฉพาะโค้ดที่ใช้ และโหลดส่วนอื่นเมื่อผู้ใช้ไปหน้านั้น","correct":true,"why":"ถูก เพราะ JavaScript ขนาดใหญ่ใช้เวลาโหลดและประมวลผลบนมือถือ ซึ่งแย่งทรัพยากรกับการแสดงผลหน้าแรก การลดโค้ดที่ไม่จำเป็นช่วยให้หน้าเรนเดอร์เร็วขึ้น"},{"id":"D","text":"ใช้ preload และตั้ง fetch priority สูงให้รูป hero เพื่อให้เบราว์เซอร์เริ่มดาวน์โหลดรูปที่เป็นองค์ประกอบ LCP ตั้งแต่ต้น","correct":true,"why":"ถูก เพราะ preload ช่วยให้เบราว์เซอร์ค้นพบรูปได้เร็วขึ้นเมื่อรูปถูกอ้างจาก CSS หรือสคริปต์ และ fetch priority ขอให้โหลดรูปนี้ก่อน จึงอาจเริ่มดาวน์โหลดรูปได้เร็วขึ้น"}],"explanation":"LCP ขึ้นกับการได้ทรัพยากรที่เป็นองค์ประกอบใหญ่สุดบนหน้าเร็วเพียงใด จึงควรลดขนาดรูปและเสิร์ฟให้พอดี แจ้งเบราว์เซอร์ให้เริ่มโหลดรูปก่อน และลด JavaScript ที่บล็อกการเรนเดอร์ lazy loading ใช้กับรูปนอกจอ ไม่ใช่รูปบนสุดที่เป็นตัววัด"},{"id":"ENG-S-P-037","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S3","concept":"web-css-custom-properties-runtime-theme","mobile":false,"type":"single","stem":"ทีมมีเว็บ e-commerce ที่ใช้ Sass กำหนดสีแบรนด์เป็นตัวแปร ($primary) ตอนนี้ต้องเพิ่มโหมดมืดที่ผู้ใช้สลับได้ทันทีโดยไม่โหลดหน้าใหม่ และให้ร้านพาร์ตเนอร์กำหนดสีหลักของตัวเองผ่านค่าตั้งที่เซิร์ฟเวอร์ส่งมาขณะรัน แนวทางใดเหมาะสมที่สุด","options":[{"id":"A","text":"นิยามสีเป็น CSS custom properties ที่ root สลับค่าด้วย class และ inject ค่าของพาร์ตเนอร์ตอนรัน ส่วนสไตล์อื่นยังเขียนด้วย Sass ต่อได้","correct":true,"why":"ถูก เพราะ CSS custom properties ถูกประเมินที่เบราว์เซอร์ตอนรัน จึงเปลี่ยนค่าแล้วหน้าอัปเดตทันที ขณะที่ Sass ยังช่วยเรื่องโครงสร้างและ mixin ได้"},{"id":"B","text":"คอมไพล์ Sass แยกเป็นไฟล์ CSS ต่อธีมและต่อพาร์ตเนอร์ไว้ล่วงหน้าทุกชุด แล้วโหลดไฟล์ที่ตรงกับตัวเลือกเมื่อผู้ใช้สลับธีมหรือเลือกพาร์ตเนอร์","correct":false,"why":"ผิด เพราะจำนวนไฟล์เพิ่มตามผลคูณของธีมกับพาร์ตเนอร์ ต้อง build ใหม่ทุกครั้งที่พาร์ตเนอร์เปลี่ยนสี และการสลับโหลดไฟล์ใหม่อาจทำให้หน้ากะพริบ"},{"id":"C","text":"ใช้ตัวแปร Sass เดิมต่อไป และให้ JavaScript แก้ค่า $primary ใน CSS ที่คอมไพล์แล้วเมื่อผู้ใช้สลับธีมหรือเมื่อพาร์ตเนอร์เปลี่ยนสีหลัก","correct":false,"why":"ผิด เพราะตัวแปร Sass ถูกแทนด้วยค่าจริงตอนคอมไพล์ ไม่มีตัวแปรเหลืออยู่ให้ JavaScript แก้ที่ฝั่งเบราว์เซอร์"},{"id":"D","text":"ใช้ inline style ผ่าน JavaScript กำหนดสีให้ทุก element ตามธีมปัจจุบัน เพื่อให้สีทั้งหมดถูกควบคุมจากโค้ด JavaScript ที่เดียวและตัดการพึ่งพาไฟล์ CSS กับ preprocessor","correct":false,"why":"ผิด เพราะต้องไล่แก้ทุก element เองและแก้ pseudo-class ไม่ได้ ทำให้โค้ดซับซ้อนและช้าลง อีกทั้งยากต่อการดูแล"}],"explanation":"ตัวแปรของ preprocessor อย่าง Sass หายไปตอนคอมไพล์ ส่วนค่าที่ต้องเปลี่ยนตอนรัน เช่น ธีมมืดหรือสีของพาร์ตเนอร์ ควรเป็น CSS custom properties วิธีนี้ใช้ร่วมกับ Sass ได้ โดย Sass จัดโครงสร้างและ custom properties ถือค่าที่เปลี่ยนตอนรัน"},{"id":"ENG-S-P-038","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S3","concept":"web-xss-csrf-spa-token-storage","mobile":false,"type":"multiple","stem":"SPA ของระบบหลังบ้านเก็บ access token ใน localStorage และเรียก API ที่โดเมนเดียวกัน ทีมความปลอดภัยกังวลทั้ง XSS และ CSRF ควบคู่กัน มาตรการใดลดความเสี่ยงได้อย่างเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เปลี่ยนไปเก็บ token ใน sessionStorage แทน localStorage เพราะสคริปต์ที่แทรกเข้ามาในหน้าอ่านค่าของ sessionStorage ไม่ได้","correct":false,"why":"ผิด เพราะสคริปต์ที่รันในหน้าเดียวกันอ่าน sessionStorage ได้เหมือน localStorage ต่างกันแค่อายุของข้อมูล จึงไม่ช่วยเรื่อง XSS"},{"id":"B","text":"ตั้ง Content-Security-Policy จำกัดแหล่งสคริปต์ และ escape หรือ sanitize ข้อมูลที่ผู้ใช้ป้อนก่อนแสดงผล เพื่อลดโอกาสที่สคริปต์แปลกปลอมจะรัน","correct":true,"why":"ถูก เพราะต้นเหตุของการขโมย token ผ่าน XSS คือสคริปต์ที่ไม่พึงประสงค์รันในหน้า การป้องกันหลายชั้นทั้ง CSP และการจัดการข้อมูลก่อนแสดงช่วยลดโอกาสนั้น"},{"id":"C","text":"ใช้ CORS จำกัดให้เฉพาะโดเมนของเราเรียก API ได้ เพื่อให้เบราว์เซอร์ปฏิเสธคำขอปลอมข้ามเว็บที่เป็นการโจมตี CSRF","correct":false,"why":"ผิด เพราะ CORS ควบคุมการอ่านคำตอบข้ามโดเมนของเบราว์เซอร์ ไม่ได้หยุดฟอร์มจากเว็บอื่นที่ส่งคำขอพร้อม cookie มาเปลี่ยนข้อมูล"},{"id":"D","text":"ย้าย session หรือ refresh token ไปไว้ใน cookie แบบ HttpOnly, Secure และ SameSite พร้อม CSRF token สำหรับคำขอที่เปลี่ยนข้อมูล","correct":true,"why":"ถูก เพราะ HttpOnly กันสคริปต์ในหน้าอ่าน token ได้ ส่วน SameSite และ CSRF token ป้องกันคำขอปลอมที่เบราว์เซอร์แนบ cookie ไปให้เอง"}],"explanation":"XSS กับ CSRF ต้องป้องกันคนละกลไก XSS ลดด้วย CSP การ escape และเลี่ยงการเก็บ token ในที่ที่สคริปต์อ่านได้ ส่วน cookie ที่ส่งอัตโนมัติต้องมี SameSite และ CSRF token ควบคู่ ไม่มีมาตรการเดียวที่ครอบคลุมทั้งสอง ควรออกแบบเป็นหลายชั้น"},{"id":"ENG-S-P-039","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S4","concept":"web-api-cursor-pagination-feed","mobile":true,"type":"multiple","stem":"แอปมือถือแสดง feed โปรโมชันแบบเลื่อนแล้วโหลดเพิ่ม โดย API ใช้ page กับ limit (offset) ระหว่างที่ผู้ใช้เลื่อน มีโปรโมชันใหม่แทรกด้านบนและโปรโมชันที่หมดอายุถูกนำออกทุกไม่กี่นาที ผู้ใช้จึงเห็นรายการซ้ำและบางครั้งรายการหายไป ทีมจะปรับ API อย่างไร (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"คงแบบ offset ไว้แต่เพิ่มค่า limit เป็น 200 รายการต่อหน้า เพื่อให้ผู้ใช้ส่วนใหญ่เลื่อนจนจบโดยขอหน้าถัดไปน้อยครั้ง","correct":false,"why":"ผิด เพราะแค่ลดจำนวนครั้งที่ขอหน้าถัดไป ไม่ได้แก้ที่ offset ซึ่งเลื่อนเมื่อมีรายการแทรกหรือถูกนำออก และทำให้แต่ละคำขอส่งข้อมูลมากขึ้นบนเครือข่ายมือถือ"},{"id":"B","text":"เปลี่ยนเป็น cursor-based pagination โดยให้ cursor อ้างอิงตำแหน่งของรายการสุดท้ายที่ได้รับ เช่น เวลาสร้างรวมกับ id","correct":true,"why":"ถูก เพราะ cursor ชี้ที่รายการจริง ไม่ใช่ลำดับเลขที่ รายการที่แทรกหรือถูกนำออกด้านบนจึงไม่ทำให้หน้าถัดไปเลื่อนตำแหน่ง"},{"id":"C","text":"กำหนดการเรียงลำดับให้แน่นอนด้วย tie-breaker เช่น เรียงตามเวลาสร้างแล้วตามด้วย id เพื่อไม่ให้รายการที่เวลาเท่ากันสลับตำแหน่งระหว่างคำขอ","correct":true,"why":"ถูก เพราะถ้าลำดับไม่แน่นอนเมื่อค่าเรียงเท่ากัน รายการอาจข้ามหรือซ้ำระหว่างหน้า การมี tie-breaker ทำให้ cursor ชี้ตำแหน่งเดียวเสมอ"},{"id":"D","text":"ให้แอปเก็บรายการที่เคยได้รับไว้ ตัดรายการซ้ำเองด้วย id ในเครื่อง และยังใช้ offset เหมือนเดิม","correct":false,"why":"ผิด เพราะการกรองซ้ำซ่อนอาการรายการซ้ำได้ แต่รายการที่ถูกข้ามไปเพราะ offset เลื่อนก็ยังหายอยู่ และแอปไม่รู้ว่าขาดรายการใด"}],"explanation":"offset pagination ไม่เสถียรเมื่อข้อมูลต้นทางเปลี่ยนระหว่างการเลื่อน เพราะตำแหน่งเป็นเลขลำดับ cursor ที่อ้างอิงรายการจริงพร้อมการเรียงที่แน่นอนแก้ปัญหานี้ได้ที่ต้นเหตุ และยังเหมาะกับ feed บนมือถือที่โหลดต่อเนื่อง การแก้ฝั่งแอปอย่างเดียวจึงไม่พอ"},{"id":"ENG-S-P-040","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S4","concept":"web-layered-controller-service-repository","mobile":false,"type":"single","stem":"ทีมพัฒนา REST API ด้วยโครงสร้างแบบ controller-service-repository พบว่ากฎคำนวณส่วนลดของสมาชิก (เช่น ลด 10% เมื่อซื้อครบ 3 ชิ้น และห้ามใช้ร่วมกับโค้ดโปรโมชัน) ถูกเขียนกระจายใน controller สองแห่งและใน SQL ของ repository ทำให้แก้ทีไรพลาดทุกครั้ง ควรรวมกฎนี้ไว้ที่ใด","options":[{"id":"A","text":"ใน repository เพราะเป็นชั้นที่รู้โครงสร้างข้อมูลลูกค้าและสินค้าดีที่สุด และคำนวณใน SQL ได้เร็วกว่าการดึงข้อมูลมาคำนวณในแอป","correct":false,"why":"ผิด เพราะ repository ควรรับผิดชอบการอ่านเขียนข้อมูล ถ้าใส่กฎธุรกิจไว้ใน SQL จะทดสอบยาก และกฎต้องผูกกับโครงสร้างตารางโดยไม่จำเป็น"},{"id":"B","text":"ใน controller กลางที่ทุก endpoint ใช้ร่วมกัน เพราะ controller เป็นจุดที่รู้รายละเอียดของ request และข้อมูลของผู้ใช้ที่เรียกเข้ามาครบถ้วนที่สุด","correct":false,"why":"ผิด เพราะ controller ควรแปลง request เป็นการเรียกใช้งาน ถ้าใส่กฎธุรกิจ ผู้เรียกที่ไม่ผ่าน controller นั้น เช่น job หรือ consumer ของคิว จะไม่ได้ใช้กฎเดียวกัน"},{"id":"C","text":"ใน stored procedure ของฐานข้อมูล เพื่อให้ทุก service ที่เชื่อมฐานข้อมูลเดียวกันเรียกใช้กฎเดียวกันได้ทันทีจากจุดเดียว","correct":false,"why":"ผิด เพราะกฎธุรกิจที่ฝังในฐานข้อมูลทดสอบและ review ยากกว่าโค้ดแอป และขัดกับโครงสร้างแบบแบ่งชั้นที่ทีมตั้งใจใช้"},{"id":"D","text":"ใน service layer ที่ทดสอบด้วย unit test ได้โดยไม่ต้องมีฐานข้อมูล ให้ controller ตรวจ input แล้วเรียกใช้ และ repository ดึงข้อมูลอย่างเดียว","correct":true,"why":"ถูก เพราะ service เป็นที่รวมกฎธุรกิจ ทุกผู้เรียกใช้กฎเดียวกัน และทดสอบด้วย repository จำลองได้ ทำให้แก้กฎที่จุดเดียว"}],"explanation":"ในสถาปัตยกรรมแบบแบ่งชั้น controller จัดการ HTTP และตรวจ input, service เก็บกฎธุรกิจ, repository เข้าถึงข้อมูล การรวมกฎส่วนลดไว้ใน service ทำให้จุดแก้มีที่เดียวและเขียน unit test ได้เร็วโดยไม่ต้องพึ่งฐานข้อมูลหรือ HTTP"},{"id":"ENG-S-P-041","level":"senior","pool":"practice","competency":"Web & Mobile Development","descriptor":"WEB-S5","concept":"web-api-versioning-mobile-old-clients","mobile":true,"type":"single","stem":"แอปมือถือที่ติดตั้งอยู่ในเครื่องผู้ใช้มีหลายเวอร์ชันพร้อมกัน โดยรุ่นที่เก่ากว่า 6 เดือนยังมีผู้ใช้ประมาณ 12% ทีม backend ต้องเปลี่ยน response ของ endpoint ราคาสินค้าจาก field เดียวเป็นโครงสร้างซ้อนที่รองรับหลายสกุลเงิน ซึ่งจะทำให้แอปรุ่นเก่า parse ไม่ได้ ควรจัดการอย่างไร","options":[{"id":"A","text":"ปล่อยการเปลี่ยนแปลงบน endpoint เดิมทันที แล้วประกาศให้ผู้ใช้อัปเดตแอปผ่านโซเชียลมีเดียและรอให้ผู้ใช้รุ่นเก่าทยอยอัปเดตเองตามเวลาที่สะดวก","correct":false,"why":"ผิด เพราะแอปรุ่นเก่าจะแสดงราคาไม่ได้หรือล้มทันที ผู้ใช้ราว 12% ใช้งานไม่ได้ และผู้ใช้จำนวนมากไม่ตามข่าวจากโซเชียลมีเดีย"},{"id":"B","text":"ให้ backend ตรวจ User-Agent แล้วแตกเงื่อนไขตามเวอร์ชันแอปทุกจุดที่เปลี่ยน และเก็บเงื่อนไขนี้ไว้ถาวรในทุก endpoint ของระบบโดยไม่กำหนดวันเลิกใช้ของแต่ละรุ่น","correct":false,"why":"ผิด เพราะเงื่อนไขตามเวอร์ชันกระจายอยู่ทั่วโค้ดและสะสมไม่รู้จบ ทดสอบยาก และไม่มีแผนเลิกใช้ที่ชัดเจนสำหรับแอปรุ่นเก่า"},{"id":"C","text":"เพิ่ม endpoint เวอร์ชันใหม่หรือเพิ่ม field ใหม่โดยคงของเดิมไว้ วัดสัดส่วนผู้ใช้แต่ละเวอร์ชัน แล้วประกาศเลิกใช้และบังคับอัปเดตเฉพาะรุ่นต่ำกว่าเกณฑ์","correct":true,"why":"ถูก เพราะการเปลี่ยนแบบเข้ากันได้ย้อนหลัง พร้อมข้อมูลสัดส่วนผู้ใช้ ช่วยให้เลิกเวอร์ชันเก่าเมื่อผู้ใช้เหลือน้อยและบังคับอัปเดตเฉพาะที่จำเป็น"},{"id":"D","text":"บังคับอัปเดตทันทีให้ทุกรุ่นที่ต่ำกว่าเวอร์ชันล่าสุดผ่านหน้าจอที่ปิดกั้นการใช้งานทั้งแอป เพื่อให้ backend ดูแลเพียงเวอร์ชันเดียวเท่านั้น","correct":false,"why":"ผิด เพราะผู้ใช้ที่ยังอัปเดตไม่ได้ เช่น เครื่องเก่าที่ระบบปฏิบัติการไม่รองรับหรือพื้นที่เต็ม จะใช้แอปไม่ได้เลย และอาจสูญเสียลูกค้าโดยไม่จำเป็น"}],"explanation":"แอปบนมือถือควบคุมเวลาอัปเดตของผู้ใช้ไม่ได้ backend จึงต้องเปลี่ยนแบบเข้ากันได้ย้อนหลังหรือเพิ่มเวอร์ชันใหม่คู่กับของเดิม วัดการใช้งานของแต่ละเวอร์ชัน แล้วกำหนดวันเลิกใช้และเกณฑ์เวอร์ชันขั้นต่ำที่บังคับอัปเดตเฉพาะเมื่อจำเป็น"},{"id":"ENG-S-P-042","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S1","concept":"test-quality-gate-new-code-coverage","mobile":false,"type":"single","stem":"ระบบเก่าอายุ 8 ปีมี unit test coverage รวมใน SonarQube ราว 35% ผู้บริหารสั่งให้ตั้ง quality gate ที่ coverage ไม่ต่ำกว่า 80% ทีมประเมินว่าการเขียน test ย้อนหลังให้ทั้งระบบถึง 80% ต้องใช้เวลาหลายไตรมาส ขณะที่ยังต้องส่งฟีเจอร์ทุกสปรินต์ ควรตั้งเกณฑ์อย่างไร","options":[{"id":"A","text":"ตั้ง gate 80% บนโค้ดทั้งระบบทันที แล้วให้ผู้จัดการอนุมัติข้าม gate ได้เมื่อมี release เร่งด่วนหรือเมื่อ gate ยังไม่ผ่าน","correct":false,"why":"ผิด เพราะเกณฑ์ที่ระบบเดิมผ่านไม่ได้ตั้งแต่วันแรกทำให้ gate แดงตลอด และการข้ามด้วยอนุมัติจะกลายเป็นเรื่องปกติจนเกณฑ์ไม่มีผลจริง"},{"id":"B","text":"ยกเว้นโมดูลเก่าทั้งหมดออกจากการวัด แล้ววัด coverage เฉพาะโมดูลใหม่ที่สร้างหลังจากวันนี้เท่านั้น เพื่อให้ตัวเลขสะท้อนงานใหม่","correct":false,"why":"ผิด เพราะโค้ดเก่าที่ถูกแก้ไขต่อไปก็ยังอยู่ในโมดูลที่ถูกยกเว้น จึงแก้ได้โดยไม่มี test และเสี่ยงสูงที่สุดเมื่อมีการเปลี่ยนแปลง"},{"id":"C","text":"ตั้งเกณฑ์รวมที่ 35% ตามปัจจุบันเป็นระดับขั้นต่ำ และคาดว่าตัวเลขจะค่อยๆ ขึ้นเองเมื่อทีมเขียนโค้ดใหม่ในแต่ละสปรินต์ต่อไป","correct":false,"why":"ผิด เพราะเกณฑ์ที่เท่ากับปัจจุบันไม่บังคับให้โค้ดใหม่มี test เมื่อโค้ดใหม่ไม่มี test ตัวเลขรวมก็ไม่ขึ้นและอาจลดลงโดย gate ไม่เตือน"},{"id":"D","text":"ตั้ง gate ที่ coverage ของ new code (โค้ดที่เพิ่มหรือแก้ใน PR) ไม่ต่ำกว่า 80% และดูแนวโน้มของ coverage รวม","correct":true,"why":"ถูก เพราะบังคับให้ทุกการเปลี่ยนแปลงมี test คุ้มครอง โดยไม่ต้องหยุดส่งฟีเจอร์เพื่อเขียนย้อนหลัง และ coverage รวมจะค่อยๆ สูงขึ้นตามส่วนที่ถูกแตะ"}],"explanation":"ระบบเก่าที่ coverage ต่ำควรตั้งเกณฑ์กับโค้ดที่เปลี่ยนไป (new code) เพื่อไม่ให้หนี้ test สะสมเพิ่ม โดยไม่ต้องรอปิดหนี้เก่าทั้งหมด ส่วนส่วนเก่าค่อยปิดตามความเสี่ยงและความถี่ที่ถูกแก้ไข และดูแนวโน้ม coverage รวมเพื่อให้เห็นความคืบหน้า"},{"id":"ENG-S-P-043","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S1","concept":"test-coverage-limits","mobile":false,"type":"multiple","stem":"ทีมรายงานว่า coverage ของโมดูลคำนวณค่าส่งอยู่ที่ 92% แต่หลังปล่อยกลับพบบั๊กในกรณีพัสดุไปพื้นที่ห่างไกล ข้อความใดต่อไปนี้เกี่ยวกับตัวชี้วัด coverage ถูกต้อง (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"coverage 92% ยืนยันว่า 92% ของพฤติกรรมที่ธุรกิจต้องการถูกตรวจด้วย assertion แล้ว","correct":false,"why":"ผิด เพราะ coverage วัดว่าบรรทัดถูกรัน ไม่ได้วัดว่าพฤติกรรมที่ต้องการถูกตรวจ และบรรทัดที่ถูกรันโดยไม่มี assertion ก็นับเป็นส่วนที่ครอบคลุม"},{"id":"B","text":"line coverage นับว่าบรรทัดถูกรันระหว่างทดสอบ ไม่ได้บอกว่ามี assertion ตรวจผลลัพธ์ จึงอาจสูงได้แม้ test ตรวจน้อยมาก","correct":true,"why":"ถูก เพราะตัวชี้วัดนี้ดูแค่การรันโค้ด test ที่เรียกฟังก์ชันโดยไม่ตรวจผลก็ทำให้ตัวเลขขึ้นได้ ตัวเลขสูงจึงไม่การันตีคุณภาพของ test"},{"id":"C","text":"ถ้าเพิ่ม coverage เป็น 100% จะไม่มีบั๊กเหลือในโมดูลนั้น เพราะทุกบรรทัดถูกทดสอบแล้ว","correct":false,"why":"ผิด เพราะบั๊กมาจากกรณีที่ไม่ได้คิด ข้อมูลนำเข้าที่ไม่คาดคิด หรือเงื่อนไขที่ขาดหายไป ซึ่งไม่ปรากฏเป็นบรรทัดโค้ดให้ coverage วัด"},{"id":"D","text":"การเขียน test ที่เรียกฟังก์ชันแต่ไม่มี assertion เป็นวิธีที่ยอมรับได้ในการเพิ่ม coverage ของโค้ดซับซ้อน เพราะ SonarQube นับบรรทัดนั้นว่าถูกครอบคลุมแล้ว","correct":false,"why":"ผิด เพราะตัวเลขจะเพิ่มจริง แต่ test แบบนี้ไม่ตรวจพฤติกรรมใดเลย และทำให้ทีมเข้าใจผิดว่าโค้ดส่วนนั้นปลอดภัยทั้งที่ไม่ได้ถูกตรวจสอบ"},{"id":"E","text":"branch coverage ช่วยเห็นเงื่อนไขที่ test รันผ่านด้านเดียว เช่น กรณีพื้นที่ห่างไกลที่ไม่เคยเข้า if ที่เกี่ยวข้อง ซึ่ง line coverage อาจมองไม่เห็น","correct":true,"why":"ถูก เพราะบรรทัด if ถูกนับว่ารันแล้วเมื่อเข้าเงื่อนไขด้านเดียว แต่ branch coverage นับทั้งสองด้าน จึงชี้ทางที่ยังไม่ถูกทดสอบได้ชัดกว่า"}],"explanation":"coverage บอกได้ว่าส่วนไหนของโค้ดยังไม่เคยถูกรันโดย test แต่บอกคุณภาพของ test ไม่ได้ จึงควรอ่านตัวเลขเป็นเครื่องมือหาช่องว่าง ไม่ใช่หลักฐานว่าถูกต้อง ควรดู branch coverage ร่วมกับ assertion ที่ตรวจผลลัพธ์จริงและกรณีขอบเขตของธุรกิจ"},{"id":"ENG-S-P-044","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S2","concept":"test-gap-prioritize-risk","mobile":false,"type":"single","stem":"รายงาน coverage ของ service ชำระเงินแสดงส่วนที่ยังไม่มี test หลายจุด ได้แก่ ฟังก์ชันคำนวณยอดคืนเงินบางส่วนพร้อมค่าธรรมเนียม (branch ถูกรันแค่ 40%), getter และ setter ของ DTO จำนวนมาก และ helper สำหรับเขียน log ทีมมีเวลาในสปรินต์นี้ไม่พอปิดทุกจุด ควรเลือกปิดช่องว่างอย่างไร","options":[{"id":"A","text":"เริ่มจากฟังก์ชันคำนวณยอดคืนเงินที่ branch ถูกรันน้อย เพราะกระทบเงินและมีเงื่อนไขซับซ้อน แล้วค่อยพิจารณาส่วนเสี่ยงต่ำทีหลัง","correct":true,"why":"ถูก เพราะการจัดลำดับตามความเสี่ยงและความซับซ้อนทำให้เวลาจำกัดถูกใช้กับส่วนที่ถ้าผิดแล้วเสียหายมากที่สุด"},{"id":"B","text":"เรียงตามจำนวนบรรทัดที่ยังไม่ถูกครอบคลุมจากมากไปน้อย เพราะปิดแล้วทำให้ coverage รวมขึ้นเร็วที่สุด","correct":false,"why":"ผิด เพราะจำนวนบรรทัดไม่สัมพันธ์กับความเสี่ยง DTO ที่มีบรรทัดมากแต่ไม่มีตรรกะจะถูกทำก่อน ส่วนฟังก์ชันที่กระทบเงินยังไม่มี test คุ้มครอง"},{"id":"C","text":"เขียน test ให้ DTO และ helper ก่อนเพราะง่ายและทำให้ผ่านเกณฑ์ของ quality gate ได้เร็ว จากนั้นค่อยจัดการฟังก์ชันที่ซับซ้อนเมื่อมีเวลา","correct":false,"why":"ผิด เพราะเป็นการเลือกงานเพื่อให้ตัวเลขผ่าน ไม่ใช่เพื่อลดความเสี่ยง และฟังก์ชันที่กระทบเงินอาจไม่มีเวลาเหลือให้ทำเลย"},{"id":"D","text":"เลื่อนทุกจุดไปสปรินต์หน้า และใช้ manual regression test ครอบคลุมระบบแทน เพราะ test ที่เขียนเร่งจะมีคุณภาพต่ำ","correct":false,"why":"ผิด เพราะ manual regression ทำซ้ำได้ยากและช้า ส่วนฟังก์ชันคืนเงินยังคงไม่มี test คุ้มครองระหว่างที่ทีมแก้โค้ดส่วนอื่นต่อไป"}],"explanation":"การปิดช่องว่างของ test ควรจัดลำดับตามความเสี่ยงทางธุรกิจและความซับซ้อนของตรรกะ ไม่ใช่ตามจำนวนบรรทัดหรือความง่าย โค้ดที่เกี่ยวกับเงิน สิทธิ์ และข้อมูลลูกค้ามาก่อน ส่วน DTO และ log helper ที่ไม่มีตรรกะอาจยกเว้นจากการวัดได้"},{"id":"ENG-S-P-045","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S2","concept":"test-boundary-table-driven","mobile":false,"type":"multiple","stem":"ฟังก์ชันคำนวณค่าส่งตามน้ำหนักพัสดุมีเงื่อนไข: ไม่เกิน 1 กก. คิด 40 บาท, เกิน 1 ถึง 5 กก. คิด 70 บาท, เกิน 5 กก. คิด 70 บาทบวก 20 บาททุก 1 กก. ที่เกิน (เศษปัดขึ้น) ทีมต้องการเพิ่ม test เพื่อปิดช่องว่างของตรรกะนี้ แนวทางใดมีประสิทธิภาพ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ทดสอบค่าขอบเขต เช่น 1.0 กก. กับ 1.01 กก. และ 5.0 กก. กับ 5.01 กก. เพราะบั๊กเรื่องใช้ \u003c แทน \u003c= มักอยู่ที่ขอบ","correct":true,"why":"ถูก เพราะค่าที่ขอบเป็นจุดที่เงื่อนไขเปลี่ยนค่าส่ง เป็นตำแหน่งที่ความผิดพลาดของเครื่องหมายเปรียบเทียบแสดงผลชัดที่สุด"},{"id":"B","text":"เขียน test เรียกเมธอด private ที่แยกแต่ละช่วงน้ำหนักโดยตรง และตรวจว่าเมธอดเหล่านั้นถูกเรียกตามลำดับเพื่อให้ทุก branch ถูกรัน","correct":false,"why":"ผิด เพราะ test ที่ผูกกับโครงสร้างภายในจะล้มทุกครั้งที่ refactor แม้พฤติกรรมไม่เปลี่ยน และไม่ได้ตรวจว่าค่าส่งที่ได้ถูกต้อง"},{"id":"C","text":"เขียนเป็น parameterized (table-driven) test ที่มีตารางน้ำหนักที่ป้อนกับค่าส่งที่คาดไว้ เพื่อเพิ่มกรณีได้ง่ายและอ่านผลรายกรณี","correct":true,"why":"ถูก เพราะตารางรวมกรณีไว้ที่เดียว เพิ่มแถวได้ง่าย และเมื่อล้มจะเห็นว่ากรณีใดผิด จึงเหมาะกับฟังก์ชันที่ผลขึ้นกับค่าอินพุตเป็นช่วงๆ"},{"id":"D","text":"รวมกรณีค่าผิดปกติ เช่น น้ำหนัก 0 น้ำหนักติดลบ และ NaN เพื่อยืนยันว่าฟังก์ชันปฏิเสธอินพุตตามสัญญาที่กำหนดไว้","correct":true,"why":"ถูก เพราะค่าผิดปกติมักเป็นช่องว่างที่ไม่มีใครคิดถึง การระบุผลที่คาดไว้ เช่น โยน error ทำให้พฤติกรรมของฟังก์ชันชัดและตรวจสอบได้"}],"explanation":"การปิดช่องว่างของตรรกะที่มีหลายเงื่อนไขควรเน้นค่าขอบเขต กรณีผิดปกติ และใช้ตารางกรณีทดสอบเพื่อให้เพิ่มและอ่านผลง่าย พร้อมตรวจที่พฤติกรรมภายนอกของฟังก์ชัน ไม่ผูกกับโครงสร้างภายในเพื่อให้ refactor ได้โดย test ไม่ล้มโดยไม่จำเป็น"},{"id":"ENG-S-P-046","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S3","concept":"test-mobile-payment-sdk-stub","mobile":true,"type":"single","stem":"แอปมือถือร้านค้ามีขั้นตอนชำระเงินที่เรียก SDK ของผู้ให้บริการ payment เพื่อเปิดแอปธนาคารแล้วรอผลกลับมา ทีมต้องการ unit test ตรรกะหลังได้ผลลัพธ์ (สำเร็จ ผู้ใช้ยกเลิก หมดเวลา) แต่ SDK ต้องใช้เครื่องจริงและบัญชีทดสอบ ทำให้ test รันใน CI ไม่ได้ ควรทำอย่างไร","options":[{"id":"A","text":"รัน test บน emulator ใน CI ด้วยบัญชีทดสอบจริงของผู้ให้บริการ และตั้งให้รันซ้ำอัตโนมัติสูงสุด 3 ครั้งเมื่อ test ล้มเหลว","correct":false,"why":"ผิด เพราะ SDK ต้องใช้เครื่องจริงและแอปธนาคาร emulator จึงไม่เพียงพอ และการรันซ้ำปิดบัง test ที่ไม่เสถียรแทนที่จะแก้"},{"id":"B","text":"mock คลาสตรรกะชำระเงินของเราเองให้คืนผลตามต้องการในแต่ละกรณี แล้ว assert ว่าได้ผลตามที่ mock คืนมา","correct":false,"why":"ผิด เพราะเป็นการทดสอบ mock ที่ตัวเองสร้าง ตรรกะจริงไม่เคยถูกรัน test จะผ่านแม้ตรรกะผิด"},{"id":"C","text":"ห่อ SDK ไว้หลัง interface ของเราเอง ใช้ stub จำลองผลสำเร็จ ยกเลิก หมดเวลา และทดสอบ SDK จริงแค่ชุดเล็กบนเครื่องจริง","correct":true,"why":"ถูก เพราะ interface ที่เราเป็นเจ้าของทำให้จำลองทุกผลลัพธ์ได้ใน CI อย่างคงที่ ส่วนการเชื่อมกับ SDK จริงตรวจในชุดบูรณาการที่เล็กและแยกไว้"},{"id":"D","text":"ข้ามการ unit test ตรรกะหลังชำระเงิน แล้วให้ QA ทดสอบด้วยมือบนเครื่องจริงก่อนปล่อยทุกครั้งเพราะ flow นี้เกี่ยวกับเงินจริงของลูกค้า","correct":false,"why":"ผิด เพราะกรณีหมดเวลาและยกเลิกจำลองด้วยมือได้ยาก และการทดสอบด้วยมืออย่างเดียวไม่ตรวจซ้ำอัตโนมัติเมื่อมีการแก้โค้ดในอนาคต"}],"explanation":"ขอบเขตระหว่างโค้ดของเรากับ SDK ภายนอกคือจุดที่ควรแยกด้วย interface เพื่อให้จำลองผลลัพธ์ได้ทุกแบบ ทั้งสำเร็จ ล้มเหลว และหมดเวลา อย่างคงที่และเร็วใน CI ขณะที่การทำงานร่วมกับ SDK จริงทดสอบแยกเป็นชุดเล็กที่รันบนเครื่องจริงเป็นระยะ"},{"id":"ENG-S-P-047","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S3","concept":"test-mobile-ui-deterministic-env","mobile":true,"type":"multiple","stem":"ชุด UI test อัตโนมัติของแอปมือถือที่รันใน CI ล้มเหลวแบบไม่คงที่ประมาณ 15% ของการรัน ทีมพบว่า test เรียก API จริงของสภาพแวดล้อม staging ที่บางครั้งช้า ข้อมูลทดสอบถูกคนอื่นแก้ และมีหน้าต่างขออนุญาตของระบบเด้งขึ้นมาในบางรอบ มาตรการใดช่วยให้ test คงที่ขึ้น (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"เพิ่มการหน่วงเวลาคงที่ 10 วินาทีหลังทุกการกระทำ เพื่อรอให้ API และหน้าจอตอบสนองครบก่อนไปขั้นถัดไป","correct":false,"why":"ผิด เพราะเวลาตายตัวทำให้ test ช้าลงมากแต่ยังล้มได้เมื่อ API ช้ากว่าที่คาด และไม่แก้ปัญหาข้อมูลที่ถูกแก้หรือหน้าต่างอนุญาตที่เด้งขึ้น"},{"id":"B","text":"ให้แอปเรียก mock server หรือ stub ของ API ที่คืนข้อมูลคงที่ใน test ส่วนการเชื่อมกับ staging จริงทดสอบแยกเป็นชุดเล็ก","correct":true,"why":"ถูก เพราะการตัดการพึ่ง staging ออกทำให้ความช้าและข้อมูลที่เปลี่ยนไม่กระทบ test และยังคงมีชุดเล็กที่ยืนยันการเชื่อมต่อของจริง"},{"id":"C","text":"ให้ test หลายตัวใช้บัญชีทดสอบเดียวกันและรันพร้อมกัน เพื่อให้เสร็จเร็วและใช้ข้อมูลชุดเดียวที่ทีมคุ้นเคยและตรวจสอบง่าย","correct":false,"why":"ผิด เพราะ test ที่ใช้ข้อมูลชุดเดียวกันพร้อมกันแก้ข้อมูลทับกันได้ จึงทำให้ผลไม่คงที่มากขึ้น"},{"id":"D","text":"ตั้งสถานะ permission ของแอปล่วงหน้าก่อนเริ่ม test และล้างข้อมูลแอปทุกครั้ง เพื่อให้ทุก test เริ่มจากสภาพเดียวกัน","correct":true,"why":"ถูก เพราะสถานะเริ่มต้นที่รู้แน่นอนกำจัดตัวแปรอย่างหน้าต่างขออนุญาตที่เด้งในบางรอบ และข้อมูลค้างจาก test ก่อนหน้า"},{"id":"E","text":"รอด้วยเงื่อนไข เช่น รอจนองค์ประกอบปรากฏหรือแอปว่างงาน (idle) แทนการหน่วงเวลาตายตัว และปิดแอนิเมชันในโหมดทดสอบ","correct":true,"why":"ถูก เพราะการรอตามสถานะจริงเร็วเมื่อระบบพร้อมและทนเมื่อระบบช้า ส่วนการปิดแอนิเมชันกำจัดช่วงเวลาที่หน้าจอยังเปลี่ยนอยู่"}],"explanation":"ความไม่คงที่ของ UI test มักมาจากสิ่งที่ test ควบคุมไม่ได้ เช่น เครือข่าย ข้อมูลร่วม และสถานะของระบบ จึงควรจำลอง dependency ภายนอก เริ่มจากสถานะที่รู้แน่นอน และรอตามเงื่อนไขแทนเวลา การหน่วงเวลาตายตัวและการรันซ้ำเพียงซ่อนอาการ"},{"id":"ENG-S-P-048","level":"senior","pool":"practice","competency":"Unit & Functional Testing","descriptor":"TST-S2","concept":"test-mobile-permission-denied-path","mobile":true,"type":"single","stem":"รายงาน coverage ของแอปมือถือแสดงว่าโค้ดจัดการกรณีผู้ใช้ปฏิเสธสิทธิ์ตำแหน่ง ไม่มีสัญญาณเครือข่าย และพื้นที่เก็บข้อมูลเต็ม แทบไม่มี test เลย เพราะโค้ดเหล่านี้เรียก API ของระบบปฏิบัติการตรงในหน้าจอ และสร้างสถานการณ์เหล่านี้บนเครื่องทดสอบได้ยาก ควรปิดช่องว่างนี้อย่างไร","options":[{"id":"A","text":"เขียน UI test บน emulator ให้ทุกสถานการณ์ โดยสั่งปิดเครือข่ายและเติมพื้นที่เก็บข้อมูลจนเต็มจริงในแต่ละ test ที่รัน","correct":false,"why":"ผิด เพราะต้องจัดสภาพแวดล้อมของเครื่องทั้งเครื่องในแต่ละ test ซึ่งช้า เปราะบาง และกระทบ test อื่นที่ใช้เครื่องเดียวกัน"},{"id":"B","text":"แยกการตัดสินใจออกจากหน้าจอ ให้ตรรกะรับสถานะสิทธิ์ เครือข่าย และพื้นที่ผ่าน interface แล้ว unit test ด้วย fake","correct":true,"why":"ถูก เพราะการแยกตรรกะออกจากการเรียก API ของระบบทำให้ป้อนสถานะใดก็ได้ในเสี้ยววินาที จึงครอบคลุมทุกกรณีได้ใน CI"},{"id":"C","text":"ยกเว้นไฟล์หน้าจอทั้งหมดออกจาก coverage ใน SonarQube เพราะตรรกะที่เรียก API ของระบบทดสอบยากมาก","correct":false,"why":"ผิด เพราะตัวเลขจะดีขึ้นแต่ความเสี่ยงยังอยู่เท่าเดิม ตรรกะจัดการสิทธิ์และเครือข่ายยังไม่ถูกตรวจ และถูกซ่อนจากรายงาน"},{"id":"D","text":"ให้ QA ทดสอบด้วยมือทุกรอบก่อนปล่อย และเก็บผลไว้ในเอกสาร test case แทนการเขียน test อัตโนมัติเพิ่มเติม","correct":false,"why":"ผิด เพราะการทดสอบด้วยมือทุกรอบช้า ตกหล่นง่าย และไม่ป้องกันการถดถอยเมื่อมีการแก้โค้ดระหว่างสปรินต์"}],"explanation":"โค้ดที่ผูกกับ API ของระบบปฏิบัติการทดสอบยากเพราะสร้างสถานการณ์ไม่ได้ การแยกตรรกะตัดสินใจออกมารับสถานะผ่าน interface ทำให้ unit test ครอบคลุมทุกกรณี เช่น ปฏิเสธสิทธิ์ ออฟไลน์ พื้นที่เต็ม ได้เร็วและเสถียร ส่วนหน้าจอเหลือการทดสอบเชิงภาพในปริมาณน้อย"}],"exam":[{"id":"ENG-S-E-001","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S1","concept":"git-trunk-based-vs-git-flow-selection","mobile":false,"type":"single","stem":"ทีม 8 คนพัฒนาเว็บแอปที่ deploy ขึ้น production วันละหลายครั้ง มี CI ที่รันทดสอบอัตโนมัติครบถ้วนภายใน 10 นาที และมีระบบ feature flag สำหรับเปิดฟีเจอร์ทีละกลุ่มผู้ใช้ ปัจจุบันใช้ Git Flow ที่มี develop และ release branch ทำให้เกิด merge conflict ขนาดใหญ่ และ release ล่าช้าเพราะต้องรอ merge ข้ามหลาย branch ควรเลือกกลยุทธ์ branching แบบใดภายใต้เงื่อนไขนี้","options":[{"id":"A","text":"คง Git Flow ไว้ แต่เพิ่มความถี่ของ release branch เป็นทุกวัน เพื่อให้แต่ละ release มีขนาดเล็กลง และลดจำนวนฟีเจอร์ที่ค้างอยู่ใน develop ในแต่ละรอบ","correct":false,"why":"ยังต้องรักษา develop, release และ main พร้อมกัน และ merge ข้ามหลาย branch ต่อวัน ซึ่งเพิ่มภาระและโอกาสเกิด conflict ทั้งที่เครื่องมือของทีมรองรับวิธีที่เบากว่า"},{"id":"B","text":"ปรับเป็น trunk-based development: ทุกคนรวมงานเข้า main ด้วย branch อายุสั้นผ่าน PR และ CI ภายใน 1-2 วัน และซ่อนงานที่ยังไม่เสร็จหลัง feature flag","correct":true,"why":"ถูก เพราะ branch อายุสั้นทำให้ conflict เล็กและเกิดน้อย และ CI กับ feature flag ที่ทีมมีอยู่แล้วรองรับการ deploy บ่อยโดยไม่ต้องแยก release branch"},{"id":"C","text":"ให้แต่ละทีมย่อยทำงานบน long-lived branch ของตัวเอง แล้วรวมเข้า main สัปดาห์ละครั้ง เพื่อลดจำนวนครั้งที่ต้อง merge และให้แต่ละทีมทดสอบภายในก่อนรวม","correct":false,"why":"ลดจำนวนครั้งที่ merge แต่ทำให้การ merge แต่ละครั้งใหญ่ขึ้นมาก conflict และความเสี่ยงสะสมจนถึงวันรวม ซึ่งเป็นปัญหาเดียวกับที่ทีมเจออยู่"},{"id":"D","text":"ให้นักพัฒนาแต่ละคนทำงานบน fork ส่วนตัวแล้วให้ release manager รวมเข้า main ทุกเย็น เพื่อควบคุมคุณภาพให้เข้มขึ้นก่อนทุกการ deploy","correct":false,"why":"สร้างคอขวดที่ release manager คนเดียว และการรวมงานแบบรวบยอดสิ้นวันทำให้ conflict ถูกค้นพบช้า ขัดกับเป้าหมายที่ deploy ได้วันละหลายครั้ง"}],"explanation":"เลือกกลยุทธ์ branching ให้เข้ากับจังหวะ release และความสามารถของ pipeline ทีมที่มี CI ที่เร็ว และ feature flag เหมาะกับ trunk-based development ส่วน Git Flow เหมาะกับผลิตภัณฑ์ที่ปล่อยเป็นรอบและต้องดูแลหลายเวอร์ชันพร้อมกัน"},{"id":"ENG-S-E-002","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S2","concept":"git-long-lived-branch-repeated-conflicts","mobile":false,"type":"multiple","stem":"branch feature/loyalty อายุ 3 สัปดาห์ มี 35 commit ที่แก้ไฟล์ pricing.ts และ cart.ts ซ้ำหลายรอบ ขณะที่ main ก็แก้ไฟล์เดียวกันอย่างหนัก เมื่อนักพัฒนารัน git rebase main พบว่าต้องแก้ conflict ในไฟล์เดิมซ้ำเกือบทุก commit ทางเลือกใดช่วยลดภาระนี้ได้ (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"ยกเลิก rebase ด้วย --abort แล้ว merge main เข้า branch แทน เพราะ merge รวมความต่างไว้ในครั้งเดียว จึงแก้ conflict เพียงรอบเดียว","correct":true,"why":"ถูก เพราะ rebase เล่น commit ซ้ำทีละอันบนฐานใหม่ จึงเจอ conflict ซ้ำได้หลายรอบ ส่วน merge เทียบปลายทั้งสองฝั่งครั้งเดียว"},{"id":"B","text":"squash commit ของ branch ให้เหลือไม่กี่อันก่อน แล้วจึง rebase เพื่อให้เล่นซ้ำน้อยรอบและเจอ conflict น้อยลง โดยยอมเสียรายละเอียดของประวัติแต่ละ commit","correct":true,"why":"ถูก เพราะ commit ที่แก้ไฟล์เดียวกันซ้ำถูกรวมเป็นชุดเดียว จำนวนรอบที่ต้องแก้ conflict ลดลง แลกกับประวัติที่ละเอียดน้อยลง"},{"id":"C","text":"ตั้งค่าให้ git ตัดสิน conflict อัตโนมัติโดยเลือกฝั่ง main ทุกครั้งตอน rebase เพราะ main เป็นแหล่งความจริงของทีม และไม่หยุดถามผู้ใช้ทีละ commit","correct":false,"why":"การเลือกฝั่ง main ทุกครั้งทำให้การเปลี่ยนแปลงของ feature/loyalty ในบรรทัดที่ชนกันถูกทิ้งแบบเงียบ ๆ โดยไม่มีใครตัดสินใจ ฟีเจอร์อาจเสียหายโดยไม่รู้ตัว"},{"id":"D","text":"เปิดใช้ git rerere ก่อน rebase เพื่อให้ git จดจำวิธีแก้ conflict ที่เคยแก้ไว้ และนำไปใช้ซ้ำเมื่อพบ conflict ก้อนเดิมอีกใน commit ถัดไป","correct":true,"why":"ถูก เพราะ rerere บันทึกผลการแก้ conflict และใช้ซ้ำอัตโนมัติเมื่อเจอ conflict ก้อนเดิม จึงช่วยลดงานซ้ำ แต่ยังควรตรวจผลเพราะใช้ได้เฉพาะก้อนที่ตรงกัน"}],"explanation":"Rebase เล่น commit ซ้ำทีละอัน จึงเจอ conflict ซ้ำได้เมื่อ branch ยาวและแก้ไฟล์เดียวกันหลายรอบ ทางเลือกคือ merge ครั้งเดียว squash ก่อน หรือใช้ rerere ช่วยจำวิธีแก้ ส่วนการบังคับเลือกฝั่งหนึ่งทุกครั้งเสี่ยงทิ้งงานโดยไม่รู้ตัว"},{"id":"ENG-S-E-003","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S3","concept":"git-release-tag-immutability","mobile":false,"type":"single","stem":"pipeline สร้าง Docker image จาก tag v3.1.0 แล้ว deploy ขึ้น staging และ production ภายหลังนักพัฒนาพบว่าลืม commit การแก้เล็ก ๆ จึงลบ tag v3.1.0 แล้วสร้างใหม่ที่ commit ล่าสุด และ push -f ทับ ผลคือ production ยังรัน image ที่สร้างจาก commit เก่า แต่ทุกคนที่ fetch tag ใหม่เห็นว่า v3.1.0 คือโค้ดชุดใหม่ ทีมต้องการป้องกันความสับสนแบบนี้ มาตรการใดแก้ที่ต้นเหตุได้ดีที่สุด","options":[{"id":"A","text":"ให้ pipeline build image ใหม่ทุกครั้งที่มีการ push tag รวมถึงการ push ทับ แล้ว deploy ทับ production อัตโนมัติ เพื่อให้ image ตรงกับ tag ล่าสุดเสมอ","correct":false,"why":"ยอมให้ tag ถูกย้ายได้และทำให้ production เปลี่ยนโดยไม่ผ่านขั้นตอน release ที่ตั้งใจ ต้นเหตุคือ tag ที่ปล่อยแล้วเปลี่ยนได้ ไม่ใช่ความไม่ตรงของ image"},{"id":"B","text":"ให้นักพัฒนาแจ้งในแชททีมก่อนย้าย tag ทุกครั้ง และให้ทุกคนรัน git fetch --tags --force เพื่อให้ tag ในเครื่องตรงกับ remote","correct":false,"why":"เป็นเพียงการตกลงกันด้วยคน ไม่มีกลไกบังคับ และยังไม่แก้ปัญหาว่า image ใน production สร้างจาก commit ต่างจากที่ tag ชี้อยู่ในปัจจุบัน"},{"id":"C","text":"สร้าง tag เป็นแบบ annotated และลงลายมือชื่อด้วย GPG เพื่อให้ย้ายหรือเขียนทับ tag ไม่ได้","correct":false,"why":"annotated tag หรือการลงลายมือชื่อช่วยยืนยันว่าใครสร้าง แต่ไม่ได้ห้ามการลบแล้วสร้าง tag ชื่อเดิมใหม่ที่ชี้ commit อื่น"},{"id":"D","text":"กำหนดให้ tag ที่ปล่อยแล้วเปลี่ยนไม่ได้: เปิด protected tags บนแพลตฟอร์มให้ห้ามลบหรือย้าย และแก้ด้วยการออก tag ใหม่ เช่น v3.1.1 แทน","correct":true,"why":"ถูก เพราะป้องกันที่ต้นเหตุด้วยกลไกของแพลตฟอร์ม ทำให้ชื่อเวอร์ชันชี้โค้ดชุดเดียวตลอด และการแก้จึงต้องออกเวอร์ชันใหม่ที่ตรวจย้อนหลังได้"}],"explanation":"ชื่อเวอร์ชันที่ปล่อยแล้วต้องชี้โค้ดชุดเดียวตลอดไป จึงควรบังคับด้วย protected tags แล้วแก้ด้วยการออกเวอร์ชันใหม่ ไม่ใช่ย้าย tag เดิม การลงลายมือชื่อหรือการแจ้งกันเองไม่ได้ป้องกันการย้าย"},{"id":"ENG-S-E-004","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S4","concept":"git-stash-behaviour-for-context-switch","mobile":false,"type":"multiple","stem":"นักพัฒนากำลังแก้ไฟล์หลายไฟล์บน branch feature/report และมีไฟล์ใหม่ที่ยังไม่เคย add อยู่ด้วย ต้องสลับไปแก้บั๊กด่วนบน main ชั่วคราวจึงใช้ git stash ข้อใดเป็นจริงเกี่ยวกับ stash (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"stash ผูกกับ branch ที่สร้างไว้ จึงนำกลับมาใช้ได้เฉพาะเมื่อ checkout กลับมาที่ feature/report เท่านั้น และ apply บน branch อื่นจะถูกปฏิเสธ","correct":false,"why":"stash เป็นชุดการเปลี่ยนแปลงที่ไม่ผูกกับ branch สามารถ apply บน branch ใดก็ได้ แม้อาจเกิด conflict หากโค้ดต่างกัน"},{"id":"B","text":"ค่าเริ่มต้นของ git stash เก็บเฉพาะไฟล์ที่ git ติดตามอยู่ ไฟล์ใหม่ที่ยังไม่เคย add จะค้างใน working directory เว้นแต่ระบุให้รวม untracked files ด้วย","correct":true,"why":"ถูก เพราะไฟล์ untracked ไม่ถูก stash โดยค่าเริ่มต้น จึงอาจติดตามไปที่ branch ปลายทางและปนกับงานใหม่ได้ หากไม่ระบุให้รวมด้วย"},{"id":"C","text":"stash เก็บอยู่ใน repository ของเครื่องนั้นเท่านั้น ไม่ถูกส่งขึ้น remote เมื่อ push จึงไม่ใช่ที่สำรองงาน","correct":true,"why":"ถูก เพราะ stash เป็นข้อมูลภายในเครื่อง หากเครื่องเสียหรือถูกล้าง งานใน stash จะหาย จึงไม่ควรใช้แทนการ commit หรือ push ไว้ที่ branch"},{"id":"D","text":"ค่าเริ่มต้นของ git stash เก็บไฟล์ที่ถูก .gitignore ไว้ด้วย จึงย้อนสภาพโฟลเดอร์ให้เหมือนเดิมทุกไฟล์ รวมถึง build output และไฟล์ .env","correct":false,"why":"ไฟล์ที่ถูก ignore ไม่ถูก stash โดยค่าเริ่มต้น ไฟล์อย่าง build output หรือ .env จึงไม่ถูกเก็บและไม่ถูกย้อนกลับ"},{"id":"E","text":"ถ้าใช้ git stash pop แล้วเกิด conflict git จะยังเก็บรายการ stash นั้นไว้ จนกว่าผู้ใช้จะแก้ conflict แล้วลบ stash เอง","correct":true,"why":"ถูก เพราะ pop จะลบ stash ก็ต่อเมื่อ apply สำเร็จ เมื่อเกิด conflict จึงคงไว้เพื่อไม่ให้งานหาย ผู้ใช้ต้องลบเองหลังตรวจผลเรียบร้อย"}],"explanation":"stash เหมาะกับการพักงานระยะสั้นในเครื่อง ควรรู้ว่าค่าเริ่มต้นไม่รวม untracked และไฟล์ที่ ignore ไม่ผูกกับ branch ไม่ถูกส่งขึ้น remote และ pop ที่ conflict จะคง stash ไว้ ส่วนงานที่ต้องเก็บจริงควร commit ลง branch"},{"id":"ENG-S-E-005","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S4","concept":"git-reflog-recover-after-hard-reset","mobile":false,"type":"single","stem":"นักพัฒนารัน git reset --hard HEAD~3 บน branch feature/invoice เพื่อลบ commit ที่ผิด แต่ภายหลังนึกได้ว่า 2 ใน 3 commit นั้นเป็นงานที่ต้องการเก็บไว้ commit เหล่านั้นยังไม่เคย push ขึ้น remote และเหตุการณ์เกิดขึ้นเมื่อไม่กี่ชั่วโมงก่อน วิธีใดกู้งานได้เหมาะสมที่สุด","options":[{"id":"A","text":"ใช้ git reflog หาตำแหน่ง HEAD ก่อน reset แล้วสร้าง branch ใหม่ที่ commit นั้น เพราะ commit เดิมยังไม่ถูกลบจริง","correct":true,"why":"ถูก เพราะ reflog บันทึกการเปลี่ยนตำแหน่งของ HEAD ในเครื่อง commit ที่เพิ่งถูก reset ทิ้งยังอยู่ใน object database จึงกู้ได้ภายในระยะเวลาที่ garbage collection ยังไม่ทำงาน"},{"id":"B","text":"รัน git fetch origin แล้ว git reset --hard origin/feature/invoice เพื่อดึง commit ทั้งสามกลับมาจาก remote ที่ทีมใช้ร่วมกันอยู่","correct":false,"why":"commit เหล่านี้ไม่เคยถูก push ขึ้น remote จึงไม่มีอยู่ที่นั่น คำสั่งนี้ไม่ได้นำงานกลับมา และอาจเขียนทับสถานะปัจจุบันของ branch"},{"id":"C","text":"ใช้ git revert กับตำแหน่งที่ branch เคยอยู่ก่อนรัน reset เพื่อสร้าง commit ที่ย้อนการ reset กลับมา","correct":false,"why":"revert ใช้กับ commit ไม่ใช่กับคำสั่ง reset ซึ่งเป็นการย้ายตำแหน่ง branch ไม่ได้สร้าง commit ที่ย้อนได้"},{"id":"D","text":"รัน git stash pop เพราะ reset --hard เก็บงานที่ถูกลบไว้ใน stash ให้โดยอัตโนมัติก่อนย้ายตำแหน่ง branch เพื่อป้องกันงานหาย","correct":false,"why":"reset --hard ไม่สร้าง stash การเปลี่ยนแปลงที่ยังไม่ commit ถูกทิ้ง ส่วน commit ที่ถูกตัดออกอยู่ใน reflog ไม่ใช่ใน stash"}],"explanation":"reset --hard ทิ้งเฉพาะการชี้ของ branch และการเปลี่ยนแปลงที่ยังไม่ commit ส่วนตัว commit ยังอยู่ใน object database ชั่วระยะหนึ่ง จึงกู้ได้จาก git reflog ตราบที่ยังไม่ถูกเก็บกวาด ควรกู้ทันทีและสร้าง branch ชี้ไว้เพื่อกันหาย"},{"id":"ENG-S-E-006","level":"senior","pool":"exam","competency":"Git","descriptor":"GIT-S5","concept":"git-cross-timezone-code-review-throughput","mobile":false,"type":"multiple","stem":"ทีมในประเทศไทยและทีมในยุโรปแชร์ repository เดียวกัน pull request มักค้างรอรีวิวข้ามคืน ทำให้ lead time เฉลี่ยยาวขึ้น 1 วัน ทีมต้องการเร่งความเร็วโดยไม่ลดคุณภาพของการรีวิว ข้อใดเหมาะสม (เลือกทุกข้อที่ถูก)","options":[{"id":"A","text":"อนุญาตให้ผู้เขียนกด merge PR ของตัวเองได้เมื่อรอรีวิวเกิน 24 ชั่วโมง โดยให้ผู้รีวิวมาตรวจย้อนหลังในวันทำการถัดไป","correct":false,"why":"ทำให้โค้ดเข้า main โดยไม่มีผู้ตรวจ ซึ่งลดคุณภาพของการรีวิวโดยตรง และการตรวจย้อนหลังมักแก้ได้ยากกว่าตรวจก่อน merge"},{"id":"B","text":"รวมงานทั้งสัปดาห์เป็น PR ใหญ่หนึ่งอัน แล้วให้ผู้รีวิวตรวจรอบเดียวทุกวันศุกร์ เพื่อลดจำนวนครั้งที่ต้องรอข้ามคืนของทั้งทีม","correct":false,"why":"PR ขนาดใหญ่รีวิวยากและได้ความละเอียดต่ำ ข้อบกพร่องหลุดง่าย และเมื่อพบปัญหาก็ต้องแก้ย้อนหลังทั้งสัปดาห์"},{"id":"C","text":"ให้ PR เล็กและโฟกัสเรื่องเดียว พร้อมคำอธิบายบริบทและวิธีทดสอบ เพื่อให้ผู้รีวิวต่างโซนเวลาตัดสินใจได้ในรอบเดียวโดยไม่ต้องรอถามกลับ","correct":true,"why":"ถูก เพราะ PR เล็กรีวิวเร็วและละเอียดกว่า และคำอธิบายที่ครบลดจำนวนรอบถามตอบข้ามคืน ซึ่งเป็นต้นเหตุหลักของการรอ"},{"id":"D","text":"กำหนดกลุ่มผู้รีวิวหรือ CODEOWNERS ที่มีสมาชิกครอบคลุมทั้งสองโซนเวลา และให้ CI (lint, test, scan) ผ่านก่อนผู้รีวิวมนุษย์เริ่มดู","correct":true,"why":"ถูก เพราะมีผู้รีวิวพร้อมในชั่วโมงทำงานของทั้งสองฝั่ง และการตรวจอัตโนมัติกันปัญหาพื้นฐานออกก่อน ผู้รีวิวจึงใช้เวลากับตรรกะและการออกแบบ"},{"id":"E","text":"บังคับให้ทุก PR ต้องมีผู้อนุมัติอย่างน้อย 4 คนจากทั้งสองทีม เพื่อให้ได้ความเห็นหลากหลายและลดความเสี่ยงของโค้ดที่ขึ้นระบบ","correct":false,"why":"เพิ่มจำนวนคนที่ต้องรอข้ามโซนเวลา ทำให้ lead time ยาวขึ้นกว่าเดิม และกระจายความรับผิดชอบจนแต่ละคนตรวจน้อยลง"}],"explanation":"ทีมกระจายโซนเวลาเร่ง flow ของการรีวิวได้ด้วยการลดขนาดงานต่อรอบ ให้บริบทครบในตัว PR มีผู้รีวิวครอบคลุมทุกช่วงเวลา และให้เครื่องตรวจก่อน โดยไม่ตัดขั้นตอนที่ให้คนที่สองตรวจก่อน merge"},{"id":"ENG-S-E-007","level":"senior","pool":"exam","competency":"SQL","descriptor":"SQL-S1","concept":"sql-not-in-subquery-with-null","mobile":false,"type":"single","stem":"คำค้นด้านล่างหาลูกค้าที่ยังไม่เคยสั่งซื้อ และทำงานถูกต้องมาหลายเดือน หลังระบบเริ่มรองรับ guest checkout ซึ่งบันทึก orders.customer_id เป็น NULL คำค้นนี้กลับคืนผลลัพธ์ว่างเปล่า ทั้งที่ยังมีลูกค้าที่ไม่เคยสั่งซื้ออยู่ สาเหตุและวิธีแก้ที่เหมาะสมที่สุดคืออะไร","code":"SELECT c.id, c.name\nFROM customers c\nWHERE c.id NOT IN (SELECT o.customer_id FROM orders o);","codeLang":"sql","options":[{"id":"A","text":"optimizer เลือกแผนการทำงานผิดเมื่อมีแถวที่ customer_id เป็น NULL ควรบังคับให้ใช้ index บน orders.customer_id ด้วย hint เพื่อให้เทียบค่าได้ถูกต้อง","correct":false,"why":"ผลว่างเปล่าไม่ได้เกิดจากแผนการทำงาน แต่เกิดจากการประเมินเงื่อนไขตามกฎ NULL ของ SQL การบังคับ index จึงไม่เปลี่ยนผลลัพธ์"},{"id":"B","text":"NOT IN เทียบกับ NULL ไม่ได้ ควรเปลี่ยนเป็น NOT IN (SELECT DISTINCT o.customer_id FROM orders o) เพื่อตัดค่าซ้ำที่ทำให้เทียบไม่ได้ออกไปก่อน","correct":false,"why":"DISTINCT กำจัดค่าซ้ำแต่ยังคงมี NULL หนึ่งค่าอยู่ในชุดผลลัพธ์ เงื่อนไข NOT IN จึงยังถูกประเมินเป็น UNKNOWN เหมือนเดิม"},{"id":"C","text":"NOT IN เมื่อชุดค่ามี NULL จะได้ FALSE หรือ UNKNOWN ไม่มีแถวผ่านเงื่อนไข ควรใช้ NOT EXISTS ที่เทียบกับ id ของแถวนอก หรือกรอง NULL ออกในซับคิวรี","correct":true,"why":"ถูก เพราะ c.id NOT IN (a, b, NULL) ขยายเป็น c.id \u003c> a AND c.id \u003c> b AND c.id \u003c> NULL ซึ่งพจน์สุดท้ายเป็น UNKNOWN จึงไม่มีแถวใดได้ TRUE ส่วน NOT EXISTS ตรวจการมีอยู่ของแถวที่ตรงกัน จึงไม่ถูกกระทบจาก NULL"},{"id":"D","text":"เปลี่ยนเป็น c.id \u003c> ALL (SELECT o.customer_id FROM orders o) ซึ่งเป็นการเทียบกับทุกค่าในชุด และจัดการกับ NULL ได้ต่างออกไปจาก NOT IN","correct":false,"why":"\u003c> ALL มีความหมายเดียวกับ NOT IN รวมถึงพฤติกรรมเมื่อมี NULL ในชุดค่า จึงยังคืนผลว่างเปล่าเช่นเดิม"}],"explanation":"NOT IN กับซับคิวรีที่อาจมี NULL เป็นกับดักของตรรกะสามค่า (TRUE, FALSE, UNKNOWN) ผลจึงว่างทั้งชุดทันทีที่มี NULL หนึ่งแถว ให้ใช้ NOT EXISTS หรือกรอง NULL ออกอย่างชัดเจน โดยเฉพาะเมื่อคอลัมน์ในซับคิวรีเป็น nullable"},{"id":"ENG-S-E-008","level":"senior","pool":"exam","competency":"SQL","descriptor":"SQL-S2","concept":"sql-full-outer-join-reconciliation","mobile":false,"type":"single","stem":"ทีมการเงินต้องการรายงานกระทบยอดระหว่างตาราง orders(order_id, expected_amount) ของระบบเรา กับตาราง gateway_settlements(order_ref, settled_amount) ที่นำเข้าจากรายงานของผู้ให้บริการชำระเงิน โดยต้องการในคำค้นเดียว (1) ออเดอร์ที่ไม่มีรายการ settle (2) รายการ settle ที่ไม่มีออเดอร์ในระบบ และ (3) คู่ที่ยอดไม่ตรงกัน ฐานข้อมูลรองรับ JOIN ทุกชนิดตามมาตรฐาน SQL ควรเขียนอย่างไร","options":[{"id":"A","text":"LEFT JOIN จาก orders ไป gateway_settlements แล้วกรอง WHERE s.order_ref IS NULL OR o.expected_amount \u003c> s.settled_amount เพื่อให้เห็นทั้งออเดอร์ที่ขาดและยอดที่ต่าง","correct":false,"why":"ได้ครบข้อ (1) และ (3) แต่ไม่เห็นรายการ settle ที่ไม่มีออเดอร์ในระบบ เพราะ LEFT JOIN เริ่มจากฝั่ง orders เท่านั้น"},{"id":"B","text":"FULL OUTER JOIN ด้วย o.order_id = s.order_ref แล้วกรอง WHERE o.order_id IS NULL OR s.order_ref IS NULL OR o.expected_amount \u003c> s.settled_amount","correct":true,"why":"ถูก เพราะ FULL OUTER JOIN เก็บแถวที่ไม่มีคู่จากทั้งสองฝั่ง เงื่อนไข IS NULL จับสองกรณีแรก และ \u003c> จับคู่ที่ยอดต่างกัน"},{"id":"C","text":"INNER JOIN ทั้งสองตารางด้วย o.order_id = s.order_ref แล้วกรอง WHERE o.expected_amount \u003c> s.settled_amount เพื่อดูเฉพาะคู่ที่ยอดไม่ตรงกัน","correct":false,"why":"INNER JOIN เหลือเฉพาะแถวที่มีคู่ จึงเห็นเพียงข้อ (3) และมองไม่เห็นออเดอร์ที่ไม่มีรายการ settle หรือรายการ settle ที่ไม่มีออเดอร์"},{"id":"D","text":"UNION ALL ผลของ LEFT JOIN จาก orders กับผลของ LEFT JOIN จาก gateway_settlements โดยแต่ละฝั่งกรองเฉพาะแถวที่ไม่มีคู่หรือยอดไม่ตรงกัน","correct":false,"why":"คู่ที่ยอดไม่ตรงกันปรากฏในทั้งสองฝั่ง และ UNION ALL ไม่กำจัดแถวซ้ำ ผลลัพธ์ในข้อ (3) จึงซ้ำสองแถว"}],"explanation":"งานกระทบยอดสองแหล่งที่ต้องเห็นแถวที่ไม่มีคู่ทั้งสองฝั่งพร้อมกันเหมาะกับ FULL OUTER JOIN ร่วมกับเงื่อนไข IS NULL ถ้าฐานข้อมูลไม่รองรับ ต้องใช้ LEFT JOIN สองทิศทางรวมกันด้วย UNION โดยระวังแถวซ้ำ"},{"id":"ENG-S-E-009","level":"senior","pool":"exam","competency":"SQL","descriptor":"SQL-S3","concept":"sql-leading-wildcard-like-search","mobile":false,"type":"single","stem":"หน้าค้นหาสินค้าของร้านออนไลน์ใช้ WHERE name LIKE '%กาแฟ%' บนตาราง products ซึ่งมี index แบบ B-tree บนคอลัมน์ name ข้อมูลมี 8 ล้านแถว EXPLAIN แสดงว่าสแกนทั้งตาราง และคำค้นใช้เวลาราว 3 วินาที ผู้ใช้ต้องค้นหาคำที่อยู่ส่วนใดของชื่อสินค้าก็ได้ ควรแก้อย่างไรให้เหมาะสมที่สุด","options":[{"id":"A","text":"ใช้ดัชนีค้นหาข้อความ เช่น full-text index ที่มีตัวตัดคำภาษาไทย หรือ n-gram/trigram index ตามที่ฐานข้อมูลรองรับ แทน B-tree ปกติ","correct":true,"why":"ถูก เพราะ B-tree เรียงตามอักขระตัวแรกของค่า คำที่นำหน้าด้วย % จึงเริ่มหาจากช่วงไม่ได้ ส่วนดัชนีข้อความออกแบบมาหาคำที่อยู่ส่วนใดก็ได้ ภาษาไทยไม่มีช่องว่างคั่นคำจึงต้องมีตัวตัดคำหรือ n-gram"},{"id":"B","text":"เพิ่ม index B-tree อีกอันบน name แบบเรียงจากมากไปน้อย เพื่อให้ฐานข้อมูลเลือกใช้ตัวที่เหมาะกับรูปแบบคำค้นที่ขึ้นต้นด้วยตัวสัญลักษณ์ %","correct":false,"why":"ทิศทางการเรียงไม่เกี่ยวกับการหาข้อความที่อยู่กลางค่า คำนำหน้า % ยังทำให้ต้องสแกนทุกแถวไม่ว่า index จะเรียงทิศทางใด"},{"id":"C","text":"เปลี่ยนเงื่อนไขเป็น LIKE 'กาแฟ%' เพื่อให้ใช้ index ได้ และให้ผู้ใช้พิมพ์ชื่อสินค้าตั้งแต่ต้นคำแทนการพิมพ์คำที่อยู่กลางชื่อ","correct":false,"why":"ทำให้ค้นหาได้เฉพาะคำที่ขึ้นต้นชื่อสินค้า ผู้ใช้จะไม่พบสินค้าที่มีคำนั้นอยู่กลางชื่อ ซึ่งขัดกับความต้องการของหน้าค้นหา"},{"id":"D","text":"ห่อคอลัมน์ด้วย LOWER(name) ในเงื่อนไข เพื่อให้ฐานข้อมูลมองเห็นคอลัมน์ผ่านฟังก์ชันและเลือกใช้ index ที่มีอยู่บนคอลัมน์ name ได้","correct":false,"why":"การห่อคอลัมน์ด้วยฟังก์ชันทำให้ index ปกติบน name ใช้ไม่ได้ (เว้นแต่มี index บนนิพจน์นั้นโดยเฉพาะ) และตัวสัญลักษณ์ % ที่อยู่หน้าคำค้นก็ยังเป็นปัญหาเดิม"}],"explanation":"index แบบ B-tree ช่วยเฉพาะการค้นที่รู้จุดเริ่มต้นของค่า (ค่าตรงตัว ช่วง หรือ prefix) การค้นข้อความที่อยู่ส่วนใดก็ได้ต้องใช้ดัชนีข้อความ (full-text หรือ n-gram) และสำหรับภาษาไทยต้องมีการตัดคำหรือใช้ n-gram"},{"id":"ENG-S-E-010","level":"senior","pool":"exam","competency":"SQL","descriptor":"SQL-S3","concept":"sql-keyset-pagination-vs-offset","mobile":false,"type":"multiple","stem":"API รายการธุรกรรมใช้คำค้นด้านล่าง เมื่อผู้ใช้เลื่อนไปหน้าที่ลึกมาก (offset หลักแสน) คำค้นช้าล
