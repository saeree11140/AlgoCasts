nder ครั้งแรก","`1` เพราะ callback ปิดค่า `count` ของ render แรกไว้ จึงตั้งค่า 0 + 1 ซ้ำทุกวินาที","`10` เพราะ effect ถูกรันสองครั้งจึงมี interval สองตัวเพิ่มค่าพร้อมกันทุกวินาที"],"answer":2,"why":["ผิด: `setCount(count + 1)` ใช้ค่า `count` ที่ถูกปิดไว้ใน closure ไม่ใช่ state ล่าสุด React ไม่ได้คำนวณให้เองเว้นแต่ใช้ functional updater","ผิด: effect ที่มี `[]` ถูกเรียกหนึ่งครั้งหลัง mount ไม่ใช่ไม่ถูกเรียกเลย interval จึงเริ่มทำงาน","ถูก: closure ของ effect เห็น `count = 0` ตลอดไป ทุก tick จึงเรียก `setCount(1)` และ React bail out เมื่อค่าเท่าเดิม","ผิด: การรัน effect สองครั้งเกิดเฉพาะ StrictMode ใน development และมี cleanup คั่นกลาง อีกทั้งต่อให้มีสอง interval ค่าก็ยังเป็น 1 จาก closure เดิม"],"explanation":"effect ถูกสร้างครั้งเดียวตอน mount จึงจับค่า `count` ของ render แรก (0) ไว้ใน closure ทุก tick จึงตั้งค่าเป็น 1 ซ้ำ ๆ วิธีแก้คือใช้ functional updater `setCount(c => c + 1)` ซึ่งไม่ต้องพึ่งค่าใน closure","info":"ปัญหา stale closure นี้ถูกจับได้ด้วย rule `react-hooks/exhaustive-deps` ของ eslint-plugin-react-hooks ควรเปิดเป็น error ใน CI ถ้า logic ใน effect ต้องอ่านค่าล่าสุดแต่ไม่อยากให้ effect ถูกสร้างใหม่ ให้ใช้ `useRef` หรือ `useEffectEvent` (stable ตั้งแต่ React 19.2) แทนการปิด dependency ด้วย eslint-disable","ref":"react.dev — Updating state based on the previous state; Synchronizing with Effects"},{"id":"WEB-02","competency":"web","level":"intermediate","outline":"Apply advanced CSS techniques and preprocessors (Sass, Less), progressive web app features (service workers, offline caching), and frontend security best practices to prevent vulnerabilities (e.g., XSS, CSRF).","question":"PWA ใช้ service worker precache app shell หลัง deploy เวอร์ชันใหม่ ผู้ใช้ที่เปิดแอปไว้หลาย tab ยังเห็นเวอร์ชันเก่าแม้กด refresh และใน DevTools > Application เห็น service worker ตัวใหม่สถานะ \"waiting to activate\" สาเหตุและแนวทางที่ถูกต้องคือข้อใด","options":["SW ใหม่จะรอจนทุก client ที่ SW เก่าควบคุมถูกปิด ควรแจ้งผู้ใช้แล้วเรียก `skipWaiting()` ตามด้วย reload","browser ตรวจ SW script ใหม่รอบละ 24 ชั่วโมง ต้องรอครบรอบก่อน activate ควรลด `max-age` ของ `sw.js`","Cache Storage ของเวอร์ชันเก่าเต็ม quota ทำให้ SW ใหม่ activate ไม่ได้ ควรเรียก `caches.delete()` ใน install","scope ของ SW ใหม่ไม่ตรงกับ path เดิมจึงไม่ควบคุมหน้าเดิม ควรตั้ง header `Service-Worker-Allowed` ให้ครอบคลุม"],"answer":0,"why":["ถูก: lifecycle ของ SW กำหนดให้ตัวใหม่อยู่ใน waiting จนไม่มี client ใดถูกควบคุมโดยตัวเก่า การ refresh ไม่พอเพราะหน้าเก่ายังไม่ถูก unload ก่อนหน้าใหม่โหลด","ผิด: 24 ชั่วโมงคือเพดานที่ browser จะข้าม HTTP cache ตอนตรวจ update แต่ที่นี่ตรวจเจอและ install แล้ว (สถานะ waiting) ปัญหาอยู่ที่ขั้น activate","ผิด: quota เต็มจะทำให้ install ล้มเหลว ไม่ใช่ติดอยู่ที่ waiting และการลบ cache ใน install ทำให้ tab ที่ยังใช้ SW เก่าเสียหาย","ผิด: ถ้า scope ไม่ตรงจะเป็นคนละ registration ไม่ใช่ตัวใหม่ที่รอแทนตัวเก่าใน registration เดียวกัน"],"explanation":"service worker ตัวใหม่ที่ install เสร็จจะเข้าสถานะ waiting จนกว่า client ทุกตัวของตัวเก่าจะหายไป เพื่อไม่ให้หน้าเดียวกันใช้ asset สองเวอร์ชันปนกัน การให้ผู้ใช้กดยืนยันแล้วส่ง message ให้ SW เรียก `skipWaiting()` และ reload หน้าคือแนวทางมาตรฐาน","info":"อย่าเรียก `skipWaiting()` ทันทีใน install โดยไม่ reload หน้า เพราะหน้าที่เปิดอยู่อาจขอ lazy chunk ของเวอร์ชันเก่าที่ถูกลบจาก precache ไปแล้วจนเกิด ChunkLoadError Workbox มี `workbox-window` ที่ฟัง event `waiting` และส่ง `messageSkipWaiting()` ให้ ส่วน `sw.js` ควรเสิร์ฟด้วย `Cache-Control: no-cache` เพื่อให้ตรวจ update ได้ทุก navigation","ref":"web.dev — The service worker lifecycle; Workbox docs — workbox-window"},{"id":"WEB-03","competency":"web","level":"intermediate","outline":"Design and integrate complex RESTful and GraphQL APIs with schema validation, layered architectures (controller-service-repository), flexible data querying (filtering, pagination), and advanced security measures (OAuth2, JWT, rate limiting, input sanitization).","question":"API feed `GET /posts?page=2` ใช้ query `ORDER BY created_at DESC, id DESC LIMIT 20 OFFSET 20` และมีโพสต์ใหม่เข้ามาตลอดเวลา ผู้ใช้ที่เลื่อนไปหน้า 2 มักเห็นโพสต์ซ้ำกับหน้า 1 วิธีแก้ที่ตรงสาเหตุที่สุดคือข้อใด","options":["เปลี่ยนเป็น GraphQL connection (`first`, `after`) โดย encode ค่า offset เป็น base64 cursor","เพิ่ม page size เป็น 100 เพื่อลดจำนวนครั้งที่ client ต้องขอหน้าถัดไปจาก server","รัน query ของทั้งสองหน้าใน transaction ระดับ `REPEATABLE READ` เพื่อเห็น snapshot เดียว","ส่ง cursor `(created_at, id)` ของแถวสุดท้าย แล้ว query ต่อด้วย `WHERE (created_at, id) \u003c (:c, :i)`"],"answer":3,"why":["ผิด: cursor ที่ภายในยังเป็น offset ให้ผลเหมือน OFFSET ทุกประการ แถวใหม่ด้านบนยังดันแถวเดิมเลื่อนลงมา","ผิด: ลดความถี่แต่ไม่แก้สาเหตุ ทุกครั้งที่ขอหน้าถัดไปยังมีแถวซ้ำเท่ากับจำนวนโพสต์ใหม่ที่เข้ามาระหว่างนั้น","ผิด: แต่ละหน้าเป็นคนละ HTTP request คนละ connection จึงไม่สามารถถือ transaction เดียวข้าม request ได้","ถูก: keyset pagination อ้างอิงตำแหน่งด้วยค่าของแถวสุดท้าย แถวที่ถูก insert ใหม่ด้านบนจึงไม่ทำให้ขอบเขตหน้าถัดไปเลื่อน"],"explanation":"OFFSET นับตำแหน่งจากต้นผลลัพธ์ใหม่ทุกครั้ง เมื่อมีแถวใหม่ถูกเพิ่มด้านบน แถวท้ายหน้า 1 จะเลื่อนลงไปอยู่หน้า 2 keyset pagination ใช้ค่า `(created_at, id)` ของแถวสุดท้ายเป็นจุดเริ่ม จึงไม่ขึ้นกับจำนวนแถวที่เพิ่มเข้ามา และ `id` ช่วยตัด tie เมื่อเวลาเท่ากัน","info":"keyset ต้องมี index ที่ลำดับตรงกับ ORDER BY เช่น `(created_at DESC, id DESC)` จึงจะเป็น index range scan ที่เร็วคงที่ทุกหน้า ต่างจาก OFFSET ที่ต้องอ่านแล้วทิ้งแถวก่อนหน้า ทำให้หน้าลึก ๆ ช้าลงเรื่อย ๆ ข้อแลกเปลี่ยนคือกระโดดไปหน้าที่ N ตรง ๆ ไม่ได้ และ cursor ที่ส่งให้ client ควร encode แบบ opaque เพื่อเปลี่ยน implementation ภายหลังได้","ref":"Markus Winand — Use The Index, Luke: Paging Through Results; GraphQL Cursor Connections Specification"},{"id":"WEB-04","competency":"web","level":"intermediate","outline":"Manage API versioning, lifecycle, backward compatibility, and deprecation strategies, and lead development teams and architecture decisions.","question":"ทีมเปิด `/v2/orders` แล้วและจะยุติ `GET /v1/orders` ในอีก 6 เดือน มี client ภายนอกหลายรายที่ทีมไม่ได้ควบคุม ต้องการแจ้งผ่าน HTTP ตามมาตรฐาน โดย v1 ยังต้องทำงานเหมือนเดิมจนถึงวันยุติ ควรทำอย่างไร","options":["ตอบ `301 Moved Permanently` ไปยัง `/v2/orders` เพื่อให้ client ย้ายไปใช้ v2 เองโดยอัตโนมัติทันที","ส่ง header `Deprecation` และ `Sunset` พร้อม `Link` ไปยัง v2 หรือเอกสาร migration ใน response","ส่ง header `Warning: 299 - \"Deprecated API\"` ในทุก response ของ v1 ไปจนถึงวันยุติ","ตอบ `410 Gone` ให้ client ที่ยังไม่ลงทะเบียนใช้ v2 เพื่อเร่งการย้ายก่อนวันยุติ"],"answer":1,"why":["ผิด: redirect เปลี่ยนพฤติกรรมของ v1 ทันที และ v2 มี response shape ต่างจาก v1 client ที่ตาม redirect จะพังโดยไม่รู้ตัว","ถูก: `Deprecation` (RFC 9745) บอกว่า resource ถูก deprecate แล้ว `Sunset` (RFC 8594) บอกวันที่จะหยุดให้บริการ โดย response ยังเหมือนเดิม","ผิด: header `Warning` ถูกประกาศเป็น obsolete ใน RFC 9111 แล้ว client และ library สมัยใหม่ส่วนใหญ่ไม่อ่าน","ผิด: `410` คือการยุติจริง ใช้หลังวัน sunset การตอบก่อนกำหนดทำลาย backward compatibility ที่สัญญาไว้"],"explanation":"มาตรฐานปัจจุบันแยกสองสัญญาณ: `Deprecation` บอกว่าไม่ควรใช้แล้ว และ `Sunset` บอกวันที่จะใช้ไม่ได้ ทั้งคู่ให้ข้อมูลโดยไม่เปลี่ยนพฤติกรรมของ endpoint และใช้ `Link` ชี้ไปยังเวอร์ชันใหม่หรือเอกสารได้","info":"ค่า `Deprecation` เป็น structured date เช่น `Deprecation: @1767225600` ส่วน `Sunset` เป็น HTTP-date ควร log การเรียก v1 แยกตาม client id เพื่อติดตามว่าใครยังไม่ย้ายและติดต่อเชิงรุกก่อนวันยุติ และหลังวัน sunset ค่อยตอบ `410 Gone` พร้อมลิงก์เอกสาร โดยทั่วไปการเพิ่ม field ใหม่แบบ optional ไม่ต้องออกเวอร์ชันใหม่ แต่การลบ/เปลี่ยนชนิด field หรือเพิ่มค่าใน enum ที่ client switch แบบ exhaustive ถือเป็น breaking","ref":"RFC 9745 (Deprecation header); RFC 8594 (Sunset header); RFC 9111 §5.5"},{"id":"WEB-05","competency":"web","level":"advance","outline":"Architect scalable and modular application systems for web and mobile, including micro-frontends, module federation, modular mobile ecosystems, and distributed backend architectures (service meshes, message queues).","question":"micro-frontend ใช้ Webpack Module Federation มี host หนึ่งตัวและ remote สองตัวที่เขียนด้วย React เมื่อเปิดหน้าของ remote เกิด error \"Invalid hook call\" และ `ThemeContext` ที่ host provide ไว้กลายเป็นค่า default ใน remote สาเหตุคือมี React หลาย instance ควรแก้อย่างไร","options":["ย้าย `react` ไปไว้ใน `peerDependencies` ของ remote ทุกตัวเพื่อให้ใช้ React ของ host","ให้ host `exposes` โมดูล `react` แล้วให้ remote import ผ่าน `host/react` แทน","ประกาศ `react`/`react-dom` ใน `shared` แบบ `singleton: true` และ `requiredVersion` ในทุก app ที่ใช้","ตั้ง `externals` ของ `react` เฉพาะใน host แล้วโหลด React จาก CDN ด้วย script tag ก่อน bundle"],"answer":2,"why":["ผิด: `peerDependencies` มีผลแค่ตอนติดตั้ง package ตอน build แต่ละ remote ยัง bundle React ของตัวเองเข้าไปเหมือนเดิม","ผิด: library อื่นใน remote (เช่น react-dom, router) ยัง import `react` แบบ bare specifier จึงได้ instance ของตัวเอง และสร้าง dependency วนระหว่าง host กับ remote","ถูก: shared scope ของ Module Federation ให้ทุก app ใช้ instance เดียวกันระหว่าง runtime และ `singleton` บังคับว่ามีได้เวอร์ชันเดียว","ผิด: externals ใน host ไม่มีผลกับ build ของ remote ซึ่งยัง bundle React ของตัวเอง จึงยังมีสอง instance"],"explanation":"hooks และ context ของ React ผูกกับ instance ของโมดูล `react` ที่ใช้ render ถ้า remote bundle React ของตัวเองจะเกิด instance ที่สอง การประกาศ `shared` แบบ `singleton` ทั้ง host และ remote ทำให้ runtime เลือกใช้ instance เดียวที่ตกลงเวอร์ชันกันได้","info":"library ที่มี context หรือ global state เช่น react-router, state management และ design system ควรเป็น singleton ด้วย host ต้องมี async boundary (`import(\"./bootstrap\")`) ไม่เช่นนั้นจะเจอ \"Shared module is not available for eager consumption\" ถ้าเวอร์ชันไม่เข้า `requiredVersion` runtime จะเตือน ส่วน `strictVersion: true` จะ throw ทันที ซึ่งช่วยจับ drift ระหว่างทีมได้เร็ว","ref":"webpack docs — Module Federation (shared, singleton, requiredVersion)"},{"id":"WEB-06","competency":"web","level":"advance","outline":"Lead performance optimization and auditing across all layers, utilizing tools and techniques such as Lighthouse, real user monitoring (RUM), New Relic, and APM solutions.","question":"Lighthouse (navigation mode, mobile) ให้คะแนน Performance 96 แต่ CrUX field data ของหน้าเดียวกันแสดง INP ที่ p75 = 560ms (Poor) ในฐานะผู้นำด้าน performance ขั้นตอนถัดไปที่ถูกต้องที่สุดคือข้อใด","options":["รัน Lighthouse ซ้ำโดยตั้ง CPU throttling 6x เพื่อจำลองเครื่องช้า แล้วใช้ค่า INP จากรายงานนั้นเป็น baseline","แก้ LCP ให้ต่ำกว่า 2.5s ก่อน เพราะ INP ใน CrUX นับรวมเวลาที่ผู้ใช้รอหน้าโหลดตั้งแต่ navigation","ลด JavaScript จน TBT ใน Lighthouse เป็น 0 ซึ่งทำให้ INP ภาคสนามผ่านเกณฑ์ตามไปด้วย","เก็บ RUM ด้วย `web-vitals` (attribution) หา interaction และ phase ที่ช้า แล้ว reproduce ใน DevTools"],"answer":3,"why":["ผิด: navigation mode ไม่มีการโต้ตอบของผู้ใช้จึงไม่รายงาน INP เลย ไม่ว่าจะ throttle เท่าใด","ผิด: INP วัด latency ของ interaction (click, tap, key) ตลอดอายุหน้า ไม่รวมเวลาโหลดหน้าและไม่ได้คำนวณต่อจาก LCP","ผิด: TBT เป็นแค่ lab proxy ช่วงโหลดหน้า interaction ที่ช้าอาจเกิดจาก handler หนักหรือ rendering หลังโหลดเสร็จซึ่ง TBT มองไม่เห็น","ถูก: INP เป็น field metric ต้องรู้ว่า interaction ใดช้าและช้าที่ phase ใด (input delay, processing, presentation) ก่อนแก้ แล้วจึง reproduce ใน lab"],"explanation":"คะแนน Lighthouse เป็น lab data ของการโหลดหน้าโดยไม่มีผู้ใช้โต้ตอบ ส่วน INP ใน CrUX มาจากผู้ใช้จริง ช่องว่างนี้ต้องปิดด้วย RUM ที่บอกได้ว่า element/interaction ใดช้าและเวลาอยู่ใน phase ใด จึงจะเลือกวิธีแก้ได้ถูกจุด","info":"เกณฑ์ INP: ดี ≤ 200ms, ต้องปรับปรุง 200–500ms, แย่ > 500ms วัดที่ p75 ของ page view build attribution ของ `web-vitals` ให้ข้อมูลจาก Long Animation Frames (LoAF) API ว่า script ใดบล็อก ส่วน Lighthouse โหมด timespan/user flow วัด INP ของ interaction ที่ script ไว้ได้ ใช้ยืนยันผลแก้ใน lab ก่อนรอ CrUX ที่สะสมข้อมูลย้อนหลัง 28 วัน","ref":"web.dev — Interaction to Next Paint (INP); Lighthouse user flows; web-vitals library"},{"id":"WEB-07","competency":"web","level":"advance","outline":"Own and implement security and compliance strategies across all layers, including establishing security policies, mobile/data compliance (OAuth, PDPA), secure data storage, and enterprise-grade security practices.","question":"แอป mobile (iOS/Android) ของบริษัทเข้าถึงข้อมูลส่วนบุคคลที่อยู่ภายใต้ PDPA และต้อง login ผ่าน OAuth 2.0/OIDC identity provider ของบริษัท แนวทางใดสอดคล้องกับแนวปฏิบัติปัจจุบันสำหรับ native app มากที่สุด","options":["ใช้ Resource Owner Password Credentials ผ่านหน้า login native และเก็บ refresh token ใน encrypted SharedPreferences","ใช้ Authorization Code + PKCE ผ่าน system browser (เช่น Custom Tabs) และเก็บ token ใน Keychain/Keystore","ใช้ Authorization Code ที่ฝัง `client_secret` ไว้ในแอปซึ่ง obfuscate ด้วย R8/ProGuard และเก็บ token ใน Keychain","ใช้ Implicit flow ผ่าน embedded WebView เพื่อ UX ที่ลื่นกว่า และเก็บ access token ไว้ใน AsyncStorage"],"answer":1,"why":["ผิด: OAuth 2.0 Security BCP (RFC 9700) ห้ามใช้ password grant เพราะแอปได้เห็นรหัสผ่านโดยตรงและรองรับ MFA/SSO ของ IdP ไม่ได้","ถูก: RFC 8252 กำหนดให้ native app ใช้ external user-agent กับ PKCE และ token ควรอยู่ใน storage ที่ระบบปฏิบัติการปกป้องด้วย hardware","ผิด: native app เป็น public client secret ที่ฝังในแอปถูกแกะออกได้เสมอไม่ว่าจะ obfuscate อย่างไร จึงไม่ได้ยืนยันตัวตนของ client จริง","ผิด: Implicit flow ส่ง token ผ่าน URL และถูกเลิกแนะนำแล้ว ส่วน embedded WebView ทำให้แอปดักรหัสผ่านได้ และ AsyncStorage ไม่ได้เข้ารหัส"],"explanation":"native app เป็น public client จึงพิสูจน์ตัวตนด้วย secret ไม่ได้ PKCE ป้องกันการขโมย authorization code ระหว่าง redirect การใช้ system browser ทำให้แอปไม่เห็นรหัสผ่านและใช้ SSO/MFA ของ IdP ได้ และ Keychain/Keystore ปกป้อง token ด้วยกลไกของระบบปฏิบัติการ","info":"ควรใช้ claimed HTTPS redirect (Universal Links/App Links) แทน custom URL scheme เพื่อกันแอปอื่นแย่ง redirect เปิด refresh token rotation ที่ IdP เพื่อให้ตรวจจับ token ที่ถูกขโมยได้ และพิจารณา sender-constrained token (DPoP) สำหรับข้อมูลอ่อนไหว ด้าน PDPA ให้เก็บข้อมูลส่วนบุคคลบนเครื่องเท่าที่จำเป็นและล้างเมื่อ logout","ref":"RFC 8252 (OAuth 2.0 for Native Apps); RFC 9700 (OAuth 2.0 Security Best Current Practice); RFC 7636 (PKCE)"},{"id":"OOP-01","competency":"oop","level":"intermediate","outline":"Design and implement class hierarchies using inheritance and polymorphism","question":"โค้ด Java ด้านล่างพิมพ์ค่าใด และเหตุผลใดถูกต้อง","codeLang":"java","code":"class Animal { String sound() { return \"...\"; } }\nclass Dog extends Animal { @Override String sound() { return \"Woof\"; } }\n\nclass Printer {\n  String print(Animal a) { return \"Animal:\" + a.sound(); }\n  String print(Dog d)    { return \"Dog:\" + d.sound(); }\n}\n\nAnimal a = new Dog();\nSystem.out.println(new Printer().print(a));","options":["`Animal:Woof` — overload เลือกตอน compile ตามชนิดตัวแปร ส่วน override เลือกตอน runtime ตาม object","`Dog:Woof` — ทั้ง overload และ override ถูกเลือกตอน runtime ตามชนิดจริงของ object ที่ส่งเข้าไปในเมธอด","`Animal:...` — ทั้ง overload และ override ถูกเลือกตอน compile ตามชนิดที่ประกาศของตัวแปร `a`","`Dog:...` — overload เลือกตอน runtime ตาม object ส่วน `sound()` ผูกกับชนิดตัวแปรตอน compile"],"answer":0,"why":["ถูก: Java เลือก overload จาก static type (`Animal`) ตอน compile แล้ว dynamic dispatch ของ `sound()` ไปที่ `Dog` ตอน runtime","ผิด: Java ไม่มี multiple dispatch การเลือก overload ไม่ดูชนิดจริงของ argument ตอน runtime","ผิด: method ที่ override แบบ instance method ถูก dispatch ตาม object จริงเสมอ จึงได้ `Woof` ไม่ใช่ `...`","ผิด: กลับด้านกับความจริงทั้งสองส่วน overload เป็น compile time และ override เป็น runtime"],"explanation":"Java ใช้ single dispatch: overload resolution เกิดตอน compile โดยดูชนิดที่ประกาศของ argument (`Animal`) จึงเลือก `print(Animal)` ส่วนการเรียก `a.sound()` เป็น virtual call ที่ดูชนิดจริงของ object (`Dog`) ตอน runtime ผลจึงเป็น `Animal:Woof`","info":"ถ้าต้องการพฤติกรรมตามชนิดจริงของ argument (double dispatch) ให้ใช้ polymorphism ที่ตัว object เช่นย้าย logic เข้าไปใน method ของ `Animal` หรือใช้ Visitor ส่วนใน Java 21 ใช้ `switch` pattern matching บนชนิดได้ การ overload ด้วยชนิดที่อยู่ในลำดับชั้นเดียวกันเป็นที่มาของ bug แบบนี้บ่อย Effective Java แนะนำให้ตั้งชื่อ method ต่างกันแทน","ref":"JLS §15.12 (Method Invocation Expressions); Effective Java 3rd ed., Item 52"},{"id":"OOP-02","competency":"oop","level":"intermediate","outline":"Apply composition and aggregation to model complex relationships between objects","question":"ระบบสั่งซื้อมีกฎดังนี้: `OrderLine` ไม่มีความหมายถ้าไม่มี `Order` ถูกสร้างและลบพร้อม `Order` และไม่ถูกใช้ร่วมกับ `Order` อื่น ส่วน `Customer` มีอยู่ก่อนและหลัง `Order` หนึ่ง `Customer` มีได้หลาย `Order` และทุก `Order` ต้องระบุ `Customer` ใน UML class diagram ควร model อย่างไร","options":["`Order`–`OrderLine` เป็น aggregation เพราะ query `OrderLine` แยกได้ และ `Order`–`Customer` เป็น composition เพราะขาดกันไม่ได้","ทั้ง `Order`–`OrderLine` และ `Order`–`Customer` เป็น composition เพราะ `Order` ถือ reference ไว้ตลอดอายุของมัน","`Order`–`OrderLine` เป็น aggregation และ `Order`–`Customer` เป็น association เพราะ `Customer` มีอายุยาวกว่า","`Order`–`OrderLine` เป็น composition และ `Order`–`Customer` เป็น association ที่ multiplicity ฝั่ง `Customer` เป็น 1"],"answer":3,"why":["ผิด: การ query แยกได้เป็นเรื่องของ storage ไม่ใช่ ownership และการที่ `Order` ต้องมี `Customer` คือ multiplicity 1 ไม่ใช่การเป็นเจ้าของ lifecycle","ผิด: การถือ reference ไม่ได้แปลว่าเป็น composition เพราะ `Customer` ไม่ถูกลบตาม `Order` และถูกใช้ร่วมกันหลาย `Order`","ผิด: ส่วน `Customer` ถูกต้อง แต่ `OrderLine` ที่เกิดและตายพร้อม `Order` และไม่ถูกแชร์คือนิยามของ composition ไม่ใช่ aggregation","ถูก: composition แสดง ownership และ lifecycle ร่วมกัน ส่วนความจำเป็นที่ต้องมี `Customer` แสดงด้วย multiplicity ของ association"],"explanation":"composition (diamond ทึบ) ใช้เมื่อส่วนย่อยมี lifecycle ผูกกับเจ้าของและไม่ถูกแชร์ ซึ่งตรงกับ `OrderLine` ส่วน `Customer` เป็น object อิสระที่ `Order` อ้างถึง ข้อบังคับว่าต้องมีลูกค้าหนึ่งคนแสดงด้วย multiplicity `1` บน association ไม่ใช่ด้วย composition","info":"UML 2.5 ระบุว่า semantics ของ shared aggregation (diamond โปร่ง) แตกต่างกันตามบริบท Martin Fowler จึงแนะนำให้ใช้ association ธรรมดาแทน ใน DDD ความสัมพันธ์แบบ composition มักกลายเป็นขอบเขตของ aggregate (`Order` เป็น aggregate root ที่ถือ `OrderLine`) ส่วน aggregate อื่นอย่าง `Customer` ควรอ้างถึงด้วย id ไม่ใช่ถือ object reference","ref":"OMG UML 2.5.1 §9.5.3; Martin Fowler — UML Distilled; Eric Evans — Domain-Driven Design (Aggregates)"},{"id":"OOP-03","competency":"oop","level":"intermediate","outline":"Use access modifiers and abstract classes/interfaces to enforce encapsulation and contract","question":"ทีมเขียน library ด้วย TypeScript แล้ว publish เป็น JavaScript ให้ทีมอื่นใช้ ซึ่งบางทีมเขียน JavaScript ล้วน ต้องการให้ `balance` ของ class `Wallet` ถูกอ่านหรือแก้จากภายนอกไม่ได้จริงตอน runtime แต่ยังเปลี่ยนค่าได้ผ่าน method `deposit()` ควรประกาศอย่างไร","options":["`private balance = 0` เพราะ TypeScript จะ compile field ที่เป็น private ให้อยู่ใน closure ที่ซ่อนไว้","`protected readonly balance = 0` เพื่อให้อ่านได้เฉพาะ subclass และป้องกันการแก้ค่าจากภายนอก","`#balance = 0` ซึ่งเป็น ECMAScript private field ที่ runtime ป้องกันการเข้าถึงจากนอก class","`private balance = 0` คู่กับ `Object.freeze(this)` ใน constructor เพื่อกันการอ่านและเขียนจากภายนอก"],"answer":2,"why":["ผิด: `private` ของ TypeScript ถูกลบทิ้งตอน compile ได้ property ธรรมดาที่โค้ด JavaScript เข้าถึง `wallet.balance` ได้ตรง ๆ","ผิด: `protected` และ `readonly` เป็น compile-time เช่นกัน และ `readonly` ทำให้ `deposit()` ภายใน class แก้ค่าไม่ได้ด้วย","ถูก: private field ที่ขึ้นต้นด้วย `#` บังคับโดย JavaScript engine การเข้าถึงจากนอก class เป็น SyntaxError/TypeError","ผิด: `Object.freeze` กันการเขียนรวมถึงจาก `deposit()` เองด้วย และไม่ได้กันการอ่านค่าจากภายนอกเลย"],"explanation":"access modifier ของ TypeScript (`private`, `protected`, `readonly`) เป็นการตรวจตอน compile เท่านั้นและหายไปใน JavaScript ที่ publish ส่วน `#field` เป็น feature ของ ECMAScript (ES2022) ที่ engine บังคับความเป็น private ตอน runtime จึงเป็นทางเดียวในตัวเลือกที่ตรงโจทย์","info":"แม้ใน TypeScript เอง `private` ก็ถูกข้ามได้ด้วย bracket notation `w[\"balance\"]` ข้อควรระวังของ `#field` คือใช้กับ `Proxy` ไม่ได้ (เรียก method ผ่าน proxy ที่อ่าน `#field` จะ throw TypeError) ซึ่งกระทบ library ที่ห่อ object ด้วย Proxy เช่น state management บางตัว ใช้ `#balance in obj` เพื่อตรวจ brand ของ object ได้","ref":"MDN — Private properties; TypeScript Handbook — Classes (private vs #private)"},{"id":"OOP-04","competency":"oop","level":"intermediate","outline":"Refactor code to follow OOP best practices (e.g., SOLID principles)","question":"interface `PaymentGateway` มี `charge()`, `refund()`, `voidAuthorization()` และ `downloadSettlementReport()` เมื่อเพิ่ม `CashOnDeliveryGateway` ที่ทำได้แค่ `charge()` จึงให้ method อื่น throw `UnsupportedOperationException` ต่อมาหน้า refund และ batch settlement ต้องมี `if (gateway instanceof CashOnDeliveryGateway)` กระจายหลายที่ refactor ใดแก้ที่ต้นเหตุตาม SOLID","options":["ใช้ Factory Method สร้าง gateway ตามประเภทการชำระเงิน เพื่อตัด `instanceof` ออกจากหน้าจอที่เรียกใช้","แยก interface ตามบทบาท เช่น `Chargeable`, `Refundable`, `SettlementSource` ให้ client รับเฉพาะที่ใช้จริง","สร้าง abstract base class ที่ implement ทุก method เป็น no-op แล้วให้ `CashOnDeliveryGateway` override แค่ `charge()`","เพิ่ม method `supports(operation)` ใน `PaymentGateway` แล้วให้ caller ตรวจก่อนเรียก method ที่อาจไม่รองรับ"],"answer":1,"why":["ผิด: factory แก้เรื่องการสร้าง object แต่ caller ยังได้ `PaymentGateway` ที่ `refund()` throw ได้ จึงยังต้องตรวจชนิดเหมือนเดิม","ถูก: interface ใหญ่บังคับให้ class implement สิ่งที่ทำไม่ได้ (ISP) เมื่อแยกตามบทบาท หน้า refund รับเฉพาะ `Refundable` และ compiler กันไม่ให้ส่ง COD เข้าไป","ผิด: no-op ทำให้ refund เงียบ ๆ ว่าสำเร็จทั้งที่ไม่ได้คืนเงิน เป็นการละเมิด LSP ที่อันตรายกว่าการ throw","ผิด: capability flag ยังคง interface อ้วนไว้และย้ายการตรวจชนิดไปไว้ที่ caller ทุกจุดในรูปแบบใหม่"],"explanation":"ต้นเหตุคือ interface ที่รวมหลายบทบาท ทำให้ implementation ต้องรับ method ที่ทำไม่ได้ (ละเมิด ISP) และผลที่ตามมาคือ subtype แทน supertype ไม่ได้ (ละเมิด LSP) จน caller ต้องตรวจ `instanceof` การแยก role interface ทำให้ type system บังคับว่าส่งได้เฉพาะ gateway ที่ทำ operation นั้นได้จริง","info":"สัญญาณของ ISP/LSP ที่ถูกละเมิดคือ `throw new UnsupportedOperationException()`, method ว่าง, และ `instanceof`/type switch ที่ caller ส่วน Java Collections ที่มี optional operation (`List.of(...).add` throw) เป็นข้อยกเว้นที่ออกแบบโดยตั้งใจเพื่อลดจำนวน interface ไม่ใช่แบบอย่างสำหรับ domain model ทั่วไป","ref":"Robert C. Martin — Agile Software Development: Principles, Patterns, and Practices (ISP, LSP)"},{"id":"OOP-05","competency":"oop","level":"advance","outline":"Architect large-scale applications using advanced OOP patterns (e.g., Factory, Strategy, Observer, Decorator)","question":"repository ถูกประกอบด้วย decorator ตามโค้ดด้านล่าง ขณะที่ cache ว่าง และ HTTP ล้มเหลว 2 ครั้งแรกก่อนสำเร็จในครั้งที่ 3 เมื่อเรียก `await repo.get(\"p1\")` หนึ่งครั้ง จะเกิดการบันทึก metric, การเรียก HTTP และการตรวจ cache อย่างละกี่ครั้ง","codeLang":"ts","code":"interface Repo { get(id: string): Promise\u003cProduct> }\n\nclass HttpRepo implements Repo      { /* GET /products/:id — throws on failure */ }\nclass CacheRepo implements Repo     { /* look up Map; on miss call inner.get and store */ }\nclass RetryRepo implements Repo     { /* call inner.get; on throw, try again, max `attempts` calls */ }\nclass MetricsRepo implements Repo   { /* call inner.get; record one timing in finally */ }\n\nconst repo = new MetricsRepo(\n  new RetryRepo(\n    new CacheRepo(new HttpRepo(), new Map()),\n    3,\n  ),\n);","options":["metric 3 ครั้ง, HTTP 3 ครั้ง, ตรวจ cache 1 ครั้ง","metric 1 ครั้ง, HTTP 3 ครั้ง, ตรวจ cache 1 ครั้ง","metric 3 ครั้ง, HTTP 3 ครั้ง, ตรวจ cache 3 ครั้ง","metric 1 ครั้ง, HTTP 3 ครั้ง, ตรวจ cache 3 ครั้ง"],"answer":3,"why":["ผิด: `MetricsRepo` อยู่นอกสุดและถูกเรียกครั้งเดียว ส่วน cache อยู่ใน retry จึงถูกตรวจทุกรอบที่ retry","ผิด: นับ metric ถูก แต่ `CacheRepo` อยู่ภายใน `RetryRepo` ทุกครั้งที่ retry จะผ่าน cache ก่อนเสมอ","ผิด: นับ cache ถูก แต่ metric ถูกบันทึกครั้งเดียวเพราะ retry เกิดภายใน decorator ที่ห่ออยู่ข้างใน","ถูก: metric ห่อทั้งหมดจึงวัดหนึ่งครั้ง (รวมเวลา retry) ส่วน retry ห่อ cache ที่ห่อ HTTP แต่ละรอบจึงตรวจ cache แล้ว miss และยิง HTTP"],"explanation":"ลำดับการห่อ decorator กำหนดพฤติกรรม: call ไหลจากชั้นนอกเข้าใน `MetricsRepo` ทำงานหนึ่งครั้งต่อการเรียกจากภายนอก ส่วน `RetryRepo` เรียก `CacheRepo` สามรอบ แต่ละรอบ cache miss (เพราะรอบที่ล้มเหลวไม่ได้ใส่ค่า) จึงเรียก `HttpRepo` รวม 3 ครั้ง","info":"ถ้าต้องการวัด latency ของ HTTP แต่ละครั้งให้วาง metrics ไว้ใน retry (หรือมีทั้งสองชั้นด้วยชื่อ metric ต่างกัน) ส่วน cache มักวางไว้นอก retry เพื่อให้ cache hit ไม่ต้องผ่าน retry และ circuit breaker เลย Decorator ช่วยประกอบ cross-cutting concern ได้หลายแบบโดยไม่เกิด subclass explosion แต่ลำดับการประกอบควรอยู่ที่จุดเดียว (composition root/DI module) และมี test ยืนยัน","ref":"Gamma et al. — Design Patterns (Decorator)"},{"id":"OOP-06","competency":"oop","level":"advance","outline":"Optimize OOP code for performance and maintainability (e.g., avoiding overuse of inheritance, promoting composition)","question":"โค้ด Java ด้านล่าง (JDK 21) พิมพ์ค่าใด และเหตุผลใดถูกต้อง","codeLang":"java","code":"public class CountingSet\u003cE> extends HashSet\u003cE> {\n  private int addCount = 0;\n\n  @Override public boolean add(E e) { addCount++; return super.add(e); }\n\n  @Override public boolean addAll(Collection\u003c? extends E> c) {\n    addCount += c.size();\n    return super.addAll(c);\n  }\n  public int getAddCount() { return addCount; }\n}\n\nCountingSet\u003cString> s = new CountingSet\u003c>();\ns.addAll(List.of(\"a\", \"b\", \"c\"));\nSystem.out.println(s.getAddCount());","options":["`6` — `addAll` ที่สืบทอดจาก `AbstractCollection` เรียก `add()` ทีละตัว ซึ่ง dispatch ไปยัง `add` ที่ override","`3` — `super.addAll` ทำงานในบริบทของ superclass ทั้งหมด จึงเรียก `add` ของ `HashSet` แทน `add` ของ subclass","`3` — `HashSet.addAll` ใส่ข้อมูลลง `HashMap` ภายในโดยตรงแบบ bulk เพื่อความเร็ว จึงไม่ผ่าน method `add()`","`6` — `super.addAll` เรียก `addAll` ของ subclass ซ้ำอีกหนึ่งรอบผ่าน dynamic dispatch แล้วจึงหยุด"],"answer":0,"why":["ถูก: `AbstractCollection.addAll` วนเรียก `add(e)` บน `this` ซึ่งเป็น `CountingSet` จึงนับซ้ำอีก 3 รวมเป็น 6","ผิด: `super.` มีผลแค่การเลือก method ที่ถูกเรียกตรง ๆ การเรียก `add` ภายใน superclass ยังเป็น virtual call ที่ไปถึง override","ผิด: `HashSet` ไม่ได้ override `addAll` จึงใช้ implementation ของ `AbstractCollection` ที่เรียก `add()` ทีละตัว","ผิด: ตัวเลขถูกแต่เหตุผลผิด ถ้า `super.addAll` เรียก `addAll` ของ subclass จริงจะวน recursive ไม่สิ้นสุด"],"explanation":"นี่คือปัญหา fragile base class: subclass พึ่งรายละเอียดภายใน (self-use) ของ superclass ที่ไม่ได้เป็นสัญญา `addAll` ของ `HashSet` เรียก `add` ที่ถูก override จึงนับซ้ำ ทางแก้ที่ทนทานคือ composition: ห่อ `Set` ไว้ภายในแล้ว forward การเรียก (wrapper/decorator) แทนการ extends","info":"Effective Java แนะนำว่า class ที่ไม่ได้ออกแบบและจัดทำเอกสารเพื่อการ extends ควรประกาศ `final` (Kotlin ทำให้ class เป็น final โดย default ด้วยเหตุผลนี้) ถ้าจำเป็นต้องให้ extends ต้องระบุใน Javadoc ว่า method ใดเรียก method ที่ override ได้ (`@implSpec`) Guava มี `ForwardingSet` ช่วยเขียน wrapper แบบ composition ได้สั้น","ref":"Effective Java 3rd ed., Item 18 (Favor composition over inheritance) and Item 19"},{"id":"OOP-07","competency":"oop","level":"advance","outline":"Evaluate and select appropriate OOP paradigms in multi-paradigm environments and legacy systems","question":"service Java 21 รับผลจาก payment provider ที่มี 3 แบบปิดตายตามสัญญา: `Approved(txId)`, `Declined(reason)`, `Failed(cause, retryable)` ผลถูกส่งต่อใน `CompletableFuture` pipeline และทีมต้องการให้ compiler ฟ้องทุกจุดที่จัดการไม่ครบเมื่อมีแบบที่ 4 ในอนาคต โดยมี boilerplate น้อย ควรออกแบบอย่างไร","options":["abstract class `PaymentResult` กับ subclass 3 ตัว แล้วให้ caller แยกกรณีด้วย `if/else instanceof` ตามลำดับ","class เดียวที่มี enum `status` และ field `txId`, `reason`, `cause` ที่เป็น nullable ตามสถานะ","`sealed interface PaymentResult` กับ `record` 3 ตัว แล้วใช้ `switch` pattern matching ที่ไม่มี `default` ปิดท้าย","คืน `Approved` เป็นค่าปกติ และ throw checked exception แยกสำหรับกรณี `Declined` และ `Failed`"],"answer":2,"why":["ผิด: chain ของ `instanceof` ไม่มีการตรวจความครบถ้วน เมื่อเพิ่ม subclass ใหม่โค้ดจะตกไปที่ else โดยไม่มีใครเตือน","ผิด: enum ช่วยเรื่อง switch แต่ field nullable เปิดให้สร้างสถานะที่ผิดได้ เช่น `Approved` ที่ไม่มี `txId` และต้องตรวจ null เองทุกที่","ถูก: sealed hierarchy ทำให้ compiler รู้ชุดของ subtype ทั้งหมด `switch` ที่ไม่มี `default` จึง compile ไม่ผ่านเมื่อมีกรณีใหม่ ส่วน record ลด boilerplate","ผิด: ผลทางธุรกิจไม่ใช่ข้อผิดพลาด และ checked exception โยนจาก lambda ใน `CompletableFuture` ตรง ๆ ไม่ได้ ต้องห่อเป็น unchecked จนเสียการตรวจของ compiler"],"explanation":"เมื่อชุดของกรณีปิด (closed set) และสิ่งที่เปลี่ยนบ่อยคือ operation ที่ทำกับข้อมูล แนวทาง data-oriented ด้วย sealed interface + record + pattern matching เหมาะกว่า class hierarchy แบบเปิด เพราะ compiler ตรวจความครบถ้วน (exhaustiveness) ให้ทุกจุดที่ใช้","info":"นี่คือ expression problem: ถ้าชุดของชนิดเปิดและเพิ่มชนิดบ่อย polymorphism (method ในแต่ละ subclass) ดีกว่า ถ้าชุดของชนิดปิดแต่เพิ่ม operation บ่อย sealed + pattern matching ดีกว่า Java 21 รองรับ record pattern (`case Declined(var reason) ->`) และ guard (`when`) ใน switch ส่วน Kotlin ใช้ `sealed class` + `when` และ TypeScript ใช้ discriminated union + `never` check ได้ผลแบบเดียวกัน","ref":"JEP 409 (Sealed Classes); JEP 441 (Pattern Matching for switch); Brian Goetz — Data Oriented Programming in Java"},{"id":"TEST-01","competency":"testing","level":"intermediate","outline":"Ensure agreed unit test coverage thresholds are achieved and reported (e.g., via SonarQube)","question":"Quality Gate ของ SonarQube มีเงื่อนไข \"Coverage on New Code ≥ 80%\" PR หนึ่งมี new code ที่ lines to cover = 40, uncovered lines = 4, conditions to cover = 20 (10 boolean condition × true/false) และ uncovered conditions = 6 ค่า Coverage ที่ SonarQube รายงานและผลของ gate คือข้อใด","options":["90.0% ผ่าน เพราะ gate ใช้ line coverage เป็นค่าหลักในการตัดสิน","83.3% ผ่าน เพราะรวมจำนวนที่ cover ทั้ง line และ condition แล้วหารด้วยผลรวมทั้งหมด","80.0% ผ่าน เพราะเฉลี่ย line coverage กับ condition coverage แบบให้น้ำหนักเท่ากันสองส่วน","70.0% ไม่ผ่าน เพราะ gate ใช้ค่าที่ต่ำกว่าระหว่าง line กับ condition coverage"],"answer":1,"why":["ผิด: 90% คือ Line Coverage (36/40) ซึ่งเป็น metric แยก ส่วน metric \"Coverage\" ที่ gate ใช้รวม condition ด้วย","ถูก: Coverage = (covered conditions + covered lines) / (conditions to cover + lines to cover) = (14 + 36) / (20 + 40) = 83.3%","ผิด: SonarQube ไม่ได้เฉลี่ยสองเปอร์เซ็นต์ แต่ถ่วงน้ำหนักตามจำนวน line และ condition จริง","ผิด: 70% คือ Condition Coverage (14/20) ซึ่งเป็น metric แยก gate ไม่ได้เลือกค่าต่ำสุด"],"explanation":"metric \"Coverage\" ของ SonarQube ผสม line coverage และ condition coverage ตามสูตร (CT + CF + LC) / (2B + EL) เมื่อแทนค่าได้ (14 + 36) / 60 = 83.3% จึงผ่านเกณฑ์ 80% แม้ condition coverage อยู่ที่ 70%","info":"SonarQube ไม่ได้รัน test เอง แต่อ่าน report จาก tool (เช่น lcov ของ Jest, JaCoCo XML) ถ้าไม่ตั้ง path ของ report จะเห็น coverage 0% โดยค่า default ระบบจะไม่ใช้เงื่อนไข coverage/duplication กับ PR ที่มี new code น้อยกว่า 20 บรรทัด (`sonar.qualitygate.ignoreSmallChanges`) และไฟล์ที่ไม่ควรนับ (DTO ที่ generate, migration) ควรตัดด้วย `sonar.coverage.exclusions` แทนการเขียน test หลอก","ref":"SonarQube docs — Metric definitions (Coverage); Quality gates"},{"id":"TEST-02","competency":"testing","level":"intermediate","outline":"Identify and close gaps in existing test coverage to strengthen code reliability","question":"function และ test เดิมด้านล่างได้ line และ branch coverage ครบ แต่ mutation testing (Stryker) รายงาน mutant ที่รอดสองตัว คือ `>=` → `>` และ `&&` → `||` ควรเพิ่ม test case คู่ใดจึงฆ่า mutant ทั้งสองตัวได้","codeLang":"ts","code":"export function discount(total: number, isMember: boolean): number {\n  if (total >= 1000 && isMember) return total - 100;\n  return total;\n}\n\n// existing tests\nexpect(discount(1500, true)).toBe(1400);\nexpect(discount(500, false)).toBe(500);","options":["`discount(1000, true)` และ `discount(1500, false)`","`discount(999, false)` และ `discount(2000, true)`","`discount(1000, false)` และ `discount(500, true)`","`discount(1001, true)` และ `discount(1000, false)`"],"answer":0,"why":["ถูก: (1000, true) ได้ 900 แต่ mutant `>` ได้ 1000 จึงตาย และ (1500, false) ได้ 1500 แต่ mutant `||` ได้ 1400 จึงตาย","ผิด: ทั้งสองเคสให้ผลเท่ากันทั้งโค้ดจริงและ mutant ทั้งสองตัว (999 และ 1900) จึงไม่ฆ่า mutant ใดเลย","ผิด: ทั้งสองเคสฆ่า mutant `||` ได้ แต่ไม่มีเคสใดที่ `total = 1000` และ `isMember = true` จึง mutant `>` ยังรอด","ผิด: (1000, false) ฆ่า `||` ได้ แต่ (1001, true) ให้ 901 ทั้งโค้ดจริงและ mutant `>` จึง mutant `>` ยังรอด"],"explanation":"การฆ่า mutant ต้องมี input ที่ทำให้โค้ดจริงกับ mutant ให้ผลต่างกัน mutant `>` ต่างจาก `>=` เฉพาะที่ขอบ `total = 1000` เมื่อเงื่อนไขอื่นเป็นจริง ส่วน `||` ต่างจาก `&&` เมื่อเงื่อนไขย่อยตัวหนึ่งจริงและอีกตัวเท็จ คู่ (1000, true) และ (1500, false) ครอบทั้งสองกรณี","info":"coverage บอกแค่ว่าโค้ดถูกรัน ไม่ได้บอกว่า assertion จับความผิดได้ mutation score จึงเป็นตัววัดคุณภาพ test ที่ตรงกว่า แต่ใช้เวลารันนาน ควรรันแบบ incremental เฉพาะไฟล์ที่เปลี่ยนใน PR (Stryker `--incremental`, PIT สำหรับ Java มี history file) และใช้ boundary value analysis (ค่า ที่ขอบ, ขอบ ±1) ตั้งแต่ตอนเขียน test","ref":"Stryker Mutator docs; ISTQB — Boundary Value Analysis, MC/DC"},{"id":"TEST-03","competency":"testing","level":"intermediate","outline":"Apply mocking/stubbing strategies for external dependencies","question":"โปรเจกต์ใช้ Jest + ts-jest ที่ compile เป็น CommonJS ผลของ test ด้านล่างคือข้อใด","codeLang":"ts","code":"// pricing.ts\nexport function serviceFee(): number { return 5; }\nexport function total(amount: number): number { return amount + serviceFee(); }\n\n// pricing.test.ts\nimport * as pricing from './pricing';\n\ntest('uses mocked fee', () => {\n  jest.spyOn(pricing, 'serviceFee').mockReturnValue(20);\n  expect(pricing.total(100)).toBe(120);\n});","options":["ผ่าน เพราะ `jest.spyOn` แทนที่ `serviceFee` ใน module registry จึงมีผลกับทุกจุดที่เรียกใช้","Error `Cannot redefine property` เพราะ namespace ของ ES module แก้ไข property ไม่ได้ จึง spy ไม่ได้","ผ่าน แต่ mock จะค้างไปถึง test ถัดไปในไฟล์จนกว่าจะเรียก `mockRestore()` หรือเปิด `restoreMocks`","ล้มเหลว ได้ `105` เพราะ `total` เรียก `serviceFee` ผ่าน binding ภายใน module ไม่ใช่ผ่าน object `exports`"],"answer":3,"why":["ผิด: `spyOn` แทนที่ property `serviceFee` บน object `exports` เท่านั้น ไม่ได้แก้ function ที่ module อ้างถึงภายใน","ผิด: error นี้เกิดเมื่อ export ถูกนิยามเป็น getter (native ESM หรือ transformer บางตัว เช่น SWC) แต่ ts-jest แบบ CommonJS assign `exports.serviceFee = serviceFee` ธรรมดา จึง spy ได้","ผิด: ส่วนเรื่อง mock ค้างเป็นจริง แต่ test นี้ไม่ผ่านตั้งแต่แรกเพราะ `total` ไม่ได้เรียก mock","ถูก: หลัง compile `total` เรียก function `serviceFee` ใน scope ของ module ตรง ๆ จึงได้ 100 + 5 = 105 แม้ `pricing.serviceFee` ถูก spy แล้ว"],"explanation":"การ spy บน namespace import เปลี่ยนเฉพาะ property ของ object `exports` แต่การเรียกกันเองภายใน module ใช้ local binding ที่ไม่ผ่าน `exports` mock จึงไม่มีผล ผลลัพธ์คือ 105 และ test ล้มเหลว","info":"ทางแก้ที่ทนทานคือ dependency injection (ส่ง fee provider เข้า `total`) หรือแยก `serviceFee` ไปอีก module แล้ว `jest.mock()` module นั้น ใน native ESM ต้องใช้ `jest.unstable_mockModule` และ Vitest (`vi.spyOn`) มีข้อจำกัดเดียวกัน หลักทั่วไปคือ mock ที่ขอบของระบบ (HTTP, DB, clock) ไม่ใช่ function ภายใน module เดียวกัน","ref":"Jest docs — jest.spyOn, ES6 Class Mocks, ECMAScript Modules"},{"id":"TEST-04","competency":"testing","level":"advance","outline":"Establish metrics-driven quality governance (e.g., coverage %, defect leakage, test pass/fail trends)","question":"องค์กรมี 6 ทีมและใช้ gate \"coverage ≥ 80% on new code\" มาหนึ่งปี ทีม A มี coverage 92% แต่ defect leakage (bug ที่หลุดถึง production ต่อ bug ทั้งหมด) เพิ่มจาก 8% เป็น 21% และพบว่า test จำนวนมากเรียก method โดยไม่มี assertion ที่มีความหมาย ในฐานะผู้กำหนด quality governance ควรทำอย่างไร","options":["ขยับ gate ของทุกทีมเป็น 90% เพื่อบังคับให้ test ครอบคลุม code path มากขึ้น และลดจำนวน bug ที่หลุดไป production","ผูก KPI รายบุคคลกับ coverage % และ pass rate ของ pipeline เพื่อสร้างแรงจูงใจให้ทุกคนเขียน test มากขึ้น","จำแนก bug ที่หลุดตามระดับ test ที่ควรจับได้ ติดตาม mutation score ใน module สำคัญ ใช้ coverage เป็น floor","ยกเลิก coverage gate ทั้งหมด แล้วใช้ defect leakage ของแต่ละทีมเป็นเกณฑ์ block การ merge PR แทน"],"answer":2,"why":["ผิด: coverage สูงอยู่แล้วแต่ assertion อ่อน การดันตัวเลขขึ้นอีกจะได้ test แบบเดิมเพิ่มขึ้นโดย leakage ไม่ลด","ผิด: เมื่อ metric กลายเป็นเป้าหมายของบุคคล คนจะ optimize ตัวเลข (Goodhart's law) ซึ่งเป็นต้นเหตุของ test ไร้ assertion อยู่แล้ว","ถูก: ใช้ outcome metric (leakage) ชี้ว่าช่องว่างอยู่ที่ระดับไหน และใช้ mutation score วัดความแข็งแรงของ assertion ส่วน coverage ใช้กันไม่ให้โค้ดไม่มี test เลย","ผิด: defect leakage เป็น lagging metric ที่รู้ผลหลัง release วัดราย PR ไม่ได้ จึงใช้เป็น merge gate ไม่ได้"],"explanation":"ตัวเลข coverage บอกว่าโค้ดถูกรัน ไม่ได้บอกว่า test ตรวจผลถูก การ governance ที่ดีใช้ metric หลายชนิดคู่กัน: leakage และ root cause ของ bug ที่หลุดบอกว่าควรเสริม test ระดับใด mutation score บอกคุณภาพ assertion และ coverage เป็นเกณฑ์ขั้นต่ำ","info":"แยก leading indicator (mutation score, flaky rate, เวลา pipeline) ออกจาก lagging indicator (defect leakage, change failure rate ของ DORA, MTTR) และดูเป็น trend รายทีมไม่ใช่เทียบข้ามทีม การทำ escaped-defect review หลัง incident ที่ถามว่า \"test ระดับไหนควรจับได้\" ช่วยให้แต่ละทีมเห็นช่องว่างของตัวเองโดยไม่กลายเป็นการลงโทษ","ref":"Martin Fowler — TestCoverage; DORA — Four Key Metrics; Goodhart's law"},{"id":"TEST-05","competency":"testing","level":"advance","outline":"Optimize test efficiency by reducing redundancy, improving runtime, and ensuring maintainability","question":"integration test ของ service หนึ่งมี 400 test ใน 60 class แต่ละ class start PostgreSQL container ใหม่ด้วย Testcontainers และรัน migration (~12 วินาทีต่อครั้ง) ทำให้ CI ใช้เวลา 25 นาที ทีมต้องการให้ test ยังใช้ PostgreSQL จริงและข้อมูลแต่ละ test ไม่รบกวนกัน วิธีใดเหมาะที่สุด","options":["เปลี่ยนไปใช้ H2 in-memory ในโหมด PostgreSQL compatibility เพื่อตัดเวลา start container ทั้งหมด","ใช้ container เดียวต่อ test run รัน migration ครั้งเดียว แล้วแยกข้อมูลแต่ละ test ด้วย rollback/truncate","ให้ test ใช้ข้อมูลต่อเนื่องกันตามลำดับที่กำหนดด้วย `@Order` เพื่อไม่ต้อง seed ข้อมูลใหม่ซ้ำในแต่ละ test case","mock repository layer ใน integration test ทั้งหมด แล้วย้ายการตรวจ SQL ไปไว้ในขั้น code review แทน"],"answer":1,"why":["ผิด: H2 จำลอง dialect ได้ไม่ครบ (เช่น `jsonb`, `ON CONFLICT`, window/locking บางแบบ) test ผ่านแต่ production พังได้ ขัดกับเงื่อนไขที่ต้องใช้ PostgreSQL จริง","ถูก: ต้นทุนหลักคือ start container และ migration ซ้ำ 60 รอบ singleton container ตัดเหลือรอบเดียว ส่วน isolation ได้จาก rollback/truncate ต่อ test","ผิด: test ที่พึ่งลำดับจะ flaky และรันแยกหรือแบบขนานไม่ได้ ทำให้ maintain ยากขึ้นแทนที่จะดีขึ้น","ผิด: เมื่อ mock repository ก็ไม่ได้ทดสอบ integration กับ database อีกต่อไป และ code review ไม่ได้รัน SQL จริง"],"explanation":"singleton container pattern ของ Testcontainers ให้ทุก test class ใช้ database ตัวเดียวกันและ migrate ครั้งเดียว เวลาที่หายไปคือ 60 × 12 วินาทีโดยประมาณ ส่วนความเป็นอิสระของแต่ละ test ได้จากการ rollback transaction หลัง test หรือ truncate ตารางที่เกี่ยวข้อง","info":"rollback ต่อ test ใช้ไม่ได้เมื่อโค้ดที่ทดสอบ commit เองหรือทำงานใน thread อื่น (เช่น `@Async`, message listener) กรณีนั้นใช้ truncate หรือ PostgreSQL template database (`CREATE DATABASE t1 TEMPLATE migrated`) ซึ่งสร้าง DB ใหม่ได้ในระดับร้อยมิลลิวินาที สำหรับเครื่อง developer ใช้ reusable containers (`testcontainers.reuse.enable=true`) เพื่อไม่ต้อง start ใหม่ทุกครั้งที่รัน","ref":"Testcontainers docs — Singleton containers pattern; PostgreSQL docs — Template Databases"},{"id":"TEST-06","competency":"testing","level":"advance","outline":"Define and evolve unit testing strategy and coverage goals across teams or projects","question":"ระบบมี 8 microservice ดูแลโดย 4 ทีม E2E suite ใช้เวลา 2 ชั่วโมงและ flaky 15% จึงรันแค่ตอนกลางคืน incident ส่วนใหญ่เกิดจาก provider เปลี่ยน response (เช่นเปลี่ยนชื่อ `amount` เป็น `totalAmount`) แล้ว consumer พัง โดยรู้ตัวเมื่อขึ้น staging แล้ว ในฐานะผู้กำหนด test strategy ควรทำอย่างไร","options":["เพิ่ม consumer-driven contract test (เช่น Pact) ที่ provider verify ใน CI ก่อน merge และลด E2E เหลือ smoke test","เพิ่ม E2E test ให้ครอบคลุมทุก endpoint ของทุก service และย้ายมารันในทุก PR บน environment ที่ทุกทีมใช้ร่วมกัน","ให้ consumer เขียน stub response ของ provider เองใน unit test และบังคับ coverage 90% ในทุก repository","ให้ consumer generate client จาก OpenAPI spec ของ provider และถือว่า build ที่ผ่านคือหลักฐานว่า service เข้ากันได้"],"answer":0,"why":["ถูก: contract ที่ consumer ประกาศว่าใช้ field ใดถูก verify กับ provider ใน pipeline ของ provider การเปลี่ยนชื่อ field จึงล้มก่อน merge โดยไม่ต้องพึ่ง environment ร่วม","ผิด: เพิ่มเวลาและความ flaky ของ suite ที่เป็นปัญหาอยู่แล้ว และ environment ร่วมทำให้ PR หลายทีมรบกวนกัน","ผิด: stub ที่ consumer เขียนเองไม่ถูกตรวจกับ provider จริง เมื่อ provider เปลี่ยน stub ก็ยังผ่าน (stub drift)","ผิด: build ของ consumer ใช้ spec ณ เวลาที่ generate และไม่ได้ทำให้ pipeline ของ provider ล้มเมื่อเปลี่ยน field ที่ consumer ที่ deploy อยู่ยังใช้"],"explanation":"ปัญหาคือ compatibility ระหว่าง service ถูกตรวจช้าเกินไปและในที่ที่แพงเกินไป consumer-driven contract testing ย้ายการตรวจนั้นมาอยู่ใน CI ของ provider ก่อน merge ทำให้ E2E ลดบทบาทเหลือการยืนยัน journey สำคัญไม่กี่เส้นที่ไม่ flaky","info":"Pact Broker/PactFlow มี `can-i-deploy` ตรวจว่า version ของ consumer และ provider ที่จะ deploy เข้ากันได้ตาม matrix ของ environment ส่วน bi-directional contract testing ใช้ OpenAPI ของ provider เทียบกับ pact ของ consumer ได้ สำหรับทีมที่มี spec อยู่แล้ว เกณฑ์ coverage ควรกำหนดต่อระดับของ test (unit, contract, E2E) ไม่ใช่ตัวเลขเดียวของทั้งระบบ","ref":"Pact docs — Consumer-driven contracts, can-i-deploy; Martin Fowler — ContractTest"},{"id":"CTR-01","competency":"container","level":"intermediate","outline":"Apply security policies in container image","question":"pipeline build image ของ Node.js service ต้องใช้ token ดึง package จาก private registry ระหว่าง `npm ci` และ pipeline รัน `docker buildx build --cache-to type=registry,mode=max` ซึ่ง export cache ของทุก stage ขึ้น registry ด้วย วิธีใดทำให้ token ไม่ไปปรากฏทั้งใน image layer, image history และ build cache","options":["ส่ง token ด้วย `--build-arg` แล้วสร้างและลบ `.npmrc` ภายใน `RUN` คำสั่งเดียวกัน","ใช้ `RUN --mount=type=secret,id=npmrc` ให้ `.npmrc` มีอยู่เฉพาะระหว่างคำสั่ง `npm ci`","ตั้ง `ENV NPM_TOKEN` ใน stage builder แล้ว `COPY --from=builder` เฉพาะ `dist` ไป stage สุดท้าย","`COPY .npmrc` เข้า image ก่อน `npm ci` แล้วลบด้วย `RUN rm .npmrc` ในบรรทัดถัดไป"],"answer":1,"why":["ผิด: แม้ไฟล์ถูกลบใน layer เดียวกัน ค่า build arg ที่ `RUN` ใช้ถูกบันทึกใน image history/metadata ดูได้ด้วย `docker history`","ถูก: secret mount ถูก mount เป็น tmpfs เฉพาะตอนคำสั่งนั้นรัน ไม่ถูกเขียนลง layer, history หรือ build cache","ผิด: image สุดท้ายสะอาดก็จริง แต่ `mode=max` export layer ของ stage builder ที่มี ENV token ขึ้น registry cache ด้วย","ผิด: `COPY` สร้าง layer ที่มีไฟล์อยู่แล้ว การลบใน layer ถัดไปแค่ซ่อนไฟล์ ยังแกะออกจาก layer เดิมได้"],"explanation":"BuildKit secret mount ส่งค่าลับเข้าเฉพาะคำสั่ง `RUN` ที่ประกาศ mount โดยไม่ persist ลง filesystem ของ layer และไม่อยู่ใน history หรือ cache จึงเป็นวิธีที่ Docker แนะนำสำหรับ credential ระหว่าง build ส่วน build arg และ ENV ถูกบันทึกไว้ใน metadata ของ image หรือ cache","info":"ใน CI ส่ง secret ด้วย `docker buildx build --secret id=npmrc,src=$HOME/.npmrc` (หรือ `env=NPM_TOKEN`) ได้ และ Docker build checks มีกฎ `SecretsUsedInArgOrEnv` เตือนเมื่อชื่อ ARG/ENV ดูเหมือน secret; ถ้า token เคยหลุดลง layer แล้ว การ rebuild ไม่พอ ต้อง revoke/rotate token และใช้ `trivy image --scanners secret` ตรวจ image เก่าที่ค้างใน registry","ref":"Docker Docs: Build secrets; Dockerfile reference (ARG); Build checks"},{"id":"CTR-02","competency":"container","level":"intermediate","outline":"Implement advanced networking and storage","question":"จาก `compose.yaml` ด้านล่าง `api` ได้ `ECONNREFUSED` ตอนต่อ database ขณะที่ทีม security กำหนดว่า database ต้องไม่ถูกเข้าถึงได้จาก network ของ host ควรแก้อย่างไร","code":"services:\n  api:\n    build: .\n    environment:\n      DB_HOST: localhost\n      DB_PORT: \"5432\"\n  db:\n    image: postgres:16\n    ports:\n      - \"5432:5432\"","codeLang":"yaml","options":["ตั้ง `DB_HOST=host.docker.internal` ให้ `api` แล้วคง `ports: 5432:5432` ของ `db` ไว้ตามเดิม","ตั้ง `network_mode: host` ให้ `api` เพื่อให้ `localhost:5432` ชี้ไปยัง port ที่ `db` publish ไว้","ใช้ IP ของ container `db` จาก `docker inspect` เป็น `DB_HOST` แล้วลบ `ports` ของ `db` ออก","ตั้ง `DB_HOST=db` ให้ resolve ผ่าน DNS ของ network ที่ compose สร้าง แล้วลบ `ports` ของ `db`"],"answer":3,"why":["ผิด: ต่อได้บน Docker Desktop แต่ DB ยัง publish ออก host ซึ่งขัดข้อกำหนด และ `host.docker.internal` ไม่มีให้โดยปริยายบน Linux","ผิด: ยังต้องพึ่งการ publish port ของ `db` ออก host จึงขัดข้อกำหนด และ `api` เสีย network isolation ไปด้วย","ผิด: IP ของ container เปลี่ยนได้เมื่อ container ถูกสร้างใหม่ config ที่อิง IP จึงพังในการ deploy ครั้งถัดไป","ถูก: service ใน network เดียวกันเรียกกันด้วยชื่อ service ผ่าน embedded DNS ได้โดยไม่ต้อง publish port ออก host"],"explanation":"`localhost` ใน container หมายถึงตัว container เอง Compose สร้าง user-defined network ให้และ service ค้นหากันด้วยชื่อ service ได้ ส่วน `ports` มีไว้เปิดให้ host/ภายนอกเข้าถึง จึงลบได้โดย `api` ยังต่อ `db:5432` ได้","info":"port ที่ใช้ระหว่าง container คือ container port (`5432`) ไม่ใช่ host port ที่ map ไว้; ถ้า dev ต้องต่อ DB จากเครื่องจริง ให้ bind เฉพาะ loopback เช่น `127.0.0.1:5432:5432` เพราะ `5432:5432` bind ทุก interface และ Docker เขียน iptables rule ที่ข้าม firewall อย่าง `ufw` ได้; ใช้ `depends_on` กับ `condition: service_healthy` เพื่อรอให้ DB พร้อมจริง","ref":"Docker Docs: Networking in Compose; Packet filtering and firewalls"},{"id":"CTR-03","competency":"container","level":"advance","outline":"Establish container governance frameworks via policy enforcement, logging standards (e.g., Fluentd, ELK), and image scanning (e.g., Trivy)","question":"องค์กรมี Kubernetes หลาย cluster และต้องการให้ทุก workload ใช้ image ที่ผ่าน Trivy scan (ไม่มี CRITICAL) จาก pipeline กลาง แต่ปัจจุบัน developer บางคน build แล้ว push จากเครื่องตัวเองขึ้น registry เดียวกันได้ ข้อใดบังคับใช้ policy ที่ปิดช่องนี้ได้","options":["เพิ่ม `trivy image --exit-code 1 --severity CRITICAL` เป็น step บังคับใน pipeline กลางของทุก repo","เปิด scan-on-push ของ registry และส่ง alert เข้า channel ของทีมเมื่อพบช่องโหว่ระดับ CRITICAL","ให้ pipeline sign image และ attestation หลัง scan ผ่าน แล้วใช้ admission policy ตรวจ signature","เปิด Pod Security Admission ระดับ `restricted` ทุก namespace เพื่อบังคับ securityContext ของ pod"],"answer":2,"why":["ผิด: บังคับได้เฉพาะ image ที่ผ่าน pipeline image ที่ push ตรงจากเครื่อง developer ข้าม step นี้ไปได้","ผิด: เป็น detective control ที่แจ้งเตือนหลัง push แต่ไม่หยุด image นั้นไม่ให้ถูก deploy","ถูก: cluster รับเฉพาะ image ที่มี signature/attestation จาก identity ของ pipeline กลาง image ที่ push เองจึงถูก reject ตอน admission","ผิด: PSA คุม privilege ของ pod เช่นรันเป็น root หรือ hostPath แต่ไม่รู้ว่า image มาจากไหนหรือผ่าน scan หรือไม่"],"explanation":"จุดบังคับที่ข้ามไม่ได้คือ admission ของ cluster: ใช้ Kyverno `verifyImages` หรือ Sigstore policy-controller ตรวจ cosign signature และ attestation ของผล scan ที่ pipeline กลางออกให้ จึงผูก 'ผ่าน scan' เข้ากับ 'อนุญาตให้รัน' ได้จริง","info":"อ้าง image ด้วย digest (`@sha256:...`) แทน tag เพราะ tag ถูกย้ายได้หลัง sign; เริ่ม policy ในโหมด audit ก่อน enforce เพื่อดูว่า workload ใดจะพัง; scan image ที่รันอยู่ซ้ำตามรอบเพราะ CVE ใหม่ถูกประกาศหลัง build ได้ และจำกัดสิทธิ์ push ของ registry ให้เฉพาะ identity ของ pipeline เป็นอีกชั้น","ref":"Kyverno verifyImages; Sigstore cosign/policy-controller; Kubernetes Pod Security Admission"},{"id":"CICD-01","competency":"cicd","level":"intermediate","outline":"Design CI/CD workflows for multiple environments and deployment targets using Azure DevOps pipelines with environment-specific configs","question":"ทีมใช้ Azure DevOps YAML pipeline deploy service เดียวไป `dev`, `uat` และ `prod` โดยต้องการ (1) artifact ที่ขึ้น prod เป็นตัวเดียวกับที่ผ่านการทดสอบใน uat (2) prod มีผู้อนุมัติที่ developer แก้ YAML ข้ามไม่ได้ (3) config และ secret แยกตาม environment การออกแบบใดตรงทั้งสามข้อ","options":["build ครั้งเดียวแล้ว publish artifact; stage deploy เป็น `deployment` job ผูก `environment` ที่มี approvals และใช้ variable group แยกต่อ env","build ใหม่ในทุก stage โดยฝัง config ของ env ลง artifact ตอน build และใส่ `condition` ให้ stage prod รันเฉพาะเมื่อ branch เป็น `main`","build ครั้งเดียวแล้ว publish artifact; ประกาศรายชื่อผู้อนุมัติไว้ใน YAML ของ stage prod และใช้ variable group เดียวที่มีค่า config ครบทุก env","แยก pipeline ต่อ environment ให้ trigger จาก branch `develop`, `release` และ `main` โดยแต่ละ pipeline build และ deploy เองทั้งหมด"],"answer":0,"why":["ถูก: build once/promote ทำให้ artifact เดียวกันไหลผ่านทุก env, approvals อยู่บน Environment ที่ owner ของ resource คุม และ variable group แยกค่าแต่ละ env","ผิด: build ซ้ำทำให้ artifact ของ prod ไม่ใช่ตัวที่ทดสอบใน uat และ `condition` ใน YAML ไม่ใช่การอนุมัติ developer แก้เองได้","ผิด: approvals ของ Azure Pipelines ตั้งบน resource อย่าง Environment ไม่ได้เขียนใน YAML และ variable group เดียวทำให้ stage ล่างเห็น secret ของ prod","ผิด: แต่ละ branch build artifact ของตัวเอง จึงไม่ใช่ตัวเดียวกับที่ผ่าน uat และยังไม่มีจุดอนุมัติที่บังคับได้"],"explanation":"Azure Pipelines ผูก approvals and checks ไว้กับ resource เช่น Environment, service connection หรือ variable group และประเมินก่อน stage ที่อ้าง resource นั้นเริ่มรัน รวมกับหลัก build once, deploy many ที่ promote artifact เดิมข้าม env จึงครบทั้งสามข้อ","info":"variable group ลิงก์กับ Azure Key Vault ได้ จึงเก็บ secret ของแต่ละ env ไว้ใน vault แยกกันแล้วให้ pipeline ดึงตอนรัน; ค่าที่ต่างกันตาม env ควร inject ตอน deploy (เช่น App Settings หรือ ConfigMap) ไม่ฝังลง artifact; deployment job ยังเก็บประวัติการ deploy ต่อ environment ให้ย้อนดูได้ว่า commit ใดขึ้น prod เมื่อไร","ref":"Microsoft Learn: Azure Pipelines – Approvals and checks; Deployment jobs; Variable groups"},{"id":"CLD-01","competency":"cloud","level":"intermediate","outline":"Apply security best practices (e.g., IAM roles, encryption) and SLA principles for compliance alignment","question":"request ของผู้ใช้ต้องผ่าน 3 ส่วนแบบอนุกรม คือ web app (SLA 99.95%), managed database (SLA 99.99%) และ payment API ของผู้ให้บริการภายนอก (SLA 99.9%) โดยไม่มีทางสำรองหากส่วนใดล่ม SLA รวมโดยประมาณของเส้นทางนี้คือเท่าใด (คิดเดือนละ 30 วัน)","options":["99.9% (downtime ราว 43 นาทีต่อเดือน) ตาม component ที่ SLA ต่ำที่สุดในเส้นทาง","ประมาณ 99.95% (downtime ราว 23 นาทีต่อเดือน) จากค่าเฉลี่ย SLA ของทั้งสามส่วน","ประมาณ 99.84% (downtime ราว 69 นาทีต่อเดือน) จากผลคูณ SLA ของทั้งสามส่วน","ประมาณ 99.94% (downtime ราว 26 นาทีต่อเดือน) โดยไม่นับ API ภายนอกที่อยู่นอกความดูแลของเรา"],"answer":2,"why":["ผิด: ค่าต่ำสุดเป็นแค่เพดานบน เมื่อต่ออนุกรม โอกาสล่มของทุกส่วนสะสมกัน SLA รวมจึงต่ำกว่าส่วนที่แย่ที่สุด","ผิด: ค่าเฉลี่ยไม่มีความหมายทางความน่าจะเป็น ระบบอนุกรมใช้งานได้เมื่อทุกส่วนใช้งานได้พร้อมกัน","ถูก: 0.9995 × 0.9999 × 0.999 ≈ 0.9984 จึงยอมให้ล่มราว 0.16% ของ 43,200 นาที ≈ 69 นาที","ผิด: ผู้ใช้เห็นระบบล่มเมื่อ API ภายนอกล่มเช่นกัน dependency ที่อยู่ใน critical path ต้องนำมาคิดรวมด้วย"],"explanation":"เมื่อทุกส่วนต้องทำงานพร้อมกัน (serial dependency) และสมมติว่าล่มอย่างอิสระต่อกัน composite SLA คือผลคูณของ SLA แต่ละส่วน ได้ ≈ 99.84% ซึ่งต่ำกว่าส่วนที่แย่ที่สุด (99.9%)","info":"จึงสัญญา SLA 99.9% กับลูกค้าไม่ได้ถ้ายังเรียก payment API แบบ synchronous; ทางเลือกคือเอาส่วนนั้นออกจาก critical path (รับ order แล้วประมวลผล payment แบบ async ผ่าน queue) หรือมีทางสำรอง ซึ่งส่วนที่ขนานกันคิดเป็น 1 − (1−A)(1−B) เช่นสอง region ที่ 99.95% ได้ ≈ 99.99997% ก่อนหักเวลา failover; SLA คือสัญญาชดเชย service credit ไม่ใช่การรับประกันว่าจะไม่ล่ม","ref":"Azure Well-Architected Framework – Reliability: composite SLA"},{"id":"CLD-02","competency":"cloud","level":"intermediate","outline":"Interpret and distinguish managed services and pricing models and evaluate pricing models based on usage","question":"ต้องเลือกรูปแบบการคิดราคา compute ให้ต้นทุนต่ำสุดโดยยังรักษาข้อกำหนดของ 3 งาน: (A) งานคำนวณที่ใช้ CPU เกือบเต็มตลอด 24 ชั่วโมงและจะใช้อีกอย่างน้อย 3 ปี หยุดกลางคันไม่ได้ (B) API ภายในที่ถูกเรียกวันละไม่กี่ร้อยครั้ง แต่ละครั้งใช้เวลาไม่ถึง 1 วินาที (C) งาน render วิดีโอที่ใช้หลายชั่วโมงต่องาน มี checkpoint และ retry ได้เมื่อเครื่องถูกเรียกคืน ข้อใดจับคู่เหมาะสมที่สุด","options":["A: Spot instance ร่วมกับ auto-scaling, B: Serverless function, C: Reserved instance 1 ปี","A: On-demand instance, B: Serverless function, C: Reserved instance 3 ปี","A: Reserved/Savings Plan 3 ปี, B: On-demand VM ขนาดเล็กเปิดตลอด, C: Spot instance","A: Reserved/Savings Plan 3 ปี, B: Serverless function, C: Spot instance"],"answer":3,"why":["ผิด: A หยุดกลางคันไม่ได้จึงไม่เหมาะกับ Spot ที่ถูกเรียกคืนได้ และ C ไม่ได้รันต่อเนื่องจึงไม่คุ้มกับการผูก reserved","ผิด: A ใช้เต็มต่อเนื่องหลายปี การจ่าย on-demand แพงกว่าราคาแบบ commitment มาก และ C ไม่ได้รันตลอดจึงเสียเงิน reserved ช่วงว่าง","ผิด: VM ที่เปิดตลอดจ่ายตามชั่วโมงแม้ไม่มี request ขณะที่ B ใช้งานจริงรวมกันไม่กี่นาทีต่อวัน serverless ที่คิดตามการเรียกจึงถูกกว่า","ถูก: งานคงที่ระยะยาวคุ้มกับ commitment, งานนาน ๆ ครั้งคุ้มกับ pay-per-use และงานที่ทน interruption ได้คุ้มกับส่วนลดของ Spot"],"explanation":"เลือกโมเดลราคาตามรูปแบบการใช้งาน: utilization สูงและคาดการณ์ได้ใช้ Reserved/Savings Plan, การใช้งานเป็นช่วงสั้นและเบาบางใช้ serverless ที่ไม่มีค่าใช้จ่ายตอน idle และงานที่ถูก interrupt ได้ใช้ Spot ซึ่งลดราคาได้สูงสุดราว 90% เมื่อเทียบ on-demand","info":"serverless ไม่ได้ถูกกว่าในทุก load: เมื่อ traffic สูงและสม่ำเสมอ ค่า per-request และ GB-second อาจแพงกว่า container หรือ VM ที่ใช้เต็ม จึงควรหาจุดคุ้มทุนจาก usage จริง; AWS แจ้งก่อนเรียกคืน Spot 2 นาที ส่วน Azure Spot VM ราว 30 วินาที งานจึงต้อง checkpoint ได้; Savings Plan ยืดหยุ่นกว่า Reserved Instance เพราะผูกยอดใช้จ่ายต่อชั่วโมงแทนการผูก instance type","ref":"AWS: EC2 pricing models, Spot interruption notices; Azure: Spot VMs, Reservations, Savings plan"},{"id":"CLD-03","competency":"cloud","level":"advance","outline":"Evaluate trade-offs in cloud service choices based on scalability, cost, and performance","question":"API แบบ serverless (function รันขนานได้สูงสุด 1,000 instance) ต่อ PostgreSQL แบบ managed ที่ตั้ง `max_connections` ไว้ 400 เมื่อ traffic พุ่งพบ error `too many connections` และ latency สูง ทั้งที่ CPU ของ database ยังว่าง การแก้ใดตรงต้นเหตุและคุ้มที่สุด","options":["ใส่ connection pooler แบบ managed (เช่น RDS Proxy) คั่นกลาง และจำกัด concurrency ของ function ให้สัมพันธ์กับ DB","ขยาย instance ของ database ให้รองรับ `max_connections` ได้อย่างน้อยเท่ากับ concurrency สูงสุดของ function","เปิด connection ใหม่ตอนเริ่มทุก invocation และปิดทันทีเมื่อจบ เพื่อไม่ให้ instance ที่ idle ถือ connection ค้าง","เปิด provisioned concurrency ให้ function เพื่อให้มี instance อุ่นพร้อมรับ traffic และลด cold start ช่วง peak"],"answer":0,"why":["ถูก: pooler multiplex connection จำนวนมากจาก function ลงบน connection จริงจำนวนน้อย และ concurrency limit กันไม่ให้ burst ทะลุขีดที่ DB รับได้","ผิด: แต่ละ connection ของ PostgreSQL เป็น process ที่กิน memory การ scale ขึ้นเพื่อรองรับ connection จ่ายแพงทั้งที่ CPU ยังว่าง และ burst ที่ใหญ่กว่าก็ทะลุอีก","ผิด: ยังต้องใช้หนึ่ง connection ต่อ invocation ที่รันพร้อมกัน จึงชนเพดาน 400 เหมือนเดิม และเพิ่มต้นทุน TLS handshake/auth ทุก request","ผิด: แก้ cold start ไม่ใช่จำนวน connection และ instance ที่อุ่นไว้ยังถือ connection ของตัวเองเพิ่มขึ้นอีก"],"explanation":"ต้นเหตุคือ serverless scale เป็น instance แยกกันจำนวนมากและแต่ละตัวถือ connection ของตัวเอง ขณะที่ PostgreSQL รับ connection ได้จำกัด connection pooler (RDS Proxy, PgBouncer) จึงตัดความสัมพันธ์ 1:1 ระหว่าง instance กับ DB connection ส่วน concurrency limit คุมแรงกระแทกที่เหลือ","info":"pooler แบบ transaction pooling ใช้ session state ข้าม transaction ได้จำกัด เช่น `SET`, advisory lock หรือ temp table; RDS Proxy จะ 'pin' connection เมื่อเจอ session state ทำให้ multiplex ไม่ได้ ควรเฝ้าดู metric `DatabaseConnectionsCurrentlySessionPinned`; อีกทางเลือกคือ data API แบบ HTTP ที่ function ไม่ต้องถือ connection เลย","ref":"AWS: Amazon RDS Proxy; PgBouncer documentation (pool modes)"},{"id":"SEC-01","competency":"appsec","level":"intermediate","outline":"Implement comprehensive security measures across components (e.g., encryption, JWT-based auth, audit logging)","question":"service ได้รับ access token แบบ JWT ที่ IdP ขององค์กร sign ด้วย `RS256` โดย IdP เดียวกันนี้ออก token ให้แอปอื่นอีกหลายตัว การตรวจ token ใน service ข้อใดครบและปลอดภัยที่สุด","options":["ตรวจ signature ด้วยอัลกอริทึมตาม `alg` ใน header ของ token ใช้ key จาก JWKS ตาม `kid` และตรวจ `exp`","ตรวจ signature ด้วย `RS256` และ `exp` ก็เพียงพอ เพราะ IdP ที่ออก token เป็นของเราและเชื่อถือได้","กำหนด `algorithms: ['RS256']` ตรวจ signature ด้วย key จาก JWKS ตาม `kid` และตรวจ `iss`, `aud`, `exp`","ให้ gateway ตรวจ `exp` แล้ว service อ่าน role จาก payload ด้วย `jwt.decode` ต่อได้ทันทีโดยไม่ตรวจซ้ำ"],"answer":2,"why":["ผิด: เชื่อ `alg` จาก token เปิดช่อง algorithm confusion เช่น `none` หรือเปลี่ยนเป็น `HS256` แล้วใช้ public key เป็น HMAC secret และยังไม่ตรวจ `aud`","ผิด: token ที่ IdP เดียวกันออกให้แอปอื่นก็ผ่าน signature และ `exp` ได้ ถ้าไม่ตรวจ `aud` service จะรับ token ที่ไม่ได้ออกให้ตัวเอง","ถูก: allowlist อัลกอริทึม ใช้ key ที่ถูกต้องตาม `kid` และตรวจผู้ออก ผู้รับ และอายุ ครบตามที่ RFC 8725 แนะนำ","ผิด: `jwt.decode` ไม่ตรวจ signature และ gateway ตรวจแค่ `exp` ใครก็ปลอม payload ที่มี role ใดก็ได้"],"explanation":"JWT Best Current Practices (RFC 8725) ให้ผู้รับกำหนดอัลกอริทึมที่ยอมรับเอง ไม่ใช้ตาม header ของ token และต้องตรวจ `iss` กับ `aud` ให้ตรงกับที่คาดไว้ เพื่อกัน token ที่ออกให้ระบบอื่นถูกนำมาใช้ซ้ำ (token substitution)","info":"cache JWKS ไว้และ refresh เมื่อเจอ `kid` ที่ไม่รู้จัก (พร้อม rate limit) เพื่อรองรับ key rotation ของ IdP; เผื่อ clock skew ไม่กี่สิบวินาทีตอนตรวจ `exp`/`nbf`; ใช้ access token อายุสั้น (5–15 นาที) เพราะ JWT ที่ออกไปแล้ว revoke โดยตรงไม่ได้ และอย่าใส่ข้อมูลลับใน payload เพราะเป็นแค่ base64url ที่ใครก็อ่านได้","ref":"RFC 8725 JSON Web Token Best Current Practices; RFC 7519"},{"id":"SEC-02","competency":"appsec","level":"intermediate","outline":"Develop advanced authentication and authorization systems such as role-based access control and multi-factor authentication (e.g., OAuth 2.0, SAML)","question":"ทีมกำลังทำ SPA (React) และ mobile app ที่ต้องเรียก API แทนผู้ใช้ผ่าน IdP ที่รองรับ OAuth 2.0/OpenID Connect ควรใช้ flow ใดตาม OAuth 2.0 Security Best Current Practice (RFC 9700)","options":["Implicit grant เพราะ SPA และ mobile เก็บ client secret ไม่ได้ จึงรับ token จาก redirect โดยตรง","Authorization Code ร่วมกับ PKCE แบบ `S256` โดยลงทะเบียนแอปเป็น public client ที่ไม่มี secret","Authorization Code แบบใช้ client secret ที่ฝังไว้ใน bundle ของ SPA และใน binary ของ mobile app","Resource Owner Password Credentials ให้ฟอร์ม login ของแอปเองส่ง username/password ไปแลก token"],"answer":1,"why":["ผิด: RFC 9700 ระบุว่าไม่ควรใช้ implicit grant เพราะ token อยู่ใน URL หลุดผ่าน history/referrer ได้ และไม่มีกลไกผูก token กับ client","ถูก: PKCE ผูก authorization code กับ `code_verifier` ที่มีเฉพาะแอปที่เริ่ม flow แม้ code ถูกดักไปก็แลก token ไม่ได้ และไม่ต้องมี secret ฝั่ง client","ผิด: secret ที่ฝังใน JavaScript หรือ binary ถูกแกะออกได้ จึงไม่ใช่ความลับ แอปประเภทนี้เป็น public client","ผิด: RFC 9700 กำหนดว่าห้ามใช้ password grant เพราะแอปเห็นรหัสผ่านโดยตรง และใช้ร่วมกับ MFA หรือ federated login ไม่ได้"],"explanation":"สำหรับ public client RFC 9700 กำหนดให้ใช้ Authorization Code พร้อม PKCE (`code_challenge_method=S256`) แทน implicit และ password grant เพื่อกัน authorization code interception และ injection","info":"สำหรับ SPA แนวทาง OAuth 2.0 for Browser-Based Applications แนะนำ Backend-for-Frontend (BFF) ที่เก็บ token ฝั่ง server ให้ browser ถือแค่ session cookie แบบ `HttpOnly; Secure; SameSite` เพื่อลดผลกระทบจาก XSS; ฝั่ง mobile ให้ login ผ่าน system browser (ASWebAuthenticationSession / Custom Tabs) ตาม RFC 8252 แทน embedded WebView และใช้ refresh token rotation สำหรับ public client","ref":"RFC 9700 OAuth 2.0 Security Best Current Practice; RFC 7636 (PKCE); RFC 8252"},{"id":"SEC-03","competency":"appsec","level":"intermediate","outline":"Secure API with input validation, rate limiting, and token-based auth (e.g., API Gateway with WAF)","question":"API `GET /api/invoices/{invoiceId}` อยู่หลัง API Gateway ที่มี WAF, rate limit และตรวจ JWT แล้ว แต่ผู้ทดสอบพบว่าผู้ใช้ที่ login แล้วเปลี่ยน `invoiceId` เป็นของบริษัทอื่นและเห็นข้อมูลได้ ข้อใดแก้ที่ต้นเหตุ","options":["ใน service ตรวจทุกครั้งว่า invoice ที่ query ได้เป็นของ tenant ตาม claim ใน token ก่อนคืนข้อมูล","เปลี่ยน `invoiceId` จากเลขเรียงเป็น UUID v4 เพื่อให้ผู้โจมตีเดา id ของบริษัทอื่นไม่ได้","ลด rate limit ต่อผู้ใช้และเพิ่ม WAF rule ตรวจจับ pattern การไล่เปลี่ยน id ที่ผิดปกติ","เพิ่ม scope `invoice:read` ใน token และให้ gateway ตรวจ scope นี้ก่อน forward request ไปยัง service"],"answer":0,"why":["ถูก: นี่คือ Broken Object Level Authorization (OWASP API1:2023) ต้องตรวจสิทธิ์ระดับ object ทุก request ณ จุดที่รู้ว่า object เป็นของใคร","ผิด: ทำให้เดายากขึ้นแต่ไม่ใช่ authorization id ที่หลุดผ่าน log, URL ที่แชร์ หรือ API อื่นยังเปิดข้อมูลได้","ผิด: ชะลอการไล่ id ได้บ้าง แต่ request เดียวที่ใช้ id ที่ถูกต้องก็ยังเห็นข้อมูลของบริษัทอื่น","ผิด: scope ตรวจว่าเรียก function นี้ได้หรือไม่ (function level) แต่ไม่ได้ตรวจว่า invoice ใบนั้นเป็นของผู้เรียก"],"explanation":"Gateway ไม่รู้ว่า invoice แต่ละใบเป็นของใคร การตรวจ ownership จึงต้องอยู่ใน service/data layer เช่น query ด้วย `WHERE id = :id AND tenant_id = :tenantFromToken` หรือ policy check ก่อนคืน object","info":"ทำให้ข้ามไม่ได้ด้วยการใส่ tenant filter ไว้ใน repository/base query หรือใช้ PostgreSQL Row-Level Security แทนการพึ่งให้ทุก endpoint จำเอง; ตอบ `404` แทน `403` เมื่อ object ไม่ใช่ของผู้เรียกเพื่อไม่ยืนยันว่า id นั้นมีอยู่; และเขียน automated test ที่ใช้ token ของ tenant A เรียก object ของ tenant B ในทุก endpoint","ref":"OWASP API Security Top 10 2023 – API1 Broken Object Level Authorization"},{"id":"SEC-04","competency":"appsec","level":"advance","outline":"Design zero-trust security architectures with identity-first access control","question":"service ภายในหลายสิบตัวรันใน private network และเชื่อใจกันเพราะอยู่หลัง firewall/VPN เดียวกัน เหตุการณ์ล่าสุดพบว่าผู้โจมตีที่ยึด pod หนึ่งได้เรียก API ภายในได้ทุกตัว แนวทางใดสอดคล้องกับ zero trust architecture (NIST SP 800-207) มากที่สุด","options":["บังคับ MFA ตอนเชื่อม VPN และแยก VLAN ตามทีม เพื่อให้ขอบเขตเครือข่ายของแต่ละทีมแคบลง","ให้ทุก service ใช้ API key ร่วมกันหนึ่งชุดที่ rotate ทุกเดือน และตรวจ key ก่อนรับทุก request","เปิด TLS ให้ทุก service โดยฝั่ง server แสดง certificate และเข้ารหัส traffic ภายในทั้งหมด","ให้แต่ละ workload มี identity แยกผ่าน mTLS และ policy อนุญาตเฉพาะคู่ caller→callee ที่จำเป็น"],"answer":3,"why":["ผิด: ยังให้สิทธิ์ตามตำแหน่งในเครือข่าย ผู้ที่อยู่ใน VLAN เดียวกันยังเรียกได้ทุกอย่าง ซึ่ง zero trust ไม่ให้ implicit trust จาก network location","ผิด: key ร่วมกันไม่บอกว่าใครเป็นผู้เรียก ผู้ที่ยึด pod ใดได้ก็ได้ key ที่ใช้กับทุก service","ผิด: เข้ารหัส traffic ได้ แต่ server ไม่รู้ว่า client เป็น workload ใด และไม่มีการตัดสินสิทธิ์ต่อ request","ถูก: ทุก request ถูกยืนยันตัวตนของ workload และตัดสินสิทธิ์แบบ least privilege ตาม policy ไม่ว่าจะมาจาก network ใด"],"explanation":"NIST SP 800-207 ไม่ให้ความเชื่อใจโดยปริยายจากตำแหน่งในเครือข่าย ทุกการเข้าถึงต้องยืนยันตัวตนและอนุญาตแบบ per-request ตาม policy; workload identity + mTLS + authorization policy คือการทำหลักนี้ในระดับ service-to-service","info":"ในทางปฏิบัติมักใช้ service mesh (Istio, Linkerd) ที่ออก certificate อายุสั้นอัตโนมัติตาม SPIFFE ID ของ workload แล้วใช้ `AuthorizationPolicy` แบบ default-deny; เสริมด้วย Kubernetes NetworkPolicy อีกชั้น และส่ง log การตัดสินสิทธิ์ไปตรวจจับพฤติกรรมผิดปกติ เพราะ zero trust ประเมินซ้ำต่อเนื่อง ไม่ใช่ตรวจครั้งเดียวตอนเชื่อมต่อ","ref":"NIST SP 800-207 Zero Trust Architecture; SPIFFE"},{"id":"SEC-05","competency":"appsec","level":"advance","outline":"Lead security transformation initiatives (e.g., DevSecOps integration, CI/CD pipeline security)","question":"Azure DevOps pipeline ตัวเดียวใช้ทั้ง PR validation และ deploy prod โดยมี service connection ที่มีสิทธิ์ deploy prod ทีม security กังวลว่า PR ที่แก้ไฟล์ YAML หรือ build script อาจขโมย credential ได้ตั้งแต่ตอน PR build รัน ก่อนมี reviewer มาดู มาตรการใดปิดความเสี่ยงนี้ตรงที่สุด","options":["ตั้ง variable ของ credential เป็น secret ให้ถูก mask ใน log และเปิด audit log ของ organization","ตั้ง Branch control และ approval บน service connection ของ prod ให้ใช้ได้เฉพาะ run จาก `main`","บังคับ branch policy ให้ PR ต้องได้ approve จาก reviewer 2 คนก่อน merge เข้า `main`","เพิ่ม secret scanning และ SAST ใน PR build เพื่อตรวจหา credential หรือโค้ดอันตรายก่อน merge เข้า `main`"],"answer":1,"why":["ผิด: masking แค่ซ่อนค่าใน log script ที่ได้ค่าไปแล้วส่งออกนอกระบบหรือ encode ก่อนพิมพ์ได้ และ audit log เป็นการตรวจย้อนหลัง","ถูก: check บน resource ถูกประเมินก่อน job ได้ credential run จาก PR branch จึงไม่ได้รับ service connection ของ prod ตั้งแต่แรก","ผิด: บังคับตอน merge แต่ PR build รันโค้ดของ PR พร้อม credential ไปแล้วก่อนมีคน review","ผิด: ตรวจหา secret ที่ commit ไว้ในโค้ดหรือ pattern ที่รู้จัก แต่ไม่ได้กันไม่ให้ pipeline ส่ง credential ให้โค้ดของ PR"],"explanation":"credential ระดับ prod ต้องผูกกับเงื่อนไขที่ผู้แก้ YAML ควบคุมไม่ได้ ใน Azure DevOps คือ checks บน protected resource เช่น Branch control (อนุญาต `refs/heads/main`) และ approvals ซึ่ง owner ของ resource เป็นผู้ตั้งและถูกประเมินก่อน job เริ่ม","info":"แยก PR validation ออกจาก deploy และให้ PR build ใช้ service connection สิทธิ์ต่ำหรือไม่มีเลย; check 'Required template' บังคับให้ pipeline ที่ใช้ resource ต้อง extend จาก template กลางที่ทีม platform ดูแล; บน Azure ให้ใช้ service connection แบบ workload identity federation แทน client secret เพื่อไม่มี secret อายุยาวให้ขโมย","ref":"Microsoft Learn: Azure Pipelines – Approvals and checks; Securing Azure Pipelines"},{"id":"SEC-06","competency":"appsec","level":"advance","outline":"Conduct advanced threat modeling and risk assessment","question":"ระหว่างทำ threat modeling ของระบบอนุมัติการเบิกเงิน ทีมพบว่าผู้อนุมัติ login ด้วย MFA และ session ผูกกับอุปกรณ์อยู่แล้ว แต่บันทึกการอนุมัติเก็บในตารางเดียวกับข้อมูลธุรกิจซึ่ง admin ของแอปแก้ไขได้ เมื่อผู้อนุมัติปฏิเสธภายหลังว่าไม่ได้กดอนุมัติ องค์กรจึงพิสูจน์ไม่ได้ ข้อใดระบุหมวด STRIDE และ mitigation ได้ถูกต้องที่สุด","options":["Spoofing: บังคับ MFA และผูก session กับอุปกรณ์ของผู้อนุมัติให้เข้มขึ้นกว่าเดิม","Repudiation: เขียน audit log แบบ append-only พร้อม hash chain ลง store ที่ admin แอปแก้ไม่ได้","Tampering: เข้ารหัสตารางการอนุมัติด้วย encryption at rest (TDE) และหมุน key ตามรอบที่กำหนด","Elevation of privilege: ตรวจ role ของผู้อนุมัติด้วย RBAC ในทุก request ที่กดอนุมัติรายการ"],"answer":1,"why":["ผิด: โจทย์ระบุว่ามี MFA และ device binding แล้ว ปัญหาคือไม่มีหลักฐานที่เชื่อถือได้ว่าใครทำอะไร ไม่ใช่การปลอมตัวตน","ถูก: การปฏิเสธการกระทำคือ Repudiation ต้องมีหลักฐานที่ผูกตัวตนกับการกระทำและแก้ย้อนหลังไม่ได้โดยไม่ถูกตรวจพบ","ผิด: encryption at rest กันการอ่านจาก storage ที่หลุด แต่ admin ที่แก้ผ่านแอปหรือ DB ยังแก้ข้อมูลได้ตามปกติ","ผิด: role check กันคนไม่มีสิทธิ์กดอนุมัติ แต่ไม่ได้สร้างหลักฐานว่าผู้มีสิทธิ์คนนั้นกดจริง"],"explanation":"STRIDE แยก Repudiation (ผู้กระทำปฏิเสธการกระทำได้เพราะไม่มีหลักฐาน) ออกจาก Tampering; mitigation ของ Repudiation คือ audit trail ที่ tamper-evident แยกสิทธิ์เขียนออกจากผู้ดูแลระบบปกติ และบันทึกตัวตน การกระทำ เวลา และบริบทครบ","info":"รูปแบบที่ใช้จริงเช่น ส่ง audit event ไปยัง storage แบบ immutable/WORM (object lock, immutable blob) หรือทำ hash chain ที่แต่ละ record เก็บ hash ของ record ก่อนหน้าแล้ว anchor hash ล่าสุดไว้ภายนอกตามรอบ; ธุรกรรมการเงินอาจเพิ่ม digital signature ต่อรายการ และ log ต้องไม่เก็บข้อมูลส่วนบุคคลเกินจำเป็นตาม PDPA","ref":"Microsoft Threat Modeling – STRIDE; OWASP Logging Cheat Sheet"},{"id":"AI-01","competency":"ai","level":"intermediate","outline":"Implement AI-powered features into production systems with monitoring and retraining procedures","question":"โมเดลจัดหมวดเอกสาร (NLP) ใน production มี accuracy 94% บน holdout set ตอน launch หลังผ่านไป 4 เดือน ผู้ใช้ร้องเรียนว่าจัดหมวดผิดบ่อยขึ้นเพราะมีเอกสารประเภทใหม่เข้ามา และ label จริงจากผู้ตรวจจะได้หลังส่งเอกสารราว 2 สัปดาห์ ขั้นตอน monitoring และ retraining ใดเหมาะที่สุด","options":["ดู data/prediction drift เป็นสัญญาณนำ วัด accuracy จริงเมื่อ label มาถึง แล้ว retrain แบบ champion/challenger","retrain อัตโนมัติทุกคืนด้วยเอกสาร production ทั้งหมด โดยใช้ผลทำนายของโมเดลเองเป็น label ของรอบถัดไป","ตั้ง alert เมื่อ accuracy บน holdout set ชุดเดิมที่ใช้ตอน launch ลดลงต่ำกว่า 90% แล้วจึง retrain ใหม่","เฝ้าดู latency, error rate และ CPU ของ inference endpoint ให้อยู่ใน SLO และ auto-scale ตาม load ที่เพิ่มขึ้น"],"answer":0,"why":["ถูก: drift เตือนล่วงหน้าก่อน label มาถึง accuracy จาก label จริงยืนยันผล และ champion/challenger กันไม่ให้โมเดลใหม่ที่แย่กว่าขึ้น production","ผิด: เป็น feedback loop ที่สอนโมเดลให้จำความผิดของตัวเอง เอกสารประเภทใหม่ที่ทำนายผิดจะถูกตอกย้ำเป็น label","ผิด: holdout ชุดเดิมไม่มีเอกสารประเภทใหม่ accuracy บนชุดนี้จึงคงที่แม้ production แย่ลง alert จะไม่ดัง","ผิด: เป็น metric ของ infrastructure ระบบอาจเร็วและไม่มี error ขณะที่คำตอบผิดมากขึ้น จึงจับ drift ไม่ได้"],"explanation":"ปัญหาคือ data/concept drift ที่ label มาช้า จึงต้องมีสัญญาณนำ (การกระจายของ input/embedding และสัดส่วนหมวดที่ทำนาย) ควบคู่การวัดคุณภาพจริงจาก label ที่ตามมา แล้ว retrain ผ่าน pipeline ที่ validate กับข้อมูลล่าสุดก่อน promote","info":"ตัวชี้วัด drift ที่นิยมคือ Population Stability Index (PSI) หรือ KS test ต่อ feature/embedding โดย PSI มากกว่า 0.2 มักถือว่าเปลี่ยนมาก; เก็บ input, output, model version และ confidence ของทุก request ไว้ย้อนวิเคราะห์; เลือกตัวอย่างที่โมเดลไม่มั่นใจไปให้คน label ก่อน (active learning) และใช้ shadow หรือ canary deployment ก่อนสลับโมเดลจริง","ref":"Google: Rules of ML / MLOps continuous delivery; Evidently/whylogs drift metrics"}];
