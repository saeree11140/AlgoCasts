<script>
(() => {
  const STORE = 'exam2026-choice-v1';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const LEVEL = { intermediate: 'Intermediate', advance: 'Advance' };

  // ---------- state: first attempt counts for the score; retries are for learning
  let state = load();
  function load() {
    try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.seed) return s; } catch {}
    return { seed: Math.floor(Math.random() * 2 ** 31), q: {} };
  }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

  // deterministic shuffle per question for this attempt (seeded), so a reload keeps the order
  function order(q) {
    let h = state.seed ^ [...q.id].reduce((a, c) => Math.imul(a ^ c.charCodeAt(0), 16777619), 2166136261);
    const rand = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 2 ** 32;
    const idx = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx;
  }

  const comps = Object.fromEntries(META.competencies.map((c) => [c.id, c]));
  const groups = [...new Set(META.competencies.map((c) => c.group))];
  const byComp = {};
  QUESTIONS.forEach((q) => (byComp[q.competency] ??= []).push(q));
  const numberOf = {};
  let n = 0;
  for (const c of META.competencies) for (const q of byComp[c.id] ?? []) numberOf[q.id] = ++n;

  // ---------- header + plan
  const codingPts = META.coding.reduce((s, c) => s + c.points, 0);
  $('#lede').innerHTML = `ปรนัย ${QUESTIONS.length} ข้อ (${META.choiceTotal} คะแนน) + เขียนโค้ด ${codingPts} คะแนน = 100 คะแนน · ระดับ Intermediate ${QUESTIONS.filter((q) => q.level === 'intermediate').length} ข้อ, Advance ${QUESTIONS.filter((q) => q.level === 'advance').length} ข้อ · จำนวนข้อมาจาก weight ใน 2026_Software Developer_Competency.xlsx (1 ข้อ = 1 คะแนน)`;
  $('#plan-body').innerHTML = `<table><tr><th>หมวด</th><th>Competency</th><th class="num">Weight</th><th class="num">ข้อ</th><th class="num">Inter</th><th class="num">Adv</th></tr>${
    META.competencies.map((c) => `<tr><td>${esc(c.group)}</td><td>${esc(c.name)}</td><td class="num">${c.weight.toFixed(2)}</td><td class="num">${c.count}</td><td class="num">${c.levels.intermediate}</td><td class="num">${c.levels.advance}</td></tr>`).join('')
  }${META.coding.map((c) => `<tr><td>ProblemSolving (Coding)</td><td>${esc(c.name)}</td><td class="num">${c.weight.toFixed(2)}</td><td class="num" colspan="3">${c.points} คะแนน (ข้อเขียนใน CodeSandbox)</td></tr>`).join('')}</table>
  <div class="sub">ปรนัยรวม weight ${META.choiceWeight} ปัดด้วย largest remainder เป็น ${META.choiceTotal} ข้อ · ในแต่ละ competency แบ่ง Intermediate/Advance ใกล้เคียงครึ่งต่อครึ่ง (ข้อเดียวเป็น Intermediate)</div>`;

  // ---------- render
  const root = $('#groups');
  for (const g of groups) {
    const gc = META.competencies.filter((c) => c.group === g && byComp[c.id]);
    const total = gc.reduce((s, c) => s + byComp[c.id].length, 0);
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.innerHTML = `<h2>${esc(g)} <span class="pill gray">${total} ข้อ</span> <span class="sub" data-gscore="${esc(g)}"></span></h2>`;
    for (const c of gc) {
      const d = document.createElement('details');
      d.className = 'comp';
      d.dataset.comp = c.id;
      d.innerHTML = `<summary><span class="t">${esc(c.name)}</span><span class="sub">weight ${c.weight.toFixed(2)} · ${byComp[c.id].length} ข้อ · <span data-cscore="${c.id}"></span></span></summary>
        <div class="body"><p class="def">${esc(c.definition)}</p>${byComp[c.id].map(renderQ).join('')}</div>`;
      sec.appendChild(d);
    }
    root.appendChild(sec);
  }

  function renderQ(q) {
    const idx = order(q);
    return `<article class="q" data-id="${esc(q.id)}" data-level="${q.level}">
      <div class="head"><span class="no">ข้อ ${numberOf[q.id]}</span><span class="pill ${q.level === 'advance' ? 'advance' : 'inter'}">${LEVEL[q.level]}</span><span class="sub">${esc(q.id)}</span><span class="mark"></span></div>
      <p class="stem">${rich(q.question)}</p>
      ${q.code ? `<pre><code>${esc(q.code)}</code></pre>` : ''}
      <div class="opts">${idx.map((orig, pos) => `<button class="opt" data-opt="${orig}"><span class="k">${'ABCD'[pos]}</span><span>${rich(q.options[orig])}</span></button>`).join('')}</div>
      <div class="feedback"></div>
      <div class="bar-q"><button class="link reveal">ดูเฉลย</button></div>
      <details class="outline"><summary>outline ที่ข้อนี้วัด</summary>${esc(comps[q.competency].name)} · ${LEVEL[q.level]}: ${esc(q.outline)}</details>
    </article>`;
  }

  const qById = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));
  const letterOf = (el, orig) => $(`.opt[data-opt="${orig}"] .k`, el).textContent;

  function paint(el) {
    const q = qById[el.dataset.id];
    const s = state.q[q.id];
    const fb = $('.feedback', el);
    const opts = [...el.querySelectorAll('.opt')];
    opts.forEach((b) => { b.classList.remove('wrong', 'right'); b.disabled = false; });
    fb.innerHTML = '';
    $('.mark', el).innerHTML = '';
    $('.reveal', el).classList.toggle('hidden', Boolean(s?.solved));
    if (!s) return;
    for (const w of s.tried ?? []) opts.find((b) => +b.dataset.opt === w)?.classList.add('wrong');
    $('.mark', el).innerHTML = s.first === q.answer ? '<span class="first-right">ถูกตั้งแต่ครั้งแรก</span>' : s.first !== undefined ? '<span class="first-wrong">ครั้งแรกตอบผิด</span>' : '';
    if (s.solved) {
      opts.forEach((b) => (b.disabled = true));
      opts.find((b) => +b.dataset.opt === q.answer).classList.add('right');
      const wrongs = opts.map((b) => +b.dataset.opt).filter((i) => i !== q.answer); // in displayed order
      fb.innerHTML = `<div class="fb ok"><div class="h">${s.revealed ? 'เฉลย' : '✓ ถูกต้อง'}: ${letterOf(el, q.answer)}</div>${rich(q.explanation)}
        <ul class="why-list">${wrongs.map((i) => `<li><b>${letterOf(el, i)}</b> ${rich(q.why[i].replace(/^ผิด:\s*/, ''))}</li>`).join('')}</ul></div>
        <div class="info"><div class="h">ควรรู้เพิ่มเติม</div>${rich(q.info)}${q.ref ? `<div class="ref">อ้างอิง: ${rich(q.ref)}</div>` : ''}</div>`;
    } else if (s.last !== undefined) {
      fb.innerHTML = `<div class="fb bad"><div class="h">✗ ยังไม่ถูก (${letterOf(el, s.last)})</div>${rich(q.why[s.last].replace(/^ผิด:\s*/, ''))}<div class="sub">ลองตัวเลือกอื่นได้ คะแนนนับจากครั้งแรก</div></div>`;
    }
  }

  root.addEventListener('click', (e) => {
    const el = e.target.closest('.q');
    if (!el) return;
    const q = qById[el.dataset.id];
    const s = (state.q[q.id] ??= { tried: [] });
    const opt = e.target.closest('.opt');
    if (opt && !s.solved) {
      const pick = +opt.dataset.opt;
      if (s.first === undefined) s.first = pick;
      if (pick === q.answer) s.solved = true;
      else { if (!s.tried.includes(pick)) s.tried.push(pick); s.last = pick; }
    } else if (e.target.closest('.reveal') && !s.solved) {
      if (s.first === undefined) s.first = -1; // revealed before answering counts as wrong
      s.solved = true;
      s.revealed = true;
    } else return;
    save();
    paint(el);
    stats();
    applyFilters();
  });

  function stats() {
    const done = QUESTIONS.filter((q) => state.q[q.id]?.first !== undefined);
    const right = done.filter((q) => state.q[q.id].first === q.answer);
    $('#stat-answered').textContent = `ตอบแล้ว ${done.length}/${QUESTIONS.length}`;
    $('#bar').style.width = `${(100 * done.length) / QUESTIONS.length}%`;
    $('#stat-score').textContent = `คะแนน ${right.length}/${QUESTIONS.length}` + (done.length ? ` (${Math.round((100 * right.length) / done.length)}% ของที่ตอบ)` : '');
    for (const c of META.competencies) {
      const qs = byComp[c.id] ?? [];
      const r = qs.filter((q) => state.q[q.id]?.first === q.answer).length;
      const a = qs.filter((q) => state.q[q.id]?.first !== undefined).length;
      const el = document.querySelector(`[data-cscore="${c.id}"]`);
      if (el) el.textContent = a ? `ได้ ${r}/${qs.length}` : 'ยังไม่ทำ';
    }
    for (const g of groups) {
      const qs = QUESTIONS.filter((q) => comps[q.competency].group === g);
      const r = qs.filter((q) => state.q[q.id]?.first === q.answer).length;
      const el = document.querySelector(`[data-gscore="${CSS.escape(g)}"]`);
      if (el) el.textContent = `ได้ ${r}/${qs.length}`;
    }
  }

  function applyFilters() {
    const lv = $('#f-level').value;
    const st = $('#f-state').value;
    document.querySelectorAll('.q').forEach((el) => {
      const q = qById[el.dataset.id];
      const s = state.q[q.id];
      const okLevel = !lv || q.level === lv;
      const okState = !st || (st === 'todo' ? s?.first === undefined : s?.first !== undefined && s.first !== q.answer);
      el.classList.toggle('hidden', !(okLevel && okState));
    });
    document.querySelectorAll('.comp').forEach((d) => d.classList.toggle('hidden', !d.querySelector('.q:not(.hidden)')));
  }

  $('#f-level').onchange = applyFilters;
  $('#f-state').onchange = applyFilters;
  $('#expand').onclick = () => document.querySelectorAll('.comp').forEach((d) => (d.open = true));
  $('#collapse').onclick = () => document.querySelectorAll('.comp').forEach((d) => (d.open = false));
  $('#reset').onclick = () => {
    state = { seed: Math.floor(Math.random() * 2 ** 31), q: {} };
    save();
    location.reload();
  };

  // ---------- coding part
  $('#coding').innerHTML = `<h2>ส่วนเขียนโค้ด (${codingPts} คะแนน)</h2>
    <p>${META.coding.map((c) => `${esc(c.name)} ${c.points} คะแนน`).join(' · ')} ทำใน CodeSandbox: เปิดลิงก์ กด <b>Fork</b> แล้วทำใน fork ของตัวเอง โจทย์และ tests อยู่ในแต่ละไฟล์ อ่าน README.md ก่อนเริ่ม</p>
    ${CODING_URL ? `<p><a href="${esc(CODING_URL)}" target="_blank" rel="noopener">${esc(CODING_URL)}</a></p>` : '<p class="sub">ลิงก์ CodeSandbox จะใส่เมื่อสร้างแล้ว</p>'}`;

  document.querySelectorAll('.q').forEach(paint);
  stats();
  applyFilters();
})();
</script>
</body>
</html>
