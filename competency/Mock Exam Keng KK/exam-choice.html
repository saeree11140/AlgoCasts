const QUESTIONS = [{"id":"MS-01","competency":"microservices","level":"intermediate","outline":"Implement service-to-service communication with messaging systems or event-driven patterns","question":"Order service บันทึก order ลง PostgreSQL แล้ว publish event `OrderPlaced` ไปที่ Kafka ภายใน method เดียวกัน พบสองอาการ: (1) DB commit สำเร็จแต่ publish ล้มเหลวเพราะ broker ล่ม ทำให้ Inventory ไม่ได้รับ event (2) publish สำเร็จแต่ transaction ถูก rollback ทำให้ consumer เห็น order ที่ไม่มีอยู่จริง แนวทางใดแก้ได้ทั้งสองอาการ","options":["ใช้ XA/two-phase commit ครอบทั้ง PostgreSQL และ Kafka producer ให้ commit พร้อมกัน","Publish event ก่อนแล้วจึง commit DB ถ้า commit ล้มเหลวให้ publish `OrderCancelled` ตามไป","เขียน event ลงตาราง outbox ใน transaction เดียวกับ order แล้วให้ relay ส่งต่อไป Kafka","Retry การ publish แบบ exponential backoff ก่อน commit และ commit เฉพาะเมื่อ publish สำเร็จ"],"answer":2,"why":["ผิด: Kafka ไม่รองรับ XA transaction ร่วมกับ DB และ 2PC ทำให้ availability ของ service ผูกกับทุก participant","ผิด: ถ้า process ตายระหว่าง publish กับ commit จะไม่มีใคร publish `OrderCancelled` และ consumer ได้เห็น phantom order ไปแล้ว","ถูก: event กับ state เปลี่ยนแบบ atomic ใน local transaction เดียว relay ค่อยส่งต่อแบบ at-least-once จึงไม่มี event หายและไม่มี event ของ order ที่ rollback","ผิด: แก้ได้เฉพาะ broker ล่มชั่วคราว แต่ถ้า publish สำเร็จแล้ว commit ล้มเหลว (หรือ crash ระหว่างสองขั้น) ก็ยังเกิด phantom event"],"explanation":"ปัญหานี้คือ dual write: เขียนสองระบบที่ไม่มี transaction ร่วมกัน Transactional Outbox แก้โดยเขียน event ลงตาราง outbox ใน transaction เดียวกับข้อมูลธุรกิจ แล้วให้ message relay (polling หรือ CDC) อ่านไป publish ภายหลัง ทำให้ event ถูกส่งก็ต่อเมื่อ transaction commit จริงเท่านั้น","info":"Relay ส่งแบบ at-least-once จึงอาจส่งซ้ำ ฝั่ง consumer ต้อง idempotent เช่น dedupe ด้วย event id ในตาราง inbox หรือ unique constraint ถ้าใช้ CDC อย่าง Debezium จะอ่านจาก WAL โดยตรง (มี Outbox Event Router ให้) ไม่ต้อง polling ตาราง และอย่าลืมงานลบ row เก่าใน outbox ไม่ให้ตารางโตไม่หยุด","ref":"Chris Richardson, Microservices Patterns — Transactional Outbox; Debezium Outbox Event Router"},{"id":"MS-02","competency":"microservices","level":"intermediate","outline":"Apply best practices for data management across services","question":"หน้า Order history ต้องแสดงชื่อและ tier ของลูกค้าคู่กับทุก order ปัจจุบัน Order service query ตาราง `customers` ของ Customer service ผ่าน shared database ทีมต้องการแยกเป็น database per service โดยมีเงื่อนไขว่าหน้านี้ต้องแสดงได้แม้ Customer service ล่มชั่วคราว และยอมให้ tier ล่าช้าได้ไม่กี่วินาที ควรออกแบบอย่างไร","options":["Order service เก็บสำเนาเฉพาะ field ที่ใช้ไว้ใน DB ของตัวเอง และอัปเดตจาก event `CustomerUpdated`","ให้ Order service เรียก batch API `GET /customers?ids=` แบบ synchronous ขณะประกอบข้อมูลของหน้านี้","สร้าง database view สำหรับอ่านบน schema ของ Customer แล้ว grant สิทธิ์ให้ Order service อ่านได้","ย้ายตาราง `customers` มาไว้ใน DB ของ Order แล้วให้ทั้งสอง service เขียนตารางเดียวกันได้"],"answer":0,"why":["ถูก: Order อ่านจากสำเนาในเครื่องตัวเองจึงไม่ผูก availability กับ Customer service และยอมรับ eventual consistency ได้ตามเงื่อนไข","ผิด: API composition เป็น pattern ที่ใช้ได้ แต่สร้าง temporal coupling หน้าจะแสดงไม่ได้ทันทีที่ Customer service ล่ม","ผิด: view ยังเป็น shared database แค่ซ่อน schema ไว้ ทั้ง schema coupling และ availability ของ DB ยังผูกกันอยู่","ผิด: ตารางเดียวที่มีสอง service เขียนทำให้ไม่มีเจ้าของข้อมูลที่ชัดเจน ซึ่งขัดกับ database per service โดยตรง"],"explanation":"Database per service ต้องการให้ข้อมูลมีเจ้าของเดียวและเข้าถึงผ่าน API หรือ event เท่านั้น เมื่อหน้าจอต้องทำงานได้แม้เจ้าของข้อมูลล่ม วิธีที่ตรงที่สุดคือ replicate เฉพาะข้อมูลที่ต้องใช้มาเก็บเป็น read model ของตัวเองผ่าน event และยอมรับความล่าช้าที่ธุรกิจตกลงไว้","info":"เก็บ `version` หรือ `updated_at` ของ customer ไว้ใน read model เพื่อทิ้ง event ที่มาผิดลำดับ และเตรียมทางสร้างสำเนาใหม่ (replay event หรือ bulk sync) เมื่อเพิ่ม consumer ใหม่หรือข้อมูลเพี้ยน สำเนานี้เป็น read-only ฝั่ง Order ห้ามแก้เอง การแก้ข้อมูลลูกค้ายังต้องผ่าน Customer service ที่เป็นเจ้าของ","ref":"Chris Richardson, Microservices Patterns — Database per Service, CQRS view"},{"id":"MS-03","competency":"microservices","level":"intermediate","outline":"Ensure robust security using advanced authentication/authorization protocols (e.g., OAuth2, JWT, mutual TLS) and zero-trust principles","question":"API Gateway ตรวจ JWT ของผู้ใช้แล้วส่ง header `X-User-Id` ต่อให้ service ภายใน ซึ่งเชื่อ header นี้โดยไม่ตรวจซ้ำเพราะอยู่ใน private network ผล pentest พบว่า pod ที่ถูกเจาะสามารถเรียก Payment service พร้อม `X-User-Id` ของใครก็ได้ แนวทางใดสอดคล้องกับ zero-trust มากที่สุด","options":["จำกัด security group ให้ Payment รับ traffic เฉพาะจาก subnet ของ Gateway และ service ที่เกี่ยวข้อง","ให้ทุก service sign header `X-User-Id` ด้วย HMAC key ร่วมกัน แล้ว Payment ตรวจ signature ก่อนใช้","ลดอายุ access token ของผู้ใช้เหลือ 5 นาที และหมุน signing key ของ Gateway ทุกวัน","ใช้ mTLS ระบุตัวตนของแต่ละ service และให้ Payment ตรวจ token ที่ระบุ audience ของตัวเองทุก request"],"answer":3,"why":["ผิด: ยังเป็นการเชื่อตำแหน่งใน network (perimeter) pod ที่ถูกเจาะใน subnet ที่อนุญาตก็ยังปลอม header ได้","ผิด: key ร่วมกันอยู่ในทุก service รวมถึง pod ที่ถูกเจาะ ผู้โจมตีจึง sign header ปลอมได้เอง","ผิด: ลดความเสียหายจาก token ที่รั่ว แต่ไม่แตะจุดอ่อนจริงคือ service ภายในเชื่อ header ที่ใครก็ใส่ได้","ถูก: ทุก request ต้องพิสูจน์ทั้งตัวตนของ workload (mTLS) และสิทธิ์ของผู้ใช้ด้วย token ที่ตรวจสอบได้และออกให้ Payment โดยเฉพาะ"],"explanation":"Zero trust ไม่เชื่อสิ่งใดจากตำแหน่งใน network แต่ authenticate และ authorize ทุก request mTLS ยืนยันว่าผู้เรียกเป็น service ไหน ส่วน token ที่มี `aud` เป็น Payment ยืนยันว่าผู้ใช้คนนั้นให้สิทธิ์จริง pod ที่ถูกเจาะจึงปลอมตัวตนผู้ใช้คนอื่นไม่ได้","info":"OAuth 2.0 Token Exchange (RFC 8693) ใช้แลก token ของผู้ใช้เป็น token ที่ scope แคบลงและมี `aud` ของ service ปลายทาง แทนการส่ง token ตัวเดียวไปทุกที่ Service mesh อย่าง Istio หรือ Linkerd ทำ mTLS และ authorization policy ตาม service identity (SPIFFE) ให้อัตโนมัติ แต่ service ยังต้องตรวจ `iss`, `aud`, `exp` ของ JWT เองเสมอ","ref":"NIST SP 800-207 Zero Trust Architecture; RFC 8693 OAuth 2.0 Token Exchange"},{"id":"MS-04","competency":"microservices","level":"advance","outline":"Architect microservices ecosystems with advanced patterns (e.g., CQRS, Saga, circuit breaker, API composition)","question":"ระบบจองทริปใช้ orchestration saga: จองที่นั่งเครื่องบิน → จองห้องพัก → ตัดบัตร ระหว่างที่ saga ยังไม่จบ ผู้ใช้อีกคนเห็นจำนวนห้องว่างลดลงแล้ว ต่อมา saga ล้มเหลวที่ขั้นตัดบัตรและถูก compensate ผู้ใช้คนนั้นจึงเห็นข้อมูลที่ไม่เคย final (dirty read ข้าม service) countermeasure ใดตรงปัญหานี้ที่สุด","options":["ตั้ง isolation level ของ DB ฝั่ง Hotel เป็น `SERIALIZABLE` เพื่อกันไม่ให้ใครอ่านข้อมูลที่ยังไม่ final","Semantic lock: ให้ห้องอยู่สถานะ `PENDING` ระหว่าง saga และให้ request อื่นจัดการสถานะนี้อย่างชัดเจน","เปลี่ยนจาก orchestration เป็น choreography เพื่อให้แต่ละ service ตัดสินใจ commit ของตัวเอง","ให้ compensating transaction ของ Hotel ทำงานทันทีแบบ async เพื่อลดช่วงเวลาที่ข้อมูลไม่ถูกต้อง"],"answer":1,"why":["ผิด: แต่ละขั้นของ saga commit local transaction ไปแล้ว isolation level ของ DB ป้องกันได้เฉพาะภายใน transaction เดียว ไม่ครอบทั้ง saga","ถูก: semantic lock เป็น lock ระดับ application ที่บอกว่า record กำลังอยู่ระหว่าง saga ให้ request อื่นรอ ปฏิเสธ หรือแสดงเป็นค่าชั่วคราวได้","ผิด: รูปแบบการประสานงานไม่เปลี่ยนคุณสมบัติที่ saga ไม่มี isolation ทั้งสองแบบเกิด dirty read ได้เหมือนกัน","ผิด: ทำให้ช่วงเวลาสั้นลงแต่ไม่ได้ป้องกัน ผู้อื่นยังอ่านค่าที่จะถูกย้อนกลับได้ก่อน compensation ทำงาน"],"explanation":"Saga ให้ได้แค่ ACD ไม่มี I (isolation) เพราะแต่ละขั้น commit แยกกัน จึงต้องใช้ countermeasure ระดับ application Semantic lock ตั้ง flag สถานะ เช่น `PENDING` ไว้บน record ที่ saga แตะ เพื่อบอก transaction อื่นว่าค่านี้ยังไม่ final และให้ business rule ตัดสินว่าจะจัดการอย่างไร","info":"countermeasure อื่นในหนังสือ Microservices Patterns ได้แก่ commutative updates, pessimistic view (จัดลำดับขั้นให้ขั้นที่เสี่ยงอยู่หลัง pivot transaction), reread value, version file และ by value ขั้นก่อน pivot ต้อง compensatable ส่วนขั้นหลัง pivot ต้อง retriable และ compensating transaction ต้อง idempotent เพราะอาจถูกเรียกซ้ำ","ref":"Chris Richardson, Microservices Patterns, Chapter 4 — Countermeasures for handling the lack of isolation"},{"id":"MS-05","competency":"microservices","level":"advance","outline":"Design for resilience, high availability, and fault tolerance at scale; proactively address distributed system challenges","question":"Service A เรียก Service B แบบ synchronous ตั้ง timeout 30 วินาที และ retry 3 ครั้งทันทีเมื่อล้มเหลว ทั้งใน client SDK และในโค้ดของ A เมื่อช่วง peak B ช้าลงจาก p99 200 ms เป็น 8 s ทำให้ thread pool ของ A เต็มและระบบล่มเป็นลูกโซ่ ชุดการแก้ใดตรงสาเหตุที่สุด","options":["เพิ่ม timeout เป็น 60 วินาที และเหลือ retry ชั้นเดียวใน SDK แบบ backoff+jitter","retry ชั้นเดียวแบบ backoff+jitter และ circuit breaker โดยคง timeout 30 วินาทีไว้","timeout ตาม latency budget, retry ชั้นเดียวแบบ backoff+jitter และ circuit breaker","timeout ตาม latency budget และ circuit breaker โดยคง retry ทันที 3 ครั้งทั้งสองชั้น"],"answer":2,"why":["ผิด: ลด retry ถูกทาง แต่ timeout ที่ยาวขึ้นทำให้ thread ถูกถือนานขึ้น pool เต็มเร็วขึ้นและ cascading failure รุนแรงขึ้น","ผิด: breaker จะเปิดได้ต้องรอให้ call ล้มก่อน ระหว่างนั้น thread ทุกตัวยังถูกจองรอได้ถึง 30 วินาที pool จึงเต็มก่อน breaker ทันทำงาน","ถูก: ครบทั้งสามสาเหตุ ปล่อย thread เร็วด้วย timeout ที่สั้นตาม budget, ไม่คูณโหลดด้วย retry ซ้อนชั้น และ fail fast เมื่อ B ป่วย","ผิด: timeout สั้นช่วยปล่อย thread แต่ retry ทันทีสองชั้นยังคูณโหลดได้ถึง (1+3)×(1+3) = 16 call ต่อ request ใส่ B ที่กำลังช้า"],"explanation":"สาเหตุมีสามส่วน: timeout ยาวทำให้ thread ถูกจองค้าง, retry สองชั้นคูณโหลดใส่ B ที่ช้าอยู่แล้ว และไม่มีกลไกหยุดเรียก B ขณะป่วย ตัวเลือกที่ถูกแก้ครบทั้งสามส่วน ส่วนตัวลวงแต่ละข้อคงสาเหตุไว้อย่างน้อยหนึ่งส่วน ถ้าจะเสริมอีกชั้นให้แยก pool ต่อ dependency (bulkhead) เพื่อไม่ให้ความช้าของ B ลามไปทั้ง A","info":"Retry ควรใช้กับ operation ที่ idempotent เท่านั้น และควรมี retry budget เช่นไม่เกิน 10% ของ request ทั้งหมด พร้อมเคารพ header `Retry-After` Circuit breaker มีสามสถานะ closed → open → half-open และควรมี fallback ที่มีความหมายทางธุรกิจ เช่นแสดงข้อมูลจาก cache แทนการ error ทั้งหน้า","ref":"Google SRE Book — Addressing Cascading Failures; AWS Builders' Library — Timeouts, retries, and backoff with jitter"},{"id":"MS-06","competency":"microservices","level":"advance","outline":"Lead migration from monolith to microservices, coach teams on service decomposition, and manage service lifecycle and governance","question":"ทีมกำลังเริ่มย้าย monolith ขนาดใหญ่ไปเป็น microservices โดยต้องไม่หยุด release feature ใหม่ระหว่างทาง และทีมยังไม่เคยดูแล service แบบกระจาย แนวทางเริ่มต้นใดสอดคล้องกับ Strangler Fig และลดความเสี่ยงได้ดีที่สุด","options":["เริ่มแยกโมดูล Order ที่เป็นแกนกลางและถูกเรียกมากที่สุดก่อน เพื่อให้เห็นประโยชน์ทางธุรกิจเร็วที่สุด","แยกชั้น data access ออกเป็น service กลางให้ทุกโมดูลเรียกก่อน แล้วค่อยแยก business logic","เขียนระบบใหม่ทั้งหมดคู่ขนานกับของเดิม แล้วสลับ traffic ทั้งหมดในวัน cutover ครั้งเดียว","วาง routing facade หน้า monolith แล้วดึง capability ที่ coupling ต่ำออกทีละตัว ค่อยย้าย traffic"],"answer":3,"why":["ผิด: โมดูลแกนกลางมี dependency มากที่สุด เสี่ยงสูงสุดสำหรับทีมที่ยังไม่มีประสบการณ์ ควรเริ่มจากส่วนที่แยกง่ายเพื่อเรียนรู้ก่อน","ผิด: การแยกตามชั้นเทคนิคได้ entity/data service ที่ทุก service ต้องเรียก เป็น distributed monolith ที่ coupling สูงกว่าเดิม","ผิด: big-bang rewrite ต้องไล่ตาม feature ใหม่ของระบบเดิมตลอดเวลา และความเสี่ยงทั้งหมดไปกองที่วัน cutover","ถูก: facade ทำให้ย้าย traffic ได้ทีละส่วนและย้อนกลับได้ เริ่มจาก capability ที่ coupling ต่ำเพื่อสร้างทักษะก่อนแตะส่วนยาก"],"explanation":"Strangler Fig คือการดัก call ที่ขอบระบบด้วย proxy/facade แล้วค่อยๆ ดึง capability ออกไปเป็น service ใหม่ทีละตัว ย้าย traffic เป็นขั้น และยังย้อนกลับได้ระหว่างทาง การเลือก capability แรกที่ coupling ต่ำทำให้ทีมได้เรียนรู้ทั้ง deploy, monitoring และ operation ของ service โดยความเสี่ยงต่ำ","info":"สำหรับ call ภายใน monolith ใช้ Branch by Abstraction คู่กับ feature toggle และใช้ parallel run หรือ shadow traffic เทียบผลลัพธ์เก่ากับใหม่ก่อนสลับจริง แยก service ตาม business capability หรือ bounded context ไม่ใช่ตามชั้นเทคนิค และเมื่อย้ายเสร็จต้องลบโค้ดเก่าออกจาก monolith พร้อมกำหนด owner และนโยบาย deprecation ของ service ให้ชัด","ref":"Sam Newman, Monolith to Microservices (O'Reilly, 2019); Martin Fowler — StranglerFigApplication"},{"id":"SD-01","competency":"system-design","level":"intermediate","outline":"Design scalable and reliable systems with multiple components based on agreed design standards and methodology","question":"ระบบจองห้องประชุมมี 2 instance หลัง load balancer แบบ sticky session และเก็บตะกร้าการจองไว้ใน memory ของ instance ต้องการ scale เป็น 10 instance ตามโหลด และให้ instance ใดตายได้โดยผู้ใช้ไม่เสียตะกร้า ควรออกแบบใหม่อย่างไร","options":["คง sticky session ไว้ แต่ยืด TTL ของ cookie และให้ load balancer ทำ health check ถี่ขึ้น","ทำ service ให้ stateless โดยย้าย state ตะกร้าไปไว้ใน store ภายนอกที่มี replication","ขยาย instance เดิมเป็นเครื่องที่ใหญ่ขึ้น และตั้ง auto-restart ทันทีเมื่อ process ตาย","ใช้ consistent hashing ที่ load balancer ให้ผู้ใช้กลับไป instance เดิมแม้จำนวนเครื่องเปลี่ยน"],"answer":1,"why":["ผิด: health check ช่วยแค่หยุดส่ง traffic ไปเครื่องที่ตาย แต่ตะกร้าที่อยู่ใน memory ของเครื่องนั้นหายไปแล้ว","ถูก: instance ใดก็รับ request ใดได้ เพิ่มลดเครื่องได้อิสระ และ state รอดเมื่อเครื่องตายเพราะอยู่ใน store ที่ replicate","ผิด: vertical scaling มีเพดานและยังเป็น single point of failure restart แล้ว memory ก็ว่างเปล่า","ผิด: ลดการย้ายผู้ใช้เมื่อเพิ่มลดเครื่อง แต่เมื่อ instance ตาย state ใน memory ก็ยังหายเหมือนเดิม"],"explanation":"การ scale แนวนอนและทนต่อเครื่องตายต้องการให้ process เป็น stateless และ share-nothing โดยย้าย state ที่ต้องอยู่ข้าม request ไปไว้ใน backing service ที่ทนทาน เช่น Redis ที่มี replica หรือฐานข้อมูล load balancer จึงกระจายโหลดได้อิสระโดยไม่ต้องพึ่ง sticky session","info":"Twelve-Factor App ข้อ VI ระบุว่า process ต้อง stateless และ sticky session เป็นสิ่งที่ไม่ควรพึ่ง เพราะทำให้โหลดไม่สมดุลด้วย ตั้ง TTL ให้ตะกร้าที่ถูกทิ้ง และใส่ idempotency key ในขั้นยืนยันการจอง เพื่อให้ client retry หลัง failover ได้โดยไม่จองซ้ำ","ref":"The Twelve-Factor App — VI. Processes"},{"id":"SD-02","competency":"system-design","level":"intermediate","outline":"Evaluate and model alternative architecture options using modeling tools","question":"ทีมต้องเลือกระหว่าง Sync-REST กับ Event-driven สำหรับ flow ชำระเงิน stakeholder แต่ละกลุ่มให้น้ำหนัก latency, availability และความง่ายในการแก้ไขต่างกัน และต้องการรู้ว่าการตัดสินใจใดได้อย่างหนึ่งแต่เสียอีกอย่าง วิธีประเมินใดตอบโจทย์นี้ตรงที่สุด","options":["ใช้ ATAM: สร้าง utility tree จาก quality attribute scenario แล้วหา sensitivity และ tradeoff point","วาด C4 container diagram ของทั้งสองทางเลือกให้ครบ แล้วให้ stakeholder ทุกกลุ่มลงคะแนนเลือกในที่ประชุม","ทำ load test ทั้งสองทางเลือกบน staging แล้วเลือกทางที่ได้ throughput และ p95 ดีกว่า","เขียน ADR บันทึกทางเลือกที่ทีม architect เลือก พร้อมเหตุผลและผลที่ตามมาของการตัดสินใจ"],"answer":0,"why":["ถูก: ATAM ดึง scenario ที่จัดลำดับความสำคัญจาก stakeholder แล้ววิเคราะห์ว่าการตัดสินใจใดเป็น tradeoff point ที่กระทบหลาย attribute","ผิด: C4 อธิบายโครงสร้างได้ดี แต่ไม่มีกลไกประเมินผลต่อ quality attribute การโหวตจึงอิงความเห็นมากกว่าหลักฐาน","ผิด: วัดได้แค่ performance ไม่ตอบเรื่อง availability และ modifiability ที่ stakeholder ให้น้ำหนักด้วย","ผิด: ADR บันทึกผลการตัดสินใจหลังเลือกแล้ว ไม่ใช่วิธีประเมินทางเลือกกับ quality attribute"],"explanation":"ATAM (Architecture Tradeoff Analysis Method) ให้ stakeholder ร่วมกันสร้าง quality attribute scenario และจัดลำดับใน utility tree จากนั้นวิเคราะห์ architectural approach ของแต่ละทางเลือก เพื่อหา sensitivity point (กระทบ attribute เดียว) และ tradeoff point (กระทบหลาย attribute) พร้อม risk ที่ต้องจัดการ","info":"ถ้าเวลาน้อยใช้รูปแบบที่เบากว่า เช่น mini-QAW หรือ ATAM แบบย่อหนึ่งวัน ผลลัพธ์ของ ATAM คือรายการ risk, non-risk และ tradeoff ซึ่งควรนำไปเขียนเป็น ADR ต่อ และแปลง quality attribute สำคัญเป็น fitness function (เช่น latency budget ใน CI) เพื่อตรวจต่อเนื่องหลังตัดสินใจแล้ว","ref":"SEI CMU/SEI-2000-TR-004 — ATAM: Method for Architecture Evaluation"},{"id":"SD-03","competency":"system-design","level":"intermediate","outline":"Create multiple design views (e.g., structural, behavioral, interface-level) to address diverse stakeholder concerns and system dimensions","question":"ใน 4+1 View Model ของ Kruchten ทีม performance ต้องการเอกสารที่อธิบายว่า thread และ task ใดทำงานพร้อมกัน สื่อสารกันแบบใดขณะ runtime มีจุด synchronization ที่ไหน และจุดใดอาจเป็น bottleneck ของ throughput ข้อมูลนี้ควรอยู่ใน view ใด","options":["Logical view","Physical view","Process view","Development view"],"answer":2,"why":["ผิด: Logical view อธิบาย functionality ที่ผู้ใช้ได้รับผ่าน class และ domain abstraction ไม่ได้ลงเรื่อง concurrency","ผิด: Physical view คือการ map software ลง node และ network สำหรับ system engineer ไม่ใช่การทำงานพร้อมกันของ process","ถูก: Process view ครอบคลุม concurrency, distribution, การสื่อสารระหว่าง process ขณะ runtime รวมถึง performance และ scalability","ผิด: Development view คือการจัด module/package และ layer ในซอร์สโค้ดสำหรับนักพัฒนา"],"explanation":"4+1 แบ่งมุมมองตามผู้มีส่วนได้ส่วนเสีย: Logical (ผู้ใช้), Process (integrator และทีม performance), Development (นักพัฒนา), Physical (system engineer) และ Scenarios เป็น +1 ที่ร้อยทุก view เข้าด้วยกัน คำถามเรื่อง thread, synchronization และ throughput จึงเป็นของ Process view","info":"ใน arc42 หรือ C4 แนวคิดเดียวกันถูกเรียกต่างกัน: runtime view ใกล้เคียง Process view และ deployment view ใกล้เคียง Physical view หลักสำคัญคือเลือก view ตาม concern ของ stakeholder แทนการยัดทุกอย่างไว้ในแผนภาพเดียว และใช้ sequence diagram ของ scenario สำคัญยืนยันว่าแต่ละ view สอดคล้องกัน","ref":"Philippe Kruchten, The 4+1 View Model of Architecture, IEEE Software, 1995"},{"id":"SD-04","competency":"system-design","level":"intermediate","outline":"Produce detailed specifications and refine designs based on functional specs, feedback, and performance expectations","question":"spec กำหนดว่า API ต้องรับได้ 400 requests/s ที่ peak latency เฉลี่ยต่อ request 250 ms ซึ่งในนั้นใช้ DB connection อยู่ 100 ms (ยืมแล้วคืนทันที) ตาม Little's Law ต้องมี DB connection ที่ใช้งานพร้อมกันอย่างน้อยประมาณเท่าใด (รวมทุก instance ก่อนเผื่อ headroom)","options":["ประมาณ 9 connections (core × 2 + 1)","ประมาณ 40 connections","ประมาณ 100 connections","ประมาณ 400 connections"],"answer":1,"why":["ผิด: สูตรนี้มาจากคำแนะนำของ HikariCP สำหรับประเมินความสามารถของ DB server ไม่ได้คำนวณจาก throughput ที่ spec กำหนด","ถูก: L = λ × W = 400 req/s × 0.1 s = 40 connection ที่ถูกใช้พร้อมกันโดยเฉลี่ย","ผิด: 400 × 0.25 s = 100 คือจำนวน request ที่ค้างในระบบ แต่ request ไม่ได้ถือ connection ตลอด 250 ms","ผิด: เป็นการเหมาว่าแต่ละ request ถือ connection เต็ม 1 วินาที ซึ่งไม่สอดคล้องกับเวลาที่ใช้จริง"],"explanation":"Little's Law: จำนวนงานในระบบเฉลี่ย L = อัตราเข้า λ × เวลาที่อยู่ในระบบ W เมื่อ 'ระบบ' คือ connection pool เวลา W คือช่วงที่ถือ connection (0.1 s) จึงได้ 400 × 0.1 = 40 connection ที่ต้องมีพร้อมกันโดยเฉลี่ย","info":"ค่าเฉลี่ยยังไม่พอสำหรับ spec จริง ต้องเผื่อ headroom ให้ความแปรปรวน (เช่น 20–30%) แล้วแบ่งตามจำนวน instance และตรวจว่าผลรวมไม่เกิน `max_connections` ของ DB การถือ connection ไว้ระหว่างเรียก HTTP ภายนอกจะทำให้ W พองขึ้นทันที จึงควรยืม connection ให้ช้าที่สุดและคืนให้เร็วที่สุด","ref":"John D. C. Little (1961) — Little's Law; HikariCP wiki — About Pool Sizing"},{"id":"SD-05","competency":"system-design","level":"advance","outline":"Architect enterprise-scale distributed systems balancing performance, reliability, security, and maintainability","question":"ระบบขายสินค้าแบบ active-active สอง region ช่วง flash sale มีสินค้าจำนวนจำกัดที่ห้าม oversell ส่วนหน้า catalog และการค้นหาสินค้าต้องใช้งานได้แม้ link ระหว่าง region ขาด (network partition) แนวทางใดสมดุลที่สุด","options":["ใช้ synchronous replication ข้าม region กับข้อมูลทั้งหมด ให้ทุก read/write เป็น strongly consistent","ใช้ eventual consistency ทั้งระบบ แล้วชดเชยลูกค้าที่ถูก oversell ภายหลังด้วยคูปองส่วนลด","ให้ทั้งสอง region ตัดสต็อกได้อิสระ แล้ว merge ค่าคงเหลือด้วย last-write-wins เมื่อ link กลับมา","ให้ stock ของสินค้า flash sale มี home region เดียวที่รับ write ส่วน catalog อ่านจาก replica ใกล้ตัว"],"answer":3,"why":["ผิด: ระหว่าง partition ระบบต้องหยุดรับ write และแม้ไม่มี partition ทุก request ก็จ่าย latency ข้าม region ทั้งที่ catalog ไม่ต้องการ","ผิด: ขัดกับเงื่อนไขห้าม oversell โดยตรง การชดเชยภายหลังไม่ได้รักษา invariant ทางธุรกิจ","ผิด: last-write-wins บน counter ทำให้การตัดสต็อกของอีก region หายไป (lost update) จึงเกิด oversell","ถูก: เลือก consistency ตามชนิดข้อมูล stock ใช้ single writer (CP ระหว่าง partition อีก region ปฏิเสธหรือรอคิว) ส่วน catalog ยอม stale ได้ (AP)"],"explanation":"CAP บังคับให้เลือกระหว่าง consistency กับ availability เฉพาะตอนเกิด partition แต่ไม่จำเป็นต้องเลือกแบบเดียวทั้งระบบ invariant ห้าม oversell ต้องการ coordination จึงให้ stock มีเจ้าของ write เดียว ส่วน catalog ที่ stale ได้ให้ทุก region อ่านจาก replica ของตัวเองเพื่อ availability และ latency","info":"PACELC ขยาย CAP ว่าแม้ไม่มี partition ก็ยังต้องแลกระหว่าง latency กับ consistency อีกทางหนึ่งของโจทย์นี้คือ escrow/quota: แบ่งโควตาสต็อกให้แต่ละ region ล่วงหน้าแล้วตัดได้อิสระภายในโควตา CRDT counter แบบ PN-counter บังคับเงื่อนไขค่าไม่ติดลบเองไม่ได้ invariant ลักษณะนี้ต้องมี coordination เสมอ","ref":"Daniel Abadi, Consistency Tradeoffs in Modern Distributed Database System Design (PACELC), IEEE Computer 2012"},{"id":"SD-06","competency":"system-design","level":"advance","outline":"Manage design risks by applying and adapting modeling tools and methods (e.g., impact analysis, design validation techniques)","question":"event `OrderPlaced` มี consumer 12 ตัวจากหลายทีม ทีม producer ต้องเปลี่ยน field `amount` (number) ให้เป็น object `{ value, currency }` ต้องการรู้ผลกระทบต่อ consumer แต่ละตัวก่อน deploy และกันไม่ให้ breaking change หลุดไป production เทคนิคใดเหมาะที่สุด","options":["ให้ consumer ลงทะเบียน consumer-driven contract (เช่น Pact) แล้วให้ CI ของ producer verify ทุก contract","รัน end-to-end test บน staging ที่ deploy consumer ทั้ง 12 ตัวพร้อมกัน ก่อนการ release ของ producer แต่ละรอบ","ให้ producer เขียน unit test ตรวจ JSON Schema ของ event ฉบับใหม่ให้ครอบคลุมครบทุก field","ประกาศการเปลี่ยนแปลงล่วงหน้าสองสปรินต์ แล้วให้ทุกทีม deploy พร้อมกันในวันเดียวกัน"],"answer":0,"why":["ถูก: contract บอกว่า consumer แต่ละตัวใช้ field ใดจริง producer จึงรู้ผลกระทบรายตัวตั้งแต่ CI ก่อน deploy โดยไม่ต้องตั้ง environment ทั้งชุด","ผิด: ตรวจได้จริงแต่ช้า เปราะ และรู้ผลช้าที่ staging ทั้งยังผูกทุกทีมเข้ากับรอบ release เดียวกัน","ผิด: ยืนยันได้แค่ว่า producer ส่งตาม schema ของตัวเอง ไม่รู้ว่า consumer คาดหวังรูปแบบเดิมอยู่","ผิด: lockstep deployment เพิ่มความเสี่ยงแทนการลด ถ้ามีทีมเดียวพลาด ทั้งระบบได้รับผลกระทบ"],"explanation":"Consumer-driven contract testing ให้ consumer ระบุสิ่งที่ตัวเองพึ่งพาเป็น contract แล้ว producer verify กับ contract ทั้งหมดใน pipeline ของตัวเอง จึงได้ impact analysis ที่แม่นรายตัวและเป็น gate อัตโนมัติก่อน deploy ซึ่งตรงกับการจัดการ design risk ของ interface ที่มีผู้ใช้หลายทีม","info":"Pact Broker มีคำสั่ง `can-i-deploy` ตรวจว่า version ที่จะ deploy เข้ากันได้กับ version ที่อยู่บน environment นั้นจริง ใช้ร่วมกับ schema registry ที่ตั้ง compatibility mode (BACKWARD/FULL) ได้ และส่ง breaking change แบบ expand/contract: เพิ่ม field ใหม่คู่ของเดิม ให้ consumer ย้ายครบ แล้วจึงลบ field เก่า","ref":"Pact documentation; Ian Robinson — Consumer-Driven Contracts (martinfowler.com)"},{"id":"SD-07","competency":"system-design","level":"advance","outline":"Lead system design governance and review, contributing to enterprise-wide design policies and architecture selection","question":"องค์กรใช้ Architecture Decision Record (ADR) ใน repo ของแต่ละทีมเป็นส่วนหนึ่งของ design governance ADR-012 'ใช้ RabbitMQ สำหรับ event ระหว่าง service' ถูกตัดสินใจใหม่ให้ย้ายไป Kafka ตามหลักการของ ADR ควรจัดการเอกสารอย่างไร","options":["แก้เนื้อหา ADR-012 ให้เป็น Kafka และอัปเดตวันที่ เพื่อให้ ADR ตรงกับสถาปัตยกรรมปัจจุบัน","ลบ ADR-012 ออกจาก repo เพื่อป้องกันไม่ให้ทีมใหม่อ่านแล้วนำการตัดสินใจเก่าไปใช้ผิด","เขียน ADR ใหม่ที่ระบุว่า supersede ADR-012 และเปลี่ยนสถานะของ ADR-012 เป็น Superseded","เพิ่มหัวข้อ Update ท้าย ADR-012 อธิบายการย้ายไป Kafka โดยคงสถานะเดิมเป็น Accepted"],"answer":2,"why":["ผิด: การแก้ทับทำให้เหตุผลและบริบทของการตัดสินใจเดิมหายไป ซึ่งเป็นคุณค่าหลักของ ADR","ผิด: ลบประวัติทิ้ง ทีมจะไม่รู้ว่าเคยใช้ RabbitMQ เพราะอะไรและเปลี่ยนเพราะอะไร","ถูก: ADR เป็น log ที่ไม่แก้ทับ การตัดสินใจที่เปลี่ยนต้องเป็น ADR ใหม่ที่อ้างถึงฉบับเดิม และฉบับเดิมเปลี่ยนสถานะเป็น Superseded","ผิด: สถานะ Accepted บอกว่ายังมีผลอยู่ ทั้งที่ถูกแทนแล้ว และการแก้ข้อความท้ายเอกสารขัดกับหลัก append-only ของ ADR"],"explanation":"Michael Nygard วาง ADR ให้เป็นบันทึกที่ไม่แก้ทับ เมื่อการตัดสินใจถูกกลับ ให้เก็บฉบับเดิมไว้และทำเครื่องหมายว่า superseded พร้อมเขียน ADR ใหม่ที่มี context และ consequences ของการตัดสินใจครั้งใหม่ ประวัติเหตุผลจึงตามย้อนได้ครบ","info":"โครง ADR ของ Nygard มี Title, Status, Context, Decision, Consequences เครื่องมืออย่าง adr-tools (`adr new -s 12 ...`) สร้างลิงก์ supersede ให้อัตโนมัติ governance ที่เบาและ scale ได้มักให้ review ADR ผ่าน pull request ส่งเฉพาะการตัดสินใจข้ามทีมเข้า review board และแปลงกฎที่ตรวจได้เป็น fitness function เช่น ArchUnit หรือ dependency-cruiser ใน CI","ref":"Michael Nygard, Documenting Architecture Decisions (2011)"},{"id":"DB-01","competency":"database-design","level":"intermediate","outline":"Design and normalize relational databases","question":"ตาราง `order_items(order_id, product_id, product_name, unit_price, qty, customer_email)` มี primary key เป็น `(order_id, product_id)` โดย `unit_price` คือราคา ณ เวลาที่สั่งซื้อ ข้อใดวิเคราะห์ normalization ได้ถูกต้อง","options":["`customer_email` ขึ้นกับ `order_id` เพียงส่วนเดียวของ key จึงเป็น partial dependency ที่ผิด 2NF","`unit_price` ซ้ำกับราคาในตาราง `products` จึงควรลบออกเพื่อให้ตารางผ่าน 3NF","`product_name` เป็น transitive dependency ผ่าน `unit_price` จึงผิด 3NF แต่ตารางยังผ่านเงื่อนไขของ 2NF","ตารางผ่าน 2NF แล้ว เพราะ primary key เป็น composite key ที่ไม่ซ้ำกันทุกแถว"],"answer":0,"why":["ถูก: email ถูกกำหนดโดย order (ผ่านลูกค้าของ order) ไม่ต้องรู้ product_id จึงขึ้นกับ key เพียงบางส่วน","ผิด: ราคา ณ เวลาซื้อเป็นข้อเท็จจริงของรายการสั่งซื้อ ขึ้นกับทั้ง key ไม่ใช่ข้อมูลซ้ำซ้อนกับราคาปัจจุบันของสินค้า","ผิด: `product_name` ขึ้นกับ `product_id` ซึ่งเป็นส่วนหนึ่งของ key จึงเป็น partial dependency ที่ผิดตั้งแต่ 2NF","ผิด: ความ unique ของ key ไม่ได้รับประกัน 2NF ซึ่งดูว่า non-key attribute ขึ้นกับ key ทั้งก้อนหรือไม่"],"explanation":"2NF กำหนดให้ทุก non-key attribute ขึ้นกับ candidate key ทั้งก้อน เมื่อ key เป็น `(order_id, product_id)` คอลัมน์ที่รู้ได้จาก `order_id` อย่างเดียว (`customer_email`) หรือจาก `product_id` อย่างเดียว (`product_name`) จึงเป็น partial dependency ส่วน `qty` และ `unit_price` ณ เวลาซื้อขึ้นกับทั้ง key","info":"การแก้คือแยก `customer_email` ไปไว้กับ `customers` (orders อ้าง `customer_id`) และ `product_name` ไปไว้ใน `products` แต่การเก็บ snapshot อย่างราคาหรือที่อยู่จัดส่ง ณ เวลาทำรายการเป็นการ denormalize โดยเจตนาที่ถูกต้อง เพราะค่าต้องถูกแช่แข็งตามเวลา ไม่ใช่ดึงค่าปัจจุบัน","ref":"C. J. Date, An Introduction to Database Systems — Second and Third Normal Forms"},{"id":"DB-02","competency":"database-design","level":"intermediate","outline":"Integrate multiple database technologies (SQL and NoSQL)","question":"บริการ Product ใช้ PostgreSQL เป็น source of truth และใช้ Redis เป็น cache แบบ cache-aside (อ่านแล้ว miss จึงโหลดจาก DB มา set ลง Redis) เมื่อมีการแก้ราคาสินค้าพร้อมกันหลาย request ลำดับการเขียนแบบใดเสี่ยงน้อยที่สุดที่ Redis จะค้างค่าเก่าไปจน TTL หมด","options":["อัปเดตค่าใน Redis ก่อน แล้วจึงอัปเดต PostgreSQL","ลบ key ใน Redis ก่อน แล้วจึงอัปเดต PostgreSQL","อัปเดต PostgreSQL แล้ว set ค่าใหม่ลง Redis ทันที","อัปเดต PostgreSQL แล้วจึงลบ key ใน Redis"],"answer":3,"why":["ผิด: ถ้าการเขียน DB ล้มเหลวหรือ rollback cache จะถือค่าที่ไม่เคยมีอยู่จริงใน source of truth","ผิด: ระหว่างลบ key กับ commit มี request อ่านที่ miss แล้วโหลดค่าเก่าจาก DB กลับมา set ได้ง่าย","ผิด: writer สองตัวที่ทำพร้อมกันอาจ set สลับลำดับกับ commit ทำให้ cache ค้างค่าของ writer ที่ commit ก่อน","ถูก: ลบหลัง commit ทำให้ read ถัดไปโหลดค่าล่าสุดจาก DB เหลือ race เฉพาะกรณีที่ read ช้าคร่อมทั้งการเขียน ซึ่งเกิดยากที่สุด"],"explanation":"แนวปฏิบัติของ cache-aside คืออัปเดต data store ก่อนแล้วจึง invalidate cache การลบ (แทนการ set) ตัดปัญหาลำดับของ writer หลายตัว และการทำหลัง commit ป้องกันไม่ให้ read ที่แทรกกลางทางโหลดค่าเก่ากลับเข้า cache","info":"race ที่ยังเหลือ (read miss ไปอ่านค่าเก่าแล้ว set ช้ากว่าการลบ) ลดได้ด้วย TTL เป็น safety net, lease แบบที่ Facebook ใช้กับ memcache หรือ delayed double delete ถ้าต้องการความแม่นยำสูงให้ invalidate จาก CDC ที่อ่าน WAL ของ PostgreSQL แทนการลบจากโค้ด application","ref":"Microsoft Azure Architecture Center — Cache-Aside pattern; Scaling Memcache at Facebook (NSDI 2013)"},{"id":"DB-03","competency":"database-design","level":"intermediate","outline":"Tune database performance using query plan analysis, indexing, and connection pool adjustments","question":"service มี 30 pods แต่ละ pod ตั้ง connection pool สูงสุด 20 ขณะที่ PostgreSQL ตั้ง `max_connections = 200` ช่วง scale-out เกิด error `sorry, too many clients already` และ CPU ของ DB สูงจาก connection จำนวนมาก แนวทางใดเหมาะที่สุด","options":["เพิ่ม `max_connections` เป็น 1000 ให้รองรับ pool ของทุก pod ได้พร้อมกันทั้งหมด","ใช้ PgBouncer แบบ transaction pooling ลด pool ต่อ pod และเลี่ยง state ระดับ session","ตั้ง `idleTimeout` ของ pool ให้สั้นลง เพื่อปล่อย connection ที่ไม่ได้ใช้คืนเร็วขึ้น","ตั้ง minimum idle เท่ากับ maximum ทุก pod เพื่อไม่ต้องเปิด connection ใหม่ตอน peak"],"answer":1,"why":["ผิด: แต่ละ connection ของ PostgreSQL คือหนึ่ง backend process ใช้ memory และเพิ่ม contention ยิ่งมาก throughput ยิ่งตก","ถูก: multiplex client จำนวนมากลงบน server connection จำนวนน้อย และรักษาผลรวม pool ให้อยู่ใต้ max_connections","ผิด: ช่วยตอน idle แต่ตอน peak ทุก pod ยังขอ connection ได้ถึง 20 รวม 600 เกินขีดจำกัดเหมือนเดิม","ผิด: fixed-size pool เป็นคำแนะนำที่ดีเมื่อผลรวมพอดีกับ DB แต่ที่นี่ทำให้ใช้ 600 connection ตลอดเวลา แย่ลงกว่าเดิม"],"explanation":"Throughput ของ DB สูงสุดที่จำนวน connection ที่ active พร้อมกันไม่มาก (ใกล้เคียงจำนวน core) การมี connection หลายร้อยเพิ่มแค่ context switching การใช้ PgBouncer แบบ transaction pooling ให้ client หลายพันตัวใช้ server connection ไม่กี่สิบตัวร่วมกัน คู่กับลด pool ต่อ pod ให้ผลรวมไม่เกินขีดจำกัด","info":"transaction pooling ไม่เก็บ state ของ session ข้าม transaction ฟีเจอร์อย่าง `SET`/`RESET`, `LISTEN`, cursor แบบ `WITH HOLD` และ advisory lock ระดับ session จึงใช้ไม่ได้ ส่วน protocol-level prepared statement รองรับตั้งแต่ PgBouncer 1.21 ผ่าน `max_prepared_statements` และอย่าลืมคิด Σ(pods × pool) จากจำนวน replica สูงสุดของ HPA ไม่ใช่จำนวนปกติ","ref":"PgBouncer documentation — Pool modes and feature map; PostgreSQL docs — max_connections"},{"id":"DB-04","competency":"database-design","level":"intermediate","outline":"Implement database migrations and versioning","question":"ต้องเปลี่ยนชื่อคอลัมน์ `fullname` เป็น `display_name` ในตาราง `users` ที่มีหลายสิบล้านแถว ระบบ deploy แบบ rolling ซึ่ง app เวอร์ชันเก่าและใหม่ทำงานพร้อมกันระยะหนึ่ง และใช้ Flyway จัดการ migration แนวทางใดถูกต้อง","options":["เพิ่ม `ALTER TABLE users RENAME COLUMN` เป็น migration ใหม่ และให้ pipeline รันก่อน deploy app เวอร์ชันใหม่ทุก pod","แก้ไฟล์ migration เดิมที่สร้างตาราง `users` ให้ใช้ชื่อใหม่ เพื่อให้ schema ทุก env ตรงกัน","deploy app ใหม่ให้ครบทุก pod ก่อน แล้วจึงรัน migration rename คอลัมน์ในวันเดียวกัน","ทำ expand/contract: เพิ่มคอลัมน์ใหม่ เขียนทั้งสองคอลัมน์และ backfill แล้วลบคอลัมน์เก่าใน release ถัดไป"],"answer":3,"why":["ผิด: ทันทีที่ rename pod เวอร์ชันเก่าที่ยังรันอยู่จะ query `fullname` ไม่เจอและ error ตลอดช่วง rolling","ผิด: Flyway เก็บ checksum ของ migration ที่รันแล้ว การแก้ไฟล์เดิมทำให้ validate ล้มเหลว และ env ที่รันไปแล้วจะไม่ถูกเปลี่ยน","ผิด: ระหว่าง rollout ก่อน rename pod เวอร์ชันใหม่จะหา `display_name` ไม่เจอ ปัญหาแค่ย้ายจากเวอร์ชันเก่าไปเวอร์ชันใหม่","ถูก: ทุกจุดเวลา schema รองรับทั้งสองเวอร์ชันของ app และลบของเก่าเมื่อไม่มีเวอร์ชันใดใช้แล้ว"],"explanation":"Zero-downtime migration ต้องทำให้ schema เข้ากันได้กับทั้ง app เวอร์ชันเก่าและใหม่ในทุกจังหวะ จึงแบ่งเป็น expand (เพิ่มคอลัมน์ใหม่ dual-write และ backfill), ย้าย read ไปคอลัมน์ใหม่ และ contract (ลบคอลัมน์เก่า) ใน release ที่ไม่มีโค้ดเวอร์ชันใดอ้างถึงแล้ว","info":"backfill หลายสิบล้านแถวควรทำเป็น batch (เช่นครั้งละ 10k แถว) เพื่อไม่ให้ lock นานหรือ WAL พุ่ง ตั้งแต่ PostgreSQL 11 การ `ADD COLUMN` พร้อม default ที่ไม่ volatile ไม่ต้อง rewrite ตาราง และถ้าต้องการ NOT NULL ให้เพิ่ม `CHECK (...) NOT VALID` แล้ว `VALIDATE CONSTRAINT` ภายหลังเพื่อลดเวลาที่ล็อกตาราง","ref":"Martin Fowler — ParallelChange; Flyway documentation — validate"},{"id":"DB-05","competency":"database-design","level":"advance","outline":"Architect enterprise database strategies for scalability, availability, and consistency","question":"PostgreSQL มี primary 1 ตัวและ async streaming replica 3 ตัวสำหรับ read หลังผู้ใช้แก้โปรไฟล์แล้วถูก redirect ไปหน้าโปรไฟล์ (อ่านจาก replica) บางครั้งเห็นค่าเก่า ต้องการ read-your-writes โดยไม่เพิ่ม latency ให้ write ทุกรายการในระบบ ควรทำอย่างไร","options":["ตั้ง `synchronous_commit = remote_write` ที่ primary เพื่อให้ replica ได้ข้อมูลก่อนตอบ commit","จำ LSN หลัง commit ของผู้ใช้ แล้วอ่านจาก replica ที่ replay ถึง LSN นั้น หรือ fallback ไป primary","เพิ่มจำนวน replica และตั้ง load balancer แบบ least-connections เพื่อให้ replication lag ของแต่ละตัวลดลง","ตั้ง isolation level ของ session ที่อ่านจาก replica เป็น `REPEATABLE READ`"],"answer":1,"why":["ผิด: เพิ่ม latency ให้ทุก write ที่เป็น synchronous และ `remote_write` รับประกันแค่ standby เขียนลง OS ยังไม่ได้ replay ให้ query มองเห็น","ถูก: จ่ายต้นทุนเฉพาะ session ที่เพิ่งเขียน ตรวจ `pg_last_wal_replay_lsn()` ของ replica เทียบกับ LSN ที่จำไว้ก่อนอ่าน","ผิด: lag มาจากการส่งและ replay WAL บนแต่ละ replica การเพิ่มจำนวนหรือเปลี่ยนวิธีกระจายโหลดไม่ทำให้ replay เร็วขึ้น","ผิด: isolation level ควบคุมการมองเห็นภายใน transaction บนเครื่องนั้น ไม่เกี่ยวกับว่า replica ได้รับข้อมูลล่าสุดหรือยัง"],"explanation":"Read-your-writes เป็น consistency ระดับ session จึงแก้ได้โดยไม่ทำให้ทั้งระบบ synchronous: หลัง commit ให้เก็บ `pg_current_wal_lsn()` ไว้กับ session แล้วเลือกอ่านจาก replica ที่ `pg_last_wal_replay_lsn()` ไล่ทันแล้ว หรืออ่านจาก primary ถ้ายังไม่มี replica ใดทัน","info":"วิธีที่ง่ายกว่าคือ pin การอ่านของผู้ใช้ไปที่ primary ชั่วคราวหลังเขียน (เช่น 5–10 วินาที) อีกทางคือ `SET LOCAL synchronous_commit = remote_apply` เฉพาะ transaction ที่ต้องการ ซึ่งต้องตั้ง `synchronous_standby_names` และ primary จะรอถ้า standby ที่เป็น synchronous ล่ม ควร monitor replication lag เป็น SLI และตั้ง alert ด้วย","ref":"PostgreSQL docs — System Administration Functions (pg_current_wal_lsn, pg_last_wal_replay_lsn); synchronous_commit"},{"id":"DB-06","competency":"database-design","level":"advance","outline":"Lead database performance optimization using advanced techniques (e.g., partitioning, sharding, in-memory caching)","question":"ตาราง `events` เก็บ log การใช้งานแบบ time-series ราว 2 พันล้านแถว query ส่วนใหญ่ดูย้อนหลัง 30 วัน และมี retention 13 เดือน ปัจจุบันลบข้อมูลเก่าด้วย `DELETE` รายวันทำให้ table bloat และ autovacuum ทำงานหนัก แนวทางใดแก้ตรงจุดที่สุดบน PostgreSQL","options":["ทำ hash partition ตาม `user_id` 16 partitions เพื่อกระจายข้อมูลให้แต่ละ partition เล็กลง","สร้าง BRIN index บน `created_at` แล้วเปลี่ยนเป็น `DELETE` แบบ batch ในช่วงกลางคืน","ทำ range partition รายเดือนตาม `created_at` แล้ว `DETACH`/`DROP` partition ที่พ้น retention","shard ข้อมูลไปหลาย node ตาม `user_id` ด้วย Citus เพื่อลดขนาดข้อมูลต่อ node"],"answer":2,"why":["ผิด: ข้อมูลเก่าของทุกเดือนกระจายอยู่ทุก partition การลบตาม retention ยังต้อง `DELETE` และ query ตามช่วงเวลาไม่ได้ prune","ผิด: BRIN ช่วย query ตามช่วงเวลาได้ดี แต่ `DELETE` ยังสร้าง dead tuple และ bloat เท่าเดิม แค่ย้ายเวลา","ถูก: retention กลายเป็นการ drop partition ทั้งก้อน ไม่มี dead tuple และ query 30 วันถูก prune เหลือ 1–2 partition","ผิด: เพิ่มความซับซ้อนระดับ distributed แต่ไม่แก้ต้นเหตุคือการลบทีละแถวที่สร้าง bloat"],"explanation":"เมื่อ access pattern และ retention ผูกกับเวลา range partitioning ตามเวลาคือเครื่องมือที่ตรงที่สุด การลบข้อมูลเก่าเป็นงาน metadata (`DETACH`/`DROP`) แทนการ `DELETE` หลายล้านแถว และ partition pruning ทำให้ query ช่วงล่าสุดแตะเฉพาะ partition ที่เกี่ยวข้อง","info":"ตั้งแต่ PostgreSQL 14 ใช้ `DETACH PARTITION ... CONCURRENTLY` เพื่อไม่ block query ที่กำลังทำงาน ควรสร้าง partition ล่วงหน้า (เช่นด้วย pg_partman) และระวัง DEFAULT partition ที่โตจนแยกออกยาก BRIN ยังใช้คู่กับ partition ได้ดีสำหรับข้อมูล append-only และจำนวน partition หลายพันจะเพิ่มเวลา planning","ref":"PostgreSQL docs — Table Partitioning; BRIN Indexes"},{"id":"DB-07","competency":"database-design","level":"advance","outline":"Design data lake and warehouse architectures","question":"data warehouse มี `dim_customer` และ `fact_sales` ฝ่ายขายต้องการรายงานยอดขายแยกตาม tier ที่ลูกค้า 'เป็นอยู่ ณ วันที่ซื้อ' ขณะที่ tier ของลูกค้าเปลี่ยนได้หลายครั้งต่อปี ควรออกแบบ dimension อย่างไร","options":["SCD Type 2: เพิ่มแถวใหม่ทุกครั้งที่ tier เปลี่ยน พร้อม surrogate key และช่วง `valid_from`/`valid_to`","SCD Type 1: overwrite tier ใน `dim_customer` ให้เป็นค่าล่าสุด แล้ว join กับ fact ด้วย `customer_id` ตอนออกรายงาน","SCD Type 3: เพิ่มคอลัมน์ `previous_tier` เก็บค่าก่อนหน้าไว้คู่กับค่าปัจจุบันในแถวเดิม","ไม่เก็บ tier ใน warehouse แต่ join กลับไปตาราง customer ของระบบ OLTP ตอน query"],"answer":0,"why":["ถูก: แต่ละเวอร์ชันของลูกค้าเป็นแถวแยก fact อ้าง surrogate key ของเวอร์ชันที่มีผล ณ วันที่ซื้อ รายงานจึงได้ tier ตามเวลาจริง","ผิด: overwrite ทำให้ประวัติหาย ยอดขายย้อนหลังทั้งหมดจะถูกนับตาม tier ปัจจุบัน","ผิด: เก็บได้แค่ค่าก่อนหน้าหนึ่งค่า เมื่อ tier เปลี่ยนหลายครั้งต่อปีประวัติที่เก่ากว่านั้นหายไป","ผิด: OLTP มีแค่ค่าปัจจุบันเช่นกัน และการ query ข้ามไประบบ operational ทำให้ warehouse ขาด history และกระทบโหลดของระบบจริง"],"explanation":"Slowly Changing Dimension Type 2 เก็บประวัติครบโดยสร้างแถวใหม่ทุกครั้งที่ attribute เปลี่ยน พร้อม surrogate key และช่วงเวลาที่มีผล เมื่อโหลด fact จะ lookup เวอร์ชันของลูกค้าที่ valid ณ วันที่ทำรายการ จึงรายงานตามสภาพ ณ เวลานั้นได้ถูกต้อง","info":"เพิ่มคอลัมน์ `is_current` เพื่อ query สถานะปัจจุบันได้เร็ว และใช้ natural key (`customer_id`) คู่กับ surrogate key เสมอ ถ้า attribute เปลี่ยนถี่มาก Kimball แนะนำ mini-dimension (Type 4) เพื่อไม่ให้ dimension บวม บน lakehouse อย่าง Delta Lake หรือ Apache Iceberg ทำ SCD2 ได้ด้วยคำสั่ง `MERGE`","ref":"Ralph Kimball & Margy Ross, The Data Warehouse Toolkit, 3rd ed. — Slowly Changing Dimension techniques"},{"id":"GIT-01","competency":"git","level":"intermediate","outline":"Use advanced commands for history manipulation, cherry-picking, stashing, and patch creation","question":"ทีม merge `feature/payment` เข้า `main` เป็น merge commit `M` แล้วพบ bug จึงรัน `git revert -m 1 M` และ deploy ต่อมาแก้ bug บน `feature/payment` เพิ่มเป็น commit `F` แล้วรัน `git merge feature/payment` บน `main` อีกครั้ง ผลบน `main` จะเป็นอย่างไร","options":["ได้ code ของ feature ทั้งหมดกลับมาพร้อม `F` เพราะ revert ได้ลบ commit เดิมออกจาก history ของ `main` ไปแล้ว","ได้เฉพาะการแก้ใน `F` เพราะ commit เดิมยังเป็น ancestor ของ `main` ต้อง revert ตัว revert commit ก่อน merge","merge หยุดด้วย conflict ในทุกไฟล์ที่ถูก revert และต้องใช้ `git merge -X theirs` เพื่อนำ code เดิมกลับมา","ได้ code ทั้งหมดกลับมาถ้าใช้ `git merge --no-ff` เพราะ Git จะคำนวณ merge base ใหม่โดยเริ่มจาก commit `F`"],"answer":1,"why":["ผิด: `git revert` สร้าง commit ใหม่ที่กลับ diff ไม่ได้ลบ commit ใดออกจาก history commit ของ feature ยังเป็น ancestor ของ `main`","ถูก: merge base ของรอบใหม่คือ tip เดิมของ feature Git จึงนำเข้าเฉพาะสิ่งที่เปลี่ยนหลังจากนั้น (`F`) ส่วน code เดิมยังถูก revert อยู่","ผิด: conflict เกิดเฉพาะจุดที่ `F` แก้ทับบรรทัดที่ถูก revert ไม่ใช่ทุกไฟล์ และ `-X theirs` เลือกฝั่ง feature เฉพาะ hunk ที่ชนกัน ส่วนที่ถูก revert โดยไม่ชนยังหายอยู่","ผิด: `--no-ff` แค่บังคับให้สร้าง merge commit ไม่ได้เปลี่ยนวิธีหา merge base ซึ่งยังเป็น tip เดิมของ feature"],"explanation":"`git revert -m 1 M` กลับเฉพาะ diff ที่ `M` นำเข้ามา โดย commit ของ feature ยังอยู่ใน history ของ `main` เมื่อ merge รอบใหม่ Git ถือว่า commit เหล่านั้น merge ไปแล้ว จึงนำเข้าเพียง `F` วิธีที่ถูกคือ `git revert \u003csha-ของ-revert-commit>` ก่อน แล้วจึง merge `F`","info":"เอกสาร Git หัวข้อ \"How to revert a faulty merge\" สรุปว่า revert ของ merge ย้อน 'ข้อมูล' แต่ไม่ย้อน 'history' ส่วน `-m 1` คือเลือก parent แรก (mainline) เป็นฝั่งที่คงไว้ ถ้า revert แบบนี้ไปแล้ว ควรจดไว้ใน PR/commit message ว่าต้อง revert-the-revert ก่อน merge feature เดิมซ้ำ ไม่อย่างนั้นอีกหลายสัปดาห์ต่อมาจะงงว่าทำไม code หายไป","ref":"git-scm.com Documentation/howto/revert-a-faulty-merge.txt; git-revert(1)"},{"id":"GIT-02","competency":"git","level":"intermediate","outline":"Resolve complex merge conflicts and rebase branches to maintain linear history","question":"`feature-b` แตกมาจาก `feature-a` ตามภาพ ต่อมา `feature-a` ถูก squash merge เข้า `main` เป็น commit `S` (ref `feature-a` ยังชี้ที่ `A2`) ต้องการ replay เฉพาะ `B1` และ `B2` ไปต่อบน `main` คำสั่งใดถูกต้อง","code":"main:       o---o---S          (S = squash ของ A1+A2)\n                 \\\nfeature-a:        A1---A2\n                         \\\nfeature-b:                B1---B2","codeLang":"text","options":["`git rebase main feature-b`","`git rebase --onto feature-a main feature-b`","`git rebase --onto main feature-a feature-b`","`git cherry-pick main..feature-b` บน branch ใหม่ที่แตกจาก `main`"],"answer":2,"why":["ผิด: `A1`, `A2` ไม่ได้เป็น ancestor ของ `main` (S เป็น commit ใหม่) Git จึงพยายาม replay `A1`, `A2`, `B1`, `B2` ทั้งหมด และมักชน conflict กับสิ่งที่อยู่ใน `S` แล้ว","ผิด: ลำดับ argument สลับกัน: จะ replay commit ที่อยู่ใน `feature-b` แต่ไม่อยู่ใน `main` (`A1`, `A2`, `B1`, `B2`) ไปไว้บน `feature-a`","ถูก: `--onto main` คือฐานใหม่ ส่วน `feature-a` คือ upstream ที่ใช้ตัดช่วง จึง replay เฉพาะ `feature-a..feature-b` คือ `B1`, `B2`","ผิด: range `main..feature-b` คือ commit ที่ reach ได้จาก `feature-b` แต่ไม่ reach จาก `main` ซึ่งรวม `A1`, `A2` ด้วย เพราะ squash ไม่ได้ทำให้ทั้งสองเป็น ancestor ของ `main`"],"explanation":"รูปแบบ `git rebase --onto \u003cnewbase> \u003cupstream> \u003cbranch>` นำ commit ในช่วง `\u003cupstream>..\u003cbranch>` ไปต่อบน `\u003cnewbase>` ในที่นี้ช่วง `feature-a..feature-b` คือ `B1`, `B2` จึงไปต่อบน `main` โดยไม่พา `A1`, `A2` (ซึ่งอยู่ใน `S` แล้ว) ไปด้วย","info":"ถ้า ref `feature-a` ถูกลบไปแล้วให้ใช้ SHA ของ `A2` แทน หรือใช้ `git rebase -i main` แล้ว drop `A1`, `A2` เอง ตั้งแต่ Git 2.38 มี `git rebase --update-refs` สำหรับ stacked branches ซึ่งเลื่อน ref ของ branch ที่ซ้อนกันให้อัตโนมัติ และถ้า rebase พลาด ใช้ `git reflog` หรือ `ORIG_HEAD` ย้อนกลับได้","ref":"git-rebase(1) — the --onto examples"},{"id":"GIT-03","competency":"git","level":"intermediate","outline":"Apply tagging and release management for stable deployments and version tracking","question":"release pipeline ถูก trigger เมื่อมี tag `v*` ขึ้น remote และสร้างเลขเวอร์ชันจาก `git describe` นักพัฒนารัน `git tag v1.4.0` ตามด้วย `git push --follow-tags` ผลคือ pipeline ไม่ทำงาน และ `git describe` บนเครื่องยังแสดง `v1.3.0-5-g3f2c1ab` สาเหตุที่ถูกต้องที่สุดคืออะไร","options":["`v1.4.0` เป็น lightweight tag ซึ่ง `--follow-tags` และ `git describe` แบบ default ไม่นับ ต้องสร้างด้วย `git tag -a`","`--follow-tags` จะ push tag เมื่อ commit ปลายทางมีบน remote อยู่ก่อนแล้ว จึงต้อง push branch ให้เสร็จก่อนค่อย push tag","`git describe` เลือก tag object ตามเวลาที่สร้างโดยเริ่มจากตัวที่เก่าที่สุด จึงข้าม `v1.4.0` ที่เพิ่งสร้างไป","lightweight tag เก็บเป็น object แยกที่ต้องส่งด้วย `git push --tags` ส่วน `--follow-tags` ส่งเฉพาะ branch ref"],"answer":0,"why":["ถูก: `--follow-tags` push เฉพาะ annotated tag ที่ reach ได้จาก ref ที่ push และ `git describe` ที่ไม่ใส่ `--tags` ก็ใช้เฉพาะ annotated tag","ผิด: `--follow-tags` ส่ง commit และ annotated tag ที่ชี้ไปยัง commit นั้นไปพร้อมกันได้ในการ push ครั้งเดียว ปัญหาอยู่ที่ชนิดของ tag ไม่ใช่ลำดับ","ผิด: `git describe` หา tag ที่ใกล้ที่สุดตาม commit graph ไม่ใช่ตามเวลา และถ้า HEAD มี annotated tag อยู่จะแสดงชื่อ tag นั้นตรง ๆ","ผิด: กลับด้านกัน: lightweight tag เป็นเพียง ref ที่ชี้ไปยัง commit ส่วน annotated tag ต่างหากที่เป็น tag object แยก"],"explanation":"lightweight tag เป็นแค่ ref ไม่มี tagger, วันที่ หรือข้อความ Git จึงมองว่าเป็น tag ส่วนตัว: `git push --follow-tags` ส่งเฉพาะ annotated tag และ `git describe` ที่ไม่ใส่ `--tags` ก็พิจารณาเฉพาะ annotated tag ผลคือ tag ไม่ขึ้น remote และ describe ยังอ้างอิง `v1.3.0`","info":"release tag ควรเป็น annotated (`git tag -a v1.4.0 -m \"...\"`) หรือ signed (`-s`) เพื่อบันทึกว่าใคร tag เมื่อไร ตั้ง `git config --global push.followTags true` ได้ ใน CI ที่ clone แบบ shallow (เช่น `fetch-depth: 1`) `git describe` จะหา tag ไม่เจอ ต้อง fetch history และ tags ให้พอ และไม่ควรย้าย tag ที่ปล่อยออกไปแล้ว ให้ออกเวอร์ชันใหม่แทน","ref":"git-push(1) --follow-tags; git-describe(1); git-tag(1)"},{"id":"GIT-04","competency":"git","level":"intermediate","outline":"Design and implement advanced branching and merging workflows (e.g., feature branches, release branches, hotfixes)","question":"ทีมใช้ Git Flow: `main` อยู่ที่ tag `v2.3.0`, `release/2.4.0` เปิดอยู่และกำลังอยู่ใน QA, `develop` มีงานของ 2.5 แล้ว พบ bug ร้ายแรงบน production ขั้นตอนใดถูกต้องตาม Git Flow","options":["แตก `hotfix/2.3.1` จาก `develop` แก้แล้ว merge เข้า `main` และ `develop` จากนั้น tag `v2.3.1` ที่ `main`","แตก `hotfix/2.3.1` จาก `release/2.4.0` เพื่อให้ fix อยู่ใน release ด้วย แล้ว merge เข้า `main` และ tag `v2.3.1`","แตก `hotfix/2.3.1` จาก `main` แก้แล้ว merge เข้า `main` (tag `v2.3.1`) และ `develop` แล้วให้ release ได้ fix ตอนปิด release","แตก `hotfix/2.3.1` จาก `main` แก้แล้ว merge เข้า `main` (tag `v2.3.1`) และ `release/2.4.0` ซึ่งจะไหลกลับ `develop` ตอนปิด"],"answer":3,"why":["ผิด: `develop` มีงานที่ยังไม่ผ่าน QA การแตก hotfix จาก `develop` จะพางานที่ยังไม่ release ขึ้น production ไปด้วย","ผิด: `release/2.4.0` มี feature ของ 2.4 ที่ยังอยู่ใน QA การ merge hotfix ที่แตกจากตรงนั้นเข้า `main` จะปล่อยของ 2.4 ออกไปพร้อม 2.3.1","ผิด: release branch ถูกตัดไปก่อนแล้วและไม่ดึงอะไรจาก develop (การปิด release คือ merge release เข้า `main` และ `develop`) จึงเสี่ยงปล่อย 2.4.0 ที่ bug กลับมา","ถูก: Git Flow กำหนดว่าเมื่อมี release branch เปิดอยู่ ให้ merge hotfix เข้า release branch แทน develop แล้ว fix จะเข้าถึง develop ตอนปิด release"],"explanation":"hotfix ต้องแตกจาก `main` ซึ่งตรงกับสิ่งที่อยู่บน production เมื่อเสร็จ merge กลับ `main` พร้อม tag ส่วนอีกขาหนึ่งปกติคือ `develop` แต่ถ้ามี release branch เปิดอยู่ Git Flow ให้ merge เข้า release branch แทน เพื่อไม่ให้ 2.4.0 ออกไปพร้อม bug เดิม","info":"ต้นฉบับของ Git Flow ระบุว่าถ้า develop ต้องการ fix ทันทีและรอปิด release ไม่ได้ ก็ merge เข้า develop เพิ่มได้ด้วย ทีมที่ deploy บ่อยมักเลือก trunk-based development ที่ตัด release branch สั้น ๆ แล้ว cherry-pick fix ลงไปแทน Git Flow เต็มรูปแบบ เพราะ branch อายุยาวทำให้ merge ยากและ feedback ช้า","ref":"Vincent Driessen, A successful Git branching model — Hotfix branches"},{"id":"GIT-05","competency":"git","level":"advance","outline":"Architect repository structures for large-scale, multi-team projects (e.g., monorepos, submodules, subtree strategies)","question":"สาม service (แยก repo กัน) ใช้ library `contracts` ร่วมกัน ข้อกำหนด: (1) clone service แล้ว build ได้ทันทีโดยไม่ต้องรันคำสั่ง Git เพิ่ม (2) CI ของแต่ละ service อ่านได้เฉพาะ repo ของตัวเอง ไม่มี credential ของ registry หรือ repo อื่น (3) แก้ library กับ service ใน PR เดียวกันได้ (4) repo `contracts` ต้นทางต้องคงอยู่เพราะทีมอื่นใช้ และต้องส่ง fix กลับไปได้ โครงสร้างใดตรงทุกข้อ","options":["ใช้ git submodule ชี้ tag ของ `contracts` และให้ทุกคน clone ด้วย `--recurse-submodules`","publish `contracts` เป็น private package แล้ว pin version ใน manifest ของแต่ละ service","ใช้ `git subtree add --prefix=libs/contracts` และส่ง fix กลับด้วย `git subtree push`","รวมทุก service และ `contracts` เป็น monorepo เดียว แล้วให้แต่ละทีมใช้ sparse-checkout"],"answer":2,"why":["ผิด: ขัดข้อ 1 และ 2: ต้อง init/update submodule เพิ่ม และ CI ต้องมีสิทธิ์อ่าน repo `contracts` อีกที่หนึ่ง การแก้ข้าม repo ก็ต้องเป็นสอง PR","ผิด: ขัดข้อ 2 และ 3: CI ต้องมี credential ของ registry และต้อง publish library ก่อน service จึงจะใช้ได้ แก้พร้อมกันใน PR เดียวไม่ได้","ถูก: subtree นำไฟล์และ history มาไว้ใต้ prefix ใน repo ของ service: clone/CI ไม่ต้องทำอะไรเพิ่ม แก้ได้ใน PR เดียว และ `subtree push` ส่ง commit ที่แตะ prefix กลับ repo ต้นทาง","ผิด: ขัดข้อ 4 และโจทย์ที่ service แยก repo: เมื่อยุบรวม `contracts` จะมี source สองที่ที่ต้องซิงก์กันเอง"],"explanation":"`git subtree` ฝัง source ของอีก repo ไว้ใต้ prefix เป็นไฟล์ปกติใน repo ของ service ผู้ clone และ CI ไม่ต้องรู้จัก subtree และแก้ library พร้อม service ใน commit เดียวได้ ส่วนการแลกเปลี่ยนกับ repo ต้นทางเป็นหน้าที่ของผู้ดูแล ผ่าน `git subtree pull` / `git subtree push`","info":"ข้อแลกเปลี่ยนของ subtree คือ history ของ library ปนเข้ามาใน repo ของ service (ใช้ `--squash` ลดได้) และควรแยก commit ที่แก้ library ออกจาก commit ของ service เพื่อให้ commit ที่ส่งกลับต้นทางอ่านรู้เรื่อง submodule เหมาะเมื่อต้องการ pin commit แยกชัดเจน ส่วน monorepo พร้อม build tool (Nx, Bazel, Turborepo) เหมาะเมื่อทุกทีมยอมย้ายมาอยู่ที่เดียว","ref":"git-subtree(1); Pro Git — Git Tools: Submodules"},{"id":"GIT-06","competency":"git","level":"advance","outline":"Lead migration and integration of legacy version control systems with Git, ensuring minimal disruption and data integrity","question":"ทีมย้าย repository SVN อายุ 10 ปี (โครง `trunk/branches/tags`) มา Git ด้วย `git svn clone \u003curl> --stdlayout --authors-file=authors.txt` ข้อใดอธิบายผลลัพธ์ได้ถูกต้อง และเป็นสิ่งที่ต้องจัดการก่อน push ขึ้น Git server","options":["SVN tags ถูก import เป็น remote branch `origin/tags/*` ไม่ใช่ Git tag ต้องแปลงเป็น annotated tag ก่อน push","SVN tags ถูก import เป็น annotated tag แล้ว แต่ tagger เป็นผู้รัน clone ต้องแก้ด้วย `git filter-repo` ก่อน","committer ที่ไม่มีใน `authors.txt` ถูก import ด้วย email `\u003cuser>@\u003crepo-uuid>` และต้องตามแก้ทีหลัง","`svn:externals` ถูกแปลงเป็น git submodule ให้ แต่ต้องแก้ URL ใน `.gitmodules` ให้ชี้ Git server ใหม่"],"answer":0,"why":["ถูก: tag ใน SVN คือการ copy directory ที่ commit ต่อได้ `git svn` จึงเก็บเป็น remote-tracking ref `refs/remotes/origin/tags/\u003cname>` ต้องสร้าง tag จริงจาก ref เหล่านั้นเอง","ผิด: `git svn` ไม่สร้าง Git tag ให้เลย ทั้ง lightweight และ annotated","ผิด: เมื่อระบุ `--authors-file` แล้วเจอชื่อที่ไม่มีในไฟล์ `git svn` จะ abort ต้องเติมชื่อแล้วรันต่อ รูปแบบ `\u003cuser>@\u003cuuid>` ใช้เมื่อไม่ได้ระบุ authors file","ผิด: `git svn` ไม่แปลง `svn:externals` ทีมต้องตัดสินใจเองว่าจะใช้ submodule, subtree หรือ package"],"explanation":"SVN ไม่มี tag ที่แยกจาก branch (tag คือ copy ใน `tags/`) `git svn` จึง import tag เป็น remote branch ภายใต้ `refs/remotes/origin/tags/` ก่อน push ต้องวน `git for-each-ref` สร้าง annotated tag จาก ref เหล่านั้น และสร้าง local branch จาก `origin/*` ที่ต้องการเก็บ","info":"ตรวจ data integrity ด้วยการเทียบ tree: `svn export` ของ trunk และแต่ละ tag เทียบกับ `git archive` ของ ref ที่ได้ (diff ต้องว่าง) และเทียบจำนวน revision กับจำนวน commit ระหว่างย้ายใช้ `git svn fetch` แบบ incremental จนถึงวัน cut-over แล้ว freeze ฝั่ง SVN ให้เป็น read-only ไฟล์ binary ขนาดใหญ่ควรย้ายไป Git LFS ก่อน push ครั้งแรก","ref":"git-svn(1) — --stdlayout, --authors-file, --prefix"},{"id":"GIT-07","competency":"git","level":"advance","outline":"Mentor teams on Git best practices, workflow customization, and toolchain extensions","question":"Lead ต้องการให้ทุก commit ใน 20 repo ใช้รูปแบบ Conventional Commits และไม่มี secret หลุด จึงเขียน script `commit-msg` และ `pre-commit` แนวทางใดทำให้ทุกคนได้ hook ชุดเดียวกันและกฎยังถูกบังคับได้จริง","options":["วาง script ไว้ใน `.git/hooks/` แล้ว commit ขึ้น repo เพื่อให้ทุกคนที่ clone ได้ hook ไปใช้ทันทีโดยไม่ต้องตั้งค่า","เก็บ hook ใน `.githooks/` แล้วตั้ง `core.hooksPath` ซึ่งทำให้ข้าม hook ด้วย `--no-verify` ไม่ได้อีกต่อไป","ติดตั้ง hook ชนิด `pre-receive` บนเครื่องของนักพัฒนาแต่ละคน เพื่อตรวจ commit ก่อนถูกส่งขึ้น remote","เก็บ hook ใน `.githooks/` ตั้ง `core.hooksPath` ผ่าน setup script แล้วตรวจกฎเดียวกันซ้ำใน CI"],"answer":3,"why":["ผิด: ไดเรกทอรี `.git/` ไม่ถูก track และไม่ไปกับ clone/push hook ใน `.git/hooks/` จึงอยู่แค่บนเครื่องที่วางไว้","ผิด: `core.hooksPath` แค่บอกตำแหน่งของ hook ส่วน `git commit --no-verify` ยังข้าม `pre-commit` และ `commit-msg` ได้ตามปกติ","ผิด: `pre-receive` ทำงานบน repository ที่รับ push (ฝั่ง server) ฝั่งเครื่องนักพัฒนาต้องใช้ `pre-commit`, `commit-msg` หรือ `pre-push`","ถูก: hook ที่ version อยู่ใน repo ร่วมกับ `core.hooksPath` ให้ feedback เร็วบนเครื่อง และการตรวจซ้ำใน CI/branch policy คือจุดบังคับที่ข้ามไม่ได้"],"explanation":"client-side hook ให้ feedback เร็วแต่ข้ามได้ด้วย `--no-verify` และไม่ถูก clone มาให้อัตโนมัติ จึงต้องแจกจ่ายผ่านไฟล์ใน repo + `core.hooksPath` (หรือเครื่องมืออย่าง husky/lefthook ที่ตั้งค่านี้ให้) แล้วบังคับจริงด้วยการตรวจซ้ำฝั่ง server เช่น CI job ที่เป็นเงื่อนไขก่อน merge","info":"secret ที่หลุดเข้า commit และถูก push แล้วถือว่ารั่ว แม้จะลบใน commit ถัดไป ต้อง revoke/rotate ก่อน แล้วค่อยพิจารณาล้าง history ด้วย `git filter-repo` ซึ่งทุกคนต้อง re-clone ควรเปิด secret scanning หรือ push protection ฝั่ง server เพิ่ม เพราะเป็นด่านที่นักพัฒนาข้ามเองไม่ได้","ref":"githooks(5); git-config(1) core.hooksPath"},{"id":"SQL-01","competency":"sql","level":"intermediate","outline":"Write multi-table queries using JOINs","question":"ต้องการรายงานลูกค้า 'ทุกคน' พร้อมจำนวน order ในปี 2026 (ลูกค้าที่ไม่มี order ปีนี้ต้องแสดง 0) แต่ query ด้านล่างทำให้ลูกค้าบางคนหายไป การแก้ข้อใดให้ผลถูกต้องครบทุกกรณีโดยเปลี่ยนน้อยที่สุด","code":"SELECT c.id, c.name, COUNT(o.id) AS orders_2026\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.created_at >= DATE '2026-01-01'\n  AND o.created_at \u003c  DATE '2027-01-01'\nGROUP BY c.id, c.name;","codeLang":"sql","options":["เปลี่ยน `COUNT(o.id)` เป็น `COUNT(*)` เพื่อให้ลูกค้าที่ไม่มี order ได้ค่า 0 แทนการหายไปจากผล","ย้ายเงื่อนไข `o.created_at` ทั้งสองข้อจาก `WHERE` ไปต่อท้ายเงื่อนไข `ON` ของ `LEFT JOIN`","เพิ่ม `OR o.created_at IS NULL` ใน `WHERE` เพื่อเก็บแถวของลูกค้าที่ไม่มี order ไว้","เปลี่ยน `LEFT JOIN` เป็น `FULL JOIN` เพื่อให้แถวที่ไม่ match จากทั้งสองตารางยังคงอยู่"],"answer":1,"why":["ผิด: แถวถูกตัดตั้งแต่ `WHERE` ก่อนถึง `GROUP BY` การเปลี่ยน aggregate ไม่ทำให้แถวกลับมา และถ้ากลับมา `COUNT(*)` จะนับแถวที่ฝั่ง orders เป็น NULL เป็น 1","ถูก: เงื่อนไขใน `ON` ใช้ตอน match ฝั่ง `orders` ลูกค้าที่ไม่มี order ในช่วงนี้ยังได้หนึ่งแถวที่ฝั่ง orders เป็น NULL และ `COUNT(o.id)` ให้ 0","ผิด: ลูกค้าที่ไม่มี order เลยจะกลับมา แต่ลูกค้าที่มีเฉพาะ order ปี 2025 ยังหายไป เพราะแถว join ของเขามี `created_at` ไม่เป็น NULL และไม่ผ่านช่วงวันที่","ผิด: `WHERE` ยังตัดแถวที่ `o.created_at` เป็น NULL ทิ้งเหมือนเดิม การเปลี่ยนชนิด join ไม่ช่วยถ้าเงื่อนไขยังอยู่ใน `WHERE`"],"explanation":"`LEFT JOIN` เก็บลูกค้าครบก็จริง แต่ `WHERE` ทำงานหลัง join และ `NULL >= date` ให้ UNKNOWN แถวของลูกค้าที่ไม่มี order ปี 2026 จึงถูกตัด ทำให้กลายเป็น inner join โดยปริยาย การย้ายเงื่อนไขของตารางฝั่ง nullable เข้าไปใน `ON` ทำให้กรองเฉพาะ order ที่จะ match","info":"หลักจำ: เงื่อนไขของตารางฝั่งขวาของ LEFT JOIN ใส่ใน `ON` ส่วนเงื่อนไขของตารางฝั่งซ้ายใส่ใน `WHERE` ได้ PostgreSQL planner จะลด outer join เป็น inner join เองเมื่อเห็น `WHERE` ที่ปฏิเสธ NULL ซึ่งเป็นสัญญาณให้ทบทวน อีกทางที่อ่านง่ายคือ aggregate order ปี 2026 ใน subquery/CTE แล้ว LEFT JOIN กับลูกค้าพร้อม `COALESCE(cnt, 0)`","ref":"PostgreSQL docs — 7.2.1.1 Joined Tables"},{"id":"SQL-02","competency":"sql","level":"intermediate","outline":"Develop optimized complex SQL queries using subqueries, CTEs, and indexing strategies","question":"column `order_items.product_id` เป็น nullable และมีอย่างน้อยหนึ่งแถวที่เป็น NULL (รายการสั่งทำพิเศษ) query ด้านล่างเขียนเพื่อหาสินค้าที่ไม่เคยถูกสั่ง ผลลัพธ์จะเป็นอย่างไร","code":"SELECT p.id, p.name\nFROM products p\nWHERE p.id NOT IN (SELECT oi.product_id FROM order_items oi);","codeLang":"sql","options":["ไม่ได้แถวใดเลย เพราะ `NOT IN` ที่เจอ NULL ในรายการให้ผลเป็น NULL แทน TRUE ควรใช้ `NOT EXISTS`","ได้รายการสินค้าที่ยังไม่มีใครสั่งครบถ้วน เพราะ PostgreSQL ตัดค่า NULL ออกจากผลของ subquery ใน `NOT IN` ให้เอง","เกิด error เพราะ `NOT IN` รับ subquery ที่คืนค่า NULL ไม่ได้ ต้องเพิ่ม `WHERE oi.product_id IS NOT NULL`","ได้รายการสินค้าที่ยังไม่มีใครสั่งครบถ้วน แต่ช้ากว่า `NOT EXISTS` เพราะ planner แปลง `NOT IN` เป็น anti-join ไม่ได้"],"answer":0,"why":["ถูก: `p.id NOT IN (1, NULL)` เท่ากับ `p.id \u003c> 1 AND p.id \u003c> NULL` ส่วนหลังเป็น NULL ผลรวมจึงไม่เคยเป็น TRUE ทุกแถวถูกกรองทิ้ง","ผิด: PostgreSQL ทำตาม SQL standard ไม่ตัด NULL ออกให้ three-valued logic ยังมีผลเต็มที่","ผิด: query นี้ไม่ error การเพิ่ม `IS NOT NULL` ใน subquery เป็นวิธีแก้ที่ใช้ได้ แต่เหตุผลว่าเกิด error ไม่ถูก","ผิด: ส่วนแรกผิดเพราะผลลัพธ์ว่าง แม้ส่วนหลังจะจริง (`NOT IN` ทำ anti-join ไม่ได้เพราะความหมายของ NULL)"],"explanation":"`NOT IN` ประเมินเป็น `\u003c> ALL(...)` เมื่อรายการมี NULL การเปรียบเทียบกับ NULL ให้ UNKNOWN จึงไม่มีแถวใดได้ TRUE ผลว่าง ส่วน `NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.id)` ไม่ได้รับผลจาก NULL และ planner แปลงเป็น anti-join ได้","info":"PostgreSQL wiki หน้า \"Don't Do This\" แนะนำให้เลี่ยง `NOT IN` กับ subquery เพราะทั้งผิดความหมายเมื่อมี NULL และมักช้าเมื่อผลของ subquery ใหญ่จนไม่พอ `work_mem` (planner ใช้ hashed subplan ไม่ได้) ส่วน `IN` ไม่มีปัญหานี้ เพราะ NULL ทำให้เพียงการเปรียบเทียบตัวนั้นไม่ match","ref":"PostgreSQL docs — 9.24.3 NOT IN; PostgreSQL wiki — Don't Do This"},{"id":"SQL-03","competency":"sql","level":"intermediate","outline":"Optimize queries using indexes, proper filtering, and query plans","question":"ตาราง `orders` 20 ล้านแถว มี B-tree index บน `created_at` (ชนิด `timestamptz`) แต่ query รายงานรายวันด้านล่างยังเป็น `Seq Scan` วิธีใดแก้ได้ถูกต้อง","code":"SELECT id, total\nFROM orders\nWHERE created_at::date = DATE '2026-11-01';","codeLang":"sql","options":["สร้าง index `ON orders ((created_at::date))` เพื่อให้ predicate นี้ใช้ index ได้ตรงตัว","รัน `ANALYZE orders` เพราะ statistics ที่เก่าทำให้ planner ประเมินว่า Seq Scan ถูกกว่า","ตั้ง `SET enable_seqscan = off` ใน session ของรายงานเพื่อบังคับให้ planner ใช้ index","เขียน predicate เป็นช่วง `created_at >= '2026-11-01' AND created_at \u003c '2026-11-02'`"],"answer":3,"why":["ผิด: การแปลง `timestamptz` เป็น `date` ขึ้นกับ `TimeZone` ของ session จึงไม่ IMMUTABLE คำสั่งนี้ error ว่า functions in index expression must be marked IMMUTABLE","ผิด: ปัญหาไม่ใช่ statistics เมื่อ column ถูกห่อด้วย cast index บน `created_at` ก็ใช้กับ predicate นี้ไม่ได้ ไม่ว่าสถิติจะเป็นอย่างไร","ผิด: `enable_seqscan = off` แค่ทำให้ Seq Scan ดูแพง ไม่ได้ทำให้ predicate ที่ไม่ sargable ใช้ index ได้ และไม่ควรใช้เป็นวิธีแก้ใน production","ถูก: predicate แบบช่วงบน column ตรง ๆ เป็น sargable ใช้ B-tree index เดิมได้ และได้ความหมายเดียวกันภายใต้ TimeZone ของ session"],"explanation":"B-tree index ใช้ได้เมื่อ predicate อยู่ในรูป `column \u003cop> ค่าคงที่` การห่อ column ด้วย cast หรือ function ทำให้ predicate ไม่ sargable การเขียนเป็นช่วงครึ่งเปิด `>= วันนั้น AND \u003c วันถัดไป` ใช้ index เดิมได้ทันทีโดยไม่ต้องสร้าง index ใหม่","info":"ช่วงครึ่งเปิด (`>=` กับ `\u003c`) ปลอดภัยกว่า `BETWEEN` สำหรับเวลา เพราะ `BETWEEN` รวมขอบบนจึงนับซ้ำข้ามวันได้ ถ้าต้องการ expression index จริงต้องใช้ expression ที่ IMMUTABLE เช่น `((created_at AT TIME ZONE 'Asia/Bangkok')::date)` และ query ต้องเขียน expression ให้ตรงกันทุกตัวอักษร planner จึงจะจับคู่ได้","ref":"PostgreSQL docs — 11.7 Indexes on Expressions; 8.5.1.3 Time Stamps"},{"id":"SQL-04","competency":"sql","level":"advance","outline":"Analyze and tune SQL performance using execution plans and profiling tools","question":"`EXPLAIN (ANALYZE, BUFFERS)` ของรายงานที่ใช้เวลา 2.1 วินาทีมีส่วนสำคัญดังนี้ (ในข้อมูลนี้ `zip` หนึ่งค่าอยู่ในเมืองเดียว) วิธีใดแก้ที่ต้นเหตุ","code":"Nested Loop  (cost=0.86..61.20 rows=4 width=40) (actual time=0.05..2093.7 rows=48210 loops=1)\n  ->  Index Scan using customers_city_zip_idx on customers c\n        (cost=0.43..8.46 rows=4 width=8) (actual time=0.03..31.8 rows=48210 loops=1)\n        Index Cond: ((city = 'Bangkok') AND (zip = '10110'))\n  ->  Index Scan using orders_customer_id_idx on orders o\n        (cost=0.43..13.17 rows=1 width=40) (actual time=0.020..0.042 rows=1 loops=48210)\n        Index Cond: (customer_id = c.id)","codeLang":"text","options":["เพิ่ม `work_mem` ของ session ให้ planner มีหน่วยความจำพอจะเลือก Hash Join แทน Nested Loop","สร้าง covering index `orders (customer_id) INCLUDE (total, created_at)` ให้ inner loop ไม่ต้องอ่าน heap","สร้าง `CREATE STATISTICS ... (dependencies) ON city, zip FROM customers` แล้ว `ANALYZE customers`","ตั้ง `ALTER TABLE customers ALTER COLUMN zip SET STATISTICS 1000` แล้ว `ANALYZE` ให้ histogram ละเอียดขึ้น"],"answer":2,"why":["ผิด: planner เลือก Nested Loop เพราะคาดว่าฝั่งนอกมีแค่ 4 แถว ไม่ใช่เพราะหน่วยความจำไม่พอ การเพิ่ม `work_mem` ไม่แก้การประเมินจำนวนแถวที่ผิด","ผิด: inner loop แต่ละรอบใช้เพียง ~0.04 ms ปัญหาคือจำนวนรอบ 48,210 ที่ planner ไม่ได้คาดไว้ การลด heap access ช่วยได้เพียงเล็กน้อย","ถูก: estimate 4 แถวแต่จริง 48,210 เพราะ planner คูณ selectivity ของ `city` กับ `zip` โดยถือว่าเป็นอิสระต่อกัน extended statistics แบบ functional dependency แก้การประเมินนี้","ผิด: statistics target ทำให้ histogram/MCV ของแต่ละ column ละเอียดขึ้น แต่ planner ยังถือว่าสอง column เป็นอิสระต่อกัน ค่าประเมินจึงยังต่ำเกินจริง"],"explanation":"สัญญาณสำคัญคือ `rows=4` (estimate) เทียบกับ `rows=48210` (actual) ที่ node ล่างสุด การประเมินผิดหลักหมื่นเท่าทำให้ planner เลือก Nested Loop ซึ่งดีเมื่อฝั่งนอกมีไม่กี่แถว ต้นเหตุคือ column ที่สัมพันธ์กัน (`zip` กำหนด `city`) ซึ่งแก้ด้วย `CREATE STATISTICS` ชนิด `dependencies` หรือ `mcv` แล้ว planner จะเลือก join ที่เหมาะกับแถวจำนวนมาก","info":"เวลาอ่าน `EXPLAIN ANALYZE` ให้หา node ที่ estimate กับ actual ต่างกันมากและอยู่ลึกที่สุดก่อน เพราะความผิดพลาดส่งต่อขึ้นไปทั้งต้นไม้ ค่า `actual time` และ `rows` ของ inner node เป็นค่าต่อหนึ่ง loop ต้องคูณด้วย `loops` และ `ANALYZE` รัน query จริง ถ้าเป็น `UPDATE/DELETE` ให้ห่อด้วย `BEGIN ... ROLLBACK` บน production ใช้ `auto_explain` และ `pg_stat_statements` เก็บ plan ของ query ที่ช้า","ref":"PostgreSQL docs — 14.1 Using EXPLAIN; 14.2.2 Extended Statistics"},{"id":"SQL-05","competency":"sql","level":"advance","outline":"Manage transactions, concurrency, and locking for reliable data consistency and integrity","question":"กฎธุรกิจ: แต่ละ shift ต้องมีแพทย์ on-call อย่างน้อย 1 คน แพทย์ 2 คนของ shift 7 กดลาพร้อมกัน แต่ละ transaction รันโค้ดด้านล่าง (ด้วย `doctor_id` ของตน) ภายใต้ `REPEATABLE READ` ผลคือทั้งสอง commit สำเร็จและ shift 7 ไม่เหลือใคร on-call วิธีใดป้องกันได้ถูกต้อง","code":"BEGIN ISOLATION LEVEL REPEATABLE READ;\nSELECT count(*) FROM on_call WHERE shift_id = 7 AND active;  -- ได้ 2\n-- แอปตรวจว่า count >= 2 จึงอนุญาตให้ลา\nUPDATE on_call SET active = false\nWHERE shift_id = 7 AND doctor_id = :me;\nCOMMIT;","codeLang":"sql","options":["รวมการนับและ `UPDATE` เป็น statement เดียวด้วย CTE เพื่อให้การตรวจและการแก้เกิดแบบ atomic","ใช้ `SERIALIZABLE` และให้แอป retry ทั้ง transaction เมื่อได้ SQLSTATE `40001`","ใช้ `READ COMMITTED` และเปลี่ยนเป็น `SELECT count(*) ... FOR UPDATE` เพื่อล็อกแถวที่นับ","เพิ่ม `CHECK ((SELECT count(*) FROM on_call o WHERE o.shift_id = shift_id AND o.active) >= 1)`"],"answer":1,"why":["ผิด: statement เดียวก็ยังอ่านจาก snapshot ของตัวเอง สอง statement ที่รันพร้อมกันต่างเห็น 2 และ update คนละแถวจึงไม่ชนกัน write skew ยังเกิดได้","ถูก: SSI ของ PostgreSQL ตรวจพบ read/write dependency ระหว่างสอง transaction ที่อ่านชุดแถวเดียวกันแล้วเขียนคนละแถว และ abort หนึ่งตัวด้วย 40001 รอบ retry จะเห็นข้อมูลล่าสุดและปฏิเสธการลา","ผิด: PostgreSQL ไม่อนุญาต `FOR UPDATE` ร่วมกับ aggregate (error: FOR UPDATE is not allowed with aggregate functions)","ผิด: CHECK constraint ใน PostgreSQL ใช้ subquery ไม่ได้ (error: cannot use subquery in check constraint) และตรวจได้เฉพาะแถวที่กำลังเขียน"],"explanation":"นี่คือ write skew: ทั้งสอง transaction อ่านชุดข้อมูลเดียวกันจาก snapshot แล้วเขียนคนละแถว `REPEATABLE READ` (snapshot isolation) ตรวจเฉพาะการเขียนแถวเดียวกัน จึงไม่เห็นปัญหา `SERIALIZABLE` ตรวจ dependency แบบนี้และยกเลิกหนึ่งตัว แอปจึงต้อง retry เมื่อได้ `40001`","info":"ทางเลือกที่ใช้ได้ภายใต้ `READ COMMITTED` คือ `SELECT doctor_id FROM on_call WHERE shift_id = 7 AND active FOR UPDATE` (ล็อกแถวโดยไม่ aggregate แล้วนับในแอป) หรือ `pg_advisory_xact_lock(7)` เพื่อ serialize ตาม shift ทุกวิธีต้องมี retry/timeout ชัดเจน และ `SERIALIZABLE` ได้ผลดีเมื่อ transaction สั้นและ transaction ที่เกี่ยวข้องทุกตัวใช้ระดับเดียวกัน","ref":"PostgreSQL docs — 13.2.3 Serializable Isolation Level; SELECT — The Locking Clause"},{"id":"SQL-06","competency":"sql","level":"advance","outline":"Write complex stored procedures, triggers, and user-defined functions for automation and business logic","question":"หลังติดตั้ง trigger ด้านล่าง คำสั่ง `UPDATE accounts SET balance = balance - 100 WHERE id = 1;` ตอบกลับ `UPDATE 0` ข้อใดอธิบายสถานะของข้อมูลได้ถูกต้อง","code":"CREATE FUNCTION audit_balance() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  INSERT INTO balance_audit(account_id, old_balance, new_balance, changed_at)\n  VALUES (OLD.id, OLD.balance, NEW.balance, now());\n  RETURN NULL;\nEND $$;\n\nCREATE TRIGGER trg_audit_balance\nBEFORE UPDATE ON accounts\nFOR EACH ROW EXECUTE FUNCTION audit_balance();","codeLang":"sql","options":["`accounts` ไม่เปลี่ยน แต่มีแถวใหม่ใน `balance_audit` เพราะ BEFORE row trigger ที่คืน `NULL` ข้ามเฉพาะการ update แถวนั้น","`accounts` และ `balance_audit` ไม่เปลี่ยนทั้งคู่ เพราะ BEFORE row trigger ที่คืน `NULL` ทำให้ทั้ง statement ถูก rollback","`accounts` ถูก update แล้ว แต่ command tag แสดง 0 เพราะ trigger คืน `NULL` แทนแถวที่ส่งกลับไปให้ client","`accounts` ถูก update ตามปกติ แต่ `balance_audit` ไม่มีแถวใหม่ เพราะ `RETURN NULL` ยกเลิกงานภายใน trigger function"],"answer":0,"why":["ถูก: ใน BEFORE ... FOR EACH ROW การคืน NULL คือสั่งให้ข้ามการทำงานกับแถวนั้น โดยไม่ error และไม่ rollback สิ่งที่ function ทำไปแล้ว INSERT ลง audit จึงยังอยู่","ผิด: ไม่มี error จึงไม่มี rollback คำสั่งจบตามปกติพร้อม `UPDATE 0`","ผิด: command tag นับแถวที่ถูกแก้จริง `UPDATE 0` หมายถึงไม่มีแถวใดถูก update การคืนแถวให้ client เป็นหน้าที่ของ `RETURNING`","ผิด: ค่าที่ trigger คืนควบคุมแค่การทำงานกับแถวเป้าหมาย ไม่ย้อน SQL ที่ function รันไปแล้ว และ update ก็ถูกข้ามด้วย"],"explanation":"ค่าที่ BEFORE row trigger คืนกำหนดว่าจะเขียนแถวใด: คืน `NEW` (หรือแถวที่แก้แล้ว) เพื่อทำต่อ คืน `NULL` เพื่อข้ามแถวนั้นแบบเงียบ ผลข้างเคียงใน function เช่น INSERT ลง audit เกิดขึ้นไปแล้ว ผลคือ audit บันทึกการเปลี่ยนที่ไม่เคยเกิดจริง","info":"audit log ควรใช้ AFTER trigger เพราะค่าที่คืนถูกละเลย และเห็นแถวสุดท้ายหลัง BEFORE trigger อื่นทั้งหมดแล้ว ถ้าแก้หลายแถวต่อ statement ใช้ statement-level AFTER trigger กับ transition table (`REFERENCING NEW TABLE AS ...`) เพื่อ insert เป็นชุด และใส่ `WHEN (OLD.balance IS DISTINCT FROM NEW.balance)` เพื่อข้าม update ที่ค่าไม่เปลี่ยนจริง","ref":"PostgreSQL docs — 39.1 Overview of Trigger Behavior; 43.10 Trigger Functions (PL/pgSQL)"},{"id":"MON-01","competency":"monitoring","level":"intermediate","outline":"Implement distributed tracing and APM","question":"service A เรียก HTTP ไป service B แล้ว B ส่ง message ผ่าน message queue ให้ service C ใน tracing backend ส่วน A→B อยู่ใน trace เดียวกัน แต่ span ของ C ขึ้นเป็น trace ใหม่ที่ไม่มี parent ทั้งสาม service ใช้ OpenTelemetry SDK และส่ง span ครบทุกตัว ควรแก้อย่างไร","options":["ปรับ sampling ratio ของ service C เป็น 1.0 เพื่อไม่ให้ span ที่ต่อจาก B ถูกทิ้งก่อนส่งออก","ใส่ `trace_id` ใน log ของทั้ง B และ C แล้วใช้ log correlation ของ backend เชื่อมสองส่วนเข้าด้วยกัน","ตั้ง `service.name` ของ B และ C ให้เป็นค่าเดียวกัน เพื่อให้ backend รวม span ของทั้งสองไว้ใน trace เดียว","ให้ B inject trace context (`traceparent`) ลงใน message header และให้ C extract context นั้นก่อนสร้าง span"],"answer":3,"why":["ผิด: span ของ C ไม่ได้หาย แต่เกิดเป็น trace ใหม่ แสดงว่า C ไม่ได้รับ context การปรับ sampling ไม่สร้างความสัมพันธ์ parent-child","ผิด: C มี trace_id คนละค่ากับ B อยู่แล้ว log correlation จึงเชื่อมสองส่วนไม่ได้ และไม่ทำให้ trace ต่อกัน","ผิด: `service.name` เป็น resource attribute ที่ใช้ระบุ service ไม่ใช่ตัวเชื่อม trace การตั้งค่าซ้ำกันทำให้แยก service ไม่ออกด้วย","ถูก: ข้าม HTTP instrumentation inject/extract header ให้อยู่แล้ว แต่ข้าม queue ต้องส่ง context ไปกับ message ผ่าน propagator แล้ว extract ฝั่ง consumer"],"explanation":"trace ต่อกันได้ด้วย context propagation: trace id และ parent span id ต้องเดินทางไปกับ request ทุก hop สำหรับ HTTP auto-instrumentation ทำให้แล้ว แต่ message queue ต้อง inject `traceparent` ลง message header ตอน publish และ extract ตอน consume (หลาย client library มี instrumentation ให้ แต่ต้องเปิดใช้และตรวจว่าครอบคลุม)","info":"ตาม OpenTelemetry messaging semantic conventions ฝั่ง consumer ที่รับเป็น batch ควรใช้ span links ชี้ไปยัง context ของแต่ละ message แทนการเลือก parent เดียว ตั้ง span kind เป็น `PRODUCER`/`CONSUMER` เพื่อให้ backend วาด service map ได้ถูก และ propagator ต้องตรงกันทุก service ถ้ามี service เก่าที่ใช้ B3 ให้ตั้ง composite propagator","ref":"OpenTelemetry — Context propagation; Semantic conventions for messaging spans"},{"id":"MON-02","competency":"monitoring","level":"intermediate","outline":"Design comprehensive observability strategies using metrics, logs, traces across services","question":"ทีมเพิ่ม label `user_id` และ `path` (เป็น URL จริง เช่น `/orders/98123`) ให้ metric `http_requests_total` ของ Prometheus หลังจากนั้นหน่วยความจำของ Prometheus โตขึ้นเรื่อย ๆ จนถูก OOM kill การออกแบบใดถูกต้องที่สุด","options":["เพิ่ม `scrape_interval` จาก 15s เป็น 60s เพื่อลดจำนวน sample ที่ Prometheus ต้องเก็บในหน่วยความจำ","เปลี่ยน metric เป็น histogram เพื่อให้ Prometheus รวมค่าตาม `user_id` เป็น bucket ก่อนจัดเก็บ","ใช้ route template (`/orders/{id}`) เป็น label ตัด `user_id` ออก และเก็บรายละเอียดรายคนใน trace/log","สร้าง recording rule `sum without (user_id)` แล้วให้ dashboard และ alert อ่านจาก recording rule แทน"],"answer":2,"why":["ผิด: หน่วยความจำของ Prometheus ขึ้นกับจำนวน active series เป็นหลัก ซึ่งยังเท่าเดิมแม้ scrape ห่างขึ้น","ผิด: histogram ไม่ aggregate label ที่ส่งมา กลับคูณจำนวน series ด้วยจำนวน bucket ทำให้ cardinality สูงขึ้นอีก","ถูก: label ต้องมีชุดค่าจำกัดและคาดเดาได้ route template ทำให้ cardinality คงที่ ส่วนรายละเอียดราย request/ราย user เป็นงานของ trace และ log","ผิด: series ดิบที่มี `user_id` ยังถูก ingest และเก็บใน head block ก่อน recording rule ทำงาน หน่วยความจำจึงยังโตเท่าเดิม"],"explanation":"แต่ละชุดค่าของ label คือ time series หนึ่งตัว `user_id` × `path` ที่มีค่าไม่จำกัดทำให้ series ระเบิด (cardinality explosion) วิธีที่ถูกคือจำกัด label ให้มีค่าน้อย (method, route template, status class) แล้วย้ายข้อมูล high-cardinality ไปไว้ในสัญญาณที่ออกแบบมารองรับ คือ trace และ structured log","info":"แนวทาง instrumentation ของ Prometheus แนะนำให้ cardinality ของ metric ส่วนใหญ่อยู่ต่ำกว่าราว 10 ตรวจ series ที่โตผิดปกติได้จากหน้า TSDB Status ของ Prometheus การใช้ exemplars แนบ trace id ไปกับ histogram ทำให้คลิกจาก metric ที่ผิดปกติไปยัง trace ตัวอย่างได้โดยไม่เพิ่ม series","ref":"Prometheus docs — Instrumentation: Use labels / Do not overuse labels"},{"id":"MON-03","competency":"monitoring","level":"intermediate","outline":"Lead incident response with structured runbooks and post-mortem analysis (e.g., root cause analysis)","question":"หลัง deploy เวอร์ชันใหม่ connection pool ของฐานข้อมูลเต็มจน API ตอบ 503 นาน 40 นาที on-call แก้ด้วยการ restart pod ร่าง post-mortem เขียนว่า \"Root cause: ผู้ deploy ไม่ได้ตรวจค่า pool / Action: ระวังให้มากขึ้น\" การปรับแก้ข้อใดตรงกับแนวทาง post-mortem ที่ดีที่สุด","options":["ระบุชื่อผู้ deploy เป็นสาเหตุหลักให้ชัดเจน และกำหนดให้ต้องผ่าน checklist กับหัวหน้าทีมก่อนจะได้สิทธิ์ deploy อีกครั้ง","เขียน timeline และ contributing factors (connection leak, ขาด alert ตอน pool ใกล้เต็ม, ไม่มี canary) พร้อม action มีเจ้าของและกำหนดเสร็จ","เปลี่ยน root cause เป็นการที่ pod ทำงานนานจน pool หมด และ action คือเพิ่ม liveness probe ให้ restart pod อัตโนมัติเมื่อตอบช้า","ใช้ 5 Whys สรุปให้เหลือ root cause เดียวคือการขาด code review และ action คือเพิ่มจำนวน reviewer ของทุก PR เป็นสองคน"],"answer":1,"why":["ผิด: เป็นการโทษบุคคล ทำให้คนไม่กล้ารายงานข้อมูลจริง และไม่แก้ระบบที่ยอมให้ความผิดพลาดนี้ผ่านไปถึง production","ถูก: post-mortem แบบ blameless เน้นลำดับเหตุการณ์ ปัจจัยหลายชั้นที่ทำให้เกิดและทำให้กระทบนาน และ action item ที่วัดผลได้ มีเจ้าของ มีกำหนดเสร็จ","ผิด: เป็นการแก้อาการ การ restart ซ่อน connection leak ไว้ และยังไม่มีอะไรช่วยตรวจจับหรือป้องกันใน deploy ครั้งถัดไป","ผิด: ระบบซับซ้อนมักมีหลายปัจจัยร่วม การบีบให้เหลือสาเหตุเดียวทำให้พลาดเรื่อง alert และ deploy safety และการเพิ่ม reviewer ไม่ได้ตรวจจับ connection leak"],"explanation":"post-mortem ที่ดีตอบว่าเกิดอะไรขึ้น ทำไมระบบยอมให้เกิด ทำไมตรวจพบช้า และจะป้องกันหรือลดผลกระทบอย่างไร โดยไม่โทษบุคคล ข้อความ 'ระวังให้มากขึ้น' ไม่ใช่ action item เพราะวัดผลไม่ได้และไม่มีเจ้าของ","info":"Google SRE book แนะนำให้ติดตาม action item จนปิดจริงและแยกชนิด เช่น prevent / mitigate / detect ตัวเลขที่ควรบันทึกได้แก่ time to detect, time to mitigate และผลต่อ SLO/error budget ระหว่างเหตุการณ์ควรแยกบทบาท incident commander, ผู้สื่อสาร และผู้ลงมือแก้ เพื่อไม่ให้คนเดียวแบกทุกอย่าง","ref":"Google SRE book — ch.15 Postmortem Culture; ch.14 Managing Incidents"},{"id":"MON-04","competency":"monitoring","level":"advance","outline":"Define reliability engineering practices","question":"บริการมี SLO ความพร้อมใช้งาน 99.9% ต่อรอบ 30 วัน (error budget 0.1%) ทีมต้องการ alert ที่ page on-call เมื่อ budget ถูกเผาเร็วจนต้องลงมือทันที และไม่ page เพราะ error สั้น ๆ ที่หายเอง เงื่อนไขใดเหมาะที่สุดตามแนวทาง multi-window, multi-burn-rate","options":["page เมื่อ error ratio ในช่วง 5 นาทีล่าสุดเกิน 0.1% เพื่อให้รู้ทันทีที่บริการต่ำกว่า SLO","page เมื่อ error budget ที่เหลือของรอบ 30 วันต่ำกว่า 10% เพื่อให้มีเวลาแก้ก่อนหลุด SLO","page เมื่อ error ratio เฉลี่ยของ 30 วันล่าสุดเกิน 0.1% ซึ่งตรงกับนิยามของ SLO โดยตรง","page เมื่อ error ratio ทั้งช่วง 1 ชั่วโมงและ 5 นาทีล่าสุดเกิน 1.44% (burn rate 14.4)"],"answer":3,"why":["ผิด: burn rate 1 ในหน้าต่าง 5 นาทีเกิดบ่อยจาก error ชั่วคราว ทำให้ page ถี่แต่ส่วนใหญ่ไม่ต้องทำอะไร (precision ต่ำ)","ผิด: เป็นสัญญาณที่ช้า เตือนครั้งแรกเมื่อ budget ถูกใช้ไปแล้ว 90% และไม่บอกว่ากำลังเผาเร็วแค่ไหน","ผิด: หน้าต่าง 30 วันตอบสนองช้ามาก ตรวจพบหลังเสียหายไปมาก และ alert จะค้างอีกนานแม้แก้แล้ว (reset time ยาว)","ถูก: burn rate 14.4 ในหนึ่งชั่วโมงคือใช้ budget 2% ของ 30 วันภายในชั่วโมงเดียว และหน้าต่าง 5 นาทีช่วยยืนยันว่ายังเกิดอยู่ ทำให้ alert หยุดเร็วหลังแก้"],"explanation":"burn rate คืออัตราการใช้ error budget เทียบกับอัตราที่ทำให้ budget หมดพอดีเมื่อจบรอบ SRE Workbook แนะนำให้ page เมื่อ burn rate 14.4 ในหน้าต่าง 1 ชั่วโมง (ใช้ budget 2%) โดยมีหน้าต่างสั้น 5 นาทีเป็นเงื่อนไขร่วม ได้ทั้ง detection time ที่เร็วและ precision ที่สูง","info":"ถ้า error ratio คงที่ที่ 1.44% budget 30 วัน (720 ชั่วโมง) จะหมดภายใน 720/14.4 = 50 ชั่วโมง ชุดค่าที่ SRE Workbook แนะนำต่อจากนี้คือ page เมื่อ burn rate 6 ใน 6 ชั่วโมง (ใช้ 5%) และเปิด ticket เมื่อ burn rate 1 ใน 3 วัน (ใช้ 10%) บริการที่ traffic ต่ำควรเสริม synthetic traffic เพราะ request ไม่กี่ตัวทำให้ ratio แกว่งมาก","ref":"The Site Reliability Workbook — ch.5 Alerting on SLOs"},{"id":"MON-05","competency":"monitoring","level":"advance","outline":"Architect enterprise observability platforms at scale","question":"แพลตฟอร์ม tracing รับ span จากหลายร้อย service ผ่าน OpenTelemetry Collector 6 replica หลัง load balancer แบบ round-robin ทีมเปิด `tail_sampling` เพื่อเก็บทุก trace ที่มี error และสุ่ม 5% ของที่เหลือ แต่พบว่า trace ที่มี error จำนวนมากถูกเก็บไม่ครบหรือถูกทิ้ง สถาปัตยกรรมใดแก้ได้ตรงต้นเหตุ","options":["เพิ่ม Collector ชั้นแรกที่ใช้ `loadbalancing` exporter กระจาย span ตาม trace ID ไปยังชั้นที่สองซึ่งทำ `tail_sampling`","เพิ่ม `decision_wait` ของ `tail_sampling` จาก 10 วินาทีเป็น 60 วินาที เพื่อรอ span ที่มาช้าให้ครบก่อนตัดสินใจ","ตั้ง load balancer ให้ใช้ sticky session ตาม IP ของ client เพื่อให้ span ที่มาจากแหล่งเดียวกันไปถึง Collector replica ตัวเดียวกัน","ย้าย sampling ไปไว้ใน SDK ของแต่ละ service ด้วย `TraceIdRatioBased` 5% แล้วส่ง span ที่มี error ตามไปทีหลัง"],"answer":0,"why":["ถูก: tail sampling ต้องเห็นทุก span ของ trace ใน instance เดียว `loadbalancing` exporter ใช้ trace ID เป็น routing key ทำให้ span ของ trace เดียวกันไปถึง Collector ตัวเดียวกัน","ผิด: ช่วยกรณี span มาช้า แต่ span ของ trace เดียวยังกระจายไป 6 replica แต่ละตัวเห็นข้อมูลไม่ครบและตัดสินใจคนละแบบ","ผิด: span ของ trace เดียวมาจากหลาย service หลายเครื่อง (คนละ IP) sticky ตาม IP จึงไม่ได้รวม span ของ trace เดียวกันไว้ที่เดียว","ผิด: head sampling ตัดสินใจตอนเริ่ม trace ก่อนรู้ว่าจะเกิด error trace ที่ไม่ถูกสุ่มจะไม่มี span อื่นให้ส่งตาม จึงรับประกันการเก็บ trace ที่มี error ไม่ได้"],"explanation":"tail-based sampling ตัดสินใจหลังเห็นทั้ง trace จึงต้องรวม span ของ trace เดียวกันไว้ที่ Collector ตัวเดียว รูปแบบมาตรฐานคือสองชั้น: ชั้นแรกเป็น stateless ใช้ `loadbalancing` exporter แบ่งตาม trace ID ชั้นที่สองเป็น stateful ทำ `tail_sampling`","info":"ชั้นแรกต้องรู้รายชื่อ backend ผ่าน resolver แบบ DNS หรือ k8s และการเพิ่ม/ลด replica ของชั้นที่สองทำให้ trace ในช่วงนั้นบางส่วนถูกตัดสินใจไม่ครบ จึงควร scale ช่วง traffic ต่ำ ตั้ง `num_traces` และหน่วยความจำให้พอกับ throughput × `decision_wait` และ monitor metric ของ Collector เอง เช่นจำนวน span ที่ถูก drop หรือ refused","ref":"OpenTelemetry Collector contrib — tailsamplingprocessor, loadbalancingexporter README"},{"id":"MON-06","competency":"monitoring","level":"advance","outline":"Create reliability culture and practices via training, scorecards, and blameless post-mortem rituals","question":"องค์กรมี 12 ทีมพัฒนา ผู้บริหารเริ่มใช้ scorecard จัดอันดับทีมตามจำนวน incident ต่อเดือน สามเดือนต่อมาจำนวน incident ลดลงชัดเจน แต่ลูกค้าร้องเรียนเพิ่มขึ้น และพบ incident ที่ถูกลด severity หรือไม่ถูกประกาศ ในฐานะผู้วางแนวปฏิบัติด้าน reliability ควรปรับอย่างไร","options":["เปลี่ยนตัวชี้วัดหลักของ scorecard จากจำนวน incident เป็น MTTR ของแต่ละทีม และยังจัดอันดับทีมทุกเดือนเพื่อรักษาแรงจูงใจ","วัดแนวปฏิบัติ เช่น SLO coverage, คุณภาพ alert, การปิด action item ของ post-mortem และเลิกใช้จำนวน incident ประเมินทีม","คงจำนวน incident ไว้ แต่เพิ่มบทลงโทษเมื่อตรวจพบ incident ที่ไม่ได้ประกาศ เพื่อให้ข้อมูลกลับมาครบถ้วน","ให้ทีม SRE กลางเป็นผู้ประกาศ incident และกำหนด severity แทนทุกทีม เพื่อให้ตัวเลขใน scorecard เป็นกลาง"],"answer":1,"why":["ผิด: ยังเป็นการจัดอันดับด้วย outcome metric ตัวเดียวซึ่งบิดได้เหมือนเดิม เช่นปิด incident ก่อนแก้จริงหรือแตกเหตุการณ์ให้สั้นลง","ถูก: scorecard ที่วัดแนวปฏิบัติและการเรียนรู้ส่งเสริมพฤติกรรมที่ต้องการ และการไม่ลงโทษจากจำนวน incident ทำให้คนกล้ารายงาน ซึ่งเป็นแก่นของ blameless culture","ผิด: ใช้ความกลัวแก้ปัญหาที่เกิดจากความกลัว คนจะยิ่งซ่อนข้อมูลและถกเถียงเรื่อง severity มากขึ้น","ผิด: ทีมกลางไม่เห็นเหตุการณ์ทั้งหมดและทำให้ทีมเจ้าของระบบหมดความเป็นเจ้าของ ขณะที่แรงจูงใจให้ซ่อนข้อมูลยังอยู่"],"explanation":"นี่คือ Goodhart's law: เมื่อตัวชี้วัดกลายเป็นเป้าหมาย คนจะปรับตัวเลขแทนปรับระบบ การสร้าง reliability culture ต้องทำให้การรายงานปลอดภัย (blameless) และให้ scorecard วัดสิ่งที่ทีมควบคุมได้และสะท้อนการเรียนรู้","info":"แนวทางที่ใช้กันคือ production readiness review หรือ service scorecard (มี SLO, runbook, on-call, alert ที่ลิงก์ runbook) ประกอบกับพิธีกรรมสม่ำเสมอ เช่น post-mortem review ข้ามทีม, Wheel of Misfortune (ซ้อมรับมือจาก incident จริง) และ game day งานวิจัย DORA ชี้ว่าวัฒนธรรมแบบ generative ตามแบบจำลองของ Westrum สัมพันธ์กับผลการส่งมอบซอฟต์แวร์ที่ดีกว่า","ref":"Google SRE book — ch.15 Postmortem Culture, ch.28 Accelerating SREs to On-Call; DORA — Westrum organizational culture"},{"id":"WEB-01","competency":"web","level":"intermediate","outline":"Develop complex web and mobile applications using modern frameworks, supporting advanced rendering patterns (SPA, SSR), navigation, state management, and storage.","question":"component ด้านล่างรันบน production build ของ React 18 หลัง mount ไปแล้ว 5 วินาที หน้าจอจะแสดงค่าใด และเพราะอะไร","codeLang":"tsx","code":"function Ticker() {\n  const [count, setCount] = useState(0);\n  useEffect(() => {\n    const id = setInterval(() => setCount(count + 1), 1000);\n    return () => clearInterval(id);\n  }, []);\n  return \u003cspan>{count}\u003c/span>;\n}","options":["`5` เพราะ interval เรียก `setCount` ทุกวินาทีและ React นำ state ล่าสุดมาคำนวณให้โดยอัตโนมัติ","`0` เพราะ dependency array ว่างทำให้ effect ไม่ถูกเรียกหลังจาก re
