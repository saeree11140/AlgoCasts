name: algocasts
services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: algocasts-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
